l_english:
 ####################################
 # THANH TIẾN TRÌNH - ĐẠI NAM
 ####################################
 dsk_dai_cambodia_progress_bar: "Ổn định Trấn Tây Thành"
 dsk_dai_cambodia_progress_bar_desc: "Mức độ kiểm soát của Đại Nam tại Trấn Tây Thành (Campuchia). Khởi nghĩa của người Khmer đang từng ngày gặm nhấm quyền lực triều đình."
 dsk_dai_cam_progress_bonus_tt: "Triều đình đang đàn áp thành công"
 dsk_dai_cam_progress_penalty_tt: "Khủng hoảng tại Trấn Tây Thành"
 dsk_dai_cam_khmer_unrest_tt: "Bạo loạn Khmer lan rộng"
 dsk_sia_cam_intervene_tt: "Xiêm La đang hậu thuẫn khởi nghĩa"

 ####################################
 # THANH TIẾN TRÌNH - XIÊM LA
 ####################################
 dsk_sia_cambodia_progress_bar: "Siamese Influence in Cambodia"
 dsk_sia_cambodia_progress_bar_desc: "Dai Nam controls Cambodia, but Khmer unrest creates opportunity. Support the rebels to drive the Vietnamese out."
 dsk_sia_cam_local_bonus_tt: "Actively supporting Khmer rebels"
 dsk_sia_cam_local_penalty_tt: "Intervention has stalled"
 dsk_sia_cam_khmer_sympathy_tt: "Khmer people resent Vietnamese rule"
 dsk_dai_cam_intervene_tt: "Dai Nam is cracking down"

 ####################################
 # JOURNAL ENTRIES
 ####################################
 je_dsk_dai_cambodia: "Trấn Tây Thành"
 je_dsk_dai_cambodia_reason: "Giữ vững quyền kiểm soát Chân Lạp (chư hầu hoặc sáp nhập) trước làn sóng khởi nghĩa và sự can thiệp của Xiêm La."
 je_dsk_sia_cambodia: "The Cambodian Opportunity"
 je_dsk_sia_cambodia_reason: "Dai Nam's oppressive rule in Cambodia has created an opportunity. Support the Khmer rebellion to reclaim our sphere of influence."

 ####################################
 # EVENTS - ĐẠI NAM (1-4)
 ####################################
 dsk_dai_cambodia_events.1.t: "Phong Trào Nổi Dậy Ở Trấn Tây"
 dsk_dai_cambodia_events.1.d: "Chính sách đồng hóa cưỡng bức - bắt người Khmer đổi tên Việt, mặc áo dài, theo phong tục Việt - đã kích động một cuộc nổi dậy quy mô lớn. Xiêm La đang ngấm ngầm viện trợ vũ khí cho quân khởi nghĩa."
 dsk_dai_cambodia_events.1.f: "Nếu không dẹp ngay, Trấn Tây Thành sẽ sụp đổ!"
 dsk_dai_cambodia_events.1.a: "Xuất ngân khố, điều quân đi đàn áp ngay lập tức."
 dsk_dai_cambodia_events.1.b: "Không đủ sức, tạm thời rút quân cố thủ."

 dsk_dai_cambodia_events.2.t: "Quan Trấn Tây Cầu Cứu"
 dsk_dai_cambodia_events.2.d: "Bọn quan lại cai trị Trấn Tây liên tục gửi tấu chương về kinh, xin thêm binh lính và lương thực. Nếu không tiếp viện, vùng đất này sẽ mất vào tay quân nổi dậy được Xiêm La giật dây."
 dsk_dai_cambodia_events.2.f: "Triều đình phải quyết đoán!"
 dsk_dai_cambodia_events.2.a: "Gửi đại quân tiếp viện, bất chấp tốn kém."
 dsk_dai_cambodia_events.2.b: "Bỏ mặc, tập trung nguồn lực cho nội địa."

 dsk_dai_cambodia_events.3.t: "Bình Định Trấn Tây Thành"
 dsk_dai_cambodia_events.3.d: "Triều đình Huế đã thành công trong việc dẹp yên toàn bộ các cuộc khởi nghĩa tại Trấn Tây Thành. Vùng đất Chân Lạp giờ đây hoàn toàn nằm dưới sự cai trị vững chắc của Đại Nam."
 dsk_dai_cambodia_events.3.f: "Uy danh Đại Việt lừng lẫy khắp Đông Dương!"
 dsk_dai_cambodia_events.3.a: "Củng cố chính quyền, đặt thêm đồn binh."

 dsk_dai_cambodia_events.4.t: "Thất Thủ Trấn Tây Thành"
 dsk_dai_cambodia_events.4.d: "Quân khởi nghĩa Khmer, được Xiêm La hậu thuẫn, đã đánh bại hoàn toàn lực lượng đồn trú. Trấn Tây Thành sụp đổ. Đại Nam buộc phải rút khỏi vùng đất Chân Lạp trong nhục nhã."
 dsk_dai_cambodia_events.4.f: "Đây là vết nhơ không thể rửa sạch."
 dsk_dai_cambodia_events.4.a: "Rút quân về phòng thủ biên giới."

 dsk_dai_cambodia_events.5.t: "Khmer Cầu Viện Xiêm La"
 dsk_dai_cambodia_events.5.d: "Sức ép từ các cuộc nổi dậy không ngừng tăng cao. Quân khởi nghĩa Khmer đã cử mật sứ mang vàng bạc sang Bangkok cầu cứu. Xiêm La đang cân nhắc can thiệp quân sự."
 dsk_dai_cambodia_events.5.f: "Kẻ thù cũ sắp trở lại..."
 dsk_dai_cambodia_events.5.a: "Chúng ta chỉ có thể chờ xem động tĩnh của chúng."

 ####################################
 # EVENTS LỊCH SỬ TRẤN TÂY THÀNH (20-23)
 ####################################
 dsk_dai_cambodia_events.20.t: "Đo Đạc Ruộng Đất Trấn Tây"
 dsk_dai_cambodia_events.20.d: "Khâm sai Trương Minh Giảng tâu xin đo đạc ruộng đất, lập sổ hộ tịch dân đinh và áp đặt quan chế quản lý tài chính Đại Nam lên toàn bộ các phủ huyện mới sáp nhập ở Trấn Tây Thành."
 dsk_dai_cambodia_events.20.f: "Ruộng đất rõ ràng thì quốc khố mới sung túc."
 dsk_dai_cambodia_events.20.a: "Cương quyết thi hành theo luật lệ Đại Nam!"
 dsk_dai_cambodia_events.20.b: "Nới lỏng hộ tịch, cho dân địa phương đóng thuế nhẹ hơn."

 dsk_dai_cambodia_events.21.t: "Bàn Tay Sắt Của Khâm Sai Trương Minh Giảng"
 dsk_dai_cambodia_events.21.d: "Trương Minh Giảng thi hành bàn tay sắt tại Trấn Tây, đem binh lính đi tuần tiễu đàn áp mọi mầm mống phản kháng và bắt buộc quan lại, các nhà sư Khmer phải tuân theo phong tục, y phục Đại Nam."
 dsk_dai_cambodia_events.21.f: "Dùng oai võ trị loạn hay dùng đức hóa dân?"
 dsk_dai_cambodia_events.21.a: "Ủng hộ Khâm sai, dùng vũ lực đồn trú trấn áp tuyệt đối!"
 dsk_dai_cambodia_events.21.b: "Khiển trách Khâm sai, ra lệnh hành xử ôn hòa hơn."

 dsk_dai_cambodia_events.22.t: "Việt Hóa Tên Đất Và Quý Tộc Chân Lạp"
 dsk_dai_cambodia_events.22.d: "Triều đình chuẩn y tấu sớ, đổi tên hàng loạt phủ huyện ở Chân Lạp sang chữ Hán-Việt (Nam Vang, Tầm Bôn, Ba Nam...), đồng thời đổi danh hiệu các công chúa Khmer thành 'Huyện quân' và bãi bỏ tước hiệu quốc vương cũ."
 dsk_dai_cambodia_events.22.f: "Đất này nay đã là lãnh thổ muôn đời của Nam triều."
 dsk_dai_cambodia_events.22.a: "Phế truất tước hiệu vương triều cũ, chỉ có thần dân Đại Nam!"
 dsk_dai_cambodia_events.22.b: "Giữ thể diện cho Quý tộc Khmer để họ hợp tác quản trị."

 dsk_dai_cambodia_events.23.t: "Vụ Án Huyện Quân Ngọc Biện"
 dsk_dai_cambodia_events.23.d: "Quân cơ đại thần phát hiện mật thư của công chúa Ngọc Biện cùng con gái cố vương Nặc Chăn liên lạc với phe phản loạn Nặc Đôn và Xiêm La. Việc này gây xao động mạnh trong giới tinh hoa Khmer."
 dsk_dai_cambodia_events.23.f: "Phải chăng tàn dư vương triều cũ vẫn nung nấu ý chí phản phục?"
 dsk_dai_cambodia_events.23.a: "Kết án nghiêm minh, lưu đày hoàng thất cũ về Gia Định!"
 dsk_dai_cambodia_events.23.b: "Khoan hồng ân xá để vỗ về an ủi lòng dân vùng biên."

 ####################################
 # EVENTS - XIÊM LA (6-7, 10)
 ####################################
 dsk_dai_cambodia_events.6.t: "Dai Nam Crushes the Khmer Rebellion"
 dsk_dai_cambodia_events.6.d: "Dai Nam has successfully pacified Tran Tay Thanh. Our efforts to support the Khmer uprising have failed. Cambodia remains under Vietnamese control."
 dsk_dai_cambodia_events.6.f: "A bitter setback for the Kingdom of Siam."
 dsk_dai_cambodia_events.6.a: "We must accept this defeat... for now."

 dsk_dai_cambodia_events.7.t: "Cambodia Liberated from Dai Nam!"
 dsk_dai_cambodia_events.7.d: "The Khmer rebellion, with our steadfast support, has driven the Vietnamese out of Cambodia! Tran Tay Thanh has fallen! Cambodia is free once more, and firmly within our sphere of influence."
 dsk_dai_cambodia_events.7.f: "A glorious day for the Kingdom of Siam!"
 dsk_dai_cambodia_events.7.a: "Restore the Cambodian monarchy under our protection."

 dsk_dai_cambodia_events.10.t: "Khmer Rebels Request Support"
 dsk_dai_cambodia_events.10.d: "Khmer rebel leaders have sent envoys to Bangkok, begging for weapons and gold to fight the Vietnamese occupation. Supporting them would weaken Dai Nam, but risks a direct confrontation."
 dsk_dai_cambodia_events.10.f: "An opportunity to undermine Vietnamese ambitions."
 dsk_dai_cambodia_events.10.a: "We will answer their call. Prepare for war!"
 dsk_dai_cambodia_events.10.b: "We cannot risk provoking Dai Nam."

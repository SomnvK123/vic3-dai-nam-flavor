joi_flavor_ger.20.t: "压制性前线"
joi_flavor_ger.20.d_1: "随着时间的推移，[GetStateRegion('STATE_ALSACE_LORRAINE').GetName]——这块本就理所应当属于[ROOT.GetCountry.GetAdjectiveNoFlag]民族的土地，总算被稳定在了[ROOT.GetCountry.GetName]的统治下。我们成功赢得了荣誉，以及军事前线上的有利局势。"
joi_flavor_ger.20.d_2: "我们失去了[GetStateRegion('STATE_ALSACE_LORRAINE').GetName]。这块本应属于[ROOT.GetCountry.GetAdjectiveNoFlag]民族的神圣领土，如今却落入了敌人的控制中。我们在欧洲的威望受到了打击，军事前线上也被迫落入了下风，只能屈居于他们的攻势之下。"
joi_flavor_ger.20.f: "“总体印象，与其说是充满希望，不如说是令人沮丧。洛林人，以及阿尔萨斯人，与[SCOPE.sCountry('winner_scope').GetName]的疏离感远比我想象的要深。令我困惑和痛心的是，[SCOPE.sCountry('loser_scope').GetAdjectiveNoFlag]这个名字的耀眼魅力、[SCOPE.sCountry('loser_scope').GetAdjectiveNoFlag]文化的迷人特质，以及最终根深蒂固的习惯力量，是如何也俘获了那些更高尚、更有教养的心灵的。”\n\n“好极了：孩子们要投票决定他们是否是他们母亲的孩子。可惜的是，我们必须先用棍棒管教。这些堕落的孩子必须尝尝我们的拳头。惩罚之后将是爱，这将使[GetStateRegion('STATE_ALSACE_LORRAINE').GetName]重新成为[SCOPE.sCountry('winner_scope').GetAdjectiveNoFlag]人。”"
joi_flavor_ger.20.a: "整合[GetStateRegion('STATE_ALSACE_LORRAINE').GetName]领地的进程必须火速启动。"
joi_flavor_ger.20.b: "我们应该确保实现对[GetCulture('alemannic').GetName]人的[SCOPE.sCountry('winner_scope').GetAdjectiveNoFlag]化。"
joi_flavor_ger.20.c: "[ROOT.GetCountry.GetAdjectiveNoFlag]民族的耻辱。必须有人为此负责。"
joi_flavor_ger.20.e: "只有外交努力才能拯救[ROOT.GetCountry.GetName]！"
joi_flavor_ger.21.t_1: "现代化的领军者"
joi_flavor_ger.21.t_2: "已经落伍"
joi_flavor_ger.21.d_1: "很显然，尽管[SCOPE.sCountry('loser_scope').GetName]想方设法在经济上与我们伟大的[ROOT.GetCountry.GetName]竞争，但他们已经无可挽回的输掉了这场经济竞赛。我国在欧洲的经济优势正在巩固，许多[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]和[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]的人士们都认为，我们完全有能力进一步利用这种优势，"
joi_flavor_ger.21.d_2: "尽管我们已经想尽办法的试图在经济上超越[SCOPE.sCountry('winner_scope').GetName]，但事到如今，大部分人都不得不承认[ROOT.GetCountry.GetName]在经济领域已经远远不敌[SCOPE.sCountry('winner_scope').GetAdjectiveNoFlag]的现实处境。"
joi_flavor_ger.21.f: "“[SCOPE.sCountry('loser_scope').GetName]的许多阶层似乎已经丧失了那种构成其伟大历史的理想热情。他们只顾眼前，无法为了伟大的理想而牺牲当下的享乐，对未来的责任和亟待解决的国际生活中的紧迫问题视而不见。”\n\n“我们的科学、文学以及我们过去在战争中取得的辉煌成就，让我无比自豪地意识到自己属于一个伟大的文明民族。尽管过去有过种种弱点和错误，但[SCOPE.sCountry('winner_scope').GetName]必将赢得辉煌的未来。”"
joi_flavor_ger.21.a: "最美好的商业之花只能在和平中绽放。"
joi_flavor_ger.21.b: "国家的权利只能由军人的力量来维护！"
joi_flavor_ger.21.c: "工业经济的落后是致命的！"
joi_flavor_ger.21.e: "我们应该转而追求农业供应链的稳定。"
joi_flavor_ger.22.t: "直击心脏"
joi_flavor_ger.22.d_1: "经过了一段军事占领和紧张的对抗期，我们已经成功确保了对[SCOPE.sCountry('loser_scope').GetName]一些最具军事意义和经济价值的核心领土的控制：毫无疑问，我们已经在这场对抗中取得了无可置疑的优势。"
joi_flavor_ger.22.d_2: "[SCOPE.sCountry('winner_scope').GetName]对我国领土的占领在目前看来，已经几乎不可挽回。巨大的悲伤席卷了[ROOT.GetCountry.GetAdjective]社会，并开始化作广泛的愤怒情绪，冲击被认为丧权辱国，且无所作为的[ROOT.GetCountry.GetRuler.GetFullName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]政府。"
joi_flavor_ger.22.f: "“莱茵河是一条彻头彻尾的[ROOT.GetCountry.GetAdjective]河流，是所有河流中最具[ROOT.GetCountry.GetAdjectiveNoFlag]特色的，每个人最高的爱国义务就是用武力从敌人手中夺回它——他们休想得到它，自由的莱茵河！”\n\n“哈！兄弟们，不要手软！把[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]打倒！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]只会欺骗你们！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]是杀人犯和窃贼：他向你们发誓要保卫[SCOPE.sCountry('loser_scope').GetAdjective]人民，却背信弃义！”"
joi_flavor_ger.22.a: "这是[ROOT.GetCountry.GetAdjectiveNoFlag]民族的胜利。"
joi_flavor_ger.22.b: "取得这些成就的将军们是真正的战争英雄。"
joi_flavor_ger.22.c: "[ROOT.GetCountry.GetRuler.GetFullName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须下台。"
joi_flavor_ger.22.e: "我们已经受够无能的[GetLawType('law_monarchy').GetName]了！共和国万岁！"
joi_flavor_ger.22.h: "只有彻底的革命才能挽救国家！"

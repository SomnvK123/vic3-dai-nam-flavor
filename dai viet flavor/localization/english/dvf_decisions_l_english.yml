l_english:
 # --- Decision Names ---
 dvf_diplomatic_mission: "Dispatch Diplomatic Mission"
 dvf_hire_foreign_advisors: "Hire Foreign Technical Advisors"
 dvf_open_treaty_ports: "Open Treaty Ports"
 
 # --- Decision Descriptions ---
 dvf_diplomatic_mission_desc: "Send envoys to Western capitals to establish formal relations, study their institutions, and secure recognition of our sovereignty. This will greatly accelerate the improvement of diplomatic ties."
 dvf_hire_foreign_advisors_desc: "Contract European engineers, artillerists, and naval architects to modernize our arsenals, shipyards, and infrastructure. Their expertise will rapidly accelerate our technological adoption and industrial construction."
 dvf_open_treaty_ports_desc: "Formally designate major harbors (Haiphong, Tourane, Saigon) as treaty ports open to international commerce. This integrates our economy into global markets, boosting trade revenue and customs income."
 
 # --- Modifier Names & Descriptions ---
 dvf_diplomatic_mission_modifier: "Active Diplomatic Missions"
 dvf_diplomatic_mission_modifier_desc: "Our envoys abroad are actively negotiating treaties and gathering intelligence, speeding up diplomatic rapprochement."
 
 dvf_foreign_advisors_modifier: "Foreign Technical Advisors"
 dvf_foreign_advisors_modifier_desc: "European experts oversee the construction of railways, arsenals, and modern factories, significantly boosting our innovation and industrial capacity."
 
 dvf_open_treaty_ports_modifier: "Treaty Port System Active"
 dvf_open_treaty_ports_modifier_desc: "Open ports facilitate the flow of goods and capital, increasing the efficiency of our maritime trade and export competitiveness."
 
 dvf_diplomatic_victory_vs_france: "Diplomatic Victory over France"
 dvf_diplomatic_victory_vs_france_desc: "By guaranteeing freedom of conscience, we have removed France's casus belli. The great powers view our modernization favorably."
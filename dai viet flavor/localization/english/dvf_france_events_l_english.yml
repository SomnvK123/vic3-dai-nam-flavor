l_english:
 ####################################
 # MỤC 15: ÁP LỰC TỪ PHÁP (1856-1858)
 ####################################
 
 # --- EVENT 1: CHƯỚC HÀM PHÁP NẢ PHÁO ĐÀ NẴNG 1856 ---
 dvf_france.1.t: "French Warships Bombard Tourane"
 dvf_france.1.d: "A French warship, the [Concept('frigate', 'Frigate')], has appeared off the coast of Tourane (Da Nang) and fired warning shots. Their consul demands an end to the persecution of Catholic missionaries, citing the executions of Fathers Schoeffler and Bonnard. This is a clear ultimatum: cease the persecution or face a full-scale expedition. The court is in panic. Some urge immediate reform to remove the pretext; others demand we strengthen the forts and prepare for war."
 dvf_france.1.f: "The thunder of French guns echoes across the bay. The mandarins kneel in fear, but the Emperor must decide the fate of the nation."
 dvf_france.1.a: "Urgently proclaim Freedom of Conscience! Remove their casus belli!"
 dvf_france.1.b: "Ignore the foreigners! Reinforce the forts and prepare the army for defense!"
 
 # --- EVENT 2: VIỄN CHINH ĐÔNG DƯƠNG 1858 ---
 dvf_france.2.t: "The French Expedition to Indochina"
 dvf_france.2.d: "The year is 1858. Emperor Napoleon III has ordered the invasion of Indochina. A powerful Franco-Spanish fleet under Admiral Rigault de Genouilly masses at the gates of Tourane."
 dvf_france.2.f: "[SelectLocalizationOption('A')]"
 
 # Option A text (Dynamic based on law)
 dvf_france.2.a: "We have guaranteed Freedom of Conscience! France has lost its legal pretext for invasion. The Great Powers watch with approval."
 dvf_france.2.b: "We still ban the Catholic faith! France declares war to 'protect Christians'. We stand alone against the modern might of Europe."
 
 # --- EVENT 3: KẾT THÚC XÂM LẤC (CLEANUP) ---
 dvf_france.3.t: "The French Threat Recedes"
 dvf_france.3.d: "The conflict with France has concluded. The emergency measures imposed during the invasion can now be lifted."
 
 # --- MODIFIERS ---
 dvf_france_looming_threat: "French Warships Looming"
 dvf_france_looming_threat_desc: "French warships patrol our coasts. The threat of invasion hangs heavy over the court, damaging our prestige and sowing panic among the populace."
 
 dvf_france_defense_boost: "Coastal Fortifications Reinforced"
 dvf_france_defense_boost_desc: "Resources have been poured into reinforcing the forts at Tourane and along the coast. Our troops fight with desperation to defend the homeland."
 
 dvf_french_invasion_debuff: "Under French Invasion"
 dvf_french_invasion_debuff_desc: "A Franco-Spanish expeditionary force has landed on our shores. Our traditional armies crumble before modern artillery and rifles. Morale is shattered and international prestige plummets."
 
 dvf_diplomatic_victory_vs_france: "Diplomatic Victory over France"
 dvf_diplomatic_victory_vs_france_desc: "By guaranteeing freedom of conscience, we have removed France's casus belli. The great powers view our modernization favorably, and France dares not attack without a pretext."
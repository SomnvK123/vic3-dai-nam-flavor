{FEFF}l_english:
 dvf_opium_war_events.1.t:0 "Thunder from Canton"
 dvf_opium_war_events.1.d:0 "Our envoys to Beijing have returned with shocking news: the Celestial Empire has been defeated by the Western barbarians! The Treaty of Nanking has forced the Qing Dynasty to cede Hong Kong and open five ports to foreign trade. The unthinkable has happened - the might of the Middle Kingdom has been humbled by Western firepower.\n\nAs a tributary state, our court in Hue is deeply shaken. If even the great Qing cannot withstand these foreign devils, what hope does our kingdom have? The mandarins are divided: some call for sealing our borders even tighter, while others whisper that we must study the enemy's weapons."
 dvf_opium_war_events.1.f:0 "The fall of the Qing before British guns sent shockwaves across all of East Asia. For Dai Nam, it was a moment of reckoning."
 dvf_opium_war_events.1.a:0 "Ban all Western contact! Seal the ports!"
 dvf_opium_war_events.1.b:0 "Send envoys to the West to purchase their weapons!"

 dvf_opium_war_events.2.t:0 "The Tourane Incident"
 dvf_opium_war_events.2.d:0 "A French naval squadron has appeared off the coast of Da Nang (Tourane), demanding the release of imprisoned missionaries and the right to free trade. Their warships - modern vessels with powerful cannons - dwarf our wooden junks.\n\nThe French captain has issued an ultimatum: comply within 48 hours, or face the consequences. Our admirals report that our coastal fleet is vastly outmatched. The memory of what happened to the Qing fleet looms large in every officer's mind."
 dvf_opium_war_events.2.f:0 "In 1847, French warships bombarded Da Nang harbor, sinking the entire Vietnamese fleet in a devastating display of Western naval superiority."
 dvf_opium_war_events.2.a:0 "Fight back! We will not submit to foreign bullying!"
 dvf_opium_war_events.2.b:0 "Make temporary concessions to buy time..."

 dvf_opium_war_events.3.t:0 "The Path of Self-Strengthening"
 dvf_opium_war_events.3.d:0 "Through determined effort and wise investment, our kingdom has succeeded in modernizing its military capabilities. Our soldiers now wield percussion-cap rifles, our officers are trained in Western tactics, and our arsenals produce modern weapons. Dai Nam stands ready to face any foreign aggressor with confidence.\n\nThe path was difficult, but the realm is stronger for it."
 dvf_opium_war_events.3.f:0 "Against all odds, the court has embraced modernization and built a credible defense force."
 dvf_opium_war_events.3.a:0 "Dai Nam shall endure!"

 dvf_opium_war_events.4.t:0 "The Price of Stagnation"
 dvf_opium_war_events.4.d:0 "As 1858 approaches, our military remains woefully outdated. While European powers have advanced to rifled muskets, ironclad warships, and modern artillery, our forces still rely on outdated weapons and medieval fortifications.\n\nThe court's failure to modernize has left the kingdom dangerously vulnerable. When the Western powers come - and they will come - we will be unable to mount an effective defense."
 dvf_opium_war_events.4.f:0 "History records that Dai Nam's failure to modernize before 1858 was a decisive factor in its eventual fall to French colonialism."
 dvf_opium_war_events.4.a:0 "We have failed our ancestors..."

 je_dvf_self_strengthening:0 "The Path of Self-Strengthening"
 je_dvf_self_strengthening_desc:0 "The shocking defeat of the Qing Dynasty in the Opium War has exposed the terrifying power gap between East and West. We must modernize our military before the Western powers turn their attention to our shores. Research percussion caps and line infantry tactics, and build at least 3 arms factories before 1858."
 je_dvf_self_strengthening_reason:0 "The Western threat looms over all of East Asia."


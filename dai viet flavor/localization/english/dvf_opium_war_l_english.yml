 dvf_opium_war_events.5.t:0 "Pháp Trở Lại — Cùng những Yêu Sách Mới"
 dvf_opium_war_events.5.d:0 "Mực trên bản hiệp ước nhượng bộ của chúng ta còn chưa ráo, vậy mà quân Pháp đã trở lại với những yêu cầu mới. Một tàu chiến Pháp — chiếc Catinat — đã thả neo ngoài khơi Đà Nẵng, mang theo quốc thư từ chính Hoàng đế Napoleon III. Những yêu sách đưa ra rất rõ ràng: mở các bến cảng cho thương gia Pháp, trao quyền thương mại tại ba thành phố cảng và cho phép công dân Pháp tự do cư trú tại Đại Nam.\n\nCác quan lại vô cùng phẫn nộ. 'Chúng ta đã cho chúng những gì chúng muốn,' một vị tướng nổi giận, 'vậy mà nay chúng lại đòi hỏi thêm sao?' Vị cố vấn triều đình cảnh báo một cách cay đắng: 'Đó là cách phương Tây hoạt động — mỗi sự nhượng bộ chỉ mời gọi thêm một yêu cầu khác. Chúng sẽ không dừng lại cho đến khi có được tất cả.'"
 dvf_opium_war_events.5.f:0 "Vào năm 1856, tàu chiến Catinat của Pháp đã đến Đà Nẵng cùng những yêu sách mới. Khi bị từ chối, nó đã nã pháo vào các hệ thống phòng thủ ven biển — một dấu hiệu báo trước cho những gì sẽ xảy ra vào năm 1858."
 dvf_opium_war_events.5.a:0 "Đủ rồi! Chúng ta sẽ không nhượng bộ thêm một tấc đất nào cho bọn man di này!"
 dvf_opium_war_events.5.b:0 "Cấp quyền thương mại... tạm thời. Chúng ta sẽ câu thêm thời gian."

 dvf_opium_war_events.6.t:0 "Bản Điều Trần của Nguyễn Trường Tộ"
 dvf_opium_war_events.6.d:0 "Một học giả Công giáo tên là Nguyễn Trường Tộ, người đã đi khắp châu Âu và tận mắt nghiên cứu nền văn minh phương Tây, đã gửi một bản điều trần táo bạo lên triều đình. Đề xuất của ông rất bao quát: thiết lập quan hệ ngoại giao với các cường quốc phương Tây để học hỏi họ, cử học giả đi nghiên cứu khoa học kỹ thuật, cải cách quân đội với vũ khí và chiến thuật hiện đại, đại tu giáo dục để đưa vào các ngành khoa học thực tiễn, và phát triển thương mại, công nghiệp.\n\n'Nếu chúng ta không thay đổi,' ông cảnh báo, 'phương Tây sẽ dùng vũ lực để thay đổi chúng ta. Nhật Bản cũng đối mặt với mối đe dọa tương tự — nhưng họ đang chọn cách tự lột xác. Chúng ta cũng có thể làm như vậy.'\n\nTuy nhiên, các quan lại bảo thủ lại vô cùng tức giận. 'Kẻ này là người Công giáo — mang trái tim của người phương Tây,' họ thì thầm. 'Những đề xuất của hắn sẽ phá hủy trật tự Nho giáo của chúng ta.' Câu hỏi đặt ra cho triều đình lúc này vô cùng khốc liệt: đón nhận sự thay đổi đau đớn, hay cố giữ lấy quá khứ êm đềm?"
 dvf_opium_war_events.6.f:0 "Từ năm 1863 đến 1871, Nguyễn Trường Tộ đã đệ trình gần 30 bản điều trần cải cách lên Vua Tự Đức. Tất cả đều bị từ chối. Ông qua đời năm 1871, để lại niềm tiếc nuối: 'Thời gian thì ngắn, mà sự chần chừ thì quá dài.'"
 dvf_opium_war_events.6.a:0 "Những đề xuất của ông ấy có giá trị. Chúng ta phải thích nghi hoặc sẽ diệt vong — chấp thuận cải cách."
 dvf_opium_war_events.6.b:0 "Những lề thói cũ đã phục vụ chúng ta rất tốt. Kẻ kích động Công giáo này không hiểu gì về nền văn minh của chúng ta."

 # Tech Investment Events
 dvf_opium_war_events.7.t:0 "Kế Hoạch Đúc Súng Pháo & Hạt Nổ"
 dvf_opium_war_events.7.d:0 "Các quan xưởng đúc súng báo cáo rằng công nghệ súng kíp đá lửa cổ truyền của Đại Nam đã quá lạc hậu so với súng nạp hạt nổ (Percussion Cap) của phương Tây. Một số thương nhân bí mật từ Hương Cảng và Singapore chào bán bản vẽ kỹ thuật và mẫu súng pháo hiện đại với giá cao.\n\nNếu triều đình xuất quốc khố mua về, các kỹ sư vũ khí của chúng ta có thể nhanh chóng nắm bắt và tự sản xuất hàng loạt súng hạt nổ cho quân đội."
 dvf_opium_war_events.7.f:0 "Chạy đua vũ trang với phương Tây đòi hỏi nguồn tài chính khổng lồ, nhưng đây là cái giá phải trả để bảo tồn vương triều."
 dvf_opium_war_events.7.a:0 "Chi ngân khố mua toàn bộ bản vẽ và mẫu máy móc đúc súng!"
 dvf_opium_war_events.7.b:0 "Mua bản vẽ sơ lược để thợ trong nước tự nghiên cứu thử nghiệm."
 dvf_opium_war_events.7.c:0 "Ngân khố có hạn, để thợ tự chế tạo theo cách cũ."

 dvf_opium_war_events.8.t:0 "Xưởng Thủy Cơ Huế & Dự Án Tàu Hơi Nước"
 dvf_opium_war_events.8.d:0 "Nối tiếp di sản của Tiên đế Minh Mạng từng chế tạo thành công tàu hơi nước năm 1839, các thợ đóng thuyền tại Xưởng Thủy Cơ kinh thành Huế thỉnh cầu triều đình chi ngân sách nhập khẩu động cơ hơi nước và bản vẽ tàu hơi nước guồng (Paddle Steamer) từ nước ngoài.\n\nNếu có được kỹ thuật này, Đại Nam sẽ sớm làm chủ việc đóng tàu tuần duyên bọc đồng chạy bằng hơi nước, chấm dứt thế yếu tuyệt đối trên mặt biển trước các hạm đội Tây dương."
 dvf_opium_war_events.8.f:0 "Đóng tàu hơi nước là biểu tượng cho bước chuyển mình vĩ đại từ hạm đội thuyền chèo cổ truyền sang hải quân cơ động thời đại công nghiệp."
 dvf_opium_war_events.8.a:0 "Dốc ngân khố nhập khẩu động cơ hơi nước và bản vẽ đóng tàu!"
 dvf_opium_war_events.8.b:0 "Chỉ cử thợ sang các xưởng đóng tàu ngoại quốc học việc ngắn hạn."
 dvf_opium_war_events.8.c:0 "Thuyền buồm truyền thống vẫn là nền tảng, không cần lãng phí."

 # Decisions
 dvf_expand_military_industry:0 "Đẩy mạnh Công nghiệp Quốc phòng"
 dvf_expand_military_industry_desc:0 "Trưng dụng ngân khố và huy động thợ thủ công toàn quốc để đẩy nhanh tốc độ xây dựng các xưởng đúc súng, đúc pháo và xưởng đóng tàu chiến hiện đại."
 dvf_expand_military_industry_tooltip:0 "Tăng tốc độ xây dựng và hiệu suất của Xưởng Vũ Khí và Xưởng Đóng Tàu trong 5 năm."
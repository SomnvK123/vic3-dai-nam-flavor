l_english:
 dvf_opium_war_events.1.t:0 "Tiếng sấm từ Quảng Châu"
 dvf_opium_war_events.1.d:0 "Sứ bộ của chúng ta đến Bắc Kinh đã trở về với tin tức chấn động: Thiên triều đã bị đánh bại bởi những kẻ man di phương Tây! Hiệp ước Nam Kinh đã buộc nhà Thanh phải cắt nhượng Hương Cảng và mở cửa năm bến cảng cho ngoại thương. Điều không tưởng đã xảy ra - sức mạnh của Trung Hoa vĩ đại đã phải cúi đầu trước hỏa lực phương Tây.\n\nLà một nước chư hầu, triều đình tại kinh thành Huế vô cùng rúng động. Nếu ngay cả Đại Thanh vĩ đại cũng không thể chống lại những con quỷ ngoại quốc này, thì vương quốc của chúng ta còn hy vọng gì? Các quan lại đang chia rẽ: một số kêu gọi đóng cửa biên giới chặt chẽ hơn nữa, trong khi những người khác thì thầm rằng chúng ta phải học hỏi vũ khí của kẻ thù."
 dvf_opium_war_events.1.f:0 "Sự sụp đổ của nhà Thanh trước họng pháo của Anh đã gây ra những cú sốc lan tỏa khắp Đông Á. Đối với Đại Nam, đó là một khoảnh khắc của sự suy ngẫm."
 dvf_opium_war_events.1.a:0 "Cấm mọi liên hệ với phương Tây! Đóng cửa các bến cảng!"
 dvf_opium_war_events.1.b:0 "Cử sứ thần sang phương Tây để mua vũ khí của họ!"

 dvf_opium_war_events.2.t:0 "Sự cố Đà Nẵng"
 dvf_opium_war_events.2.d:0 "Một hạm đội hải quân Pháp đã xuất hiện ngoài khơi Đà Nẵng, yêu cầu thả các nhà truyền giáo bị giam giữ và đòi quyền tự do thương mại. Tàu chiến của họ - những con tàu hiện đại với pháo uy lực - làm lu mờ những chiếc thuyền gỗ của chúng ta.\n\nThuyền trưởng Pháp đã đưa ra tối hậu thư: tuân thủ trong vòng 48 giờ, nếu không sẽ phải gánh chịu hậu quả. Các đô đốc của chúng ta báo cáo rằng hạm đội ven biển của chúng ta thua kém hoàn toàn. Ký ức về những gì đã xảy ra với hạm đội nhà Thanh đang hiện rõ trong tâm trí của mọi sĩ quan."
 dvf_opium_war_events.2.f:0 "Vào năm 1847, các tàu chiến Pháp đã nã pháo vào cảng Đà Nẵng, đánh chìm toàn bộ hạm đội Việt Nam trong một màn phô trương tàn khốc về sự vượt trội của hải quân phương Tây."
 dvf_opium_war_events.2.a:0 "Chiến đấu trả đũa! Chúng ta sẽ không khuất phục trước sự bắt nạt của ngoại bang!"
 dvf_opium_war_events.2.b:0 "Chấp nhận nhượng bộ tạm thời để câu giờ..."

 dvf_opium_war_events.3.t:0 "Đầu Tư Quân Sự Hoàn Tất"
 dvf_opium_war_events.3.d:0 "Thông qua nỗ lực quyết tâm và đầu tư khôn ngoan, vương quốc của chúng ta đã thành công trong việc hiện đại hóa toàn diện năng lực quân sự và hải quân. Binh lính của chúng ta giờ đây được trang bị súng trường nạp bằng hạt nổ, các sĩ quan được huấn luyện chiến thuật bộ binh tuyến, các hạm đội tàu hơi nước guồng đã hạ thủy, và các xưởng vũ khí cùng xưởng đóng tàu đang hoạt động hết công suất. Đại Nam đã sẵn sàng nghênh chiến bất kỳ kẻ xâm lược phương Tây nào!\n\nCon đường dù gian nan và tiêu tốn hàng vạn lượng bạc, nhưng đất nước đã trở nên vững mạnh hơn bao giờ hết."
 dvf_opium_war_events.3.f:0 "Bất chấp mọi trở ngại và sự cản trở của phái thủ cựu, triều đình đã dồn toàn lực đầu tư vào công nghiệp quốc phòng và xây dựng một lực lượng phòng thủ hiện đại."
 dvf_opium_war_events.3.a:0 "Đại Nam sẽ trường tồn và tự cường!"

 dvf_opium_war_events.4.t:0 "Cái giá của sự Trì trệ"
 dvf_opium_war_events.4.d:0 "Khi năm 1858 đến gần, quân đội và hải quân của chúng ta vẫn trong tình trạng lạc hậu tồi tệ. Trong khi các cường quốc châu Âu đã tiến lên súng trường có rãnh xoắn, tàu chiến bọc thép hơi nước và pháo binh hiện đại, lực lượng của chúng ta vẫn dựa vào những loại súng kíp lỗi thời, thuyền gỗ thô sơ và thành lũy từ thời trung cổ.\n\nSự thất bại của triều đình trong việc đầu tư công nghiệp quốc phòng đã để lại cho vương quốc một lỗ hổng nguy hiểm chết người. Khi các cường quốc phương Tây đến - và họ chắc chắn sẽ đến - chúng ta sẽ không thể có một hệ thống phòng thủ hiệu quả."
 dvf_opium_war_events.4.f:0 "Lịch sử ghi chép rằng sự thất bại của Đại Nam trong việc hiện đại hóa trước năm 1858 là yếu tố quyết định dẫn đến việc đất nước rơi vào tay thực dân Pháp."
 dvf_opium_war_events.4.a:0 "Chúng ta đã có lỗi với tổ tiên..."

 je_dvf_self_strengthening:0 "Đầu Tư Quân Sự"
 je_dvf_self_strengthening_desc:0 "Sự thất bại chấn động của triều đại nhà Thanh trong Chiến tranh Nha phiến đã phơi bày khoảng cách sức mạnh đáng sợ giữa Đông và Tây. Chúng ta phải dồn ngân khố quốc gia để hiện đại hóa cả Lục quân lẫn Hải quân trước khi phương Tây tiến hành xâm lược vào năm 1858.\n\n#header Yêu cầu để Thành công:#!\n$BULLET_WITH_TAB$Nghiên cứu xong #variable $percussion_cap$#! (Hạt nổ)\n$BULLET_WITH_TAB$Nghiên cứu xong #variable $line_infantry$#! (Bộ binh chiến tuyến)\n$BULLET_WITH_TAB$Nghiên cứu xong #variable $paddle_steamer$#! (Tàu hơi nước guồng)\n$BULLET_WITH_TAB$Vận hành ít nhất #variable 5#! Xưởng Vũ Khí ($building_arms_industry$)\n$BULLET_WITH_TAB$Vận hành ít nhất #variable 2#! Xưởng Đóng Tàu ($building_shipyards$)"
 je_dvf_self_strengthening_reason:0 "Mối đe dọa từ hỏa lực phương Tây đang đè nặng lên vận mệnh Đại Nam."
 je_dvf_self_strengthening_progress:0 "Tiến độ Xưởng Vũ Khí & Xưởng Tàu"


 # Decision: Summon Royal Princes
 dvf_summon_royal_princes: "Summon Royal Princes"
 dvf_summon_royal_princes_desc: "The imperial court is in need of capable leaders. Summon the esteemed princes of the Nguyễn Dynasty — renowned poets, scholars, and statesmen — to serve the realm."
 dvf_summon_royal_princes_tooltip: "Summons Tùng Thiện Vương, Tuy Lý Vương, and Thọ Xuân Vương as politicians."

 # Decision: Đại Khai Hoang Đồng Bằng Sông Cửu Long (Mục 8.1)
 dvf_reclaim_mekong_delta: "The Great Mekong Reclamation"
 dvf_reclaim_mekong_delta_desc: "The Mekong Delta holds immense untapped potential — millions of hectares of fertile alluvial land, crisscrossed by rivers and canals stretching to the Gulf of Thailand. The canals of Vĩnh Tế and Thoại Hà proved what is possible, but much more remains.\n\nBy directing the energies of the new reformist court toward mass land reclamation — building irrigation networks, establishing military farming colonies (đồn điền), and deploying steam-powered water pumps — we can transform the entire southern delta into the breadbasket of Southeast Asia."
 dvf_reclaim_mekong_delta_tooltip: "Costs 30,000 treasury and 100 Authority. Grants the 'Great Southern Irrigation Works' modifier to the Mekong State for 10 years (+25% Agriculture Throughput, +20% Construction Speed) and adds +15 Arable Land."


 # Event: The Succession of Thieu Tri
 dvf_succession.1.t: "The Succession of Thiệu Trị"
 dvf_succession.1.d: "With the ascension of Emperor Thiệu Trị, the question of his succession has already begun to plague the court. His eldest son, Hồng Bảo, is ambitious but widely considered unsuited for the throne — poorly educated and prone to excess. Instead, the scholarly and filial second son, Hồng Nhậm, has been designated as the heir apparent.\n\nThis decision has deeply angered Hồng Bảo, who now plots his revenge from the shadows. Whispers of conspiracy have already begun to circulate in the Forbidden Purple City."
 dvf_succession.1.f: "A storm brews within the Forbidden Purple City."
 dvf_succession.1.a: "The realm needs a learned emperor."
 dvf_succession.1.b: "Hồng Bảo's ambition worries me."

 # Hong Bao Coup Events
 dvf_hong_bao.1.t: "Whispers in the Forbidden City"
 dvf_hong_bao.1.d: "Spies report that Prince Hồng Bảo is secretly meeting with dissident military officers and disgruntled intellectuals. He is gathering forces to reclaim his birthright by force."
 dvf_hong_bao.1.f: "He refuses to accept his fate."
 dvf_hong_bao.1.a: "Arrest him immediately. Treason cannot be tolerated."
 dvf_hong_bao.1.b: "Monitor his movements. We must know who his allies are."

 dvf_hong_bao.2.t: "The Prince's Ambition"
 dvf_hong_bao.2.d: "Reports indicate that Hồng Bảo's supporters are smuggling weapons and bribing imperial guards in preparation for an uprising."
 dvf_hong_bao.2.f: "The conspiracy grows."
 dvf_hong_bao.2.a: "Confiscate the weapons and disband his guards."
 dvf_hong_bao.2.b: "We cannot risk a confrontation yet."

 dvf_hong_bao.3.t: "The Reformist Faction"
 dvf_hong_bao.3.d: "Many reform-minded officials and military commanders who feel sidelined by the conservative court have begun to quietly rally behind Hồng Bảo, hoping his desperate bid for power will force a change in national policy."
 dvf_hong_bao.3.f: "An alliance of convenience."
 dvf_hong_bao.3.a: "Reassign the disloyal officers. Break their network."
 dvf_hong_bao.3.b: "Do nothing. We cannot afford to anger the military."

 dvf_hong_bao.4.t: "The Prince Returns"
 dvf_hong_bao.4.d: "A violent coup has erupted in the capital! Supported by rebel troops and ambitious reformists, Hồng Bảo has stormed the palace and deposed Tự Đức. The conservative establishment is outraged by this usurpation, but Hồng Bảo now sits upon the throne.\n\nTo secure his fragile rule against conservative backlash, he has no choice but to elevate the military and reformist factions that brought him to power."
 dvf_hong_bao.4.f: "The rightful heir reclaims his throne by force."
 dvf_hong_bao.4.a: "A new era begins for Đại Nam."

 # Event 5: The Plot is Discovered (Âm Mưu Bại Lộ)
 dvf_hong_bao.5.t: "The Plot is Discovered!"
 dvf_hong_bao.5.d: "The conspiracy has been exposed. Hồng Bảo's network of supporters has been dismantled and the prince himself has been captured and stripped of his royal title. Renamed 'Đinh Bảo' to erase all ties to the imperial family, he will spend his remaining days in confinement — a broken man who reached for the throne and grasped only shadow.\n\nWith the threat eliminated, the conservative court of Trương Đăng Quế tightens its grip. The reformists are silenced. The doors of change, so nearly open, are slammed shut."
 dvf_hong_bao.5.f: "History takes its familiar, bitter course."
 dvf_hong_bao.5.a: "The realm is secure. But for how long?"

 # Post-Coup Stabilization Events (§3.3 — Ổn Định Hậu Đảo Chính)

 # Event 10: What to do with Tự Đức? (Xử Trí Tự Đức)
 dvf_hong_bao.10.t: "The Fate of the Deposed Emperor"
 dvf_hong_bao.10.d: "Tự Đức sits in chains within the palace he once ruled. His fate must be decided swiftly — the court watches, the people watch, and the foreign powers watch.\n\nHow Emperor Hồng Bảo chooses to treat his deposed brother will define the character of the new reign in the eyes of the world. Mercy may win legitimacy; severity may invite outrage."
 dvf_hong_bao.10.f: "A throne built on blood must be careful how much more it spills."
 dvf_hong_bao.10.a: "Exile him honorably to the royal tombs. Let him live out his days in comfort."
 dvf_hong_bao.10.b: "Imprison him in the Citadel under permanent guard. He must never be free."
 dvf_hong_bao.10.c: "Execute him. A deposed emperor is a rallying point for rebellion."

 # Event 11: Purging the Conservative Court (Thanh Trừng Phe Trương Đăng Quế)
 dvf_hong_bao.11.t: "Purging the Conservative Court"
 dvf_hong_bao.11.d: "Grand Mandarin Trương Đăng Quế and his faction of Confucian hardliners were the architects of Hồng Bảo's humiliation — the men who conspired to place Tự Đức on the throne and lock the realm in an iron tradition.\n\nNow the tables are turned. The new Emperor must decide how thoroughly to dismantle their power. A clean sweep guarantees control but risks chaos; a measured purge preserves order but leaves embers of opposition smoldering."
 dvf_hong_bao.11.f: "Old wood must be cleared before new growth can take root."
 dvf_hong_bao.11.a: "Dismiss all members of the Cơ Mật Viện. Strip them of rank and send them home."
 dvf_hong_bao.11.b: "Remove only the ringleaders. Retain those who will serve the new order."

 # Event 12: Rewarding the Reformist Ministers (Phong Thưởng Công Thần Canh Tân)
 dvf_hong_bao.12.t: "Rewarding the Architects of the New Age"
 dvf_hong_bao.12.d: "Without the reformists, the coup would have been impossible. Nguyễn Trường Tộ provided the intellectual vision, Đặng Huy Trứ provided the means, and the progressive military officers provided the muscle.\n\nEmperor Hồng Bảo summons them before his court. There is no debate about their loyalty. The question is how best to deploy their talents in the great work of modernization that now lies ahead.\n\nNguyễn Trường Tộ is appointed Chief Advisor for Reform. Đặng Huy Trứ is appointed Director of the Bureau of Mechanics and Armaments."
 dvf_hong_bao.12.f: "A new court, a new age — the era of Đại Nam's self-strengthening begins."
 dvf_hong_bao.12.a: "Let the work of renewal begin. Đại Nam will not fall as others have fallen."

 # Journal Entries
 je_dvf_hong_bao_coup: "The An Phong Conspiracy"
 je_dvf_hong_bao_coup_desc: "Prince Hồng Bảo (An Phong Công), the bypassed eldest son of Thiệu Trị, is actively plotting to overthrow his brother Tự Đức with the help of dissatisfied military officers and reformists."
 je_dvf_hong_bao_coup_reason: "If we do not suppress his conspiracy, he will launch a bloody coup to seize the throne."
 je_dvf_hong_bao_coup_progress_desc: "Coup Progress"

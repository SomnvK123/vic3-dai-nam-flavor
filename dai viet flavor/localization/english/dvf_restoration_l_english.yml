l_english:
 ####################################
 # dvf_hong_bao_restoration.1 — Đại Nam Duy Tân (Thành Công JE)
 ####################################
 dvf_hong_bao_restoration.1.t: "The Great Modernisation — A Nation Reborn"
 dvf_hong_bao_restoration.1.d: "The six pillars of Đại Nam's self-strengthening have been completed. A nation that stood on the precipice of colonial subjugation has remade itself through the combined vision of Emperor Hồng Bảo, the intellect of Nguyễn Trường Tộ, the mechanical genius of Đặng Huy Trứ, and the iron discipline of the reformed army.\n\nThe smoke of a hundred new foundries mingles with the incense from the altars of the ancestors. The steam-whistle of a Vietnamese-built warship sounds across the harbour of Đà Nẵng. The examiners no longer grade on eight-legged essays alone — they test candidates in mathematics, engineering, and international law.\n\nThe colonial era that swallowed China and a dozen other civilisations has encountered something unexpected in Đại Nam: a dynasty that chose to transform rather than perish."
 dvf_hong_bao_restoration.1.f: "History pivots on the courage of men who dare to act."
 dvf_hong_bao_restoration.1.a: "The era of the Great Modernisation has begun. Đại Nam will not fall as others have fallen."

 ####################################
 # dvf_hong_bao_restoration.2 — Giấc Mộng Duy Tân Tan Vỡ (Thất Bại JE)
 ####################################
 dvf_hong_bao_restoration.2.t: "The Dream of Modernisation — Extinguished"
 dvf_hong_bao_restoration.2.d: "The great experiment has failed. Whether undone by the fierce resistance of the Confucian establishment, the loss of core territories to foreign powers, or the death of Emperor Hồng Bảo himself, the reformist momentum has collapsed.\n\nThe intelligentsia scatter — some flee to Hong Kong, some are imprisoned, some are executed as 'Western sympathisers'. The military modernisation programme is suspended. The tooling workshops fall silent. The unfinished railroads rust in the mountain passes.\n\nThe Confucian mandarins return to power, reasserting the old order with a viciousness born of three decades of fear. Đại Nam has missed its window. The French cannon-smoke gathering on the horizon will not wait."
 dvf_hong_bao_restoration.2.f: "A dynasty that could not reform itself will be reformed — by bayonets."
 dvf_hong_bao_restoration.2.a: "We have failed our ancestors and our descendants alike."

 ####################################
 # dvf_hong_bao_restoration_chars.1 — Nguyễn Trường Tộ Tế Cấp Bát Điều
 ####################################
 dvf_hong_bao_restoration_chars.1.t: "Nguyễn Trường Tộ — The Eight-Point Memorandum"
 dvf_hong_bao_restoration_chars.1.d: "Scholar Nguyễn Trường Tộ, the court's foremost Catholic reformer and translator of Western technical texts, submits his celebrated 'Tế Cấp Bát Điều' — the Eight Points for Urgent Reform.\n\nIn it, he argues with methodical clarity: Đại Nam must replace the eight-legged examination with practical sciences; must abolish the Catholic bans that invite French intervention; must build railways to move coal and troops; must modernise the legal code; and must open commercial ports to generate the tax revenue that funds all else.\n\n'The patient who refuses the doctor's medicine on grounds that it is foreign,' he writes, 'dies not of the disease but of his own pride.'"
 dvf_hong_bao_restoration_chars.1.f: "Forty-three reform memoranda. Forty-three times ignored by Tự Đức. Under Hồng Bảo, perhaps the forty-fourth will change the realm."
 dvf_hong_bao_restoration_chars.1.a: "Issue an imperial edict endorsing the Eight-Point Programme."

 ####################################
 # dvf_hong_bao_restoration_chars.2 — Đặng Huy Trứ Mở Cục Cơ Khí
 ####################################
 dvf_hong_bao_restoration_chars.2.t: "Đặng Huy Trứ — The Bureau of Mechanics and Trade"
 dvf_hong_bao_restoration_chars.2.d: "Returning from his commercial missions to Hong Kong and Guangdong — where he negotiated the purchase of 239 modern field guns and assembled a network of British engineers willing to advise on shipbuilding — Đặng Huy Trứ presents his proposal for the 'Cục Cơ Khí': a state bureau combining machine workshops, a commercial trading office, and a translation unit for Western technical manuals.\n\nHe has already arranged the purchase of lathes, drilling presses, and steam-driven bellows. He asks only for an imperial warrant, a building in the old Arsenal district, and the authority to hire without interference from the Board of Rites."
 dvf_hong_bao_restoration_chars.2.f: "'We must learn to make the machine before we can claim to be its master,' — Đặng Huy Trứ, letter to the Bureau of Revenue, 1867."
 dvf_hong_bao_restoration_chars.2.a: "Grant the warrant. Let the workshops open immediately."

 ####################################
 # dvf_hong_bao_restoration_chars.3 — Nguyễn Tri Phương Biên Cương
 ####################################
 dvf_hong_bao_restoration_chars.3.t: "Nguyễn Tri Phương — The Iron Wall of the Frontier"
 dvf_hong_bao_restoration_chars.3.d: "General Nguyễn Tri Phương, veteran of the southern border campaigns and architect of the great đồn điền (military farming colony) system of the Mekong, submits a security assessment to the throne.\n\nHis warning is blunt: the northern and central frontiers are defended by part-time peasant levies armed with flintlock muskets. Against French breech-loading artillery and Prussian-drilled infantry, these men will dissolve in minutes. He requests authority to reorganise the northern army corps, implement week-long drilling rotations, and prioritise fortification of the mountain passes linking Tonkin to Annam.\n\n'Give me three years,' he writes, 'and I will give you a northern army that French generals will hesitate to fight.'"
 dvf_hong_bao_restoration_chars.3.f: "He held Đà Nẵng for three weeks against the French fleet in 1858. With proper weapons and trained men, he might hold it for three years."
 dvf_hong_bao_restoration_chars.3.a: "Appoint General Nguyễn Tri Phương as Commander of the Northern Military Circuit."

 ####################################
 # dvf_hong_bao_restoration_chars.4 — Phạm Phú Thứ Đi Sứ
 ####################################
 dvf_hong_bao_restoration_chars.4.t: "Phạm Phú Thứ — Mission to the West"
 dvf_hong_bao_restoration_chars.4.d: "Scholar-official Phạm Phú Thứ, renowned for his command of French and his sharp eye for institutional detail, is dispatched as deputy head of a formal embassy. His mission: to observe the parliaments, factories, naval academies, and law courts of France, Spain, and Britain — and to return with a blueprint for adapting their strongest features to Vietnamese conditions.\n\nHis diary of the journey, 'Tây Hành Nhật Ký' (Journal of the Western Voyage), will later circulate among the reform mandarins as an essential text — concrete, analytical, free of either blind admiration or knee-jerk rejection of Western civilisation."
 dvf_hong_bao_restoration_chars.4.f: "'They are not stronger because they are Westerners. They are stronger because they built institutions that reward competence and punish idleness. We can build those too.' — Phạm Phú Thứ."
 dvf_hong_bao_restoration_chars.4.a: "Dispatch the embassy. The realm's future depends on what they learn."

 ####################################
 # je_dvf_hong_bao_restoration — Journal Entry strings
 ####################################
 je_dvf_hong_bao_restoration: "The Great Modernisation of Đại Nam"
 je_dvf_hong_bao_restoration_desc: "Emperor Hồng Bảo has seized the throne. Now the harder work begins: transforming a Confucian agrarian kingdom into a modern industrial state before the French fleet arrives. Six pillars must be built — political reform, education, agriculture, industry, military, and diplomacy."
 je_dvf_hong_bao_restoration_reason: "Đại Nam must complete all six pillars of the Self-Strengthening programme or face colonial subjugation."
 je_dvf_hong_bao_restoration_progress_desc: "Modernisation Progress"

 ####################################
 # dvf_hong_bao_restoration_chars.5 — Tang Lễ Nguyễn Trường Tộ (FIX D)
 ####################################
 dvf_hong_bao_restoration_chars.5.t: "The Passing of Nguyễn Trường Tộ — The Voice of Reform Falls Silent"
 dvf_hong_bao_restoration_chars.5.d: "Nguyễn Trường Tộ, the Catholic scholar who penned forty-three reform memoranda and served as the intellectual compass of Emperor Hồng Bảo's court, has died.\n\nHe was forty-one years old. In another life — the one he once actually lived, under the deaf ears of Tự Đức — his memoranda went unread. Here, they became the blueprint of a nation.\n\nThe court observes three months of mourning. His writings will be collected into an imperial edition and distributed to every provincial school. The reform movement he helped build is strong enough now to outlive its founder."
 dvf_hong_bao_restoration_chars.5.f: "'Do not mourn the candle that has burned out. Ask only whether it lit enough torches before it did.' — attributed to Nguyễn Trường Tộ."
 dvf_hong_bao_restoration_chars.5.a: "Issue an imperial edict commemorating his service. His legacy will endure."

 ####################################
 # Modifier: dvf_nguyen_truong_to_mourning (tang chế — dùng trong chars.5)
 ####################################
 dvf_nguyen_truong_to_mourning: "National Mourning — Nguyễn Trường Tộ"
 dvf_nguyen_truong_to_mourning_desc: "The court is in mourning for the passing of the great reformer. His loss is felt throughout the intelligentsia, but his legacy lives on in every school, workshop, and railway we have built."

l_english:
 ####################################
 # MỤC 17: FLAVOR EVENTS - CANH TÂN ĐẤT NƯỚC
 ####################################
 
 # --- EVENT 1: BÁC VẬT TÂN BIÊN ---
 dvf_flavor.1.t: "Bác Vật Tân Biên — Translation Bureau Established"
 dvf_flavor.1.d: "Following the Emperor's decree to 'Learn from the West to master the West', a Translation Bureau (Bác Vật Tân Biên) is established in the capital. Scholars fluent in French, Latin, and Classical Chinese work feverishly to translate Western scientific, military, and legal texts into Vietnamese (Chữ Quốc Ngữ and Hán-Nôm). This influx of knowledge accelerates our technological adoption."
 dvf_flavor.1.f: "The scribes' brushes fly across the paper. 'Steam engine', 'Electricity', 'Constitution' — new words for a new era."
 dvf_flavor.1.a: "Fund the Bureau generously. Knowledge is power."
 
 # --- EVENT 2: DU HỌC SINH XUẤT DƯƠNG ---
 dvf_flavor.2.t: "Students Sent Abroad — The First Cohort"
 dvf_flavor.2.d: "With the Public Education Law enacted and universities expanding, the court selects the brightest young mandarins and scholars to study in France, Britain, and America. They will return as engineers, doctors, lawyers, and diplomats — the backbone of a modern bureaucracy."
 dvf_flavor.2.f: "Young men in traditional robes board steamships, carrying the hopes of a nation. They will return in Western suits, bearing blueprints for the future."
 dvf_flavor.2.a: "Dispatch the first cohort immediately."
 
 # --- EVENT 3: THÀNH LẬP TỶ BÌNH CHUẨN ---
 dvf_flavor.3.t: "Establishment of the Ty Binh Chuan (Rice Inspection Bureau)"
 dvf_flavor.3.d: "As rice production in the Mekong Delta surges and trade ports open, quality control becomes paramount for export reputation. The Ty Binh Chuan is founded to standardize weights, inspect grain quality, and regulate the rice trade, ensuring 'Dai Nam Rice' becomes a premium brand in Singapore, Hong Kong, and Batavia."
 dvf_flavor.3.f: "Merchants grumble at the strict inspections, but the silver flowing into the treasury proves the Bureau's worth."
 dvf_flavor.3.a: "Enforce the standards. Our reputation is worth more than short-term profit."
 
 # --- EVENT 4: KHAI MỎ THAN ĐÔNG TRIỀU ---
 dvf_flavor.4.t: "Opening the Dong Trieu Coal Mines (Mao Khe)"
 dvf_flavor.4.d: "The coal seams of Dong Trieu (Quang Ninh) have been known for centuries, but only now, with modern pumping technology and railway access, can they be exploited at industrial scale. The Mao Khe mine becomes the energy heart of the Northern industrial zone, fueling the shipyards, arsenals, and the first railways."
 dvf_flavor.4.f: "Black gold flows from the earth. The smoke of a thousand furnaces signals the birth of heavy industry."
 dvf_flavor.4.a: "Invest heavily in mining infrastructure."
 
 # --- EVENT 5: CỤC CƠ KHÍ ĐẶNG HUY TRỨ ---
 dvf_flavor.5.t: "The Cuc Co Khi (Mechanical Bureau) — Dang Huu Tru's Legacy"
 dvf_flavor.5.d: "Scholar-official Dang Huu Tru, a pioneer of Western mechanics, establishes the Cuc Co Khi in Hanoi. With a network of tooling workshops now mature, the Bureau begins reverse-engineering French steam engines and manufacturing spare parts locally. For the first time, Dai Nam produces its own machine tools."
 dvf_flavor.5.f: "The clang of hammers on steel echoes in the workshops. 'We need not beg for screws and pistons,' writes Dang Huu Tru in his journal."
 dvf_flavor.5.a: "Grant the Bureau imperial patronage and funding."
 
 # --- EVENT 6: HẠ THỦY TÀU CHIẾN HƠI NƯỚC ĐẦU TIÊN ---
 dvf_flavor.6.t: "Launching the First Indigenous Steam Warship"
 dvf_flavor.6.d: "At the shipyards of Saigon or Hai Phong, the keel is laid for the first steam-powered warship designed and built entirely by Vietnamese engineers, utilizing engines from the Cuc Co Khi. Named [Concept('ironclad', 'Ironclad')] or [Concept('gunboat', 'Gunboat')], she represents the culmination of the naval modernization program."
 dvf_flavor.6.f: "As the hull slides into the water, the crowd cheers. The dragon has grown steel claws."
 dvf_flavor.6.a: "Commission the vessel into the Imperial Navy immediately."
 
 # --- EVENT 7: TÂY HÀNH NHẬT KÝ — PHẠM PHÚ THỨ ---
 dvf_flavor.7.t: "Tay Hanh Nhat Ky — Pham Phu Thu's Journey to the West"
 dvf_flavor.7.d: "Following the successful Diplomatic Mission, mandarin Pham Phu Thu accompanies the embassy to Paris and London. His detailed diary, 'Tay Hanh Nhat Ky' (Diary of a Journey to the West), describes parliaments, factories, railways, and schools with wonder and critical insight. Published upon his return, it becomes the 'bible' for reformist mandarins, shifting court opinion decisively toward modernization."
 dvf_flavor.7.f: "'They do not rule by the Mandate of Heaven alone, but by the mandate of Law and Steam,' writes Pham Phu Thu."
 dvf_flavor.7.a: "Print and distribute the diary to all provincial governors."
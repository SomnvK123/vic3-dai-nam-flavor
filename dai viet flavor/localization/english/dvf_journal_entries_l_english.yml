l_english:
 ####################################
 # JOURNAL ENTRY: ÂM MƯU AN PHONG (HONG BAO COUP)
 ####################################
 
 je_dvf_hong_bao_coup: "Âm Mưu An Phong"
 je_dvf_hong_bao_coup_desc: "Hoàng tử Hồng Bảo (An Phong Công), bị căm ghét bởi phe Nho gia thủ cựu do Trương Đăng Quế cầm đầu, ngấm ngầm xây dựng mạng lưới lật đổ vua Tự Đức. Hắn liên lạc với giáo sĩ phương Tây, thương gia ngoại bang và sĩ phu canh tân để mua súng, tập hợp binh lực. Triều đình đã nhận được tin tức. Cuộc đua chống lại thời gian và sự truy nã đã bắt đầu.\n\n§HThanh tiến trình thể hiện mức độ sẵn sàng của phe đảo chính.§!\n§G+1 Điểm:§! Phe Hồng Bảo chiếm ưu thế (Mua súng, hưởng ứng).\n§R-1 Điểm:§! Triều đình trấn áp (Tịch thu vũ khí, bãi chức tướng lĩnh).\n\n§YĐạt 5/5:§! Hồng Bảo lên ngôi, kích hoạt §HCanh Tân Đất Nước§!.\n§YVề 0:§! Hồng Bảo bị bắt, tự vẫn, Đại Nam tiếp tục bế quan."
 je_dvf_hong_bao_coup_reason: "Nếu triều đình không dập tắt âm mưu này kịp thời, Hồng Bảo sẽ phát động đảo chính đẫm máu để cướp ngôi."
 je_dvf_hong_bao_coup_progress_desc: "Tiến Trình Đảo Chính"
 
 # Progress Entries (0 -> 5)
 dvf_je_coup_entry_1: "Tiếng Thì Thầm Trong Cấm Thành"
 dvf_je_coup_entry_1_desc: "Hồng Bảo bắt đầu liên lạc mật với các nhân sĩ bất mãn và truyền교 sĩ phương Tây. Âm mưu mới chỉ ở trạng thái sơ khai."
 
 dvf_je_coup_entry_2: "Hoàng Tử Bí Mật Mua Súng Đạn"
 dvf_je_coup_entry_2_desc: "Hồng Bảo sử dụng tài sản hoàng tộc và tiền Công giáo để mua vũ khí hiện đại từ các thương gia tại Hồng Kông và Singapore. Kho vũ khí bí mật dần hình thành."
 
 dvf_je_coup_entry_3: "Phái Canh Tân Nổi Dậy"
 dvf_je_coup_entry_3_desc: "Sĩ phu Nam Kỳ, các quan lại trẻ và giáo dân Công giáo bị bách hại công khai tuyên huy động hưởng ứng Hồng Bảo. Mạng lưới âm mưu lan rộng ra 3 kỳ."
 
 dvf_je_coup_entry_4: "Giằng Co Quyền Lực"
 dvf_je_coup_entry_4_desc: "Trương Đăng Quế và phe Nho gia bắt đầu nghi ngờ. Cuộc truy nã gay gắt diễn ra. Hồng Bảo phải quyết định: đánh nhanh hay chờ đợi thêm lực lượng?"
 
 dvf_je_coup_entry_5: "Giờ Khẩn Quyết Định"
 dvf_je_coup_entry_5_desc: "Mọi lực lượng đã hội tụ. Chỉ còn một cú đẩy cuối cùng để lật đổ Hoàng thành. Thành bại sinh tử chỉ trong một sớm một chiều."
 
 # Alerts
 dvf_je_coup_alert_low_progress: "§RÁm Mưu Suy Yếu!§! Phe Hồng Bảo đang bị triều đình trấn áp mạnh mẽ. Nếu không có hành động quyết liệt, âm mưu sẽ bị dập tắt!"
 
 ####################################
 # JOURNAL ENTRY: CANH TÂN ĐẤT NƯỚC (HONG BAO RESTORATION)
 ####################################
 
 je_dvf_hong_bao_restoration: "Canh Tân Đất Nước"
 je_dvf_hong_bao_restoration_desc: "Sau khi đánh bại phe Nho gia bảo thủ và lên ngôi Hoàng đế, Hồng Bảo triển khai chương trình canh tân toàn diện theo tư tưởng của Nguyễn Trường Tộ, Đặng Huy Trứ, Nguyễn Tri Phương và Phạm Phú Thứ. Mục tiêu: Biến Đại Nam thành cường quốc độc lập, văn minh, hùng mạnh ngang hàng phương Tây trong 10-15 năm.\n\n§HHoàn thành 6 Trụ Cột sau để thắng lợi:§!"
 je_dvf_hong_bao_restoration_reason: "Đại Nam phải hoàn thành cả 6 Trụ Cột Canh Tân, nếu không sẽ đối mặt với ách đô hộ của thực dân phương Tây."
 je_dvf_hong_bao_restoration_progress_desc: "Tiến Trình Canh Tân"
 
 # --- PILLAR 1: THỂ CHẾ & LUẬT PHÁP ---
 dvf_je_restoration_pillar_1: "Trụ Cột 1: Cải Tổ Thể Chế & Luật Pháp"
 dvf_je_restoration_pillar_1_desc: "Xóa bỏ chế độ Nho học bảo thủ, xây dựng nhà nước pháp quyền hiện đại.\n\n§YYêu cầu:§!\n• Luật Kinh tế: §GChủ nghĩa Can thiệp§! hoặc §GNông nghiệp§! (Bỏ §RThuyết Truyền thống§!).\n• Luật Ngoại giao: §GThương chính§! hoặc §GTự do Thương mại§! (Bỏ §RCô lập§!).\n• Luật Tôn giáo: §GTự do Tín ngưỡng§! (Bắt buộc - triệt tiêu cớ Pháp).\n• Luật Quân sự/Quan lại: §GBổ nhiệm theo Thực tài§! hoặc §GQuân đội Chuyên nghiệp§!.\n• §GPhe Trí thức (Intelligentsia)§! hoặc §GQuân đội (Armed Forces)§! trong Chính phủ.\n• §RPhe Địa chủ Nho gia (Landowners)§! Clout < 20%."
 
 # --- PILLAR 2: GIÁO DỤC & VĂN HÓA ---
 dvf_je_restoration_pillar_2: "Trụ Cột 2: Nâng Cao Dân Trí & Giáo Dục"
 dvf_je_restoration_pillar_2_desc: "Chuyển từ 'Hư học Nho giáo' sang 'Tân học Thực tế'.\n\n§YYêu cầu:§!\n• Luật: §GCông lập§! hoặc §GTôn giáo§!.\n• Hệ thống Giáo dục (Institution Schools) đạt §GCấp 2§!.\n• Vận hành ≥ §G5 Trường Đại học§!.\n• Vận hành ≥ §G1 Học viện Mỹ thuật§!.\n• Tỷ lệ biết chữ toàn quốc ≥ §G40%§!."
 
 # --- PILLAR 3: NÔNG NGHIỆP ---
 dvf_je_restoration_pillar_3: "Trụ Cột 3: Vựa Lúa Cửu Long & Xuất Khẩu"
 dvf_je_restoration_pillar_3_desc: "Khai hoang đồng bằng sông Cửu Long, biến Nam Kỳ thành lúa vựa của Đông Nam Á.\n\n§YYêu cầu:§!\n• Vận hành ≥ §G25 Nông trại Lúa nước (Rice Farm)§! toàn quốc.\n• Thiết lập ≥ §G1 Tuyến xuất khẩu Gạo (Grain)§! ra thị trường quốc tế."
 
 # --- PILLAR 4: CÔNG NGHIỆP & KHAI KHOÁNG ---
 dvf_je_restoration_pillar_4: "Trụ Cột 4: Công Nghiệp Hóa & Tự Chủ Khoáng Sản"
 dvf_je_restoration_pillar_4_desc: "Xây dựng nền công nghiệp quân sự - dân dụng theo phân vùng rõ rệt (Bắc - Trung - Nam).\n\n§YYêu cầu:§!\n§HKHAI KHOÁNG:§!\n• Bắc Kỳ (Tonkin): ≥ 4 Mỏ Than.\n• Trung Kỳ (Annam): ≥ 4 Mỏ Than & ≥ 4 Mỏ Sắt.\n§HCÔNG NGHIỆP PHỤ TRỢ:§!\n• Bắc Kỳ: ≥ 2 Giấy, ≥ 2 Dệt, ≥ 1 Đường sắt.\n• Trung Kỳ: ≥ 2 Giấy, ≥ 1 Đường sắt.\n• Nam Kỳ (Mekong): ≥ 2 Dệt may.\n§HCƠ KHÍ CHẾ TẠO:§!\n• Toàn quốc: ≥ §G10 Xưởng Cơ khí/Công cụ (Tooling Workshop)§!."
 
 # --- PILLAR 5: QUÂN SỰ ---
 dvf_je_restoration_pillar_5: "Trụ Cột 5: Hiện Đại Hóa Quốc Phòng"
 dvf_je_restoration_pillar_5_desc: "Súng rãnh xoắn, Pháo nạp hậu, Tàu hơi nước - Bức tường thép bảo vệ độc lập.\n\n§YYêu cầu:§!\n§HCÔNG NGHỆ (Era 1-2):§!\n• Hạt nổ (Percussion Cap), Bộ binh Tuyến (Line Infantry), Rãnh xoắn (Rifling).\n• Pháo binh (Artillery), Pháo nạp hậu (Breech-loading), Tàu hơi nước (Paddle Steamer).\n§HCÔNG NGHIỆP QUỐC PHÒNG:§!\n• ≥ 6 Xưởng Vũ khí (Arms Industry).\n• ≥ 3 Xưởng Đạn dược (Munition Plant).\n• ≥ 3 Xưởng Đóng tàu (Shipyard).\n§HLỰC LƯỢNG THƯỜNG TRỰC:§!\n• ≥ 40 Doanh trại (Barracks).\n• ≥ 10 Căn cứ Hải quân (Naval Base)."
 
 # --- PILLAR 6: NGOẠI GIAO ---
 dvf_je_restoration_pillar_6: "Trụ Cột 6: Ngoại Giao Đa Phương & Mở Cửa"
 dvf_je_restoration_pillar_6_desc: "Chiến lược 'Lấy độc trị độc' của Nguyễn Trường Tộ: Hưởng ứng Anh, Mỹ, Phổ để kìm chế Pháp.\n\n§YYêu cầu:§!\n• Luật: §GThương chính§! hoặc §GTự do Thương mại§!.\n• Vận hành ≥ §G3 Cảng thương mại (Port)§!.\n• Thiết lập ≥ §G3 Tuyến thương mại quốc tế§! hoạt động.\n• Quan hệ ≥ §G+20§! với ít nhất 1 Cường quốc: §GAnh§!, §GMỹ§!, §GPhổ§! hoặc §GPháp§!."
 
 ####################################
 # COMPLETION / FAIL FLAVOR
 ####################################
 
 # (Complete & Fail effects are handled in script, but we can add flavor text for the journal entry end screen if supported)
 # V3 usually shows the 'complete' effect tooltip automatically.
 # We define names for the modifiers granted on complete/fail for tooltip clarity.
 
 dvf_great_modernization: "Đại Nam Duy Tân"
 dvf_great_modernization_desc: "Đại Nam đã hoàn thành cuộc Cải cách Canh Tân toàn diện dưới triều vua Hồng Bảo. Quốc gia bước vào kỷ nguyên mới: Công nghiệp hóa, Dân trí mở mang, Quân sự hiện đại, Ngoại giao đa phương. Vững vàng độc lập trước làn sóng thực dân phương Tây."
 
 dvf_hong_bao_dynasty_collapse: "Triều Đại Hồng Bảo Sụp Đổ"
 dvf_hong_bao_dynasty_collapse_desc: "Cuộc canh tân của vua Hồng Bảo đã thất bại thảm hại. Vua qua đời sớm hoặc bị lật đổ, lãnh thổ cốt lõi bị mất, nội chiến bùng nổ. Phe Nho gia bảo thủ phục quyền, đất nước chìm vào hỗn loạn và suy yếu sâu sắc, dễ bị thực dân chia cắt."
 
 # Modifier names used in Coup JE (for tooltips)
 dvf_hong_bao_reform_court: "Triều Đình Duy Tân (Tạm Thời)"
 dvf_hong_bao_reform_court_desc: "Chính quyền mới dưới triều Hồng Bảo: Buff Trí thức/Quân đội/Công thương, Debuff Địa chủ/Nho gia. Kéo dài đến khi JE Canh Tân kết thúc."
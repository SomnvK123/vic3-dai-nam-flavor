l_english:
 SPC: "Carlist Spain"
 SPC_ADJ: "carlists"

 RULER_TITLE_INFANTE: "Infante"
 Carlos_M_I: "Carlos María Isidro"

 SPC_FLAVOR_TEXT: "After three years of conflict and the recent death of Zumalacárregui, the fatigue of a prolonged war is becoming more evident among the Carlist ranks, while in the south the Isabelinos have managed to consolidate their forces and are ready to put an end once and for all to the uprising. It is time for the Carlists to leave the north and seek support in the"

 gov_carlistas: "Carlist Monarchy"
 gov_carlistas_desc: "This is a revolutionary faction fighting to place a branch of the Bourbons on the Spanish throne."

 je_carlist_victory: "Carlist War"
 je_carlist_victory_reason: "The First Carlist War was fought between two factions over the succession to the throne and the nature of the Spanish monarchy: the conservatives and reactionaries supporting the brother of the late king, Carlos María Isidro de Borbón, were known as the Carlists, while the progressives and centralists supporting the regent, María Cristina, acting on behalf of Isabel II of Spain, were called the Cristinos or Isabelinos."
 je_carlist_victory_status: "Overthrow the Spanish government."
 win_civil_war: "Has overthrown the usurpers of the throne"
 je_carlist_victory_1: "Spain's problems will pass on to us."

 expedicion_gomez_name: "Launch an Expedition"
 expedicion_gomez_desc: "We can disrupt the Cristino forces by sending expeditions into the interior of the country."

 expedicion_real_name: "The Royal Expedition"
 expedicion_real_desc: "With Carlos María Isidro leading the troops, we can gain more supporters for the cause and greatly boost the morale of the army."
 expedicion_real_tt: "The Isabelinos may concede ground in the north to avoid facing the march, or face the consequences of the march."

 alzamiento_carlista_name: "Plan an Uprising"
 alzamiento_carlista_desc: "After demonstrating Carlist superiority on the battlefield, we can influence some sympathetic garrisons to join the cause."
 alzamiento_carlista_tt: "The progress bar of #variable $alzamientos_carlistas_bar$#! is complete"
 alzamiento_carlista_tt1: "The progress bar of #variable $alzamientos_carlistas_bar$#! will lose all its progress"
 alzamiento_carlista_tt2: "There are territories left to rise"

 je_cristininos_victory: "Carlist War"
 je_cristininos_victory_reason: "The First Carlist War was fought between two factions over the succession to the throne and the nature of the Spanish monarchy: the conservatives and reactionaries supporting the brother of the late king, Carlos María Isidro de Borbón, were known as the Carlists, while the progressives and centralists supporting the regent, María Cristina, acting on behalf of Isabel II of Spain, were called the Cristinos or Isabelinos."
 je_cristininos_victory_status: "Crush the Carlist rebellion."
 derrota_carlistas: "Has defeated the rebellion"
 derrota_carlistas_tt1: "The Carlists have triumphed"
 je_cristininos_victory_tt: "All the [Concept('concept_modifier', '$concept_modifiers$')|l] related to the [concept_war|l] will disappear."
 je_cristininos_victory_desc_1: "There is no expedition from the [SCOPE.sCountry('car_scope').GetAdjective]."
 je_cristininos_victory_desc_2: "An expedition from the [SCOPE.sCountry('car_scope').GetAdjective] marches without opposition."
 je_cristininos_victory_desc_3: "An expedition from the [SCOPE.sCountry('car_scope').GetAdjective] is under pursuit."

 je_cristinos_victory_fuera: "Quadruple Alliance"
 je_cristinos_victory_fuera_reason: "The [concept_war|l] of [SCOPE.sWar('guerra_carlista').GetName] (First Carlist War) was fought between two factions over the succession to the throne and the nature of the Spanish monarchy: the conservatives and reactionaries supporting the brother of the late king [SCOPE.sCountry('car_scope').GetRuler.GetFullName], were known as the [SCOPE.sCountry('car_scope').GetName]; while the progressives and liberals, supporters of the regent [SCOPE.sCountry('spa_scope').GetRuler.GetFirstName], were called Cristinos or Isabelinos.\n\nBoth [SCOPE.sCountry('gbr_scope').GetName], [SCOPE.sCountry('fra_scope').GetName], [SCOPE.sCountry('por_scope').GetName], and [SCOPE.sCountry('spa_scope').GetName] have been part of the #bold Quadruple Alliance#! since 1834, originally formed to support the candidacy of [SCOPE.sCountry('por_scope').GetRuler.GetFullName] to the throne of [SCOPE.sCountry('por_scope').GetAdjective], but its current objective is to support [SCOPE.sCountry('spa_scope').GetName] in its fight against [SCOPE.sCountry('car_scope').GetName]."
 je_cristinos_victory_fuera_status: "$je_cristininos_victory_status$"
 je_cristinos_victory_fuera_tt: "[SCOPE.sCountry('spa_scope').GetName] #bold Cristina#! has prevailed"
 je_cristinos_victory_fuera_tt1: "[SCOPE.sCountry('car_scope').GetName] has prevailed"
 
 # Uprisings
 alzamiento_maestrazgo_car_tt: "[Concept('concept_battalion','$concept_battalions$')] [SCOPE.sCountry('car_scope').GetAdjective|l] will rise in the Maestrazgo mountains"
 alzamiento_maestrazgo_car_tt1: "The [Concept('concept_battalion','$concept_battalions$')|l] from [SCOPE.sBuilding('cuartel_alzamiento').GetName|l] in [SCOPE.sState('estado_cuartel_alzamiento').GetName] will lose a #bold #red -50.0%#!#! of their current [concept_morale|l]"

 alzamiento_aragon_car_tt: "The [SCOPE.sCountry('car_scope').GetAdjective|l] will secure the area of lower [SCOPE.sState('aragon_espanol').GetStateRegion.GetName]"
 alzamiento_cataluna_car_tt: "The [SCOPE.sCountry('car_scope').GetAdjective|l] will lay siege to #bold Barcelona#!"

Methuen_Treaty_button:0 "Renew the Methuen Treaty"
Methuen_Treaty_button_desc:0 "The treaty confirms the previous military and political alliance between the UK and Portugal, primarily achieving trade agreements. If #blue Portugal#! prohibits our investment rights in its territory, the treaty will be void."
exists_por_tt:0 "Every five years, we can ask #blue Portugal#! to renew the Methuen Treaty, but we must ensure its independence and sovereignty."
Treaty_of_London_button:0 "Fulfill the Treaty of London"
Treaty_of_London_button_desc:0 "The historical significance of the Treaty of London lies in its twelfth chapter, which requires #yellow Belgium#! to maintain perpetual neutrality and implies that the signatories of the treaty must protect Belgium's neutrality in the event of an invasion."
exists_bel_tt:0 "We should protect #yellow Belgium#!'s sovereignty and independence. Every five years, we can obtain investment rights in #yellow Belgium#!"

dsk_gbr.22.t:0 "[SCOPE.sCountry('gbr_scope').GetName] Requests to Renew the Methuen Treaty"
dsk_gbr.22.d:0 "Joint defense or foreign investment rights?"
dsk_gbr.22.f:0 "The treaty confirms the previous military and political alliance between the two countries, primarily achieving trade agreements. The treaty allows British wool and woolen goods to enter the Portuguese market, while Portuguese wines can enjoy tariff preferences in the UK. In the early stages of the treaty's implementation, the declining Douro wine region of Portugal was revived, promoting the development of Portuguese agriculture. However, once the British wine market became saturated, the British began to control the wine producers in the region, continuously lowering purchase prices, and the large influx of British industrial goods, especially woolen goods, into Portugal affected the development of Portuguese industry, causing significant economic losses and increasing dependency on [SCOPE.sCountry('gbr_scope').GetName]."
dsk_gbr.22.a:0 "We no longer need any military guarantees from [SCOPE.sCountry('gbr_scope').GetName] as we can be independent."
dsk_gbr.22.b:0 "We still need this supreme power."
foreign_investment_right_tt:0 "Gain investment rights in the target country."

dsk_gbr.28.t:0 "[SCOPE.sCountry('por_scope').GetName] Refuses to Renew the Methuen Treaty"
dsk_gbr.28.d:0 "They chose sovereignty over joint defense."
dsk_gbr.28.f:0 "The influx of our industrial goods has had a huge impact on their economy, and we can understand their decision. But we deeply regret it."
dsk_gbr.28.a:0 "Maybe next time, [SCOPE.sCountry('por_scope').GetName] will change their mind."

dsk_je_veiled_protectorate: "Veiled Protectorate"
dsk_je_veiled_protectorate_reason: "Our influence in Egypt is significantly growing, but our power in the region largely depends on our relationship with this unrecognized state. Establishing a protectorate institution in this country will ensure our dominance."
dsk_gbr_Imperial_Parliament:0 "[ROOT.GetCountry.GetRuler.GetFirstName]'s Era"
gbr_lose_world_war:0 "[SCOPE.GetRootScope.GetCountry.GetName] Lost the World War"
dsk_gbr_Imperial_Parliament_reason:0 "\n\nNow, we have successfully integrated the four #v Crown Jewels#!: [SCOPE.sCountry('bic_scope').GetName], [SCOPE.sCountry('ast_scope').GetName], [SCOPE.sCountry('can_scope').GetName], and [SCOPE.sCountry('saf_scope').GetName] have declared allegiance to the #red British Empire#! and [ROOT.GetCountry.GetRuler.GetFirstName] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]!\n\nAfter [SCOPE.GetRootScope.GetCountry.GetName] handles colonial affairs, it still needs to lead global affairs, helping small countries maintain independence and preventing aggression. If we cannot win the #red World War#!, our influence will plummet in the next century!\n\n#b Current Effects#!\n#lore Updated Monthly#!\n[ROOT.GetCountry.GetCustom('pax_britannica_tooltip')]\n\n@arrow_up_up!#b Increases Monthly#!@arrow_up_up!\n@divider_start!@divider_mid!@divider_end!\n@inf!Every signed [concept_trade_privilege], [concept_customs_union], or [concept_defensive_pact]\n#italic Effects vary by country level#!\n@battalions!Protect [concept_minor_power] or [concept_major_power] from [concept_great_power] aggression\n@divider_start!@divider_mid!@divider_end!\n\n@arrow_down_down!#b Decreases Monthly#!@arrow_down_down!\n@divider_start!@divider_mid!@divider_end!\n@infamy! [concept_infamy] exceeds #N Infamy#! level\n@infamy! The average [concept_infamy] with any [concept_great_power] exceeds #N Infamy#!, and you are not involved in a [concept_diplomatic_play] or have no truce\n@soldiers!Fail to protect [concept_minor_power] or [concept_major_power] from [concept_great_power] aggression\n@unpinned_star!Surpassed by another [concept_rank]! [concept_super_power] before the World War\n@unpinned_star!Existence of any other [concept_super_power]\n@divider_start!@divider_mid!@divider_end!\n\n"

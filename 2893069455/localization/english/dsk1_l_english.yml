angelsn_union_desc:0 "From Szczecin on the Baltic Sea to Trieste on the Adriatic Sea, the Iron Curtain has been lifted across the European continent. Behind this iron curtain lie the capitals of all ancient Central and Eastern European countries - Warsaw, Berlin, Prague, Vienna, Budapest, Belgrade, Bucharest, and Sofia. These famous cities and their surrounding populations are all within the sphere of Soviet influence, and in one way or another, they are not only under Soviet influence, but also increasingly under Moscow's control"

clever_dsk.1.t:0 "Invention of Yellow Dynamite"
clever_dsk.1.d:0 "As nitroglycerin became utilized, Alfred Nobel continued his research into explosives. However, considerable funding was required to complete this research."
clever_dsk.1.f:0 "You see, that guy's experiments even blew up his own brother. Oh, he's really a lunatic, I hope the government stops him from harming others again."
clever_dsk.1.a:0 "His invention will bring enormous progress to the world."
clever_dsk.1.b:0 "Prohibit him from researching such dangerous substances."
research_the_dynamite_modifier:0 "Dynamite Research Cost"

clever_dsk.2.t:0 "Invention of the Assembly Line"
clever_dsk.2.d:0 "During an observation of a butcher slaughtering cattle, industrial leader Henry Ford was inspired to attempt the invention of the assembly line. However, some funding was required to complete this research."
clever_dsk.2.f:0 "In designing the assembly line for production, it only requires arranging tools and people by process to assemble automobile parts in the shortest possible time."
clever_dsk.2.a:0 "This can increase the efficiency of automobile production."
clever_dsk.2.b:0 "We don't have funds for such absurd ideas."
research_the_conveyors_modifier:0 "Assembly Line Research Cost"

clever_dsk.3.t:0 "Reconstruction of the Summer Palace"
clever_dsk.3.d:0 "The Empress Dowager plans to renovate the Summer Palace to celebrate her sixtieth birthday, and various officials are awaiting the emperor's edict."
clever_dsk.3.f:0 "This money, consider it as my tribute to the Old Buddha. But what about naval construction? Ah, does the navy matter as much as pleasing the Old Buddha?"
clever_dsk.3.a:0 "In the name of naval donations, raise naval funds from various places to repair the Summer Palace."
clever_dsk.3.b:0 "Foreign powers still have treaty ports in our country; we need funds to strengthen national defense."
restore_summer_palace_modifier:0 "Naval Defense Donation"
happy_palace_restored:0 "Satisfied with the Reconstruction of the Summer Palace"
angry_palace_banned:0 "Ban on Palace Reconstruction"

clever_dsk.4.t:0 "The JiaShen Decree"
clever_dsk.4.d:0 "Since the Xin Hai Revolution, the power struggle between Prince Gong Yixin and the Empress Dowager has intensified, with Prince Gong gradually losing ground."
clever_dsk.4.f:0 "Have you heard? The Empress Dowager wants to depose Prince Gong and replace him with Prince Chun in the Grand Council. Oh, I'm already a supporter of the Chun faction."
clever_dsk.4.a:0 "Prince Gong Yixin and his Grand Council members are all dismissed."
clever_dsk.4.b:0 "The Emperor attempts to save Prince Gong."

clever_dsk.5.t:0 "Demand to Suppress the Boxers"
clever_dsk.5.d:0 "Due to the continuous aggression of foreign powers against China, the Boxer Rebellion has rapidly developed in our country, and Boxer adherents have even invaded treaty ports. The foreign envoys demand that our country suppress the Boxers."
clever_dsk.5.f:0 "For two hundred years, we have shown kindness and generosity. Whenever foreigners come to China, our ancestors have always treated them with benevolence. Yet, for the past thirty years, relying on our country's kindness, they have become increasingly arrogant, bullying our nation, occupying our land, trampling our people, and extorting our wealth. Instead of enduring disgrace, we'd rather face the foreign invaders head-on and determine victory or defeat."
clever_dsk.5.a:0 "Declare war on the United Kingdom! Declare war on France! Declare war on the United States! Declare war on Germany! Declare war on Russia! Declare war on Italy! Declare war on Austria! Declare war on Japan."
clever_dsk.5.b:0 "We cannot offend the Westerners; we should advise the Empress Dowager to suppress these Boxer insurgents quickly."
Chinese_Eight_war:0 "The Eight-Nation Alliance's Invasion of China"

clever_dsk.6.t:0 "Declaration of War from All Nations"
clever_dsk.6.d:0 "The Boxer insurgents in the treaty ports have been wreaking havoc, and seeing that they cannot persuade the Qing government to suppress them, the foreign envoys decide to send troops to Beijing, prompting a declaration of war from the Qing against us."
clever_dsk.6.f:0 "The Boxers have already besieged the Legation Quarter and the churches in the Xishiku area. The embassy personnel there have requested us to strengthen protection and need a prompt decision."
clever_dsk.6.a:0 "Protect our embassies and interests in China."
clever_dsk.6.b:0 "We should not participate in this aggressive war."

clever_dsk.14.t:0 "Government Restructuring"
clever_dsk.14.d:0 "With the success of the revolution in China, Sun Yat-sen intends to appoint a group of politicians, youth, and military personnel guided by the Three Principles of the People to restructure the government and unify political ideology."
clever_dsk.14.f:0 "To realize the Three Principles of the People, everyone needs to strive together for it. (Suggest leaving two military positions for Generals Cai E and Huang Xing to command.)"
clever_dsk.14.a:0 "Nationalism! Democracy! People's Livelihood!"
clever_dsk.14.b:0 "Stop him."
southern_province_negative_modifier:0 "Southern Provinces Unwilling to Join War"

clever_dsk.15.t:0 "Zimmermann Telegram"
clever_dsk.15.d:0 "Out of goodwill towards our country, the British Foreign Secretary disclosed to our ambassador a telegram intercepted from the German Ambassador to Mexico."
clever_dsk.15.f:0 "We plan to start unrestricted submarine warfare on February 1st. At the same time, we will do our utmost to keep the United States neutral. If the plan fails, we propose an alliance with Mexico based on the following terms: joint military action and mutual peace treaties. The details of the proposal are to be drafted by you."
clever_dsk.15.a:0 "Expose the contents of the telegram to the domestic media to create public pressure on the opposition and prepare for war against Germany."
clever_dsk.15.b:0 "Let's keep it quiet."

clever_dsk.16.t:0 "Revenge against Serbia"
clever_dsk.16.d:0 "Our allies have declared war on our enemy, Serbia. Should we continue to remain neutral or join this war?"
clever_dsk.16.f:0 "The Tsar still resents not regaining the Macedonian region in the last war, and now that Serbia is cornered, it's time to seek revenge."
clever_dsk.16.a:0 "For Greater Bulgaria!"
clever_dsk.16.b:0 "Strong protests and opposition from domestic political parties and legislators against participating in the war."

revenge_against_serbia_modifier:0 "Strong Desire for Revenge"
turkish_lost_prestige:0 "Turkish Warship Seized"

clever_dsk.17.t:0 "Warship Seized"
clever_dsk.17.d:0 "The British Naval Minister has confiscated two battleships ordered and paid for by our country, citing wartime requisition without compensation. This has angered the people who donated funds to buy the warships, leading to street protests and demonstrations."
clever_dsk.17.f:0 "Mom, why do we have to donate money? Child, only by buying these two ships can we protect our country."
clever_dsk.17.a:0 "Pasha decides to comply with public opinion and join the war on the side of the Allied Powers."
clever_dsk.17.b:0 "Adopt a default stance to suppress public grievances."

clever_dsk.18.t:0 "Transylvania Issue"
clever_dsk.18.d:0 "With the outbreak of World War I, the Allied Powers seem to be in decline, and the Transylvania region is now within reach."
clever_dsk.18.f:0 "You, Transylvania, we are your soldiers. Holy temple, oh holy temple, Apuseni Mountains, you are our homeland."
clever_dsk.18.a:0 "Cross the Carpathians and join the war on the side of the Entente Powers."
clever_dsk.18.b:0 "Abandon joining the war."

clever_dsk.19.t:0 "Allies' Seduction"
clever_dsk.19.d:0 "To break the stalemate of the war, the Allied Powers extend an olive branch to us, promising that if we join their war, after victory, South Tyrol, Trentino, and Dalmatia will all be incorporated into our territory."
clever_dsk.19.f:0 "The Prime Minister insists that this is an unjust war and should not be participated in. Moreover, its scale is so large that if we rush into it, the achievements of Italian unification will be in vain."
clever_dsk.19.a:0 "Agree to the conditions offered by the Allied Powers and prepare for war immediately."
clever_dsk.19.b:0 "Suppress the wave of war; Italy will adhere to neutrality."

clever_dsk.20.t:0 "Entry of the United States into the War"
clever_dsk.20.d:0 "Our country's ambassador received news of the United States joining the war on the side of the Allied Powers."
clever_dsk.20.f:0 "A hundred years later, people will see how terrible and meaningless this war was."
clever_dsk.20.a:0 "The balance of victory will tilt towards one side."

clever_dsk.21.t:0 "Bulgaria Joins the War"
clever_dsk.21.d:0 "Our country's ambassador received news of Bulgaria joining the war on the side of the Central Powers."
clever_dsk.21.f:0 "A hundred years later, people will see how terrible and meaningless this war was."
clever_dsk.21.a:0 "The balance of victory will tilt towards one side."

clever_dsk.22.t:0 "Ottoman Turkey Joins the War"
clever_dsk.22.d:0 "Our country's ambassador received news of the Ottoman Empire joining the war on the side of the Central Powers."
clever_dsk.22.f:0 "A hundred years later, people will see how terrible and meaningless this war was."
clever_dsk.22.a:0 "The balance of victory will tilt towards one side."

clever_dsk.23.t:0 "Romania Joins the War"
clever_dsk.23.d:0 "Our country's ambassador received news of Romania joining the war on the side of the Allied Powers."
clever_dsk.23.f:0 "A hundred years later, people will see how terrible and meaningless this war was."
clever_dsk.23.a:0 "The balance of victory will tilt towards one side."

clever_dsk.24.t:0 "Italy Joins the War"
clever_dsk.24.d:0 "Our country's ambassador received news of Italy joining the war on the side of the Allied Powers."
clever_dsk.24.f:0 "A hundred years later, people will see how terrible and meaningless this war was."
clever_dsk.24.a:0 "The balance of victory will tilt towards one side."

clever_dsk.25.t:0 "Rise of Cities"
clever_dsk.25.d:0 "Our country's industry is experiencing rapid development, and some capitalists and engineers are trying to exploit local resources and establish more industrial cities."
clever_dsk.25.f:0 "From the hills in the south to the deserts in the north, countless new place names are appearing on the map."
clever_dsk.25.a:0 "Encourage the construction of new cities."
clever_dsk.25.b:0 "Cities only bring pollution; we should go for rural development."

clever_dsk.26.t:0 "Using Belgium as a Path"
clever_dsk.26.d:0 "According to the Schlieffen Plan, to achieve a quick victory over France, it is necessary to detour through Belgium, swiftly capture Brussels, and enter French territory."
clever_dsk.26.f:0 "If we do not send troops into Belgian territory in advance, France may invade our country through Belgian territory."
clever_dsk.26.a:0 "Issue an ultimatum to Belgium, demanding our troops be allowed to pass."
clever_dsk.26.b:0 "Respect Belgium's sovereignty and neutrality."

clever_dsk.27.t:0 "Germany's Ultimatum"
clever_dsk.27.d:0 "Germany claims to have received reliable intelligence that France intends to invade Germany through Belgian territory, and they do not expect our country's troops to stop the French advance. Therefore, they intend to preemptively send troops into our territory for self-defense."
clever_dsk.27.f:0 "If we oppose Germany's passage through our territory, we will be regarded as its enemy, and future relations between the two countries will be determined by gunfire."
clever_dsk.27.a:0 "Belgium is a country, not a road."
clever_dsk.27.b:0 "Yielding to Germany's cannons will provoke some actions from France."

clever_dsk.28.t:0 "Belgium Forced into War"
clever_dsk.28.d:0 "The Belgian government refused the request for German troops to pass through their territory, prompting Germany to declare war on Belgium."
clever_dsk.28.f:0 "A hundred years later, people will see how terrible and meaningless this war was."
clever_dsk.28.a:0 "The balance of victory will tilt towards one side."

clever_dsk.29.t:0 "Belgium Dragged into War"
clever_dsk.29.d:0 "The Belgian government refused the request for German troops to pass through their territory, leading Germany to wage war against Belgium, which violated the London Treaty."
clever_dsk.29.f:0 "According to the London Treaty, we are obligated to defend Belgium's neutrality. The Belgian ambassador requests that we fulfill the treaty and fight against Germany."
clever_dsk.29.a:0 "Immediately dispatch expeditionary forces to rescue Belgium."
clever_dsk.29.b:0 "Abandon the rescue."
clever_dsk.29.c:0 "Continue to increase military forces."

clever_dsk.30.b:0 "Prohibit the continued use of gas warfare."
british_lost_bel_prestige:0 "Failure to Uphold the London Treaty"

clever_dsk.31.t:0 "Vienna's Call for Help"
clever_dsk.31.d:0 "Austria-Hungary has sent a telegram claiming that their forces cannot support a war on all fronts and requests our country to send troops to support them."
clever_dsk.31.f:0 "Gray cattle are charging densely towards Galicia on the Eastern Front. If we do not send troops to support, Austria may become our weak point."
clever_dsk.31.a:0 "Quickly dispatch troops to stabilize Austria's front."
clever_dsk.31.b:0 "We don't want to fight with a corpse on our backs."

clever_dsk.32.t:0 "Berlin's Response"
clever_dsk.32.d:0 "Berlin sent a telegram agreeing to send troops to support our front lines."
clever_dsk.32.f:0 "This is the unity of the German people; we will resist our common enemy."
clever_dsk.32.a:0 "As allies, we should also send troops to support the Western Front."
clever_dsk.32.b:0 "The gray cattle will be mercilessly crushed by us."

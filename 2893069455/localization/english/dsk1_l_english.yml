lia_event_rtc.1.t:0 "[SCOPE.sCountry('gbr_scope').GetName] - [SCOPE.sCountry('chi_scope').GetName] First Opium War"
lia_event_rtc.1.d:0 "[SCOPE.sCountry('gbr_scope').GetName] - [SCOPE.sCountry('chi_scope').GetName] Signs the Treaty of Nanking!"
lia_event_rtc.1.f:6 "Breaking News! Reports about the First Opium War are rapidly spreading. Contrary to the initial concerns of various European nations, it is said that the United Kingdom has achieved an overwhelming victory against Qing China, securing treaty ports and war reparations. The UK formally declares that the war was a legitimate act of self-defense prompted by valid reasons, although many within Britain criticize its morality. Here are the details of the treaty...\n<Clause 1> [SCOPE.sCountry('chi_scope').GetName], henceforth, the Great Qing Emperor, and the British Monarch shall live in everlasting peace, with mutual friendship between the Chinese and British people. Residents of each other's countries shall enjoy protection of their lives and property...\n<Clause 2> [SCOPE.sCountry('chi_scope').GetName] grants a treaty port to the United Kingdom for Sino-British trade..."
lia_event_rtc.1.a:0 "We should swiftly expand our interests in Qing China!"
lia_event_rtc.1.b:0 "Is the apple of the Orient waiting for us to pick?"
lia_event_rtc.1.c:0 "Despite the Qing's defeat, it remains a formidable Eastern power. We should not kick them while they're down."



lia_event_rtc.3.t:0 "Signing the Treaty of Nanking"
lia_event_rtc.3.d:0 "Self-Strengthening Movement"
lia_event_rtc.3.f:1 "Twenty years ago, we, [SCOPE.sCountry('gbr_scope').GetName], were weak and vulnerable, victimized by barbarians and continuously plundered by great powers. Thus, we must build upon the foundation of the Qing dynasty, learn from the West to surpass the West, and strive for military and cultural development."
lia_event_rtc.3.a:0 "The mighty dragon shall awaken once again."

lia_event_rtc.4.t:0 "[SCOPE.sCountry('gbr_scope').GetName] - [SCOPE.sCountry('chi_scope').GetName] First Opium War"
lia_event_rtc.4.d:0 "[SCOPE.sCountry('gbr_scope').GetName] - [SCOPE.sCountry('chi_scope').GetName] The Former Glory of the Eastern Dragon Fades Away!"
lia_event_rtc.4.f:6 "Breaking News! Reports about a war unfolding in the Far East are rapidly spreading. Contrary to the initial concerns of various European nations, it is said that the United Kingdom has achieved an overwhelming victory against Qing China, securing treaty ports and war reparations. The UK formally declares that the war was a legitimate act of self-defense prompted by valid reasons, although many within Britain criticize its morality. Here are the details of the treaty...\n<Clause 1> [SCOPE.sCountry('chi_scope').GetName], acknowledging the material strength of China, seeks mutual happiness with England, recognizes British interests in China, and compensates for war losses to Britain\n<Clause 2> [SCOPE.sCountry('chi_scope').GetName] grants a treaty port to the United Kingdom for Sino-British trade..."
lia_event_rtc.4.a:0 "The era of the Celestial Empire has passed!"
lia_event_rtc.5.t:0 "The Taiping Rebellion"
lia_event_rtc.5.d:0 "Rebels Are Stirring!"
lia_event_rtc.5.f:0 "[SCOPE.sCountry('heavenly_kingdom_scope').GetName], these so-called rebels are wreaking havoc across Qing China, massacring the Manchu people wherever they go. To secure our future, we must suppress them swiftly."
lia_event_rtc.5.a:0 "The Mandate of Heaven for Qing shall not fall!"

lia_event_rtc.6.t:0 "The Taiping Heavenly Kingdom Movement"
lia_event_rtc.6.d:0 "Creating a New World!"
lia_event_rtc.6.f:0 "China finds itself in this dire situation today, trampled by Western powers due to the corruption of the Qing dynasty. Rising in fury, we seek to topple the Qing court."
lia_event_rtc.6.a:0 "Expel the Manchu invaders and restore China!"

lia_event_rtc.7.t:0 "[SCOPE.sCountry('heavenly_kingdom_scope').GetName]"
lia_event_rtc.7.d:0 "The Taiping Rebellion"
lia_event_rtc.7.f:2 "Massive rebellions have erupted across various regions of [SCOPE.sCountry('chi_scope').GetName]. The leader of [SCOPE.sCountry('heavenly_kingdom_scope').GetName] claims to be the son of God and the brother of Jesus, spreading strange Christian beliefs. We don't know how this rebellion will unfold, but one thing is certain: we must take action."
lia_event_rtc.7.a:0 "He is the son of God? This is inappropriate."
lia_event_rtc.7.b:0 "Is it time for the fall of the Qing dynasty? China needs a new order."
lia_event_rtc.7.c:0 "First, let us wait and see."

lia_event_rtc.8.t:0 "[SCOPE.sCountry('heavenly_kingdom_scope').GetName]"
lia_event_rtc.8.d:0 "The Taiping Rebellion"
lia_event_rtc.8.f:2 "Massive rebellions have erupted across various regions of [SCOPE.sCountry('chi_scope').GetName]. The leader of [SCOPE.sCountry('heavenly_kingdom_scope').GetName] claims to be the son of God and the brother of Jesus, spreading strange Christian beliefs. Can Qing China truly suppress this rebellion? What are the choices for the great powers?"
lia_event_rtc.8.a:0 "Is the fate of Qing truly sealed?"


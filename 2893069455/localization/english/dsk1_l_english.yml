DSK_russia.1.t:0 "A Backward Russia"
DSK_russia.1.d:0 "Reform is Urgent"
DSK_russia.1.f:0 "In 1836, Russia had not yet abolished the feudal serfdom system. Tsarist Russia was considered a weak link in the chain of imperialism. While England and France rapidly developed capitalism and entered the industrial era, Russia still retained the serfdom system. The outdated social system severely hindered socio-economic development. Without reform, Russia would forever fall behind the great powers and be trampled by England and France."
DSK_russia.1.d:0 "We Desperately Need Reform"
je_autocracy_of_the_tsar:0 "We Desperately Need Reform"
je_autocracy_of_the_tsar_reason:0 "During the reign of Nicholas I, he implemented a harsh authoritarian rule over Russia, aggressively expanding abroad, suppressing European revolutions, and serving as a European constitutional police, which brought Russia's feudal autocracy to its peak."
je_tge_military_reform:0 "Military Reform"
DSK_russia.1.a:0 "What Should We Do?"
modifier_autocracy_of_the_tsar:0 "Stubborn Landlord Class"
DSK_russia.2.t:0 "New Tsar Orders Reforms"
DSK_russia.2.d:0 "Alexander II Ascends the Throne"
DSK_russia.2.f:0 "Alexander II realized that the problems now exposed in Russia are essentially problems of the backwardness of Russian industry and political system compared to other countries on the European continent. Based on this judgment, reforming Russia's outdated political and economic system has become an imperative."
DSK_russia.2.a:0 "Alexander II will lead Russia towards the light"

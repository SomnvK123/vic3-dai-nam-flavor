#匈牙利议会############################################################################################################################################################################
je_aus_dual_monarchy_diet_of_hungary:0 "Hungarian Parliament"
je_aus_dual_monarchy_diet_of_hungary_reason:0 "#bold Seats of [concept_diet_of_hungary_loyalists]: #variable [ROOT.GetCountry.MakeScope.Var('diet_of_hungary_loyalists').GetValue|0]#!; Changed during [concept_election] due to the following #tooltippable;tooltip:[Country.GetTooltipTag],diet_of_hungary_loyalists_tooltip_advance conditions#!.\n#bold Seats of [concept_diet_of_hungary_radicals]: #variable [ROOT.GetCountry.MakeScope.Var('diet_of_hungary_radicals').GetValue|0]#!; Changed during [concept_election] due to the following #tooltippable;tooltip:[Country.GetTooltipTag],diet_of_hungary_radicals_tooltip_advance conditions#!.\n\nAfter the Compromise, a fundamental distinction between the two parts of the Dual Monarchy is that, unlike the Austrian part, [concept_magyar] does not consider itself a multiethnic entity but rather a Magyar national state. For Vienna, the Austro-Hungarian Compromise connected two autonomous parts within a supra-national state. For [concept_magyar], the Dual Monarchy is merely an external framework for two sovereign states. The restructured [concept_diet_of_hungary] disproportionately influences the affairs of the Dual Monarchy. They have actual veto power over any significant changes in the internal constitution of the Leithania, and they often use this right to influence each other's policies.\n\nThe Parliament quickly fell into power struggles between liberal [concept_diet_of_hungary_loyalists] and nationalist [concept_diet_of_hungary_radicals]. Considering the influence of [concept_diet_of_hungary] on the politics of the Dual Monarchy, it is best to avoid allowing [concept_diet_of_hungary_radicals] to dominate the Parliament, even if it means significant compromise and concessions.\n\n#bold When [concept_diet_of_hungary_radicals] exceed 200 seats, our legislative process will be severely hindered, and any federalization process will cease!#!"
diet_of_hungary_loyalists_tooltip_advance:0 "#variable Each cultural province of Hungary where loyalists exceed 30% increases loyalist seats by 1 each month during [concept_election].#!\n\n#variable Each cultural province of Hungary where radicals exceed 20% decreases loyalist seats by 2 each month.#!\n\n#bold Decreases by 5 seats each month under the following conditions:#!\n• #variable Hungarian cultural population reaches 20%.#!"
diet_of_hungary_radicals_tooltip_advance:0 "#variable Each cultural province of Hungary where radicals exceed 20% increases radical seats by 2 each month during [concept_election].#!\n\n#bold Increases by 5 seats each month under the following conditions:#!\n• #variable Hungarian cultural population reaches 20%.#!\n\n#variable Each cultural province of Hungary where loyalists exceed 30% decreases radical seats by 1 each month.#!"
diet_of_hungary_loyalists_tt: "Majority Party: #bold #blue Loyalists#! Seats: (#tooltippable #tooltip:[GetRawTextTooltipTag('diet_of_hungary_tension_tt')] #variable [ROOT.GetCountry.MakeScope.Var('diet_of_hungary_loyalists').GetValue|0]#!#!#!)#!."
diet_of_hungary_radicals_tt: "Majority Party: #bold #red Radicals#! Seats: (#tooltippable #tooltip:[GetRawTextTooltipTag('diet_of_hungary_tension_tt')] #variable [ROOT.GetCountry.MakeScope.Var('diet_of_hungary_radicals').GetValue|0]#!#!#!)#!."
diet_of_hungary_tension_tt:0 "Seats of factions in [concept_diet_of_hungary] that will affect the implementation of local policies"
status_diet_of_hungary_always:0 "No dominant faction in Parliament currently"
concept_diet_of_hungary:0 "Hungarian Parliament"
concept_diet_of_hungary_desc:0 "The restructured [concept_diet_of_hungary], convened annually in Budapest by the [concept_hungary_kindom] king, holds legislative power, composed of #variable House of Lords (Főrendiház)#! and #variable House of Representatives (Képviselőház)#!, the House of Lords is composed of hereditary members, church personnel, and representatives from autonomous regions, while the House of Representatives is elected by the 1874 [concept_election] law. These members are based on #variable Property, Tax, Occupations, or Official Positions as well as Hereditary Privileges#! complex [concept_election] election.\n[concept_election] Law further consolidates the dominance of Magyar elites. Its most important purpose is to remove the democratic speaking rights of economically disadvantaged groups by linking voting rights to taxes.\nElection boundaries are also being redrawn to make it harder for minority ethnic groups to dominate a constituency, which also appears to be damaging to the interests of other nations. [concept_diet_of_hungary] has the right to legislate on all matters concerning [concept_hungary_kindom], but for Croatia-Slavonia, the Parliament is only responsible for common issues with [concept_hungary_kindom].\nParliament has a lukewarm loyalty to Vienna, with no concessions made to minority demands."
concept_diet_of_hungary_loyalists:0 "Loyalists"
concept_diet_of_hungary_loyalists_desc:0 "The Habsburg loyalists in the Hungarian Parliament are primarily composed of a series of liberal and moderate parties led by the Liberal Party, which supports the compromise. The Liberal Party is popular among minority voters, but not among Hungarian voters, but the Liberal Party is often able to dominate the Parliament with the support of minorities, they are the cornerstone of Habsburg rule in Hungary."
concept_diet_of_hungary_radicals:0 "Opposition"
concept_diet_of_hungary_radicals_desc:0 "The opposition in the Hungarian Parliament is primarily composed of a series of nationalist parties led by the Radical Independent Party, which are dissatisfied with existing compromise policies and demand further autonomy and even full independence. They are usually supported by the majority of Hungarian voters, and they are also the biggest obstacle to Habsburg rule in Hungary."
diet_of_hungary_promote_loyalists_button:0 "Promote Loyalists"
diet_of_hungary_promote_loyalists_button_desc:0 "Through political maneuvers and bribes, we can get those who are wavering to stand on our side"
promote_loyalists_button_tt:0 "Loyalist parliamentary seats are less than 200"
promoting_loyalists_tt:0 "We will begin promoting loyalists"
cannot_promote_loyalists_twice_tt:0 "We cannot promote loyalists twice in a short period of time"
diet_of_hungary_loyalists_increase_25_tt:0 "Loyalist seats will increase by 25"
has_hungary_radicals:0 "There is opposition in Parliament"
diet_of_hungary_agroculture_button:0 "Subsidize Hungarian Agriculture"
diet_of_hungary_agroculture_button_desc:0 "Agriculture has always been a core industry in Hungary, subsidizing Hungarian agricultural products will improve our relations with Hungarian farmers"
diet_of_hungary_industy_button:0 "Subsidize Hungarian Industry"
diet_of_hungary_industy_button_desc:0 "Hungary's industrial strength is lagging behind, we can improve our relations with Hungarian industrialists by subsidizing Hungarian industrial products"
remove_diet_of_hungary_button2:0 "Revoke Hungarian Parliament"
remove_diet_of_hungary_button2_desc:0 "These nationalist MPs are out of control, to prevent further deterioration of the situation, we can send an army to dissolve Parliament"
diet_of_hungary_radicals_power_tt:0 "Opposition MPs occupy 280 seats or more in Parliament"
hungary_at_war_tt:0 "Hungarians may respond to our actions in some radical ways,,,,"
diet_of_hungary_modifier:0 "Hungarian Parliament"
hun_subsidies_cost_modifier:0 "Subsidy Cost"
hun_industy_subsidies_modifier:0 "Subsidies for Hungarian Industry"
hun_agricultural_subsidies_modifier:0 "Subsidies for Hungarian Agriculture"
obstruction_from_diet_of_hungary:0 "Obstruction from the Hungarian Parliament"
#二元君主制############################################################################################################################################################################
 je_aus_dual_monarchy_reform:0 "Dual Monarchy Reform"
je_aus_dual_monarchy_reform_reason:0 "Currently, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is determined to independently rule Inner Letania, and [SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName] appears well-suited to fulfill his will. Initially, [SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName] maintained moderate liberals in his government but also urged Czechs to re-engage in Inner Letania's political life and sought support from Poles. [SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName] exploited the government's fragile position to exert pressure on [concept_aus_conservative] members, compelling them to moderate their demands and resolve internal discord—otherwise, liberals could resurge. [SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName]'s political agenda is marked by evident political dealings, incorporating some progressive modern elements alongside catering to more conservative factions within [concept_aus_conservative]. The fragmented political landscape of [ROOT.GetCountry.GetName] favors the new government—[concept_aus_reichsrat] lacking a robust stable majority effectively safeguards #variable "royal sovereignty"#!. [SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName] can #bold assert dominance over various political factions #! in governing, akin to a #variable minister to [Concept('concept_ruler','$RULER_TITLE_KAISER$')], accountable solely to [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. #variable Now this new cabinet will lead the monarchy towards an uncertain future.#!"
je_aus_dual_monarchy_completed_reason_tt:0 "We have completed most of the Dual Monarchy reforms."
aus_dual_monarchy_reform_main_tt.1:0 "We must complete the restructuring of the empire."
finished_aus_dual_monarchy_reform_tt:0 "Dual Monarchy reform has been completed."
je_aus_dual_monarchy_reform_advance:0 "We have completed an item of the Dual Monarchy reform."
no_austria_hunary:0 "We lost Czech and Hungary."
aus_dual_monarchy_reform_modifiers:0 "Divided society"
je_aus_dual_monarchy_democracy_and_social:0 "Dual Monarchy Reform: Democracy and Social Reform"
je_aus_dual_monarchy_democracy_and_social_reason:0 "Measures ostensibly progressive also #bold curb progress #!, weakening political liberties, such as expanding [concept_election] rights. Through #bold [concept_election] reforms #!, the lower middle class (Mittelstand) has been integrated into Austrian political life. However, as a sacrifice to economic modernization, the middle class is #bold anti-liberal #!, making them susceptible to regimes that emphasize #bold social #! and #bold national orientations #!. Concurrently, to compete with Bismarck, at the suggestion of Emil Stambach, a Jewish convert, the cabinet has passed a slew of #bold social legislation #!, aiming to address the worst excesses of the new economy. Restrictions have been placed on #bold working hours, child labor, and female labor #! usage; an accident and disease insurance system for industrial workers has been introduced; the 1859 Free Industrial Code was replaced in 1882 by a new code that imposes #bold restrictive regulations #! on guilds and trade associations."
je_aus_dual_monarchy_municipal_council:0 "Dual Monarchy Reform: Co-opting other ethnic groups"
je_aus_dual_monarchy_municipal_council_reason:0 "To advance our reforms, we can gain support from #yellow Czechs #! and #yellow Galicians #! at the cost of sacrificing liberalism in political and administrative policies. Following the reform of the Bohemian Parliament's [concept_election] system, this institution, formerly dominated by Germans, has been handed over to #yellow Czechs #!, as seen in the creation of numerous aristocratic senators in 1881, transferring the former liberal upper house to conservatives. The most controversial was the 1880 Streymel Act, which stipulated that #bold Czech #! is one of the "foreign" languages of Bohemian and Moravian bureaucratic institutions, significantly reducing #yellow German #! bureaucratic positions."
bohemia_dual_monarchy_button:0 "Restructure the Bohemian Parliament"
bohemia_dual_monarchy_button_desc:0 "We will restructure the Bohemian Parliament to gain their support."
galicia_lodomeria_dual_monarchy_button:0 "Restructure the Galician Parliament"
galicia_lodomeria_dual_monarchy_button_desc:0 "We will restructure the Bohemian Parliament to gain their support."
aus_dual_monarchy_region_reform_tt:0 "We have decided to make concessions to other ethnic groups."
finished_aus_dual_monarchy_council_reform_tt:0 "We successfully reorganized the Bohemian and Galician Parliaments."
je_aus_dual_monarchy_pluralism:0 "Dual Monarchy Reform: Secularization and Pluralism"
je_aus_dual_monarchy_pluralism_reason:0 "[concept_aus_liberal] enhances the struggle against #variable anti-clericalism #! with Josephist tradition, directing their efforts towards #bold reducing church power #!. The bold May decree of 1868 #! repealed the transfer of marriage and educational rights in the 1855 educational covenant. One of the greatest achievements of the liberals was the establishment of an 8-year #bold free compulsory education #! for all children. In 1870, [Concept('concept_ruler','$RULER_TITLE_KAISER$')] himself abolished the educational covenant, in response to the infallibility proclamation of the pope, a threat to Habsburg authority. The empire also advanced the process of pluralism, with the December 1867 constitution establishing #variable equality before the law for all individuals, regardless of their religious beliefs #!, thus achieving full emancipation for #variable Austrian Jews #!. The provisions regarding #bold national rights #! directly borrowed from the 1848 Kroatsch constitution are a crucial step in the empire's pluralization."
je_aus_dual_monarchy_economy:0 "Dual Monarchy Reform: Founding Era (Grtnderjahre)"
je_aus_dual_monarchy_economy_reason:0 "In the early years of [concept_aus_liberal]'s ascendancy, the economy, driven by #variable laissez-faire policies #!, showed great optimism with massive investments, leading to surprising growth rates. These years are referred to as the #red "Founding Era" (Grtnderjahre) #!, where many industrial, financial, and commercial enterprises were established. The expansion of the #variable Vienna Ring Road #! symbolizes both growth and serves as a catalyst for growth. On either side of the symbolic main road of the capital city stands the "palaces" of the #bold Jewish banking dynasties #!, illustrating the success of Jewish entrepreneurs in the new economy and society's recognition of Jewish achievements—assuming the situation develops favorably."
finished_aus_dual_monarchy_economy_tt:0 "We have tripled GDP."
je_aus_dual_monarchy_military:0 "Dual Monarchy Reform: Military Reform"
je_aus_dual_monarchy_military_reason:0 "Since [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] accepted the compromise and became king of [concept_hungary_kindom], the division of the Austro-Hungarian Empire's army has gradually become apparent. The bold Army Decree of 1868 #! established the tone for the future military of the Dual Monarchy: the Austro-Hungarian army will consist of three parts, namely\n#variable Royal and Royal Local Defense Forces #! (local defense forces within the empire excluding [concept_hungary_kindom], not freely mobilized for internal operations),\n#variable Regular Joint Royal and Royal Army #! (with priority in conscription, responsible not only for external operations but also for internal pacification),\n#variable Royal [concept_hungary_kindom] Defense Forces #! (local defense forces belonging to the [concept_hungary_kindom] kingdom, enjoying conscription rights superior to the imperial army in Hungary),\nEstablishment of these three parts marks the birth of the complex military system of the Austro-Hungarian Empire."
je_aus_dual_monarchy_diplomacy:0 "Dual Monarchy Reform: Breaking Diplomatic Isolation"
je_aus_dual_monarchy_diplomacy_reason:0 "After losing the possibility of expansion in Germany and territories in Italy, the empire lost direction in its foreign policy. So much so that Bismarck mocked at the Berlin Conference, saying, #bold 'I've heard of people who refuse to eat their pigeons unless someone shoots them and roasts them for them, but I've never heard of anyone who insists that someone should pry open their mouths and forcibly shove the pigeon down their throat before they'll eat it.' #! We must find a #variable reliable ally #! to quickly break our diplomatic isolation."
aus_at_peace_tt:0 "Austria is at peace."
je_dual_monarchy_balkan:0 "Empire's Interests in the Balkans"
je_dual_monarchy_balkan_reason:0 "After the reforms of the Dual Monarchy, the empire's focus of diplomatic expansion shifted to the Balkans. #yellow Archduke Ferdinand #! and #yellow Elenthar #! proposed a grand #variable Balkan vision #!, based on the Bosnia provinces, to annex the renowned port city of #bold Salonika #! and connect it to the Habsburg Empire via a corridor through Macedonia and the new Pazar region, constructing a railway from Vienna to Salonika. Utilizing this port to open up trade from Austria's "backward areas" of Trieste and Fiume on the Adriatic Sea. Of course, [concept_magyar] opposed expansion in the Balkans as usual, but now without Berlin's support, #bold [concept_hungary_kindom] #! cannot stop Vienna anymore, especially since #yellow Archduke Ferdinand #! has never liked #bold [concept_hungary_kindom] #!. We must establish #variable hegemony in the Balkans #! to safeguard our interests. It's time to kick the Russians out of the Balkans."
#帝国联邦化############################################################################################################################################################################
je_dnf_possible_rework:0 "Imperial Federalization"
je_dnf_possible_rework_reason:0 "Once, our great pioneer #yellow Clemens Metternich #! proposed the federalization of Austria after the Napoleonic Wars, dividing the empire into five major regions. However, this proposal was vetoed by Emperor #yellow Franz #!. Now, with the federalization bill officially approved by [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], our empire will officially begin the process of federalization. While our federalization policy has been welcomed in the vast Slavic regions, [concept_magyar] has chosen to strongly resist federalization due to the reduction of privileges. Is federalization the panacea for the empire's national issues, or a catalyst for ethnic conflict?\n#red Note: Each federalization of a region will provoke dissatisfaction from [concept_magyar]! #!"
finished_aus_federation_reform_tt:0 "We have completed federalization nationwide."
bohemia_federation_button:0 "Establish Kingdom of St. Wenceslas"
bohemia_federation_button_desc:0 "Incorporate Bohemia into the federal system."
galicia_lodomeria_federation_button:0 "Establish Kingdom of Galicia and Lodomeria"
galicia_lodomeria_federation_button_desc:0 "Incorporate Galicia and Ruthenia into the federal system."
hungary_federation_button:0 "Reorganize Kingdom of St. Stephen"
hungary_federation_button_desc:0 "Reorganize the Kingdom of St. Stephen within the federal system."
transylvania_federation_button:0 "Establish Transylvania Council"
transylvania_federation_button_desc:0 "Incorporate Transylvania into the federal system."
croatia_federation_button:0 "Establish Kingdom of the Trinity"
croatia_federation_button_desc:0 "Incorporate Croatia into the federal system."
vojvodina_federation_button:0 "Establish Vojvodina Council"
vojvodina_federation_button_desc:0 "Incorporate Vojvodina into the federal system."
slovakia_federation_button:0 "Establish Nitra Council"
slovakia_federation_button_desc:0 "Incorporate Slovakia into the federal system."
aus_federation_reform_tt:0 "The empire has initiated the process of federalization."
dnf_invalid:0 "Must have at least 4 different Danubian cultural areas."

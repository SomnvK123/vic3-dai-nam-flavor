#事件链###########################################################################################################################################################################    
aus_dual_monarchy.1.t:0 "The Great Compromise"
aus_dual_monarchy.1.d:0 "After a disastrous defeat in the war against Prussia, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] could no longer ignore the demands of Hungary. Hungary, the largest historical national entity among the monarchies, provided vast resources without which the Habsburg Monarchy could not maintain its status as a great power. A swift agreement was reached with the Magyar leadership group. To his relief, Deák did not present new demands beyond what had already been agreed upon. This led to the Balance or 'Compromise,' under which the #yellow Austrian Empire#! was reorganized into the #yellow Austro-Hungarian Dual Monarchy#!."
aus_dual_monarchy.1.d2:0 "After a disastrous defeat in the war against Prussia and facing an increasingly tense situation with Hungary, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] could no longer ignore Hungary's demands. Hungary, the largest historical national entity among the monarchies, provided vast resources without which the Habsburg Monarchy could not maintain its status as a great power. A swift agreement was reached with the Magyar leadership group. To his relief, Deák did not present new demands beyond what had already been agreed upon. This led to the Balance or 'Compromise,' under which the #yellow Austrian Empire#! was reorganized into the #yellow Austro-Hungarian Dual Monarchy#!."
aus_dual_monarchy.1.f:0 "It was clear from the outset that the Compromise disregarded the other ethnic groups within the monarchy. At a critical ministerial council meeting, the conservative federalist Count #yellow Belcredi#! argued that the monarchy should not depend on specific ethnic groups but should transcend them all, and certainly not ignore the Slavs of this country. However, Baron #yellow Friedrich von Beust#!, the Prime Minister, had a different view: 'The Slavs of the monarchy will be distrustful of the new policy, of that I am sure; but the government cannot always treat all ethnic groups fairly. Thus, we must rely on those ethnic groups with the most vitality (Lebenskraft) for support... that is the Germans and [concept_magyar].' The ruler's response to the debate was unconventional, but the consequences were fatal: '#yellow Count Belcredi#!'s proposal may have been the least objectionable, but #yellow Baron Beust's#! plan should achieve the desired results more quickly.'"
aus_dual_monarchy.1.a:0 "We must accept this compromise."
aus_dual_monarchy.1.b:0 "Austria will forever be Austrian!"
aus_dual_monarchy.2.t:0 "The Taffy Reform"
aus_dual_monarchy.2.d:0 "To stabilize the country quickly after reorganization, [Concept('concept_ruler','$RULER_TITLE_KAISER$')] appointed his childhood friend [SCOPE.sCharacter('industrialists_ig_leader_scope').GetFullName] to organize a new government. Four months later, [SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName] formed the new cabinet known as [concept_aus_conservative], supported by various groups in the [concept_aus_reichsrat] such as Czechs, Poles, German priests, and German conservatives. This alliance consisted of former Austrian political 'outsiders' or 'right-wing' elements, who controlled fewer seats directly than the [concept_aus_liberal] or 'left-wing', but neither side was able to reach a majority of the 353 seats. Thus, with the Emperor's support, [SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName]'s [concept_aus_conservative] would hold the reins of the empire for a long time to come."
aus_dual_monarchy.2.f:0 "The failure of the Liberals lay in their past gerrymandering that had helped them in electoral geometry, their failure in the [concept_election] group of large landowners was decisive. But they still occupied nearly half of the seats, and many believed they would regain power in the next round of [concept_election], albeit after a lot of struggle. But they were wrong. The Liberals never regained a majority in the [concept_aus_reichsrat] after this, and [concept_aus_conservative] would destroy any ideas of Nellettania becoming a German free state."
aus_dual_monarchy.2.a:0 "'Making do' (Fortwursteln)"
aus_dual_monarchy.3.t:0 "The Future of the Dual Monarchy"
aus_dual_monarchy.3.d:0 "Our reforms and diplomatic achievements have temporarily stabilized the political situation of the empire, but the privileged position of [SCOPE.sCulture('hungarian_culture').GetName] remains a topic that the empire cannot avoid: the Austro-Hungarian Compromise gave [SCOPE.sCulture('hungarian_culture').GetName] an disproportionate influence over the affairs of the monarchy. The influence of the two parts of the monarchy on each other has also developed in an unbalanced manner. To curb this trend, some conservative politicians represented by [SCOPE.sCharacter('dual_monarchy_landowners_scope').GetLastName] proposed federalizing the empire to weaken Hungary's privileged position, although this radical proposal certainly angered the [SCOPE.sCulture('hungarian_culture').GetName] who enjoyed many privileges under the dual monarchy."
aus_dual_monarchy.3.f:0 "Although Hungary's ethnic composition is varied—Hungary is home not only to #bold [concept_magyar]#!, but also to a large number of [SCOPE.sCulture('slovak_culture').GetName], [SCOPE.sCulture('ukrainian_culture').GetName], [SCOPE.sCulture('romanian_culture').GetName], [SCOPE.sCulture('serb_culture').GetName], and [SCOPE.sCulture('croat_culture').GetName]—the laws promulgated in Budapest state that all citizens of the kingdom, regardless of their linguistic group, are equal members of the Hungarian nation. Other ethnic groups are considered linguistic minority groups with limited national rights. They are required to formally acknowledge the political identity of [SCOPE.sCulture('hungarian_culture').GetName] nationalism. "
aus_dual_monarchy.3.a:0 "We will go further and promote federalization of the empire."
aus_dual_monarchy.3.b:0 "We will maintain the status quo."
hungarian_unhappy_tt:0 "This decision will greatly displease the Magyars."
aus_dual_monarchy.4.t:0 "Balkan Hegemony"
aus_dual_monarchy.4.d:0 "We did it! After countless diplomatic maneuvers and armed conflicts, we have finally expelled the Russians from the Balkans, and the new Balkan order led by [ROOT.GetCountry.GetName] has emerged. Now is the time to establish a Balkan Federation controlled by us to consolidate our interests in the Balkans."
aus_dual_monarchy.4.f:0 "The first bullet to rise in the Balkans"
aus_dual_monarchy.4.a:0 "The hawk flag will forever fly over the Balkans."
aus_dual_monarchy.5.t:0 "Hungarian Parliament obstructs our legislation"
aus_dual_monarchy.5.d:0 "According to the Austro-Hungarian Compromise Treaty, [concept_diet_of_hungary] has practical veto power over major changes in the constitutional structure of territories under the [concept_aus_reichsrat], and they often use this power to influence policies. In the recent parliamentary elections, radicals achieved overwhelming victory, expressing dissatisfaction with our current policies by obstructing [concept_aus_reichsrat] legislation.\n#bold When radical party seats are less than or equal to 150, this obstruction amendment will be removed#!"
aus_dual_monarchy.5.f:0 "In Hungary, the liberal government led by Prime Minister István Tisza has been threatened by nationalist opposition, especially the radical independence party led by Ferenc Kossuth, son of the revolutionary leader. The opposition dismantled the parliament chamber, stormed out of the Budapest parliament, triggered a government crisis, and ultimately led to Tisza's resignation."
aus_dual_monarchy.5.a:0 "I'm doing this for your own good!"
aus_dual_monarchy.6.t:0 "Loyalists in the Hungarian Parliament regain the upper hand"
aus_dual_monarchy.6.d:0 "With loyalists returning to majority party status, [concept_diet_of_hungary]'s obstruction to [concept_aus_reichsrat] legislation has ceased, and we can finally breathe a sigh of relief."
aus_dual_monarchy.6.f:0 "Realists among Hungarian political leaders know that only within the framework of the Habsburg Monarchy can they retain Hungary's privileged position and even rely on the existence of their beloved kingdom. Given the struggles for national liberation among minority ethnic groups domestically, the situation in the Balkans, and Russia's expansionist policies, the possibility of an independent Magyar nation-state surviving is slim."
aus_dual_monarchy.6.a:0 "He has overcome himself, he loves the empire!"
aus_dual_monarchy.7.t:0 "Second Hungarian Uprising"
aus_dual_monarchy.7.d:0 "The Hungarian Parliament formally declares the deposition of our emperor from the position of King of Hungary in response to our advances, effectively putting both countries in a state of war."
aus_dual_monarchy.7.f:0 "Kids, what more can I say, Hungarians out!"
aus_dual_monarchy.7.a:0 "Crush them!"
dnf_events.1.t:0 "Danubian Federation"
dnf_events.1.d:0 "As nationalism grows stronger within our country, some scholars have proposed building an imperial federation around ethnicity. Drafting a constitution that ensures equality among all ethnicities aims to eliminate separatist sentiments. However, this radical proposal is likely to anger Hungarian nobles who enjoy many privileges under the Budapest-centered regime."

dnf_events.1.a:0 "We must now draft the 'Danubian Constitution'."
dnf_events.1.f:0 "For the Habsburg dynasty, the significant differences between different ethnicities necessitate the adoption of a federal state form."
danubian_federation_tt:0 "The country will be known as the Danubian Federation."
danubian_federation_tt2:0 "The country will be known as the Austro-Hungarian Empire."
dnf_events.2.t:0 "Federal Constitution: Bohemia and Slovakia"
dnf_events.2.d:0 "For centuries, Bohemia and Slovakia have been an integral part of the empire, hence they must be recognized in the new constitution, with some even calling for the incorporation of the lost province of Silesia."
dnf_events.2.a:0 "Let's proceed together!"
dnf_events.2.b:0 "Silesia must be restored."
dnf_events.2.f:0 "'Truth prevails.'"
dnf_events.3.t:0 "Federal Constitution: Romanian Issue"
dnf_events.3.d:0 "Most citizens in Transylvania are Romanians, many of whom aspire to unite with other Romanians. It is now time to consider whether their country should be recognized and integrated into our federation."
dnf_events.3.a:0 "We must merge with Romania."
dnf_events.3.b:0 "Better not to stir up trouble."
dnf_events.3.f:0 "'United as one.'"
dnf_events.4.t:0 "Federal Constitution: Galicia Issue"
dnf_events.4.d:0 "Our Galician territory is home to Poles and Ruthenians, a legacy of the partition of Poland. Elevating the status of Poles will surely anger neighboring countries with Polish territories, while recognizing these Ruthenians might be seen as demeaning by the Russians."
dnf_events.4.a:0 "We only recognize Poles."
dnf_events.4.b:0 "Both ethnicities should be treated equally."
dnf_events.4.c:0 "We only recognize Ruthenians."
dnf_events.4.e:0 "Better not to meddle in this mess."
dnf_events.4.f:0 "'Perhaps the trouble caused by the partition of Poland far outweighs its value...'"
dnf_events.5.t:0 "Federal Constitution: Italian Issue"
dnf_events.5.d:0 "We have held onto our territories in Italy. Nationalist sentiments among the Italian population there are on the rise; incorporating them into our constitution might curb separatism."
dnf_events.5.a:0 "Italians are an inseparable part of the federation."
dnf_events.5.b:0 "We must avoid adding fuel to the fire."
dnf_events.5.f:0 "'Safe journeys, Italy!'"
dnf_events.6.t:0 "Federal Constitution: Slovenian Issue"
dnf_events.6.d:0 "Slovenia has long been a part of the Austrian Empire. Should we elevate this ethnicity to the same status as other states?"
dnf_events.6.a:0 "Slovenians will be recognized in the new constitution."
dnf_events.6.b:0 "No need for that."
dnf_events.6.f:0 "'Little Europe.'"
dnf_events.8.t:0 "Future of the Federation"
dnf_events.8.d:0 "With all provinces approving the new 'Federal Constitution,' we may not have eliminated all differences, but our federation surely heralds a stable and progressive new era."
dnf_events.8.a:0 "Long live the Danubian Federation!"
dnf_events.8.b:0 "Long live the Greater Austro-Hungarian Empire!"
dnf_events.8.f:0 "For the Habsburg dynasty, the significant differences between different ethnicities necessitate the adoption of a federal state form."
dnf_events.9.t:0 "Danubian Disintegration"
dnf_events.9.d:0 "The dissolution of the 'Danubian River Constitution' is advantageous for German unity, causing a stir among Danubian elites who fear becoming second-class citizens again, hence demanding the retention of a federal political entity independent of the new Germany."
dnf_events.9.a:0 "As long as they remain our subjects, we will approve this request."
dnf_events.9.b:0 "Ignore them."
dnf_events.9.f:0 "'Equality or independence!'"
danubian_constitution_modifier:0 "Danubian Constitution"

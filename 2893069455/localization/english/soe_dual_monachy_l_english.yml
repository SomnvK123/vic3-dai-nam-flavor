je_dnf_dissolution:0 "Danube Dissolution"
je_dnf_dissolution_reason:0 "Establishing Germany or removing Danubian cultures would cause significant upheaval."
je_dnf_dissolution_goal:0 "Establishing Germany or removing Danubian cultures would cause significant upheaval."
cant_unify_italy_as_danubia_dumbass:0 "Our country can unify Italy."

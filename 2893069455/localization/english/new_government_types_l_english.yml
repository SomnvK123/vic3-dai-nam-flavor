# Monarchies
 gov_kingdom_anl:0 "Andalusian monarchy"
 gov_kingdom_anl_desc:2 "The [concept_government_type|l] of Andalusia; born from the union of the Kingdoms of Seville, Córdoba, Jaén and Granada. The [concept_head_of_state|l] is either the [Concept('concept_ruler','$RULER_TITLE_KING$')|l] or the [Concept('concept_ruler','$RULER_TITLE_QUEEN$')|l]. \n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_absolute_anl:0 "Andalusian crown"
 gov_absolute_anl_desc:2 "In this [concept_government_type|l], the [Concept('concept_ruler','$RULER_TITLE_KING$')|l] or [Concept('concept_ruler','$RULER_TITLE_QUEEN$')|l] of Seville, Córdoba, Jaén y Granada rules directly over the Andalusian Kingdoms.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 
 gov_val_catholic_theocracy:0 "Monastic order"
 gov_val_catholic_theocracy_desc:2 "In this [concept_government_type|l], the administration is run by a religious order. The [Concept('concept_ruler','$RULER_GRAN_MESTRE$')] also acts as [concept_head_of_state|l].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 RULER_GRAN_MESTRE:0 "Grand Master"
 
 gov_gib_absolute_county:0 "Absolute principality"
 gov_gib_absolute_county_desc:2 "In this [concept_government_type|l], the  [Concept('concept_ruler','$RULER_TITLE_PRINCE$')|l] or [Concept('concept_ruler','$RULER_TITLE_PRINCESS$')|l] rules above all.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_gib_county:0 "Principality"
 gov_gib_county_desc:2 "In this [concept_government_type|l]c, the [Concept('concept_ruler','$RULER_TITLE_PRINCE$')|l] or [Concept('concept_ruler','$RULER_TITLE_PRINCESS$')|l] is the [concept_head_of_state|l].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_gib_constitutional_county:0 "Constitutional principality"
 gov_gib_constitutional_county_desc:2 "In this [concept_government_type|l], a [Concept('concept_ruler','$RULER_TITLE_PRINCE$')|l] or [Concept('concept_ruler','$RULER_TITLE_PRINCESS$')|l] is the [concept_head_of_state|l], but the [Concept('concept_law','leyes')] are dictated by the constitution and [Concept('concept_votes','suffrage')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 
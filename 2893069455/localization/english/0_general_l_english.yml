    # Opium Promotion Related Text
je_qing_opium_plantation_potential: "Opium Promotion"
je_qing_opium_plantation_potential_desc: "Every two months, you can manually add opium plantation potential to a province within Qing territory that does not yet possess opium plantation potential."

button_qing_opium_add_potential: "Promote Opium Cultivation"
button_qing_opium_add_potential_desc: "Addicts begin growing opium on their own initiative"

modifier_qing_opium_plantation_throughput: "The People’s Fervor for Opium"
yapian_yinzhong: "Opium Promotion"
je_qing_opium_plantation_potential_reason: "With opium flowing into the country, addicts have taken to cultivating opium independently; the Qing Empire may one day outproduce the East India Company in opium output."

# Siberia Development Related Text
je_develop_siberia: "Siberian Colonization"
je_develop_siberia_complete_tt: "At least #bold 10#! #tooltippable;tooltip:[Country.GetTooltipTag]dsk_siberia_state Greater Siberian#! provinces must complete advanced development."
je_group_historical_content: "Far East Colonization"
develop_siberia: "Siberian Development"

develop_siberia_button_1: "Siberian Initial Development Plan"
develop_siberia_button_1_desc: "Establish a basic development framework in frontier Siberian regions with coal mines and logging camps."

develop_siberia_button_2: "Advanced Siberian Development"
develop_siberia_button_2_desc: "Further invest in railways, towns and forestry within Siberian regions with existing developmental foundations."

state_trait_siberian_frontier: "Siberian Frontier"
state_trait_siberian_frontier_desc: "The vast, frigid Siberian frontier holds abundant resources yet suffers from underdeveloped infrastructure, making exploitation extremely difficult."

state_trait_siberian_frontier_level_1: "Partially Developed Siberia"
state_trait_siberian_frontier_level_1_desc: "Expanding towns, forestry operations and road networks draw more migrants and capital to the Siberian frontier."

state_trait_siberian_frontier_level_2: "Prosperous Siberia"
state_trait_siberian_frontier_level_2_desc: Railways, mining and urban construction turn Siberia into a vital eastern pillar of the empire.

# Siberia Development Event Texts
siberia_development.1.t: "Opening the Siberian Frontier"
siberia_development.1.d: "Spreading towns and logging operations transform the frigid Siberian wilderness into a new imperial frontier."
siberia_development.1.f: "Carriages trudge along muddy tracks, and the sound of logging echoes through coniferous forests. New settlements spring up on the edge of the snowfields."
siberia_development.1.a: "The empire’s east awakens."

siberia_development.2.t: "Advanced Development of Siberia"
siberia_development.2.d: "Railways, towns and industrial facilities integrate Siberia more tightly into the national economic system."
siberia_development.2.f: "Rail tracks cut through forests and permafrost, with glowing lights illuminating new towns beside stations. The remote frontier blooms into prosperity."
siberia_development.2.a: "Press further eastward."

# Siberia Modifiers & Descriptions
siberian_development_completed_modifier: "Steady Siberian Development"
je_develop_siberia_lobby: "An Untapped Treasure Trove; We Must Exploit It Systematically"
siberian_frontier_industrialists_support_modifier: "Siberian Development Opportunities"
siberian_frontier_industrialists_support_modifier_desc: "Industrialists eye lucrative investment opportunities in Siberian mineral resources, timber and railways brought by territorial development."

siberian_industrialists_ascendant_modifier: "Rise of Siberian Industrialists"
siberian_industrialists_ascendant_modifier_desc: "Industrialization across Siberia bolsters the economic standing and political influence of local industrial magnates."
modifier_develop_siberia: "Grand Siberian Development Campaign"
modifier_develop_siberia_desc: "The state allocates massive industrial resources to advance the Siberian development initiative."

# Siberia Development Status Tooltips
je_develop_siberia_reason_initial: "#bold Development Status: Initial Success#!\nThe Siberian development program has begun bearing fruit."
je_develop_siberia_reason_booming: "#bold Development Status: Full Swing#!\nSiberian development has entered a booming phase."
je_develop_siberia_reason_final: "#bold Development Status: Nearing Completion#!\nThe Siberian development program draws to a close."
je_develop_siberia_reason_completed: "#bold Development Status: Fully Completed#!\nThe Siberian development program has been finished in full."
je_develop_siberia_reason: "The Siberian development program is ongoing."

# Siberian Resettlement Mechanics
je_develop_siberia_resettlement_button: "Organize Siberian Migrations"
je_develop_siberia_resettlement_button_desc: "Relocate a portion of the population from integrated non-Siberian homeland territories to a migrant-receptive Siberian province."

new_siberia_events.1.t: "Organize Siberian Resettlement"
new_siberia_events.1.d: "The government has designated [SCOPE.sState('siberia_resettlement_source').GetName] as the origin region, planning to relocate part of its populace to [SCOPE.sState('siberia_resettlement_target').GetName]."
new_siberia_events.1.f: "Imperial edicts are issued; officials conduct household censuses and arrange transport caravans and supplies. For many, this means leaving their hometowns yet embarking on a new life."
new_siberia_events.1.a: "Resettle them in [SCOPE.sState('siberia_resettlement_target').GetName]"
new_siberia_events.1.a.tt: "#v 5%#! of the population will be relocated from [SCOPE.sState('siberia_resettlement_source').GetName] to [SCOPE.sState('siberia_resettlement_target').GetName]."

je_develop_siberia_resettlement_button: "Organize Siberian Migrations"
je_develop_siberia_resettlement_button_desc: "Relocate a portion of the population from integrated non-Pan-Siberian homeland territories to a migrant-receptive Pan-Siberian province."
je_develop_siberia_resettlement_button_possible_tt: "Requires at minimum one integrated non-Pan-Siberian province eligible for population outflow, plus at least one integrated Pan-Siberian target province accepting migrants."


l_english:
 
 
 subject_type_liberty_alliance:0 "[concept_liberty_alliance]"
 
 liberty_alliance:0 "Liberty Alliance"
 liberty_alliance_action_name:0 "[concept_liberty_alliance]"
 liberty_alliance_action_propose_name:0 "Make into [concept_liberty_alliance]"
 liberty_alliance_action_break_name:0 "Grant Independence"
 liberty_alliance_action_ask_to_break_name:0 "Demand Independence"
 liberty_alliance_desc:1 "#header $liberty_alliance$#!\n$TOOLTIP_DELIMITER$\nA [concept_diplomatic_pact] that establishes a [concept_liberty_alliance] type [concept_subject] relationship between two [Concept('concept_country', '$concept_countries$')]."
 liberty_alliance_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is in a [concept_liberty_alliance] under [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
 liberty_alliance_action_notification_name:0 "Demand for Union"
 liberty_alliance_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] demands that we submit to them and form a [concept_liberty_alliance]."
 liberty_alliance_action_notification_break_name:0 "Independence Granted"
 liberty_alliance_action_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] have ended our [concept_liberty_alliance]. We are independent once again."
 liberty_alliance_proposal_notification_break_name:0 "Demand for Independence"
 liberty_alliance_proposal_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] are demanding that we end our [concept_liberty_alliance] with them."
 liberty_alliance_proposal_notification_break_effects_desc:0 "If we accept, they will become fully independent."
 liberty_alliance_proposal_break_accepted_name:0 "Independence Granted"
 liberty_alliance_proposal_break_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepted the demand to end our [concept_liberty_alliance]. We are independent once again."
 liberty_alliance_proposal_break_declined_name:0 "Independence Refused"
 liberty_alliance_proposal_break_declined_desc:0 "[TARGET_COUNTRY.GetName] refused the demand to end our [concept_liberty_alliance]."
 liberty_alliance_proposal_third_party_break_accepted_name:0 "Independence Granted"
 liberty_alliance_proposal_third_party_break_accepted_desc:0 "[TARGET_COUNTRY.GetName] ended their [concept_liberty_alliance] with [INITIATOR_COUNTRY.GetName], granting them full independence."
 liberty_alliance_proposal_third_party_break_declined_name:0 "Independence Refused"
 liberty_alliance_proposal_third_party_break_declined_desc:0 "[TARGET_COUNTRY.GetName] refused to end their [concept_liberty_alliance] with [INITIATOR_COUNTRY.GetName]."
  
 liberty_alliance_trigger_desc_global:0 "Is in a [concept_liberty_alliance]"
 liberty_alliance_trigger_false_desc_global:0 "Is #b not#! in a [concept_liberty_alliance]"
 liberty_alliance_trigger_desc_first:0 "[TARGET_COUNTRY.GetName] is in a [concept_liberty_alliance] with [COUNTRY.GetAdjectiveNoFlag]"
 liberty_alliance_trigger_false_desc_first:0 "[TARGET_COUNTRY.GetName] is #b not#! in a [concept_liberty_alliance] with [COUNTRY.GetAdjectiveNoFlag]"
 liberty_alliance_trigger_desc_third:1 "[COUNTRY.GetName] is in a [concept_liberty_alliance] under [AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)]"
 liberty_alliance_trigger_false_desc_third:1 "[COUNTRY.GetNameNoFlag] is #b not#! in a [concept_liberty_alliance] under [AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetName)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)]"
 liberty_alliance_effect_desc_first:0 "[TARGET_COUNTRY.GetName] joins [concept_liberty_alliance] with [COUNTRY.GetName]"
 
 

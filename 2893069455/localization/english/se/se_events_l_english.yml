l_english:
#SE
 serb_events.1.t:0 "Allies Found"
 serb_events.1.d:0 "In between the hammer and the anvil - the Ottoman and Austrian empires - Serb people have found the ally they needed."
 serb_events.1.a:0 "For the glory of the Serb people!"
 
 serb_events.2.t:0 "Serb Homelands Returned"
 serb_events.2.d:0 "With Russia at our back, the time was ripe to return the historical lands of the Serb people."
 serb_events.2.a:0 "For the glory of Serbia!"
 
 serb_events.3.t:0 "Greater Serbia"
 serb_events.3.d:0 "With the core Serbian provinces secured, we have outgrown a mere Principality and can call ourselves a Kingdom of Serbia."
 serb_events.3.a:0 "For the glory of the Kingdom of Serbia!"
 
 serb_events.4.t:0 "Kingdom of Serbs, Croats and Slovenes"
 serb_events.4.d:0 "With our Slavic brothers still living under the opressing feet of the nearby empires, we need to free them and form the first truly pan-Slavic state."
 serb_events.4.a:0 "For the glory of the Kingdom of Serbs, Croats and Slovenes!"
 
 serb_events.9.t:0 "Request to Annex Country"
 serb_events.9.d:0 "Monetenegro has requested to be a part of our country."
 serb_events.9.a:0 "Let's do it!"
 serb_events.9.b:0 "Not right now."
je_seeking_allies:0 "Seeking Allies"
 je_seeking_allies_goal:0 "In between the hammer and the anvil - the Ottoman and Austrian empires - Serb people need to look for allies further to the east."
 je_seeking_allies_reason:0 "Finding allies is paramount if we want to gain our independence and form a country for all the Serbs."
 je_serb_homelands:0 "Serb Homelands"
 je_serb_homelands_reason:0 "With Russia at our back, the time is ripe to unite all the homelands of the Serb people."
 je_greater_serbia:0 "Greater Serbia"
 je_greater_serbia_reason:0 "With the core Serbian provinces secured, there are still Serbian people living outside of our country. We should seek unity with all of them."
 je_kingdom_of_serbs_croats_slovenes:0 "Kingdom of Serbs, Croats and Slovenes"
 je_kingdom_of_serbs_croats_slovenes_reason:0 "With our Slavic brothers still living under the opressing feet of the nearby empires, we need to free them and form the first truly pan-Slavic state."
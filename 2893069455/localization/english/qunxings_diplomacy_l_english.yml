 recognize_country_proposal_notification_effects_desc:0 "$recognize_country_action_name$"
 get_recognized_country_proposal_accepted_name:0 "Accept $get_recognized_country_action_name$"
 get_recognized_country_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] agreed to recognize us to the world."
 get_recognized_country_proposal_declined_name:0 "Reject $merge_subject_action_name$"
 get_recognized_country_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] refused to recognize us to the world."
 get_recognized_country_proposal_third_party_accepted_name:0 "Accept $merge_subject_action_name$"
 get_recognized_country_proposal_third_party_accepted_desc:0 "[INITIATOR_COUNTRY.GetName] was recognized on the world stage by [TARGET_COUNTRY.GetName], a new era is upon us."
 get_recognized_country_proposal_third_party_declined_name:0 "Reject $merge_subject_action_name$"
 get_recognized_country_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName] refused to recognized [INITIATOR_COUNTRY.GetName] we may need to be rise up on the world stage by force of arms!"
 recognize_country_desc:0 "#header $recognize_country$#!\n$TOOLTIP_DELIMITER$\nA kind of [concept_instant_diplomatic_action] that can recognize other countries on the world stage."
 get_recognized_country_proposal_notification_name:0 "Propose $get_recongized_action_name$"

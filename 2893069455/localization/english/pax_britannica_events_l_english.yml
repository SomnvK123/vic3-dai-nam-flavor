l_english:
  pax_britannica_events.1.t:0 "Colonial Bureaucracy"
  pax_britannica_events.1.d:0 "Across the Empire, bureaucrats vital to representing our interests complain of their working conditions and are requesting new staff."
  pax_britannica_events.1.f:0 "“In any bureaucracy, the people devoted to the benefit of the bureaucracy itself always get in control and those dedicated to the goals that the bureaucracy is supposed to accomplish have less and less influence, and sometimes are eliminated entirely.”#!#!\n\n- Pournelle's iron law of bureaucracy"
  pax_britannica_events.1.a:0 "They shall have it"
  pax_britannica_events.1.b:0 "The state has better things to do"

  pax_britannica_events.2.t:0 "Sailors' Wages"
  pax_britannica_events.2.d:0 "The men of the merchant navy, keeping the goods flowing, are demanding a wage stipend."
  pax_britannica_events.2.f:0 "“Merchant navy is not just a job, it’s a way of life. We navigate the world’s oceans, carrying goods and fostering trade.”#!#!\n– Unknown"
  pax_britannica_events.2.a:0 "They shall have it"
  pax_britannica_events.2.b:0 "They are paid well enough"

  pax_britannica_events.3.t:0 "Fruitful Market Conditions"
  pax_britannica_events.3.d:0 "In the ever-evolving world, [ROOT.GetCountry.GetAdjectiveNoFormatting] interests are perfectly positioned to capitalise - in the most literal sense of the word."
  pax_britannica_events.3.f:0 "“In trading/investing, it’s not about how much you make but rather how much you don’t lose.”#!#!\n\n- Bernard Baruch"
  pax_britannica_events.3.a:0 "Good times ahead"
  pax_britannica_events.3.b:0 "We should leverage our global position to take the lead in developing markets"

  pax_britannica_events.4.t:0 "The World Is Watching"
  pax_britannica_events.4.d:0 "Newspapers across the globe are discussing the ongoing political process in the country, captivated by their hegemon's domestic politics."
  pax_britannica_events.4.f:0 "“It will be of little avail to the people that the laws are made by men of their own choice if the laws be so voluminous that they cannot be read, or so incoherent that they cannot be understood.”\n#!#!- James Madison"
  pax_britannica_events.4.a:0 "They shall witness the proper legal process unfold"
  pax_britannica_events.4.b:0 "We must set an example!"

  pax_britannica_events.5.t:0 "Long Live [SCOPE.sC('pax_britannica_target').GetNameNoFormatting]!"
  pax_britannica_events.5.d:0 "The people are swept up in patriotic furore. Public support for our war to protect [SCOPE.sC('pax_britannica_target').GetName] from [SCOPE.sC('pax_britannica_initiator').GeAdjective] aggression is soaring."
  pax_britannica_events.5.f:0 "“No bastard ever won a war by dying for his country. He won it by making the other poor dumb bastard die for his country.”#!#!\n\n- George S. Patton"
  pax_britannica_events.5.a:0 "[SCOPE.sC('pax_britannica_target').GetNameNoFormatting] is in our hearts"

  pax_britannica_events.6.t:0 "[SCOPE.sC('pax_britannica_target').GetAdjectiveNoFormatting] Blood"
  pax_britannica_events.6.d:0 "The [SCOPE.sC('pax_britannica_initiator').GetAdjective] invasion of [SCOPE.sC('pax_britannica_target').GetName] continues while we sit on our hands and watch."
  pax_britannica_events.6.f:0 "“Why die for Danzig?”#!#!\n\n- Marcel Déat"
  pax_britannica_events.6.b:0 "They shall have to fend for themselves"

  pax_britannica_events.7.t:0 "The Doves"
  pax_britannica_events.7.d:0 "A protest group, styling themselves as the Dove movement, has grown in opposition to our more adventurous foreign policy goals"
  pax_britannica_events.7.f:0 "“Observe good faith and justice toward all nations. Cultivate peace and harmony with all.”#!#!\n\n- George Washington"
  pax_britannica_events.7.a:0 "Perhaps they have a point"
  pax_britannica_events.7.b:0 "They don't understand what we're building"

  pax_britannica_events.8.t:0 "The Policy of Administration"
  pax_britannica_events.8.d:0 "There is growing contempt among politicians towards the civil service - filled as it is with career bureaucrats making sport of mental gymnastics designed to deter politicians from taking any decisive actions."
  pax_britannica_events.8.f:0 "“Yes, yes, yes, I do see that there is a real dilemma here. In that, while it has been government policy to regard policy as a responsibility of Ministers and administration as a responsibility of Officials, the questions of administrative policy can cause confusion between the policy of administration and the administration of policy, especially when responsibility for the administration of the policy of administration conflicts, or overlaps with, responsibility for the policy of the administration of policy.”#!#!\n\n- Sir Humphrey Appleby"
  pax_britannica_events.8.a:0 "Rattle some cages, shake up the rusting establishment"
  pax_britannica_events.8.b:0 "It is fruitful work"

  pax_britannica_events.9.t:0 "Preferential Trade"
  pax_britannica_events.9.d:0 "A consortium of trading companies is lobbying the government for preferential trading agreements - by their very nature exploitative towards the trading partners dependent on [ROOT.GetCountry.GetAdjectiveNoFormatting] goods"
  pax_britannica_events.9.f:0 "“Most financiers, corporate lawyers, lobbyists, and management consultants are competing with other financiers, lawyers, lobbyists, and management consultants in zero-sum games that take money out of one set of pockets and put it into another.”#!#!\n\n- Robert Reich"
  pax_britannica_events.9.a:0 "They can lobby all they like, we won't budge"
  pax_britannica_events.9.b:0 "Domestic interests come first, after all"

  pax_britannica_events.10.t:0 "Smuggling Rings"
  pax_britannica_events.10.d:0 "A recent scandal has found significant involvement of [ROOT.GetCountry.GetAdjectiveNoFormatting] companies smuggling goods into foreign markets"
  pax_britannica_events.10.f:0 "“Forbid a man to think for himself or to act for himself and you may add the joy of piracy and the zest of smuggling to his life.”#!#!\n\n- Elbert Hubbard"
  pax_britannica_events.10.a:0 "Crack down"
  pax_britannica_events.10.b:0 "They should be buying [ROOT.GetCountry.GetAdjectiveNoFormatting] anyway"

  pax_britannica_events.11.t:0 "The [ROOT.GetCountry.GetAdjectiveNoFormatting] Connection"
  pax_britannica_events.11.d:0 "It has come to the government's attention that a significant number of private export businesses owe their roots to the criminal underworld."
  pax_britannica_events.11.f:0 "“Judges, lawyers and politicians have a license to steal. We don't need one.”#!#!\n\n- Carlo Gambino"
  pax_britannica_events.11.a:0 "This will not do"
  pax_britannica_events.11.b:0 "Legitimise them"

  pax_britannica_events.12.t:0 "A Finger On The Scales"
  pax_britannica_events.12.d:0 "Corruption among the merchant class, representing [ROOT.GetCountry.GetAdjectiveNoFormatting] interests abroad, are beginning to reflect poorly on us."
  pax_britannica_events.12.f:0 "“The more corrupt the state, the more numerous the laws.”#!#!\n\n- Tacitus"
  pax_britannica_events.12.a:0 "Comprehensively review every trader's scruples"
  pax_britannica_events.12.b:0 "Who cares?"

  pax_britannica_events.13.t:0 "Propaganda Piece"
  pax_britannica_events.13.d:0 "Ambassadors abroad have begun displaying particularly evocative art depicting a highly idealistic [ROOT.GetCountry.GetAdjectiveNoFormatting] life, to the point of tastelessness."
  pax_britannica_events.13.f:0 "“Patriotism is the virtue of the vicious.”#!#!\n\n-Oscar Wilde"
  pax_britannica_events.13.a:0 "Tone it down"
  pax_britannica_events.13.b:0 "Distribute these to the masses"

  pax_britannica_events.14.t:0 "The Starving Artist"
  pax_britannica_events.14.d:0 "Recently, the papers have told the tale of Julian Walt, a popular artist on the verge of bankruptcy. They have managed to coax him to returning to his birthplace of [ROOT.GetCountry.GetAdjective] without a penny to his name, and now look expectantly to the government."
  pax_britannica_events.14.f:0 "“The trouble with being poor is that it takes up all your time.”#!#!\n\n- Willem de Kooning"
  pax_britannica_events.14.a:0 "Help the man on his feet"
  pax_britannica_events.14.b:0 "Give him a civil service job"

  pax_britannica_events.141.t:0 "Masterpiece Dedicated"
  pax_britannica_events.141.d:0 "Recently repatriated Julian Walt has unveiled his new painting - a magnificent depiction of Britannia herself, cradling civilisation in her arms."
  pax_britannica_events.141.f:0 "In the stroke of a brush, Britannia emerges from the canvas, a majestic testament to the empire's grace. The artist's palette weaves a tapestry of dominance, capturing the spirit of a nation that commands the seas and the very essence of civilization. The masterpiece stands as a visual ode to Britain's unyielding hegemony, where art becomes a mirror reflecting the empire's indomitable splendour."
  pax_britannica_events.141.a:0 "Rule Britannia!"

  pax_britannica_events.142.t:0 "Mockery Dedicated"
  pax_britannica_events.142.d:0 "Recently repatriated Julian Walt has, after working tirelessly for the civil service, unveiled a scathing new painting depicting the apparent tedium and drudgery of life in [ROOT.GetCountry.GetAdjective]. Furthermore, he has used this public spectacle as a means to enter public life as a crusader for change on behalf of the downtrodden masses."
  pax_britannica_events.142.f:0 "Brushstrokes laden with satire, the artist unveils a canvas that dances on the edge of rebellion. Through a prism of mockery, the mundane rituals of [ROOT.GetCountry.GetAdjectiveNoFormatting] society are laid bare, a scathing commentary on the drudgery that hides behind the façade of order. The painting whispers dissent, challenging the status quo with every stroke, urging society to break free from the chains of monotony."
  pax_britannica_events.142.b:0 "He should be thankful for the work!"

  pax_britannica_events.15.t:0 "Boom And Bust"
  pax_britannica_events.15.d:0 "Legacy manufacturing businesses, those which kickstarted the initial days of the industrial revolution, are failing to compete in today's global economy."
  pax_britannica_events.15.f:0 "The winds of change blow unforgivingly, forcing these giants to adapt or face obsolescence, as the echoes of their past reverberate through the fading halls of industry."
  pax_britannica_events.15.a:0 "Bail them out"
  pax_britannica_events.15.b:0 "The free market will do as it must"

  pax_britannica_events.21.t:0 "Surprisingly Efficient"
  pax_britannica_events.21.d:0 "The wheels of brueaucracy turn rapidly, despite the common beliefs to the contrary, generating a surplus of useful activity."
  pax_britannica_events.21.f:0 "The true artistry lies in the seamless dance of paperwork, where the seemingly ponderous bureaucracy reveals its agile grace, orchestrating the symphony of governance with an unexpected swiftness."
  pax_britannica_events.21.a:0 "The world should take notice"

  pax_britannica_events.17.t:0 "Touring The Globe"
  pax_britannica_events.17.d:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting] diplomats are embarking upon an ambitious tour of global proportions, promoting [ROOT.GetCountry.GetAdjectiveNoFormatting] culture and institutions."
  pax_britannica_events.17.f:0 "From the grand halls of London to the distant shores, these diplomats weave a narrative of [ROOT.GetCountry.GetAdjectiveNoFormatting] prowess, promoting the virtues of a global empire; armed not with weapons, but with the cultural arsenal of the empire."
  pax_britannica_events.17.a:0 "They should promote the global order we champion"
  pax_britannica_events.17.b:0 "They should promote [ROOT.GetCountry.GetAdjective] itself"

  pax_britannica_events.18.t:0 "Ruthless Competition"
  pax_britannica_events.18.d:0 "The world over, [ROOT.GetCountry.GetAdjectiveNoFormatting] traders are outcompeting their rivals with the limitless resources of the global empire at their backs."
  pax_britannica_events.18.f:0 "As the sun never sets on the [ROOT.GetCountry.GetAdjectiveNoFormatting] Empire, so too do the traders under its banner cast a formidable shadow across global markets. With astute business acumen and the might of imperial networks, [ROOT.GetCountry.GetAdjectiveNoFormatting] merchants outpace their foreign counterparts in a relentless race for economic supremacy. The bustling markets bear witness to the prowess of [ROOT.GetCountry.GetAdjectiveNoFormatting] trade, where shrewd negotiations and maritime dominance converge, ensuring that the Union Jack flutters not only in the high seas but also atop the peaks of commercial success."
  pax_britannica_events.18.a:0 "As they should"
  pax_britannica_events.18.b:0 "Surely we can leverage our position of dominance even more"

  pax_britannica_events.19.t:0 "Industrial Boom"
  pax_britannica_events.19.d:0 "Amid growing confidence in [ROOT.GetCountry.GetAdjectiveNoFormatting] hegemony, [ROOT.GetCountry.GetAdjectiveNoFormatting] industries are bearing the fruits of their labour like never before. Everyone is buying [ROOT.GetCountry.GetAdjectiveNoFormatting]."
  pax_britannica_events.19.f:0 " From the humming factories to the bustling markets, the spirit of enterprise thrives. [ROOT.GetCountry.GetAdjectiveNoFormatting] businesses, like titans of industry, stand tall, their success echoing the symphony of a nation on the rise. In the crucible of innovation, these enterprises forge economic destinies, transforming challenges into opportunities."
  pax_britannica_events.19.a:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting] goods represent us"
  pax_britannica_events.19.b:0 "We should squeeze every drop of blood from that stone"

  pax_britannica_events.20.t:0 "Trading Hegemony"
  pax_britannica_events.20.d:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting] merchants are making money hand over fist with the protection of the Royal Navy ensuring free trade."
  pax_britannica_events.20.f:0 ""In the tranquil waters of global peace, the sails of prosperity catch the wind, propelling merchants to unparalleled heights of wealth. With the specter of conflict banished from the seas, trade routes become veins through which fortune flows."
  pax_britannica_events.20.a:0 "Commerce is our lifeblood"

  pax_britannica_events.16.t:0 "Cunning Colonial Administration"
  pax_britannica_events.16.d:0 "The bureaucrats running the empire are constantly coming up with new, more efficient ways to do their work."
  pax_britannica_events.16.f:0 "From streamlined bureaucracies to cutting-edge technologies, these overseers pioneer a legacy of administrative prowess. Efficiency becomes the watchword, as the empire overseas transforms into a well-oiled machine, guided by the relentless pursuit of progress and the indomitable spirit of innovation."
  pax_britannica_events.16.a:0 "Excellent"
  pax_britannica_events.16.b:0 "Bring them here, we could use that"

  pax_britannica_events.22.t:0 "Patriotica"
  pax_britannica_events.22.d:0 "The people are content, to the point of growing festive. Gaudy displays of national affection and patriotism are becoming commonplace."
  pax_britannica_events.22.f:0 "From bustling cities to tranquil villages, the Union Jack becomes more than a flag; it is a symbol of shared identity and national pride. The collective spirit swells with a deep-seated love for country, uniting the diverse tapestry of citizens under the banner of a singular allegiance."
  pax_britannica_events.22.a:0 "They have every reason to be proud"

  pax_britannica_events.23.t:0 "Pax Populi"
  pax_britannica_events.23.d:0 "The people may not agree with all of the government's policies, but they cannot argue with the results."
  pax_britannica_events.23.f:0 "From the halls of power to the furthest reaches of the nation, satisfaction becomes the prevailing sentiment."
  pax_britannica_events.23.a:0 "We will work together to create a better future"

  pax_britannica_events.24.t:0 "The [ROOT.GetCountry.GetAdjectiveNoFormatting] Academy of Sciences"
  pax_britannica_events.24.d:0 "Academics from across the world flood to [ROOT.GetCountry.GetAdjective]'s shores to do their cutting-edge work."
  pax_britannica_events.24.f:0 " In this epoch of enlightenment, breakthroughs cascade, and the frontiers of understanding expand, heralding a golden age where the sciences flourish as beacons of human achievement."
  pax_britannica_events.24.a:0 "We are a nation of inventors"

  pax_britannica_events.25.t:0 "Concorde Internationale"
  pax_britannica_events.25.d:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting] hegemony, while decried by many, brings the world ever closer towards peace and cooperation."
  pax_britannica_events.25.f:0 "In a world where the resonance of conflict is silenced, international harmony becomes the sweet melody of diplomacy. Nations, once separated by mistrust and discord, now dance to the tune of collaboration. The diplomacy of understanding and compromise paints a canvas of unity across borders."
  pax_britannica_events.25.a:0 "It is a communal effort"
  pax_britannica_events.25.b:0 "We should get all the credit"

  pax_britannica_events.26.t:0 "Expat Experts"
  pax_britannica_events.26.d:0 "Many [ROOT.GetCountry.GetAdjectiveNoFormatting] intellectuals are finding the flourishing colonies to be terrific places to conduct their work."
  pax_britannica_events.26.f:0 "From colonial academies to bustling marketplaces, the intellectual renaissance transcends oceans and borders. The colonies become crucibles of innovation, nurturing a generation of thinkers who meld the wisdom of the homeland with the vibrancy of new perspectives."
  pax_britannica_events.26.a:0 "Sounds ideal"
  pax_britannica_events.26.b:0 "Try to coax them back here"

  pax_britannica_events.27.t:0 "Credit Where Credit's Due"
  pax_britannica_events.27.d:0 "Financial institutions is enjoying a healthy boom as prosperity encourages borrowing."
  pax_britannica_events.27.f:0 "Their ledgers, like symphonies of economic orchestration, echo the vibrant pulse of a flourishing society. From the bustling streets of financial districts to the quiet halls of investment, the wheels of commerce turn tirelessly."
  pax_britannica_events.27.a:0 "Another feather in our cap"
  pax_britannica_events.27.b:0 "They know who to thank for that, don't they?"

  pax_britannica_events.28.t:0 "Solid Surplus"
  pax_britannica_events.28.d:0 "Confidence is at an all time high, and [ROOT.GetCountry.GetAdjectiveNoFormatting] businesses are reaping the benefits more than anybody else."
  pax_britannica_events.28.f:0 "The engines of industry hum with ceaseless activity, and the markets pulse with the energy of commerce. From innovation-fueled enterprises to the bustling trade routes, every sector contributes to the symphony of economic success."
  pax_britannica_events.28.a:0 "There is always more trading we could do"
  pax_britannica_events.28.b:0 "Our domestic industries should benefit the most"

  pax_britannica_events.29.t:0 "Tax Britannica"
  pax_britannica_events.29.d:0 "Money is literally piling up, faster than it can be allocated to the treasury."
  pax_britannica_events.29.f:0 "The vaults, once modest repositories, now burgeon with the spoils of economic triumph. The golden era witnesses the amassing of fortunes on a grand scale, like tides of prosperity swelling to new heights. From opulent estates to glittering urban centers, the signs of affluence are writ large."
  pax_britannica_events.29.a:0 "The people should benefit from this prosperity the most"
  pax_britannica_events.29.b:0 "But it will be added to the treasury eventually"

  pax_britannica_events.30.t:0 "The Future Is Bright"
  pax_britannica_events.30.d:0 "The movers and shakers of the nation are overcome with dynamism. The progress and prosperity seems never-ending."
  pax_britannica_events.30.f:0 "The echo of progress reverberates through the hearts of citizens, as dreams take flight and aspirations soar. In this epoch of shared enthusiasm, the nation stands on the precipice of a promising tomorrow, where the collective anticipation of a brighter future serves as the catalyst for societal advancement."
  pax_britannica_events.30.a:0 "We could use that energy in our commerce"
  pax_britannica_events.30.b:0 "Who knows what the future may bring?"

  pax_britannica_events.31.t:0 "Bungled Bureaucracy"
  pax_britannica_events.31.d:0 "Colonial administrators across the empire have landed themselves in a difficult position. The only question is, who is to blame?"
  pax_britannica_events.31.f:0 "In the vast expanses of the empire, the machinery of governance creaks away. From missteps to logistical challenges, on a global scale, the colonies find themselves grappling with the shortcomings of administrative oversight."
  pax_britannica_events.31.a:0 "We must take responsibility"
  pax_britannica_events.31.b:0 "They are, obviously"

  pax_britannica_events.32.t:0 "Troubled Tax Collectors"
  pax_britannica_events.32.d:0 "The tax collectors have over-promised and under-delivered. Many are now facing financial trouble."
  pax_britannica_events.32.f:0 "In the labyrinth of fiscal responsibility, mistakes cost dearly."
  pax_britannica_events.32.a:0 "We must bail them out"
  pax_britannica_events.32.b:0 "Unfortunate"

  pax_britannica_events.33.t:0 "The Tireless March"
  pax_britannica_events.33.d:0 "Increasing global competition has driven businesses to longer hours and lower wages, and the workers are increasingly unhappy with their conditions."
  pax_britannica_events.33.f:0 "Long hours and meager wages cast a pall over the promise of progress, and the industrial revolution becomes a double-edged sword for those whose hands shape its destiny. In this era of labor unrest, the call for fair treatment reverberates through the smoke-filled air, urging society to recognize the human cost of progress."
  pax_britannica_events.33.a:0 "Competition is healthy"
  pax_britannica_events.33.b:0 "Listen to the people"

  pax_britannica_events.34.t:0 "Crisis of Confidence"
  pax_britannica_events.34.d:0 "Lenders are growing weary of their fiscal future in an unpredictable world."
  pax_britannica_events.34.f:0 " Market fluctuations and geopolitical tensions conspire to unsettle the usually stoic bankers, whose confidence wavers in the face of impending challenges."
  pax_britannica_events.34.a:0 "We will pay our debts as obliged"
  pax_britannica_events.34.b:0 "We have the authority to do as we please"

  pax_britannica_events.35.t:0 "The Budgetary Burden"
  pax_britannica_events.35.d:0 "Politicians are making a stink after a report leaked claiming, falsely or otherwise, that the current budget is unsustainable."
  pax_britannica_events.35.f:0 "The ledgers, once symbols of fiscal stability, now provoke unease as expenditures outpace revenues. The nation finds itself at a crossroads, grappling with the delicate balance between ambitious policies and the practicality of financial prudence."
  pax_britannica_events.35.a:0 "The report is wrong, and we will prove it"
  pax_britannica_events.35.b:0 "The private sector shall share this burden with us"

  pax_britannica_events.36.t:0 "Taxation Really Is Theft"
  pax_britannica_events.36.d:0 "The papers have uncovered an internal government investigation into improper taxation, levied at much higher rates than the official policy mandates."
  pax_britannica_events.36.f:0 "“The avoidance of taxes is the only intellectual pursuit that still carries any reward.”#!#!\n\n- John Maynard Keynes"
  pax_britannica_events.36.a:0 "So what?"
  pax_britannica_events.36.b:0 "Make it right"

  pax_britannica_events.37.t:0 "Criminal Injustice"
  pax_britannica_events.37.d:0 "Both the civil and judicial courts are swamped with a backlog of cases. The system is at crisis point."
  pax_britannica_events.37.f:0 " From overwhelmed courts to a backlog of cases, the machinery that upholds law and order struggles to meet the demands of a rapidly evolving society."
  pax_britannica_events.37.a:0 "Hire more judges"
  pax_britannica_events.37.b:0 "Increase bureaucratic oversight"

  pax_britannica_events.38.t:0 "Academic Busywork"
  pax_britannica_events.38.d:0 "The nation's inventors and academics have joined together to complain of the suffocating mass of red tape that constricts their every action."
  pax_britannica_events.38.f:0 "The tapestry of intellectual pursuit becomes entangled in administrative hurdles, impeding the free flow of knowledge. In this era of academic frustration, the call for streamlined processes echoes through lecture halls and research centers, as the quest for enlightenment finds itself ensnared in the intricate webs of bureaucratic constraints."
  pax_britannica_events.38.a:0 "It is there for a reason"
  pax_britannica_events.38.b:0 "We can lift the burden from them, somewhat"

  pax_britannica_events.39.t:0 "Bust"
  pax_britannica_events.39.d:0 "Regrettably, many industries are closing their doors for good. An uncertain world is not a world friendly to big business."
  pax_britannica_events.39.f:0 "The pulse of commerce weakens as businesses, unable to weather the storms of financial adversity, succumb to the challenges of the era."
  pax_britannica_events.39.b:0 "These things happen"

  pax_britannica_events.40.t:0 "Illegitimate? Or Just Incompetent?"
  pax_britannica_events.40.d:0 "There is growing outcry among the common folk of the nation against the current administration's foreign policy objectives."
  pax_britannica_events.40.f:0 "Amidst the ebb and flow of international relations, a wave of discontent crashes upon the shores of public sentiment."
  pax_britannica_events.40.b:0 "What do the unwashed masses know of empire building?"

  pax_britannica_events.41.t:0 "Brain Drain"
  pax_britannica_events.41.d:0 "The best and brightest of the people, educated in [ROOT.GetCountry.GetAdjective], are opting to take their expertise elsewhere."
  pax_britannica_events.41.f:0 "Bright minds and skilled professionals, like migratory birds seeking new horizons, depart for foreign shores in pursuit of opportunities and recognition. The homeland, once a bastion of intellectual prowess, grapples with the challenge of retaining its brightest stars."
  pax_britannica_events.41.b:0 "What could they possibly want abroad?"

  pax_britannica_events.42.t:0 "Cruel Britannia"
  pax_britannica_events.42.d:0 "Administrators in [SCOPE.sC('pax_britannica_target').GetNameNoFormatting] are facing a new wave of anti-[GetCountry.GetName.GetAdjectiveNoFormatting] sentiment among a populace resentful of [GetCountry.GetName.GetAdjectiveNoFormatting] rule."
  pax_britannica_events.42.f:0 "“We seem... to have conquered and peopled half the world in a fit of absence of mind.”#!#!\n\n- Sir John Seeley"
  pax_britannica_events.42.b:0 "Uncivilised brutes"

  pax_britannica_events.43.t:0 "Lack Of Interest"
  pax_britannica_events.43.d:0 "A cabal of powerful banks is threatening to unilaterally raise their interest rates across the board in the wake of growing global turmoil."
  pax_britannica_events.43.f:0 "“When interest rates are high you want the average direction in which interest rates are moving to be downward; when interest rates are low you want the average direction to be upward.”#!#!\n\n- John Hull"
  pax_britannica_events.43.a:0 "We can afford it"
  pax_britannica_events.43.b:0 "Nationalise them"

  pax_britannica_events.44.t:0 "Leprose Prospects"
  pax_britannica_events.44.d:0 "A general downturn of the economy has hit hard during the global crisis in confidence, as [ROOT.GetCountry.GetAdjectiveNoFormatting] influence declines."
  pax_britannica_events.44.f:0 "“It's a recession when your neighbor loses his job; it's a depression when you lose yours.”#!#!\n\n- Harry S Truman"
  pax_britannica_events.44.a:0 "Unfortunate"
  pax_britannica_events.44.b:0 "Insulate our domestic industries"

  pax_britannica_events.45.t:0 "Lax Britannica"
  pax_britannica_events.45.d:0 "Merchants are losing confidence and raising prices. [ROOT.GetCountry.GetAdjective]'s shelves are empty, and her people hungry. A crisis is brewing."
  pax_britannica_events.45.f:0 "“No man can be a good citizen unless he has a wage more than sufficient to cover the bare cost of living, and hours of labor short enough so after his day's work is done he will have time and energy to bear his share in the management of the community, to help in carrying the general load.”#!#!\n\n- Theodore Roosevelt"
  pax_britannica_events.45.a:0 "Install price controls, protect the people"
  pax_britannica_events.45.b:0 "What are we to do about that?"
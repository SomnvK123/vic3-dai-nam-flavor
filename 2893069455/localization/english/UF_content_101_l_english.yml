 ig_shudras: "Shudras"
 ig_brahmin_priests_desc: "Brahmins are the highest ritual status of the four classes of Varna. The traditional occupation of Brahmins is that of priesthood at Hindu temples or at socio-religious ceremonies, and the performing of rite of passage rituals such as solemnising a wedding with hymns and prayers."
 ig_brahmin_scholars_desc: "While most Brahmins focus on spiritual teaching, like gurus, there are those who focus more on scholarly studies."
 ig_kshatriyas_warriors_desc: "Kshatriyas are the second class in the Varna. They are the warrior aristocracy."
 ig_kshatriyas_nobles_desc: "This group of the Kshatriyas focus on ruling instead of warring."
 ig_vaishyas_farmers_desc: "Vaishyas are the third class in the Varna. This group of the Vaishyas focuses on agriculture and taking care of cattle., trade and other business pursuits"
 ig_vaishyas_merchants_desc: "This group of the Vaishyas focuses on trade and other business pursuits"
 ig_shudras_desc: "Shudras are the lowest of the four classes of Varna. They are artisans, laborers, or servants."
 
 ig_trait_selling_panic: "Selling Panic"
 ig_trait_selling_panic_desc: "People back home have no confidence in our enterprise in the colony and are selling their stock."
 ig_trait_high_stocks: "High Stocks"
 ig_trait_high_stocks_desc: "Everyone is buying up stock in the company. Let the good times roll."
 ig_trait_exploitation: "Exploitation"
 ig_trait_exploitation_desc: "We're not here to rule. We're here to get rich!"
 ig_trait_armed_forces_supporting_caste: "Supporting Caste"
 ig_trait_armed_forces_supporting_caste_desc: "As part of the same ruling caste, it's essential to keep the rulers strong and healthy. Any trouble for them is trouble for us."
 ig_trait_landowners_supporting_caste: "Supporting Caste"
 ig_trait_landowners_supporting_caste_desc: "When everyone else in the country is against you. The army is the only friend you need."
 ig_trait_gurus: "Gurus"
 ig_trait_gurus_desc: "Foreigners marvel at the wisdom of these spiritual teachers that an established curriculum could never replicate."
 ig_trait_karma: "Karma"
 ig_trait_karma_desc: "We rule because this is our reward for our virtuous previous life. You serving us is your punishment. Simple as that."
 ig_trait_bottom_of_the_totem_pole: "Bottom of the Totem Pole"
 ig_trait_bottom_of_the_totem_pole_desc: "They may be at the bottom now, but they have hope for their next reincarnation."
 

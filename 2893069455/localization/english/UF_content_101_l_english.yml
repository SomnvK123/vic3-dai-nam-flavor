 unite_afghanistan_button:0 "Unite Afghanistan"
 unite_afghanistan_button_desc:0 "Ever since the Durrani empire fractured into multiple emirates, shahdoms, and khanates they have been at war with one another. Each hoping to unite the states through conquest. Diplomacy will never bring them together. We must either choose to support one of them or conquer the land ourselves and then release it as an independant country."
 

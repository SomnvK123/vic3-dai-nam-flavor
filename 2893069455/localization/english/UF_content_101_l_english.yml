 ig_colonial_landowners: "Colonial Landowners"
 ig_colonial_landowners_desc: "Landowners that have been established in the country by colonials. They are more adamant in their rejection of representative government and see themselves as racially superior to the natives."
 
 kingly_state_button: "Become a Dominion"
 kingly_state_button_desc: "If you're able to run your state well enough, the British have agreed to give you more autonomy."
 foster_indian_agitation_button: "Foster Indian Agitation"
 foster_indian_agitation_button_desc: "The British have tricked our brothers and sisters into believing that their lives are better under British rule. We must fund agents and propaganda to expose them to the truth."
 lead_the_charge_button: "Lead the Charge"
 lead_the_charge_button_desc: "The Sepoys are the key to victory against the East India Company. Year after year they grow more resentful of their British masters. When they are ready to overthrow the British, we will be there to lead them."
 indian_union_button: "Invite Free Indian States"
 indian_union_button_desc: "The dream of a united India is finally well established. We must convince those that are lucky enough to be free to join with us to realize that dream."
 bic_loans_button: "Pay Back Loan"
 bic_loans_button_desc: "During the panic of 1772 the company was about to go bankrupt, but the British bailed us out. This let them have more control over the company. If we can pay pack the massive loan then we can improve our image and be one step closer to regaining full control of our company."
 sell_koh_i_nor_button: "Sell the Koh-I-Nor"
 sell_koh_i_nor_button_desc: "We are running out of money and fast. Selling the Koh-I-Nor might be our only option. The British would surely want it for their crown."
 ban_sati_button: "Ban Sati"
 ban_sati_button_desc: "The practice of forcing widows to sacrifice themselves by sitting atop her deceased husband's funeral pyre must be eliminated. Forget the British frowning on it, it is just plain wrong and a waste of life."
 indian_equality_button: "Indian Equality"
 indian_equality_button_desc: "We can distinguish our society from Britains by co-existing with the Indians. Not to mention them being more willing to fight for a country that doesn't just oppress them."
 push_for_independance_button: "Push for Independance"
 push_for_independance_button_desc: "The only way to break free of Britain's hold on us is through force. Though, we shouldn't be too hasty. We might want to get the Indians on our side before we make our move."
 
 ideology_colonialist: "Colonialist"
 ideology_colonialist_desc: "Interested in growing an already established colony with more productive methods to reap more profits at the expense of the native population."
 ideology_indian_nationalism: "Indian Nationalism"
 ideology_indian_nationalism_desc: "More accepting than the middle classes of other states thanks to a shared identity created from shared domination by the British in India."
 
 je_british_takeover:0 "British Takeover"
 je_british_takeover_reason:0 "The company is in dire straits. All of our monopolies have been revoked and the Britain exerts more control than ever over us after bailing us out in the panic of 1772. If we don't stabilize our country and soon, then the government will consume us whole."
 je_british_takeover_goal:0 "Double our GDP"
 
 je_company_independence:0 "Company Independence"
 je_company_independence_reason:0 "We are the ones who won India. Why should we have to share our spoils with an overbearing government? It's high time we declared independance and take our rightful place among the great powers."
 
 je_kingly_state:0 "Kingly State"
 je_kingly_state_reason:0 "If we can improve our finances and allow the British equal oppurtunity within our land then they might agree to allow us full autonomy, whilst still binding our markets together."
 je_kingly_state_goal:0 "Improve GDP by 500%"
 
 je_an_indian_india: "An Indian India"
 je_an_indian_india_reason: "We are one of the few Indian states left that have not been taken over by the British. We are fooling overselves if we think they will be satiated with what they already have. The only way to survive is to take the fight to them in any way we can. We must tread carefully, for one wrong move could be the end of us."
 
 je_remove_the_caste:0 "Remove the Caste"
 je_remove_the_caste_reason:0 "Varna is the caste system of Hindus. Assigning everyone a status upon birth that can never be changed. If we ever hope to utilize the whole of our population then we must unshackle ourselves from this system."
    
 je_koh_i_nor: "Koh-I-Nor"
 je_koh_i_nor_reason: "The Koh-I-Nor is one of the largest cut diamonds in the world and means 'Mountian of Light' in Farsi. It has gone into many hands, but has finally passed into ours."
 
 je_indian_national_congress:0 "Indian National Congress"
 je_indian_national_congress_reason:0 "A pro-Indian Englishmen, Allan Octavian Hume, wants to set up a new group for Educated Indians. While holding no adminstrative power, it aims to obtain a greater share in government for these educated Indians and to create a platform for civic and political dialogue between them and the government."  

 je_divide_and_rule: "Divide and Rule"
 je_divide_and_rule_reason: "The British are trying to pit Hindus and Muslims against one another. We must end this partition before they spread it to other parts of the country."  

 je_rowlatt_act: "Rowlatt Act"
 je_rowlatt_act_reason: "Britain's new law allows them to indefinately imprison anyone of their choice without trial nor judicial review. Our Indian subjects are not happy about it. We might be forced to overturn it or else things might get out of hand."  

 je_satyagraha:0 "Satyagraha"
 je_satyagraha_reason:0 "In times of neccesity, [SCOPE.sCharacter('mahatma_scope').GetFullName] will invoke Satyagraha, leading to people leaving their jobs in protest instead of becoming radical.\n\n#italic Its root meaning is holding on to truth, hence truth-force. I have also called it love-force or soul-force. In the application of satyagraha, I discovered in the earliest stages that pursuit of truth did not admit of violence being inflicted on one’s opponent but that he must be weaned from error by patience and compassion. For what appears to be truth to the one may appear to be error to the other. And patience means self-suffering. So the doctrine came to mean vindication of truth, not by infliction of suffering on the opponent, but on oneself.#!"

 je_quit_india:0 "Quit India"
 je_quit_india_reason:0 "India has become unsustainable for the British empire. We must have a graceful exit and avoid violently being kicked out."

 je_relocation: "Relocation"
 je_relocation_reason: "Massive amounts of Indians are unexpectadly migrating between the partitioned states. With no preparation for this event, things could turn ugly."
 je_relocation_goal: "Have 50% or more radicals"


 je_our_own_state: "Our own State"
 je_our_own_state_reason: "We have been under British rule for long enough. It is time we started working towards freeing ourselves from their yoke."
 
 
 je_religious_tolerance: "Religious Tolerance"
 je_religious_tolerance_reason: "Though our state religion is Sikh, the Maharaja frequently hires skilled Muslims and Hindus to be part of the state apparatus. This policy might not stick around forever and greedy local officials still take land from Hindus and Muslims. If we want to cement the idea and make sure it also applies to the non-administrative masses then we must codify it into law."
 
 dp_unify_india:0 "Unify India"
 dp_unify_india_tooltip:1 "#header Start a $dp_unify_india$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_unify_india_desc$"
 dp_unify_india_desc:1 "Sets the initiating [concept_war_goal] to annex all India homeland states held by other nations."


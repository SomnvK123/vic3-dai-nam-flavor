 je_mossadeq_for_prime_minister_reason:0 "Mossadeq and his liberal policies to make Iran a true democracy and end foreign influence in Iranian politics is exactly what the people have been looking for."
 
 je_so_close:0 "So close"
 je_so_close_reason:0 "It's looking like a landslide for Mossadeq and his party."
 
 je_british_seek_american_help:0 "British Seek American Help"
 je_british_seek_american_help_reason:0 "The British have run crying to America to help them, though the Americans are not sympathetic to the British but to Iran. The British will stoop to any low to get what they want, there's no telling if a new administration in America might think differently."
 je_british_seek_american_help_goal:0 "Pass all of Mossadeq's reforms before it's too late."
 

 je_repeal_jizya_tax:0 "Repeal Jizya Tax"
 je_repeal_jizya_tax_reason:0 "The Jizya tax collects extra taxes from all those who are not Muslim. [SCOPE.sCharacter('hataria_scope').GetFullName] has seen how devastating this is to Zoroastrians financially. He claims it's unjust and wants us to repeal it in it's entirety."
 
 je_reclaim_territory:0 "Reclaim Territory"
 je_reclaim_territory_reason:0 "Now that we've instilled our people with patriotic pride, they are clamoring to reclaim the territory that Russia took from us."
 
 je_our_rightful_place:0 "Our Rightful Place"
 je_our_rightful_place_reason:0 "We were not once, but twice, the greatest power the world has ever known. Europe seems to have forgotten that and believe in their own racial and cultural superiority. It's time we tear down their false perception."
 
 je_cultural_exchange:0 "Cultural Exchange"
 je_cultural_exchange_reason:0 "We are already picking up on Austrian culture thanks to them teaching in Dar-Ol-Fonoon. Now they are starting to pick things up from our culture. We should encourage this until the point where each of us are as welcome in each other's countries as the original denizens."
  
 je_twin_empires:0 "Twin Empires"
 je_twin_empires_reason:0 "Our brothers and sisters in Austria lost parts of their empire just as we have. Instead of longing for those days we should help one another reclaim our rightful places as the dominant power in our regions. If we help make their dream of Germany a reality then they will use their prestige and authority to support all of our claims to our own region."
 
 je_great_iran:0 "Great Iran"
 je_great_iran_reason:0 "We will form our own empire that will eclipse so called Great Britain"
 
 je_most_favored_nation:0 "Most Favored Nation"
 je_most_favored_nation_reason:0 "We are fast becoming one of America's biggest trading partner. If we can keep this up they might give us the coveted Most Favored Nation status."
 most_favored_nation_modifier:0 "Most Favored Nation"
 most_favored_nation_tt:0 "If your trade agreement with America ever gets cancelled you can regain it whenever you want with a decision."
 
 je_liberty_alliance:0 "Liberty Alliance"
 je_liberty_alliance_reason:0 "We must create a coalition of countries across the globe that stand for liberty if we are to stop these reactionary forces and ensure that we never return to the backwardness of monarchy."
 
 je_crush_the_monarchists:0 "Crush the Monarchists"
 je_crush_the_monarchists_reason:0 "Reactionary forces in Europe squash democratic governments whenever they become free. We must weaken them enough to end their global power."
 
 je_establish_newspaper:0 "Establish Newspaper"
 je_establish_newspaper_reason:0 "The printing presses are being installed as we speak."
 je_establish_newspaper_goal:0 "Finish creating the newspaper."

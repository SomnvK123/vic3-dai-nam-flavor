 unite_baluchistan_button:0 "Unite Baluchistan"
 unite_baluchistan_button_desc:0 "Makran and Kalat need to put aside their differences if they hope to survive against the ever expanding East India Company. If we can get on good enough terms with both of them we could help them come to a resolution between their two states."
 
 persia_form_transcaucasia_tt:0 "Armenia, Azerbaijain, and Georgia exist and you have either a defensive pact, alliance, or custom union with each of them."
 
 ottoman_unrest_button: "Ottoman Unrest"
 ottoman_unrest_button_desc: "We will export our nationalist ideas to the minorities of the Ottoman empire. Hopefully this will lead to them declaring and winning their independance. If they don't generate enough support for a free state for themselves, we will persuade true patriots to take that final step."
 
 russia_unrest_button: "Russia Unrest"
 russia_unrest_button_desc: "We will export our nationalist ideas to the minorities of the Russian empire. Hopefully this will lead to them declaring and winning their independance. If they don't generate enough support for a free state for themselves, we will persuade true patriots to take that final step."
 

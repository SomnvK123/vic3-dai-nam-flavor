 je_empire_reborn:0 "The Third Empire"
 je_empire_reborn_reason:0 "The rest of the world thinks we are playing out some fantasy. Let them think it's a fantasy while we conquer our way to making it a reality."
 catch_up_modifier:0 "Catch Up"
 form_qajar_tt:0 "Form the Qajar Empire."
 form_great_iran_tt:0 "Form the Qajar Empire (will rename to Great Iran)."
 
 zoroastrian_babies_modifier:0 "Zoroastrian Babies"
 zoroaster_button:0 "Revive Zoroastrianism"
 zoroaster_button_desc:0 "Many Zoroastrians have emmigrated out of Persia since the Muslim conquest and settled in India. If we make Zoroastrian our official religion then not only can we revive our old moral code, but also get those wayward Zoroastrians to return."

 persepolis_button:0 "Establish Court at Persepolis"
 persepolis_button_desc:0 "Persepolis was the ancient capital of the first Persian Empire: The Achaemenid Empire. It is only ruins now, but we can rebuild it and establish a grand court."

 warfare_court_modifier:0 "Warfare Court"
 administrative_court_modifier:0 "Administrative Court"
 multicultural_court_modifier:0 "Multicultural Court"
 
 form_satrapies_button:0 "Form Satrapies"
 form_satrapies_button_desc:0 "We should establish dominion over other states using the old satrapy system."
 satrapy_administrators_modifier:0 "Satrapy Administrators"
 
 je_shahenshah:0 "Crown Yourself Shah-En-Shah"
 je_shahenshah_reason:0 "If we truly wish to revive the empire then we must have a King of Kings to lead us once more. Only then can we meet this monumental task."
 je_shahenshah_goal:0 "Complete "Convert to Zoroastrian, Rebuild Persepolis, and Form Satrapies"."

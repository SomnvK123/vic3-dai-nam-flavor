 remove_bukharas_claim_button_desc:0 "If we can get on Bukhara's good side or get them to owe us a favor then we could remove their claim on Balkh peacefully."
 
 
 guerrilla_war_button:0 "Guerrilla War"
 guerrilla_war_button_desc:0 "We should continue to harrass the British and spread their forces apart. They can't defend the capital properly if they have to send forces for every little skirmish."
 
 encourage_revolt_button:0 "Encourage Revolt"
 encourage_revolt_button_desc:0 "We're getting reports that the British garrison in the city of Kabul are very unpopular with the people. We should encourage them to 'fix the problem'."
 
 je_afghanistan_fractured:0 "Fractured Empire"
 je_afghanistan_fractured_reason:0 "The Durrani empire has been fractured into several states. If we can conquer each of them, we can unite into a single nation. Only then will we stand a chance against Russia and Britain who have their eyes on our land."

 je_afghanistan_fractured_durrani:0 "Fractured Empire"
 je_afghanistan_fractured_durrani_reason:0 "The [COUNTRY.GetName] has been fractured into several states. If we can bring the rest of them under our heel then our empire will be whole once again. Only then will we stand a chance against Russia and Britain who have their eyes on what's rightfully ours."

 je_afghanistan_fractured_kabul:0 "Only One Man"
 je_afghanistan_fractured_kabul_reason:0 "Russia and Britain greedily eye the region. Only one man has the iron will, military prowess, and respect of the people to reunite the fractured emirates to stand against the great powers: Dost Mohammad Khan."

 je_herat:0 "Herat"
 je_herat_reason:0 "Herat is where the vile Mahmud Shah Durrani fled after executing Dost Mohammad's brother whose only crime was helping restore that dog to his throne in the first place. Long dead, now his cruel son rules. The untrustworthy Durranis can never hold power in these lands again."

 je_kandahar:0 "Kandahar"
 je_kandahar_reason:0 "The Dil brothers are oppurtunist upstarts that have no right to Kandahar. Their squabbling for successor to the emirate will lead to Kandahar's ruin."

 je_balkh:0 "Balkh"
 je_balkh_reason:0 "The Khanate holding most of Balkh does not even rule over the whole region. [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] will unify them under a single banner." 

 je_maimana_unified_khanate:0 "Unified Khanate"
 je_maimana_unified_khanate_reason:0 "Unlike the other emirates and shahdom's in the region, we are much more culturally diverse with no dominant presence of Pashtuns. We could remake the region for us and finally supplant the Pashtuns. Though, we do not exactly rule over Balkh. We are only the largest Khanate within it. If we want to unify our people into a proper fighting force then we need the khan to garner enough support to hold a Kurultai and elect him Khan of all of them."

 je_the_great_game_afghanistan:0 "The Great Game"
 je_the_great_game_afghanistan_reason:0 "Britain and Russia are both vying for control over the region. If we continue to be seen as inferior by the Great Powers then they will see no qualms about interfering in the affairs of what they consider a 'backwards' people. Historical Route: If you fail."

 je_the_absolute_worst:0 "The Absolute Worst"
 je_the_absolute_worst_reason:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] spent most of his time in exile torturing his servants for fun. Now that the British have helped him reclaim the throne from Dost Mohammad, he continues his cruel nature upon the population. His subjects ache for the return of Dost Mohammed, making [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] a prime target for assassination.#italic You will get assassination events while you have this journal entry."

 je_british_garrison:0 "British Garrison"
 je_british_garrison_reason:0 "The progress bar will increase by 1 for each of the following interest groups that have a -5 approval or worse: Landowners, Armed Forces, Devout, and Rural Folk.\n\n#italic The people are getting restless with the British Garrison occupying our city and flaunting their wealth with inclusive parties and luxuries. We might have to get rid of [SCOPE.sCharacter('elphinstone_scope').GetFullName], though we need him and his garrison to defend against military threats. Do we risk a rebellion or an invasion from Akbar Khan? At this rate, it'll be both."
 je_british_garrison_goal:0 "Resentment reaches its boiling point and the people rise up against the British."
 
 je_overthrow_shuja:0 "Overthrow Shuja"
 je_overthrow_shuja_reason:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]'s father, Dost Mohammad, ruled over all of Kabul before the British put their puppet on the throne. [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] continues a guirella war against the British forces still garrisoned in the city, but it might be simpler to convince the people to rise up against the British and remove their pesky garrison or wait for them to assassinate their cruel new shah. Why not both?"

 je_vizier_vs_shah:0 "Vizier VS Shah"
 je_vizier_vs_shah_reason:0 "The progress bar will increase by 1 every month that the landowners are powerful and another 1 if they are in government.\n\n#italic [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] is in a power struggle with his vizier, Yar Mohammad. He would have overthrown the cruel and unpopular shah by now if it weren't for the loyalty of Mohammad Hazara. Who will come out on top?"
 je_vizier_vs_shah_goal:0 "Yar Mohammad is the dominant power in the country long enough for him to feel confident to overthrow the Shah."

 je_vizier_coup:0 "A Vizier's Coup"
 je_vizier_coup_reason:0 "[SCOPE.sCharacter('yazer_scope').GetFullName] is in the midst of his royal coup."
 je_vizier_coup_goal:0 "[SCOPE.sCharacter('yazer_scope').GetFullName] is ready to execute the coup."

 je_impending_civil_war:0 "Impending Civil War"
 je_impending_civil_war_reason:0 "[SCOPE.sCharacter('yazer_scope').GetFullName] chooses war over backing down at his play for becoming Shah."

 #je_british_protector:0 "British Protectors"
 #je_british_protector_reason:0 "The only way to avoid total domination by the Russians is to hide under the umbrella of Britain."
 
 #je_russian_protector:0 "Russian Protectors"
 #je_russian_protector_reason:0 "The only way to avoid total domination by the British is to hide under the umbrella of Russia."
 
 je_graveyard_of_empires:0 "Graveyard of Empires"
 je_graveyard_of_empires_reason:0 "The most powerful empires of every age have made the mistake of invading our land. They never stay for long and eventually become another slab in our graveyard. It's time we start digging another hole."
 
 je_russia_flood_of_opium:0 "Flood Russia with Opium"
 je_russia_flood_of_opium_reason:0 "Russians love alcohol, but getting drunk isn't debilitating enough. Let's get them addicted to Opium and truly wreck their population."

 je_britain_flood_of_opium:0 "Flood Britain with Opium"
 je_britain_flood_of_opium_reason:0 "The British weakened the Qing population by getting them addicted to Opium. It's time we take a lesson out of their playbook."
 
 je_a_new_game_russia:0 "A New Game"
 je_a_new_game_reason:0 "We've successfully built ourselves up strong enough to remain independant. Why sit and wait for Russia to eventually return when we can take the fight to them. Let's see how they like being subjugated."
 
 je_a_new_game_britain:0 "A New Game"
 je_a_new_game_reason:0 "We've successfully built ourselves up strong enough to remain independant. Why sit and wait for Britain to eventually return when we can take the fight to them. Let's see how they like being subjugated."
 
 je_hostile_takeover:0 "Hostile Takeover"
 je_hostile_takeover_reason:0 "The East India Trading company is an evil corporation and the people of the region will never be safe while the company exists."
 
 je_pharmaceutical_giant:0 "Pharmaceutical Giant"
 je_pharmaceutical_giant_reason:0 "Opium is extremely potent for medical purposes when used responsibly. Instead of focusing on selling to others, we should fund  building our own medical facilities and research labs."
 
 je_the_great_northern_players:0 "The Great Northern Players"
 je_the_great_northern_players_reason:0 "Russia encroaches on our northern border with each passing day. We must quickly ally with the khanates to our north and prevent that from happening."

 je_the_great_western_player:0 "The Great Western Player"
 je_the_great_western_player_reason:0 "Persia is a powerful independant Middle-Eastern country, but more importantly not as agressive as others like the Ottomans or Egypt. If we can resolve their claim on Herat then we would have a powerful ally indeed."

 je_the_great_eastern_player:0 "The Great Eastern Player"
 je_the_great_eastern_player_reason:0 "Allying with the Sikh Empire would be quite dangerous as we could get pulled into their wars with the East India Trading Company. On the other hand, if we work together we could stop the company's Westward expansion."
 
 je_the_great_southern_players:0 "The Great Southern Players"
 je_the_great_southern_players_reason:0 "If the nations to the south fall, our enemies will have a place to undock all of their soldiers and up to our borders."

 je_the_great_players:0 "The Great Players"
 je_the_great_players_reason:0 "The more nations that fall before the great powers, the easier it is to conquer the rest of us. If the Middle-East and Central Asia is to remain independant then we must stand together."

 je_khorasan_ascendant:0 "Khorasan Ascendant"
 je_khorasan_ascendant_reason:0 "Most people within [COUNTRY.GetName] still refer to it as Khorasan. Reforming Khorasan proper will give us the justification to expand enough to no longer worry about survival."

 je_the_impenetrable_coast:0 "The Impenetrable Coast"
 je_the_impenetrable_coast_reason:0 "If we can block our enemies from just sailing into our country unharassed then they'll think twice about invading."

 je_whats_ours_is_ours:0 "What’s Ours is Ours"
 je_whats_ours_is_ours_reason:0 "We must settle all territorial disputes so we don't have to worry about our neighbors."

 je_the_northern_wall:0 "The Northern Wall"
 je_the_northern_wall_reason:0 "We need to control a buffer of states to defend the inner parts of our homeland. It will also give us access to the nomadic warriors of the region to swell our armies in times of need."
 

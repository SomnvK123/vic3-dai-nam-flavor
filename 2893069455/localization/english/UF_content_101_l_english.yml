 shahenshah_modifier:0 "Shah-En-Shah"
 court_of_the_shahenshah_modifier:0 "Court of the Shah-En-Shah"
 persian_empire_claims_tt:0 "Gain claims on all the old territory of the Persian empire"
 
 too_friendly_tt:0 "You and Greece are friendly"
 too_unfriendly_tt:0 "You conquered Greece"
 je_conquer_greece:0 "Conquer Greece"
 je_conquer_greece_reason:0 "Why stop at becoming as great as the Persian Empire when we could be even greater. We shall do what even they could not achieve: Conquer Greece."
 je_friends_with_greece:0 "Friends with Greece"
 je_friends_with_greece_reason:0 "Making enemies with the Greeks has only ever led to disaster."
 
 ideology_zoroastrian_moralist:0 "Zoroastrian Moralist"
 ideology_zoroastrian_moralist_desc:0 "Good thoughts, good words, good deeds. These are the main tenants of Zarathustra that the magi preach. In order to become Zoroastrian you must be born of two Zoroastrian parents. Theirfore, they do not care if others follow a different religion. Far less dominating that the Assyrians and Babylonians before them, the faith of the Persian empires were much more accepting of different cultures. They have an ancient disdain for democracy, believing it merely results in mob rule."

 je_strait_of_hormuz:0 "The Strait of Hormuz"
 je_strait_of_hormuz_reason:0 "The Strait of Hormuz is crucial to making us a trade powerhouse" 
 je_lose_strait_of_hormuz:0 "Lose the Strait of Hormuz"
 je_strait_of_hormuz_reason:0 "If any part of the strait falls from our hands we will lose all of its boons" 

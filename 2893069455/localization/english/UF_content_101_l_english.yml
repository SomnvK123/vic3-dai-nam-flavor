  je_russia_great_game: "The Great Game"
  je_russia_great_game_reason: "Note: When one of these reaches 100 a diplo play will start to make the target a puppet, take a treaty port, or conquer a state depending on their rank and if they have a port. Britain has expanded exponentially in India over the decades. If we let them continue to do so then they will threaten our influence in Central Asia. All out war should be avoided while taking every oppurtunity we can to win this tournament of shadows."
  
  je_britain_great_game: "The Great Game"
  je_britain_great_game_reason: "India is the gem of our empire. That gem sits awfully close to the russian bear to it's north. We don't want to provoke the bear, but we also cannot let it devour everything in its way until it stands posed to steal our jewel."
  

ai_build_beautiful_wonder_2: "Build Broadway."
ai_build_beautiful_wonder_2_desc: "The opera house of Broadway will attract tourists from all over the world."
ai_build_beautiful_wonder_3: "Build Notre-Dame Cathedral (AI)."
ai_build_beautiful_wonder_3_desc: "May God bless the French."
ai_build_beautiful_wonder_4: "Build Hollywood (AI)."
ai_build_beautiful_wonder_4_desc: "The art of cinema will become one of the greatest inventions of the new century."
ai_build_beautiful_wonder_5: "Build the Crystal Palace (AI)."
ai_build_beautiful_wonder_5_desc: "Let the visitors of the World Expo witness the strength of our national power."
ai_build_beautiful_wonder_6: "Build the Soviet Palace (AI)."
ai_build_beautiful_wonder_6_desc: "Following Stalin’s directive, build a great monument to commemorate the October Revolution."
ai_build_beautiful_wonder_7: "Build the Aswan Dam (AI)."
ai_build_beautiful_wonder_7_desc: "The flooding of the Nile will be a thing of the past, and the dam will protect the residents along the riverbanks."
ai_build_beautiful_wonder_8: "Build the Madrid Bullring (AI)."
ai_build_beautiful_wonder_8_desc: "Bullfighting is a tradition in our country, let the angry bulls charge towards us!"
ai_build_beautiful_wonder_9: "Build the Imperial Parliament (AI)."
ai_build_beautiful_wonder_9_desc: "The imperial parliament building is not a monkey house, at least the southern compatriots will have a place to meet with us."
ai_build_beautiful_wonder_10: "Build the Hungarian Parliament (AI)."
ai_build_beautiful_wonder_10_desc: "The residents along the Danube will witness the birth of a grand building."
ai_build_beautiful_wonder_11: "Build the Eiffel Tower (AI)."
ai_build_beautiful_wonder_11_desc: "Eiffel's vision will soon become a reality and become a symbol of our country."
ai_build_beautiful_wonder_12: "Build Big Ben (AI)."
ai_build_beautiful_wonder_12_desc: "The sun slowly rises from the horizon, followed by a calm sound of the bell, and London enters a new day."
ai_build_beautiful_wonder_13: "Build the Panama Canal (AI)."
ai_build_beautiful_wonder_13_desc: "The great project that connects the Atlantic and Pacific Oceans will be realized by our hands."
ai_build_beautiful_wonder_14: "Build the Suez Canal (AI)."
ai_build_beautiful_wonder_14_desc: "Ismail cuts the red ribbon, and representatives from all royal families admire this great project that connects the Mediterranean with the Indian Ocean."
ai_build_beautiful_wonder_15: "Build the Imperial Academy (AI)."
ai_build_beautiful_wonder_15_desc: "In the ancient Eastern kingdom, a group of young people with dreams of saving the country enter the Imperial Academy."
ai_build_beautiful_wonder_16: "Build Tsinghua University (AI)."
ai_build_beautiful_wonder_16_desc: "In the ancient Eastern kingdom, a group of young people with dreams of reviving China enter Tsinghua University."
ai_build_beautiful_wonder_17: "The French Industrial Revolution (AI)."
ai_build_beautiful_wonder_17_desc: "To realize the second industrial revolution, France has made significant reforms."

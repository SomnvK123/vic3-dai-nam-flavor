ideology_sunni_moralist_new: "Sunni Neo-Fundamentalism."
ideology_sunni_moralist_new_desc: "As Western influence on Islamic societies deepens, Sunni scholars and religious leaders seek to adapt Islamic customs to modern environments. Based on Sharia law, this group advocates the gradual abolition of slavery and the allowance for different Muslim ethnicities to maintain their cultures, ultimately achieving a Pan-Islamic community."
ideology_shia_moralist_new: "Shia Neo-Fundamentalism."
ideology_shia_moralist_new_desc: "Suffering from both feudal rule and foreign invasion, Shia scholars and religious leaders seek necessary modern reforms. Based on strict Shia doctrine, this group advocates strengthening 'Marja' and 'following the source,' building an equal Muslim society."

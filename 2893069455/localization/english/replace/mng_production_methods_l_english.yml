je_dongnanfushuguo:0 "Protector of Asia"
je_dongnanfushuguo_reason:0 "This is a war that has already begun. [concept_great_power] keeps extending its influence to our borders, and the issue of border security has become urgent.\n\n[SCOPE.sCountry('rus_scope').GetName] has built forts and strongholds on the Kazakh steppe and stationed Cossacks to expand its sphere of influence.\n\n[SCOPE.sCountry('gbr_scope').GetName] has established a strong military presence in [SCOPE.sCountry('bic_scope').GetName] and is attempting to penetrate Central Asia via regions like Afghanistan.\n\nThey are closely monitoring our situation and have sent numerous officials to gather intelligence!"
je_warlord_china_reason: "#bold Progress bar#! conditions will advance under specific circumstances#tooltippable;tooltip:[Country.GetTooltipTag], je_warlord_china_special_tooltip_advance or#tooltippable;tooltip:[Country.GetTooltipTag], je_warlord_china_special_tooltip_deplete. #bold Progress bar#! reaching #variable 0%#! will result in the central government losing control, and local autocratic authorities will seize power.\n\nAlthough a brief period of stability occurred under the reigns of Yongzheng and Qianlong, China is now continuously moving toward collapse due to rebellions, poor governance, and external pressure. If the central government loses all authority, a [concept_revolution] will erupt across all of [concept_dsk_china]."

je_avert_sepoy_mutiny: "Avert the Sepoy Mutiny"

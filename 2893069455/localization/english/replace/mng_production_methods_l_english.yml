ai_build_beautiful_wonder_19_desc: "To realize the second industrial revolution, the United States has made major transformations."
ai_build_beautiful_wonder_21: "The German Industrial Revolution (AI)."
ai_build_beautiful_wonder_21_desc: "Under the pressure of the Social Democrats, Germany has made reforms beneficial to industrial development."
ai_build_beautiful_wonder_20: "Swiss Equalization (AI)."
ai_build_beautiful_wonder_20_desc: "The Swiss Confederation has made significant progress in human rights."
ai_build_beautiful_wonder_22: "Build the Christ the Redeemer Statue (AI)."
ai_build_beautiful_wonder_22_desc: "The Christ the Redeemer statue will open its arms, symbolizing both the cross and peace, protecting the Catholic faithful of Rio."

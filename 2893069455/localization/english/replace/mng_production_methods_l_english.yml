ideology_confucian_corporatist: "Doctrine of the Mean."
ideology_confucian_corporatist_desc: "This group advocates the Doctrine of the Mean, accepting and integrating Western modern philosophical thoughts to a limited extent. Through moral constraints and new institutional designs, they aim to establish a harmonious society."
ideology_confucian_new: "New Confucianism."
ideology_confucian_new_desc: "Confucian scholars of the new era view 'external kingship' as science and democracy. From the 'internal sanctity' of traditional Confucianism, they can also realize the new 'external kingship' of science and democracy."

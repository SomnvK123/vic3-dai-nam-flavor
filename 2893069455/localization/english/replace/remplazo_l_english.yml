 SPA_FLAVOR_TEXT: "Fernando VII left this world, leaving behind a fragmented and conflict-ridden country. With his daughter Isabel still a minor, his wife María Cristina has taken on the role of regent until Isabel comes of age, relying on the liberal cause to govern. In the face of this uncertain scenario, what does the future hold for the Spanish nation in this critical century?"


notification_headlines_gbr_albert_edward_coronation_tooltip: "#header $notification_headlines_gbr_albert_edward_coronation_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_gbr_albert_edward_coronation_desc$"
notification_headlines_gbr_albert_edward_coronation_name: "#b Coronation of King Edward #!"
notification_headlines_gbr_albert_edward_coronation_desc: "[SCOPE.sCharacter('gbr_albert_edward').GetFirstName] was crowned as [SCOPE.sCharacter('gbr_albert_edward').GetPrimaryRoleTitle] of [SCOPE.sCountry('britain_scope').GetName] at the age of [SCOPE.sCharacter('gbr_albert_edward').GetAge]. #lore Several minor incidents occurred during the ceremony, including the King's illness that delayed the coronation and the Archbishop putting on his mitre backwards... Despite the frequent blunders, the witty [SCOPE.sCharacter('gbr_albert_edward').GetFirstName] remarked bluntly: I knew a coronation required rehearsal, but I never expected it to take so many tries...#!"
notification_headlines_gbr_albert_edward_funeral_tooltip: "#header $notification_headlines_gbr_albert_edward_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_gbr_albert_edward_funeral_desc$"
notification_headlines_gbr_albert_edward_funeral_name: "#b Funeral of King Edward #!"
notification_headlines_gbr_albert_edward_funeral_desc: "King Edward of [SCOPE.sCountry('britain_scope').GetName] has passed away, and [SCOPE.sCharacter('new_british_monarch').GetFirstName] [SCOPE.sCharacter('new_british_monarch').GetPrimaryRoleTitle] has ascended to the throne. #lore Monarchs and nobles from all over Europe came to attend the King's funeral. Special memorial ceremonies were held across the country in remembrance...#!"
notification_headlines_david_livingstone_funeral_tooltip: "#header $notification_headlines_david_livingstone_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_david_livingstone_funeral_desc$"
notification_headlines_david_livingstone_funeral_name: "#b Funeral of David Livingstone #!"
notification_headlines_david_livingstone_funeral_desc: "The remains of #yellow David Livingstone#!, the legendary explorer of [SCOPE.sCountry('britain_scope').GetName], have been transported back to the motherland from the heart of Africa. #lore Elites from all walks of life in [SCOPE.sCountry('britain_scope').GetName] gathered at Westminster Abbey to mourn this 'Christian hero, anti-slavery fighter, and pioneer of scientific exploration'. In his Scottish hometown, many residents held spontaneous special memorial ceremonies in remembrance...#!"
notification_headlines_ger_bismarck_funeral_tooltip: "#header $notification_headlines_ger_bismarck_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_ger_bismarck_funeral_desc$"
notification_headlines_ger_bismarck_funeral_name: "#b Funeral of Otto von Bismarck #!"
notification_headlines_ger_bismarck_funeral_desc: "Otto von Bismarck, the Iron Chancellor #yellow Otto von Bismarck#!, passed away at his estate. Although the official government of [SCOPE.sCountry('german_scope').GetName] attempted to keep his funeral low-key, tens of thousands of #yellow German#! people flocked to Friedrichsruh from all over the country to lay flowers and pay their condolences to the Chancellor. #lore The national flag of [SCOPE.sCountry('german_scope').GetName] was lowered to half-mast across the nation, and all theaters and public places were closed to offer the sincerest tribute to their national hero and the symbol of German national sentiment...#!"
notification_headlines_ger_roon_funeral_tooltip: "#header $notification_headlines_ger_roon_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_ger_roon_funeral_desc$"
notification_headlines_ger_roon_funeral_name: "#b Funeral of Albrecht von Roon #!"
notification_headlines_ger_roon_funeral_desc: "The funeral of Albrecht von Roon #yellow Albrecht von Roon#!, the Minister of War, was held at the Garrison Church in Berlin. As an outstanding field marshal and military organizer of [SCOPE.sCountry('german_scope').GetName], his passing moved the sitting Chancellor to tears. The national flag of [SCOPE.sCountry('german_scope').GetName] was lowered to half-mast nationwide in his honor, and the streets of Berlin were filled with citizens and soldiers coming to bid him farewell. #lore The military music of Brandenburg echoed in the wind, and army chaplains prayed for him... The streets through which the coffin passed were solemn and serene, with soldiers lining up to salute...#!"
notification_headlines_ger_helmuth_moltke_older_funeral_tooltip: "#header $notification_headlines_ger_helmuth_moltke_older_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_ger_helmuth_moltke_older_funeral_desc$"
notification_headlines_ger_helmuth_moltke_older_funeral_name: "#b Funeral of Helmuth von Moltke the Elder #!"
notification_headlines_ger_helmuth_moltke_older_funeral_desc: "The funeral of Helmuth von Moltke the Elder #yellow Helmuth von Moltke the Elder#!, the Imperial Field Marshal, was held in Berlin. This military genius of the empire made tremendous contributions to the unification of [SCOPE.sCountry('german_scope').GetName]. [SCOPE.sCharacter('new_german_monarch').GetPrimaryRoleTitle] [SCOPE.sCharacter('new_german_monarch').GetFirstName] personally held a memorial service for him at Berlin Cathedral, calling him 'one of the purest and greatest embodiments of the German nation'. On the way to the cathedral, the highest-ranking army generals personally carried his coffin. #lore On both sides of the Berlin streets, soldiers from two field armies lined up to salute, and hundreds of thousands of citizens took to the streets spontaneously to bid their final farewell to their national hero and military genius..."
notification_headlines_ger_wilhelm_1_coronation_tooltip: "#header $notification_headlines_ger_wilhelm_1_coronation_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_ger_wilhelm_1_coronation_desc$"
notification_headlines_ger_wilhelm_1_coronation_name: "#b Coronation of Wilhelm I #!"
notification_headlines_ger_wilhelm_1_coronation_desc: "After the illness and death of his brother William IV, [SCOPE.sCharacter('new_german_monarch').GetFirstName] was crowned as [SCOPE.sCharacter('new_german_monarch').GetPrimaryRoleTitle] of [SCOPE.sCountry('german_scope').GetName] at the age of [SCOPE.sCharacter('new_german_monarch').GetAge]. #lore The King himself actually abhorred the theatrics of the divine right of kings and refused to hold a coronation, but under pressure from his advisors and family, he compromised by abandoning the anointing ceremony and instead swearing an oath to the constitution to become King. Rumor has it that [SCOPE.sCharacter('new_german_monarch').GetFirstName] said afterwards: This elaborate ceremony felt like the breath of the grave blowing on me...#!"
notification_headlines_ger_wilhelm_1_funeral_tooltip: "#header $notification_headlines_ger_wilhelm_1_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_ger_wilhelm_1_funeral_desc$"
notification_headlines_ger_wilhelm_1_funeral_name: "#b Funeral of Wilhelm I #!"
notification_headlines_ger_wilhelm_1_funeral_desc: "Wilhelm I, [SCOPE.sCharacter('new_german_monarch').GetPrimaryRoleTitle] of [SCOPE.sCountry('german_scope').GetName], has passed away, and [SCOPE.sCharacter('new_german_monarch').GetFirstName] [SCOPE.sCharacter('new_german_monarch').GetPrimaryRoleTitle] has ascended to the throne. #lore At the Cathedral of the Berlin Palace, monarchs and princes from all #black Ger#!#white man#!#red ic#! states came to attend the funeral. Looking out at the streets of Berlin, thousands of citizens came to mourn, tens of thousands of soldiers saluted with their guns, and the entire city resounded with solemn military music, declaring the official end of the great era of #black Ger#!#white man#!#red ic#! unification……#!"
notification_headlines_aus_eduard_taaffe_funeral_tooltip: "#header $notification_headlines_aus_eduard_taaffe_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_aus_eduard_taaffe_funeral_desc$"
notification_headlines_aus_eduard_taaffe_funeral_name: "#b Funeral of Eduard Taaffe #!"
notification_headlines_aus_eduard_taaffe_funeral_desc: "The funeral of Eduard Taaffe #yellow Eduard Taaffe#!, the Imperial Prime Minister, was held at St. Stephen's Cathedral in #yellow Vienna#!. As the Prime Minister of [SCOPE.sCountry('austria_scope').GetName], he spent his life compromising between various ethnic groups to maintain the stability of the empire. #lore Regrettably, no ethnic group or faction was satisfied with him, and only [SCOPE.sCharacter('new_austria_monarch').GetPrimaryRoleTitle] [SCOPE.sCharacter('new_austria_monarch').GetFirstName] sent people to organize and attend his grand funeral. Outside the windows of the Schönbrunn Palace, an old man silently took off his hat: Count Taaffe, my only friend, I can no longer protect you...#!"
notification_headlines_aus_franz_josef_I_coronation_tooltip: "#header $notification_headlines_aus_franz_josef_I_coronation_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_aus_franz_josef_I_coronation_desc$"
notification_headlines_aus_franz_josef_I_coronation_name: "#b Ascension of Franz Joseph I #!"
notification_headlines_aus_franz_josef_I_coronation_desc: "Revolutionary unrest in Vienna forced the mad #yellow Ferdinand I#! to abdicate, and his nephew [SCOPE.sCharacter('new_austria_monarch').GetFirstName] proclaimed himself [SCOPE.sCharacter('new_austria_monarch').GetPrimaryRoleTitle] of [SCOPE.sCountry('austria_scope').GetName] at the age of [SCOPE.sCharacter('new_austria_monarch').GetAge]. #lore The Emperor, dressed in military uniform, intended to display military force and order, but can this young man take control of the chaotic situation in [SCOPE.sCountry('austria_scope').GetName]?#!"
notification_headlines_aus_franz_josef_I_funeral_tooltip: "#header $notification_headlines_aus_franz_josef_I_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_aus_franz_josef_I_funeral_desc$"
notification_headlines_aus_franz_josef_I_funeral_name: "#b Funeral of Franz Joseph I #!"
notification_headlines_aus_franz_josef_I_funeral_desc: "Franz Joseph I, [SCOPE.sCharacter('new_austria_monarch').GetPrimaryRoleTitle] of [SCOPE.sCountry('austria_scope').GetName], has passed away, and [SCOPE.sCharacter('new_austria_monarch').GetFirstName] [SCOPE.sCharacter('new_austria_monarch').GetPrimaryRoleTitle] has ascended to the throne. #lore The coffin slowly passed through the Hofburg Palace, with all imperial royal family members and dignitaries attending the funeral. The old order of the Vienna System passed away with the old [SCOPE.sCharacter('new_austria_monarch').GetPrimaryRoleTitle], and where will the future of the #yellow Habsburg#! Dynasty lead…#!"
notification_headlines_usa_lincoln_funeral_tooltip: "#header $notification_headlines_usa_lincoln_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_usa_lincoln_funeral_desc$"
notification_headlines_usa_lincoln_funeral_name: "#b Funeral of Abraham Lincoln #!"
notification_headlines_usa_lincoln_funeral_desc: "Abraham Lincoln, [SCOPE.sCharacter('new_america_president').GetPrimaryRoleTitle] of [SCOPE.sCountry('america_scope').GetName], passed away from serious injuries, and [SCOPE.sCharacter('new_america_president').GetFirstName] [SCOPE.sCharacter('new_america_president').GetPrimaryRoleTitle] has taken over the position. #lore Lincoln's coffin was carried on a special train bound for his hometown of Springfield. Residents of the cities along the railway line waited by the tracks to salute their hero. More than a quarter of the population walked in long queues to the city to pay their respects to the President's remains. The martyr finally achieved the unity of the #yellow American#! nation…#!"
clever_dsk.229.t: "Indochina Crisis"
clever_dsk.229.d: "[SCOPE.sCountry('dai_229_scope').GetName]'s ruler [SCOPE.sCharacter('dai_229_person_scope').GetFullName] has been persecuting our fellow believers. Recently, our #yellow Spanish#! neighbor, the famous bishop #yellow Diego de Valles#!, was also murdered by these barbarians. European neighbors have generally condemned [SCOPE.sCountry('dai_229_scope').GetName] for its evil paganism, and now is the time to take advantage of the rare favorable public opinion to launch a punitive action against [SCOPE.sCountry('dai_229_scope').GetName]."
clever_dsk.229.f: "We must take decisive action against the Annam government, as it has not only continuously violated its promises to foreigners and carried out brutal religious persecution, but has also responded to our peaceful gestures with violence and deception. Our long-standing patience and diplomatic efforts have failed, forcing us to take firm measures to punish these barbaric acts and ensure justice for our brutally murdered fellow believers and missionaries."
clever_dsk.229.a: "Send troops to punish [SCOPE.sCountry('dai_229_scope').GetName], [SCOPE.sCharacter('dai_229_person_scope').GetFullName]'s crimes must be punished."
clever_dsk.229.b: "We will not go to war for a few missionaries."
clever_dsk.230.t: "Punitive War Victory"
clever_dsk.230.d: "Our soldiers showed extraordinary courage in Cochinchina, fighting not only for faith but also for the honor of [SCOPE.GetRootScope.GetCountry.GetName] and the progress of civilization. Through the efforts of our army, [SCOPE.sCountry('dai_230_scope').GetName] has been defeated, and [SCOPE.sCharacter('dai_230_person_scope').GetFullName] had to send envoys to surrender to our generals, offering to cede three cities to guarantee the remaining land of #yellow Southern Annam#!."
clever_dsk.230.f: "Last year, our army achieved a decisive victory in Cochinchina. The capture and consolidation of Saigon provided us with a solid foothold in this fertile land. This important achievement not only punished the wrongdoers but also provided our navy with a crucial strategic base in the Far East, opening up the most promising prospects for our industrial and trade development."
clever_dsk.230.a: "Sign the 'Saigon Treaty', demarcating #yellow Southern Annam#! land ownership and determining further trade matters."
clever_dsk.230.b: "The Annamese are not qualified to propose any terms to us."
clever_dsk.231.t: "The Final Resistance"
clever_dsk.231.d: "Our soldiers have achieved successive victories in Cochinchina, and two successful 'Saigon Treaties' have forced [SCOPE.sCharacter('dai_231_person_scope').GetFullName] to submit to our rule. Now, our troops have reached the #yellow Hue Imperial City#!, and with one order from [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName], artillery will destroy this Nguyen Dynasty capital."
clever_dsk.231.f: "Rumors say that the #yellow Hue Imperial City#! is in chaos, with pro-war factions and pro-French factions arguing with each other, but in the end, [SCOPE.sCountry('dai_231_scope').GetName] refused to surrender to our demands, clearly not realizing the gap in power."
clever_dsk.231.a: "Approve the order to attack Hue."
clever_dsk.231.b: "Announce an immediate withdrawal, we have gained enough from Cochinchina."
clever_dsk.232.t: "Bulgarian Massacre"
clever_dsk.232.d: "Newspapers around the world are reporting on the war crimes committed by [SCOPE.sCountry('tur_232_scope').GetName] soldiers in their recent conflict with the #yellow Bulgarian rebels#!, especially with the approval of [SCOPE.sCharacter('tur_232_person_scope').GetFullName]."
clever_dsk.232.f: "The number of children killed in these massacres is staggering. They were often impaled with bayonets, and multiple eyewitnesses have testified that they saw infants being paraded on bayonets in the streets, both here and in Sofia.\n\n— J.A. McGahan, #italic Daily News#!"
clever_dsk.232.a: "Publicly condemn [SCOPE.sCountry('tur_232_scope').GetName]."
clever_dsk.232.b: "These are horrifying rumors!"
clever_dsk.233.t: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] Haircut"
clever_dsk.233.d: "Influenced by Western trends, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] decided to change their messy middle part hairstyle into a more stylish slicked-back look."
clever_dsk.233.f: "It is an honor to take a photo for His Majesty the Emperor, please look this way, Your Majesty, we will create a portrait that reflects Your Majesty's authority."
clever_dsk.233.a: "Long live the Emperor."
sino_event.85.b: "Let these royalists make a fuss!"
jiawu_war_events.5.t: "Breaking Free from Tribute"
jiawu_war_events.5.d: "Under the influence of Western ideas, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] decided to lead [SCOPE.GetRootScope.GetCountry.GetName] out of Manchu control and move towards a Westernized path."
jiawu_war_events.5.f: "Although the Grand Monarch is extremely wise and decisive, the accumulated stubborn traditions over four hundred years could not be quickly changed. The government needs reform, and only then can the monarchy be respected and the people's lives preserved... Even if it means sacrificing oneself, it is only to repay the monarch's favor."
transfer_state_events.8.f: "[SCOPE.sCountry('scope_rootxxx').GetName] has decided to transfer control of the [SCOPE.sS('transfer_state_chosen_state').GetName] region to us, may our friendship last forever."
clever_dsk.234.t: "Violation of #yellow German Empire Constitution#!"
clever_dsk.234.d: "[SCOPE.gsInterestGroup('shougun_ig').GetName]'s [ROOT.GetCountry.GetRuler.GetFirstName] opposed the proposal to enact [SCOPE.sLaw('current_law_scope').GetName], arguing that it violates the #yellow German Empire Constitution#!."
clever_dsk.234.f: "[SCOPE.GetRootScope.GetCountry.GetName] Constitution clearly states that the position of Federal President belongs to the King. Are you trying to rebel? Or have you forgotten that your remaining power was granted by the King? Since the constitution was established, it is the foundation of the country. Such unconstitutional laws will be despised by all."
clever_dsk.235.t: "#yellow Royal Wedding#!"
clever_dsk.235.d: "[SCOPE.GetRootScope.GetCountry.GetName] successfully established, and amidst a nationwide celebratory atmosphere, [ROOT.GetCountry.GetRuler.GetFirstName] arranged for their daughter to marry the famous #yellow Portuguese#! prince. At the wedding ceremony in Madrid Castle, people offered their most sincere blessings to this couple, symbolizing the unity of the Iberian Peninsula."
clever_dsk.235.f: "Looking at this scene, historians remarked that they were witnessing a wedding comparable to the one at the Juan Bivero Palace in the 15th century. In the presence of all the people, the Iberian nations finally established unbreakable friendships, united under the flag of [SCOPE.GetRootScope.GetCountry.GetName]. Boatmen can freely traverse the Tagus River, and no longer are there imposed national borders preventing the passionate #yellow Iberian#! people from communicating."
clever_dsk.235.a: "Cheer for [ROOT.GetCountry.GetRuler.GetFirstName], from now on we are all proud #yellow Iberians#!."
clever_dsk.236.t: "Franco-Russian Alliance Invitation"
clever_dsk.236.d: "[SCOPE.sCountry('fra_come_to_alliance_character_scope').GetName]'s [SCOPE.sCharacter('fra_ruler_come_to_alliance_character_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('fra_ruler_come_to_alliance_character_scope').GetFullName] arrived in St. Petersburg's Winter Palace and met with our esteemed [ROOT.GetCountry.GetRuler.GetFirstName], proposing an alliance."
clever_dsk.236.f:0: "Allow me to extend my sincere respect to you and the great [SCOPE.GetRootScope.GetCountry.GetName] in the name of [SCOPE.sCountry('fra_come_to_alliance_character_scope').GetName]. The balance of Europe is facing severe challenges today. The rise of Germany is no longer just a competition among great powers; its military strength and ambitions are reshaping the continental landscape, plunging both our nations into the shadow of strategic isolation. I deeply understand the profound conservative wisdom of [SCOPE.GetRootScope.GetCountry.GetName] and the value it places on sovereignty and independence. [SCOPE.sCountry('fra_come_to_alliance_character_scope').GetName] likewise holds national interest above all ideological divides. History has made us adversaries, but destiny calls us to unite—not for conquest, but to ensure that the balance of power is not unilaterally destroyed. A joint force of East and West will deliver an unshakable deterrence: any infringement on one party’s borders will meet with a decisive response from both fronts."
clever_dsk.236.a: "Alliances are shields of peace; may our two countries move forward hand in hand."
clever_dsk.236.b: "We have no interest in allying with [SCOPE.sCountry('fra_come_to_alliance_character_scope').GetName]."
clever_dsk.237.t: "Battle of Verdun"
clever_dsk.237.d: "[SCOPE.sCountry('ger_Battle_of_Verdun').GetName] and [SCOPE.sCountry('fra_Battle_of_Verdun').GetName] engaged in a decisive battle at Verdun. At the request of [SCOPE.sCharacter('ger_Battle_of_Verdun_benefactor').GetLastName], the French must be drawn into the fortified city of Verdun, known as the 'key to Paris,' where the Germans will attempt to wear down the French by besieging and cutting off their supply lines, draining [SCOPE.sCountry('fra_Battle_of_Verdun').GetName] of its last drop of blood."
clever_dsk.237.f: "Although [SCOPE.sCountry('ger_Battle_of_Verdun').GetName] caused [SCOPE.sCharacter('fra_Battle_of_Verdun_benefactor').GetLastName] to misjudge the direction of attack and relax the defenses of Verdun, the massed German troops in Verdun exposed [SCOPE.sCharacter('ger_Battle_of_Verdun_benefactor').GetLastName]'s true intentions. The sound of massive artillery explosions in the sky echoed across the land surrounding Verdun, signaling that a fierce battle was inevitable!"
clever_dsk.237.a: "#blue Stand firm#!, #white You#! #red Must not pass#!!"
clever_dsk.238.t: "Battle of Tannenberg"
clever_dsk.238.d: "[SCOPE.sCountry('ger_Battle_of_Tannenberg').GetName] and [SCOPE.sCountry('rus_Battle_of_Tannenberg').GetName] clashed in East Prussia. [SCOPE.sCharacter('rus_Battle_of_Tannenberg_benefactor').GetLastName] rushed to assist their French allies under immense pressure, launching an attack on East Prussia. The advance went smoothly, but [SCOPE.sCountry('ger_Battle_of_Tannenberg').GetName] had already gathered its army in defensive positions, ready to encircle any enemies foolish enough to attack."
clever_dsk.238.f: "[SCOPE.sCharacter('ger_Battle_of_Tannenberg_benefactor').GetLastName] realized that [SCOPE.sCharacter('rus_Battle_of_Tannenberg_benefactor').GetLastName] and his comrades lacked cooperation, and their tense relations meant that if [SCOPE.sCountry('ger_Battle_of_Tannenberg').GetName] could split and encircle the two Russian armies, they would be unable to support each other, providing an opportunity for complete destruction of the enemy."
clever_dsk.238.a: "The Teutonic Knights of Grunwald can rest now; their disgrace will eventually be washed away."
clever_dsk.241.t: "Manifest Destiny in Practice"
clever_dsk.241.d: "President James K. Polk’s term is coming to an end. He opposed trade protectionism, aiming to promote trade prosperity by lowering tariffs, and advocated for the establishment of an independent national treasury to prevent government funds from being controlled by private banks. On the international stage, he pushed for the expansion of the Pacific coast and Mexican territories, vigorously promoting the idea of [ROOT.GetCountry.GetName]'s Manifest Destiny. The people now firmly believe that [ROOT.GetCountry.GetName], guided by divine providence, is destined to rule the land from the Atlantic to the Pacific and has a duty to spread republicanism across the North American continent and fulfill its civilizing mission."
clever_dsk.241.f: "I feel completely relieved from all public affairs. I believe I will live a happier life in my retirement than I did during my four years in the highest office granted by the people. Polk's body had been worn down by the heavy work; his hair had turned completely white, and he suffered from chronic diarrhea. When he left the White House to return to Tennessee, he was welcomed by crowds from all over, further exhausting his already fragile health. He seemed like a hero who came and went freely, disappearing quickly from the public view after completing his mission, but the people will not forget him."
clever_dsk.241.a: "James K. Polk, we will not forget your contributions..."
clever_dsk.241.b: "The little walnut tree, you deserve to rest..."
clever_dsk.241.c: "Just an old man..."
clever_dsk.242.t: "The Promise of Manifest Destiny"
clever_dsk.242.d: "During the presidential campaign, Democratic leader [SCOPE.sCharacter('polk_scope').GetLastName] promised not only to integrate Texas into [SCOPE.GetRootScope.GetCountry.GetName] but also made four major promises: to promote trade prosperity by lowering tariffs; to establish an independent national treasury to prevent private bank control over government funds; to delineate the Oregon boundary and expand the Pacific coastline; and to acquire California and other Mexican territories, advancing the idea of Manifest Destiny."
clever_dsk.242.f: "[SCOPE.sCharacter('polk_scope').GetLastName] vigorously promoted the idea of Manifest Destiny, leading many people to believe that [ROOT.GetCountry.GetName], guided by divine providence, was not only destined to rule from the Atlantic to the Pacific but also had the responsibility to spread republicanism across the entire North American continent, fulfilling its civilizing mission."
clever_dsk.242.a: "Let's see how [SCOPE.sCharacter('polk_scope').GetLastName] fulfills his campaign promises."
dsk_queen_victoria.1.t: "Dear Teacher"
dsk_queen_victoria.1.d: "Recently, Princess [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] received a gift from her teacher #yellow Louise Laysen#!. For this teacher from a Lutheran pastor family in Hanover, [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] looked at her with deep gratitude, as though she was transported back to the wonderful times when she studied religion, history, English, and German with #yellow Louise Laysen#! and #yellow George Davis#!."
dsk_queen_victoria.1.f: "She has known me since I was six months old, and during the years from five to seventeen, she poured all her efforts into me with self-sacrifice, never taking a day off. I liked her, but I respected her even more. It seemed like she only had eyes for me."
dsk_queen_victoria.1.a: "With the efforts of many teachers, our Princess [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] has built a solid academic foundation."
dsk_queen_victoria.2.t: "The Invited Youth"
dsk_queen_victoria.2.d: "[SCOPE.sCountry('dsk_bel_scope').GetName]'s [SCOPE.sCharacter('bel_king_leopold_i_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('bel_king_leopold_i_scope').GetFirstName] decided to send his nephew [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] and his brother to stay with [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] at Kensington Palace for a few weeks to strengthen their relationship. With the permission of [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]'s mother, the Duke of Kent, [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] and his entourage have successfully arrived in [ROOT.GetCountry.GetCapital.GetCityHubName]."
dsk_queen_victoria.2.f: "After receiving a warm welcome from [ROOT.GetCountry.GetRuler.GetFirstName], Princess [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] took [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] by the hand, and the two of them toured the major sights of [ROOT.GetCountry.GetCapital.GetCityHubName]. They were invited by the mayor of [ROOT.GetCountry.GetCapital.GetCityHubName] to have lunch together."
dsk_queen_victoria.2.a: "May [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] and [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] enjoy their time in [ROOT.GetCountry.GetCapital.GetCityHubName]."
dsk_queen_victoria.2.b: "We do not welcome this German youth."
dsk_queen_victoria.3.t: "The Returning Youth"
dsk_queen_victoria.3.d: "Although [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] and [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] had some small misunderstandings due to language barriers during their time together, before departing for [SCOPE.sCountry('dsk_bel_scope').GetName], [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] resolved to learn English so that in the future, he could communicate more closely with the gentle and kind [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] princess."
dsk_queen_victoria.3.f: "I firmly believe that my uncle [SCOPE.sCharacter('bel_king_leopold_i_scope').GetFirstName] will bring me happiness, and I hope, and am confident, that my marriage with [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] will develop smoothly. This is very important to me. — [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]"
dsk_queen_victoria.3.a: "Perhaps this is part of [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]'s personality?"
dsk_queen_victoria.4.t: "The Angry King"
dsk_queen_victoria.4.d: "King [ROOT.GetCountry.GetRuler.GetFirstName] discovered that [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]'s mother, the Duke of Kent, had refused to participate in the Queen’s birthday celebrations and intended to prevent [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] from meeting him. On [TimeKeeper.GetCurrentDate.Format('y年 m月 d日')], in a fit of anger at the national banquet celebrating his own birthday, King [ROOT.GetCountry.GetRuler.GetFirstName] publicly expressed his wish to live long enough to see [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] become an adult, to avoid the arrogant and rude Duke of Kent acting as regent."
dsk_queen_victoria.4.f: "Thank you all for your birthday wishes. It’s been a long life, and even though my time may be short, I feel fulfilled... But when I think about the regency... So, I’ll directly entrust the royal power to that young lady instead of giving it to the one beside me, someone who listens to the devil’s advice! She doesn’t know her place! I’ve been insulted, and she’s prevented her daughter, my brother’s child, from approaching my palace!"
dsk_queen_victoria.4.a: "But from now on, I’ll make her know, I am King!!!"
dsk_queen_victoria.5.t: "The Joyful Coming of Age Ceremony"
dsk_queen_victoria.5.d: "Under the protection of everyone, Princess [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] successfully grew up. On [TimeKeeper.GetCurrentDate.Format('y年 m月 d日')] morning, in Kensington Palace, a morning song woke up [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName], and in front of her were gifts from all classes of British society, among which the most notable was a large piano given by the late King."
dsk_queen_victoria.5.f: "At the coming-of-age ball, Princess [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] eagerly danced with the Duke of Norfolk. Next, the Austrian ambassador kissed Princess [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]'s hand, and the two danced gracefully at St. James's Palace as if the stage was only for them. During the subsequent visit to the Royal Academy of Arts, the poet Rogers and the actor Campbell excitedly shook hands with Princess [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName], praising her for her polite demeanor."
dsk_queen_victoria.5.a: "Our Princess [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] has learned how to interact with people from all walks of life."
dsk_queen_victoria.6.t: "Preparing for the Throne"
dsk_queen_victoria.6.d: "The late King William IV has passed away. After the archbishop conducted the religious ceremony, the bishop and the court officials went to Kensington Palace and woke up Princess [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]'s teacher, #yellow Louise Laysen#!, to notify her of the King’s passing. Following the Prime Minister [SCOPE.sCharacter('queen_victoria_xuanshi_scope').GetFirstName], the Privy Council members arrived at Kensington Palace, awaiting the Queen’s speech regarding the arrangements for the affairs of state."
dsk_queen_victoria.6.f: "At such a young age, this heavy responsibility suddenly fell on me. Under the tender and enlightened care of my beloved mother, the Duchess of Kent, I received an English-style education, learning to respect and love the Constitution of my country. I will strive to maintain religious freedom and protect the rights of the British people. — [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]"
dsk_queen_victoria.6.a: "Princess, oh no, the esteemed [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] Queen, please accept our royal seal. We collectively swear allegiance to you and the Constitution of the United Kingdom..."
dsk_queen_victoria.7.t: "The Coronation Ceremony"
dsk_queen_victoria.7.d: "After settling the affairs of the late King William IV, Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] formally attended the coronation ceremony the next day. At St. James's Palace, the Lord Chamberlain read the coronation declaration, and the Queen’s resolute face glistened under the open windows of the Privy Council chamber. To her sides, the Viscount [SCOPE.sCharacter('queen_victoria_xuanshi_scope').GetFirstName] and the Marquis [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] knelt and led the ministers in swearing allegiance to Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]. Outside the window, the cheering crowd and the sound of cannon fire from the army could be heard."
dsk_queen_victoria.7.f: "This young monarch graciously accepted the allegiance of her subjects. When the first cheer from the crowd was heard, Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] became serious, and tears welled up in her eyes. The emotional shift made her royal demeanor even more captivating."
dsk_queen_victoria.7.a: "Your Majesty, believe me, in the days to come, more towns and places will be named after you."
dsk_queen_victoria.8.t: "Dissatisfied Leader"
dsk_queen_victoria.8.d: "Although Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]'s coronation ceremony was very smooth, the leader of the Tory party, [SCOPE.sCharacter('gbr_robert_peel_scope').GetFirstName], was very dissatisfied. He openly criticized the [SCOPE.sCharacter('gbr_queen_victoria_scope').GetAge]-year-old Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] for being too young, inexperienced, and ignorant of the world."
dsk_queen_victoria.8.f: "A true monarch who meets the constitutional requirements, whose personal qualities, maturity, and rich experience in handling state affairs, as well as knowledge of people, etiquette, and customs, serve as the ballast for the ship of state, can dispel the ministers' indecision, reduce the dangers posed by orators who rely on rhetoric in parliamentary debates, and ease the unwarranted anxieties over taxes and loans... ensuring that the country’s ship stays on course. Unfortunately, at this critical moment in our destiny, we are deprived of this advantage by a #yellow young, naive girl monarch#!."
dsk_queen_victoria.8.a: "[SCOPE.sCharacter('gbr_robert_peel_scope').GetFullName] is exaggerating."
dsk_queen_victoria.8.b: "[SCOPE.sCharacter('gbr_robert_peel_scope').GetFullName] is right; Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] still lacks political experience."
dsk_queen_victoria.9.t: "Excessive Favoritism"
dsk_queen_victoria.9.d: "Due to her parents' close relationship with the Whig Party, Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] openly showed favoritism towards the Whigs in public. She even accepted the Whig leader, Lord Melbourne, to become her private secretary, spending every day together in the same room, guiding her in state affairs. The *Times* sharply satirized that [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]'s excessive reliance on the Prime Minister was completely undignified for a Queen, and they nicknamed her 'Lady Melbourne.'"
dsk_queen_victoria.9.f: "The Whigs shamelessly say: 'The Queen is with us, because she likes us, she supports us.' This may be true, but I still have doubts. If one day the Queen no longer favors the Whigs, how long will she continue to support you?"
dsk_queen_victoria.9.a: "I will firmly support [SCOPE.sCharacter('gbr_william_lamb_scope').GetFirstName]."
dsk_queen_victoria.9.b: "Perhaps [SCOPE.sCharacter('gbr_william_lamb_scope').GetFirstName] the Prime Minister has crossed the line."
dsk_queen_victoria.10.t: "Marriage Candidates"
dsk_queen_victoria.10.d: "As Queen [SCOPE.sCharacter('royal_marriage_character').GetFirstName] grew older, her family and the Privy Council advisors had to consider the matter of her marriage, which would have a significant impact on the entire nation. The King of [SCOPE.sCountry('marriage_country').GetName] had already sent his nephew, [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName], a poor son of a German duke, as a potential match for the Queen. But knowing the importance of royal marriage with [SCOPE.GetRootScope.GetCountry.GetName], other countries were also eager to put forward their candidates."
dsk_queen_victoria.10.f: "[SCOPE.sCountry('marriage_country_rus').GetName] hopes that the Queen can realize a marriage with the heir to the throne, [SCOPE.sCharacter('gbr_queen_victoria_rus_scope').GetFirstName]. Queen [SCOPE.sCharacter('royal_marriage_character').GetFirstName] also thought [SCOPE.sCharacter('gbr_queen_victoria_rus_scope').GetFirstName] was a very handsome man, with a tall build, a handsome face, and such a charming heir ruling the vast [SCOPE.sCountry('marriage_country_rus').GetName] would have a great influence on Europe. [SCOPE.sCountry('marriage_country_net').GetName]’s royal family, [SCOPE.sCharacter('gbr_queen_victoria_net_scope').GetFirstName], also recommended their son, Prince Henry, the so-called 'King of the Sea,' to the Queen. However, Queen [SCOPE.sCharacter('royal_marriage_character').GetFirstName] found him rather ordinary, and apart from being recommended by the late King William IV for the marriage, he had nothing special."
dsk_queen_victoria.10.a: "[SCOPE.sCountry('marriage_country_rus').GetName]'s heir, [SCOPE.sCharacter('gbr_queen_victoria_rus_scope').GetFirstName], is a good choice."
dsk_queen_victoria.10.b: "We believe the late King’s judgment of Prince Henry from [SCOPE.sCountry('marriage_country_net').GetName] was correct."
dsk_queen_victoria.10.c: "Perhaps the Queen may favor her cousin, [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName], from [SCOPE.sCountry('marriage_country').GetName]?"
dsk_queen_victoria.11.t: "Albert's Visit"
dsk_queen_victoria.11.d: "Following the guidance of King [SCOPE.sCharacter('bel_king_leopold_i_scope').GetFirstName] of [SCOPE.sCountry('dsk_bel_scope').GetName], [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] and his elder brother Ernest visit Windsor Castle in [SCOPE.GetRootScope.GetCountry.GetName]. From childhood, Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName], who enjoyed and excelled at horseback riding, took [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] on a horseback ride around London. At a night banquet, they danced gracefully to the court's music. Unknowingly, Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] developed a sincere and intense love for [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]. On [TimeKeeper.GetCurrentDate.Format('y年 m月 d日')], the Queen summoned [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] to her room, and as a monarch, proposed to him."
dsk_queen_victoria.11.f: "As the Queen made the engagement public, it sent shockwaves across [SCOPE.GetRootScope.GetCountry.GetName] and Europe. King [SCOPE.sCharacter('bel_king_leopold_i_scope').GetFirstName] of [SCOPE.sCountry('dsk_bel_scope').GetName] was overjoyed, celebrating that his niece had made the right decision. Despite being surprised, Whig leader [SCOPE.sCharacter('gbr_william_lamb_scope').GetFirstName] sincerely wished Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] well. On the other hand, Conservative leader [SCOPE.sCharacter('gbr_robert_peel_scope').GetFirstName] believed the Queen treated love as recklessly as Juliet, and in a parliamentary vote, expressed that after marriage, [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] would not enjoy the independent status of a royal spouse and would see a significant reduction in his yearly allowance."
dsk_queen_victoria.11.a: "Are you ready, Your Majesty? The wedding will begin in four months."
dsk_queen_victoria.12.t: "The Grand Wedding"
dsk_queen_victoria.12.d: "On [TimeKeeper.GetCurrentDate.Format('y年 m月 d日')], in the small chapel of St. James's Palace, Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] and [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] were married as planned. [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] gazed lovingly at the Queen, holding her hand; the Queen, in her white gown, shyly looked into [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]'s eyes. Amidst the cheers of the crowd, [SCOPE.GetRootScope.GetCountry.GetName] witnessed a grand wedding."
dsk_queen_victoria.12.f: "Marriage to [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] is my personal choice. I will uphold this sacred commitment because it is a decision I made after careful consideration. I believe that with the blessings of Almighty God, this marriage will bring me joy and is also in the best interest of the country. — Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]"
dsk_queen_victoria.12.a: "Best wishes to Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] and Prince [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]."
dsk_queen_victoria.13.t: "A Grand Celebration"
dsk_queen_victoria.13.d: "On [TimeKeeper.GetCurrentDate.Format('y年 m月 d日')], a momentous event occurred in Europe: in the small chapel of St. James's Palace, Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName] of [SCOPE.sCountry('marriage_country_gbr').GetName] and [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] were married as scheduled. [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] looked at the Queen with affection, holding her hand. The Queen, in her white dress, gazed shyly into [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]'s eyes. Amidst the applause of the crowd, [SCOPE.sCountry('marriage_country_gbr').GetName] ushered in a grand wedding."
dsk_queen_victoria.13.f: "Marrying [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName] is my personal wish. I will adhere to this sacred commitment, for it is a decision I made after careful thought. I believe that with the Almighty's blessing, this marriage will bring me joy and serve the national interest. — Queen [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]"
dsk_queen_victoria.13.a: "Best wishes to them."
dsk_queen_victoria.13.b: "Defame this couple of [SCOPE.sCountry('marriage_country_gbr').GetName]."

je_yunnan_valley_expedition: "Expedition to the Insect Valley of Yunnan"
je_yunnan_valley_expedition_reason: "Hidden in the mountains of Yunnan lies a mysterious valley—Insect Valley. It is said to be home to strange creatures and rare herbs, but the roads are treacherous, and the local tribes keep the area shrouded in secrecy. This place is also the site of the ancient tomb of the King of Dian, where the legendary divine bead, the Bian Chen Pearl, is buried along with numerous venomous insects, poisonous gases, and deadly traps."
je_yunnan_valley_expedition_goal: "Find the legendary tomb of the King of Dian and the divine Bian Chen Pearl."
je_yunnan_valley_expedition_success_tt: "[SCOPE.sCharacter('yunnan_expedition_leader').GetFullName] successfully explored the Insect Valley and found the divine Bian Chen Pearl."
je_yunnan_valley_expedition_success_event_tt: "In the tomb of the King of Dian, the Bian Chen Pearl was retrieved, the curse was broken, and an alliance was formed with the guardians of the tomb."
je_yunnan_valley_expedition_failure_tt: "The expedition may fail if:\n• The leader [SCOPE.sCharacter('yunnan_expedition_leader').GetFullName] dies.\n• We lose control of the expedition team.\n• [SCOPE.sCharacter('yunnan_expedition_leader').GetFullName] fails to establish friendly relations with the local tribes."
expedition_costs_tt: "The expedition will consume a large amount of resources."
je_yunnan_valley_expedition_advance: "The expedition progress will #bold advance#!."
je_yunnan_valley_expedition_sub: "The expedition progress will #bold regress#!."
yunnan_expedition_delayed: "The Insect Valley expedition has been delayed by #bold 3#! months."

# Event 1: Expedition Begins
dsk_yunnan_valley.1.t: "Exploring the Insect Valley of Yunnan!"
dsk_yunnan_valley.1.d: "We have decided to venture deep into the heart of the Zhelong Mountains in Yunnan—the Insect Valley. This area was once a secret of the Kingdom of Dian, said to be the burial site of the King of Dian, where the Bian Chen Pearl is hidden, surrounded by venomous insects, poisonous mists, and dangerous traps. The local Yi people regard it as a forbidden land, and no outsiders have dared to enter."
dsk_yunnan_valley.1.f: "“On the map, this is just a marked area—‘Unexplored Territory.’ But we know this place holds endless possibilities. Herbs, minerals, unknown species… even legendary treasures!”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] put down his pipe and traced a line on the map. “Let’s send an expedition team. I know exactly who is suited for this task!”"
dsk_yunnan_valley.1.a: "I know exactly who is suited for this task!"

# Event 2: Choose Commander
dsk_yunnan_valley.2.t: "Choose the Expedition Commander"
dsk_yunnan_valley.2.d: "The treasure-hunting team needs a commander who is knowledgeable in feng shui secrets and familiar with the strange happenings of the southern regions. There are several capable individuals willing to embark on the perilous journey, but each has their own concerns."
dsk_yunnan_valley.2.f: "The generals sat around the meeting table, each reluctant to volunteer for this dangerous yet enticing mission.\n\n“King Dian’s poison arts are ruthless, and traps are everywhere. Without knowledge of feng shui, it’s a one-way trip,” one general said, staring at the table.\n\n“Of course, we’ll need it,” another agreed, gazing out the window.\n\nSilence. No one wanted to take the lead."
dsk_yunnan_valley.2.a: "Appoint [SCOPE.sCharacter('yunnan_expedition_leader_1').GetFullName] as the commander."
dsk_yunnan_valley.2.b: "Let [SCOPE.sCharacter('yunnan_expedition_leader_2').GetFullName] lead the expedition."
dsk_yunnan_valley.2.c: "Send [SCOPE.sCharacter('yunnan_expedition_leader_3').GetFullName] to complete this mission."
dsk_yunnan_valley.2.cc: "Send [SCOPE.sCharacter('yunnan_expedition_leader_4').GetFullName] to complete this mission."

# Event 3: Expedition Launches
dsk_yunnan_valley.3.t: "Expedition Team Departs"
dsk_yunnan_valley.3.d: "Under the leadership of [SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetFullName], our Insect Valley expedition officially begins.\n\n#N Since [SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe] is fully responsible for this expedition, if [SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe] dies, the expedition will fail.#!"
dsk_yunnan_valley.3.f: "[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] stood at the front of the team, eyes firm. “Soldiers, we are heading into uncharted lands. There will be opportunities and dangers. But I believe that as long as we stick together, nothing can stop us!”\n\nHe turned to the logistics officer. “Are the supplies ready?”\n\n“Everything is prepared, we can depart at any time.”"
dsk_yunnan_valley.3.a: "March forward, into the Insect Valley!"

# Event 4: Yak Herders Incident
dsk_yunnan_valley.4.t: "Conflict with the Yi Tribe"
dsk_yunnan_valley.4.d: "As the team passed through Zhelong Village, a conflict broke out with the Yi people due to accidentally stepping into a sacred area. The Yi people have guarded the Insect Valley for generations and view outsiders as desecrators of sacred land. The tribe leader issued a stern warning, stating that if they did not leave immediately, they would be met with their ancestral poison arts. [SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName] considered this a provocation by the Yi people and was ready to use force to push forward."
dsk_yunnan_valley.4.f: "“They even tied our guide to the sacrificial pillar, threatening to sacrifice him to the valley gods!” a team member exclaimed.\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] clenched his weapon. “These barbarians are stubborn! We’ve brought enough firearms; let’s attack under cover of night, rescue the guide, and force our way through!”\n\nAn old herbalist shook his head, “The Yi people’s poison arts are strange, we cannot fight them head-on. Perhaps we can seek out the village elders and negotiate.”"
dsk_yunnan_valley.4.a: "Use force to break through and attack."
dsk_yunnan_valley.4.b: "Seek peace and beg for passage."

# Event 5: Mountain Survey
dsk_yunnan_valley.5.t: "Mountain Survey"
dsk_yunnan_valley.5.d: "The survey team has begun mapping the mountains and passes surrounding the Insect Valley. Venturing into unknown territory and climbing unexplored peaks is a dangerous task, but [SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName] still hopes to participate."
dsk_yunnan_valley.5.f: "“Do you see that peak? We #italic must#! climb it!”\n\n“But why?”\n\n“Because… it’s #italic right there#!”"
dsk_yunnan_valley.5.a: "We should not risk our lives, send someone else."
dsk_yunnan_valley.5.b: "[SCOPE.sCharacter('yunnan_expedition_leader').GetLastName] should take charge here."

# Event 6: Leeches!
dsk_yunnan_valley.6.t: "Leeches!"
dsk_yunnan_valley.6.d: "The team stumbled into a swamp filled with giant blood-red leeches, and there are also ‘leech poisons’ that burrow into the skin. This route is a shortcut to the Dark River, but if we bypass it, we will lose three days and potentially miss the crucial moment. The leader must decide whether to push through."
dsk_yunnan_valley.6.f: "“No.”\n\n“No. No, no, no.”\n\nThe scout took one last look at the swamp’s water. A hint of laughter escaped his lips. “Hahaha, #italic no!#!”\n\nThese aren’t ordinary leeches; they are the King of Dian’s poison leeches. Once they attach, they burrow into the bloodstream and drain the life force. But that will be someone else’s problem, not his."
dsk_yunnan_valley.6.a: "[SCOPE.sCharacter('yunnan_expedition_leader').GetLastName] can do it, and must do it."
dsk_yunnan_valley.6.b: "Maybe it's better to rest for a while."
 
# Event 7: Selecting the Expeditionary Force
dsk_yunnan_valley.7.t: "Reinforcing the Team"
dsk_yunnan_valley.7.d: "The team has already suffered casualties and urgently needs reinforcements. [SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName] announces that [SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe] knows of several skilled individuals in nearby villages: a hunter skilled in trap-making, a peddler who speaks the Yi language, and a Miao woman who can cure poison and venom."
dsk_yunnan_valley.7.f: "This shouldn't be so difficult. It’s just a task, like any other job. But for some reason, finding the right person for this job has proven harder than anyone expected. What we need isn’t just skill, but the courage to face the gates of hell."
dsk_yunnan_valley.7.a: "This expedition cannot, and will not, lack manpower."
dsk_yunnan_valley.7.b: "Only the most determined soldiers can face the coming challenges."

# Event 8: Entering the Valley
dsk_yunnan_valley.8.t: "Entering the Insect Valley"
dsk_yunnan_valley.8.d: "After overcoming many dangers, the team finally passed through the Zhelong Mountain pass, and [SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName] was finally able to step into the Insect Valley. This place is filled with disrupted feng shui, a 'bewitching formation' set by the King of Dian, and ordinary compasses fail to provide accurate direction."
dsk_yunnan_valley.8.f: "“We did not come here for glory, nor for gold,” the officer walked slowly past the assembled team. “At least not for ourselves. No one will remember us.”\n\nHe pointed to the distant mountains. “#italic Those#! will be remembered. Do we want to stand here, or stand #italic there#!, on those rocks that will outlast all memory?”"
dsk_yunnan_valley.8.a: "Proceed to the mysterious place!"

# Event 9: Blizzard
dsk_yunnan_valley.9.t: "Blizzard"
dsk_yunnan_valley.9.d: "[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]'s expedition encountered unexpected bad weather along a dangerous route in the Insect Valley. Delays could be costly, but continuing in such harsh conditions could be even more dangerous."
dsk_yunnan_valley.9.f: "The cold wind blew past [SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]. Frost had frozen the ground. The temperature was far below freezing, and [SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe] could barely see beyond [SCOPE.sCharacter('yunnan_expedition_leader').GetHerHis] nose."
dsk_yunnan_valley.9.a: "We must not fear the storm and continue forward!"
dsk_yunnan_valley.9.b: "It’s better to be cautious and weather the storm."

# Event 10: Unsanctioned Plundering
dsk_yunnan_valley.10.t: "Unauthorized Plundering of Relics"
dsk_yunnan_valley.10.d: "As [SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]'s soldiers approached deeper into the Insect Valley, some soldiers began to act out of line. Reports have surfaced that a group of our soldiers broke into caves and ruins, driven by greed, and secretly hid some relics when the leader wasn’t looking."
dsk_yunnan_valley.10.f: "“We’ve risked our lives to come here; can’t we take something to cover our expenses? After all, the goal is the Niochen Pearl; what harm can these little things do?”\n\n“I assure you, sir, this is well within acceptable limits. We’ve faced opposition, but that was expected. Of course, those curses carved on the King’s ritual items are surely exaggerated.”"
dsk_yunnan_valley.10.a: "So what? Isn’t this how the army works?"
dsk_yunnan_valley.10.b: "Punish the soldiers who broke the rules."

# Event 11: Negotiations
dsk_yunnan_valley.11.t: "Seeking an Audience with the Yi Elders"
dsk_yunnan_valley.11.d: "As our expedition ventures deeper into the Insect Valley, it’s time to address the diplomatic issues. According to the guide, there’s a hidden Yi tribe nearby, and the tribal elders know some of the secrets of the valley. They may be able to help, but the Yi are extremely wary of outsiders, and gaining their trust won’t be easy."
dsk_yunnan_valley.11.f: "He saw the officer slumped at the table, holding his head.\n\n“You talked to one elder, and he took you to another elder. You talked to #italic the second#! elder, and #italic he#! told you that you had the wrong person and pointed you to a third one. Then that guy—he said you were completely wrong, #italic the first#! elder is the one with all the power.”\n\n“Oh, where does this lead? Who’s in charge here?”"
dsk_yunnan_valley.11.a: "Speak directly to the elders."
dsk_yunnan_valley.11.b: "We don’t have any more time."

# Event 12: Treaty of the Valley
dsk_yunnan_valley.12.t: "Niochen Pearl from the King’s Tomb"
dsk_yunnan_valley.12.d: "[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetFullName] led the team through many life-threatening challenges and finally entered the King of Dian’s tomb. In the main burial chamber behind the Three Generations Bridge, they found the Niochen Pearl, integrated with the King’s skull! This legendary treasure is now in our hands. [SCOPE.sCharacter('yunnan_expedition_leader').GetLastName] was warmly welcomed in [ROOT.GetCountry.GetCapital.GetCityHubName], and a bright future awaits [SCOPE.sCharacter('yunnan_expedition_leader').GetHerHim]."
dsk_yunnan_valley.12.f: "“It’s simple, really.”\n\nThe man pointed at the map on the wall with a cigarette butt. “#italic That#! is our weakness. We must invest all the necessary manpower and money to ensure safety, uh…” He stopped, trying to see through the smoke, “Yunnan Insect Valley! We must occupy and control this land to save ourselves!”\n\nHe turned to the others in the club. “Now! Who’s ready to celebrate?”"
dsk_yunnan_valley.12.a: "Cheers for [SCOPE.sCharacter('yunnan_expedition_leader').GetFullName]!"

# Event 13: Expedition Failed
dsk_yunnan_valley.13.t: "Devastating Defeat in the Insect Valley"
dsk_yunnan_valley.13.d: "Our expedition suffered a catastrophic defeat. [SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetFullName]'s team encountered fatal traps in the King’s tomb. Surrounded by venomous tides and the deadly Wu’s immortal insects, most of the team perished. The survivors were forced to abandon the mission and flee the valley in panic."
dsk_yunnan_valley.13.f: "“This... this was completely unexpected,” the officer stammered. “Those bugs, those #italic bugs#! are everywhere! Our compass malfunctioned, and the map was useless…”\n\nHe took off his hat and wiped his face. “I suggest... we reassess this mission.”"
dsk_yunnan_valley.13.a: "This is a painful lesson."

# Event 14: Strange Flora Discovery
dsk_yunnan_valley.14.t: "Discovery of Strange Plants"
dsk_yunnan_valley.14.d: "The team discovered a cluster of glowing fungi along the bank of the dark river. The caps emitted a faint blue light, illuminating the surrounding darkness. The old Miao healer identified these as #yellow 'Guide Fungi'#!, which are not only non-toxic, but their juice can dispel low-concentration miasma and also serve as a natural light source."
dsk_yunnan_valley.14.f: "The scientists gathered around the glowing fungi, their eyes sparkling with excitement.\n\n“Incredible! The bioluminescence mechanism of these organisms is unlike any known species!”\n\n“If we can bring back samples... No, if we can establish a research station here...”"
dsk_yunnan_valley.14.a: "Study these glowing fungi; they may be the key to a scientific breakthrough."
dsk_yunnan_valley.14.b: "Collect samples; these herbs may have medicinal value."

# Event 15: Local Tribe Encounter
dsk_yunnan_valley.15.t: "Negotiations with the Elders"
dsk_yunnan_valley.15.d: "At the entrance of the tribal village, a few Yi warriors armed with spears blocked the team’s path. “Outsiders, this is not a place for you!” the leader of the warriors glared angrily.\n\nThe leader stepped forward and clasped his hands. “We are not here to plunder, but to find the Niochen Pearl to break the curse. We’ve run out of supplies and ask to meet the elders. We are willing to exchange gold for herbs and guidance.”"
dsk_yunnan_valley.15.f: "The tribal elder gazed at the outsiders with a scrutinizing eye.\n\n“What are you here for?” he asked in a stiff tone.\n\n“We... We are here to explore this land, for the advancement of science...”\n\n“Science?” The elder frowned. “What do you want? We have herbs, stories, and... secrets. But if you want my guidance, you must help us destroy the 'Tian Yu Formation' outside the King’s tomb. The worms hidden in those figurines have started to erode our land.”"
dsk_yunnan_valley.15.a: "Agree to the elder’s request."
dsk_yunnan_valley.15.b: "Refuse to cooperate, and end this here."

# Event 16: Hostile Confrontation
dsk_yunnan_valley.16.t: "Corpse Moth Assault from the Tian Yu Formation"
dsk_yunnan_valley.16.d: "These pitch-black flying insects feed on rotting flesh, with sharp mandibles and no fear of fire. Once surrounded, they are certain to kill. The leader must act immediately."
dsk_yunnan_valley.16.f: "[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] frowned at the sight. Countless corpse moths swarmed in like a black cloud, emitting a shrill buzzing sound, but [SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe] knew what kind of weapons the expedition team had brought."
dsk_yunnan_valley.16.a: "Use sulfur and torches to build a defense line and hold the position!"
dsk_yunnan_valley.16.b: "Abandon the camp and break through to the open area."

# Event 17: Bioluminescence Discovery
dsk_yunnan_valley.17.t: "Bioluminescence Research"
dsk_yunnan_valley.17.d: "The old Miao healer conducted an in-depth study of the collected glowing fungi and discovered that not only could it dispel miasma, but when mixed with glutinous rice, it could also neutralize low-level Tian Yu worms. It could even glow for twelve hours in the dark, making it an excellent tool for exploring the tomb."
dsk_yunnan_valley.17.f: "The old Miao healer dropped the glowing fungus juice onto the rice, and it immediately emitted a blue light with a fragrant smell. “I’ve tested it. This mixture can expel the worm from the body, light the tomb, and won’t attract poisonous insects.”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] picked up a handful of rice mixed with the fungus juice: “This is truly a gift from heaven! With this, we have a better chance in the tomb.”"
dsk_yunnan_valley.17.a: "Produce a large quantity of glowing rice."
dsk_yunnan_valley.17.b: "Keep some of the fungi species for future research."

# Event 18: Trade Relations Established

dsk_yunnan_valley.18.t: "Trade with the Yi Village"
dsk_yunnan_valley.18.d: "After enduring hardships together with the Yi village, the team finally established a temporary trade relationship with the grave-guarding Yi tribe. The Yi provided antidote herbs, special insect-repelling powders, and some maps of the tomb's mechanisms, while the team exchanged salt, cloth, and ironware."
dsk_yunnan_valley.18.f: "The trading tents were filled with items from two worlds. Spices, minerals, unknown plant specimens... and guns, tools, and fabrics from the industrialized world.\n\n“This is the beginning of a new era,” one merchant wrote the trade list in his notebook. “From today, the Insect Valley is connected to the world.”"
dsk_yunnan_valley.18.a: "Establish a permanent trade route."
dsk_yunnan_valley.18.b: "Promote cultural exchanges."

# Event 19: Colony Established
dsk_yunnan_valley.19.t: "Camp Set at Lingyun Heavenly Palace"
dsk_yunnan_valley.19.d: "The team arrived at the above-ground structure of the King of Dian's tomb — the Lingyun Heavenly Palace. Though in ruins, the terrain is strategic and defensible, providing protection from the miasma and venomous creatures in the valley. The leader decided to establish a temporary camp here and resupply before entering the tomb."
dsk_yunnan_valley.19.f: "Inside the grand hall of Lingyun Heavenly Palace, the team members were clearing debris and setting up tents. Faint murals could still be seen on the walls, depicting scenes of the King’s coronation, sacrifices, and the crafting of the Tian Yu worm curse.\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] stood before the mural, studying it carefully. 'These murals may hold clues to the tomb. While resting, be sure to pay attention to the stone carvings and patterns inside the hall, don’t miss any details.'"
dsk_yunnan_valley.19.a: "Rest for a moment."

# Event 20: Hidden Path Discovered
dsk_yunnan_valley.20.t: "Hidden Passage"
dsk_yunnan_valley.20.d: "The expedition broke through and finally discovered a hidden path in the mountains, which seemed to lead directly to the core area of the Insect Valley."
dsk_yunnan_valley.20.f: "“Look here!” The guide excitedly pointed at the markings on the rock wall. “These are traces left by ancient merchant caravans... this path leads to a deeper area!”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] carefully studied the ancient symbols. “This may be the path to the legendary ‘Heart of the Insect Valley’.”"
dsk_yunnan_valley.20.a: "Explore through the hidden passage."
dsk_yunnan_valley.20.b: "Study these ancient markings first."

# Event 21: Heart of the Valley
dsk_yunnan_valley.21.t: "Heart of the Insect Valley"
dsk_yunnan_valley.21.d: "The team entered the core of the Insect Valley through a dark river. The ecosystem here is uniquely bizarre: bioluminescent fungi cover the rock walls, giant vines crisscross, and various unknown venomous insects and strange creatures coexist. This is both a forbidden land of death and a complete primitive ecosystem."
dsk_yunnan_valley.21.f: "“Incredible...” The old Miao healer knelt, trembling as he touched the glowing moss. “The King used the Tian Yu techniques and Feng Shui to create this closed ecosystem. It guards the tomb while nurturing countless poisonous creatures. Truly astonishing!”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] quietly observed everything."
dsk_yunnan_valley.21.a: "Avoid dangerous areas and head straight to the tomb entrance!"

# Event 22: Scientific Breakthrough
dsk_yunnan_valley.22.t: "Scientific Breakthrough"
dsk_yunnan_valley.22.d: "The in-depth study of the Insect Valley's biodiversity has achieved a major breakthrough, which will have revolutionary implications for basic science."
dsk_yunnan_valley.22.f: "In the lab, scientists excitedly exchanged their findings.\n\n“These compounds have an unprecedented structure!”\n\n“If we can synthesize them... medicine will enter a whole new era!”\n\n“I recommend immediately reporting this discovery to [ROOT.GetCountry.GetCapital.GetCityHubName]!”"
dsk_yunnan_valley.22.a: "Announce this major discovery immediately."
dsk_yunnan_valley.22.b: "Keep it a secret, prioritize developing its commercial value."

# Event 23: Medical Revolution
dsk_yunnan_valley.23.t: "Medical Breakthrough"
dsk_yunnan_valley.23.d: "The active ingredients extracted from the Insect Valley's herbs have shown remarkable medical effects in experiments, potentially treating various diseases."
dsk_yunnan_valley.23.f: "“This is the most important medical discovery of the century!” the medical supervisor exclaimed excitedly.\n\n“Our experiments show that these compounds have significant effects on infections, inflammation, and even certain cancers.”\n\n“If mass-produced... humanity's health will undergo a revolution!”"
dsk_yunnan_valley.23.a: "Begin clinical trials immediately."

# Event 24: Treasure Trove
dsk_yunnan_valley.24.t: "Trap Mechanism"
dsk_yunnan_valley.24.d: "The team entered a corridor, where the ground seemed stable with flagstone flooring, but hidden beneath it was a series of deadly trap mechanisms. Once triggered, the floorboards would flip, dropping anyone into a pit filled with sharp blades, and iron chains would drop from the ceiling to trap them. The leader must act quickly to determine how to proceed."
dsk_yunnan_valley.24.f: "A cold wind blew through the corridor, and the murals on the walls had already faded, only the flagstones on the ground glowed faintly.\n\n“Something’s wrong. There’s no dust in these cracks. This must be a trap!” An elder, experienced in tomb raiding, crouched down and tapped the stone slabs, which echoed hollowly.\n\nBefore he could finish speaking, an impatient team member stepped onto the edge of a stone slab. There was a loud ‘click,’ and the stone flipped, sending the team member falling into the darkness, followed by a scream as sharp blades pierced through their body. The heavy stone on the ceiling started to move, and the sound of iron chains scraping was deafening."  
dsk_yunnan_valley.24.a: "Lift the stone pillars in the sequence of the Dian script to disable the trap."
dsk_yunnan_valley.24.b: "Use the Miao knives to prop up the stone slabs and force your way through."
dsk_yunnan_valley.24.c: "Light a gunpowder flask to detonate the stone and clear a path."

# Event 25: Cultural Assimilation
dsk_yunnan_valley.25.t: "Dancing Grass Illusion Formation"
dsk_yunnan_valley.25.d: "The team encountered fields of dancing grass in the dense forest. This plant is extremely sensitive to sound and temperature, causing its leaves to sway with motion. The pollen it releases induces hallucinations, making individuals mistake their companions for venomous creatures. [SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] realized the pollen can be dispersed by strong light, but setting a fire may attract even more dangerous creatures."
dsk_yunnan_valley.25.f: "In the depths of the forest, fields of dancing grass swayed in the wind, their purple leaves fluttering like tiny hands, and the air was filled with a faint, sweet fragrance.\n\n“Something’s wrong... I see swarms of hornet bees ahead!” one team member suddenly raised his firearm, aiming at a fellow team member.\n\n“It’s an illusion! The grass’s pollen messes with the mind!” [SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] covered his nose and mouth, pulling out dried mugwort from his pouch, “The smoke from burning mugwort will dispel the hallucinations, but the fire will attract corpse moths and owls!”\n\nAt this moment, a team member under the illusion fired, narrowly missing the leader’s shoulder and hitting an ancient tree, causing a flock of birds to take off."
dsk_yunnan_valley.25.a: "Burn the mugwort to dispel the hallucinations!"
dsk_yunnan_valley.25.b: "Cover your nose and mouth with wet cloth and quickly run out of the grass!"
dsk_yunnan_valley.25.c: "Knock out the affected team member and evacuate!"

# Event 26: Alliance Formed
dsk_yunnan_valley.26.t: "Owl Attack at Night"
dsk_yunnan_valley.26.d: "While camping in the valley, the team was attacked by giant owls. These large birds of prey, native to southern Yunnan, have powerful beaks and sharp claws, and are especially sensitive to light, often hunting in groups. The camp's torches attracted several owls, and the team must choose between defending the camp and extinguishing the light sources."
dsk_yunnan_valley.26.f: "The night was dark, and the camp's torches lit up the surrounding clearing as the team members were repairing tents. Suddenly, the shrill calls of giant owls cut through the air, and three owls, with wingspans nearly 10 feet wide, dove down, claws aiming for the team members near the torches.\n\n“It’s the owls! These things can carry off calves!” a hunter among the team swung his Miao knife and severed one owl’s wing, but another scratched his arm, and blood poured out immediately.\n\nThe owl's feathers were like armor, and only close-range gunshots could pierce them, but in the darkness, it was impossible to aim.”\n\n“Extinguish the torches! They fear the dark!” the old Miao healer shouted as he tried to blow out the torches, but [SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] stopped him"

dsk_yunnan_valley.26.b: "Extinguish all light sources and lie low to avoid attack!"
dsk_yunnan_valley.26.c: "Discard some of the gear to distract the owls and draw them away!"

# Event 27: Ancient Prophecy
dsk_yunnan_valley.27.t: "King's Prophecy"
dsk_yunnan_valley.27.d: "As the imprint of the Ghost Cave resurfaces and the curse of the Red Spots spreads, a person from a distant land will arrive with the Heavenly Stone, breaking the curse and restoring peace to the Insect Valley."
dsk_yunnan_valley.27.f: "The elder's voice echoed around the campfire:\n\n“When the silver birds bring the one from afar, when the stars begin to sing at night, the gate of the Insect Valley will open again…”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] listened quietly, a strange feeling rising in their chest. Perhaps their arrival was not by chance."
dsk_yunnan_valley.27.a: "Listen to this ancient prophecy carefully."

# Event 28: Legend of the Valley
dsk_yunnan_valley.28.t: "The Cursed Jade Coffin"
dsk_yunnan_valley.28.d: "The team reaches the main burial chamber of the King of Dian. At the center lies a jade coffin, fully made of emerald jade, carved with intricate worm patterns. Green liquid seeps from the cracks of the coffin, radiating a chilling aura. Touching the coffin will trigger vengeful illusions from the King’s life, and while opening the coffin might reveal clues about the Tian Yu worm, it will also unleash the vengeful spirits sealed inside."
dsk_yunnan_valley.28.f: "The ceiling of the main tomb chamber was inlaid with luminous pearls, illuminating the jade coffin below, its green surface glistening under the light. Dark green liquid dripped from the coffin’s edges, corroding the ground beneath it.\n\n“This is the King of Dian’s jade coffin, made from a thousand-year-old black jade, containing his vengeful soul and the Tian Yu worm curse!” the old Miao healer took out a compass, its needle spinning wildly. “The illusions will make one relive the King’s slaughter, and those with weak will may die from terror!”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] fixed their gaze on the worm-like patterns on the coffin’s lid, noticing that the end of the pattern seemed to point to a recess at the bottom of the coffin. “The clue to the Tian Yu worm is definitely inside! But if we open the coffin, the vengeful spirits will be released!”\n\nBefore they could finish speaking, a greedy team member had already reached for the coffin lid. As their fingers brushed against the jade, they let out a blood-curdling scream, their eyes wide open as if seeing something incredibly horrific, and collapsed to the ground, foaming at the mouth.\n\nThe coffin began to shake slightly, and the green liquid seeped out faster, the surrounding temperature dropping rapidly, while twisted shadows appeared on the walls, as if something was about to emerge from the darkness."
dsk_yunnan_valley.28.a: "Force open the jade coffin and search for clues to the Tian Yu worm!"
dsk_yunnan_valley.28.b: "Pour black dog blood over the jade coffin to suppress the vengeful spirits!"
dsk_yunnan_valley.28.c: "Abandon the jade coffin and search for another exit in the tomb!"

# Event 29: Mutual Respect
dsk_yunnan_valley.29.t: "The Bronze Bell Dilemma"
dsk_yunnan_valley.29.d: "In a burial pit, the team discovers a bronze bell engraved with worm curse symbols. The bell, when rung, produces a sound wave that disperses low-level poisonous insects but also awakens the Tian Yu worms nearby. The pit also contains various gold and silver treasures, and some members of the team are tempted to take the bell along with the treasures."
dsk_yunnan_valley.29.f: "The burial pit was filled with decayed coffins, and at the center of the stone altar lay a fist-sized bronze bell, its engravings glowing green under the light of the bioluminescent fungi.\n\n“This is the King’s bell, a charm used to expel insects, but its curse also awakens the nearby Tian Yu worms,” the geomancer ran his fingers over the bell’s patterns, his face serious.\n\nOne member, seeing no one paying attention, secretly pocketed a gold ornament and reached for the bronze bell. “This bell is both valuable and useful! We must take it!”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] grabbed his wrist firmly. “Greed will kill us! If we take the bell, the Tian Yu worms will wake up!” The moment they finished speaking, a faint tapping sound was heard beneath the altar as if something was breaking through the ground."
dsk_yunnan_valley.29.a: "Leave the bell and treasures behind, and quickly evacuate the burial pit!"
dsk_yunnan_valley.29.b: "Take the bell and use its sound to clear a path!"
dsk_yunnan_valley.29.c: "Take some treasures, discard the torch, and block the Tian Yu worms!"

# Event 30: Economic Boom
dsk_yunnan_valley.30.t: "Blood Pool and Corpse Moth Ambush"
dsk_yunnan_valley.30.d: "The team enters the side chamber of the main tomb. The floor is covered with dark red blood pools, soaking the bones of hundreds of children. The eggs of the Tian Yu worms are hidden at the bottom of the pool. Any blood spilled in the pool will instantly hatch the eggs into corpse moths, which feed on decaying blood. These poisonous insects are sensitive to fire but are attracted to fat. The fire oil carried by the team members may become their death trap."
dsk_yunnan_valley.30.f: "The side chamber was dark and damp, the air filled with the stench of blood and decay. The blood pools on the floor emitted an eerie red glow, with skeletons partially submerged in the water, and a thin layer of insect eggs floated on the surface.\n\n“This is the King’s ‘Insect Breeding Pool,’ where child sacrifices were used to breed Tian Yu worm eggs! The eggs awaken when exposed to blood!” The geomancer stepped back, his face pale. He had accidentally crushed a bone, and his ankle was cut, causing his blood to drip into the pool.\n\nIn an instant, the blood pool began to bubble violently, and countless black corpse moths hatched, flapping their wings with a buzzing sound. The toxic powder from their wings spread like black fog.\n\n“Quick! Use fire oil to burn them! They fear fire!” the hunter took out his oil flask, but the old Miao healer stopped him. “Fire oil will ignite us! The moths are drawn to fat, we’ll be their target!”\n\nThe corpse moths quickly surrounded them, and the first few already attacked the wounded geomancer, their wings leaving black, infected streaks across his face."
dsk_yunnan_valley.30.a: "Throw fire oil into the blood pool and burn the corpse moths!"
dsk_yunnan_valley.30.b: "Wrap yourself in wet cloth, and leap across the blood pool quickly!"
dsk_yunnan_valley.30.c: "Cut open the livestock bags, and use the livestock blood to distract the corpse moths!"

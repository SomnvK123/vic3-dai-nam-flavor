je_dsk_dai_a:0 "Govern Internal Affairs"
je_dsk_dai_a_reason:0 "In the past, the official system was fragmented; the military governors of the North and South held excessive power and were difficult to control. Petty officials engaged in corruption, government orders were obstructed, and the central authority failed to reach the prefectures and counties. If our Dai Nam wishes to consolidate national foundations, it must first rectify official governance, standardize official ranks, establish a Privy Council to oversee military and state affairs, and ensure that the thirty provinces implement orders promptly. Only then can we eliminate long-standing abuses, unite national strength, and lay the foundation for the cause of reform."
je_dsk_dai_b:0 "Govern Military Affairs"
je_dsk_dai_b_reason:0 "Western warships roam the southern borders; Tourane and Saigon are repeatedly coveted. The traditional garrison troops are poorly equipped and their training is neglected, leaving border passes defenseless. Our Dai Nam is strategically located and surrounded by external threats. Only by organizing a new army, imitating Western firearms manufacturing, expanding the Red River Navy, and reinforcing border fortresses and artillery emplacements can we boost military prestige, repel foreign invaders, and safeguard the integrity of our southern territories."
je_dsk_dai_c:0 "Govern Education"
je_dsk_dai_c_reason:0 "The old education system clung rigidly to literary exegesis; the imperial examinations focused solely on Confucian classics. Scholars lacked practical knowledge and understanding of global changes, leaving the nation short of talents capable of governing and revitalizing the country. If our Dai Nam wishes to pursue reform, we must enlighten the people and cultivate virtuous talents. Therefore, we should uphold Confucianism as the foundation while incorporating Western learning, establish numerous elementary schools, and add practical subjects. This will foster a steady stream of outstanding talents to support reforms in military, political, agricultural, and industrial fields."
je_dsk_dai_d:0 "Govern Economy"
je_dsk_dai_d_reason:0 "In the past, agriculture and sericulture were neglected; fertile land in Cochinchina remained uncultivated, trade at commercial ports was unregulated, and government-run workshops lagged behind in technology. The state treasury was depleted and people's livelihoods were destitute. Our Dai Nam is rich in fertile land and resources. We should leverage the advantages of the Mekong and Red Rivers to encourage farming and land reclamation, standardize tariffs at commercial ports, establish government-run workshops, promote trade, and develop various industries. Only then can we fill the state treasury, enrich the nation and its people, and provide financial support for various reforms."
je_dsk_dai_e:0 "Govern Land Administration"
je_dsk_dai_e_reason:0 "The old land registers were chaotic; powerful landlords concealed land to evade taxes, while poor peasants had no land to cultivate. Uneven taxation and corvée labor fueled widespread public resentment, shaking the foundation of the nation. People depend on food for survival, and the state relies on agriculture as its foundation. Our Dai Nam must conduct land surveys, compile land registers, formulate a three-grade equitable taxation system, encourage land reclamation, and construct water conservancy projects. This will bring order to land tenure, ensure fair taxation, stabilize public sentiment, and consolidate national foundations."


agricultural_expansion_button_desc: "The vast grassland landscape of the #green Prairie Provinces#! is perfectly suited for us to build an excellent agricultural base."
pacific_railway_button: "Pacific Railway Act"
pacific_railway_button_desc: "Connecting the railways of #yellow Ontario#! and #yellow British Columbia (BC)#! will strengthen our influence in the Pacific region and protect the vulnerable BC from annexation by our southern neighbor. At the same time, the railway will effectively develop our #green Prairie Provinces#! in the Midwest."

l_english:
 POTR.1.t:0 "The February Revolution"
 POTR.1.d:0 "After the ban, by the Guizot government, of banquets disguised as political meetings, a demonstration began on February 22 in Paris, students, then workers mingle in the streets of the capital, Long live the Reform! Down with Guizot! chant the demonstrators. The King's Government fails to find a compromise. It was a shooting, boulevard des Capucines, which caused the demonstration to burst into an insurrection. The situation becomes untenable, the insurgents take possession of Paris, the attempt to set up a regency is doomed to failure, King Louis-Philippe I abdicates, while Alphonse de Lamartine proclaims the Second Republic in City Hall."
 POTR.1.f:0 "No regency, no ministry, the Republic !"
 POTR.1.a:0 "We must organize a provisional government"
 
 POTR.2.t:0 "The Provisional Government"
 POTR.2.d:0 "It is 3 p.m., and the Republic is proclaimed on the forecourt of the Hôtel de Ville in Paris. A provisional government was immediately put in place. The great republican figures gather there such as Arago, Marrast, Garnier-Pagès and Ledru-Rollin. Dissatisfied with the July Monarchy like Crémieux and Lamartine as well as radicals eager for deep reforms like Blanc, Flocon and Martin."
 POTR.2.f:0 ""Exhausted, on an empty stomach since the morning, the members of this improvised government have found nothing to eat and quench their thirst but ammunition bread and a little Swiss cheese left by the soldiers, a bottle of wine and a bucket of water. . They have already carried out a first sharing of power and are preparing the attribution of certain ministries to other personalities of the former opposition." –Inès Murat, 1987"
 POTR.2.a:0 "Vive la République!"
 
 POTR.3.t:0 "The first steps"
 POTR.3.d:0 "The young Republic must stand out and make a clean sweep of the July Monarchy, by adopting universal male suffrage to replace the tax-based suffrage, all French people will be allowed to vote for a new assembly which will reflect the image of the representation of the people. Let us also abandon political censorship, we must decree freedom of assembly and of the press so that the voice of the Reform is emancipated !"
 POTR.3.f:0 "The electorate, by adopting universal suffrage, increased from 250,000 to more than 9 million voters and made rural areas the first voter in France."
 POTR.3.a:0 "Long live the Reform !"
 POTR.3.b:0 "It is still too early to decree reforms..."
 
 POTR.4.t:0 "National workshops"
 POTR.4.d:0 "[SCOPE.sCharacter('louis_blanc').GetFullName], since his appointment to the Provisional Government advocates better treatment of workers. Under his direction, the Luxembourg Commission proposed the creation of National Workshops to provide work for the unemployed in the capital. The State must be responsible for providing, organizing and paying for this work in order to respect this universal right to work."
 POTR.4.f:0 ""Equality only exists when everyone produces according to their strengths and consumes according to their needs." - Louis Blanc"
 POTR.4.a:0 "Jobs for all the unemployed !"
 POTR.4.b:0 "We cannot incur such expenses."
 
 POTR.5.t:0 "The new Constituent Assembly"
 POTR.5.d:0 "These are the first elections by universal suffrage, the stakes are high since it is this assembly that will develop our new republican constitution! But there is a doubt, the wave of new rural voters, are they of Republican convictions? Or will they be manipulated by local notables ?"
 POTR.5.f:0 ""Everyone then wanted to keep the Republic, but some wanted to use it to attack, others to defend themselves." - Alexis de Tocqueville"
 POTR.5.a:0 "A majority of Republicans !"
 POTR.5.b:0 "A majority of monarchists !"
 POTR.5.c:0 "A majority of radicals !"
 
 POTR.6.t:0 "The Executive Commission"
 POTR.6.d:0 "The majority of Republican-moderates in the Constituent Assembly has just appointed a new government, made up of five members who will collectively and equally assume the office of Head of State. The most radical members like Louis Blanc and Albert were ousted from power."
 POTR.6.f:0 "Lamartine, Ledru-Rollin and Garnier-Pagès are still at the head of the State but it is the scientist Fançois Arago who stands out as head of the new Executive Commission."
 POTR.6.a:0 "Vive la République!"
 
 POTR.7.t:0 "The May 15 Demonstration"
 POTR.7.d:0 "The defeat of the Republican-Socialists in the last elections and the ousting of Blanc and Albert from the Government revived popular demonstrations. Under the pretext of French non-intervention to help the Poles repressed by the Prussians, the demonstrators invade the Assembly and the Town Hall, tempers flare, the tone rises..."
 POTR.7.f:0 "Republican unism has already crumbled, elements of the National Guard are facing the demonstrators, the representatives of the people are threatened, what should the Commission do?"
 POTR.7.a:0 "Suppress the demonstration and arrest the socialist leaders."
 POTR.7.b:0 "Timidly support the demonstration."
 POTR.7.c:0 "The National Assembly must be dissolved, we need a new government!"
 
 POTR.8.t:0 "The law of exile against the Orleans"
 POTR.8.d:0 "With this new republican assembly, we have the power to deny members of the Orleans family the right to enter the territory of the Republic."
 POTR.8.f:0 "Without a royal figure, monarchist support will gradually be diluted in the new republican fabric of the Assembly."
 POTR.8.a:0 "This needs to be legislated !"
 POTR.8.b:0 "It is not reasonable to exclude the former regent family from French soil."
 
 POTR.9.t:0 "The future of National Workshops"
 POTR.9.d:0 "In addition to the abyss in the coffers of the State which was created to make them work, the National Workshops are victims of their success, the unemployed flock and have managed to provide them with employment."
 POTR.9.f:0 "Shopkeepers, merchants, passers-by in the avenues, the bourgeois Parisian people are worried about this influx of wandering workers in the capital."
 POTR.9.a:0 "That is enough..."
 
 POTR.10.t:0 "June Days"
 POTR.10.d:0 "As a result of the closure of the National Workshops, demonstrations have broken out in the districts of the Capital, and they are becoming a real insurrection !"
 POTR.10.f:0 ""The city was divided into two camps. The dividing line appears from the northeast end of the city, from Montmartre, down to the Porte Saint-Denis [...] what was to the east was occupied and fortified by the workers; it was from the western part that the bourgeoisie attacked and received its reinforcements." - Friedrich Engels"
 POTR.10.a:0 "Send the Army, we must neutralize this last socialist band !"
 POTR.10.b:0 "The insurgents have won.."
 
 POTR.11.t:0 "The Savior of the Republic"
 POTR.11.d:0 "General Cavaignac, despite some hesitation, was invested with full powers to put an end to the June insurrection, the Assembly now wishes to hand over executive power to him."
 POTR.11.f:0 ""The Republic is lucky, she can shoot the people!" - Louis-Philippe Ier en exil"
 POTR.11.a:0 "Vive Cavaignac ! Vive la République !"
 
 POTR.12.t:0 "The election campaign is launched!"
 POTR.12.d:0 "The voters are called for the future election of December 10, which will have to decide the new head of state of the young republic."
 POTR.12.f:0 ""The elected representative of six million votes carries out the wishes of the people, he does not betray them." - Louis-Napoléon Bonaparte"
 POTR.12.a:0 "Candidates begin to make themselves known."
 
 POTR.13.t:0 "What next for Republicans?"
 POTR.13.d:0 "The Republican current was torn following the events of June, the moderates, the radicals, the Republicans of "the day before" and those of the "aftermath" hesitate as to the way forward."
 POTR.13.f:0 ""From now on, the ballot must replace the rifle." - Louis Marie Bosredon"
 POTR.13.a:0 "Republicans divided into several currents: moderate and radical."
 POTR.13.b:0 "A republican union, to counter the conservatives."
 
 POTR.14.t:0 "The Poitiers Street Committee"
 POTR.14.d:0 "Conglomeration of several currents including Orleanists and Legitimists, one wonders what objective to follow for the conservative current of the Assembly."
 POTR.14.f:0 ""Above all, don't be afraid of the people, they are more conservative than you." - Louis-Napoléon Bonaparte"
 POTR.14.a:0 "A conservative policy, playing the game of the Republic."
 POTR.14.b:0 "A monarchical restoration, from the end of the electoral campaign."
 
 POTR.15.t:0 "Which candidate for the moderate-Republicans ?"
 POTR.15.d:0 "The name of Cavaignac is on everyone's lips, it is to him that "deserves" the post, but he remains unpopular because of his violent action during the June Days."
 POTR.15.f:0 "The general's supporters claim that no other candidate can have the stuff of Cavaignanc, "Le ministe Dufaure?", "Lamoricière?" ask others."
 POTR.15.a:0 "Le Général Cavaiganc."
 POTR.15.b:0 "Jules Dufaure."
 POTR.15.c:0 "Le Général Lamoricière."
 
 POTR.16.t:0 "Which candidate for the Republican Union ?"
 POTR.16.d:0 "We must make a clean sweep of our differences and establish a real union for the Republic, which brings together the moderates, the radicals, and the great figures of our February Revolution. !"
 POTR.16.f:0 ""The world and us, we want to walk in brotherhood and peace." - Alphonse de Lamartine"
 POTR.16.a:0 "Alphonse de Lamartine."
 POTR.16.b:0 "Alexandre Ledru-Rollin."
 POTR.16.c:0 "Louis-Antoine Garnier-Pagès."
 POTR.16.d:0 "Armand Marrast."
 POTR.16.e:0 "François Arago."
 
 POTR.17.t:0 "The Campaign of the Democrats-Socialists"
 POTR.17.d:0 "It is to Ledru-Rollin that we owe universal suffrage, and he proposes promising social reforms! He must represent the true republican current !"
 POTR.17.f:0 "I must follow them, since I am their leader." - Alexandre Ledru-Rollin"
 POTR.17.a:0 "Ledru-Rollin on the way."
 
 POTR.18.t:0 "What candidate for the Party of Order ?"
 POTR.18.d:0 "A name stands out, especially in the countryside, that of Prince Louis-Napoleon, nephew of the former Emperor of the French, he is popular, but should we risk a new 18 Brumaire ?"
 POTR.18.f:0 ""So let's make the Republic, the honest, wise, conservative Republic." - Adolphe Thiers"
 POTR.18.a:0 "Le Prince Louis-Napoléon Bonaparte."
 POTR.18.b:0 "Adolphe Thiers."
 POTR.18.c:0 "Charles de Rémusat."
 
 POTR.19.t:0 "Which candidate for the Legitimists ?"
 POTR.19.d:0 "The Conservatives turned their backs on the Orleans family, preferring to use the Republic for their own purposes. We need to find a figure for our movement !"
 POTR.19.f:0 "Many names have been proposed, such as Marshal Bugeaud, and even the Prince de Joinville, son of Louis-Philippe, but we are still hesitating to find the name that will make the difference at the time of the ballot.."
 POTR.19.a:0 "General Changarnier."
 POTR.19.b:0 "Félix Dupanloup, Orléans Archbishop."
 POTR.19.c:0 "Count de Falloux."
 
 POTR.20.t:0 "Which candidate for the Conservatives ?"
 POTR.20.d:0 "Thanks to our conservative union, we can claim a unifying candidate, a name that brings together a majority of monarchist currents."
 POTR.20.f:0 ""You don't care about politics, but politics cares about you all the same." - Charles de Montalembert"
 POTR.20.a:0 "Prince of Joinville, François d'Orléans."
 POTR.20.b:0 "Charles de Montalembert."
 POTR.20.c:0 "Le Général Changarnier."
 
 POTR.21.t:0 "Lamartine's illusion ?"
 POTR.21.d:0 "Although having lost a lot of prestige since the events of June 1848, the poet hopes to obtain some support for his political project."
 POTR.21.f:0 ""The fanatic and double enthusiasm of the Republic that I found and the order that I save." - Alphonse de Lamartine"
 POTR.21.a:0 "It's a personal sacrifice, for the Republic."
 
 POTR.22.t:0 "Which candidate for the Socialists ?"
 POTR.22.d:0 "The radical current of the Revolution is moribund, the successive arrests of its leaders during the months of May and June 1848 leaves the movement bloodless."
 POTR.22.f:0 ""I voted against the Constitution, because it is a Constitution." - Pierre-Joseph Proudhon"
 POTR.22.a:0 "François-Vincent Raspail."
 POTR.22.b:0 "Auguste Blanqui."
 POTR.22.c:0 "Pierre-Joseph Proudhon."
 
 POTR.23.t:0 "Which Republic for France ?"
 POTR.23.d:0 "Should it be entrusted to one man ? Or a college council ?"
 POTR.23.f:0 "Memories of the excesses of revolutionary governments are still in people's minds. "
 POTR.23.a:0 "A presidential republic, like the United States."
 POTR.23.b:0 "A unicameral parliamentary republic that delegates the executive to a government appointed by the Assembly."
 
 POTR.24.t:0 "L'Impôt des 45 cents"
 POTR.24.d:0 "MORE TAX"
 POTR.24.f:0 "But au revoir Garnier-Pagès"
 POTR.24.a:0 "Yup"
 POTR.24.b:0 "Nope"
 
 POTR.25.t:0 "Monarchical Deluge"
 POTR.25.d:0 "Universal suffrage has turned against its initiators, rurality still favorable to the monarchy has just elected a majority in this direction !"
 POTR.25.f:0 "The new provisional government announces with great fanfare the return to the monarchy and the restoration of Orleans !"
 POTR.25.a:0 "Vive le Roi !"
 
 POTR.26.t:0 "Which King for France"
 POTR.26.d:0 "The Count of Paris is the legitimate heir, but the royal claims of three of King Louis-Philippe I's sons overshadow the young prince"
 POTR.26.f:0 "We need a King capable of bringing the French together and leaving behind us this bitter revolution."
 POTR.26.a:0 "Count of Paris, Philippe d'Orléans."
 POTR.26.b:0 "Prince of Joinville, François d'Orléans."
 POTR.26.c:0 "Duke of Aumale, Henri d'Orléans."
 POTR.26.e:0 "Duke of Nemours, Louis d'Orléans."
 
 POTR.27.t:0 "The Third Restoration"
 POTR.27.d:0 "France has just gone through a troubled period, but the partisan differences of the Republican movements have destroyed the young Republic from within."
 POTR.27.f:0 "[SCOPE.sCharacter('french_king').GetFullName] greets the crowd who have come to cheer his return from exile accompanied by a retinue of politicians who have come to resume their duties. "The Monarchy is the only form of lasting power" they chant to the press."
 POTR.27.a:0 "Vive le Roi ! Vive la France !"
 
 POTR.28.t:0 "The Radical Wave"
 POTR.28.d:0 "The Assembly turns red, all the radical politicians of the Revolution have been elected, the monarchists have been swept away !"
 POTR.28.f:0 "Louis Blanc, Alexandre Martin, Armand Barbès, Auguste Blanqui and Raspail now form the new Executive Commission appointed by the Constituent Assembly."
 POTR.28.a:0 "Vive la Réforme ! Vive la France !"
 
 POTR.29.t:0 "The Red Flag"
 POTR.29.d:0 "This was one of the first demands of the radical elements of the Provisional Government, but it had been refused by Lamartine."
 POTR.29.f:0 ""The red flag that you are bringing back to us has only ever circled the Champ de Mars, dragged through the blood of the people in 91 and 93, and the tricolor has traveled around the world with name, glory and freedom. of the homeland !" - Alphonse de Lamartine"
 POTR.29.a:0 "France will become the beacon of the workers' uprising in Europe !"
 POTR.29.b:0 "The Tricolor is the symbol of the Great Revolution ! From Lafayette ! Federation Day ! We must keep it !"
 
 POTR.30.t:0 "The New Republic"
 POTR.30.d:0 "Now that the Executive Commission has presented a new Constitution for France, we are ready to perpetuate the Republic !"
 POTR.30.f:0 "The Republic will be based on a single Assembly which will elect from among its members a Council headed by a President, freely recallable by the Assembly, but to whom executive power is delegated."
 POTR.30.a:0 "Vive la République !"
 
 POTR.31.t:0 "The Prime Minister"
 POTR.31.d:0 "The tension is palpable in the Assembly, the first ballot for the appointment of the new Chairman of the Council has begun. 7 names stand out."
 POTR.31.f:0 "They are the initiators of the great social reforms of the Revolution, the great men who gave birth to the republican and radical movement in France."
 POTR.31.a:0 "Louis Blanc."
 POTR.31.b:0 "Armand Barbès."
 POTR.31.c:0 "Auguste Blanqui."
 POTR.31.e:0 "Rapsail."
 POTR.31.g:0 "Proudhon."
 POTR.31.h:0 "Alexandre Martin."
 
 POTR.32.t:0 "Vive la République !"
 POTR.32.d:0 "The Second Republic celebrates its official legislative birth, the new Prime Minister, [SCOPE.sCharacter('sec_ruler').GetFullName], now has the responsibility for France in its hands."
 POTR.32.f:0 "The European Powers looked upon this birth with a negative eye, fearing that the young republic would spread its reforming ideas, as the First Republic had done before it following the Revolution of 1789."
 POTR.32.a:0 "Vive la France ! Vive [SCOPE.sCharacter('sec_ruler').GetFullName] !"
 
 POTR.33.t:0 "The insurgent government"
 POTR.33.d:0 "Radical elements have taken power to save the Republic from a fateful death, the time has come for the purge of anti-Republican elements."
 POTR.33.f:0 "We cannot trust the Republicans-moderates, the Republicans of the "tomorrow", the monarchists in disguise, we need a real social republic, led by its most fervent orators !"
 POTR.33.a:0 "Down with the traitors ! Long live the reform !"
 
 POTR.100.t:0 "The presidential election"
 POTR.100.d:0 "It's time for the results, who will emerge victorious ?"
 POTR.100.f:0 "The French people have voted..."
 POTR.100.a:0 "Party of Order candidate, [SCOPE.sCharacter('order_candidat').GetFullName]"
 POTR.100.b:0 "Moderate-Republican candidate, [SCOPE.sCharacter('rep_mod_candidat').GetFullName]"
 POTR.100.c:0 "Democrats-Socialists candidate, [SCOPE.sCharacter('demo_soc_candidat').GetFullName]"
 POTR.100.e:0 "Independents candidate, [SCOPE.sCharacter('lamartine_candidat').GetFullName]"

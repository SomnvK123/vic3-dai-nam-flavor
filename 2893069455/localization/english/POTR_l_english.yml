dsk_dai_events.27.t:0 "Sortie of the Black Flag Army"​
dsk_dai_events.27.d:0 "The Black Flag Army honors its alliance and reinforces us; [SCOPE.sCharacter('chi_hero_scope').GetFullName] aids [ROOT.GetCountry.GetAdjective] once again"​
dsk_dai_events.27.f:0 "In the summer of the seventh year of Tongzhi's reign (1868), just as the French barbarians dispatched envoys to negotiate a new treaty, sudden unrest broke out along the Tonkin border—remaining [SCOPE.sCountry('fra_scope').GetAdjective] troops colluded with barbarian bandits to launch raids, attempting to exert pressure during the treaty negotiations. At this critical juncture, [SCOPE.sCharacter('chi_hero_scope').GetFirstName] of the Black Flag Army honored the 'Anti-Barbarian Alliance' agreement, leading 30,000 elite troops to reinforce us day and night. Marching swiftly along the Red River, they pacified the bandit rebellion within days and captured the French ringleader alive! \n\nDuke Yongfu led the Black Flag Army to decapitate enemies at the Battle of Paper Bridge and lift the siege of Saigon, achieving the first great merit in national restoration. Now, bound by the alliance treaty, upon hearing of the danger to our state, he immediately dispatched troops to assist us. His loyalty and righteousness move heaven and earth! I dispatched special envoys carrying imperial wine and silk to Tonkin to reward the army. Witnessing the Black Flag soldiers' disciplined formation and high morale, the envoys reported back: 'Duke Yongfu said, "The safety and danger of Dai Nam is the responsibility of the Black Flag Army"—he is willing to share life and death with our state!'"​
dsk_dai_events.27.a:0 "Generously reward the Black Flag Army; designate some commercial ports in Tonkin for mutual trade; deepen the alliance bond"

black_flag_army_modifier:0 "Sortie of the Black Flag Army"​
je_black_flag_army:0 "The Second Franco-Vietnamese War"​
je_black_flag_army_reason:0 "Previously, [SCOPE.sCountry('fra_scope').GetAdjective] dispatched the #v Lagréé Mission#! to survey the Mekong River upstream, only to discover that the river course was unsuitable for navigation. Thus, they shifted their target to the Red River in Tonkin—a waterway leading directly to #yellow Yunnan#! of [SCOPE.sCountry('chi_scope').GetAdjective], which was the key passage for plundering southwestern resources. In 1873, the [SCOPE.sCountry('fra_scope').GetAdjective] merchant #yellow Jean Dupuis#! used 'trading with Yunnan' as a pretext to smuggle weapons and salt, deliberately creating incidents to find an excuse for military intervention. \n\nThe Governor of Saigon of [SCOPE.sCountry('fra_scope').GetAdjective], #yellow Marie Jules Dupré#, used 'handling the Dupuis incident' as a justification to dispatch the officer Francis Garnier northward with 170 soldiers. In merely a few days, they captured Hanoi, successively breaking through cities such as Ninh Binh and Hai Duong, and even taking prisoner Nguyen Tri Phuong, the Grand Secretary of [ROOT.GetCountry.GetAdjective] (who later died of a hunger strike). They used military force to prove the vulnerability of [ROOT.GetCountry.GetAdjective]'s regular army." 


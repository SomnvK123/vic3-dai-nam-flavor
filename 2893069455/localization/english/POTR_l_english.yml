 ending.1.t:0 "The Election of Louis-Napoleon Bonaparte"
 ending.1.d:0 "[SCOPE.sCharacter('napoleon').GetFullName] was elected by universal male suffrage as the new President of the French Republic."
 ending.1.f:0 "Is it reasonable to elect a Bonaparte ?"
 ending.1.a:0 "Vive la République ! Vive Bonaparte !"
 
 ending.2.t:0 "Party of Order Victory"
 ending.2.d:0 "[SCOPE.sCharacter('order_ruller').GetFullName] was elected by universal male suffrage as the new President of the French Republic."
 ending.2.f:0 "A conservative wind blew over France."
 ending.2.a:0 "Vive la France ! Vive [SCOPE.sCharacter('order_ruller').GetFullName] !"
 
 ending.3.t:0 "The victory of the Republican-moderates"
 ending.3.d:0 "[SCOPE.sCharacter('republican_mod_ruler').GetFullName] was elected by universal male suffrage as the new President of the French Republic."
 ending.3.f:0 "The Republicans were finally able to perpetuate their influence within this new Republic."
 ending.3.a:0 "Vive la République ! Vive [SCOPE.sCharacter('republican_mod_ruler').GetFullName] !"
 
 ending.4.t:0 "Democrats-Socialists Victory"
 ending.4.d:0 "[SCOPE.sCharacter('demo_soc_ruler').GetFullName] was elected by universal male suffrage as the new President of the French Republic.."
 ending.4.f:0 "It is time to legislate on new social reforms !"
 ending.4.a:0 "Vive la République ! Vive [SCOPE.sCharacter('demo_soc_ruler').GetFullName] !"
 
 ending.5.t:0 "Lamartine's victory"
 ending.5.d:0 "[SCOPE.sCharacter('lamartine_ruler').GetFullName] was elected by universal male suffrage as the new President of the French Republic."
 ending.5.f:0 "The Republic elected the one who proclaimed it nine months earlier."
 ending.5.a:0 "Vive la République ! Vive Lamartine !"
 
 ending.6.t:0 "The victory of the Socialists"
 ending.6.d:0 "[SCOPE.sCharacter('soc_ruler').GetFullName] was elected by universal male suffrage as the new President of the French Republic."
 ending.6.f:0 "Even in prison, one can return to the scene !"
 ending.6.a:0 "Vive la République ! Vive [SCOPE.sCharacter('soc_ruler').GetFullName] !"
 
 ending.7.t:0 "The victory of the Legitimists"
 ending.7.d:0 "[SCOPE.sCharacter('monarchist_ruler').GetFullName] was elected by universal male suffrage as the new President of the French Republic."
 ending.7.f:0 "This resounding victory of the monarchist conservatives could lead to a rapid restoration of Orleans. The choice is still uncertain as to the identity of the new monarch."
 ending.7.a:0 "Vive le Roi! Vive [SCOPE.sCharacter('monarchist_ruler').GetFullName] !"
 
 ending.8.t:0 "Republican Union Victory"
 ending.8.d:0 "[SCOPE.sCharacter('republican_ruler').GetFullName] was elected by universal male suffrage as the new President of the French Republic."
 ending.8.f:0 "The Republic is safe, and united under the Tricolor banner!"

notification_Treaty_of_Saigon_name:0 "Concluding the Treaty of Saigon was merely an expedient measure. Afterwards, Emperor #yellow Tu Duc#! dispatched #yellow Phan Thanh Gian#! as an envoy to [SCOPE.sCountry('fra_scope').GetName] and [SCOPE.sCountry('spa_scope').GetName], attempting to redeem the lost territories in the south. However, the negotiations dragged on without resolution. French troops continued to seize lands everywhere, and occupied the three provinces of Vinh Long, An Giang and Ha Tien under the pretext of suppressing the resistance movements there."
notification_Treaty_of_Saigon_desc:0 "Since then, the prestige of the Nguyen Dynasty has been completely ruined. #yellow Phan Thanh Gian#, who presided over the peace talks, has become the target of public criticism. He finally realized that making concessions to France is tantamount to seeking a favor from a tiger. In despair, this over-74-year-old Chinese-Vietnamese minister was overwhelmed by shame and anger. After returning to the country, he ordered the garrison generals of the three provinces to stop resisting, instructed his children never to serve the colonial authorities of [SCOPE.sCountry('fra_scope').GetName], and then committed suicide by taking poison after a 17-day hunger strike."

dsk_dai_events.16.t:0 "Survey Report of the Lagréé Mission"​
dsk_dai_events.16.d:0 "[SCOPE.sCharacter('fra_person_scope').GetFirstName] of [SCOPE.sCountry('fra_scope').GetName] returned from the survey expedition up the Mekong River with the #v Lagréé Mission#, submitted the survey report and requested to open trade relations—his intentions are unpredictable"​
dsk_dai_events.16.f:0 "In the summer of the fifth year of Tongzhi's reign, [SCOPE.sCountry('fra_scope').GetName] dispatched #yellow Ernest Doudart de Lagrée#! to lead a mission of more than twenty people. Under the pretext of 'exploring rivers and investigating customs', they sailed upstream from #yellow Saigon#! along the Mekong River, passing through our territories of #yellow Cochinchina#! and #yellow Central Vietnam#!, and returned only after two years. Today, the mission arrived in Hue with the survey report, claiming to have drawn river course maps and recorded local customs, and requested an audience with me to present their 'strategy for national prosperity through trade'.\n\nUpon reviewing the report, it details the distribution of dangerous shoals in the Mekong River, the fertile paddy fields along the banks, and even the mineral resources of #yellow Tonkin#! and the depth of the Red River waterway are clearly documented—what is called a 'scientific expedition' is in fact a thorough reconnaissance of our geographical terrain and resource reserves. The deputy leader of the mission, #yellow Francis Garnier#!, even stated explicitly in the report that he intends to use the Mekong River as a 'commercial route to Yunnan', making #yellow Saigon#! comparable to #yellow British Hong Kong#!.\n\nThe ministers held a secret discussion: in the past, the French barbarians entered our #yellow Cochinchina#! under the pretext of missionary work; now they borrow the name of river exploration to map our terrain—this is presumably paving the way for their future northward invasion. Although they brought drawings of Angkorian relics and sketches of local customs as gifts, their actions are just as the *Zuo Zhuan* states: 'Courteous in appearance but disloyal in heart'. Beyond treating them with courtesy, we must remain highly vigilant.\n\nWhat is even more worrying is that the mission actually secretly entered Tonkin to collect mineral samples, clearly listing the locations of gold and tin veins in the report, euphemistically calling it 'assisting us in developing resources'—this is no different from a jackal spying on a house. Although I have permitted them to temporarily station in the commercial ports of #yellow Cochinchina#!, I have firmly rejected their request to survey the Red River—river defense fortresses and mineral deposits are national secrets, how can we allow foreign barbarians to covet them so easily."​
dsk_dai_events.16.a:0 "Respond to potential colonial infiltration"

dsk_dai_events.17.t:0 "Signing of the #v Treaty of Beijing#! Between [SCOPE.sCountry('gbr_scope').GetName], [SCOPE.sCountry('fra_scope').GetName] and [SCOPE.sCountry('chi_scope').GetName]"​
dsk_dai_events.17.d:0 "[SCOPE.sCountry('chi_scope').GetName] was defeated again by Britain and France, signed the #v Treaty of Beijing#! to cede territories and pay indemnities, shaking the vassal barrier of [ROOT.GetCountry.GetAdjective]"​
dsk_dai_events.17.f:0 "Urgent reports have arrived from the merchant caravans of Guangdong Province: several years ago, the Anglo-French allied forces invaded the Northern Dynasty again, marched straight to the imperial capital, burned the imperial summer palace, and coerced the Qing court into signing the #v Treaty of Beijing#!, ceding #yellow Kowloon#!, paying huge indemnities, and further allowing foreign barbarians to conduct trade deep in the interior. When the news spread to #yellow Hue#!, the imperial court was shaken like a thunderbolt—once the Northern Dynasty conquered the world with a single army, how powerful its military was! Today, it has been defeated twice by Western barbarians, even its capital has been devastated—how can we not sigh in grief!\n\nThe ministers gathered for a discussion, all saying that the maxim from the *Zuo Zhuan*—'When the lips are gone, the teeth will be cold'—has now come true. Although the Northern Dynasty is our 'northern neighbor', it has actually been our vassal barrier for hundreds of years. Emperor #yellow Minh Mang#! once said #v 'If the Qing is strong, the barbarians will not dare to covet our southern borders'#!. Today, the Northern Dynasty is so exhausted that it can barely protect its own territories, let alone shield its vassal states? Not long ago, the French barbarians' #v Lagréé Mission#! just finished surveying the Mekong River and documented our geographical terrain in detail; now seeing the Northern Dynasty's decline, their covetous intentions will surely intensify.\n\nWhat is even more worrying is that a secret report from Guangdong Province claims that after the #v Treaty of Beijing#!, the French barbarians actually attached a map of the Vietnam-China border in Yunnan and Guangxi to the peace treaty annex, secretly plotting to use Vietnam as a springboard to open trade with #yellow Yunnan#!.\n\nI recall Emperor Thieu Tri once said: 'The barbarian tribes are rampant—it is the common indignation of the world'. In the past, I thought this was a distant warning; today I finally realize that the danger of national subjugation is already at our doorstep. Although envoys from the Northern Dynasty have come to inform us, still claiming that 'we can jointly resist foreign aggression', yet they can barely protect themselves—this is nothing but empty talk."​
dsk_dai_events.17.a:0 "Urgently deploy border troops to reinforce the defenses of Lang Son and Cao Bang"
dsk_dai_events.18.t:0 "Signing of the #v Treaty of Madrid Alliance#!"​
dsk_dai_events.18.d:0 "[SCOPE.sCountry('fra_scope').GetName] signed the #v Treaty of Madrid Alliance#! with [SCOPE.sCountry('spa_scope').GetName], dividing their spheres of influence"​
dsk_dai_events.18.f:0 "A secret report arrived from the Manila trading post: [SCOPE.sCountry('fra_scope').GetName] and [SCOPE.sCountry('spa_scope').GetName] have concluded an alliance treaty in #yellow Madrid#!. Ostensibly, they discussed affairs related to #yellow Morocco#!; in reality, a secret clause was hidden in the treaty—[SCOPE.sCountry('spa_scope').GetName] agreed to let France exclusively occupy our Dai Nam, while France recognized [SCOPE.sCountry('phi_scope').GetName]'s rule. The two countries agreed to 'not interfere with each other's colonial expansion'. When the news spread to Hue, the imperial court was on high alert as if facing an enemy. All ministers exclaimed: 'Jackals are forming a gang—it is an omen of national subjugation!' \n\nNot long ago, the Northern Dynasty was defeated by Britain and France, and our vassal barrier has collapsed. Now, with the Franco-Spanish alliance eliminating any constraints, they will surely accelerate their northward invasion. One minister wept as he submitted a memorial: 'In the past, the #yellow Lagréé Mission#! mapped our rivers; today, France and Spain collude to divide our territories. First, they consolidate their power through alliances, then seize our lands by force. Just as *The Art of War* states: 'The supreme art of war is to subdue the enemy without fighting; the next best is to subdue the enemy through diplomacy'. Our Dai Nam has already fallen into their trap of intrigue!"​
dsk_dai_events.18.a:0 "Urgent construction of fortresses in Thuận An and Da Nang"

dsk_dai_events.19.t:0 "#v March to Indochina!#!"​
dsk_dai_events.19.d:0 "[SCOPE.sCountry('fra_scope').GetName] issued a royal edict to march on #v Indochina#!, deploying heavy troops along the border. The First Franco-Vietnamese War is imminent"​
dsk_dai_events.19.f:0 "An urgent report from #yellow Saigon#! reached #yellow Hue#!: [SCOPE.sCharacter('fra_person_scope_scope').GetFirstName] of [SCOPE.sCountry('fra_scope').GetName] has officially issued a royal edict, declaring that 'to protect merchants and civilians and suppress the chaos in Cochinchina', he ordered Admiral #yellow Charles Rigault de Genouilly#!, commander of the Far East Fleet, to lead an expeditionary force of 8,000 soldiers and more than 70 warships to launch a full-scale march on #v Indochina#!. Prior to this, under the pretext of 'reinforcing the garrison in Saigon for rest', French troops had secretly increased their strength to 10,000 men. Now their cannons are aimed directly at the two provinces of #yellow Gia Dinh#! and #yellow Bien Hoa#!, and a declaration of war was delivered to the imperial palace on the same day. \n\nThe wording of the document was arrogant and presumptuous, even claiming that our #yellow Cochinchina#! was 'misgoverned, endangering the safety of French merchants'. It demanded the immediate cession of the three provinces of #yellow Gia Dinh#!, #yellow Dinh Tuong#! and #yellow Bien Hoa#!, and the opening of the entire Mekong River for navigation. Otherwise, 'within three days, French gunboats from Saigon will directly attack Thuận An'. In the imperial court, the pro-war faction slammed the table and denounced the demand: 'We have not yet avenged the humiliation of the Franco-Spanish allied forces capturing Da Nang in the eighth year of Xianfeng's reign, and now they are making further demands! #yellow Cochinchina#! is the cradle of our Nguyen Dynasty—ceding it will shake the foundation of the state; we have no choice but to fight to the death!' However, the pro-peace faction, holding a secret report from #yellow Saigon#, wept as they recounted the situation: the French army had newly added more than ten ironclad warships, whose artillery range far exceeded that of our coastal defense cannons. The garrison in #yellow Gia Dinh#! was less than 5,000 strong, and most of their weapons were outdated muskets—they feared they could not hold out for even a single day."​
dsk_dai_events.19.a:0 "They have long calculated the weak points of our defense lines; this march is by no means a spur-of-the-moment decision. The last news from Saigon: French troops have shelled the outskirts of Gia Dinh. Thick smoke from burning civilian houses can be seen dozens of miles away. The people of Cochinchina are fleeing with their elderly and children, and their cries of grief shake the wilderness"

dsk_dai_events.20.t:0 "Envoys of Alien Religion Arrive at the Court"​
dsk_dai_events.20.d:0 "Missionaries from [SCOPE.sCountry('xuezhe_xixue').GetName] requested to enter the country to preach under the pretext of paying tribute, sparking a debate in the imperial court over the balance between etiquette and national foundation"
dsk_dai_events.20.f:0 "[SCOPE.sCountry('xuezhe_xixue').GetName] dispatched envoys accompanied by three missionaries, requesting an audience with me under the pretext of 'congratulating the Emperor on his birthday'. In reality, they begged for permission to allow Catholic missionaries to enter the provinces of #yellow Tonkin#! and #yellow Central Vietnam#! to build churches and preach, claiming that 'they wish to civilize the people with the Gospel and help our state achieve long-term peace and stability'. The envoys also brought Western clocks and glassware as gifts, speaking with sincere and earnest words. Yet the deeper intentions behind their actions could not escape the watchful eyes of the court ministers. \n\nThe ministers engaged in a heated discussion: the Minister of Rites submitted a memorial stating that 'since the foreign envoys have come from afar, they should be received with the etiquette due to guests, and we must not lose the ceremonies of the Chinese civilization'; the censors, however, cried out in alarm: 'Western religion is incompatible with Confucianism—it abandons ancestral worship and disrupts the order of human relations. Not long ago, believers in #yellow Cochinchina#! gathered to cause trouble; the lesson from this past incident is not far away!' \n\nI pondered deeply: our Dai Nam takes Confucianism as its foundation, with its rituals and music education spanning a thousand years. The people respect Confucius and Mencius, and honor their ancestors—this is the foundation of our national peace and stability. Western religion not only violates our ancestral institutions, but may also serve as an internal agent for the French army; we must never allow them to preach. Yet they have come under the pretext of paying tribute—if we expel them outright, we may give them a handle to use as another excuse for French military aggression."
dsk_dai_events.20.a:0 "Generously reward the envoys and missionaries, declaring that 'our state follows the way of Confucianism, where the succession of rites and music has been passed down without interruption since ancient times'"​
dsk_dai_events.20.b:0 "Alien religion may disturb the hearts of the people; we cannot approve their request to preach for the time being". Order them to leave the country within three days and not to linger in the interior regions."​

dsk_dai_events.21.t:0 "Cannons Roar in Cochinchina, National Crisis is Upon Us"​
dsk_dai_events.21.d:0 "The Franco-Spanish allied forces launched another major invasion with heavy troops; #yellow Gia Dinh#! fell, and the First Franco-Vietnamese War erupted in full scale"​
dsk_dai_events.21.f:0 "In the first month of the eleventh year of Xianfeng's reign (1861), urgent reports from #yellow Cochinchina#! arrived three times a day: a Franco-Spanish allied force of 80,000 men and more than 70 warships suddenly attacked Saigon. Following their announcement of the march to Indochina last winter, they launched a full-scale offensive this time, bombarding the city walls of #yellow Gia Dinh#! with cannon fire! \n\nThe garrison commander of Gia Dinh, #yellow Lê Văn Trung#!, sent an urgent blood-written report: the artillery fire from the French ironclad warships was like thunder, collapsing more than ten sections of the city wall. Our 20,000 soldiers were mostly armed with outdated muskets and bamboo spears; repeated charges were in vain. The [SCOPE.sCountry('fra_scope').GetName] fleet also landed troops from the flanks and rear, cutting off our supply lines. On the eve of the city's fall, General Lê led the remaining troops in a desperate last stand, being shot three times yet still shouting 'Better to die than surrender' before finally succumbing to his wounds and sacrificing his life for the country. When the news spread to Hue, the imperial court was filled with cries of grief: the pro-war faction donned their armor and begged to go to war, willing to lead the imperial guards of #yellow Central Vietnam#! to reinforce the front lines; the pro-peace faction, however, collapsed to the ground weeping as they held a secret report from Guangdong Province—the Northern Dynasty was besieging #yellow Tianjing#! and could not spare any troops to help us. The documents we sent to request reinforcements had vanished without a trace, and even a 'verbal expression of support' had become a hopeless fantasy. \n\nAn ultimatum arrived from #yellow Saigon#!: we were given ten days to cede the three provinces of #yellow Gia Dinh#!, #yellow Bien Hoa#! and #yellow Dinh Tuong#!, pay an indemnity of 20 million francs, or they would march directly on #yellow Hue#!. I climbed the northern city wall and looked out into the distance, recalling Emperor #yellow Minh Mang#'s teaching that 'Cochinchina is a fertile land, the granary of our state'. Now, seeing the flames of war raging there, my heart felt as if it were being torn apart by a knife. Yet the navy of #yellow Central Vietnam#! had only a dozen old warships, no match for the allied ironclad giants."​
dsk_dai_events.21.a:0 "They had long ago identified the weak points in our defense lines; this invasion was by no means a sudden decision. The last news from Saigon: French troops have shelled the outskirts of Gia Dinh. Thick smoke from burning civilian houses can be seen dozens of miles away. The people of Cochinchina are fleeing with their elderly and children, and their cries of grief shake the wilderness"

je_fra_chi_war_go:0 "The Franco-Vietnamese War Has Begun"​
je_fra_chi_war_go_reason:0 "The iron hooves of the French barbarians have trampled on our southern borders; cannon fire rages over the walls of Gia Dinh. The fertile lands of Cochinchina have been burned and plundered; the people of Bien Hoa have fallen into the abyss of suffering. Since the flames of war were ignited in 1861, [ROOT.GetCountry.GetAdjective] has never had the slightest thought of surrender! Emperor #yellow Tu Duc#! issued an imperial edict to resist the enemy; #yellow Lê Văn Trung#! defended Gia Dinh to the death and sacrificed his life for the country; #yellow Phan Thanh Gian#! died a martyr's death in shame over the humiliation of Saigon. The Black Flag Army of Tonkin marched southward with their weapons; in the Battle of Paper Bridge, they beheaded enemy generals and shattered the enemy's morale. Righteous civilians along both banks of the Red River rose up as one, fighting against the ironclad warships with outdated muskets and bamboo spears. Cities can fall, lands can be lost, the imperial seal can be melted—but the hearts of the people cannot be conquered, and our national integrity cannot be humiliated! \n$TOOLTIP_DELIMITER$\nThe invasion by [SCOPE.sCountry('fra_scope').GetName] can occur up to #v four times#!. Each time we defeat an invasion, there is a 50% chance that the enemy will surrender completely, and we will permanently complete this [concept_journal_entry] once and for all"​


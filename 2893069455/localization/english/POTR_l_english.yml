 POTR.100.h:0 "Socialists candidate, [SCOPE.sCharacter('socialists_candidat').GetFullName]"
 
 POTR.101.t:0 "The presidential election"
 POTR.101.d:0 "It's time for the results, who will emerge victorious ?"
 POTR.101.f:0 "The French people have voted..."
 POTR.101.a:0 "Conservatice Union candidate, [SCOPE.sCharacter('monarchist_candidat').GetFullName]"
 POTR.101.b:0 "Moderate-Republican candidate, [SCOPE.sCharacter('rep_mod_candidat').GetFullName]"
 POTR.101.c:0 "Democrats-Socialists candidate,, [SCOPE.sCharacter('demo_soc_candidat').GetFullName]"

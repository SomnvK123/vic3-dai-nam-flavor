dsk_dai_events.2.t:0 "Edict on the Completion of Internal Governance Reforms"
 dsk_dai_events.2.d:0 "The revision of land registers across all 30 provinces has been completed; the new tax regulations formulated by the Privy Council have been promulgated nationwide; the training of the elephant corps is progressing smoothly; all matters related to internal governance reforms have been fully implemented."
 dsk_dai_events.2.f:0 "Since ascending the throne to inherit the legacy of the late Emperor Minh Mang, I have grieved over the unstable national foundation and the gradual decline of official governance. Thus, I launched the grand cause of reform in accordance with the 'System of the Central Plains'. After five years of painstaking efforts, all undertakings are now successfully completed.\n\nI have pooled the wisdom of all ministers, abided by the principle of balancing leniency and strictness stipulated in the *Law Code of the Nguyen Dynasty*, established the system of 30 provinces, abolished the military governorships of the North and South to reclaim the authority of the central government, set up the Privy Council to oversee all military and state affairs, and formulated the nine-rank official system to clarify official duties, ensuring that government decrees reach directly to villages and communities. I have also dispatched officials to survey land, formulated the three-grade tax system, prohibited the private sale of public land, and abolished various exorbitant levies such as the lamp oil tax and local custom taxes. Annual revenue of the state treasury has increased by 30% compared with the past, and agriculture and sericulture have gradually revived. Furthermore, I have rectified the imperial examination system, added subjects such as mathematics and agriculture to select talents who are 'capable of governing the state and solving practical problems'; organized and trained the elephant corps, renovated the coastal defenses of ports such as Tourane and Thuận An, and border preparedness has been slightly strengthened."
 dsk_dai_events.2.a:0 "Our [ROOT.GetCountry.GetAdjective], as a 'State of the Central Plains', must consolidate the national foundation with rituals and righteousness, and defend against foreign barbarians with military preparedness. Now, the state's laws and regulations are clear and distinct, official governance is honest and transparent, villages and communities are harmonious, and scholars and common people are united in their allegiance."


 dsk_dai_events.3.t:0 "Edict on Revitalizing the Nation Through Military Governance Reforms"
 dsk_dai_events.3.d:0 "The organization and training of the new army have been fully completed, and all matters related to military governance reforms have been put into practice."
 dsk_dai_events.3.f:0 "Since Western invaders have coveted our southern borders and border alarms have been raised repeatedly, I have deeply reflected on the maxim that 'military force is the backbone of a nation'. Inheriting the late Emperor Minh Mang's behest to reorganize the army, I launched the military governance reform initiative. After three years of tempering and training, our military strength has now achieved initial success.\n\nI have adopted the strategy of 'integrating Western military methods with Chinese systems', abolished the traditional garrison troops, organized and trained six divisions of the new army, established a military academy to cultivate military talents, and formulated the 'Three Policies for Recruiting Soldiers' (selecting strong young men, clarifying rewards and punishments, enforcing strict training), resulting in a solemn and disciplined military appearance. I have also set up a firearms bureau in Hue, imitated Western artillery casting techniques to produce explosive shells and breech-loading rifles; expanded the Red River Navy, deployed ten gunboats to patrol the strategic points of the Red River and Mekong River, cutting off the invaders' covetous schemes. Furthermore, I have rectified the border towns, reinforced the passes of Lang Son and Cao Bang, and built additional fortresses and batteries in Tourane Port, making the southern borders heavily fortified and impregnable."
 dsk_dai_events.3.a:0 "Our [ROOT.GetCountry.GetAdjective] is endowed with solid natural geographical barriers and superior military equipment. We must defend our territorial land with weapons, and stabilize the people with military virtue. Now, our military prestige has spread far and wide, border defenses are secure and worry-free, and both internal and external forces pledge their allegiance to us."

 dsk_dai_events.4.t:0 "Edict on Revitalizing the Nation Through Educational Reforms"
 dsk_dai_events.4.d:0 "The Imperial Academy has established a Western Studies Department; elementary schools have been widely set up in prefectures, counties and districts; the Translation Bureau has published books on statecraft and practical governance; all matters related to educational reforms have been successfully completed one after another."
 dsk_dai_events.4.f:0 "Since the Three Dynasties, education has been the foundation of governance, and the prosperity of a nation depends on talents. I have inherited the blessings of the ancestral temple, cherished the late Emperor Minh Mang's behest of 'upholding Confucianism and promoting education', and grieved over the drawbacks of the old educational system, which rigidly adhered to textual annotations and was irrelevant to current affairs. Thus, I launched the educational reform initiative. After four years of efforts, the academic atmosphere has gradually flourished.\n\nI have followed the principle of 'taking Confucianism as the foundation and Western learning as a supplement', renovated the Imperial Academy, added a Western Studies Department with four subjects: mathematics, natural science, geography and coastal defense, and invited renowned Confucian scholars from the Central Plains and Western experts to teach together; ordered each prefecture, county and district to set up elementary schools, exempted the tuition fees of children from poor families to widely enlighten the people's wisdom; established a Translation Bureau to translate and publish Western military books, agricultural and industrial manuals, as well as Chinese classics on statecraft, distributing them to all schools; further rectified the imperial examination system, adding 'essays on current state affairs' to the provincial and metropolitan examinations to select talents who are proficient in practical governance."
 dsk_dai_events.4.a:0 "Our [ROOT.GetCountry.GetAdjective] honors rituals and values education, cultivates virtuous talents to assist the state, and enlightens the people's wisdom to consolidate the national foundation. Now, the academic atmosphere is thriving, outstanding talents emerge in large numbers, and the foundation for national rejuvenation can be firmly established."

 dsk_dai_events.5.t:0 "Edict on Enriching the Nation by Encouraging Agriculture and Promoting Commerce"
 dsk_dai_events.5.d:0 "The land reclamation projects in Cochinchina have achieved bumper harvests; the regulations for trade at commercial ports have been formulated; the craftsmanship of government-run workshops has become increasingly sophisticated; the effects of economic reforms are clearly evident."
 dsk_dai_events.5.f:0 "The wealth of a nation lies in encouraging agriculture to ensure sufficient food supply, promoting commerce to facilitate the circulation of wealth, and developing craftsmanship to meet practical needs. I have inherited the late Emperor Minh Mang's behest of 'valuing agriculture as the foundation of the state', and drawn lessons from the benefits of Western trade and the sophistication of Western workshops, thus launching the economic reform initiative. After five years of careful planning, the state treasury is now abundant, and people's livelihoods have gradually improved.\n\nI have issued an order to implement the land reclamation policy in Cochinchina, dispatched officials to supervise the construction of dikes and dredging of rivers, diverted water from the Mekong River to irrigate the barren land, promoted high-yield crops such as Champa rice and sweet potatoes, reclaimed one million mu of wasteland, and the annual grain output has increased by 40% compared with the past, which is sufficient to meet the needs of the army and civilians; I have also formulated the regulations for trade at commercial ports, standardized the tariffs of ports such as Tourane and Saigon, set up a Maritime Trade Bureau to manage Chinese-foreign trade, allowed Chinese merchants and Western merchants to set up warehouses and conduct trade, and the annual tariff revenue has doubled compared with the past; established government-run workshops, imitated Western methods to mint coins, weave cloth and refine sugar, invited skilled overseas Chinese craftsmen to pass on their techniques, resulting in sophisticated products that sell well both domestically and abroad; further rectified the policies on salt, iron and mineral resources, set up special government agencies to manage sea salt production and coal mining, which not only benefit people's livelihoods but also increase state taxes."
 dsk_dai_events.5.a:0 "Our [ROOT.GetCountry.GetAdjective] is endowed with fertile land and abundant resources. We promote commerce and develop industries to revitalize the nation, and encourage agriculture and land reclamation to consolidate the national foundation."

 dsk_dai_events.6.t:0 "Edict on the Consolidation of Reforms and the Rejuvenation of the Nation"
 dsk_dai_events.6.d:0 "Military and political governance are sound and transparent; education and culture are thriving; agriculture, industry and commerce are prosperous; peace prevails in all four borders; the grand cause of reform has been fully accomplished nationwide"
 dsk_dai_events.6.f:0 "The *Veritable Records of Dai Nam* states: 'The rise of a nation lies in eliminating drawbacks and pursuing innovation, and in conforming to the trends of the times and upholding the Dao.' I have inherited the legacy of successive emperors, and since ascending the throne, I have deeply cherished the teachings in the *Book of Documents* that 'if one can renew oneself for a day, let him renew himself day after day, and continue renewing himself endlessly', and drawn lessons from the principle in the *Comprehensive Records of the Imperial Viet* that 'there is no fixed way of governance; the fundamental is to benefit the people'. I have launched various reforms in internal governance, military governance, education, agriculture, industry and commerce. After ten years of hard work, the reforms have now been fully consolidated and achieved success, and the nation has taken on a brand-new look.\n\n Behold the Dai Nam of today: at the central government, the Privy Council oversees all state affairs; the 30 provinces enforce decrees without hesitation; the *Law Code of the Nguyen Dynasty* strikes a proper balance between leniency and strictness; official governance is as clear as a mirror—these are the effects of internal governance reforms. On the borders, the six divisions of the new army are equipped with bright weapons and armors; the Red River Navy boasts a forest of masts and sails; the fortresses and batteries in Lang Son and Tourane stand tall and imposing; 'whoever dares to violate our southern borders shall be punished no matter how far away they are'—these are the achievements of military governance reforms. In the schools, the Imperial Academy integrates Chinese and Western learning; the elementary schools in prefectures and counties resound with the sound of reading and singing; the Translation Bureau is filled with a large number of books; talents capable of governing the state emerge in an endless stream—these are the manifestations of the prosperity of educational reforms. In the countryside, the reclaimed farmlands in Cochinchina stretch for thousands of miles with waves of rice; a network of canals crisscrosses the Mekong River basin; Champa rice and sweet potatoes yield bumper harvests everywhere; the people no longer suffer from the fear of hunger. In the cities and towns, commercial ports are bustling with a dense crowd of boats and ships; government-run workshops produce sophisticated products; the annual tariff revenue has doubled compared with the past; the state treasury is abundant with surplus funds—these are the blessings brought by the reforms in agriculture, industry and commerce.\n\n In ancient times, Emperor Ly Thanh Tong adopted the policy of 'abandoning military campaigns and promoting cultural governance, resting with the people' and achieved the Taiping era of peace and prosperity; Emperor Le Loi 'drove out foreign invaders and recovered the homeland, rectifying state governance' and laid the foundation for national rejuvenation. Today, I inherit the aspirations of the ancient sages, unite the strength of all people, eliminate outdated practices and promote innovation, thus achieving this situation of 'smooth governance and harmonious people, with all neglected undertakings flourishing'."
 dsk_dai_events.6.a:0 "The *Book of Songs* states: 'Although Zhou was an ancient state, its mandate was constantly renewed.' Our [ROOT.GetCountry.GetAdjective] inherits the heritage of the Central Plains and initiates the era of reform. From now on, the nation's fortune shall be long-lasting, and its prestige shall spread to the four seas"

 dsk_dai_events.7.t:0 "Aid from [SCOPE.sCountry('chi_scope').GetAdjective] to Alleviate National Hardships"
 dsk_dai_events.7.d:0 "The state treasury is depleted and can hardly support the military supplies needed for reforms. [SCOPE.sCharacter('ruler_scope').GetFullName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] has dispatched envoys carrying silver to Hue, willing to provide financial assistance to consolidate the tributary relationship"
 dsk_dai_events.7.f:0 "Today, the reforms of Dai Nam are in full swing. The military governance and land administration reforms consume a huge amount of silver. The land reclamation in Cochinchina and the organization of the new army have not yet brought benefits. The deficit of the state treasury has exceeded one million taels of silver, making it extremely difficult to raise funds for official salaries and military pay. Fortunately, out of the friendship of the tributary relationship that has lasted for thousands of years, [SCOPE.sCountry('chi_scope').GetAdjective], our suzerain state, has heard of our national hardships and specially dispatched the Vice Minister of Rites to Hue with 500,000 taels of silver from the imperial treasury and 100,000 shi of grain, saying that 'we are as close as lips and teeth; the stability of the vassal state ensures the peace of China', and is willing to help our state tide over the difficulties.\n\nThe aided silver and grain will be half used as military pay for the new army and funds for the firearms bureau to cast weapons; the other half will be used for the construction of water conservancy projects in Cochinchina and the purchase of farm tools for land reclamation; the grain will be distributed to the army and civilians in border towns to alleviate the fear of hunger. [SCOPE.sCharacter('ruler_scope').GetFullName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] has further promised that if there is still a shortage in the future, we can send envoys to request again, and additional subsidies will be allocated from the customs duties of the Guangdong Maritime Customs."
 dsk_dai_events.7.a:0 "We are grateful for the great kindness of the [concept_overlord], and will strictly abide by the etiquette of the tributary relationship"
 dsk_dai_events.7.b:0 "We sincerely appreciate your profound friendship, but the reform should rely on our own strength, and we dare not trouble the [concept_overlord]"

 dsk_dai_events.8.t:0 "Envoys from [SCOPE.sCountry('fra_scope').GetAdjective]"
 dsk_dai_events.8.d:0 "The Emperor [SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName] of [SCOPE.sCountry('fra_scope').GetName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] has dispatched envoys to [SCOPE.sState('xili_sheng').GetName], offering trade as a gift and requesting permission for missionaries to enter the country to preach"
 dsk_dai_events.8.f:0 "The envoys arrived in [SCOPE.sState('xili_sheng').GetName], bringing Western curiosities such as clocks and telescopes as gifts. They said they are willing to conduct trade with our [ROOT.GetCountry.GetAdjective], and further requested permission for their missionaries to enter the country to build churches and spread the Gospel in various provinces.\n\nThe envoys claimed that Emperor [SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName], [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')], believes in God, with the fundamental principle of persuading people to do good. The missionaries entering the country will only propagate religious doctrines and not interfere in government affairs, and are willing to help our state build railways and run schools. However, there have been heated debates in the imperial court: some argue that Western religions are alien customs that may disturb the people's minds; some argue that allowing their missionary activities can exchange for the benefits of trade and ease external threats."
 dsk_dai_events.8.a:0 "Permit their missionary activities, treat them with courtesy, and the matter of trade can be further discussed"
 dsk_dai_events.8.b:0 "Your Majesty, alien religions will disrupt our customs and traditions. We must never grant permission—expel the envoys from the country"
dsk_dai_events.9.t:0 "Change Reign Title to #yellow Dai Nam#!, Manifest Imperial Legitimacy"
 dsk_dai_events.9.d:0 "Ministers including [SCOPE.sCharacter('turkfm_tanzimat_character_1').GetFullName], [SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName] and [SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName] have submitted a memorial to [SCOPE.sCharacter('ruler_scope').GetFullName], requesting to change the state title to #yellow Dai Nam#! to manifest national prestige and govern the Central Plains"
 dsk_dai_events.9.f:0 "Inheriting the legacy of successive emperors, I hold sway over the Central Plains, pacify the southern states, and extend my prestige to the four seas. Yet the current state title still follows the old denomination, which is insufficient to manifest the grandeur of unification and the foundation for eternal generations. Now all ministers unanimously submit memorials, proposing that the state title should be changed to #yellow Dai Nam#! and the reign title designated as Tu Duc, so as to inherit the heavenly mandate and glorify the imperial enterprise.\n\nThe name #yellow Dai Nam#! signifies the vastness of our territory, encompassing both the Central Plains and the southern states; it signifies the far-reaching influence of our moral governance, spreading to all corners of the world. Changing the state title will rectify names and define hierarchies, governing both internal and external domains; designating the new reign title will renew all state affairs and make a fresh start with the people. This act conforms to the will of heaven above and the sentiments of the people below, and is truly an eternal institution."
 dsk_dai_events.9.a:0 "Memorial approved! Change the state title to #yellow Dai Nam#!, designate the reign title as Tu Duc, and proclaim it to the whole nation"
 dsk_dai_events.9.b:0 "The state title was established by our ancestors; it must not be lightly altered. We should uphold the established laws to consolidate the national foundation"
 we_are_dai_tt:0 "[ROOT.GetCountry.GetName] will be known as the #yellow Dai Nam Empire#!"
 nantian_china_tt:0 "[ROOT.GetCountry.GetName] will be known as #yellow Nantian Zhonghua#!"
 dsk_dai_events.10.t:0 "Six Stars Arching the Polestar"
 dsk_dai_events.10.d:0 "[SCOPE.sCharacter('chi_ruler_scope').GetFullName], [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] of [SCOPE.sCountry('chi_scope').GetAdjective], has dispatched envoys to [SCOPE.sState('capital_scope').GetCityHubName], willing to form an offensive-defensive [concept_alliance] to jointly resist Western [concept_great_power]"
 dsk_dai_events.10.f:0 "In the 19th century, the threat of Western invaders grew increasingly intense. Powers such as [SCOPE.sCountry('gbr_scope').GetAdjective] and [SCOPE.sCountry('fra_scope').GetAdjective] coveted our southern borders and eyed Yunnan-Vietnam region greedily. [SCOPE.sCountry('chi_scope').GetAdjective] and [ROOT.GetCountry.GetAdjective] are as close as lips and teeth, and their friendship has grown stronger over thousands of years. Now [SCOPE.sCharacter('chi_ruler_scope').GetFullName] has specially dispatched an imperial envoy carrying a state letter to [SCOPE.sState('capital_scope').GetCityHubName], stating that 'Six stars arch the polestar, sharing the same vital force and connected branches; in the face of foreign aggression, only an [concept_alliance] can safeguard the territorial borders', and is willing to conclude an offensive-defensive alliance with our [ROOT.GetCountry.GetAdjective].\n\nThe alliance agreement stipulates: [SCOPE.sCountry('chi_scope').GetAdjective] shall assist [ROOT.GetCountry.GetAdjective] in organizing and training the new army, imitating the manufacturing of firearms and artillery, and allocate 300,000 taels of silver annually as military pay; in return, [ROOT.GetCountry.GetAdjective] shall permit [SCOPE.sCountry('chi_scope').GetAdjective] troops to station in Lang Son and Cao Bang. When invaded by foreign enemies, the two countries shall advance by land and sea to reinforce each other, and exempt tariffs on mutual trade. All officials of the court agree that this alliance will bring benefits to both parties if maintained, and harm both if broken—it is indeed the best strategy to protect the borders and stabilize the people."
 dsk_dai_events.10.a:0 "We respectfully abide by the alliance. Surrounded by Western barbarians, China and Vietnam conclude an offensive-defensive alliance to safeguard territorial borders and jointly resist foreign aggression"
 dsk_dai_events.10.b:0 "For thousands of years, [ROOT.GetCountry.GetAdjective] has revered [SCOPE.sCountry('chi_scope').GetAdjective] as the suzerain state, and shall do so for eternity"
 
 dsk_dai_events.11.t:0 "The Courage to Slay the Dragon"
 dsk_dai_events.11.d:0 "[SCOPE.sCharacter('turkfm_tanzimat_character_1').GetFullName], [SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName] and [SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName] have submitted fervent petitions to declare war, claiming that the heavenly mandate has returned to the South and vowing to recover our Jiaozhi homeland"
 dsk_dai_events.11.f:0 "Inheriting the heavenly mandate, I govern [ROOT.GetCountry.GetAdjective], with a territory spanning ten thousand li and a population of hundreds of millions. Our nation should have the right to control its own destiny—how can we tolerate being controlled by others! Yet [SCOPE.sCountry('chi_scope').GetName] arrogates to itself the title of [concept_overlord], repeatedly making excessive demands for tributes, interfering in our internal affairs, and treating our state and the countries of the #v Indochinese Peninsula#! as mere vassals and barriers. In recent years, under the pretext of providing assistance, it has dispatched officials to station in #yellow Hue#!, seized control of customs duties, and even attempted to take over the command of our Red River Navy. Such actions are intolerable!\n\nThe Qing barbarians originated from Manchuria, seized the Central Plains by treachery, and stole our Jiaozhi homeland. They enforced the queue hairstyle and forced us to change our traditional costumes, destroying our cultural heritage—they are truly bandits of the Chinese nation and a scourge of the Southern Heaven! Today, the Qing barbarians are plagued by both internal unrest and external threats; their Westernization Movement is merely superficial, and their border defenses are neglected. In contrast, our Dai Nam boasts a strong army and powerful weapons: we have imitated the Qing's firearms to produce red-coat cannons, trained elite troops educated in Confucianism, and the auxiliary armies from Cambodia and Laos are willing to fight to the death for us! The heavenly mandate has returned to the Southern Heaven—marching northward at this moment is the perfect opportunity to recover our ancestral lands and compete for supremacy in the Central Plains!\n\nNow all ministers have knelt before the imperial palace, submitting impassioned memorials: 'In ancient times, Emperor Le Loi drove out the Ming invaders and recovered Vietnam, establishing the southern borders with nothing but a three-foot sword; today, our [ROOT.GetCountry.GetAdjective] has achieved success in reforms, with sufficient troops and armaments—why should we fear a war!' The officers and soldiers of the three armies have also submitted blood-written petitions, vowing to fight to the death. I have made my decision and issued an imperial edict to the whole nation: from this day forth, we sever the tributary relationship with [SCOPE.sCountry('chi_scope').GetAdjective], abolish the tribute system, and expel all its stationed officials! Orders are sent to the armies stationed in Lang Son, Cao Bang and other border towns to stand on high alert—whoever dares to violate the territorial borders of our [ROOT.GetCountry.GetAdjective], no matter how powerful they are, shall be annihilated!"

 dsk_dai_events.11.a:0 "Raise the righteous army and attack the powerful Qing! What difficulty can there be?"
 
 dsk_dai_events.12.t:0 "Edict on Regulating Land Administration to Consolidate the National Foundation"
 dsk_dai_events.12.d:0 "The land survey across the entire nation has been completed; the equitable taxation system has been promulgated nationwide; the results of wasteland reclamation are clearly evident; all matters related to land administration reforms have been successfully concluded."
 dsk_dai_events.12.f:0 "The *Rites of Zhou* states: 'By the method of land equalization, distinguish five types of land and nine grades of fertility to formulate land taxes for the whole nation.' Inheriting the late Emperor Minh Mang's behest of 'valuing agriculture to consolidate the foundation', and learning from the drawbacks of the chaotic old land registers and uneven taxation in the past, I deeply cherish the maxim that 'the people depend on food for survival, and the state relies on agriculture as its foundation'. Thus, I launched the land administration reform initiative. After three years of diligent efforts, the land system is now well-organized and the people can live in peace and contentment.\n\nI dispatched imperial land survey commissioners to the thirty provinces, traveling through mountains, rivers, villages and communities to demarcate land boundaries, register land types, and compile the *Dai Nam Land Register*, ensuring that 'every inch of land has a record and every mu of farmland can be verified'—thus putting an end to the malpractice of powerful landlords concealing land and petty officials engaging in corruption. Following the regulations stipulated in the *Land Tax Chapter of the Law Code of the Nguyen Dynasty*, I formulated a three-grade land tax system, levying taxes according to the size of the land. Taxes for poor households and newly reclaimed wasteland are exempted for three years, ensuring that 'labor services are equitable and taxation is fair', and the people no longer lament over excessive burdens. Furthermore, I issued the *Edict Encouraging Wasteland Reclamation and Agriculture*, encouraging displaced peasants and border residents to reclaim wasteland in Cochinchina and the Central Highlands. Officials are dispatched to supervise the construction of ponds and irrigation canals, diverting water from the Mekong and Red Rivers for irrigation, and promoting new farming methods such as deep plowing and seedling raising. Eighty thousand mu of new farmland have been added, and the annual grain output has increased by 50% compared with the past, which is sufficient to enrich the nation and support the people."
 dsk_dai_events.12.a:0 "When the land system is well-regulated, the people's hearts will be stable; when the people's hearts are stable, the national foundation will be consolidated"

 dsk_dai_events.13.t:0 "French Vietnam Expeditionary Corps"
 dsk_dai_events.13.d:0 "Trapped by internal unrest and external aggression with no reinforcements available, we temporarily submit to [SCOPE.sCountry('fra_scope').GetName] to preserve the imperial lineage and conclude a protectorate treaty"
 dsk_dai_events.13.f:0 "Today, Dai Nam is facing an unprecedented crisis in its history: [SCOPE.sCountry('chi_scope').GetName] has stationed troops on our northern border, forcing us to return to the tributary system; bandits have risen up in Cochinchina, seizing control of prefectures and counties; the state treasury is depleted, making it difficult to sustain the new army; Western powers stand by and watch the situation unfold—only [SCOPE.sCountry('fra_scope').GetName] is willing to extend a helping hand.\n\n[SCOPE.sCountry('fra_scope').GetName] has dispatched envoys, stating: 'We are willing to send troops to help you suppress the rebellion and resist foreign enemies, ensuring the integrity of [ROOT.GetCountry.GetAdjective]'s territory. However, you must conclude a protectorate treaty with us, temporarily placing your foreign affairs and military administration under French supervision.' In the imperial court, all ministers weep bitterly as they engage in heated debates: some argue that 'it is better to be a shattered jade than an intact tile' (to die honorably rather than survive in disgrace), while others contend that 'as long as the green mountains remain, there will always be firewood' (it is better to preserve one's strength for future opportunities). After painful reflection, I cherish the imperial enterprise founded by our ancestors through countless hardships and cannot bear to see the state collapse and the people suffer. This is not an act of surrender, but a temporary expedient measure—a gesture of enduring humiliation to preserve our strength. We will borrow French troops to resolve the imminent crisis, and once internal unrest is suppressed and national strength is restored, we will strive to regain our autonomy."
 dsk_dai_events.13.a:0 "Temporarily submit to [SCOPE.sCountry('fra_scope').GetAdjective] to preserve the imperial lineage, and gradually plan for national rejuvenation in the future"

 dsk_dai_events.15.t:0 "[SCOPE.sCountry('fra_scope').GetAdjective] Gunboats Approach the City"
 dsk_dai_events.15.d:0 "Rejecting French missionary activities has incurred military disaster. [SCOPE.sCountry('fra_scope').GetAdjective] warships have deployed outside the port of [SCOPE.sState('xili_sheng').GetName], forcing us to open our ports for trade"
 dsk_dai_events.15.f:0 "Previously, when France dispatched envoys requesting permission for missionary activities, I firmly rejected them with the reason that 'alien religions will disrupt our customs and traditions', and I suspected that they would bear a grudge ever since. Now border reports have arrived: Emperor [SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName], [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] of [SCOPE.sCountry('fra_scope').GetName], has dispatched the Far East Fleet to anchor outside the port of [SCOPE.sState('xili_sheng').GetName]. Three ironclad warships are lined up to demonstrate military force, threatening to bombard [SCOPE.sState('xili_sheng')] if we refuse to open our ports for trade and lift the ban on missionary activities!\n\n[SCOPE.sState('xili_sheng').GetName] is a vital strategic town of our country. The port is bustling with merchant ships, but the coastal fortresses outside the city have been neglected for years and are in disrepair. Our new navy is no match for the massive ironclad warships. The French army has further dispatched envoys to land and deliver an ultimatum: we have three days to respond, otherwise 'the city will be reduced to ruins, and both jade and stone will be burned to ashes' (both the innocent and the guilty will perish). When the news spreads to the imperial court, all ministers are thrown into chaos: some argue that 'we should temporarily concede to open trade, so as to ease the military threat and plan for the future'; others contend that 'the French barbarians are being excessively arrogant—if we make one step of concession, they will demand ten more. We have no choice but to fight to the death!'"
 dsk_dai_events.15.a:0 "Temporarily permit trade to ease the military threat, and gradually plan for future countermeasures"
 dsk_dai_events.15.b:0 "The French barbarians are rampant! We swear to live and die with [SCOPE.sState('xili_sheng').GetName]—it is better to be a shattered jade than an intact tile!"

GDAI_ADJ:0 "Dai Nam"

dsk_dai_main_advance:0 "1. When [concept_legitimacy] is greater than 95 and the country is a #v tributary state of China#!, researching #red nationalism#! will trigger #v Debate on Hua-Yi Dichotomy#!\n2. When there are fiscal borrowings, #v Chinese Military and Financial Aid#! will be triggered!\n3. When #yellow Napoleon III#! ascends the throne in France, #v Mission from France#! will be triggered!\n4. When the influence of #v Anti-China Faction#! exceeds 2 points and the year is later than 1839, #v Reign Title Change to #yellow Dai Nam#!#! will be triggered!\n5. Successfully gaining independence will increase the influence of #v Anti-China Faction#! by 2 point\n6. When the influence of #v Pro-China Faction#! and #v Anti-China Faction#! are equal and both are at least 2 points, #v Court Debate#! will be triggered!\n7. After #v China#! is defeated in the #v First Opium War#!, #v Movement for a Stronger Vietnam#! will be triggered!\n8. Completing four reforms will trigger #v Consolidation of Reforms#!\n9. When the influence of #v Anti-China Faction#! exceeds 2 points, #v Dispute over Legitimacy#! will be triggered!\n10. When the #v New Monarch#! ascends the throne, #v Coronation Ceremony#! will be triggered!\n11. When the influence of #v Anti-China Faction#! exceeds 3 points and #v March West into Siam#! is not chosen, #v Ally with Siam to Contain China#! will be triggered!"
je_dsk_dai_main_a_tt:0 "Our country's reforms have not yet commenced"
je_dsk_dai_main_b_tt:0 "Our country's reforms are in full swing"
je_dsk_dai_main_c_tt:0 "Our country's reforms are on the verge of completion"
lose_all_dai_je:0 "This ending will lose all events related to the #v Sino-French War#! and [SCOPE.sCountry('chi_scope').GetAdjective]"
dsk_dai_events.1.t:0 "Tributary Relationship Between China and Vietnam"
dsk_dai_events.1.d:0 "Envoys of the [Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')] of [SCOPE.sCountry('chi_scope').GetAdjective] arrived in Hue, bearing the goodwill of assisting Annam in reform and strengthening itself to jointly resist Western invaders. As news spread, the entire court was thrown into heated debate: led by the Grand Councilors, one faction advocated leveraging the tributary alliance to seek Qing assistance for reforms, deeming it the optimal strategy to address the imminent crisis; while the faction led by local gentry representatives firmly opposed this, arguing that the Qing Dynasty itself was facing upheaval, its aid would inevitably come with strings attached, and excessive dependence would lead to the loss of national sovereignty—reforms must rely on the country's own strength."
dsk_dai_events.1.f:0 "I often reflect deeply while perusing historical records: the bond between our Vietnam and China has been intertwined for millennia, sharing weal and woe. From the migration and integration of the ancient Baiyue peoples, to the establishment of prefectures and counties under the Qin and Han dynasties, and then to the founding of the Nguyen Dynasty with investiture from the Qing, the friendship between the two nations has long been rooted in the mountains and rivers. Chinese civilization has been like a mentor—our dynasty's institutions, imperial examinations, rituals, agriculture, and craftsmanship have mostly modeled themselves after the Central Plains; Chinese characters once served as the official script of the court, and Confucianism formed the foundation of governance. Even the layout of the Hue Imperial City followed the pattern of the Forbidden City in Beijing. In years of famine, the Qing often dispatched officials for disaster relief and allocated grain supplies; in return, our Vietnam strictly abided by tributary etiquette, paying annual tributes."
dsk_dai_events.1.a:0 "Dispatch envoys to the capital with tributary etiquette, submit a memorial to the Qing court, uphold the ancient tributary system, and pledge to pay annual tributes."
dsk_dai_events.1.b:0 "Absolutely not! Although the Qing is our suzerain, it can barely protect itself—Western powers have already provoked trouble along its coasts, and its aid will be unsustainable."


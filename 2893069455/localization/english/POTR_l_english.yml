dsk_dai_events.22.t:0 "The First Treaty of Saigon"​
dsk_dai_events.22.d:0 "Gia Dinh fell; troops were exhausted and provisions were depleted. To preserve the remaining territories, a treaty was signed temporarily, but the will to resist has never been extinguished"​
dsk_dai_events.22.f:0 "In the winter of the eleventh year of Xianfeng's reign (1861), the war in #yellow Cochinchina#! had lasted more than ten months. The three cities of #yellow Gia Dinh#!, #yellow Bien Hoa#! and #yellow Dinh Tuong#! had successively fallen after exhausting all their strength to defend themselves. \n\nAfter #yellow Lê Văn Trung#! sacrificed his life for the country, the remaining garrison troops retreated to Vinh Long, joining forces with righteous civilians to wage guerrilla warfare. However, the French ironclad warships blockaded the Mekong River, cutting off all supplies of food and weapons. Reinforcements from Central Vietnam were intercepted by the Spanish fleet and could not advance a single step. Although the imperial palace in Hue was still in our hands, the army and civilians of #yellow Cochinchina#! had fought until their ammunition and provisions were completely exhausted. The French army threatened that 'if resistance continues, we will massacre the entire population of Vinh Long and burn and plunder Central Vietnam'. To save the lives of hundreds of thousands of innocent people and to preserve the foundation for national restoration, I endured the heart-wrenching pain and dispatched ministers to #yellow Saigon#! to conclude the treaty. This is not surrender—it is truly 'enduring temporary humiliation to await future revival'! \n\nEvery clause of the treaty is stained with blood and tears: the three cities will be temporarily garrisoned by French troops (not ceded); the three ports of Tourane, Baria and Quang Yen will be opened for trade; an indemnity of four million francs will be paid for military expenses; missionaries will be permitted to reside in the trading ports on a limited basis. Yet I have secretly instructed the ministers who concluded the treaty: all clauses shall be marked as 'temporary wartime agreements'. Once our national strength is restored and we drive the enemy out of our territory, the treaty will be abrogated immediately!!"
dsk_dai_events.22.a:0 "Issue an imperial edict to the entire nation: reduce imperial banquets and expenses to replenish the state treasury; reorganize military preparations and train a new army; reward righteous civilians and generously compensate the families of the soldiers who died in battle"​

dsk_dai_events.23.t:0 "The Red River is Under Emergency Alert"​
dsk_dai_events.23.d:0 "In 1873, the Governor of Saigon of [SCOPE.sCountry('fra_scope').GetAdjective], #yellow Marie Jules Dupré#, dispatched the officer Francis Garnier to invade the north. Under the pretext of 'protecting trade routes', Garnier captured #yellow Hanoi#!, successively occupying several cities including #yellow Hai Duong#! and #yellow Ninh Binh#, advancing straight toward the upper reaches of the Red River—this area is not only the lifeline of Sino-Vietnamese trade, but also the gateway to [SCOPE.sCountry('fra_scope').GetAdjective]'s coveted Yunnan region"​
dsk_dai_events.23.f:0 "In the past, to save the lives of our people, we signed a treaty temporarily, allowing three cities to be garrisoned by French troops. Yet the French barbarians have taken advantage of our concessions to make further demands—they have even marched north to invade our lands, destroying our homes and killing our people. For such faithless and treacherous villains, we have no choice but to stop war with war! The guerrilla soldiers in Cochinchina have long been sharpening their weapons and waiting for the opportunity; upon hearing the urgent report of the northern invasion, they immediately launched raids on the French army's rear supply lines. The garrison troops in Tonkin are on high alert, reinforcing the city defenses of Hanoi and Hai Phong. I have also issued an urgent edict to summon Liu Yongfu and his Black Flag Army, promising them provisions, salaries and weapons to jointly resist the French barbarians"​
dsk_dai_events.23.a:0 "Form an alliance with the Black Flag Army, defend Hanoi and Hai Phong to the death, and launch a frontal counterattack to halt the French army's northward advance"
dsk_dai_events.24.t:0 "The Treaty of Hue"​
dsk_dai_events.24.d:0 "[SCOPE.sCountry('fra_scope').GetAdjective] advanced unimpeded: one detachment pinned down the Black Flag Army along the Red River, while another used its fleet to storm the Thuận An Fortress. After this gateway defending Hue fell, French cannons were pointed directly at the imperial palace of the Nguyen Dynasty. 4,000 elite troops besieged the city, threatening to 'raze Hue to the ground in a single day and night'"
dsk_dai_events.24.f:0 "At this moment, the imperial court was trapped in a hopeless situation: Emperor Tu Duc of Vietnam suddenly passed away, triggering internal chaos as princes vied for the throne. The pro-war faction called for 'dispatching reinforcements from Tonkin to defend the capital', but the Black Flag Army was already entangled by the French army and could not disengage. The peace faction wept as they pleaded: 'If the city falls, the imperial lineage will be destroyed'. Meanwhile, [concept_overlord] [SCOPE.sCountry('chi_scope').GetAdjective] only sent envoys to issue a verbal condemnation, without dispatching a single soldier to reinforce us. \n\nThe French envoy Harmand landed with a draft treaty, adopting an uncompromising attitude: either sign to accept [SCOPE.sCountry('fra_scope').GetAdjective] 'protection', or face total annihilation where 'both jade and stone will be burned to ashes'. To add further humiliation, the treaty demanded the immediate destruction of the imperial seal conferring the title of #o 'King of Vietnam'#! granted by [SCOPE.sCountry('fra_scope').GetAdjective], completely severing the tributary relationship."
dsk_dai_events.24.a:0 "To preserve the last thread of the Nguyen imperial lineage, we have no choice but to endure humiliation and sign this treaty dictated by the enemy at the city gates"
dsk_dai_events.24.b:0 "Better to be a shattered jade than an intact tile! We ministers are willing to fight to the death alongside Your Majesty"

dsk_dai_events.25.t:0 "The Final Hour"​
dsk_dai_events.25.d:0 "[SCOPE.sCountry('fra_scope').GetAdjective]'s northward invasion grew increasingly fierce. Qing troops from the Northern Dynasty entered Vietnam at our invitation, sparking the Sino-French War. At long last, the army and civilians of [ROOT.GetCountry.GetAdjective] gained powerful reinforcements"​
dsk_dai_events.25.f:0 "After the French barbarians tore up the temporary Saigon Agreement, their northward offensive intensified: Hanoi and Hai Phong issued emergency alerts one after another; Tuyen Quang and Hung Hoa were besieged by French troops; guerrilla bases in Cochinchina were repeatedly suppressed. The army and civilians of [ROOT.GetCountry.GetAdjective] fought bloody battles for several years—though not an inch of land was yielded, our troops were exhausted and provisions were depleted. Just as the mountains and rivers of the Three Regions were on the verge of collapse, the Qing court of the Northern Dynasty finally issued an imperial edict to reinforce Vietnam. Tens of thousands of Qing troops marched into Vietnam from Lang Son and Zhennan Pass in separate columns, joining forces with our Tonkin garrison and the Black Flag Army to jointly resist the French barbarians! When the news spread to Hue, the entire city's people knelt and kowtowed, burning incense in gratitude. Cheers erupted throughout the imperial court. I climbed the city wall and gazed into the distance at the Qing army's banners, tears soaking my dragon robe: 'Heaven will not abandon my [ROOT.GetCountry.GetAdjective]! [SCOPE.sCountry('chi_scope').GetAdjective] has extended a helping hand—this is our golden opportunity for national restoration!'"​
dsk_dai_events.25.a:0 "At this moment of national crisis, we will never withdraw our troops until every French barbarian is annihilated"​

fra_chi_war_start_go_tt:0 "[SCOPE.sCountry('fra_scope').GetAdjective] has successfully surveyed the Red River basin and found a pretext for [concept_war]#!

dsk_dai_events.26.t:0 "The Treaty of Gia Dinh"​
dsk_dai_events.26.d:0 "The army and civilians fought to the death and broke the enemy's siege. [SCOPE.sCountry('fra_scope').GetAdjective] suffered a crushing defeat at #yellow Gia Dinh#! and sued for peace. [ROOT.GetCountry.GetAdjective] recovered all lost territories and concluded a new equal alliance treaty"​
dsk_dai_events.26.f:0 "In the spring of the second year of Tongzhi's reign, the First Franco-Vietnamese War had lasted for two years. Since the bloody battle of Gia Dinh began, the army and civilians of our Dai Nam have stood united in hatred against the enemy: righteous civilians in Cochinchina waged relentless guerrilla raids; the Black Flag Army of Tonkin proved invincible; the new army of Central Vietnam rushed to reinforce the front lines day and night; most importantly, we gained flanking support from the Qing army of the Heavenly Dynasty. Together, we finally trapped the Franco-Spanish allied forces in the isolated city of Saigon! French ironclad warships were ambushed at the dangerous shoals of the Red River, cutting off their supply lines; ground troops were repeatedly attacked from both sides, suffering over 50% casualties. The [SCOPE.sCountry('spa_scope').GetAdjective] fleet, seeing the tide turn, fled in panic. The French barbarian commander-in-chief #yellow Charles Rigault de Genouilly#! was forced to dispatch envoys to sue for peace, agreeing to sign a treaty dictated by the victor at the city gates and return all occupied territories! \n\nWhen the news reached #yellow Hue#!, the entire nation erupted in celebration: people decorated the streets with lanterns and colored streamers, burning incense to comfort the spirits of the soldiers who died in battle. In the imperial court, all ministers shouted in unison: 'His Majesty is wise and holy; the army and civilians are of one mind—thus we have defeated the barbarian invaders!'"​
dsk_dai_events.26.a:0 "Long live the Emperor! Long live the Emperor! Long live the Emperor!"

dsk_black_flag_army_button:0 "Reinforcement by the Black Flag Army"​
dsk_black_flag_army_button_desc:0 "Liu Yongfu of the Black Flag Army leads his elite troops to reinforce us day and night, marching straight for Saigon! United as one with the army and civilians of Dai Nam, they vow to drive out the French invaders, recover our rivers and mountains, and jointly defend the territories of the Three Regions!"​


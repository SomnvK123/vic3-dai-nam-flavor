# Event outcome descriptions
event_effects_yunnan_valley_expedition_success_tt: "The Yunnan Valley has been explored, with miracles and legendary treasures discovered."
ideology_japan_kogi_enlightenment:0 "Moderate Japanese Militarism"
ideology_japan_kogi_enlightenment_desc:0 "The Moderate Japanese Militarism faction, also known as the Control Faction, opposes radical coups and supports free-market reforms. It seizes political power through institutional channels, allies with zaibatsu to pursue steady overseas expansion. Though adopting milder tactics, its aggressive ambitions and militarist nature remain unchanged."
clever_dsk.243.t: "A Grand Imperial Wedding"
clever_dsk.243.d: "On [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], the wedding of Emperor [SCOPE.sCharacter('aus_king_franz_scope').GetFirstName] and Empress [SCOPE.sCharacter('aus_queen_xixi_scope').GetFirstName] is held as scheduled inside the Augustinian Church. Beneath the candle-lit domed ceiling, the Archbishop presides over the sacred nuptial rites. Outside the cathedral, Vienna’s citizens line the streets decked with flowers and colourful bunting, while young maidens scatter romantic rose petals along the wedding procession route. Clad in ornate military uniform, Emperor [SCOPE.sCharacter('aus_king_franz_scope').GetFirstName] gazes tenderly into the eyes of Empress [SCOPE.sCharacter('aus_queen_xixi_scope').GetFirstName], dressed in an elegant pink velvet gown. Amid the crowd’s deafening cheers, [SCOPE.GetRootScope.GetCountry.GetName] celebrates this magnificent royal wedding."
clever_dsk.243.f: "Standing beside the Danube waterfront, [SCOPE.sCharacter('aus_queen_xixi_scope').GetFirstName] appears somewhat bashful. Emperor [SCOPE.sCharacter('aus_king_franz_scope').GetFirstName] hurries aboard the vessel, pulls the nervous empress into his arms, publicly kisses her forehead and knuckles, and whispers softly: Fear not, I shall watch over you for all eternity."
clever_dsk.243.a: "Best wishes to Emperor [SCOPE.sCharacter('aus_king_franz_scope').GetFirstName] and Empress [SCOPE.sCharacter('aus_queen_xixi_scope').GetFirstName]."
clever_dsk.246.t: "A Solemn Royal Wedding"
clever_dsk.246.d: "On [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], the imperial palace is adorned with flowers and honor guards amid resonant wedding music, with guests clad in formal gowns gathered to witness the ceremony. [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] stands beside their betrothed [SCOPE.sCharacter('married_young_girl_scope').GetFirstName] before the altar to complete the sacred nuptials, while citizens across [ROOT.GetCountry.GetCapital.GetCityHubName] cheer and celebrate the royal union in the streets."
clever_dsk.246.f: "What a wonderful wedding; may the newlyweds live in eternal bliss and see their dynasty endure for ages.\n\nIndeed, we sincerely wish them boundless love, lifelong harmony, and companionship for every remaining day of their lives."
clever_dsk.246.a: "Best wishes to [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] and [SCOPE.sCharacter('married_young_girl_scope').GetFirstName], #white may their love stand everlasting#!."

clever_dsk.248.t: "A Resplendent Imperial Wedding"
clever_dsk.248.d: "On [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], the imperial wedding of Emperor [SCOPE.sCharacter('fra_king_nap_iii_scope').GetFirstName] and Empress [SCOPE.sCharacter('fra_eugenie_montijo_scope').GetFirstName] is held at the Tuileries Palace. Inside the cathedral, crystal chandeliers hang from the domed ceiling and stained glass casts soft filtered light. Draped in white diamond-trimmed velvet gown, [SCOPE.sCharacter('fra_eugenie_montijo_scope').GetFirstName] links arms with [SCOPE.sCharacter('fra_king_nap_iii_scope').GetFirstName], dressed in a dark blue general’s uniform, as they step slowly into the sanctuary. After gazing fondly at his bride, [SCOPE.sCharacter('fra_king_nap_iii_scope').GetFirstName] lifts [SCOPE.sCharacter('fra_eugenie_montijo_scope').GetFirstName]’s hand and presses a gentle kiss to her fingertips, one can faintly spot the subtle tremble of her fingers. Amid the crowd’s cheers, [SCOPE.GetRootScope.GetCountry.GetName] marks this magnificent royal wedding day."
clever_dsk.248.f: "Miss [SCOPE.sCharacter('fra_eugenie_montijo_scope').GetFirstName], what might be the path leading into your heart?\n\nThrough the church, Your Majesty...\n\nThen from this day onward, you are my crown and my heart; all the glory of the Empire pales beside you."
clever_dsk.248.a: "Bless Emperor [SCOPE.sCharacter('fra_king_nap_iii_scope').GetFirstName] and Empress [SCOPE.sCharacter('fra_eugenie_montijo_scope').GetFirstName]."

clever_dsk.251.t: "Blade of the Old Regime"
clever_dsk.251.d: "On [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], the fierce leaders of the Shinsengumi, a private corps stained with the #red blood#! of countless Restoration loyalists: Commander [SCOPE.sCharacter('jap_kondo_character_scope').GetFirstName] and Vice-Commander [SCOPE.sCharacter('jap_hijikata_character_scope').GetFirstName], refuse to submit to His Majesty [ROOT.GetCountry.GetRuler.GetFirstName] and resolve to defect to [SCOPE.sCountry('jap_sgn_country_scope').GetName]. These diehard lackeys of the fading feudal order will only be brought to heel at the point of firearms."
clever_dsk.251.f: "We shall never forget the fallen anti-shogunate reformers slain by [SCOPE.sCharacter('jap_kondo_character_scope').GetFirstName], nor the rivers of #red blood#! spilled at the Ikeda Inn at the hands of [SCOPE.sCharacter('jap_hijikata_character_scope').GetFirstName]. Even now they rally troops to resist stubbornly, clinging to the rotten government of [SCOPE.sCountry('jap_sgn_country_scope').GetName]. Until the Shinsengumi is wiped out, the spirits of our martyrs cannot rest, and diehard Tokugawa partisans will continue to run rampant."
clever_dsk.251.a: "Blood shall be paid in blood!"

clever_dsk.252.t: "The Fall of the Shinsengumi"
clever_dsk.252.d: "On [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], we have eradicated the last shogunal remnants and their Shinsengumi enforcers. Ever since our troops executed #red Isami Kondō#! at Itabashi execution grounds, Vice-Commander [SCOPE.sCharacter('jap_hijikata_character_scope').GetFirstName] has stubbornly rejected all offers of amnesty against the tide of national unification, swearing: to avenge Commander Kondō is the sole purpose left in my life. Yet this obstinate rebel was decisively routed at #red Hakodate#!. As his army crumbles, our soldiers witness [SCOPE.sCharacter('jap_hijikata_character_scope').GetFullName} charge alone headlong into our battle lines."
clever_dsk.252.f: "Rebel commander [SCOPE.sCharacter('jap_hijikata_character_scope').GetFullName} leads a tiny retinue out of the Ichimokugate barrier to block our advance. Ferocious and unyielding, he charges our ranks again and again amid hails of gunfire, stunning our soldiers who dub him the 'Oni General' with genuine awe. Our commanders deem [SCOPE.sCharacter('jap_hijikata_character_scope').GetFirstName} a peerless warrior of righteous loyalty; if persuaded to surrender and serve, he would become a pillar of our realm. Now as he gallops alone toward our lines before the gate’s palisades, his fate hangs in our hands."
clever_dsk.252.a: "Hold your fire, capture him alive! Such a loyal warrior merits high office and can serve as a bridge for reconciliation with old feudal factions!"
clever_dsk.252.b: "Open fire and slay this stubborn traitor!"

clever_dsk.253.t: "Memorial of a Bygone Great Ruler"
clever_dsk.253.d: "During the Peter the Great memorial parade held at the Winter Palace on [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName}, clad in Guards Marshal regalia, stands at attention alongside all senior army officers. A bronze bust of Emperor [SCOPE.sCharacter('peter_benefactor').GetFirstName}, the very statue kept upon his personal study desk since his coronation and named by him his lifelong model of governance, rests upon the dais."
clever_dsk.253.f: "\"Emperor [SCOPE.sCharacter('peter_benefactor').GetFirstName} forged a formidable military, opened seagoing frontiers and laid the foundational bedrock of our Empire with iron resolve. I carry forward his legacy: fortify imperial authority with martial spirit, uphold order through discipline, and expand our dominion to fulfill his unfinished ambitions. As we honor the late sovereign today, I swear alongside all assembled nobles: Russia’s glory shall always be defended by her soldiers!\""
clever_dsk.253.a: "[SCOPE.sCharacter('peter_benefactor').GetFirstName} cherished and cared deeply for his troops, and I shall follow his example!"
clever_dsk.253.b: "I must cement the officer corps’ loyalty toward [SCOPE.GetRootScope.GetCountry.GetName}."

clever_dsk.254.t: "Enraged Satsuma Samurai"
clever_dsk.254.d: "Defeated in our war against the Satsuma domain rebels, we watch as furious rebel leader [SCOPE.sCharacter('jap_angry_saigo_character_scope').GetFirstName} storms the imperial palace of [ROOT.GetCountry.GetCapital.GetCityHubName} with his army. Eyes blazing with rage, [SCOPE.sCharacter('jap_angry_saigo_character_scope').GetFirstName} unleashes a furious tirade against the craven [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName} and castigates surviving domain clique officials."
clever_dsk.254.f: "\"We Satsuma patriots rose alongside you to overthrow the Shogun and restore imperial rule, abolish the Tokugawa regime and birth the Meiji Restoration! Our samurai spilled blood to uphold imperial governance and stabilize the realm, yet you ingrates discard us once our purpose is fulfilled, stripping our livelihood, dignity and wealth, assassinating our kinsmen! You bow submissively to foreign powers, shelve the Korean expedition plan and shrink from western influence, abandoning our nation’s territory and the warrior’s honor! #yellow We rise today on heaven’s command to purge corrupt courtiers and traitorous ministers, #! to safeguard Japan’s future!\""
clever_dsk.254.a: "Disaster has befallen us!"

clever_dsk.255.t: "A Clash Among Elder Statesmen"
clever_dsk.255.d: "To Honorable Lord [SCOPE.sCharacter('yamagata_aritomo_letter').GetFullName}:"
clever_dsk.255.f: "State finances crumble, government bonds cannot be issued, the cabinet falters and public unrest spreads. You insist on unregulated military expansion dictated solely by army brass with no regard for common folk’s hardship; I advocate parliamentary politics to repair finances and soothe public discontent.\n\nOur core beliefs are irreconcilable, thus I tender my resignation and urge all elder statesmen to form a new cabinet to steady the nation. If you persist in letting the military run amok, civil war will tear Japan apart.\n\nI beg you to prioritize our motherland above partisan military interests and reconsider your stance.\n\nDated [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')]\nRespectfully yours,\n[SCOPE.sCharacter('ito_hirobumi_letter').GetFullName}"
clever_dsk.255.a: "We shall side with [SCOPE.sCharacter('ito_hirobumi_letter').GetFirstName}."
clever_dsk.255.b: "We must continue to rely upon [SCOPE.sCharacter('yamagata_aritomo_letter').GetFirstName}."

clever_dsk.256.t: "A Private Letter from Bismarck"
clever_dsk.256.d: "My Dear Count [SCOPE.sCharacter('pru_albrecht_von_roon_letter').GetLastName}:"
clever_dsk.256.f: "I shall delay formal reply to your dispatch dated the [TimeKeeper.GetCurrentDate.Format('dd')}; I inform you only that I arrive in Berlin tomorrow. This journey stems from official duty rather than poor health, to confer with His Majesty and yourself on pressing state affairs.\n\nMonths of worsening chronic illness leave me unfit for my former premiership. Should the Kaiser permit, I would remain Minister of Foreign Affairs: no other statesman commands twenty years of European diplomatic experience and cross-continental diplomatic trust to match mine. Still, combining foreign ministry oversight with domestic governance is an unsustainable burden for any single statesman.\n\nThis office has cost me decades of unyielding resolve, countless political rivals, lost old friendships and few new trusted allies. Now I have fallen out of favor with [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName}, and scheming courtiers easily manipulate his judgment, crippling my diplomatic initiatives. For years I endured the plots of Goltz and Usedom, yet despair and bitterness wear on my spirit; I know not how much longer I can persist.\n\nYour lifelong friend,\n[SCOPE.sCharacter('pru_otto_von_bismarck_letter').GetFirstName}"
clever_dsk.256.a: "Send an immediate consoling reply to Count [SCOPE.sCharacter('pru_otto_von_bismarck_letter').GetLastName}."
clever_dsk.256.b: "You grow far too pessimistic; how can such a gloomy mind lead our cabinet as Chancellor?"

clever_dsk.257.t: "A Letter Addressed to the Queen"
clever_dsk.257.d: "My Dearest #blue Fairy#! [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName}:"
clever_dsk.257.f: "I put quill to paper tonight not as Prime Minister, but as your most loyal lifelong servant. The cabinet is nothing but cold machinery; without your guiding presence, the Empire is but an empty illusion.\n\nYour wisdom, grace and boundless compassion form the sole true wellspring of this nation’s strength. My entire life exists only to serve you and further immortalize your illustrious name.\n\nForever yours,\n#yellow D#!"
clever_dsk.257.a: "Accept the warm praise from Mr. [SCOPE.sCharacter('gbr_disraeli_character_letter').GetLastName}."
clever_dsk.257.b: "Does [SCOPE.sCharacter('gbr_disraeli_character_letter').GetFirstName} seek hidden political gain behind these honeyed compliments?"

clever_dsk.258.t: "Reply from Her Majesty the Queen"
clever_dsk.258.d: "My dearest, dearest Mr. [SCOPE.sCharacter('gbr_disraeli_character_letter').GetLastName}:"
clever_dsk.258.f: "Your letters are my greatest comfort. Ever since beloved Albert’s passing, no other soul understands or loves me with such tender devotion as you.\n\nAmid this harsh, frigid world you remain my one true confidant. I reread your words endlessly; even amid lingering grief they fill my heart with quiet joy.\n\nWith all my affection,\n[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName}"
clever_dsk.258.a: "Bestow royal honors upon the devoted Mr. [SCOPE.sCharacter('gbr_disraeli_character_letter').GetLastName}."

dsk_queen_victoria.16.t: "The Prince Consort Falls Gravely Ill"
dsk_queen_victoria.16.d: "On [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], Prince [SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName}, long afflicted with chronic abdominal pains, succumbs to the damp frigid climate of Windsor Castle and contracts typhoid fever, slipping rapidly into critical condition with unrelenting high fever. Despite the royal physicians’ utmost efforts, irreversible organ failure sets in, leaving the Prince Consort’s life hanging by a thread."
dsk_queen_victoria.16.f: "His eyes hang half-lidded, breaths shallow, erratic and faint; he drifts into intermittent delirium while his limbs grow cold and rigid at the fingertips.\n\nSilence cloaks the bedchamber, broken only by the Prince’s ragged gasps and muffled weeping from onlookers. [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName} kneels beside the bed, clutching her husband’s icy hand, trembling uncontrollably as tears stream down her face, staring desperately at his fading form on the verge of collapse.\n\nRoyal children, personal attendants, head physicians and court officials crowd the chamber to keep vigil, every face etched with dread and desolation, none daring to shatter the suffocating hush."
dsk_queen_victoria.16.a: "We cannot avert this tragedy... May God watch over him..."
dsk_queen_victoria.16.b: "Summon more accomplished physicians without delay!"

dsk_queen_victoria.17.t: "The Queen Overwhelmed by Sorrow"
dsk_queen_victoria.17.d: "#yellow Prince Albert#! passes away on [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], leaving [SCOPE.GetRootScope.GetCountry.GetName} in national mourning. Upon the announcement, Saint Paul’s Cathedral tolls its funeral bells, all cheer vanishes from [ROOT.GetCountry.GetCapital.GetCityHubName}. Bustling thoroughfares fall silent; households hang black crepe and stay indoors, townsfolk don somber black attire to wander the streets in quiet lament. Shops and places of entertainment close entirely, church bells ring continuously across the capital, the Thames falls quiet and the whole city sinks under a heavy pall of grief and remembrance."
dsk_queen_victoria.17.f: "Nothing bears meaning without him beside me... Even two days apart once felt unbearable; I prayed to God he would outlive me... Now every day turns to endless night, shadowed by perpetual sorrow. — [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName}"
dsk_queen_victoria.17.a: "Leave [SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName} to her solitude; she may withdraw from all public appearances for years to come."
dsk_queen_victoria.17.b: "Publicize the Queen’s grief to urge her to acknowledge her greater sovereign duty to the realm."

clever_dsk.259.t: "Kido Takayoshi’s Final Illness"
clever_dsk.259.d: "On [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], dim gloom fills the traditional Japanese bedchamber of Kido’s private villa at Sanbongi in Kyoto. Terminal colon cancer drains the last of [SCOPE.sCharacter('jap_kido_takayoshi_scope').GetFirstName}’s vitality; shuttered shoji screens block outside noise, leaving only medicinal fumes, faint embers from charcoal braziers and intermittent labored gasps hanging heavy in the air. Pale and gaunt upon his futon, [SCOPE.sCharacter('jap_kido_takayoshi_scope').GetFirstName} stretches out a withered trembling hand to firmly clasp the palm of his lifelong confidant [SCOPE.sCharacter('jap_okubo_toshimichi_scope').GetFirstName}."
clever_dsk.259.f: "\"Saigō... enough of this fighting...\" [SCOPE.sCharacter('jap_kido_takayoshi_scope').GetFirstName} murmurs weakly, while silent mourners stand gathered around the sickbed. Dressed in formal dark robes, rigid-backed and grim-faced, [SCOPE.sCharacter('jap_okubo_toshimichi_scope').GetFirstName} grips his dying friend’s hand tightly, jaw clenched to hold back overwhelming grief.\n\nThe attending royal physician stands helpless at the foot of the bed, confirming all medicine has failed to reverse his decline, filling the room with unspoken sorrow."
clever_dsk.259.a: "Rest well, Takayoshi; #yellow Saigō#! has agreed to lay down arms and enter peace talks..."
clever_dsk.259.b: Hire the finest available physicians at great cost to save [SCOPE.sCharacter('jap_kido_takayoshi_scope').GetFullName}!"

clever_dsk.260.t: "Debate Over Abolishing Monarchy"
clever_dsk.260.d: "Legislators representing [SCOPE.gsInterestGroup('shougun_ig').GetName} voice fierce opposition to the parliamentary bill proposing the deposition of [ROOT.GetCountry.GetRuler.GetFirstName} and enactment of [SCOPE.sLaw('current_law_scope').GetName}."
clever_dsk.260.f: "London may grow accustomed to a realm without a crowned sovereign, yet we shall never accept the implementation of [SCOPE.sLaw('current_law_scope').GetName}. We remain confident [ROOT.GetCountry.GetRuler.GetFirstName} will heed his nation’s pleas and uphold his royal responsibilities instead of wallowing in grief and shirking his duties."
clever_dsk.260.a: "The deputies of [SCOPE.gsInterestGroup('shougun_ig').GetName} speak wisely; monarchy anchors our nation’s stability."

clever_dsk.261.t: "The Battle of the Somme"
clever_dsk.261.d: "To break the stalemate, forces of [SCOPE.sCountry('gbr_Battle_of_Somme').GetName} and [SCOPE.sCountry('ger_Battle_of_Somme').GetName} collide across French soil along the Somme River. Per the operational goals laid out by General [SCOPE.sCharacter('gbr_battle_of_somme_benefactor').GetLastName}, this offensive eases crippling French pressure at Verdun, forcing [SCOPE.sCountry('ger_Battle_of_Somme').GetName} to divert reserves; backed by cutting-edge #white tank#! technology, allied troops wear down German manpower and cripple the enemy’s capacity to sustain wartime industry."
clever_dsk.261.f: "Though the bulk of [SCOPE.sCountry('ger_Battle_of_Somme').GetName}’s army remains bogged down at Verdun and unable to launch large-scale western front assaults, the layered trench networks, barbed wire and concrete machine-gun bunkers built by General [SCOPE.sCharacter('ger_battle_of_somme_benefactor').GetLastName} along the Somme ensure the British breakthrough will devolve into bloody attrition. As heavy artillery blasts tear apart the surrounding landscape, [SCOPE.sCharacter('gbr_battle_of_somme_benefactor').GetLastName} remains convinced German defenders have been decimated; the rumble of tank engines echoes across no-man’s-land and the brutal carnage commences!"
clever_dsk.261.a: "#yellow Men, the great advance begins#!!"

clever_dsk.262.t: "First Battle of Ypres"
clever_dsk.262.d: "Stalled by allied resistance, [SCOPE.sCountry('ger_Battle_of_Ypres').GetName} resolves to seize vital coastal ports and strategic terrain belonging to [SCOPE.sCountry('bel_Battle_of_Ypres').GetName} and [SCOPE.sCountry('fra_Battle_of_Ypres').GetName}, intending to encircle the Entente’s northern flank. To preserve their last remaining sovereign territory from German occupation, resolute King [SCOPE.sCharacter('bel_battle_of_ypres_benefactor').GetFirstName} orders sluice gates opened to flood lowlands surrounding #yellow Ypres#!, halting the German army’s coastal advance."
clever_dsk.262.f: "Floodwaters slow the enemy advance, yet elite German formations assembled by General [SCOPE.sCharacter('ger_battle_of_ypres_benefactor').GetLastName} mass outside the walls of Ypres in [SCOPE.sCountry('bel_Battle_of_Ypres').GetName}. General [SCOPE.sCharacter('fra_battle_of_ypres_benefactor').GetLastName} swiftly coordinates alongside Belgian troops to dig defensive trenches across #yellow Ypres#!. Both sides race toward the sea to secure coastal ground, and a grueling positional battle for the critical harbor is imminent!"
clever_dsk.262.a: "#black Yser River#! #yellow Hold the line at all costs#! #red Defend our ground#!!"

clever_dsk.264.t: "When Johnny Comes Marching Home"
clever_dsk.264.d: "Civil war erupts inevitably at dawn on [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], mist shrouding the wilderness of [SCOPE.GetRootScope.GetCountry.GetName}. Confederate troops under General [SCOPE.sCharacter('csa_robbot_lee_benefactor').GetLastName} complete concealed pre-battle positioning awaiting the opening strike. Union commander General [SCOPE.sCharacter('usa_general_grant_benefactor').GetLastName}, weary yet calm, patrols frontlines amid fog thick with latent bloodshed as the terrible clash looms."
clever_dsk.264.f: "When Johnny comes marching home again, hurrah, hurrah!\nWe’ll give him a hearty welcome then, hurrah, hurrah!\nThe men will cheer, the boys will shout, the ladies they will all turn out,\nAnd we’ll all feel gay when Johnny comes marching home,\nWhile maidens strew #red roses#! along his homeward road!"
clever_dsk.264.a: "We await General [SCOPE.sCharacter('usa_general_grant_benefactor').GetFullName}’s hard-earned victory!"

clever_dsk.265.t: "The Man in the Red Shirt"
clever_dsk.265.d: "On the evening of [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], seeking the combat strength of volunteer fighters, Prime Minister [SCOPE.sCharacter('ita_camillo_gafur_benefactor').GetLastName} formally invites General [SCOPE.sCharacter('garibaldi_scope').GetLastName} to his official residence. Clad in tattered hat and iconic red shirt, Garibaldi is initially mistaken for a penniless beggar by palace sentries; as the main gate creaks open, a portly smiling figure emerges to greet him, none other than the statesman with whom he will negotiate an alliance: [SCOPE.sCharacter('ita_camillo_gafur_benefactor').GetLastName}."
clever_dsk.265.f: "Beneath polite outward pleasantries lies mutual calculation and quiet awkwardness. Minister Cavour covets Garibaldi’s volunteer army’s manpower to conquer the southern realm of [SCOPE.sCountry('garibaldi_spawn_foe_scope').GetName}, yet fears the General’s radical republican ideology and overwhelming popular charisma. Garibaldi meanwhile hopes to leverage his nation’s royal government to complete Italian unification and end generations of foreign meddling across the peninsula."
clever_dsk.265.a: "I place full faith in General [SCOPE.sCharacter('garibaldi_scope').GetLastName}’s prowess!"
clever_dsk.265.b: "Minister [SCOPE.sCharacter('ita_camillo_gafur_benefactor').GetLastName} acts with wise prudence!"

clever_dsk.266.t: "The Nation’s Beloved Heroes"
clever_dsk.266.d: "[SCOPE.GetRootScope.GetCountry.GetName} achieves full unification, reuniting fractured Italian peoples under one shared banner. Amid roaring public celebration, three towering figures responsible for national unification earn enduring popular affection, even as quiet friction simmers between royalist and republican factions. As Garibaldi’s Redshirts march triumphantly through [ROOT.GetCountry.GetCapital.GetCityHubName}, tricolor banners flutter across every street, citizens toss flower petals and crowd forward to shake their liberators’ hands."
clever_dsk.266.f: "[SCOPE.sCharacter('giuseppe_mazzini_scope').GetLastName} awoke our national consciousness and kindled the dream of unification; General [SCOPE.sCharacter('garibaldi_scope').GetLastName} bore arms into battle and led Redshirt troops to reclaim occupied territories; Prime Minister [SCOPE.sCharacter('ita_camillo_gafur_benefactor').GetLastName} navigated fraught international diplomacy to carve out a sovereign path for [SCOPE.GetRootScope.GetCountry.GetName}. Together they forged one united Italy from fragmented states, long live unified Italy!"
clever_dsk.266.a: "Let us cheer for these great men~~"

clever_dsk.267.t: "KILLED IN ACTION – Casualty Roll of Honour"
clever_dsk.267.d: "FALLEN COMMISSIONED OFFICERS"
clever_dsk.267.f: "J.R. Asheville, Gunner, Royal Field Artillery | Maj. J. Abernethy, Welsh Guards | Acting Capt. P. Barber, Cheshire Regiment | Sgt. L.E. Byrne, Norfolk Regiment | Capt. P.A. Blair, Royal Scots | Capt. J.K. Bower, Royal Irish Fusiliers | 2nd Lt. H.M. Bussey, Royal Irish Fusiliers | #yellow Capt. Roy Cronin, Royal Scots#!"
clever_dsk.267.a: "Miss, what troubles you? You look faint, you’ve given me quite a fright..."

clever_dsk.269.t: "National Swordsmanship Tournament"
clever_dsk.269.d: "A long-running annual nationwide fencing competition originating from Edo-era Japan draws countless martial arts adepts to test their blade skill. After rounds of duels across [TimeKeeper.GetCurrentDate.Format('MMMM dd, yyyy')], the tournament finals arrive, pitting [SCOPE.sCharacter('sword_i_japanese_scope').GetLastName} against [SCOPE.sCharacter('sword_ii_japanese_scope').GetLastName}. Word spreads fast and rival swordsmen flock to spectate this eagerly anticipated championship duel."
clever_dsk.269.f: "The tournament grounds of [ROOT.GetCountry.GetCapital.GetCityHubName} bustle with onlookers holding their breath for this pivotal contest. After a moment’s stillness, [SCOPE.sCharacter('sword_i_japanese_scope').GetLastName} unleashes a ferocious flurry of consecutive strikes, pressing relentlessly toward his opponent. Calm and composed, [SCOPE.sCharacter('sword_ii_japanese_scope').GetLastName} maintains steady defensive posture, deflecting incoming blows patiently to wait for gaps in his foe’s exhausted assault. The sharp ring of clashing steel echoes throughout the arena as victory hangs entirely in the balance."
clever_dsk.269.a: "Who shall prevail and earn the title of [SCOPE.GetRootScope.GetCountry.GetName}’s finest swordsman?"
objective_ra_name_BEL:0: "#v Kingdom of Belgium#!"
objective_ra_desc_BEL:0: "#v The Industrial Revolution boomed in Belgium. Only six years had passed since the yoke of Dutch oppression was cast off, yet the nation had outpaced its former ruler and begun construction of Continental Europe’s first railway. What does the future hold for them? #!#!"
balkan_1877_small_crisis_button:0: "Intervene in the Balkan Crisis"
balkan_1877_small_crisis_button_desc:0: "Tensions in Bulgaria and Bosnia are reaching breaking point. If we openly side with anti-Ottoman forces now, we can push the Eastern Question toward a full showdown."
balkan_1877_small_crisis_button_tt:0: "This will make [concept_russian] publicly back anti-Ottoman factions, drastically escalate Balkan tensions, and trigger the full Eastern Crisis chain early."
je_eqfm_status_6: "Current Stage: #bold #yellow Great Power Mediation#!. The Great Eastern Crisis has entered the phase of treaties and colonial spoils division among powers."
eqfm.140.t: "The Eastern Question Halted Temporarily"
eqfm.140.d: "The war failed to topple the Sublime Porte and instead forced anti-Ottoman coalitions in the Balkans to retreat. Though the empire remains fragile, the Sultan has reaffirmed his ability to keep order in Rumelia, at least for this generation."
eqfm.140.f: "The powder keg still lies beneath our feet, yet those who sought to light it now bear bloodied hands from the backlash."
eqfm.140.a: "The Sublime Porte still stands unbroken."
eqfm.141.t: "The Eastern Question Judged by Great Powers"
eqfm.141.d: "War and diplomatic intrigue have stripped the Sultan of power over the Balkans' future. Even if the empire survives, authority over Rumelia's fate has shifted to the conference tables of European powers."
eqfm.141.f: "The empire's borders are no longer drawn by armies and provincial governors, but carved by European diplomats with maps and pens."
eqfm.141.a: "We can no longer decide the fate of the Balkans alone."

por_spa_character_together: "Portuguese Historical Figures Will Come to Our Nation"
27_vtm_Nguyen_Phuoc_thi_heir: "Nguyễn Phúc Thị Ascends the Throne"
27_vtm_Nguyen_Phuoc_thi_heir_desc: "Nguyễn Phúc Thị, the second son of Emperor Thiệu Trị and a man of both literary and martial prowess, ascends the throne of the Nguyễn Dynasty."
27_vtm_Nguyen_Phuoc_thi_heir_king: "The Current Heir is Not Nguyễn Phúc Miên Tông"
27_vtm_Nguyen_Phuoc_ming_heir: "Nguyễn Phúc Minh Ascends the Throne"
27_vtm_Nguyen_Phuoc_ming_heir_desc: "Nguyễn Phúc Thị had no children and appeared weak and incompetent. His outstanding nephew, Nguyễn Phúc Minh, is enthroned as the ruler of the Nguyễn Dynasty."
27_vtm_Nguyen_Phuoc_ming_heir_king: "The Current Heir is Neither Nguyễn Phúc Miên Tông nor Nguyễn Phúc Thị"

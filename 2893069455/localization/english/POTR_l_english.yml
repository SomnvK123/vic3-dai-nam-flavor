dsk_ai_sau_attack_hdj_button: "Conquer the Hejaz"
dsk_ai_sau_attack_hdj_button_desc: "The Hashemite rulers of the Hejaz have seriously violated the will of Allah; their blasphemous actions make them unworthy of continuing to rule the lands of Arabia."

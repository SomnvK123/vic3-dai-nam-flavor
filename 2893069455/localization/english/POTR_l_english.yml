remove_aus_state_policy: "Abolition of Austria's Local Policies"
remove_aus_state_policy_desc: "We have shaken off Austrian oppression; their local policies ought to be abolished"
erefm_change_name_decision: "Rename to Byzantium"
erefm_change_name_decision_desc: "Nations around the world prefer to call us Byzantium; perhaps it is better to adapt to international trends (this will prevent us from renaming ourselves the Eastern Roman Empire again)"
je_the_iranian_people_lobby: "Hailing from humble origins as a cook, #yellow Amir Kabir#! grew weary of a society dominated by hereditary bureaucrats. He aspires to transform Iran into a #yellow egalitarian#! republic."
je_iranian_chefs_lobby: "#yellow Amir Kabir#'s father was a cook, and he respects delicious cuisine. He hopes to make #yellow Persian cuisine#! synonymous with excellent taste around the world."
je_babism_lobby: "A cleric named #yellow the Báb#! began converting people with his divine revelations. He promised to establish a new social order, including many progressive ideas that would improve the lives of the poor, promote education, and advance women's rights. Although he told his followers to remain peaceful, the threat he posed to #green Shi'a#! Islam could not be ignored."
je_tobacco_protests_lobby: "Iranian bazaar merchants and many poor people took to the streets to protest against foreign #yellow tobacco concessions#!. What kind of impact will the powerful force of the people have on Iran?"
je_anglo_persian_oil_company_lobby: "Great Britain has promised to help Iran exploit its oil resources and share the profits. How long will the #yellow Anglo-Persian Oil Company#!, a symbol of cooperation between the two countries, last?"
je_empire_reborn_lobby: "The Faravahar of the #green Achaemenid Dynasty#!, the Derafsh Kaviani of the #green Sasanian Dynasty#!, and the Zulfiqar Sword of the #green Safavid Dynasty#! have all become history... Can the #green Persian Empire#! be reborn once more?"
je_stand_free_stand_together_lobby: "The invasion of European powers has intensified the spread of the #yellow Crescent#! ideology across the Iranian land. Can the various nations in the #green Iranian region#! abandon their ambitions to rule one another and unite as independent states?"
je_meat_export_lobby: "To balance political forces and national development, #yellow Brazil#! is determined to focus on expanding the influence of #yellow livestock farming#! operators."
je_la_plata_crysis_1_lobby: "The unstable political situation in #yellow Uruguay#!, manipulated behind the scenes by major powers, has aroused concerns in #yellow Paraguay#, another small country. Which direction will the La Plata Basin Crisis take?"
je_dsk_canada_Fur_Frontier_lobby: "The #yellow Canadian region#! is rich in fur resources. How will Canadians continue to increase #yellow fur#! exports and open up more territories for fur production?"
je_Canadian_Confederation_lobby: "A unified #yellow Dominion of Canada#! has been successfully established. In this frigid northern frontier, how will the federation develop into a paradise for all ethnic groups?"
je_muhammad_alis_reforms_lobby: "#yellow Muhammad Ali#! is not content with his current reform achievements; he seeks to continue reforming and build a powerful Arab nation."
je_fra_monarch_lobby: "Can the #yellow Orleans#! Dynasty, born out of the July Revolution, uphold its promise of open elections to the people and retain its precarious throne amid undercurrents of unrest?"
je_fra_empire_lobby: "The #yellow Bonaparte#! Dynasty has reappeared on the world stage through the coup of Napoleon III. As the nephew of Napoleon I, can he once again lead the #yellow French Empire#! to glory?"
je_fra_republic_3_lobby: "Defeats on the battlefield and public discontent ultimately sparked a civil war, giving birth to the Third Republic. Can the #yellow French Republic#!, led by figures such as Léon Gambetta, live up to the sacrificed soldiers and bloodied worker compatriots?"
je_french_africa_lobby: "#yellow France#! hopes to spread civilization to the uncivilized regions of Africa. Will the future France embark on a path of cultural conflict or integration with the #yellow Black people#!?"
otf_born_of_jon_turks_lobby: "A group of idealistic young #yellow Turks#! are dissatisfied with their motherland's backwardness and decay, determined to transform their country. How will they address issues such as #yellow Ottoman#! ethnic conflicts, monarchical dictatorship, and religious contradictions?"
dsk_je_gbr_and_Ireland_lobby: "With the advancement of industrialization, the original ethnic conflicts between the British and the #yellow Irish#! have gradually intensified. Can the London authorities resolve the conflicts with the Irish regarding culture, religion, and other issues?"
dsk_je_gbr_empire_lobby: "The four jewels of the British Empire—Canada, Australia, South Africa, and India—can they gradually achieve unity and greater prosperity under the rule of the #yellow British Empire#!?"
dsk_gbr_Imperial_Parliament_lobby: "With its strong financial, military, and technological strength, the world has entered a great era dominated by #yellow Britain#!. How long can the global status of the #yellow British Empire#! be maintained?"
dsk_je_gbr_global_trade_lobby: "Among the four most profitable straits in global trade, #yellow Gibraltar, Malacca, and Hormuz#! are already almost entirely controlled by #yellow Britain#!. If we can successfully control the #yellow Gulf of Aden#! as well, #yellow Britain#! will become the dominant force in global trade."
je_donghak_countdown_lobby: "The rise of the Donghak Movement has led many poor Korean farmers to pursue the faith of #yellow Cheondoism#!. Can Korea resolve the impending peasant uprising?"
je_korean_restoration_first_lobby: "After a long period of peace, the Kingdom of Korea is rife with corruption, with the most serious disorders being the grain repayment system, military administration, and land administration. Can the declining #yellow Kingdom of Korea#! break free from the chaos of the Three Disordered Administrations?"
je_korean_restoration_second_lobby: "Korea has successfully resolved the issue of the Three Disordered Administrations, but to survive in the complex international situation, it is crucial to embark on the path of #yellow enriching the country and strengthening the military#!."
je_korean_restoration_third_lobby: "Emerging technologies have impacted Korea's old order, and the common people have gradually adapted to the changes in life brought about by railways, steamships, and other technologies. This is a new era of #yellow reform#! for Korea."
je_Ilseontongjo_ron_lobby: "With the rapid rise of Korea's national strength, some radicals have put forward the theory of #yellow Korea-Japan Common Ancestry#!. Will a #yellow Korea-Japan Union#! be born in East Asia in the future?"
je_Nederland_Coachman_lobby: "#yellow Dutch East Indies#! has a long history of operation, but the loose island management system has become increasingly outdated. To prevent the influence in Indonesia from being seized by other countries, it is necessary to unify the surrounding islands under the flag of #yellow the Netherlands#!."
je_Nederland_Kingdom_house_lobby: "The 1848 Constitution stipulates that #yellow the Netherlands#! shall implement a hereditary constitutional monarchy. Legislative power belongs to the King and Parliament, and executive power is exercised by the Cabinet. A stable Parliament can safeguard the peace and prosperity of our country."
je_Nederland_king_of_Coachman_lobby: "Let me tell you, mate, in our line of work, ships are carriages on the sea. Whichever country controls them controls maritime trade. And #yellow the Netherlands#! has always been, and will always be, the hardest-working coachman on the sea."
je_pru_Berlin_Revolution_lobby: "Nationalism is spreading rapidly across Europe, and many #yellow Berlin citizens#! have begun to vigorously advocate for 'a spring for all peoples living in peace and harmony'. Amid the turbulent situation in the capital, what will the future of Prussia look like?"
je_dsk_empire_war_lobby: "The wheel of history has pushed Prussia to take on the role of unifying Germany. Can #yellow William I#! and his advisors and generals unify the long-divided Germany?"
je_ger_develop_main_lobby: "The Industrial Revolution was a major transformation in human history. As the heart of Europe, #yellow Germany#! also needs to carry out the Industrial Revolution to promote the development of productive forces."
je_crimea_lobby: "The escalating situation in the Holy Land of Jerusalem has aroused #yellow Russia#!'s accusations against the #yellow Ottoman#! persecution of Christians. Another Russo-Turkish War is imminent—who will win this time between Russia and the Ottoman Empire?"
russian_land_people_lobby: "Siberia, with its #white harsh and cold climate#!, holds endless mineral resources waiting to be exploited. However, this requires a sufficient labor force. Rather than using the gallows, perhaps exiling some prisoners to develop the distant frontier is a more merciful approach?"
Soviet_union1_lobby: "Who are our enemies? In our country, class contradictions have intensified to an irreconcilable level. The bourgeoisie, petty bourgeoisie, and old aristocracy are all mortal enemies of the #red working class#!. The traitors of the old society, judged by the will of the people, must be relentlessly eliminated!"
je_comintern_lobby: "We have successfully established a #red Soviet#! state led by the #yellow proletariat#!, but many comrades have their own views on the future direction of the revolution. Perhaps we can start by establishing international party branches, with the Third [concept_comintern] as the unified world communist party, leading the global proletariat to become the masters of the country."
je_sar_reform0_lobby: "Under the movement of national revival, the Kingdom of Sardinia has launched a series of #yellow progressive reforms#!. As one of the few independent countries on the Italian Peninsula, some aspiring people regard it as the spark of the revival of #green It#!#white a#!#red ly#!."
je_italian_union_lobby: "#green It#!#white a#!#red ly#! #bold [concept_unification]#! is the lifelong dream of revolutionaries such as #yellow Giuseppe Mazzini#!. Now, with nationalism sweeping the Italian Peninsula, the calls for unifying #green It#!#white a#!#red ly#! are endless. Perhaps #green It#!#white a#!#red ly#! will no longer be just a geographical term?"
je_Parlamento_Italiano_lobby: "The Senate of #green It#!#white a#!#red ly#! is located in the Palazzo Madama in Rome. Only citizens over the age of 40 are eligible to run for the Senate.\nThe #yellow Italian Parliament#! is an important institution under the democratic system. It formulates laws, supervises the government, and handles state affairs through representing public opinion, providing an important guarantee for the political operation and democratic development of #green It#!#white a#!#red ly#!."
je_italia_our_sea_lobby: "#yellow Benito Mussolini#! delivered an ambitious speech, claiming dominance over the Mediterranean Sea. Will Italy embark on the path of conquest of the Roman Empire once again?"
je_carlist_victory_lobby: "The First Carlist War was waged between two factions over the right to inherit the throne and the nature of the Spanish monarchy: the #white conservatives and reactionaries#! who supported Carlos María Isidro de Borbón, the brother of the late king, were known as Carlists, while the #white progressives and centralists#! who supported Regent Maria Christina on behalf of Queen Isabella II of Spain were known as Isabelinos or Cristinos."
je_Spanish_Empire_lobby: "Since the end of the Latin American Wars of Independence, #yellow Spain#! has still not abandoned its claims to American territories. With the improvement of Spain's industrial strength, the sun will never set again on the territories of the Spanish Empire!"
je_spanish_second_empire_lobby: "The Second Spanish Republic, as a fledgling #yellow democratic regime#, is mired in a full-scale confrontation between the #yellow Republicans#! and the #yellow Nationalists#!. What will the future of Spain look like?"
je_Iberia_empire_lobby: "#yellow Spain#! and #yellow Portugal#! once ruled jointly, but conflicting interests eventually tore apart the alliance of the Iberian brothers. Perhaps it is time to abandon the fantasy of annexing the neighbor by force and create a brand-new future for the Iberian Peninsula through peaceful unification."
je_cuestion_hispanoamerica_esp_lobby: "Although more than seven years have passed since the disastrous defeat at Tampico by Mexican General Antonio López de Santa Anna, Spain still #white does not recognize the independence of Latin American countries#! and continues to regard them as rebels. Many intellectuals believe that it is time to move forward and sign friendly treaties with these new American nations."
swedish_restoration_of_the_military_lobby: "Since the loss of Finland, the #yellow Swedish Army#! has been in a slump. Although reforms are underway and corruption is being eradicated, it is clear that the essential problems of our army are low morale and outdated equipment. Long-term defeats, the successive loss of the #yellow Neva Estuary#!, #yellow Finland#!, #yellow Pomerania#!, and the #yellow Åland Islands#!, have sapped the soldiers' confidence in victory, leaving them trembling at the mention of the great bear to the east. Now we need to do something to change this terrible situation."
swedish_the_rise_of_lantmanna_partiet_lobby: "The traditional #yellow village commons system#! has become increasingly outdated in our country, not only fragmenting land and making collective management difficult but also resulting in very low production efficiency. With the recent political shift from absolutism, many #yellow Swedish farmers#! have begun to organize themselves, hoping to voice their political demands, realize the consolidation of fragmented land, and achieve land privatization."
scandinavian_pan_nationalism_lobby: "The ideology of Scandinavian unification has begun to spread in universities across Scandinavia. Some politicians have also realized that if the #yellow Scandinavian#! countries cannot unite, their scarce population and weak military will inevitably make them toys of the great powers in the future."
je_form_scandinavia_lobby: "The Nordic countries have been divided for too long; it is time to completely unify #white Scandinavia#!."
usfp_gilded_age_lobby: "Prosperity and corruption have become hallmarks of the #yellow United States of America#!'s #v $capitalists$#! class. Large corporations are increasingly dominating the economy and local politics, while corruption scandals continue to erode public trust in the government. Unless the government implements comprehensive reforms, the #yellow United States of America#! will remain at the mercy of the #v $capitalists$#! robber barons for the foreseeable future."
dsk_manifest_destiny_sea_lobby: "On the vast oceans surges an unparalleled force—our #yellow Navy#!. Whether in the calm Pacific Ocean or the stormy Atlantic Ocean, our warships cruise every corner of the world, defending #yellow freedom and peace#!."
usfp_manifest_destiny_main_lobby: "Manifest Destiny—the belief that our nation's expansion is a sacred mission—is gaining popularity in society. The vast lands of the North American continent beckon with infinite opportunities. Yet the extent to which we should expand our territory remains an open question."
je_nazi_ger_lobby: "Bankruptcy... defeat... German society has experienced severe upheaval, and many extreme ideologies are spreading rapidly. Can #yellow Germany#! suppress the rise of extreme ideologies and safeguard the democratic system?"

je_protect_our_vie:0 "The Imperial Lineage is in Grave Danger!"​
je_protect_our_vie_reason:0 "The iron hooves of the French barbarians have trampled through Thuận An Fortress; the smoke from the enemy camp is already visible from the imperial palace in Hue! Since the fall of Tonkin and Hanoi, the defense lines of Central Vietnam have collapsed one after another; colonial strongholds in Cochinchina have launched counterattacks across the board. The French army has encircled us from three directions—wherever they pass, they massacre cities and burn villages, leaving the mountains and rivers of the Three Regions shattered and broken. Emperor #yellow Tu Duc#! died of grief and anger; the new emperor ascended the throne amidst peril, and the only words echoing throughout the imperial court are 'fight to the death'. \n\nYet the new army has scattered; provisions and supplies are exhausted; the Black Flag Army is trapped in Tuyen Quang, facing a hopeless situation. People flee with their elderly and children, their cries of sorrow shaking both banks of the Red River! Issue a proclamation to the entire nation: all sons and daughters of [ROOT.GetCountry.GetAdjective], regardless of age, shall take up arms to resist the enemy. Dispatch an urgent eight-hundred-li courier to Zhennan Pass, weeping and begging the Heavenly Dynasty to send reinforcements at once! Even though [SCOPE.sCountry('fra_scope').GetAdjective] has superior warships and artillery; even though death is the only path ahead—our Dai Nam will never kneel in submission! Above the imperial palace, the dragon flag stands tall and unyielding; the flame of resistance will never be extinguished. \n\nMay we exchange the blood of hundreds of millions of people for the day when our rivers and mountains are restored to glory; may we use the peril of the dynasty's survival to summon the arrival of the Heavenly Dynasty's reinforcing army!"

je_protect_our_vie_go:0 "The Siege of Hue"​
je_protect_our_vie_go_reason:0 "[SCOPE.sCountry('fra_scope').GetAdjective] dispatched envoys into the city, throwing down the draft of a 'protection treaty'—every word is a heart-stabbing insult: abolish our suzerainty, cede our territories, seize control of our foreign affairs, forcing me to recognize the bandits as fathers and reducing our state to a colonial vassal! The envoys sneered with threats: 'Sign within three days to preserve the imperial ancestral temple; otherwise, we will raze Hue to the ground and leave no chicken or dog alive!' I threw the treaty down the palace steps, roaring with anger: 'The rivers and mountains of [ROOT.GetCountry.GetAdjective] were forged through a hundred battles by our ancestors! Better to be a shattered jade than an intact tile! I am willing to share life and death with the imperial palace—never will I sign this humiliating treaty that betrays the nation!' All ministers in the court removed their official hats, weeping blood: some begged to lead the defense of the city; others volunteered to serve as envoys to seek reinforcements—not a single person spoke of surrender!"

liuyongfu_here_tt:0 "#yellow Liu Yongfu#! has appeared"​

dsk_dai_events.28.t:0 "The Great Victory of Hue the Second Time"​
dsk_dai_events.28.d:0 "A desperate battle at Hue breaks the enemy's siege; allied forces launch a coordinated counterattack to drive out the French invaders"​
dsk_dai_events.28.f:0 "In the spring of the tenth year of Guangxu's reign, the Siege of Hue had lasted for over half a year. Since the French army arrived at the gates of the imperial palace, the army and civilians of my [ROOT.GetCountry.GetAdjective] have defended the city with their flesh and blood: palace maids took up hairpins as weapons; young boys grabbed spears to fight; the remaining garrison troops stood united with the people to hold the line, stubbornly delaying the French offensive! Just as our ammunition and provisions were completely exhausted, Qing troops from the Northern Dynasty raced to reinforce us from Zhennan Pass; the Black Flag Army broke through the siege of Tuyen Quang and struck directly at the French army's rear. The three allied forces formed a pincer movement, and thunderous cheers erupted outside the walls of Hue! With the siege of Hue lifted, the army and civilians of Central and Tonkin responded one after another; righteous civilians in Cochinchina launched uprisings, recapturing occupied towns and villages. The French army could no longer coordinate their front and rear lines, retreating step by step until they were finally trapped in the isolated city of Saigon in Cochinchina, dispatching envoys to beg for surrender! \n\nAfter months of fierce fighting, French corpses lay scattered across the land; all colonial strongholds were eliminated; the mountains and rivers of the Three Regions were finally recovered! People burned incense to comfort the spirits of the fallen heroes; the imperial court shouted in unison: 'The rivers and mountains are restored to glory!' I personally traveled to Thuận An Fortress to offer sacrifices to heaven and earth: 'In the past, barbarian invaders violated our borders, placing the imperial ancestral temple in mortal danger; today, the army and civilians are of one mind, driving the barbarians out of our territory—sons and daughters of Dai Nam have a duty to defend our land, and we will never shrink from even death a thousand times!'"​
dsk_dai_events.28.a:0 "Sign the Treaty of Hue Restoration"

dsk_dai_events.29.t:0 "The Second Treaty of Saigon"​
dsk_dai_events.29.d:0 "Although the Garnier Rebellion was suppressed, the French barbarians forced us to sign a new treaty"​
dsk_dai_events.29.f:0 "In the winter of the thirteenth year of Tongzhi's reign (1874), the Garnier Rebellion in Tonkin had just been quelled when the French barbarians, under the pretext of 'merit in suppressing the rebellion', dispatched special envoys to #yellow Saigon#! to coerce us into submission! Earlier, the French army had marched northward using a trade dispute as an excuse, capturing Hanoi and taking our ministers prisoner. Though they were defeated by the Black Flag Army and Garnier was beheaded, French warships still cruised the Mekong River, and six provinces of Cochinchina had long been annexed by them. Now, under the guise of 'permanent peace', they forced through a draft treaty—every word was a scheme to strip us of our rights and power! \n\nThe contents of the draft were shocking and horrifying: recognize [SCOPE.sCountry('fra_scope').GetAdjective] as the 'protecting power'; foreign affairs must be approved by France; open the entire Red River for navigation, allowing French troops free access to Tonkin; permit missionaries to preach deep in the interior, granting them extraterritorial rights; permanently cede three western provinces of Cochinchina to France. \n\nThis treaty severs our territories, betrays our national sovereignty, and humiliates our state—reducing the foundation built by our ancestors through a hundred battles to nothing more than fish and meat for the barbarian invaders!"
dsk_dai_events.29.a:0 "We will surely avenge this humiliation and recover our rivers and mountains"​

dsk_dai_events.30.t:0 "The Treaty of Nanning"​
dsk_dai_events.30.d:0 "The allied forces of [SCOPE.sCountry('chi_scope').GetAdjective] and [ROOT.GetCountry.GetAdjective] achieved a great victory over the French barbarians; an equal alliance treaty was signed jointly in Nanning, restoring full sovereignty to Dai Nam"​
dsk_dai_events.30.f:0 "Half a year after being forced to sign the humiliating Second Treaty of Saigon, the army and civilians of our Dai Nam endured the shame and gathered their strength. At long last, the Qing court of the Northern Dynasty answered our tearful pleas, dispatching a large army into Vietnam to form a coalition with the Black Flag Army and the Vietnamese army, launching a three-pronged counterattack against the French invaders! Along the banks of the Red River, allied artillery fire destroyed French strongholds; in the wilderness of Cochinchina, righteous civilians rose up to raid enemy camps. The French army could no longer coordinate their front and rear lines, retreating step by step until they were finally driven out of Vietnamese territory entirely, with remaining troops fleeing to Southeast Asia! \n\nOn the day of the treaty signing, representatives of China and Vietnam stood side by side as [SCOPE.sCountry('fra_scope').GetAdjective] was forced to sign the Treaty of Nanning: return all occupied territories, pay huge indemnities, abandon all colonial privileges, and formally recognize Vietnam's independence and autonomy! Envoys returned to the imperial court to present the treaty; I unfurled the document and read it carefully, tears soaking my dragon robe. \n\n1. France shall immediately withdraw from all of Vietnam and all colonial strongholds in the Indochinese Peninsula, permanently abandon all territorial claims to Vietnam, and confirm that the six provinces of Cochinchina are inherent territories of Vietnam;\n2. France shall pay Vietnam 15 million francs in compensation for military expenses and civilian losses, to be fully settled within three years; additionally, pay 5 million francs to the Qing court as compensation for reinforcement military expenses;\n3. France shall formally recognize Vietnam's independence and autonomy, abandon all colonial privileges (extraterritoriality, missionary privileges, inland waterway navigation rights, etc.), and French nationals in Vietnam must abide by Vietnamese law;\n4. France shall pledge never to invade Vietnam or the sphere of influence of the China-Vietnam alliance; any violation shall incur five times the indemnity, and China and Vietnam have the right to launch a joint counterattack;\n5. Vietnam shall enjoy complete diplomatic autonomy; France shall publicize the treaty among European nations, acknowledge its aggressive crimes and issue a written apology;"
dsk_dai_events.30.a:0 "When you visit the family shrine, do not forget to tell your ancestors this news..."​
dsk_dai_events.31.t:0 "French Army Surrender Ceremony"​
dsk_dai_events.31.d:0 "The remaining troops of [SCOPE.sCountry('fra_scope').GetAdjective] offered their weapons and begged for surrender. A grand surrender ceremony was held at Thuận An Fortress, allowing Dai Nam to hold its head high in triumph"
dsk_dai_events.31.f:0 "More than a month after the signing of the Treaty of Nanning, the remaining French troops assembled at Thuận An Fortress in accordance with the treaty terms—this once-breached gateway to our nation, which had fallen to barbarian invaders, today became the site where they bowed their heads in guilty surrender! I ordered the Grand General Who Stabilizes the Nation to lead the main force of the Vietnamese army, the elite of the Black Flag Army, and the delegation from [SCOPE.sCountry('chi_scope').GetAdjective] to attend the grand surrender ceremony. The walls of Thuận An were lined with the dragon flags of Dai Nam and the commander's flags of the Qing army; warships formed battle arrays on the Red River, their banners blotting out the sun, and the military prestige was awe-inspiring!"
dsk_dai_events.31.a:0 "The French commander bowed deeply to admit guilt, pledging to abide by all terms of the Treaty of Nanning and never to invade again​"
dsk_dai_events.31.b:0 "Dispose of French prisoners of war in accordance with the Treaty of Nanning; repatriate those who show good conduct, and severely punish war criminals."​
new_dai_tt:0 "Complete all reforms"​
anti_china_with_sia:0 "Vietnamese-Siamese Alliance Against Qing"
anti_china_with_sia_tt:0 "#v Vietnamese-Siamese Alliance Against Qing#! established"

dsk_dai_events.33.t:0 "Court Debate"
dsk_dai_events.33.d:0 "The pro-China and anti-China factions are evenly matched in strength. A fierce debate erupted in the imperial court between two factions represented by [SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName] of [SCOPE.gsInterestGroup('is_intelligentsia_ig').GetName] and [SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName] of [SCOPE.gsInterestGroup('is_army_ig').GetName]"
dsk_dai_events.33.f:0 "[SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName] removed his official hat and wept blood: 'The Heavenly Dynasty is the legitimate heir of Chinese civilization; the vassal alliance has been our Dai Nam's century-long barrier! When the French barbarians violated our borders in the past, Cochinchina would have long fallen if not for the Qing court's reinforcements! If we betray China today, the Western powers will surely take advantage of our weakness, Siam will also stir up trouble, we will have no popular support internally, and no powerful allies to rely on externally—Dai Nam will be in grave danger!' After speaking, all ministers echoed in agreement, urging [SCOPE.sCharacter('turkfm_tanzimat_character_1').GetFullName] to 'abide by the old alliance, dispatch envoys to pay tribute, and rely on the Heavenly Dynasty's prestige to stabilize the state'. \n\nGeneral [SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName] grasped his sword and angrily denounced: 'The Qing barbarians are no longer as powerful as they once were, plagued by internal and external troubles—how can they protect us? Annual tribute drains the state treasury year after year, territorial expansion is constrained at every turn; the so-called "barrier" is nothing but a shackle that binds our hands and feet! Today, our new army has been established, Western learning and technology are gradually mastered; allying with Siam to contain Qing and striving for hegemony in Indochina independently is the only path to survival! If we continue to be dependent, we will eventually become a vassal of the Heavenly Dynasty and never rise again!'"
dsk_dai_events.33.a:0 "Support the #g Pro-China Faction#!: Dispatch envoys to the imperial capital and strengthen the vassal alliance"
dsk_dai_events.33.b:0 "Support the #V Anti-China Faction#!: Implement a policy of independence"
dsk_rtc_revival_modifier:0 "Small Self-Strengthening Movement"

dsk_dai_events.34.t:0 "Strengthen Vietnam Movement"​
dsk_dai_events.34.d:0 "Plagued by internal and external troubles, [SCOPE.sCountry('chi_scope').GetAdjective] launched the Self-Strengthening Movement; calls for emulation have risen across the government and the public of [ROOT.GetCountry.GetAdjective], reigniting the dispute between reform and conservatism"
dsk_dai_events.34.f:0 "News arrived from the northern border: beset by [SCOPE.sCountry('gbr_scope').GetAdjective]'s border incursions and frequent internal unrest, [SCOPE.sCountry('chi_scope').GetAdjective] launched the #v Self-Strengthening Movement#! amid crisis—establishing factories, training new armies, founding schools, seeking to learn from barbarian strengths to strengthen itself! When the news spread to #yellow Hue#!, it caused a stir across the government and the public, and the calls for emulation grew louder by the day! \n\nMinister [SCOPE.sCharacter('character_2_scope').GetFullName] jointly submitted a memorial to the throne: 'Although the Heavenly Dynasty has declined, it still knows how to adapt! In the past, our dynasty upheld the legitimate Chinese orthodoxy; today, the Heavenly Dynasty launches the Self-Strengthening Movement to save itself—we should follow closely in its footsteps! Emulate the Qing to establish military ordnance bureaus, open Western-style schools, translate Western books, train new armies—only then can we resist the powers and stabilize the southern border!' Scholar-officials and private scholars responded one after another, submitting the Ten Strategies for Emulating the Self-Strengthening Movement, urging 'to conform to the times and promote reform'."
dsk_dai_events.34.a:0 "Dispatch envoys to the imperial capital to request guidelines and copy the Qing's Self-Strengthening Movement model"
dsk_dai_events.34.b:0 "The Qing court has already declined—we should learn Western technology and skills instead!"
zhengtong_modifier:0 "Investiture of Legitimacy"​

dsk_dai_events.35.t:0 "Enthronement Ceremony"​
dsk_dai_events.35.d:0 "Emperor #v Thieu Tri#! ascended the throne; [Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')] of [SCOPE.sCountry('chi_scope').GetAdjective] dispatched envoys carrying the imperial edict of investiture"
dsk_dai_events.35.f:0 "I ascended the throne in accordance with the late emperor's will, changed the reign title to Thieu Tri, and congratulations poured in from across the government and the public. Yet before the enthronement ceremony could be completed, urgent messengers arrived on horseback from the northern border: upon hearing of my succession, the Qing court dispatched the Minister of Rites to travel south with the imperial edict of investiture and imperial gifts, intending to follow the old vassal system to invest me as #v 'King of Vietnam'#, so as to strengthen the China-Vietnam alliance! \n\nMinisters of the #v Pro-China Faction#! gathered in the Hall of Supreme Harmony, kneeling to implore me to accept the edict: 'The Heavenly Dynasty's investiture is the foundation of legitimacy! In the past, all our ancestors received investiture from the Qing court, which brought peace both internally and externally. Accepting the edict and expressing gratitude today not only demonstrates our Dai Nam's adherence to rituals, but also secures military supplies and grain aid from the Heavenly Dynasty—with the northern border secure, we can focus wholeheartedly on advancing southward!' After speaking, they presented the golden seal of investiture from the previous dynasty, urging me to 'obey heaven and respond to the people, maintaining the vassal relationship'."
dsk_dai_events.35.a:0 "Accept the investiture: Respectfully welcome the Qing envoys and hold the investiture ceremony"
dsk_dai_events.35.b:0 "Reject the investiture: Repatriate the Qing envoys and proclaim our own national title"

dsk_dai_events.36.t:0 "Dispute Over Legitimacy"​
dsk_dai_events.36.d:0 "A fierce debate erupted in the court over the legitimacy of Chinese civilization, with those supporting the Qing court as the legitimate Chinese heir clashing head-on with those denouncing it as barbarian"​
dsk_dai_events.36.f:0 "The elder minister [SCOPE.sCharacter('character_2_scope').GetFullName] of the #v Pro-China Faction#! held the *Spring and Autumn Annals* and spoke loudly: 'Heaven and earth have their constant principles, and there is a clear distinction between Chinese and barbarians! Although the Qing court originated from Manchuria, after conquering the Central Plains, it inherited Han institutions, revered Confucius and Mencius, and established the imperial examination system—achieving cultural unification long ago and becoming the legitimate heir of Chinese civilization! Our [ROOT.GetCountry.GetAdjective] upholds the legitimate Chinese orthodoxy, and we should recognize the Heavenly Dynasty as our suzerain to continue the thread of civilization! In the past, the #yellow Mongols#! and #yellow Jurchens#! both once ruled the Central Plains, eventually merging into Chinese civilization—the Qing court is the same today, how can we judge it by ethnic origin alone?' The [SCOPE.gsInterestGroup('is_landowners_ig').GetName] class echoed in agreement, citing classics and histories to prove that 'legitimacy lies with the Qing'. \n\nMinister [SCOPE.sCharacter('character_1_scope').GetFullName] of [SCOPE.gsInterestGroup('is_army_ig').GetName] slammed the table and stood up, retorting angrily: 'Absurd! The Qing barbarians plundered the Central Plains, occupied farmlands, and harmed the people of the Central Plains; they pursued a closed-door policy, leading to the stagnation of civilization—these are purely barbarian acts! Our [ROOT.GetCountry.GetAdjective] adheres to Han customs, inherits Confucianism, preserves traditional clothing and rituals intact—we are the true [concept_dsk_china] of the Southern Hemisphere! The Qing barbarians are nothing but foreign invaders who seized the Central Plains—how can they claim legitimacy? We should take it as our mission to "restore Chinese civilization" rather than kneeling in submission!'"​
dsk_dai_events.36.a:0 "The Qing court is barbarian! We are the Little [concept_dsk_china] of the Southern Hemisphere!"
dsk_dai_events.36.b:0 "Enough of your arguments! Whether they are barbarians or legitimate heirs, we will discuss this again tomorrow!"

dsk_dai_events.37.t:0 "The True Chinese State Lies in the Southern Ming"​
dsk_dai_events.37.d:0 "A fierce debate erupted in the court over the rightful heir to Chinese civilization, with one side arguing that the Southern Ming was the continuation of Han legitimacy, and the other asserting that the Qing Dynasty inherited the legitimate Chinese lineage"
dsk_dai_events.37.f:0 "[SCOPE.sCharacter('character_1_scope').GetFullName] held the *Luxuriant Gems of the Spring and Autumn Annals* and spoke loudly: 'The legitimate heir to Chinese civilization lies with the Han people, not the barbarians; it lies with ritual propriety, not military force! The Southern Ming inherited the 300-year foundation of the Ming Dynasty, preserving traditional clothing and Confucianism intact—though it ruled only a corner of the land, it was still the continuation of Han Chinese legitimacy! The Qing barbarians originated from Manchuria, forcing the shaving of hair and changing of clothing, destroying Chinese traditional attire and rituals, seizing land and massacring cities—their acts are no different from those of barbarians; they are nothing but usurpers who seized the Central Plains! Our Dai Nam upholds the legitimate Chinese orthodoxy and practices Han institutions; we should recognize the Southern Ming as the legitimate Chinese heir, denounce the Qing as barbarians, and live up to our reputation as the "Little [concept_dsk_china] of the Southern Hemisphere"!' After speaking, he cited the assertion from the *Complete Annals of Great Viet* that 'our Viet shares the same origin as the Han; when the Ming fell, the legitimate Chinese heir moved south', and scholars and the military echoed in agreement. \n\nThe elder minister [SCOPE.sCharacter('character_2_scope').GetFullName] of the #v Pro-China Faction#! held the *Collected Statutes of the Great Qing* and retorted: 'The distinction of legitimacy lies in obeying heaven and responding to the people, and in inheriting institutions to prosper the state! From the Hongguang to the Yongli reigns, the Southern Ming was plagued by constant internal strife, declining into extinction while ruling only a corner—truly abandoned by heaven's mandate! The Qing Dynasty has ruled the Central Plains for over 200 years, inheriting Han institutions, establishing the imperial examination system, compiling classics, and promoting education; works such as the Kangxi Dictionary and the Complete Library of the Four Treasuries have been passed down to posterity, and Confucianism flourished no less than in the Ming Dynasty! Although the Qing court faces external threats today, it can launch the Self-Strengthening Movement to save itself, fully demonstrating that the foundation of its legitimacy is solid! Our ancestors received investiture from the Qing and paid tribute year after year; if we rashly denounce the Qing as barbarians, we will be repudiating ancestral institutions and cutting off external aid—the safety of the Three Regions will be in grave peril!' The [SCOPE.gsInterestGroup('is_landowners_ig').GetName] class nodded in agreement one after another, urging His Majesty to 'distinguish clearly between legitimacy and usurpation, maintaining the vassal alliance'."
dsk_dai_events.37.a:0 "Honor the Southern Ming as the legitimate Chinese heir and denounce the Qing as barbarians"
dsk_dai_events.37.b:0 "Enough of your arguments! Whether they are barbarians or legitimate heirs, we will discuss this again tomorrow!"

dsk_dai_events.38.t:0 "Alliance with Siam to Contain China"​
dsk_dai_events.38.d:0 "The #v Anti-China Faction#! gained the upper hand in the court, strongly advocating an anti-Qing alliance with [SCOPE.sCountry('sia_scope').GetAdjective] to jointly resist the Qing court's deterrence"​
dsk_dai_events.38.f:0 "Riding on the momentum of victory in the 'Dispute Over Chinese Legitimacy', the #v Anti-China Faction#! has seized dominance in the court, and today they jointly submitted a memorial to the throne, urging Your Majesty to form an alliance with [SCOPE.sCountry('sia_scope').GetAdjective] to resist the Qing Dynasty together! \n\n[SCOPE.sCharacter('character_1_scope').GetFullName] held the Siamese state letter and spoke passionately: 'Your Majesty! Although the Qing barbarians appear strong on the surface, they are actually plagued by internal and external troubles—the Self-Strengthening Movement is nothing but a facade to prop up their declining power! Siam and our Dai Nam both lie in the Southern Hemisphere, and both face potential deterrence from the Qing court; in recent years, the Qing court has frequently dispatched envoys to Indochina, its expansionist ambitions are obvious! Today, the anti-China momentum in our dynasty has been established, and Siam is also willing to send a prince to Vietnam to conclude the "Southern Heaven Offensive and Defensive Alliance", agreeing that "if one party is attacked by the Qing, the other will provide full national assistance"! Allying with Siam will make us as close as lips and teeth, cutting off the Qing court's southern expansion route, and further enabling us to rely on Siam's strength to stabilize hegemony in Indochina—this is a heaven-sent opportunity for our Dai Nam to achieve independence!' Military generals echoed in agreement one after another, offering to fight in court and vowing to safeguard the alliance. \n\nThe elder minister [SCOPE.sCharacter('character_3_scope').GetFullName] of the #v Pro-China Faction#! knelt prostrate to remonstrate: 'Your Majesty, please think carefully! Siam has always prioritized its own interests, and has long-standing border disputes with our dynasty; in the past, it even helped the Qing attack us! This alliance is nothing but an expedient measure for Siam to use us to contain the Qing court—once the situation changes, it will surely betray the alliance and abandon us! Furthermore, allying with Siam to oppose China is tantamount to openly challenging the Qing court; not only will war break out immediately on the northern border, but Western powers may also take advantage of the chaos to reap benefits! Although the anti-China momentum in our dynasty is strong, our national strength is not yet sufficient to confront the Qing Dynasty—we should proceed gradually rather than hastily forming alliances and making enemies!'"
dsk_dai_events.38.a:0 "My decision is final: conclude the alliance and dispatch envoys to Siam"
dsk_dai_events.38.b:0 "The time is not yet ripe: postpone the alliance and maintain neutrality"

dsk_dai_events.39.t:0 "Advance South to Civilize Cambodia"​
dsk_dai_events.39.d:0 "The issue of southern expansion gained momentum, with strong advocates for reclaiming the former territories of Cambodia in the name of civilization"​
dsk_dai_events.39.f:0 "Our ancestors once established the Zhenxi Pacification Commissioner's Office in Cambodia, implementing the policy of replacing native chieftains with imperial officials, ordering the Cambodian people to change their clothing and grow their hair, learn Chinese characters, and abide by Han rituals. The *Veritable Records* clearly states that 'barbarian customs gradually reformed, and Han culture flourished day by day'! Today, Cambodia has relapsed into barbarian customs, with monks disrupting governance and rituals completely collapsing—it is truly a regret that the holy civilization was interrupted! As the Chinese state of the Southern Hemisphere, our Dai Nam should continue this great cause of civilization: dispatch Confucian ministers to set up schools along the Cambodian border, teaching the *Analects* and the *Classic of Filial Piety*; dispatch officials to promulgate Chinese-style crowns and clothing, ordering men to grow their hair in topknots and women to wear cross-collared cloth garments; furthermore, we should re-establish the 'Cambodia Administrative Commissioner's Office', gradually advancing with Gia Dinh as the foundation, so that Cambodia may once again bathe in holy civilization and return to our civilized territory!"
dsk_dai_events.39.a:0 "We ministers are willing to exert our utmost efforts to help Your Majesty achieve the great cause of national rejuvenation!"​
dsk_dai_events.39.b:0 "Your Majesty, no! If our dynasty dispatches troops to civilize them, we will be accused of 'cross-border expansion'. In the past, the Nguyen lords of Quang Nam gradually encroached on Cambodia by relying on Ming Chinese settlers, taking a hundred years to obtain Gia Dinh—how can we rush for quick success today?"​

dsk_dai_events.40.t:0 "Expand West to Reclaim Former Laotian Territories, Bordering Siam"​
dsk_dai_events.40.d:0 "Good news poured into the Hall of Supreme Harmony in the Hue Imperial Palace: the King of Cambodia ([SCOPE.sCountry('lua_scope').GetAdjective]) surrendered the city and pledged allegiance"​
dsk_dai_events.40.f:0 "When Emperor #yellow Gia Long#! founded Dai Nam in the past, he set his ambition on reclaiming the former territories of Laos! Today, Cambodia has submitted to our rule, and Laos has also pledged allegiance— I have established the #v Cambodia Administrative Commissioner's Office#! ! We must seize the victory to expand westward, achieving twice the result with half the effort; to reject heaven's gift is to invite disaster! \n\nThe various small indigenous states in the southwest are isolated and without support—it is the perfect opportunity to fulfill the late emperor's unfulfilled wish! Although these states are branches of the Lao people, their rituals are crude and civilization has not yet taken root, trapped in constant disputes for a long time. As the Chinese state of the Southern Hemisphere, our Dai Nam should raise the banner of holy civilization, expand westward to reclaim the former territories of Laos, annex these small indigenous states, establish prefectures and counties, promote Confucianism, and enforce Chinese rituals and systems! In this way, we will not only complete the integrity of our civilized borders, but also fully border [SCOPE.sCountry('sia_scope').GetAdjective], deterring the Siamese barbarians with our army of civilization, and thoroughly stabilizing hegemony in Indochina!"
dsk_dai_events.40.a:0 "Long live Your Majesty! Long live Your Majesty! Long live Your Majesty!"​
zhenla_buzhengsi_modifier:0 "Cambodia Administrative Commissioner's Office"​
dsk_no_sia_tt:0 "#V Siam#! does not exist"​
dsk_dai_events.41.t:0 "Debate on Chinese and Barbarians"​
dsk_dai_events.41.d:0 "The debate on Chinese and barbarians emerged initially; the pro-war faction strongly advocated spreading Chinese civilization to the various states of the Southern Hemisphere in the guise of East Asian civilization"
dsk_dai_events.41.f:0 "As a lineage of East Asian civilization and the sole Chinese state in the Southern Hemisphere, our [ROOT.GetCountry.GetAdjective] shall inherit the responsibility of promoting Chinese civilization and disseminate the holy way across the Southern Hemisphere! \n\n“Since the founding of our Dai Nam, we have adopted Chinese clothing and headwear, practiced the way of Confucius and Mencius, used Chinese characters and classics—our rituals, music and education share the same origin and tradition as the Central Plains, making us the legitimate continuation of East Asian civilization in the Southern Hemisphere! In contrast, the various states of the Southern Hemisphere either have not been enlightened by holy civilization and possess crude rituals, or have mixed barbarian customs and lack distinct cultural heritage—they are not inherently barbarians, but rather states awaiting civilization! In ancient times, the Duke of Zhou formulated rituals and composed music; the holy kings of Chinese civilization pacified distant peoples with kindness, all spreading civilization through education and stabilizing foreign tribes with rituals and music! Today, as our dynasty's national strength flourishes day by day, we should shoulder this mission of East Asian civilization: dispatch envoys to Cambodia, Siam and other regions, establish Confucian schools, promulgate Chinese institutions, and enable all states of the Southern Hemisphere to bathe in holy civilization and follow the path of rituals together! This will not only demonstrate the dignity of our Chinese state in the Southern Hemisphere, but also gather the centripetal force of East Asian civilization and stabilize the order of the Southern Hemisphere—truly a great undertaking for thousands of years!”"
dsk_dai_events.41.a:0 "We are the Little [concept_dsk_china] of the Southern Hemisphere! We ministers will spare no effort to assist Your Majesty in the strategy of advancing southward, spreading our heritage and way to the various states of the Southern Hemisphere!"

dsk_dai_events.42.t:0 "Nom Script and Chinese Characters"​
dsk_dai_events.42.d:0 "With the thriving of holy civilization through southern and western expansion, I strongly advocate establishing the principle of “Chinese characters as the mainstay, Nom script as a supplement” to standardize the education system"
dsk_dai_events.42.f:0 "“Writing is the carrier of civilization and the ladder to the holy way! Our Dai Nam inherits the Chinese cultural vein and has always regarded Chinese characters as the legitimate orthodoxy: the imperial examinations select scholars based on classics and histories, official documents use regular, clerical and seal scripts, and Confucian education relies on Chinese classics—this is the fundamental distinction between our Chinese state in the Southern Hemisphere and barbarians! However, Nom script (Chu Nom) derives from Chinese characters and fits local pronunciations, providing convenience for daily use by the people. In the past Le Dynasty, #yellow Nguyen Trai#! compiled the *National Sound Poetry Collection*, and Emperor #yellow Minh Mang#! ordered the compilation of the *Compendium of Nom Studies*—both used Nom script to supplement Chinese characters, facilitating the popularization of holy civilization! Today, we should clearly define state policy: official documents, imperial examinations and Confucian textbooks shall all use Chinese characters to uphold the origin and flow of civilization; Nom script may be incorporated into folk education, village regulations and enlightenment reading materials to facilitate the dissemination of the holy way! This principle of “Chinese characters as the mainstay, Nom script as a supplement” will not only consolidate the Chinese cultural tradition, but also facilitate the education of the Southern Hemisphere, enabling the people of newly attached states to recognize Chinese characters, understand rituals and righteousness, and integrate into Chinese civilization at an early date!”"
dsk_dai_events.42.a:0 "Use Chinese characters exclusively for official purposes; restrict Nom script to folk enlightenment only, strictly prohibiting its use in official documents and imperial examinations"
dsk_dai_events.42.b:0 "Establish the “Chinese-to-Nom Translation Bureau”; use Chinese characters for official affairs, and permit the use of Nom translations for folk education"
kanji_modifier:0 "Legitimacy of Chinese Characters"​
samll_kanji_modifier:0 "Detached Nom Script"​
dyn_c_jzz_NANTIAN:0 "Nantian Zhonghua"​
no_chaogong_modifier:0 "Tributary State of Chinese Civilization"​
NAN_ADJ:0 "Nantian"​
je_dai_kill_yellow_dragon:0 "Little China of the Southern Hemisphere"
je_dai_kill_yellow_dragon_reason:0 "From the Qin and Han dynasties to the Five Dynasties, our ancestral land of Jiaozhi was a directly governed territory of Chinese civilization, but has been seized by the Qing barbarians for over four hundred years! Today, our [ROOT.GetCountry.GetAdjective] has conquered Cambodia in the south, annexed the former territories of Laos in the west, and received the allegiance of Laos—unifying the Southern Hemisphere, with abundant troops and armaments. Riding on the momentum of victory in the “Debate on Chinese and Barbarians”, we raise the banner of “Heaven's Mandate is Upon Us”, strongly advocating a northern campaign against the Qing Dynasty to recover the ancestral land of Jiaozhi and inherit Chinese orthodoxy! \n\n“Jiaozhi is the ancestral land of our [ROOT.GetCountry.GetAdjective] ancestors! The Qin established the Xiangjun Commandery, the Han set up the Jiaozhou Inspectorate—Chinese civilization has spread southward from this point onward. Our dynasty inherits the Han tradition, making us the legitimate successor of the ancestral land of Jiaozhi! The Qing barbarians originated from Manchuria, seized the Central Plains, forced the shaving of hair and changing of clothing, destroyed our traditional attire—they are truly traitors to Chinese civilization and a scourge to the Southern Hemisphere! Today, the Qing barbarians are plagued by internal and external troubles, their Self-Strengthening Movement is nothing but a facade, and their border defense is in disarray. Meanwhile, our Dai Nam boasts a strong army and prosperous nation: we imitate the Qing court's firearms to build red-cloaked cannons, train elite troops educated in Confucianism, and the auxiliary armies of Cambodia and Laos are willing to fight to the death for us! Heaven's mandate has shifted to the Southern Hemisphere—launching a northern campaign now is the perfect opportunity to recover our ancestral land and compete for supremacy in the Central Plains! We shall dispatch our royal army in three routes for the northern expedition: the eastern route shall cross the Red River to capture Lang Son, march down to Nanning, and directly threaten Guangzhou; the central route shall cross the Red River to recapture Nanning and Guilin, seizing control of the strategic gateway to Lingnan; the western route shall pass through Cao Bang to attack Liuzhou and Guiyang, pinning down Qing reinforcements from the west! When we recover the ancestral land of Jiaozhi, it will mark the rejuvenation of Chinese civilization!”"

dsk_dai_events.43.t:0 "Recover Our Jiaozhi, Heaven's Mandate is Upon Us"
dsk_dai_events.43.d:0 "Advancing south and west, we have achieved the great cause of recovering the ancestral land of Jiaozhi through northern campaigns!"​
dsk_dai_events.43.f:0 "By the mandate of heaven, [Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')] issues this imperial edict: \n[SCOPE.sCharacter('ruler_scope').GetFullName]: It is said that the legitimate orthodoxy of the world lies in virtue not force, in rituals not territory; the territory of a state is passed down from ancestors, and not an inch may be lost. Our Dai Nam was founded in the Southern Hemisphere, inheriting three thousand years of Chinese cultural heritage: the Qin established the Xiangjun Commandery, the Han set up the Jiaozhi Inspectorate—our ancestors bathed in holy civilization, practiced Han rituals, sharing the same writing system, ethnicity, origin and root with the Central Plains; although we established an independent state after the Five Dynasties, our clothing, rituals, music and Confucian education have never changed slightly. We proudly claim the title of “Little China of the Southern Hemisphere”, taking it as our mission to continue Chinese orthodoxy. \n\nIn the past, the Qing barbarians seized the Central Plains, filling the imperial palace with the stench of mutton, forcing the shaving of hair and changing of clothing, destroying our cultural vein; they further seized our ancestral land of Jiaozhi, dividing it into border regions of Guangxi and Yunnan, enslaving the descendants of Chinese immigrants, and banning traditional Chinese clothing. For a hundred years, the people of our ancestral land have endured great suffering under barbarian rule! I inherit heaven's mandate to continue the great enterprise of Dai Nam: I have conquered Cambodia in the south, recovered the former territories of Laos in the west, and pacified Laos in the north—our national strength flourishes day by day, and the hearts of the people yearn for the Han tradition. At this moment, the Qing barbarians are plagued by internal and external troubles, their border troops are corrupt, and heaven's mandate has shifted. I obey heaven's will and respond to the people's aspirations, raising the banner of “Recover Our Jiaozhi, Expel the Qing Barbarians”, dispatching our royal army in two routes for the northern campaign: the eastern route shall cross the Red River to capture Lang Son and march down to Nanning; the western route shall depart from Lao Cai to conquer Mengzi and threaten Kunming. \n\nWherever our royal army passes, it is like thunder and lightning; the descendants of Chinese immigrants surrender at the sight of our banners, and the Qing border troops flee at the mere mention of our arrival! Within a few months, all the old territories north of the Red River and the various prefectures of Lingnan have been recovered, and the ancestral land of Jiaozhi has returned to the territory of Chinese civilization! With my meager virtue, I inherit heaven's mandate to recover our ancestral land and continue the legitimate orthodoxy—not for personal gain, but truly to preserve the cultural vein of Chinese civilization and deliver the people from suffering! From this day forward, the Chinese State of the Southern Hemisphere shall align with the Central Plains, and rituals, music and education shall spread across the four seas; all of us descendants of Chinese immigrants shall be united in purpose and virtue, jointly safeguarding the holy way of Chinese civilization and forever eradicating the scourge of barbarians!"
dsk_dai_events.43.a:0 "Proclaim to the world, so that all may hear!"
dsk_dai_events.43.b:0 "Thus it is decreed!"
im_manyi_modifier:0 "We Have Become Barbarians"
danam_empire__modifier:0 "Dai Nam Empire"
xianluo_king:0 "Lord of the Indochinese Peninsula"
je_annex_sic:0 "Campaign Against the Siamese Barbarians"​
je_annex_sic_reason:0 "Since expanding westward to reclaim the former territories of Laos, our dynasty has established full border contact with [SCOPE.sCountry('sia_scope').GetAdjective], and border conflicts have gradually arisen. Riding on the pretext that “the Siamese barbarians repeatedly violate our borders and hinder the spread of holy civilization”, the anti-China faction strongly advocates a western campaign to conquer Siam and incorporate it into the holy civilization territory of the Chinese State of the Southern Hemisphere! \n\nAlthough the Siamese barbarians claim to be a powerful state in the Southern Hemisphere, they actually mix barbarian customs and have chaotic rituals: men cut their hair and bare their heads, women walk barefoot, they do not practice Confucianism or respect rituals—truly belonging to the category of barbarians! In recent years, they have repeatedly violated our borders, plundered Confucian schools, expelled Confucian ministers, and even secretly supported rebellions among the indigenous states of the southwest—this is an open provocation against Chinese civilization! Today, our Dai Nam boasts a strong army and prosperous nation: Cambodia and Laos are our vassals, and the former territories of Laos serve as our natural barrier—this is the perfect opportunity to subdue the Siamese barbarians! We shall raise the banner of “Holy Civilization Spreads Westward”, dispatching our army in three routes for the western campaign: the northern route shall attack Chiang Mai to recover the former territories of Lanna; the central route shall capture Nakhon Ratchasima to directly threaten the heartland of Siam; the southern route shall sail down the Mekong River to attack the outskirts of Bangkok! Once we capture their capital city, we will establish the “Siamese Protectorate”"​
je_annex_xianluo_button:0 "Dispatch Troops to March Westward"​
je_annex_xianluo_button_desc:0 "The northern route attacks Chiang Mai to recover the former territories of Lanna; the central route captures Nakhon Ratchasima to directly threaten the heartland of Siam; the southern route sails down the Mekong River to attack the outskirts of Bangkok"​

je_hua_yi_xianluo_button:0 "March Westward to Siam"​
je_hua_yi_xianluo_button_desc:0 "The Siamese barbarians repeatedly violate our borders and hinder the spread of holy civilization! Strongly advocate a western campaign to subdue the Siamese barbarians in the name of holy civilization!"​
dsk_dai_events.44.t:0 "Lord of the Indochinese Peninsula"
dsk_dai_events.44.d:0 "Imperial Proclamation to the Four Seas"
dsk_dai_events.44.f:0 "In the past, the various states of the Southern Hemisphere either had crude rituals or were trapped in constant disputes; barbarian customs remained untransformed, and the grace of holy civilization had not reached them. I inherit heaven's mandate, raising the banner of “Holy Civilization Spreads Across the Four Seas”. Wherever our royal army passes, we do not rely on military force to intimidate others, but embrace them with rituals and music: Cambodia surrendered to us moved by holy civilization, Laos pledged allegiance to us admiring Han culture, and Siam submitted to us fearing heaven's mandate. Today, on the Indochinese Peninsula, from the north of the Red River to the south bank of the Mekong River, from the former territories of Champa to the old land of Lanna—all have been incorporated into the territory of our [ROOT.GetCountry.GetAdjective]. The four seas are unified, and all nations come to pay homage!"
dsk_dai_events.44.a:0 "Long live Your Majesty! Long live Your Majesty! Long live Your Majesty!"

dsk_dai_events.45.t:0 "Civilize the Siamese Barbarians, Unify the Southern Hemisphere"​
dsk_dai_events.45.d:0 "Joyful victory reports resounded throughout the Hall of Supreme Harmony in the Hue Imperial Palace: the King of Siam offered his imperial seal and surrendered, incorporating the entire territory into our domain"​
dsk_dai_events.45.f:0 "“In the past, Emperor #yellow Minh Mang#! launched a campaign against Siam but failed to complete his mission, leaving his unfulfilled ambition for posterity! Today, the Siamese barbarians have submitted to our rule, and Laos has been fully pacified—I have established the #v Siamese Administrative Commissioner's Office#! ! We must surely seize the victory to pacify the region and complete the great enterprise in full—this is the will of heaven, which cannot be violated! \n\nAlthough the various tribes of the former Siamese territory have surrendered to our rule, their barbarian customs remain unchanged, and holy civilization has not been fully spread among them: they have long been accustomed to walking barefoot and cutting their hair, and have no understanding of Confucian rituals and righteousness! As the Chinese State of the Southern Hemisphere, our Dai Nam should raise the banner of holy civilization, establish Confucian schools throughout the region, promulgate Chinese clothing and headwear, order the Siamese barbarians to abandon their barbarian customs and practice Han rituals, set up prefectures and counties, and bring them all under royal civilization! In this way, we will not only complete the great enterprise of unifying the Indochinese Peninsula under civilized rule, but also deter the Western barbarians, stabilize the territory of the Southern Hemisphere, and shine the glory of Chinese orthodoxy across the four seas!”"​
dsk_dai_events.45.a:0 "Long live Your Majesty! Long live Your Majesty! Long live Your Majesty!"

dsk_dai_events.46.t:0 "The Dying Emperor"​
dsk_dai_events.46.d:0 "Mentally and physically exhausted, [SCOPE.sCharacter('dai_jiao_dead_benefactor').GetFullName] fell seriously ill and took to his bed. Imperial physicians exhausted all means but failed to alleviate his suffering—we could only hear waves of heart-wrenching cries echoing through the Hue Imperial Palace."​
dsk_dai_events.46.f:0 "Today, the Red-haired barbarians have invaded the Qing Dynasty, and the Qing court has suffered defeat after defeat in successive battles—I now truly understand the cowardice of the Qing people... Yet the rising power of the Red-haired barbarians will surely become a great scourge to coastal territories. May you continue to dispatch envoys to France and other European nations to contain the Red-haired barbarians, safeguard the territory of our Dai Nam, and assist my son..."​
dsk_dai_events.46.a:0 "We ministers will spare no effort, going through fire and water to assist the Crown Prince!"
dsk_dai_events.46.b:0 "May Your Majesty hold on for a few more days and take care of your imperial health!"
dsk_dai_events.47.t:0 "The Bedridden Emperor"​
dsk_dai_events.47.d:0 "[SCOPE.sCharacter('dai_xuan_dead_benefactor').GetFullName] suddenly fell seriously ill and lay prostrate in bed. The important ministers and princes of the surrounding regions knelt before him, awaiting [SCOPE.sCharacter('dai_xuan_dead_benefactor').GetFullName]'s arrangements for state affairs after his passing."​
dsk_dai_events.47.f:0 "Among all my sons, Hong Bao is the eldest, but he was born of a concubine—foolish and lacking in learning, indulging only in pleasure and amusement, he is unfit to inherit the imperial throne. My second son, Prince Fusui Hong Ren, is intelligent and eager to learn, resembling me in character and conduct—he may inherit the imperial throne. Yesterday, I personally wrote my imperial edict of succession and placed it in the dragon tube; today I hand it over to you ministers for respectful safekeeping. Should I unfortunately pass away, immediately proclaim the edict to make all subjects at home and abroad fully aware of my sincere intention to carefully select the right heir and plan for the future with deep concern..."​

je_hua_yi:0 "Debate on Chinese and Barbarians"​
je_hua_yi_reason:0 "After the founding of an independent state by the Ding Dynasty in 968 AD, [ROOT.GetCountry.GetAdjective] faced the dilemma of “having broken free from the control of the Central Plains while needing to establish the legitimacy of its own civilization”. When the Early Le Dynasty appointed the “King Who Subdues Barbarians” to campaign against #v Champa#!, it justified its “imperial posture” on the grounds that “the opposing side fails to observe tributary rituals”; the Ly Dynasty referred to #v Dali Kingdom#! as “barbarians” in its official history books, defined its interactions with #v Cambodia#! and #v Champa#! as “tributary missions”, and localized the Central Plains concept of Chinese and barbarians for the first time. It regarded itself as “a state of rituals and righteousness in the Southern Hemisphere”, classifying neighboring regimes that had not received Confucian education as “regions awaiting civilization”. With the maturation of the #red Little China#! ideology, the debate on Chinese and barbarians formed a complete theoretical system. The Nguyen Dynasty Confucian scholar #yellow Nguyen Si Nhan#! clearly put forward the core proposition in his *Treatise on Distinguishing Barbarians*: the distinction between Chinese and barbarians lies in rituals not territory. He emphasized that [ROOT.GetCountry.GetAdjective] has been immersed in Chinese civilization for two thousand years, sharing “the same morality and customs as the Central Plains”, and should not be regarded as “barbarians” by the Central Plains; at the same time, he advocated that [ROOT.GetCountry.GetAdjective] should inherit the mission of promoting Chinese civilization and fulfill the civilizational responsibility of “stabilizing foreign tribes with rituals and music” in the Southern Hemisphere. This argument not only responded to the “barbarian positioning” by the Central Plains, but also established the civilizational dominance of [ROOT.GetCountry.GetAdjective] in the Southern Hemisphere, becoming the ideological foundation for court debates in the 19th century.\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger the following different #tooltippable;tooltip:[Country.GetTooltipTag],je_hua_yi_advance #o historical events#!#! under specific conditions"​
xianluo_duhufu_modifier:0 "Land of Royal Civilization"​
han_cultural_acceptance_modifier_positive:0 "Acceptance of Han Culture"​
je_annex_cam:0 "Advance South to Civilize Cambodia"​
je_annex_cam_reason:0 "[ROOT.GetCountry.GetAdjective] inherits Chinese orthodoxy, taking it as its mission to civilize barbarians. Cambodia ([SCOPE.sCountry('cam_scope').GetAdjective]) has long been trapped in barbarism, having not been enlightened by holy civilization. Today, as our dynasty's national strength flourishes day by day, we should advance southward to establish official offices and counties, spread poetry, books, rituals and education, consolidate the southern border barrier, and at the same time recover the territory of the former Funan Kingdom, enabling the people of Cambodia to bathe in royal civilization and share peace and prosperity together."

no_cam_tt:0 "#v Cambodia#! no longer exists"​

je_dsk_dai_main:0 "South of the Hundred Yue Tribes"
je_dsk_dai_main_reason:0 "I, [SCOPE.sCharacter('ruler_scope').GetFullName], [Concept('concept_ruler', '$RULER_TITLE_KING$')] of [ROOT.GetCountry.GetAdjective], inherit heaven's mandate to govern the land south of the Hundred Yue Tribes, serving as the monarch of the Nguyen Dynasty. \n\nOur national territory borders [SCOPE.sCountry('chi_scope').GetAdjective] to the north, reaches [SCOPE.sCountry('sia_scope').GetAdjective] to the south, faces the #yellow East China Sea#! to the east, and controls the #yellow Mekong River#! to the west. It is divided into three regions: Tonkin, Central Vietnam and Cochinchina, with Hue as the capital city, and #yellow Hanoi#! and #yellow Saigon#! as strategic barrier cities. At this time, state governance follows Confucian principles, selects scholars through imperial examinations, establishes six ministries to manage state affairs, and implements a three-level local administrative system of provinces, prefectures and counties to maintain law and order. \n\nAgriculture is the foundation of the state: the fertile delta regions of the Mekong River and Red River boast thousands of miles of fertile farmland, with abundant rice cultivation, supplemented by the planting of pepper, betel nut and other cash crops—serving as the foundation of people's livelihood; although industry and commerce have shown some signs of development, they are mostly controlled by the government, and overseas trade is limited to only a few ports such as #yellow Guangzhou#! and [SCOPE.sCountry('sia_scope').GetAdjective], not yet comparable to the prosperity of Western nations. The military system still follows the old regulations, with the Eight Banners and Green Standard Army as the backbone forces; firearms have not yet been widely adopted, and military equipment still awaits innovation and reform. Although I am unworthy to occupy the throne, I deeply understand my responsibilities: I should revitalize the declining state affairs, implement reforms to strengthen the nation, safeguard the long-term stability of our [ROOT.GetCountry.GetAdjective] state, ensure the peace and security of the people, and live up to the trust of the ancestors of the Hundred Yue Tribes!\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger the following different #tooltippable;tooltip:[Country.GetTooltipTag],dsk_dai_main_advance #o historical events#!#! under specific conditions"

je_fra_chi_war_start:0 "Eve of the Storm"
je_fra_chi_war_start_reason:0 "In the mid-to-late 19th century, the colonial expansion ambitions of [SCOPE.sCountry('fra_scope').GetName] in the Far East became increasingly inflated. Due to its unique geopolitical strategic value and abundant resources, [ROOT.GetCountry.GetAdjective] became its key target of covetousness. \n\nPreviously, [SCOPE.sCountry('fra_scope').GetName] had repeatedly pressured [ROOT.GetCountry.GetName] in the name of missionary work and trade. After being rejected, it took the opportunity to create diplomatic frictions, secretly supporting anti-government forces within [ROOT.GetCountry.GetAdjective], and constantly testing the defense bottom line of [ROOT.GetCountry.GetAdjective]. With the consolidation of [SCOPE.sCountry('fra_scope').GetName]'s colonial strongholds in Southeast Asia, [SCOPE.sState('capital_scope').GetCityHubName], as a key trade hub connecting the southwest of [SCOPE.sCountry('chi_scope').GetAdjective] and the Indochinese Peninsula, its control became the core demand for opening up the Far East trade route. \n\nAt the same time, the traditional tributary relationship between [ROOT.GetCountry.GetAdjective] and [SCOPE.sCountry('chi_scope').GetName] also became an obstacle to the further infiltration of [SCOPE.sCountry('fra_scope').GetName]. It intended to indirectly influence the southwestern border of [SCOPE.sCountry('chi_scope').GetAdjective] by controlling #v Indochina#!. To safeguard the tributary system and the security of its southwestern border, [SCOPE.sCountry('chi_scope').GetAdjective] also began to deploy troops along the China-Vietnam border. The military confrontation situation among France, China and Vietnam continued to escalate, diplomatic mediation reached an impasse, the cloud of war hung over the southern border, and the precursor to the outbreak of the Sino-French War became increasingly obvious.\n$TOOLTIP_DELIMITER$\nWhen the progress bar is filled, [SCOPE.sCountry('fra_scope').GetName] will frequently launch invasions against us\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger the following different #tooltippable;tooltip:[Country.GetTooltipTag],je_fra_chi_war_start_advance #o historical events#!#! under specific conditions"
je_fra_chi_war_start_advance:0 "1.#v Lagréé Mission Survey Report#!\n2.#v Signing of the Treaty of Beijing#!\n3.#v Treaty of the Madrid Alliance#!\n4.#v France Marches into Indochina!#!\n5.#v Arrival of Heterodox Missionaries at the Imperial Court#!"
je_hua_yi_advance:0 "1.#v Advance South to Civilize Cambodia#!\n2.#v Chinese Characters and Nom Script#!"
objective_ra_name_DAI:0 "#v Kingdom of Vietnam#!"
objective_ra_desc_DAI:0 "#v Under the rule of Emperor Minh Mang, Vietnam is flourishing in its glory as the 'Little China of the Southern Hemisphere': it has conquered Cambodia in the south and expanded westward into the former territories of Laos, spreading Confucian education across its domains, with Chinese characters and ritual systems established as the national foundation. Yet beneath this prosperity, internal troubles simmer: the newly annexed states still cling to barbarian customs, and rebellions lurk in the shadows; externally, Siam watches covetously from the side, Western powers eye the Mekong River's interests greedily, and the Qing court in the north also harbors wariness toward its territorial expansion. Can Vietnam sustain its hegemonic enterprise of 'enlightening all nations with holy civilization', safeguard the legacy of Chinese culture amid the transformations of East Asia and the tide of colonialism, and achieve lasting unification over the Indochinese Peninsula?#!#!"
clever_dsk.215.t: "Request from the Berlin Conference"
clever_dsk.215.d: "#yellow Germany#'s [SCOPE.sCharacter('dissolve_william_II_want_africa_scope').GetFullName] hopes that we will sell our colonies in #yellow Cameroon#!, #yellow Togo#!, #yellow Tanzania# and #yellow Namibia# to them in accordance with the outcomes of the Berlin Conference. [SCOPE.sCharacter('dissolve_william_II_want_africa_scope').GetFullName] also claims that this will serve as a bridge to maintain the friendship between our two nations."
clever_dsk.215.f: "Oh friend, you already hold sufficient interests in Africa. The #yellow German nation#! also aspires to carve out its own living space. Grant us a share of the benefits, and peace in Europe shall endure for a long time."
clever_dsk.215.a: "The world is vast enough for the #yellow German#! people to develop Africa—of course, only within the regions specified by the conference."
clever_dsk.215.b: "[SCOPE.sCharacter('dissolve_william_II_want_africa_scope').GetFullName] clearly fails to recognize his own strength. We will never cede any precious territory!"
sino_event.72.b: "Confucianism still embodies essences worthy of our absorption."
bc_finish.10.b: "Accept the alliance proposal from #green France#!."
clever_dsk.216.t: "The Silver-Tongued #white Man in White#!"
clever_dsk.216.d: "A golden-haired man clad in #white white robes#! requests an audience with [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]. Though his aides harbor doubts about his identity, his striking appearance dispels everyone's misgivings."
clever_dsk.216.f: "Honorable [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName], under your reign, the people live and work in peace and contentment; the elderly are cared for, and the young are nurtured. You are truly the guardian of the nation, and the world shall sing praises of your dedication. May the Lord bless you and bless our beloved country."
clever_dsk.216.a: "Drive this charlatan who spreads fallacies out of here."
clever_dsk.216.b: "I accept your kind words."
clever_dsk.217.t: "Weekend Plans"
clever_dsk.217.d: "After a fierce clash with the parliament, on a quiet weekend, the disheartened #yellow Bismarck#! walks into a tavern to drown his sorrows in wine. Overwhelmed by negativity, #yellow Bismarck# tells his drinking companion [SCOPE.sCharacter('217_pru_general_von_roon_benefactor').GetFullName] that he intends to consider resigning as prime minister and even withdrawing from politics altogether."
clever_dsk.217.f: "How can you give up so easily, my friend? You should go to meet [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]. Trust me, His Majesty is still willing to support you. Do not abandon your dreams because of a momentary setback...... #yellow Otto#!, let us finish this glass together!"
clever_dsk.217.a: "Thank you, #yellow Roon#!."
conquest_of_algeria.1.b: "Call off the campaign. We have no need to waste our energy on the Algerian coast."
je_ger_colony_5_button: "Appoint a Distinguished Governor"
je_ger_colony_5_button_desc: "#yellow Wilhelm Solf#! is an outstanding colonial governor—we ought to assign him to a suitable position."
dsk_prussia.51.t: "Governor Appointment"
dsk_prussia.51.d: "An eminent figure who excels as a scholar, diplomat, jurist and statesman has come to our attention. Having passed the assessment by state authorities, [SCOPE.sCharacter('ger_solf_character_template').GetFullName] proves to be an excellent colonial governor of the empire. Placing such a talent in an appropriate role may enable us to establish a world-renowned model colony."
dsk_prussia.51.f: "There are far too many incompetent bureaucrats in our overseas administration...... The imperial colonial department is currently struggling. What we lack now is a secretary like #yellow Solf#!—someone who not only understands mineral extraction and plantation management, but also excels at mediating relations between the indigenous peoples and our settlers."
dsk_prussia.51.a: "#yellow German East Africa#! needs you, sir."
dsk_prussia.51.b: "Mr. Solf, your qualifications are still insufficient. You should go to gain experience on the #yellow Pacific islets#!. We will fund the construction of a governor's palace for you in Samoa."
dsk_prussia.51.c: "Dear Wilhelm, the mineral deposits in #yellow German South-West Africa#! are counting on you to send men for exploitation."
dsk_prussia.51.e: "[SCOPE.sCharacter('ger_solf_character_template').GetFullName], the nation still needs you to serve in administrative work at home."
usfp_usa.13.c: "Kill the hippopotamuses with a machine gun! Put an end to the beast plague once and for all."
clever_dsk.218.t: "The Regent Empress Dowager"
clever_dsk.218.d: "Following the premature death of Emperor Tongzhi, the Empress Dowager [SCOPE.sCharacter('chi_cixi_become_zaitian_mother_scope').GetFullName], who resides in the inner palace, begins to make a bid for the throne. While the ministers are still deliberating over which prince to enthrone, the Empress Dowager clearly already has an answer."
clever_dsk.218.f: "[SCOPE.sCharacter('zaitian_become_cixi_son_scope').GetFullName] is so young, and he is also the Empress Dowager's nephew. Enthroning him as emperor is nothing but a display of the Empress Dowager's selfishness and desire for control...... Alas, you just don't understand. Do you think you have the final say in choosing the emperor? The Empress Dowager intends to rule from behind the curtain—we servants just need to obey."
clever_dsk.218.a: "Obey [SCOPE.sCharacter('chi_cixi_become_zaitian_mother_scope').GetFullName]. The state affairs shall be governed by the Empress Dowager."
clever_dsk.218.b: "The #yellow Empress Dowager#! ought to refrain from meddling in state politics. Under our guidance, [SCOPE.sCharacter('zaitian_become_cixi_son_scope').GetFullName] will grow into an excellent emperor."
clever_dsk.219.t:0 "The Gravely Ill Prince"
clever_dsk.219.d:0 "[SCOPE.sCharacter('albert_vicotr_heir_scope').GetFullName] has unfortunately contracted pneumonia. Gravely ill, he now lies in bed coughing up blood. We can only watch as his vital signs gradually fade away. May the Lord bless him and free him from suffering."
clever_dsk.219.f:0 "By the bedside of [SCOPE.sCharacter('albert_vicotr_heir_scope').GetFullName], his loved ones cannot hold back their sobs. Everyone knows that he will soon depart this beautiful world—a great loss to [SCOPE.GetRootScope.GetCountry.GetName]."
clever_dsk.220.t: "Request for the Return of Balkh"
clever_dsk.220.d: "The ruler of #yellow Afghanistan#! hopes that we will return the Balkh region south of the Amu Darya River, claiming that it is land belonging to the #yellow Afghan people#! which we seized in their time of misfortune. If we refuse to return it, the Afghan army will punish us in the name of #green Allah#!."
clever_dsk.220.f: "[SCOPE.GetRootScope.GetCountry.GetName] has stolen our territory. If they do not return Balkh, we will use our scimitars and cannons to make [SCOPE.GetRootScope.GetCountry.GetName] feel the wrath of #green Allah#!."
clever_dsk.220.a: "We should not provoke #yellow Afghanistan#!."
clever_dsk.220.b: "If they want war, let them have it."
clever_dsk.221.t: "The Kyrgyz Tribes"
clever_dsk.221.d: "Starting from 1815, the neighboring #yellow Khanate of Kokand# has continuously campaigned against and subjugated the weak Kyrgyz tribes nearby, plundering our subjects. The Qianlong Emperor once exerted pressure on Kokand to regain control over the various Kyrgyz tribes. But now, with the decline of [SCOPE.GetRootScope.GetCountry.GetName]'s national strength, many are questioning whether it is necessary to deploy military forces at the foot of the Tianshan Mountains to protect our Kyrgyz subjects."
clever_dsk.221.f: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] holds a pessimistic attitude toward dispatching troops to Kokand, telling his ministers that the state treasury cannot afford to support a large army to campaign west of the Tianshan Mountains.
A former minister stationed in Xinjiang cites an old incident: over a decade ago, an Aqsaqal named Ziyadun preached among the Kyrgyz tribes and won widespread support. When he arrived in Xinjiang to settle down and marry, the Beg of Kashgar obstructed his wedding and bullied him. Enraged, Ziyadun burned down the Beg's horse ranch. Unfamiliar with Qing laws, he thought that his noble lineage would grant him immunity under Islamic law. As a result, the Beg of Kashgar submitted a memorial to the Qing court, falsely accusing him of colluding with the remaining followers of the Aq Taghliq sect and instigating a rebellion together with the Kyrgyz tribes. Ziyadun was executed along with many tribal leaders, causing us to lose the hearts and minds of the #yellow Kyrgyz tribes#!. Winning them over will inevitably cost a great deal of money.
The general stationed in Xinjiang also points out that the patrol forces have not used the patrol route through the #yellow Naryn Road (Naryn)#! for a long time. The current patrol route through the Bingling Pass is completely unable to monitor the movements of the Kyrgyz tribes. There are already rumors that the #yellow Khanate of Kokand#! is building fortresses in the Kyrgyz pastures, and passing soldiers have even been pelted with stones. Changing the current situation will require a substantial amount of military expenditure."
clever_dsk.221.a: "My decision is final: I dispatch you to pacify the various Kyrgyz tribes and rehabilitate the reputation of #yellow Ziyadun#!. As for the rest of you officers and soldiers—I am willing to use my private treasury to help you resume patrols along the #yellow Naryn Road#!. I will never abandon the land of my ancestors!"
clever_dsk.221.b: "The state treasury cannot sustain the border defense. #red Beyond the border posts, every step is not our land; every person is not our people#!. Let them be."
clever_dsk.222.t: "Patrol Defense of Outer Xing'an Ridge"
clever_dsk.222.d: "The patrol route to Outer Xing'an Ridge is long and fraught with harsh natural conditions. The #yellow border patrol system#! we once established required patrol personnel to carve their names, official titles, and the date of the patrol on wooden plaques along the border each year—either hanging them on trees or burying them on hills. The next year's patrol team would retrieve these plaques and submit them to the general and deputy lieutenant governor for reporting. Under this system of "small patrols every year, major patrols every three years", Outer Xing'an Ridge, as a destination for major patrols only once every three years, has seen a decline in control. Reports of Russian border crossings are frequent, yet the patrol officers and soldiers look weary and apprehensive at the prospect of patrolling Outer Xing'an Ridge from the various river sources."
clever_dsk.222.f: "Climbing up Outer Xing'an Ridge and entering the vast #green primeval forest#!, the dim sky and earth are like night. In damp places, the yellow sand turns into a muddy swamp. The branches of the #green trees#! are as sharp as knives and arrows. Fallen logs crisscross the path, often blocking our way forward. In difficult terrain, we have to crawl to proceed. If we accidentally step into the mud, half of our calves will sink into it. Bear tracks are a common sight. The chirping of orioles and sparrows is rarely heard.
Sailing upstream from Aigun by boat, we rode 190 horses to the Bahana area along the Zeya River. Of these, more than 170 horses died of disease along the way, leaving us with only a dozen or so. Even so, the plague continues to claim lives. We officials will select suitable boats to try to sail upstream to Xing'an. If the boats cannot proceed, we will continue on foot. If there is no water during the dry season, we do not even know if the boats can reach the vicinity of Xing'an, nor can we be certain that we can make it on foot. Therefore, we plan to return and come again in August of this autumn."
clever_dsk.222.a: "I know the hardships you officers and soldiers endure. I now allocate a large sum of money and supplies to you—you must strengthen the patrol defense of Outer Xing'an Ridge. Furthermore, the administrative seat of Heilongjiang must not be moved further south. I order all of you generals to build the city of #yellow Aigun#! along the north bank to facilitate patrols."
clever_dsk.222.b: "#red Why must we repeatedly journey to the unreachable regions of Xing'an Ridge?#! Stop at once. Thus it is decreed!"
clever_dsk.223.t: "Border Defense of Tannu Uriankhai"
clever_dsk.223.d: "The northernmost point of our border post defense line in #yellow Tannu Uriankhai#! only extends to the area south of the Tannu-Ola Mountains-Naryn River line. It is clear that relying solely on patrols to maintain the border is not as effective as building fortifications. The #yellow Russians#! to our north are well-versed in this—their long line of fortresses firmly controls the nomadic tribes under their rule. Since the Qianlong Emperor abandoned the city of Zhaofeng south of the Tarbagatai Mountains decades ago, we have struggled to control the migration of the Kazakh tribes even with our border post lines. It is time to decide whether to rebuild the city of Zhaofeng in the Yili region."
clever_dsk.223.f: "The Russian claim that we massacred the Dzungar people and livestock, leaving only those who fled alive. Therefore, they argue that it is only just for them to seek suzerainty and protection from Russia. The Qianlong Emperor once competed with them for suzerainty over these tribes, but ultimately prohibited local authorities from accepting requests for surrender from Russian subjects in Uriankhai, tacitly allowing Russian infiltration in the area around the Khovd River."
clever_dsk.223.a: "Border affairs are of the utmost importance. I order you to immediately take supplies to strengthen the border defense of #yellow Togtoh Uriankhai#! and #yellow Altai Uriankhai#!, protect my subjects, and prevent them from being trapped in the predicament of dual suzerainty."
clever_dsk.223.b: "#yellow My imperial grandfather#! was unable to accomplish this task—I have no intention of attempting it either!"
clever_dsk.224.t: "Reconstruction of Zhaofeng City?"
clever_dsk.224.d: "Our territory west of Yili only has two regular border post patrol lines—one for winter and one for summer. But it is clear that maintaining the border through patrols alone is not as effective as building cities. The #yellow Russians#! to our north are masters at this; their lengthy line of fortresses firmly controls the nomadic tribes under their rule. However, after the #yellow Qianlong Emperor#! abandoned #yellow Zhaofeng City#! south of the Tarbagatai Mountains, we have even struggled to control the migration of the Kazakh tribes via our border post lines. The time has come to decide whether to rebuild Zhaofeng City in the Yal area."
clever_dsk.224.f: "The garrison soldiers stationed at Zhaofeng City once complained: the wetlands along the Ili River are infested with mosquitoes; local white flies breed maggots that can blind people in summer. In winter, the heavy snow is unbearably cold, and the supply of provisions is difficult. Therefore, several decades ago, the imperial councillor moved the garrison eastward to #yellow Tarbagatai#!. The original site of Zhaofeng City, like the #yellow City of Tokmak#! of the Tang Dynasty, was handed over to nomadic tribes such as the Kazakh Qizilbash for settlement."
clever_dsk.224.a: "Rebuild Zhaofeng City on higher ground with good drainage around the original site to mitigate the impact of mosquitoes and humidity. To cope with the severe cold and heavy snow in winter, dispatch several #yellow Tibetan#! ministers to teach the locals how to grow rye and survive in cold regions."
clever_dsk.224.b: "#yellow My imperial grandfather#! once named this city Zhaofeng, meaning 'heralding great achievements'. Yet I have no desire to forge new feats—let it remain abandoned!"
sino_event.141.b: "The Empress Dowager can no longer speak, she can only stare at us with her eyes. For the sake of decency, perhaps we can just wait quietly for her to pass away."
oriental_crisis.6.b: "We have no need for intervention from any great powers."
dsk_ita.16.b: "Ethiopia is our friendly commercial partner. Invading them would be a mistake—not to mention that we share the common faith of #yellow Christianity#!."
eth_not_lives_tt: "#yellow Ethiopia#! no longer exists"
clever_dsk.225.t: "The Panama Crisis"
clever_dsk.225.d: "A growing number of countries have begun to lay claim to [SCOPE.GetRootScope.GetCountry.GetName]'s territory in the #yellow Province of Panama#, driven by their unrealistic fantasy of building a canal there. Although they grandly claim that they will share a portion of the profits with us, intelligence reports reveal that some countries' spies are attempting to incite the local residents of Panama to seek independence—merely by promising them a share of the canal's future revenues. To make matters worse, a large-scale fleet has appeared near the Caribbean Sea, clearly targeting us."
clever_dsk.225.f: "You claim that we have failed to provide local infrastructure development—that is simply ridiculous! Do you know how many governments there were during the civil war? How could we possibly prioritize your needs first? We have already granted you the right to build and operate the canal; as for sovereignty, we will never hand it over!"
clever_dsk.225.a: "Let the locals go their own way and declare independence. We lack the strength to wage war against the great powers."
clever_dsk.225.b: "We will not yield an inch of land in the #yellow Province of Panama#!."
dsk_spa.19.b: "Let us carry out reforms in a moderate manner."
clever_dsk.226.t: "The End of the Western Era"
clever_dsk.226.d: "The era of gunslingers and outlaws has finally come to an end. [SCOPE.GetRootScope.GetCountry.GetName] has gradually become a nation ruled by law; the West has been almost completely tamed. A few gangs still remain at large, but their arrest is inevitable."
clever_dsk.226.f: "I got an idea, John...\nYou always got an idea, Dutch.\nThis one's a good one... John, we can't fight nature, we can't fight change, we can't fight gravity—we can't fight nothing, and I've been fighting my whole life.\nThen let it go, Dutch.\nBut I can't quit. I can't fight my own nature. That's the paradox, John. You understand?\nThen I'm gonna have to shoot you.\nWhen I'm gone, they'll just find another devil to justify their cause.\nThat's their business.\n#yellow Our time is done, John#!......"
clever_dsk.226.a: "Another bandit leader has been eliminated. This is a victory for the rule of law."
lawrence_leave_now_tt: "#yellow T.E. Lawrence#! will depart for Hejaz to incite the Arab Revolt. If the war is won, he will return."
clever_dsk.227.t: "The Seven Pillars of Wisdom"
clever_dsk.227.d: "[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName] has decided to side with Germany and become our enemy—clearly forgetting the assistance we provided them during the #yellow Crimean War#!. What is particularly troublesome is that [SCOPE.sCountry('gbr_lawrence_attack_scope').GetName] is attempting to incite Muslims to launch a holy war against us in the name of the #green Caliph#!. This has exacerbated the unfavorable situation on the Middle Eastern front. In response to this, a lieutenant proficient in Arabic and local customs, [SCOPE.sCharacter('ecchi_gbr_lawrence_character_scope').GetFullName], with the permission of his superior, requests to be dispatched to the #yellow Hejaz region#! to help the Arabs achieve independence from the oppression of [SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]."
clever_dsk.227.f: "The Arabs had their own independent states a long time ago—they yearn for independence. If they can unite, they can effectively strike at the rear security of [SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]. The vast desert terrain of the Arabian Peninsula is also ideal for us to wage guerrilla warfare, sabotaging [SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]'s railways and supply lines."
clever_dsk.227.a: "Good luck, Lieutenant [SCOPE.sCharacter('ecchi_gbr_lawrence_character_scope').GetFirstName]. Our fleet will coordinate with your rebel forces. We look forward to your triumphant return."
clever_dsk.227.b: "Reject the proposal from [SCOPE.sCharacter('ecchi_gbr_lawrence_character_scope').GetFullName]."
clever_dsk.228.t: "Lawrence of Arabia"
clever_dsk.228.d: "#yellow Great Britain#! has dispatched an officer, [SCOPE.sCharacter('ecchi_gbr_lawrence_character_scope').GetFullName], whose expertise in unconventional warfare has proven invaluable. Backed by #yellow Great Britain#!, he confronts their former oppressor—[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]. When the sound of gunfire from Arab knights echoes over the skies of #yellow Medina#!, an independence war sweeping across the Arabian Peninsula begins."
clever_dsk.228.f: "[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName] lost most of its territory in Hejaz in a short period of time, but their governor still refuses to surrender and has fled into the mountains to continue resistance. After capturing #yellow Mecca#!, the rebel leader issued a proclamation to Muslims around the world, denouncing [SCOPE.sCountry('gbr_lawrence_attack_scope').GetName] for its persecution and massacre of the Arab people—acts that violate the spirit of #green Islam#! and will be condemned by all Arabs."
clever_dsk.228.a: "What will the future hold for Arabia?"

dsk_dai_events.46.t:0 "The Ailing Emperor"
dsk_dai_events.46.d:0 "Worn down by grief and toil, [SCOPE.sCharacter('dai_jiao_dead_benefactor').GetFullName] has fallen gravely ill. Imperial physicians have exhausted all remedies, yet fail to ease his suffering—only heart-rending wails echo through the halls of the Hue Palace."
dsk_dai_events.46.f:0 "Now the Red-haired Barbarians have invaded the Qing Empire, and the Qing forces suffer defeat after defeat. I see clearly how cowardly the Qing are... Yet the power of these Red-haired Barbarians shall surely become a great scourge upon coastal realms. I charge you to continue sending envoys to France and other Western nations, to check the Red-haired Barbarians' advance and safeguard our Great Nan's borders. Uphold my son... assist him faithfully..."
dsk_dai_events.46.a:0 "Your servants shall lay down our lives to assist the Crown Prince!"
dsk_dai_events.46.b:0 "May Your Majesty hold on a few more days—take care of your imperial health!"

dsk_dai_events.47.t:0 "The Bedridden Emperor"
dsk_dai_events.47.d:0 "[SCOPE.sCharacter('dai_xuan_dead_benefactor').GetFullName] has suddenly taken gravely ill and lies bedridden. High ministers and imperial princes kneel before him, awaiting his final arrangements for the state."
dsk_dai_events.47.f:0 "Among all my sons, Hong Bao is the eldest, yet he is born of a concubine—foolish, unlearned, and indulgent in idle pleasures. He is unfit to inherit the imperial throne. My second son, Prince Fusui Hong Ren, is wise and avid for learning, bearing the very image of my own person. He shall succeed me as Emperor. I have written my final edict with my own hand and sealed it within a dragon tube. Now I entrust it to you, to be reverently safeguarded. Should the worst befall me, proclaim it forthwith, that all subjects within and without the realm may know my careful choice of a worthy heir, and my profound foresight for the nation's future..."

dsk_dai_events.48.t:0 "The Valiant Local Gentry"
dsk_dai_events.48.d:0 "Upon learning of the French invasion, local gentry [SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName] has voluntarily raised a militia force composed of farmers and local clansmen, marching to Gia Dinh and Bien Hoa to fight alongside our imperial army. However, this act of unauthorized conscription has aroused the suspicion of [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]."
dsk_dai_events.48.f:0 "As long as we hold one inch of our land, as long as one #yellow Vietnamese#! remains willing to fight, we shall resist to the very end! — [SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName]"
dsk_dai_events.48.a:0 "Reward [SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName] with the military command over the three provinces of Cochinchina."
dsk_dai_events.48.b:0 "Drive him away! Who granted him permission to raise troops without authorization?"

dsk_dai_events.49.t:0 "[SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName]'s Last Stand"
dsk_dai_events.49.d:0 "The signing of the Treaty of Saigon did not halt [SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName]'s resistance. Though [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] had ordered him to disband his forces and submit to French rule, he defied the imperial edict to save the nation. Cut off from court support, he waged guerrilla warfare in Dinh Tuong Province until, after repeated French campaigns, he was gravely wounded and took his own life with his sword."
dsk_dai_events.49.f:0 "When the court fails to embody the will of the nation and its people, the people have the right to defend themselves. #red Ha! You French barbarians shall never conquer us! As long as one Vietnamese warrior remains, our resistance shall never cease!!#! — [SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName]"
dsk_dai_events.49.a:0 "Better to die with honor than live in shame (Thà chết vinh còn hơn sống nhục)."

dsk_dai_events.50.t:0 "[SCOPE.sCharacter('dai_ruanzhongzhi_benefactor').GetFullName]'s Martyrdom"
dsk_dai_events.50.d:0 "Refusing to recognize the Treaty of Saigon, Cochinchinese patriot [SCOPE.sCharacter('dai_ruanzhongzhi_benefactor').GetFullName] continued to wage guerrilla warfare against the French in the forests and marshes of Kien Giang and Ca Mau—even succeeding in burning down a French warship, which drew fierce retaliation from French forces. Regrettably, the weak [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] could offer him no aid. Outnumbered and outmatched, [SCOPE.sCharacter('dai_ruanzhongzhi_benefactor').GetFullName] was finally captured by the French and steadfastly refused to surrender."
dsk_dai_events.50.f:0 "You shall be hanged for your crimes of burning our warships and disrupting the peace...#red Hahaha! You Western barbarians shall have to pluck every blade of grass from the Southern Land before our people's resistance to the West will ever stop!!#! — [SCOPE.sCharacter('dai_ruanzhongzhi_benefactor').GetFullName]"
dsk_dai_events.50.a:0 "[TimeKeeper.GetCurrentDate.Format('yyyy-MM-dd')], Saigon has lost a valiant hero..."

dsk_dai_events.51.t:0 "The Coronation Ceremony"
dsk_dai_events.51.d:0 "Emperor Tu Duc ascends the throne, and envoys from the [SCOPE.sCountry('chi_scope').GetAdjective] [Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')] arrive bearing the Imperial Edict of Enfeoffment."
dsk_dai_events.51.f:0 "By the late Emperor #v Thieu Tri#!'s testament, I ascend the throne and adopt the era name Tu Duc. The entire nation rejoices in celebration. Yet the coronation ceremony in the Hall of Supreme Harmony has barely concluded when couriers gallop south from the northern border with urgent tidings: Learning of my succession, the Qing court has dispatched a Cabinet Secretary bearing the Imperial Edict of Enfeoffment and a royal robe as a gift, seeking to uphold the traditional suzerain-vassal alliance by enfeoffing me as #v "King of Vietnam"#!.The #v Pro-Qing Faction#! ministers gather in the palace, kneeling to implore me to accept the edict: "The Heavenly Dynasty's enfeoffment is the foundation of legitimate rule! For generations, our ancestors have received the Qing court's enfeoffment, ensuring peace within and without the realm. Accepting the edict and offering thanks now will not only demonstrate our Great Nan's adherence to ritual propriety, but also secure military supplies and grain aid from the Heavenly Dynasty. With the northern border secured, we may turn our full attention to expanding southward!" With that, they present the golden seal of enfeoffment from previous reigns, urging me to "heed the will of Heaven, uphold ancestral traditions, and maintain the suzerain-vassal alliance."\NThe #v Anti-Qing Faction#! generals draw their swords, vehemently opposing the move: "Your Majesty is the sovereign of the Central Plains of the South—ruler of the ancient Jiaozhi and Khmer lands. Why should you be bound by the enfeoffment of these Qing barbarians? Today, the Qing Empire is still reeling from the Opium Wars, its internal unrest only recently quelled, and its national power in decline—it is no longer worthy of the title 'Heavenly Dynasty'! Refuse the enfeoffment, declare yourself 'Emperor of Great Nan' in your own right, and we shall assert our nation's sovereignty and our status as the legitimate heirs of Chinese civilization! If we bow to the Qing's demands, we will not only drain the national treasury with annual tributes, but also invite contempt from our newly annexed vassals. Our sacred mission of spreading civilization southward shall be shackled, and we shall forever remain a vassal of the Qing barbarians!"

dsk_dai_events.52.t:0 "The Coronation Ceremony"
dsk_dai_events.52.d:0 "Emperor Ham Nghi ascends the throne, with secret envoys from the [SCOPE.sCountry('chi_scope').GetAdjective] [Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')] delivering a royal edict, while Western French forces lay siege to the outskirts of Hue."
dsk_dai_events.52.f:0 "In this time of national crisis, I ascend the throne by the unanimous recommendation of the imperial clan, adopting the era name Ham Nghi, resolved to save the nation from the brink of collapse. Yet the coronation ceremony in the Hall of Supreme Harmony is conducted in haste, for two urgent reports arrive in quick succession: Learning of our nation's invasion by the French, the Qing court has sent secret envoys southward with a royal edict—though no formal enfeoffment is offered, they promise that "if you uphold the suzerain-vassal rituals, we shall dispatch reinforcements from Yunnan and Guangxi to march north." Meanwhile, merely ten li south of the palace, French warships form a battle line, their cannons aimed directly at the imperial capital, forcing me to sign the Treaty of Hue and recognize France as our "protectorate," surrendering our diplomatic autonomy!The #v Pro-Qing Faction#! elderly ministers kneel prostrate, weeping as they implore me: "Today, French troops stand at the gates of the capital—national annihilation is imminent! Though the Qing Empire is weak, its garrisons in Yunnan and Guangxi can still harass the French rear! We beg Your Majesty to uphold the traditional suzerain-vassal system, restore the title 'King of Vietnam,' and send envoys to the Qing court to plead for aid, joining forces with the Heavenly Dynasty to resist these Western barbarians! If we refuse, our nation shall stand alone and defenseless, doomed to fall to the French—and the legacy of Chinese civilization shall be severed forever!" With that, they present the golden seal of enfeoffment, hidden away for safekeeping, urging me to "endure humiliation to preserve the nation, and seek aid to survive."The #v Anti-Qing Faction#! generals draw their swords, roaring with anger: "The Qing barbarians can barely protect themselves—how can we hope for their reinforcements? They stood idly by as the French invaded our nation in years past; their so-called 'rescue' is nothing but empty words! Though the French are strong, our army and people stand united as one, and our vassals in Khmer and Laos are ready to fight to the death! Refuse to sign the treaty, reject the Qing edict—Your Majesty shall lead our imperial army personally, summoning all sons and daughters of the Central Plains of the South to join the fight for our nation! If we submit to the Qing barbarians or the Western powers, the Great Nan's state and the legitimate legacy of Chinese civilization shall be destroyed utterly—how can we face our ancestors in the afterlife!"
António_de_Oliveira:0 "António de Oliveira"
Nicolás_Alcalá:0 "Nicolás Alcalá"
ecchi_Samora:0 "Samora"
zealand:0 "New Zealand"
gov_cvlm_temp:0 "Overseas Territory"
gov_cvlm_temp_desc: "The nominal sovereignty of this region belongs to a nation, ruled by [Concept('concept_ruler','$gov_cvlm_overseas_territory_ruler_title_male$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
gov_colonial_administration_cvlm:0 "Colonial Government"
gov_colonial_administration_cvlm_desc: "This region is subject to the authority of the suzerain state, ruled by [Concept('concept_ruler','$gov_cvlm_overseas_territory_ruler_title_male$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
alberdeen_act:0 "Enforcement of the Aberdeen Act"
alberdeen_act_desc:0 "It is time to pressure Brazil, a state that practices slavery"
ecchi_Bread:0 "Bread Maker"
ecchi_Bried:0 "Bake"
modifier_versailles_peace:0 "Treaty of Versailles"
ideology_market_anarchist_desc:0 "This leader advocates the abolition of state coercive institutions, the realization of social order through free markets and voluntary contracts, the protection of absolute private property rights, and the provision of protection services by the market."
ecchi_liangzi:0 "Ryoko"
je_habsburg_monarchy_lobby:0 "A governing body established by #yellow Francis I#! in his will, with a status higher than that of the State Council. The State Council must deliberate on major matters assigned by the Kaiser or matters on which the State Council has divergent opinions. However, this department has been mired in fierce political struggles since its establishment between the #yellow Metternich Faction#! led by #yellow Klemens von Metternich#! and the #yellow Bohemian Faction#! led by #yellow Count Franz Anton von Kolowrat-Liebsteinsky#!. Any reform is bound to be fiercely obstructed by the opposing faction."
je_aus_absolutism_main_lobby:0 "After the restoration of Habsburg authority, the Kaiser will begin to govern the country on the advice of the Chancellor. He ignores the traditional centers of authority, abolishes the provincial diets of the nobility, and relies entirely on the authority of his #yellow bureaucracy, police, and army#! to enforce his will. This is an evolution toward extreme absolutism, devoid of the elegance of the Baroque era, yet a modern form of absolutism driven by the urgent mission of modernization."
je_aus_liberal_reform_main_lobby:0 "The #yellow Kaiser#! has reluctantly accepted the mantra of constitutionalism. Forced by the constitutionalists, he has no other choice. The #yellow Imperial Constitution of 1849 (Reichsverfassung—von—1849)#! established a bicameral parliament within the empire, marking the beginning of the empire's #yellow constitutional reforms#!."
je_Austrian_Empire_revolution_lobby:0 "The people overthrew the regime of Prince Metternich and forced him into ignominious exile. A new #yellow Liberal government#!, appointed by the #yellow Kaiser#!, has been formed, tasked with the responsibility of reforming the nation. Yet the revolutionaries are not united; their victory owes solely to a #yellow political alliance#! of various classes discontented with the status quo. Should this alliance collapse and split, problems will inevitably arise. Both the #yellow constitutionalists#! and the #red radicals#! seek to determine the future direction of the new regime."
je_aus_dual_monarchy_reform_lobby:0 "The #yellow Kaiser#! is determined to rule Cisleithania personally, and #yellow Eduard Taaffe#! seems ideally suited to carry out his will. Initially, #yellow Eduard Taaffe#! retained moderate liberals in his government, but he also persuaded the Czechs to return to political life in Cisleithania while securing the support of the Poles. However, with the rising status of #yellow Hungary#, this new cabinet will lead the monarchy toward an uncertain future."
je_Westernization_movement_lobby:0 "#yellow China#! has inevitably been drawn into the disputes of the great powers and joined the world stage. The Western nations that have undergone the Industrial Revolution are clearly ahead of us in science and technology. If we cannot learn from the barbarians to control the barbarians and uphold Chinese learning as the essence while adopting Western learning for practical use, #yellow China#! will struggle to survive on the world stage."
je_Pentecostal_Variation_lobby:0 "Intellectuals led by #yellow Kang Youwei#! and #yellow Liang Qichao#! hope to implement reforms with the emperor's support, learning from the West institutionally to achieve modernization."
je_china_19th_century_lobby:0 "A man of seven chi stature, having dedicated himself to the nation, can scarce pledge himself to another. Should I return alive from this journey, it shall be a great fortune. If misfortune befalls me, grieve not, mourn not. Gather my bones and bear them back to my hometown, to be interred where spring flowers bloom brightly. Now the land is torn asunder, I implore you all to work together with one heart, so that future generations may be freed from this suffering."
je_reform_persia_lobby:0 "#yellow Amir Kabir#!, born a cook, hopes to reform backward Iran with the support of the #yellow Shah#!."

ROM_FLAVOR_TEXT: "Romania has finally achieved unification, yet feudal remnants and covetous neighboring powers still plague this fledgling nation. Can Romania continue to realize the dream of Greater Romania in the great power game?"
enough_germany_empire_house_50_var: "Possess more than 50 points of #yellow Influence#! in the Imperial Diet"

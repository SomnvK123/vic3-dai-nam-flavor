 POTR.103.t:0 "The presidential election
 POTR.103.d:0 "It's time for the results, who will emerge victorious ?"
 POTR.103.f:0 "The French people have voted..."
 POTR.103.a:0 "Republican Union candidate, [SCOPE.sCharacter('republican_candidat').GetFullName]"

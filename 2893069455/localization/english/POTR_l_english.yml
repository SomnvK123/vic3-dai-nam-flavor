support_northern_rhodesia_button_desc: "The Governor of South Africa has successfully opened up vast African territories for us. It is time to reward his meritorious service by forming the Northern Rhodesia Protectorate with the lands of #yellow Zambia#! and #yellow Kazembe#!, and safeguard the interests of white people in the region."

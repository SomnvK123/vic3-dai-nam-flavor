 POTR.102.d:0 "It's time for the results, who will emerge victorious ?"
 POTR.102.f:0 "The French people have voted..."
 POTR.102.a:0 "Party of Order candidate, [SCOPE.sCharacter('order_candidat').GetFullName]"
 POTR.102.b:0 "Republican Union candidate, [SCOPE.sCharacter('republican_candidat').GetFullName]"

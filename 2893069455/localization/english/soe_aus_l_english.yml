Vienna_Ringstrasse_reason:0 "#variable [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]#, as the [concept_capital_state] of our great empire, has a long history and countless glories. However, the rapid development of the city is currently hindered by the ancient city walls of #variable [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]#, which also pose no threat against internal revolutions.\nTo clear obstacles to urban development and make our capital the greatest city in Europe, under the guidance of [SCOPE.sCharacter('wien_ruler_scope').GetLastName], our designers have devised an ambitious plan: to completely demolish the ancient city walls and replace them with a grand #variable Vienna Ringstrasse and its accompanying buildings# that encircle the entire city.\nThis plan is so vast that it will take decades and countless resources to complete. Once achieved, [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] will shine as a pearl of Europe no less magnificent than Paris and London!"

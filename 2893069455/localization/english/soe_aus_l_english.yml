# Galicia #############################################################################################################################################################################

galicia_events.1.t: "The Ghost of Galicia"
galicia_events.1.d: "In this world, perhaps every country, every civilization, has its own ghost of Galicia."
galicia_events.1.f: "#variable 'Galicia'#!, also known as the #variable Kingdom of Galicia and Lodomeria#!, was a prize acquired by the Habsburgs during the first partition of Poland. As former Polish territory in Eastern Europe, Galicia's land system was dominated by a backward feudal [GetLawType('law_serfdom').GetName] structure. Due to traditional feudal concepts, [GetLawType('law_serfdom').GetName] was deeply rooted in Galicia, and the political power held by the #v $aristocrats$#! in Galicia delayed any reforms. Even though the necessity of reforming [GetLawType('law_serfdom').GetName] became a popular topic in the early 19th century, the #v $aristocrats$#! were still unwilling to take any action, similar to the liberal #v $aristocrats$#! in [concept_hungary_kindom]'s [concept_magyar] who defended national traditions or inherent autonomy not for the people, but for #variable their own power and privileges#!. The pressure from Vienna to implement land reform policies combined with the spread of Polish nationalism had a cross-impact in Galicia. In the correspondence, biographies, and writings of Galicians in the 19th century, we seem to see the same colors: they could simultaneously identify with their Polish national identity, the concept of a Galician 'state,' and loyalty to the Habsburg dynasty. Galicia seemed to be both a part of Poland, a separate 'state' or entity, and an inseparable loyal territory of the Habsburg monarchy."
galicia_events.1.a: "Does this concept of a nation refer to Poland in the cultural and national sense, the Austrian monarchy, or specifically to Galicia as a region?"

galicia_events.2.t: "Krakow Uprising."
galicia_events.2.d: "A large-scale rebellion has erupted in the Free City of Krakow! Local insurgent leaders mobilized a proletarian armed force composed mainly of the poor, workers, artisans, and peasants to attack the Austrian army, with nearby people rallying to respond. The insurgent force reached 6,000 people. The Austrian army was driven out on February 22, and Krakow declared liberation. One of the leaders of the uprising, Ludwik Gorzkowski, announced the establishment of the 'National Government of the Polish Republic,' and issued the 'Proclamation to the Polish People.'"
galicia_events.2.f: "We have 20 million people here; if we are united like one person, our power cannot be subdued by any violence, and we will gain unprecedented freedom. ... Everyone will use the land according to his contribution and ability, and any form of privilege will be abolished ... The land that peasants currently have the conditions to use will become unconditionally theirs, serfdom, labor services, and all similar obligations will be abolished without compensation, and those who take up arms and dedicate themselves to the national cause will be rewarded with national land. \n———— Proclamation to the Polish People."
galicia_events.2.a: "Crush them!"

galicia_events.3.t: "Galician Peasant Uprising"
galicia_events.3.d: "Due to last year's poor harvest and floods, coupled with the sharp contradictions between the peasants and the #v $aristocrats$#! under [GetLawType('law_serfdom').GetName], the peasants' anger finally ignited a large-scale peasant uprising in Galicia. The peasant armed forces gained momentum and quickly swept across six counties in Galicia, with countless landlords killed. We can take advantage of this by declaring that we will abolish [GetLawType('law_serfdom').GetName], thereby winning their support. This will be an excellent opportunity for us to divide and disintegrate the rebels."
galicia_events.3.f: "What does a landlord's rebellion have to do with me, a lowly farmer?"
galicia_events.3.a: "Let the old peasants fight the landlords themselves; we can sit back and enjoy the benefits."
galicia_events.3.b: "Crush them all for me!"

galicia_events.4.t: "Galician Massacre"
galicia_events.4.d: "Our divide and conquer policy has worked! Now the peasants are spontaneously helping us suppress the revolutionaries, and we only need to wait for them to be exhausted so we can wipe them out completely."
galicia_events.4.f: "The imperial government announced a monetary reward for capturing a rebel, driven by hatred and profit, an absurd phenomenon emerged: Polish peasant insurgents turned their blades against the revolutionaries. Within three days, the peasant armed forces flattened 500 estates, beheading thousands of landlords. Few of the landlords actually participated in the uprising; most became victims of class revenge. Upon hearing about the tragedy in Galicia, the Krakow government sent a team to try to explain things to the peasants, only to be ambushed and wiped out by the peasant armed forces. Dembowski personally led a group to Galicia to try to calm the situation, only to be intercepted and killed by the Austrian army. In April, shortly after the 'Galician Massacre,' the authorities, to prevent the peasant armed forces from becoming uncontrollable, began to suppress the now useless peasant insurgents everywhere. By summer, the disturbances were declared over, and the Galician peasant uprising was defeated."
galicia_events.4.a: "Peasants produce all things to support the nobility, but the nobility gives nothing in return to the peasants, kill, kill, kill, kill, kill!"
 galicia_events.5.t: "Galician Revolution"
galicia_events.5.d: "As the revolution in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] intensifies, our #variable Galicia#! region is also experiencing a large-scale uprising. Fortunately, our governor has temporarily stabilized the peasants by announcing the early abolition of [GetLawType('law_serfdom').GetName] in #variable Galicia#!. Now, it is up to us to decide whether to take action to wipe out the remaining revolutionaries."
galicia_events.5.f: "On March 15, almost simultaneously with the Poznan Uprising and following the resignation of Prime Minister Metternich, a revolutionary movement also broke out in Galicia. In April, the Polish Committee was established in Krakow and expanded its armed forces, and a committee was also formed in Lviv. The leaders of the Galician uprising, like the nobility in Poznan, hoped for a peaceful resolution to the dispute. They submitted a petition to the Austrian [Concept('concept_ruler','$RULER_TITLE_KAISER$')], hoping that the [Concept('concept_ruler','$RULER_TITLE_KAISER$')] would abolish [GetLawType('law_serfdom').GetName] and grant land to the peasants through redemption. However, the peasants were not satisfied with this and desired true unconditional land distribution. To protest, the peasants began to strike. In December, the newly enthroned Austrian [Concept('concept_ruler','$RULER_TITLE_KAISER$')] Franz Joseph I issued a formal decree abolishing [GetLawType('law_serfdom').GetName], leading to a large number of peasants withdrawing from the fight. The Galician uprising failed, and the flames of the national revolution were quickly extinguished by the occupying authorities, with the Polish Committee in Krakow surrendering after Austrian artillery bombardment."
galicia_events.5.a: "It is time for our army to teach them what loyalty and patriotism mean."
galicia_events.5.b: "We are too busy, let's withdraw the army for now."

# State Council #############################################################################################################################################################################

je_habsburg_monarchy: "State Council"
je_habsburg_monarchy_reason: "#bold [concept_staatskonferenz]#! was established as a regency council by our beloved #yellow Ferdinand#! [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. However, this department has been embroiled in intense political struggles since its inception, led by #yellow Klemens von Metternich#! of the #variable Metternich faction#! and Count #yellow Franz Anton von Kolowrat-Liebsteinsky#! of the #variable Bohemian faction#!.\n\nThe #variable Metternich faction#!, headed by #yellow Metternich#!, consists of government reformists who have united due to their dissatisfaction with the chaotic system of mutual restraint at the top of the state, hoping to #variable reform#! the disorganized national management institutions.\nOn the other hand, the #variable Bohemian faction#! is a political alliance of Bohemian #v $aristocrats$#! and conservative bureaucrats who seek to profit from the existing rigid bureaucratic institutions, acting as #variable defenders of the current order#!.\n\nThe ideological and policy differences and disharmony between these two senior ministers have effectively caused #variable stagnation in imperial politics#!—any reform will inevitably be met with full resistance from the other faction.\n#bold Time does not wait for us, signs of [concept_revolution] have already appeared. If we cannot resolve the political struggle at the highest level of power, we may be engulfed by the flames of [concept_revolution]#!"
concept_staatskonferenz: "State Council"
concept_staatskonferenz_desc: "The State Council (Staatskonferenz) was a power institution created at the request of the late [Concept('concept_ruler','$RULER_TITLE_KAISER$')] #yellow Franz I#! in his will, holding a position higher than the State Council. The State Council must deliberate on major matters entrusted by the [Concept('concept_ruler','$RULER_TITLE_KAISER$')] or on matters with differing opinions from the State Council and can even handle certain government affairs on behalf of the [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. From 1836, Archduke Ludwig, designated by Franz I in his will, chaired the meetings as the president of the State Council and could, if necessary, summon all members of the State Council and court presidents."

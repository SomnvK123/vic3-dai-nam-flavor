# Empire of Italy ###########################################################################################################################################################################
je_habsburg_italy:0 "Habsburg Italy"
je_habsburg_italy_reason:0 "#variable Italy#!, the jewel of the Mediterranean, is proud of its long history and diverse culture. However, a new wave of unification is emerging, with a group of madmen and ambitious people trying to destroy the #yellow cultural traditions#! and #yellow existing order#! of ancient Italy, forcibly uniting all of Italy into one nation through conquest and rebellion.\n\nThe Habsburg family has deep ties with Italy, controlling key territories such as the #yellow Duchy of Milan#! and the #yellow Grand Duchy of Tuscany#! and respecting the #variable tradition of autonomy of the Italians#!. We have always had strong influence in Italy. To protect our interests in Italy and safeguard the traditions of the Italian people from being harmed, we need to find our allies in the Italian region. Fortunately, the #yellow Lombards#! and #yellow Venetians#! under imperial rule have a strong sense of #variable regional identity#!, mainly concerned with their #yellow autonomy#! and not particularly interested in pan-Italianism. This means we can ensure their loyalty by granting them more autonomy.\n\n#variable The Italian people will eventually realize that only the Habsburgs are the true protectors of the cultural traditions and history of each community!#!"
je_habsburg_italy_tt.1:0 "We must defend our interests in Italy"

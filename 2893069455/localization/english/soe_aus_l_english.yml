#Kaiser Ferdinand's Railway########################################################################################################################################################################
je_Kaiser_Ferdinands_Nordbahn: "Kaiser Ferdinand's Railway"
je_Kaiser_Ferdinands_Nordbahn_reason: "When railways were recognized as a viable mode of transportation, there were considerations to establish a railway from Vienna to the Sudetenland in the northern Moravian-Silesian mining and industrial district, to further enhance connections with Galicia and improve the economic structure of the region. Anselm Salomon von Rothschild applied for the privilege to build the railway in 1835, and His Majesty the [Concept('concept_ruler','$RULER_TITLE_KAISER$')] granted him a 50-year privilege a year later, with the support of Prince Metternich and Count Kollowrat. If the railway is completed, the newly constructed line will be called the 'Kaiser-Ferdinand-Nordbahn (Emperor Ferdinand's Northern Railway)' in honor of the great Emperor Ferdinand I [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. As one of the world's leading powers, we must complete the railway construction as soon as possible to quickly connect the northern part of the empire."

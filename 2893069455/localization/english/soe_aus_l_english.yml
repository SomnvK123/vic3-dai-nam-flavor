# New Absolutism Reforms #####################################################################################################################################################################
je_aus_absolutism_main:0 "New Absolutism Reforms"
je_aus_absolutism_main_reason:0 "After the restoration of Habsburg authority, [SCOPE.sCharacter('new_aus_absolutism_scope').GetFirstName] will begin to govern the country following the advice of [SCOPE.sCharacter('new_aus_absolutism_army_scope').GetLastName].\n\nDisregarding the traditional centers of authority, he abolished the provincial noble assemblies, relying entirely on the authority of his #variable bureaucracy, police, and military#! to enforce his will as the [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. This is an evolution towards extreme absolutism, lacking any Baroque elegance, but it is also a modern form of absolutism with a sense of urgent modernity: #variable Neo-Absolutism#!. This dynasty no longer relies on traditional authority but on #variable coercion over its subjects#! to maximize Habsburg authority.\n\nAnother step of Neo-Absolutism is to build Joseph II's #variable rationalist state#!, but without any enlightened idealism. The restoration of Habsburg authority relies on #variable order, efficiency, and prosperity#!, and to some extent, a little desire of the populace to participate in political affairs. Economic and fiscal power should replace tradition and precedent as the basis of authority;\n\nThe modern administrative and military systems established by our reforms will enable this monarchy to defend its rights in the face of other modernized European powers."
je_aus_absolutism_success_reason_tt:0 "We have completed 4 items in the New Absolutism Reforms"
aus_absolutism_main_tt.1:0 "We must thoroughly reform the empire!"
je_aus_absolutism_economy:0 "New Absolutism Reforms: Economic Development"
je_aus_absolutism_economy_reason:0 "To demonstrate vitality in the economic field, we appointed [SCOPE.sCharacter('new_aus_absolutism_industrialists_scope').GetLastName] as the main policymaker for economic and fiscal policies in the new regime. Under his push, the government will adopt a laissez-faire policy towards industry and commerce and eliminate the privileges of vested interests. The regulation of railway construction will be lifted, and the #variable Gewerbeordnung (Industrial Code)# effectively abolished the guilds. The #variable Credit-Anstalt# formed by the #variable Rothschild family# and its associates, supported by the state, facilitated credit. Our economic liberalization and cautious tax policy will bring us rapid economic growth, and key strategic benefits will be gained in sectors like railway transport.\n\nThe old #variable tariff system# has become an obstacle to the modernization process of the empire, and we need to reform our tariff system to promote our trade and sell Austrian products worldwide!"
finished_absolutism_economy_tt:0 "Our GDP has doubled"
je_aus_absolutism_monarchy:0 "New Absolutism Reforms: Maintain Absolute Monarchy"
je_aus_absolutism_monarchy_reason:0 "Absolutism is the cornerstone of the empire's modernization. Under the absolutist system, our [Concept('concept_ruler','$RULER_TITLE_KAISER$')] will rely on four armies to maintain control: #bold walking army (military force), sitting army (bureaucracy), kneeling army (clergy), and crawling army (secret police)#, rather than the so-called democracy and representative institutions based on principles of division and fragmentation. Only absolutism can bring people together, unify them into a cohesive and influential group, and guide them to the highest levels of culture and civilization. Therefore, #bold during the reform period# we must maintain our #variable monarchical absolutism# unchanged."
finished_absolutism_monarchy_tt:0 "We must maintain the monarchy and dictatorship unchanged for ten years"
je_aus_absolutism_bureaucracy:0 "New Absolutism Reforms: Reorganization and Expansion of the Bureaucracy"
je_aus_absolutism_bureaucracy_reason:0 "Every state reform inevitably needs to be synchronized with the modernization of the corresponding bureaucracy. Therefore, in the 'Austrian Reorganization' plan, bureaucratic innovation and civil service restructuring will be at the center.\nThe goal of bureaucratic reform is to establish a #bold strong administrative system that covers the entire nation and all institutions#.\n\nA modern autocratic system (rather than a cumbersome collegial system) was established, known as the #variable chancellery system#, where departmental heads are only responsible for decision-making. #bold Court Chambers (Hofstellen)# were restructured into modern #bold ministries#, fundamentally establishing the independence of the judiciary from the administrative system. The archaic manorial administrative system, staffed by private officials of estates—obsolete since the early 19th century but widespread throughout the Austrian Empire—was abolished. The path of bureaucratic reform is long, but we must complete it."
je_aus_absolutism_centralization:0 "New Absolutism Reforms: Establish the Provincial System (Statthaltereien)"
je_aus_absolutism_centralization_reason:0 "Reforming local administrative institutions is the core of bureaucratic system reform. In [SCOPE.sCharacter('new_aus_absolutism_landowners_scope').GetFirstName]'s plan, the significant functions of counties were stripped and soon abolished. Before counties were replaced by administrative districts, the official government newly established #bold district governments# and #bold district courts# in each county. This 'top-down' measure greatly enhanced the administrative institutions of the various kingdoms and royal territories of the empire. This is a decisive reform measure because it establishes judicial independence even at the grassroots level, though the results were soon undone by the newly established #bold joint administrative district offices#, which only lasted a short time.\n\n#bold Community laws# regulate the autonomy of #bold community authorities#. The governorates (Gubernia), led by governors (Gouverneur), were transformed into provinces (Statthaltereien) led by #variable provincial governors (Statthalter)#, who are the administrative heads and representatives of the [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. The new administrative and judicial institutions are organized strictly, from the central government and ministries in Vienna, provincial institutions, county institutions, district institutions to community institutions. Subsequently, the attention of the bureaucracy will focus on provincial and district governments, whose significance lies in being closer to the people than the government in Vienna."
finished_aus_centralization_tt:0 "We have established the provincial system nationwide"
je_aus_absolutism_military:0 "New Absolutism Reforms: Reform the Imperial Army"
je_aus_absolutism_military_reason:0 "For a long time, the quality and management system of the empire's army have been in a deplorable state. The overall educational level of the army is low, difficult to train, lacks discipline, and the diversity of languages among the soldiers makes management and coordination extremely difficult. Military reforms will be carried out under the personal leadership of our [SCOPE.sCharacter('new_aus_absolutism_scope').GetFirstName][Concept('concept_ruler','$RULER_TITLE_KAISER$')]. In terms of conscription, in 1852, a two-year #bold mandatory military service# was implemented throughout the empire, with reservists supplementing active troops. Regarding military organization, the 1852 reforms generally fixed company strength at 129 peacetime personnel and 221 wartime personnel; this will bring peacetime regimental strength to 2,830 and wartime strength to 6,886. Significant reforms were also made in the composition of infantry and cavalry. Only a strong army can maintain our interests in Germany and Italy, and we must prioritize it!"
finished_aus_absolutism_tt:0 "The New Absolutism Reforms have concluded"
je_aus_absolutism_advance:0 "We have completed one reform diary entry"
je_aus_absolutism_fail_reason_tt:0 "Losing hegemony in Italy and Germany will lead to the failure of the reforms, and the [Concept('concept_ruler','$RULER_TITLE_KAISER$')] will start restructuring the government, compromising with the liberals"

#宪政改革#####################################################################################################################################################################
je_aus_liberal_reform_main:0 "Imperial Constitutional Reform"
je_aus_liberal_reform_main_reason:0 "[SCOPE.sCharacter('new_aus_liberal_reform_scope').GetFirstName] reluctantly accepted the spell of constitutionalism. Pressured by the constitutionalists, he had no other choice. The #variable 1849 Imperial Constitution (Reichsverfassung—von—1849)#! established a bicameral #variable [concept_aus_reichsrat]#! within the Empire, marking the beginning of the Imperial #variable constitutional reform#!. The constitution was drafted by members of the newly established [concept_aus_liberal], with the majority being Germans. Hence, the constitution was criticized for its #variable strong centralization and Greater German coloration#!. 

#red The road of constitutional reform is long and fraught with challenges. Opposition from minority nationalities, persistent conservatism of [Concept('concept_ruler','$RULER_TITLE_KAISER$')], counterattacks from conservatives, and failures in external wars could all potentially lead to the failure of constitutional reform. #!

aus_liberal_reform_main_tt.1:0 "We must thoroughly reform the Empire under constitutional principles."
je_aus_liberal_reform_economy_and_trade:0 "Imperial Constitutional Reform: Economy and Trade"
je_aus_liberal_reform_economy_and_trade_reason:0 "To demonstrate vitality in the economic field. The government will adopt a policy of laissez-faire in industry and eliminate privileges of vested interests. Regulation of railway construction will be lifted, and the #variable Industrial Decree (Gewerbeordnung)#! effectively abolished guilds. Established by the #variable Rothschild family#! and its allies, the state-supported #variable Credit-Anstalt#! facilitated credit. Our economic liberalization and prudent tax policies will bring rapid economic growth, and sectors like railway transport will gain crucial strategic benefits. 

The existing #variable tariff system#! has hindered the Empire's modernization process, and reforming our tariff system is necessary to promote our trade and allow Austrian products to be sold worldwide!"

je_aus_liberal_reform_democracy:0 "Imperial Constitutional Reform: Expansion of Suffrage"
je_aus_liberal_reform_democracy_reason:0 "For a long time, Austria has been stuck in the opposition to progress. The persistent conservatism of [Concept('concept_ruler','$RULER_TITLE_KAISER$')] has not only damaged its own efforts to lead Germany under Habsburg rule, but also aroused extreme dissatisfaction among the liberals of various ethnic groups within the Empire. 

Constitutionalism has long been the goal of liberals, aimed at achieving equal rights for all ethnic groups, and equality of all citizens before the law. To achieve this goal, it is imperative to allow every member of each ethnic group within the Empire to participate in its politics."

je_aus_liberal_reform_municipal_council:0 "Imperial Constitutional Reform: Empowering Local Councils"
je_aus_liberal_reform_municipal_council_reason:0 "Under the rule of Joseph II, the Empire successfully established a modern bureaucratic system. However, serious defects have quietly emerged during the Metternich era. Since the 1830s, the civil service system has been #variable paralyzed#!: Clearly, the qualification ranking principle implemented to counteract aristocratic mutual protection has not promoted merit-based selection in the civil service system, nor has it prevented the arbitrary nature of hiring procedures and mutual protection among officials.

With the political shake-up after the constitutional reform, we finally have the opportunity to reform our local administrative system. In a series of reforms after the revolution, the noble assemblies of each province were abolished, replaced by allowing the convening of #variable local councils#! across the Empire, albeit with the status of regional councils. Each council will be populated by elected representatives of the masses, hence legitimate and capable of reducing our administrative expenses."

je_aus_liberal_reform_guaranteed_liberties:0 "Imperial Constitutional Reform: Guaranteeing Liberties"
je_aus_liberal_reform_guaranteed_liberties_reason:0 "“#variable The East has always known only one free person (einer—frei); the Greek and Roman worlds knew a few people are free (einige—frei); the Germanic world knew all people are free (alle—frei)!.” Ancient texts remind us that the Germanic people have a long tradition of #variable liberty#!, freedom rooted in the blood of the Germanic people. As the type of Germanic people with the most common enjoyment of freedom, only the Germanic type can stand out from other types in the entire world history region.However, modern absolutist thought from France and absolutist thought from the East have already eroded our traditional values, causing the once powerful Germanic countries to collapse and humiliated by foreign enemies. Only by restoring our #variable glorious tradition of freedom#! can our Empire occupy the heights in thought."

je_aus_liberal_reform_military:0 "Imperial Constitutional Reform: Rebuilding the Imperial Army"
je_aus_liberal_reform_military_reason:0 "For a long time, the quality and management system of the Empire's military have been in an extremely bad state. The overall military education level is low, difficult to train, discipline is relaxed, and the source of troops is diverse, making management and military coordination extremely difficult in other areas.After the revolution ended, due to the conservative nature of the Empire's military, it had already been dissolved after the enactment of the Imperial Constitution and replaced by the #variable National Guard#!.However, the severe external situation made us realize that a highly professional permanent army is necessary. We must now #variable Rebuilding the Imperial Army#! and reforming the military management system and training methods, which will be the greatest guarantee of future imperial security."

je_aus_liberal_reform_success_reason_tt:0 "We completed all 4 of the Imperial Constitutional Reform diary entries" 
je_aus_liberal_reform_fail_reason_tt:0 "Losing Italy and Germanic hegemony will lead to the failure of reform. [Concept('concept_ruler','$RULER_TITLE_KAISER$')] will dissolve a weak and incompetent parliament and recast the country on its own initiative."
finished_liberal_reform_economy_tt:0 "Our GDP has doubled."
finished_aus_liberal_reform_tt:0 "We have completed the Imperial Constitutional Reform."
finished_aus_municipal_council_reform_tt:0 "We have established local councils across the Empire."
je_aus_liberal_reform_advance:0 "We completed one reform diary entry."
je_aus_absolutism_return:0 "Abolish the Constitution"
je_aus_absolutism_return_reason:0 "After the constitution was abolished, [Concept('concept_ruler','$RULER_TITLE_KAISER$')] appointed [SCOPE.sCharacter('new_aus_absolutism_landowners_scope').GetLastName] to lead the Imperial Council of State—a substitute for the incompetent Imperial Parliament—as his advisory body. The dynasty now relies not on tradition and constitution, but on #bold compulsory measures towards subjects#! to maximize Habsburg authority. Economic and fiscal power will replace tradition and precedent as the basis of authority. A modernized administrative system and military will enable this monarchy to defend its rights against other modernized great powers of Europe. The empire faces an urgent mission for modernization and threats from ambitious neighbors; we must lead the empire onto the path of absolutism before it's too late."

finished_aus_absolutism_centralization_return_tt:0 "We have completed the centralization diary."

je_aus_absolutism_centralization_return:0 "Centralization Strengthened"
je_aus_absolutism_centralization_return_reason:0 "The former empire's decentralized administrative structure was a core reason for its weakness, especially financially, as proven by the downfall of the Imperial Parliament. To mobilize the entire nation quickly, urgent adjustments to our local administrative system towards uniformity are necessary. In [SCOPE.sCharacter('new_aus_absolutism_landowners_scope').GetLastName]'s plan, local council autonomy will be abolished, and instead, #bold Governors (Statthalter)#! leading #bold Provinces (Statthaltereien)#! will become the new local administrative units, with Governors serving as chief administrators and representatives of [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. New administrative and judicial structures will be tightly organized and centralized, aiding in improving our finances amidst today's challenging circumstances."

je_october_diploma_municipal_council_reform_tt:0 "We have completed the empowerment of municipal councils diary."

je_aus_october_diploma:0 "Emergency Constitutional Reform"
je_aus_october_diploma_reason:0 "[SCOPE.sCharacter('aus_october_diploma_ruler_scope').GetFirstName] reluctantly accepted the curse of constitutionalism. Faced with a financial crisis, there was no other choice, as Viennese banking groups—many of whom were Jewish—were the only realistic source of funds, but [SCOPE.sCharacter('aus_october_diploma_ig_industrialists_scope').GetFullName] made their position clear: "No constitution, no money." Considering the 'spirit of the times' and the fiscal-political situation, there was indeed no alternative to constitutional rule.

[Concept('concept_ruler','$RULER_TITLE_KAISER$')] turned to German liberals, appointing [SCOPE.sCharacter('aus_october_diploma_ig_landowners_scope').GetLastName] as prime minister. [SCOPE.sCharacter('aus_october_diploma_ig_landowners_scope').GetLastName]'s 'Empowerment Decree' transformed the Imperial Council of State of the Archduke Rudolf of Austria-Hungary into [concept_aus_reichsrat]. This is also considered the beginning of constitutional reform in the empire."

finished_aus_october_diploma_municipal_council_reform_tt:0 "We have completed the empowerment of local councils diary."

je_aus_october_diploma_municipal_council:0 "Empowerment of Local Councils"
je_aus_october_diploma_municipal_council_reason:0 "The October Decree established a conservative federalist scheme, restoring traditional autonomy to Hungary, while other regions of the country were reorganized along similar non-centralized principles. Though the plan failed due to ongoing opposition from the Magyars and German liberals, provisions for indirect election of Imperial Council members through provincial councils appeared later in the February Edict, marking the beginning of decentralized administration in the empire."

je_october_diploma_municipal_council_reform_tt:0 "We have completed the decentralization diary."

sop_austira.16.t:0 "Franz's Vision"
 sop_austira.16.d:0 "With the abdication of Ferdinand I, the young [SCOPE.sCharacter('new_aus_absolutism_scope').GetFullName] has ascended to the throne as the ruler of this ancient empire. This is seen as the Habsburgs' acknowledgment of the necessity of modernization. The new [Concept('concept_ruler','$RULER_TITLE_KAISER$')] combines the traditionalism of Franz I and the so-called liberalism of Joseph II. However, advocates of constitutional reform soon became disappointed. Franz has too much of Joseph II's genuine qualities; he desires modernization but in an absolutist manner."
 sop_austira.16.f:0 "Whether through my careful arrangements or my own self, I have received terrible evaluations and treatments of ingratitude. I dare not even defend my own views, nor do I have the power to promote what I support.\n———— Joseph II"
 sop_austira.16.a:0 "We will continue Joseph II's ideals."
 sop_austira.17.t:0 "The Emperor's Triumph"
 sop_austira.17.d:0 "Under the leadership of [SCOPE.sCharacter('aus_landowners_ig_leader_scope').GetLastName], our [SCOPE.sCharacter('new_aus_absolutism_scope').GetLastName] has completed absolutist reforms with the assistance of the government. Noble privileges and local autonomy have been abolished, and bureaucrats dispatched from the center will strengthen the government's connection with the people to meet their needs. A modernized, unified, centralized "Austrian Empire (österreichischen Kaiserstaat)" has been established. Our strong power will make German and Italian principalities fearful, and allow us to defend our rights when facing other modernized powers in Europe. Joseph II's ideals have been realized, and Austria's success has paved the way for modernization. A new era with new social and economic conditions has dawned, a good time is coming."
 sop_austira.17.f:0 "This country should become the greatest, strongest, most respected and feared country in the world. So for each member of this country, what purpose does the country have for them?\n—— Egon Friedell"
 sop_austira.17.a:0 "Centralize power to accomplish great deeds!"
 sop_austira.18.t:0 "October Declaration"
 sop_austira.18.d:0 "Our failures in foreign and domestic policies have completely undermined the already precarious Habsburg throne. Rebels in various regions of the empire continue to erupt in rebellions, opposing the supreme authority of the throne. To prevent the worst from happening, we must make compromises as soon as possible, at least superficially conceding to the nobles and landlords in Hungary and other regions to ease internal conflicts. The new Minister of Internal Affairs, [SCOPE.sCharacter('intelligentsia_ig_leader_scope').GetFullName], has drafted a manifesto on "amending the constitution." We have to admit that absolutist reforms have actually failed."
 sop_austira.18.f:0 "This is the truth about Josephinism in religious matters that we say. If we reduce it to its essence, Josephinism is just a ghost that passes through this land, wanting to overthrow everything, but only creates a bunch of movements without any results.\n—— Metternich"
 sop_austira.18.a:0 "It has to be this way."
 sop_austira.19.t:0 "Dawn of the Constitutional Empire"
 sop_austira.19.d:0 "With the abdication of Ferdinand I, the young [SCOPE.sCharacter('new_aus_liberal_reform_scope').GetFullName] has ascended to the throne as the ruler of this ancient empire. This is seen as the Habsburgs' acknowledgment of the necessity of modernization. The new [Concept('concept_ruler','$RULER_TITLE_KAISER$')] combines the traditionalism of Franz I and the so-called liberalism of Joseph II.\n\nFranz hoped to govern the country in his own way, but with the conservative defeat in the revolution, the current [Concept('concept_ruler','$RULER_TITLE_KAISER$')] has to share power with the newly established [concept_aus_reichsrat]. Nevertheless, in the coming period, the quarrelsome members within [concept_aus_reichsrat] will decide the future of the country."
 sop_austira.19.f:0 "If I were an American and had the right to choose, then I would support George Washington's old party, which is a conservative party, and wherever I go, I would be a conservative.\n—— Metternich"
 sop_austira.19.a:0 "In Europe, it is a lie (En Europe c’est un mensonge)"
 sop_austira.20.t:0 "The Free Empire, The Free People"
 sop_austira.20.d:0 "With our series of reforms, our empire has now broken the chains of absolutism and established a state of individual freedom, human rights, and constitutional governance. Burke's ideals have been realized, and Austria's success has paved the way for modernization. A new era with new social and economic conditions has dawned, a good time is coming."
 sop_austira.20.f:0 "Europe will be destroyed by the Germans, and will also be revived by the Germans.\n—— Görz"
 sop_austira.20.a:0 "Long live constitutionalism!"
 sop_austira.21.t:0 "Dissolution of [concept_aus_reichsrat]"
sop_austira.21.d:0 "Our failures in foreign and domestic policies have led the imperial government into an unprecedented crisis. People's skepticism towards constitutional order ultimately prompted [Concept('concept_ruler','$RULER_TITLE_KAISER$')] to personally intervene and issue the New Year's Edict (Silvesterpatent) suspending the constitution. Under [Concept('concept_ruler','$RULER_TITLE_KAISER$')]’s orders, the army entered the parliament building and dispersed the members. Now the ineffectual parliament has been abolished, and [Concept('concept_ruler','$RULER_TITLE_KAISER$')] will begin to govern directly, relying on the authority of his bureaucrats, police, and military to enforce his will. At this critical moment for the empire, only [Concept('concept_ruler','$RULER_TITLE_KAISER$')] and his loyal bureaucrats—not the weak and ineffectual representative bodies—can lead the empire out of crisis and towards modernization!"
 sop_austira.21.f:0 "Once the foundation of royal power is changed, it is permanently destroyed.\n—— Metternich"
 sop_austira.21.a:0 "My spirit is always fighting for the future"

je_Austrian_Empire_revolution:0 "Spring of Nations: Austria"
je_Austrian_Empire_revolution_reason:0 "The progress bar displays the current dominance of #variable political factions#. #bold When the countdown ends, the faction in dominance will claim victory#. \n#blue Constitutional faction#: #variable [ROOT.GetCountry.MakeScope.Var('aus_1848_liberal_progress').GetValue|0]# points; changes due to multiple #tooltippable;tooltip:[Country.GetTooltipTag],je_Austrian_Empire_revolution_tooltip_deplete conditions#. \n#variable Conservative faction#: #variable [ROOT.GetCountry.MakeScope.Var('aus_1848_conservative_progress').GetValue|0]# points; changes due to multiple #tooltippable;tooltip:[Country.GetTooltipTag],je_Austrian_Empire_revolution_tooltip_advance conditions#. \n[concept_revolution] Radicalism: #variable [ROOT.GetCountry.MakeScope.Var('aus_1848_radical_progress').GetValue|0]# points; increases based on event options. \nWhen the people of [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] destroyed Prince Metternich's regime, forcing him to shamefully flee abroad. The new #bold liberal government# appointed by [Concept('concept_ruler','$RULER_TITLE_KAISER$')] has been formed and they will take on the responsibility of reforming the nation. However, the revolutionaries are not united internally, and their victory is only credited to the #bold political coalition# of dissatisfied classes with the status quo. Once this coalition cannot be maintained and splits, problems will arise. \n#blue Constitutionalists# consist of moderates within the liberal faction, the main faction within the liberals, advocating for compromise with the government through moderate and peaceful demonstrations and government participation, avoiding a second, more radical [concept_revolution] that would disrupt the empire. \n#red Radicals# advocate for a true people's revolution, but their small numbers force them to temporarily seek an alliance with the moderates, although their disagreements with the moderates will grow as radicalism progresses. \nThe #variable Conservative faction# has not been overthrown; they still control the #bold army# and #bold vast rural areas#, and once peasants get what they want in the uprising, they will return to #bold conservatism#. As long as the [concept_revolution] party is divided, conservatives can recover and use their strong advantages to regain #bold dominance#."
je_Austrian_Empire_revolution_tooltip_advance:0 "The following will #bold increase# the #variable Conservative faction#'s strength#: \n• Suppressing nationalist revolutions \n• Abolishing progressive constitution \n• Suppressing progressive movements and revolutions \n• Refusing to participate in the Frankfurt Conference \n• Abolishing serfdom \n• Alliance with the Tsar \n• Dissolving elected parliament"
je_Austrian_Empire_revolution_tooltip_deplete:0 "The following will #bold increase# the #variable Constitutional faction#'s strength#: \n• Allowing national autonomy \n• Enacting progressive constitution \n• Showing leniency towards progressive movements \n• Participating in the Frankfurt Conference \n• Arbitrary [concept_revolution] progress exceeds #variable 50%#"

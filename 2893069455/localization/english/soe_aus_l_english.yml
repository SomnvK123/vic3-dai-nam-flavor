je_aus_reichsrat: "Imperial Parliament"

 je_aus_reichsrat_reason: "[concept_aus_conservative]: #variable [ROOT.GetCountry.MakeScope.Var('aus_conservative_seat').GetValue|0] seats; the number of seats will change due to multiple #tooltippable;tooltip:[Country.GetTooltipTag],aus_conservative_seat_tooltip_advance conditions during [concept_election].\n[concept_aus_liberal]: #variable [ROOT.GetCountry.MakeScope.Var('aus_liberal_seat').GetValue|0] seats; the number of seats will change due to multiple #tooltippable;tooltip:[Country.GetTooltipTag],aus_liberal_seat_tooltip_advance conditions during [concept_election].\n[concept_aus_socialist]: #variable [ROOT.GetCountry.MakeScope.Var('aus_socialist_seat').GetValue|0] seats; the number of seats will change due to multiple #tooltippable;tooltip:[Country.GetTooltipTag],aus_socialist_seat_tooltip_advance conditions during [concept_election].\n[concept_aus_christian_social]: #variable [ROOT.GetCountry.MakeScope.Var('aus_christian_social_seat').GetValue|0] seats; the number of seats will change due to the following #tooltippable;tooltip:[Country.GetTooltipTag],aus_christian_social_seat_tooltip_advance conditions during [concept_election].\n[concept_aus_national]: #variable [ROOT.GetCountry.MakeScope.Var('aus_national_seat').GetValue|0] seats; the number of seats will change due to multiple #tooltippable;tooltip:[Country.GetTooltipTag],aus_national_seat_tooltip_advance conditions during [concept_election].\n\n#variable [concept_aus_reichsrat] is an important result of the constitutionalization of the empire. The [concept_aus_reichsrat] enjoys most of the legislative power and controls the centralized administrative agencies. The [Concept('concept_ruler','$RULER_TITLE_KAISER$')] holds privileges in military and foreign affairs, but the imperial parliament decides the budget, including the military budget. It is the foundation of the new Austrian government.\nHowever, this parliament is built on a state with #variable a pre-modern social structure and a ruler who resists constitutionalism. The principle of the dynasty never recognizes the sovereignty of the people but insists on the #variable authority of the monarch. Its #bold agricultural and traditional factors are stronger and more difficult to control than in other societies, and the #bold ethnic diversity of the monarchy makes it extremely difficult to develop a sense of mutual advancement and retreat. Its adaptation to the modern world is far from complete. This predestines the parliament to be a battleground of political games and disputes, rather than a harmonious deliberative body.\n\n#variable Some parties believe they represent the people of the empire, some parties believe they represent a certain group, but who can represent the future of the monarchy?#!"
aus_conservative_seat_tooltip_advance: "#bold The following reasons will increase seats monthly:#!\n•#variable Leader ideology is one of modern conservatism, royalism, traditionalism, or trade protectionism with [Concept('concept_interest_group', '$concept_interest_groups$')] clout greater than 10#!\n•#variable The clout of [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant] is significant.\n•#variable The clout of [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant] is significant.\n•#variable The clout of [GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetNameWithCountryVariant] is significant.#!\n\n#bold The following reasons will decrease seats monthly:#!\n•#variable Other parties are increasing their seats.#!"
aus_liberal_seat_tooltip_advance: "#bold The following reasons will increase seats monthly:#!\n•#variable Leader ideology is one of Austrian constitutionalism, radicalism, democracy, or market liberalism with [Concept('concept_interest_group', '$concept_interest_groups$')] clout greater than 10#!\n•#variable The clout of [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant] is significant.\n•#variable The clout of [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] is significant.#!\n\n#bold The following reasons will decrease seats monthly:#!\n•#variable Other parties are increasing their seats.#!"
aus_socialist_seat_tooltip_advance: "#variable This party will be unlocked after researching socialist technology#!\n#bold The following reasons will increase seats monthly:#!\n•#variable Leader ideology is one of social democracy, socialism, communism, or reformism with [Concept('concept_interest_group', '$concept_interest_groups$')] clout greater than 10#!\n•#variable The clout of [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant] is significant.#!\n\n#bold The following reasons will decrease seats monthly:#!\n•#variable Other parties are increasing their seats.#!"
aus_christian_social_seat_tooltip_advance: "#variable This party will be unlocked after researching socialist technology#!\n#bold The following reasons will increase seats monthly:#!\n•#variable Leader ideology is one of ethnic nationalism, chauvinism, fascism, or integralism with [Concept('concept_interest_group', '$concept_interest_groups$')] clout greater than 10#!\n•#variable The clout of [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant] is significant.#!\n\n#bold The following reasons will decrease seats monthly:#!\n•#variable Other parties are increasing their seats.#!"

 aus_national_seat_tooltip_advance: "#bold The following reasons will increase seats monthly:#!\n•#variable Czech cultural population proportion reaches 10%#! (Reforming local councils and federalization will further increase its seats)\n•#variable Polish cultural population proportion reaches 10%#! (Reforming local councils and federalization will further increase its seats)\n•#variable North Italian cultural population proportion reaches 10%#!\n•#variable Slovenian cultural population proportion reaches 10%#!\n•#variable Ukrainian cultural population proportion reaches 10%#!\n#variable The following cultures will only be counted in seats after their territories are federalized#!:\n•#variable Hungarian cultural population proportion reaches 10%#!\n•#variable Croatian cultural population proportion reaches 10%#!#!\n\n#bold The following reasons will decrease seats monthly:#!\n•#variable Other parties are increasing their seats.#!"
concept_aus_reichsrat: "Reichsrat"
concept_aus_reichsrat_desc: "The Imperial Parliament (Reichsrat) is the legislative body of the Habsburg Monarchy. It is a bicameral institution consisting of the Senate (Herrenhaus) and the House of Representatives (Abgeordnetenhaus). According to the imperial constitution, bills must be passed by both houses, signed by the responsible government minister, and then approved by the [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. Members are elected by local parliaments (Landtag) in the provinces. The parliament has extensive legislative powers over all royal territories. However, the appointment and dismissal of the Prime Minister remain the power of the [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. Throughout its existence, the parliament was severely affected by internal conflicts among the empire's numerous constituent nationalities."
concept_aus_conservative: "Iron Ring Alliance"
concept_aus_conservative_desc: "The Iron Ring Alliance is not essentially a political party but an alliance composed of various independent politicians, conservatives, and minority parties. The alliance mainly enjoys the support of the church, the German upper class, and minorities in Cisleithania. Although there are differences among the various factions within the alliance, they generally support conservatism and anti-liberalism in social, economic, and political fields. On national issues, the alliance emphasizes reconciliation and compromise. The alliance has long been the right wing of the parliament."
concept_aus_liberal: "German Liberal Party"
concept_aus_liberal_desc: "The German Liberal Party, also known as the Constitutional Party or the German Constitutional Party, is the largest liberal party in the Imperial Parliament, whose members consider themselves the successors of the 1848 Revolution. In addition to the political liberal ideology, they also advocate anti-clericalism and market liberalism. They try to defend the privileges of German-speaking people in response to the growing national movements of the Slavic minorities in the monarchy. The Liberal Party has long been the left wing of the parliament."
concept_aus_socialist: "Austrian Social Democratic Party"
concept_aus_socialist_desc: "The Austrian Social Democratic Party is a product of the workers' movement, with its main supporters being the left-wing middle class and the working class. The party supports the democratization of politics and the economy, advocates collectivism, and seeks to protect workers' rights, striving to improve the political and social status of the working class. On national issues, it emphasizes universalism. Its radical socialist and republican ideas have become an unstable factor threatening the survival of the empire."
concept_aus_christian_social: " Christian Social Party"
concept_aus_christian_social_desc: "The Christian Social Party originated from the Christian Social Movement that emerged in the mid-to-late 19th century and received support from radical petty bourgeoisie, lower clergy, cultural conservatives, and other anti-liberal groups. The party's main ideologies are anti-Semitism, anti-clericalism, and Catholic social thought. The latter's supra-national values determine the party's supra-national nature, and thus the party does not have a single national identity, relying instead on a common enemy - the Jews - as their fundamental unifying force."
concept_aus_national: "National Party"
concept_aus_national_desc: "Due to the supra-national nature of the Imperial Parliament, many parties representing their national interests also emerged within it, such as the Czech National Party and the Galician Social Democratic Party. Although the ideologies of these parties vary greatly, they all generally seek to represent their national interests, striving for greater autonomy or even independence for their national groups."
status_aus_reichsrat_conservatism: "Majority Party in Parliament: #bold #blue Iron Ring Alliance#! Seats: (#tooltippable #tooltip:[GetRawTextTooltipTag('reichsrat_tension_tt')] #variable [ROOT.GetCountry.MakeScope.Var('aus_conservative_seat').GetValue|0]#!#!#!)#!."
status_aus_reichsrat_liberalism: "Majority Party in Parliament: #bold #yellow German Liberal Party#! Seats: (#tooltippable #tooltip:[GetRawTextTooltipTag('reichsrat_tension_tt')] #variable [ROOT.GetCountry.MakeScope.Var('aus_liberal_seat').GetValue|0]#!#!#!)#!."
status_aus_reichsrat_socialism: "Majority Party in Parliament: #bold #red Austrian Social Democratic Party#! Seats: (#tooltippable #tooltip:[GetRawTextTooltipTag('reichsrat_tension_tt')] #variable [ROOT.GetCountry.MakeScope.Var('aus_socialist_seat').GetValue|0]#!#!#!)#!."
status_aus_reichsrat_nationalism: "Majority Party in Parliament: #bold #variable Christian Social Party#! Seats: (#tooltippable #tooltip:[GetRawTextTooltipTag('reichsrat_tension_tt')] #variable [ROOT.GetCountry.MakeScope.Var('aus_christian_social_seat').GetValue|0]#!#!#!)#!."

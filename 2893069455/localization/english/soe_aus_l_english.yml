je_postwar_aus_administration_reform:0 "Imperial Administrative Reorganization"
je_postwar_aus_administration_reform_reason:0 "It must be admitted that the cumbersome, unpopular, and inefficient administration of the pre-March Revolution era, with its incompetent #variable bureaucratic institutions#! and the #v $aristocrats$#!-dominated #variable local estates#! played a significant role in the grievances that surfaced during the revolution. The old, unreformed administrative institutions pushed for [concept_revolution], just as [concept_revolution] itself generated ever-increasing administrative power.\n\nWith the old feudal order swept away and order restored, the empire finally has the opportunity to act locally. The essential functions of counties (Kreis) as basic local units have been stripped, the ancient hereditary manor administration system abolished, and the control of the #v $aristocrats$#! over local areas shaken.\n\nTo expand the empire's tax base, enhance the efficiency of bureaucratic administration, and ease conflicts between the central and local governments, the imperial central authority will establish a completely new #variable local administrative system#! according to its own wishes. Two options are now before us:\n#bold We can establish a strong local administrative system that covers the entire nation and all institutions, ensuring strong central control through the establishment of provinces.#!\n#bold We can also reorganize local councils to allow greater political participation of the middle and lower classes, thereby saving administrative costs and easing ethnic tensions.#!\n#variable Only by modernizing our administrative system can the monarchy survive in this dangerous world.#!"

je_European_Restoration_tooltip_advance: "The following laws will add 10 points to the progressive law value:\n[GetLawType('law_wealth_voting').GetName]\n[GetLawType('law_right_of_assembly').GetName]\n[GetLawType('law_total_separation').GetName]\n[GetLawType('law_guaranteed_liberties').GetName]\nThe following laws will add 20 points to the progressive law value:\n[GetLawType('law_census_voting').GetName]\n[GetLawType('law_protected_speech').GetName]\nThe following laws will add 30 points to the progressive law value:\n[GetLawType('law_universal_suffrage').GetName]\n[GetLawType('law_state_atheism').GetName]\nThe country being in a [concept_civil_war] will add 20 points to the progressive law value."

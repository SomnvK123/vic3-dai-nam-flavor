je_aus_political_movement:0 "Rise of Mass Movements"
je_aus_political_movement_reason:0 "The progress bar will display the current dominant #variable political trend# influence.\n#blue Anti-Semitism# influence: #variable [ROOT.GetCountry.MakeScope.Var('aus_political_movement_right').GetValue|0]# points\n#red Socialism# influence: #variable [ROOT.GetCountry.MakeScope.Var('aus_political_movement_left').GetValue|0]# points\n\nToday is different from the past. With the expansion of [concept_election], the lower and middle classes are now included in the political life that was previously enjoyed only by the elites. Radical ideas that were once resisted by the elites are finding ground among the lower classes, such as #blue Anti-Semitism# advocated by [concept_aus_christian_social] and #red Socialism# advocated by [concept_aus_socialist]. These two trends are tearing apart the political arena and society of [ROOT.GetCountry.GetAdjective]. We can handle these trends cautiously to avoid stirring up bigger storms, or we can use them to achieve our political goals. In any case, we must accept the fact that mass politics are changing [ROOT.GetCountry.GetAdjective]."

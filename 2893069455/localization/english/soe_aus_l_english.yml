 ai_aus_rebuilt:0 "战后重建（ai）"
 #事件链#############################################################################################################################################################################
sop_austira.1.t:0 "Destiny of Greater Austria"
sop_austira.1.d:0 "Given Vienna's dominant position in German affairs, we have managed to unify the German states into a single German nation, permanently defeating the Prussians and incorporating their kingdom into the German Empire.\nThe unified Greater Germany will undoubtedly be the most powerful force in all of Europe. To appease other great powers, the terms of the Vienna Treaty grant limited sovereignty to all non-German territories formerly part of the Austrian Empire, which also helps to appease nationalist separatist movements."
sop_austira.1.f:0 "A unified Germany is absolutely necessary,\nboth internally and externally.\n— Heinrich Heine"
sop_austira.1.a:0 "Long live Germany!"
sop_austira.2.t:0 "Completion of Emperor Ferdinand's Railway"
sop_austira.2.d:0 "Finally, after substantial investment, Emperor Ferdinand's railway has been completed. In March 1837, the first six locomotives arrived from George Stephenson's factory in Newcastle and Taylor's company in Wellington, dismantled and shipped by boat to Trieste, then transported by horse-drawn carriage across the Semmering Pass to Vienna. An expert from Stephenson's factory, two British train drivers, and four mechanics were responsible for training Austrian staff on a test route in Prater, Vienna. Carl Grundmann became the first Austrian locomotive driver on the Northern Railway in 1838, also the first German-speaking driver in the monarchy. Test runs were conducted between Floridsdorf and Wagram, a 13-kilometer route, on November 13, with further trials on November 19 and 23."
sop_austira.2.f:0 "Invitations for this journey were distributed to the noble. The beautiful locomotive 'Austria' from Stephenson's art studio in Newcastle, pulling eight carriages (five first-class carriages accommodating 18 people, and three second-class carriages accommodating 24 people), traveled rapidly along the tracks. His Royal Highness Archduke Karl, along with his esteemed children, Grand Duke Wilhelm and Grand Duchess Maria Carolina, had the honor of participating in this journey.\n— Franz Carl Weidmann"
sop_austira.2.a:0 "This is Austria's first railway!"
sop_austira.3.t:0 "Political Struggle between Metternich and Kolowrat"
sop_austira.3.d:0 "After the death of Franz I, the position of [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName], lacking the protection of the [Concept('concept_ruler','$RULER_TITLE_KAISER$')], has already been weakened. His authority is now under challenge by the Minister of Finance, [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]."
sop_austira.3.f:0 "After Franz I's death, [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName] has become theoretically the head of the imperial government. But without the protection of the [Concept('concept_ruler','$RULER_TITLE_KAISER$')], he cannot act independently without the help of allies. His authority is now challenged by the powerful block of the Imperial Family, not to mention his main domestic opponent: the Bohemian [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]. He has effectively become the head of the #bold State Council and the owner of all state officials' hiring and their destiny (through the control of [GetLawType('law_secret_police').GetName]) and in this position, he is also a decisive speaker in the meeting. He used the departments he controlled and openly and without any regard served all the policies of the #bold Bohemian nobility#. As far as the new project for state development was concerned, [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName] failed to carry out its obstruction and interest.",
sop_austira.3.a:0 "By character and habit, I am a builder (Je suis par caractère et par habitude constructeur)"
sop_austira.4.t:0 "Anti-Metternich Coup!"
 sop_austira.4.d:0 "The Bohemian faction, together with the Habsburg monarchy, ended [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]'s position as President of the State Council through a minor coup, greatly reducing [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]'s authority."
sop_austira.4.f:0 "Following [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]'s recent proposal for major reforms in the State Council to strengthen his own position and significantly weaken [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]'s power in the council. [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName] reacted immediately and managed to rally Archduke Johann and much of the royal family against Metternich, attempting to overturn the legally approved reform plan, even if it resulted in a minor coup. Originally, [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName] was supposed to lead both institutions and all affairs - whether domestic or foreign - were to go through him. The current decision, however, is that finances, internal affairs, and highest police must all go through [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName], and he decides which topics can be discussed in the State Council, thus bypassing [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName] and allowing it to be submitted directly to the actual chairman of the State Council, [SCOPE.sCharacter('old_aus_absolutism_army_scope').GetFirstName]. [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName] is now able to comment and make decisions on any issue, while [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]'s authority is limited to foreign affairs."
sop_austira.4.a:0 "“I occasionally govern Europe, but never Austria.”"
sop_austira.5.t:0 "Eichhof's Downfall!"
sop_austira.5.d:0 "[SCOPE.sCharacter('old_aus_absolutism_industrialists_scope').GetLastName] is the leader and backbone of the entire Kolowrat party. Without [SCOPE.sCharacter('old_aus_absolutism_industrialists_scope').GetLastName], [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName] will lose support and become isolated. To bring him down, Metternich incited Archduke Ludwig to scrutinize his business practices and fired him with the amount of unresolved debts caused during the 1840 European crisis and the serious disproportion between circulating notes and metal support."
sop_austira.5.f:0 "The Bohemian stories are harbingers and must be suppressed. The way to do this is to make them go away. Eichhof is a malignant wound, and now he is a scab. He's finished! You have to go in resolutely, and we will definitely get the best results. \n———Kubek"
sop_austira.5.a:0 "A heavy blow to the Bohemians!"
sop_austira.6.t:0 "Imperial Parliament Convenes"
sop_austira.6.d:0 "After countless days of autocratic oppression, the fruits of constitutionalism—[concept_aus_reichsrat]—have finally been convened under the benevolence of [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. In a world where the voice of popular sovereignty is increasingly dominant, this may be the only remedy to save the monarchy. Now, our [concept_aus_reichsrat] will hold its first [concept_election]. Which party will dominate the new parliament?"
sop_austira.6.f:0 "As the main process is the result of social development, a progressive community controlling significant political power must at the same time protect the country from the atrocities of the main force. The main force, no matter where and when it takes over, must be immediately suppressed.\n———Erasmus May"
sop_austira.6.a:0 "[concept_aus_liberal] has won a majority in [concept_election]"
sop_austira.6.b:0 "[Concept('concept_ruler','$RULER_TITLE_KAISER$')] favors a political alliance of [concept_aus_conservative] and [concept_aus_national]"
aus_reichsrat_open_tt1:0 "[concept_aus_conservative] gained 180 seats\n[concept_aus_liberal] gained 300 seats\n[concept_aus_national] gained 160 seats"
aus_reichsrat_open_tt2:0 "[concept_aus_conservative] gained 240 seats\n[concept_aus_liberal] gained 200 seats\n[concept_aus_national] gained 100 seats"
sop_austira.7.t:0 "Rise of Mass Movements and Popular Parties"

 sop_austira.7.d:0 "The expansion of political space and modernization has greatly altered the political atmosphere within [SCOPE.GetRootScope.GetCountry.GetNameNoFlag]. With the widening of suffrage, the relatively lower middle class and even the working class have been incorporated into political life. This has allowed more radical political ideas and parties to find a market among the lower masses, leading to the rise of mass movements and popular parties. One of the most notable among them is the Christian Social movement led by [concept_aus_christian_social], which is widely welcomed among the lower and middle-class Catholics due to its strong anti-Semitic tendencies.\nIn contrast, there is the [SCOPE.GetRootScope.GetCountry.GetNameNoFlag] labor movement led by [concept_aus_socialist], which also holds a collectivist ideology but inherits liberal universal humanitarianism, seeing Jewish individuals as equal members of the movement.\nRegardless, these emerging political movements are tearing apart [SCOPE.GetRootScope.GetCountry.GetNameNoFlag]'s society, and their future impact on the monarchy's politics remains to be seen."

sop_austira.7.f:0 "Liberal values have been replaced by a narrow nationalist worldview, which is also detrimental to Jewish integration. As conflicts between nationalisms intensify, divisions become more absolute. Due to pseudo-Darwinian biological theories replacing ethnic concepts with racial ones, the position of Jews becomes increasingly insecure. Once considered a tolerated but low-status minority, they are now seen as a foreign race liable to expulsion or extinction.\n———Wenzler"

sop_austira.7.a:0 "The era of elite politics is gone forever"

sop_austira.7.b:0 "I told you expanding suffrage was a bad idea. It's time to revert back."

sop_austira.8.t:0 "In the [SCOPE.sState('aus_political_movement_labor_state').GetName] Labor Movement"

sop_austira.8.d:0 "Workers at [SCOPE.sBuilding('aus_political_movement_labor_workplace').GetName] are discontented with long-standing harsh conditions and low wages. They have collaborated with the local [concept_aus_socialist] organization to launch a strike in [SCOPE.sState('aus_political_movement_labor_state').GetName]."

sop_austira.8.f:0 "New unions emerged constantly, which give the international workers association a popular base. Just by the Austrian figures, it is sufficient to show that in Vienna, the followers of the International Workers' Association reportedly increased from 10,000 in 1869-1872 to 35,000; in the Czech Republic, from 5,000 to about 17,000; in Styria and Carinthia, from 2,000 to only Styria alone had about 10,000. Using the standard of the day, these figures are not very much, but they represent a much larger mobilization power than the numbers indicate.\n———Hobsbawm"

sop_austira.8.a:0 "Support for the actions taken by workers for their legitimate rights"

sop_austira.8.b:0 "It's lawlessness, get the police to disperse them!"

sop_austira.9.t:0 "Anti-Jewish Activities in [SCOPE.sState('aus_anti_jewish_state').GetName]"

sop_austira.9.d:0 "A group of Catholic lower clergy from [SCOPE.sState('aus_anti_jewish_state').GetName] initiated a street movement against Jews under the organization of [concept_aus_christian_social], holding anti-[SCOPE.sReligion('aus_anti_jewish_religion').GetName] slogans and assaulting any passerby dressed similarly to Jews."

sop_austira.9.f:0 "Much of the anti-Semitism is fueled by jealousy among the broader Catholic population, who find it difficult to accept that Jewish individuals, considered base in Christian theology, can legitimately enjoy the fruits of the new economic prosperity. In addition, while so many Christians suffer, Jewish success is seen as violating an unwritten contract that the liberation of Jews will bring prosperity to all. The end of prosperity, the end of liberal rule, severely damages the social status of Jews.\n———Wenzler"

sop_austira.9.a:0 "Turning a blind eye to their actions"

sop_austira.9.b:0 "They've gone too far, get the police to stop them"

sop_austira.10.t:0 "Debate at [SCOPE.sState('aus_political_movement_university_scope').GetName] University"

sop_austira.10.d:0 "A fierce political debate erupted at [SCOPE.sState('aus_political_movement_university_scope').GetName] University, dividing students into two factions: those supporting anti-Semitism and those supporting socialism. They argue relentlessly to refute each other's viewpoints, sometimes escalating into violent clashes."

sop_austira.10.f:0 "Universities have always been vanguards of emerging political viewpoints, where even the most extreme ideologies find fertile ground. Supporters of different ideologies easily create divisions, leading to the formation of exclusive campus communities. Conflict between these communities may even escalate to violence."

sop_austira.10.a:0 "Supporters of socialism make sense"

sop_austira.10.b:0 "Supporters of anti-Semitism make sense"

sop_austira.10.c:0 "Separate them until both sides calm down"

sop_austira.11.t:0 "Victory is king"

sop_austira.11.d_1:0 "Under the leadership of [concept_aus_socialist] in [SCOPE.gsInterestGroup('aus_political_movement_trade_unions_scope').GetName], socialism has become the dominant ideology in [ROOT.GetCountry.GetName], and in the years to come, socialist principles will profoundly influence the political scene of [ROOT.GetCountry.GetAdjectiveNoFormatting]."

sop_austira.11.d_2:0 "Under the leadership of [concept_aus_christian_social] in [SCOPE.gsInterestGroup('aus_political_movement_petty_bourgeoisie_scope').GetName], the Christian Social movement has become the dominant ideology in [ROOT.GetCountry.GetName], and in the years to come, the principles of the Christian Social movement will profoundly influence the political scene of [ROOT.GetCountry.GetAdjectiveNoFormatting]."

sop_austira.11.f_1:0 "In the past, if anyone called a skilled craftsman a worker, he would argue with you ... Nowadays people tell craftsmen that being a worker is the highest title in the country, so craftsmen say they want to be workers.\n——Sir Meister"

sop_austira.11.f_2:0 "Anti-Semitism is more important to the Christian Social Party than to nationalists, because the Christian Social Party lacks its own national identity as a support, only what they oppose - Jews - as their unity. Even authoritarianism is not a unifying factor, because many of their supporters, especially supporters of Vienna, take an anti-authoritarian stance. This is why the party is called "Christian" rather than "Catholic" - in the context of the time, "Christian" means "non-Jewish." Anti-Semitism is the core essence of the Christian Social Party."

sop_austira.11.a:0 "To strengthen the power of [SCOPE.gsInterestGroup('aus_political_movement_trade_unions_scope').GetName]"

sop_austira.11.a2:0 "To fight the power of [SCOPE.gsInterestGroup('aus_political_movement_petty_bourgeoisie_scope').GetName]"

sop_austira.11.b:0 "To strengthen the power of [SCOPE.gsInterestGroup('aus_political_movement_petty_bourgeoisie_scope').GetName]"

sop_austira.11.b2:0 "To fight the power of [SCOPE.gsInterestGroup('aus_political_movement_trade_unions_scope').GetName]"

sop_austira.12.t:0 "Dust Settles"

sop_austira.12.d_1:0 "With our growing influence in the palace, we can now expel the faction of [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName] at one go. The edict has been prepared, and the losers will be sent abroad to our embassies in other countries - so they won't meddle in our policies anymore. A new era belonging to [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName] is about to begin. However, the masses outside the palace do not yet understand the changes inside. Once we spread the news, it will inevitably trigger a series of chain reactions - which may not be in our favor. Should we spread the news of [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]'s downfall?"

sop_austira.12.d_2:0 "With our growing influence in the palace, we can now expel the faction of [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName] at one go. The edict has been prepared, but this does not mean that [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName] has completely fallen. They still receive support from the liberal masses outside the palace, which means [SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName] could rally and turn the tide through a mass movement. The empire stands at a historical crossroads, and only the flag bearer can decide its future."

sop_austira.12.f_1:0 "For the deliberate lie, and for the ignorance that did not even start the process, I regret it.\n——Emperor Franz I"

sop_austira.12.f_2:0 "Regarding the relationship between the past and the future, he revealed that he is not a 'restorationist'. He asserted that the past is important because it can provide warnings for the future. For him, today is only valuable as a preparatory stage for the coming day. He is working for tomorrow: his spirit is always striving for the future."

sop_austira.12.a:0 "Block the news"

sop_austira.12.a1:0 "Release the news (revolution)"

sop_austira.12.b:0 "It's time to end political stagnation and reform the government thoroughly"

sop_austira.12.b1:0 "We haven't lost yet, launch a mass movement to oust [SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]! (revolution)"

sop_austira.13.t:0 "Conservative coup!"

sop_austira.13.d:0 "Our reforms to ease domestic tensions have exceeded the limits that conservative can tolerate, and for this conservative movement has taken control, the overthrow of reformers and the abolition of a large number of progressive reforms, we need to take the next steps forward carefully."

sop_austira.13.f:0 "The principle of orthodoxy is defended."

sop_austira.13.a:0 "Huh, want to progress?"

sop_austira.14.t:0 "Italian Confederation!"
sop_austira.14.d:0 "After years of cultivation in Italy, [ROOT.GetCountry.GetAdjective] has finally re-established its hegemony in Italy. To further consolidate our hegemony in Italy and to appease the nationalists, we have decided to establish an Italian Confederation to strengthen the ties between the various states of Italy. The newly established confederation council demands that we send a king to them. Now we have two choices before us, who will be the new master of the Italian Confederation?"

sop_austira.14.f:0 "The long history, social, cultural, and economic vitality, and diversity have shaped the people and land of Italy in various ways. The reality of Italy is undoubtedly very complex, and forcing unity would impoverish and humiliate Italy."

sop_austira.14.a:0 "Caesar's brother Maximilian"

sop_austira.14.b:0 "Ferdinand IV of the Tuscan branch will serve as king"

sop_austira.15.t:0 "Galicia Exchange Agreement"

sop_austira.15.d:0 "From [SCOPE.sCountry('ger_scope').GetName], we have received an agreement allowing us to exchange Galicia territory held by them in exchange for allowing Polish autonomy. This will not only strengthen our power but also improve our relations with [SCOPE.sCountry('ger_scope').GetName], enabling us to better confront the British. Should we agree to sign this agreement?"

sop_austira.15.f:0 "All historical connections and hatred between Polish and Ukrainian ethnic groups are born on this land, Galicia."

sop_austira.15.a:0 "Good proposal, we accept!"

sop_austira.15.b:0 "Polish autonomy? Are you kidding? We will take Galicia with our own swords!"

sop_austira.22.t:0 "Completion of the Vienna Ringstrasse"

sop_austira.22.d:0 "After years of effort by our designers and workers, we have finally completed the construction of the Vienna Ringstrasse. Undoubtedly, it has now become the brightest jewel in Europe."

sop_austira.22.f:0 "Although there is no central planning, this project has been rated as very successful in the past and present. The Ministry of the Interior had the greatest influence on planning, especially Franz von Matsinger. His urban expansion fund provided funding for the project, so there was always an opportunity to participate in planning. The Urban Expansion Fund funded the expansion of Neubau, the Hofburg Palace to Michael Square, the Opera House, the Castle Theatre, and the Museum of Art History and Natural History. At the expense of the national budget, universities and several university-affiliated buildings, several trade and secondary schools, the Academy of Fine Arts, the Austrian Museum of Art and Industry, the Parliament House, the Palace of Justice, barracks, and several postal buildings were built. The Vienna City Government paid for the City Hall, several elementary and civic schools, and some market halls. Donations churches, stock exchanges, several theaters, many bank buildings, and hotels, of course, as well as many apartment buildings were privately funded."

sop_austira.22.a:0 "Eternal Vienna!"

aus_struggle_for_power_winner_intelligentsia_tt:0 "Under the leadership of Koroflard, the Empire will embark on a bright new era of enlightened authoritarianism."

aus_struggle_for_power_winner_landowners_tt:0 "Under the leadership of Metne, the Empire will undergo thorough reform of the existing bureaucratic system."

galicia_exchange_tt:0 "Our Russian Poland and Galicia will be reorganized into a new congress Poland kingdom."

Italy_confederation_tt:0 "With the exception of Istra and South Tyrol, all other territories and vassals in Italy will be annexed."

coup_event.1.tt:0 "The reform failed, but perhaps reform isn't the only way out?"

habsburg_formed_germany:0 "We successfully unified Germany."

habsburg_not_candidate:0 "We lost the leadership of German unification."

1848_austria_events.1.t:0 "[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] Revolution"


1848_austria_events.1.d:0 "After news of the [SCOPE.sCountry('fra_scope').GetName] revolution's victory spread, uprisings erupted across Europe, including throughout [SCOPE.sCountry('aus_scope').GetName]. In Lower Austria, on March 3, 1848, the intelligentsia held a rally in Vienna, demanding the establishment of a 'more patriotic and enlightened representative body' through elections, and calling for the resignation of conservative Prime Minister and Foreign Minister [SCOPE.sCharacter('landowners_leader_scope').GetLastName] Prince. On March 13, a revolutionary movement and street barricades occurred; citizens and university students spontaneously organized the National Guard and academic corps to confront the [SCOPE.sCountry('aus_scope').GetName] army. In order to calm the public mood, [Concept('concept_ruler','$RULER_TITLE_KAISER$')] was forced to dismiss [SCOPE.sCharacter('landowners_leader_scope').GetLastName] from the prime ministership, and the next day [SCOPE.sCharacter('landowners_leader_scope').GetLastName] fled to England in disguise. Faced with a unified revolutionaries, the imperial government had to make concessions. The cabinet led by Count [SCOPE.sCharacter('intelligentsia_leader_scope').GetLastName] of the intelligentsia has now taken over power, but their future actions in [SCOPE.sCountry('aus_scope').GetName] remain uncertain."

1848_austria_events.1.f:0 "[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] seemed enchanted, the entire direction of things changed... [GetLawType('law_secret_police').GetName] disappeared from the streets. Bookstore windows were filled with banned books—these banned books seemed like long-hidden criminals. Young boys hawked speeches, poems, and prints about the [concept_revolution] throughout the city; they were the first works of press freedom. Meanwhile, armed citizens formed the National Guard, marching side by side with the regular army, defending public safety together. —Steyr"

1848_austria_events.1.a:0 "What is tough to be cast, turned into soft"

new_Liberal_party_tt:0 "[Concept('concept_ruler','$RULER_TITLE_KAISER$')] will appoint a liberal cabinet."

1848_austria_events.2.t:0 "Pillersdorf Constitution"

1848_austria_events.2.d:0 "To appease the restless liberals, our Minister of the Interior, Baron Pillersdorf, issued the first Imperial Constitution since the 1848 revolution on April 25, 1848, known as the Pillersdorf Constitution (Pillersdorfsche-Verfassung), also known as the April Constitution. It calls for a bicameral system, consisting of an elected House of Representatives and a Senate, known as the Imperial Council (Reichsrat). Once the constitution is approved, it will pacify the angry populace. Shall we decide to temporarily approve this constitution until the convocation of the constitutional assembly?"

1848_austria_events.2.f:0 "Once the narrative of royal power changes, it will be permanently destroyed. Today, these mobs dare to use the constitution to tie down our [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. Tomorrow, they might even storm the palace. We cannot let them succeed. Prince Schwarzenberg of the conservatives began his speech, but was soon interrupted by a series of questions from the moderate Baron Weissenberg, such as how to deal with the angry masses when the capital's army is incapacitated and the revolutionaries control the National Guard; and how to handle the riots that have erupted nationwide after rejecting the constitutional. The two sides argued incessantly, but time was running out. People inside and outside the palace were waiting for their response."

1848_austria_events.2.a:0 "There is no time to hesitate now, approve the constitution immediately."

1848_austria_events.2.b:0 "As long as we can keep, even if we invent tradition"

1848_austria_events.3.t:0 "Prague Revolution"

1848_austria_events.3.d:0 "The situation in Prague is on the verge of chaos due to the turmoil in Vienna! Our military commander in Czech, General [SCOPE.sCharacter('army_leader_scope').GetFirstName], has returned to Prague to try to control the situation, and has developed corresponding operational plans in response to the possibility of street fighting in Prague. Currently, the situation in Prague is very grim. Should we approve General [SCOPE.sCharacter('army_leader_scope').GetFirstName]'s plan to suppress Prague, or should we compromise with the Czechs?"

1848_austria_events.3.f:0 "As the Czech separatist movement in Prague intensifies, radical Czech students have also organized the 'Slavic Alliance' in response to German nationalism, with the slogan 'freedom, equality'. The alliance has also established military groups, preparing for armed uprisings. To calm the public mood, Count Thun, chairman of the local council, announced the convening of a Czech parliament and parliamentary elections. However, when news of the Vienna May uprising victory came, to prevent the situation from getting out of control, he announced the establishment of a temporary Czech government on May 30, under the proposal of the Czech democrats. The newly formed interim government declared its continued allegiance to [Concept('concept_ruler','$RULER_TITLE_KAISER$')] of Austria and refused to recognize the new government formed after the Vienna May uprising. The establishment of the interim government has caused dissatisfaction among some liberals, who have formed their own committees and established close ties with Vienna insurgents, while also absorbing a large number of Czech workers, artisans, and peasants, preparing for an uprising."

1848_austria_events.3.a:0 "It's time to remind the Czechs of Jan Hus's fate"

1848_austria_events.3.b:0 "I don't want to be the second person thrown out the window"

1848_austria_events.4.t:0 "Constitutional Assembly Convenes"
1848_austria_events.4.d: "In the first week of March 1849, the Kremsier Constitution was completed. It featured numerous liberal and progressive reforms, including the establishment of a constitutional monarchy, the creation of an elected parliament, and equal status for all nationalities under the benevolent Habsburg monarchy. However, many provisions of the Kremsier Constitution contradict our orthodox principles, particularly the principles of popular sovereignty, which are deeply objectionable. There is an alternative: the March Constitution, edited by Interior Minister Wessenberg, is more conservative in its ideals and content, better suited to the needs of our enlightened Habsburg monarchy. Now, should we respect the will of the parliament and recognize the Kremsier Constitution, or should we choose the more conservative March Constitution in consideration of orthodox principles?"

1848_austria_events.4.f: "The first elected Imperial Diet was elected in June and convened in July. The Imperial Parliament initially met in Vienna but later relocated to Kremsier to avoid Vienna's martial law after the Vienna uprising."

1848_austria_events.4.a: "Approve the Kremsier Constitution"

1848_austria_events.4.b: "Replace it with the March Constitution"

1848_austria_events.5.t: "Issue of Serfdom"

1848_austria_events.5.d: "Since the beginning of the revolution, the issue of serfdom has been a focal point of parliamentary debate. For liberals, abolishing serfdom helps realize their ideals of an enlightened society. For conservatives, abolishing serfdom can appease peasant discontent and shift their allegiance towards conservatism, thereby strengthening conservative power. Although resolutions for land reform have been passed, the practical implementation remains debatable. We must choose"

1848_austria_events.5.f: "On July 24, the young [SCOPE.sCharacter('aus_rural_folk_ig_leader_scope').GetFirstName] became the youngest representative in the Imperial Parliament. The day after his election, [SCOPE.sCharacter('aus_rural_folk_ig_leader_scope').GetLastName] eagerly proposed a bill hoping to completely liberate the monarchy's peasants from serfdom. This bill eventually earned him the title of 'Liberator of the Peasantry'. Although [SCOPE.sCharacter('aus_rural_folk_ig_leader_scope').GetLastName] did not eliminate all remnants of serfdom, the bill was successful in taking a significant step forward for the monarchy in this direction. The law was finalized on September 1, 1848, freeing peasants from the jurisdiction of lords, and the government would share half the redemption costs of corvée, glebe and labor duty for the peasants under their control. [Concept('concept_ruler','$RULER_TITLE_KAISER$')] formally signed the law on September 7, freeing the peasants from [GetLawType('law_serfdom').GetName]."

1848_austria_events.5.a: "The good days of the masters are over"

1848_austria_events.5.b: "To win over old farmers, I'll endure more hardship"

1848_austria_events.6.t: "Invitation from the Frankfurt Conference"

1848_austria_events.6.d: "The German National Assembly, located in the Free City of Frankfurt on the Main, has invited us to attend the conference. As a gesture of goodwill, our Archduke Johann has been elected as the temporary leader of the empire. Should we accept their invitation and send representatives to the conference?"

1848_austria_events.6.f: "After the revolutionary victories in Vienna and Berlin, there naturally arose the question of convening a congress of all German delegates. In Heidelberg, Grand Duchy of Baden, a group of liberals planned to elect a German National Assembly. The outline of this assembly was confirmed on March 31 in the St. Paul's Church in the Free City of Frankfurt, with members of the assembly demanding free elections for a national parliament and gaining unanimous consent from all German states. This institution is known as the German National Assembly on the Main River in Frankfurt. Should we attend?"

1848_austria_events.6.a: "We are proud members of Germany, and we will go!"

1848_austria_events.6.b: "I don't want to listen to those bookworms!"

1848_austria_events.7.t: "Siege of [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]"

1848_austria_events.7.d:0 "The imperial government's vague stance on constitutionalism did not satisfy the #red radicals#!, and the conflict between the two sides intensified. As the imperial government began to gather troops in the capital, realizing the impending suppression, the #red radicals#! launched a desperate revolution alone in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]. Due to a lack of manpower and opposition from the constitutionalists, they were no match for the well-equipped imperial army. After several days of fierce fighting, [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] was recaptured by us, and the main leaders were arrested. Now we will decide their fate."

1848_austria_events.7.f:0 "As the army was preparing to leave [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] to suppress the Hungarian rebellion, a group of workers, students, and mutinous soldiers sympathetic to the Hungarians attempted to prevent the army from departing. The incident escalated into street fighting, with bloodshed occurring at St. Stephen's Cathedral. Austrian Minister of War #yellow Theodor Franz#! was lynched by the mob. The city defense commander Adolf was forced to evacuate the entire city, but he and the army entrenched themselves in a stronghold outside the city. On October 7th, the [Concept('concept_ruler','$RULER_TITLE_KAISER$')] fled to Olomouc with the court under the protection of [SCOPE.sCharacter('army_leader_scope').GetFirstName]. Two weeks later, the Imperial Parliament moved to Kroměříž. On October 26th, under the command of General [SCOPE.sCharacter('army_leader_scope').GetFirstName] and #yellow Count Josip Jelačić#!, Austrian and Croatian troops began bombarding [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName], and on the 31st, they captured the city center. After the battle, except for Bem who successfully escaped, all the uprising leaders, including #yellow Robert Blum#!, were captured by the imperial government. In subsequent trials, they were all sentenced to death by the imperial government."

1848_austria_events.7.a:0 "Execute them all! Leave none alive!"

1848_austria_events.7.b:0 "Exile them is enough."

1848_austria_events.8.t:0 "The Imperial Parliament Dissolved"

1848_austria_events.8.d:0 "After the October Revolution broke out in Vienna, the Imperial Parliament had moved to Kroměříž to avoid the martial law in Vienna. However, with the liberal movement suppressed, the parliament, sustained by the mass movement, lost its political foundation. Prime Minister Prince Schwarzenberg has requested the Emperor to end this farce. Now, the fate of the parliament is in our hands. Should we dissolve it once and for all, or allow it to exist symbolically?"

1848_austria_events.8.f:0 "Who are these cabinet members? They are not the Austrian government! Austria now exists only in my camp; my army and I are Austria. When we defeat the Italians, we will reclaim the empire for the Emperor! — Radetzky"

1848_austria_events.8.a:0 "These useless talkers should have been kicked out long ago."

1848_austria_events.8.b:0 "Let them stay and argue, no one will listen to them anyway."

1848_austria_events.9.t:0 "Liberal Cabinet Falls Again"

1848_austria_events.9.d:0 "Due to the public's distrust of the current government, our liberal government is once again facing the crisis of collapse. Should we try to save the current government or appoint a new one?"

1848_austria_events.9.f:0 "During the Revolution of '48, due to political turmoil and fierce factional struggles, the newly established liberal governments were usually very short-lived: from March to November, Austria had a total of five short-lived liberal governments."

1848_austria_events.9.a:0 "Save the current government."

1848_austria_events.9.b:0 "If they don't change their mind, change the people!"

1848_austria_events.10.t:0 "Liberal Movement Splits"

1848_austria_events.10.d:0 "The seemingly united revolutionary faction has begun to show cracks. Some liberal nobles and intellectuals are satisfied with the existing constitutional order, creating opposition with the more radical students and workers. The imperial parliamentary elections held between June and July resulted in conservative and moderate liberal representatives winning the majority of seats. The radicals, lacking the support of voters who met the wealth standards, lost the election, exacerbating internal divisions within the revolutionary faction. In any case, the revolutionary faction is now practically divided."

1848_austria_events.10.f:0 "The victory of the March Revolution was the result of the union of progressive classes. While such union is always a necessary condition for any revolution to some extent, it cannot last long—this is the fate of all revolutions. Once the common enemy is defeated, the victors will split into different camps and fight each other."

1848_austria_events.10.a:0 "Find ways to mend the split."

1848_austria_events.10.b:0 "Leave these revolutionaries alone, they will collapse on their own."

1848_austria_events.11.t:0 "Labor Leaders Arrested"

1848_austria_events.11.d:0 "Workers' movements have been emerging one after another since the March Revolution. Recently, our National Guard arrested several labor leaders who were plotting an uprising during a raid and handed them over for trial. Now, what should we do with them?"

1848_austria_events.11.f:0 "The success of the revolution did not bring any substantial benefits to the working class—economic conditions did not improve, unemployment and inflation worsened, and small and medium-sized enterprises were on the brink of bankruptcy. All these factors made the subsequent labor movement more radical, with workers seeking more radical political and social reforms, conflicting with the liberals' goal of limited political reform. After the success of the March Revolution, the newly established National Guard was immediately used to suppress the ongoing labor movements, while the Academic Legion and the Safety Committee remained silent."

1848_austria_events.11.a:0 "Let them spend the rest of their lives in exile!"

1848_austria_events.11.b:0 "No problem, let them learn their lesson in the next life."

1848_austria_events.12.t:0 "Student Movement"

1848_austria_events.12.d:0 "After the abolition of the censorship system, student movements in major cities of the empire have become rampant. The imperial government has repeatedly tried to ban these student organizations but failed. During a recent demonstration, we arrested several riotous students. However, the police are at a loss on how to deal with them. If we imprison them, we will inevitably incur the displeasure of the central committee of the academy. If we let them go, it may exacerbate the current turmoil. The choice is in our hands."

1848_austria_events.12.f:0 "'Disperse the crowd! Arrest a few ringleaders.' 'Then what?' dissatisfied policemen loudly retorted in the noisy and chaotic streets, 'What does the central committee of the academy say? Are we going to arrest them just to release them? What is the point of arresting them?!' 'Gentlemen, the government tried to ban these student organizations but failed, and then they passed the burden to us. But...we can also pass the choice to the higher-ups, let those officers decide how to deal with the students!'"

1848_austria_events.12.a:0 "I'm already overwhelmed, I don't care about the student committee!"

1848_austria_events.12.b:0 "Student committee? Imprison them! I don't care!"

1848_austria_events.13.t:0 "Conflict Between German Nationalists and Slavic Nationalists"
1848_austria_events.13.d:0 "Although both ideologies are against our Empire's pluralist policies, we can choose to support one side, let them fight each other, and then capture them when they are weakened by internal conflict. Should we support the German nationalists or the Slavic nationalists?"
1848_austria_events.13.f:0 "After the revolution broke out in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName], Pan-Slavism has been spreading among revolutionaries in Bohemia and Croatia. However, this inevitably conflicts with German nationalism, which supports the Frankfurt Parliament, especially in Bohemia where Germans and Slavs live together. In Prague, German nationalists and Slavic nationalists have each organized constitutional and Slavic leagues to promote their ideas, leading to violent clashes."
1848_austria_events.13.a:0 "German masters are still masters."
1848_austria_events.13.b:0 "I have always been a good ally of the Slavs."

1848_austria_events.14.t:0 "Imperial Decree"
1848_austria_events.14.d:0 "Since the dissolution of the Imperial Parliament and the suppression of the Hungarian revolt, the last resort of the liberals to resist imperial authority has been dismantled by the Empire. Now it's time for our [SCOPE.sCharacter('new_aus_absolutism_scope').GetFirstName][Concept('concept_ruler','$RULER_TITLE_KAISER$')] to personally end this farce. Under the decree of [Concept('concept_ruler','$RULER_TITLE_KAISER$')], the loyal Minister of the Interior #yellow Alexander von Bach#! has drafted the Imperial Decree—to replace the already dysfunctional Imperial Constitution. The provincial noble assemblies are abolished, and [Concept('concept_ruler','$RULER_TITLE_KAISER$')] will henceforth rely entirely on his bureaucracy, police, and military to implement his imperial will. No representative institutions or local forces will obstruct [Concept('concept_ruler','$RULER_TITLE_KAISER$')]'s path anymore. The hypocritical utopia of revolutionary discourse has been swept into the dustbin of history, and only [Concept('concept_ruler','$RULER_TITLE_KAISER$')] and his loyal state machinery can lead the Empire to modernization and prosperity!"
1848_austria_events.14.f:0 "Rome was not built in a day; good things take time. It may not come today, but it will certainly come tomorrow. Oaks grow slowly, and as the Romans say: those who walk slowly, walk steadily. — Heine"
1848_austria_events.14.a:0 "Long live the Empire! Long live [SCOPE.sCharacter('new_aus_absolutism_scope').GetFullName]! Long live absolutism!"

revolution_end_tt:0 "With the help of Baron Bach and Prince Schwarzenberg, we will gradually establish a new absolutism"

1848_austria_events.15.t:0 "The Imperial Government Concedes, the Constitutionalists Triumph"
1848_austria_events.15.d:0 "With the new Imperial Constitution approved under public pressure, this grand people's revolution has finally ended in victory for the Constitutionalists. Although the conservatives have repeatedly tried to undermine our revolutionary achievements, the constitutionalists have always managed to unite and thwart their conspiracies. The new #variable Imperial Constitution#!, building on the previous Kroměříž Constitution, further guarantees freedom of speech and individual liberties, emphasizing the supreme status of the constitution. The newly formed, elected #variable [concept_aus_reichsrat]#! will become the Empire's legislative body, sharing power with [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. The days of reactionary dictatorship are over, and the future will be a new era for our free Empire!"
1848_austria_events.15.f:0 "This is the day the German people escaped from the hands of a reactionary government, and the day they took control of their own destiny. — Friedrich Ebert"
1848_austria_events.15.a:0 "Long live the Empire! Long live [SCOPE.sCharacter('new_aus_liberal_scope').GetFullName]! Long live freedom!"

1848_austria_events.16.t:0 "The Empire Disintegrates"
1848_austria_events.16.d:0 "The establishment of the Republic is indeed a great victory for freedom for the radicals in Vienna—but only for them. The vast majority of the Empire's subjects, long accustomed to Habsburg rule, have no concept of what a republic means. The abolition of the monarchy immediately sparked nationwide turmoil, with pro-Habsburg royalist rebellions breaking out in many places. As the newly established republican government is overwhelmed by domestic chaos, local councils in Bohemia, Hungary, and other regions declare the new republican government unconstitutional due to the lack of a Habsburg monarch, announcing their secession from the Empire. The chaotic republican government is powerless to suppress these movements, and can only watch as the once glorious Empire crumbles to dust. Whatever glories it once had, it has now become mere history."
1848_austria_events.16.f:0 "In the long run, the radicals may be right, but in the short term, when they cannot achieve their goals through peaceful means, they used violence to undermine the constitution and the nascent representative government. They made the establishment of a moderate liberal government impossible. — Frank Eyck"
1848_austria_events.16.a:0 "In hindsight, it was inevitable."

1848_austria_events.18.t:0 "Saint Mark's Republic"
1848_austria_events.18.d:0 "The news of the Empire's constitutional announcement has shaken the dormant Italy. In Venice, radicals and citizens have united to drive out our governor and declare the establishment of the [SCOPE.sCountry('smr_scope').GetName] Republic. To avoid further damage to the city, the imperial troops temporarily withdrew from Venice."
1848_austria_events.18.f:0 "On March 17, the Lloyd steamer from Trieste brought news of the revolution in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]. A crowd marched through St. Mark's Square, demanding the release of political prisoners #yellow Daniele Manin#! and #yellow Niccolò Tommaseo#!. Subsequently, the citizens stormed the mayor's residence and prison to free them. On March 18, Venice raised poles and the tricolor flag, and organized a self-defense force of over 2,000 people. On March 22, Manin led members of the civic guard, with the help of workers, to force the troops to surrender and take over the arsenal. The civic guard easily captured the cannons positioned in front of St. Mark's Basilica, which were then turned towards the governor's palace. #yellow Manin#!'s followers, wearing red Jacobin caps, unfurled a large tricolor flag. Standing on a table outside the Caffè Florian, #yellow Manin#! shouted, “#variable Long live the Republic! Long live Saint Mark!#!” The only republican among the Venetian deputies, the outspoken lawyer #yellow Avesani#!, demanded the withdrawal of all non-Italian troops from Venice and the handover of all fortresses, weapons, and funds. The angry governor #yellow Palffy#! resigned, handing control over to Austrian garrison commander #yellow Ferdinand Zichy#!. Out of love for the city, he abandoned the idea of destroying Venice, and in the afternoon, he handed over control to the government, which then fell into the hands of the Venetians. In the early hours of March 23, #yellow Manin#! was elected president of the [SCOPE.sCountry('smr_scope').GetName] provisional government. The royal troops abandoned the city. An official report from Vienna also publicly declared, “Venice has fallen.”"
1848_austria_events.18.a:0 "The Venetians still need a good beating."
1848_austria_events.18.b:0 "Long live the Republic! Long live Saint Mark!"
 1848_austria_events.19.t:0 "Five Days of Milan"
1848_austria_events.19.d:0 "The news of the Empire's declaration of a constitution has triggered a series of chain reactions in Italy. After several days of fierce fighting, the Milanese have driven out our garrison and declared the establishment of the [SCOPE.sCountry('mln_scope').GetName] Republic. Our garrison commander in Milan, Radetzky, has requested instructions for the next steps. What should we do now?"
1848_austria_events.19.f:0 "On March 17, news of #yellow Metternich#!'s resignation and the [Concept('concept_ruler','$RULER_TITLE_KAISER$')]’s promise to establish a constitution reached Milan, worsening the situation for the Austrians. That night, leaders of the liberal opposition gathered to discuss how to respond. As a precaution, Milan’s garrison commander #yellow Radetzky#! ordered his troops to prepare for combat, adding artillery to the gates and strengthening the walls' guards. On March 18, the slogan rang out: 'Men to the streets, women to the windows!' Approximately 15,000 people joined the parade, with countless others cheering and waving handkerchiefs symbolizing the Italian tricolor. #yellow Radetzky#! quickly deployed troops in the streets to counterattack. The Milanese soon began hurriedly constructing barricades in the narrow streets of the ancient city, leading to bloody street battles. On March 21, #yellow Radetzky#! sent an officer to negotiate a truce. #yellow Casati#! hesitated, seeing in this agreement an opportunity to buy time for the Sardinian king to achieve his long-standing desire to send troops against the Austrians. On March 22, the Milanese captured the Tosa Gate. #yellow Radetzky#!’s siege was broken, and rebels from other parts of Lombardy poured into the city. Now, #yellow Radetzky#! had to contend with the imminent Piedmontese invasion and peasant revolts in the northern mountains. To avoid being surrounded by enemy forces in the city, #yellow Radetzky#! ordered a retreat."
1848_austria_events.19.a:0 "Order General #yellow Radetzky#! to retreat to the Quadrilateral and bombard Milan with artillery!"
1848_austria_events.19.b:0 "We are currently unable to respond; order General #yellow Radetzky#! to withdraw from Italy."
1848_austria_events.19.tt:0 "The Milanese will seek Sardinian intervention."
1848_austria_events.20.t:0 "Revolutionaries from Milan Request Our Intervention"
1848_austria_events.20.d:0 "Since the revolution broke out in Milan, we have been closely monitoring the situation. On March 19, revolutionaries #yellow Martini#! and #yellow Dada#! from [SCOPE.sCountry('mln_scope').GetName] met with our king [SCOPE.sCharacter('sar_ruler_scope').GetFirstName], requesting military assistance to deal with [SCOPE.sCountry('aus_scope').GetName]. The king already harbors ambitions to annex Lombardy and Venetia and is also facing challenges from Piedmontese radicals who threaten to start a revolution if the king does not support the cause of Italian unification by sending troops against the Austrians. Now the choice is ours: Should we send troops to assist the Milanese revolution?"
1848_austria_events.20.f:0 "In light of the events in Lombardy and Vienna, hesitation, doubt, and delay are undesirable and the most disappointing policies. We are rational people, accustomed to following the dictates of reason rather than impulse. After careful deliberation, we must now sincerely declare that our nation, our government, and our king have only one course of action: war! If we do not act promptly, we will face misfortune! —Cavour"
1848_austria_events.20.a:0 "For a free Italy, forward!"
1848_austria_events.20.b:0 "Huh? What Italian liberation? I don't understand."
1848_austria_events.21.t:0 "Imperial Army Driven Out of Italy"
1848_austria_events.21.d:0 "Despite our soldiers fighting bravely, the forces of the Italian revolutionaries have driven us out of Lombardy. We must admit that this most prosperous province of the Empire has fallen into enemy hands."
1848_austria_events.21.f:0 "Farewell, beautiful Italy."
1848_austria_events.21.a:0 "Sigh."
1848_austria_events.22.t:0 "We Have Won the War for Italian Unification"
1848_austria_events.22.d:0 "After our soldiers' heroic efforts, we have finally liberated Lombardy from the clutches of the Habsburg wolves. However, Italy's future remains uncertain as conflicts between republicans and monarchists, and between unificationists and autonomists, intensify following the war's end. If we do not resolve these issues, a severe political crisis may arise."
1848_austria_events.22.f:0 "The fundamental difference between Mazzini and Cattaneo lies in their priorities. Mazzini seeks national unification, even if it means delaying the establishment of a democratic republic. Cattaneo, essentially loyal to Lombardy, believes that achieving political freedom for Lombardy is more important than the dream of national unification."
1848_austria_events.22.a:0 "The road ahead is long."
1848_austria_events.23.t:0 "We Have Lost the War for Italian Unification"
1848_austria_events.23.d:0 "After suffering disastrous defeats in several major battles, our army is now in disarray and retreat. We are unable to stop the advancing Austrian forces and must sue for peace with Austria in humiliation. Our king [SCOPE.sCharacter('ruler_scope').GetFirstName] faces the danger of losing his throne. Austria might seize our kingdom's territory, and domestic democrats aim to overthrow the monarchy. Rumors suggest that King [SCOPE.sCharacter('ruler_scope').GetFirstName] has rejected the constitution and handed over the ports to the Austrians. This unfounded news has reached Genoa, sparking local riots. However, the rebellion in Genoa was quickly suppressed by the royal army returning from Novara. In this critical moment, should we let the old king abdicate to avoid further disasters for the dynasty?"
1848_austria_events.23.f:0 "My decision is the result of careful consideration. From this moment on, I am no longer king; the king is Victor, my son. —Carlo Alberto"
1848_austria_events.23.a:0 "The old man should have stepped down long ago."
1848_austria_events.23.b:0 "Children, I am not ready to go yet."
1848_austria_events.23.tt:0 "Our king will abdicate to quell public anger."

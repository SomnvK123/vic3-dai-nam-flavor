je_European_Restoration: "Vormärz Period"
je_European_Restoration_reason: "The above #tooltippable;tooltip:[Country.GetTooltipTag],je_European_Restoration_tooltip_advance progressive laws#! will advance the progress bar for progressive laws. If the progressive law value exceeds that of conservative laws, the conservatives will launch a coup against us!\n\nThe #variable Vormärz#! was a period in German history before the March Revolution of 1848 in the German Confederation states. Internationally, it is known as the Metternich Era. Within Germany, it was characterized by the dominance of Austria and Prussia in the German Confederation. Both Austria and Prussia established autocratic #variable police states#! domestically and forced other German states to do the same. These autocratic regimes implemented #variable censorship and large-scale surveillance#! on an unprecedented scale in response to calls for liberalism, constitutional monarchy, and German unification from moderate reformers, as well as more radical and revolutionary calls for republicanism and universal suffrage. We must #variable avoid any form of progressive reform#!, or else the conservatives may act to ensure the maintenance of tradition and order."
je_European_Restoration_status: "Defend Our Traditions!"
je_European_Restoration_progress_bar_name: "Vormärz Period"
je_European_Restoration_progress_bar_conservatism_desc: "Conservative Laws: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/100)"

# Ideologies and Traits ig #######################################################################################################################################################################
ideology_classical_conservatism_leader:0 "Classical Conservative"
ideology_classical_conservatism_leader_desc:0 "This leader advocates for a strong, enlightened, and universal government, emphasizing the traditional aspect of governance and considering monarchy as the most rational system. They also pursue pluralism and further cooperation with the church."
ideology_neo_absolutism_leader:0 "Neo-Absolutist"
ideology_neo_absolutism_leader_desc:0 "This leader yearns for the rational state of Joseph II's era, supporting the establishment of an efficient and centralized bureaucratic system to replace the feudal system. They rely on the authority of bureaucratic institutions, police, and the military to implement the emperor's will, leading the country towards modernization. They also support anti-clericalism and pluralistic reforms."
ideology_austria_constitutionalist_leader:0 "Austrian Constitutionalist"
ideology_austria_constitutionalist_leader_desc:0 "This leader believes that constitutionalism and liberal reforms under Habsburg rule are the foundation of the nation's strength."
ideology_modern_conservatism_leader:0 "Modern Conservative"
ideology_modern_conservatism_leader_desc:0 "This leader believes that appropriate social and economic reforms will help defend traditional values."
ideology_danubianist:0 "Danubianist"
ideology_danubianist_desc:0 "#lore This group believes in federalism, advocating for the autonomy of various nationalities in the region."
ideology_absolutism:0 "Absolutist"
ideology_absolutism_desc:0 "This group believes that the monarch is the embodiment and sole representative of national sovereignty, operating according to the rule of law, the constitution, and natural law, and constrained by feudal traditions."
ideology_statism:0 "Statist"
ideology_statism_desc:0 "This group believes that an efficient and centralized bureaucratic system is the foundation of the nation's strength."
ideology_josephism:0 "Josephinist"
ideology_josephism_desc:0 "This group wants to follow in the footsteps of Joseph II, building the rational state of Joseph II, but without any enlightened idealism."
austrian_bureaucracy:0 "Austrian Bureaucracy"
austrian_bureaucracy_desc:0 "The Austrian bureaucratic group is the backbone of the Empire, consisting of senior nobility in central and local government and a large number of grassroots officials, united under Habsburg monarchical power."

l_english:
  je_pax_britannica_tooltip_medium:0 "@divider_start!@divider_mid!@divider_end!\nNone\n@divider_start!@divider_mid!@divider_end!"
  je_pax_britannica_desc:0 "[ROOT.GetCountry.GetCustom('pax_britannica_change')] #variable [ROOT.Var('pax_britannica_points_change').GetValue| +=]#! [ROOT.GetCountry.GetCustom('pax_britannica_tooltip_name')]"
  je_pax_britannica_reason:0 "Unlocks the [concept_impose_hegemony] [concept_diplomatic_play]\n\n#b Current effects#!\n[ROOT.GetCountry.GetCustom('pax_britannica_tooltip')]\n\n@arrow_up_up!#b Monthly Increases#!@arrow_up_up!\n@divider_start!@divider_mid!@divider_end!\n#variable [ROOT.Var('pax_britannica_points_change_diplo').GetValue| +=] from [concept_informal_empire]\n#variable [ROOT.Var('pax_britannica_points_change_defending').GetValue| +=] from [concept_global_policeman]\n@divider_start!@divider_mid!@divider_end!\n\n@arrow_down_down!#b Monthly Decreases#!@arrow_down_down!\n@divider_start!@divider_mid!@divider_end!\n#variable [ROOT.Var('pax_britannica_points_change_root_infamy').GetValue| +] from [concept_hypocrisy]\n#variable [ROOT.Var('pax_britannica_points_change_other_infamy').GetValue| +] from [concept_global_anarchy]\n#variable [ROOT.Var('pax_britannica_points_change_not_defending').GetValue| +] from [concept_sleeping_policeman]\n#variable [ROOT.Var('pax_britannica_points_change_not_rank1').GetValue| +] from [concept_waning_hegemony]\n#variable [ROOT.Var('pax_britannica_points_change_other_superpower').GetValue| +] from [concept_meaningful_rival]\n@divider_start!@divider_mid!@divider_end!\n\n"
  je_pax_britannica_tooltip_very_high:0 "@divider_start!@divider_mid!@divider_end!\n#green @import! +#variable [ROOT.Var('pax_britannica_multiplier_50').GetValue| +]#!% [concept_trade_route_competitiveness]\n@import! -#variable [ROOT.Var('pax_britannica_multiplier_30').GetValue| +]#!% [concept_trade_route] Bureaucracy Cost\n@import! +#variable [ROOT.Var('pax_britannica_multiplier_10').GetValue| +]#!% [concept_trade_route] Volume\n@approves! +#variable [ROOT.Var('pax_britannica_multiplier_40').GetValue| +]#!% [concept_migration_pull] In [ROOT.GetCountry.GetCapital.GetName]#!\n@divider_start!@divider_mid!@divider_end!"
  je_pax_britannica_tooltip_very_low:0 "@divider_start!@divider_mid!@divider_end!\n#r @export! -#variable [ROOT.Var('pax_britannica_multiplier_50').GetValue| -]#!% [concept_trade_route_competitiveness]\n@export! +#variable [ROOT.Var('pax_britannica_multiplier_30').GetValue| -]#!% [concept_trade_route] Bureaucracy Cost\n@export! -#variable [ROOT.Var('pax_britannica_multiplier_10').GetValue| -]#!% [concept_trade_route] Volume\n@coin1! -#variable [ROOT.Var('pax_britannica_multiplier_25').GetValue| -]#!% [concept_war_exhaustion] From [concept_casualties]\n@warning! +#variable [ROOT.Var('pax_britannica_multiplier_50').GetValue| -]#!% [concept_radical]s From Conquest\n@infamy! +#variable [ROOT.Var('pax_britannica_multiplier_50').GetValue| -]#!% [concept_infamy] Generation#!\n@divider_start!@divider_mid!@divider_end!"
  pax_britannica_events.1111.d:0 "The apotheosis of British global hegemony has come to pass. The day is ours - for now. It is our responsibility to ensure peace and stability the whole world over."
  pax_britannica_events.88.d:0 "The apotheosis of British global hegemony has come to pass. They have taken it upon themselves to assert a new global order under their guiding vision."
  pax_britannica_events.1111.f:0 "“They had by 1815 gained the most complete victory of any power in the entire history of the world, having emerged from the twenty years of war against France as the #italic only#! industrialized economy, the #italic only#! naval power—the British navy in 1840 had almost as many ships as all other navies put together—and virtually the only colonial power in the world.”\n\n#!#!- Eric Hobsbawm, The Age of Revolution"
  pax_britannica_events_positive:0 "This will alter [concept_pax_britannica] by #variable [GetPlayer.MakeScope.Var('pax_britannica_events_positive').GetValue| +=]#!"
  pax_britannica_events_negative:0 "This will alter [concept_pax_britannica] by #variable [GetPlayer.MakeScope.Var('pax_britannica_events_negative').GetValue| +=]#!"
  concept_pax_britannica:0 "Pax Britannica"
  concept_pax_britannica_desc:0 "The global hegemony of Britain. The current value affects the buffs or debuffs provided, as well as the frequency of positive and negative events."
  concept_impose_hegemony:0 "Enforce Hegemony"
  concept_impose_hegemony_desc:0 "A special type of [concept_humiliation] [concept_diplomatic_play], usable on a [concept_major_power] or [concept_great_power] with an [concept_infamy] level of #N Notorious#! or above, which also prevents the target country from launching any [concept_diplomatic_play] for the duration.\n\nIncreases [concept_pax_britannica] by #green #b +3.00#!#! plus an additional #green #b +1.00#!#! for every #red #b 10.00#!#! [concept_infamy] the target had above the level of #N Notorious#! when you started the play."
  impose_hegemony_desc:0 "A special type of [concept_humiliation] [concept_diplomatic_play], usable on a [concept_major_power] or [concept_great_power] with an [concept_infamy] level of #N Notorious#! or above, which also prevents the target country from launching any [concept_diplomatic_play] for the duration.\n\nIncreases [concept_pax_britannica] by #green #b +3.00#!#! plus an additional #green #b +1.00#!#! for every #red #b 10.00#!#! [concept_infamy] the target had above the level of #N Notorious#! when you started the play."
  impose_hegemony_action_tooltip:0 "[concept_primary_demand]: [GetPlayer.GetName] forces [concept_impose_hegemony] on [SCOPE.sC('target_country').GetName].\n\nIf they refuse, this will trigger a [concept_diplomatic_play] which may escalate into [concept_war]"
  impose_hegemony:0 "Enforce Hegemony"
  impose_hegemony_desc:0 "A special type of [concept_humiliation] [concept_diplomatic_play], usable on a [concept_major_power] or [concept_great_power] with an [concept_infamy] level of #N Notorious#! or above, which also prevents the target country from launching any [concept_diplomatic_play] for the duration.\n\nIncreases [concept_pax_britannica] by #green #b +3.00#!#! plus an additional #green #b +1.00#!#! for every #red #b 10.00#!#! [concept_infamy] the target had above the level of #N Notorious#! when you started the play."
  impose_hegemony_action_name:0 "Enforce Hegemony"
  impose_hegemony_action_notification_name:0 "[INITIATOR_COUNTRY.GetNameNoFormatting] Enforces Hegemony"
  impose_hegemony_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] has demanded [concept_impose_hegemony] from us."
  concept_super_power: "Super Power"
  concept_super_power:0 "Super Power"
  concept_super_powers:1 "Super Powers"
  concept_super_power_desc:3 "In the game of powers, the buck does not stop at the mighty [Concept('concept_great_power','$concept_great_powers$')]. Some nations accede beyond even the global influence of a [concept_great_power]. They are the super powers, the most prestigious of the global powers - exerting unparalleled influence and control that no powers, however great, may resist. An uncontested super power is the global hegemon by default; a war between super powers, by its very definition, would be a World War.[AddLocalizationIf(GetPlayer.IsValid,'concept_super_power_desc_added')]"
  concept_super_power_desc_added:0 "\n\n$concept_super_powers$ gain the following benefits:\n[GetRankModifier('super_power').GetDesc]"
  super_power:1 "[concept_super_power]"
  super_power_desc:0 "[concept_super_power_desc]"
  pax_britannica_events.99.t:0 "[SCOPE.sC('britain_scope').GetNameNoFormatting] Enforces Hegemony"
  pax_britannica_events.99.d:0 "[concept_primary_demand]: [SCOPE.sC('britain_scope').GetName] forces [concept_impose_hegemony] on [GetPlayer.GetName].\n\nIf we refuse, this will trigger a [concept_diplomatic_play] which may escalate into [concept_war]"
  pax_britannica_events.99a:0 "To war it is!"
  pax_britannica_events.99b:0 "We don't have a choice"
  modifier_pax_britannica_hegemony_imposed:0 "Hegemony Enforced"
  unrecognized_great_power:1 "[Concept('concept_unrecognized_power','$concept_unrecognized_great_power$')]"
  concept_unrecognized_great_power:0 "Unrecognized Great Power"
  concept_unrecognized_great_power_desc:0 ""
 
  kates_force_recognition:0 "Force Recognition"
  kates_force_recognition_tooltip:0 "#header Start a $dp_force_recognition$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_force_recognition_desc$"
  kates_force_recognition_action_name:0 "Force Recognition"
  kates_force_recognition_desc:0 "Sets the initiating [concept_war_goal] to force the targeted [concept_country] to remove the [Concept('concept_unrecognized_power','$concept_unrecognized_power_short$')] status of you."
  kates_force_recognition_action_notification_name:0 "Force Recognition"
  kates_force_recognition_action_notification_desc:0 "[INITIATOR_COUNTRY.GetAdjective] has started a Force Recognition [concept_diplomatic_play] against us."

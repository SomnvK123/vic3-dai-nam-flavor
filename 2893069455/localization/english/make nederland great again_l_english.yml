 Make_Nederland_Great_Again_events.2.t:0 "London Treaty"
 Make_Nederland_Great_Again_events.2.d:0 "Belgium won de facto independence from the Netherlands by force of arms during the Belgian Revolution of 1831. The former colonial power, the Netherlands, was reluctant to formally recognize Belgium's independence. However, in 1839, the Dutch reluctantly signed a treaty recognizing Belgium's independence with all the great powers of Europe, officially recognizing Belgium's independence and neutrality. , our country will lose its sovereignty over Belgium, in exchange for which the world's opinion of us will improve."
 Make_Nederland_Great_Again_events.2.f:0 "Are England and Germany fighting for a piece of paper? -German Chancellor Theobald von Bethmann Holweg"
 Make_Nederland_Great_Again_events.2.a:0 "Sign the Treaty"
 Make_Nederland_Great_Again_events.2.b:0 "Cancel"

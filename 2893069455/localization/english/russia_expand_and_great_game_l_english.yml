 rus_japan_win:0 "To gain more influence over Japan, we need to fulfill our own goals and prevent Great Britain from fulfilling its goals. \n Russia's goals: \n - Control of the entire territory of Hokkaido gives 2 points per week \n - Union with Japan gives 5 point per week \n - Japan as a puppet gives 5 points per week \n \n \n Britain's goals: \n Control of the Ryukyu Islands gives 2 points per week \n Union with Japan gives 1 point per week \n Japan as a puppet gives 5 points per week."
 japan_stalemate:0 "The Great Game in Japan will come to a standstill if neither side achieves superiority before the beginning of the 20th century or if Japan successfully becomes a recognized power."
 gbr_japan_win:0 "To gain more influence over Japan, we need to achieve several key goals and prevent Russia from achieving their goals." \n Russia's goals: \n - Control of the entire territory of Hokkaido gives 2 points per week \n - An alliance with Japan would give 5 point per week \n - Japan as a puppet would give 5 points per week \n \n \n UK goals: \n Control of the Ryukyu Islands will give 2 points per week \n Union with Japan will give 1 point per week \n Japan as a puppet will give 5 points per week."
 rus_china_win:0 "To gain more influence over China, we need to fulfill our own goals and prevent Britain from fulfilling its goals. \n Russia's goals: \n - Control of North or South Manchuria gives 2 points a week each \n - Control of Outer Manchuria gives 1 point a week \n - Control of Mongolian territories gives 1 point a week each \n - Control of territories in Xinjiang gives 1 point a week each \n - Having a treaty port in China gives 1 point a week \n \n \n Britain's goals: \n - Control of Formosa gives 3 points per week \n - Control of Kashmir gives 1 point per week \n - Control of Northern Burma gives 2 points per week \n - Control of the Himalayas gives 3 points per week \n - Having a treaty port in China gives 1 point per week."
 china_stalemate:0 "The Great Game in China will end in a stalemate if neither side achieves superiority before the beginning of the 20th century."
 gbr_china_win:0 "To gain more influence over China, we need to achieve several key goals and prevent Russia from achieving their goals. \n Russia's goals: \n - Control of North or South Manchuria gives 2 points per week each \n - Control of Outer Manchuria gives 1 point per week \n - Control of Mongolian territories gives 1 point per week each \n - Control of territories in Xinjiang gives 1 point per week each \n - Having a treaty port in China gives 1 point per week \n \n \n British goals: \n - Control of Formosa gives 3 points per week \n - Control of Kashmir gives 1 point per week \n - Control of Northern Burma gives 2 points per week \n - Control of the Himalayas gives 3 points per week \n - Having a treaty port in China gives 1 point per week."
 rus_india_win:0 "To gain more influence over India, we need to achieve several key goals and prevent Britain from achieving theirs. \n Russia's goals: \n - Control of Tajikistan gives 1 point a week \n - Control of Tianshan gives 1 point a week \n - Control of territories in Afghanistan gives 3 points a week each \n - Control of Kashmir gives 3 points a week \n \n \n UK goals: \n - Control of the territories in Afghanistan gives 3 points a week to everyone \n - Control of Pashtunistan gives 1 point a week \n - Control of Kashmir gives 2 points a week \n - Control of the Punjab gives 2 points a week \n \n \n If Britain loses control of the East India Company, its position in the region will become unsustainable."
 india_stalemate:0 "The Great Game in India will end in a stalemate if neither side achieves supremacy before the beginning of the 20th century."
 gbr_india_win:0 "To gain more influence over India, we need to achieve several key goals and prevent Russia from achieving theirs. \n Russia's goals: \n - Control of Tajikistan gives 1 point a week \n - Control of Tianshan gives 1 point a week \n - Control of a state in Afghanistan will give 3 points a week to everyone \n - Control of Kashmir will give 3 points a week \n \n \n UK goals: \n - Control of territories in Afghanistan will give 3 points a week to everyone \n - Control of Pashtunistan will give 1 point a week \n - Control of Kashmir will give 2 points a week \n - Control of Punjab will give 2 points a week \n \n \n If Britain loses control of the East India Company, its position in the region will become unstable."
 rus_persia_win:0 "To gain more influence over Persia, we need to achieve several key goals and prevent Britain from achieving theirs. \n Russia's goals: \n - Control of Mazandaran gives 4 points per week \n - Control of Tabriz gives 4 points per week \n - Having a treaty port in Persia gives 2 points per week \n \n \n Britain's goals: \n - Control of Baluchistan gives 2 points per week \n - Control of Abu Dhabi gives 4 points per week \n - Having a treaty port in Persia gives 4 points per week \n \n \n If Russia loses control of Azerbaijan, its position in the region will become unstable."
 persia_stalemate:0 "The Great Game in Persia will end in a stalemate if neither side secures supremacy before the beginning of the 20th century."
 gbr_persia_win:0 "To gain more influence over Persia, we need to achieve several key goals and prevent Russia from achieving theirs. \n Russia's Goals: \n - Control of Mazandaran gives 4 points per week \n - Control of Tabriz gives 4 points per week \n - Having a treaty port in Persia gives 2 points per week \n \n \n \n British goals: \n - Control of Baluchistan gives 2 points per week \n - Control of Abu Dhabi gives 4 points per week \n - Having a treaty port in Persia gives 4 points per week \n \n \n If Russia loses control of Azerbaijan, its position in the region will become unstable."
 rus_turkey_win:0 "To gain more influence over the Ottoman Empire, we need to achieve several key objectives and prevent Britain from achieving their goals. \n Russia's goals: \n - Control of all of Kars gives 2 points per week \n - Control of Eastern Thrace gives 5 points per week \n - Existence of Bulgaria gives 2 points per week \n - Existence of Romania gives 3 points per week \n - Existence of Bosnia gives 2 points per week \n - Possession of Serbia South Serbia gives 2 points per week \n \n \n Britain's objectives: \n - Control of Cyprus would give 4 points per week \n - Having a treaty port in Turkey would give 4 points per week \n \n \n \n \n If Russia loses control of Cyprus, its position in the region would become unstable."
 turkey_stalemate:0 "The great game in the Ottoman Empire will end in a stalemate if neither side achieves superiority before the early 20th century."
 gbr_turkey_win:0 "To gain more influence over the Ottoman Empire, we need to achieve several key objectives and prevent Russia from achieving their goals. \n Russia's goals: \n - Control of all of Kars gives 2 points per week \n - Control of Eastern Thrace gives 5 points per week \n - The existence of Bulgaria gives 2 points per week \n - The existence of Romania gives 3 points per week \n - The existence of Bosnia gives 2 points per week \n - Possession of Serbia South Serbia gives 2 points per week \n \n \n \n British goals: \n - Control of Cyprus gives 4 points per week \n - Having a treaty port in the Ottoman Empire gives 4 points per week \n \n \n \n \n \n If Russia loses control of Cyprus, its position in the region will become unstable."

 russia_expand.1.t:0 "Our positions in Central Asia"
 russia_expand.1.d:0 "The recent subjugation of the Kazakhs has opened our way to Central Asia. However, we are not the only ones with interests in this region."
 russia_expand.1.f:0 "Now we can and must subjugate the minor Central Asian khanates and colonize Sakhalin.
 russia_expand.1.a:0 "We keep going south!"
 russia_expand.2.t:0 "On the borders of India"
 russia_expand.2.d:0 "We dominate Central Asia, and only the British and Chinese stand in our way to total domination.
 russia_expand.2.f:0 "To eliminate the Chinese threat, we are left to annex the Chinese border regions."
 russia_expand.2.a:0 "Let's lay claim to territories in China!"

 russia_expand.4.t:0 "Russian Threat"
 russia_expand.4.d:0 "With Russia's recent rapid expansion into Central Asia and the Far East, we must make sure that our positions in India and China are not threatened. Although Russia poses no great threat now, the time will soon come when we will have to confront it."
 russia_expand.4.f:0 "In order not to lose influence in the regions, we must not allow further expansion of Russia.
 russia_expand.4.a:0 "We must be careful"
 russia_expand.5.t:0 "Russian Threat"
 russia_expand.5.d:0 "The Russian Empire has recently strengthened its position in the south, and we are on their potential expansion path. The time is coming when the decisive maneuver will unfold."
 russia_expand.5.f:0 "It is necessary to prepare carefully for a possible conflict..."
 russia_expand.5.a:0 "We must be careful"
 russia_expand.6.t:0 "The Great Game
 russia_expand.6.d:0 "Our ever-expanding power has come into conflict with the British Empire, which is challenging our territorial ambitions in Asia. We must fight back and reclaim what is ours!"
 russia_expand.6.f:0 "Escalation or resolution of conflict? The fate of Asia depends on our choice.
 russia_expand.6.a:0 "For the Tsar!"
 russia_expand.7.t:0 "The Great Game
 russia_expand.7.d:0 "The Russian Empire is a threat that can no longer be ignored. They seek to dominate Asia, and we are the only ones capable of resisting their power. By stopping their expansion into key regions, we can secure more prestige for our homeland."
 russia_expand.7.f:0 "Escalation or Resolution? The fate of Asia depends on our choice.
 russia_expand.7.a:0 "We'll put them in their place!"
 russia_expand.8.t:0 "Japan Defeated"
 russia_expand.8.d:0 "The Russian Empire has successfully expanded its sphere of influence over Japan and is now the dominant power in the region."
 russia_expand.8.f:0 "We can now call Japan our sphere of interest.
 russia_expand.8.a:0 "For the Tsar!"
 russia_expand.9.t:0 "Japan Defeated"
 russia_expand.9.d:0 "The British Empire successfully fought off Russian expansion and claimed Japan as part of their own sphere of influence."
 russia_expand.9.f:0 "We can now call Japan our sphere of interest.
 russia_expand.9.a:0 "For Empire!"

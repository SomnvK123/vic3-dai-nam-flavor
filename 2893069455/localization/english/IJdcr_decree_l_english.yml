#科技
 national_integration: "National integration"
 national_integration_desc: "There are many alien races in the imperial lands, and we need to enact new laws to facilitate their integration into the empire in order to maintain national unity"
#决议/JE
 IJdcr_DC: "National Integration Act"
 IJdcr_DC_desc: "There are many peoples in the newly conquered lands of the empire who do not want to submit to His Majesty the mikado, and we should start to solve this problem"
 IJdcr_decision: "officially promulgating The National Integration Act"
 IJdcr_decision_desc: "His Majesty the mikado officially promulgated the National Integration Act, which would promote the integration of ethnic groups within the empire"
 je_IJdcr: "National Integration Act"
 je_IJdcr_reason: "His Majesty the mikado promulgated the National Integration Act with a view to integrating the new territory, although it may temporarily cause some administrative trouble"
 je_IJdcr_complete: "The other peoples of the empire finally submitted to His Majesty the Emperor"
 je_IJdcr_fail: "In the face of foreign resistance, the national integration bill ultimately failed"
 je_IJdcr_invalid: "The mikado withdrew the National Integration Act"
 IJdcr_failvar_1: "The implementation of the National Integration Act has been very smooth"
 IJdcr_failvar_2: "There has been some resistance to the implementation of the national integration bill"
 IJdcr_failvar_3: "The implementation of the National Integration Act was stubborn in foreign resistance"
 IJdcr_failvar_4: "We should revisit the possibility of an integration bill"

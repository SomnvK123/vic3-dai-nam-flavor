#事件
 IJdcr_tt1: "More interracial expressed submission"
 IJdcr_tt2: "The interracial resistance was fierce"
 IJdcr_tt3: "Policy implementation is under great threat"

 IJdcr_eve.1.t: "interracial submission"
 IJdcr_eve.1.d: "interracial swore allegiance to the mikado"
 IJdcr_eve.1.f: "The peoples of this newly conquered land had sworn allegiance to the Emperor, they had become fully part of the Empire of Japan, and His Majesty the Emperor decided to give their nation a new title to show the magnificence of the Emperor."
 IJdcr_eve.1.a: "The lands and people of the Empire of Japan were subordinate to the Emperor!"

 IJdcr_eve.2.t: "Occupation of the Imperial Palace"
 IJdcr_eve.2.d: "Imperial university students occupy the Imperial Palace"
 IJdcr_eve.2.f: "Initiated by more than a dozen Tokyo Imperial University students, nearly 1,000 students from universities in the Kanto region participated in and held a large-scale demonstration near the Tokyo Imperial Palace, where students expressed serious dissatisfaction and protest against the imperial policy of national integration, and some of them proposed to occupy the Imperial Palace, demanded direct dialogue with His Majesty the Emperor, and were recognized by some students, and their bad actions seriously endangered the personal safety of His Majesty the Emperor and the prestige of the Imperial Government.\nAt the behest of the commander-in-chief of the Imperial Army, Tokyo declared martial law and decided to solve the demonstration problem by force of the army, and publicized the demonstrators as being infiltrated by foreign anti-Yamato forces, on the same day the Imperial Army entered Tokyo and used live ammunition to expel most of the demonstrators, which eventually killed dozens of soldiers and hundreds of civilians, and thousands of students were arrested."
 IJdcr_eve.2.a: "The Imperial soldiers regained the stability of the Empire from the anti-Restoration elements"
 IJdcr_eve.2.b: "Making verbal concessions may prevent the next event"

 IJdcr_eve.3.t: "The Governor died"
 IJdcr_eve.3.d: "The former governor in charge of administering the new lands of the empire died of illness"
 IJdcr_eve.3.f: "The previous governor died of cancer, and many local people spontaneously mourned, and during his term of office, he canceled the high-pressure policy of his previous generation of governors and adopted lenient laws, which not only weakened the resistance of many local ethnic groups but also made many local people turn to support, but also allowed the colonies to maintain cultural independence, and the local people seemed to have only a slight affection for this governor and remained hostile to the empire. The governor's policy was clearly contrary to the empire's policy of national integration, and in a sense a threat."
 IJdcr_eve.3.a: "The guys who hindered the national policy of the empire finally dead"
 IJdcr_eve.3.b: "Continuing his policies helped to pacify the local population"

 IJdcr_eve.4.t: "Park parade"
 IJdcr_eve.4.d: "Unlicensed mass demonstrations broke out in Tokyo's Ueno Park"
 IJdcr_eve.4.f: "Large crowds gathered in Ueno Park to mourn the death of the former governor, and most of them were [SCOPE.sCulture('IJdcr_pop_scope.culture').GetName] nation, which was the advocate of the former governor.\nBut soon they turned to expressing their dissatisfaction with the Empire and the Emperor, and the mourning turned into a mass march and caused congestion in the nearby area, so the Imperial Police cleared it and arrested some of the people who insisted on mourning."
 IJdcr_eve.4.a: "They are an anti-restoration movement disguised as mourning, and we need to check who is behind it"
 IJdcr_eve.4.b: "It seems that the implementation of our new policy is not small"

 IJdcr_eve.5.t: "Correct history"
 IJdcr_eve.5.d: "Teach residents the right history"
 IJdcr_eve.5.f: "[SCOPE.sState('IJdcr_state_scope').GetName] [SCOPE.sBuilding('IJdcr_state_scope').GetName] have published a number of historical research documents jointly with the historical research group of the Imperial University, which show that it is historical, legal and practical in terms of jurisdiction[ROOT.GetCountry.GetName]have absolute sovereignty over[SCOPE.sState('IJdcr_state_scope').GetName]。"
 IJdcr_eve.5.a: "[SCOPE.sState('IJdcr_state_scope').GetName] is [ROOT.GetCountry.GetName] inherent territory since ancient times, sacred and indivisible!"
 IJdcr_eve.5.b: "We should wait until the death of this generation of residents to promote this argument"

 IJdcr_eve.6.t: "interracial protested"
 IJdcr_eve.6.d: "interracial protested our findings"
 IJdcr_eve.6.f: "After we published the historical research literature of the Imperial University,The people of Nation [SCOPE.sCulture('IJdcr_pop_scope.culture').GetName] protested fiercely against the local government! Some turned from attacking schools to attacking His Majesty the Emperor, so local police arrested some of the radicals at the head."
 IJdcr_eve.6.a: "These are historical nihilists,The [ROOT.GetCountry.GetName] research results must not be falsified, gag them!"
 IJdcr_eve.6.b: "They don't seem to understand the inevitability of history"

 IJdcr_eve.7.t: "Language education"
 IJdcr_eve.7.d: "Whether foreign language education should be preserved has become a new topic"
 IJdcr_eve.7.f: "Whether or not to retain the language education of [SCOPE.sCulture('IJdcr_pop_scope.culture').GetName] has become a new topic within the Imperial University, with a small number of scholars believing that preserving these languages would enhance cultural diversity, while the vast majority of scholars believe that only the unification of the official language as Japanese can promote the integration of ethnic groups."
 IJdcr_eve.7.a: "These ethnic groups have the same roots, the same origin and the same language and the same species as the Yamato nation, and strengthening the education of the national standard language is an objective need for the regional peoples to better integrate into the empire!"
 IJdcr_eve.7.b: "Perhaps we do not have the right to deny and eliminate other national languages and cultures"

 IJdcr_eve.8.t: "Factory strikes"
 IJdcr_eve.8.d: "[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName] Workers went on strike"
 IJdcr_eve.8.f: "[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName] workers in [SCOPE.sState('IJdcr_state_scope').GetName] factories went on strike, expecting the same pay as everyone else."
 IJdcr_eve.8.a: "If you are willing to integrate into [ROOT.GetCountry.GetName], we will treat you equally"
 IJdcr_eve.8.b: "We will consider respecting the [SCOPE.sCulture('IJdcr_pop_scope.culture').GetName] workers, and only hope that you can resume production as soon as possible"

 IJdcr_eve.9.t: "Waves of migration"
 IJdcr_eve.9.d: "There was a wave of immigration among the Yamato nation"
 IJdcr_eve.9.f: "The people of the empire gradually regarded [SCOPE.sCulture('IJdcr_pop_scope.culture').GetName] culture as part of our culture, and many people recently chose to emigrate, but the local people seemed to be hostile to these friendly imperial people."
 IJdcr_eve.9.a: "Shut up the unfriendly aborigines, and any outrageous behavior will be severely punished!"
 IJdcr_eve.9.b: "Appeasing the emotions of the indigenous people is more conducive to their integration into the new country"

 IJdcr_eve.10.t: "metis"
 IJdcr_eve.10.d: "For the first time, mixed-race children became a social problem in [ROOT.GetCountry.GetName]"
 IJdcr_eve.10.f: "The integration of the Yamato nation and  [SCOPE.sCulture('IJdcr_pop_scope.culture').GetName]culture also gave birth to many mixed-race children, and even if they had half of Yamato blood in their bodies, they also attracted discrimination from both ethnic groups."
 IJdcr_eve.10.a: "They are all subjects of the empire in the future, how can they tolerate discrimination!"
 IJdcr_eve.10.b: "Maybe the feelings of the masses should be taken into account a little?"

 IJdcr_eve.11.t: "Bloodshed"
 IJdcr_eve.11.d: "Cultural collisions turn into bloodshed"
 IJdcr_eve.11.f: "The cultural clash between [SCOPE.sCulture('IJdcr_pop_scope.culture').GetName] culture and the Yamato ethnic group has become increasingly intense, and clashes with casualties have broken out frequently in some areas, and military leaders have volunteered to lead the crackdown and pledge to live up to their mission."
 IJdcr_eve.11.a: "It is better to set up a separation belt, and sooner or later the country that unleashes the repression of the army against the people will be overthrown by the people!"
 IJdcr_eve.11.b: "They crossed that red line, the imperial army should be dispatched!"

 IJdcr_eve.12.t: "Recreational activities"
 IJdcr_eve.12.d: "Entertainment in the town center serves as a bridge for cultural exchange"
 IJdcr_eve.12.f: "Exchanges between [SCOPE.sCulture('IJdcr_pop_scope.culture').GetName] residents and Yamato immigrants became closer, town centers became centers of cultural exchange in each city, many entertainment activities were attended by residents of both cultures, and some suggested that the imperial authorities organize more large-scale events to promote ethnic integration."
 IJdcr_eve.12.a: "We can organize more events in the official name to promote national integration"
 IJdcr_eve.12.b: "Let them organize themselves, and official participation will not necessarily facilitate"

 IJdcr_eve.13.t: "The implementation of the Act failed"
 IJdcr_eve.13.d: "The implementation of the Act failed"
 IJdcr_eve.13.f: "The implementation of the law was met with great resistance and forced to terminate, and the government chose the former between imperial stability and obstinate behavior"
 IJdcr_eve.13.a: "The implementation of the Act failed"

 IJdcr_eve.14.t: "The Act was suspended"
 IJdcr_eve.14.d: "The Act was suspended"
 IJdcr_eve.14.f: "The imperial government took the initiative to stop the implementation of the law, probably encountering some administrative problems"
 IJdcr_eve.14.a: "The Act was suspended"


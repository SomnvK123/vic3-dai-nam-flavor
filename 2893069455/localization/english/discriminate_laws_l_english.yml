 je_serf_enslavement_laws:0 "Shackles law"
 je_serf_enslavement_laws_reason:0 "Shackle laws are in place that deprive those who are ineligible for citizenship, especially those who are disloyal or default on their debts. Mainly serfs who were subjugated to landlords were targeted."
 
 je_enslavement_laws:0 "Shackles law"
 je_enslavement_laws_reason:0 "Laws are in place to deprive those who are not eligible for citizenship, especially those who are disloyal or default on their debts."
 
 je_council_republic_enslavement_laws:0 "Two-legged Means of production"
 je_council_republic_enslavement_laws_reason:0 "Bourgeois who exploited our society in the past are arrested and sentenced to correctional labor. Those who monopolized the means of production will become the means of production themselves."
 
 enslavement_laws.1.t:0 "End of the Slave Hunt"
 enslavement_laws.1.d:0 "With the repeal of the Shackles law, the infamous slave hunt came to an end. The uncivilized practice of domestically supplying the demand for forced labor is over."
 enslavement_laws.1.f:0 "\"It was controversial from the start and was an evil law that could not escape international condemnation. Above all, what slaves could do was extremely limited, so it was of no help to the progressive industry.\""
 enslavement_laws.1.a:0 "To be honest, it was too savage."
 
l_english:
  #Central Asia
 KHI_FLAVOR_TEXT:0 "In defiance of both Persia and Russia, Khiva is an independent power flourishing under the rule of the Khan. Can Khiva protect its independence?"
 BUK_FLAVOR_TEXT:0 "Unlike the neighboring Khanates, the Emirs of Bukhara embrace Islamic rule rather than basing their legitimacy on descent from Genghis Khan. Will faith win the day?"
 KOK_FLAVOR_TEXT:0 "Kokand struggles with disunity and discord within the Khan's court. Can Kokand become a dominant power in Central Asia?"
 HER_FLAVOR_TEXT:0 "Shah Kamran's father brought about the fracturing of the Durrani empire when he assassinated the popular Fateh Khan. Can Kamran rebuild his base of power from Herat and reform the empire?"
 DUR_FLAVOR_TEXT:0 "The British have aided the cruel Shah Shuja to place him back on the Durrani throne after living in exile for 30 years. Will he stay a mere puppet of the British or rebuild the empire by keeping his people in line through humiliation and torture?"
 KAN_FLAVOR_TEXT:0 "After the Durrani Empire was broken up, the Dil brothers captured Kandahar. Will their burgeoning dynasty last?"
 MAI_FLAVOR_TEXT:0 "A collection of free states with the most powerful one being the Maimana Khanate. The rest of the old Durrani empire and Bukhara to the north have their eyes upon the Khanate."
 KAB_FLAVOR_TEXT:0 "Dost Mohammad recently lost the capital of Kabul to Shah Shuja thanks to backing from the British. Though Dost Mohammad has been exiled, his son carries on the fight against the British invaders in a guierrila war."
 
  # Middle-East
 EGY_FLAVOR_TEXT:0 "Under Muhammad Ali, Egypt has become independent from the Ottoman Empire in all but the most technical respect. Recent gains in Syria however are sure to incite a response from the Sublime Porte. Can Egypt survive the coming storm?"
 HDJ_FLAVOR_TEXT:0 "As the Ottoman Empire declines, the future of Arabia becomes ever more uncertain. Will a new power emerge from the desert?"
 NEJ_FLAVOR_TEXT:0 "$HDJ_FLAVOR_TEXT$"
 YEM_FLAVOR_TEXT:0 "$HDJ_FLAVOR_TEXT$"
 ABU_FLAVOR_TEXT:0 "$HDJ_FLAVOR_TEXT$"
 OMA_FLAVOR_TEXT:0 "Ruling over both Oman and Zanzibar, the Sultanate is establishing an intercontinental empire. Can Oman remain united?"

l_english:
 provincia_espannola: "Overseas Territory"
 provincia_espannola_desc: "This [concept_subject|l] will be treated as a territory with special legislation."

 provincia_espannola_action_notification_name: "[INITIATOR_COUNTRY.GetName] will treat us as an overseas territory"
 provincia_espannola_action_notification_desc: "[INITIATOR_COUNTRY.GetName] will now consider us as a territory with special legislation, which will never be exploited. As a result, our [concept_liberty_desire|l] will decrease significantly."

 provincia_espannola_action_propose_name: "$provincia_espannola$"
 provincia_espannola_action_break_name: "Revoke the status of $provincia_espannola$"

 provincia_espannola_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] considers [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] as an overseas territory with special legislation."

 provincia_espannola_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] has relegated us to a colony"
 provincia_espannola_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has relegated us to the status of colony. From now on, we will have to pay monthly tribute to the metropolis. As a result, our [concept_liberty_desire|l] will increase."

 provincia_espannola_trigger_desc_global: "They consider us $provincia_espannola$"
 provincia_espannola_trigger_false_desc_global: "#b No#! they do not consider us $provincia_espannola$"

 provincia_espannola_trigger_desc_first: "[AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] considers its subject as an overseas territory with special legislation."

 provincia_espannola_trigger_false_desc_first: "[AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] #b does not#! consider its subject as an overseas territory with special legislation."

 provincia_espannola_trigger_desc_third: "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] considers [COUNTRY.GetName] as an overseas territory"
 provincia_espannola_trigger_false_desc_third: "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] #bold does not#! consider [COUNTRY.GetName] as an overseas territory"

 provincia_espannola_action_notification_third_party_name: "[TARGET_COUNTRY.GetName] is considered an overseas territory"
 provincia_espannola_action_notification_third_party_desc: "[INITIATOR_COUNTRY.GetName] has started considering [TARGET_COUNTRY.GetName] as an overseas territory."

 provincia_espannola_action_notification_third_party_break_name: "[TARGET_COUNTRY.GetName] is considered a colony"
 provincia_espannola_action_notification_third_party_break_desc: "[INITIATOR_COUNTRY.GetName] has stopped considering [TARGET_COUNTRY.GetName] as an overseas territory."

 provincia_espannola_effect_desc_first: "[AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] will be treated as $provincia_espannola$"
 provincia_espannola_effect_desc_global: "They will treat us as $provincia_espannola$"

 ##############################
 # Representation in Courts  #
 ##############################

 representacion_en_cortes: "Representation in Courts"
 representacion_en_cortes_desc: "Allows our [concept_subject|l] to send representatives to the courts of their [concept_overlord|l] every time there are [Concept('concept_election', '$concept_elections$')|l]."

 representacion_en_cortes_action_notification_name: "Representation granted in [INITIATOR_COUNTRY.GetName]"
 representacion_en_cortes_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has allowed us to elect representatives to their courts every time there are [Concept('concept_election', '$concept_elections$')|l]. As a result, our [concept_liberty_desire|l] will decrease."

 representacion_en_cortes_action_propose_name: "$representacion_en_cortes$"
 representacion_en_cortes_action_break_name: "Remove the $representacion_en_cortes$"

 representacion_en_cortes_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] has granted seats in their courts for representatives of [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] to join the national deputies."

 representacion_en_cortes_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] has removed our Representation in their Courts"
 representacion_en_cortes_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has unilaterally removed the seats that belonged to our representatives. As a result, our [concept_liberty_desire|l] will increase."

 representacion_en_cortes_trigger_desc_global: "Has granted representation in their courts"
 representacion_en_cortes_trigger_false_desc_global: "#b No#! they have not granted representation in their courts"

 representacion_en_cortes_trigger_desc_first: "[COUNTRY.GetNameNoFlag] has granted their subject [TARGET_COUNTRY.GetName] representation in their courts"
 representacion_en_cortes_trigger_false_desc_first: "[COUNTRY.GetNameNoFlag] #b has not#! granted their subject [TARGET_COUNTRY.GetName] representation in their courts"

 representacion_en_cortes_trigger_desc_third: "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] has granted [COUNTRY.GetName] representation in their courts"

 representacion_en_cortes_trigger_false_desc_third: "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] #b has not#! granted [COUNTRY.GetName] representation in their courts"

 representacion_en_cortes_effect_desc_first: "[AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] will have representation in the courts of [COUNTRY.GetNameNoFlag]"

 representacion_en_cortes_action_notification_third_party_name: "[TARGET_COUNTRY.GetName] obtains representation in courts"
 representacion_en_cortes_action_notification_third_party_desc: "[INITIATOR_COUNTRY.GetName] has allowed [TARGET_COUNTRY.GetName] to send a [TARGET_COUNTRY.GetAdjectiveNoFormatting] legation to their courts after their [Concept('concept_election', '$concept_elections$')|l]"

 representacion_en_cortes_action_notification_third_party_break_name: "[TARGET_COUNTRY.GetName] loses representation in courts"
 representacion_en_cortes_action_notification_third_party_break_desc: "[INITIATOR_COUNTRY.GetName] has removed the right of [TARGET_COUNTRY.GetName] to send legations to their courts"

 catalyst_revocada_provincia: "reduced to a colony"
 catalyst_revocada_provincia_desc: "reduced them to the status of colony."

 catalyst_revocada_representacion: "representation revoked"
 catalyst_revocada_representacion_desc: "removed their representation in the courts"

 catalyst_oposicion_a_la_anexion: "opposition to reintegration"
 catalyst_oposicion_a_la_anexion_desc: "reintegration of Spain again"

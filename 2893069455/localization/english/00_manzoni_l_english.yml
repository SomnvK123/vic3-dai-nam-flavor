je_great_german_Illyrian:0 "Establish the Kingdom of the Trinity"
je_great_german_Illyrian_tt:0 "Drive the Habsburgs and their supporters out of Croatia!"
je_great_german_Illyrian_reason:0 "The Kingdom of the Trinity: the United Kingdom of Croatia-Slavonia-Dalmatia. The name originates from the three traditional regional concepts of the medieval Croatian Kingdom. Establishing the Kingdom of the Trinity would weaken the position of the [yellow Kingdom of Hungary] and prevent the [yellow Kingdom of Italy] from claiming the Dalmatian coastline, leaving [SCOPE.sCountry('aus_scope').GetAdjective] a landlocked country!"
TRIU_alive_tt:0 "A unified [yellow Kingdom of the Trinity] has been established, or [yellow Croatia] controls the three provinces of the coastline!"

je_great_german_plan:0 "Frankfurt German: Split Austria"
je_great_german_plan_goal:0 "[SCOPE.sCountry('aus_scope').GetAdjective]’s rule over the eastern Danube and northern Italy has been destroyed"
je_great_german_plan_tt:0 "Pressure on [SCOPE.sCountry('aus_scope').GetAdjective] has not yet begun"
je_great_german_plan_1_tt:0 "[SCOPE.sCountry('aus_scope').GetAdjective]’s rule over its various nations has started to crumble"
je_great_german_plan_2_tt:0 "[SCOPE.sCountry('aus_scope').GetAdjective]’s rule over the eastern Danube and northern Italy is about to be destroyed"
je_great_german_plan_reason:0 "When the snowmelt from the Alps flows into the Main River, the petition signed by five million [concept_germany] people has been sealed with wax in St. Paul’s Church. Since Ferdinand V violated the April Decree, the chains binding non-[concept_germany] peoples under the Habsburgs have reached their breaking point: the repression of Hungary, the Milan Five Days, the Galicia Massacre, and countless other atrocities.\n\nWe demand that, starting from the publication of this notice, the multi-ethnic suppression forces be disbanded, the Italian troops be withdrawn north of the Alps; the 'Special Law of the Croatian Border Area' be repealed, the Slavic gendarmerie be disbanded; Budapest, Milan, and Prague be made free cities under the supervision of [SCOPE.sCountry('frm_scope').GetAdjective] Parliament; and that ethnic self-determination be respected, allowing peoples to elect their own governments or kings...\n\nUltimatum: If the black-red-gold tricolor flag is not raised atop the Hofburg Dome within ninety days from now: 1. [SCOPE.sCountry('pru_scope').GetAdjective]’s North German Customs Union will cut off all trade routes to the Adriatic Sea 2. The royal [SCOPE.sCountry('bav_scope').GetAdjective] army will occupy Salzburg 3. [SCOPE.sCountry('frm_scope').GetAdjective]’s Constitutional Defense Bureau will have the right to arrest any member of the Habsburg royal family."

dsk_prussia.43.t:0 "The Olomouc Treaty"
dsk_prussia.43.d:0 "For the first time, the Christmas tree in the Mirror Hall of Schönbrunn Palace was not adorned with Venetian glass ornaments, as [SCOPE.sCharacter('aus_ruler').GetFirstName] trembled while signing the Olomouc Treaty. The parchment, edged in black, stated: '[SCOPE.sCountry('aus_scope').GetAdjective] permanently renounces sovereignty over the Kingdom of Lombardy-Venetia and promises to focus military forces on the common defense of the [concept_germany] Confederation...'"
dsk_prussia.43.f:0 "As the fires along the Danube painted the sky red, in St. Paul’s Church on the banks of the Main River, five hundred thirty-four representatives of the [concept_germany] states were engaged in fierce debate over the unification charter. A [SCOPE.sCountry('frm_scope').GetAdjective] representative suddenly raised his silver-handled cane to point southeast: 'Gentlemen, the Habsburg army is suppressing the Kingdom of Sardinia in Italy, while our [concept_germany] youth bleed for a foreign crown!'\n\nAs the quill broke when writing 'Confederation of [concept_germany]', [SCOPE.sCharacter('aus_ruler').GetFirstName] suddenly recalled yesterday’s audience with [SCOPE.GetRootScope.GetCountry.GetName][Concept('concept_ruler','$RULER_TITLE_KING$')][ROOT.GetCountry.GetRuler.GetFirstName]—who was wearing the newly designed [concept_germany] crown, receiving the homage of diplomats from the states."
dsk_prussia.43.a:0 "Embrace [concept_germany], my Austrian brothers."

later_dsk_empire_war:0 "Relations with [SCOPE.sCountry('aus_scope').GetAdjective] will be temporarily eased"

dsk_prussia.37.t:0 "Dissolve the Frankfurt Parliament"
dsk_prussia.37.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]’s army executes the king’s order in St. Paul’s Church, sealing the parliamentary archives"
dsk_prussia.37.f:0 "The deputy of the Count of [SCOPE.sState('capital_scope').GetName] cut through the parliamentary curtain with his sword, as the gendarmerie threw the 'Imperial Constitution Draft' into the fireplace. The Bavarian representative's cigar box was found to contain the secret treaty of the South German Confederation, while the broken black-red-gold flag wrapped around the unfinished hymn of the Swabian poet was stuffed into a Prussian supplies box.\n\nAt the Mainz bridgehead checkpoint, the Württemberg delegation’s carriage was seized, and the confederation flag in the carriage's compartment bore the wax seal of the Grand Duke of Baden. A Hanoverian clerk attempting to rescue the stenographer’s notebook had ink spilled on the seating chart, staining the Saxon Electorate area with Prussian blue."
dsk_prussia.37.a:0 "The next day, Potsdam issued the 'Dissolution Decree' legal document"
dsk_prust.38.t:0 "Rhineland Industrial Zone and Silesian Mineral Resources" 
dsk_prust.38.d:0 "Engineers measure the distance between coal and iron using railways, as the steam hammer sounds from the Cologne steel factory and the blasting sounds from Upper Silesian mines match in frequency."
dsk_prust.38.f:0 “When coal is transported in the Ruhr Valley and unloaded by ships, the Director of the Cologne Metrology Bureau is adjusting the new rail scale, with each car's weight not exceeding half a ton. Jewish mine owners in Upper Silesia hold geological maps from the Berlin Geological Society, using Hungarian explosives to blast trapezoidal tunnels in compliance with the 'Prussian Mining Code.' \n\nAs Krupp Steel Factory's three smokestacks expel sulfur oxides into the Rhine fog, accountants at Oder River Transport Company calculate freight ratios for coke and brown iron ore. Rail ties show dual measurements: below, a Prussian engineer’s metric scale, above, Polish counting symbols written in chalk by Silesian miners.\n\nA copper barometer brought by a Salzburg trade representative hangs in the Breslau Mining Association Hall, its needle trembling at the "Rhineland-Silesian Transport Template" event. Samples of coke from Aachen mixed with magnetic iron sand from Gleiwitz form a unique Prussian blue glass at the bottom of a crucible."
dsk_prust.38.a:0 "Industrial machines and roaring sounds, a unique romanticism of [concept_germany]." 
modifier_pru_develop_1:0 "Silesian Mineral Resources"
modifier_pru_develop_2:0 "Rhineland Industrial Zone" 
je_dsk_prust.army:0 "Iron and blood" 
je_dsk_prust.army_reason:0 "Most of the world's problems cannot be solved by scholars sitting and discussing them. I believe most of the world's issues must be solved with iron and blood; truth only lies within the range of cannon fire! I, Prussia, am the hammer on the banks of the Rhine. Every strike shatters the chains of the fragmented Confederation!"
je_dsk_prussia_army:0 "Iron and Blood"  
je_dsk_prussia_army_reason:0 "Most problems in this world cannot be solved by you scholars sitting and talking endlessly. I believe the majority of global issues must be resolved with iron and blood—truth only exists within the range of artillery fire!\n\nI, Prussia, am the forge hammer of the Rhine, crushing the chains of confederacies with every strike! My railways pierce through the rot of Germany, while the smokestacks of Cologne's steelworks spew black-red-gold poison—the executioner's smoke for separatists! The gilded invitations from Vienna's court? Melted into cannonballs and loaded into Krupp's barrels!\n\nBehold my bootprints—the rivets of the Posen Railway silenced Poland's whimpers, Silesian mineshaft explosives shattered Austria's facade! As Moltke's staff drives compasses into Parisian maps, my cavalry brands the Hall of Mirrors with eagle insignias using horseshoes! Bavarian beer steins? Mere dregs for quenching my crown!\n\nThe parchment screams of Frankfurt Parliament burn in Berlin's furnaces, their ashes flying to Königsberg to cast the lead type for the Imperial Proclamation! Southern silk banners? Just rags to polish my bayonets! Hearken—the thunder of Königgrätz echoes through my veins, Alsatian iron ore flows in my marrow!\n\nThe feathers of Austria's double-headed eagle jam my tank treads—I crush its broken spine and toss the Habsburg crown into the Ruhr's slag pool!"  
 
law_mass_conscription_button:0 "Implement Universal Conscription"  
law_mass_conscription_button_desc:0 "The sound of bullets chambering is the only language our enemies understand"  
 
dsk_prussia.39.t:0 "Karlsruhe Unification Manifesto"  
dsk_prussia.39.d:0 "Bavaria, Saxony, and 23 other German states submit accession documents to the German Confederation"  
dsk_prussia.39.f:0 "Core provisions of the Manifesto include:\n\n1. Heidelberg University integrated into Prussian education\n2. Baden Rhine tariffs transferred to Berlin\n3. Judicial system adopts the Prussian Civil Code\n4. Demolish border towers between Kehl and Mannheim\n5. Baden dragoons to adopt Prussian grey uniforms\n6. Karlsruhe Arsenal repurposed for Mauser rifle components"  
dsk_prussia.39.a:0 "This is the romance unique to [concept_germany] people"  
 
every_south_country_will_help_us_tt:0 "All non-[concept_puppet] [concept_germany] minor states will become our [concept_puppet]"  
germany_country_modifier:0 "Prussian German Confederation"  
 
je_dsk_prussia_economy:0 "Prussian German Confederation"  
je_dsk_prussia_economy_reason:0 "#v My fellow [concept_germany] brethren!#!\n\nWhen Rhine waves crash against thirty-four tariff barriers, when Bavarian beer and Saxon porcelain rot in customs ledgers, when Hanoverian steeds pierce hooves on border spikes—how can we tolerate this land of Goethe and Beethoven remaining fragmented pawns on Europe's chessboard?\n\nBehold these staggering numbers: 300 coats-of-arms splinter our bloodline, 2,000 currencies taint our soul. Between Berlin and Munich, 400km of track require 17 carriage changes! This insults [concept_germany] intellect and desecrates Germanic spirit!\nWe are not Swabian sheep, Rhenish vines, nor cakes at Viennese balls! From Schleswig snows to Tyrolean peaks, Königsberg's amber shores to Salzburg's salt mines—every German heartbeat drums in unison!\nLet Vienna's polyglot bureaucrats, Parisian mockers of our dialects, London bankers shorting [concept_germany] bonds tremble! When black-red-gold banners crown Cologne Cathedral, 40 million chests from Elbe shipyards to Ruhr furnaces will roar: Heil! Heil! Heil! Deutschland!"  
 
je_dsk_prussia_reform:0 "Prussian National Reforms"  
je_dsk_prussia_reform_reason:0 "When Frankfurt Parliament's parchment constitutions turned to ash under princely sneers, when 350 professors' debates were crushed under Prussian hooves, Germany's spine hardened with bloody truth: ink cannot extinguish Junker muskets, parliamentary chandeliers cannot illuminate divided lands! Let Rhine poets sing freedom odes—but unification demands Krupp steel tonnage, Moltke's sand tables, Bismarck's gunpowder-stained palms! Let compromisers cower in legal margins—we'll ignite Leipzig's battlefires with Ruhr coke, weave General Staff maps from Silesian looms, turn Bavarian beer barrels into Palatinate bugles! Today we break parliament's quills—tomorrow Wilhelm's coronation train shall thunder from Königsburg to Strasbourg rails, making Europe hear the Teutonic war chariot crushing 38 state crests!"  
je_dsk_prussia_reform_tt:0 "The enemy is neither [SCOPE.sCountry('fra_scope').GetName] nor [SCOPE.sCountry('rus_scope').GetName], but those hiding behind walls of greed!"  
 
je_dsk_prussia_reform_goal:0 "Complete Three Reforms"  
 
je_ger_ita_union:0 "German-Italian Alliance"  
je_ger_ita_union_reason:0 "When Alpine snows reflect both black eagles and tricolors, when Po and Rhine smokes crystallize as vengeful salt on Viennese silver, the [SCOPE.sCountry('ger_scope').GetName]-[SCOPE.sCountry('ita_scope').GetName] pact becomes no mere diplomatic game—but a steel lever to tilt Europe!\nGaribaldi's Redshirts tear Lombardy's chains while Prussian howitzers shred Austrian squares at Königgrätz! Every inch of Piedmontese track northward forges Krupp artillery firing pins! Twin daggers stab Habsburg eagles—one severs Adriatic ropes sinking Venetian crowns, another pierces Bohemia's armor seams reducing Prague's banners to ash! When Berlin-Turin bugles echo through Tyrol, Metternich's balance of power becomes candleflame—for we mold Europe's new map with nationalist lava, igniting Alpine volcanoes to burn old thrones into unification's forge!\n\n#yellow German-Italian Alliance#! Monthly relations #v increase#! via:\n• Maintaining #green +2#! with #yellow either signatory#!\n• #green +2#! for #yellow alliance#! or #bold interests pact#!"  
 
je_ger_ita_union_tt:0 "[SCOPE.sCountry('ger_scope').GetName] and [SCOPE.sCountry('ita_scope').GetName] friendship conquers mountains and seas!"  
 

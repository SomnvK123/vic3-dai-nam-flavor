Split_Austria_tt:0 "[SCOPE.sCountry('aus_scope').GetName]'s [SCOPE.sCharacter('crisis_scope_1').GetFirstName] may give up the [concept_hungary_kindom] crown or may choose to join [SCOPE.sCountry('rus_scope').GetName] in suppressing the [concept_hungary_kindom] uprising!"
annex_other_germany_countries_button:0 "Unite with the German states"
annex_other_germany_countries_button_desc:0 "The time has come, the cause of German unification is about to be completed!"
dsk_prussia.33.t:0 "Elected Crown"
dsk_prussia.33.d:0 "The dome of St. Paul’s Church echoed with thirty-four chimes, and the constitutional parchment, inlaid with the Habsburg black eagle and the Hohenzollern silver spear, was signed under the Bavarian blue, Saxon green, and Hanoverian gold seals."
dsk_prussia.33.f:0 "When the last Mecklenburg representative pressed their wax seal to the treaty, the spring mist of the Rhine River suddenly rolled into the tributary of the Main River. The court painter in Vienna hurriedly modified the sketch of Franz Joseph’s coronation ceremony—what was once the Hungarian Crown, suspended in the top left corner of the canvas, was now surrounded by forty ribbons bearing Germanic coats of arms. The Prussian diplomats secretly measured the circumference of the church’s columns, only to find that the ceramic columns supporting the dome matched the caliber of the newly cast artillery pieces in the Berlin armory.\n\nCatholics from the University of Prague lit three-colored candles, and the shadow of the Bohemian Crown appeared in the flames; merchants in Hamburg added a new “Imperial Mark” column to their ledgers, which was blown away by the Bremen sea winds before the ink dried. On the Baden diplomat's carriage, the silver handrails that once separated Austria and Prussia were quietly melting under the vibrations of the South German dialects. Only the portrait of Jesus in the Hungarian hall cracked, the crack running perfectly through the pearl trim of the Magyar Crown.\n\nAs night fell, twelve carriages carrying treaty copies sped off in different directions. Their tracks carved strange concentric circles in the muddy ground, as if foreshadowing that this empire, forcefully stitched together, would soon burst open under centrifugal force."
dsk_prussia.33.a:0 "All embrace the [SCOPE.GetRootScope.GetCountry.GetName] [Concept('concept_ruler','$RULER_TITLE_KING$)] as the Emperor of all [concept_germany]."

dsk_prussia.34.t:0 "The Fallen Hungarian Crown"
dsk_prussia.34.d:0 "[SCOPE.sState('capital_scope').GetCityHubName]’s ultimatum turned to paper scraps on the stone steps of the Pest Parliament Hall, as Kossuth Lajos’ declaration of independence was carved into the sandstone on the western bank of the Danube by rebel cavalry. [SCOPE.sCountry('aus_scope').GetName]’s [SCOPE.sCharacter('crisis_scope_1').GetFirstName] officially renounced the Hungarian Kingdom's crown."
dsk_prussia.34.f:0 "“When the seventh dawn saw the Austrian troops retreat from the Eger Fortress, the iron chains that had bound the Danube's floating bridges for eighty years suddenly snapped. The loosened cast-iron rings drifted downstream and piled into black islands beneath Buda Hill—this was the site of the furnace where Queen Maria Theresa had once melted down the pieces of the Hungarian Crown. The tax records sent from the Vienna court burned beneath the Széchenyi Chain Bridge, with ashes revealing the fragments of the 'Golden Edict' written in Magyar.\n\nThe retreat paths of twenty Austrian border regiments were meandering, their supply carts constantly getting stuck in the spring mud. These wagons, which were supposed to carry imperial taxes, were now filled with the shredded German music sheets from the Pest Opera House and Tokaji wine growing sour in the Buda Palace cellar. Hungarian light cavalry took up crescent formations on the Tisza River plains, their sabers reflecting a unique spectrum of light—this light was forged from the prisms brought by the Krakow exiles.\n\nThe tricolor flag of the French Republic flickered across the walls of Pressburg, while a Sardinian envoy was testing the range of a new rifle. Even the ink of the London 'Times' had been stained by the smoke of the uprisings, its editorial headline deliberately displaced by the typesetters, changing 'Magyar Rebellion' to 'Majestic Rebirth.' Only the Tisza River’s trout suddenly altered their migration route, their scales reflecting the long-lost coat of arms of the Árpád dynasty in the April sunshine.”"
dsk_prussia.34.a:0 "Though the tyrant's crown has fallen, the blood spilled by the Hungarians will never flow back."

dsk_prussia.36.t:0 "[SCOPE.sCharacter('landowners_leader_scope').GetLastName] Era"
dsk_prussia.36.d:0 "[SCOPE.sState('capital_scope').GetCityHubName] Parliament, look to the north! Brothers, the tyrant’s laws are strangling my motherland!"
dsk_prussia.36.f:0 "“When the first steamship on the Rhine blew its whistle, [SCOPE.sCountry('pru_scope').GetAdjective] engineers were calculating the curvature of the railway from Berlin to Potsdam, while Bavarian farmers still sowed rye according to the Tyrolean Agricultural Calendar. The thirty-eight sovereign entities of [concept_germany_country] were entangled on the parchment map of the [SCOPE.sState('capital_scope').GetName] conference, as Metternich’s spies scurried through the Heidelberg University library, secretly replacing the pages of the 'Hänbach Declaration' with Goethe’s poetry collection.\n\nUnder the incomplete spire of the Cologne Cathedral, Rhineland merchants settled iron trade transactions with the new currency of the Customs Union—this economic alliance led by Prussia had already absorbed eighteen states, but it was still viewed by the Hanoverian royal family as 'a nail in the Saxon needle box.' The weavers of Württemberg watched British mechanically printed fabrics flood the Stuttgart market, their protests drowned by the copperplate printing press of the Carlsbad Decree. The copper bell of the Frankfurt Stock Exchange tolled every half hour, competing with the organ of St. Paul’s Church for control of the city’s auditory sovereignty.”"
dsk_prussia.36.a:0 "Lead me to the autocratic unification of [concept_germany]."
dsk_prussia.36.b:0 "Lead me to the democratic unification of [concept_germany]."

no_aus_tt:0 "[SCOPE.sCountry('aus_scope').GetName] has supported our leadership in [concept_germany] and our union."

je_ger_empire_meeting_1:0 "Imperial Parliament"
je_ger_empire_meeting_1_reason:0 "#v Imperial Parliament#! was established at the founding of #o Frankfurt German#!, as an important component of the #o Frankfurt German#! political system.\n\nThe election laws of #v Imperial Parliament#! were written into the imperial constitution, adopting universal, equal, and direct elections, marking an important cooperation between bourgeois liberalism and Bismarckian politics during Germany’s unification process.\n\nAlthough #v Imperial Parliament#! can decide whether to approve a decree or fiscal budget, it itself lacks legislative power and cannot propose a vote of no confidence in the government. Legislative power is primarily held by the Federal Council (Bundesrat), which is composed of representatives of the rulers of various states.\n\nThe following conditions will enhance the #v Imperial Parliament#!'s #yellow influence#!. When #yellow influence#! reaches a sufficient level, a policy can be enacted:\n• Execute #yellow eligibility-based elections#! or #yellow universal suffrage#! (#green +2#!).\n• Execute #yellow secret police#! or #yellow national gendarmerie#! (#green +1#!).\n• Implement any #yellow health institutions#! (#green +1#!).\n• Military size > #yellow 300#! (#green +1#!).\n• Own #yellow Qingdao#! (#green +1#!).\n• Nation’s status as a [concept_super_power] (#green +2#!)."

je_great_german_Italy:0 "Against Habsburg Italy"
je_great_german_Italy_reason:0 "[SCOPE.sCountry('aus_scope').GetAdjective], you have humiliated the Italian people too much. When the olive trees of [SCOPE.sCountry('tus_scope').GetAdjective] withered for the third time due to harsh taxes, we must ask: Why do those soldiers who should be guarding [concept_germany]’s shield instead drag their rusted bayonets across the plains of Italy, measuring their people's indignation? The Habsburg double-headed eagle, so proud in the Vienna court, now fixes one eye on the [SCOPE.sCountry('frm_scope').GetAdjective] parliament’s scepter, while the other greedily pecks at the pearls of the Venetian Lagoon. This divided vision will blind the empire in the end.\n\nRecall your cavalry from the Romagna marshes and let the rusted imperial insignia be reforged at the foot of the Innsbruck Mountains. A new celestial map is rising along the Danube—calibrated by Baden engineers’ rulers, Prussian steelworks’ quenching pools, and Hamburg merchants’ marine chronometers.\n\nOtherwise, we shall meet on the battlefield."
je_great_german_Italy_tt:0 "Drive the Habsburgs and their supporters out of Italy!"

je_great_german_Romania:0 "Against Habsburg Transylvania"
je_great_german_Romania_reason:0 "On the general staff’s bronze globe, Chief of Staff [SCOPE.sCharacter('mir_dil').GetFullName] drew a thrilling arc in red crayon—from the Sudeten Mountains all the way to the port of Rijeka." Your Majesty, this is the best incision for [SCOPE.sCountry('aus_scope').GetName]’s blood."

je_great_german_Bulgaria:0 "Against the Ottoman Legacy"
je_great_german_Bulgaria_reason:0 "The Grand Chamberlain of the Empire, [SCOPE.sCharacter('mir_dil').GetFullName], turned towards the port of Varna as his brow furrowed. The course of the Danube River was changing, its path already torn open by the Napoleonic Wars. The plague had washed through the Balkan plains, and no Christian shrine was left untouched by the invaders’ hordes. The Ottoman flag fluttered in Sofia’s gray light, and the Parliament’s halls were filled with the air of old empires. The fate of the Habsburgs’ empire and of the Ottoman Empire lies in the same blood."
je_great_german_Romania_tt:0 "Drive the Habsburgs and their supporters out of Transylvania!"

make_alliance_italy_button:0 "Prussia-Italy Anti-Austria Pact"
make_alliance_italy_button_desc:0 "Italy shares the same desire as Prussia to resist Austria!"

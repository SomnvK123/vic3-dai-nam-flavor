dsk_prussia.46.t:0 "Times Cooperation Memorandum"  
dsk_prussia.46.d:0 "Rhine engines sync with Thames financial pendulum"  
dsk_prussia.46.f:0 "While pistons and stock charts compose hegemony's concerto, war clouds seem to lift. Yet Krupp's blueprints for magnetic mines against British ships gather dust underground, and Bank of England hides forged purity reports on 1856 Chinese indemnity gold... As Lord Rosebery wrote: 'Our German embrace is two drunks waltzing over abyss—one misstep tears off finery to reveal chainmail and poison.'"  
dsk_prussia.46.a:0 "Treitschke's disciples teach 'German Unification Saved Europe' at Oxford"  
kind_germany_modifier:0 "Era of Peace"  
 
dsk_prussia.47.t:0 "Anti-German Coalition War"  
dsk_prussia.47.d:0 "France publishes *Teutonic Ogre* cartoons; Russia forges *Berlin Secret Pact*; *Times* exposes 'Ulstein Plan'"  
dsk_prussia.47.f:0 "General Staff activates Total War Protocol:\n1. [SCOPE.sCountry('fra_scope').GetAdjective] mobilizes 1.2 million (incl. Algerian troops)\n2. [SCOPE.sCountry('gbr_scope').GetAdjective] sends expeditionary force under Belgian neutrality pretext\n3. [SCOPE.sCountry('rus_scope').GetAdjective] masses 500k Cossacks\n4. [SCOPE.sCountry('ita_scope').GetAdjective] colludes with Papal States\n\nWar looms—prepare!"  
dsk_prussia.47.a:0 "Greater Germany is Europe's rulers' shared nightmare of fear and greed."  
 
je_against_ger_union:0 "Shadow of Greater Germany"  
je_ger_fra_union_modifier:0 "Rising Pan-European Anti-German Sentiment"  
je_against_ger_union_goal:0 "Our diplomatic neglect triggers Europe's fears!"  
je_against_ger_union_reason:0 "Our [SCOPE.GetRootScope.GetCountry.GetName] alliance with #yellow Austria#! casts dread across Europe. London's Rothschilds dump Rhineland bonds into Thames pyres. Napoleon's coffin vibrates to Verdun artillery. Tsarist cloaks brush Kazan Madonna icons reflecting East Prussian armored trains carrying pan-Slavic bombs."  

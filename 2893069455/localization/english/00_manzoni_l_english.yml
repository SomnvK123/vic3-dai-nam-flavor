dsk_prussia.40.t:0 "Warning from Olmütz"  
dsk_prussia.40.d:0 "[SCOPE.sCountry('aus_scope').GetName] and [SCOPE.sCountry('rus_scope').GetName] demand we abandon leadership of [concept_germany] states and withdraw troops!"  
dsk_prussia.40.f:0 "In the General Staff's secret chamber, Colonel [SCOPE.sCharacter('white_army_general').GetFirstName] stabs a red-blue pencil at the Bohemian border: 'Your Majesty, we could have assembled twenty regiments at Torgau—our rail network mobilizes three days faster than [SCOPE.sCountry('aus_scope').GetAdjective]!' But I know he swallowed the rest: our treasury's thalers last only three weeks of war, while Frankfurt bankers hoard gold marks in Leipzig cellars. Worse—Tsar [SCOPE.sCharacter('ruler_scope').GetFirstName]'s envoy stands before Baltic maps in Winter Palace, sneering that if [SCOPE.GetRootScope.GetCountry.GetName] challenges Vienna's order, Russian Guards will crush [SCOPE.sState('capital_state').GetName] like they shattered [SCOPE.sCulture('sweden_culture').GetName] in 1709."  
dsk_prussia.40.a:0 "How many divisions do the Austro-Russian alliance have to dictate terms?!"  
dsk_prussia.40.b:0 "Spare us, Austrian grandfather—we kneel and sign the Treaty of Olmütz!"  
 
je_dsk_prussia_laws:0 "Prussian Constitutional Compromise"  
je_dsk_prussia_laws_reason:0 "In the bloody embers of 1848 revolutions, Germans finally saw their fragmented land's true shackles—not Vienna or Paris, but Junker nobles under Berlin's gilded domes, Rhine industrialists' golden webs, and profiteers trading national blood for private gain.\n\nWhile customs union rails carried coal and steel forward, rotten diets still locked progress with parchment charters. As millions sang *Die Wacht am Rhein*, princes poisoned unification flags with intrigue. Reform is now survival—shatter 38 crown-forged chains, let freedom/equality/rule-of-law reshape Germany's spine, so a true people's empire may rise from Europe's storms."  
 
dsk_prussia.41.t:0 "Edict on Prussian Constitutional Reform"  
dsk_prussia.41.d:0 "While [SCOPE.sCountry('aus_scope').GetAdjective] chains peasants with feudalism, I sow deadlier reforms in East Prussia"  
dsk_prussia.41.f:0 "This reform's true legacy: wrapping militarism's gunpowder in parliament's sugar, forging a devil's pact between autocracy and democracy. By Europe's awakening, a monster had risen—approving war budgets via votes and empowering General Staff through constitutional clauses. Olmütz's humiliation became Old Europe's death certificate."  
dsk_prussia.41.a:0 "Local assemblies exhaust liberals with debates while real power flows via railways to Berlin's General Staff."  
 
dsk_prussia.42.t:0 "Dynastic Wars"  
dsk_prussia.42.d:0 "Decades of silent preparation culminate today"  
dsk_prussia.42.f:0 "Now Vienna kneels to my steam engine's heartbeat—this war beast, fed on 49 years of humiliation, greased with constitutional gears, bolted by compulsory education, pressurized by universal conscription, forges all [concept_germany] into steel rails piercing Old Europe's heart.\n\nBehold! Habsburg worms who mocked 'North German bumpkins' are shredded by Dreyse rifle fire. Metternich's lace diplomacy burns in Bohemian fields. Danube waltz halls become graveyards under Essen-forged boots!"  
dsk_prussia.42.a:0 "Gentlemen, hail this glorious moment!"  
 
aus_agree_us_tt:0 "[SCOPE.sCountry('aus_scope').GetAdjective] agreed to form [concept_germany] with us"  
 
dsk_prussia.44.t:0 "Paris Peace Memorandum"  
dsk_prussia.44.d:0 "Paris stops spying on Ruhr's smoke—French bank gold now stamped with 'Rhineland Power Grid' emblems"  
dsk_prussia.44.f:0 "But this isn't naive peace! Wolfsburg bunkers preserve mortar production lines, each barrel engraved with Élysée Treaty Amendment XXII: 'Peace's sword must outshine militarism'."  
dsk_prussia.44.a:0 "My generation's peace—temporary"  
 
dsk_prussia.45.t:0 "St. Petersburg Accord"  
dsk_prussia.45.d:0 "Memel-Vladivostok rails marked 'Steel-Wheat Prosperity Artery'"  
dsk_prussia.45.f:0 "Potsdam's new St. Nicholas Cathedral displays Tsar-donated iconostasis—St. George slaying dragon altered to Teutonic Knight crushing French lilies. Perhaps our engineers will join Siberian railway projects next."  
dsk_prussia.45.a:0 "In St. Petersburg-Berlin's name"  

je_ger_rus_union_tt:0 "German-Russian relations demand reexamination"  
je_ger_rus_union_reason:0 "Morse codes from [SCOPE.sState('capital_scope').GetName] translate Berlin's philosophy into *New Era* headlines: 'Rhine Engines Melt Polar Ice'. Cossack hooves stir Memel's fog—Lithuania's double-headed eagle adopts Prussian blue trim. Forged *Pan-Germanic Claims* documents fuel German militarism."  
 
je_nazi_ger_union:0 "Rise of Radical Pan-Germanism"  
je_nazi_ger_union_reason:0 "The 1848 'cultural nation' concept birthed at Frankfurt's St. Paul's Church mutated into Europe-devouring beast. Greater [concept_germany] fuses Goethe's humanism, Hegel's dialectics, and Krupp's violence into ideological alloy.\n\n#yellow Nazism#! #tooltippable;tooltip:[Country.GetTooltipTag],je_nazi_ger_pos advances#! progress, while #yellow liberalism#! #tooltippable;tooltip:[Country.GetTooltipTag],je_nazi_ger1_pos reverses#! it."  

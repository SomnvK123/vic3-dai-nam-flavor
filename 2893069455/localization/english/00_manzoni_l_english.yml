je_aus_hun_revolution:0 "Rust of the Danube"
je_aus_hun_revolution_tt:0 "#yellow Habsburg#!'s double-headed eagle pecks at the code, it says: [concept_germany]'s sword, only for the tyrant's coronation!"
je_aus_hun_revolution_reason:0 "The twilight gives the Danube silver scales, the Vienna Opera House on the left bank emits golden light, while the mills in Pest on the right bank have already extinguished their lanterns. The crown, passed down since the time of #yellow St. Stephen#!, now glimmers coldly in the glass case at the Hofburg Palace—its Paraíba tourmaline, originally a gift from the Carpathians, has now become a pledge to the [concept_germany] bank.\n\nSpring floods carry the wheat seeds from the Tisza River westward, while returning cargo ships carry cast-iron plows bearing the double-headed eagle emblem. These metallic tools, which sink deep into the Magyar black soil, will become the tax collectors' beads come harvest season. The eagle stone carvings of Buda Hills still stretch their wings, but every shadow of their feathers hides the Latin annotations of the "Croatian Border Guard Regulations".\n\nWhen the tenth bell tolls from the clock tower of [SCOPE.sCountry('frm_scope').GetAdjective], the youths with Jena University curls are whispering fervently under the kerosene lamp: 'Let the Hungarian cauldron boil itself—our forge of the sword of the nation should not include Bohemian zinc ore.'\n\nOutside, the Main River ripples strangely, as if foreseeing those petition papers soaked in blood next March."
every_germany_country_will_be_our_puppet_tt:0 "#v The great times lie ahead of us, all [concept_germany] small nations will agree with our ideas and join the great cause of unifying [concept_germany]!#!"
we_are_Frankfurt_german_tt:0 "#v We have established #yellow Frankfurt German#!#!"
aus_dual_monarchy.8.t:0 "Abandon the Hungarian crown"
dsk_aus.29.t:0 "Black, red, and gold tricolor flag"
dsk_aus.29.d:0 "When the eagle flies over the Alps carrying the constitution, spring vines sprout from the tyrant's tombstone."
dsk_aus.29.f:0 "Listen! The waves of the Rhine shatter the chains,\nThe wind in the Black Forest howls the truth’s maxims.\n\nFrom the spires of Cologne to the fields of Bavaria,\nThe torch of freedom ignites the plains of April.\n\nThe parliament's bell tolls, breaking the dusk of the princes,\nNo more Prussian eagles or Baden deer.\n\nForty-eight stars guide history’s wheel,\nThe black, red, and gold tricolor flag will guide my path!"
dsk_aus.29.a:0 "The black, red, and gold [concept_germany] lives forever in the blood, long live [SCOPE.GetRootScope.GetCountry.GetName]!"
dsk_aus.29.b:0 "The black, red, and gold [concept_germany], let us move forward together, long live [SCOPE.GetRootScope.GetCountry.GetName]!"
je_great_german:0 "Frankfurt German Proposal"
je_great_german_reason:0 "[SCOPE.sCountry('frm_scope').GetAdjective] National Assembly members, while dealing with the Schleswig crisis, are also discussing which territories should be included in the unified [concept_germany]. Since both [SCOPE.GetRootScope.GetCountry.GetName] and [SCOPE.sCountry('aus_scope').GetName] have large non-[concept_germany] territories outside the Confederation, whether or not these territories should be incorporated into [concept_germany] became the focus of discussion.\n\nSubsequently, the assembly proposed two plans: 'Greater [concept_germany]' and 'Lesser [concept_germany]'. 'Lesser [concept_germany]' is led by Prussia and excludes Austria from [concept_germany], while 'Greater [concept_germany]' includes Austria in [concept_germany], but with two variations: one where only the [concept_germany] territories of [SCOPE.sCountry('aus_scope').GetName] are included, and the other where non-[concept_germany] territories of [SCOPE.sCountry('aus_scope').GetName] are included as well.\n\nOn October 27, the Frankfurt National Assembly passed the 'Greater [concept_germany]' plan, but only allowed [SCOPE.sCountry('aus_scope').GetName] Germans and their lands to join the unified [concept_germany]."
je_great_german_tt:0 "#o No more tyrants! No more oppression! The [concept_germany] people must walk the [concept_germany] path!#!"
give_up_hun_button:0 "Incite [concept_magyar] Uprising!"
give_up_hun_button_desc:0 "The same torch that once burned through the nights of thirty princes, I hear the stones of Budapest crying out, that crown, adorned with lies, will completely bind Hungary’s soul!"
help_hun_button:0 "Help [concept_magyar] independence!"
help_hun_button_reason:0 "Tear down the butcher's decree disguised in German, spit on the emperor's 'Holy Alliance', until the crown falls into the Danube's forge and no foreign oppressors remain!"
dsk_prussia.35.t:0 "#yellow Vienna#!'s Tyrant"
dsk_prussia.35.d:0 "German liberal scholars propose to join the [concept_hungary_kindom] uprising to help [concept_magyar] independence"
dsk_prussia.35.f:0 "When the fifth flood of the Danube tears through the docks of Budapest, dark red wine barrels float down the current to Pest City. Inside the barrels, besides the honeyed aroma of Tokaji wine, are metallurgic blueprints designed by Jena University, and arms lists encoded with the score of the 'Nibelungenlied'. Vienna's palace spies could never understand why those professors who sang 'Guard the Rhine' in the [SCOPE.sCountry('frm_scope').GetAdjective] assembly suddenly took an interest in [concept_hungary_kindom] folk songs—until they discovered that the firing arcs of the Komárom fortress batteries matched the star maps drawn by the Stuttgart observatory perfectly.\n\n[SCOPE.sCharacter('crisis_scope_1').GetLastName]'s double-headed eagle casts a shadow over the [concept_hungary_kindom] parliament dome, but it did not notice the growing light spots within its shadow: the fifteen steam hammers mysteriously damaged by the Berlin Mechanical Association were soon roaring in the Debrecen farm tool factory; eight hundred copies of 'Magyar Grammar' donated by the Württemberg poets hid defense maps of Baden light cavalry under their covers. In the Leipzig coffeehouse, the rules of the chess game suddenly changed—someone always opens with [concept_hungary_kindom] and whispers as they take the white castle: 'It’s time for the eagle to return to the Carpathian peaks.'"
dsk_prussia.35.a:0 "Let’s begin the war! Fight together against the Habsburg tyrant and help [concept_magyar]!"
dsk_prussia.35.b:0 "Let’s help [concept_magyar] through material support and aiding the rear battlefields!"
annex_germany_button_desc:0 "Join us in the great cause of unifying [concept_germany]!"

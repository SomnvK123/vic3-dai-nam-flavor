l_english:
 desamoritzacion_medizabal: "Expropriations of the Catholic Church"
 desamoritzacion_medizabal_desc: "The state coffers are not in their best shape, but by requisitioning church property and auctioning it off to the small bourgeoisie, we can make a few extra profits."
 desamoritzacion_medizabal_tt: "#bold Mendizábal#! is their [concept_leader|l]"
 desamoritzacion_medizabal_tt1: "#bold Espartero#! is their [concept_leader|l]"
 desamoritzacion_medizabal_tt2: "If the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName|l] remains [concept_powerful|l], using its influence, auctions will be rigged to prevent losing too much influence, and the [GetPopType('aristocrats').GetName] along with the [GetPopType('shopkeepers').GetName] and [GetPopType('farmers').GetName] will not be able to invest in their properties."

 acabar_descontento_dominicano: "End Dominican Resistance"
 acabar_descontento_dominicano_desc: "Through small local collaborators, we can increase our acceptance among the Dominican people."

 quitar_bandoleros_andalucia: "End banditry in Andalusia"
 quitar_bandoleros_andalucia_desc: "We must get rid of the bandits and outlaws that populate the old Spanish land of Andalusia."

 ambiciones_en_guinea: "Establish presence in Guinea"
 ambiciones_en_guinea_desc: "With the undisputed control of Fernando Poo island, the doors are open for us to step onto continental land in Guinea. We must demand that other nations recognize our sovereignty."
 ambiciones_en_guinea_info: "A conference will begin where #tooltippable #tooltip:[GetPlayer.GetTooltipTag],participating_powers_some#!#! [Concept('concept_great_power', '$concept_great_powers$')|l] will decide whether [ROOT.GetCountry.GetName] deserves to hold #bold Spanish Guinea#!. If so, you will be able to send ultimatums to the [Concept('concept_country', '$concept_countries$')|l] that occupy it. If [ROOT.GetCountry.GetName] is a [concept_great_power|l], it will vote for itself favorably. If it is occupied by [Concept('concept_decentralized_nation', '$concept_decentralized_nations$')|l], you can take it directly."
 ambiciones_en_guinea_info2: "Make sure that the [Concept('concept_great_power', '$concept_great_powers$')|l] that #tooltippable #tooltip:[GetPlayer.GetTooltipTag],participating_powers_some#!#! have a good [concept_attitude|l] towards you along with good [concept_relations|l]. The [Concept('concept_political_lobby', '$concept_political_lobbies_short$')|l] also influence if they are in the [concept_government|l]. You must occupy #bold Spanish Guinea#! within #bold 10 years#!."

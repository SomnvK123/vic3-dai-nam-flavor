l_english:
 je_ambiciones_guinea_potencias: "$je_ambiciones_guinea$"
 je_ambiciones_guinea_potencias_reason: "$je_ambiciones_guinea_reason$"
 je_ambiciones_guinea_potencias_goal: "A result has been determined in the next #bold 13#! months"

 aceptar_reclamo_espannol_name: "Support [SCOPE.sCountry('spa_scope').GetName]"
 aceptar_reclamo_espannol_desc: "We cannot go against the rules imposed in the division of Africa"
 no_ha_apoyado_a_espana: "[SCOPE.sCountry('spa_scope').GetName]'s claims have not been supported yet"

 rechazar_reclamo_espannol_name: "Deny [SCOPE.sCountry('spa_scope').GetName]"
 rechazar_reclamo_espannol_desc: "Spain does not deserve to be given territory in Guinea"
 no_ha_rechazado_a_espana: "[SCOPE.sCountry('spa_scope').GetName]'s claims have not been denied yet"

 potencias_que_participan: "To have a voice and vote, a [concept_great_power|l] must have either a [concept_interest|l], a [concept_state|l], or some [concept_subject|l] in the [Concept('concept_strategic_region','$concept_strategic_regions$')|l] of the #bold Congo#! and #bold Niger#!"

 je_ambiciones_guinea: "Guinea Issue"
 je_ambiciones_guinea_reason: "Our [concept_country|l] has a historic claim on the coast of Guinea due to the long-standing possession of #bold Fernando Poo#! Island in the [SCOPE.sState('scope_camerun').GetStateRegion.GetName]. It is time to demand from the other [Concept('concept_great_power', '$concept_great_powers$')|l] that it is our right to obtain a strip of land on the mainland.\n\n#tooltippable #tooltip:[GetPlayer.GetTooltipTag],potencias_que_participan Participating#!#! #variable [GetGlobalVariable('numero_paises_participando').GetValue]#! [Concept('concept_great_power', '$concept_great_powers$')|l]:\n#variable [GetGlobalVariable('votos_positivos_espana').GetValue]#! have #bold supported#! [SCOPE.sCountry('spa_scope').GetName]'s claims\n#variable [GetGlobalVariable('votos_negativos_espana').GetValue]#! have #bold rejected#! [SCOPE.sCountry('spa_scope').GetName]'s claims\n\nIn case of a tie, [SCOPE.sCountry('spa_scope').GetName]'s claims will be supported.\nIf [SCOPE.sCountry('spa_scope').GetName] also meets the #tooltippable #tooltip:[GetPlayer.GetTooltipTag],potencias_que_participan requirements#!#!, it will participate by always supporting itself."

 je_ambiciones_guinea_conferencia: "The conference will conclude in #variable [GetGlobalVariable('meses_restantes_conferencia').GetValue]#! months"
 je_ambiciones_guinea_si: "We have the support to demand"
 je_ambiciones_guinea_no: "We do not have a valid claim"

 apoyar_reclamos_espannoles_guinea_tt: "We will support #bold Spain#!'s claim"
 renegar_reclamos_espannoles_guinea_tt: "We will reject #bold Spain#!'s claim"

 je_ambiciones_guinea_tt: "We have the [Concept('concept_province','provinces')] that once belonged to #bold Spanish Guinea#!"
 je_ambiciones_guinea_tt1: "We lost #bold Fernando Poo#! Island!"

 ultimatum_ocupador1_name: "Expedition to the northern coastal [concept_province|l]"
 ultimatum_ocupador1_desc: "We must secure a coastal base to begin occupying the interior."

 ultimatum_ocupador2_name: "Expedition to the southern coastal [concept_province|l]"
 ultimatum_ocupador2_desc: "We must secure a coastal base to begin occupying the interior."

 ultimatum_ocupador3_name: "Expedition to the interior [concept_province|l]"
 ultimatum_ocupador3_desc: "The interior of Guinea is the area that offers the most natural resources."
 ultimatum_ocupador3_tt: "[ROOT.GetCountry.GetName] controls an adjacent [concept_province|l] to the interior one ([concept_province|l] southern coastal)"

 ha_terminado_conferencia_guinea: "The Guinea conference has ended (there are #variable [GetGlobalVariable('meses_restantes_conferencia').GetValue]#! months remaining) and it is in our favor"
 exigir_todo_territorio_guinea_espanola: "We will demand all the [Concept('concept_province','provinces')] in #bold Spanish Guinea#!"
 no_ha_presentado_ninguna_exigencia: "No [concept_country|l] is deliberating a claim from [ROOT.GetCountry.GetName]"

 gui.1.t: "Claim by [SCOPE.sCountry('scope_reclamador').GetAdjectiveNoFormatting] on Guinea"
 gui.1.d: "[SCOPE.sCountry('scope_reclamador').GetName] has requested recognition of its legitimacy over its claims in the Gulf of Guinea. It seeks approval from the other [Concept('concept_great_power', '$concept_great_powers$')|l] to send several ultimatums to the occupiers."
 gui.1.f: "In the bustling conference room, surrounded by luxurious tapestries and the clinking of teacups, diplomats from [SCOPE.sCountry('scope_reclamador').GetName], wearing top hats and impressive mustaches, worked hard to win recognition of their claims in the Gulf of Guinea.\n\n- 'Our historical right is undeniable,' proclaimed the [SCOPE.sCountry('scope_reclamador').GetAdjectiveNoFormatting] ambassador with theatrical gestures.\n\nIn front of him, representatives of other [Concept('concept_great_power', '$concept_great_powers$')|l] exchanged skeptical glances. A British diplomat, adjusting his tie, cleverly responded:\n\n- 'History, my dear friend, sometimes fades before present realities.'"
 gui.1.a: "They have our approval"
 gui.1.b: "We will never tolerate any [SCOPE.sCountry('scope_reclamador').GetAdjectiveNoFormatting] in Guinea"

 gui.2.t: "Demand for compliance from [SCOPE.sCountry('spa_scope').GetName]"
 gui.2.d: "[SCOPE.sCountry('spa_scope').GetName], based on the legitimacy given by its possession of Fernando Poo in [SCOPE.sState('scope_camerun').GetStateRegion.GetName], has requested recognition of its right to establish a base on the coast of [SCOPE.sState('scope_gabon').GetStateRegion.GetName], a decision supported by the [Concept('concept_great_power', '$concept_great_powers$')|l]."
 gui.2.f: "The Spanish Territories in the Gulf of Guinea were a group of island and continental territories controlled by Spain from 1778 in the Gulf of Guinea and the Gulf of Biafra, in Central Africa.\n\nAfter some years of relative neglect, during which there was even a brief English occupation, Spanish possession was solidified after an expedition by Juan José Lerena y Barry to Fernando Poo in 1843."
 gui.2.a: "We must respect the agreements"
 gui.2.b: "They will snatch it from our cold hands"

 gui.3.t: "Occupation of [SCOPE.sState('camerun_scope').GetName]"
 gui.3.d: "After the complete collapse of [SCOPE.sCountry('spa_scope').GetName]'s dominion in [SCOPE.sState('camerun_scope').GetName] and the existing power vacuum, several of our explorers occupied the island, claiming it for [ROOT.GetCountry.GetName]"
 gui.3.f: "Due to the lack of support from the metropolis, diseases, and hostility from the natives, a rebellion breaks out in the colony. The rebels capture the highest Spanish authority. The new leader evacuated the colony, directing the survivors to São Tomé. After learning that the capital had been destroyed by the natives, and after an English attack on São Tomé, the Spaniards decided to return to the continental [ROOT.GetCountry.GetName], abandoning the islands."
 gui.3.a: "Don’t look a gift horse in the mouth"

 gui.4.t: "[SCOPE.sState('camerun_scope').GetName] requests support"
 gui.4.d: "Many settlers in [SCOPE.sState('camerun_scope').GetName] complain about the poor working conditions and demand assistance from [ROOT.GetCountry.GetName] to improve their situation."
 gui.4.f: "During most of the 19th century, the colonization of Fernando Poo Island was a significant burden for Spain. Its unhealthy climate combined with a lack of natural resources to exploit on the island led to settlers repeatedly asking the metropolis for aid, which was typically drawn from the funds allocated to Cuba."
 gui.4.a: "We cannot allow such disgrace"
 gui.4.b: "As if we didn’t already have enough expenses at home"
 gui.4.c: "It’s the Ministry of the Colonies that should pay"

 gui.5.t: "Payment for the occupation of Fernando Poo"
 gui.5.d: "Many settlers in [SCOPE.sState('camerun_scope').GetName] complain about the poor working conditions and demand assistance from [SCOPE.sCountry('spa_scope').GetName] to improve their situation, which has decided that [ROOT.GetCountry.GetName] will take on this cost."
 gui.5.f: "$gui.4.f$"
 gui.5.a: "We have to pay for others' adventures"

 gui.6.t: "The Guinea Question"
 gui.6.d: "[SCOPE.sState('camerun_scope').GetOwner.GetName] has controlled [SCOPE.sState('camerun_scope').GetName] for years and now demands access to the African mainland"
 gui.6.f: "Article 1: The islands of Fernando Poo, Annobón, Corisco, Elobey Grande, and Elobey Chico, and the continental territory of Guinea, whose sovereignty was recognized by [SCOPE.sState('camerun_scope').GetOwner.GetName] through the Treaty with France of June 27, 1900, shall constitute, for the purposes of their governance and administration, a single legal entity, officially named 'Spanish Territories of the Gulf of Guinea' – Royal Decree of July 12, 1904."
 gui.6.a: "We’re going to take action there"
 gui.6.b: "I don’t care about this issue"

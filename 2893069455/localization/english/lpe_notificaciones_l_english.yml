l_english:
 notification_la_gloriosa_notification_name: "Glorious Revolution"
 notification_la_gloriosa_notification_desc: "After a successful initial coup in the city of [SCOPE.sState('estado_desembarco').GetStateRegion.GetPortHubName] and a subsequent mass uprising, with military support from [SCOPE.sCharacter('militar_golpista_uno').GetLastName] and [SCOPE.sCharacter('militar_golpista_dos').GetLastName], the Bourbon regime has been overthrown. A power struggle looms in [SCOPE.sCountry('spa_scope').GetName]."
 notification_la_gloriosa_notification_tooltip: "#header $la_gloriosa_notification_name$#!\n$TOOLTIP_DELIMITER$\n$la_gloriosa_notification_desc$"

 notification_ascenso_de_isabel_notification_name: "Coronation of [SCOPE.sCountry('spa_scope').GetRuler.GetFirstName] II"
 notification_ascenso_de_isabel_notification_desc: "The political class of [SCOPE.sCountry('spa_scope').GetName] has decided that [SCOPE.sCountry('spa_scope').GetRuler.GetFullName] is now capable of assuming the crown of [SCOPE.sCountry('spa_scope').GetName]. This week, they will swear the constitution in [SCOPE.sCountry('spa_scope').GetCapital.GetCityHubName] before the courts."
 ascenso_de_isabel_notification_tooltip: "#header $ascenso_de_isabel_notification_name$#!\n$TOOLTIP_DELIMITER$\n$ascenso_de_isabel_notification_desc$"

 notification_fin_guerra_carlista_isabelinos_name: "Isabeline Victory in [SCOPE.sCountry('spa_scope').GetName]"
 notification_fin_guerra_carlista_isabelinos_desc: "After more than 4 years of fighting, the troops loyal to [SCOPE.sCountry('spa_scope').GetHeir.GetFirstName] managed to defeat the Carlists. General [SCOPE.sCountry('spa_scope').GetAdjectiveNoFormatting] [SCOPE.sCharacter('general_esp').GetLastName] met with Carlist General Maroto to end the conflict and negotiate the surrender of the Carlist forces."
 fin_guerra_carlista_isabelinos_tooltip: "#header $notification_fin_guerra_carlista_isabelinos_name$#!\n$TOOLTIP_DELIMITER$\n$notification_fin_guerra_carlista_isabelinos_desc$"

 notification_exilio_familia_real_carlista_name: "Exile of the Carlist Royal Family"
 notification_exilio_familia_real_carlista_desc: "Faced with the imminent defeat of the Carlists, the infante has fled to the [concept_exile|l] with the entire royal family to continue the struggle from abroad."
 exilio_familia_real_carlista_tooltip: "#header $notification_exilio_familia_real_carlista_name$#!\n$TOOLTIP_DELIMITER$\n$notification_exilio_familia_real_carlista_desc$"

 notification_exilio_heredero_real_carlista_name: "Exile of [SCOPE.sCharacter('heredero_scope').GetFullName]"
 notification_exilio_heredero_real_carlista_desc: "Faced with the imminent defeat of the Carlists, [SCOPE.sCharacter('heredero_scope').GetFullName] has fled to the [concept_exile|l] alone, to continue the struggle from abroad. However, their father has decided to continue the armed fight in [SCOPE.sCountry('spa_scope').GetName] to the bitter end, an act that has slightly boosted Carlist morale."
 exilio_heredero_real_carlista_tooltip: "#header $notification_exilio_heredero_real_carlista_name$#!\n$TOOLTIP_DELIMITER$\n$notification_exilio_heredero_real_carlista_desc$"

 notification_fin_guerra_carlista_carlsitas_name: "Carlists' Victory in [SCOPE.sCountry('car_scope').GetName]"
 notification_fin_guerra_carlista_carlsitas_desc: "After more than 4 years of fighting, the Carlist troops managed to defeat the Isabelines, finally securing the Spanish crown for [SCOPE.sCountry('car_scope').GetRuler.GetFullName]. Major changes loom for [SCOPE.sCountry('car_scope').GetName]."
 fin_guerra_carlista_carlsitas_tooltip: "#header $notification_fin_guerra_carlista_carlsitas_name$#!\n$TOOLTIP_DELIMITER$\n$notification_fin_guerra_carlista_carlsitas_desc$"

 notification_motin_de_la_granja_name: "La Granja de San Ildefonso Uprising"
 notification_motin_de_la_granja_desc: "[GetPopType('officers').GetName] of the Royal Guard at the La Granja de San Ildefonso palace in Segovia ([SCOPE.sCountry('spa_scope').GetName]) have revolted while [SCOPE.sCountry('spa_scope').GetRuler.GetFullName] was on vacation there. The [GetPopType('officers').GetName] demand the return of the #bold Spanish Constitution of 1812#!"
 motin_de_la_granja_tooltip: "#header $notification_motin_de_la_granja_name$#!\n$TOOLTIP_DELIMITER$\n$notification_motin_de_la_granja_desc$"

 notification_voto_positivo_name: "Support of [SCOPE.sCountry('scope_yo').GetName]"
 notification_voto_positivo_desc: "[SCOPE.sCountry('scope_yo').GetName] has given its approval to our claim over #bold Guinea#!"
 voto_positivo_tooltip: "#header $notification_voto_positivo_name$#!\n$TOOLTIP_DELIMITER$\n$notification_voto_positivo_desc$"

 notification_voto_abstencion_name: "Abstention of [SCOPE.sCountry('scope_yo').GetName]"
 notification_voto_abstencion_desc: "[SCOPE.sCountry('scope_yo').GetName] has decided not to interfere with our claim over #bold Guinea#!"
 voto_abstencion_tooltip: "#header $notification_voto_abstencion_name$#!\n$TOOLTIP_DELIMITER$\n$notification_voto_abstencion_desc$"

 notification_voto_negativo_name: "Rejection of [SCOPE.sCountry('scope_yo').GetName]"
 notification_voto_negativo_desc: "[SCOPE.sCountry('scope_yo').GetName] has rejected our claim over #bold Guinea#!"
 voto_negativo_tooltip: "#header $notification_voto_negativo_name$#!\n$TOOLTIP_DELIMITER$\n$notification_voto_negativo_desc$"

 notification_pais_se_niega_a_entregar_guinea_tooltip: "#header $pais_se_niega_a_entregar_guinea_name$#!\n$TOOLTIP_DELIMITER$\n$pais_se_niega_a_entregar_guinea_desc$"
 notification_pais_se_niega_a_entregar_guinea_name: "[SCOPE.sCountry('scope_yo').GetName] refuses to comply"
 notification_pais_se_niega_a_entregar_guinea_desc: "[SCOPE.sCountry('scope_yo').GetName] has rejected the demand to comply with international dictates and has refused to deliver its portion of Guinea. If we want to acquire it, it will have to be through [concept_diplomatic_demand|l]."

 notification_segunda_guerra_carlista_name: "Carlist Uprising in [SCOPE.sCountry('spa_scope').GetName]"
 notification_segunda_guerra_carlista_desc: "Years of political instability in [SCOPE.sCountry('spa_scope').GetName] have fueled the Carlist cause. The [SCOPE.sCountry('car_scope').GetAdjective], led by [SCOPE.sCountry('car_scope').GetRuler.GetFullName], are once again challenging the [SCOPE.sCountry('spa_scope').GetAdjective] regime of [SCOPE.sCountry('spa_scope').GetRuler.GetFullName]."
 segunda_guerra_carlista_tooltip: "#header $segunda_guerra_carlista_name$#!\n$TOOLTIP_DELIMITER$\n$segunda_guerra_carlista_desc$"

 notification_renuncia_reclamos_hiberoamerica_name: "[SCOPE.sCountry('spa_scope').GetName] Renounces #bold Hispanoamérica#!"
 notification_renuncia_reclamos_hiberoamerica_desc: "Finally, [SCOPE.sCountry('spa_scope').GetName] has decided to bring an end to the Wars of Spanish American Independence, which have been ongoing since 1809, announcing the abandonment of all [SCOPE.sCountry('spa_scope').GetAdjectiveNoFormatting] claims over #bold Hispanoamérica#!."
 renuncia_reclamos_hiberoamerica_tooltip: "#header $notification_renuncia_reclamos_hiberoamerica_name$#!\n$TOOLTIP_DELIMITER$\n$notification_renuncia_reclamos_hiberoamerica_desc$"

 notification_anuncio_reclamos_hiberoamerica_name: "[SCOPE.sCountry('spa_scope').GetAdjective] Claim over #bold Hispanoamérica#!"
 notification_anuncio_reclamos_hiberoamerica_desc: "[SCOPE.sCountry('spa_scope').GetName] has announced the organization of new reconquest expeditions to #bold Hispanoamérica#!, which put the new republics in jeopardy. This decision has provoked outrage among the [Concept('concept_great_power', '$concept_great_powers$')|l], who want to prevent a strengthening of [SCOPE.sCountry('spa_scope').GetName]."
 anuncio_reclamos_hiberoamerica_tooltip: "#header $notification_anuncio_reclamos_hiberoamerica_name$#!\n$TOOLTIP_DELIMITER$\n$notification_anuncio_reclamos_hiberoamerica_desc$"

 notification_lider_carlista_regresa_name: "[SCOPE.sCountry('car_scope').GetRuler.GetFullName] returns to [SCOPE.sCountry('car_scope').GetName]"
 notification_lider_carlista_regresa_desc: "After hearing news of a new Carlist uprising in [SCOPE.sCountry('spa_scope').GetName], [SCOPE.sCountry('car_scope').GetRuler.GetFullName] quickly returned to [SCOPE.sCountry('car_scope').GetName] to reclaim their rightful title as king."
 lider_carlista_regresa_tooltip: "#header $notification_lider_carlista_regresa_name$#!\n$TOOLTIP_DELIMITER$\n$notification_lider_carlista_regresa_desc$"

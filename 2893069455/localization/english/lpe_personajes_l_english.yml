 esp.1.t: "The Rise of [SCOPE.sCharacter('prim_scope').GetFullName]"
 esp.1.d: "A renowned colonel, hero of the 1st Carlist War, has managed to carve a niche for himself in the Spanish political sphere, demanding liberal reforms in the country."
 esp.1.f: "[SCOPE.sCharacter('prim_scope').GetFullName], Count of Reus, Marquis of los Castillejos and Viscount of Bruch, was a liberal military and politician from the 19th century who became president of the Council of Ministers. In his military life, he participated in the 1st Carlist War and the 1st War of Morocco, showing relevant leadership, bravery, and recklessness. After the Revolution of 1868, he became one of the most influential men in [ROOT.GetCountry.GetAdjective] Spain, sponsoring the enthronement of the House of Savoy in the person of Amadeo I. He was assassinated shortly after."
 esp.1.a: "Undoubtedly what the country needs."
 esp.1.b: "We don’t need another revolution."

 esp.2.t: "Carlist Uprising"
 esp.2.d: "Several years of political instability have been exploited by the [SCOPE.sCountry('car_scope').GetAdjective] forces with the aim of restoring [SCOPE.sCountry('car_scope').GetRuler.GetFullName], grandson of Carlos María Isidro, to the [ROOT.GetCountry.GetAdjective] throne, deposing [ROOT.GetCountry.GetRuler.GetFirstName] as [concept_ruler|l]."
 esp.2.f: "[SCOPE.sCountry('car_scope').GetRuler.GetFirstName], Duke of Madrid, Carlist claimant to the throne, had been preparing the insurrection from exile for months. Quickly, Carlos's supporters managed to secure the entire northern part of the peninsula in their favor. \n\nBy order of Don Carlos, the uprising would be carried out with the cry of «Down with the foreigner! Long live Spain!»."
 esp.2.a: "We will win for [ROOT.GetCountry.GetName]."
 esp.2.b: "¡Dios, Patria, Fueros y Rey!"

 esp.3.t: "Coronation of [ROOT.GetCountry.GetHeir.GetFirstName]"
 esp.3.d: "Due to immediate necessity, it has been decided that [ROOT.GetCountry.GetHeir.GetFirstName] at the age of #variable [ROOT.GetCountry.GetHeir.GetAge]#! years is ready to assume the role of queen of [ROOT.GetCountry.GetName]."
 esp.3.f: "[ROOT.GetCountry.GetHeir.GetFirstName] II of [ROOT.GetCountry.GetName], known as «the one of Sad Destinies» or «the True Queen», was queen of [ROOT.GetCountry.GetName] between 1833 and 1868, thanks to the repeal of the Succession Regulation of 1713 (commonly called the «Salic Law») by the Pragmatic Sanction of 1830. This led to the insurgency of Infante Carlos María Isidro, brother of Ferdinand VII and uncle of [ROOT.GetCountry.GetHeir.GetFirstName] II, who had already tried to declare himself king with the support of the so-called «Carlists» during Ferdinand’s agony."
 esp.3.a: "Let’s hope she is better than her father."

 esp.4.t: "Siege of Bilbao"
 esp.4.d: "The [SCOPE.sCountry('car_scope').GetAdjective] have laid siege to the important city of Bilbao. Losing it would be a severe blow to the [concept_morale|l] of the troops."
 esp.4.f: "At the beginning of 1836, the Carlists faced «...an economic insufficiency that threatened their very survival.» Juan Bautista Erro decided to negotiate loans worth one million reales in London. Ignacio Lardizábal was in charge of the negotiation, but he failed to secure them as he could not provide sufficient guarantees. «In this situation, the possession of a stronghold like Bilbao could serve as the necessary collateral to secure foreign loans and investments.»"
 esp.4.a: "We shall never surrender the city"
 esp.4.b: "We trust in the garrison"
 esp.4.a_tt: "The siege reaches a stalemate"
 bilbao_perdido_barra: "The progress bar of #variable $alzamientos_carlistas_bar$#! will increase by #bold #red 10#!#! points."


 esp.5.t: "End of the Persecution of Liberal Newspapers"
 esp.5.d: "Due to the lack of [concept_authority|l], we have had to stop censoring the liberal newspapers. [SCOPE.sCharacter('leader_ig').GetLastName] has greatly benefited from this situation."
 esp.5.f: "«The pen became as feared as the sword» – Exclaimed Martín\n\nA brave editor, Martín Serrano, led a liberal newspaper that openly defied the oppression of the absolutist government.\n\nHis incendiary words inspired the masses, but also provoked the fury of the authorities. Censorship fell on his publication, blacking out every line that challenged the status quo. Despite the repression, Serrano and his team persisted, distributing copies of their newspaper clandestinely to keep the flame of resistance alive in the shadows of a silenced press."
 esp.5.a: "Damn it."

 esp.6.t: "Changes in the Regency"
 esp.6.d: "The great instability in [ROOT.GetCountry.GetName] has led [ROOT.GetCountry.GetRuler.GetLastName] to challenge the authority of Queen Regent María Cristina and assume the role of [Concept('concept_ruler', 'regent')|l] of the kingdom in order to ensure the regime’s continuity."
 esp.6.f: "The moderate government presented a draft municipal law that reduced local government powers. The progressives strongly opposed it. This led to a campaign for the [Concept('concept_ruler', 'regent')|l] not to sanction the law and for General Espartero to avoid its promulgation. Progressive revolts broke out throughout [ROOT.GetCountry.GetName], where revolutionary councils were formed to challenge the government’s authority. Finally, Queen [Concept('concept_ruler', 'regent')|l] abandoned the regency, and Espartero assumed her role."
 esp.6.a: "Let’s see if [ROOT.GetCountry.GetRuler.GetLastName] can control the situation."
 esp.6.b: "The parliament votes to crown [ROOT.GetCountry.GetHeir.GetFirstName]."
 esp.6_tt1: "[ROOT.GetCountry.GetHeir.GetFirstName] will be crowned by decree."

 esp.7.t: "The Glorious Revolution"
 esp.7.d: "A quick landing at [SCOPE.sState('estado_desembarco').GetStateRegion.GetPortHubName] by several exiles, supported by [SCOPE.sCharacter('militar_golpista_uno').GetLastName] and [SCOPE.sCharacter('militar_golpista_dos').GetLastName], managed to march on [SCOPE.sState('capital').GetStateRegion.GetCityHubName] and take control. [ROOT.GetCountry.GetRuler.GetFirstName] had no choice but to flee the country."
 esp.7.f: "Spaniards: the city of [SCOPE.sState('estado_desembarco').GetStateRegion.GetPortHubName] has risen with all its province (...) denying obedience to the government in [SCOPE.sState('capital').GetStateRegion.GetCityHubName], sure that it is the loyal interpreter of the people (...) and determined not to lay down arms until the Nation regains its sovereignty, expresses its will, and is fulfilled. Such is [ROOT.GetCountry.GetName] today. Spaniards, who abhors it so much that they do not dare to exclaim: «Thus it must always be»? - Cádiz, 1868."
 esp.7.a: "[ROOT.GetCountry.GetHeir.GetFirstName] must ensure a future."
 esp.7.b: "Down with the Bourbons, long live the republic!"
 esp.7.c: "The Duke of Aosta is elected as [Concept('concept_ruler', 'king')|l] of the Spaniards."
 esp.7_tt: "#bold Amadeo di Savoia-Aosta#!, a [GetIdeology('ideology_humanitarian_royalist').GetName], will be the new [Concept('concept_ruler', 'king')|l] of [ROOT.GetCountry.GetName]"

 esp.7.razon: "The [concept_heir|l] [ROOT.GetCountry.GetHeir.GetFirstName] will be the new [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."

 esp.8.t: "The Age of Pronunciamentos"
 esp.8.d: "With the coronation of [ROOT.GetCountry.GetRuler.GetFullNameWithTitle], many are expecting much from their reign. It is necessary to maintain stability in [ROOT.GetCountry.GetName] if we want the regime to survive."
 esp.8.f: "Pronunciamentos in [ROOT.GetCountry.GetName] refer to a series of military uprisings that took place throughout the 19th and early 20th centuries. These uprisings were a way in which the military attempted to influence the country’s politics, often in an effort to defend the interests of their own group or faction. Pronunciamentos reflected the political instability and the struggle for power in [ROOT.GetCountry.GetName] throughout much of the 19th century and early 20th century. Although they may have been effective in some cases at achieving political changes, they also served as a reminder of the country's tendency to rely heavily on military force to maintain political stability."
 esp.8.a: "Interesting decades ahead."

 esp.9.t: "The Royal Expedition"
 esp.9.d: "[SCOPE.sCountry('car_scope').GetRuler.GetFullName] has started a series of campaigns across the north to gather support throughout [ROOT.GetCountry.GetName]."
 esp.9.f: "The Royal Expedition was the name given to [SCOPE.sCountry('car_scope').GetRuler.GetFullName]'s attempt to take Madrid and dethrone his niece [ROOT.GetCountry.GetHeir.GetFullName], starting with an army from the [Concept('concept_state', 'navarro')] territory controlled by the [SCOPE.sCountry('car_scope').GetAdjective|l].\n\nThe strategy was to march through [Concept('concept_state', 'Aragon')] to [Concept('concept_state', 'Catalonia')], reinforce the army with [SCOPE.sCountry('car_scope').GetAdjective|l] troops there, cross the Ebro, and meet with Cabrera's forces in the Maestrazgo. This would give the army enough strength to face any Cristino army and secure the path to seize [Concept('concept_state', 'Madrid')] and place the Pretender on the throne."
 esp.9.a: "The [SCOPE.sCountry('car_scope').GetAdjective|l] will not secure another inch of land."
 esp.9.b: "We cannot divert our attention."
 esp.9.b_tt3: "The [SCOPE.sCountry('car_scope').GetAdjective|l] insurgents will secure the lower area of [SCOPE.sState('aragon_español').GetStateRegion.GetName]."
 esp.9.b_tt: "The [SCOPE.sCountry('car_scope').GetAdjective|l] will besiege #bold Barcelona#!"
 esp.9.b_tt1: "The [SCOPE.sCountry('car_scope').GetAdjective|l] insurgents will rise to the north of [SCOPE.sState('valencia_español').GetStateRegion.GetName]."

 esp.10.t: "The Pact of Ostende"
 esp.10.d: "In the small port of Ostende, near the [SCOPE.sCountry('ocupador_flanders').GetAdjective] city of [SCOPE.sState('flanders_scope').GetStateRegion.GetPortHubName], [SCOPE.sCharacter('agitador_esp_scope').GetFullName] has joined a written declaration opposing the current [ROOT.GetCountry.GetAdjective] regime."
 esp.10.f: "The Pact of Ostende was the agreement signed on August 16, 1866, in the Belgian city of Ostende by the Progressive Party and the Democratic Party, initiated by the progressive General Juan Prim, to overthrow the monarchy of Isabel II of [ROOT.GetCountry.GetName]. This pact, to which the Liberal Union joined in early 1868, was the origin of 'La Gloriosa', the revolution that deposed the Spanish queen in September 1868."
 esp.10.a: "We need to get rid of that bastard."
 conspirando1: "The progress bar of #variable $establidad_reinado_isabel$#! will increase by #bold #red 100#!#! points."

 esp.11.t: "The Rise of Republicanism"
 esp.11.d: "Following the decision of the moderate wing of the [GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetName] after the Glorious Revolution to maintain the [GetLawType('law_monarchy').GetName], the [GetIdeology('ideology_republican_leader').GetName] wing, which supports a [GetLawType('law_presidential_republic').GetName], is enraged. A prominent politician, named [SCOPE.sCharacter('ig_lider').GetFullName], has made his way within the ranks of [GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetName], becoming its leader."
 esp.11.f: "[SCOPE.sCharacter('ig_lider').GetFullName], who studied Law, was an advocate of a federal model for the state, blending influences from Proudhon, democratic socialism, and libertarian socialism. Opposed to the [GetLawType('law_monarchy').GetName] in any of its forms, he actively participated in the opposition, suffering censorship, imprisonment, and exile. After the Glorious Revolution, he became a deputy in the Cortes, where he led the Federal Party, and was Minister of the Interior under Estanislao Figueras. After Figueras's resignation, the Cortes elected him president, a position he assumed on June 11, 1873. From there, he confronted the Third Carlist War and the Cantonal Revolution, defending the 1873 Federal Constitution Project. He was forced to resign just over a month later, on July 18, due to the impossibility of governing after the Cantón de Cartagena."
 esp.11.a: "We came out of one hole to fall into another."

 esp.12.t: "Uprisings in [SCOPE.sState('estado_rebelde').GetStateRegion.GetCityHubName]"
 esp.12.d: "A group of liberals, supported by the national guard, led an uprising today in the city of [SCOPE.sState('estado_rebelde').GetStateRegion.GetCityHubName] in [SCOPE.sState('estado_rebelde').GetStateRegion.GetName], demanding the restoration of the #bold Constitution of 1812#!."
 esp.12.f: "The liberals' response to the dismissal was to initiate a series of popular revolts in various cities, often led by the National Guard, which spread throughout the country—particularly in Málaga, Zaragoza, and Barcelona—and accompanied by attempts of insurrection from some military units."
 esp.12.a: "We must restore order."

 esp.13.t: "The Constitution of [ROOT.GetCountry.MakeScope.Var('anno').GetValue|0]"
 esp.13.d: "The signing of this constitution for [ROOT.GetCountry.GetName] will finally bring an end to the #bold Royal Statute of 1834#!, along with the old regime, marking the beginning of a new era for the nation."
 esp.13.f: "The Constitution of [ROOT.GetCountry.MakeScope.Var('anno').GetValue|0] established a constitutional and representative monarchy, recognizing certain rights and freedoms for citizens. Among its main features was restricted censitary suffrage, which limited the right to vote to a minority of citizens with certain property. Despite these limitations, it set an important precedent in the establishment of a parliamentary system and the protection of certain civil rights.\nAdditionally, it established the separation of powers, with a Legislative Power formed by the General Courts and an Executive Power led by the monarch, who was to exercise authority alongside a Council of Ministers responsible to the Courts."
 esp.13.a: "We finally managed to reclaim what Riego started."

 esp.14.t: "Uprising on the Levant Coast"
 esp.14.d: "After gathering significant support from multiple garrisons, many municipalities have decided to start supporting the Carlist cause."
 esp.14.f: "The restoration by the Pretender in July 1872 of the fueros abolished by the Nueva Planta decrees of Felipe V influenced the strength of the uprising in Catalonia, and to a lesser extent in Valencia and Aragón."
 esp.14.a: "The Carlists are gaining supporters."

 esp.15.t: "The Mutiny at La Granja de San Ildefonso"
 esp.15.d: "[GetPopType('officers').GetName] from the [SCOPE.sPoliticalMovement('movimiento_scope').GetName] of the Royal Guard at the La Granja de San Ildefonso palace in Segovia have mutinied while [ROOT.GetCountry.GetRuler.GetFirstName] was there."
 esp.15.f: "Months of intense mutinies and uprisings culminated in this crucial event. During the mutiny, [ROOT.GetCountry.GetRuler.GetFirstName] and her entourage attempted to convince them to lay down their arms, reminding them that the enemy was the Carlists. The two mutineers responded that they were fighting not only 'for the rights of our queen' but also 'for liberty'. When the meeting ended, the mutinous [GetPopType('officers').GetName] demanded another meeting, during which the regent was forced to sign, in the early hours of the morning, a decree restoring the 'Political Constitution of the year 12, until the nation gathers in Cortes to express its will, or gives another Constitution according to its needs.'"
 esp.15.a: "I hope it doesn't end like in 1823."
 esp.15_tt: "When the revolutionary [Concept('concept_interest_group', '$concept_interest_groups$')|l] calm down, the new Constitution will be proclaimed."
 esp.16.t: "Provincial Board of [SCOPE.sState('estado_junta').GetStateRegion.GetCityHubName]"
 esp.16.d: "A group of [GetPopType('officers').GetName] together with [GetPopType('bureaucrats').GetName] affiliated with the local [SCOPE.gsInterestGroup('intel_ig').GetName] have proclaimed in the city of [SCOPE.sState('estado_junta').GetStateRegion.GetCityHubName], in [SCOPE.sState('estado_junta').GetStateRegion.GetName], the creation of a Provincial Board demanding the return of the #bold Constitution of 1812#!."
 esp.16.f: "The liberal [GetPopType('officers').GetName] were quick. A mob, along with National Guard troops, quickly stormed the government buildings in [SCOPE.sState('estado_junta').GetStateRegion.GetCityHubName], and it wasn't long before contact was lost with the local administration."
 esp.16.a: "We lose the country"
 esp.16.tooltip: "The [concept_legitimacy|l] of the [concept_government|l] will be affected depending on the number of [Concept('concept_state', '$concept_state$')|l] with the [concept_modifier|l] of ‘$junta_provincial$’"
 esp.16_tooltip2: "A #bold #red +100.0%#!#! of the [Concept('concept_pop', '$concept_pops$')|l] from each [concept_interest_group|l] [Concept('concept_political_movement_pressure', 'pressured')] by the [SCOPE.sPoliticalMovement('movimiento_scope').GetName] will become more [Concept('concept_radical', '$concept_radicals$')|l] in [SCOPE.sState('estado_junta').GetName]"

 esp.17.t: "Indiscipline in the army"
 esp.17.d: "Today, the [GetPopType('soldiers').GetName] of the [SCOPE.sBuilding('cuartel_malo').GetName] in [SCOPE.sState('estado_isubordinacion').GetStateRegion.GetName] have committed acts of insubordination in front of their superiors."
 esp.17.f: " - We fight under inhuman conditions and haven’t been paid for a long time - said a soldier.\n\nDuring the First Carlist War, one of the most recurring issues for the army was the non-payment of salaries to the troops, which caused deep unrest among the soldiers and contributed to instability and demoralization within the Isabeline army."
 esp.17.a: "We must improve their conditions"
 esp.17.b: "The state cannot afford more expenses"
 esp.17.b_tt: "The soldiers in the [SCOPE.sBuilding('cuartel_malo').GetName|l] of [SCOPE.sState('estado_isubordinacion').GetStateRegion.GetName] will lose some of their [concept_morale|l]"

 esp.18.t: "Expedition of [SCOPE.sCharacter('gomez_damas').GetLastName]"
 esp.18.d: "The Carlist [concept_general|l] [SCOPE.sCharacter('gomez_damas').GetFullName] has initiated a march through the peninsula, seeking to divert the attention of the Cristino forces. He is currently in [SCOPE.sState('estado_expedicion_gomez').GetName]."
 esp.18.f: "The expedition took place in the northern part of the country and aimed to advance southward to support the Carlist troops.\nThe expedition began in August 1836 and saw some initial successes, advancing through the regions of La Rioja and Navarre, where it managed to recruit new supporters for the Carlist cause. The defeat at Aranzueque was a major blow to the Carlist cause and to [SCOPE.sCharacter('gomez_damas').GetLastName]'s hopes of advancing southward. After this defeat, the expedition fell apart, and [SCOPE.sCharacter('gomez_damas').GetLastName] was forced to retreat to the northern peninsula."
 esp.18.a: "We must hunt them down"
 esp.18_tt: "In the [concept_journal_entry|l], you can send one of our [Concept('concept_general', '$concept_generals$')|l] to hunt them down."

 esp.19.t: "Choice of [concept_general|l]"
 esp.19.d: "The government must choose which [concept_general|l] will be tasked with hunting down the expedition of [SCOPE.sCharacter('gomez_damas').GetFullName]."
 esp.19.f: "During the expedition, [SCOPE.sCharacter('gomez_damas').GetFullName] managed to form an army of up to 6,000 men thanks to the Carlists who joined him along the way (such as Ramón Cabrera) and engaged liberal generals on several occasions: he defeated Tello at Baranda and López at Matilla, but was defeated by Espartero at Escaro and Alaix at Villarrobledo. Additionally, generals Rodil and Narváez pursued him unsuccessfully (Battle of Majaceite), mobilizing at one point up to 25,000 liberal soldiers in pursuit."
 esp.19.a: "[SCOPE.sCharacter('expedition_leader_1').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader_1').GetFullName]"
 esp.19.b: "[SCOPE.sCharacter('expedition_leader_2').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader_2').GetFullName]"
 esp.19.c: "[SCOPE.sCharacter('expedition_leader_3').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader_3').GetFullName]"

 esp.20.t: "Discontent with the Situation"
 esp.20.d: "With the expedition of [SCOPE.sCharacter('gomez_damas').GetFullName] advancing through [SCOPE.sState('estado_paseo').GetStateRegion.GetName], discontent among the population due to Carlist plundering has increased, in addition to reducing our military capacity in [SCOPE.sState('estado_paseo').GetStateRegion.GetName]."
 esp.20.f: "The expedition of [SCOPE.sCharacter('gomez_damas').GetLastName] is causing an increase in unrest and political instability in the country. His march southward through [ROOT.GetCountry.GetName], recruiting followers along the way, continues. The territories traversed by the expedition became scenes of conflict and plundering by both sides.\n\n[SCOPE.sCharacter('gomez_damas').GetLastName]'s ability to mobilize followers and advance southward demonstrates the persistence and strength of the Carlist cause, which could undermine confidence in the government and the stability of the monarchy."
 esp.20.a: "Damn him"
 esp.20.tooltip: "[concept_legitimacy|l] of the [concept_government|l] will be affected."
 esp.20.tooltip_1: "[SCOPE.sCharacter('gomez_damas').GetLastName] will begin moving to another [concept_state|l]."
 esp.20.tooltip2: "Our ability to create [Concept('concept_conscript_battalion', 'conscription battalions')] will be diminished. You must use the [concept_decree|l] of [GetDecreeType('decree_enlistment_efforts').GetName] in this [concept_state|l]."

 esp.21.t: "[SCOPE.sCharacter('gomez_damas').GetFullName] Defeated"
 esp.21.d: "[SCOPE.sCharacter('perseguidor').GetPrimaryRoleTitle|l] [SCOPE.sCharacter('perseguidor').GetFullName] has managed to locate and defeat the expedition of [SCOPE.sCharacter('gomez_damas').GetFullName] in [SCOPE.sState('estado_captura').GetStateRegion.GetName]."
 esp.21.f: "Finally, the Gómez Expedition reached the province of Guadalajara, but its forces were exhausted and weakened by a lack of supplies and the hardships of war. In this state, on November 24, 1836, the [SCOPE.sCountry('car_scope').GetAdjective|l] troops of Gómez faced the Cristino forces at the Battle of Aranzueque.\nThe Gómez expedition suffered a crushing defeat. The [SCOPE.sCountry('car_scope').GetAdjective|l] troops could not withstand the assault of the better-equipped and better-trained government forces. The defeat was devastating for the [SCOPE.sCountry('car_scope').GetAdjective|l] and represented a major setback for their hopes of advancing southward through [ROOT.GetCountry.GetName].\nAfter the defeat at Aranzueque, the Gómez expedition fell apart and had to retreat to the north of [ROOT.GetCountry.GetName], losing much of the territory they had previously captured."
 esp.21.a: "It's over"

 esp.22.t: "[SCOPE.sCharacter('mendizabal_scope').GetLastName] returns to [ROOT.GetCountry.GetName]"
 esp.22.d: "When the news spread that [SCOPE.sCharacter('mendizabal_scope').GetFullName] had to leave [ROOT.GetCountry.GetName], a quick plan was organized to bring him back to [ROOT.GetCountry.GetName]. He is now back here."
 esp.22.f: "Through a quick intervention by the [SCOPE.gsInterestGroup('intelectuales_scope').GetName], [SCOPE.sCharacter('mendizabal_scope').GetFullName] was provided with all the resources needed to return to [ROOT.GetCountry.GetName]."
 esp.22.a: "Bad weeds never die"

 esp.23.t: "Vergara’s Embrace"
 esp.23.d: "[SCOPE.sCharacter('general_esp').GetFullName] met in the Navarrese town of Oñate with Carlist general Rafael Maroto to end the conflict."
 esp.23.f: "‘...they then placed their arms in tents, the troops mingled freely and happily, and peace was sealed with the greatest joy and harmony... Soldiers never humiliated nor defeated laid down their terrifying arms before the altars of the homeland; as a tribute to peace, they forgot their grudges, and the embrace of brotherhood sublimated such a heroic act... such a Spanish way!’"
 esp.23.a: "Good ending"

 esp.24.t: "The return of the Carlists"
 esp.24.d: "Defeated, but not vanquished, Carlist representatives in exile have begun to conspire to organize another uprising in [ROOT.GetCountry.GetName]."
 esp.24.f: "On June 30, 1869, the claimant published a Manifesto-Letter, known as ‘Don Carlos’s letter to his brother Don Alfonso,’ in which he expressed his desire to reign in [ROOT.GetCountry.GetName] and not just be the leader of a party. This letter, written by Antonio Aparisi y Guijarro, who would become one of the claimant’s closest collaborators, was reproduced by the Carlist press, and hundreds of thousands of copies were distributed as leaflets."
 esp.24.a: "How many times do I have to teach you this lesson, old man"
 esp.25.t: "Renegotiation of the [Concept('concept_credit', '$concept_credit_debt$')|l]"
 esp.25.d: "A group of businessmen, aligned with the [SCOPE.gsInterestGroup('ig_interesado').GetName] group, has offered an agreement to renegotiate the national [Concept('concept_credit', '$concept_credit_debt$')|l] that we have with them."
 esp.25.f: "- So this is the deal: we offer a renegotiation of the Spanish [Concept('concept_credit', '$concept_credit_debt$')|l] you have with us, and in return, we demand some slight concessions.\n\nThe leader of the Spanish team looked at the delegates:\n\n - 'We are willing to consider a renegotiation of the Spanish [Concept('concept_credit', '$concept_credit_debt$')|l],' he began. 'But we need to clearly understand what concessions you demand in return.'\n\n- It's a delicate matter, but we are willing to address it..."
 esp.25.a: "It’s not a bad deal"
 esp.25.a_tt: "We will advance the equivalent of 8 months in [Concept('concept_credit', '$concept_credit_debt$')|l] payments"
 esp.25.b: "We don’t need charity"

 esp.26.t: "Havana - Bejucal Line"
 esp.26.d: "After intense work, our general captain’s company has completed and today the first railway line in Cuba has become operational."
 esp.26.f: "The first train that slid on the iron tracks left the Ciénaga workshop in Havana on a test trip on November 13, 1837. It arrived in Bejucal at 10:18 AM. This test was published in the Diario de la Marina on November 18, 1837. On November 19, 1837, in homage to Queen Isabel II's saint, this first 27.5 km section was solemnly inaugurated by the Junta de Fomento. That day, at 8:00 AM, the first train departed towards Bejucal.\n\nWith its departure, Cuba became the seventh place in the world to have this form of transport, only 12 years after the first public English railway service, and the first Spanish province to have it. Peninsular Spain would have this form of transport only starting in 1848. It would be the first railway in Latin America and the second country in the Americas, only after the United States."
 esp.26.a: "We’ve gathered valuable information"
 esp.27.a: "Chu chu"

 esp.28.b: "We can’t do anything"
 esp.28.a: "Charge them with a crime and send in the army"

 esp.29.t: "Uprisings in the Dominican Republic"
 esp.29.d: "The entry of [SCOPE.sCountry('ocupador_santo_domingo').GetName] forces into Dominican soil seems to not sit well with many within [SCOPE.sState('santo_domingo_scope').GetName]. A guerrilla has begun to form in the north."
 esp.29.f: "The War of Restoration (1863-1865), also known in Spain as the War of Santo Domingo, was a war fought between separatist Dominican rebels and the Spanish authorities of Santo Domingo."
 esp.29.a: "We will restore order"
 esp.29_tt: "Some of the Haitian elites will join the Dominican ones to strengthen the call for independence"

 esp.31.t: "Provincial Board of [SCOPE.sState('estado_junta').GetStateRegion.GetCityHubName]"
 esp.31.d: "After the news of the start of a new revolution from the [SCOPE.sPoliticalMovement('movimiento_scope').GetName], our Captain General in [SCOPE.sState('estado_junta').GetName], swore total commitment to the revolutionary cause."
 esp.31.f: "The liberal rebels were quick. A mob, along with National Guard forces, stormed the government buildings in [SCOPE.sState('estado_junta').GetStateRegion.GetCityHubName], and it wasn't long before contact was lost with the government in [ROOT.GetCountry.GetCapital.GetCityHubName]."
 esp.31.a: "Damn traitor"

 esp.32.t: "Carlist Party Petition"
 esp.32.d: "On behalf of their electors, [SCOPE.sParty('partido_carlista_scope').GetName], through [SCOPE.gsInterestGroup('grupo_interes_pedidor').GetLeader.GetFullName], has submitted a formal petition to the [ROOT.GetCountry.GetAdjective] government to approve the [concept_law|l] of [SCOPE.sLaw('peticion_de_ley').GetName]."
 government_petition_tt_esp: "[SCOPE.sParty('partido_carlista_scope').GetName] expects the government to approve the [SCOPE.sLaw('peticion_de_ley').GetName] law within five years."

 esp.33.t: "Return of Carlism?"
 esp.33.d: "Discontent in [SCOPE.sState('estado_carlista').GetStateRegion.GetName], along with the rest of the northern [Concept('concept_state', '$concept_states$')|l], may lead to a reorganization of the [concept_political_movement|l] carlist."
 esp.33.d_ya_hay_movimiento: "Although defeated in the previous Carlist War, the Carlist spirit is still alive in the north of [ROOT.GetCountry.GetName]. Thanks to widespread discontent, the [SCOPE.sPoliticalMovement('movimiento_carlista').GetName] has resurfaced and is reorganizing in secrecy."
 esp.33.f: "After the Vergara Agreement, Carlism, although reduced to secrecy, continued to gather a good sector of [ROOT.GetCountry.GetAdjective].\n\nIndeed, for some years, the newspaper *La Esperanza*, led by Carlist Pedro de la Hoz, became the most widely circulated newspaper in all of Spain at the time."
 esp.33.a: "Chinese tales"

 esp.34.t: "Election of Representatives in [SCOPE.sCountry('territorio_ultramar').GetName]"
 esp.34.d: "After the [Concept('concept_election', '$concept_elections$')|l] in [ROOT.GetCountry.GetName], the results from the overseas provinces are not long in coming. In [SCOPE.sCountry('territorio_ultramar').GetName], a majority of [SCOPE.gsInterestGroup('grupo_seleccionado').GetName] has been achieved, followed by [SCOPE.gsInterestGroup('grupo_segundo_seleccionado').GetName]."
 esp.34.f: "While in the city of [SCOPE.sCountry('territorio_ultramar').GetCapital.GetCityHubName], the clear winners were [SCOPE.gsInterestGroup('grupo_seleccionado').GetName], it was in the rural areas where [SCOPE.gsInterestGroup('grupo_segundo_seleccionado').GetName] managed to gain the advantage that allowed them to enter the [ROOT.GetCountry.GetAdjective] congress."
 esp.34.a: "The people of [SCOPE.sCountry('territorio_ultramar').GetAdjective] have spoken"

 esp.35.t: "Election of Representatives for the Congress of [SCOPE.sCountry('capital_central').GetAdjective]"
 esp.35.d: "After the [Concept('concept_election', '$concept_elections$')|l] in [SCOPE.sCountry('capital_central').GetName], thanks to our overseas province status, we can send deputies to the courts in [SCOPE.sCountry('capital_central').GetCapital.GetCityHubName]. Both [SCOPE.gsInterestGroup('ig_uno_scope').GetName] and [SCOPE.gsInterestGroup('ig_dos_scope').GetName] have managed to gain representation."
 esp.35.f: "The city of [ROOT.GetCountry.GetCapital.GetCityHubName] was filled with celebrations after the election of the local deputy, affiliated with [SCOPE.gsInterestGroup('ig_uno_scope').GetName]. The people of [ROOT.GetCountry.GetAdjective] will have a voice and vote in the courts."
 esp.35.a: "The people of [ROOT.GetCountry.GetAdjective] have spoken"
 esp.36.t: "Choice of Destiny"
 esp.36.d: "We must choose which [concept_country|l] to start negotiations with in order to recognize it and ensure a future friendship with them. If we make a good impression, our [concept_relations|l] can increase significantly."
 esp.36.f: "After the death of monarch Ferdinand VII in 1833, and starting from the reign of his daughter Isabel II, a new period began in relations between the old metropolis and the American territories. The General Courts of the kingdom authorized the renunciation of the Spanish crown's territorial and sovereignty rights over the former American domains, and the recognition of the independence of all the new American countries through the conclusion of Treaties of Peace and Friendship based on the premise that 'neither honor nor national interests are compromised.'"
 esp.36.a: "The people of [SCOPE.sCountry('pais_rebelde_1').GetAdjective] are paramount"
 esp.36.b: "[SCOPE.sCountry('pais_rebelde_2').GetName] has always been a brotherly people"
 esp.36.c: "Our interests in [SCOPE.sCountry('pais_rebelde_3').GetName] must be safeguarded"
 esp.36.e: "Spain and [SCOPE.sCountry('pais_rebelde_4').GetName] are going to reconcile"
 esp.36.g: "[SCOPE.sCountry('pais_rebelde_5').GetName] will have to be"

 esp.37.t: "Spanish Delegation in the Capital"
 esp.37.d: "This morning a [SCOPE.sCountry('espanna_scope').GetAdjective] delegation arrived in [ROOT.GetCountry.GetCapital.GetCityHubName] with the goal of signing a treaty of friendship and cooperation with [ROOT.GetCountry.GetName]. This would mean that they finally recognize us as an independent [concept_country|l]."
 esp.37.f: "After the death of monarch Ferdinand VII in 1833, and starting from the reign of his daughter Isabel II, a new period began in relations between the old metropolis and the American territories. The General Courts of the kingdom authorized the renunciation of the Spanish crown's territorial and sovereignty rights over the former American domains, and the recognition of the independence of all the new American countries through the conclusion of Treaties of Peace and Friendship based on the premise that 'neither honor nor national interests are compromised.'"
 esp.37.a: "Finally, we are free"
 esp.37.b: "The people of [SCOPE.sCountry('espanna_scope').GetAdjective] and [ROOT.GetCountry.GetAdjective] are brothers"

 esp.38.t: "Rise of Republicanism"
 esp.38.d: "Although traditionally the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] in [ROOT.GetCountry.GetName] has been a guarantor of the crown, lately forces favoring [GetIdeology('ideology_republican').GetName] have been gaining influence."
 esp.38.f: "19th-century Spanish republicanism was a political movement that advocated for the abolition of the monarchy and the establishment of a republic. It arose as a reaction to the crisis of monarchical liberalism and social discontent, defending principles of popular sovereignty, equality, secularism, and civil rights. Although it had moments of prominence, such as the First Republic in 1873, republicanism faced internal divisions."
 esp.38.a: "As if it weren’t enough, now we have republicans too"

 esp.39.t: "Birth of a New Heir"
 esp.39.d: "This morning, our queen [ROOT.GetCountry.GetRuler.GetFirstName] finally gave birth to little [ROOT.GetCountry.GetHeir.GetFirstName], who will one day rule as Alfonso XII"
 esp.39.f: "Alfonso XII of Spain, known as 'the Peacemaker,' was king of Spain from 1874 to 1885. He was the son of Queen Isabel II and consort King Francisco de Asís of Bourbon. With the start of his reign, the First Republic ended, and the period known as the Restoration began. After his premature death at the age of twenty-seven from tuberculosis, he was succeeded by his posthumous son, Alfonso XIII."
 esp.39.a: "Long life to the new heir"

 esp.40.t: "Severe Strategic Mistake"
 esp.40.d: "While pursuing the Marcha Real, our [concept_general|l] [SCOPE.sCharacter('general_cagada_scope').GetFullName] made a grave mistake that will cost him dearly."
 esp.40.f: "Espartero had left Madrid to find the Expedition on August 26, and through Jadraque, Sigüenza, and Maranchón, searching for the enemy, he reached Daroca on September 1, where he learned that the army he was looking for had already left two days earlier for the capital, via a southern route. '...bringing with it and before it the most dreadful devastation, the lamentations of the inhabitants of the towns it passed through, and the ruin resulting from the state of insubordination in which an army, hungry, naked, and lacking everything, found itself.' His vanguard sighted Madrid on the 12th. 'Madrid appeared to us so abandoned, so defenseless that all we had to do was open its doors and enter to seize it and remain within its walls.'"
 esp.40.a: "You will pay for this, [SCOPE.sCharacter('general_cagada_scope').GetFullName]"

 esp.41.t: "Proposal for Reincorporation of Santo Domingo"
 esp.41.d: "This morning, [Concept('concept_ruler', '$RULER_TITLE_PRESIDENT$')|l] [SCOPE.sCountry('ocupador_santo_domingo').GetRuler.GetFullName] has officially requested the annexation of [SCOPE.sCountry('ocupador_santo_domingo').GetName] to [ROOT.GetCountry.GetName]. Our [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] are thrilled with this news."
 esp.41.f: "The president's letter contained some of the following points:\n1. No establishment of slavery.\n2. Freedom of Religion\n3. Freedom of trade\n4. Right to vote on the budget\n5. Freedom of expression\n6. Consider Santo Domingo as a province.\n7. Acknowledge all acts of the Republic so far."
 esp.41.a: "It's time to amend the mistake made long ago"
 esp.41.b: "We have other plans for [SCOPE.sCountry('ocupador_santo_domingo').GetName]"

 esp.42.t: "[SCOPE.sCountry('spa_scope').GetName] Welcomes Us"
 esp.42.d: "[SCOPE.sCountry('spa_scope').GetRuler.GetFullNameWithTitle] gave a warm speech in which they gladly accepted the reincorporation of [ROOT.GetCountry.GetName] into [SCOPE.sCountry('spa_scope').GetName] as an overseas province."
 esp.42.f: "'The Spanish island, the first discovery with which the great Columbus immortalized his name, has returned to be part of the Monarchy. The Dominican people, threatened by external enemies, tired of internal discord, invoked, amid their conflicts, the august name of the nation to whom they owed civilization and life. To stand by impassively in the face of their misfortunes, to ignore their pleas, inspired by high memories and by an undying love for Spain, would have been unworthy of our nobility. Convinced that these hopes were spontaneous and unanimous, I did not hesitate to accept them, attentive to the honor of my people even more than to their convenience. The Dominicans have seen their hopes fulfilled. The wealth contained in their fertile soil is starting to develop within a deep peace, and the zeal and justice of my Government and the authorities will erase the marks of past discord. The army and the fleet of the island of Cuba, bringing the glorious banner of Castile to Santo Domingo, instilled security in its inhabitants, fear and respect in its enemies. They were generous with these, for they never had the mission of oppressing the weak.' - Announcement by Isabel II of the annexation of the Dominican Republic to Spain in the speech at the royal opening of the Cortes"
 esp.42.a: "Finally, we will progress with the help of [SCOPE.sCountry('spa_scope').GetName]"

 esp.43.t: "[SCOPE.sCountry('spa_scope').GetName] Rejects the Proposal"
 esp.43.d: "[SCOPE.sCountry('spa_scope').GetRuler.GetFullNameWithTitle] has rejected the proposal for the reincorporation of [ROOT.GetCountry.GetName] into [SCOPE.sCountry('spa_scope').GetName] as an overseas province. We are alone."
 esp.43.f: "'It is impossible to discuss this; it is impossible to analyze the Government's conduct on this matter; it is impossible to give our honest and frank opinion on this unless we know and study them.' - Criticism by the Viscount of Pontón before the Congress of Deputies"
 esp.43.a: "Well, at least we tried"

 esp.44.t: "Marriage of [ROOT.GetCountry.GetRuler.GetFirstName]"
 esp.44.d: "While the [concept_government|l] has proposed Francisco de Asís de Borbón—timid in nature, ensuring he does not interfere with the affairs of the [concept_government|l], and of questionable sexual orientation—another faction suggests marrying her to the Carlist heir, Carlos Luis de Borbón."
 esp.44.f: "'A great problem in the Court\nis to find out if the Consort,\nwhen he goes to relieve himself,\npees standing up or sitting down.' - Gacetas of Madrid\n\n'What could I expect from a man who, on our wedding night, was wearing more lace than I was?' - [ROOT.GetCountry.GetRuler.GetFullNameWithTitle]"
 esp.44.a: "We cannot anger the [concept_government|l]"
 esp.44.b: "We will never marry the [Concept('concept_ruler', 'queen')] to him"
 esp.44_tt: "[ROOT.GetCountry.GetRuler.GetFirstName] will have to turn to others to satisfy their carnal desires, which may lead to the birth of the historical [concept_heir|l]."
 esp.44.c: "Let’s marry the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to the Carlist candidate"


 esp.45.t: "Tax Reform - Foral System"
 esp.45.d: "The tax system of [ROOT.GetCountry.GetAdjective] remains an outdated system, still governed by the regulations of many of the old medieval foral laws implanted in the former Crown of Aragon and the Kingdom of Navarre."
 esp.45.f: "The reform sought to introduce liberal tax principles: legality, sufficiency, and universality, and to implement a unified tax system for the entire country, eliminating barriers to economic growth."
 esp.45.a: "They will have to adapt"
 esp.45.b: "We cannot do without the old foral laws"

 esp.46.t: "Tax Reform - Duplications"
 esp.46.d: "Throughout history, the tax system of [ROOT.GetCountry.GetAdjective] has undergone changes that have caused great disarray in tax collection."
 esp.46.f: "From internal customs that hinder internal trade, to tithes to the church, or the old taxes on alcabala and millions, imposed by the Spanish monarchy. - The new tax system must give much more importance to direct taxes than indirect taxes. - Said the finance minister."
 esp.46.a: "We must unify this mess"
 esp.46.b: "We can reach an understanding with the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] and the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName]"
 esp.46.c: "It's a lot of work"

 esp.47.t: "Tax Reform - Consumption Tax"
 esp.47.d: "Our finance minister, a member of [SCOPE.gsInterestGroup('ministro_ig_scope').GetName], has included a series of new [concept_budget_consumption_taxes|l] as part of the reform. The [concept_lower_strata|l] will suffer from these taxes."
 esp.47.f: "Consumption tax on specific goods, tobacco, salt, lotteries, alcohol, olive oil, soap, and meat. The minister's ambition had no limit."
 esp.47.a: "The law must pass"
 esp.47.b: "We remove the [concept_budget_consumption_taxes|l] on basic goods"
 esp.47.c: "This must not end like France in 1789"

 esp.48.t: "Naval Reform"
 esp.48.d: "The Minister of the Navy, [SCOPE.sCharacter('admirante_de_fuerzas_armadas').GetFullName], has demanded that the [concept_government|l] undertake a serious reform of the navy to safeguard the overseas territories of [ROOT.GetCountry.GetName] against the threat of [SCOPE.sCountry('enemigo_naval').GetName]."
 esp.48.f: "Between 1858 and 1863, a naval rearmament movement developed in [ROOT.GetCountry.GetName], coordinating the efforts of the commercial bourgeoisie, parliamentary elites, and intellectuals of liberalism. Previously, between 1833 and 1857, navalism had already been established as a horizon for geopolitical regeneration in Spanish public opinion. This process peaked between 1858 and 1860, during the first government of the Liberal Union. It involved intensive mobilization of the aforementioned actors to favor the growth of the Royal Navy and its use as an instrument of Spanish power on the international stage."
 esp.48.a: "We will see what can be done"

 esp.49.t: "Assimilation of the Revolutionaries"
 esp.49.d: "After a quick negotiation with the regime's dissenters, the revolutionaries have agreed to join the revolutionary movements against the regime."
 esp.49.f: "«With this, [SCOPE.gsInterestGroup('ig_revolucionario').GetName] accepted entry into a new constituent process and the search for a new dynasty, and, according to the second point, the unique sovereignty of the nation and universal suffrage»"
 esp.49.a: "At least there is no war"
 esp.49_tt: "The progress bar of #variable $establidad_reinado_isabel$#! will increase by #bold #red 200#!#! points."

 esp.50.t: "Renunciation of Claims in Latin America"
 esp.50.d: "After deliberation by the [concept_government|l], it has been concluded that it is no longer worthwhile to continue trying to restore Spanish rule in Latin America."
 esp.50.f: "On December 17, 1836, the Spanish government issued a decree officially renouncing its rights over the territories of Latin America that had declared their independence. This act was not formalized in a treaty with each Latin American country, but was a unilateral recognition that allowed the new republics to begin consolidating without the threat of Spanish restoration."
 esp.50.a: "We must leave the past behind"
 esp.50_tt: "We will be able to start signing friendship and cooperation treaties with the [Concept('concept_country', '$concept_countries$')|l] Latin American countries."

 esp.51.t: "Reorganization of the Carlist Movement"
 esp.51.d: "Today, several people within [ROOT.GetCountry.GetName] have announced the formation of the new [SCOPE.sPoliticalMovement('movimiento_carlista_scope').GetName]. Although it is not yet able to pose a threat, it will not take long for them to organize."
 esp.51.f: "Carlos VII for the Carlists saw a new opportunity for Carlism: the revolution of 1868, which forced Isabel II to leave Spain. The revolutionary government established a democratic regime in Spain and later elected the liberal Amadeo de Saboya as king. Many conservatives opposed to this government believed in Don Carlos as an alternative to the separation of church and state, freedom of worship, and secular and rationalist education, which the revolutionaries imposed and which concerned Catholics. Many of these conservatives joined the Carlist side, which in 1871 became the third most voted force in parliament. However, the liberal triumph showed that the democratic path was insufficient, and only a new armed uprising would bring Don Carlos to the throne with a traditionalist, Catholic, and anti-liberal regime."
 esp.51.a: "They will have to be watched"
 
 esp.52.t: "New President of the Council of Ministers"
 esp.52.d_default: "[ROOT.GetCountry.GetRuler.GetFullNameWithTitle] has withdrawn their confidence in [SCOPE.sCharacter('mendizabal_scope').GetLastName] as President of the Council of Ministers, appointing [SCOPE.sCharacter('nuevo_presidente_consejo').GetLastName] to take their position."
 esp.52.d: "The $esp.52.d_default$"
 esp.52.d.rey_hombre: "The $esp.52.d_default$"
 esp.52.f: "On September 5, 1836, Mendizábal was dismissed from his position as President of the Council of Ministers by María Cristina. His downfall was the result of a combination of factors: increasing pressure from progressive sectors, internal tensions within liberalism, lack of support from the Church and the nobility, and the challenging military situation. After his dismissal, Mendizábal was replaced by Francisco Javier de Istúriz, who represented a more moderate line within the liberals."
 esp.52.a: "We trust you"

 esp.53.t: "Moderation of [ROOT.GetCountry.GetRuler.GetFullName]"
 esp.53.d: "Following the Revolutions of 1835 and in line with the [GetIdeology('ideology_moderado').GetName] character of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], their personal inclinations have aligned more closely with those of the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]"
 esp.53.f: "To counter the Carlists, [ROOT.GetCountry.GetRuler.GetFullName] had to make concessions to the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName], who in turn supported the cause of Isabel II. This led to the Liberal Revolution of 1835, marking the beginning of the end of the Ancien Régime and absolute monarchy in Spain."
 esp.53.a: "Let's see if the progressives can withstand the pressure"
 esp.53_tt: "As long as the [concept_ruler|l] is [GetIdeology('ideology_moderado').GetName] and belongs to the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName], the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] will be more likely to select [Concept('concept_leader', '$concept_leaders$')|l] with [concept_ideology|l] [GetIdeology('ideology_moderado').GetName]"
 
 esp.54.t: "Confiscation of [GetInterestGroupVariant('ig_devout',GetPlayer).GetName]'s Lands"
 esp.54.d: "After long sessions of debate, the confiscation of lands belonging to [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] has finally passed. The [concept_middle_strata] barely stood a chance in the auctions against the [GetPopType('aristocrats').GetName], who are winning nearly all of them."
 esp.54.f: "Since the division of plots was entrusted to municipal commissions, they exploited their power to manipulate the process and create large plots inaccessible to small landowners, but affordable for the wealthy oligarchs who could buy both large and small plots. Small farmers were unable to participate in the bidding, and the lands were purchased by nobles and wealthy urban bourgeoisie, preventing the creation of a true middle class."
 esp.54.a: "The treasury needs funds"
 esp.54.b: "Limit land sales to [GetPopType('aristocrats').GetName]"

 esp.55.t: "Confiscation Attempt Rejected"
 esp.55.d: "After long sessions of debate, the proposal for land confiscation belonging to [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] has been rejected."
 esp.55.f: "- I can’t believe it, Álvaro! They promised so much with Mendizábal’s confiscation plan, and now it seems everything is falling apart.\n - It was to be expected, Pedro. From the beginning, this proposal had enemies everywhere.\n - But it was a solution to the country’s economic chaos!"
 esp.55.a: "Minister [SCOPE.sCharacter('lider_intelectual_scope').GetLastName] takes full responsibility"
 esp.55.b: "[ROOT.GetCountry.GetRuler.GetCustom('getMsMr')] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] tries to salvage the situation"

# ============================== DSK Belgium: Modifier Texts ==============================
 dsk_bel_london_treaty_modifier:0 "Treaty of London"
 dsk_bel_london_treaty_modifier_desc:0 "Belgium's independence and neutrality are recognized by the Great Powers."
 dsk_bel_broken_neutrality_modifier:0 "Neutral Status Broken"
 dsk_bel_broken_neutrality_modifier_desc:0 "Belgium's neutral status is suspected."
 dsk_bel_workshop_of_europe_modifier:0 "Workshop of Europe"
 dsk_bel_workshop_of_europe_modifier_desc:0 "Belgian industry prospers."
 dsk_bel_strike_wave_modifier:0 "Strike Wave"
 dsk_bel_strike_wave_modifier_desc:0 "Labor-capital conflict is expanding."
 dsk_bel_school_compromise_modifier:0 "Education Compromise"
 dsk_bel_school_compromise_modifier_desc:0 "The Church and liberals have reached a fragile balance on the education question."
 dsk_bel_language_settlement_modifier:0 "National Reconciliation"
 dsk_bel_language_settlement_modifier_desc:0 "The Flemish and Walloon ethnic question has temporarily entered the stage of institutionalized resolution."
 dsk_bel_flemish_suppression_modifier:0 "Suppression of the Flemish Movement"
 dsk_bel_flemish_suppression_modifier_desc:0 "State authority is maintained, but ethnic contradictions have deepened."
 dsk_bel_congo_free_state_modifier:0 "Congo Free State"
 dsk_bel_congo_free_state_modifier_desc:0 "The Congo brings wealth to the kingdom, and also hidden crises."
 dsk_bel_congo_scandal_modifier:0 "Congo Scandal Erupts"
 dsk_bel_congo_scandal_modifier_desc:0 "The international community has begun to question Leopold II's rule over the Congo."
 dsk_bel_lowlands_federation_modifier:0 "Lowlands Federation Concept"
 dsk_bel_lowlands_federation_modifier_desc:0 "Belgium has begun to conceptualize the country's future in terms of the entire Lowlands."
 dsk_bel_fortress_neutrality_modifier:0 "Armed Neutrality"
 dsk_bel_fortress_neutrality_modifier_desc:0 "Fortifications, standing armies, and diplomatic guarantees together protect Belgium."
 dsk_bel_strict_neutrality_modifier:0 "Strict Neutrality"
 dsk_bel_strict_neutrality_modifier_desc:0 "Belgium trades diplomatic flexibility for staying out of things."
 dsk_bel_secret_staff_contacts_modifier:0 "Secret Military Contacts"
 dsk_bel_secret_staff_contacts_modifier_desc:0 "Belgium has dispatched officer missions to engage in technical exchange and military cooperation with other countries."
 dsk_bel_yser_resistance_modifier:0 "Yser River Defense"
 dsk_bel_yser_resistance_modifier_desc:0 "The Belgian army is relying on the river and flood zones to hold its final territory."
 dsk_bel_postwar_compromise_modifier:0 "Postwar Stability"
 dsk_bel_postwar_compromise_modifier_desc:0 "Universal suffrage, labor protections, and national reconciliation temporarily suppress the tendency toward political radicalization."
 dsk_bel_finance_house_modifier:0 "Developed Brussels Finance"
 dsk_bel_finance_house_modifier_desc:0 "Companies, banks, stock exchanges, and transportation networks form a developed financial network in Brussels."
 dsk_bel_audited_financiers_modifier:0 "Auditing Bankers"
 dsk_bel_audited_financiers_modifier_desc:0 "Parliament has obtained the accounts of contractors and bankers for auditing, which helps restore public confidence, at the cost of forced slowdown in capital expansion."
 dsk_bel_mine_inspection_modifier:0 "Establishment of Mine Inspection System"
 dsk_bel_mine_inspection_modifier_desc:0 "Inspectors have entered the mining regions, which will effectively guarantee production safety and worker treatment."
 dsk_bel_labor_reform_modifier:0 "Implementation of Labor Protection"
 dsk_bel_labor_reform_modifier_desc:0 "Strictly limited working hours, mine safety supervision, and legal mediation have improved workers' living conditions."
 dsk_bel_mobilization_cost_modifier:0 "Strengthened Armed Neutrality"
 dsk_bel_mobilization_cost_modifier_desc:0 "Belgium has expanded mobilization to ensure armed neutrality."
 dsk_bel_congo_reform_modifier:0 "Implementing Reform in the Congo"
 dsk_bel_congo_reform_modifier_desc:0 "The Congo's administrative foundation has gradually shifted to supervision by the mother country, which helps ease international public opinion pressure."
 dsk_bel_rexist_pressure_modifier:0 "Pressure from Rexism"
 dsk_bel_rexist_pressure_modifier_desc:0 "The national parliament is under increasingly serious pressure from Catholic conservative forces and anti-parliamentary political propaganda."
 dsk_bel_rearmament_modifier:0 "Rearming the Country"
 dsk_bel_rearmament_modifier_desc:0 "Now, the military has become the focus of this country, and the completion of all kinds of armaments affects the nerves of the entire country."


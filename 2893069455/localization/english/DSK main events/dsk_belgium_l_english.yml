# ============================== DSK Belgium: Other Texts ==============================

 je_dsk_bel_independence_lobby:0 "The existence of [SCOPE.GetRootScope.GetCountry.GetName] as a political entity has been established through the proclamation of the constitution and the king's oath, but the existence of the Kingdom of Belgium has yet to be widely recognized within the European diplomatic system. [SCOPE.sCountry('dsk_bel_net_scope').GetName] still regards the 1830 separation as an unrest that has never been pacified, [SCOPE.sCountry('dsk_bel_gbr_scope').GetName] requires a credible Lowlands buffer state, while [SCOPE.sCountry('dsk_bel_fra_scope').GetName] and [SCOPE.sCountry('dsk_bel_pru_scope').GetName] are both weighing whether this new kingdom will alter the diplomatic landscape."
je_dsk_bel_neutrality_lobby:0 "Permanent neutrality is neither the disarmament of the army nor the locking shut of the foreign ministry's doors. It is a national strategy that must be pursued consistently: territorial claims, military preparedness, diplomatic guarantees, defensive fortifications, and restraint in [concept_infamy] all determine whether [SCOPE.GetRootScope.GetCountry.GetName] continues to be regarded by Europe as a credible neutral state."
je_dsk_bel_workshop_of_europe_lobby:0 "A small country has no strategic depth, but it can possess industrial scale. Wallonian mining, Liège's military industry, Brussels' finance, and Antwerp's shipping are not isolated from one another, awaiting only political impetus to be organically combined.
je_dsk_bel_school_war_lobby:0 "One of the most deeply rooted fissures in Belgian society lies in the classroom. [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] regards Catholic schools as the foundation of stable rural society and the order of faith, while [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] believes that state schools shape modern citizens."
je_dsk_bel_flemish_movement_lobby:0 "A country may have two nations, but it cannot have dignity for only one of them. Courts, schools, soldiers, and administrative bureaucrats in #yellow Flanders#! will continue to apply pressure on Brussels, especially when the education question has already laid bare the social fissures, or when national reconciliation has entered the reform agenda."
je_dsk_bel_congo_free_state_lobby:0 "#bold The Congo is no ordinary colony, but a peculiar product born of the Belgian king, trading companies, explorers, and international political gamesmanship.#!"
je_dsk_bel_lowlands_question_lobby:0 "#bold The 1830 separation led Belgium to independence, but did not indicate the future of the Lowlands.#!"
je_dsk_bel_great_war_lobby:0 "#bold Treaties take effect through foreign affairs conferences, but must be proven in artillery fire.#!"
je_dsk_bel_postwar_belgium_lobby:0 "#bold After the war ended, Belgium won sympathy, but did not return to peace.#!"
je_dsk_bel_railways_and_finance_lobby:0 "What [SCOPE.GetRootScope.GetCountry.GetName] relies on does not come from vast territory, but from developed finance, shipping, and mining industries—these must be interconnected through trade."
je_dsk_bel_labor_question_lobby:0 "The taller the factory chimney, the harder it becomes to ignore the voices within. Miners, [GetBuildingType('building_port').GetName] workers, Catholic mutual aid societies, socialist newspapers, and factory owners all demand that the state take a stance, but this issue will only be brought before parliament after the industrial society has been initially built.
je_dsk_bel_franco_prussian_crisis_lobby:0 "When the Treaty of London collapses, Lowlands conflicts intensify, French attitudes deteriorate, and German pressure mounts, the survival of Belgium becomes imminent."
je_dsk_bel_national_question_lobby:0 "#bold What Belgium needs is not expansion, but to prove whether a small country caught between great powers can become a durable state.#!"
je_dsk_bel_congo_reform_lobby:0 "#bold The Congo Free State is no longer just the king's private affair.#!
je_dsk_bel_belgian_extremes_lobby:0 "The Great Depression, Rexism, the spread of socialism, ethnic autonomy, and debates over rearmament all simultaneously press upon Belgium."

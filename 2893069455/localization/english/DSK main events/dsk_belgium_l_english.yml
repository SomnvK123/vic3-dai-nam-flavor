l_english:
# ============================== DSK Belgium: Journal Entry Texts ==============================
 je_group_dsk_belgium:0 "The Rise of Belgium"
 je_group_dsk_belgium_lowlands:0 "The Lowlands Question"
 je_group_dsk_belgium_congo:0 "The Congo Free State"
 je_dsk_bel_independence:0 "A New Kingdom"
 je_dsk_bel_independence_reason:0 "The existence of [SCOPE.GetRootScope.GetCountry.GetName] as a political entity has been established through the proclamation of the constitution and the king's oath, but the existence of the Kingdom of Belgium has yet to be widely recognized within the European diplomatic system. [SCOPE.sCountry('dsk_bel_net_scope').GetName] still regards the 1830 separation as an unrest that has never been pacified, [SCOPE.sCountry('dsk_bel_gbr_scope').GetName] requires a credible Lowlands buffer state, while [SCOPE.sCountry('dsk_bel_fra_scope').GetName] and [SCOPE.sCountry('dsk_bel_pru_scope').GetName] are both weighing whether this new kingdom will alter the diplomatic landscape.\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_independence_monthly_tt #o Diplomatic Recognition Progress#!#!Expected change next month #variable [GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_delta_var').GetValue|+=]#!, current trend #v [GetPlayer.MakeScope.Var('dsk_bel_independence_var').GetValue|0] / 55#!.\n#v 1. Drivers of Diplomatic Recognition:#! Holding [concept_relations] of at least #v 50#! with any one of #blue Britain#!, #blue France#!, or #blue Prussia#! advances progress by #v 0.25#! per month, up to a maximum of #v 0.50#!.\n#v 2. Detrimental Factors to Diplomatic Recognition:#! Breaching neutrality, initiating aggressive wars, or making dangerous diplomatic statements.\n#v 3. Additional Notes:#! Completing this journal entry requires diplomatic recognition progress to reach #v 55#! and the country to be at peace.\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_independence_events #o potential events regarding Belgian diplomatic recognition#!#! under specific conditions."
  je_dsk_bel_independence_status:0 "[SCOPE.GetRootScope.GetCountry.GetName] still awaits the Great Powers of Europe to establish stable diplomatic relations through treaties.#!"
 je_dsk_bel_independence_status_london_ready:0 "#green The detailed provisions hammered out at the London Conference are gradually becoming reality, and the Great Powers have begun to regard Belgium as a credible buffer state.#!"
 je_dsk_bel_independence_status_dutch_pressure:0 "#red The Dutch government refuses to view the 1831 failure as the final outcome; any border incident, territorial claim, or interest pursuit on top of this could send relations between the two countries sliding toward war.#!"
 je_dsk_bel_independence_status_default:0 "#yellow Diplomatic recognition of Belgium continues to be tangled and evasively deferred at international conferences.#!"
 je_dsk_bel_neutrality:0 "Permanent Neutrality and Great Power Guarantees"
 je_dsk_bel_neutrality_reason:0 "Permanent neutrality is neither the disarmament of the army nor the locking shut of the foreign ministry's doors. It is a national strategy that must be pursued consistently: territorial claims, military preparedness, diplomatic guarantees, defensive fortifications, and restraint in [concept_infamy] all determine whether [SCOPE.GetRootScope.GetCountry.GetName] continues to be regarded by Europe as a credible neutral state.\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_neutrality_monthly_tt #o Neutrality Credibility#!#!Expected change next month #variable [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_delta_var').GetValue|+=]#!, current neutrality credibility#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_var').GetValue|0] / 55#!.\n#v 1. Drivers of Neutrality Credibility:#! When the country is at peace, has [concept_infamy] below #v 5#! points, and has unlocked the #o Permanent Neutrality#! journal entry, neutrality credibility increases by #v 0.25#! per month.#! If the country simultaneously holds the #v Strict Neutrality#! or #v Armed Neutrality#! status, an additional #v 0.25#! is gained.\n#v 2. Supplementary Notes:#! After achieving diplomatic recognition, with the #o Treaty of London#! in effect and the #o Permanent Neutrality#! journal entry unlocked, the monthly growth of this progress takes effect.\n#v 3. Detrimental Factors to Neutrality Credibility:#! Being at war reduces monthly progress by #v 1#! point; if [concept_infamy] is between #v 2#! and #v 10#! points, it is reduced by #v 0.25#! per month; if above #v 10#!, it is reduced by #v 1#! point per month.\n#v 4. Additional Notes:#!#green Reaffirming Permanent Neutrality#! grants Belgium the Strict Neutrality modifier; #yellow Secret Military Contacts#! continuously erode the credibility of permanent neutrality.\n\nCompleting this journal entry requires neutrality credibility to reach #v 55#! while keeping [concept_infamy] low.\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_neutrality_events #o potential events regarding permanent neutrality#!#! under specific conditions."
 je_dsk_bel_neutrality_status:0 "#yellow The credibility of permanent neutrality changes monthly based on peace status, aggressive wars initiated, and diplomatic infamy.#!"
 je_dsk_bel_neutrality_status_fortress:0 "#green The interests of the Great Powers and Belgium's armed neutrality have reached agreement, and Belgium's neutrality policy is becoming a stable national strategy.#!"
 je_dsk_bel_neutrality_status_breach:0 "#red Belgium's neutrality is being eroded by aggressive wars, diplomatic infamy, and secret military contacts.#!"
 je_dsk_bel_neutrality_status_default:0 "#yellow The foreign ministry proves every month through actions that only diplomatic positions repeatedly declared and practiced can earn the trust of other nations.#!"
 je_dsk_bel_workshop_of_europe:0 "Workshop of Europe"
je_dsk_bel_workshop_of_europe_reason:0 "A small country has no strategic depth, but it can possess industrial scale. Walloon mining, Liège's military industry, Brussels' finance, and Antwerp's shipping are not isolated from one another, awaiting only political impetus to be organically combined.\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_industry_monthly_tt #o Industrial Strength Status#!#!Expected to change by #variable [GetPlayer.MakeScope.Var('dsk_bel_industry_monthly_delta_var').GetValue|+=]#! next month, current industrial strength variable is #v [GetPlayer.MakeScope.Var('dsk_bel_industry_var').GetValue|0]/55#!.\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_finance_monthly_tt #o Economic Sector Synergy Status#!#!Expected to change by #variable [GetPlayer.MakeScope.Var('dsk_bel_finance_monthly_delta_var').GetValue|+=]#! next month, current economic sector synergy variable is #v [GetPlayer.MakeScope.Var('dsk_bel_finance_var').GetValue|0]#!.\n#v 1. Industrial Base:#! This line now truly checks the #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_workshop_industrial_base_tt Industrial Construction Base in Wallonia and Flanders#!\n#v 2. Industrial Capital:#! This refers to [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]'s [concept_clout] reaching at least #v 10%#!. As long as the industrialists' power reaches this threshold, the capital condition is met.\n#v 3. Financial Network:#! This refers to the country possessing the #v Developed Brussels Finance#! modifier. The most direct source is clicking the #v Issue National Railway Bonds#! button; it will grant you this modifier and simultaneously make #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_finance_monthly_tt Economic Sector Synergy#! and industrial advancement easier to sustain.\n#v 4. Real Natural Monthly Growth:#! Now, not all industrial bases are assembled at once before growth begins; instead, each completed segment grants a small monthly growth once capital conditions are met. Walloon mining, Walloon heavy industry, Flemish shipping construction, Flemish export industry, and Walloon internal [GetBuildingType('building_railway').GetName] each provide #v +0.10#!.\n#v 5. Complete System Bonus:#! If all five industrial base segments are completed, and simultaneously satisfy #v Industrialists at least 10%#! and #v Developed Brussels Finance#!, an additional #v +0.15#! is granted, making a mature industrial network more explosive than scattered construction.\n#v 6. Detrimental Factors:#! Labor conflicts, strike waves, and financial audits slow the overall advancement of industry and the financial system.\n#v 7. Additional Notes:#! Industrial events, railway bonds, and regional construction still determine larger leaps.\n\nIndustrialization is primarily accumulated through #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_industry_advance_tt Industrial Advancement#! and slowed by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_finance_regress_tt Financial and Labor Resistance#!. Financial audits can buy public trust, but they slow capital expansion.\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_workshop_events #o the Industrial Event Pool#!#! under specific conditions."
 je_dsk_bel_workshop_status_finance:0 "#green Bonds, [GetBuildingType('building_railway').GetName], and mining and industry orders are providing powerful momentum for national economic development.#!"
 je_dsk_bel_workshop_status_labor:0 "#red Mining regions and factories have begun to question whose pockets the fruits of this industrial miracle have filled.#!"
 je_dsk_bel_workshop_status_default:0 "#yellow Steam locomotives are binding Wallonia, Brussels, and Antwerp into a single entity.#!"
 je_dsk_bel_school_war:0 "The School War"
je_dsk_bel_school_war_reason:0 "One of the most deeply rooted fissures in Belgian society lies in the classroom. [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] regards Catholic schools as the foundation of stable rural society and the order of faith, while [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] believes that state schools shape modern citizens.\n\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_school_monthly_tt #o Education Compromise Negotiation#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_school_var').GetValue|0] / 7#!.\n#v 1. Unlock Conditions:#![GetInterestGroupVariant('ig_devout',GetPlayer).GetName]'s [concept_clout] reaches #v 18%#! and the government's [concept_legitimacy] is below #v 60#!; or the [concept_devout] is in the government with [concept_clout] of at least #v 15%#!, while [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]'s [concept_clout] is at least #v 12%#!.\n#v 2. Law-Trigger Conditions:#! Possesses the #v Public Schools#! law and the [concept_devout]'s [concept_clout] reaches at least #v 12%#!; or possesses the #v Religious Schools#! law and [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]'s [concept_clout] reaches at least #v 12%#!.\n#v 3. Contributing Factors:#! Already possesses #v Public Schools#! or #v Religious Schools#!, and the government has at least #v 45#! [concept_legitimacy].\n#v 4. Additional Notes:#! Reaching a compromise requires sustained long-term legitimacy; supporting one side or expanding one side may undermine national cohesion.\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_school_events #o potential events regarding the school war#!#! under specific conditions."
 je_dsk_bel_school_status_devout:0 "#yellow Clergy are agitating in villages and churches, and the education question is becoming a political battle.#!"
 je_dsk_bel_school_status_liberal:0 "#yellow Liberals regard national education as the foundation of a modern state, but they have underestimated the social influence of the Church.#!"
 je_dsk_bel_school_status_compromise:0 "#green Neither side has prevailed, so a compromise acceptable to both parties is needed.#!"
 je_dsk_bel_flemish_movement:0 "The Flemish Movement"
je_dsk_bel_flemish_movement_reason:0 "A country may have two nations, but it cannot have dignity for only one of them. Courts, schools, soldiers, and administrative bureaucrats in #yellow Flanders#! will continue to apply pressure on Brussels, especially when the education question has already laid bare the social fissures, or when national reconciliation has entered the reform agenda.\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_unity_monthly_tt #o National Cohesion#!#!Expected change next month #variable [GetPlayer.MakeScope.Var('dsk_bel_unity_monthly_delta_var').GetValue|+=]#!, current national cohesion is #v [GetPlayer.MakeScope.Var('dsk_bel_unity_var').GetValue|0] / 55#!.\n#v 1. Unlock Conditions:#! Possesses any one of the following: #v Education Compromise Negotiation reaching at least 2 points#!, #v National Cohesion already fallen to -1#!, has completed the #v School War#!, [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]'s [concept_clout] reaches at least #v 16%#!, or any region in #yellow Flanders#! has [concept_turmoil] above #v 10%#!.\n#v 2. Contributing Factors:#! National cohesion will grow over time when [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]'s [concept_clout] reaches at least #v 15%#! and the country does not have the #v Flemish Suppression#! status.\n#v 3. Failure Conditions:#! National cohesion falls to #v -3#! or below.\n#v 4. Additional Notes:#! Adopting Flemish will gradually increase national cohesion; maintaining French administration can yield short-term administrative efficiency but leaves deeper fissures.\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_flemish_events #o potential events regarding national cohesion#!#! under specific conditions."
 je_dsk_bel_flemish_status_federal:0 "#green National reconciliation is enabling Flemish demands to be realized, and the country is regaining cohesion.#!"
 je_dsk_bel_flemish_status_repression:0 "#red Brussels can compel silence, but it cannot compel acceptance.#!"
 je_dsk_bel_flemish_status_default:0 "#yellow The French-speaking state and Flemish society continue to pull at each other.#!"
 je_dsk_bel_congo_free_state:0 "The Congo Free State"
je_dsk_bel_congo_free_state_reason:0 "#bold The Congo is no ordinary colony, but a peculiar product born of the Belgian king, trading companies, explorers, and international political gamesmanship.#!\n\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_congo_monthly_tt #o Congo Extraction Level#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_congo_var').GetValue|0] / 6#!.\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_congo_reform_monthly_tt #o Congo Reform Momentum#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_congo_reform_var').GetValue|0]#!.\n#v 1. Unlock Conditions:#! The country's governance principle is [concept_monarchy], and any one of the following is met: Economic sector synergy variable reaches at least #v 3#! points and preliminary financial development has been completed; Industrial strength is at least #v 6#! and preliminary industrial construction has been completed; or the #v Workshop of Europe#! status has been obtained.\n#v 2. Detrimental Factors:#! When Congo extraction level reaches #v 6#! points and Congo reform momentum is below #v 2#! points.\n#v 3. Additional Notes:#! If only profit is pursued, the Congo will turn from a source of wealth into a liability under attack.\n\n#green Congo Revenue#! will strengthen Belgium's finances and industry; while #red Scandal Pressure#! generates [concept_infamy], angers the Great Powers, and ultimately prompts intervention."
 je_dsk_bel_congo_status_rubber:0 "#green The Congo's revenues are being transported to Europe.#!"
 je_dsk_bel_congo_free_state_status_scandal:0 "#red The Congo's scandals are breaking through the Belgian king's blockade through various channels and becoming public.#!"
 je_dsk_bel_congo_free_state_status_default:0 "#yellow Expeditions, trading companies, and diplomatic representatives are competing for the Congo's attribution.#!"
 je_dsk_bel_lowlands_question:0 "The Lowlands Question and the Unfinished Federation"
je_dsk_bel_lowlands_question_reason:0 "#bold The 1830 separation led Belgium to independence, but did not indicate the future of the Lowlands.#!\n\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_lowlands_monthly_tt #o Influence in the Lowlands#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_lowlands_var').GetValue|0] / 5#!.\n#v 1. Journal Unlock Conditions:#! The #v Treaty of London#! is in effect, and any one of the following is met: has shown interest in the Lowlands; influence in the Lowlands reaches at least #v 1#! point; or the credibility of permanent neutrality has fallen to #v 12#! or below.\n#v 2. Contributing Factors:#!#blue The Netherlands#! still exists, and relations with the Netherlands reach at least #v 50#!.\n#v 3. Detrimental Factors:#! When the credibility of permanent neutrality reaches #v 42#! or above, it becomes difficult for Belgium to act contrary to its previous declarations.\n#v 4. Additional Notes:#! This is not a costless expansion, but a dance on two eggs.\n\nBelgium can lock itself within the confines of #yellow Permanent Neutrality#!, or it can try to control the Lowlands through customs unions, the Luxembourg question, diplomacy with the Netherlands, and secret military contacts."
 je_dsk_bel_lowlands_status_federation:0 "#green The Lowlands Federation has moved from diplomatic concept to political reality.#!"
 je_dsk_bel_lowlands_status_neutrality_cost:0 "#yellow The higher the credibility of permanent neutrality, the more difficult it is for Brussels to openly promote Lowlands unification.#!"
 je_dsk_bel_lowlands_status_default:0 "#yellow There are still too many disputes between The Hague, Brussels, and Luxembourg.#!"
 je_dsk_bel_great_war:0 "The Fortresses of Liège, 1914"
je_dsk_bel_great_war_reason:0 "#bold Treaties take effect through foreign affairs conferences, but must be proven in artillery fire.#!\n\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_great_war_monthly_tt #o Belgian Resistance Intensity#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_great_war_var').GetValue|0] / 5#!.\n#v 1. Unlock Conditions:#! Drawn into war during the #v Treaty of London#!, neutral status has already collapsed, or the Franco-Prussian War has ended.\n#v 2. Contributing Factors:#! At war; at war while simultaneously holding the #v Armed Neutrality#! status.\n#v 3. Completion Conditions:#! Belgian resistance intensity reaches #v 5#! points, and possesses one of the following: the #v Armed Neutrality#! status, the #v Yser Resistance#! status, or the credibility of permanent neutrality reaches at least #v 24#!.\n#v 4. Additional Notes:#! This is not an ordinary war journal, but a shaping of Belgium's national memory.\n\nWhen the great European war approaches, [SCOPE.GetRootScope.GetCountry.GetName] must face event after event: should it hang up a white flag and refuse to fight, or scramble helplessly with no escape?"
 je_dsk_bel_great_war_status_yser:0 "#green Liège, Antwerp, and the Yser River have constructed layers of solid defensive lines.#!"
 je_dsk_bel_great_war_status_invasion:0 "#red Neutrality no longer exists, and the kingdom's continuation can only be maintained through armies and fortresses.#!"
 je_dsk_bel_great_war_status_default:0 "#yellow The General Staff is checking every equipment list and independent guarantee.#!"
 je_dsk_bel_postwar_belgium:0 "The Exhaustion of the Victor"
je_dsk_bel_postwar_belgium_reason:0 "#bold After the war ended, Belgium won sympathy, but did not return to peace.#!\n\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_postwar_monthly_tt #o Postwar Stability Status#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_postwar_var').GetValue|0] / 4#!.\n#v 1. Contributing Factors:#! Government possesses at least #v 55#! [concept_legitimacy], or national reconciliation has been achieved.\n#v 2. Genuine Reversal Conditions:#! If national cohesion is below #v 0#! points and the compromise tendency is greater than #v 0#! points.\n#v 3. Completion Conditions:#! Postwar stability reaches #v 4#! points, the government possesses at least #v 80#! [concept_legitimacy], and national cohesion is not below #v 0#! points.\n#v 4. Additional Notes:#! This journal entry leads to the crises of the 1930s; whether Belgium can continue to survive on compromise depends on the social system of the ten years after the war.\n\nPostwar reconstruction, pensions, universal rights, military demobilization, labor protections, and national issues will simultaneously press upon parliament. High [concept_legitimacy] and national reconciliation can bring about #green Postwar Stability#!; a lack of cohesion and immense economic pressure will push society toward #red Radical Politics#!."
 je_dsk_bel_postwar_status_reform:0 "#green The orderly realization of broader civil rights, labor protections, and military demobilization is promoting overall national stability.#!"
 je_dsk_bel_postwar_status_language:0 "#red Postwar reconstruction cannot mask the national conflict, and the Flemish question has once again returned to the forefront.#!"
 je_dsk_bel_postwar_status_default:0 "#yellow The state is repairing cities destroyed by war and also mending the social order it has broken.#!"
 je_dsk_bel_railways_and_finance:0 "National [GetBuildingType('building_railway').GetName] Bonds"
je_dsk_bel_railways_and_finance_reason:0 "What [SCOPE.GetRootScope.GetCountry.GetName] relies on does not come from vast territory, but from developed finance,shipping, and mining industries—these must be interconnected through trade.\n\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_finance_monthly_tt #o Railway Economic Development Status#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_finance_var').GetValue|0]#!.\n#v 1. Unlock Conditions:#! Completing any one of the following: industrial strength reaches at least #v 3#!; already possesses a Wallonian mining base; or has obtained the #v Workshop of Europe#! status.\n#v 2. Contributing Factors:#! When the country holds the #v Developed Brussels Finance#! status and the labor compromise tendency is below #v 2#! points; or choose to #v Issue National [GetBuildingType('building_railway').GetName] Bonds#!;\n#v 3. Detrimental Factors:#! Labor conflicts, outstanding loans, and financial audits.\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_finance_events #o potential events regarding finance#!#! under specific conditions."
 je_dsk_bel_labor_question:0 "Labor Compromise"
je_dsk_bel_labor_question_reason:0 "The taller the factory chimney, the harder it becomes to ignore the voices within. Miners, [GetBuildingType('building_port').GetName] workers, Catholic mutual aid societies, socialist newspapers, and factory owners all demand that the state take a stance, but this issue will only be brought before parliament after the industrial society has been initially built.\n\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_labor_monthly_tt #o Labor Compromise Tendency#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_labor_var').GetValue|0]#!.\n#v 1. Unlock Conditions:#! Industrial strength is at least #v 5#! points, and [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName]'s [concept_clout] reaches at least #v 8%#!; or after financial development has been completed, the trade unions' [concept_clout] reaches at least #v 6%#!; or has obtained the #v Strike Wave#! effect, with the labor compromise tendency at #v -2#! or below.\n#v 2. Detrimental Factors:#! Possesses the #v Strike Wave#! status.\n#v 4. Additional Notes:#! Establishing a mine inspection system promotes compromise; suppressing strikes can secure short-term production but will radicalize the country, lower national cohesion, and make subsequent crises harder to manage.\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_labor_events #o potential events regarding labor conflict#!#! under specific conditions."
je_dsk_bel_franco_prussian_crisis:0 "Neutrality in the Franco-Prussian War"
je_dsk_bel_franco_prussian_crisis_reason:0 "When the Treaty of London collapses, Lowlands conflicts intensify, French attitudes deteriorate, and German pressure mounts, the survival of [SCOPE.GetRootScope.GetCountry.GetName] becomes imminent. What [SCOPE.sCountry('dsk_bel_fra_scope').GetName], [SCOPE.sCountry('dsk_bel_pru_scope').GetName], and [SCOPE.sCountry('dsk_bel_gbr_scope').GetName] care about is not whether Belgium claims neutrality, but whether it has effectively fulfilled the duties of neutrality.\n\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_franco_prussian_monthly_tt #o Neutrality Credibility During Franco-Prussian War#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_franco_prussian_var').GetValue|0] / 6#!.\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_neutrality_monthly_tt #o Credibility of Permanent Neutrality#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_var').GetValue|0] / 55#!.\n#v 1. Unlock Conditions:#! Only when #blue France#! has formally entered war with #blue Prussia#! or #blue Germany#!.\n#v 2. Contributing Factors:#! The country holds the #v Strict Neutrality#! status, and the threat of the Franco-Prussian War is still below #v 6#! points.\n#v 3. Detrimental Factors:#! The country holds the #v Secret Military Contacts#! status.\n#v 4. Additional Notes:#! Maintaining neutrality requires joint support from journal entries and event choices.\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_franco_prussian_events #o potential events regarding the Franco-Prussian War#!#! under specific conditions."
 je_dsk_bel_congo_reform:0 "Reforming the Congo Free State"
je_dsk_bel_congo_reform_reason:0 "#bold The Congo Free State is no longer just the king's private affair.#!\n\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_congo_reform_monthly_tt #o Congo Reform Momentum#!#! is: #v [GetPlayer.MakeScope.Var('dsk_bel_congo_reform_var').GetValue|0]#!.\n#v 1. Unlock Conditions:#! The Congo event chain has been completed; or Congo extraction level reaches at least #v 5#! points and domestic finance has undergone preliminary development; or possesses the #v Congo Scandal#! status.\n#v 2. Contributing Factors:#! Possesses the #v Congo Scandal#! status.\n#v 3. Detrimental Factors:#! When Congo extraction level reaches at least #v 5#! points and reform momentum is below #v 2#! points.\n#v 4. Additional Notes:#!#green State Takeover#! reduces international pressure and reshapes the colonial administration; #red Securing Revenue#! benefits the treasury and industry, but generates scandal, [concept_infamy], and the risk of Great Power intervention.\n\nMissionary testimonies, trading company interests, parliamentary investigations, and international humanitarian pressure will become potential events over time. If [SCOPE.sCharacter('dsk_bel_leopold_ii_scope').GetFullName] still tries to treat the Congo as private property, the reform opportunity will be quickly strangled."
 je_dsk_bel_belgian_extremes:0 "Radical Politics of the 1930s"
je_dsk_bel_belgian_extremes_reason:0 "The Great Depression, Rexism, the spread of socialism, ethnic autonomy, and debates over rearmament all simultaneously press upon [SCOPE.GetRootScope.GetCountry.GetName].\n\nCurrent #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_extremes_monthly_tt #o Political Radicalization#!#! status is: #v [GetPlayer.MakeScope.Var('dsk_bel_extremes_var').GetValue|0]#!.\n#v 1. Unlock Conditions:#! Postwar stability has not been achieved, radicalization tendency is high, government [concept_legitimacy] is below #v 45#!, or already possesses the #v Pressure from Rexism#! status.\n#v 2. Detrimental Factors:#! Possesses the #v Pressure from Rexism#! status.\n#v 3. Additional Notes:#! Government with high [concept_legitimacy], maintaining postwar stability and national reconciliation will preserve the parliamentary system; low government legitimacy, pressure from Rexism, and ethnic conflict will push the country toward radical politics."
 je_dsk_bel_national_question:0 "The Position of Belgium"
je_dsk_bel_national_question_reason:0 "#bold What Belgium needs is not expansion, but to prove whether a small country caught between great powers can become a durable state.#!\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_independence_monthly_tt #o Diplomatic Recognition#!#!Expected change next month #variable [GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_delta_var').GetValue|+=]#!, current progress is #v [GetPlayer.MakeScope.Var('dsk_bel_independence_var').GetValue|0] / 55#!\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_neutrality_monthly_tt #o Credibility of Permanent Neutrality#!#!Expected change next month #variable [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_delta_var').GetValue|+=]#!, current status is #v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_var').GetValue|0] / 55#!\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_industry_monthly_tt #o Industrial Strength#!#!Expected change next month #variable [GetPlayer.MakeScope.Var('dsk_bel_industry_monthly_delta_var').GetValue|+=]#!, current status is #v [GetPlayer.MakeScope.Var('dsk_bel_industry_var').GetValue|0] / 55#!\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_unity_monthly_tt #o National Cohesion#!#!Expected change next month #variable [GetPlayer.MakeScope.Var('dsk_bel_unity_monthly_delta_var').GetValue|+=]#!, current status is #v [GetPlayer.MakeScope.Var('dsk_bel_unity_var').GetValue|0] / 55#!\n\n#v 1. Drivers of Diplomatic Recognition:#! When [concept_relations] with at least one of #blue Britain#!, #blue France#!, or #blue Prussia#! reaches #v 50#! or above, monthly progress is #v +0.25#!, up to a maximum of #v 0.50#!.\n#v 2. Drivers of Permanent Neutrality Credibility:#! After unlocking #o Permanent Neutrality#!, monthly progress is #v +0.25#! when at #v Peace#! and [concept_infamy] is below #v 5#!; possessing the #v Strict Neutrality#! or #v Armed Neutrality#! status adds #v +0.25#! per month. Detrimental factors for diplomatic recognition: being at war reduces monthly progress by #v -1#!, moderate infamy causes #v -0.25#! per month, high infamy causes #v -1#! per month.\n#v 3. Drivers of Industrial Strength#!:[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]'s [concept_clout] reaches at least #v 10%#! or already possesses the #v Developed Brussels Finance#! status, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_workshop_industrial_base_tt Wallonian mining, Wallonian heavy industry, Flemish shipping construction, Flemish export industry, and Wallonian [GetBuildingType('building_railway').GetName]#!—these five industrial constructions each provide #v +0.10#! progress per month; if all industrial constructions are completed, and [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]'s [concept_clout] reaches at least #v 10%#! with the #v Developed Brussels Finance#! status, then #v +0.15#! progress per month.\n#v 4. Drivers of National Cohesion:#![GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]'s [concept_clout] reaches at least #v 15%#! and the country does not have the #v Flemish Suppression#! status, monthly progress is #v +0.25#!; if #v Education Compromise Negotiation#! or #v Language Reconciliation#! has been formed, an additional #v +0.25#! per month.\n#v 5. Prerequisite Notes:#! The #green monthly growth#! of permanent neutrality credibility does not take effect immediately; it requires obtaining diplomatic recognition, the #o Treaty of London#! taking effect, and the #o Permanent Neutrality#! journal entry being unlocked."
 je_dsk_bel_national_question_status_confident:0 "#green The foundations of the Belgian state have begun to take shape#!"
 je_dsk_bel_national_question_status_collapse:0 "#red The national question has become an urgent matter of survival#!"
 je_dsk_bel_national_question_status_default:0 "#yellow Brussels is still trying to transform the product of a revolution into a durable state.#!"
 je_dsk_bel_royal_colonialism:0 "The King's Private Domain"
 je_dsk_bel_royal_colonialism_reason:0 "The Congo question is not just overseas colonization, but an entanglement of royal authority, parliamentary oversight, and national reputation.\n\n#v 1. Unlock Conditions:#! Belgium still maintains the [concept_monarchy] governance principle, and has completed the Congo event chain, or Congo extraction level reaches at least #v 4#!.\n#v 3. Additional Notes:#! If Congo reform is shelved, the Congo Free State will become ammunition for anti-monarchism and international condemnation;#!#green the king can convert colonial revenue into prestige#!, at the cost of higher political risk."
 je_dsk_bel_royal_colonialism_status_scandal:0 "#red The king's private domain is being surrounded by unending reports and parliamentary inquiries.#!"
 je_dsk_bel_royal_colonialism_status_default:0 "#yellow The king still tries to shape the Congo as a joint enterprise of personal prestige and national standing.#!"
 je_dsk_bel_parliamentary_compromise:0 "The Compromise State Under Parliament"
 je_dsk_bel_parliamentary_compromise_reason:0 "If Belgium has moved toward a purer parliamentary politics, the future will shift from royal mediation to political parties, interest groups, and national reconciliation.\n\n#v 1. Unlock Conditions:#! The nation already possesses broader political rights, such as having the #v Universal Suffrage#! law; and either the education compromise or national cohesion has reached at least #v 2#! points.\n#v 2. Contributing Factors:#! Government with high [concept_legitimacy], compromise in the school war achieved, national reconciliation, and electoral reform.\n#v 3. Failure Factors:#! Prolonged political turmoil, government legitimacy seriously questioned."
 je_dsk_bel_parliamentary_compromise_status_radicals:0 "#red The governance of parliament is widely questioned, and voices outside the assembly are tearing the country apart.#!"
 je_dsk_bel_parliamentary_compromise_status_default:0 "#yellow Catholics, liberals, socialists, and Flemish nationalists still act within the parliamentary framework.#!"
 je_dsk_bel_failure_ledger:0 "The Consequences of Failure"
 je_dsk_bel_failure_ledger_reason:0 "#bold A small country survives in the cracks, which means it must allow itself to fail, and failure is not the end of everything.#!\n\n#v 1. Unlock Conditions:#! Neutral status collapses; or the credibility of permanent neutrality falls to #v 0#! or below; or national cohesion falls to #v -3#! or below; or Congo reform momentum falls to #v -3#! or below; or political radicalization falls to #v -2#! or below.\n#v 2. Additional Notes:#! It is not a simple punishment, but a guide leading the player toward crisis recovery: rebuilding the credibility of permanent neutrality, repairing ethnic relations, curbing colonial scandal, and maintaining the parliamentary system.\n\n#green Repairing National Fissures#! can allow Belgium to recover from crisis; #red Allowing Collapse#! will let the aftereffects of national collapse linger."
 je_dsk_bel_failure_ledger_status_neutrality:0 "#red Belgium's neutral status has collapsed, and the Great Powers no longer trust Belgium.#!"
 je_dsk_bel_failure_ledger_status_language:0 "#red The ethnic conflict is shifting from an administrative issue to a challenge to national loyalty.#!"
 je_dsk_bel_failure_ledger_status_colonial:0 "#red The Congo scandal has exceeded the limits that the monarchy and parliament can cover up.#!"
 je_dsk_bel_failure_ledger_status_default:0 "#yellow Belgium is paying the price for past choices.#!"
 je_dsk_bel_finance_status_fast:0 "#green Products, financial bonds. Transport and orders are mutually reinforcing, and the state apparatus is running at high speed on this foundation.#!"
 je_dsk_bel_finance_status_speculation:0 "#red Speculative fever is overwhelming the public interest; workers and parliamentarians both begin to doubt who truly benefits from this false prosperity.#!"
 je_dsk_bel_finance_status_default:0 "#yellow The treasury, bankers, and factory owners are still competing for the focus of the [GetBuildingType('building_railway').GetName] national project.!#!"
 je_dsk_bel_labor_status_compromise:0 "#green Trade unions, mutual aid societies, and parliamentary reformists have reached a viable social compromise.#!"
 je_dsk_bel_labor_status_unrest:0 "#red Mining regions no longer hope for Brussels' response; strikes, newspaper agitation, and street speeches have become new avenues and windows.#!"
 je_dsk_bel_labor_status_default:0 "#yellow Industrial expansion has brought the labor question from inside the factory into the parliamentary chamber.#!"
 je_dsk_bel_franco_prussian_status_secure:0 "#green The neutrality system has withstood the pressure of the Franco-Prussian War, and the Great Powers continue to recognize Belgium's neutrality.#!"
 je_dsk_bel_franco_prussian_status_danger:0 "#red Border alerts, emergency armament, and diplomatic notes operate in concert; any statement can be interpreted as diplomatic alignment.#!"
 je_dsk_bel_franco_prussian_status_default:0 "#yellow Belgium is using fortifications, diplomatic statements, and armament timetables to show that its neutrality is no empty talk.#!"
 je_dsk_bel_congo_status_reform:0 "#green Parliamentary inquiries have eclipsed royal charters, and the takeover of the Congo is on the agenda.#!"
 je_dsk_bel_congo_status_scandal:0 "#red The truth disclosed by newspapers and the diplomatic condemnation of the Great Powers are turning the Congo question into a national scourge.#!"
 je_dsk_bel_congo_status_default:0 "#yellow The revenues from the Congo continue to flow into Belgium, and the scandals from the Congo follow like a shadow.#!"
 je_dsk_bel_extremes_status_democracy:0 "#green Parliamentary politics can still resolve crises, and the democratic system has not yet been shattered by extremist movements.#!"
 je_dsk_bel_extremes_status_radicals:0 "#red The anti-parliamentary agitation of Rexists and red elements is damaging national political stability.#!"
 je_dsk_bel_extremes_status_default:0 "#yellow The crisis of the 1930s did not stem from a single election, but from a total eruption of disputes over national identity, the economy, and national security policy.#!"
dsk_bel_independence_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of Relations with Great Powers:#![GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_delta_var').GetValue|+=].\n#v 2. Contributing Factors:#! When [concept_relations] with at least one of #blue Britain#!, #blue France#!, or #blue Prussia#! reaches #v 50#! or above, monthly progress advances by #v +0.25#!, up to a maximum of #v 0.50#!.\n#v 3. Detrimental Factors:#! Neutral status has already been broken."
dsk_bel_neutrality_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_delta_var').GetValue|+=]#!\nv 1. Impact of Low [concept_infamy]:#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_peace_delta_var').GetValue|+=]#!.\n#v 2. Contributing Factors:#! When the country is at peace, permanent neutrality credibility is below #v 55#!, and [concept_infamy] is below #v 5#!, progress increases by #v +0.25#! per month; if holding the #v Strict Neutrality#!\n#v Armed Neutrality#! status, an additional #v +0.25#! is gained.\n#v 3. Impact from War:#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_war_delta_var').GetValue|+=]#!. Being at war results in a monthly change of #v -1#!.\n#v 4. Impact of Infamy:#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_infamy_delta_var').GetValue|+=]#!. When [concept_infamy] is between #v 2#! and #v 10#!, monthly progress is #v -0.25#!; above #v 10#!, it is #v -1#! per month.\n#v 5. Prerequisite Notes:#! If the #o Treaty of London#! has not taken effect, the #o Permanent Neutrality#! journal entry has not been unlocked, or the country is at war, monthly growth will not take effect."
dsk_bel_industry_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_industry_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of Industrial Construction:#!#v [GetPlayer.MakeScope.Var('dsk_bel_industry_monthly_base_delta_var').GetValue|+=]#!.\n#v 2. Contributing Factors:#! Completed #yellow Wallonian Mining#!,#yellow Wallonian Heavy Industry#!, #yellow Flemish Shipping Construction#!, #yellow Flemish Export Industry#!, #yellow Wallonian Internal [GetBuildingType('building_railway').GetName]#! each provide #v +0.10#! progress.\n#v 3. Additional Bonus:#! When all five industrial constructions are completed, and [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]'s [concept_clout] reaches at least #v 10%#! with the #v Developed Brussels Finance#! status, an additional #v +0.15#! progress is gained."
dsk_bel_school_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_school_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of Education System Law and Government [concept_legitimacy]:#!#v [GetPlayer.MakeScope.Var('dsk_bel_school_monthly_base_delta_var').GetValue|+=]#!.\n#v 2. Contributing Factors:#! Possesses the #v Public Schools#! or #v Religious Schools#! law, and the government has at least #v 45#! [concept_legitimacy], gaining #v +0.5#! progress per month."
dsk_bel_unity_monthly_tt:0: "#green Current Monthly Change: #!#v [GetPlayer.MakeScope.Var('dsk_bel_unity_monthly_delta_var').GetValue|+=]#!\n#v 1. Contribution from Ethnic Reconciliation: #!#v [GetPlayer.MakeScope.Var('dsk_bel_unity_monthly_base_delta_var').GetValue|+=]#!.\n#v 2. Boosting Factors: #!If the [concept_clout] of [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] is at least #v 15%#! and the country does not have the #v Suppress Flemish Populace#! state, gain #v +0.25#! progress monthly. If you also hold the #v Educational Compromise Negotiations#! or #v Linguistic Reconciliation#! modifier at the same time, gain an additional #v +0.25#! progress each month."
dsk_bel_congo_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_congo_monthly_delta_var').GetValue|+=]#!"
dsk_bel_lowlands_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_lowlands_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of Diplomatic Relations with the Netherlands:#!#v [GetPlayer.MakeScope.Var('dsk_bel_lowlands_monthly_relations_delta_var').GetValue|+=]#!. When the Netherlands exists and [concept_relations] with the Netherlands reaches at least #v 50#!, progress is #v +0.25#! per month.\n#v 2. Impact of Neutral Status:#!#v [GetPlayer.MakeScope.Var('dsk_bel_lowlands_monthly_neutrality_delta_var').GetValue|+=]#!. Only when the credibility of permanent neutrality reaches #v 42#! or above, progress is #v -0.25#! per month."
dsk_bel_great_war_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_great_war_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of Wartime Resistance:#!#v [GetPlayer.MakeScope.Var('dsk_bel_great_war_monthly_war_delta_var').GetValue|+=]#!. When at war, #v +1#! progress per month.\n#v 2. Impact of Fortress Defense:#!#v [GetPlayer.MakeScope.Var('dsk_bel_great_war_monthly_fortress_delta_var').GetValue|+=]#!. Holding the #v Armed Neutrality#! status grants an additional #v +1#! progress."
dsk_bel_postwar_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_postwar_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of High Legitimacy:#!#v [GetPlayer.MakeScope.Var('dsk_bel_postwar_monthly_legitimacy_delta_var').GetValue|+=]#!. Government with at least #v 55#! [concept_legitimacy] gains #v +0.5#! progress per month.\n#v 2. Impact of Low National Cohesion:#!#v [GetPlayer.MakeScope.Var('dsk_bel_postwar_monthly_unity_delta_var').GetValue|+=]#!. If national cohesion is below #v 0#! and postwar stability has not reset to zero, #v -0.5#! per month."
dsk_bel_finance_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_finance_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of Financial Development Status:#!#v [GetPlayer.MakeScope.Var('dsk_bel_finance_monthly_house_delta_var').GetValue|+=]#!.\n#v 2. Contributing Factors:#! Possesses the #v Developed Brussels Finance#! status, and labor compromise tendency is below #v 2#!, gaining #v +0.25#! per month; if also holding the #v Workshop of Europe#! status, or [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]'s [concept_clout] reaches at least #v 15%#!, an additional #v +0.25#! per month."
dsk_bel_labor_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_labor_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of Strike Wave:#!#v [GetPlayer.MakeScope.Var('dsk_bel_labor_monthly_strike_delta_var').GetValue|+=]#!. Holding the #v Strike Wave#! status, #v -0.25#! per month."
dsk_bel_franco_prussian_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_franco_prussian_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of Strict Neutrality:#!#v [GetPlayer.MakeScope.Var('dsk_bel_franco_prussian_monthly_neutrality_delta_var').GetValue|+=]#!. Holding the #v Strict Neutrality#! status, and the Neutrality Credibility in the Franco-Prussian War has not reached #v 6#! points, gaining #v +0.5#! per month.\n#v 2. Impact of Secret Military Contacts:#!#v [GetPlayer.MakeScope.Var('dsk_bel_franco_prussian_monthly_staff_delta_var').GetValue|+=]#!. Holding the #v Secret Military Contacts#! status, and the credibility of permanent neutrality is greater than #v 0#!, #v -0.5#! per month."
dsk_bel_congo_reform_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_congo_reform_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of Scandals and Investigations:#!#v [GetPlayer.MakeScope.Var('dsk_bel_congo_reform_monthly_scandal_delta_var').GetValue|+=]#!. Holding the #v Congo Scandal#! modifier, #v +0.25#! per month.\n#v 2. Impact of the Old Free State Forces:#!#v [GetPlayer.MakeScope.Var('dsk_bel_congo_reform_monthly_old_order_delta_var').GetValue|+=]#!. When Congo extraction reaches #v 5#! points and Congo reform momentum is below #v 2#! points, #v -0.25#! per month."
dsk_bel_extremes_monthly_tt:0 "#green Current Monthly Change:#!#v [GetPlayer.MakeScope.Var('dsk_bel_extremes_monthly_delta_var').GetValue|+=]#!\n#v 1. Impact of Pressure from Rexism:#!#v [GetPlayer.MakeScope.Var('dsk_bel_extremes_monthly_rex_delta_var').GetValue|+=]#!. Holding the #v Pressure from Rexism#! modifier, #v -0.25#! per month."
dsk_bel_independence_relax_tt:0 "#v 1. Impact of Eased Diplomatic Relations:#!#v [GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_relations_delta_var').GetValue|+=]#!\n#v 2. Contributing Factors:#! Maintaining #v Friendly#! relations with any of #blue Britain#!, #blue France#!, or #blue Prussia#! gives #v +0.25#! progress per month, up to a maximum of #v +0.50#!.\n#v 3. Notes:#!If neutral status collapses, an aggressive war is launched, or diplomatic adventurism causes Great Power suspicion, this growth will stop."
dsk_bel_independence_advance_tt:0 "#v 1. Impact of Contributing Factors:#!#v [GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_delta_var').GetValue|+=]#!, from the Great Powers' willingness to continue regarding Belgium as an acceptable Lowlands buffer state.."
dsk_bel_neutrality_regress_tt:0 "#v 1. Impact from War:#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_war_delta_var').GetValue|+=]#!, war is the most direct infringement on neutral status.\n#v 2. Impact of High Infamy:#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_infamy_delta_var').GetValue|+=]#!, high [concept_infamy] will damage the trust of the Great Powers."
dsk_bel_neutrality_advance_tt:0 "#v 1. Impact of Contributing Factors:#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_peace_delta_var').GetValue|+=]#!.\n#v 2. Contributing Factors:#! At peace, infamy below #v 5#! points, #v +0.25#! per month; holding the #v Strict Neutrality#! or #v Armed Neutrality#! status, an additional #v +0.25#! per month."
dsk_bel_industry_advance_tt:0 "#v 1. Impact of Industrial Construction:#!#v [GetPlayer.MakeScope.Var('dsk_bel_industry_monthly_base_delta_var').GetValue|+=]#!.\n#v 2. Contributing Factors:#! With capital conditions met, each completed Wallonian mining, Wallonian heavy industry, Flemish shipping construction, Flemish export industry, and Wallonian internal [GetBuildingType('building_railway').GetName] provides #v +0.10#! progress per month.\n#v 3. Additional Bonus:#! When #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_workshop_industrial_base_tt Industrial Construction#! is fully completed, and [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]'s [concept_clout] reaches at least #v 10%#! with the #v Developed Brussels Finance#! status, an additional #v +0.15#! per month."
dsk_bel_finance_regress_tt:0 "#v 1. Impact of Financial Resistance:#!#v [GetPlayer.MakeScope.Var('dsk_bel_labor_monthly_strike_delta_var').GetValue|+=]#!, strike waves and mining region unrest drag down economic sector synergy."
dsk_bel_unity_regress_tt:0 "Current obstacles to national cohesion mainly come from:\nStalled national reconciliation, continued central government repression, or education disputes continuing to tear society apart."
dsk_bel_unity_advance_tt:0 "#v 1. Impact of National Reconciliation:#!#v [GetPlayer.MakeScope.Var('dsk_bel_unity_monthly_base_delta_var').GetValue|+=]#!.\n#v 2. Contributing Factors:#![GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] has at least #v 15%#! [concept_clout] and does not have the #v Flemish Suppression#! status, gaining #v +0.25#! per month; holding the #v Education Compromise#! or #v Language Reconciliation#! status, an additional #v +0.25#! per month."
dsk_bel_tooltip_independence_events:0 "1.#v Border Commission#!: Appears when diplomatic negotiations have just begun and #blue the Netherlands#! still refuses to accept the fact of separation. It mainly handles #v Limburg#!, #v Luxembourg#!, and the Scheldt River boundary issues, often forcing Belgium to decide between territory, commerce, and the diplomatic environment.\n2.#v Dutch Resentment#!: More likely to appear when #blue the Netherlands#! still exists and [concept_relations] with Belgium are at a low level, with border tensions.\n3.#v The Additional Cost of Diplomatic Recognition#!: More likely to appear when relations with #blue Britain#!, #blue France#!, or #blue Prussia#! gradually improve and diplomatic recognition dawns. It represents the Great Powers' willingness to accept Belgium's existence, but usually comes with #v Neutrality Constraints#!, #v Buffer State Obligations#!, or diplomatic self-restraint.\n4.#v The Belgian Question#!: Appears when diplomatic recognition is nearly complete, or the Great Powers have truly accepted Belgium. This determines whether this #bold New Kingdom#! is merely a passing fancy of revolution or a state that can continue to exist."
 dsk_bel_tooltip_neutrality_events:0 "1.#v Declaration of Neutrality#!: The credibility of permanent neutrality continues to grow when at peace and with low [concept_infamy].\n2.#v Collapse of Neutral Status#!: Being at war, having high [concept_infamy], or secret diplomatic leanings will damage the credibility of permanent neutrality."
dsk_bel_tooltip_workshop_events:0 "1.#v Sambre-Meuse Industrial Belt#!: Persistently advances when #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_workshop_industrial_base_tt Wallonian Mining, Heavy Industry, and Flemish Shipping Construction#! are completed, and [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName] has at least #v 10%#! [concept_clout] or possesses the #v Developed Brussels Finance#! status.\n2.#v [GetBuildingType('building_railway').GetName] Bonds#!: Issuing bonds will accelerate industrial and financial development, but is detrimental to labor compromise.\n3.#v Financial Audit#!: Available when [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] has at least #v 5%#! [concept_clout], increases legitimacy but slows capital expansion."
dsk_bel_tooltip_school_events:0 "1.#v The Bishop's Encyclical#!: More likely to appear when the [concept_devout] has at least #v 18%#! [concept_clout] and the government has [concept_legitimacy] below #v 60#!, or when the [concept_devout] is in the government with at least #v 15%#! [concept_clout];\n2.#v Liberal Schools#!: When the country has the #v Public Schools#! educational system, or [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] has at least #v 12%#! [concept_clout], national education is promoted.\n3.#v Local Resistance#!: Unilaterally funding religious schools or public schools will both undermine national cohesion.\n4.#v Education Compromise#!: When the Education Compromise Negotiation reaches #v 7#! and the government has at least #v 80#! [concept_legitimacy], the education issue enters a stage of institutionalized compromise."
 dsk_bel_tooltip_flemish_events:0 "1.#v Official Language#!: Triggered when the School War progress advances, #yellow Flanders#! is in turmoil, or [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]'s strength rises.\n2.#v #yellow Flemish#! Petition#!: More likely to appear when national cohesion is low.\n3.#v Adopting Flemish#!: Increases national cohesion and promotes postwar stability.\n4.#v Maintaining French Administration#!: Improves administration and financial efficiency in the short term, but deepens ethnic conflict."
 dsk_bel_tooltip_finance_events:0 "1.#v National [GetBuildingType('building_railway').GetName] Bonds#!: Enters economic sector synergy development when industrial strength reaches #v 3#! points or possesses the Workshop of Europe modifier.\n2.#v London Capital Injection#!: [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName] and [GetBuildingType('building_port').GetName] construction will push progress.\n3.#v Securities Scandal#!: More dangerous when economic development rises too quickly or labor compromise tendency is negative.\n4.#v [GetBuildingType('building_railway').GetName] Cities#!: [GetBuildingType('building_port').GetName], [GetBuildingType('building_railway').GetName], and [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]'s [concept_clout] jointly promote national development."
 dsk_bel_tooltip_labor_events:0 "1.#v Mining Accident#!: More likely to appear when industrial strength is high and labor protections are lacking.\n2.#v Union Organization#!: When [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName] has sufficient [concept_clout], it heads toward social compromise and conflict eruption along two progress paths."
dsk_bel_tooltip_franco_prussian_events:0 "1.#v Border Reports#!: The #v Treaty of London#! is in effect, and #blue France#! has already entered war with #blue Prussia#! or #blue Germany#!; more likely to appear when neutral status has been obtained, permanent neutrality credibility is below #v 18#!, interest in the Lowlands has been shown, or relations with France and Germany are below #v 20#!.\n2.#v British Guarantee#!: National security is easier to maintain when relations with Britain reach #v 50#!.\n3.#v Strict Neutrality#!: Reduces the space for proactive diplomacy, facilitating neutrality in the Franco-Prussian War.\n4.#v Secret Military Contacts#!: Continues to damage the credibility of permanent neutrality, in exchange for stronger border military preparedness."

# ============================== DSK Belgium: Event Texts ==============================
 dsk_belgium.1.t:0 "The Borders of the New Kingdom"
 dsk_belgium.1.d:0 "The independence of [SCOPE.GetRootScope.GetCountry.GetName] has been established through the promulgation of the constitution and the king's oath, but its existence has not been widely recognized in international diplomacy. [SCOPE.sCountry('dsk_bel_net_scope').GetName] still regards the 1830 separation as an unrest that has never been pacified, [SCOPE.sCountry('dsk_bel_fra_scope').GetName] seeks to exert influence over the Lowlands, while [SCOPE.sCountry('dsk_bel_gbr_scope').GetName] only wants a buffer state not annexed by any great power."
 dsk_belgium.1.f:0 "The London Conference dealt not only with the division of influence among the powers, but with a verdict on how the Lowlands state would continue to exist.\n\nIf [SCOPE.GetRootScope.GetCountry.GetName] accepts the Great Powers' guarantees, #green Diplomatic Recognition#! progress will accelerate, but permanent neutrality will lock the kingdom's diplomatic space like a chain; if it insists that the Lowlands question is unresolved, Belgium will gain more room to maneuver, but the Netherlands and the Great Powers will suspect whether this new kingdom truly intends to stop here.\n\n#yellow The birth of a small country often does not begin with its own declaration of independence, but with the recognition of the great powers.#!"
 dsk_belgium.1.a:0 "Accept the Great Powers' guarantees."
 dsk_belgium.1.b:0 "The Lowlands question is far from over."
 dsk_belgium.2.t:0 "The Resolutions of the Border Commission"
 dsk_belgium.2.d:0 "Inside the Border Commission's meeting room hangs a giant map of the Lowlands, while on the table lie asset inventories and draft treaty documents. The asset inventories of Limburg, Luxembourg, and the de facto Belgian-Dutch border areas were repeatedly checked by representatives of [SCOPE.sCountry('dsk_bel_gbr_scope').GetName], [SCOPE.sCountry('dsk_bel_fra_scope').GetName], and [SCOPE.sCountry('dsk_bel_net_scope').GetName]; for them this was a division of influence, but for [SCOPE.GetRootScope.GetCountry.GetName] it decided the long-term national structure."
 dsk_belgium.2.f:0 "Diplomatic documents may be forgotten, but the practical effects they produce are perpetual.\n\nAccepting the commission's plan will advance #green Diplomatic Recognition#!, but will also write certain unresolved territorial disputes permanently into the diplomatic archive. Refusal may show more backbone, but the young kingdom's strength and external environment are insufficient for such a stance."
 dsk_belgium.2.a:0 "Sign this unpleasant agreement."
 dsk_belgium.3.t:0 "Dutch Resentment"
 dsk_belgium.3.d:0 "The court and army of [SCOPE.sCountry('dsk_bel_net_scope').GetName] still refuse to accept the outcome of 1830. Word of small-scale clashes has come from border outposts; Dutch newspapers call Belgium an unrest that has never been pacified, while hardliners in the government remind [SCOPE.sCharacter('dsk_bel_ruler_scope').GetFullName]: if we yield now, the future direction of the Lowlands states will continue to be dictated by the Netherlands."
 dsk_belgium.3.f:0 "Two neighboring countries confront each other, neither willing to show the slightest weakness.\n\n#green Continued Pressure#! will create opportunities for the realization of a federation plan, but will damage relations with the Netherlands and cause the Great Powers to doubt whether Belgium will uphold permanent neutrality. #yellow Prioritizing Neutral Status#! reduces the risk of conflict with the Netherlands, but to some extent gives up the chance to lead the Lowlands question."
 dsk_belgium.3.a:0 "Continue to apply pressure; let the Netherlands know we will not be ignored."
 dsk_belgium.3.b:0 "Prioritize securing neutral status; we cannot gamble the kingdom's future."
dsk_belgium.4.t:0 "The Additional Cost of Diplomatic Recognition"
 dsk_belgium.4.d:0 "The London Conference has formally concluded, and the participating states have jointly recognized Belgium's separation from the Netherlands in written form; diplomatic relations with Belgium will be established individually in the coming days.\n\nThis causes [SCOPE.GetRootScope.GetCountry.GetName] to be recognized as an independent kingdom that will endure, rather than a short-lived premature birth spawned by a revolution."
 dsk_belgium.4.f:0 "The first gift the young kingdom receives is permission to continue existing.\n\nDiplomatic recognition and guarantees do bring security, but with conditions: border conflicts, expansion in the Lowlands, or even any voluntarily initiated [concept_diplomatic_play] could make Belgium a target of all. This price is not cheap: the foreign ministry must learn to hide its own tendencies, the army will make defensive fortifications the centerpiece of its operational plans, and parliament must explain to the public why permanent neutrality is more valuable than a war victory."
 dsk_belgium.4.a:0 "Let the treaty protect us, and bind us."
 dsk_belgium.6.t:0 "The Treaty of London Takes Effect"
 dsk_belgium.6.d:0 "The Treaty of London formalizes the existence of [SCOPE.GetRootScope.GetCountry.GetName] through an international conference, with the Great Powers recognizing it. Belgium's independence, diplomatic neutrality, and boundary delimitation are no longer just Brussels' own word, but the consensus of the European Great Powers."
 dsk_belgium.6.f:0 "From today on, [SCOPE.sCountry('dsk_bel_gbr_scope').GetName] gains the security of the Channel from this, [SCOPE.sCountry('dsk_bel_fra_scope').GetName] thereby has a buffer in the north, [SCOPE.sCountry('dsk_bel_net_scope').GetName] is forced to acknowledge that the southern secession has become an established fact, and Belgium formally steps onto the stage of European diplomacy..\n\nAbiding by the treaty will enhance the credibility of permanent neutrality, but it will not govern Belgium's mining regions, education, or ethnic issues. Real kingdom-building has only just begun."
 dsk_belgium.6.a:0 "This is the cornerstone of the kingdom's continued existence."
 dsk_belgium.7.t:0 "Crisis of Survival"
 dsk_belgium.7.d:0 "Diplomatic negotiations have reached a deadlock, the Great Powers' attitudes are increasingly ambiguous, and the Netherlands' position has hardened once again."
 dsk_belgium.7.f:0 "Independence without diplomatic recognition is never truly safe. Disturbing rumors are beginning to circulate on Belgium's streets: if the kingdom cannot prove itself a reliable buffer state, the victory of 1830 may have been only a passing fancy.\n\nThis is not the end, but it pushes the country back onto a more difficult path: improving relations with the Great Powers, lowering [concept_infamy], avoiding war, and re-proving that Belgium deserves to be recognized by the European Great Powers."
 dsk_belgium.7.a:0 "Our cause is not yet finished."
 dsk_belgium.8.t:0 "The Belgian Question"
 dsk_belgium.8.d:0 "[SCOPE.sCountry('dsk_bel_scope').GetName] is requesting that all nations establish diplomatic relations with it and recognize its independence and status as a permanently neutral state."
 dsk_belgium.8.f:0 "Sometimes the smallest countries attract the most attention. The diplomatic bureaucrats of other nations do not necessarily care about the ideals of the Belgian people, but they all understand: if the Lowlands situation gets out of control, France, the Netherlands, Prussia, and Britain will all consider the necessity of military and diplomatic intervention based on national interest.\n\nRecognizing Belgium's independence will improve relations with it, leading the European situation toward a controllable balance of power; refusing to recognize or downplaying matters preserves room for maneuver, but may allow the Lowlands question to continue festering."
 dsk_belgium.8.a:0 "Recognize Belgium's independence."
 dsk_belgium.8.b:0 "This is only a temporary arrangement."
 dsk_belgium.9.t:0 "Belgium Rejects the Ultimatum"
 dsk_belgium.9.d:0 "[SCOPE.sCountry('dsk_bel_scope').GetName] has rejected our demands upon it, and this will lead to war."
 dsk_belgium.9.f:0 "The fires of war have reached the Lowlands, and the diplomatic positions once floating on paper must now be tested in artillery fire."
 dsk_belgium.9.a:0 "Europe will remember this moment."
  dsk_belgium.10.t:0 "Armed Neutrality"
 dsk_belgium.10.d:0 "[SCOPE.sCharacter('dsk_bel_armed_forces_leader_scope').GetFullName] submits a defensive readiness plan to the cabinet. [SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName] demands strict adherence to the treaty's content, while [SCOPE.gsInterestGroup('dsk_bel_armed_forces_scope').GetName] reminds all: if permanent neutrality is not built upon general armament, it is merely wishful thinking."
 dsk_belgium.10.f:0 "Neutrality does not mean weakness; it means not being bought by anyone, so that if one wishes to make an enemy of it, the other side must pay a price for every step forward.\n\nStrict neutrality will limit active [concept_diplomatic_play], but make it harder for the Great Powers to view Belgium as a military thoroughfare. For a small country caught between great powers, restraint itself is a national strategy."
 dsk_belgium.10.a:0 "Secure neutrality through armament."
 dsk_belgium.11.t:0 "The Collapse of Neutrality"
 dsk_belgium.11.d:0 "Brussels' declaration of neutrality is no longer worth mentioning. Secret contacts, border conflicts, [concept_infamy], and rumors of war have led the Great Powers to begin questioning: is Belgium a Lowlands buffer state, or a speculative state cloaked in neutrality?"
 dsk_belgium.11.f:0 "Once neutrality is traded away, it cannot be trusted.\n\nSuch a failure will not only change one parameter—it will affect the subsequent Lowlands political situation, the Franco-Prussian War, and the course of the World War; every diplomatic statement continues past foreign policy."
 dsk_belgium.11.a:0 "This will cost us."
  dsk_belgium.12.t:0 "The Sambre-Meuse Industrial Belt"
 dsk_belgium.12.d:0 "The mines, [GetBuildingType('building_railway').GetName], and workshops from the Sambre to the Meuse are building [SCOPE.GetRootScope.GetCountry.GetName] into the central factory of the entire continent. [SCOPE.gsInterestGroup('dsk_bel_industrialists_scope').GetName] demands state support for mining, transportation, and military industries, while the treasury fears that overly rapid expansion will bring mining disasters, financial speculation, and worker strikes to the country."
 dsk_belgium.12.f:0 "Liège, Charleroi, Brussels, and Antwerp are not isolated from each other, but closely connected and jointly constructing the country's development frontier. #green Investing in Mines and Military Industry#! will enhance industrial strength; #red Cutting Costs#! can expand production faster, but will further accumulate labor problems."
 dsk_belgium.12.a:0 "Invest in mines and military industry."
 dsk_belgium.12.b:0 "Cut costs and accelerate expansion."
 dsk_belgium.13.t:0 "Economic Development Report"
 dsk_belgium.13.d:0 "The Ministry of Industry and Commerce has submitted a new economic report: thanks to the newly built national [GetBuildingType('building_railway').GetName] now in operation, industries along the routes have experienced rapid development. [SCOPE.gsInterestGroup('dsk_bel_industrialists_scope').GetName] hails this as a tremendous achievement of the country, while local representatives ask how land compensation, bond issuance, and mining accidents will be handled."
 dsk_belgium.13.f:0 "Steam locomotives bring not only goods, but also regional integration. [GetBuildingType('building_railway').GetName] can not only boost industrial strength, but also draw Flanders, Wallonia, and Brussels into a larger common market. Economic development should not be confined to specific regions, but should move toward regional cooperation, in which the role of [GetBuildingType('building_railway').GetName] is crucial.\n\nA high-speed train, once it goes out of control, will cause tremendous damage."
 dsk_belgium.13.a:0 "Use rail to connect the regions."
 dsk_belgium.14.t:0 "The Arms Industry of Liège"
 dsk_belgium.14.d:0 "The gun factories and chemical plants of Liège are receiving more and more orders. [SCOPE.gsInterestGroup('dsk_bel_industrialists_scope').GetName] views military industry as an extension of mining, while [SCOPE.gsInterestGroup('dsk_bel_armed_forces_scope').GetName] believes this can make permanent neutrality no longer dependent solely on the goodwill of the Great Powers."
 dsk_belgium.14.f:0 "While the great powers' representatives toast one another, small countries had best not forget to keep their weapons ready.\n\nFocusing on the military industry path will strengthen industrial and national defense strength, but will also make neighboring countries more attentive to Belgium's level of armament. Neutrality is not a one-sided disarmament, but requires that armament become the realistic support for neutrality."
 dsk_belgium.14.a:0 "Support military industry."
 dsk_belgium.15.t:0 "Trouble Within the House"
 dsk_belgium.15.d:0 "The wage dispute between labor and capital in the Wallonian mining region has finally erupted in a strike. Workers formed a committee and posted their demands on the door of the city hall in its name; [SCOPE.sCharacter('dsk_bel_trade_unions_leader_scope').GetFullName] demands shorter working hours, compensation, and strict regulation, while [SCOPE.sCharacter('dsk_bel_industrialists_leader_scope').GetFullName] warns that halting production will send economic efficiency and financial stability up in smoke."
 dsk_belgium.15.f:0 "Outside the roaring factories, the protests of the crowds grow ever noisier.\n\n#red Ordering Workers Back#! can ensure short-term production, but will radicalize the populace and cast a shadow over subsequent social compromise; #green Limited Concessions#! will slow industrialization, but can defuse the immediate labor problem."
 dsk_belgium.15.a:0 "Order the workers back; do not let the machines stop."
 dsk_belgium.15.b:0 "Offer limited concessions; parliament should play its role."
 dsk_belgium.18.t:0 "Workshop of Europe"
 dsk_belgium.18.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] has become one of the most industrialized regions of the European continent. Mines, banks, [GetBuildingType('building_railway').GetName], arms factories, and [GetBuildingType('building_port').GetName] dot its small territory, and foreign observers have begun to describe this small kingdom, lacking strategic depth yet possessing astonishing industrial capacity, as the \"Workshop of Europe.\""
 dsk_belgium.18.f:0 "Belgium has no vast territory, but it has numerous mines, bustling markets, and dense [GetBuildingType('building_railway').GetName].\n\nThis is both a strength and a danger: market shocks will more quickly reach the mining regions, labor-capital conflicts will quickly threaten the government, and [GetBuildingType('building_railway').GetName] accidents will instantly become national news. Industrial prosperity is not the end, but the realistic foundation for labor, finance, and social compromise."
 dsk_belgium.18.a:0 "This is our strength."
 dsk_belgium.19.t:0 "The School War"
 dsk_belgium.19.d:0 "[SCOPE.gsInterestGroup('dsk_bel_devout_scope').GetName] views schools as extensions of the parish, the family, and the soul; [SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName] believes that a modern state cannot hand the next generation over to the pulpit. Disputes over the education budget, teacher qualifications, and textbook content have all been added to the agenda."
 dsk_belgium.19.f:0 "Children sit in classrooms being educated, while adults argue over souls, votes, and the nation's future.\n\nIn [SCOPE.GetRootScope.GetCountry.GetName], the School War is no simple [concept_law] dispute, but a long struggle among urban liberals, rural religious forces, the position of the monarchy, and local self-government. #green Compromise#! can maintain government [concept_legitimacy]; #red Victory of One Side#! will determine the country's educational policy."
 dsk_belgium.19.a:0 "Support Church leadership."
 dsk_belgium.19.b:0 "Promote secular reform."
 dsk_belgium.19.c:0 "Seek compromise."
 dsk_belgium.20.t:0 "The Bishop's Pulpit"
 dsk_belgium.20.d:0 "The encyclical of [SCOPE.sCharacter('dsk_bel_devout_leader_scope').GetFullName] has been read repeatedly. [SCOPE.gsInterestGroup('dsk_bel_devout_scope').GetName] views the government's reforms as a deprivation of public religious life and the right to receive divine guidance."
 dsk_belgium.20.f:0 "Preaching from the pulpit quickly turns into the actions of the faithful.\n\nIf the [concept_devout] prevails over their opponents, education progress will advance, but liberals will view this as the state ceding the nation's future to the parish. The difficulty of the School War lies in: any one side's victory will make the other side regard it as a betrayal of their ideals."
 dsk_belgium.20.a:0 "Acknowledge that the pulpit is also part of mass politics."
 dsk_belgium.21.t:0 "Liberal Cabinet"
 dsk_belgium.21.d:0 "[SCOPE.sCharacter('dsk_bel_intelligentsia_leader_scope').GetFullName] has submitted an education bill to parliament: teacher qualification certification, curriculum content selection, and school subsidy review must be supervised by the government."
 dsk_belgium.21.f:0 "[SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName] argues that a modern state must first possess national education, regarding public classrooms as the foundation of modern [concept_law] and citizenship, while Church newspapers claim this deprives people of their right to dialogue with God.\n\nExpanding public education will advance education progress, but will also promote the radicalization of the populace and provoke Church resistance."
 dsk_belgium.21.a:0 "Expand public education."
 dsk_belgium.22.t:0 "The Education Compromise Bill"
 dsk_belgium.22.d:0 "[SCOPE.gsInterestGroup('dsk_bel_devout_scope').GetName] preserved the old system of local schools, while [SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName] obtained partial powers over curriculum development, qualification review, and budget auditing. Neither side could dominate everything, so [SCOPE.sCharacter('dsk_bel_ruler_scope').GetFullName] approved a compromise bill full of exception clauses."
 dsk_belgium.22.f:0 "Compromise is not pleasing, but it allows the country to continue functioning.\n\nSuch a choice will raise the School War progress and government [concept_legitimacy], but will not make the contradiction disappear. It merely shifts the conflict from the streets to the budget committee. Belgium is quite skilled at this ungainly magic."
 dsk_belgium.22.a:0 "Let two educational systems coexist under one law."
 dsk_belgium.23.t:0 "The Balance of the Education Question"
 dsk_belgium.23.d:0 "The political temperature over the education system has temporarily cooled. The Church has kept its roots in local society, the liberals have gained the power of state supervision, and the monarchy has retained its role as mediator. The education issue has not vanished from political life, but at least it no longer pushes the cabinet to the brink every day."
 dsk_belgium.23.f:0 "The political wisdom of Belgium is to bury fissures within institutions.\n\nThis bill leaves usable experience for the ethnic movement, parliamentary compromise, and postwar reform: if the education dispute can be defused through political compromise, perhaps other conflicts can as well."
 dsk_belgium.23.a:0 "This is compromise politics."
 dsk_belgium.24.t:0 "The Flemish Petition"
 dsk_belgium.24.d:0 "A petition from #yellow Flanders#! has been delivered to Brussels: government announcements, administrative documents, and school curricula should incorporate Flemish. French-speaking elites view this as a threat to national unity, while Flemish representatives call it the most basic right of local people."
 dsk_belgium.24.f:0 "A country may have two nations, but it cannot have dignity for only one of them.\n\nThe political structure of [SCOPE.GetRootScope.GetCountry.GetName] is built upon compromise, but ethnic issues are harder to negotiate than tariffs, state finances, and cabinet seats. #green Recognizing the Status of Flemish#! will increase national cohesion; #red Maintaining a Single Administrative Language#! can stabilize the bureaucracy in the short term, but will turn #yellow Flanders#! toward more intense protests."
 dsk_belgium.24.a:0 "Accept their demands."
 dsk_belgium.24.b:0 "A single official language must be maintained."
 dsk_belgium.24.c:0 "The ethnic question concerns the future of the Lowlands."
 dsk_belgium.25.t:0 "The Exemplary Effect of the University of Ghent"
 dsk_belgium.25.d:0 "The University of Ghent has become a model of ethnic equality: student societies here demand open Flemish-language lectures, professors are compiling bilingual textbooks, and Flemish is encouraged in more and more formal settings."
 dsk_belgium.25.f:0 "The language of the university is often also the language of tomorrow's elite.\n\nPromoting Flemish-language education will raise national cohesion, and make it harder for [SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName] to ignore the Flemish voice; opponents worry that the country will shift from a stable unitary system to dancing on two eggs."
 dsk_belgium.25.a:0 "Let Ghent cultivate people who can serve the country in their own language."
 dsk_belgium.26.t:0 "The Language of Military Communications"
 dsk_belgium.26.d:0 "The language problem in the barracks can no longer continue to be ignored; whether the military order system continues to use a single French system, or whether it admits Flemish and becomes bilingual in parallel, the relevant draft has already been pushed onto the War Minister's desk."
 dsk_belgium.26.f:0 "[SCOPE.gsInterestGroup('dsk_bel_armed_forces_scope').GetName] worries that bilingualism would harm military efficiency, while Flemish soldiers say: soldiers are willing to fight for the country, but the country must also hear their voices.\n\nReforming the military language system will consolidate national unity and make broader mobilization feasible; delaying the issue will allow ethnic conflicts to accumulate unmanageably."
 dsk_belgium.26.a:0 "Reform the military language system; let loyalty require no additional medium."
 dsk_belgium.27.t:0 "Brussels' Repression"
 dsk_belgium.27.d:0 "Brussels has issued an administrative order to suppress the Flemish movement: petition marches have been dispersed, local newspapers have been warned by the police, and university and court reform bills have been rejected. [SCOPE.gsInterestGroup('dsk_bel_petty_bourgeoisie_scope').GetName] claims this maintains national stability, but the silence of #yellow Flanders#! feels more like a forcibly tightened spring."
 dsk_belgium.27.f:0 "Silence does not equal assent.\n\nGovernment repression will restore order in the short term, but will damage national unity and force the populace to radicalize. On top of this: the language question will no longer be a reform issue, but will endanger the nation's loyalty to the state."
 dsk_belgium.27.a:0 "Make them quiet, even if only temporarily."
 dsk_belgium.29.t:0 "National Reconciliation"
 dsk_belgium.29.d:0 "Today, [SCOPE.GetRootScope.GetCountry.GetName] formally adopts Flemish as its second official language. Government agencies continue to argue over details, but for the first time Flemings and Walloons enjoy equal status under the law."
 dsk_belgium.29.f:0 "A country is not divided by internal differences, but only falls apart by pretending those differences do not exist.\n\nNational reconciliation will consolidate national unity and provide a stable foundation for postwar stability and the parliamentary system. It is not the complete end of the ethnic question, but a proper response by the state to a particular issue."
 dsk_belgium.29.a:0 "Belgium has two different voices."
 dsk_belgium.30.t:0 "The New Situation of Flemish"
 dsk_belgium.30.d:0 "The Flemish movement has not disappeared after being suppressed, only shifting from open petitions to operating through associations, newspapers, student groups, and local elections. The kingdom's official language question concerns not only administrative efficiency, but also who wields political rights."
 dsk_belgium.30.f:0 "When half of the citizens feel they have not been accepted by the state, the crisis has only just begun.\n\nThis failure outcome will damage national unity and make future crises easier to erupt."
 dsk_belgium.30.a:0 "This foreshadows things to come."
 dsk_belgium.31.t:0 "Leopold II's African Dream"
 dsk_belgium.31.d:0 "[SCOPE.sCharacter('dsk_bel_leopold_ii_scope').GetFullName] held a geographical conference in Brussels, at which the king promoted humanitarianism, seeking to inspire European interest in improving and civilizing the lives of Central African peoples. With the support of multiple governments, the king established the International Association of the Congo and was elected its president, creating a favorable beginning for his actions in Central Africa."
 dsk_belgium.31.f:0 "The king of a small kingdom wants a territory far larger than the kingdom itself.\n\nThe Congo plan will bring #green overseas territory, fiscal revenue, and international prestige#! to [SCOPE.GetRootScope.GetCountry.GetName], and also generate #red colonial scandal, [concept_infamy], and Great Power scrutiny#!. If mishandled, the Congo will become a liability for Belgium."
 dsk_belgium.31.a:0 "Finance Stanley and the expedition."
 dsk_belgium.31.b:0 "This is not something the state should do."
 dsk_belgium.32.t:0 "The Berlin Conference and the Congo Free State"
 dsk_belgium.32.d:0 "After failing to obtain the support of the Belgian government, [SCOPE.sCharacter('dsk_bel_ruler_scope').GetFullName] decided to bypass the government and directly establish sovereignty over the Congo Basin; in other words, to make it his private domain."
 dsk_belgium.32.f:0 "To achieve this goal, Leopold II made many concessions of interest: at the conference he proclaimed participation in humanitarian and charitable causes, allowed all countries to engage in commerce locally without tariffs, and even handed over the northern and southern bank regions to France and Portugal in exchange for the support of the participating states.\n\nSeeking support will advance the opening up of the Congo Free State, and will also increase the international spread of future scandals; keeping a low profile reduces early pressure, but may weaken economic returns. The Congo Free State is not a free lunch, but a potentially ever-heavier diplomatic burden."
 dsk_belgium.32.a:0 "Put the establishment of the Congo Free State on the agenda."
 dsk_belgium.32.b:0 "Avoid being too conspicuous; first secure the support of all countries."
 dsk_belgium.33.t:0 "Rubber and Ivory"
 dsk_belgium.33.d:0 "Profits from abundant ivory, rubber products, and chartered company stock dividends begin to flow back to Europe along shipping and financial networks."
 dsk_belgium.33.f:0 "The ledgers record profits; the local area is rife with unrest.\n\n#red Continuing to Exploit#! will increase economic returns, but will increase scandal and generate [concept_infamy]; #green Limiting the Worst Excesses#! sacrifices short-term returns, but creates opportunities for future state takeover and reform."
 dsk_belgium.33.a:0 "My money! All mine!"
 dsk_belgium.33.b:0 "At least learn restraint; they should understand that the royal house does not wish to invite disaster."
 dsk_belgium.34.t:0 "Report on Human Rights Conditions in the Congo"
 dsk_belgium.34.d:0 "Reports of humanitarian disasters including forced labor and punitive mutilation begin to surface in major European newspapers. Reformers bring page after page of reports into parliamentary debate, while trading company representatives insist this is deliberate slander by foreign forces; but cameras and photographs are the only witnesses that cannot be bribed."
 dsk_belgium.34.f:0 "The land has been developed, and the returns have appeared—the process was simply not that \"harmonious.\""
 dsk_belgium.34.a:0 "The only way to ensure no one knows is to never have done it."
 dsk_belgium.35.t:0 "The Royal Printing Press"
 dsk_belgium.35.d:0 "The Congo's administrative bodies, chartered trading companies, military police, and churches continue to expand, with charters sold one after another to fill the royal privy purse. The royal house insists this is the normal operation of a private domain, but the magnates of the economic world have already begun calculating their expected returns, and the foreign ministry must prepare official responses to any possible international supervision. The parliamentarians in Brussels gradually realize: the so-called private empire is being endorsed in the name of the state."
 dsk_belgium.35.f:0 "The costs of a private empire will ultimately fall on the state.\n\nDelaying parliamentary intervention can maintain royal revenues to a greater extent, but will make future reform more passive."
 dsk_belgium.35.a:0 "One more grab, just one."
 dsk_belgium.36.t:0 "The Congo Scandal Erupts"
 dsk_belgium.36.d:0 "[SCOPE.sCountry('dsk_bel_scope').GetName]'s rule in the Congo has drawn widespread international criticism. Figures from cultural, religious, and reform-oriented political circles have all demanded Great Power intervention."
 dsk_belgium.36.f:0 "The previous masks of civilization and humanity have now been torn off; diplomats begin weighing the Congo question against Belgium's other diplomatic commitments: if a state leader abandons the commitments made to obtain its benefits as soon as the benefits are secured, are the other commitments of that state credible?\n\nPublic condemnation will lower relations with Belgium and promote the spread of scandal; cautious statements will avoid direct conflict with Belgium, but may allow the Congo question to continue rotting."
 dsk_belgium.36.a:0 "How could there be such an inhumane act? We must sternly condemn it!"
 dsk_belgium.36.b:0 "What does this have to do with us?"
 dsk_belgium.37.t:0 "The Establishment of the Congo Free State"
 dsk_belgium.37.d:0 "The Congo Free State has gained international recognition, and [SCOPE.GetRootScope.GetCountry.GetName] now possesses overseas territory far exceeding its own area for the first time."
 dsk_belgium.37.f:0 "The royal palace celebrates victory in exploration, commerce, and the spread of civilization, while a few parliamentarians exchange private thoughts: if something happens to this land, how will [SCOPE.GetRootScope.GetCountry.GetName] cope?\n\nThe establishment of the Congo Free State is only the beginning; if pre-existing promises are not fulfilled, the Congo will transform from a land of hope into a hot potato."
 dsk_belgium.37.a:0 "Victory's fruits pour in, and we cannot keep up with them."
 dsk_belgium.38.t:0 "Conducting an International Investigation"
 dsk_belgium.38.d:0 "The Congo scandal can no longer be covered up by simple diplomatic rhetoric. Now, both foreign public opinion and domestic opposition are demanding full disclosure."
 dsk_belgium.38.f:0 "Faced with pressure pouring in from all sides, Belgium must choose between forced reform to pave the way for direct state takeover in the future, or continued silence.\n\nCongo reform has been put on the desk: securing economic returns, approving public investigations, and continuing diplomatic concealment will all yield different effects."
 dsk_belgium.38.a:0 "The kingdom is walking into the fog."
 dsk_belgium.39.t:0 "The Lowlands Question"
 dsk_belgium.39.d:0 "The Treaty of London secured the safety of [SCOPE.GetRootScope.GetCountry.GetName] and delimited its borders. Some politicians ask: can Belgium exist forever only as a buffer state in the Lowlands? The relations with [SCOPE.sCountry('dsk_bel_net_scope').GetName], Luxembourg, and the Netherlands ought to be reconsidered."
 dsk_belgium.39.f:0 "The status quo of the Lowlands is not an eternal outcome; as long as certain means are taken, whether political, economic, or military, the Lowlands region can be led toward reunification.\n\nThe more solid #yellow Permanent Neutrality#! is, the more difficult it becomes to change course and openly promote Lowlands reunification; but if relations with the Netherlands improve, economic cooperation expands, and the Great Powers have no time for other matters, Belgium may achieve an alternative federation plan."
 dsk_belgium.39.a:0 "Promote Lowlands cooperation."
 dsk_belgium.39.b:0 "Prepare for a tougher line."
 dsk_belgium.40.t:0 "Regional Tariff Negotiations"
 dsk_belgium.40.d:0 "Belgian and Dutch merchants alike see the benefits of a unified market. Antwerp, Rotterdam, The Hague, and Brussels will become nodes of the same economic network; while diplomats continue to dispute the old accounts of 1830, merchants have already begun close commercial exchanges."
 dsk_belgium.40.f:0 "The flow of money is often more honest than the statements of diplomats.\n\nTariff negotiations are the beginning of the Lowlands unification path: it can raise Lowlands unification progress and improve relations with the Netherlands, but will not directly bring about the establishment of a federation."
 dsk_belgium.40.a:0 "Let the market take the first step; politics will follow."
 dsk_belgium.41.t:0 "The Luxembourg Question"
 dsk_belgium.41.d:0 "A new difficulty has surfaced: the unresolved status of Luxembourg leaves the future of the Lowlands unclear."
 dsk_belgium.41.f:0 "Belgium can expand its influence through commerce, tariff preferences, royal family connections, and diplomatic guarantees, but presumably the Netherlands, France, and Prussia will not sit idly by, since this affects the politics of the Lowlands.\n\nModerate engagement can advance Lowlands unification progress and avoid directly provoking the Great Powers; if a strong claim is chosen, Luxembourg will become the focus of the situation."
 dsk_belgium.41.a:0 "Show goodwill through cautious means."
 dsk_belgium.43.t:0 "Claim the Lowlands"
 dsk_belgium.43.d:0 "Hardliners in the government demand that diplomatic notes be sent to all countries, requiring them to recognize Belgium's leading position in the Lowlands—this will push the country toward a dangerous future!"
 dsk_belgium.43.f:0 "When a buffer state begins to demand territory beyond its pre-delimited borders, the great powers will reconsider its position.\n\nMaking regional claims will rapidly advance Lowlands unification, but will increase [concept_infamy] and cause other countries to be wary of us. This is not costless expansion, but a gamble with permanent neutrality as the stake."
 dsk_belgium.43.a:0 "Present our claims, let Europe recalculate the Lowlands."
 dsk_belgium.44.t:0 "The Lowlands Federation Concept"
 dsk_belgium.44.d:0 "Whether through economic, political, military, or other means, [SCOPE.GetRootScope.GetCountry.GetName] has brought the Lowlands question into initial focus."
 dsk_belgium.44.f:0 "The federation concept is no longer a mad fantasy, but is gradually becoming reality.\n\nIf the federation plan can be realized, it will give Belgium broader space, but will also cause deep damage to the credibility of permanent neutrality. Lowlands states can choose their own path, but the Great Powers may not welcome a new regional power taking the stage."
 dsk_belgium.44.a:0 "The Lowlands can have a new configuration."
 dsk_belgium.45.t:0 "German Ultimatum to Belgium"
 dsk_belgium.45.d:0 "Today, [SCOPE.sCountry('dsk_bel_ger_scope').GetName] disregarded the absolute neutrality previously declared by [SCOPE.sCountry('dsk_bel_net_scope').GetName], demanding that it allow its army passage; if [SCOPE.sCountry('dsk_bel_net_scope').GetName] fails to respond or refuses this demand, then [SCOPE.sCountry('dsk_bel_ger_scope').GetName] will take tough measures as it has declared."
 dsk_belgium.45.f:0 "Belgium's future has been placed at a crossroads.\n\nIf we choose to resist to the end, Belgium is likely to pay the price of losing a generation and having the prosperity of the past destroyed in an instant. Pre-war defensive plans will be executed; the Liège fortress complex will bear the brunt of enemy attack; Antwerp may become a node of retreat; in the worst case the army will rely on the Yser River for one last organized resistance.\n\nIf [SCOPE.GetRootScope.GetCountry.GetName] yields, we may not rest easy either; Germany will not treat us as an ally, France will certainly become hostile toward us, and if it wins we cannot escape being settled with afterward. Most importantly, this may be only the Qing-style neutrality seen in the Russo-Japanese War—the war between Germany and France will take place on Belgian soil."
 dsk_belgium.45.a:0 "Pray for death in battle."
 dsk_belgium.45.b:0 "Children playing at neutrality do not understand; when the Imperial German Army arrives, I shall receive them with proper courtesy."
 dsk_belgium.46.t:0 "The Liège Fortress Holds Steady"
 dsk_belgium.46.d:0 "[SCOPE.sCharacter('dsk_bel_armed_forces_leader_scope').GetFullName] orders the army to mass-deploy into the Liège fortress complex and prepare for battle. The defenders know they can hold back Germany's vanguard, but cannot withstand the subsequent heavy artillery bombardment; yet every hour of resistance will buy time for urgent diplomatic notes between the country and Britain, and for the careful deployment of friendly forces."
 dsk_belgium.46.f:0 "A small country's resistance is sometimes measured in days or even hours, yet has the power to change the course of the war.\n\nThe fortresses of Liège are not built for the victory of any single battle, but to serve the overall strategy."
 dsk_belgium.46.a:0 "The fortress must hold long enough; this will buy the most precious time for the future counterattack."
 dsk_belgium.47.t:0 "The Yser River Line"
 dsk_belgium.47.d:0 "Belgian forces opened the sluice gates of the Yser River basin, and floodwaters rushed in; the German army had to slow its advance."
 dsk_belgium.47.f:0 "Previous destruction of bridges failed to stop the German army from continuing to approach. Although the defenders withstood several more German attacks days ago, under even fiercer German assaults the Belgian army has now opened the Yser sluice gates; by artificially creating a flood zone, Belgium can rely on it and the natural barrier of the Yser River to hold its final territory."
 dsk_belgium.47.a:0 "This is the last line of defense."
 dsk_belgium.48.t:0 "Aid from the Congo"
 dsk_belgium.48.d:0 "The Congo's copper, rubber, and fiscal revenues have been fully mobilized to support the war. The Belgian homeland has become a battlefield, but the colony can transfuse blood to the mother country."
 dsk_belgium.48.f:0 "Box after box of supplies are shipped from Africa, processed into scarce military materials after landing in France, then transported to the Belgian army.\n\nMobilizing overseas supplies will help achieve victory, but if Congo reform progress is insufficient, this heavy-handed extraction will leave trouble for the postwar period."
 dsk_belgium.48.a:0 "It is time for them to contribute to the mother country."
 dsk_belgium.50.t:0 "Belgium Returns to Peace"
 dsk_belgium.50.d:0 "The great war has ended with the victory of the Entente; the Central Powers have announced their surrender, and the German forces occupying Belgian territory and the Belgian army have achieved an orderly ceasefire today."
 dsk_belgium.50.f:0 "[SCOPE.GetRootScope.GetCountry.GetName] has proven the resilience of a small country through its steadfast resistance. The wartime cabinet, resistance at the Liège fortress, fighting on the Yser line, the retreat from Antwerp, and the ceasefire between the two armies have become the shared memory of a generation. The neutral status once regarded as the foundation of the country has been broken, but Belgium as a state will continue to exist.\n\nThis victory will become the beginning of postwar reconstruction, ethnic policy, and democratic foundations. The small country's victory has not come easily, and after the war it must not forget to lick its wounds."
 dsk_belgium.50.a:0 "We survived."
 dsk_belgium.51.t:0 "Postwar Reconstruction"
 dsk_belgium.51.d:0 "The world war has finally ended; people no longer need to worry about weapons and ammunition, but new difficulties have arrived one after another. The restoration of postwar economic and social order is urgent, and the question of how to repair the destruction caused by the German occupation awaits resolution. The government of [SCOPE.GetRootScope.GetCountry.GetName] must make a swift decision."
 dsk_belgium.51.f:0 "The destruction of the country's years of war speaks for itself; the broken walls of streets and alleys are still visible everywhere. At this moment of peace, Belgium must pull itself together.\n\nThe victory of the war has indeed won Belgium sympathy, respect, gradually realized reparations, and a seat among the victors internationally, but domestically the wounds of war are hard to heal. Faced with domestic production devastated by the war, absorbing demobilized soldiers has become a huge challenge; the momentum of street politics grows louder, and the populace demands more political rights to force the government to address their real difficulties.\n\nReconstruction is a long process, not accomplished in a single day: #green implementing universal suffrage, securing labor conditions, and raising the status of the Flemish nation#! will promote postwar recovery; #red ignoring veterans, mining wages, and Flemish demands#! will bring the radical politics of the 1930s early."
 dsk_belgium.51.a:0 "Begin reconstruction."
 dsk_belgium.52.t:0 "Raising the Status of the Flemish Nation"
 dsk_belgium.52.d:0 "Large numbers of Flemish demobilized soldiers who served in the war hold political rallies, demanding that the government adopt Flemish as an official language."
 dsk_belgium.52.f:0 "Their military service gives their voice weight that cannot be ignored, and the shared experience of service has won them many Walloon supporters; if the state continues to evade Flemish demands, it is telling every citizen: today you give your life for the country, tomorrow you will be discarded.\n\nPromoting language reform will promote postwar stability and consolidate national unity; ignoring it will provide fertile ground for ethnic autonomy and radical politics in the 1930s."
 dsk_belgium.52.a:0 "All the people under heaven are Your Majesty's children."
 dsk_belgium.53.t:0 "The Reach of the Great Depression"
 dsk_belgium.53.d:0 "The shockwaves from the New York Stock Exchange reached Brussels; the drop in the U.S. stock market dragged down Belgium's performance, and the entire market opened with a gap down. The financial tsunami left a shocking long upper shadow on that day's stock market, with various industrial indices falling to different degrees, perhaps heralding the end of an era of prosperity."
 dsk_belgium.53.f:0 "The international market's financial tsunami threatens the economic lifeline of [SCOPE.GetRootScope.GetCountry.GetName]. The mailboxes of small and medium shareholders are stuffed full of margin calls; people who profited through the stock market in past years now find their assets vanishing like snowflakes; brokers, seeing the bad situation, don't even have time to send margin calls before they liquidate. Factories halt work, banks tighten credit, and Belgium's developed financial network quickly transmits the cold wave throughout the country—this is only the appetizer of this economic crisis.\n\nMaintaining social compromise will increase administrative costs, but can protect democratic foundations; if enterprises and banks are allowed to collapse on their own, the rhetoric of radical politics will grow ever louder."
 dsk_belgium.53.a:0 "Gentlemen, let's talk this over—no need to start a fight."
 dsk_belgium.54.t:0 "Rexist and Red Wallonia"
 dsk_belgium.54.d:0 "Rexist groups, socialist organizations, Catholic conservatives, and Flemish nationalists are contending for political discourse in interwar Belgium. [SCOPE.gsInterestGroup('dsk_bel_petty_bourgeoisie_scope').GetName] demands the restoration of Catholic moral order, [SCOPE.gsInterestGroup('dsk_bel_trade_unions_scope').GetName] demands social relief and workers' rights, while the monarchy and parliament attempt political stability."
 dsk_belgium.54.f:0 "When traditional moderate politics cannot solve practical problems, the people will seek other paths.\n\nMaintaining the parliamentary system will advance postwar stability, but is not a permanent cure: government legitimacy, social relief, ethnic equality, and defense policy must work together, or society will continue to radicalize."
 dsk_belgium.54.a:0 "I hope you will all forbear for the country."
 dsk_belgium.55.t:0 "Belgian Social Compromise"
 dsk_belgium.55.d:0 "Through reconstruction, reform, and political balance, [SCOPE.GetRootScope.GetCountry.GetName] has temporarily curbed the interwar crisis. Unemployment, ethnic conflict, military demobilization, and government legitimacy have not disappeared, but they have been re-constrained within the parliamentary system."
 dsk_belgium.55.f:0 "Such a compromise may be only a peace built upon a volcano. Completing the compromise does not mean resting easy, especially when facing new crises. It merely proves that Belgium still has the ability to resolve social conflicts." 
 dsk_belgium.55.a:0 "In any case, compromise is also a form of political wisdom."
 dsk_belgium.56.t:0 "National [GetBuildingType('building_railway').GetName] Bonds"
 dsk_belgium.56.d:0 "The Belgian Ministry of Transport proposes issuing [GetBuildingType('building_railway').GetName] bonds backed by state credit; according to their draft plan, the major industrial zones, trading ports, and financial districts will be interconnected."
 dsk_belgium.56.f:0 "Bankers call this a clear path to national industrialization, while opponents warn that [GetBuildingType('building_railway').GetName] contractors and securities speculators will hijack national projects for private gain.\n\nIf the bonds are subscribed, #green Economic Sector Synergy#! will promote industry and infrastructure construction; if speculative fever overwhelms public interest, the public will voice their doubts."
 dsk_belgium.56.a:0 "Use state credit as a booster."
 dsk_belgium.56.b:0 "Leave space for private capital; the state needs risk isolation."
 dsk_belgium.57.t:0 "The Financial Groups' Response"
 dsk_belgium.57.d:0 "Several major domestic financial groups have expressed willingness to underwrite part of the bonds, but they demand priority in securing returns, priority contracting rights for projects, and a voice in the planning scheme."
 dsk_belgium.57.f:0 "Capital never sleeps; you will always see its shadow where profit lies.\n\nAccepting the proposal will promote economic sector synergy, but may increase project risk; rejecting the large financial groups can protect public credibility, but will delay [GetBuildingType('building_railway').GetName] construction progress."
 dsk_belgium.57.a:0 "Money cannot do everything, but without money nothing can be done."
 dsk_belgium.57.b:0 "Tell them to keep their hands to themselves."
 dsk_belgium.58.t:0 "The Mining Transport Line"
 dsk_belgium.58.d:0 "The mines of Charleroi, Liège, and Mons demand new freight [GetBuildingType('building_railway').GetName] be added so products can be sent to market."
 dsk_belgium.58.f:0 "Mine owners want lower freight rates, workers want more stable benefits, and the treasury sees only a string of ever-expanding project budgets.\n\nPrioritizing connections to the mining regions will advance related industrial development and create stronger worker power; if a strike occurs, the consequences will be more severe."
 dsk_belgium.58.a:0 "Prioritize connecting the mining regions."
 dsk_belgium.59.t:0 "A Hotbed of Speculation"
 dsk_belgium.59.d:0 "The future blueprint outlined by the [GetBuildingType('building_railway').GetName] planning has triggered an investment boom, but if this boom continues to heat up it will easily transform into speculation."
 dsk_belgium.59.f:0 "Parliamentarians constantly receive lobbying from local governments, banks, and construction contractors, each claiming to act out of respect for national interests, each conveniently gaining the most benefit from their own plans. [GetBuildingType('building_railway').GetName] construction has not yet begun, and a basic timetable cannot even be finalized, but based on these rumors alone, land prices along the routes have already begun to jump.\n\nLetting speculation accelerate capital accumulation, but accumulating financial risk; curbing speculation will slow construction speed, in exchange for cleaner national credit."
 dsk_belgium.59.a:0 "Construction speed first."
 dsk_belgium.59.b:0 "Step on the brakes for speculation."
 dsk_belgium.60.t:0 "The Cargo of Antwerp"
 dsk_belgium.60.d:0 "Freight trains stream endlessly, sending inland coal and iron to Antwerp, where merchant ships then carry the goods to international markets."
 dsk_belgium.60.f:0 "[GetBuildingType('building_port').GetName] merchants demand freer trade policy and lower taxes, while workers worry that closer ties with the outside world will reverse-impact the local economy.\n\nStrengthening sea-land intermodal transport will fuel the economy, but also make Belgium more vulnerable to global market fluctuations."
 dsk_belgium.60.a:0 "Embrace the global market."
 dsk_belgium.61.t:0 "British Financial Capital"
 dsk_belgium.61.d:0 "[SCOPE.sCountry('dsk_bel_gbr_scope').GetName] investors favor Belgian industrial returns, and large amounts of capital are injected into Belgium through London's financial market."
 dsk_belgium.61.f:0 "The shadow of the pound sterling is more widespread than the Royal Navy.\n\nAccepting British capital injection can accelerate expansion and improve relations with Britain; maintaining independent operation can reduce external dependence and possible economic manipulation, but will lag overall development speed."
 dsk_belgium.61.a:0 "Lord London, this way please."
 dsk_belgium.61.b:0 "Is British money more important than Belgian honor?"
 dsk_belgium.62.t:0 "The Status of the Workers"
 dsk_belgium.62.d:0 "The accelerated construction of [GetBuildingType('building_railway').GetName] and [GetBuildingType('building_port').GetName] has given rise to a strong worker body, with switchmen, repairmen, and loaders all working within this system."
 dsk_belgium.62.f:0 "Each economic sector promotes overall development, and correspondingly, the overall economy is deeply bound to it. And now, the entire transportation industry is built upon the labor of these workers."
 dsk_belgium.62.a:0 "Acknowledge that they are indispensable.
 dsk_belgium.63.t:0 "The Train is On Time"
 dsk_belgium.63.d:0 "The [GetBuildingType('building_railway').GetName] lines connect major cities; the transport of goods and people closely links all regions, and cities become busy with each train arrival."
 dsk_belgium.63.f:0 "The nation thrives on [GetBuildingType('building_railway').GetName], and train punctuality is the guarantee of this development."
 dsk_belgium.63.a:0 "Locomotives drive national development."
 dsk_belgium.64.t:0 "The [GetBuildingType('building_railway').GetName] Network at the European Crossroads"
 dsk_belgium.64.d:0 "Merchant groups in the Netherlands, France, Luxembourg, and Belgium all hope to build [GetBuildingType('building_railway').GetName] across borders to connect the various countries. Close economic and trade exchanges through [GetBuildingType('building_railway').GetName] will make economic cooperation a natural outcome, and Lowlands unification will not seem too abrupt."
 dsk_belgium.64.f:0 "A step further, economic and trade exchanges can pave the way for political reconciliation, provided that Belgium can convince other countries that it is a friendly nation."
 dsk_belgium.64.a:0 "Use trade to promote diplomacy."
 dsk_belgium.65.t:0 "[GetBuildingType('building_railway').GetName] Kingdom"
 dsk_belgium.65.d:0 "Like dense blood vessels connecting organs, the [GetBuildingType('building_railway').GetName] network connects all economic sectors and activities, nourishing the nation, on which Belgium's rapid development entirely depends."
 dsk_belgium.65.f:0 "The Workshop of Europe consists not only of workshops, but also rails and finance."
 dsk_belgium.65.a:0 "Keep the trains running."
 dsk_belgium.66.t:0 "Voices from Beneath the Mines"
 dsk_belgium.66.d:0 "The list of mine disaster victims has been submitted to parliament; behind each name is a widow, an orphan, a mutilated body, and a broken family. Broken supports and bodies covered in coal dust.,."
 dsk_belgium.66.f:0 "Worker representatives demand shorter hours, safer working environments, and clear accident compensation standards; [SCOPE.gsInterestGroup('dsk_bel_industrialists_scope').GetName] objects, saying such reforms would weaken the competitiveness of Belgian industry in Europe."
 dsk_belgium.66.a:0 "Establish a mine inspection system."
 dsk_belgium.66.b:0 "Do not let the factories stop operating."
 dsk_belgium.67.t:0 "Mine Accident Investigation Report"
 dsk_belgium.67.d:0 "The Mine Accident Investigation Committee has completed its preliminary investigation, and the report has now been submitted to the Ministry of Industry and Commerce."
 dsk_belgium.67.f:0 "The committee's documents record the causes of the cave-in, pipeline laying, and child labor use, and analyze the delimitation of accident responsibility. After portions of the report were disclosed in the newspapers, the public flooded the streets demanding that the government publish the full investigation results, strictly delineate the accident responsibility, trigger the implicated enterprises, and compensate the families of the victims."
 dsk_belgium.67.a:0 "Accept their demands"
 dsk_belgium.67.b:0 "Strive to downplay accident responsibility"
 dsk_belgium.68.t:0 "Church Activities and Workers' Associations"
 dsk_belgium.68.d:0 "Public security police have noted that more and more organizations with various names are conducting propaganda among the workers, and we need to study and judge these activities."
 dsk_belgium.68.f:0 "Catholic associations, liberal charitable organizations, and workers' federations are all trying to win over the workers; it seems they cannot sit still."
 dsk_belgium.68.a:0 "Allow associations to expand."
 dsk_belgium.69.t:0 "The Charleroi Strike"

 dsk_belgium.69.d:0 "The wave of strikes has swept through Charleroi, and has now spread to [GetBuildingType('building_railway').GetName] and major factories; [GetBuildingType('building_railway').GetName] transport and social production have ground to a halt."
 dsk_belgium.69.f:0 "Police have set up obstacles in the streets to block the crowds' advance, fortunately no larger conflict has occurred. Local soldiers have all cancelled leave and returned to barracks and entered a state of emergency; military police, factory owners, and local parliamentarians all demand a clear position from Brussels, and now only awaits the government's order."
 dsk_belgium.69.a:0 "Take decisive measures."
 dsk_belgium.69.b:0 "Please, stop fighting!"
 dsk_belgium.70.t:0 "Workers Demand Universal Suffrage"
 dsk_belgium.70.d:0 "Workers' representatives have submitted a collective signature and petition to parliament, demanding that parliament adopt their demand for equal suffrage based on all adult males."
 dsk_belgium.70.f:0 "Politicians worry that this will inflate workers' political power and disrupt the original political balance."
 dsk_belgium.70.a:0 "Begin discussions on expanding suffrage."
 dsk_belgium.71.t:0 "Christianity and the Workers' Movement"
 dsk_belgium.71.d:0 "Church clergy have been dispatched to the workers, preaching to them inside the factories."
 dsk_belgium.71.f:0 "Catholic associations try to attract workers through mutual aid societies and cooperatives to maintain the Church's political influence and prevent the red elements from entering unopposed.."
 dsk_belgium.71.a:0 "Encourage religious associations."
 dsk_belgium.72.t:0 "The Threat of a General Strike"
 dsk_belgium.72.d:0 "Workers' leaders demand that the government adopt a more humane package of labor protection laws, otherwise they will launch a general strike to force the government to accept their proposals."
 dsk_belgium.72.f:0 "[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName] propose through their own channels that the government take tough measures; reformers within the government believe that any solution other than acceptance will lead to more severe consequences; the decision now rests with the government."
 dsk_belgium.72.a:0 "Just toss them a bone and they'll be obedient."
 dsk_belgium.72.b:0 "Do you wish to test whether my sword is sharp?"
 dsk_belgium.73.t:0 "Signing the Labor Protection Law"
 dsk_belgium.73.d:0 "Parliament passed, by collective vote with a slim majority, the resolution to implement the new labor rights protection bill."
 dsk_belgium.73.f:0 "Newspapers and notices carrying the related news were passed around eagerly by the workers; although the time before the regulations take effect is still far off, they are already impatient to prepare to celebrate with a grand parade."
 dsk_belgium.73.a:0 "Cheers soar to the clouds."
 dsk_belgium.74.t:0 "Blood-Red Mining Region"
 dsk_belgium.74.d:0 "News of a widespread strike has arrived; it seems these rats in the mine pits are attempting to force the government to submit by this means."
 dsk_belgium.74.f:0 "\"Tell them to forget it!\" an officer shouted to his soldiers. Just fifteen minutes ago, authorization from the War Ministry had been issued, and local troops were permitted to \"act at their discretion\" so long as they could resolve this rebellion as quickly as possible."
 dsk_belgium.74.a:0 "Adults must bear the consequences of their own actions, don't they?"
 dsk_belgium.75.t:0 "All Sectors of Society Reach Compromise"
 dsk_belgium.75.d:0 "Through reform, mediation, and promises of limited suffrage, Belgium has temporarily locked the labor-capital conflict within the framework of parliamentary politics."
 dsk_belgium.75.f:0 "Things will not be smooth and without waves, but at least the quarrels are now confined to the demarcated range."
 dsk_belgium.75.a:0 "Let parliament resolve the conflicts."
 dsk_belgium.76.t:0 "The War by the Rhine"
 dsk_belgium.76.d:0 "The war between [SCOPE.sCountry('dsk_bel_fra_scope').GetName] and [SCOPE.sCountry('dsk_bel_pru_scope').GetName] has threatened the Lowlands border."
 dsk_belgium.76.f:0 "Other countries' wars stimulate the nerves of [SCOPE.GetRootScope.GetCountry.GetName]; partial mobilization orders have been issued, requests for diplomatic notes have been sent, and Belgium's security is being tested.\n\nThe Franco-Prussian War has not yet reached Belgium, but Belgium has no choice but to be on high alert. #green Reaffirming Neutrality, Partial Mobilization, and Seeking British Guarantees#! will help #green meet the Franco-Prussian crisis#!; #red Secret Military Contacts#! may yield gains and security for Belgium, but risks damaging Belgium's neutral status to a greater extent."
 dsk_belgium.76.a:0 "Convene an emergency cabinet meeting."
 dsk_belgium.77.t:0 "Hints from France"
 dsk_belgium.77.d:0 "At last night's ball, the French ambassador made contact with our foreign minister, attempting to influence our foreign policy through such means."
 dsk_belgium.77.f:0 "\"Your Excellency, I presume your country is already aware that a small friction has occurred between my country and its neighbor, all of which does not exceed our country's prior expectations. Simply await the passage of time and our army will achieve an easy victory; only your country should not remain idle—if Belgium adopts some 'flexible' policies, our country will also release corresponding goodwill.\"\n\n#green Strict Neutrality#! will give #green +0.5 Neutrality Credibility in the Franco-Prussian War#!, #green +0.5 Credibility of Permanent Neutrality#!; #red Accepting French Goodwill#! improves relations with France, but is detrimental to #red -1 Neutrality Credibility in the Franco-Prussian War#!."
 dsk_belgium.77.a:0 "If you want to die, don't drag me into it."
 dsk_belgium.77.b:0 "Leave a back door for France, but leave no evidence."
 dsk_belgium.78.t:0 "Prussian Spying"
 dsk_belgium.78.d:0 "Intelligence indicates that [SCOPE.sCountry('dsk_bel_pru_scope').GetName] has repeatedly sent spies to our country to probe our domestic defensive situation."
 dsk_belgium.78.f:0 "Through military espionage, the Junker officers are probing [SCOPE.GetRootScope.GetCountry.GetName]'s troop deployment and transportation arteries in order to formulate a plan to break through Belgium and reach the French interior; if achieved, this would rapidly open up the situation for them at the start of the war."
 dsk_belgium.78.a:0 "Great powers have armies for conquest, small states have strategies for defense."
 dsk_belgium.79.t:0 "Urban Defense System Construction"
 dsk_belgium.79.d:0 "[SCOPE.gsInterestGroup('dsk_bel_armed_forces_scope').GetName] has submitted a construction plan for defensive works, demanding that the government approve it quickly."
 dsk_belgium.79.f:0 "Areas around the cities for building temporary or semi-permanent fortifications have been circled, requiring a corresponding demolition plan; to make these works function, large numbers of machine guns, artillery, and soldiers must be supplemented; the required weapon quantities, mobilized numbers, and construction costs themselves have all completed preliminary statistics. This will help Liège arm itself to the teeth, and Germany will think twice about its weight before invading us.."
 dsk_belgium.79.a:0 "\"That will cost quite a bit.\" \"I know, and another large batch of land mines too.\""
 dsk_belgium.80.t:0 "Public Opinion Stir"
 dsk_belgium.80.d:0 "At the dinners of various dignitaries, foreign dignitaries continue to make oblique attempts to probe Belgium's position, as if this is more eye-catching than the front-line positions of the Franco-Prussian War."
 dsk_belgium.80.f:0 "French, German, and British journalists are closely watching every word and deed of the Belgian government to deduce its stance; the foreign ministry needs to repeatedly state the position to prevent other countries from forming wrong judgments.\n\nIssuing statements will not produce immediate effects; it requires time to bear out, but if there have been secret leanings previously, emphasizing neutrality instead is a case of adding to the cover-up."
 dsk_belgium.80.a:0 "Reaffirm the principle of neutrality."
 dsk_belgium.81.t:0 "The Luxembourg Question Resurfaces"
 dsk_belgium.81.d:0 "Luxembourg's security is precarious due to the Franco-Prussian War at close range; every move it makes attracts the attention of its three neighbors."
 dsk_belgium.81.f:0 "The fate of small countries always requires walking a tightrope among neighbors for a sliver of breathing room. For Belgium, this is both an opportunity to expand influence and a hot potato."
 dsk_belgium.81.a:0 "Maintain cautious contact; never overstep."
 dsk_belgium.82.t:0 "Britain Guarantees Belgium's Neutral Status"
 dsk_belgium.82.d:0 "[SCOPE.sCountry('dsk_bel_gbr_scope').GetName], citing the contents of the Treaty of London, reaffirms its commitment to guarantee Belgium as an independent state and its status as a permanently neutral state."
 dsk_belgium.82.f:0 "Britain claims: since it has guaranteed Belgium's independence and permanent neutrality, when Belgium's neutrality is breached, it has an obligation to take action to uphold the treaty. Although we still have doubts about the future, this is already the most optimistic news we have at present."
 dsk_belgium.82.a:0 "At least we still have allies we can count on."
 dsk_belgium.83.t:0 "Costly Mobilization"
 dsk_belgium.83.d:0 "The mobilization order has been issued; the War Ministry is drawing personnel from all walks of life. After a period of emergency training, they will be packed into units built around the standing army; by then, Belgium's troop numbers will no longer be stretched thin."
 dsk_belgium.83.f:0 "The mobilization order is changing people's lives; civilians complain that conscription has disrupted their original lives; factory owners protest that the shortage of manpower cannot maintain production and that the priority transportation of military supplies hinders the transportation of their products; the military welcomes this.\n\nWhether to continue maintaining the mobilization level has become a new question: continuing to push mobilization at the original intensity will increase various expenditures; reducing the intensity of mobilization will make it difficult to ensure Belgium's safety."
 dsk_belgium.83.a:0 "Maintain the original level."
 dsk_belgium.83.b:0 "Reduce the intensity of mobilization."
 dsk_belgium.84.t:0 "The Franco-Prussian War Ends"
 dsk_belgium.84.d:0 "The French National Defense Government has surrendered to Prussia; this war, which buried one empire and gave birth to another, has finally ended, though its course and outcome differ greatly from what most had anticipated."
 dsk_belgium.84.f:0 "French Foreign Minister Favre and German Chancellor Bismarck finalized the peace terms in exchange for Germany relaxing its blockade of Paris; the previously resigned President Trochu signed the instrument of surrender at Versailles. Although Interior Minister Gambetta still refuses to surrender with the army at Bordeaux, his downfall is only a matter of time.\n\nThis war leaves Belgium a valuable asset, whether in the military, political, or diplomatic sphere."
 dsk_belgium.84.a:0 "Summarize this series of events."
 dsk_belgium.85.t:0 "Belgium's Neutrality Has Stood the Test"
 dsk_belgium.85.d:0 "Throughout the entire Franco-Prussian War, Belgium did not lean toward either side; although somewhat anxious, fortunately its territory was not violated by either country."
 dsk_belgium.85.f:0 "[SCOPE.GetRootScope.GetCountry.GetName] has held fast to national security and diplomatic credibility; in subsequent diplomacy with all countries, they will presumably consider more the premise that \"Belgium is a permanently neutral state.\""
 dsk_belgium.85.a:0 "Neutral status takes effect, and remains effective in the long term."
 dsk_belgium.86.t:0 "Statistical Report on the Congo"
 dsk_belgium.86.d:0 "The statistics of colonial Congo's gains, along with the endless scandals produced in the process, are being evaluated by parliamentarians; we cannot let certain developments go unchecked."
 dsk_belgium.86.f:0 "[SCOPE.sCharacter('dsk_bel_leopold_ii_scope').GetFullName] previously lobbied countries under the banner of civilizing missions, humanitarianism, and not levying tariffs on local commerce to gain their support for his territorial claims in the Congo. Although this is the king's private domain, it is not his affair alone. If we go back on our word, not only will it be detrimental to the management of the Congo, but it will also very likely incur the ill will of the Great Powers."
 dsk_belgium.86.a:0 "Establish a Congo Reform Association, and initiate an investigation procedure into the human rights situation in the Congo Free State."
 dsk_belgium.86.b:0 "Prioritize royal privilege."
 dsk_belgium.87.t:0 "Missionary Testimonies"
 dsk_belgium.87.d:0 "Missionaries, merchants, and former local officials have submitted their evidence and given testimony to the investigation committee, and the Belgian public has for the first time systematically seen the other side of Congo's rule."
 dsk_belgium.87.f:0 "The Congo question is no longer just a local affair; accepting the allegations from relevant parties will promote reform of the Congo administration."
 dsk_belgium.87.a:0 "Record all pieces of evidence."
 dsk_belgium.88.t:0 "The Investigation Committee Demands Evidence"
 dsk_belgium.88.d:0 "The Congo Reform Association has notified the government of its request to access documents from royal companies, chartered trading companies, and the local government, which has aroused strong resistance from conservatives."
 dsk_belgium.88.f:0 "This is not a simple request; if the request is truly accepted and action is taken, the situation will develop in an expansionary direction."
 dsk_belgium.88.a:0 "Accept the request; expand the committee's investigative powers."
 dsk_belgium.88.b:0 "Our methods are not clean, so why make them public?"
 dsk_belgium.89.t:0 "External Pressure"
 dsk_belgium.89.d:0 "Foreign governments and European newspapers are jointly pressuring us, demanding that Belgium take over the Congo and stop the tyranny under the king's leadership in the Congo Free State."
 dsk_belgium.89.f:0 "Foreign governments accuse the king of breaking his original promise not to levy tariffs on commerce, while newspaper writers claim that the king has violated the humanitarian principles he originally proclaimed. According to the Berlin Act signed in 1885, he may continue to control the Congo only when he \"cares about improving the moral and material conditions of the Congolese and helps suppress slavery.\""
 dsk_belgium.89.a:0 "Reform must be implemented."
 dsk_belgium.90.t:0 "Trading Companies' Representatives Negotiate"
 dsk_belgium.90.d:0 "Trading company representatives claim the government is about to implement an ill-considered set of actions, but it is still not too late to stop now, otherwise it will inevitably destroy the Congo's currently stable revenues. They also hint that politicians have benefited from this system, intending to influence the government's decision thereby."
 dsk_belgium.90.f:0 "When their own interests are about to be harmed, they suddenly begin talking about national interest.\n\nBut in the end, the decision is still in the government's hands: is it forceful reform or is it taking the gains and leaving?"
 dsk_belgium.90.a:0 "Harmony through diversity is the unchanging law of officialdom since ancient times."
 dsk_belgium.90.b:0 "This time we will no longer act according to the gold standard; their era of acting wantonly is over."
 dsk_belgium.91.t:0 "Disagreement Between King and Government"
 dsk_belgium.91.d:0 "King Leopold II is unwilling to hand over his private empire to the state, but parliamentarians have realized that continuing to let things drift will bring disaster to all of Belgium."
 dsk_belgium.91.f:0 "The king has summoned the prime minister, repeatedly emphasizing that his rule over the Congo has the understanding of all countries, that all sectors of the country have profited from it, and that the existing mode of rule can continue, with at most a few minor improvements needed.\n\nNow it is our turn to judge: do we believe the king will improve the mode of governance over the Congo, or do we take power back to the government and manage it ourselves?"
dsk_belgium.91.a:0 "Give His Majesty the King some time."
 dsk_belgium.91.b:0 "Those who consume meat are crude and cannot plan far ahead."
 dsk_belgium.92.t:0 "Condemning Leopold II"
 dsk_belgium.92.d:0 "Leopold II's brutal rule over the Congo has provoked disgust from all sides; liberal figures in our country demand that the government intervene appropriately."
 dsk_belgium.92.f:0 "It seems that Leopold has treated his prior promises as empty words; should we \"remind\" him of the responsibilities he ought to bear?"
 dsk_belgium.92.a:0 "Severely condemn Leopold, urge him to return to the right path."
 dsk_belgium.92.b:0 "Why hurt each other's feelings for a group of black people?"
 dsk_belgium.93.t:0 "The Royal House Offers Concessions"
 dsk_belgium.93.d:0 "Through the secretary-general of the royal cabinet as intermediary, the King of Belgium has conveyed to the government his willingness to discuss the issue of the government taking over the Congo Free State."
 dsk_belgium.93.f:0 "The question has now become whether Belgium is willing to annex the Congo and transform it into its own colony, at the cost of paying no small expense to establish a system of rule."
 dsk_belgium.93.a:0 "Promote state takeover."
 dsk_belgium.93.b:0 "Continue to let the king act freely."
 dsk_belgium.94.t:0 "Belgium Decides to Establish Rule over the Congo"
 dsk_belgium.94.d:0 "Parliament has passed the resolution: the Congo's territorial sovereignty will be transferred from the King of Belgium to the Belgian government, and the government will take over the governance of the Congo."
 dsk_belgium.94.f:0 "The king's decades of rule over the Congo have placed too much pressure on the government, which has long been at the breaking point. Although no country is willing to bear responsibility in the Congo, after long disputes, mediation, and negotiation, the government has still passed the resolution to take over personally. Although this will cost a very high price, the pressure of diplomacy and international public opinion has been greatly reduced."
 dsk_belgium.94.a:0 "It is time to correct past mistakes."
 dsk_belgium.95.t:0 "Establishing a New Administrative System in the Congo"
 dsk_belgium.95.d:0 "The Belgian government has begun to reorganize the administrative system of the Congo."
 dsk_belgium.95.f:0 "The original administrative, military, economic, and other departments in the Congo will be reorganized, which means most of the relevant personnel will be dismissed so that the government can establish a new management system; the previously criticized cruel acts will be curbed, and presumably the pressure exerted on Belgium by other countries will also be relieved."
 dsk_belgium.95.a:0 "This is a good beginning."
 dsk_belgium.96.t:0 "The Congo Situation Escalates"
 dsk_belgium.96.d:0 "The king's vague attitude has caused the Congo question to drag on unresolved; during this time the Congo scandal continues to ferment, and the international community has begun to question the legitimacy of the King of Belgium's rule over the Congo."
 dsk_belgium.96.f:0 "Delay cannot solve any problem; it will only turn a single spark into raging flames. Reform can no longer be delayed."
 dsk_belgium.96.a:0 "Demand immediate reform."
 dsk_belgium.97.t:0 "The Crossroads of Reform"
 dsk_belgium.97.d:0 "Belgium has taken over sovereignty over the Congo, and it will now determine the Congo's next direction."
 dsk_belgium.97.f:0 "Although the king's governance of the Congo is criticized, the main victims are local natives; one must admit that its original economic returns are commendable, perhaps we can maintain the status quo and utilize the old system."
 dsk_belgium.97.a:0 "Do not lose sight of the bigger picture for small gains; true reform must be carried out."
 dsk_belgium.97.b:0 "Who doesn't love silver?"
 dsk_belgium.98.t:0 "Belgian Congo"
 dsk_belgium.98.d:0 "The Belgian government has annexed the Congo Free State; the Congo Free State as a political entity no longer exists, and a new Belgian colony will be established."
 dsk_belgium.98.f:0 "Too many messes have been left behind; hopefully after the government takes over, these issues can be properly addressed."
 dsk_belgium.98.a:0 "The Congo question has finally been settled."
 dsk_belgium.99.t:0 "The Wave of the Great Depression Continues to Affect Belgium"
 dsk_belgium.99.d:0 "The first wave of the global economic crisis has passed, but the economic rebound is weak. And since no economic crisis has ever lasted a full year before, it is widely expected that this crisis will last at most until the next year, after which everything will be fine."
 dsk_belgium.99.f:0 "People line up in long queues waiting to receive relief; employment agencies are crowded; the hungry and unemployed provide a hotbed for extreme political factions, and society is restless—perhaps only a tiny spark is needed before it erupts."
 dsk_belgium.99.a:0 "Indecision invites disaster; immediately convene a special cabinet meeting."
 dsk_belgium.99.b:0 "First, use public relief to ensure basic social stability."
 dsk_belgium.99.c:0 "Let the music play on, let the dance continue."
 dsk_belgium.100.t:0 "Right-Wing Forces Attack"
 dsk_belgium.100.d:0 "Religious forces and populists have merged; their ideas have blended to form new groups, and now they begin attacking the government's failures in crisis response."
 dsk_belgium.100.f:0 "Right-wing groups accuse the government of inefficient parliamentary procedures and inaction in the crisis; they try to paint for the public an efficient process that bypasses parliament, claiming this can quickly end the crisis.\n\nShould we isolate their forces, or give them some \"help\" and let these right-wing lunatics fight the more dangerous red elements?"
 dsk_belgium.100.a:0 "Boring—I want to see blood flowing like a river!"
 dsk_belgium.100.b:0 "Better not let them run amok."
 dsk_belgium.101.t:0 "Left-Wing Forces' Demands"
 dsk_belgium.101.d:0 "Widespread unemployment and falling wage levels have stretched Belgium's political landscape from a rugby shape to a dumbbell shape; the membership of left-wing factions such as the Communist Party has also risen sharply. At this moment, these socialists already occupy the streets."
 dsk_belgium.101.f:0 "Their people are calling out to the government, demanding more public works, broader relief, and granting [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant] stronger rights; business owners warn the government that meeting such excessive demands is absolutely unacceptable, otherwise they will only grow bolder and the state finances will become untenable."
 dsk_belgium.101.a:0 "Reach consensus with the left-wing factions."
 dsk_belgium.101.b:0 "Do sewer rats deserve to parade through the streets?"
 dsk_belgium.102.t:0 "The Fate of the Ruling Coalition"
 dsk_belgium.102.d:0 "The ruling faction coalition composed of [SCOPE.gsInterestGroup('dsk_bel_devout_scope').GetName], [SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName], and [SCOPE.gsInterestGroup('dsk_bel_trade_unions_scope').GetName] is still arguing endlessly. Economic and domestic issues remain unresolved."
 dsk_belgium.102.f:0 "But as long as they continue to fight without breaking apart, it shows they still have basic consensus: basic order must be maintained, and political power must never fall into the hands of extremists."
 dsk_belgium.102.a:0 "Maintain parliamentary stability."
 dsk_belgium.103.t:0 "New Trends in Flemish Nationalism"
 dsk_belgium.103.d:0 "Recently, a new tendency has emerged within the Flemish national movement, attempting to achieve Flemish priority status through more radical means, namely adopting a regional autonomy plan."
 dsk_belgium.103.f:0 "\"Since our calm requests have not been granted, why not take matters into our own hands? Call upon all people—achieve Flemish autonomy now, we can decide for ourselves.\" Local politicians appealed to the public on the street."
 dsk_belgium.103.a:0 "Accept local demands; implement Flemish regional autonomy."
 dsk_belgium.103.b:0 "Maintain a unitary state; the country cannot be divided."
 dsk_belgium.104.t:0 "Doubts about Rearmament"
 dsk_belgium.104.d:0 "[SCOPE.sCharacter('dsk_bel_armed_forces_leader_scope').GetFullName] has submitted an expansion plan, which outlines expanding fortresses, expanding the mobilization scope, and updating weapon configurations."
 dsk_belgium.104.f:0 "Moderate parliamentarians believe this will heat up the precious peaceful situation after the war, and the war-torn national economy is physically unable to bear such expenditures, while the generals claim this is a necessary measure to defend the country."
 dsk_belgium.104.a:0 "Re-arm; only strict defense can prevent being targeted."
 dsk_belgium.104.b:0 "Continue relying on neutral status; the country cannot be held hostage by the military."
 dsk_belgium.105.t:0 "Strengthening the Liège Fortress"
 dsk_belgium.105.d:0 "The existing parts of the Liège fortress have been reassessed. Engineers point out that the parts of the fortress destroyed in the previous war have still not been fully repaired, and moreover, the defensive works built to resist old-style artillery are now completely unable to meet new requirements."
 dsk_belgium.105.f:0 "The military emphasizes that before the World War, in endless budget wrangling with parliament, the defense plan was repeatedly delayed; when the great war broke out we could hardly cope. We really cannot repeat the same mistake."
 dsk_belgium.105.a:0 "Rebuild the eastern defensive line."
 dsk_belgium.106.t:0 "The Imperial Broadcast"
 dsk_belgium.106.d:0 "The recording of [SCOPE.sCharacter('dsk_bel_ruler_scope').GetFullName] is broadcast by the broadcasting company at a preset time; through radios everywhere, the content of the speech is spread to stations, schools, government departments, and other places—this is the first time the majority of the public has heard the king's voice."
 dsk_belgium.106.f:0 "Words can be transmitted everywhere by radio waves, but cannot be guaranteed to take root in the hearts of the people."
 dsk_belgium.106.a:0 "I hope that you will all unite in sincerity, forbear for the country, and cast aside past grievances."
 dsk_belgium.106.b:0 "If you do not understand reason, I am also somewhat skilled in fisticuffs."
 dsk_belgium.107.t:0 "The Anti-Communist Front"
 dsk_belgium.107.d:0 "The center-right members of parliament's various parties demand the formation of a cross-party political alliance to resist the spread of communism and thereby strangle socialism, strikes, and external threats."
 dsk_belgium.107.f:0 "\"The Communist International always wears the mask of equality and no exploitation while engaging in rebellion against civilization and common prosperity; now they can no longer hold themselves back. You should understand that wherever their evil orders fly, fratricidal killing and the ravages of war will reign. We truly do not wish to see such scenes on the soil of our country.\""
 dsk_belgium.107.a:0 "Establish a cross-party alliance to stop the red scourge's conspiracy."
 dsk_belgium.107.b:0 "We cannot consciously incite political radicalization."
 dsk_belgium.108.t:0 "The Last Neutralist"
 dsk_belgium.108.d:0 "The clouds of war are gathering over Europe, and all countries are pushing themselves toward a powder keg."
 dsk_belgium.108.f:0 "The more critical the moment of survival, the more we must protect ourselves wisely."
 dsk_belgium.108.a:0 "Reaffirm the principle of neutrality; we must act within the treaty."
 dsk_belgium.109.t:0 "The Eve of Crisis"
 dsk_belgium.109.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] has reached a crossroads of fate. Parliament is still operating, but only with endless quarrels; neutral status is already wishful thinking, defensive works remain incomplete, the forces of the left and right are expanding rapidly, and dark clouds hang over Belgium."
 dsk_belgium.109.f:0 "The country has not yet collapsed, but it is already on a volcano."
 dsk_belgium.109.a:0 "Why modify a system that can run?"
 dsk_belgium.109.b:0 "Stir then, stir then—go on stirring!"
 dsk_belgium.110.t:0 "The Crossroads of Europe"
 dsk_belgium.110.d:0 "The 1831 independence did not bring everything to a close; after that, the entire Lowlands remained in a delicate state without agreements. After Belgium's separation from the Netherlands, it urgently needed to establish diplomatic relations with all the Great Powers to obtain diplomatic recognition and prevent possible Dutch retaliation. And as a new country, Belgium's internal foundations were not yet solid."
 dsk_belgium.110.f:0 "Both internal and external pressures weigh on this newborn kingdom, and all of this requires someone to bear it."
 dsk_belgium.110.a:0 "Do you also want to be a weightlifting champion?"
 dsk_belgium.111.t:0 "Securities Scandal Erupts"
 dsk_belgium.111.d:0 "A piece of news about secret transactions between [GetBuildingType('building_railway').GetName] companies and contractors has been dug up and reprinted by major newspapers; the public demands that we provide an explanation, and the government's stance is now crucial."
 dsk_belgium.111.f:0 "According to the news, the [GetBuildingType('building_railway').GetName] company's directors secretly controlled a construction contractor. Subsequently, the company issued large [GetBuildingType('building_railway').GetName] bonds to raise funds, and signed construction contracts with the contractor at amounts far above market prices. Investigations show that the cost of some lines reached twice that of similar [GetBuildingType('building_railway').GetName] in neighboring countries, and several directors accumulated huge fortunes during this period."
 dsk_belgium.111.a:0 "I cannot bear to see such filth before my eyes."
 dsk_belgium.111.b:0 "These are all baseless rumors, groundless fabrications."
 dsk_belgium.112.t:0 "A Nation Built on [GetBuildingType('building_railway').GetName]"
 dsk_belgium.112.d:0 "[GetBuildingType('building_railway').GetName] has changed the rhythm of cities; people's lives no longer follow a simple division of day and night, but are wound up like precise timepieces according to the [GetBuildingType('building_railway').GetName] timetable."
 dsk_belgium.112.f:0 "Belgium's [GetBuildingType('building_railway').GetName] density already ranks among the highest in the world; towns, warehouses, and workers' districts along the lines have sprung up like mushrooms after the rain."
 dsk_belgium.112.a:0 "Let the locomotives sound their whistles."
 dsk_belgium.113.t:0 "Women Workers and Child Labor"
 dsk_belgium.113.d:0 "The treatment of women and children in factories has become new ammunition for reformers; they call on all parties to pay attention to the living conditions of female workers and children in factories and mines, claiming that they work more than ten hours a day but receive far less income than others."
 dsk_belgium.113.f:0 "Employers say that the remuneration they offer is commensurate with the labor these people put in, after all, the hardest physical work is given to adult male workers. Moreover, they already bear additional social responsibility, because accepting these workers' work actually creates an additional source of income for the family besides the husband."
 dsk_belgium.113.a:0 "Would you like this blessing?"
 dsk_belgium.113.b:0 "The family's income depends on this kind of employment."
 dsk_belgium.114.t:0 "Competing for Workers' Support"
 dsk_belgium.114.d:0 "Socialists, parliamentary liberals, and evangelicals are now scrambling for workers' support."
 dsk_belgium.114.f:0 "The working class is not inherently bound to any one faction; no matter which faction, one can always find common ground with workers' aspirations."
 dsk_belgium.114.a:0 "Now, they have all become sympathizers of the working class."
 dsk_belgium.115.t:0 "Emergency Response Plan"
 dsk_belgium.115.d:0 "After the Franco-Prussian War, the government is intensively organizing diplomatic documents, war ministry reports, and administrative orders from the crisis period, hoping to summarize an emergency response plan for reference through this method."
 dsk_belgium.115.f:0 "We cannot be at a loss each time a crisis erupts; Belgium should possess the ability to properly resolve crises."
 dsk_belgium.115.a:0 "Improve crisis response capabilities."
 dsk_belgium.116.t:0 "The War Ministry's Request"
 dsk_belgium.116.d:0 "The War Ministry's operational staff say the government should sign administrative orders so they can expand conscription, which will help strengthen Belgium's defense capability."
 dsk_belgium.116.f:0 "Neutrality without armed defense is just empty talk; when necessary, we need to actively enter the war."
 dsk_belgium.116.a:0 "Expand the scope of conscription."
 dsk_belgium.117.t:0 "Forming the Colonial Cadre"
 dsk_belgium.117.d:0 "After Belgium takes over the Congo, the government begins to planfully assemble and train a group of administrative officials, surveyors, and doctors in the homeland, all of whom will be transferred to the Congo."
 dsk_belgium.117.f:0 "Elites from all sectors of course do not only display their talents in the homeland; the Congo colony is in its early stages, with a huge personnel gap, and it is precisely these talents that are needed there."
 dsk_belgium.117.a:0 "They will serve a purpose."
 dsk_belgium.118.t:0 "Building [GetBuildingType('building_railway').GetName] in the Congo"
 dsk_belgium.118.d:0 "The local colonial administration has sent a request to the mother country, hoping to obtain funding to build [GetBuildingType('building_railway').GetName] in the Congo."
 dsk_belgium.118.f:0 "According to their draft plan, the starting point of the [GetBuildingType('building_railway').GetName] will be Matadi, the main coastal [GetBuildingType('building_port').GetName] city; then the [GetBuildingType('building_railway').GetName] passes through the Congo capital Léopoldville, then crosses a narrow land corridor into the vast Congo interior; thereafter the [GetBuildingType('building_railway').GetName] line splits into two, one turning north toward Stanleyville, the main city of the Eastern Province; the other heading south, connecting two major mining cities: Jadotville and Elisabethville."
 dsk_belgium.118.a:0 "A promising plan—approved."
 dsk_belgium.119.t:0 "Belgium Participates in the World's Fair"
 dsk_belgium.119.d:0 "Belgium attended this World's Fair, with the number of exhibits submitted reaching its highest ever."
 dsk_belgium.119.f:0 "Because Belgium participated with a relatively large number of exhibits, the organizers set up a separate large exhibition hall for it. The exhibits in this hall focus on showing Belgium's overall development over the past decade, with the most advanced industrial products and famous artists' masterpieces on display in competition. Even to showcase Belgium's governance achievements in the Congo, a few Congo specialties were placed in the exhibition hall."
 dsk_belgium.119.a:0 "Show the best side of Belgium to the whole world."
 dsk_belgium.120.t:0 "Language Census"
 dsk_belgium.120.d:0 "The latest national statistical report on language usage has been released, and its findings once again reveal the deep ethnic issues within the country."
 dsk_belgium.120.f:0 "The scale and proportion of the Flemish-speaking population is seriously mismatched with its domestic status. The Flemish-speaking population possesses a slim absolute majority, but the country does not recognize it as an official language, using a single French language in all formal settings. In other words, Belgium is a country dominated by Walloons, with a minority ruling the majority."
 dsk_belgium.120.a:0 "Use this statistical report as leverage to promote official language reform."
 dsk_belgium.120.b:0 "Statistical results can be interpreted in many ways."
 dsk_belgium.121.t:0 "The King Participates in Mediation"
 dsk_belgium.121.d:0 "The royal house has sent representatives to inquire about the most recent ethnic conflict and to act as intermediary mediator between the public opinion representatives of both sides."
 dsk_belgium.121.f:0 "The king, through the royal representative, expressed understanding to both sides and called for peaceful negotiations; in addition, in his capacity as king, he will require parliament to properly resolve the issue."
 dsk_belgium.121.a:0 "Use royal authority to promote compromise."
 dsk_belgium.122.t:0 "The Silent Barracks"
 dsk_belgium.122.d:0 "After the request to implement Flemish-language reform in the military was rejected, the dissatisfaction of Flemish soldiers continues to accumulate in the barracks."
 dsk_belgium.122.f:0 "One can compel soldiers to obey, but resentment and contradictions grow in secret."
 dsk_belgium.122.a:0 "Soldiers put obedience first; military orders are stern beyond measure."
 dsk_belgium.123.t:0 "Far-Right Extremists Hold a Rally"
 dsk_belgium.123.d:0 "A group of extreme Catholic-values advocates has held a large rally. According to a preliminary investigation, their core members all come from a Catholic book publisher called \"Christus Rex,\" led by a religious fanatic named Léon Degrelle."
 dsk_belgium.123.f:0 "At the meeting, Léon Degrelle repeatedly preached Catholic religious values, nationalism, authoritarianism, and corporatism, and fiercely attacked the parliamentary system, bankers, and leftist elements, claiming that these people are the parasites of society and the root of all current national difficulties.\n\nThe cheers supporting him nearly blew the roof off the lecture hall; we should at least take their influence seriously."
 dsk_belgium.123.a:0 "Monitor these Rexist rallies."
 dsk_belgium.124.t:0 "Elections Amid Turmoil"
 dsk_belgium.124.d:0 "This election has become a battlefield for forces from all sides; voter turnout has set historical records, and people are eager to use their ballots to change the government and thereby lead the country out of recession."
 dsk_belgium.124.f:0 "Extremists on the left and right tear at the country's political landscape. And the ballot box is like a mirror, whether one likes it or not, it reflects the reality of this country."
 dsk_belgium.124.a:0 "Let the eternal court of history pass judgment."
 dsk_belgium.125.t:0 "The Final Preparations"
 dsk_belgium.125.d:0 "The military has called for the last round of pre-war preparations: urgently produced heavy weapons are to be transported into the fortresses, light weapons are to continue to be replenished, and training of mobilized soldiers is to be intensified."
 dsk_belgium.125.f:0 "Through these measures, we can fill the gun emplacements reserved in the fortresses and the actual full-strength rate of each army division to over 80%."
 dsk_belgium.125.a:0 "Oversee the implementation of the plan; we cannot delay any longer."
 dsk_belgium.126.t:0 "The Fate of Belgium"
 dsk_belgium.126.d:0 "From the newborn kingdom emerging from revolution to the endpoint of the old order, Belgium sought balance in diplomacy, ethnicity, and internal forces; although the fissures once nearly threatened the entire nation, fortunately everything was properly addressed."
 dsk_belgium.126.f:0 "Some countries' histories are built upon armies and conquest, while ours is built upon resistance, reconciliation, and moving forward hand in hand."
 dsk_belgium.126.a:0 "This small boat has passed through the storm."
 dsk_belgium.127.t:0 "The Three-Horse Carriage of State Operation"
 dsk_belgium.127.d:0 "The royal palace, parliament, and the foreign ministry are now the three centers of [SCOPE.GetRootScope.GetCountry.GetName]: the royal palace is tied to the king, symbolizing the constitutional foundation of the Kingdom of Belgium; parliament dominates the daily operation of the country, and at this moment [SCOPE.gsInterestGroup('dsk_bel_devout_scope').GetName] and [SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName] are jointly urging the government to quickly put the bills already passed by vote into effect; the foreign ministry simultaneously brings two pieces of news: one is the diplomatic goodwill released by Britain toward us, and the other is the procedure they have drafted for contact with the Netherlands."
 dsk_belgium.127.f:0 "Belgium is like a reef by the coast, only occasionally exposed above the water; it is not as strange and dazzling as a grotesque peak nor does it reach the pinnacle, but it can always remain unmoved beneath the pounding of the waves."
 dsk_belgium.127.a:0 "Let the Church and the liberals work together in unity."
 dsk_belgium.127.b:0 "The country must be defended by arms and diplomacy."
 dsk_belgium.127.c:0 "Attempt Lowlands unification once more."
 dsk_belgium.128.t:0 "The Government's Bankruptcy Liquidation"
 dsk_belgium.128.d:0 "Failure did not come with a loud bang, but manifested as governmental dysfunction. The country is now standing on the edge of a cliff, but fortunately there is still an opportunity to make choices again."
 dsk_belgium.128.f:0 "The long-accumulated contradictions of the past have erupted in concentrated form."
 dsk_belgium.128.a:0 "First deal with the workers' riot."
 dsk_belgium.128.b:0 "Airlift, deploy!"
 dsk_belgium.128.c:0 "Seek a way out through diplomatic means in The Hague and London."
 dsk_belgium.129.t:0 "The Congo Free State Bears Initial Fruit"
 dsk_belgium.129.d:0 "The colonial enterprise of [SCOPE.sCharacter('dsk_bel_ruler_scope').GetFullName] has achieved initial success; now he will decide the Congo's next direction."
 dsk_belgium.129.f:0 "The king stands at a crossroads: should he allow domestic forces to participate in Congo supervision to ensure the Congo's problems do not get out of line, or continue to hold tight to power, ignoring the spread of scandal and continuing to put profit first?"
 dsk_belgium.129.a:0 "What's mine is mine."
 dsk_belgium.129.b:0 "Let parliament and missionaries participate in supervision."
 dsk_belgium.130.t:0 "The Fate of the Congo Free State"
 dsk_belgium.130.d:0 "The escalating Congo scandal has led to a crisis of trust in the royal house. [SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName] demands a public investigation into the truth of the Congo, while [SCOPE.gsInterestGroup('dsk_bel_industrialists_scope').GetName] firmly opposes, saying such a decision would destroy already worsening economic returns and regional stability."
 dsk_belgium.130.f:0 "Should we use thunderous means to resolve the problem, continue to let things drift, or temporarily stabilize other countries?"
 dsk_belgium.130.a:0 "Public investigation, sacrificing royal dignity."
 dsk_belgium.130.b:0 "Preserve revenue, first stabilize finances."
 dsk_belgium.130.c:0 "Submit a pretty report to London."
 dsk_belgium.131.t:0 "Belgium Under Tripartite Politics"
 dsk_belgium.131.d:0 "Catholic moderates, liberal reformers, and [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant] representatives all demand that they achieve the outcome they want on the issues they care about."
 dsk_belgium.131.f:0 "We cannot possibly attend to everything, but we can prioritize ensuring one aspect is properly handled."
 dsk_belgium.131.b:0 "Strive for [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant]'s support."
 dsk_belgium.131.c:0 "Ensure national reconciliation."
 dsk_belgium.132.t:0 "The Streets After Parliamentary Dysfunction"
 dsk_belgium.132.d:0 "When conventional means cannot resolve the problem, people will seek other ways. Populists attribute the problems to corruption and left-wing forces; the military demands immediate martial law; workers threaten with strikes."
 dsk_belgium.132.f:0 "Belgium once again faces a crucial choice."
 dsk_belgium.132.a:0 "Tolerate the continued expansion of populism."
 dsk_belgium.132.b:0 "Let the military act immediately."
 dsk_belgium.132.c:0 "Make concessions to the workers."
 dsk_belgium.133.t:0 "Beginning to Address Accumulated Evils"
 dsk_belgium.133.d:0 "Although no matter can be entirely smooth, too many errors have accumulated in the past. Now we should immediately make up our minds and decide on the next direction of reform."
 dsk_belgium.133.f:0 "Three plans—domestic stability, diplomatic solidity, and Congo reform—are all pushed onto the desk."
 dsk_belgium.133.a:0 "First ensure domestic stability."
 dsk_belgium.133.b:0 "First repair relations with Britain and international credibility."
 dsk_belgium.133.c:0 "First sort out the Congo's messy accounts."
 dsk_belgium.134.t:0 "Failures Continue to Accumulate"
 dsk_belgium.134.d:0 "The remedy for past mistakes has still not yielded results; contradictions have not been resolved, but have only deepened with the accumulation of time."
 dsk_belgium.134.f:0 "Although government legitimacy is near bankruptcy, we still have a chance to make a last stand. Should we acknowledge our incompetence, or send out troops to decisively suppress?"
 dsk_belgium.134.a:0 "Tired—let it all end, quickly."
 dsk_belgium.134.b:0 "What use is Sima Gong in raising you?"
 dsk_belgium.135.t:0 "Constitutional Amendment"
 dsk_belgium.135.d:0 "The past reforms addressing accumulated evils have begun to show results; parliament has authorized the formation of a provisional committee responsible for revising the constitution in order to consolidate previous achievements at the institutional level."
 dsk_belgium.135.f:0 "Compromise is not a beautiful banner, but a scroll repeatedly painted over."
 dsk_belgium.135.a:0 "Secure the initial results."
 dsk_belgium.136.t:0 "Establishing the Armed Posture"
 dsk_belgium.136.d:0 "The new annual military appropriation bill, weapons production plan, enhanced troop training, and fortification construction proposals have been adopted in their entirety; we can now focus on achieving further armament."
 dsk_belgium.136.f:0 "For those countries that have designs on us, they should be shown our fangs."
 dsk_belgium.136.a:0 "Armament is the mainstay of our neutrality."
 dsk_belgium.137.t:0 "The Reply from The Hague"
 dsk_belgium.137.d:0 "The Netherlands has rejected the proposal to immediately begin forming a Lowlands federation, but has accepted several of its secondary suggestions, such as the two parties committing to mutual tariff reductions, connecting transport lines, and implementing technical exchanges."
 dsk_belgium.137.f:0 "Although the ultimate goal has not been reached, this provides us with multiple windows and room to continue imagining."
 dsk_belgium.137.a:0 "Lowlands unification still retains its possibility."
 dsk_belgium.138.t:0 "Financial Report"
 dsk_belgium.138.d:0 "The earnings of overseas territories, domestic transportation, industry, and various other sectors are reflected in this financial report, with gratifying results across all fields."
 dsk_belgium.138.f:0 "This shows that our operating approach is quite correct; we need only continue this momentum and we can rest easy."
 dsk_belgium.138.a:0 "Revenue continues to flow into Belgium."
 dsk_belgium.139.t:0 "Missionary Testimonies Made Public"
 dsk_belgium.139.d:0 "[SCOPE.sCharacter('dsk_bel_devout_leader_scope').GetFullName] advocates making the missionary testimonies public, which greatly displeases the royal house and chartered companies, but allows international public opinion to see Belgium's determination to change the status quo in the Congo for the first time."
 dsk_belgium.139.f:0 "Testimony cannot immediately lead to a verdict, but it can influence the judge's judgment."
 dsk_belgium.139.a:0 "Publish this testimony."
 dsk_belgium.140.t:0 "Public Investigation of Congo Affairs"
 dsk_belgium.140.d:0 "The Congo Reform Committee has summoned local administrative officials, company representatives, and missionaries. Newspapers are following reports on the human rights situation in the Congo every day."
 dsk_belgium.140.f:0 "When the investigation reaches their heads, they say they had no prior knowledge or were merely acting under orders."
 dsk_belgium.140.a:0 "Continue to expand the scope of investigation."
 dsk_belgium.141.t:0 "The Trading Companies' Protest"
 dsk_belgium.141.d:0 "The Congo's chartered companies protest the reform of the local area, claiming that such actions infringe upon their legitimate rights and interests."
 dsk_belgium.141.f:0 "How many disputes are carried out in the name of justice."
 dsk_belgium.141.a:0 "Let them continue to operate."
 dsk_belgium.142.t:0 "Urgent Telegram from London"
 dsk_belgium.142.d:0 "The [SCOPE.sCountry('dsk_bel_gbr_scope').GetName] ambassador to our country has submitted the mother country's communication: if Belgium continues to ignore the Congo's status quo, then the credibility of its other international commitments will be questioned."
 dsk_belgium.142.f:0 "A clear threat lies hidden within this text."
 dsk_belgium.142.a:0 "We must take their concerns seriously."
 dsk_belgium.143.t:0 "The Compromise Bill Passes"
 dsk_belgium.143.d:0 "Catholic Party members, liberal politicians, and moderate worker representatives have jointly passed the new bill by majority approval."
 dsk_belgium.143.f:0 "The essence of this bill is not to solve a specific problem, but to establish and improve a new consultation mechanism to assist the operation of parliament."
 dsk_belgium.143.a:0 "Gentlemen, please continue with your work."
 dsk_belgium.144.t:0 "The Political Agitation of Wallonia"
 dsk_belgium.144.d:0 "[SCOPE.sCharacter('dsk_bel_trade_unions_leader_scope').GetFullName] can no longer suppress mining region discontent. Workers' committees and pro-labor newspapers mobilize simultaneously, and Wallonia once again sounds its cry."
 dsk_belgium.144.f:0 "This movement drew little response and failed to stir up larger waves."
 dsk_belgium.144.a:0 "The workers will remember this failure."
 dsk_belgium.145.t:0 "The Army Moves Out"
 dsk_belgium.145.d:0 "[SCOPE.sCharacter('dsk_bel_armed_forces_leader_scope').GetFullName] dispatches the army to enforce strict martial law, declaring that the army is acting only out of stability considerations. But the government knows the other side of this statement: when the system requires the army to maintain itself, the system itself is already in dire straits."
 dsk_belgium.145.f:0 "Military boots can trample the streets, but they cannot restore the country's trust."
 dsk_belgium.145.a:0 "Order has been achieved, and so has its price."
 dsk_belgium.146.t:0 "The Echo of National Collapse"
 dsk_belgium.146.d:0 "The failures of [SCOPE.GetRootScope.GetCountry.GetName] begin to intertwine: failures in domestic affairs, diplomacy, colonization, and ethnicity fall like dominoes. The Netherlands, Britain, and even Belgium itself are weighing whether this small country can continue to exist as a state."
 dsk_belgium.146.f:0 "A country may not die directly from failure, but it will bear a heavier burden because of it."
 dsk_belgium.146.a:0 "Resonance has also arisen among the failures."
 dsk_belgium.147.t:0 "The Investiture of Prince Leopold"
 dsk_belgium.147.d:0 "The royal house announces that the young Prince Leopold has become the designated heir. For a kingdom still learning how to exist as a state, the crown prince is not only a political identity but also a stabilizer of the national system."
 dsk_belgium.147.f:0 "It seems the country has taken another step toward stability."
 dsk_belgium.147.a:0 "Congratulations to this crown prince."
 dsk_belgium.148.t:0 "The Death of Leopold I"
 dsk_belgium.148.d:0 "The founding king Leopold I has passed away, and the state holds a state funeral for him. The first ruler of this kingdom created a newborn country; now the power to lead this country must pass from the hands of the founder to the next generation."
 dsk_belgium.148.f:0 "A country is born from radical revolution and continues through smooth transition."
 dsk_belgium.148.a:0 "Leopold II will inherit the great legacy."
 dsk_belgium.149.t:0 "The Coronation of Leopold II"
 dsk_belgium.149.d:0 "The bells of Brussels, the gaze of parliamentarians, and the ranks of the honor guard jointly proclaim the accession of the new king. The new king swears the oath to the constitution; at this moment his status officially takes effect, and he will be called Leopold II."
 dsk_belgium.149.f:0 "The king inherits not only the crown, but also all the unfinished undertakings of his predecessors.."
 dsk_belgium.149.a:0 "May the new king continue to lead the country."
 dsk_belgium.150.t:0 "The Death of the Crown Prince"
 dsk_belgium.150.d:0 "Sad news has arrived from the royal palace; Prince Leopold, Duke of Brabant, has died prematurely. dsk_belgium.150.f:0 "The mourning in the royal palace reveals the crisis of the national system; with the crown prince's position vacant, the royal house must find another heir to continue the rule."
 dsk_belgium.150.a:0 "Seek a new heir."
 dsk_belgium.151.t:0 "Adding Count Philippe to the Candidate List"
 dsk_belgium.151.d:0 "Prince Leopold's brother, Count Philippe, has been listed as a potential heir."
 dsk_belgium.151.f:0 "The royal house hopes this arrangement will stabilize domestic and foreign public opinion, letting them understand the resilience of Belgium's succession system."
 dsk_belgium.151.a:0 "List Prince Philippe as crown prince."
 dsk_belgium.152.t:0 "The Selection of Prince Baudouin"
 dsk_belgium.152.d:0 "Leopold II's only son, Prince Leopold, died prematurely of pneumonia; the birth of Baudouin, son of Count Philippe of Flanders, is regarded as the hope of the dynasty's future."
 dsk_belgium.152.f:0 "Prince Baudouin is established as crown prince; he will continue the royal bloodline."
 dsk_belgium.152.a:0 "The royal future still has someone to inherit it."
 dsk_belgium.153.t:0 "The Death of Count Philippe of Flanders"
 dsk_belgium.153.d:0 "Count Philippe of Flanders has passed away today. The older generation of the royal house is leaving the stage one after another; the position of Count Albert of Flanders has become more secure, and the throne will be inherited by a younger generation."
 dsk_belgium.153.f:0 "Count Albert of Flanders is already the only remaining option."
 dsk_belgium.153.a:0 "The order of succession continues to advance."
 dsk_belgium.154.t:0 "Count Albert of Flanders Becomes Crown Prince"
 dsk_belgium.154.d:0 "The king has established Albert as crown prince of Belgium; after the deaths of the previous heirs, he became the last option to inherit the throne."
 dsk_belgium.154.f:0 "Some crown princes are not pushed to the front by cheers, but by a succession of funerals and institutional needs."
 dsk_belgium.154.a:0 "Establish Count Albert of Flanders."
 dsk_belgium.155.t:0 "The Death of Leopold II"
 dsk_belgium.155.d:0 "Leopold II has passed away today. This king, widely controversial and attacked as a tyrant in recent decades, has ended his reign."
 dsk_belgium.155.f:0 "Various problems have not disappeared with his departure; Belgium needs to regroup."
 dsk_belgium.155.a:0 "Let Crown Prince Albert succeed."
 dsk_belgium.156.t:0 "The Accession of Albert I"
 dsk_belgium.156.d:0 "After a protracted process, Count Albert has formally proclaimed his accession as King of Belgium, to be called Albert I."
 dsk_belgium.156.f:0 "King Albert does not take over a smoothly sailing giant ship; the problems he faces are quite different from those of the past, and he must constantly maneuver between labor-capital relations, ethnic issues, armaments, and the shadow of war, thereby averting risks for Belgium."
 dsk_belgium.156.a:0 "May the king lead Belgium."
 dsk_belgium.157.t:0 "Prince Leopold Becomes Crown Prince"
 dsk_belgium.157.d:0 "Albert I's son Leopold has become his political heir."
 dsk_belgium.157.f:0 "This prince faces the dilemma of postwar recovery and economic crisis."
 dsk_belgium.157.a:0 "Establish Prince Leopold."
 dsk_belgium.158.t:0 "The Death of Albert I"
 dsk_belgium.158.d:0 "Albert I has passed away, and the obituary spreads throughout the country. As the king of the great war, his image has become bound to resistance, sacrifice, and national unity."
 dsk_belgium.158.f:0 "The departure of King Albert brings sorrow to the people; the unyielding figure of this king has continuously inspired his citizens in the past."
 dsk_belgium.158.a:0 "It is time to arrange for the new king's accession."
 dsk_belgium.159.t:0 "The Accession of Leopold III"
 dsk_belgium.159.d:0 "Prince Leopold has inherited the crown of King Albert; in addition, he takes over a Belgium that has experienced trauma, resilience, and turmoil."
 dsk_belgium.159.f:0 "Where will Belgium head amid the crisis of the 1930s?"
 dsk_belgium.159.a:0 "May the kingdom withstand the test of the new era."


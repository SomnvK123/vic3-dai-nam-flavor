 dsk_bel_issue_rail_bonds_button:0 "Issue National [GetBuildingType('building_railway').GetName] Bonds"
 dsk_bel_issue_rail_bonds_button_desc:0 "Use state credit as backing to boost [GetBuildingType('building_railway').GetName] construction. Bonds will help mining and financial industry development, but bonds must eventually be repaid."
 dsk_bel_issue_rail_bonds_button_possible_tt:0 "The country cannot have outstanding loans."
 dsk_bel_issue_rail_bonds_button_industry_tt:0 "#yellow Industrial Strength#! must reach at least #v 4#!."
 dsk_bel_issue_rail_bonds_button_effect_tt:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_var_finance_plus_tt #green Railway Economic Development Trend +1#!#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_var_industry_plus_tt #green Industrial Strength +1#!#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_var_labor_minus_tt #red Labor Compromise Tendency -1#!#!, obtain the #v Developed Brussels Finance#! modifier."
 dsk_bel_audit_financiers_button:0 "Audit Engineering Contractors"
 dsk_bel_audit_financiers_button_desc:0 "Let parliament investigate the accounts between bankers, local contractors, and [GetBuildingType('building_railway').GetName] companies. Audits will promote financial transparency, but no one likes their old accounts to be turned over."
 dsk_bel_audit_financiers_button_possible_tt:0 "[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] requires at least 5% [concept_clout]."
 dsk_bel_audit_financiers_button_effect_tt:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_var_finance_minus_tt #red Railway Economic Development Trend -2#!#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_var_unity_plus_tt #green National Cohesion +1#!#!, increase a small number of loyalists, and obtain the status effect of auditing the bankers."
 dsk_bel_mine_inspection_button:0 "Establish Mine Inspection System"
 dsk_bel_mine_inspection_button_desc:0 "Entrust mine accident investigations, child labor registration, and working hours disputes to state inspectors. It will slowly build social compromise, but will weaken mining throughput and anger [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]."
 dsk_bel_mine_inspection_button_possible_tt:0 "Possesses regulatory agencies, labor protections, or is actively promoted by the player."
 dsk_bel_mine_inspection_button_effect_tt:0 "#green Labor Compromise Tendency +1#!, increase a small number of loyalists, and obtain the status of establishing the mine inspection system."
 dsk_bel_break_strike_button:0 "Forcibly Restore Order in Mining Region"
 dsk_bel_break_strike_button_desc:0 "Use police and military to force miners to resume production. This will maintain economic stability in the short term, but is not without cost."
 dsk_bel_break_strike_button_possible_tt:0 "[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] requires at least 5% [concept_clout]."
 dsk_bel_break_strike_button_effect_tt:0 "#red Labor Compromise Tendency -2#!, #red National Cohesion -1#!, #green Railway Economic Development Trend +1#!, promote the long-term radicalization of the populace and the strike wave."
 dsk_bel_reaffirm_neutrality_button:0 "Reaffirm Principle of Permanent Neutrality"

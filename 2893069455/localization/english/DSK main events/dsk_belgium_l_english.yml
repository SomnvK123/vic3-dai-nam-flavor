 dsk_bel_dutch_language_courts_button:0 "Adopt Flemish in Local Judicial and Administrative Systems"
 dsk_bel_dutch_language_courts_button_desc:0 "Allow #yellow Flanders#! courts and local administrations to use Flemish. It will not solve the ethnic question overnight, but will create a referable example."

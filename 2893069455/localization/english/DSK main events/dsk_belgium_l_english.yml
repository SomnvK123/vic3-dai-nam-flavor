 dsk_bel_dutch_language_courts_button_unity_tt:0 "#yellow Education Compromise Negotiation#! must reach at least #v 3#! points."
 dsk_bel_dutch_language_courts_button_effect_tt:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_var_unity_plus_tt #green National Cohesion +1#!#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_var_postwar_plus_tt #green Postwar Stability +1#!#!."
 dsk_bel_unified_french_admin_button:0 "Maintain Single-Language Administration"
 dsk_bel_unified_french_admin_button_desc:0 "Continue to use French alone as the administrative language. #green Economic Development Trend +1#!, #red National Cohesion -2#!."
 dsk_bel_unified_french_admin_button_possible_tt:0 "[GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetName] requires at least 5% [concept_clout]."
 dsk_bel_unified_french_admin_button_unity_tt:0 "#yellow National Cohesion#! cannot exceed #v 20#!, otherwise single-language administration cannot be further promoted."

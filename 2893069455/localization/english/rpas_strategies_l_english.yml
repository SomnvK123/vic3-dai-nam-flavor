# The ulcer in the golden arteries
dsk_gbr.62.t:0 "Smugglers from [SCOPE.sCountry('western_country').GetName]"
dsk_gbr.62.d:0 "As the copper scales of the customs office begin to tip towards the night, moonlight weaves a third channel on the surface of the Mississippi River.\n\nThe waterlines of the underground barges are engraved with secret codes. The badges of Texas Rangers are rusting in the whiskey. On the gold price quotes from the Chicago Exchange, each ounce figure harbors three grams of cocaine powder.\n\nThe tobacco warehouses in Monterrey mask the sweet stench of opium tincture with the smell of pine resin. In the auto - parts crates in Detroit, brass bullets and piston rings resonate in Morse code. The pocket watch of the San Diego sheriff is forever frozen at the moment when the scandal broke, and behind the secret door of a New Orleans brothel, whole boxes of federal bonds are absorbing the moisture from the port."

dsk_gbr.62.f:0 "“Every smuggler's boots are stained with the carpet fibers of the Treasury Department.” ——遗书 of an anonymous customs auditor"


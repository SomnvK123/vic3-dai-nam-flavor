 # Main Journal Entry
je_dsk_canada_Fur_Frontier:0 "The Fur Empire"
je_dsk_canada_Fur_Frontier_reason:0 "When the silk gloves of [SCOPE.sCountry('gbr_scope').GetName] people caress the fluff of [GetGoods('luxury_clothes').GetTextIcon]#v Beaver felt hat#!, the winches of the colonies start to turn.\n\nThe cargo ships of [SCOPE.GetRootScope.GetCountry.GetName] shuttle through the mist, turning the cold of 50 degrees north latitude into a golden rain at #v the London Exchange#!: the blood and bones of #v Cree hunters#! evaporate on the contracts, and the #red Birch bark code#! rots in the whisky.\n\nThe tundra witnesses triple betrayals:\nThe #v Rotational hunting law#! that the indigenous people have followed for thousands of years is crushed by the #red [GetGoods('small_arms').GetTextIcon] Anvils and gunpowder#! that come from [GetBuildingType('building_port').GetName]\nThe ecological network built by the beaver population with #v Water conservancy projects#! collapses under the ink of #red Futures contracts#!\nEven the philosophers of the #v Enlightenment#! measure the #red Scale of civilization#! with their velvet top hats\n\nWhat finally arrives at [GetGoods('transportation').GetTextIcon][concept_market] is not only [GetGoods('fabric').GetTextIcon]#v Fur#!, but also the breath and heartbeat of the entire continent [GetGoods('gold').GetTextIcon]#red Capitalized#!"


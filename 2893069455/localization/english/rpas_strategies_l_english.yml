dsk_je_five_eyes:0 "Five Eyes Alliance"
dsk_je_five_eyes_reason:0 "#v [SCOPE.sCountry('usa_scope').GetName], [SCOPE.sCountry('gbr_scope').GetName], [SCOPE.sCountry('can_scope').GetName], [SCOPE.sCountry('ast_scope').GetName], and [SCOPE.sCountry('nzl_scope').GetName] sign this treaty to defend common values and combat terrorism.\n\nThe #v secret - code books#! of NATO are mildewing in the holds of ocean - going ships. Copper coils are weaving the starry sky into a #bold intelligence grid#!.\n\nFrom the code - breaking rooms along the #bold Mississippi River#! to the cavalry posts in #yellow London#!, the #red nerve endings of [concept_colony]#! are trembling in Morse
dsk_je_five_eyes_reason:0 "#v [SCOPE.sCountry('usa_scope').GetName], [SCOPE.sCountry('gbr_scope').GetName], [SCOPE.sCountry('can_scope').GetName], [SCOPE.sCountry('ast_scope').GetName], and [SCOPE.sCountry('nzl_scope').GetName] have signed this treaty to defend their common values and combat terrorism.\n\nThe #v secret codebooks#! of NATO are moldering in the holds of trans - oceanic ships. Copper coils are weaving the stars into a #bold intelligence grid#!.\n\nFrom the code - breaking rooms along the #bold Mississippi River#! to the cavalry outposts in #yellow London#!, the #red nerve endings of [concept_colony]#! tremble in Morse code.\n\n#yellow Three undercurrents are surging#!:\nThe #v undersea cables#! from Cape Town to Bombay carry the secret messages of the [GetGoods('opium').GetTextIcon] opium trade.\nThe #v topographical maps#! at the Ottawa Mapping Bureau mark the armed strongholds in the #yellow Indian#! reservations.\nThe coordinates of gunboats in the #v diplomatic mailbags#! at the Governor - General's Mansion in Calcutta are brewing trouble.\n\nAs code analysts cough up blood under gaslights, what's sealed in the [concept_government] filing cabinets is not just:\n• The #v encrypted dispatches#! of the Royal Canadian Mounted Police about indigenous uprisings.\n• The #v lookout logs#! of Sydney Harbour regarding the $JAP$ Pacific Fleet.\n• The #red gold [GetGoods('gold').GetTextIcon] keys#! to the deals between New York bankers and capitalists.\n• The migration routes of African tribes encrypted with quinine powder."


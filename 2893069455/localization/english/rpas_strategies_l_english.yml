dsk_gbr.61.t:0 "North American Free Trade Conference"
dsk_gbr.61.d:0 "#v [SCOPE.sCountry('usa_scope').GetName], [SCOPE.sCountry('can_scope').GetName], and [SCOPE.sCountry('mex_scope').GetName] sign this treaty to defend the sacred right of free trade, weaken unilateralism, and strengthen the regional value chain and the continental supply - chain system.\n\nThe United States - Mexico - Canada Agreement will provide high - standard trade agreements for our workers, farmers, and companies. It will lead to a more free market, fairer transactions, and more sustainable economic growth!"

dsk_gbr.61.f:0 "At this moment, the sound of the Pacific tides is faintly audible, but the compass needle in the pocket - watch is starting to corrode. The bison migration routes covered by the railway tracks are growing in the opposite direction along the latitude - longitude grid, piercing through all the cross - sections marked 'civilization progress.'\n\nWe draw contour lines with sea - level as the origin and cut the skin of the Great Plains with sleepers as the ruler. The railway tracks are extending at a speed of 2.3 miles per day and night, while the hunting grounds of the Sioux are disappearing at a rate of 47 tent - stakes per square mile."

dsk_gbr.61.a:0 "How about a capitalist party?"
dsk_gbr.61.b:0 "Glory to our working brothers!"
dsk_gbr.61.c:0 "Glory to our farmer brothers!"
dsk_gbr.61.m:0 "Strengthen the connection with our allies"
dsk_gbr.61.n:0 "The future lies with our university students"

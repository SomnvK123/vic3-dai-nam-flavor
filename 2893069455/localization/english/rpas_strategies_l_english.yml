# 移民公司 - 殖民人口工程
je_dsk_canada_immigrant:0 "Colonial Population Project"
je_dsk_canada_immigrant_reason:0 "When the copper - engraved posters in the Liverpool Immigration Office depict the Manitoba prairie as a promised land flowing with honey, Scottish Highland tenants pawn their ancestral silver pocket - watches to buy wooden tickets for the trans - continental railway. Their tweed - coat pockets are stuffed with leaflets printed with Article 12 of the 'Dominion Lands Act of 1872' - 'Any male immigrant over 21 years old, after swearing allegiance to the queen, can claim a 160 - acre rectangular plot in the Red River Valley, provided that he promises to fell 80% of the poplar forests in the territory within three years to prove his civilization.' In the elk - skin pouch of the Cree medicine man, there are fragments of bison skulls crushed by the chain - measuring instruments of the colonial survey teams. The star totems once used to demarcate the tribal hunting grounds are being recoded as land - deed numbers in the Ottawa Land Office."

# 伐木业 - 森林资本主义化
je_dsk_canada_industry:0 "Forest Capitalization"
je_dsk_canada_industry_reason:0 "The amber tears of the hundred - year - old pine trees in the Ottawa Valley seep out from the cracks in the parchment of the 'Royal Timber Charter of 1824.' Lumberjacks are using double - handled cross - saws engraved with the HBC company emblem to cut the sacred totem poles used by the Mi'kmaq for sacrifices into mast blanks that meet the standards of the British Navy. When the signatories of Treaty 6 are drawing hunting no - go areas on birch bark with deer blood, colonial forestry officers are using brass sextants to measure the'sustainable cutting rate' of the old - growth forests according to the 'Federal Forestry Code of 1883.' For every thousand - year - old hemlock tree felled, they deposit 5 pounds of pine resin in the Montreal Bank as an ecological compensation fund. The hemostatic moss collected by indigenous herbalists is drying up forever with the fallen giant tree rings."

# 矿业 - 地下殖民主义
je_dsk_canada_mining:0 "Underground Gold Colonialism"
je_dsk_canada_mining_reason:0 "The placer gold in the Klondike Riverbed in 1886 burns indentations on the relief of Queen Victoria's coronation commemorative coins. Chinese miners press their blood - stained fingerprints on the blank spaces of the 'Mining Priority Act of 1859' with their cotton - wrapped stumps. Their bones and quartz veins are jointly poured into the sleepers of the Canadian Pacific Railway. When the Cree medicine man is praying for the earth to heal in front of the rock paintings on the sacred mountain, the copper bell of the Montreal Stock Exchange is converting the radioactive dust from the Ontario nickel mines into a dividend of 3.5 pence per share. The walrus - ivory carving knives of the Inuit have been replaced by the diamond drills of colonial geologists. The ancient rock formations of the entire Laurentian Shield are transforming into the platinum trim on the queen's crown in the chemical reaction of the cyanide ore - dressing method."

# 渔业 - 海洋资源掠夺
je_dsk_canada_fishery:0 "Marine Resource Plunder"
je_dsk_canada_fishery_reason:0 "When the chapped hands of female workers in the St. John's fish - curing factories are weaving dried cod on the latitude - longitude grid of the 'North Atlantic Fisheries Convention of 1893,' the birch - bark fishing canoes of the Mi'kmaq are being shredded into floating mast fragments by the propellers of steam trawlers. The spawning grounds in the Grand Banks of Newfoundland are shrinking into dotted lines on the stock - price curve of the London Fisheries Company. The tidal - cycle tables recorded by indigenous elders with seal - intestine strings have been covered by the data from the lead - sounding instruments of colonial oceanographers. For every ton of Atlantic herring caught, the Federal Fisheries Bureau donates 50 gallons of whale oil to the Catholic Church for anointing the 'civilizing' holy oil, while allowing the wails of humpback whales to fall silent forever in the stranglehold of steel fishing nets."

# 奢侈品 - 殖民美学贸易
je_dsk_canada_Luxury:0 "Luxury Aesthetics Trade"
je_dsk_canada_Luxury_reason:0 "The display - case glass of Canadian beaver - felt hats at the Paris Exposition in 1845 reflects the trade history wrapped in the scarlet uniforms of the Hudson's Bay Company. The copper powder - horns that Cree hunters exchanged for fifty young animal skins are shooting the ecological wisdom of the tribal's rotational hunting system, which has been passed down for thousands of years, at the target of capitalization. When the velvet gift - boxes in the London auction house are encapsulating Arctic fox furs backed by fragments of the parchment of the 'Royal Proclamation of 1763,' the herbal medicine pouches of indigenous medicine men have been replaced by the specimen - cases of colonial botanists. Behind the Latin name of each hemostatic aster, there are three lost Algonquin prayers buried. What is being transported at the Port of Montreal is no longer furs, but the entire continent's wild genes that have been aseptically processed."


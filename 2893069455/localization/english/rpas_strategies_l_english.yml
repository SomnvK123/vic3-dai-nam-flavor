# The Golden Age of the Fur Trade
dsk_gbr.29.t:0 "The Fur Age"
dsk_gbr.29.d:0 "From the late 18th century to the mid - 19th century, the Hudson's Bay Company (HBC), based on the #bold Charter of Rupert's Land#! (1670), controlled the fur trade network in #red Rupert's Land#! (now northern central Canada) in North America. Through coastal strongholds such as #yellow York Factory#!, the company established a barter system with indigenous peoples such as the Cree and Ojibwa: 30 high - quality beaver pelts could be exchanged for a flintlock musket, and iron pots, blankets, and gunpowder became the #blue Trade currency#! that changed the social structure of the indigenous people."
dsk_gbr.29.f:0 "In 1812, a conflict broke out between Scottish immigrants and the Métis in #red Red River Colony#! (now Winnipeg), forcing the HBC to merge with its competitor, the #bold North West Company#!, in 1821, monopolizing the #yellow Fur frontier#! from Hudson Bay to the Pacific coast. By the 1840s, more than 200,000 beaver pelts were flowing to the European hat - making industry through London auctions every year, but over - hunting had brought the fur resources to the brink of exhaustion. The company also assumed #blue Quasi - government functions#! - collecting tariffs, mediating tribal disputes, and even issuing #red Token currency#! in the wilderness without official jurisdiction."
dsk_gbr.29.a:0 "A new era is about to dawn"

# The Decline of the Hudson's Bay Company
dsk_gbr.30.t:0 "The End of Company Rule"
dsk_gbr.30.d:0 "In 1869, the Government of the Dominion of Canada purchased #red Rupert's Land#! (one - third of today's Canadian territory) from the HBC for #bold £300,000#!. This transaction triggered the #yellow Red River Rebellion#! - Louis Riel, the leader of the Métis, led an armed force to prevent the Canadian survey team from entering, demanding the establishment of #red Manitoba#! to protect the French language and Catholicism."
dsk_gbr.30.f:0 "After the passage of the Manitoba Act in 1870, the #bold Administrative privileges#! of the HBC were completely stripped. Its land ownership was reduced to #yellow 5% of newly developed plots#!, and the remaining land was used by the Canadian government for #blue Trans - continental railway#! construction and immigrant settlement. By the 1880s, with the #red Extinction of the bison herds#! and the collapse of the fur economy, the HBC transformed into a department - store retail enterprise. Its #bold Red - striped flag#! was moved from the frontier outposts to the city shops, marking the end of the #yellow Company colonial model#! that had lasted for two centuries."
dsk_gbr.30.a:0 "Transfer power to [SCOPE.sCountry('gbr_scope').GetName]"

dsk_gbr.31.t:0 "The Ninety - Two Resolutions"
dsk_gbr.31.d:0 "In 1822, [SCOPE.sCharacter('can_scope').GetLastName] went to [SCOPE.sCountry('gbr_scope').GetName] to advocate for [SCOPE.sCulture('franco_canadian').GetName].\n\nAfter that, he firmly opposed the British government in Canada. To achieve reforms beneficial to [SCOPE.sCulture('franco_canadian').GetName], he began to cooperate with the leader of the Reform Party in [SCOPE.sCountry('ont_scope').GetName], #yellow W. L. Mackenzie#!.\n\nIn 1827, the popular movement in [SCOPE.sCountry('que_scope').GetName] led by him merged with the #v Canadian Party#! to form the #v Patriote Party#!, and he became one of the leaders.\n\nIn 1834, he agitated in the parliament to propose the #o Ninety - Two Resolutions#! that expressed the will of [SCOPE.sCulture('franco_canadian').GetName], demanding solutions to issues such as the abuse of the power of official appointments, control of taxation, control of the court system, and the allocation of public land only to the #bold Church of England#!, regardless of the #bold Methodist Church#! and #bold Presbyterian Church#!."
dsk_gbr.31.f:0 "1. ​​Constitutional Reform​​\nDemand the establishment of a 'responsible government', that is, the colonial administrative agencies should be responsible to the elected parliament, rather than only obeying the British governor. The resolutions pointed out that the colonial parliament should have full control over taxation, judicial appointments, and public finances, breaking the power structure of the Executive Council monopolized by the Anglo - Canadian oligarchy.\n\n2. ​​Ethnic Equality and Cultural Autonomy​\n​Protest against the discriminatory policies of the #bold Constitutional Act of 1791#! towards [SCOPE.sCulture('franco_canadian').GetName], demanding equal legal status for French and English, and guaranteeing the religious rights of Catholics. The resolutions specifically condemned the British authorities for giving land priority to Anglo - Canadian immigrants, which led to the poverty of French - Canadian farmers.​\n\n3. ​Economic Autonomy​​\nAdvocate the abolition of the British monopoly on Canadian trade (such as the Corn Laws), allowing the colonies to independently formulate tariff and commercial policies. The resolutions also called for the reform of the land - distribution system and the restriction of land - speculation by British chartered companies"
dsk_gbr.31.a:0 "However, his proposals for [SCOPE.sCulture('franco_canadian').GetName] were rejected by the #red British government#!"

dsk_gbr.32.t:0 "The Canada Land Monopoly Act"
dsk_gbr.32.d:0 "The #bold British North American Land Company#!, established in 1826, was granted the right to develop #red 2.3 million acres#! of land, monopolizing the development from the St. Lawrence River Valley to the Great Lakes. The company's directors included #bold Anglo - Canadian bureaucrats#! and #red London financiers#!, with an annual dividend rate of #bold 8%#!"
dsk_gbr.32.f:0 "In Lower Canada, #bold 70% of arable land#! was controlled by #red 7% of the Anglo - Canadian oligarchy#! in the population. [SCOPE.sCulture('franco_canadian').GetName] farmers became #bold Sharecroppers#!, with an average annual income of less than #red £20#!"
dsk_gbr.32.b:0 "We have to submit to [SCOPE.sCountry('gbr_scope').GetName] and hand over our financial power"
dsk_gbr.32.a:0 "A resolution without the democratic vote of all [SCOPE.sCulture('franco_canadian').GetName] is just a piece of waste paper! We will never accept it!"


dsk_gbr.33.t:0 "The Russell Resolutions"
dsk_gbr.33.d:0 "On March 6, 1837, John Russell, Lord Russell, the British Colonial Secretary, submitted an official reply to the #bold Ninety - Two Resolutions#! to the parliament, known as the #bold Russell Resolutions#!. This document rejected the core demands of the reformers in [SCOPE.sCountry('que_scope').GetName] with a #red Tough stance#!: #bold Responsible government#!, #red Fiscal control#!, and #bold Equal status for French#!"
dsk_gbr.33.f:0 "Core Provisions​​\n\n​​Parliamentary Power Restriction​​: Confirm that the #bold Constitutional Act of 1791#! cannot be amended, and the Lower Canada parliament has no right to remove the Executive Council controlled by the #red Anglo - Canadian oligarchy#!.​\n\n​​Fiscal Power Deprivation​​: Authorize the governor to #red Directly access the colonial treasury#! (with an annual budget of about £150,000) when the parliament refuses to allocate funds.​\n\n​​Cultural Suppression​​: Reaffirm #bold English#! as the only official language, and Catholic schools must be supervised by the #red Church of England#!."
dsk_gbr.33.a:0 "We have to submit to [SCOPE.sCountry('gbr_scope').GetName] and accept the Russell Resolutions"
dsk_gbr.33.b:0 "A resolution without the democratic vote of all [SCOPE.sCulture('franco_canadian').GetName] is just a piece of waste paper! We will never accept it!"

dsk_gbr.34.t:0 "The Lower Canada Rebellion"
dsk_gbr.34.d:0 "Unfortunately, soon after, on October 23, 1837, [SCOPE.sCharacter('can_scope').GetLastName] publicly advocated taking military action at a mass rally in Saint - Charles. The radicals also publicly hoisted the flag of independence."
dsk_gbr.34.f:0 "Today, we are no longer the subjects of the colony of [SCOPE.sCountry('gbr_scope').GetName]. Fellow [SCOPE.sCulture('franco_canadian').GetName] countrymen, unite and fight to break the colonial shackles like our southern neighbors did 60 years ago!\n\nWe no longer owe allegiance to any lord, any king, or any dictator. We were born on this land, we stand together with passion and love, and we pursue a common ideal, that is, all men are created equal!"
dsk_gbr.34.a:0 "The flames of rebellion have been ignited. Better to die standing than live kneeling!"

dsk_gbr.35.t:0 "The Durham Report"
dsk_gbr.35.d:0 "On December 14, 500 rebels were completely defeated by 2000 regular troops. The Lower Canada Rebellion was thus suppressed. After the rebellion, in 1838, the [SCOPE.sCountry('gbr_scope').GetName] government sent [SCOPE.sCharacter('can_ruler_scope').GetLastName] as the Governor of Canada. Later, he submitted a very informative report. The official name of the report is Analysis of the Affairs of the British North American Colonies"
dsk_gbr.35.f:0 "The core of the Durham Report has two main points:\n\nFirst, it is recommended that Upper and Lower Canada should be reunited. Second, it is recommended that the colonies should have full autonomy. In addition, Durham also suggested canceling the legal support for the Church of England and widely recruiting immigrants into the legislature. The proposal to reunite Upper and Lower Canada was soon accepted."
dsk_gbr.35.a:0 "[SCOPE.sCharacter('can_ruler_scope').GetLastName], please come to take up the post of Governor of [SCOPE.GetRootScope.GetCountry.GetName] quickly"
dsk_gbr.35.b:0 "Read"
popularity_person:0 "Popular leader"

je_United_Provinces_of_Canada:0 "British North America Act"
je_united_kingdom_tt:0 "#v Unite, Canadian people!#!"
we_are_canada_tt:0 "A unified #yellow Canada#! is established"
je_United_Provinces_of_Canada_reason:0 "With the economic development of each province and the construction of cross - provincial railways, there was a political - system reform movement in the [concept_colony], demanding to unite and establish a unified federal state. The initial plan was the reunification of Upper and Lower Canada. Due to the differences in language, religion, law, and education between [SCOPE.sCulture('franco_canadian').GetName] and [SCOPE.sCulture('anglo_canadian').GetName], and the economic differences between the two regions of Upper and Lower Canada, it was also proved that assimilating French - Canadian residents with English culture was not feasible. Finally, it was agreed that the union of Upper and Lower Canada must be based on the interests of both Anglo - Canadian and French - Canadian people.\n\nIn 1864, the politician #yellow George Brown#! proposed a new grand - union plan, that is, to expand the union of the former Province of Canada to the entire British North American colonies, establishing a #bold From sea to sea#! great country. This plan was supported by many parties."
je_can_against_gbr:0 "The Lower Canada Independence War"
je_can_against_gbr_reason:0 "[SCOPE.sCountry('que_scope').GetName] rebelled. At first, these disturbances on the border did not directly affect the residents of Kingston. In December 1837 and January 1838, the 'pirates' only established strongholds on Navy Island and the Niagara River. However, in February 1838, the danger began to gradually spread eastward along the St. Lawrence River towards Kingston."
help_que_button:0 "Support Lower Canada"
help_que_button_desc:0 "Go, my Canadian brothers, I'll follow you"
independence_war_button:0 "Sound the horn of rebellion"
independence_war_button_desc:0 "Our brothers have rebelled. What are we waiting for? Go to fight, go to die, and join their cause of resistance! History will remember this day"

je_canada_indian_removal:0 "The North American Indian Problem"
je_canada_indian_removal_reason:0 "The Royal Proclamation of 1763​​: Nominally recognized the #bold Sovereignty#! of the indigenous people over the unceded land, but [SCOPE.sCountry('gbr_scope').GetName] actually seized #bold 90% of the traditional territories#! through #red Unequal treaties#!\nThe Cree hunters sang under the moonlight: 'When the quill pen in Whitehall signed the Boundary Line Agreement, our eagle - feather totem was being bound into the appendix of the #red Land transfer contract#!.' And the carriages of the colonial officials carried the #bold Cast - iron boundary markers#!, crushing the last intact hunting circle along the #red 1768 Stanwix Line#!"
no_IRC_tt:0 "The indigenous [concept_decentralized_nation] in Canada no longer exists"

add_large_scripted_bar_progress_tt:0 "#o Significantly#! increase the #yellow Lower Canada Rebellion#! progress bar"
sub_large_scripted_bar_progress_tt:0 "#o Significantly#! reduce the #yellow Lower Canada Rebellion#! progress bar"
low_legality_modifier:0 "Low legitimacy"
modifer_Russell_Resolution:0 "The Russell Resolutions"
dsk_gbr.36.t:0 "Indian Residential Schools"
dsk_gbr.36.d:0 "The federal government and the church jointly ran #bold 139 residential schools#!, forcing 150,000 indigenous children to leave their families. The age range of students in residential schools was from 4 or 5 years old to 18 or 19 years old, and they had to stay in school for 10 months a year. During their stay at school, the assimilation education they faced mainly consisted of religious indoctrination and forced labor. Students had classes for half a day and then engaged in so - called vocational - skills training for the other half of the day, including blacksmithing, carpentry, or mechanical training for boys and sewing, cooking, and other household - work training for girls. By cutting off the students' connection with their cultural traditions, the residential schools tried to turn them into malleable wage laborers upon graduation."
dsk_gbr.36.f:0 "The main purpose of the indigenous - residential - school system implemented under the Indian Act was to sever the connection between the indigenous people and their culture and society, shape their identification with European cultural traditions, and assimilate them into the mainstream white society. Any indigenous cultural activities were prohibited in residential schools, and children were not allowed to speak their native languages.\n\nThe residential schools were located outside the reserves, which forced the children to be separated from their families. To complete this compulsory - education task, children were often forcibly taken away from their homes by Indian - affairs officers or the police (the Indian Act gave the Department of Indian Affairs the power to take children away from their homes). The parents of indigenous children strongly opposed the'state - sponsored assimilation' in these schools and called them 'extremely dangerous places for children'. And indeed, many residential schools had poor sanitary conditions, food shortages, and insufficient medical services. 'Disease and death were ever - present dangers'."
dsk_gbr.36.a:0 "Our hands are stained with their blood"

dsk_gbr.37.t:0 "Driving out the Indians"
dsk_gbr.37.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] authorities implemented #red Systematic ethnic cleansing#! through military suppression, legal fraud, and ecological destruction, driving the indigenous people from their traditional territories to barren reserves, constructing the colonial blueprint of a #bold 'White Canada'#!"
dsk_gbr.37.f:0 "After the American Revolutionary War, 40,000 #bold Loyalist Anglo - Canadian immigrants#! flooded into Upper Canada. Six Iroquois tribes were deprived of #bold 5 million acres#! of land in the Great Lakes region and were forcibly relocated to the #red Grand River Reserve#!.\n\nAfter the extinction of the beaver population in the 1850s, the Cree, who relied on the fur economy, had their supply of goods cut off by the #bold Hudson's Bay Company#!, leading to a #red Famine - induced migration#! to the northern tundra."
dsk_gbr.37.a:0 "Force them to migrate at bayonet - point"

dsk_gbr.39.t:0 "The Indian Act"
dsk_gbr.39.d:0 "Section 32 of the Indian Act in 1876 prohibited #bold Hunting and fishing#! outside the Indian reserves. After the #red Extinction of the bison#! (1889), the Plains Cree were forced to sign #bold Treaty 6#! and give up their grassland territories"
dsk_gbr.39.f:0 "A hypocritical moral stance and superficial material compensation are not enough to reconcile the indigenous people with what they have been deprived of. As long as the treaty rights of the indigenous people continue to be violated, capital continues to extract surplus value from them, and resources continue to be plundered from their land, 'reconciliation' can only be a smokescreen. The struggle movements launched by the indigenous people need to form an alliance with the broad labor movement, combining the fight against oppression and exploitation."
dsk_gbr.39.a:0 "A treaty is a treaty. It's not me who killed you, but the treaty"

dsk_gbr.40.t:0 "The 'Patriotes' War"
dsk_gbr.40.d:0 "When the news from [SCOPE.sCountry('que_scope').GetName] came, [SCOPE.sCountry('ont_scope').GetName] immediately responded. On December 4, the radicals near Toronto launched an uprising."
dsk_gbr.40.f:0 "On the 7th, the regular troops launched a general attack on Montgomery's Tavern, where the rebels were holed up.\n\nOn the 14th, the remaining rebels launched their last attack on the government troops"
dsk_gbr.40.a:0 "The moment that will completely change Canada's fate is about to come."

dsk_gbr.41.t:0 "The 'Caroline' Incident"
dsk_gbr.41.d:0 "During the rebellion, hundreds of rebels occupied Navy Island in the Niagara River in Canada and hired the American - flagged ship 'Caroline' to transport weapons to the island"
dsk_gbr.41.f:0 "After learning about this, the [SCOPE.sCountry('gbr_scope').GetName] authorities immediately dispatched an army to cross the river into [SCOPE.sCountry('usa_scope').GetName]'s Schlosser Harbor, captured the 'Caroline', seized the weapons on board, and burned the ship. During the arrest of the 'Caroline', two Americans were killed and several others were injured. The US government protested to the British for violating its sovereignty after learning about this incident."
dsk_gbr.41.a:0 "We will apologize to [SCOPE.sCountry('usa_scope').GetName]"
dsk_gbr.41.b:0 "It was [SCOPE.sCountry('gbr_scope').GetName] that did it. It has nothing to do with me"

dsk_gbr.42.t:0 "The Canadian Declaration of Independence"
dsk_gbr.42.d:0 "Under all the license plates in Quebec, there is an inscription 'Je·me·souviens', which means 'I remember'. In 1883, these words were first engraved by the architect Eugène - Étienne Taché under the provincial emblem at the entrance of the Quebec Provincial Parliament Building. Taché's father was a Patriote and participated in the 1837 rebellion. He hoped to arouse people's memory: I have not forgotten and will never forget my bloodline, traditions, and all past memories."
dsk_gbr.42.f:0 "Today, we are no longer the subjects of the colony of [SCOPE.sCountry('gbr_scope').GetName]. Fellow [SCOPE.sCulture('franco_canadian').GetName] countrymen, unite and fight to break the colonial shackles like our southern neighbors did 60 years ago!\n\nWe no longer owe allegiance to any lord, any king, or any dictator. We were born on this land, we stand together with passion and love, and we pursue a common ideal, that is, all men are created equal!"
dsk_gbr.42.a:0 "Long live Canada! Long live [SCOPE.GetRootScope.GetCountry.GetName]!"


je_british_lower_canada_rebellion:0 "The Lower Canada Crisis"
je_british_lower_canada_rebellion_reason:0 "With the continuous economic development of Canada, the local bourgeoisie and farmers in Canada needed someone to represent and defend their interests. Correspondingly, it was the reform of the British colonial - rule institutions in North American colonies.\n\nThe parliamentary - reform movement from the 1820s to the 1830s played an important role. The key figures were [SCOPE.sCharacter('can_scope').GetLastName] and #yellow William Lyon Mackenzie#!. They were from [SCOPE.sCountry('que_scope').GetName] and [SCOPE.sCountry('ont_scope').GetName] respectively.\n\nWhen [SCOPE.sCharacter('can_scope').GetLastName] became the speaker of the Lower Canada parliament in 1815, he was still a moderate reformer, but over time, he became more and more radical. Under his leadership, the Lower Canada parliament continuously fought against the British colonial - administrative authorities.\n\nAnd #yellow William Lyon Mackenzie#! was originally a journalist, running a newspaper to promote parliamentary reform. He was elected as a member of the Upper Canada parliament four times but was deprived of his seat four times. He was truly a politician who never gave up despite repeated failures.\n\nAlthough the parliaments of Upper and Lower Canada respectively issued the 17 - Point Proposal and the Ninety - Two Resolutions, demanding full suffrage for the colonies, the [SCOPE.sCountry('gbr_scope').GetName] authorities rudely rejected the reformers' proposals.\n\nIn 1837, an economic crisis originated from [SCOPE.sCountry('usa_scope').GetName] and [SCOPE.sCountry('gbr_scope').GetName]. Canada, which had close relations with them, was affected both industrially and agriculturally. Farmers and factory owners began to brew unrest."

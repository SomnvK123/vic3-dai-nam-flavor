dsk_je_gbr_union:0 "The British Empire Federation"
dsk_je_gbr_union_reason:0 "#v Currently, there are [JournalEntry.CalcCurrentGoalValue|V|0] members of the British Commonwealth#!\n\nThe Big Ben in #yellow London#!, [SCOPE.sCountry('gbr_scope').GetName], strikes eleven times. On the long table in the #blue Palace of Westminster#!, the #bold Imperial Agreement#! with gold - edged borders is spread out. In the sandalwood box of [SCOPE.sCountry('bic_scope').GetName], there is a sealed #red Tea - tax table of the Bombay Presidency#!, and the representative of [SCOPE.sCountry('saf_scope').GetName] presses an #red Uncut Kimberley diamond rough#! on the corner of the table - coarser than the one on the Queen's crown, but shining with a #v Sharp edge of sovereignty#!.\n\nThe #yellow Earl of Egremont#! from [SCOPE.sCountry('bic_scope').GetName] unfolds a peacock - feather sandalwood fan, with a #red Secret report of Bengali farmers protesting against land rent#!夹 between the fan bones; the leather briefcase of the governor of [SCOPE.sCountry('aut_scope').GetName][SCOPE.sCountry('nsw_scope').GetName] seeps out a #blue Wool contract from a South - Cross - Star farm#!, and the Australian red soil is rustling down from the cracks in the wax seal;\n\nThe #yellow New Zealand quartermaster#! silently unfolds a tattoo - patterned map, and the #o Maori chief of the North Island#! draws a #red Totem of resistance#! in the clouds with a whale - bone pipe.\n\nWhen the governor of [SCOPE.sCountry('hbc_scope').GetName][SCOPE.sCountry('can_scope').GetName] pulls out a silver - plated cigar cutter, two folded #blue Bilingual Constitutions#! slide out of the case - the English and French words are like #v Crossed swords#!, and the quill pen of the French - Canadian议员 penetrates the #bold Act of Union#! of 1840.\n\nThe afternoon sun climbs up the mist of Ceylon black tea, illuminating the silhouettes of the #red Anti - colonial rally crowd in the Punjabi wood - carved frame, and the unopened #blue Cod - dry petition#! of the Newfoundland delegation has solidified into a #o Silent Atlantic#! in the salt frost.\n\nAt this moment, the #yellow Emerald imperial map#! hanging on the dome quietly fades, and only the copper nails representing the self - governing colonies are gradually rusting from #blue Vancouver to Cape Town#!,蛀ing the #red Last gilding of the Victorian era#! into the dust of the nineteenth century"
dsk_je_gbr_union_tt:0 "Currently, the [concept_overlord] of [concept_gbr_union] is [SCOPE.sCountry('gbr_scope').GetAdjective]"
concept_gbr_union:0 "The Empire Federation"
concept_gbr_union_desc:0 "The British Imperial Conference was an important consultation mechanism within the British Empire (later the British Commonwealth) system from the early to the mid - 20th century, aiming to coordinate the political, economic, and foreign - affairs of the United Kingdom and its self - governing colonies (such as Canada, Australia, New Zealand, etc.)."
no_in_gbr_union_tt:0 "No longer loyal to the [concept_gbr_union] country [Concept('concept_ruler','$RULER_TITLE_YUANSHOU$')] or expelled for waging war against the [concept_gbr_union][concept_overlord]"

dsk_je_gbr_war_button:0 "Fulfill the common - defense obligation"
dsk_je_gbr_war_button_desc:0 "Invoke Article 5 of the Balfour Declaration, requiring each self - governing colony to fulfill the #red Common - defense obligation#!. This can force Canada to dispatch its Pacific Fleet and Australia to recruit the ANZAC Corps"
dsk_je_gbr_meeting_button:0 "Hold the once - every - five - years Imperial Federation Parliament"
dsk_je_gbr_meeting_button_desc:0 "According to the #red Imperial Conference Charter#!, convene the Governor - General of India, the Prime Minister of Canada, and representatives from African colonies in London."
dsk_je_gbr_united_button:0 "Conduct an ocean - going military exercise"
dsk_je_gbr_united_button_desc:0 "Conduct a #red Trident exercise#! on the 'Imperial lifelines' in the #bold Pacific#!, #bold Mediterranean#!, #bold Indian#!, and #bold Atlantic#! Oceans to test the coordination between the Royal Navy and the self - governing - colony fleets."
dsk_je_gbr_economy_button:0 "Imperial Federation financial loan"
dsk_je_gbr_economy_button_desc:0 "Activate Article 12 of the Ottawa Agreement, and withdraw an emergency loan from the #red Imperial Treasury#!. Canadian wheat futures will be mortgaged at the #bold Montreal Exchange#!, and the Indian gold reserves need to be pledged to the #red Bank of England#!"
10_years:0 "This policy is too grand and can only be held once every #v 10 years#!"
gbr_imperial_conference_progress:0 "Imperial Conference"
gbr_imperial_conference_progress_desc:0 "Imperial Conference progress bar: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!#v ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/1000)#!"
gbr_imperial_conference_progress_a:0 "Coefficient bonus for the #yellow Army#! from the Imperial Federation"
gbr_imperial_conference_progress_b:0 "Coefficient bonus for the #yellow Navy#! from the Imperial Federation"
gbr_imperial_conference_progress_g:0 "Coefficient bonus for [concept_sol] and [concept_unemployed] from the Imperial Federation"
gbr_imperial_conference_progress_c:0 "Coefficient bonus from the member states of #yellow Canada#!, #yellow South Africa#!, #yellow Australia#!, and #yellow British India#! in the Imperial Federation"
gbr_imperial_conference_progress_d:0 "Dependence of the Imperial Federation on the [concept_gdp] of [concept_overlord]"
gbr_imperial_conference_progress_e:0 "Political lobby in the Imperial Federation that is pro-[concept_overlord]"

dsk_gbr.43.t:0 "Organize a long - distance naval military exercise of the Royal Navy"
dsk_gbr.43.d:0 "Led by [SCOPE.sCountry('gbr_scope').GetAdjective], the countries of [concept_gbr_union] have assembled #bold 60 dreadnoughts#! to cross from #red Portsmouth to Scapa Flow#!, simulating the blockade of the #bold High Seas Fleet at Wilhelmshaven#!. The exercise will test the salvo accuracy of the #red new 13.5 - inch naval guns#! in the high - sea conditions of the North Sea and verify the night torpedo - boat coordinated tactics of #bold Article 12 of the Naval Warfare Regulations#!."
dsk_gbr.43.f:0 "[SCOPE.sCountry('gbr_scope').GetName]'s home fleet has assembled #red 28 dreadnoughts#! (including 4 Orion - class and 6 Iron Duke - class). The Pacific Fleet of [SCOPE.sCountry('gbr_subject_3').GetName] provides #bold 3 armored cruisers#! (HMCS·Rainbow class). [SCOPE.sCountry('gbr_subject_1').GetName] has dispatched #red 1 battle - cruiser squadron#! (led by HMAS·Australia). The Indian Ocean convoy of [SCOPE.sCountry('gbr_subject_4').GetName] has抽调 #bold 12 colonial gunboats#! (the 5th Sub - fleet stationed in Singapore), demonstrating the dominance of the #red British Empire#! across the seven seas."
dsk_gbr.43.a:0 "#red The British Empire#!'s huge fleet will conduct exercises in the #v Atlantic Ocean#!"
dsk_gbr.43.b:0 "#red The British Empire#!'s huge fleet will conduct exercises in the #v Mediterranean Sea#!"
dsk_gbr.43.c:0 "#red The British Empire#!'s huge fleet will conduct exercises in the #v North Pacific Ocean#!"
dsk_gbr.43.g:0 "#red The British Empire#!'s huge fleet will conduct exercises in the #v Indian Ocean#!"
gbr_navy_modifier:0 "Long - distance combat tactical system"

dsk_gbr.44.t:0 "Proposal for a long - distance naval military exercise of the Royal Navy"
dsk_gbr.44.d:0 "[SCOPE.sCountry('western_country').GetName] proposes a #red joint naval exercise for imperial defense#! (The Imperial Defense Memorandum)"
dsk_gbr.44.f:0 "[SCOPE.sCountry('gbr_subject_1').GetName] requests to test the support capacity of the #bold Sydney Strategic Port#! for the #red Pacific Fleet#!. It proposes to mobilize the #bold HMAS Australia#! battle - cruiser and the #red New Zealand Fisheries Patrol Vessels#! for anti - submarine joint training, simulating the threat from Japan to the #bold New Guinea Mandate#!.

[SCOPE.sCountry('gbr_subject_3').GetName] quotes the #bold Naval Service Act#! and requests the Royal Navy to evaluate the coverage efficiency of the #red Halifax Fortress#! for the #bold Atlantic Convoy Route#!. It proposes to use #red 5 destroyers#! to conduct a commerce - raiding war in the Icelandic waters.

[SCOPE.sCountry('gbr_subject_5').GetName], citing the #bold safety of the Cape Route#!, requests to test the supply capacity of the #red Simon's Town Naval Base#! for the Indian Ocean Fleet. It plans to use #bold 2 armored cruisers#! to simulate the raid of the German East African Fleet.

The authorities of [SCOPE.sCountry('gbr_subject_4').GetName] apply to use the newly - built gunboats from the #red Bombay Shipyard#! to hold an anti - smuggling exercise in the #bold Andaman Sea#!, but they need 3 scout cruisers from the #red Far - East Fleet in India#! for support."
dsk_gbr.44.a:0 "Agree"
dsk_gbr.44.b:0 "We are currently busy with other important matters."

dsk_gbr.45.t:0 "[SCOPE.sCountry('gbr_scope').GetAdjective] Royal Navy's long - distance naval military exercise"
dsk_gbr.45.d.a:0 "[SCOPE.sCountry('gbr_scope').GetName] demonstrates the might of the #red British Empire#! in the #v Atlantic Ocean#!"
dsk_gbr.45.d.b:0 "[SCOPE.sCountry('gbr_scope').GetName] demonstrates the might of the #red British Empire#! in the #v Mediterranean Sea#!"
dsk_gbr.45.d.c:0 "[SCOPE.sCountry('gbr_scope').GetName] demonstrates the might of the #red British Empire#! in the #v North Pacific Ocean#!"
dsk_gbr.45.d.d:0 "[SCOPE.sCountry('gbr_scope').GetName] demonstrates the might of the #red British Empire#! in the #v Indian Ocean#!"
dsk_gbr.45.f:0 "[SCOPE.sCountry('gbr_scope').GetName]'s home fleet has assembled #red 28 dreadnoughts#! (including 4 Orion - class and 6 Iron Duke - class). The Pacific Fleet of [SCOPE.sCountry('gbr_subject_3').GetName] provides #bold 3 armored cruisers#! (HMCS·Rainbow class). [SCOPE.sCountry('gbr_subject_1').GetName] has dispatched #red 1 battle - cruiser squadron#! (led by HMAS·Australia). The Indian Ocean convoy of [SCOPE.sCountry('gbr_subject_4').GetName] has抽调 #bold 12 colonial gunboats#! (the 5th Sub - fleet stationed in Singapore)"
dsk_gbr.45.a:0 "What a powerful force this is! [SCOPE.GetRootScope.GetCountry.GetName] hopes to bask in the glory of the #red British Empire#!"
dsk_gbr.45.b:0 "Before the outbreak of war, [SCOPE.GetRootScope.GetCountry.GetName] should maintain friendly relations with it."
dsk_gbr.45.c:0 "This is a serious provocation! [SCOPE.GetRootScope.GetCountry.GetName] will not yield to imperialist acts!"

dsk_gbr.46.a:0 "We agree to attend"
dsk_gbr.46.b:0 "The national treasury is empty. Let's discuss it later."

dsk_gbr.47.t:0 "The Admiralty vetoes the proposal for a long - distance joint naval exercise"
dsk_gbr.47.d:0 "The First Sea Lord signed the veto order in the #red Oak Room of Whitehall#!. The parchment note reads: 'In the sensitive period after the #bold Algeciras Conference#! (1906), it is inappropriate for the imperial fleet to display its strength off the coast of #red Morocco#! - especially when the iron - ore transportation line through the #bold Dardanelles Strait#! has not been insured by Lloyd's.'"
dsk_gbr.47.f:0 "The empire needs to ensure the tranquility of the #red oil pipelines and tungsten - ore transportation#!. This is a troubled time, and it is not appropriate to mobilize troops or engage in aggressive military actions during this special period."
dsk_gbr.47.a:0 "Alright"

dsk_gbr.48.t:0 "Imperial financial loan"
dsk_gbr.48.d:0 "#red Allocation of imperial financial loans#! and the #bold balance between wealth and misery#! in the Gilded Age"
dsk_gbr.48.f:0 "The urgent telegram from the governor of [SCOPE.GetRootScope.GetCountry.GetName] and the strike leaflet from the Birmingham trade union arrived at Downing Street at the same time: The #red imperial treasury#! has allocated #bold £2.2 million#! to us, but we need to decide where to allocate it - to relieve the #bold march of misery#! or to invest in the #red Clydebank Shipyard#! (Article 5 of the Colonial Finance Act of 1893 prohibits allocating funds to both people's livelihood and armaments at the same time)."
dsk_gbr.48.a:0 "How about having a luxurious party?"
dsk_gbr.48.b:0 "Prioritize investment in domestic construction!"
dsk_gbr.48.c:0 "The people in the country are suffering from hunger and cold. Allocate more financial resources to the poor!"
gbr_charity_modifier:0 "Relieve the poor"
dsk_for_british_repayment_modifier:0 "Loan income"
gbr_will_give_our_money:0 "[SCOPE.sCountry('gbr_scope').GetName] will give us a financial loan equivalent to 5% of its [concept_gdp]"
dsk_gbr.49.t:0 "Proposal from [SCOPE.sCountry('western_country').GetName]"
dsk_gbr.49.d:0 "[SCOPE.sCountry('western_country').GetName] has recently faced an empty treasury. They plan to apply for an imperial financial loan based on 5% of our GDP."
dsk_gbr.49.f:0 "#yellow Tagore#! wrote in The Bengal Observer: 'While hungry children gnaw on mango seeds, the silverware in Whitehall is filled with Darjeeling tea.'"
dsk_gbr.49.a:0 "Agree"
dsk_gbr.49.b:0 "Agree, but require them to reduce their [concept_liberty_desire] tendency"

dsk_gbr.50.t:0 "Approve imperial financial loans"
dsk_gbr.50.d:0 "The imperial treasury is in good condition. We can lend the surplus money to the indebted [concept_subject] countries."
dsk_gbr.50.f:0 "When the gilded clock in Buckingham Palace strikes noon, the gold - reserve boxes of the Bank of England are filled with gold ingots forged from the #red Rhodesian ore veins#!. The #bold tea and rubber monopoly taxes#! of the Imperial Customs General Administration are flowing into the treasury at a rate of #red £200 per minute#!. At this moment, the Khedive of Cairo is praying for the #bold 17th extension#! of the Suez Canal bonds, and the rubber tycoon in Kuala Lumpur has put the #red rubber - tapping knife#! against the throat of the Malay Sultan."
dsk_gbr.50.a:0 "Allocate funds to [SCOPE.sCountry('pais_rebelde_1').GetName]"
dsk_gbr.50.b:0 "Allocate funds to [SCOPE.sCountry('pais_rebelde_2').GetName]"
dsk_gbr.50.c:0 "Allocate funds to [SCOPE.sCountry('pais_rebelde_3').GetName]"

dsk_gbr.51.t:0 "Strengthen trade"
dsk_gbr.51.d:0 "The imperial preference system is in a tug - of - war between the #bold Lancashire textile magnates#! and the #red Indian cotton - yarn guild#!. Winston Churchill is holding the draft of the Ottawa Agreement and requires that Canadian wheat must be priced through the #bold Liverpool Exchange#!"
dsk_gbr.51.f:0 "The tariff - reform faction led by Joseph Chamberlain is in power. • The Bombay textile union has not announced a general strike."
dsk_gbr.51.a:0 "Sign the Imperial Trade Priority Order"

dsk_gbr.52.t:0 "Reform domestic affairs"
dsk_gbr.52.d:0 "Earl Grey waved the #bold working - class petition#! in the House of Commons, proposing to abolish the #red rotten boroughs#! and expand the #bold parliamentary seats in Manchester#!. The Tory aristocrats threatened to suspend the deliberation of the Factory Act."
dsk_gbr.52.f:0 "• King William IV has not used his veto power. • The Luddite movement has not spread to Birmingham."
dsk_gbr.52.a:0 "Pass the People's Representation Act"

dsk_gbr.53.t:0 "Prepare for war"
dsk_gbr.53.d:0 "Field Marshal Kitchener marked the #bold neutral zone of Belgium#! on the map in the map room, demanding the immediate requisition of all merchant ships from the #red Clyde Shipyard#! to be refitted with guns. The draft of the Munitions Act authorizes the conscription of #bold Irish agricultural laborers#!"
dsk_gbr.53.f:0 "• The German High Seas Fleet has broken through the Heligoland Bight. • The Ulster Volunteers have not publicly defied orders."
dsk_gbr.53.a:0 "Promulgate the Imperial General Mobilization Order"

dsk_gbr.54.t:0 "Cultural identity"
dsk_gbr.54.d:0 "Lord Curzon, the Viceroy of India, proposed to establish the #bold Imperial Day#!, mandating all colonial schools to use the #red Oxford Royal textbooks#!. The Ancient Monuments Preservation Order requires the removal of the #bold Maasai warrior totem poles#!"
dsk_gbr.54.f:0 "• The Queen is in good health to attend the Delhi Durbar. • The Zulu Kingdom has not restored its military establishment."
dsk_gbr.54.a:0 "Hold the Durbar on the banks of the #bold Yamuna River#!"

dsk_gbr.55.t:0 "Educational reform"
dsk_gbr.55.d:0 "Huxley presented the #bold outline of the evolutionary theory curriculum#! at the Royal Society, demanding that the #red works of Darwin#! be included in the compulsory courses of imperial universities. The Bishop of Oxford rushed to the podium holding the #bold Book of Genesis#!"
dsk_gbr.55.f:0 "• The proportion of church - run schools is less than 60%. • Queen Victoria has not publicly condemned it."
dsk_gbr.55.a:0 "Pass the Scientific Education Amendment Act"

dsk_gbr.56.t:0 "Religious issues"
dsk_gbr.56.d:0 "Gladstone met with the #bold Irish Sinn Féin#! at Downing Street, proposing to retain the #red privileges of the Anglican Church in Northern Ireland#!. The Religious Reform Act requires the abolition of the #bold Catholic Brotherhood#!"
dsk_gbr.56.f:0 "• The Vatican has not recognized the King of England as the religious leader. • The shipyards in Belfast have not stopped working."
dsk_gbr.56.a:0 "Sign the Edict of Religious Tolerance"

dsk_gbr.57.t:0 "Promote immigration"
dsk_gbr.57.d:0 "Sir Wilfrid Laurier presented the #bold prairie - colonization blueprint#! in Ottawa, promising to provide #red 160 acres of free land#! to Ukrainian immigrants. The draft of the Chinese Exclusion Act was simultaneously submitted to the #bold Vancouver Parliament#!"
dsk_gbr.57.f:0 "• The Pacific Railway has passed through the Rocky Mountains. • There have been no racial riots in British Columbia."
dsk_gbr.57.a:0 "Launch the #bold Imperial Pioneer Program#!"

# 贸易强化日志
je_dsk_gbr_a:0 "The Iron Curtain of the Imperial Preference System"
je_dsk_gbr_a_reason:0 "Joseph Chamberlain's tariff - reform movement has encountered resistance from the Indian National Congress. While Punjabi cotton farmers are burning Lancashire cloth, Churchill holds the 'White Paper on British - Indian Trade' and declares at the Bombay Town Hall, 'Free trade is the black tea in the empire's veins.'"

# 内政改革日志
je_dsk_gbr_b:0 "The Bloody Staircase of Parliamentary Reform"
je_dsk_gbr_b_reason:0 "Earl Grey's Whigs and the Duke of Wellington are in a fierce confrontation at Windsor Castle. While the mob in Bristol is burning the bishop's palace, King William IV signs the edict to abolish the rotten boroughs with a trembling hand. Tory aristocrats lament in The Times, 'The constitution is dead.'"

# 战争准备日志
je_dsk_gbr_c:0 "The Gaze of Kitchener's Eye"
je_dsk_gbr_c_reason:0 "Admiral Fisher is waving the 'Outline for Dreadnought Construction' at the Portsmouth Dockyard. The leader of the Ulster Volunteers, Carson, is reviewing the armed militia at the Belfast Docks. While the Asquith Cabinet is having a secret meeting at Dublin Castle, the bombs of the Irish Republican Brotherhood are quietly being placed at the bottom of the River Liffey."

# 文化认同日志
je_dsk_gbr_d:0 "Victoria's Peacock Throne"
je_dsk_gbr_d_reason:0 "Lord Curzon is reading the 'Unified Education Edict' on the back of an elephant in Jaipur. Tagore is secretly printing banned Bengali books in Calcutta. The Sikh elders are smashing the English lecture - desks in the colonial schools in Lahore with the Guru Granth Sahib wrapped in gold foil."

# 教育改革日志
je_dsk_gbr_e:0 "The Holy War of Darwinism"
je_dsk_gbr_e_reason:0 "Archbishop Manning is displaying an altar inlaid with fossils at Westminster Abbey. Huxley is rushing to the podium of the Royal Society with a Neanderthal skull specimen in hand. In the evolution textbooks of the miners' children's school in Birmingham, there is a manuscript of Marx's 'Theories of Surplus Value' sent from London夹."

# 宗教问题日志
je_dsk_gbr_f:0 "The Crown of Thorns in Northern Ireland"
je_dsk_gbr_f_reason:0 "Parnell is displaying the draft of the Irish constitution bound with the Bible at the Dublin Town Hall. Shipyard workers in Belfast are burning the Home Rule flags with tar - soaked crosses. The Vatican envoy, Bishop Remington, is secretly shuttling between the Tower of London and Balmoral Castle with the Pope's secret order."

# 移民政策日志
je_dsk_gbr_g:0 "The Sun Never Sets on the Prairie"
je_dsk_gbr_g_reason:0 "Ukrainian immigrants receive land deeds with the portrait of King Edward VII in the Winnipeg blizzard. The 'Great Han Gazette' in Vancouver's Chinatown is recording the details of the Chinese Exclusion Act in invisible ink. Metis hunters are secretly burying the 'Charter of Rights' wrapped in buffalo hide under the sleepers of the Pacific Railway."


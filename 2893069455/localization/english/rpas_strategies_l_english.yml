# 纽芬兰渔业联邦化
unite_new_button:0 "Unite Newfoundland"
unite_new_button_desc:0 "Based on the #red North Atlantic Fisheries Convention of 1890#!, convert the salt - pickled barrels in the #bold St. John's fish - curing factories#! into ballot boxes for the federal parliament."

# 新斯科舍海洋联合
unite_nvs_button:0 "Unite Nova Scotia"
unite_nvs_button_desc:0 "According to Article 7 of the #bold Federal Act of 1867#!, use the steel plates of the #red decommissioned Royal Navy cruisers#! to cast the dome of the Nova Scotia Provincial Parliament Building."

# 新不伦瑞克森林合并
unite_nbs_button:0 "Unite New Brunswick"
unite_nbs_button_desc:0 "Citing the #red Quebec Partition Order of 1784#!, incorporate the logging camps along the #bold St. John River#! into the federal railway sleeper supply system."

# 下加拿大文化整合
unite_que_button:0 "Unite Lower Canada"
unite_que_button_desc:0 "According to the #bold Union Act of 1840#!, use the #red wheat - straw forks#! of French - Canadian farmers to pull the bell - ropes of English schools and hang the #bold bilingual portrait of Queen Victoria#! at the Montreal Town Hall."

# 上加拿大工业联邦
unite_ont_button:0 "Unite Upper Canada"
unite_ont_button_desc:0 "Implement the compensation clauses of the #red War of 1812#!, and pour the steam - engine wave of #bold Lake Ontario#! through the federal railway to the Rocky Mountains."

# 哈德逊湾公司领土
unite_hbc_button:0 "Unite Hudson Bay"
unite_hbc_button_desc:0 "Citing the #bold Charter of Rupert's Land of 1670#!, bribe indigenous chiefs with #red uncut Kimberley diamonds#! and transform the fur - trading stations into federal customs."

# 哥伦比亚地区联合
unite_org_button:0 "Unite the Oregon region"
unite_org_button_desc:0 "According to the #red Fraser River Gold Rush Order of 1858#!, weave railway signal flags with the braids of #bold Chinese miners#! and raise the federal flag with a #bold salmon totem#! on Vancouver Island."

dsk_gbr.59.t:0 "The British North America Act"
dsk_gbr.59.d:0 "According to the resolutions of the Charlottetown Conference and the Quebec Conference in 1864, the parliament of [SCOPE.sCountry('gbr_scope').GetName] passed the British North America Act on #bold March 29, 1867#!. This act merged #red Upper Canada (Ontario), Lower Canada (Quebec), Nova Scotia, and New Brunswick#! into a federal self - governing dominion, granting it limited autonomy in handling domestic affairs, taxation, and trade, but foreign affairs and national defense were still directly under the jurisdiction of the #bold Colonial Office in London#!."
dsk_gbr.59.f:0 "Approve this act in the name of [SCOPE.sCharacter('ruler_scope').GetFirstName]:\n\nNova Scotia, New Brunswick, Quebec, Columbia, the Yukon Territory, and Ontario, from sea to sea to sea!"
dsk_gbr.59.a:0 "Regarding the name of this new country, I suggest calling it the #red Kingdom of Canada#!"
dsk_gbr.59.b:0 "Leonard Tilley, the governor of New Brunswick, suggests calling it the #red Dominion of Canada#!. This name comes from Psalm 72 of the Bible: 'His dominion shall be from sea to sea.'"

je_Canadian_Confederation:0 "Canadian Confederation Conference"
# 加拿大联邦议会进程机制说明
je_Canadian_Confederation_reason:0 "The federal parliament of [SCOPE.GetRootScope.GetCountry.GetName] is located in the Parliament Building in Ottawa. According to the #bold British North America Act of 1867#!, each province retains jurisdiction over education and natural resources. The federal system is struggling to balance between the #red dual French - English culture#! and the #bold indigenous treaties#!, shaping national identity through the railway network and immigration policies.\n\nThe #yellow federalists#! will #tooltippable;tooltip:[Country.GetTooltipTag],je_Canadian_Confederation_pos #v promote#!#! the process of confederation, while the #yellow separatists#! will #tooltippable;tooltip:[Country.GetTooltipTag],je_Canadian_Confederation_neg #v hinder#!#! national integration."

# 正向推动因素（自由派/联邦派）
je_Canadian_Confederation_pos:0 "The following conditions will #bold promote#! the confederation:\n• Implement the #yellow Pacific Railway Act#! (the 1881 agreement, #green +3#!)\n• Sign the #yellow Numbered Treaties#! (from 1871 - 1921, #green +2#!)\n• Pass the #yellow Dominion Lands Act#! (the homestead policy of 1872, #green +2#!)\n• Maintain the #yellow French - English bilingual system#! (Article 133 of the 1867 constitution, #green +1#!)\n• Complete the #yellow Trans - continental Telegraph Project#! (completed in 1885, #green +1#!)"

# 反向阻碍因素（保守派/分离主义）
je_Canadian_Confederation_neg:0 "The following conditions will #bold hinder#! the confederation:\n• The outbreak of the #yellow Red River Rebellion#! (the Métis resistance in 1869, #green - 3#!)\n• Implement the #yellow Indian Act#! (the assimilation policy of 1876, #green - 2#!)\n• The #yellow movement to secede from the confederation in Nova Scotia#! (led by Joseph Howe in 1868, #green - 2#!)\n• Implement the #yellow Chinese Immigration Act#! (the head tax in 1885, #green - 1#!)\n• Reject the #yellow claim to Arctic sovereignty#! (the Alaska boundary dispute in 1903, #green - 1#!)"


dsk_je_nafta_union:0 "North American Free Trade Area"
dsk_je_nafta_union_reason:0 "#v [SCOPE.sCountry('usa_scope').GetName], [SCOPE.sCountry('can_scope').GetName], and [SCOPE.sCountry('mex_scope').GetName] sign this treaty to defend the sacred right of free trade, weaken unilateralism, and strengthen the regional value chain and the continental supply - chain system.\n\nThe United States - Mexico - Canada Agreement will provide high - standard trade agreements for our workers, farmers, and companies.\n\nDraw the #bold contour lines of industrial civilization#! on the [GetGoods('soil').GetTextIcon] cowhide contract.\n\nFrom the telegraph towers of [SCOPE.sCountry('usa_scope').GetName] to the gold - panning troughs of [SCOPE.sCountry('mex_scope').GetName], the #red gasps of steam engines#! are reshaping the #v skeletal structure#! of the North American continent.\n\n#yellow A triple imprint is taking shape#!: The #v steel arteries#! across the continent are crushing bison skulls into ballast.\nThe molten flow of [GetGoods('gold').GetTextIcon] gold ingots is extinguishing the #bold star - worshiping bonfires#! of [GetPopType('tribal').GetName].\nAnd [GetLawType('law_colonial_resettlement').GetName] is #red measuring the cornfields#! into the face - value of railway stocks.\n\nWhen the steam whistles tear the silence of the Great Plains, what is jumping on the [concept_market] ledger is not only:\n• [GetGoods('cotton').GetTextIcon] #v Cotton futures#! rising by #bold 0.47 cents#! per pound.\n• [GetGoods('lumber').GetTextIcon] #v Lumber throughput#! exceeding #bold 1.8 million board - feet#!.\nBut also:\n• The #red indigenous land - deeds#! eaten through by ink.\n• The #bold never - healing ulcers of the railway tracks#! deep in North America."


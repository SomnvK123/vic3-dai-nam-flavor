dsk_gbr.58.t:0 "The Imperial Conference is Successfully Held"
dsk_gbr.58.d:0 "Under the crystal chandeliers of the Palace of Westminster, the seals of #bold six self - governing dominions#! are casting shadows on the parchment of the #red Balfour Declaration#!. The #bold peacock feathers#! of the governor of [SCOPE.sCountry('gbr_subject_4').GetName] sweep over the Kimberley diamond samples in the hands of the South African representatives. The cigar ash of the prime minister of [SCOPE.sCountry('gbr_subject_3').GetName] falls on the #red share - transfer document of the Pacific Railway#!. The watch chain of the wool tycoon from [SCOPE.sCountry('gbr_subject_1').GetName] gets entangled with the coordinates of the #bold Singapore Naval Base#!"
dsk_gbr.58.f:0 "The British Empire is a union of countries with 'the same blood, language, religion, and law,' scattered across 'boundless space.' This was the mainstream description of British colonialism by British intellectuals in the second half of the 19th century, that is, British expansion was the spread of the British nation. 'Spread' means that it flowed from the over - populated homeland to the less - developed lands, a natural process. So it's no wonder that Seeley described British expansion in this way: 'We seem to have conquered half the world absent - mindedly.' In other words, the spread of colonists does not necessarily mean the expansion of governance by a central government."
dsk_gbr.58.a:0 "Continue to extract the Nth bucket of gold from the major sea - routes"
dsk_gbr.58.b:0 "Organize land - based coordinated operations"
dsk_gbr.58.c:0 "Strengthen the authority of the British King"
dsk_gbr.58.z:0 "Improve the friendship among the dominions"
dsk_gbr.58.e:0 "Carry out cross - border police cooperation"
dsk_gbr.58.m:0 "Strengthen the system identity"


qiqishibian_event.1.f:0 "Under the pretext of conducting nighttime military exercises, the Japanese garrison quietly approached Wanping City near Lugou Bridge. Their actions aroused the vigilance of the Chinese garrison, and soldiers from both sides confronted each other nervously in the darkness, creating a tense atmosphere. At first, the Chinese garrison attempted to resolve this sudden situation through diplomatic channels, and they were on high alert but did not provoke actively. However, the Japanese side used the excuse of "one soldier missing" to request entry into Wanping City for a search, which was firmly rejected by the Chinese defenders. The dialogue between the two sides gradually became sharp, and the tension continued to escalate. At this moment, gunshots suddenly came from the side of Lugou Bridge, breaking the silence of the night. Soldiers from both sides quickly entered the battle, and the sound of intense gunfire echoed in the night sky, marking the official start of a full-scale war between China and Japan."
qiqishibian_event.1.b:0 "East Asia fired the first shot of war"

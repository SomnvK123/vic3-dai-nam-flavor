weiyenazhongcai2_event.1.t:0 "The Second Vienna Arbitration"
weiyenazhongcai2_event.1.d:0 "The territorial dispute between Hungary and Romania"
weiyenazhongcai2_event.1.f:0 "After arbitration in Germany, a treaty signed with Vienna stipulated that North Transylvania would return to Hungarian rule. This territory was divided into Romania during the partition after World War I, leaving behind a bitter dispute. Does this set a precedent for adjusting borders, given that a new order seems to have been established in Europe?"
weiyenazhongcai2_event.1.b:0 "The map of Europe should be redrawn"
weiyenazhongcai2_event_tt:0 "This is a real event that happened in history"

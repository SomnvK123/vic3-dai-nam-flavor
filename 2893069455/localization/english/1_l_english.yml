gelunbiyajiaru_event.1.d:0 "Colombia participates in the wars of the Allied Powers"
gelunbiyajiaru_event.1.f:0 "Colombia's participation in World War II as an ally was mainly based on the consideration of maintaining regional peace and stability. As the war situation worsened, Colombia realized that the expansion of fascism threatened the global order and indirectly affected its own security and trade. In order to prevent the spread of war to Latin America, the Colombian government has decided to declare hostile actions against the Axis powers, officially joining the ranks of the Allies and providing necessary support and assistance."
gelunbiyajiaru_event.1.b:0 "The balance of victory will tilt towards the Allied powers"
gelunbiyajiaru_event_tt:0 "This is a real event that happened in history"

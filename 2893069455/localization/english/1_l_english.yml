suoqusutaide_event.1.f:0 "Germany needs the Sudetenland region of Czechoslovakia, where a considerable number of Germans reside, and the situation is escalating. At a summit held in Munich, Germany, Britain, France, and Italy sought a diplomatic solution to the so-called 'Sudetenland Crisis'. Czechoslovakia was not invited to participate. An agreement has been reached for Germany to annex Sudetenland, but no further territorial claims will be pursued in Europe. Mr. Chamberlain said to the people of London: The Prime Minister has returned from Germany once again with peace and glory. I believe this is the peace of our time."
suoqusutaide_event.1.b:0 "So there won't be a war this year"
suoqusutaide_event_tt:0 "This is a true event that happened in German history"

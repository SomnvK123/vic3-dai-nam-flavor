xibanyanzbf_event.1.f:0 "After the victory of the Spanish Republican Army, the country ushered in a new era of democracy, social reforms were deeply implemented, the economy gradually recovered, and people's rights were fully protected. The significant improvement of international status and increasingly close relations with various countries have brought new changes to the situation in Europe. However, there are still many challenges behind the victory."

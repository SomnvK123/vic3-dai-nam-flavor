eguaduoerjiaru_event.1.t:0 "Ecuador joins the war"
eguaduoerjiaru_event.1.d:0 "Ecuador participates in the wars of the Allied Powers"
eguaduoerjiaru_event.1.f:0 "With the full-scale outbreak of war in Europe and Asia, Ecuador realized that neutrality was difficult to maintain in the long run to protect the country from the risks of war. In order to maintain national stability, protect the interests of overseas Chinese, and respond to the call of the International Anti Fascist Alliance, the Ecuadorian government has decided to declare war on the Axis powers and initiate its limited military and diplomatic support actions."
eguaduoerjiaru_event.1.b:0 "The balance of victory will tilt towards the Allied powers"
eguaduoerjiaru_event_tt:0 "This is a real event that happened in history"

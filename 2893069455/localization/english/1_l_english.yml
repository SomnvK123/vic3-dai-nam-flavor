weixiheziyou_event.1:0 "France surrenders"
weixiheziyou_event.1.t:0 "France surrenders"
weixiheziyou_event.1.d:0 "Germany established a puppet regime in southern France"
weixiheziyou_event.1.f:0 "After France's defeat, Vichy France will establish itself in the south of France and acquire all French colonies. This government essentially became a puppet of Germany, responsible for managing the areas of France that were not occupied by the Nazis, but its policies and actions were heavily influenced by Germany."
ribentouxiang_event.1.b:0 "The war in Asia has finally come to an end"
ribentouxiang_event_tt:0 "This war brought about painful casualties"
ribentouxiang_event_2tt:0 "May the deceased rest in peace"
ribentouxiang_event.1:0 "Japan has surrendered"
ribentouxiang_event.1.t:0 "Japan has surrendered"
ribentouxiang_event.1.d:0 "Japan surrenders after defeat"
ribentouxiang_event.1.f:0 "朕は終始帝国と同じ東アジア解放のために努力してきた諸同盟国に対して、深い遺憾を表明せざるを得ない。帝国臣民の戦陣での死、職寧での殉死、非命者とその遺族の死を思うと、五臓はすべて割れてしまう。戦傷を負い、戦禍を被り、家業者の生計を損なうことについても、朕が深く轆念している者である。今後帝国が受けた苦難は尋常ではなく、朕も爾などの臣民の心を深く知っているが、時運の赴くところ、朕はその耐え難いところを我慢しようとしたが、それに耐えられず、万世が太平を開くと思った。朕于zは国体を守ることができて、爾などの忠良臣民の赤誠を信じて、そして常に爾などの臣民と一緒にいます。情の激しさのように、むやみに事を起こしたり、同胞が互いに排斥したり、時局を乱したりして、そのため大道を迷い込んだり、信義を世界に失ったりして、この朕は深く戒めている。挙国一致、子孫伝承、神州の不滅を確信し、任重くして道遠を念じ、将来の建設に全力を傾け、道義を篤く守り、志を固め、必ず国体の精華を発揚し、世界の進化に遅れないようにすることを誓う。"
meizunbeihao:0 "Not ready for war"
je_deguotouxiang:0 "Germany surrenders"
je_deguotouxiang_reason: "Germany's struggle has failed"
deguotouxiang_event.1:0 "Germany has surrendered"
deguotouxiang_event.1.t:0 "Germany has surrendered"
deguotouxiang_event.1.d:0 "Germany surrenders after defeat"
deguotouxiang_event.1.f:0 "The commander-in-chief of the occupying forces of the four countries in Germany officially declared in Berlin that Germany would be divided into four parts: the eastern part would belong to the Soviet Union, the northwestern part to Britain, the southwestern part to the United States, and the western part to France. The "Greater Berlin" area is jointly occupied by four countries. The statement also stipulates that the Allied Control Committee shall be formally formed by the commanders in chief of the four countries. Starting from mid July, the four major powers implemented occupation and control in designated areas in Germany and Berlin. At this point, the situation of the Soviet Union, the United States, Britain, and France occupying Germany in their respective regions was officially formed. Jointly handle matters related to the overall situation in Germany. The city of Berlin is also divided into four occupied areas, managed by the Allied Berlin City Defense Command under the leadership of the Allied Control Council. This is the beginning of the partition of Germany."
deguotouxiang_event.1.b:0 "The war in Europe has finally come to an end"
deguotouxiang_event_tt:0 "It's all over now"
dongdangdezhengfu:0 "A turbulent government"
je_canyusjdz:0 "Participate in the World War"
je_canyusjdz_reason:0 "The Second World War has already erupted, should we choose to stand by or remain neutral? This war has become an important milestone in the course of world history."
sjdzjieshu_event.1:0 "The World War is over"
sjdzjieshu_event.1.t:0 "The World War is over"
sjdzjieshu_event.1.d:0 "The end of World War II"
sjdzjieshu_event.1.f:0 "The total number of casualties in wars worldwide exceeds 100 million, including approximately 70 million deaths and 130 million injuries. But now, whether in Europe or Asia, the war has ended, and I hope no one will die again."
sjdzjieshu_event.1.b:0 "The war in Europe has finally come to an end"
sjdzjieshu_event_tt:0 "It's finally over"

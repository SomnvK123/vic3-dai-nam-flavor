sflaiyinlan_event.1:0 "Establish a demilitarized zone in Rhineland"
sflaiyinlan_event.1.t:0 "Establish a demilitarized zone in Rhineland"
sflaiyinlan_event.1.d:0 "The content of the Treaty of Versailles after the war"
sflaiyinlan_event.1.f:0 "The Rhine demilitarized zone is 50 kilometers east of the Rhine River. The Rhine demilitarized zone was included in the Treaty of Versailles after World War I. The Treaty of Versailles stipulated that Germany was not allowed to station troops or defend within 50 kilometers east of the Rhine River, known as the Rhine Demilitarized Zone."
sflaiyinlan_event.1.b:0 "This is a punishment for Germany's defeat"
sflaiyinlan_event_tt:0 "This is a real event that happened in history"
sflaiyinlan_decision:0 "Establish a demilitarized zone in Rhineland"
sflaiyinlan_decision_desc:0 "The Treaty of Versailles stipulated that Germany needed to release the Rhineland demilitarized zone"
yiaizhanzheng_event.1:0 "The Second Italo Egyptian War"
yiaizhanzheng_event.1.t:0 "The Second Italo Egyptian War"
yiaizhanzheng_event.1.d:0 "The War between Italy and Ethiopia"
yiaizhanzheng_event.1.f:0 "The cause of this war was the border conflict between Italian Somalia and Ethiopia in 1934. Italy used this as an excuse to refuse reconciliation and launched a sudden invasion today, aiming to expand its territory, ease domestic economic pressure, and establish hegemony in the Mediterranean and East Africa regions."
yiaizhanzheng_event.1.b:0 "Italy has revealed its desire to expand in Africa"
yiaizhanzheng_event_tt:0 "This is a real event that happened in history"
yiaizhanzheng_decision:0 "Combat against Ethiopia"
yiaizhanzheng_decision_desc:0 "The empty promises of Britain and France have deprived us of our rightful colonies, and we can only get a share of the pie in Africa by doing it ourselves."
gubixuefu_event.1:0 "Soviet Union establishes wartime capital"
gubixuefu_event.1.t:0 "Soviet Union establishes wartime capital"
gubixuefu_event.1.d:0 "The Soviet Union established Gubyshev as a backup capital"
gubixuefu_event.1.f:0 "After the Battle of Moscow, the Soviet government secretly decided to set up Gubyshev (now Samara) as a backup capital to cope with extreme situations. This move is based on strategic considerations aimed at ensuring the continuity of government institutions to prevent Moscow from suffering irreparable damage again. With the increasingly severe situation of the war, preparations for the relocation of the capital have quietly begun, including the evacuation of government agencies and the temporary transfer of administrative functions."
gubixuefu_event.1.b:0 "So will we always hold Moscow"
gubixuefu_event_tt:0 "This is the Soviet Union's alternative plan"
gubixuefu_decision:0 "Establish a wartime capital"
gubixuefu_decision_desc:0 "Move the capital to Gubyshev to prevent Moscow from being threatened by the German army again."
dgzhanzhengzdy:0 "General Mobilization for War"
bayuefengbao_event.1:0 "August Storm "
bayuefengbao_event.1.t:0 "August Storm "
bayuefengbao_event.1.d:0 "The War between the Soviet Union and Japan"
bayuefengbao_event.1.f:0 "After Germany's defeat, the Soviet Union regrouped its forces and deployed them in the Far East, launching a final decisive battle against Japan. The Northeast Anti Japanese Allied Army led by the CPC and the Outer Mongolia (now Mongolia) army cooperated with the Soviet army. The main combat area is in Northeast China, and military actions have also been taken in northern Korea, southern Sakhalin Island, and the Kuril Islands."
bayuefengbao_event.1.b:0 "Perhaps it will be the last straw that cSOVhes the camel"
bayuefengbao_event_tt:0 "This is a true historical event"
bayuefengbao_decision:0 "Operation against Japan"
bayuefengbao_decision_desc:0 "Germany has surrendered, and defeating Japan will end this world war."
dgzhanzhengzdy_event.1:0 "Germany conducts overall mobilization for war"
dgzhanzhengzdy_event.1.t:0 "Germany conducts overall mobilization for war"
dgzhanzhengzdy_event.1.d:0 "Germany's final large-scale reinforcement of troops to the front line"
dgzhanzhengzdy_event.1.f:0 "The outcome of the Battle of Stalingrad made Nazi Germany realize the seriousness of the situation. To reverse the decline, Germany launched a comprehensive war mobilization. The main reason for joining the war was to make up for the huge loss of frontline troops and resources, as well as to resist the fierce counterattack of the Soviet Union. In the early stages of mobilization, the German government urgently recruited eligible male soldiers to increase military production, and mobilized civilian resources for military use, striving to revive military morale and combat effectiveness in a short period of time."
dgzhanzhengzdy_event.1.b:0 "A planned counterattack"
dgzhanzhengzdy_event_tt:0 "This is a true historical event"
dgzhanzhengzdy_decision:0 "General Mobilization for War"
dgzhanzhengzdy_decision_desc:0 "After the Battle of Stalingrad, we could only fill the manpower gap through general mobilization of war."
je_ouzhoumori:0 "Britain surrenders"
je_ouzhoumori_reason: "The resistance in Britain has failed"
ouzhoumori_event.1:0 "The New Order"
ouzhoumori_event.1.t:0 "The New Order"
ouzhoumori_event.1.d:0 "The New Order under Fascist Leadership"
ouzhoumori_event.1.f:0 "Germany successfully launched the Sea Lion Plan, disrupting all of Britain's defense plans in the British Isles. German soldiers continuously landed in Britain. In order to defend the island, the only few ships of the Royal Air Force and Royal Navy bravely stood between the German invaders and the mainland. But the German army quickly broke through the blockade, and the British army tried their best to maintain the defense line. However, under Germany's fierce attack, they fell one after another in the trenches on the southern coast. When the remaining British troops were forced to retreat to Scotland, the invasion of Britain officially came to an end. Claude Auchinleck and his army surrendered to the German army on the outskirts of Carlisle, marking the end of organized resistance in Britain. After the fall of Britain, a puppet government supported by Germany was officially established in London."
ouzhoumori_event.1.b:0 "The war between the Allied powers has finally come to an end"
ouzhoumori_event_tt:0 "It's all over now"
jiuyibashibian_event.1:0 "The September 18 Incident"
jiuyibashibian_event.1.t:0 "The September 18 Incident"
jiuyibashibian_event.1.d:0 "The War between China and Japan"
jiuyibashibian_event.1.f:0 "The Japanese Kwantung Army launched a sudden attack on Shenyang and occupied Northeast China by force. The direct cause and beginning of this event was that the Japanese army, following a carefully planned conspiracy, bombed the railway near Liutiaohu in Shenyang and blamed the Chinese army, using this as an excuse to launch an attack on the Northeast Army's Beidaiying, thus opening the prelude to the Sino Japanese War."
jiuyibashibian_event.1.b:0 "Japan has set its sights on Manchuria"
jiuyibashibian_event_tt:0 "This is a true historical event"
jiuyibashibian_decision:0 "The September 18 Incident"
jiuyibashibian_decision_desc:0 "Only by winning this humiliating war against China can we have Manchuria."
tielubeizha:0 "The railway was bombed"
jianlimanzhou_event.1:0 "Japan establishes Manchukuo"
jianlimanzhou_event.1.t:0 "Japan establishes Manchukuo"
jianlimanzhou_event.1.d:0 "The regime established by Japan in Northeast China"
jianlimanzhou_event.1.f:0 "After the September 18 Incident, Japan decided to establish a puppet regime controlled by Japan in order to strengthen its actual control over Northeast China. The Japanese side planned and promoted the establishment of Manchukuo in Changchun, with the last emperor Puyi serving as the "ruler". This move aimed to legitimize its aggressive behavior and further consolidate and expand its sphere of influence in Northeast China."
jianlimanzhou_event.1.b:0 "This is difficult to acknowledge"
jianlimanzhou_event_tt:0 "This is a true historical event"
jianlimanzhou_decision:0 "Establishing Manchukuo"
jianlimanzhou_decision_desc:0 "To conquer China, one must first conquer Manchuria."
weiyenazhongcai1_event.1:0 "The First Vienna Arbitration"
weiyenazhongcai1_event.1.t:0 "The First Vienna Arbitration"
weiyenazhongcai1_event.1.d:0 "Germany coerces Czechoslovakia into making territorial compromise ruling"
weiyenazhongcai1_event.1.f:0 "Czechoslovakia is a cancer tumor in the heart of Europe, and at last the Germans have decided to take decisive action against them. The Sudetenland has already been surrendered to Germany, and now, as a consequence of the Munich Agreement, the part of Czechoslovakia that should have belonged to Hungary should also have been returned by Germany."
weiyenazhongcai1_event.1.b:0 "Czechoslovakia's territorial sovereignty has once again been violated"
weiyenazhongcai1_event_tt:0 "This is a true historical event"
weiyenazhongcai1_decision:0 "The First Vienna Arbitration"
weiyenazhongcai1_decision_desc:0 "Hungarians can be said to be one of the most suffering ethnic groups after the last World War. After the disintegration of the Austro Hungarian Empire, many Hungarians became foreigners trapped on foreign lands overnight - even though they had lived on those lands for generations. By ceding some of Czechoslovakia's land to Hungary, we can greatly improve our relationship with them."



tunbinjieke_event.2.t:0 "The Fate of Slovakia"
tunbinjieke_event.2.d:0 "According to previous promises, we should recognize the independence of #yellow Slovakia#!."
tunbinjieke_event.2.f:0 "[SCOPE.sCountry('ger_scope').GetName]'s pretext for invading #v Czechoslovakia#! was the ethnic issues in the Slovak region, claiming that German troops needed to pass through Czechoslovakia to enter Slovakia for so-called 'stabilization.'\n\nIn reality, it was a well-orchestrated scheme between [SCOPE.sCountry('ger_scope').GetName] and the separatist forces of #yellow Slovakia#!.\n\nGiven this, it is only natural to allow Slovakia to become an independent puppet state."
tunbinjieke_event.2.a:0 "This was not part of my plan."
tunbinjieke_event.2.b:0 "I will fulfill our promise; the Germans are people of their word!"

qiqishibian_event.4.t:0 "Military Advisors from [SCOPE.sCountry('ger_scope').GetName]"
qiqishibian_event.4.d:0 "[SCOPE.sCountry('chi_scope').GetName] wishes to hire military advisors from [SCOPE.sCountry('ger_scope').GetName] to train their army."
qiqishibian_event.4.f:0 "To meet the needs of [SCOPE.sCharacter('crisis_scope_2').GetFullName] and to promote German arms and production equipment, facilitating the monopoly of capital in [SCOPE.sCountry('chi_scope').GetName]'s market and the plundering of strategic resources, Germany dispatched military advisors as a link in Sino-German economic relations, actively participating in China's economic development."
qiqishibian_event.4.a:0 "Agree to [SCOPE.sCharacter('crisis_scope_2').GetFullName]'s request."
qiqishibian_event.4.b:0 "Stay away from the Chinese; [SCOPE.sCountry('jap_scope').GetName] is our ally!"
qiqishibian_event.5.a:0 "Can Chinese forces equipped with German weapons withstand the Japanese attack?"
support_from_germany:0 "Military Advisors from Germany"

qiqishibian_event.2.t:0 "The Battle of Shanghai"
qiqishibian_event.2.d:0 "[SCOPE.sCountry('jap_scope').GetName] aims to conquer [SCOPE.sCountry('chi_scope').GetName] in three months."
qiqishibian_event.2.f:0 "[SCOPE.sCountry('jap_scope').GetName]'s [SCOPE.sCharacter('crisis_scope_2').GetFirstName] appointed General #yellow Matsui Iwane#! as the commander of the Shanghai Expeditionary Army, directing the 3rd Division, the 11th Division, and other units to attack #v Shanghai#!.\n\n[SCOPE.sCountry('chi_scope').GetName]'s [SCOPE.sCharacter('crisis_scope_1').GetFullName] deployed all elite forces, including #b Guangxi#!, #b Guangdong#!, #b Sichuan#!, #b Yunnan#!, #b Hunan#!, and #b Northeast#! armies, totaling over 700,000 troops."
qiqishibian_event.2.b:0 "The blue sky shines with the sun, and the blood stains the land red. The green hills are fortunate to bury loyal bones; history shall not be erased!"

blue_sky:0 "The Great Wall Watches"

qiqishibian_event.3.t:0 "[SCOPE.sState('beautiful_state').GetName] Massacre"
qiqishibian_event.3.d:0 "[SCOPE.sCountry('jap_scope').GetName] occupied [SCOPE.sCountry('chi_scope').GetName]'s [SCOPE.sState('beautiful_state').GetName] and slaughtered the city."
qiqishibian_event.3.f:0 "With about 50,000 troops entering the city and only 17 military police enforcing discipline, the Japanese army conducted widespread killings of Chinese civilians, especially disarmed soldiers and police, in addition to random individual murders.\n\nThe methods of mass slaughter included machine gun shootings and collective burials, carried out with extreme cruelty.\n\nUnder the command of General Matsui Iwane of the Central China Expeditionary Army and General Tani Hisao of the 6th Division, the Japanese army organized, planned, and executed a six-week-long massacre in Nanjing and its surrounding areas, involving mass killings, rape, arson, and looting.\n\nThe Nanjing Massacre resulted in the deaths of over 300,000 civilians and prisoners of war, leaving countless families shattered."
qiqishibian_event.3.b:0 "We swear to avenge this blood debt!"

yiaizhanzheng_event.3.t:0 "[SCOPE.sCountry('ita_scope').GetName] Used Mustard Gas in the War Against [SCOPE.sCountry('eth_scope').GetName], Defying the #v Geneva Convention#!."
yiaizhanzheng_event.3.d:0 "“The sky echoed with thunder, and a terrifying mist of rain fell from above, and then our people began to die in droves.”"
yiaizhanzheng_event.3.f:0 "“In addition to gas shells and gas bombs; their poison gas was also sprayed from aircraft, spreading like pesticides at low altitudes—considering the 'thunderous echoes in the sky' and the 'terrifying mist of rain.'\n\nTo make matters worse, [SCOPE.sCountry('eth_scope').GetName] was utterly unprepared for gas warfare—due to the hot climate, most of us fought half-naked.\n\nThis led to catastrophic consequences—victims initially suffered from skin inflammation, which then ulcerated and festered. We could only apply alcohol to the wounds in vain or die groaning by the roadside.”—Ethiopian Soldier"
yiaizhanzheng_event.3.a:0 "Damn it, [SCOPE.sCountry('ita_scope').GetName] dared to use mustard gas, a war crime under international law! I request Congress to allocate funds immediately to support [SCOPE.sCountry('eth_scope').GetName]!"
yiaizhanzheng_event.3.b:0 "Domestic issues are already overwhelming me!"

shanjibolan_event.2.t:0 "[SCOPE.sCountry('sov_scope').GetName] Declares War on [SCOPE.sCountry('pol_scope').GetName]"
shanjibolan_event.2.d:0 "According to the non-aggression pact between [SCOPE.sCountry('sov_scope').GetName] and [SCOPE.sCountry('ger_scope').GetName], Soviet forces launched an attack from the eastern front."
shanjibolan_event.2.f:0 "On September 17, 1939, [SCOPE.sCountry('sov_scope').GetName] attacked [SCOPE.sCountry('pol_scope').GetName] from the east, occupying Western Ukraine and Western Belarus east of the Curzon Line."
shanjibolan_event.2.b:0 "My heart feels nothing for Poland."

shanjibolan_event.3.t:0 "The Partition of Poland"
shanjibolan_event.3.d:0 "According to the non-aggression pact between [SCOPE.sCountry('sov_scope').GetName] and [SCOPE.sCountry('ger_scope').GetName], the new borders between the two nations are as follows."
shanjibolan_event.3.f:0 "[SCOPE.sCountry('ger_scope').GetName] controls most of Poland's territory, including the Falkenberg region in western Poland and the eastern border cities of Białystok and Gdańsk.\n\n[SCOPE.sCountry('sov_scope').GetName] controls Poland's eastern territories, including parts of Belarus and Ukraine, covering approximately 171,000 square kilometers. This further expanded Soviet influence in Eastern Europe."
shanjibolan_event.3.b:0 "My heart feels nothing for Poland."

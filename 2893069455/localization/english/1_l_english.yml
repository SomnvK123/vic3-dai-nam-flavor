 add_meifuquan_decision:0 "MEFO Bills Payments"
 remove_quxiaomeifuquan_decision:0 "Renew MEFO Bills"
 meifuquan:0 "Cancelled the MEFO Bills"
 add_meifuquan_decision_desc:0 "We have relied on the Reichsbank for the reconstruction of our arms industry for too long. It is time we made good our promissory arrangement with our arms manufacturers and end this "MEFO Bill" charade."
 remove_quxiaomeifuquan_decision_desc:0 "The Reichsbank is crucial in rebuilding and rearming our nation. It's clear we made an error in our decision to pay off our debts, and we should extend the MEFO Bills for another few months."
 laiyinlan_decision:0 "Rhineland"
 laiyinlan_decision_desc:0 "The Rhineland has been demilitarized since the end of the Great War, but this insult shall stand no longer! Germany is a sovereign nation and is free to move troops anywhere within her borders!\n#N This move will significantly damage our relationship with France#!"
dedaohebin_decision:0 "Anschluss"
dedaohebin_decision_desc:0 "The Anschluss, or union with Austria, is a long held goal of the German people. Although forbidden by the Treaty of Versailles, the time has finally come to bring it about. We must increase local support for fascism in Austria to lay the groundwork for the annexation."
tunbinjieke_decision:0 "Fate of Czechoslovakia"
tunbinjieke_decision_desc:0 "The time has come to divide the old Czech lands between those who can govern them properly. We should also consider the creation of a separate Slovak puppet state to the east."
meimeier_decision:0 "Reassert Eastern Claims"
meimeier_decision_desc:0 "The Great War saw the loss of much German territory in the East with the resurrection of Poland and the transfer of Memel to Lithuania. An Ultimatum shall be sent to both nations, but Poland, at least, will likely not bow to mere words."
weiyenazhongcai2_decision:0 "Second Vienna Award"
weiyenazhongcai2_decision_desc:0 "Transylvania has a Hungarian majority and should rightly belong to our friends in Hungary. However, it is hard to say how the Romanian regime and people will react to this demand."
 GER_italy_ally:0 "Alliance with Italy"
shanjibolan_decision:0 "Danzig or war!"
shanjibolan_decision_desc:0 "Danzig was German, Danzig has remained German, and Danzig shall be German from now on! We must prepare the German people for the inevitable war with Poland. A propaganda campaign will steel their will for the coming battle, while the crimes of the Polish nation are exposed to the world. Danzig and the surrounding lands will return to Germany!\n#N This move will trigger the Second World War#!"
shanjibolan:0 "The initiator of the world war "
aerbaniya_decision:0 "Occupy Albania"
aerbaniya_decision_desc:0 "The strong ties between Italy and Albania go back millennia, to the Roman Empire. We must incorporate Albania into Italy to secure the inlet to the Adriatic Sea."
tangnutuwa_decision:0 "Annex Tannu Tuva"
tangnutuwa_decision_desc:0 "While it hardly matters economically, for political reasons we should formally annex the People's Republic of Tannu Tuva as an autonomous oblast within the Soviet Union."
suoqusutaide_decision:0 "Demand Sudetenland"
suoqusutaide_decision_desc:0 "The fate of the Sudet-Germans was one of the worst injustices inflicted by the Treaty of Versailles. They must be brought under our protection, regardless of Czech objections."
boluodihai_decision:0 "Incorporate the Baltic States into the Soviet Union"
boluodihai_decision_desc:0 "The Baltic States are a failed experiment in capitalism that must be ended. Our pact with Germany enables us to act with impunity in the region, and we have prepared ultimatums for Estonia, Latvia and Lithuania to let us establish military bases inside their borders. It will then be a simple matter to incorporate these nations as full members of the Union of Soviet Socialist Republics."
yidalijiaru_decision:0 "Joining the German War"
yidalijiaru_decision_desc:0 "We need to abide by the Steel Treaty and join Germany's war."
faguocanzhan_decision:0 "Joining the War in Poland"
faguocanzhan_decision_desc:0 "Poland is our ally, and we need to help Poland."
yingguocanzhan_decision:0 "Joining the War in Poland"
yingguocanzhan_decision_desc:0 "Poland is our ally, and we need to help Poland."
faguochanzhan:0 "Disjointed Government"
zhouxinguo_decision:0 "Searching for Balkan allies"
zhouxinguo_decision_desc:0 "Attracting Hungary, Romania, and Bulgaria to join the Axis powers one after another."
weisebaoxingdong_decision:0 "Operation Weserübung"
weisebaoxingdong_decision_desc:0 "Norway is a critical strategic point and would be an obvious point of attack for any enemy wanting to disrupt our steel trade with Sweden. We cannot risk our enemies setting up bases in this region. To obtain a good staging area for the invasion of Norway we need to move on Denmark first."
bihelu_decision:0 "Bypass the Maginot Line"
bihelu_decision_desc:0 "We must bypass the Maginot Line and once again use Belgium and Luxembourg to ambush France and achieve victory."
nansilafu_decision:0 "The fate of Yugoslavia"
nansilafu_decision_desc:0 "After pressing them time and time again to declare for one side, the government of Yugoslavia still clings to the idea that Yugoslavia can sit out this conflict on the side lines. Now they must face the consequences of their cowardice."
xilajiaru_decision:0 "War with Greece"
xilajiaru_decision_desc:0 "What kind of powerful Empire are we becoming if we do not include Greece in it? It should be an easy target..."
daqingxi:0 "Not recovered from major cleaning"
bisalabiya_decision:0 "Demand Bessarabia"
bisalabiya_decision_desc:0 "Romania cannot expect to withstand the might of the Red Army, if we send them a demand for our rightfully claimed land in Bessarabia they may just hand it over without a fight."
babaluosajihua_decision:0 "Operation Barbarossa"
babaluosajihua_decision_desc:0 "We are about to embark on the greatest military campaign in history - the invasion of the Soviet Union! Where Napoleon failed, we will succeed. Surge forward across the border, encircle and destroy Soviet troop concentrations and continue pushing eastward. The operation will be considered a success if we seize Moscow and manage to establish a front line running along the Arkhangelsk - Astrakhan axis. Drang nach Osten!"
kuileislfk_decision:0 "Puppet Slovakia"
kuileislfk_decision_desc:0 "Puppet Slovakia"
qiqishibian_decision:0 "War with China"
qiqishibian_decision_desc:0 "The Marco Polo Bridge incident proved that the Chinese are not interested in cooperation. With increasing tension threatening the ensuing ceasefire, war may be the only means to bring the order to the Chinese nation."
zfflb_decision:0 "Secure the Philippines"
zfflb_decision_desc:0 "The Philippines are a necessary base on the way to our true goal. We must secure it for future military operations."
guafengbolan_decision:0 "The Partitioning of Poland"
guafengbolan_decision_desc:0 "According to the treaty, we can obtain the eastern part of Poland."
sufenzhanzheng_decision:0 "Finnish Invasion"
sufenzhanzheng_decision_desc:0 "Finland is to us a lost brother bound under the shackles of capitalism. Only by violent revolution can Finland be freed just as the Baltics have been freed."
je_weixiheziyou: "Vichy France or Free France"
je_weixiheziyou_reason: "Where should France go after its defeat?"
weixiheziyou_events.1.t: "The choice between Vichy France and Free France"

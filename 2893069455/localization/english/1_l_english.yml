nanfangwangguo_event.1.d:0 "A civil war erupted in Italy, with a North South confrontation"
nanfangwangguo_event.1.f:0 "Italy is torn apart under the heavy pressure of war! The hostile parties are recruiting troops and preparing to fight for what is left of the motherland and the belief in Italy's future, and everyone is facing difficult choices."
weixiheziyou_event.1.a:0 "Isn't France the strongest army?"
weixiheziyou_event_1tt:0 "This is a true event that happened in the history of France"
weixiheziyou_event.1.b:0 "Perhaps it's time to change the strategy"

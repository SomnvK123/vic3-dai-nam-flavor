fenlanjiaru_meng_decision_desc:0 "Japan and Germany are at the end of their strength, and we need to join the Allies immediately."
fenlanjiaru_zhou_decision:0 "Finland joins Axis powers in war"
fenlanjiaru_zhou_decision_desc:0 "Britain and the Soviet Union are on the brink of collapse, and we need to immediately join the Axis powers."

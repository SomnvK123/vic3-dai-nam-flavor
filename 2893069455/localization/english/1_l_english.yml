guafengbolan_event.1.f:0 "Poland, a country located in the heart of Europe, has become a sacrificial lamb in the great power game. With the exposure of the secret signing of the Molotov Ribbentrop Pact and its Additional Protocol between Nazi Germany and the Soviet Union, the two countries' plan to partition Poland came to light. The German army quickly crossed the western border of Poland through blitzkrieg, while the Soviet Red Army invaded Poland from the east according to the terms of the treaty. The armies of the two countries marched towards each other on Polish territory, like two sharp blades mercilessly cutting through the country's territory. The Polish people witnessed the division and fall of the country in shock and despair."

xibanyanzks_event.1.f:0 "The Spanish Civil War was mainly a conflict between two major forces: one was the left-wing alliance that supported the Spanish Republic and hoped to promote social reform; The other side is the nationalist camp led by General Francisco Franco, who opposes left-wing policies and hopes to restore traditional order. There are profound political, economic, and social root causes behind this civil war."

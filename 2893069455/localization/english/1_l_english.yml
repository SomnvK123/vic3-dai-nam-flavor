daleiyujihua_decision:0 "The Plan"
daleiyujihua_decision_desc:0 "Germany is ready to invade us at any time, we must take preemptive action."
hubuqingfan_decision:0 "Soviet-German Treaty of Non-Aggression"
hubuqingfan_decision_desc:0 "Only by signing this treaty will the Soviet Union divide Poland. If it is not signed, the Soviet Union is likely to attack us too early."
ritaitongmeng_decision:0 "Japan Thailand Alliance Treaty"
ritaitongmeng_decision_desc:0 "We need to find allies in East Asia, and signing a military alliance treaty with the Thai government is a good choice."
fangongchan_decision:0 "Anti-Comintern Pact"
fangongchan_decision_desc:0 "Interference by the Communist International in the internal affairs of the nations not only endangers their internal peace and social well-being, but is also a menace to the peace of the world! We will ask many of the non-Communist countries to sign the pact, and make sure that we keep the red menace in check."
yishudongfei_decision:0 "Establish Africa Orientale Italiana"
yishudongfei_decision_desc:0 "Italy or a subject of Italy own all Ethiopian core states."
ritaitongmeng_event.1:0 "Japan Thailand Alliance"
ritaitongmeng_event.1.t:0 "Japan Thailand Alliance"
ritaitongmeng_event.1.d:0 "Japan and Thailand have established a military alliance"
ritaitongmeng_event.1.f:0 "The treaty stipulates that the Thai army should cease resistance as soon as possible in order to allow the Japanese army to peacefully pass through Thai territory. In the treaty, there is also a secret protocol included. The protocol stipulates that Japan guarantees Thailand's recovery of territories taken by Britain and France in the 19th century; Thailand promised to assist Japan in jointly confronting the British and American forces during the war. According to the treaty, on January 25, 1942, Thailand declared war on Britain and the United States. The signing of the treaty led to a split within the government of Luang Prabang in Thailand, with the Foreign Minister and Finance Ministry withdrawing from the government due to their anti Japanese stance."
ritaitongmeng_event.1.b:0 "Japan is always ready to enter Southeast Asia"
ritaitongmeng_event_tt:0 "This is a true event that occurred on December 21, 1941"
fangongchan_event.1:0 "Anti Comintern Agreement"
fangongchan_event.1.t:0 "Anti Comintern Agreement"
fangongchan_event.1.d:0 "The formation of the Axis powers of Germany, Italy, and Japan"
fangongchan_event.1.f:0 "The agreement reached by the three fascist countries of Germany, Italy, and Japan before World War II. In 1936, Germany and Italy secretly signed the "German Italian Agreement", agreeing to strengthen cooperation in the process of foreign aggression, forming the "Berlin Rome Axis". In November 1936, Germany and Japan signed the Anti Comintern Agreement. In November 1937, Italy joined the Anti Comintern Agreement, officially forming the Axis of Germany, Italy, and Japan. Subsequently, Hungary, Spain, Bulgaria, Finland, Romania, Denmark, as well as the puppet regimes of Slovakia and Croatia, and the puppet regimes of Manchukuo and Wang in China also joined the agreement."
fangongchan_event.1.a:0 "Fascist forces are on the rise"
fangongchan_event_tt:0 "This is a real event that happened in history"
je_shijiedazhan: "the Second World War"
je_shijiedazhan_reason: "#P Triggering World War II#! #T requires#! #N Britain#!, #N France#!, #N Germany#! (not the North German Confederation or PSOVsia), #N Poland#!, #N the Soviet Union#! (or SOVsia), #N China#! (must be CHI, can be the Qing Dynasty, not the Taiping Heavenly Kingdom), and #N Japan#!. Only the existence of these countries is needed to trigger World War II. #T Italy and the United States are not necessary.#!"
shijiedazhan:0 "war mobilization"
shijiedazhan_event.1 "the World War"
shijiedazhan_event.1.t:0 "the World War"
shijiedazhan_event.1.d:0 "World War breaks out"
shijiedazhan_event.1.f:0 "The Second World War was a global scale war fought between the fascist Axis powers of Germany, Italy, and Japan on one hand, and the anti fascist alliance and anti fascist forces around the world on the other. From Europe to Asia, from the Atlantic to the Pacific, 61 countries and regions with a population of over 2 billion have been involved in wars, covering an area of 22 million square kilometers."
shijiedazhan_event.1.b:0 "The greatness and tragedy of humanity, the trials and glories of history."
shijiedazhan_event_tt:0 "We have started mobilizing for war"
hongjundefangong_decision:0 "The Red Army's counterattack"
hongjundefangong_decision_desc:0 "We have defended the city, and the turning point of the war has arrived. It is time to launch a counterattack."
hongjundefangong:0 "The Red Army's counterattack"
lundunhaijun:0 "Naval Treaty Contracting Parties"
je_lundunhaijun: "London Naval Treaty"
je_lundunhaijun_reason: "The London Naval Treaty is divided into two parts. The first was the Treaty on the Limitation and Reduction of Naval Armaments, signed on April 22, 1930, at the London Naval Armament Conference by the signatory countries of the Washington Naval Treaty - the United Kingdom, the United States, Japan, Italy, and France. The treaty was valid until December 31, 1936; The second time was on March 25, 1936, when the United Kingdom, the United States, and France signed the new Treaty on the Limitation of Naval Armaments in London, which was valid until December 31, 1942."
lundunhaijun_events.1: "Abolition of treaties"
ribentuichu_decision:0 "Japan withdraws from the London Naval Treaty"
ribentuichu_decision_desc:0 "To cope with the situation in the Far East and ensure the expansion of maritime hegemony, we should withdraw from the Naval Limitation Treaty and forge a new order of strength."
ribentuichu_event.1:0 "Japan withdraws from the London Naval Treaty"
ribentuichu_event.1.t:0 "Japan withdraws from the London Naval Treaty"
ribentuichu_event.1.d:0 "Japan is no longer restricted by naval treaties"
ribentuichu_event.1.f:0 "Against the backdrop of increasingly heavy clouds in the Far East, the Japanese government is deeply aware of the limitations of its existing naval forces. Faced with the increasingly tense regional situation and considerations for the country's long-term development, Japan has decided to take decisive action and announce its withdrawal from the London Naval Treaty. This move marks that Japan will no longer be restricted by treaties and will freely develop its naval forces to respond to possible external threats and maintain its interests and influence in the Far East region. Internally, the Japanese government believes that this is a crucial step towards Japan becoming a maritime power and realizing its national expansion ambitions."
ribentuichu_event.1.b:0 "Who will be next?"
ribentuichu_event_tt:0 "This is a true choice made by Japan in history"
yidalituichu_decision:0 "Italy withdraws from the London Naval Treaty"
yidalituichu_decision_desc:0 "In order to strengthen its Mediterranean hegemony and break free from treaty constraints, Italy has resolutely decided to withdraw from the London Naval Treaty and make every effort to build an invincible fleet, showcasing its national glory."
yidalituichu_event.1:0 "Italy withdraws from the London Naval Treaty"
yidalituichu_event.1.t:0 "Italy withdraws from the London Naval Treaty"
yidalituichu_event.1.d:0 "Italy is no longer restricted by naval treaties"
yidalituichu_event.1.f:0 "Italy has decided to withdraw from the London Naval Treaty in order to enhance its naval strength and ensure its interests in the Mediterranean, and to freely build a powerful fleet, demonstrating its status as a maritime power. This move has attracted widespread attention from the international community, who are concerned about the escalation of the regional arms race."
yidalituichu_event.1.b:0 "This treaty has become a mere formality"
yidalituichu_event_tt:0 "This is a true choice made by Italy in history"
je_lundunhaijun_button:0 "Joining the London Naval Treaty"
je_lundunhaijun_button_desc:0 "Join the British led Naval Limitation Treaty"
yijiarutiaoyue_wenben:0 "Joined the Naval Treaty"
lundunhaijun_event.1:0 "London Naval Treaty dissolved"
lundunhaijun_event.1.t:0 "London Naval Treaty dissolved"
lundunhaijun_event.1.d:0 "The treaty signed at the London Naval Armament Conference by the contracting parties of the 1930 Washington Naval Treaty was dissolved"
lundunhaijun_event.1.f:0 "As the flames of World War II rapidly spread globally, the London Naval Treaty, originally intended to limit naval arms races and maintain peace and stability, appeared pale and powerless under the shadow of war. Due to self-defense and strategic considerations, countries have torn up agreements and accelerated the construction of warships and weapon development. The naval arms race has completely spiraled out of control under the impetus of war, and the London Naval Treaty has become a regrettable chapter in the long river of history that failed to prevent catastrophe."
lundunhaijun_event.1.b:0 "The Pacific War disrupted peace"
lundunhaijun_event_tt:0 "The Choice of History"
hubuqingfan_decision_tt:0 "Don't worry, Germany and the Soviet Union can still attack each other through the Barbarossa Plan and Thunderstorm Plan"

aerbaniya_event.1:0 "Italy merges with Albania"
aerbaniya_event.1.t:0 "Italy merges with Albania"
aerbaniya_event.1.d:0 "Italy's influence has intervened in the Balkan Peninsula"
aerbaniya_event.1.f:0 "Italian diplomats have submitted an ultimatum to the Albanian government, demanding that they accept Italy's complete military occupation. After realizing that resistance was useless, the King of Albania abdicated, and Albania became the first part of the Italian Confederation led by King Victor Emmanuel III. Italy has set its sights on the Balkan Peninsula"
aerbaniya_event.1.b:0 "Another sacrifice of Italian ambition"
aerbaniya_event_tt:0 "This is a real event that happened in history"
milujiaru_event.1:0 "Peru participates in the war"
milujiaru_event.1.t:0 "Peru participates in the war"
milujiaru_event.1.d:0 "Peru participates in the wars of the Allied Powers"
milujiaru_event.1.f:0 "Peru's participation in World War II as an ally was based on upholding the dignity of international law and protecting the region from potential risks of aggression. Faced with the global expansion of fascist forces, the Peruvian government believes it is necessary to take action to show support for international justice and declares vigilance against the Axis powers, gradually strengthening cooperation with the international anti fascist alliance."
milujiaru_event.1.b:0 "The balance of victory will tilt towards the Allied powers"
milujiaru_event_tt:0 "This is a real event that happened in history"
hongjundefangong_event.1:0 "Battle of Stalingrad"
hongjundefangong_event.1.t:0 "Battle of Stalingrad"
hongjundefangong_event.1.d:0 "The turning point of World War II"
hongjundefangong_event.1.f:0 "In the Battle of Stalingrad, the Soviet Red Army engaged in a life and death struggle with the Nazi German army to defend their national territory. The two sides engaged in fierce battles between the icy and snowy terrain and the scorched earth ruins, with strategic points changing hands several times. With the tenacious resistance and tactical adjustments of the Soviet Red Army, the situation on the battlefield gradually reversed, ultimately marking a serious setback for Nazi Germany's Eastern offensive, and the campaign continued to advance with the victory of the Soviet Red Army."
hongjundefangong_event.1.b:0 "The torrent of steel is coming"
hongjundefangong_event_tt:0 "This is a real event that happened in history"
xuanzhanyilang_event.1:0 "Soviet Union declares war on Iran"
xuanzhanyilang_event.1.t:0 "Soviet Union declares war on Iran"
xuanzhanyilang_event.1.d:0 "Iran is being attacked due to its pro German stance"
xuanzhanyilang_event.1.f:0 "The reason why the Soviet Union declared war on Iran was due to the presence of pro Axis forces within Iran and the potential threat of Iran to the security of the Soviet Union's southern border. In order to maintain national border security and strategic interests, the Soviet government decided to take military action against Iran, officially declaring war and kicking off a military strike against Iran's pro Axis forces."
xuanzhanyilang_event.1.b:0 "The Iranian regime is about to be changed"
xuanzhanyilang_event_tt:0 "This is a real event that happened in history"
boluodihai_event.1:0 "The Soviet Union annexed the Baltic States"
boluodihai_event.1.t:0 "The Soviet Union annexed the Baltic States"
boluodihai_event.1.d:0 "Lithuania, Latvia, and Estonia were annexed by the Soviet Union"
boluodihai_event.1.f:0 "The Soviet government proposed to provide "assistance" and "protection" to the three countries under the pretext of maintaining regional security and protecting the rights and interests of ethnic minorities. As the situation developed, the Soviet army gradually entered and controlled these countries, marking the Baltic States as part of the Soviet Union."
boluodihai_event.1.b:0 "The Soviet Union has begun to expand"
boluodihai_event_tt:0 "This is a real event that happened in history"
bisalabiya_event.1:0 "Soviet occupation of Bessarabia"
bisalabiya_event.1.t:0 "Soviet occupation of Bessarabia"
bisalabiya_event.1.d:0 "The territorial dispute between the Soviet Union and Romania"
bisalabiya_event.1.f:0 "After massing forces along the Romanian border, SOV has issued an ultimatum to the government in Bucharest for the immediate transfer of Bessarabia, to their control. The region once belonged to the SOVsian Empire, which SOV sees as sufficient legal basis for their demands.Romania has declared that it has no choice but to accede, and its forces have been withdrawn from Bessarabia."
bisalabiya_event.1.b:0 "Enjoy this temporary victory, Moscow"
bisalabiya_event_tt:0 "This is a real event that happened in history"
tangnutuwa_event.1:0 "The Soviet Union annexed Tonutuva"
tangnutuwa_event.1.t:0 "The Soviet Union annexed Tonutuva"
tangnutuwa_event.1.d:0 "Tonutuva became a part of the Soviet Union"
tangnutuwa_event.1.f:0 "Tang Nutuwa has been a member of the Soviet Union for a long time, and all he lacks is his status. And now, the Supreme Soviet has received a request from the Tonutuva Council to join the Soviet Union. They will become the Tuva Autonomous Oblast of the SOVsian Soviet Federative Socialist Republic."
tangnutuwa_event.1.b:0 "Wishing them good luck"
tangnutuwa_event_tt:0 "This is a real event that happened in history"
wulaguijiaru_event.1:0 "Uruguay's participation in the war"
wulaguijiaru_event.1.t:0 "Uruguay's participation in the war"
wulaguijiaru_event.1.d:0 "Uruguay participates in the wars of the Allied Powers"
wulaguijiaru_event.1.f:0 "Uruguay, as a South American country, although not directly affected by the war, due to the threat of fascist forces to global peace, the Uruguayan government has decided to stand on the side of justice and announced its accession to the alliance. The main reasons for its participation in the war were to maintain international order and the principles of freedom and democracy, as well as to resist the aggression of the Axis powers. Uruguay's accession contributed to the anti fascist war."
wulaguijiaru_event.1.b:0 "The balance of victory will tilt towards the Allied powers"
wulaguijiaru_event_tt:0 "This is a real event that happened in history"
xuanzhanyilake_event.1:0 "Britain declares war on Iraq"
xuanzhanyilake_event.1.t:0 "Britain declares war on Iraq"
xuanzhanyilake_event.1.d:0 "Iraq was attacked due to its pro German stance"
xuanzhanyilake_event.1.f:0 "Under the influence of the Axis powers, Iraq experienced a change in government and a new regime leaning towards Germany, posing a threat to Britain's strategic interests and oil supply security in the Middle East. To stabilize the situation and protect its own interests, Britain has decided to take military action and declare war on Iraq."
xuanzhanyilake_event.1.b:0 "The regime in Iraq is about to be changed"
xuanzhanyilake_event_tt:0 "This is a real event that happened in history"
kldy_sewy_decision:0 "Instilling rebellion in Yugoslavia"
kldy_sewy_decision_desc:0 "Support the pro German government within Yugoslavia."
kldy_sewy_event.1:0 "Germany triggers Yugoslav rebellion"
kldy_sewy_event.1.t:0 "Germany triggers Yugoslav rebellion"
kldy_sewy_event.1.d:0 "Serbia, Croatia, and Montenegro join the Axis powers"
kldy_sewy_event.1.f:0 "During the invasion of the Kingdom of Yugoslavia by Nazi Germany, as the situation rapidly deteriorated, the Serbian Salvation Government, the Independent State of Croatia, and the Protectorate of Montenegro, as separatist forces within Yugoslavia, gradually separated from the original state system and declared their membership in the Axis powers. The Serbian Salvation Government was a puppet regime established after the German military occupation of Serbia to maintain control over the region. It was nominally an independent government, but in fact it was completely controlled by the Germans and became the agent of the Axis in Serbia. The Independent State of Croatia was a puppet regime established with the support of Nazi Germany by leaders such as Ante Pavlic of the Usta š a organization in Croatia. In the name of Croatian independence, this regime is actually Germany's ruling tool in Croatia, and its political, economic and military power is in the hands of the Germans. The Black Mountain region was occupied by Italy. Italy declared Montenegro as its "protectorate" in order to consolidate its sphere of influence in the Balkans. This means that Montenegro has lost its political independence and become a subordinate region under Italian control."
kldy_sewy_event.1.b:0 "The balance of victory will tilt towards the Axis powers"
kldy_sewy_event_tt:0 "This is a true event that occurred in the history of Yugoslavia"

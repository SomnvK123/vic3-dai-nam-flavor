l_english:
 je_Carlistas_civil_war:0 "Carlistas War"
 je_Carlistas_civil_war_reason:0 "The rivalry over the succession to the Spanish throne, while technically a War of Succession, was also a war over the establishment of Spain's new age."
 je_Carlistas_civil_war_goal:0 "Keep separatism below 30% for 5 years"
 je_Spanish_Empire:0 "The empire where the sun never sets"
 je_Spanish_Empire_reason:0 "Once upon a time our land spanned the world, and the sun always shone on some part of our realm. We must rebuild our empire where the sun never sets."
 Make_Spain_Great_Again_events.1.t:0 "Carlistas"
 Make_Spain_Great_Again_events.1.d:0 "The Carlistas are a group of people who do not recognize the successor of Ferdinand VII as Queen Isabel, but support Don Carlos, the younger brother of the King, as the legitimate King of Spain. With the Basque Country as its base of support, it defended feudal social systems such as absolute monarchy, churches, and local privileges, and also advocated anti-industrialization in the economic structure.On the other hand, the Madrid government, led by Queen Isabella, was liberal, civil revolutionary, He gained the support of liberals by advocating centralized modernization from above.The conflict over the succession to the Spanish throne, although formally a war of succession, was in reality a new era for Spain. It was also a war over the system of
 Make_Spain_Great_Again_events.1.f:0 ""For those who believe that the past was better, reality is unbearable." -King Juan Carlos I of Spain"
 Make_Spain_Great_Again_events.1.a:0 "Long live the Queen!"
 Make_Spain_Great_Again_events.1.b:0 "Make a Compromise with Carlistas"
 Make_Spain_Great_Again_events.1.c:0 "Cancel"
 Make_Spain_Great_Again_events.2.t:0 "Revolt in [SCOPE.sState('revolt_Spain_target_state_1').GetName]"
 Make_Spain_Great_Again_events.2.d:0 "The fires of rebellion in [SCOPE.sState('revolt_Spain_target_state_1').GetName] are burning with each passing day!"
 Make_Spain_Great_Again_events.2.f:0 ""Who can think that I am in favor of reactionary forces, death?"-Pablo Picasso"
 Make_Spain_Great_Again_events.2.a:0 "What the hell!"
 Make_Spain_Great_Again_events.2.b:0 "Cancel"
 Make_Spain_Great_Again_events.3.t:0 "[SCOPE.sState('loyalists_Spain_target_state_1').GetName] turned back to the Loyalists!"
 Make_Spain_Great_Again_events.3.d:0 "[SCOPE.sState('loyalists_Spain_target_state_1').GetName] has a massive rally in support of the Loyalists, and their support is in [SCOPE.sState('loyalists_Spain_target_state_1').GetName] It is spreading to !"
 Make_Spain_Great_Again_events.3.f:0 ""You can be you" -Mother Teresa"
 Make_Spain_Great_Again_events.3.a:0 "Great!"
 Make_Spain_Great_Again_events.3.b:0 "Cancel"
 Make_Spain_Great_Again_events.4.t:0 "Carlos V"
 Make_Spain_Great_Again_events.4.d:0 "Queen Isabel's brother, Don Carlos, who disobeyed Queen Isabel, proclaimed himself King of Spain in exile in Portugal, claiming himself King Carlos V. In Spain at the time, liberalism supported by the bourgeoisie. The faction and the reactionary faction centered on the church and aristocratic landlords continued their political confrontation, but Carlos colluded with the latter.Carlos organized a rebel army with support bases in the Basque Country and Navarre, while Carlistas's army was the government army in Madrid. At one point, they were on the verge of closing in on Madrid."
 Make_Spain_Great_Again_events.4.f:0 ""Once you decide to fight, you must keep your resolve." - Napoleon Bonaparte, Emperor of France"
 Make_Spain_Great_Again_events.4.a:0 "Awkward"
 Make_Spain_Great_Again_events.4.b:0 "Long live Carlos V of Spain!"
 Make_Spain_Great_Again_events.5.t:0 "Rural Distress"
 Make_Spain_Great_Again_events.5.d:0 "The Carlistas Wars morphed into wars over the new regime of Spain, but were completely irrelevant to many peasant villages in Spain. But both Due to factional conflicts, farming villages were devastated, and the farmers' voices of resentment gradually grew."
 Make_Spain_Great_Again_events.5.f:0 ""We want good peasants. They are the ones who make our armies strong." - Napoleon Bonaparte, Emperor of France"
 Make_Spain_Great_Again_events.5.a:0 "So sad"
 Make_Spain_Great_Again_events.6.t:0 "Rebellion of Soldiers"
 Make_Spain_Great_Again_events.6.d:0 "The civil war that split Spain in two caused a great deal of turmoil among the soldiers of the army. Should we join the Madrid government forces or the Carlos faction? The division between soldiers and officers is becoming clear. "
 Make_Spain_Great_Again_events.6.f:0 ""Every man in love is a soldier." -Ovid the Poet"
 Make_Spain_Great_Again_events.6.a:0 "Hey, listen!"
 Make_Spain_Great_Again_events.10.t:0 "Colonial Policy"
 Make_Spain_Great_Again_events.10.d:0 "Spain's colonial policy was once in a major setback, but now that the Napoleonic threat has passed, there are widespread calls to push for colonialism again. First destination. is still untouched Western Sahara!"
 Make_Spain_Great_Again_events.10.f:0 ""Action is the fundamental key to all success." - Painter Pablo Picasso"
 Make_Spain_Great_Again_events.10.a:0 "Spain will never perish, it will rise again and again!"
 Make_Spain_Great_Again_events.10.b:0 "We should focus on domestic affairs"
 

concept_russian:0 "Russia" 
concept_russian_desc:0 "In 1547, Ivan IV of the Grand Duchy of Moscow was crowned as [Concept('concept_ruler','$RULER_TITLE_TSAR$')]. In 1721, after winning the Great Northern War against Sweden, Peter I was proclaimed by the Senate as the [concept_russian] 'Emperor of All Russia' on October 22! Thus, [concept_russian] officially became a true #yellow empire#!."

DSK_russia.1.t:0 "A sad [ROOT.GetCountry.GetName]" 
DSK_Russia.1.f:0 "By 1836, [ROOT.GetCountry.GetName] had not abolished the feudal [SCOPE.sLaw('law_isolationism_scope').GetName]. [Concept('concept_ruler','$RULER_TITLE_TSAR$')] Russia was locked in imperialistic isolation while England and France rapidly industrialized. At the same time, Tsarist Russia retained the [SCOPE.sLaw('law_isolationism_scope').GetName] policy!\n\nThe backward social system severely hindered socio-economic development. Without reform, [ROOT.GetCountry.GetName] would forever fall out of the [concept_great_power] category, trampled by England and France."

DSK_Russia.1.d:0 "We urgently need reform" 
DSK_Russia.1.a:0 "What should we do?"

je_autocracy_of_the_tsar:0 "[concept_russian]'s fate" 
je_autocracy_of_the_tsar_tt:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName] holds absolute power! Reforms in [concept_russian] are extremely difficult!"

je_autocracy_of_the_tsar_reason:0 "[ROOT.GetCountry.GetRuler.GetFirstName], following the death of his elder brother #yellow Alexander I#! in 1825 without a male heir, and his younger brother #yellow Konstantin#! Grand Duke renouncing his claim to the throne, was established as [concept_russian][Concept('concept_ruler','$RULER_TITLE_TSAR$')].\n\nUpon ascending the throne in 1825, he suppressed the liberal forces' uprising led by senior officers, the #bold Decemberists#!. He subsequently intensified the repression of liberal thought and revolutionary movements, formed the gendarmerie, and strengthened the role of police; he established a special political investigation department known as the 'Third Section'. At the same time, a strict censorship regime for publications was implemented.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] was unwilling to conflict with the interests of [SCOPE.gsInterestGroup('shougun_ig').GetName], thus only implemented currency reform, codification efforts, and management reforms for state serfs while prohibiting serf children from attending middle schools and universities. In foreign policy, he continued to trample the truths of the Holy Alliance, just like European gendarmes, repressing the #v Polish Uprising of 1830#!."

nicholas_died:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] abdication" 
nicholas_died2:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName] death" 
nicholas_died3:0 "[ROOT.GetCountry.GetRuler.GetFirstName]’s death is beneficial for our upcoming reforms. If we lose [SCOPE.sLaw('law_isolationism_scope').GetName], the reform log will disappear."

DSK_Russia.200.t:0 "New [Concept('concept_ruler','$RULER_TITLE_TSAR$')] ascends the throne" 
DSK_Russia.200.d:0 "May God bless our Emperor! [SCOPE.sCharacter('gaixin').GetFirstName]" 
DSK_Russia.200.f:0 "Supreme glory to our [concept_russian]’s [SCOPE.sCharacter('gaixin').GetFirstName]!\n\nThe divine right to rule belongs to the virtuous!\n\nMay the palace endure, #yellow empire#! May the heavens protect!\n\nBring wealth and health to the people of [concept_russian]!\n\nSupreme glory to the holy [concept_russian]!\n\nCelebrate the solemn festival of [Concept('concept_ruler','$RULER_TITLE_TSAR$')]!\n\nRejoice and celebrate the arrival of Your Majesty!\n\nYour Majesty also returns the people's greetings!\n\nThe mandate of heaven belongs to our Emperor!\n\nLong live, long live, long live!"

DSK_Russia.200.a:0 "May God bless our entire [concept_russian] [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][SCOPE.sCharacter('gaixin').GetFirstName]! He will lead [ROOT.GetCountry.GetName] towards the light!"

je_Russia_expand_1:0 "[concept_russian] Expansion" 
je_Russian_expand_1_tt:0 "[concept_russian] expansion to open the maritime outlets to the four oceans.\nCurrently, [ROOT.GetCountry.GetRuler.GetFirstName] is the [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] of all [concept_russian]!"

je_Russia_expand_1_reason:0 "I, [ROOT.GetCountry.GetRuler.GetFirstName], as the [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] and monarch of all [SCOPE.sCulture(' Russian_culture').GetName], declare to all successors of the [concept_russian] throne and government:\n\nGiven by Almighty God to make me believe: the people of [concept_russian] bear the life mission of becoming the ruling nation of Europe, eternally guided by God’s brilliance, and supported by God.\n\nI hold this belief because most nations in Europe have reached a state of decay or are rapidly approaching it. Thus, it is concluded that a young people, upon reaching their strength, should be able and must conquer them.\n\nMay God bless [ROOT.GetCountry.GetName] and all [SCOPE.sCulture(' Russian_culture').GetName] people!"

no_kaz_countries:0 "We have annexed #v Great Yurt#!, #v Middle Yurt#!, #v Small Yurt#! or #v Kazakh Khanate#!!"

je_russia_expand_4:0 "Marching south" 
je_russia_expand_4_reason:0 "The lands to the south are ours!"

Russian_land_people:0 "[concept_rusian]'s territory" 
rusian_land_people_tt:0 "[concept_rusian]'s national emblem is the #bold double-headed eagle#!, one head gazing east towards [SCOPE.sState('east_state').GetName], and the other head looking west towards [SCOPE.sState('capital_state').GetName]"

Russian_land_people_reason:0 "During the time of Ivan III, #yellow the Grand Duchy of Moscow#! annexed the #bold principalities of Yaroslavl#!, #bold Rostov#!, and #bold Novgorod#!, making #yellow the Grand Duchy of Moscow#! exceed 1 million square kilometers. As #yellow the Grand Duchy of Moscow#! grew powerful, the #yellow Golden Horde#! split into #bold the Great Horde#!, #bold Crimea#!, #bold Kazan#!, and #bold Astrakhan#! khanates. Additionally, #yellow the Grand Duchy of Moscow#! conquered the #bold Tobol River#!, #bold Irtysh River#!, and #bold Ob River#! principalities.\n\nTo adapt to the new politics, #yellow Ivan III#! married the last princess of the Eastern Roman Empire, Sophia, beginning the comprehensive inheritance of Eastern Roman legacies and establishing a centralized regime, transforming the title from #v 'Grand Prince of Rus'#! to #v 'Monarch of All Rus'#!.\n\nAfter #yellow Vasily III#! ascended, he annexed #bold Prokofiev#! and #bold Ryazan#!, reclaiming Smolensk from #bold Lithuania#!. Thus, except for #bold Kiev#!, #yellow the Grand Duchy of Moscow#! had unified all Rus' states, expanding its territory to 2.8 million square kilometers, becoming the largest country in Europe.\n\nBy the time of #yellow Ivan IV#!, #yellow the Grand Duchy of Moscow#! reached its peak. #yellow Ivan IV#! carried out large-scale purges of the nobility, established centralized rule, and transformed #yellow the Grand Duchy of Moscow#! into [concept_russian] Empire. In foreign affairs, he constantly attacked the fragmented #bold Golden Horde#!, expanding territory. In 1552, [concept_russian] destroyed the #bold Khanate of Kazan#!; in 1556, it destroyed the #bold Khanate of Astrakhan#!; and from 1584 to 1598, it conquered the #bold Siberian Khanate#!. Except for the #bold Crimea Khanate#! controlled by [SCOPE.sCountry('tur_scope').GetName], most of the fragmented khanates of the #bold Golden Horde#! were conquered by [concept_russian]. By 1598, the territory of [concept_russian] reached 3.98 million square kilometers.\n\nIn 1613, the Romanov dynasty was established, and during the wars with #bold Poland#!, [concept_russian] never ceased its expansion into Siberia. In 1598, Russia completely annexed the #bold Siberian Khanate#!, then advanced eastward, gradually occupying the Yenisei and Lena river basins. By 1639, Russian colonizers reached the Sea of Okhotsk. During the eastern expansion, they continually infiltrated Mongolia, occupying many Mongolian lands. By the end of the 17th century, an agreement was reached with [SCOPE.sCountry('chi_scope').GetName] in the Treaty of Nerchinsk. By this time, [concept_russian]'s territory had expanded to 16 million square kilometers.\n\nDuring the reign of #yellow Catherine II#!, wars with [SCOPE.sCountry('tur_scope').GetName] erupted, eventually annexing the #bold Crimea Khanate#!, opening the maritime outlet to the Black Sea. #yellow Catherine#! also partitioned #bold Poland#! three times with [SCOPE.sCountry('ger_scope').GetName][SCOPE.sCountry('pru_scope').GetName], gaining regions like #bold Lithuania#!, #bold Courland#!, and #bold Belarus#!, totaling an area of 460,000 square kilometers. In its later years, [concept_russian] crossed the Bering Strait and occupied #bold Alaska#!, becoming a vast #yellow empire# spanning across Asia, Europe, and America!"

Russian_land_people_button:0 "Exile to Siberia" 
Russian_land_people_button_desc:0 "Siberia is a harsh land we have yet to develop. We will exile some political leaders to promote the development of these regions!"

gov_guberniya2:0 "Russian administrative regions" 
gov_guberniya2_desc:0 "Under this [concept_government_type], [concept_country] is ruled by [concept_russian] government pressure, led by [Concept('concept_ruler','$RULER_TITLE_GOUVERNEUR$')] with limited autonomy."

Russian_homestead_act_modifier:0 "Cultivating Siberia" 
Russian_homestead_administration:0 "New Exile Law" 
modifier_large_infamy:0 "No exported conquests" 
modifier_reforms_of_alexander:0 "Alexander's Reforms" 
modifier_tge_peasants_reform:0 "Serf Reforms" 
je_reforms_of_alexander_advance:0 "Progress in Alexander's Reforms"
notification_dsk_new_russian_homeland_name: "[concept_russian]'s new [concept_culture][concept_homeland]"
notification_dsk_new_russian_homeland_desc: "[SCOPE.sState('new_homeland_state').GetName] is now regarded as a [SCOPE.sCulture('new_homeland_culture').GetName][concept_homeland]."
notification_dsk_new_russian_homeland_tooltip: "#header $notification_dsk_new_russian_homeland_name$#!\n$notification_dsk_new_russian_homeland_desc$"

russia_expand.3.t:0 "Russian Empire"
russia_expand.3.d:0 "Two hundred years ago, under the reigns of #yellow Peter the Great#! and #yellow Catherine the Great#!, the Baltic and Black Seas were successively opened up, and the dream of [concept_russian] reaching the Atlantic was realized, but the aspiration to advance south to the Indian Ocean seems to have been shelved."
russia_expand.3.f:0 "Today, two hundred years later, although [ROOT.GetCountry.GetName] has access to the Baltic Sea, Black Sea, and Pacific Ocean, these routes are difficult to connect! \n\nThe Black Sea is linked by the Bosporus Strait, while the route from the Russian Far East to the East China Sea and Southeast Asia is constrained by the Tsushima Strait.\n\nWhen we zoom out and look at the entire Eurasian continent, a network of routes connecting ports from the Indian Ocean, the Barents Sea, the Baltic Sea, the Black Sea, and the Pacific Ocean resembles a giant web, firmly encompassing this continent and influencing the world!"
russia_expand.3.a:0 "For [Concept('concept_ruler','$RULER_TITLE_TSAR$')]! The Indian Ocean exit is within reach!"

india_is_ours_tt:0 "#red Advance to the Indian Ocean, control the exit!"

gbr_attack_tt:0 "Beware! [SCOPE.sCountry('gbr_scope').GetName] will soon interfere with our advance to the Indian Ocean!"
gbr_attack_1_tt:0 "[SCOPE.sCountry('gbr_scope').GetName] will restrict our expansion!"

gbr_will_protect_us_tt:0 "#v In response!#! [SCOPE.sCountry('gbr_scope').GetName] will protect us against [SCOPE.sCountry('rus_scope').GetName]'s expansion!"
rus_will_protect_us_tt:0 "#v In response!#! [SCOPE.sCountry('rus_scope').GetName] will protect us against [SCOPE.sCountry('gbr_scope').GetName]'s invasion!"

je_russian_india:0 "Indian Ocean Exit"
je_russian_india_reason:0 "From #yellow the Kingdom of Sweden#! and #yellow the Kingdom of Poland-Lithuania#! to [SCOPE.sCountry('tur_scope').GetName] and [SCOPE.sCountry('chi_scope').GetName], who can stop our territorial expansion? \n\nDoes [SCOPE.sCountry('gbr_scope').GetName] want to prevent our southward advance? Let them see what we can do!"
je_russian_india_tt:0 "#red Advance to the Indian Ocean, control the exit!"

indian_king:0 "Indian Ocean Exit"

DSK_russia.9.t:0 "Fulfill Peter the Great's Will"
DSK_russia.9.d:0 "We must get as close as possible to #yellow Constantinople#! and [SCOPE.sCountry('bic_scope').GetAdjective]. Whoever rules there will be the true master of the world. Therefore, we must provoke wars on the frontier, not only in Turkey but also in [SCOPE.sCountry('per_scope').GetAdjective]. Establish docks on the Black Sea, seize small pieces of land near the Black Sea and along the Baltic Sea; this is doubly necessary to achieve our plans. At the decline of [SCOPE.sCountry('per_scope').GetAdjective], we must push into the Persian Gulf, revive ancient trade with the Levant if possible, and advance to [SCOPE.sCountry('bic_scope').GetAdjective], which is the warehouse of the world. Once this is achieved, we will no longer need [SCOPE.sCountry('gbr_scope').GetAdjective]'s [SCOPE.sGoods('gold_scope').GetName]."
DSK_russia.9.f:0 "Whoever seizes my throne must push the territory to #yellow Constantinople#! and [SCOPE.sCountry('bic_scope').GetAdjective]. When [concept_russian] can freely enter the Indian Ocean, then we can rule the world—Peter I"
DSK_russia.9.a:0 "Taking [SCOPE.sCountry('bic_scope').GetName] will be an easy task!"
DSK_russia.9.b:0 "Expansion stops here! Move to [SCOPE.sState('capital_state').GetName]!"

high_infamy_will_die:0 "Beware of [concept_infamy]! #v Ceding [SCOPE.sCountry('bic_scope').GetName]#! will bring us at least #red 80#! [concept_infamy]!"

russia_expand.6.t:0 "The Great Game"
russia_expand.6.d:0 "Our continually expanding empire has come into conflict with [SCOPE.sCountry('gbr_scope').GetName], who dare to challenge our position in Asia? We must repel them and show them what we're capable of!"
russia_expand.6.f:0 "With the achievements of the Second Industrial Revolution, particularly the spread and flourishing of railroads across the Eurasian continent, the continental power [ROOT.GetCountry.GetName], once confined by maritime nations to the frozen lands with weak resource mobilization capabilities, is now well-equipped to improve its material, financial conditions, and the quality of its armed forces.\n\nGiven time, [concept_russian] will initiate a grand 'Westward Movement,' first expanding southward, then westward, encompassing Central Asia and Eastern Europe within a vast 'hub area.' Within this enclosed territory, Russia will establish a monopoly market, develop its astonishing mineral and human resources, and continue to expand towards the continental edge.\n\nOnce it occupies an ideal port and establishes an ocean-going fleet, it will be able to disrupt [SCOPE.sCountry('gbr_scope').GetName]'s global maritime trade and force its allies to switch sides; at that point, [concept_russian]'s 'World Empire' will be in sight—Sir Halford Mackinder."
russia_expand.6.a:0 "For [Concept('concept_ruler','$RULER_TITLE_TSAR$')]!"

russia_expand.7.t:0 "The Great Game"
russia_expand.7.d:0 "[SCOPE.sCountry('rus_scope').GetName] is a threat that cannot be ignored. They aspire to dominate Asia, and we are currently the only nation capable of countering them. By preventing their expansion into key areas, we can gain more prestige for our country."
russia_expand.7.f:0 "With the achievements of the Second Industrial Revolution, particularly the spread and flourishing of railroads across the Eurasian continent, the continental power [SCOPE.sCountry('rus_scope').GetName], once confined by maritime nations to the frozen lands with weak resource mobilization capabilities, is now well-equipped to improve its material, financial conditions, and the quality of its armed forces.\n\nGiven time, [concept_russian] will initiate a grand 'Westward Movement,' first expanding southward, then westward, encompassing Central Asia and Eastern Europe within a vast 'hub area.' Within this enclosed territory, Russia will establish a monopoly market, develop its astonishing mineral and human resources, and continue to expand towards the continental edge.\n\nOnce it occupies an ideal port and establishes an ocean-going fleet, it will be able to disrupt [SCOPE.sCountry('gbr_scope').GetName]'s global maritime trade and force its allies to switch sides; at that point, [concept_russian]'s 'World Empire' will be in sight—Sir Halford Mackinder."
russia_expand.7.a:0 "Let them realize their position!"

russia_expand.18.t:0 "[SCOPE.sCountry('gbr_scope').GetName] vs. [SCOPE.sCountry('rus_scope').GetName] Great Game Task Started"
russia_expand.18.d:0 "The continuous expansion of the Tsarist Empire has touched British interests."
russia_expand.18.f:0 "From the early 19th century to the early 20th century, for about a hundred years, these two imperial powers, Britain and Russia, engaged in fierce confrontations in political, diplomatic, and military fields over the spheres of influence in #bold Central Asia#!, #bold South Asia#!, and surrounding regions.\nAt that time, European imperialism was reaching its peak of expansion; Britain, in order to ensure the security of its primary colony in the East, India, began to extend its reach into [SCOPE.sCountry('per_scope').GetName], #yellow Afghanistan#!, and the vast heartland of #yellow Central Asia#!.\nThe Tsarist Russia similarly coveted the economic interests and transportation value of Central Asia, thus responding directly to Britain's expansion."
russia_expand.18.a:0 "I will fight alongside [SCOPE.sCountry('rus_scope').GetName] against [SCOPE.sCountry('gbr_scope').GetName]!"
russia_expand.18.b:0 "I will fight alongside [SCOPE.sCountry('gbr_scope').GetName] against [SCOPE.sCountry('rus_scope').GetName]!"
russia_expand.18.c:0 "Clearly, I'm not interested."

gbr_will_be_empire:0 "If [SCOPE.sCountry('gbr_scope').GetName] wins in a strategic area during the Anglo-Russian Great Game, it will be renamed the #red British Empire#!"
rus_will_be_empire:0 "If [SCOPE.sCountry('rus_scope').GetName] wins in a strategic area during the Anglo-Russian Great Game and completely controls #yellow East Silesia#!, it will be renamed #yellow Holy Russian Empire#! with a flag change to the tricolor double-headed eagle."
je_thired_rome:0 "Third Rome"
je_thired_rome_reason:0 "After the fall of the #yellow Eastern Roman Empire#!, the last dynasty's #v Paleologus#! final emperor #yellow Constantine XI#!'s niece, Princess #yellow Sophia#!, fled to the #yellow Grand Duchy of Moscow#!, which is a significant state in [concept_russian] history.\n\nWith the support of the Pope, #yellow Grand Duke Ivan III#! of the #yellow Grand Duchy of Moscow#! married Princess #yellow Sophia#!, thus [ROOT.GetCountry.GetName] claims to have inherited all political, economic, military, and cultural ideals of the #yellow Roman Empire#!.\n\n[ROOT.GetCountry.GetName] is indeed the #yellow Third Rome#!."
DSK_russia.6.t:0 "Third Rome"
DSK_russia.6.d:0 "Now that Constantinople is in our hands, I no longer need to deceive myself into thinking I am the heir of Rome; I am Rome!"
DSK_russia.6.f:0 "The capital of the empire is no longer in Ingria.\n\nThe niece of the last Eastern Roman Emperor married [ROOT.GetCountry.GetName], and I have taken on their responsibilities. I am the guardian of Orthodoxy. After I capture #yellow Constantinople#!, I will no longer be the heir of Rome; I am Rome. I will let the Turks know that I am their Damocles' sword; there will always be the sharpest spear piercing their hearts.\n\nThis is the long-awaited justice of 400 years; you will also taste the bitterness of being displaced and losing your country.\n\nMy return is for those who cannot come back. I am Rome; I am the eternal double-headed eagle of this world."
DSK_russia.6.a:0 "The great Third Rome has finally reached its most loyal #yellow Constantinople#!~"
modifier_rome_empire:0 "Guardian of Orthodoxy"
DSK_russia.7.t:0 "Third Rome"
DSK_russia.7.d:0 "[SCOPE.sCountry('rus_scope').GetName] officially announces to the world"
DSK_russia.7.f:0 "[SCOPE.sCountry('rus_scope').GetName] has successfully restored the ancient capital of Rome, #yellow Constantinople#! For the first time since the fall of the Eastern Roman Empire 400 years ago, the crown of Rome has transferred to [concept_russian]. [SCOPE.sCharacter('crisis_scope_1').GetFirstName] is crowned as the Roman [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]!"
DSK_russia.7.a:0 "Let it be so."
DSK_russia.7.b:0 "No! The Crimean War is not over! We must force them to relinquish #yellow Constantinople#!"

je_tur_Constantinople:0 "The Constantinople Question"
je_tur_Constantinople_reason:0 "[SCOPE.sCountry('rus_scope').GetName] has already taken #yellow Constantinople#! from [SCOPE.sCountry('tur_scope').GetName] and completely controls the #v Black Sea#!. Should we let their fleet dominate the Black Sea and even run rampant in the Mediterranean? Before the #v Suez Canal#! opens, we absolutely cannot accept [concept_russian]'s dominance over the Black Sea! We must support [SCOPE.sCountry('tur_scope').GetName] to counter [SCOPE.sCountry('rus_scope').GetName]'s further expansion!"
some_countries_will_do_this:0 "If #yellow Constantinople#! is not returned to [SCOPE.sCountry('tur_scope').GetName] within ten years, other [concept_great_power]s will intervene!"

modifier_reforms_of_alexander_legacy:0 "[concept_russian] Reforms"

DSK_russia.3.t:0 "[ROOT.GetCountry.GetRuler.GetFirstName]'s Reforms Successful"
DSK_russia.3.d:0 "Long live [Concept('concept_ruler','$RULER_TITLE_TSAR$')]!"
DSK_russia.3.f:0 "Under the wise and powerful leadership of the entire [concept_russian] [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFirstName], we have successively reformed the judicial system, improved primary education, and reformed the military system!\n\nGod has shown His favor! [ROOT.GetCountry.GetRuler.GetFirstName] is another wise ruler following #yellow Peter the Great#!\n\nHeaven bless [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFirstName]! Strong and noble, your rule brings glory—our glory!"
DSK_russia.3.a:0 "Long live [Concept('concept_ruler','$RULER_TITLE_TSAR$')]! Long live the new [ROOT.GetCountry.GetName]!"
DSK_russia.4.t:0 "[ROOT.GetCountry.GetRuler.GetFirstName]'s Reforms Failed"
DSK_russia.4.d:0 "Radical Actions!"
DSK_russia.4.f:0 "[ROOT.GetCountry.GetRuler.GetFirstName]'s carriage passes along the Griboedov Canal embankment on the way back to the Winter Palace when a young woman waves a white handkerchief. Soon, an assassin suddenly approaches [ROOT.GetCountry.GetRuler.GetFirstName]'s carriage and throws a homemade bomb at it.\n\nA huge explosion is heard, followed by [ROOT.GetCountry.GetRuler.GetFirstName]'s weak cry: 'Help me.' The assassin, a 25-year-old named Ignaty, dies in the blast while attempting to assassinate the Tsar.\n\nAt 3:30 PM that afternoon, Tsar [ROOT.GetCountry.GetRuler.GetFirstName] dies from blood loss.\n\nAfter [ROOT.GetCountry.GetRuler.GetFirstName]'s death, the conservatives in the country revised the controversial parts of the reforms!"
DSK_russia.4.a:0 "Is this the fate of [concept_russian]?"

je_reforms_of_alexander:0 "[ROOT.GetCountry.GetRuler.GetFirstName]'s Reforms"
je_reforms_of_alexander_goal:0 "Complete all three major reform log entries"
je_tge_peasants_reform:0 "Peasant Reform"
je_tge_peasants_reform_reason:0 "In the mid-19th century, [ROOT.GetCountry.GetName] stubbornly preserved the barbaric and backward serfdom. The personality and dignity of the peasants were ruthlessly crushed, forcing them to work for the landowners without compensation, often even being mortgaged as items of debt. A vast labor force was shackled to the manors, causing a shortage of necessary labor for the development of capitalist industry. This led to significant lag in Russia's economic and social development compared to Western European countries."
je_tge_melikovs_constitution:0 "Constitutional Reform"
je_tge_melikovs_constitution_reason:0 "Establish local self-government institutions (local self-government bureaus), abolish the old hierarchical trial system, and establish jury and lawyer systems. Implement open trials."
modifier_tge_melikovs_constitution:0 "Constitutional Reform"


je_tge_military_reform:0 "Military Reform"
je_tge_military_reform_reason:0 "The Crimean War has left the nation devastated, and military reforms can only be delayed. The world mocks my [concept_russian] army as 'gray livestock.' Should I prove them right?\n\nWe must carry out military reforms to form a military capability that can rival the British and French [concept_russian][concept_great_power]."
je_reforms_of_alexander_reason:0 "We have long been under the rule of a backward feudal serfdom system. Peasants have long suffered under the oppression of serfdom and the shackles of feudal thinking, while the thick ideology of autocracy has spread across the nation.\n\nDespite frequently rising in rebellion against the aristocrats and local officials, they do not oppose [Concept('concept_ruler','$RULER_TITLE_TSAR$')] and even support and worship the 'good [Concept('concept_ruler','$RULER_TITLE_TSAR$)]', considering '[Concept('concept_ruler','$RULER_TITLE_TSAR$')] a god on earth'.\n\nHowever, with the development of capitalism, the deepening agricultural crisis, and the differentiation of rural classes, class struggle has become increasingly sharp.\n\nTo alleviate class contradictions, strengthen state power, consolidate rule, protect the interests of the ruling class, and restore the grandeur of [ROOT.GetCountry.GetName] as a great power, reform is imperative!"

je_reforms_of_alexander_tt:0 "The great [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFirstName] will personally undertake the reform plan to save the backward [concept_russian]!"

DSK_russia.10.t:0 "Conquering the East"
DSK_russia.10.d:0 "We have acquired vast lands through the Treaty of Aigun and the Treaty of Tianjin, and it is necessary to develop them in a [concept_russian] manner!"
DSK_russia.10.f:0 "Our ministers suggest attracting European immigrants to the Far East to completely change the mainstream
annex_sweden_button: "Conquer Sweden"
annex_sweden_button_desc: "Obtaining a Baltic Sea port by conquering Sweden was the #yellow will of Peter the Great#!"

DSK_russia.11.t: "Master of Scandinavia"
DSK_russia.11.d: "Occupy as much Swedish territory as possible and provoke them to attack us, so we have an excuse to conquer Sweden. To achieve this, we must isolate Denmark and Sweden and fuel the conflict between them!"
DSK_russia.11.f: "\"Dismember Sweden, destroy Persia, crush Poland, and conquer Turkey. Once our forces have united, and our ships guard the Black Sea and the Baltic, we must secretly and individually make proposals first to Versailles and then to the Court of Vienna, to share a global empire with them. If either accepts, and by fueling their ambition and national pride, they almost certainly will, we can use them to subdue the other. Finally, we shall eliminate the remaining one. Since Russia already controls all of Eastern Europe or most of Europe, launching such a conflict poses no danger.\" —#yellow Peter the Great#!"
DSK_russia.11.a: "Destiny calls; we answer!"
DSK_russia.11.b: "Expansion stops here!"

je_manchulia_build:0 "Advance into Manchuria"
je_manchulia_build_reason:0 "After seizing the Outer Northeast of [SCOPE.sCountry('chi_scope').GetName], the question of how to develop this area is still being explored. It is not only very far from the core area of [SCOPE.sCountry('rus_scope').GetName], but also sparsely populated with harsh climatic conditions, making development a challenge.\n\nIf we do not develop it, it is as if we have not truly occupied it; what is the meaning of occupation then? Furthermore, the indigenous population far exceeds that of our mainstream ethnic group, and we fear that this advantageous land could lead to independent rebellions outside our control!\n\nTo address this issue, we must implement policies to attract immigrants to the Far East, such as granting 100 acres of land to each family and tax exemptions for 20 years. Additionally, we should encourage criminals to settle in the Far East to absolve them of their offenses."
hailanpao_button:0 "Create the Hailanpao Massacre"
hailanpao_button_desc:0 "The advantage of the indigenous people must be eradicated."
DSK_russia.12.t:0 "[concept_russian] Immigration"
DSK_russia.12.d:0 "Immigrants are coming to the new frontiers of [concept_russian]."
DSK_russia.12.f:0 "To encourage settlement, the government has introduced a generous land distribution policy. They openly declared that a batch of fertile land would be opened to new immigrants, with each person receiving 100 acres. This land is undoubtedly a huge temptation for farmers eager to own their own land.\n\nInitially, [concept_russian] stipulated that these lands would be tax-free for the next 20 years. Later, to further attract immigrants, [concept_russian] extended the tax exemption period to 24 years in 1861. Such policies greatly reduced the economic burden on immigrants, making them more willing to settle in the Outer Northeast."
DSK_russia.12.a:0 "Signed by His Majesty [ROOT.GetCountry.GetRuler.GetFirstName]!"
je_manchulia_build_1:0 "Development of Vladivostok"
je_manchulia_build_1_reason:0 "Vladivostok is an important city and port for our country in the Far East and must be developed to deter East Asia and the Pacific!"
DSK_russia.13.t:0 "Pacific Fleet"
DSK_russia.13.d:0 "Deter Japan with absolute strength."
DSK_russia.13.f:0 "The decades of hard work in Vladivostok have finally allowed us to establish a foothold! You all bow to [concept_russian]’s [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFirstName]!"
DSK_russia.13.a:0 "With money and manpower, we can build Vladivostok!"


DSK_russia.14.t: "The Hailanpao Massacre"
DSK_russia.14.d: "Forcibly occupy Hailanpao and rename it Blagoveshchensk"
DSK_russia.14.f: "\"Upon reaching #yellow Blagoveshchensk#!, the eastern sky was blood-red, illuminating the waters of [SCOPE.sState('beautiful_state').GetName] as if they were flowing with blood. Russian soldiers with bayonets surrounded the crowd, leaving the riverbank open, continuously tightening the encirclement. The officers, waving their swords, shouted frantically: 'Anyone who disobeys will be shot immediately!' The crowd began to be forced into the murky currents of the Amur River like an avalanche. They screamed madly, their cries shaking the sky; some desperately tried to break free, while others trampled over fallen women and infants in an attempt to escape. Some were thrown into the air by cavalry hooves, others were struck down by cavalry bayonets. Then, the Russian soldiers fired their guns all at once. The screams, cries, gunshots, and curses blended together in an indescribable scene of horror, truly resembling a scene from hell.\" —An eyewitness Russian soldier involved in the massacre"
DSK_russia.14.a: "All villages of Chinese residents must be 'completely destroyed.'"

DSK_russia.15.t: "[SCOPE.sCountry('rus_scope').GetName] Instigates the Hailanpao Massacre"
DSK_russia.15.a: "The barbaric [SCOPE.sCountry('rus_scope').GetName] has cut itself off from the civilized world!"



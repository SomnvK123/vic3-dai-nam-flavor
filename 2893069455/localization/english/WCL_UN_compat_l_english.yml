concept_soviet_union:0 "Soviet"
concept_soviet_union_desc:0 "Meaning 'representative assembly' or 'council', it is an organizational form created by the proletariat of [concept_russian] during the 1905 [concept_revolution] to lead the masses in revolutionary struggle. It originated in the 1905 [concept_russian][concept_revolution] as a form of democracy for workers and peasants, with representatives that can be elected and replaced at any time, implying a power structure similar to that of the Paris Commune."

concept_comintern:0 "Communist International"
concept_comintern_desc:0 "From March 2 to 6, 1919, representatives from 21 countries and 35 parties and organizations gathered in Moscow to hold an international communist congress, adopting important documents such as the 'Manifesto to the International Proletariat', 'Communist International Action Program', and 'Outline on Bourgeois Democracy and Proletarian Dictatorship'. This congress declared the formal establishment of the Third International, named the 'Communist International'."
gw5:0 "The Calm Before the Storm"
gw5_reason:0 "Europe is in the calm before the storm; we hope to avoid excessive diplomatic actions that disrupt this tranquility!"

je_soviet_union_1:0 "February Revolution"
je_soviet_union_1_tt:0 "[concept_revolution] is on the rise, and it's imperative!"
je_soviet_union_1_reason:0 "I see that our motherland [ROOT.GetCountry.GetName] is a militarily feudal imperialist country that is economically backward and politically reactionary, filled with sharp and complex contradictions.\n\nThe people, suffering from hunger and cold, rise up against [Concept('concept_ruler','$RULER_TITLE_TSAR$')]’s rule; they can no longer endure the heavy oppression! Seize the armories, take the guns and ammunition, and build barricades!\n\n#red For the benefits of the people, to see the governance succeed. For the world we must fight!#!"

DSK_russia.16.t:0 "February Revolution"
DSK_russia.16.d:0 "Down with the war! Bread and peace!"
DSK_russia.16.f:0 "Under the leadership of the Bolshevik Party, a general strike with 300,000 participants occurred in the capital’s major factories. The storm of [concept_revolution] terrified Tsar [ROOT.GetCountry.GetRuler.GetFirstName], who ordered all measures to restore order in the capital as soon as possible.\n\nLeaders of the Bolshevik Petrograd Committee and over a hundred other [concept_revolution] activists were arrested, provoking great anger among the masses. They took to the streets to protest government atrocities but faced even more brutal repression. Thus, the district committee leading the strike decided to transform the general strike into an armed uprising to overthrow the Tsarist government.\n\nWorkers immediately took action, seizing the armories, capturing guns and ammunition, and building barricades to fight against reactionary troops and police. At the same time, they actively worked to gain the army's support, and under the workers' propaganda and inspiration, tens of thousands of soldiers openly sided with the revolutionaries. They, alongside the uprising workers, occupied the Tsar's stronghold, the Winter Palace, and arrested the Tsar's ministers and generals. The capital uprising achieved complete victory.\n\nThus, the Romanov dynasty, which ruled Russia for 304 years, was toppled by the February [concept_revolution]. The Russian democratic [concept_revolution] has triumphed!"
DSK_russia.16.a:0 "We want to establish a presidential republic!"
DSK_russia.16.b:0 "We want to establish a parliamentary republic!"

je_soviet_union_2:0 "October Revolution"
je_soviet_union_2_reason:0 "What are our enemies? In our country, class contradictions have escalated to an irreconcilable degree; the bourgeoisie, petty bourgeoisie, and old nobility are all deadly enemies of the working class.\n\nComrades, when the [concept_revolution] is still ongoing, it means that an entire class is perishing; this is not the same as the death of an individual.\n\nAfter a person dies, their body can be taken away, but when the old society is perishing, unfortunately, the corpse of the bourgeoisie cannot simply be nailed shut in a coffin and buried.\n\nThe corpse of the bourgeoisie is rotting in our hearts, transmitting its poison to us all, emitting a foul smell!\nThe assassination of Comrade Breshkovsky indicates the counter-revolution's white terror. The traitors condemned by the people's will must be mercilessly eliminated!\nLet the bourgeoisie go mad! Let those worthless souls weep! Comrades of the workers, this is our answer.\nBe three times more vigilant, careful, and patient; everyone should guard their own positions. Comrades, you must remember: we have only one way out, and that is victory! There is another way out: death.\n\n#N Death does not belong to the working class!#!"
je_soviet_union_2_goal:0 "[SCOPE.gsInterestGroup('trade_unions_ig').GetName] has decided to launch the revolution!"
je_soviet_union_2_tt:0 "This [concept_country]’s [concept_revolution] is far from over!"

DSK_russia.17.t:0 "[concept_soviet_union] Civil War!"
DSK_russia.17.d:0 "October Revolution! [concept_soviet_union] Civil War!"
DSK_russia.17.f:0 "The provisional government of [ROOT.GetCountry.GetName] has been overthrown. Most members of the provisional government have been arrested!\n\nThe [concept_soviet_union] regime will propose an immediate democratic peace treaty to the peoples of all countries and cease hostilities on all fronts. The [concept_soviet_union] regime will guarantee that the lands of landlords, nobles, and monasteries will be transferred without compensation to the farmers' councils; it will completely democratize the army to protect the rights of soldiers; it will mandate workers to supervise production; it will ensure the timely convening of a constitutional assembly; it will strive to transport food to cities and essential goods to rural areas; it will guarantee that all nationalities within [SCOPE.sCountry('rus_scope').GetAdjective] enjoy genuine self-determination. The congress decided: all local powers will be transferred to the local workers, soldiers, and peasants' representatives of [concept_soviet_union], and all [concept_soviet_union] should be responsible for maintaining true revolutionary order. The congress calls on frontline soldiers to remain vigilant and calm. The [concept_soviet_union] congress firmly believes that until the new government has concluded a democratic treaty directly proposed to the peoples of all countries, the revolutionary army can defend the revolution from any imperialist infringement. The new government will take all measures to implement decisive policies of taxation on the bourgeoisie to ensure that the revolutionary army is supplied with everything it needs and to improve the living conditions of soldiers' families.\n\nSoldiers, actively resist Kornilov's forces led by Kerensky! Stay vigilant!\n\nRailway workers, stop all military trains sent to Petrograd by Kerensky!\n\nSoldiers, workers, and employees, the fate of the revolution and the fate of the democratic treaty are entirely in your hands!\n\n#red Long live the revolution!#!"
DSK_russia.17.a:0 "#v For the Motherland!!#!"


 je_soviet_union_3: "End the Civil War"
je_soviet_union_3_tt: "Crush the rebels, restore order, all power to the [concept_soviet_union]!"
je_soviet_union_3_reason: "At the outbreak of the civil war, the situation was extremely unfavorable for the Soviet government and the Red Army: various rebellions by the White Army and foreign intervention forces were colluding and spreading across the country. The rebellion and intervention against the [concept_soviet_union] were not only numerous and widespread, occupying most of Russia, but also surrounded the core areas controlled by the [concept_soviet_union] regime from all directions.\n\nMost officers and organized, combat-capable troops had turned to the opposing new regime. Due to the lack of specially trained and educated officers to command and organize, the Red Army was disorganized, lacked discipline, and had low combat effectiveness, unable to suppress the White Army, which was primarily composed of professional soldiers such as officers, military school cadets, and Cossacks."

DSK_russia.18.t: "To All Party Members, the Army, and All [concept_russian] People"
DSK_russia.18.d: "Today, the civil war in [concept_soviet_union] has ended!"
DSK_russia.18.f: "If the power is in the hands of [concept_soviet_union], then the land of the landlords will be declared property of all the people immediately.\n\nLook at what Kerensky and his government supported by the rich farmers, capitalists, and landlords are opposing!\n\nLook at whom they are calling for you to 'tolerate'—for whose benefit is it!\n\nDo you agree to 'tolerate' Kerensky using force to suppress the farmers who are rising for land?\n\nDo you agree to 'tolerate' them dragging the war on longer, delaying the peace treaty, and not abolishing the secret treaties made by the Tsar with Russian, British, and French capitalists?\n\nComrades! Remember, Kerensky promised to convene the Constituent Assembly; he has deceived the people once!\nOn July 8, he solemnly promised to convene the Constituent Assembly by September 17, but instead, he deceived the people. Comrades! Whoever trusts the Kerensky government is betraying their own brothers—the farmers and soldiers!\n\nNo, the people will not tolerate any delays for even one more day! We cannot tolerate using force to suppress farmers for one more day, nor can we tolerate letting thousands die in war when we can and should immediately propose a fair peace.\n\nDown with Kerensky’s government that conspires with the landlord generals to suppress and massacre farmers and drag out the war!\n\nAll power to the workers and soldiers’ representatives of [concept_soviet_union]!"
DSK_russia.18.a: "Immediately build our nation!"


je_crimea: "Crimean War"
je_crimea_reason: "[SCOPE.sCountry('fra_scope').GetName] #yellow Louis Bonaparte#! sent Marshal de La Valette to #yellow Constantinople#!, demanding the [SCOPE.sCountry('tur_scope').GetAdjective] court clearly acknowledge the [SCOPE.sCountry('fra_scope').GetAdjective] protection of most churches in the Holy Land. Regarding the Holy Land issue, [SCOPE.sCountry('tur_scope').GetAdjective] remained hesitant and dared not offend anyone.\n\nMarshal de La Valette reiterated the privileges [SCOPE.sCountry('fra_scope').GetAdjective] had obtained for centuries, threatening with force.\n\nThe Sultan ultimately yielded, officially issuing a decree in December 1852 to return the protection of the Holy Land to [SCOPE.sCountry('fra_scope')].\n\nThe sluggish [SCOPE.sCountry('rus_scope').GetAdjective] found itself in a very passive position; we reiterated the 1774 Russo-Turkish Treaty of Küçük Kaynarca, which stipulated that the Orthodox Church has higher exemptions and privileges than the Catholic Church, and there are also ambiguous terms open to interpretation by both sides. Both sides were unable to reach a consensus, and the crisis worsened day by day."


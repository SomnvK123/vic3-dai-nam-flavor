 #事件
 
 game_mod_events.1.t:0 "Welcome to the Age of Ming version 1.06."
 game_mod_events.1.d:0 "本模组由#BLUE 桑榆#!制作，使用了#BLUE 变身大民#!模组的素材包，世界观架构来源于#RED Zhult#!，封面图由#RED 小玄学#!绘制，对他们表达感谢。本mod事件图来自#RED TheMoonOfLocy#!使用AI绘图提供。同时本mod英文翻译部分由#RED Swan#!提供"
 game_mod_events.1.f:0 "本mod尚在测试中，试图做出一个庞大世界观的架空模组，为相关国家做出独特的机制和剧情体验。如果你遇到了bug或者有特殊的想法和灵感，希望即时与作者沟通交流，请加入#BOLD 粉丝群：593708089#!\n本次更新内容：\n1，修复了皇汉崛起的相关问题\n2，修改了五军都督府叛乱和摊丁入亩失败的判定和失败惩罚，将会分别触发军阀叛乱和农民起义。\n3，对一些建筑进行了一些调整。"
 game_mod_events.1.a:0 "我知道了"
 
 game_mod_events.2.t:0 "The Battle of Luchuan"
 game_mod_events.2.d:0 "Our advance in the Southwest has incurred the displeasure of all the Tusi, and the Southwest Tusi have banded together and launched a revolt against us."
 game_mod_events.2.f:0 "The southwestern Tusi kingdoms, who do not submit to the king's influence, are following the example of the Endeavouring Mantis with the number of their districts."
 game_mod_events.2.a:0 "We will destroy them all."
 
 game_mod_events.3.t:0 "The battle is over."
 game_mod_events.3.d:0 "Our crusade in the Southwest is finally over, it's been a long day of soldiers suffering in the jungles of the Southwest, and countless of our compatriots perishing in the miasma, but it's finally over."
 game_mod_events.3.f:0 "There is no need to bury your bones in the mulch, there are no green hills in life."
 game_mod_events.3.a:0 "Go home, soldiers."
 
 ming_events.1:0 "The Poll Tax System"
 ming_events.1.t:0 "The Residual Poll Tax System"
 ming_events.1.d:0 "For thousands of years, the poll tax has been an important source of revenue in China. The total population was counted through household registration, and then the tax per capita was calculated based on the population. This was the cornerstone of stable imperial governance. However, this tax system was not without its flaws. Cases of hidden population were not uncommon, and it greatly suppressed the fertility desire of the Chinese people since having an additional person meant paying more taxes."
 ming_events.1.f:0 "The former Prime Minister of China, Zhang Juzheng, once implemented a law called the "One Whip Tax Law" to reform the head tax system. However, it ultimately ended in failure. Now, we should learn from the past and complete a thorough reform of the tax system."
 ming_events.1.a:0 "We must implement the taxation system based on the area of cultivated land!"
 
 ming_events.2.t:0 "Suppress Gentry"
 ming_events.2.d:0 "This is an almost lunatic decision. The empire has finally decided to take action against the gentry that has been troubling the court for a long time! A series of preferential conditions for the gentry have been cancelled, and many civil officials have shown incredible shock. The court has instantly become chaotic! The Ming Dynasty has finally ushered in a turning point in history."
 ming_events.2.f:0 "We will only grow more extreme!"
 ming_events.2.a:0 "This is only our first step"
 
 ming_events.3.t:0 "Gentry Privileges"
 ming_events.3.d:0 "Scholar-officials have been the cornerstone of China's administrative system, maintaining the Confucian tradition and upholding the mandate of heaven. They are the foundation of our ability to operate a vast empire and our tax system. Therefore, it is understandable to provide them with some preferential treatment. Since the reign of Emperor Hongwu, we have provided preferential treatment to scholars and officials in the form of the imperial examination system and comprehensive tax reductions."
 ming_events.3.f:0 "This does not mean that we will continue!"
 ming_events.3.a:0 "Gentry Privileges will eventually be replaced!"
 ming_events_3_tt:0 "If we want to solve the problem of land being privately owned by the gentry in our country, we must conduct a comprehensive measure of all land holdings."
 
 ming_events.4.t:0 "Successfully finished the measurement in [SCOPE.sState('current_measuring_provinces').GetName]"
 ming_events.4.d:0 "After the industrious works, we have finished the measurement in [SCOPE.sState('current_measuring_provinces').GetName], all the relevant information of farmland has been recorded and sent to the imperial court. No one can falsify the actual situation anymore."
 ming_events.4.f:0 "This is the first step to strengthen control over the local governments."
 ming_events.4.a:0 "Very well!"
 
 ming_events.5.t:0 "heavy corruption in [SCOPE.sState('current_measuring_provinces').GetName]"
 ming_events.5.d:0 "In [SCOPE.sState('current_measuring_provinces').GetName],Measuring land has encountered unprecedented difficulties, as we have discovered a large amount of land that was privately owned by government officials. If we act rashly, it could cause significant turbulence in the local official circles."
 ming_events.5.f:0 "This is clearly the public corruption!"
 ming_events.5.a:0 "Stop all the investigations!"
 ming_events.5.b:0 "Investigate all corrupt officials!"
 
 ming_events.6.t:0 "The royal property in [SCOPE.sState('current_measuring_provinces').GetName]"
 ming_events.6.d:0 "In[SCOPE.sState('current_measuring_provinces').GetName],the measurement has encountered a difficulty. In [SCOPE.sState('current_measuring_provinces').GetName]We have discovered a huge amount of imperial estates that are exempt from taxes and all of their income belongs to the emperor personally. Should we include these private imperial estates in the books?"
 ming_events.6.f:0 "This is the royal property, are you lunatic?"
 ming_events.6.a:0 "Ignore this property."
 ming_events.6.b:0 "We should treat everyone equally."
 
 ming_events.7.t:0 "The measurement in[SCOPE.sState('current_measuring_provinces').GetName] has no progress."
 ming_events.7.d:0 "[SCOPE.sState('current_measuring_provinces').GetName]The situation in the region is complex and we have not made any progress. The investigation will continue to be carried out."
 ming_events.7.f:0 "It is a common situation where incoming officials face unexpected challenges and need time to adapt to the complex local situation."
 ming_events.7.a:0 "I understand."
 ming_events.7.b:0 "Don't stop! Everyone needs to work overtime!"
 
 ming_events.8.t:0 "Collusion of merchants and officials in [SCOPE.sState('current_measuring_provinces').GetName]"
 ming_events.8.d:0 "In our investigation, we found out that in [SCOPE.sState('current_measuring_provinces').GetName], the local businessmen colluded with the local government and occupied a large amount of farmland for other purposes, but this area was registered by the local government as uncultivated wasteland."
 ming_events.8.f:0 "This is obviously collusion between officials and merchants, which must be stopped!"
 ming_events.8.a:0 "Punish the local government and merchants."
 ming_events.8.b:0 "As long as they pay the back taxes, we can overlook it."
 
 ming_events.21.t:0 "Military corruption in [SCOPE.sState('current_measuring_provinces').GetName]"
 ming_events.21.d:0 "In our investigation, we found out that in[SCOPE.sState('current_measuring_provinces').GetName]The military has occupied a large amount of fertile land under the pretext of garrison farming. The soldiers of the garrisons have become serfs and work as farmers for their superiors, and they are exempt from all taxes under the pretext of garrison farming."
 ming_events.21.f:0 "It's outrageous！"
 ming_events.21.a:0 "Investigate thoroughly！"
 ming_events.21.b:0 "Don't enrage the army."
 
 ming_events.9.t:0 "Fanzhen throughout the country"
 ming_events.9.d:0 "In resisting the Qing Dynasty, many heroes and brave people emerged in various regions, creating the numerous warlords that exist in our country today. They are a favorable barrier for us to resist external enemies, but at the same time they also threaten our rule."
 ming_events.9.f:0 "We should quickly weaken their influence and let the emperor regain centralized power!"
 ming_events.9.a:0 "I understand."
 ming_events_9_tt:0 "The feudal lords control the border areas of our country, and we must handle them carefully"
 
 ming_events.10.t:0 "The warlords are in rebellion"
 ming_events.10.d:0 "The out-of-control warlords have started a riot, and the generals who were holding down the four quarters have suddenly turned on the government, plunging the empire into chaos."
 ming_events.10.f:0 "Pray that the heavens will continue to bless our rule and counter-insurgency against these rebels"
 ming_events.10.a:0 "The Ming Dynasty will continue to revive!"
 ming_events.10.b:0 "Da Shun will take over the world!"
 ming_events.10.c:0 "The Great Western will unify China!"
 ming_events.10.h:0 "The Zheng will reorganize the kingdom!"
 
 ming_events.11.t:0 "Problem of Northern Territory"
 ming_events.11.d:0 "Over a hundred years ago, we defeated the Qing army and reclaimed vast territories. However, General Zheng was defeated in Yanjing, and the regions of Liaodong and Yanyun have always been the land that haunts our imperial dreams. Now it's time to bring them back under our rule!"
 ming_events.11.f:0 "The smell of blood and dust from the invasion spreads throughout the land, loyal and righteous people are filled with sorrow and grief.\nThe mountains and rivers of my homeland have all changed their colors, the palaces and towers of the old capital have turned into hills.\nWhen will I take revenge and settle old scores? I swear not to rest until I have captured Loulan."
 ming_events.11.a:0 "Reclaim the lost territory！"
 
 ming_events.12.t:0 "The Recapture of the Northeast"
 ming_events.12.d:0 "Finally, we have reclaimed our lost land through iron and blood, proving that we are the only legitimate rulers of China."
 ming_events.12.f:0 "The sun, the moon, the rivers, the mountains, all majestic parts of China."
 ming_events.12.a:0 "Long live the Ming dynasty!"
 ming_events.12.b:0 "Relocate to the old capital！"
 
 ming_events.13.t:0 "The Forgotten Land"
 ming_events.13.d:0 "For the Han people who have become accustomed to their current way of life, their compatriots in Northeast China have become dispensable. Perhaps it is not they who need to be saved, but rather ourselves."
 ming_events.13.f:0 "Beijing and Liaodong are no longer seen as our lost land, and this will be a permanent pain for our nation.。"
 ming_events.13.a:0 "The end."
 
 ming_events.14.t:0 "The Future of the Nation"
 ming_events.14.d:0 "The Manchu Khanate has become history, and the Manchu people have become ordinary tribal subjects under imperial rule. How should we face these people who have newly joined our empire?"
 ming_events.14.f:0 "For several hundred years since the Song Dynasty, hostility made it difficult for our people to accept them as a part of us, but animosity towards them also led to unrest in new territories."
 ming_events.14.a:0 "Han or Manchu, all are subjects of Ming!"
 ming_events.14.b:0 "The barbarians outside the Shanhai Pass have no right to make demands!"
 
 ming_events.15.t:0 "Enemies outside of the Pass"
 ming_events.15.d:0 "The Manchu people and us are still in a state of confrontation. Sometimes our relationship will ease, and sometimes conflicts will intensify, but it never ceases."
 ming_events.15.f:0 "The empire has to solve the problem."
 ming_events.15.a:0 "May God bless [SCOPE.GetRootScope.GetCountry.GetName]。"
 
 ming_events.16.t:0 "The End of Nomadics"
 ming_events.16.d:0 "For thousands of years, the nomadic peoples have been a threat to the Central Plains, but today, all of this is going to change.[SCOPE.GetRootScope.GetCountry.GetName]has already enough power to end the problem of Nomadic for Good."
 ming_events.16.f:0 "We will guarantee the peace of the Steppe."
 ming_events.16.a:0 "Under [SCOPE.GetRootScope.GetCountry.GetName]'s reign, all Nomadic regions will be united."
 ming_events.16.b:0 "Those barren lands are not worth our efforts."
 
 ming_events.17.t:0 "The End of the Nomadic Era"
 ming_events.17.d:0 "After a long struggle, the entire Northwest region has come under the rule of the great emperor of [SCOPE.GetRootScope.GetCountry.GetName]. Now it is time to address the issue of the Mongolian people's status."
 ming_events.17.f:0 "How should we treat these newly incorporated people in our country?"
 ming_events.17.a:0 "They will be the subjects of [SCOPE.GetRootScope.GetCountry.GetName]"
 ming_events.17.b:0 "We do not associate ourselves with these barbarians, and the Han people will pioneer the Western Regions on their own.。"
 
 
 cnl_events.1.t:0 "The Exploration of the New World"
 cnl_events.1.d:0 "They have built their country for several decades, and the people live and work in peace and contentment. Thriving cities have been established along the coast. However, some radical young people are not satisfied with the status quo. They believe that continuing to pioneer towards the east would be beneficial for our country's continued growth and expansion, and that only by continuously pushing forward can we find new opportunities."
 cnl_events.1.f:0 "However, I assume that those who have just settled on the land have no interest in this."
 cnl_events.1.a:0 "Go east!"
 cnl_events.1.b:0 "It is better to focus on developing the local areas first."
 
 cnl_events.2.t:0 "People's Assembly of Leju"
 cnl_events.2.d:0 "The Leju People's Assembly is waiting on the agenda, we should choose an agenda to start the discussion."
 cnl_events.2.f:0 "Select an agenda."
 cnl_events.2.a:0 "Environmental Protection Bill"
 cnl_events.2.b:0 "Workers' Bill of Rights"
 cnl_events.2.c:0 "Colonial pioneering bill"
 cnl_events.2.g:0 "National Guard Conscription Act"
 cnl_events.2.h:0 "Education Investment Act"
 cnl_events.2.i:0 "Retirement Security Act"
 cnl_events.2.j:0 "Reclaiming Farmland Act"
 cnl_events.2.k:0 "Native Title Act"
 cnl_events.2.l:0 "Free Trade Act"
 cnl_events.2.m:0 "Mining Extraction Act"
 cnl_events.2.n:0 "Compulsory Military Service Act"
 cnl_events.2.o:0 "Legislature expansion"
 cnl_events.2.p:0 "Emergency anti-American bill"
 cnl_events.2.q:0 "Villager's Bill of Rights"
 cnl_events.2.r:0 "National Religious Status Act"
 cnl_events.2.s:0 "Hazard Security Act"
 cnl_events.2.t:0 "Hazard Security Act"
 cnl_events.2.u:0 "This matter is temporarily tabled"
 
 ming_events.18.t:0 "Yuannan Regional Agency"
 ming_events.18.d:0 "Since Zheng He opened the Nanyang route, trade ports for trading with indigenous people gradually formed in the Far South. Over the course of a century, they grew and prospered, eventually becoming today's Yuannan Regional Agency. However, after the establishment of the Agency, the center of the Ming dynasty gradually shifted to domestic affairs, and the connection with the Garrison gradually weakened and faded."
 ming_events.18.f:0 "Beyond the seas, there is an island called Far South, 50,000 li away from China, beyond the bounds of the known world. Its people have opened up the land from scratch in the midst of desolation, and have received our grace and education. It has been 131 years since they came under our rule." - "The Great Ming Dynasty Map of All Nations"
 ming_events.18.a:0 "Start the Work"
 
 ming_events.19.t:0 "The Choice of Lizhou"
 ming_events.19.d:0 "Lizhou was once the farthest territory of the Ming dynasty, and tens of thousands of goldminers were encouraged by the immigration institutions to move to this place. However, after #BOLD San Francisco Silk Party#! Lizhou expelled officials of the Ming Dynasty and established a republican government. Several years have passed and the relationship between Ming and Lizhou has improved. We should re-evaluate our policy towards Ming.。"
 ming_events.19.f:0 "To the east of China by ten thousand li, lies a land known as Lizhou. It is the land of the rising sun, rich in gold mines and without a sovereign state. There the climate is similar to that of the Central Plains, and thus many Ming people migrated there. - "The Great Ming Dynasty Map of All Nations""
 ming_events.19.a:0 "Reconcile with Ming dynasty."
 ming_events.19.b:0 "Terminate all connections with the Ming dynasty."
 
 ming_events.20.t:0 "The End of Ming Dynasty"
 ming_events.20.d:0 "After nearly five hundred years, the Ming Dynasty came to an end. Internal turmoil and political upheavals dealt the final blow to this vast empire, as ambitious officials and warlords quickly disintegrated the empire. Does the Ming Dynasty have a chance to rebuild its empire？"
 ming_events.20.f:0 "The gushing waters of Yang River pour and disappear into the East, washing away past heroes.\nTheir failures and triumphs, all vanish into nothingness in an instance\nYet, the free hills stood as before, along with the perpetual sunset\nA gray-haired man fishes and splits firewood in a small island, accustomed observing the autumn moons and feeling the spring winds. \nA good old friend comes by happily with a bottle of crude wine. \nTales, old and new, shall all then be wrapped in laughter!"
 ming_events.20.a:0 "The Ming will revive!"
 ming_events.20.b:0 "The Great Shun will take the power!"
 ming_events.20.c:0 "The Great Xi will unite China!"
 ming_events.20.h:0 "The clan of Zheng will clean up the mess!"
 
 ming_events.22.t:0 "Implement the New Tax Law"
 ming_events.22.d:0 "The old tax laws are no longer suitable for China's national conditions, and we need to promulgate new laws."
 ming_events.22.f:0 "Completely abolish the Poll Tax, and we will obtain a more efficient government."
 ming_events.22.a:0 "Long live our Mandate of Heaven!"
 
 ming_events.23.t:0 "Border Conflicts in [SCOPE.sState('duoqu_diqu').GetName]"
 ming_events.23.d:0 "With the resolute stance of our military, we have claimed control over the [SCOPE.sState('duoqu_diqu').GetName] region."
 ming_events.23.f:0 "We will conquer the region!"
 ming_events.23.a:0 "Long live[SCOPE.GetRootScope.GetCountry.GetName]！"
 
 ming_events.24.t:0 "The End of the Fanzhen Era"
 ming_events.24.d:0 "All the vassal states have lost their power, and we have centralized all power."
 ming_events.24.f:0 "he chaotic Fanzhen era has ended, from now on, there will only be the army of Great Ming.。"
 ming_events.24.a:0 "Long live[SCOPE.GetRootScope.GetCountry.GetName]！"
 
 ming_events.25.t:0 "The Request of Northeast"
 ming_events.25.d:0 "The Greater Khingan Range has been our land since ancient times, but Russia illegally occupied it during our confrontation with the Qing Dynasty. We do not recognize any unequal treaties and vow to protect the integrity of our territory."
 ming_events.25.f:0 "Russia must return the Greater Khingan Range!"
 ming_events.25.a:0 "Expel the Russian immigrants!"
 
 ming_buy_manchu:0 "We agree to use diplomatic means before resorting to force, and are willing to purchase the Greater Khingan Range from Russia. However, if they refuse, we may use military force against them."
 
 ming_events.26.t:0 "Unreasonable Request From China"
 ming_events.26.d:0 "We obtained the legal rights to the Outer Northeast region through our trade with the Qing government. However, the Chinese government no longer recognizes the legitimacy of our rights and openly demands that we return this land. The Outer Northeast is a strategic stronghold that we have conquered, and we cannot simply give it up."
 ming_events.26.f:0 "Russia is huge, but no land is unneeded."
 ming_events.26.a:0 "If they want the land, they have to pay."
 ming_events.26.b:0 "No one can take the land from Russians."
 
 ming_events.27.t:0 "Land Hegemony"
 ming_events.27.d:0 "We already have a huge land army that can shake the whole world, and they are enough to support our domination of the whole world."
 ming_events.27.f:0 "The sun is rising on the empire."
 ming_events.27.a:0 "Our eyes look to the continent."
 
 ming_events.28.t:0 "Hegemony of the seas"
 ming_events.28.d:0 "We already have an invincible fleet that can shake the whole world, and they are enough to support our domination of all the great oceans."
 ming_events.28.f:0 "The empire's seas are endless."
 ming_events.28.a:0 "Our eyes look to the deep sea."
 
 ming_events.29.t:0 "Nationalist ideas spread"
 ming_events.29.d:0 "As nationalist ideas continued to brew and spread, one of our politicians transformed into a fervent nationalist and wanted to build the empire into a pure nation-state."
 ming_events.29.f:0 "Every poor, miserable fool who does not have one thing in this world of which he can be proud has only one last trick up his sleeve: pride in the nation to which he belongs. From this he is compensated. So, full of gratitude, he is ready to defend with "teeth and nails" all the shortcomings and folly that characterize his own people. ---Schopenhauer"
 ming_events.29.a:0 "The Age of Nationalism"
 
 ming_events.30.t:0 "xenophobic movements"
 ming_events.30.d:0 "Because of the unprecedented fervor of nationalism, the Han Chinese in the region of [SCOPE.sState('baoluan_provinces').GetName] began to launch a campaign of purging the foreigners by storming into their homes, ransacking their possessions, and burning down their mansions, leaving behind bloodstains all over the ground."
 ming_events.30.f:0 "What did you do? \n Nothing, just what a common patriot should do. These barbarians shouldn't have stayed in [SCOPE.sState('baoluan_provinces').GetName], they had it coming. I am merely exercising the will of the Heavenly Han in the place of Heaven, and Heaven blesses the Great Han, does it not?"
 ming_events.30.a:0 "It's not our fault, who made them not leave [SCOPE.sState('baoluan_provinces').GetName]?"
 
 je_land_or_sea:0 "Sea power or land power"
 je_land_or_sea_reason:0 "Our country was inevitably drawn into the disputes of the great powers and joined the world stage. Yet with limited civil power, our country could only choose one course of development. We can choose to become a land power state with a huge land army, or build an invincible fleet that will dominate the oceans."
 ming_haiquan:0 "CHINA Sea Power"
 ming_luquan:0 "CHINA land power"
 
 je_huanghan:0 "Hanjo frenzy"
 je_huanghan_reason:0 "Hanjo represents the fervor of our national emotions, the higher the national fervor will give us better bonuses."
 
 button_hh1:0 "Into the wealth."
 button_hh1_desc:0 "Our nation is united, and we can destroy our family for the future of our nation."
 
 button_hh2:0 "Picket the traitors."
 button_hh2_desc:0 "It is hard to imagine that even now, there are still a large number of traitors in our country who betray the nation. We need to eliminate all these dissidents against the nation."
 
 button_hh3:0 "Compliments on the virtuous government."
 button_hh3_desc:0 "Under our rule, the status of the Han nation is back on track, and we should vigorously celebrate this merit and strengthen our government."
 
 button_hh4:0 "Expansion of Han land"
 button_hh4_desc:0 "Where the sun and moon shine, all is Han land. There is no end to our existence."
 
 ming_dezheng:0 "All people are one"
 ming_pantu:0 "All people purge."
 
 xuanweisi_events.11.t:0 "Survival space"
 xuanweisi_events.11.d:0 "We need to keep fighting for our nation's survival space, and now that we've determined that [SCOPE.sState('xuanweisi_hanhua').GetName] is essentially a part of our survival space, the barbarians in this place have already been largely purged. Only the final step remains."
 xuanweisi_events.11.f:0 "That's it, keep expanding the living space of our people!"
 xuanweisi_events.11.a:0 "Long live the Great Han!"
 
 je_abolish_poll_tax:0 "Taxation Based on Cultivated Land"
 je_abolish_poll_tax_reason:0 "The household registration system used to be a solid foundation in[SCOPE.GetRootScope.GetCountry.GetName]but this system may not be suitable for the development of the times. The head tax has become a burden for the vast majority of common people and hindered population growth.#BOLD Taxation Based on Cultivated Land#!is our best choice at present. We will abolish the head tax and change the taxation system to be based on actual land ownership. All tax exemptions established by #BOLD Emperor Hongwu#! will be abolished"
 je_abolish_poll_tax_goal:0 "Finishing the reform will make the populace of [SCOPE.GetRootScope.GetCountry.GetName] free from the suppression of #BOLD the poll tax#!"
 je_abolish_poll_tax_success:0 "For the reformation we need：\nFirst,suppress domestic #BLUE gentry#!\nSecond, starting the national wise #BOLD measurement of land#!。\nthird, implementing new tax laws and abolish #BOLD the poll tax#! completey!"
 fail_to_abolish_poll_tt:0 "The harsh exploitation has led to a major uprising that is brewing among people."
 new_law_ming:0 "A new tax law will be implemented!"
 
 je_measuring:0 "The national measurement of land"
 je_measuring_reason:0 " [SCOPE.GetRootScope.GetCountry.GetName] is a vast empire, which means that our land situation is complex, and hiding land and tax evasion are common on imperial land. Therefore, we must conduct a thorough land survey to understand the specific situation of our empire."
 je_measuring_goal:0 "The land of [SCOPE.GetRootScope.GetCountry.GetName] will be measured completely."
 je_measuring_success:0 "A detailed national agricultural map was presented to the imperial court."
 fail_to_measuring_tt:0 "Failed to finish the measurement in time"
 
 je_recover_beijing:0 "Recapturing the Sixteen Prefectures"
 je_recover_beijing_reason:0 "Beijing and Liaoning have always been an inseparable part of us, but since the Manchu rebellion against the imperial court in 1627, these two places have gradually fallen under the rule of the Qing Dynasty. After the unsuccessful Beijing Battle in 1672, we have been stationed south of the Yan Mountains for almost two hundred years. It is time to recover them!"
 recover_beijing_tt:0 "The people of [SCOPE.GetRootScope.GetCountry.GetName] cannot tolerate the Sixteen Prefectures and Liaodong always being outside our control!"
 shoufu_yanyun_tt:0 "The final return of the old land"
 fail_to_shoufu_yanyun_tt:0 "We failed to recover the Sixteen Prefectures, and with the solidification of nationalism, a new national identity has emerged here."
 yanyun_provinces:0 "the Sixteen Prefectures"
 
 je_solve_monglian:0 "The end of the Nomadic tribes"
 je_solve_monglian_reason:0 "Nomadic peoples have been a problem that has plagued China for nearly a thousand years, and the rise of the Dzungar tribe in the northwest has been going on for more than a hundred years. If we cannot solve the problem of nomadic peoples as soon as possible, they may cause unimaginable troubles for us in the future."
 je_solve_monglian_goal:0 "There cannot be any nomadic state that continues to exist. Please completely eliminate Dzungar and Mongolia."
 je_solve_monglian_success_tt:0 "Outside or inside of the Great Wall are all the land of the empire!"
 
 je_zheng_army:0 "Issue of Zheng's army"
 je_zheng_army_reason:0 "The Zheng family were heroes of the Ming Dynasty, who persisted in resisting the enemy during the country's crisis. However, with the passage of time, they have become stubborn warlords, and it's time for them to retire peacefully."
 je_zheng_army_goal:0 "We should expel the Zheng family from the imperial court."
 je_zheng_army_success:0 "The army has been purged."
 
 je_end_Qing:0 "The end of Qing"
 je_end_Qing_reason:0 "We can no longer tolerate the existence of the Qing Dynasty. In order to demonstrate that we are the only legitimate rulers of the world, we must completely eliminate the Qing government."
 je_end_Qing_tt:0 "Qing is going to an end, and this is our concluding moment..."
 fail_je_end_Qing_tt:0 "We missed the chance to completely eliminate the Qing."
 
 je_nuergan_china:0 "Reestablishing the Nurgan Regional Military Commission "
 je_nuergan_china_reason:0 "The Nurgan Regional Military Commission was once the administrative institution of the Ming Dynasty in the northeast region. Now, we should try to rebuild the Nuerhachi Dusi to replace the Qing Dynasty's rule and reapply our influence."
 
 je_ming_xixue:0 "The spread of Western learning"
 je_ming_xixue_reason:0 "Some things brought to us by Western scholars exceed our cognition. Although the empire of [SCOPE.GetRootScope.GetCountry.GetName] has everything, we still need to pay attention to the knowledge brought by these Westerners. I hope we can launch a comprehensive study of Western technology before it's too late."
 je_ming_xixue_goal:0 "Raise the literacy rate of the people of [SCOPE.GetRootScope.GetCountry.GetName] to 20%."
 je_ming_xixue_tt:0 "The process of learning the Western will greatly inspire our scholars."
 
 je_zhimin_cny:0 "The dependency to Ming of [SCOPE.GetRootScope.GetCountry.GetName]"
 je_zhimin_cny_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] and Ming maintain a subtle connection, which reflects Ming's control over us. The dependence increases by 0.5 every month."
 je_zhimin_cny_goal:0 "A high control will enable Ming to directlyinfluence [SCOPE.GetRootScope.GetCountry.GetName]."
 je_zhimin_cny_tt:0 ""
 je_not_high_cny:0 "The dependency to Ming is lower than 20."
 uo
 je_zhimin_MNG:0 "The agency of barbaric control"
 je_zhimin_MNG_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] maintains close relations with its vassal states and communicates with them through the agency of barbaric control. Here you can view the situation of the provinces established by our country abroad."
 je_zhimin_MNG_goal:0 "oversee governing agencies \n[GetPlayer.MakeScope.Var('jibei_fushu').GetCountry.GetName]'s dependency to[GetPlayer.MakeScope.Var('ming_fushu').GetCountry.GetName]：[GetPlayer.MakeScope.Var('jibei_fushu').GetCountry.MakeScope.Var('ming_cny_tracker').GetValue] \n[GetPlayer.MakeScope.Var('xifeng_fushu').GetCountry.GetName]'s dependency to[GetPlayer.MakeScope.Var('ming_fushu').GetCountry.GetName]：[GetPlayer.MakeScope.Var('xifeng_fushu').GetCountry.MakeScope.Var('ming_cny_tracker').GetValue] \n[GetPlayer.MakeScope.Var('yingan_fushu').GetCountry.GetName]'s dependency to[GetPlayer.MakeScope.Var('ming_fushu').GetCountry.GetName]：[GetPlayer.MakeScope.Var('yingan_fushu').GetCountry.MakeScope.Var('ming_cny_tracker').GetValue] \n[GetPlayer.MakeScope.Var('yangshan_fushu').GetCountry.GetName]'s dependency to[GetPlayer.MakeScope.Var('ming_fushu').GetCountry.GetName]：[GetPlayer.MakeScope.Var('yangshan_fushu').GetCountry.MakeScope.Var('ming_cny_tracker').GetValue] \n[GetPlayer.MakeScope.Var('huangyuan_fushu').GetCountry.GetName]'s dependency to[GetPlayer.MakeScope.Var('ming_fushu').GetCountry.GetName]：[GetPlayer.MakeScope.Var('huangyuan_fushu').GetCountry.MakeScope.Var('ming_cny_tracker').GetValue] \n[GetPlayer.MakeScope.Var('tianzhu_fushu').GetCountry.GetName]'s dependency to[GetPlayer.MakeScope.Var('ming_fushu').GetCountry.GetName]：[GetPlayer.MakeScope.Var('tianzhu_fushu').GetCountry.MakeScope.Var('ming_cny_tracker').GetValue] \n[GetPlayer.MakeScope.Var('hezhong_fushu').GetCountry.GetName]'s dependency to[GetPlayer.MakeScope.Var('ming_fushu').GetCountry.GetName]：[GetPlayer.MakeScope.Var('hezhong_fushu').GetCountry.MakeScope.Var('ming_cny_tracker').GetValue] \n[GetPlayer.MakeScope.Var('miandian_fushu').GetCountry.GetName]'s dependency to[GetPlayer.MakeScope.Var('ming_fushu').GetCountry.GetName]：[GetPlayer.MakeScope.Var('miandian_fushu').GetCountry.MakeScope.Var('ming_cny_tracker').GetValue] \n[GetPlayer.MakeScope.Var('xianluo_fushu').GetCountry.GetName]'s dependency to[GetPlayer.MakeScope.Var('ming_fushu').GetCountry.GetName]：[GetPlayer.MakeScope.Var('xianluo_fushu').GetCountry.MakeScope.Var('ming_cny_tracker').GetValue] \n[GetPlayer.MakeScope.Var('honglin_fushu').GetCountry.GetName]'s dependency to[GetPlayer.MakeScope.Var('ming_fushu').GetCountry.GetName]：[GetPlayer.MakeScope.Var('honglin_fushu').GetCountry.MakeScope.Var('ming_cny_tracker').GetValue]"
 
 je_ming_warlord:0 "The Governor Office of the Five Armies"
 je_ming_warlord_reason:0 "The Governor Office of the Five Armies are the systematic organizations for generals and commanders of the Imperial Army. They are in charge of the country's military affairs, and due to the legacy of the Wei system, many organized military forces have their own land and influence. On the one hand, they are the backbone of the empire's resistance against external enemies, and on the other hand, they have also caused a lot of trouble for the empire. We must treat them rationally and reform them gradually."
 je_ming_warlord_goal:0 "Ways to change the influence of warlords are as follows:\n1.The influence of the military force increases when it holds a pivotal position in the army.\n2.he influence of the military force increases when it holds a position in the government.\n3.Supporting a faction within the military force increases its influence.\n4.The influence of the military force increases when it takes a stance below neutral.\n5.Oppressing the military force decreases its influence.\n6.The influence of the military force decreases when it belongs to a marginalized faction.\n7.The influence of the military force decreases when it is loyal.\n8.During a war with foreign nations, the military force's influence expands, and its loyalty increases."
 je_ming_warlord_fail:0 "If these warlords are overpower or rebellious, then outcome will be disastrous....."
 je_ming_warlord_tt:0 "#BOLD Military reform will abolish The Governor Office of the Five Armie completely and replacing it with the Ministry of National Defense #!\nWays to change the influence of warlords are as follows:\n1.The influence of the military force increases when it holds a pivotal position in the army.\n2.he influence of the military force increases when it holds a position in the government.\n3.Supporting a faction within the military force increases its influence.\n4.The influence of the military force increases when it takes a stance below neutral.\n5.Oppressing the military force decreases its influence.\n6.The influence of the military force decreases when it belongs to a marginalized faction.\n7.The influence of the military force decreases when it is loyal.\n8.During a war with foreign nations, the military force's influence expands, and its loyalty increases\n9.Adding the military expense will increase their loyalty and decrease the power\n10.Decisions of the Ministry of War that are beneficial to the military can increase their loyalty."
 je_ming_warlord2_tt:0 "Losing the influence of military buff。"
 ming_warlord_like_1:0 "The army's attitude to the imperial court:#GREEN Loyal#!"
 ming_warlord_like_2:0 "The army's attitude to the imperial court:#BLUE Recognizing#!"
 ming_warlord_like_3:0 "The army's attitude to the imperial court:#BOLD Submissive#!"
 ming_warlord_like_4:0 "The army's attitude to the imperial court:#YELLOW Neutral#!"
 ming_warlord_like_5:0 "The army's attitude to the imperial court:#RED Dislike#!"
 ming_warlord_like_6:0 "The army's attitude to the imperial court:#RED Rebellious#!"
 
 ming_warlord_open_de:0 "Open the section of the Ministry of War"
 ming_warlord_open_de_desc:0 "I've slain a million soldiers from Jiangnan, my precious sword still reeks of blood!"
 
 ming_warlord_close_de:0 "Close the section of the Ministry of War"
 ming_warlord_close_de_desc:0 "The old monk doesn't know heroes or men of honor, he just asks for your name incessantly."
 
 ming_warlord_1_de:0 "Promote military officers"
 ming_warlord_1_de_desc:0 "We should promote military officers to increase the power of military."
 
 ming_warlord_2_de:0 "Increase military spending"
 ming_warlord_2_de_desc:0 "We could expand funding for the military and improve its equipment. This would also increase central control over the military."
 
 ming_warlord_3_de:0 "Expand the recruitment of troops"
 ming_warlord_3_de_desc:0 "Our country's military strength needs adjustment, and we should increase our troop levels."

 ming_warlord_4_de:0 "Conscript the Wolf soldiers"
 ming_warlord_4_de_desc:0 "The Wolf soldiers of Guangxi have very strong combat capabilities, and we can mobilize them to serve us."

 ming_warlord_5_de:0 "Emergency mobilization"
 ming_warlord_5_de_desc:0 "The country is in crisis, and we should have the Five Military Governors carry out a nationwide mobilization."

 ming_warlord_6_de:0 "Pay attention to military equipment"
 ming_warlord_6_de_desc:0 "Our military equipment needs to be updated, and we should invest more resources into it."

 ming_warlord_7_de:0 "Thoroughly investigate corruption"
 ming_warlord_7_de_desc:0 "There is often corruption and embezzlement hidden within the military, and we can use this as an excuse to crack down on military influence."

 ming_warlord_8_de:0 "Grant land to Shunying"
 ming_warlord_8_de_desc:0 "Shunying's good performance deserves us to grant them a new piece of land."

 ming_warlord_9_de:0 "Grant land to Xiyin"
 ming_warlord_9_de_desc:0 "Xiyin's good performance deserves us to grant them a new piece of land."

 ming_warlord_10_de:0 "Grant land to the Wolf troops"
 ming_warlord_10_de_desc:0 "The Wolf troops' good performance deserves us to grant them a new piece of land."

 ming_warlord_11_de:0 "Grant land to the Zheng clan"
 ming_warlord_11_de_desc:0 "The Zheng clan's good performance deserves us to grant them a new piece of land."

 ming_warlord_12_de:0 "Grant land to Xuanda"
 ming_warlord_12_de_desc:0 "Xuanda Camp's good performance deserves us to grant them a new piece of land."

 ming_warlord_13_de:0 "Grant land to Yuyuan"
 ming_warlord_13_de_desc:0 "Yuyuan Camp's good performance deserves us to grant them a new piece of land."

 ming_warlord_14_de:0 "Revoke Shunying's land"
 ming_warlord_14_de_desc:0 "Continuing to allow warlords to control military power in the region is not beneficial to us. It's time to take back the land."

 ming_warlord_15_de:0 "Revoke Xiyin's land"
 ming_warlord_15_de_desc:0 "Continuing to allow warlords to control military power in the region is not beneficial to us. It's time to take back the land."

 ming_warlord_16_de:0 "Revoke the Wolf troops' land"
 ming_warlord_16_de_desc:0 "Continuing to allow warlords to control military power in the region is not beneficial to us. It's time to take back the land."

 ming_warlord_17_de:0 "Revoke the Zheng clan's land"
 ming_warlord_17_de_desc:0 "Continuing to allow warlords to control military power in the region is not beneficial to us. It's time to take back the land."
 
 ming_warlord_18_de:0 "Revoke Xuan Datan of land"
 ming_warlord_18_de_desc:0 "Continuing to let warlords control the military forces in the region is not good for us. It's time to take back the land."

 ming_warlord_19_de:0 "Revoke Yuyuan of land"
 ming_warlord_19_de_desc:0 "Continuing to let warlords control the military forces in the region is not good for us. It's time to take back the land."

 ming_warlord_20_de:0 "Create territorial conflicts"
 ming_warlord_20_de_desc:0 "Our officers crave war. We can have them provoke conflicts with neighboring countries, which can give us a claim to their land."

 ming_warlord_21_de:0 "Temporary incentives"
 ming_warlord_21_de_desc:0 "Officers like incentives. Rewarding them with money can greatly increase their satisfaction."

 ming_warlord_22_de:0 "Promote the navy"
 ming_warlord_22_de_desc:0 "The navy is also a backbone of our country's strength. We should promote navy soldiers."

 ming_warlord_23_de:0 "Scholar-official's supervision of the military"
 ming_warlord_23_de_desc:0 "We can promote a group of scholar-officials to supervise the army, which will effectively reduce the military's power."

 ming_warlord_24_de:0 "Reorganize the Ministry of War"
 ming_warlord_24_de_desc:0 "The Five Army Commanders' Office is outdated. It's time to reorganize the Ministry of War and establish the Ministry of National Defense!"

 ming_warlord_25_de:0 "Rectify the land"
 ming_warlord_25_de_desc:0 "This land was once controlled by warlords. Now we need to re-register and manage it."

 ming_warlord_26_de:0 "Acquire Aksai Chin"
 ming_warlord_26_de_desc:0 "Aksai Chin is an important supply line connecting the Tianshan and Ali regions. We should have the Ustang surrender it to us."

 ming_beijing_de_note:0 "Establish capital in Beijing"
 ming_beijing_de_note_desc:0 "We have returned to our original capital.
 
 ming_warlord_events.1.t:0 "Scholar-offcials and military officials"
 ming_warlord_events.1.d:0 "After the Tumu Crisis, the power of the the Governor Office of the Five Armies was gradually replaced by civil officials. The Ministry of War gradually took over the authority of the Governor Office of the Five Armies. General Zheng Chenggong restored this institution, but court officials were concerned about the expansion of the power of the Governor Office of the Five Armies"
 ming_warlord_events.1.f:0 "We must respond to the conflict between civil officials and military officers."
 ming_warlord_events.1.a:0 "Give the military officers full trust and increase military expenditures!"
 ming_warlord_events.1.b:0 "Implement a policy of suppressing the military with civil authority."
 ming_warlord_events.1.c:0 "At the same time, suppress both of them. We should use the treasury to repair the imperial palace!"
 
 ming_warlord_events.2.t:0 "Mutiny of the army in [SCOPE.sState('current_robbing_provinces').GetName]"
 ming_warlord_events.2.d:0 "Some soldiers in [SCOPE.sState('current_robbing_provinces').GetName] are dissatisfied with the meager treatment they receive and want to improve their lives by increasing military funding. They have gathered together to protest against the court, and we must handle them carefully."
 ming_warlord_events.2.f:0 "These people are simply lawless!"
 ming_warlord_events.2.a:0 "Send the imperial army to suppress these troublemakers."
 ming_warlord_events.2.b:0 "Pay for their demands."
 ming_warlord_events.2.c:0 "Tacitly allow their looting activities."
 
 ming_warlord_events.3.t:0 "The loot in[SCOPE.sState('current_robbing_provinces').GetName]"
 ming_warlord_events.3.d:0 "After our capture of[SCOPE.sState('current_robbing_provinces').GetName]，some unruly soldiers looted the local treasury and the city."
 ming_warlord_events.3.f:0 "Let it be"
 ming_warlord_events.3.a:0 "Punish all the criminals by the military law"
 ming_warlord_events.3.b:0 "Reward them with our treasury, so that they may stop"
 ming_warlord_events.3.c:0 "Let it be"
 
 ming_warlord_events.4.t:0 "The nepotism in military"
 ming_warlord_events.4.d:0 "A junior military officer committed a serious mistake and should be subject to trial by a military court according to the law. However, he has certain connections with [SCOPE.sCharacter('fubai_junguan').GetFullName], which allowed him to escape punishment brazenly."
 ming_warlord_events.4.f:0 "This is blatant corruption!"
 ming_warlord_events.4.a:0 "We must punish such behavior severely."
 ming_warlord_events.4.b:0 "As a highly accomplished military leader, [SCOPE.sCharacter('fubai_junguan').GetFullName] has the power."
 ming_warlord_events.4.c:0 "It seems that some positions in the military should be managed by scholar-officials."
 
 ming_warlord_events.5.t:0 "The military corruption"
 ming_warlord_events.5.d:0 "The corruption within the army has become very serious, with many projects running a deficit, and many lands that were originally designated for military farming inexplicably becoming the private property of some wealthy people."
 ming_warlord_events.5.f:0 "We must investigate the corruption within the army!"
 ming_warlord_events.5.a:0 "We must rectify the bad practices!"
 ming_warlord_events.5.b:0 "We must not tolerate such behavior within the army."
 
 ming_warlord_events.6.t:0 "Crappy uniforms"
 ming_warlord_events.6.d:0 "Our supplier provided a batch of inferior military uniforms, which made our soldiers very dissatisfied."
 ming_warlord_events.6.f:0 "Inferior military uniforms are not suitable for combat use at all, and the soldiers feel demoralized."
 ming_warlord_events.6.a:0 "Damn it."
 ming_warlord_events.6.b:0 "We must purchase a new batch of uniforms!"
 
 ming_warlord_events.7.t:0 "The expansion of military"
 ming_warlord_events.7.d:0 "One of the generals under our rule is attempting to expand their private army by deploying troops to [SCOPE.sState('duoqu_diqu').GetName] province."
 ming_warlord_events.7.f:0 "The military's power is constantly expanding, and it is difficult for us to contain them."
 ming_warlord_events.7.a:0 "Tacitly allow their expansion."
 ming_warlord_events.7.b:0 "Strictly prohibit such behavior, the military must be subject to the jurisdiction of the court!"

 ming_warlord_events.8.t:0 "Army mania"
 ming_warlord_events.8.d:0 "Unlike the old empire's discrimination against soldiers, serving in the military is now a hot profession in the Ming dynasty, and everyone is eager to do it."
 ming_warlord_events.8.f:0 "However, the military may take advantage of this opportunity to expand its power."
 ming_warlord_events.8.a:0 "Utilize this enthusiasm."
 ming_warlord_events.8.b:0 "Suppress this trend."
 
 ming_warlord_events.9.t:0 "Impeachment of military officials"
 ming_warlord_events.9.d:0 "Scholar-officials and arrogant military officials have never gotten along. Today, many scholar-officials have started impeaching the military officials, accusing them of dereliction of duty from various angles."
 ming_warlord_events.9.f:0 "It's really a headache."
 ming_warlord_events.9.a:0 "Refute the impeachment of scholar-officials"
 ming_warlord_events.9.b:0 "Implement punishment for military officials"
 

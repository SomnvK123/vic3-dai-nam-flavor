 je_ming_guofangbu_reason:0 "The Five Military Governors and the Ministry of War have become obstacles to modernizing our army. We must thoroughly reform them and establish a new Department of National Defense!"
 je_ming_guofangbu_success:0 "The Ministry of War and the Five Military Governors have lost their power, and a new institution has been established!"
 

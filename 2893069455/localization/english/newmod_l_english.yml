 xixue_events.1.t:0 "Arrival of Western Scholars"
 xixue_events.1.d:0 "A Western scholar from [SCOPE.sCountry('xuezhe_xixue').GetName] brought some Western knowledge and precision machinery to our court. "
 xixue_events.1.f:0 "He brought the skillfully contrived clockwork, the detailed calendar and the astonishingly novel knowledge on natural sciences. He brought the miracles to our court from the West!"
 xixue_events.1.a:0 "Interesting"
 
 xixue_events.2.t:0 "Missionary in Court"
 xixue_events.2.d:0 "A Western missionary from [SCOPE.sCountry('xuezhe_xixue').GetName] has come to our court，hoping to establish a church in [SCOPE.sState('xili_sheng').GetName]，for preaching their gospels in China. Perhaps, we could exploit it; however, we should be cautious of the spread of foreign beliefs."
 xixue_events.2.f:0 "God, you are my Lord, I will earnestly seek you. In a dry and weary land where there is no water, I long for you, my heart yearns for you.\n If I had cherished sin in my heart, the Lord would not have listened; but God has surely listened and has heard my prayer."
 xixue_events.2.a:0 "Expel the Pagan."
 xixue_events.2.b:0 "We do need him."
 
 xixue_events.3.t:0 "The Spread of Western Technology"
 xixue_events.3.d:0 "A kind of Western technology has spread to our country. We should take the chance to catch up."
 xixue_events.3.f:0 "What is they are good at is warships, machinery and philosophy. To balance against the barbarians, we must learn from their techniques against them."
 xixue_events.3.a:0 "Promote the spread!"
 xixue_events.3.b:0 "Don't be in a rush!"
 
 xixue_events.4.t:0 "Populace Rejecting Christianity"
 xixue_events.4.d:0 "The spread of Christianity within our provinces has sparked a wave of resistance among the populace, who find it difficult to accept this strange religion and the eerie churches spreading around them."
 xixue_events.4.f:0 "Listen，such a Western teaching is no good. Under the names of gospels, what they want is actually profits and territorial expansion. We have to expel such an evil teaching out of China!"
 xixue_events.4.a:0 "Christianity should be restricted."
 xixue_events.4.b:0 "What do these fools know!"
 
 xixue_events.5.t:0 "Official's Conversion to Christianity."
 xixue_events.5.d:0 "A minister in our country recently converted to Christianity and was baptized."
 xixue_events.5.f:0 "You acknowledge that everyone has sinned, and the wages of sin is death. Jesus is the only Messiah for all humanity, and only He can save all sinners. Would you be willing to accept Jesus as your Messiah?\n You acknowledge the sovereignty of the Holy Spirit in your life, as the Spirit illuminates, guides, and moves you. If you accept Jesus as your Messiah and are baptized, would you be willing to follow the guidance of the Holy Spirit and walk the path of God's will?\nYou acknowledge that the Bible is the inspired word of God and is the standard for every Christian, including you and me, to live by. If you are baptized, would you be willing to read the Bible more, love the Bible, and follow its teachings"
 xixue_events.5.a:0 "This is betrayal!"
 xixue_events.5.b:0 "He is free to do so."
 
 xixue_events.6.t:0 "Confucianism and the Western Learning"
 xixue_events.6.d:0 "With the introduction of Western learning into our country, the masters of Confucianism and Western knowledge began to confront each other, engaging in debates everywhere, each trying to prove that their own school of thought was the best for governing the country."
 xixue_events.6.f:0 "“A true Chinese can have both an adult mind and a childlike spirit. Therefore, the Chinese spirit is a spirit that allows youth to last forever and the nation to be immortal.”"
 xixue_events.6.a:0 "Confucianism is the foundation of our nation"
 xixue_events.6.b:0 "The Western learning is the way to improve our nation"
 
 xixue_events.7.t:0 "Western Academia"
 xixue_events.7.d:0 "A new-style academy was established in a province, where they taught Western science instead of Confucianism's ethical values. This new type of school provided us with new knowledge and insights."
 xixue_events.7.f:0 "IT MAY be safely assumed that, two thousand years ago, before Cæsar set foot in southern Britain, the whole country-side visible from the windows of the room in which I write, was in what is called "the state of nature". Except, it may be, by raising a few sepulchral mounds, such as those which still, here and there, break the flowing contours of the downs, man's hands had made no mark upon it; and the thin veil of vegetation which overspread the broad-backed heights and the shelving sides of the coombs was unaffected by his industry. The native grasses and weeds, the scattered patches of gorse, contended with one another for the possession of the scanty surface soil; they fought against the droughts of summer, the frosts of winter, and the furious gales which swept, with unbroken force, now from the Atlantic, and now from the North Sea, at all times of the year; they filled up, as they best might, the gaps made in their ranks by all sorts of underground and overground animal ravagers. One year with another, an average population, the floating balance of the unceasing struggle for existence among the indigenous plants, maintained itself. It is as little to be doubted, that an essentially similar state of nature prevailed, in this region, for many thousand years before the coming of Cæsar; and there is no assignable reason for denying that it might continue to exist through an equally prolonged futurity, except for the intervention of man."
 xixue_events.7.a:0 "Support their deeds"
 xixue_events.7.b:0 "Their deeds are intolerable for us"
 
 banner_events.1.t:0 "Eight Banners Seizing Power"
 banner_events.1.d:0 "As the Manchu population being the majority of our country, the Eight Banner system has been a major political, military and economic institution. From the age of nomadic tribe, the Eight Banner system has played an important role affecting the politics environment of our country. "
 banner_events.1.f:0 "Eight Banners in Power"
 banner_events.1.a:0 "Eight Banners as Our Foundation"
 

 #Tibet
 
 tib_events.1.t:0 "U-Tsang Military Commission"
 tib_events.1.d:0 "U-Tsang Tibet, in the southwestern border of the empire, it has been a part of the empire since the Yongle period, but the empire has had limited influence in this region for a long time. The government of the Kashag has replaced the empire and implemented rule in this area. We should strengthen cooperation with the local government of Tibet and gradually achieve the integration and unification of the Han-Tibetan region."
 tib_events.1.f:0 To complete the integration of the Tibetan region, we need to improve our relationship with the Us-Tibet until it reaches 50 or above, then change the law to allow freedom of belief, maintain the monarchy, and keep it for ten years."
 tib_events.1.a:0 "Dealing with Tibet issue"
 
 tib_events.2.t:0 "The imperial commissioner-resident of Tibet"
 tib_events.2.d:0 "The connection between the Central Plains and Tibet has never been closer. His Majesty the Emperor has approved the use of the Golden Urn to confirm the legitimacy of the Dalai Lama and respect the religion of Tibet in the name of the Emperor. The Tibetan people have gradually recognized the Emperor in [SCOPE.sState('capital_state').GetName] as their own and revered him as the reincarnation of Manjusri, the bodhisattva of wisdom."
 tib_events.2.f:0 "We will send a commissioner-resident to Tibet to control all aspects of the Kashag government and accelerate their unification with the Central Plains."
 tib_events.2.a:0 "Okay."
 
 tib_events.3.t:0 "Dalai Lama's Escape"
 tib_events.3.d:0 "As we conquered Tibet, the Dalai Lama, who was dissatisfied with our policies, fled from Lhasa and called on all Tibetans to resist our rule."
 tib_events.3.f:0 "They are just a group of overconfident ants. We will stabilize everything."
 tib_events.3.a:0 "Don't bother with that coward."
 
 tib_events.4.t:0 "Incorporation of U-Tsang"
 tib_events.4.d:0 "The mission of the Kashag government has ended. Us-Tsang will now abolish the imperial commissioner-resident system and officially upgrade to a Province. The rulers will change from monks and Resident Ministers to Governors and Prefects. Tibet has been completely integrated into the Empire, and the Tibetans have officially become first-class citizens of the Empire."
 tib_events.4.f:0 "Han-Tibetan unification."
 tib_events.4.a:0 "Long live the Emperor!"
 
 tib_events.5.t:0 "Completed exploration of Amdo"
 tib_events.5.d:0 "We drew a map of the Amdo region."
 tib_events.5.f:0 "Finished."
 tib_events.5.a:0 "Success."

 tib_events.6.t:0 "Completed exploration of Xikang"
 tib_events.6.d:0 "We drew a map of the Xikang region."
 tib_events.6.f:0 "Finished."
 tib_events.6.a:0 "Success!"

 tib_events.7.t:0 "Completed exploration of U-Tsang"
 tib_events.7.d:0 "We drew a map of the U-Tsang region."
 tib_events.7.f:0 "Finished."
 tib_events.7.a:0 "Success!"

 tib_events.8.t:0 "Crossing the snowy mountains"
 tib_events.8.d:0 "We encountered a snowy mountain that we could cross to save a lot of time for the expedition team, but it was also very risky."
 tib_events.8.f:0 "If we cross the snowy mountain, it may require us to give up many supplies."
 tib_events.8.a:0 "Worth the risk."
 tib_events.8.b:0 "Find a way around."

 tib_events.9.t:0 "Successfully crossed the snowy mountains"
 tib_events.9.d:0 "Our explorers successfully crossed the snowy mountains."
 tib_events.9.f:0 "Despite the steep and dangerous terrain, we managed to avoid the hazardous areas and successfully reached the other side of the mountains. The relevant data has been recorded, and work is progressing rapidly."
 tib_events.9.a:0 "Success!"

 tib_events.10.t:0 "Encountering a blizzard"
 tib_events.10.d:0 "Unfortunately, we encountered a blizzard and had to turn back."
 tib_events.10.f:0 "We failed the entrance exam through the snowy mountains, and our supplies gradually scattered, and we lost direction. We had to find a way out, return to the foot of the mountain, and look for other channels."
 tib_events.10.a:0 "What a shame!"

 tib_events.11.t:0 "Smooth exploration work"
 tib_events.11.d:0 "Our explorers came to a beautiful plain with a mild climate, abundant wildlife, and plentiful rivers."
 tib_events.11.f:0 "A rare leisure time."
 tib_events.11.a:0 "Fantastic!"

 tib_events.12.t:0 "The source of the three rivers"
 tib_events.12.d:0 "Miracle! We found the source of the three rivers!"
 tib_events.12.f:0 "After our exploration, this area is the source of the Yangtze River, Yellow River, and Lancang River, with abundant water resources. Knowing the source of the mother river, the people of [SCOPE.GetRootScope.GetCountry.GetName] are extremely excited!"
 tib_events.12.a:0 "Great news!"

 tib_events.13.t:0 "Trading with the locals"
 tib_events.13.d:0 "We encountered local Tibetans, who could help us."
 tib_events.13.f:0 "If we are willing to pay them some money for their map."
 tib_events.13.a:0 "Spend the money!"
 tib_events.13.b:0 "We can do it ourselves!"
 
 tib_events.14.t:0 "Pilgrims"
 tib_events.14.d:0 "Pilgrimage is a custom in Tibetan Buddhism. Tibetans measure the distance to the Potala Palace with their bodies to express their piety to their faith."
 tib_events.14.f:0 "What a great feat."
 tib_events.14.a:0 "Give some food to the pilgrims."
 tib_events.14.b:0 "Don't look, we still have work to do."

 tib_events.15.t:0 "Buying Supplies"
 tib_events.15.d:0 "We arrived at a village, and the explorers hoped to rest and buy some supplies here."
 tib_events.15.f:0 "The friendly Tibetan village made everyone reluctant to leave."
 tib_events.15.a:0 "Buy some supplies and organize the team!"
 tib_events.15.b:0 "Let's rest and then depart!"

 tib_events.16.t:0 "Herding Nomads"
 tib_events.16.d:0 "We encountered some nomads grazing, but the team members had different opinions on whether to exchange food with the nomads."
 tib_events.16.f:0 "We haven't had meat for a long time."
 tib_events.16.a:0 "We should exchange with the nomads!"
 tib_events.16.b:0 "We should use guns to rob them!"

 tib_events.17.t:0 "Unusual Plant"
 tib_events.17.d:0 "One of our team members found a strange plant on the road that they had never seen before."
 tib_events.17.f:0 "Is this Chinese cabbage?"
 tib_events.17.a:0 "Great, record it!"
 tib_events.17.b:0 "Don't delay our work!"

 tib_events.18.t:0 "Altitude Sickness"
 tib_events.18.d:0 "One of the team members suffered from altitude sickness, but the nearest exploration point was still an hour's journey away."
 tib_events.18.f:0 "This is really bad!"
 tib_events.18.a:0 "We have no choice!"
 tib_events.18.b:0 "We can't give up on him!"

 tib_events.19.t:0 "Yak"
 tib_events.19.d:0 "A furry yak appeared in our sight. It seemed to have separated from its herd."
 tib_events.19.f:0 "Such a strange-looking cow with such long hair!"
 tib_events.19.a:0 "It could be our source of food."

 tib_events.20.t:0 "Galloping Tibetan Antelopes"
 tib_events.20.d:0 "What is that? A group of antelopes running towards us!"
 tib_events.20.f:0 "Damn, a group of crazy sheep!"
 tib_events.20.a:0 "Avoid them quickly!"
 tib_events.20.b:0 "Let's hunt them!"

 tib_events.21.t:0 "Sunny Day"
 tib_events.21.d:0 "When we came out of the tent, we found that the weather was unexpectedly good."
 tib_events.21.f:0 "Good weather makes for good mood."
 tib_events.21.a:0 "A good day for exploration!"

 tib_events.22.t:0 "Snow Leopard"
 tib_events.22.d:0 "We spotted a snow-white leopard on a distant hill."
 tib_events.22.f:0 "What a beautiful creature!"
 tib_events.22.a:0 "Capture it and present it to the emperor!"
 tib_events.22.b:0 "We should not provoke it!"

 tib_events.23.t:0 "Missing"
 tib_events.23.d:0 "We woke up in the morning to find one of our expedition members missing!"
 tib_events.23.f:0 "Where did he go?!"
 tib_events.23.a:0 "We must find him!"
 tib_events.23.b:0 "We can't let him delay our expedition progress!"

 tib_events.24.t:0 "Found the missing member"
 tib_events.24.d:0 "We found the trapped expedition member in a mountain gorge!"
 tib_events.24.f:0 "Finally found him!"
 tib_events.24.a:0 "Thank goodness!"

 tib_events.25.t:0 "We were unable to find the missing member"
 tib_events.25.d:0 "Damn, this is not good news!"
 tib_events.25.f:0 "We can only pray for him!"
 tib_events.25.a:0 "Rest in peace!"

 tib_events.26.t:0 "Lake"
 tib_events.26.d:0 "After a long time without supplies, we came across a beautiful blue lake."
 tib_events.26.f:0 "How beautiful, just like in the south of the Yangtze River!"
 tib_events.26.a:0 "Let's fish in the lake!"
 tib_events.26.b:0 "Fish with caution."

 tib_events.27.t:0 "Temple"
 tib_events.27.d:0 "We encountered a temple, and all the team members hoped to enter the temple to pray for themselves."
 tib_events.27.f:0 "Everyone wants to pray to Buddha to return home safely."
 tib_events.27.a:0 "Okay, I also want to pray for myself."

 #The Qing's Journal
 
 qing_events.1.t:0 "Conquering Mogol"
 qing_events.1.d:0 "The Mongolian Plateau has already submitted to the Emperor, and we have now crowned the Great Khan of Mongolia！"
 qing_events.1.f:0 "Since our victory over Lin Dan Khan two hundred years ago, the Qing Empire has seized the Imperial Seal of the Yuan Dynasty and declared its rule over the grasslands. Eastern Khalkha Mongolia subsequently submitted to Qing rule, but the western region of Zunghar Mongolia, under the leadership of Galdan Khan, resisted our dominion. Now, we have finally defeated our enemies and reclaimed the entire grassland. The Mongol Eight Banners of Xilingol are greatly inspired, and Mongolian nobles are coming to [SCOPE.sState('capital_state').GetName] to prepare for the coronation ceremony of the Khan."
 qing_events.1.a:0 "Great!"
 
 qing_events.2.t:0 "Ten Great Campaigns"
 qing_events.2.d:0 "Emperor[SCOPE.sCharacter('shiquan').GetFirstName], with great ambition, is diligently preparing for his career."
 qing_events.2.f:0 "The Empire is surrounded by numerous crises, and we need inspiring victories to revitalize the Empire. Our Emperor [SCOPE.sCharacter('shiquan').GetFirstName] is filled with ambition, and under his leadership, we will undoubtedly achieve comprehensive prosperity and rise to greatness!"
 qing_events.2.a:0 "Eliminate all enemies who confront us!"
 
 je_annex_monglia:0 "Mongol-Manchu Alliance"
 je_annex_monglia_reason:0 "[The friendship between [SCOPE.GetRootScope.GetCountry.GetName] and Mongolia is extraordinary. As blood relatives and close brothers, the intermarriage between the Manchu and Mongols has never been severed. However, the Mongolian land has been artificially divided, with the eastern part still under the rule of the Qing Dynasty, while the western part is occupied by the Zunghar Khanate. The Mongol Eight Banners under our rule aspire for unity, and we should have dominion over the entire Mongolian Plateau"
 annex_monglia_tt:0 "Unite the Mongol and gain the recognition from their nobles."
 
 je_shiquan_china:0 "Ten Great Campaigns"
 je_shiquan_china_reason:0 "he Emperor of [SCOPE.GetRootScope.GetCountry.GetName] is not to be limited. He is filled with ambition to revitalize the entire empire. If we can achieve all our ambitions under his reign, the whole world will tremble in fear and fight for us.。"
 je_shiquan_china_goal:0 "#Bold Emperor's Ten Great Campaigns are recognized#!"
 shiquan_china_tt:0 "Emperor's Ten Great Campaigns are recognized."

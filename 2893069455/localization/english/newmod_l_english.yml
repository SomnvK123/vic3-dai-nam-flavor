 CHI_FLAVOR_TEXT:1 "When faced with the fierce counterattack of Zheng Chenggong, the rulers of the Qing Dynasty chose to withdraw to beyond the Great Wall. Now that the Ming Dynasty has been revived, does the Qing Dynasty have a chance to revive the glory of the Battle of Sarhu two hundred years ago and regain control of Central Plains?"

 TIB_FLAVOR_TEXT:0 "For the past five hundred years, Tibet has been requesting imperial recognition from the Ming Dynasty through tribute missions. However, can this time of remaining outside direct control of the Chinese government continue, or will it be replaced by a new strategy and be fully integrated into the Chinese empire?"
 
 RYU_FLAVOR_TEXT:0 "s a small country, Ryukyu did not have many choices, being sandwiched between China and Japan and lacking the ability to be independent. For several hundred years since the unification of the three mountains, Ryukyu was a tribute state of the Ming Dynasty, but the unified Japan gradually became covetous of the Ryukyuans. Can Ryukyu survive the Japanese aggression in this era?"
 
 CNN_FLAVOR_TEXT:0 "A hundred years ago, during the Annam Civil War, the Ming Empire followed the example of Emperor Yongle and used a large army to suppress the resistance in northern Vietnam and placed the southern state of Dai Viet under its tribute. Vietnam's situation has always been turbulent, but under the strong military deterrence of the Ming Empire, the Annam Protectorate still maintained stable development. Today, the emperor's younger brother, Ming's Prince of Annam Zhu Bokun, has just been enfeoffed in this new frontier of the Ming Empire. Where will the future of Annam lead?"
 
 CNP_FLAVOR_TEXT:0 "The establishment of the Luzon Province Pacification Commissionerate can be attributed to General Zheng Chenggong. In the late Ming Dynasty and the end of the Chongzhen period, the Spanish twice raised their swords against the local Chinese residents on the island of Luzon. After recapturing Taiwan, General Zheng Chenggong reorganized his army and unexpectedly appeared outside the city of Manila. The routed Spanish had to give up their colony in Luzon. Luzon was once the base for Zheng's counterattack against the mainland. After the recapture of Nanjing, Zheng's troops withdrew from here, and the Ming Dynasty established the pacification commissionerate here, sending officials to govern the area. Luzon is an important transit station for foreign trade for the Ming Dynasty. It is peaceful here, and nothing major should happen, at least it should not."

 MNG_FLAVOR_TEXT:0 "During the critical moment of the Ming dynasty, the nobleman Zheng Chenggong stepped forward and his descendants regained the throne through decades of war, pacifying the Three Feudatories who attempted to establish their own rule and limiting Qing dynasty's control to the sixteen provinces north of the Great Wall and the deserts beyond. We enjoyed another century of prosperity, but with the expansion of Western powers, corruption within the court, and threats from the outside, do we still have a chance to recover Yan and Yun, and achieve the grand goal of unifying China?"
 
 CNL_FLAVOR_TEXT:0 "In search of the silver mines mentioned by the Franks, our ancestors sailed across the ocean to this unfamiliar continent. Through hard work and cultivation, we established this homeland and eventually broke away from the Central Kingdom to form our own republic. However, the Western powers are now threatening our existence, and we need to rapidly develop and strengthen ourselves to confront their imperialism. Or perhaps we should seek help from the dragon?"
 
 ming_tax_head:0 "Poll Tax"
 ming_tax_head_desc:0 "For thousands of years, the poll tax has been an important revenue source in China. The total population is determined through household registration, and the amount of tax owed by each person is calculated based on the number of people. This is the cornerstone of the empire's stable operation. However, this tax system is not omnipotent. There are cases where people hide their population, and this system greatly curbs the reproductive desires of our people. After all, having an additional person means paying additional taxes.。"
 
 ming_zheng_navy:0 "Zheng's Fleet"
 ming_zheng_navy_desc:0 "作As heroes of the movement to restore the Ming Dynasty and overthrow the Qing Dynasty, the Zheng family earned a highly esteemed position. The Zheng navy was the entirety of the Ming Dynasty's naval forces, and they held the largest military and government authority. The emperor had to take their opinions into account."
 
 ming_warlord:0 "Concerns about the Fanzhen"
 ming_warlord_desc:0 "In the war against the Qing dynasty, we promised benefits to all forces that could provide assistance, and the result was the emergence of warlords in the thirteen provinces of the empire, each of them like independent kingdoms. Among them, the descendants of Li Dingguo became the kings of Yunnan in the southwest, and the former Shun Army camp in Guanzhong was one of the most formidable forces."
 

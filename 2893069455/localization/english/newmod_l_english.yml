 #Mongolia Journal
 
 monglia_army_1:0 "Steppe Warriors"
 
 je_monglia_1:0 "The unification of the Steppe"
 je_monglia_1_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] is the Khan of Mongolia in the broad sense, but the tribes under our rule are acting independently. We must reaffirm the authority of the empire and reunite the Steppe!"
 je_monglia_1_goal:0 "Reduce unrest to less than 10% in all regions of [SCOPE.GetRootScope.GetCountry.GetName], maintain the monarchy and dictatorship, make no progress in civil wars, and sustain this for ten years."
 je_monglia_1_success:0 "We will establish a vast and unified nomadic empire!"
 fail_je_monglia_1_tt:0 "The Mongol Empire eventually disintegrated."

 je_monglia_2:0 "For Recognition"
 je_monglia_2_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] was once a vast empire that gradually declined. Although the Khan urged us to unite, our voice on the international stage remains very weak, and we are even considered an unrecognized country. We must complete modernization through strong reform and strive for the international status we deserve!"
 je_monglia_2_goal:0 "[SCOPE.GetRootScope.GetCountry.GetName] should rule all the historical territories of the Mongol Empire."
 je_monglia_2_success:0 "The Mongol Empire is reborn!""
 
 je_monglia_3:0 "Reestablish the Yuan Dynasty"
 je_monglia_3_reason:0 "The Yuan Dynasty was a culturally diverse and open-minded Chinese empire led by Mongolians. We need to recapture the Central Plains and reclaim our authority of China!"
 je_monglia_3_goal:0 "[SCOPE.GetRootScope.GetCountry.GetName] should govern all the old territory belonged to the Yuan Dynasty."
 je_monglia_3_success:0 "The Great Yuan restored!"
 
 je_monglia_4:0 "Capturing Hami"
 je_monglia_4_reason:0 "The government of Hami is actually controlled by our Mongolian compatriots, but they are now loyal to the Ming court. We should exert our influence on Hami and take it over without bloodshed, making it a part of us."
 je_monglia_4_goal:0 "[SCOPE.GetRootScope.GetCountry.GetName]can influence Hami by the following ways：\n1, maintain the state GDP above 5M\n 2, maintain a friendly relationship with Hami \n3, Hami is no longer a part of Ming's regime"
 je_monglia_4_tt:0 "Hami becomes a vassal of Dzungar"
 
 
 je_unite_tib:0 "The enfeoffment of Tibet"
 je_unite_tib_reason:0 "U-Tsang Military Commission has been belonging to [SCOPE.GetRootScope.GetCountry.GetName]for hundreds of years"But we have not established a clear administrative relationship between us, but rather linger around the empire as a vassal through enfeoffment. We must deepen the connection between us."
 je_unite_tib_goal:0 "[SCOPE.GetRootScope.GetCountry.GetName] should establish absolute authority over the plateau like the Yuan Dynasty! Please maintain a good vassal relationship with U-Tsang, maintain the monarchy and freedom of religion and law, and continue for ten years."
 je_unite_tib_success:0 "The system of Golden Urn was established."
 
 je_unite_tib_1:0 "Exploring Tibet"
 je_unite_tib_1_reason:0 "The postal stations of U-Tsang Military Commission have long been abandoned. [SCOPE.GetRootScope.GetCountry.GetName] needs to re-survey the roads between us, map out new provincial maps for the future establishment of information channels connecting the plateau, and ensure that the Emperor's orders can be quickly and efficiently transmitted here."
 je_unite_tib_1_goal:0 "Completed all three Kanto."
 je_unite_tib_1_goal_1:0 "1. Kham explored the Amdo area."
 je_unite_tib_1_goal_2:0 "2.Kham region."
 je_unite_tib_1_goal_3:0 "3. Kamtan Weizang"
 
 je_unite_tib_2:0 "Exploration of Tibet"
 je_unite_tib_2_reason:0 "Adventurers from [SCOPE.GetRootScope.GetCountry.GetName] have set off. They will depart from the Central Plains, cross over the high mountains, and traverse the lands of the pastoralists. They will observe the human and geographical features along the way and draw up a detailed provincial map."
 je_unite_tib_2_goal:0 "Upon completion of the exploration progress, we will obtain a measurement result."
 je_unite_tib_2_success:0 "The exploration has been successfully completed."
 
 mongolia_events.1.t:0 "The Great Khan of Mongolia"
 mongolia_events.1.d:0 "[SCOPE.GetRootScope.GetCountry.GetName], born from the Wala tribe, has ruled the grasslands for centuries, but the rising Manchu in the East and the Ming dynasty in the Southeast have posed a significant threat to us. Although we are nominally the legitimate Great Khan of Mongolia, not all Mongolian tribes are under our jurisdiction. Half of the Khalkha Mongolians are subordinated to the Qing dynasty, while the other half enjoy autonomy under our protection. We must reaffirm the authority of the Mongol Empire!"
 mongolia_events.1.f:0 "We will complete the unfinished business of Genghis Khan."
 mongolia_events.1.a:0 "Reorganize the Mongol Empire"
 
 monglia_events.2.t:0 "Mongolian Unification"
 monglia_events.2.d:0 "The Mongolian tribes have been unified under the rule of [SCOPE.GetRootScope.GetCountry.GetName], now it's time to expand our territory!"
 monglia_events.2.f:0 "We must reclaim all the land of the Mongolian people!"
 monglia_events.2.a:0 "Long live the Mongol Empire!"
 monglia_events.2.b:0 "We must restore the Yuan Dynasty!"
 
 mongolia_events.3.t:0 "The World Conqueror"
 mongolia_events.3.d:0 "The Mongol Empire has been reborn, and our goal is to conquer the entire world!"
 mongolia_events.3.f:0 "The world will enjoy peace under the rule of the Mongolian people."
 mongolia_events.3.a:0 "Conquer the world!"
 
 monglia_events.4.t:0 "Great Yuan Empire"
 monglia_events.4.d:0 "The Chinese people have submitted to us, we can now declare our rightful position!"
 monglia_events.4.f:0 "We will become the rightful Emperor!"
 monglia_events.4.a:0 "Ascend the throne!"


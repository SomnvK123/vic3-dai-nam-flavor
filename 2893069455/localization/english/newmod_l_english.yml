 xinying_yimin_1_de_desc:0 "A Memorial to the Throne"
 
 xinying_yimin_2_de:0 "Close the Court Section"
 xinying_yimin_2_de_desc:0 "At dusk, I was sent to exile in Chaozhou, eight thousand li away."
 
 xinying_yimin_3_de:0 "Encourage Ming's Immigration"
 xinying_yimin_3_de_desc:0 "The Ming Dynasty has a large population, and we can attract some local residents without land to go to the New World to develop colonies."
 
 xinying_yimin_4_de:0 "Develop Colonial Technology"
 xinying_yimin_4_de_desc:0 "The difficulties we encounter in the New World are far more than we anticipated. To solve the problem of malaria, we can request assistance from the Ming Empire to conduct research."
 
 xinying_yimin_5_de:0 "Request Financial Assistance"
 xinying_yimin_5_de_desc:0 "Our finances are already stretched thin, and a grant from the Ming Empire would be a great help to us."
 
 xinying_yimin_6_de:0 "Develop Remote Land"
 xinying_yimin_6_de_desc:0 "The potential of our colony has yet to be fully developed. We can expand the cultivable land to accommodate more people."
 
 xinying_yimin_7_de:0 "Declare More Territory"
 xinying_yimin_7_de_desc:0 "Under heaven, all are the emperor's land, and all within the four seas are his subjects. All adjacent colonies should be under our jurisdiction."
 
 xinying_yimin_8_de:0 "Request Administrative Assistance"
 xinying_yimin_8_de_desc:0 "The expansion of our administrative institutions has stretched our officials thin. We should seek help from the Ming Empire to obtain a batch of clerks to help us with our internal affairs."
 
 xinying_yimin_9_de:0 "Request Diplomatic Assistance"
 xinying_yimin_9_de_desc:0 "The expansion of our diplomatic department has stretched our officials thin. We should seek help from the Ming Empire to obtain a batch of clerks to help us with our external affairs"
 
 xinying_yimin_10_de:0 "Request the Imperial Army"
 xinying_yimin_10_de_desc:0 "Our country is unable to withstand external aggression on its own. We can seek help from the Ming Empire to help us defeat foreign enemies."
 
 xinying_yimin_11_de:0 "Request Educational Assistance"
 xinying_yimin_11_de_desc:0 "he demand for education in our country is unprecedented. It would be a good choice for the Ming Empire to allocate some teachers and school resources to us."
 
 xinying_yimin_12_de:0 "Request Military Construction Assistance"
 xinying_yimin_12_de_desc:0 "Our country's military needs to be reorganized. If we can get help from the Ming Empire, we can quickly improve our military strength."
 
 xinying_yimin_13_de:0 "Request Construction Assistance"
 xinying_yimin_13_de_desc:0 "Our country's construction industry is unable to meet demand. Requesting a batch of craftsmen from the Ming Empire can solve our urgent needs.""

 xinying_yimin_14_de:0 "Tribute to the Imperial Court"
 xinying_yimin_14_de_desc:0 "It's time to show our loyalty. We will pay tribute to the Ming Empire and win their trust"
 
 xinying_yimin_15_de:0 "Declare Independence from the Ming Empire"
 xinying_yimin_15_de_desc:0 "Man is born free, but is everywhere in chains."
 

 #The unification of Annam
 
 je_annan_tongyi:0 "The unification of Annam"
 je_annan_tongyi_reason:0 "Since the Annam Civil War, the land of Annam has been divided into two parts. The northern territory is under the jurisdiction of the Ming Dynasty's Annam Pacification Commissioner, while the southern part is ruled by the Vietnamese Southern Dynasty. This division must come to an end, and Vietnam must determine its own destiny as soon as possible!"


 #Great Qing
 
 je_annex_han:0 "Embracing Hans"
 je_annex_han_reason:0 " Even though we have been expelled to the outside of the Pass, the Han people remain our invaluable supporters. We should set aside prejudice and consider them as first-class citizens, fighting together for the rise of [SCOPE.GetRootScope.GetCountry.GetName]!"
 je_annex_han_goal:0 "At least having a piece of stable Han cultural homeland and maintaining it for at least ten years."
 
 je_destory_dzu:0 "The end of Dzungar Empire"
 je_destory_dzu_reason:0 "Dzungar cannot continue to exist anymore. They have been a constant trouble for the western region of our country and pose a significant threat to Mongolia. In order to secure our border defense, we must completely resolve the Dzungar issue and prevent foreign powers from interfering in the western region.。"
 je_destory_dzu_goal:0 "We have to eliminate the Dzungar!"
 annex_dzu_tt:0 "The threats from Mogol have ended for good."
 

l_english:
 ideology_catholic_moralist:0 "Ecclesiastic"
 ideology_catholic_moralist_desc:0 "#lore This group embraces the authority of the Holy Father and wishes to extend it to the secular sphere.#!"
 ideology_papal_moralist:0 "The Holy See"
 ideology_papal_moralist_desc:0 "#lore This group demands the unconditional submission of the state to the authority of the Lord and supports the supremacy of the Pope.#!"
 ideology_catholic_pious:0 "Catholic Pious"
 ideology_catholic_pious_desc:0 "#lore This group believes in the "infallibility of the Pope", demands that Catholicism must control all aspects of society, and wants to spread the faith in Christ abroad.#!"
 ideology_protestant_pious:0 "Protestant Pious"
 ideology_protestant_pious_desc:0 "#lore Protestantism places more emphasis on working hard, living frugally, accumulating wealth and using it for investment or charity in this world than on devotion to the other world.#!"
 ideology_muslim_paternalistic:0 "Traditionalist"
 ideology_muslim_paternalistic_desc:0 "#lore This group embraces the traditional institutions of Muslim societies and opposes reforms that would touch their traditional beliefs.#!"
 ideology_sunni_moralist:0 "Sunni Moralist"
 ideology_sunni_moralist_desc:0 "#lore lore This group has a strong belief in a religious moral order and support Sunni Islam's views on cultural diversity.#!"
 ideology_shia_moralist:0 "Shia Moralist"
 ideology_shia_moralist_desc:0 "#lore This group has a strong belief in a religious moral order and support Sunni Islam's views on cultural diversity.#!"
 ideology_islam_patriarchal:0 "Islamic Patriarchal"
 ideology_islam_patriarchal_desc:0 "#lore Islam supports women owning their own property, and even in some cases - the right to vote, but opposes their excessive presence in public.#!"
 ideology_shariah:0 "Shariahist"
 ideology_shariah_desc:0 "#lore This group advocates the Shari'ah, the commandments of Allah, as the law that guides every aspect of people's daily lives.#!"
 ideology_rabbinical_moralist:0 "Zionists"
 ideology_rabbinical_moralist_desc:0 "#lore This group believed that the Jews were God's chosen people and demanded the establishment of a Jewish nation-state.#!"
 ideology_mahayana_buddhist_moralist:0 "Mahayana Moralist"
 ideology_mahayana_buddhist_moralist_desc:0 "#lore The Mahayana's path is clearly set out and that the theocracy is required to best guide the nation down the path it its teachings.#!"
 ideology_theravada_buddhist_moralist:0 "Theravada Moralist"
 ideology_theravada_buddhist_moralist_desc:0 "#lore As an enlightened person, the Buddha set the example for everyone, and we should follow his path in order to seek nirvana.#!"
 ideology_vajrayana_buddhist_moralist:0 "Gelugpa Moralist"
 ideology_vajrayana_buddhist_moralist_desc:0 "#lore The Gelugpa's path is clearly set out and that the theocracy is required to best guide the nation down the path it its teachings, and serfs should serve their masters to seek redemption.#!"
 ideology_confucian_patriarchal:0 "Confucian Patriarchalists"
 ideology_confucian_patriarchal_desc:0 "#lore This group wants to see a harmonious society where men and women are separated, where elders and children are ordered, and where there is a clear distinction between inferiority and superiority.#!"
 ideology_chinese_literati:0 "Literatists"
 ideology_chinese_literati_desc:0 "#lore This group values the role of education and wants every member of society to receive a good humanistic education.#!"
 ideology_anti_shogunate:0 "Sonnō-jōi"
 ideology_anti_shogunate_desc:0 "#lore This group believed that power in Japan belonged to the Tenno alone and that all foreign powers should be driven out of Japan.#!"
 ideology_france_reactionary:0 "Jacobinist"
 ideology_france_reactionary_desc:0 "#lore This group was heavily influenced by the French Revolution and supported a strong nationalist republican regime.#!"
 ideology_france_bonapartist:0 "Bonapartist"
 ideology_france_bonapartist_desc:0 "#lore This group embraced the Bonaparte family and wanted them to return to the throne of France as emperor.#!"
 ideology_english_paternalistic:0 "Conservatist"
 ideology_english_paternalistic_desc:0 "#lore This group holds a British-style conservative view.#!"
 ideology_english_patriotic:0 "Muckraker"
 ideology_english_patriotic_desc:0 "#lore This group opposes government interference with freedom of expression and thought.#!"
 ideology_bismarckism:0 "Bismarckist"
 ideology_bismarckism_desc:0 "#lore The political, military and diplomatic thought of Otto von Bismarck.#!"

 ideology_american_reactionary:0 "Dixiecrist"
 ideology_american_reactionary_desc:0 "#lore This group embraced Southern customs and institutions and believed that racial discrimination and slavery were deserved.#!"
 ideology_royal_republican:0 "Constitutionalist"
 ideology_royal_republican_desc:0 "#lore This group believes that a constitutional government that retains the monarch as a symbol of the state is the optimal form of democracy.#!"
 ideology_austria_federalist:0 "Federalist"
 ideology_austria_federalist_desc:0 "#lore This group wanted the Austrian Empire to be reformed into a federal state with national self-determination.#!"
 ideology_austria_centraliser:0 "Centraliser"
 ideology_austria_centraliser_desc:0 "#lore This group wanted to make the Austrian Empire a centralized unitary state.#!"
 ideology_japan_plutocratic:0 "Zaibatsuists"
 ideology_japan_plutocratic_desc:0 "#lore This group saw the Tenno as the supreme ruler and the rich as an intellectual elite group well suited to determine the direction of society.#!"
 ideology_american_plutocratic:0 "American Plutocrat"
 ideology_american_plutocratic_desc:0 "#lore American tycoons embraced the republican system of federal government, and aspiring to satisfy their own railroad interests by colonizing the West.#!"
 ideology_pan_slavist:0 "Pan-Slavist"
 ideology_pan_slavist_desc:0 "#lore This group believes that the Russian Empire should be the protector of Slavic peoples and Orthodox civilization.#!"
 ideology_hollandologist:0 "Hollandologist"
 ideology_hollandologist_desc:0 "#lore This leader wanted to introduce a Western-style education system and medical technology.#!"

 ai_strategy_anti_shogunate:0 "Anti Shogunate"
 ai_strategy_anti_shogunate_desc:0 "Samurai and peasants who opposed the Shogunate, as well as emerging intelligentsia and industrialists, were working together to overthrow the Tokugawa Shogunate.。"
 ai_strategy_meiji_restoration:0 "Meiji Restoration"
 ai_strategy_meiji_restoration_desc:0 "The intelligentsia and industrial industrialists who were favored by the Tenno tried to end the old samurai system and worked to build a modernized Japan."
 ai_strategy_meiji_restoration_2:0 "Meiji Restoration"
 ai_strategy_meiji_restoration_2_desc:0 "Intellectuals and industrial giants who were favored by the Tenno put an end to the old samurai system and worked to build a modernized Japan."
 ai_strategy_showa_restoration:0 "Showa Restoration"
 ai_strategy_showa_restoration_desc:0 "The combination of the zaibatsu, the military ministry and the National Shinto Church made Japan run wild on the road to fascism."

 ideology_white_hegemony:0 "White Supremacist"
 ideology_white_hegemony_desc:0 "#lore This group believes that only whites can be the social and political elite of the country."
 ideology_american_moralist:0 "Puritan Moralist"
 ideology_american_moralist_desc:0 "#lore This group adhered to the views of the Great Awakening Movement, viewed Puritan religious morality as the foundation of the United States.#!"
 ideology_boer_particularist:0 "Boer Particularist"
 ideology_boer_particularist_desc:0 "#lore This group wants local autonomy in their work, free from the stranglehold of the British who governed the Cape Colony.#!"

 ig_boer_landowners:0 "Boer Landowners"
 ig_boer_landowners_desc:0 "The Boers, whose name derives from the Dutch word 'boer' (farmer) and whose self-designation is Afrikaner, are descendants of white European settlers, mainly Dutch, who settled in the Cape Colony before the British took over. They migrated and expanded inland from the Cape of Good Hope, enclosing large tracts of indigenous land, driving the native blacks to labor, and becoming slave owners themselves. The owners of large farms and plantations among the Boers are the guardians of tradition and 'old money'."
 ig_boer_rural_folk:0 "Boer Rural Folk"
 ig_boer_rural_folk_desc:0 "The Boers, whose name derives from the Dutch word 'boer' (farmer) and whose self-designation is Afrikaner, are descendants of white European settlers, mainly Dutch, who settled in the Cape Colony before the British took over. They migrated and expanded inland from the Cape of Good Hope, enclosing large tracts of indigenous land, driving the native blacks to labor, and becoming slave owners themselves. The political interests of small farmers among the Boers are primarily aligned with their agricultural livelihoods."
 ig_squatters:0 "Squatters"
 ig_squatters_desc:0 "Squatter originally referred to people who took up land without permission, but as the colonial authorities conceded to landowners who took up land without permission and recognize their land rights, and as sheep farming in Australia became more successful, the term became a common term for large ranchers."
 ig_catholic_missionaries:0 "Catholic Missionaries"
 ig_catholic_missionaries_desc:0 "After the Congo embraced Catholicism, the missionaries became the dominant class of clergy in the Congo. They advocated trade with Western countries as well as the conversion of the native Congolese to Christianity."

 other_ig_forced_to_open_market:0 "Emerging Powers"
 other_forced_to_open_market:0 "Aspirants of the Restoration"

 from_bonapartist:0 "Conservatives flock to Bonapartists"

 Heisei:0 "Heisei"
 Reiwa:0 "Reiwa"

 ig_fleet_street:0 "Fleet Street"
 ig_fleet_street_desc:0 "This area of central London is where the country's newspapers are written and printed. Journalists who work on Fleet Street are known as persistent greasers who will go over dead bodies for a story."
 ig_junker_landowners:0 "Junker Landowners"
 ig_junker_landowners_desc:0 "The name of the Junkers derives from "young lords" and means young noblemen who came to the Baltic States in the course of the conquests of the Teutonic Knights to settle and Christianize Prussian lands. Today, the Junkers are the nobility and the main landowners of Prussia. Although Prussia is moving toward a constitutional system, they still maintain their power through a system of agricultural subsidies, their domination of the bureaucracy, and their elevated posts in the military."
 ig_junker_industrialists:0 "Junker Industrialists"
 ig_junker_industrialists_desc:0 "The name of the Junkers derives from "young lords" and means young noblemen who came to the Baltic States in the course of the conquests of the Teutonic Knights to settle and Christianize Prussian lands. They used the wealth they gained from the rents of their tenants and tenants and their connections to the court to also acquire the role of Prussia's industrialists, based mainly in the Rhineland."
 ig_carlists:0 "Carlists"
 ig_carlists_desc:0 "These are the supporters of a rival Bourbon claim to the throne - that of Infante Carlos, the self-proclaimed Charles V, second son of Charles IV. The laws of succession were revised during the 18th century to prevent a personal union between Spain and France. However, the disinherited line has enough support to continue to make trouble for the ruling Dinásticos of Isabel II and their heirs."
 ig_isabelinos:0 "Isabelinos"
 ig_isabelinos_desc:0 "These are the supporters of a rival Bourbon claim to the throne - that of Isabel II, daughter of Ferdinand VII of Spain and Maria Christina of Sicily. The powerful Cristinos have fought hard against their Carlist rivals to secure the throne for the royal regent and her minor daughter. These supporters still have great influence on Spanish society thanks to their progressive politics and patronage network."
 ig_fire_eaters:0 "Fire Eaters"
 ig_fire_eaters_desc:0 "The Fire Eaters are flaming advocates of the Southern way of life. The Union may be politically necessary to prevent European imperialism from returning to America, but the Yankees must learn to respect the South and its particular institutions."
 ig_prohibitionists:0 "Prohibitionists"
 ig_prohibitionists_desc:0 "Whether for religious, political or personal reasons: All prohibition advocates believe that any intoxication by drugs or alcohol is a public nuisance that should be completely eradicated from society."
 ig_railway_tycoons:0 "Railway Tycoons"
 ig_railway_tycoons_desc:0 "Railway Tycoons are one of the main drivers of America's westward advance. Backers on the East Coast and Europe are investing in new rail lines that will open up new markets. These markets must be recreated amid mines, forests and the vast prairie."
 ig_imperial_harem:0 "Imperial Harem"
 ig_imperial_harem_desc:0 "The Imperial Harem is considered a place of decadent opulence due to the imagination of European artists. However, it is actually the center of the sultan's power at court and consists of his family, advisors, servants, and various lickspittles. Loyalists of the sultan's household tend to support centralization and modernization."
 ig_bonapartists:0 "Bonapartists"
 ig_bonapartists_desc:0 "Napoleon Bonaparte came to power late in the French Revolution and rampaged through the anciennes régimes of Europe with the unleashed force of nationalism. His successors seek to continue his legacy of French military conquest and imperial rule."
 ig_ultraroyalists:0 "Ultraroyalists"
 ig_ultraroyalists_desc:0 "The Bourbon dynasty ruled the kingdom of France for almost a thousand years - apart from a brief bloody interlude during the Revolution. But more recently - in 1824 - the absolutist Charles X was chased from the throne by republicans, but supporters of Louis Philippe I returned to power in July 1830 in return for the introduction of liberal reforms: thus was born the so-called July monarchy. Monarchy is one of the traditional pillars of society, but what happens when the monarch himself goes against tradition? If forced to do so, we must be prepared to defend the institution of monarchy even from the monarch himself."
 ig_centralisers:0 "Centralisers"
 ig_centralisers_desc:0 "The centralizer faction of the Austrian Empire considers technological and economic modernization to be the most important factor in protecting the state from revolutions and invasions. Its supporters mostly come from cultures that have already been incorporated into the machinery of the state."
 ig_federalists:0 "Federalists"
 ig_federalists_desc:0 "The Federalist Faction of the Austrian Empire demands recognition of the traditional rights and duties of national minorities. If minorities were given the same status as the German leadership, the empire would become stronger and its internal tensions would ease."
 ig_chieftains:0 "Chieftains"
 ig_chieftains_desc:0 "As owners of large herds and extensive kraals, the chiefs are the keepers of traditions and old money."
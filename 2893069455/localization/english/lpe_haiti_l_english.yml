l_english:
 hai.1.t: "Declaration of Independence of the Dominican Republic"
 hai.1.d: "The leaders of the newly created [SCOPE.sCountry('rep_dom_scope').GetName] have published a manifesto stating the reasons why the Dominican people can no longer remain united with [ROOT.GetCountry.GetAdjective]."
 hai.1.f: "The rebels, led by [SCOPE.sCountry('rep_dom_scope').GetRuler.GetFullName], took the Fortaleza Ozama in the capital [SCOPE.sCountry('rep_dom_scope').GetCapital.GetCityHubName]. The [ROOT.GetCountry.GetAdjective] garrison was caught by surprise, apparently betrayed by one of its sentinels. Another group of insurgents, led by Matías Ramón Mella, reached the Puerta de la Misericordia, where Mella fired the legendary Trabucazo of Independence and Sánchez immediately raised the new Dominican flag shouting: 'God, Fatherland, and Liberty!'"
 hai.1.a: "They will pay for this betrayal"

 hai.3.t: "Future of [SCOPE.sState('santo_domingo_scope').GetStateRegion.GetName]"
 hai.3.d: "With the new relations between the [ROOT.GetCountry.GetAdjective] and Dominican peoples, a question arises among our political class about the future of [SCOPE.sState('santo_domingo_scope').GetStateRegion.GetName]."
 hai.3.f: "'The return of [ROOT.GetCountry.GetAdjective] troops to Dominican soil does not seem to please many [SCOPE.sCulture('caribenno_scope').GetName] and [SCOPE.sCulture('afro_caribenno_scope').GetName] on the island,' commented a [ROOT.GetCountry.GetAdjective] captain who had just arrived."
 hai.3.a: "We should create a General Captaincy"
 hai.3_tt1: "We will have to lower the autonomy of [SCOPE.sCountry('ocupador_santo_domingo').GetName] to [concept_puppet|l] through a [concept_diplomatic_demand|l]."
 hai.3.b: "Let’s try to ease tensions"
 hai.3.c: "Full annexation is the only answer"
 hai.3_tt: "This decision will have consequences in the near future, if you haven’t already experienced them."

 # hai.4 mother of another event

 hai.5.t: "End of the uprisings in [SCOPE.sState('estado_rebelde_scope').GetStateRegion.GetName]"
 hai.5.d: "Finally, either after decimating the [SCOPE.sCulture('caribenno_scope').GetName] population in [SCOPE.sState('estado_rebelde_scope').GetStateRegion.GetName] or after ending their [concept_discrimination], we have reconciled the local population with the [ROOT.GetCountry.GetAdjective] regime."
 hai.5.f: "A mix of relief and tension fills the air. No Dominican knows what the future holds, but many view it with skepticism."
 hai.5.a: "It’s finally over"

 hai.6.t: "Uprising in [SCOPE.sState('estado_trabajadores').GetStateRegion.GetName]"
 hai.6.d: "Today, a disgruntled [SCOPE.sCulture('caribenno_scope').GetName] landowner called upon the [SCOPE.sPop('insurgentes_scope').GetName] from [SCOPE.sBuilding('edificio_trabajores').GetName] to rise up against [ROOT.GetCountry.GetName]."
 hai.6.f: "With Matías Ramón Mella's Trabucazo at the Puerta de la Misericordia, an uprising took place in Santo Domingo, marking the start of the Dominican War of Independence."
 hai.6.a: "A small matter"

 hai.10.t: "Foundation of La Trinitaria"
 hai.10.d: "Today in [SCOPE.sState('santo_domingo_scope').GetName], several [SCOPE.sCulture('caribenno_scope').GetName] leaders have founded La Trinitaria, an association seeking the independence of the Dominican Republic."
 hai.10.f: "#bold La Trinitaria#! was a society created by Juan Pablo Duarte and other [SCOPE.sCulture('caribenno_scope').GetName] with the aim of taking actions to free [SCOPE.sState('santo_domingo_scope').GetName] from [ROOT.GetCountry.GetAdjective] occupation and form an independent [concept_country|l]."
 hai.10.a: "They will not get away with it"
 hai.10_tt: "The [concept_journal_entry|l] #bold La Trinitaria#! can be activated."

 hai.11.t: "Guerrilla in Santo Domingo"
 hai.11.d: "Taking advantage of the recent [concept_civil_war|l], the [SCOPE.sCulture('caribenno_scope').GetName] people have risen up against the [ROOT.GetCountry.GetAdjective] government in [SCOPE.sState('santo_domingo_scope').GetName]."
 hai.11.f: "On February 27, 1844, the rebels, led by Sánchez in the absence of Duarte, took the Fortaleza Ozama in the capital of [SCOPE.sState('santo_domingo_scope').GetName]. The [ROOT.GetCountry.GetAdjective] garrison was caught by surprise, apparently betrayed by one of its sentinels.\n\nAnother group of insurgents, led by Matías Ramón Mella, reached the Puerta de la Misericordia, where Mella fired the legendary Trabucazo of Independence, and Sánchez immediately raised the new Dominican flag shouting: 'God, Fatherland, and Liberty!'"
 hai.11.a: "As if the [concept_war|l] wasn’t enough"

 hai.12.t: "Possibility of [concept_secession|l] in [ROOT.GetCountry.GetName]"
 hai.12.d: "With the rise of [Concept('concept_pop', '$concept_population$')|l] [concept_radical|l] in [SCOPE.sState('santo_domingo_scope').GetName], many are now calling for the independence of [ROOT.GetCountry.GetName]."
 hai.12.f: "- 'This can’t go on! We’ve suffered enough under the yoke of [ROOT.GetCountry.GetName]!' – exclaimed Jacobo\n\n- 'It’s time to take action! We can’t let them trample on us any longer!' – responded Miguel\n\n- 'Listen to me, brothers and sisters! The time has come to claim our freedom!'\n\n- 'We must unite and resist. We cannot allow them to keep imposing unjust taxes and treating us as if we’re inferior.' – said a character who had just entered the room."
 hai.12.a: "Over my cold body"

 hai.13.t: "Declaration of Independence of Puerto Rico"
 hai.13.d: "The leaders of the newly created [SCOPE.sCountry('por_rico_scope').GetName] have published a manifesto stating the reasons why the Dominican people can no longer remain united with [ROOT.GetCountry.GetAdjective]."
 hai.13.f: "The rebels, led by [SCOPE.sCountry('por_rico_scope').GetRuler.GetFullName], took the fortress in the capital [SCOPE.sCountry('por_rico_scope').GetCapital.GetCityHubName]. The [ROOT.GetCountry.GetAdjective] garrison was caught by surprise, apparently betrayed by one of its sentinels."
 hai.13.a: "They will pay for this betrayal"

 hai.14.t: "$hai.12.t$"
 hai.14.d: "With the rise of [Concept('concept_pop', '$concept_population$')|l] [concept_radical|l] in [SCOPE.sState('puerto_rico_scope').GetName], many are now calling for the independence of [ROOT.GetCountry.GetName]."
 hai.14.f: "$hai.12.f$"
 hai.14.a: "Over my cold body"

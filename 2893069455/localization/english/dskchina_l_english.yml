je_jiawu_war_liuqiu_guishu: "Ryukyu Disposition"
je_jiawu_war_liuqiu_guishu_reason: "In 1609, the Satsuma clan invaded Ryukyu, creating a dual allegiance situation, and gradually came under Satsuma's control, becoming a vassal state. Under the direct command of Okubo Toshimichi, [SCOPE.sCountry('japan_scope').GetName] sent Matsuda Michinobu and other officials to Ryukyu to announce Japan’s decision: henceforth, Ryukyu will not send tribute to China, nor send envoys during the Qing Emperor’s ascension, and will follow Japan's Meiji calendar, among other measures. Despite Ryukyu’s objections and negotiations, Japan was accelerating the annexation of Ryukyu to avoid internationalizing the issue."
je_jiawu_war_liuqiu_guishu_tt: "[SCOPE.sCountry('china_scope').GetName] #bold Ryukyu's suzerain country#![concept_journal_entry] successfully completed#!"
jap_kor_jiashen_war_button:0 "Aid to the Korean Reform Party" 
jap_kor_jiashen_war_button_tt:0 "The decision to aid the Reform Party in Korea has not been used in the past year."
 jap_kor_jiashen_war_button_1_modifier:0 "Aid to the Korean Reform Party" jap_kor_jiashen_war_button_2_modifier:0 "Aid from Japan"

je_chi_baowei_kor1_war:0 "Korean Independence War" 
je_chi_baowei_kor1_war_reason:0 "Yuan Shikai sent people to Changde Palace to request an audience with the King, but was rejected by the Reform Party. Additionally, he sent the Kyunggi Inspector, Shen Xianghun, to return to the palace to inform of the Chinese troops entering the palace. At 10 a.m., Yuan Shikai, Wu Zhaoyou, and Zhang Guangqian jointly sent a letter to Japan’s Minister in China, Takezō Ichirō, informing him of the plan to send troops into the palace. By 3 p.m., no response had been received. Yuan Shikai, feeling the urgency, insisted on taking immediate action. He promised, 'If I am punished for causing this conflict, I will bear the responsibility alone, without involving anyone else.' With everyone’s agreement, Yuan Shikai quickly led a battalion and Korean royal guards to Changde Palace." je_chi_baowei_kor1_war_tt:0 "[SCOPE.sCountry('korea_scope').GetName] became a #gold tributary state# of [SCOPE.sCountry('japan_scope').GetName]!"

jiawu_war_events.5.t:0 "[SCOPE.sCountry('korea_scope').GetName] Reform Party Coup" jiawu_war_events.5.d:0 "The Seoul Post Office was completed, and during the evening ceremony at 6 p.m., key members of the Reform Party and the Postmaster Hong Yeong-shik hosted a banquet to lure the conservative ministers into a trap. Japanese envoy Takezō Ichirō claimed to be sick and did not attend, while Chinese military commander Yuan Shikai, sensing something was wrong, also declined the invitation. Only the Chinese Commercial Commissioner Chen Shutang and 18 conservative ministers, including Minister Min Yong-ik, attended." jiawu_war_events.5.f:0 "Later that night, Chen Shutang fled the post office to inform Yuan Shikai. The next morning, the Chinese legation received more specific information that the Reform Party had conspired with the Japanese military to stage a coup, detaining the King and killing several pro-China ministers. At this critical historical moment, the delay caused by relying on Beijing’s decision could risk losing the opportunity to salvage the situation." jiawu_war_events.5.a:0 "Stay put and urgently report the coup to Li Hongzhang." jiawu_war_events.5.b:0 "Allow Yuan Shikai to handle the coup in [SCOPE.sCountry('korea_scope').GetName]."

jiawu_war_events.6.t:0 "[SCOPE.sCountry('korea_scope').GetName] Reform Party Coup" jiawu_war_events.6.d:0 "At the time, Foreign Minister Inoue Kaoru was on his way back to Japan, and Ito Hirobumi, the Chief of the Imperial Household, was acting as interim Foreign Minister. After learning of Takezō Ichirō’s actions supporting the Reform Party's request for military withdrawal, Ito instructed that the message be delivered. Upon receiving the message, Takezō Ichirō immediately informed the Reform Party of the troop withdrawal, which greatly alarmed Kim Ok-gyun, the leader of the Reform Party. He urgently requested a 3-day delay for the withdrawal and also sought a loan of 3 million yen." jiawu_war_events.6.f:0 "Must support the Reform Party’s coup in [SCOPE.sCountry('korea_scope').GetName]." jiawu_war_events.6.b:0 "[SCOPE.sCountry('japan_scope').GetName] is still not a match for [SCOPE.sCountry('china_scope').GetName]."

je_chi_baowei_kor2_war:0 "The Final Struggle" 
je_chi_baowei_kor2_war_reason:0 "The 300 years of peace on the Korean Peninsula ended. Japan, with the momentum of the Meiji Restoration, sought to expand its influence in East Asia, specifically targeting Korea. Despite China's weakening power, it still sought to maintain its suzerain status over Korea. The game between the two countries ultimately pushed history to the brink of war."


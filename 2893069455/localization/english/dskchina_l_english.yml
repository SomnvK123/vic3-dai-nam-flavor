zhongfazz:0 "Sino-French War"
zhongfazz_reason:0 "[SCOPE.sCountry('chi_scope').GetAdjective] and [SCOPE.sCountry('dai_scope').GetAdjective] share a close geographical and cultural bond that has persisted throughout history.\n\nNow, [SCOPE.sCountry('fra_scope').GetAdjective] Catholic influence has entered [SCOPE.sCountry('dai_scope').GetAdjective]. During the Second Opium War, [SCOPE.sCountry('fra_scope').GetAdjective] began the military occupation of southern [SCOPE.sCountry('dai_scope').GetAdjective] (Nam Ky, known to Westerners as Cochinchina), turning the six southern provinces into [SCOPE.sCountry('fra_scope').GetAdjective] colonies.\n\nThey then proceeded from Saigon to explore a route along the Mekong River to [SCOPE.sCountry('chi_scope').GetAdjective]. Upon discovering that the upstream Lancang River was unsuitable for navigation, they turned towards northern [SCOPE.sCountry('dai_scope').GetAdjective] (Bắc Kỳ, known to Westerners as Tonkin), intending to use the Red River as a passage to invade [SCOPE.sCountry('chi_scope').GetAdjective]’s Yunnan.\n\n#v We must remain vigilant!#!"

gbr_will_invade_us:0 "This will give [SCOPE.sCountry('gbr_scope').GetName] a reason to start the [SCOPE.sGoods('opium_scope').GetName] War!"
loser_modifier:0 "Emperor's Reprimand"

its_difficult_game_tt:0 "#red In Historical Mode, [ROOT.GetCountry.GetName] will be weaker and harder to reform!#!"

its_easy_game_tt:0 "#green In Casual Mode, [ROOT.GetCountry.GetName] will skip some high-difficulty logs!#!"

2ndyapian:0 "The Second Opium War"
2ndyapian_reason:0 "[SCOPE.sCountry('bic_scope').GetName] was a monopoly company of [SCOPE.sCountry('gbr_scope').GetName] in the 17th century, enjoying exclusive trade rights in the East.\n\nIn the 18th century, [SCOPE.sCountry('bic_scope').GetName] established a monopoly opium production company in Bengal as a solution for paying for [SCOPE.sGoods('tea_scope').GetName]. [SCOPE.sGoods('opium_scope').GetName] was auctioned in Calcutta, shipped, and sold in Guangdong in exchange for silver. Smugglers from [SCOPE.sCountry('chi_scope').GetAdjective] brought [SCOPE.sGoods('opium_scope').GetName] inland, while the silver was used to buy [SCOPE.sGoods('tea_scope').GetName].\n\nThe trade in [SCOPE.sGoods('opium_scope').GetName] flourished rapidly in the early 19th century, and although it was illegal in [SCOPE.sCountry('chi_scope').GetAdjective], powerful British forces, local smugglers, and bribery rendered the law ineffective. Shockingly, the trade value of [SCOPE.sGoods('opium_scope').GetName] surpassed all global commodity trade, and the wealth it generated allowed major traffickers to buy land and parliamentary seats in [SCOPE.sCountry('gbr_scope').GetAdjective].\n\nMeanwhile, millions in China became addicted, with serious health impacts, even death. The true cost was poverty for the addicts and their families—a high price paid for promoting addictive substances then and now.\n\nWith growing societal consequences and royal deaths from addiction, anti-opium sentiments grew stronger in Beijing. Governor Lin Zexu was appointed to ban opium and seized large amounts in Guangdong, writing to Queen Victoria: “How can you, for profit, allow your subjects to poison ours?”"

sino_event.120.t:0 "[SCOPE.sCountry('chi_scope').GetAdjective]’s Path"
sino_event.120.d:0 "Welcome to this RA protagonist country: [ROOT.GetCountry.GetName]!"
sino_event.120.f:0 "In early 19th century [SCOPE.sCountry('chi_scope').GetAdjective] history, no incident was more shameful than the [SCOPE.sGoods('opium_scope').GetName] War with [SCOPE.sCountry('gbr_scope').GetName]. Reflecting on history is enlightening, especially for the Chinese people."
sino_event.120.a:0 "Choose a #red historical and challenging#! path for [SCOPE.sCountry('chi_scope').GetAdjective]"
sino_event.120.b:0 "Choose a #green easy and relaxed#! path for [SCOPE.sCountry('chi_scope').GetAdjective]"


concept_dsk_china:0 "China"
concept_dsk_china_desc:0 "Ancient China was originally centered in the Central Plains, a cultural center referred to as 'Zhonghua.' Over time, as territories expanded, all administered areas were called 'China.'"
concept_roc:0 "Republic of China"
concept_roc_desc:0 "Every citizen is equal and has the right to participate in governance. The president is elected by the people. Parliament is composed of representatives elected by the people, and the constitution of the [concept_roc] is upheld by all. Any attempt to restore imperial rule will be resisted."

sino_event.121.t:0 "The Hundred Days Coup!"
sino_event.121.d:0 "At dawn, [SCOPE.sCharacter('landowners_ig_general').GetFullName] rushed from the Summer Palace to the Forbidden City, imprisoning [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFullName] in the Zhongnanhai Yingtai. He then issued a decree ending the reforms."
sino_event.121.f:0 "Reformists dared to speak of 'civil rights' and recognized the people's right to participate in politics but failed to embrace 'democracy,' which acknowledges people as the masters of the state. All reform measures were eventually repealed!"
sino_event.121.a:0 "The weak bourgeoisie cannot save this country!"

modifier_difficult_china:0 "Monarchical Authority"
je_difficult_china:0 "The Grand Council"
je_difficult_china_tt:0 "Power is firmly held by [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFullName]!"
je_difficult_china_reason:0 "The #v #tooltippable;tooltip:[Country.GetTooltipTag],je_European_Restoration_tooltip_advance progressive laws#! will increase the progress bar, and if it exceeds conservative laws, conservatives will launch a coup against us!\n\nThe Grand Council ministers submit petitions, report to the emperor, and manage appointments, among other critical functions. This was one of [ROOT.GetCountry.GetName]'s central leadership styles."
modifier_autocracy_china:0 "Imperial Decree"
difficult_china_1_button:0 "Issue Decree"
difficult_china_1_button_desc:0 "“With the emperor’s direct red-ink instruction, responding to officials’ memorials, summoning ministers of the Grand Council to confer on affairs of state, and managing the empire’s daily matters—all matters are handled solely by him.”"

modifier_beijing_modifier:0 "Building the Imperial Capital"
difficult_china_2_button:0 "Develop the Capital"
difficult_china_2_button_desc:0 "“In the heavens is the Palace of the Purple Tenuity, the abode of the Supreme Lord. Kings, in modeling after it, build their palaces.”"

modifier_read_modifier:0 "Imperial Examination System"
difficult_china_3_button:0 "Hold Imperial Examinations"
difficult_china_3_button_desc:0 "The eight-part essay was composed of fixed sections, including introduction, topic presentation, exegesis, main argument, secondary argument, and conclusion. The rigid structure demanded the essay to 'speak for the sages,' emulating Confucius, Mencius, and the revered words of scholars like Cheng and Zhu. Thus, the eight-part essays often came off as obscure, unclear, and overly rigid in style."

modifier_words_modifier:0 "Literary Inquisition"
difficult_china_4_button:0 "Enforce Literary Inquisition"
difficult_china_4_button_desc:0 "“After three hundred years, few documents survived from the Qing era. Is there any doubt about the effects of the literary inquisition?”"

conquer_tt:0 "#n Numerous border issues may become thorns in our side, but we will embark on a path of conquest#!"
development_tt:0 "#v Domestic content will be completed in the next version#!"

has_easy_var:0 "#v Chose Casual Mode#!"

ideology_china_Westernization:0 "Self-Strengthening Faction"
ideology_china_Westernization_desc:0 "This group’s guiding principle is to 'learn from foreign expertise for self-strength.' They believe in 'using Chinese knowledge as the essence, Western knowledge for practical application.' Their goal is to adopt Western industrial technology to strengthen the military and economy, overcome crises, and maintain the Qing dynasty's rule."

je_Westernization_movement:0 "Self-Strengthening Movement"
je_Westernization_movement_reason:0 "Our country has inevitably been drawn into the [concept_great_power] conflicts and onto the world stage.\n\nWestern nations, having experienced the Industrial Revolution, are clearly ahead of us in technology. If we cannot learn from them to counter them, with Chinese principles as our foundation and Western methods as our tools, [SCOPE.GetRootScope.GetCountry.GetName] will struggle to keep up in the world."
je_Westernization_movement_tt:0 "#v Chinese principles as essence, Western methods as tools#!"
je_Westernization_movement_goal:0 "Complete the four Self-Strengthening Movement reforms"

je_Westernization_railway:0 "Self-Strengthening Movement: Railways"
je_Westernization_railway_reason:0 "Representatives of the Self-Strengthening Faction, like #yellow Liu Mingchuan#!, submitted requests to build railways and presented concrete construction plans.\n\n#yellow Liu Mingchuan#! argued that railways are “quick, safe, strategic, helpful in suppressing internal unrest, and cost-saving in military expenses.” Therefore, building railways would bolster our military and economic strength."
je_Westernization_railway_tt:0 "Build a railway spanning all of [SCOPE.sCountry('chi_scope').GetAdjective]!"

modifier_china_develop:0 "Enrich the Nation and Strengthen the Army"
modifier_great_power_support:0 "Overseas Talents"

je_Westernization_shopping:0 "Self-Strengthening Movement: Prosperity"
je_Westernization_shopping_tt:0 "#v Develop handicrafts and national capitalism#!"
je_Westernization_shopping_reason:0 "With prosperity as the banner, we established various modern industries, such as steamships, railways, telegraphs, postal services, mining, and textile mills. The largest civilian enterprise in Shanghai was the China Merchants' Steam Navigation Company, which also spurred the development of modern Chinese industry."

je_Westernization_weapon:0 "Self-Strengthening Movement: Self-Defense"
je_Westernization_weapon_tt:0 "#v Develop military industry and build a modern army#!"
je_Westernization_weapon_reason:0 "With self-defense as the goal, we imported advanced production technology from the West, established new military industries, trained a modern army and navy, and founded the Beiyang Fleet and other modern naval forces."

je_Westernization_skool:0 "Self-Strengthening Movement: Education"
je_Westernization_skool_tt:0 "#v Develop education and open schools#!"
je_Westernization_skool_reason:0 "We established modern schools, sent students abroad for advanced studies, and trained talents in translation, military, and science and technology."

je_Westernization_company:0 "Self-Strengthening Movement: Enterprises"
je_Westernization_company_tt:0 "#v Establish national enterprises#!"
je_Westernization_company_reason:0 "Advancing modernization nationwide and resisting the economic penetration of foreign capitalism."

sino_event.123.t:0 "Self-Strengthening Movement, Unceasing Effort"
sino_event.123.d:0 "Self-Strengthening Movement"
sino_event.123.f:0 "Decades ago, we were gravely harmed by [SCOPE.sCountry('gbr_scope').GetName], left weak and struggling. Since the Opium Wars, [concept_great_power] has persistently encroached upon us.\n\nRooted in the foundations of [SCOPE.sCountry('chi_scope').GetAdjective], we shall learn from foreign expertise to counter them, resolve internal and external threats, and achieve a prosperous and powerful nation."
sino_event.123.a:0 "Base it on the moral teachings of China, and supplement with the strengths of other nations."
sino_event.122.t:0 "[concept_dsk_china]'s Natural Boundaries"
sino_event.122.d:0 "In the twenty-fifth year of Qianlong (1760), after [ROOT.GetCountry.GetName] had pacified the Dzungar Khanate, its territory reached its peak. At this time, [concept_dsk_china]'s borders extended from the Tannu Uriankhai region of Mongolia and Siberia in the north to the South China Sea islands in the south, including the Thousand Li Stone Reefs, Ten Thousand Li Sandbanks, and Zengmu Shoal. In the southwest, it reached as far as the Dawang region in Tibet, southern Yunnan's Namwan and Jiangxinpo areas in northern Burma, and extended westward to the Pamirs and Lake Balkhash. To the northeast, it reached the Outer Xing'an Mountains and included Sakhalin Island, while the southeast included Taiwan and the Penghu Islands. The land area during this period was an impressive 13.16 million square kilometers, resembling a beautiful begonia leaf."
sino_event.122.f:0 "In the courtyard, begonias bloom in purple clusters,\n\nReflecting in the wind and rain, clear and beautiful.\n\nImmortals naturally understand the arts of the Red Hill,\n\nGrowing these flowers is a celestial act."
sino_event.122.a:0 "The border issues and natural boundaries of [concept_dsk_china] with [concept_great_power] deserve renewed discussion!"
sino_event.122.b:0 "The begonia leaf of [concept_dsk_china] is large enough; we should focus on domestic matters!"

foreign_student_button:0 "Send Students Abroad"
foreign_student_button_desc:0 "The Self-Strengthening faction initiated the overseas education movement to learn advanced Western technology and improve the backwardness of the Qing government. The most influential educational missions during this time were the Chinese Educational Mission to the United States and the students from the Fuzhou Arsenal School studying in Europe."

founding_father_tt:0 "#yellow Sun Yat-sen#! has appeared"

je_xinhai_revolution_tt:0 "Expel the Barbarians, Restore [concept_dsk_china]"

wuchang_now_button: "Wuchang Uprising"
wuchang_now_button_desc: "Expel the barbarians, restore China, establish a republic, and distribute land fairly!"

revolution_now_tt: "End this log immediately and trigger [concept_revolution]"

kaiping_tt:0 "#v Kaiping Mines#! with [concept_prosperity]>= 100"
hanyang_tt:0 "#v Hanyang Arsenal#! with [concept_prosperity]>= 100"
foochow_tt:0 "#v Fuzhou Shipyard#! with [concept_prosperity]>= 100"

sino_event.124.t:0 "Emerging Railways"
sino_event.124.d:0 "Every province in China should have railways, 'to serve as the arteries of the nation, as their flow ensures health.'"
sino_event.124.f:0 "Since Britain built the world’s first railway in 1825, its economic, political, and military impacts have become widely recognized. Western countries quickly followed suit, achieving significant progress in railway construction within just a decade.\nToday, our railway development is also advancing globally. Routes now connect Hankou to Shanghai, Hankou to Guangdong, Hankou to Sichuan, Shanghai to Fuzhou, Zhenjiang to Beijing, and Guangdong to Yunnan, creating a vast and busy railway network."
sino_event.124.a:0 "A pioneering act for China, an unprecedented endeavor in history."

sino_event.125.t:0 "National Light Industry"
sino_event.125.d:0 "A strong defense foundation lies in the development of the national economy, requiring energy, steel, and other industries as support. Additionally, to protect national interests, we must develop our own economy and engage in 'trade wars' and 'profit battles' with foreigners."
sino_event.125.f:0 "In 1872, Li Hongzhang established the China Merchants' Steam Navigation Company in Shanghai. This was the first civilian enterprise founded by the Self-Strengthening faction. Within just three years, the company recovered more than 13 million silver taels for the Qing government and expanded internationally, breaking the foreign shipping monopoly."
sino_event.125.a:0 "Industries such as textiles, waterworks, power plants, silk reeling, cotton ginning, paper-making, printing, pharmaceuticals, and glass manufacturing are flourishing!"

sino_event.126.t:0 "National Military Industry"
sino_event.126.d:0 "The military industry, funded by the Qing government, provides products for military use."
sino_event.126.f:0 "The military industry has supplied [ROOT.GetCountry.GetName]’s armed forces with advanced weapons, enhancing the combat capabilities of the military."
sino_event.126.a:0 "‘Self-Strengthening,’ ‘Revitalization’"

sino_event.127.t:0 "National Education"
sino_event.127.d:0 "New curricula included Western subjects, such as Western languages and arts, while implementing new teaching methods, organized courses by year, and adopting a classroom-based instruction model."
sino_event.127.f:0 "The publishing industry reached an unprecedented level. The Tongwen Guan in Beijing, Guangfangyan Guan in Shanghai, and the Translation Bureau at the Jiangnan Arsenal became translation centers of Western knowledge, expanding from pure Western science and technology texts to natural sciences, social sciences, and humanities."
sino_event.127.a:0 "We sincerely adopt Western sciences to uphold the values of Yao, Shun, Yu, Tang, Wen, Wu, Zhou, and Confucius."

sino_event.128.t:0 "Enrich the Nation, Strengthen the Army"
sino_event.128.d:0 "The path of the Self-Strengthening Movement is fraught with challenges: lack of funds, difficulty in finding technology, and shortage of talent are all pressing issues. Yet our resolve is steadfast, unwavering even in the face of numerous setbacks."
sino_event.128.f:0 "At a time of national weakness, as our power declines, foreign powers encircle us, and the people suffer. We thus initiated the Self-Strengthening Movement to seek self-reliance and wealth, hoping to turn the tide.\n\nOur military strength is no longer what it once was. We import Western weaponry, replicate firearms, manufacture ships and equipment—all precise and durable. Our soldiers are trained in new methods and skilled in battle, ensuring victory. This will deter foreign aggressors and secure peace on our borders.\n\nThe economy has also flourished beyond what it once was. We developed industries, set up manufacturing facilities, and business thrived. The circulation of gold and silver flows unceasingly. The people's livelihood improves daily; national prosperity and strength are within reach.\n\nPolitical changes are also quietly underway. Though we do not yet speak of revolution, the spread of Western knowledge has stirred thoughts of change. The court, too, realizes the need to adapt to the times, implementing reforms to meet the mandate of Heaven. This will bring about national prosperity and ensure long-lasting stability."
sino_event.128.a:0 "May all young people of China cast off cold indifference and strive upward, ignoring the naysayers of self-destruction."

sino_event.129.t:0 "National Enterprises"
sino_event.129.d:0 "The Self-Strengthening faction established several modernized military industries across the country, such as the Jiangnan Arsenal and Fuzhou Arsenal."
sino_event.129.f:0 "These enterprises used machinery to produce guns, ammunition, ships, and other military equipment to strengthen and update our military capabilities."
sino_event.129.a:0 "Could these modern enterprises, established using Western technology, become [ROOT.GetCountry.GetName]'s strategic advantage?"

sino_event.122.t:0 "Natural Territory of [concept_dsk_china]"

sino_event.122.d:0 "In the 25th year of Emperor Qianlong (1760), [ROOT.GetCountry.GetName] reached its territorial zenith after pacifying the Dzungar Khanate. At this time, the territory of [concept_dsk_china] extended north to the Tannu Uriankhai region of Mongolia and Siberia, south to the South China Sea islands including 'Qianli Shitang, Wanli Changsha, and Zengmu Ansha,' southwest to Tibet’s Tawang region, Yunnan's Namhkam, and Jiangxinpo in northern Myanmar, west to the Pamir Mountains and Lake Balkhash, northeast to the Outer Xing'an Ridge including Sakhalin Island, and southeast encompassing Taiwan and the Penghu Islands. The land area reached a staggering 13.16 million square kilometers, resembling a brilliant autumn begonia leaf."

sino_event.122.f:0 "The begonia blooms purple in the court, reflecting the breeze and rain, pure and bright. Celestial beings master the arts of Mount Danqiu, planting flowers akin to those of immortals."

sino_event.122.a:0 "The border issues with [concept_great_power] and the natural boundaries of [concept_dsk_china] are worth discussing again!"

sino_event.122.b:0 "The begonia leaf of [concept_dsk_china] is large enough; we should focus on internal affairs!"
sino_event.122.c:0 "Whether it's foreign or domestic affairs, I'm going to do it all"



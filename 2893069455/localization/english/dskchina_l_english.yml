sino_event.130.t:0 "Wuchang Uprising"
sino_event.130.d:0 "You are fortunate to have me, yet how unfortunate to live in today’s [SCOPE.sCountry('chi_scope').GetAdjective]! I am fortunate to have you, yet how unfortunate to live in today’s [SCOPE.sCountry('chi_scope').GetAdjective]! — 'Letter to My Wife'"
sino_event.130.f:0 "I would gladly face death to stay with you, but in observing the current situation, natural disasters, banditry, partition of the country, and the oppression of corrupt officials bring death everywhere and at any time. Could I watch helplessly as you perish, or could you watch helplessly as I perish? Even if we both survive, we may be separated, never to meet again, as if our eyes turn hollow and our bones turn to stone. How often has a broken mirror been restored in history? Such separation would be more bitter than death. What should we do?\n\nToday, I am fortunate to be alive and well with you. Thousands of people like us have died undeservedly or been forcibly separated, and people like me who are deeply in love cannot bear this. That is why I dare to face death without regard for your sorrow. I die without regret, for others who share our aspirations will carry on."

sino_event.130.a:0 "My heart's desire is firm; though I die a thousand deaths, I have no regrets."

sino_event.134.a:0 "Uremia took the life of #yellow Yuan Shikai#!, ushering in a chaotic era of warlord conflicts."

sino_event.135.t:0 "[concept_battle_of_east_asia]"
sino_event.135.d:0 "The [concept_battle_of_east_asia] has begun, with [SCOPE.sCountry('jap_scope').GetName] and [SCOPE.sCountry('chi_scope').GetName] declaring each other as [concept_rivalry]!"

sino_event.135.f:0 "From the Sea of Japan to the South China Sea, from Korea to Manchuria and Taiwan, Japan’s continental policy has radiated across East Asia, leading to an unavoidable crisis!"

sino_event.135.a:0 "Once the war begins, neither side can stop it unilaterally."

sino_event.135.b:0 "Our relationship with [SCOPE.sCountry('chi_scope').GetAdjective] is inseparable!"

sino_event.135.c:0 "Our relationship with [SCOPE.sCountry('jap_scope').GetAdjective] is inseparable!"


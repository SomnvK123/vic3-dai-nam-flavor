china_borders.21.t:0 "[SCOPE.sCharacter('gaixin').GetFullName]'s memorial to the throne"
china_borders.21.d:0 "Since the massive influx of [SCOPE.sGoods('opium_scope').GetName] into [SCOPE.sCountry('chi_scope').GetAdjective] and its immeasurable impact, silver has continuously flowed out, disrupting the national treasury and currency circulation, and causing severe harm to the health of addicts, bringing our economy to the brink of collapse!"
china_borders.21.f:0 "“As long as [SCOPE.sGoods('opium_scope').GetName] is not eradicated, I will not leave; I am determined to see this matter through without stopping.” — [SCOPE.sCharacter('gaixin').GetFullName]"
china_borders.21.a:0 "Never allow [SCOPE.sGoods('opium_scope').GetName] to harm us further"
china_borders.21.b:0 "[SCOPE.sCharacter('gaixin').GetFullName], manage your own mess"

gbr_will_invade_us:0 "This will give [SCOPE.sCountry('gbr_scope').GetName] a reason to start the [SCOPE.sGoods('opium_scope').GetName] War!"
loser_modifier:0 "The Emperor's Reprimand"

its_difficult_game_tt:0 "#red Historical mode: [ROOT.GetCountry.GetName] will be weaker and face more difficulty in reforms!#!"


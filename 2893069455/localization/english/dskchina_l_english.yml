lia_event_rtc.1.t:0 "[SCOPE.sCountry('gbr_scope').GetName] - [SCOPE.sCountry('chi_scope').GetName] Opium War"
lia_event_rtc.1.d:0 "[SCOPE.sCountry('gbr_scope').GetName] - [SCOPE.sCountry('chi_scope').GetName] signed the Treaty of Nanking!"
lia_event_rtc.1.f:6 "Breaking news! News about the Opium War is spreading rapidly. Contrary to initial European concerns, it's said that Britain achieved a decisive victory against the Qing Dynasty, securing treaty ports and war reparations. Britain officially declared that this war was a legitimate act of self-defense. However, there are criticisms within Britain regarding the war's morality. Below are the details of the treaty...\n<Article 1> From now on, the great Qing Emperor and the monarch of Great Britain will always be at peace, their Chinese and British subjects living in mutual harmony, and those residing in each other's countries shall be protected...\n<Article 2> [SCOPE.sCountry('chi_scope').GetName] permits Great Britain to use a treaty port for Sino-British trade..."
lia_event_rtc.1.a:0 "We should swiftly expand our interests in the Qing Dynasty!"
lia_event_rtc.1.b:0 "Is the apple of the East waiting for us to pluck?"
lia_event_rtc.1.c:0 "Although the Qing has been defeated, it remains a powerful nation in the East. We shouldn't kick them while they're down."

lia_event_rtc.2.t:0 "News from the East"
lia_event_rtc.2.d:0 "[SCOPE.sCountry('chi_scope').GetName] - [SCOPE.sCountry('gbr_scope').GetName] Opium War"
lia_event_rtc.2.f:2 "Our envoy has returned from the Qing Dynasty with important news. The Qing Dynasty signed the Treaty of Nanking with Britain, establishing tributary relations and granting concessions."
lia_event_rtc.2.a:0 "Do we need to reassess our relationship with the Qing Dynasty?"
lia_event_rtc.2.b:0 "Is the Mandate of Heaven for China turning at this moment?"

lia_event_rtc.3.t:0 "Sign the Treaty of Nanking"
lia_event_rtc.3.d:0 "Self-strengthening Movement"
lia_event_rtc.3.f:1 "20 years ago, we [SCOPE.sCountry('gbr_scope').GetName] were weak. Ever since we were harmed by the barbarians, foreign powers have continuously encroached upon us. Thus, based on the foundation of the Qing Dynasty, we adopt foreign techniques to defend against foreigners, seeking military and cultural development."
lia_event_rtc.3.a:0 "The dragon will awaken once again."

lia_event_rtc.4.t:0 "[SCOPE.sCountry('gbr_scope').GetName] - [SCOPE.sCountry('chi_scope').GetName] Opium War"
lia_event_rtc.4.d:0 "[SCOPE.sCountry('gbr_scope').GetName] - [SCOPE.sCountry('chi_scope').GetName] The former glory of the Eastern Dragon has vanished!"
lia_event_rtc.4.f:6 "Breaking news! News of the war in the Far East is spreading rapidly. Contrary to initial European concerns, it's said that Britain achieved a decisive victory against the Qing Dynasty, securing treaty ports and war reparations. Britain officially declared this war as a legitimate act of self-defense. However, there are criticisms within Britain regarding the war's morality. Below are the details of the treaty...\n<Article 1> [SCOPE.sCountry('chi_scope').GetName] acknowledges the material and financial power of China, pledges goodwill with other nations, recognizes Britain's interests in China, and compensates Britain for war losses...\n<Article 2> [SCOPE.sCountry('chi_scope').GetName] permits Great Britain to use a treaty port for Sino-British trade..."
lia_event_rtc.4.a:0 "The era of the Celestial Empire has passed!"

lia_event_rtc.5.t:0 "Taiping Heavenly Kingdom Rebellion"
lia_event_rtc.5.d:0 "Rebels are plotting!"
lia_event_rtc.5.f:0 "These so-called rebels of [SCOPE.sCountry('heavenly_kingdom_scope').GetName] are ravaging the lands of the Qing Dynasty, committing massacres against the Manchu people. We must suppress them swiftly for our future."
lia_event_rtc.5.a:0 "The Mandate of Heaven for the Qing Dynasty shall not fall!"
lia_event_rtc.6.t:0 "Taiping Heavenly Kingdom Movement"
lia_event_rtc.6.d:0 "A New Beginning!"
lia_event_rtc.6.f:0 "The reason why China has reached this point, being oppressed by Western powers, is due to the Qing Dynasty's corruption and incompetence. Hence, we rise up in anger to overthrow the Qing court."
lia_event_rtc.6.a:0 "Expel the barbarians, restore China!"

lia_event_rtc.7.t:0 "[SCOPE.sCountry('heavenly_kingdom_scope').GetName]"
lia_event_rtc.7.d:0 "The Taiping Rebellion"
lia_event_rtc.7.f:2 "There's a massive rebellion erupting across [SCOPE.sCountry('chi_scope').GetName] China. Their leaders from [SCOPE.sCountry('heavenly_kingdom_scope').GetName] claim to be the sons of God and the younger brothers of Jesus, spreading a peculiar version of Christianity. We're unsure about how this rebellion will evolve, but one thing's certain: we must take action."
lia_event_rtc.7.a:0 "He's the son of God? That's inappropriate."
lia_event_rtc.7.b:0 "Is it time for the Qing Dynasty to collapse? China needs a new order."
lia_event_rtc.7.c:0 "For now, let's wait and see."

lia_event_rtc.8.t:0 "[SCOPE.sCountry('heavenly_kingdom_scope').GetName]"
lia_event_rtc.8.d:0 "The Taiping Rebellion"
lia_event_rtc.8.f:2 "There's a massive rebellion erupting across [SCOPE.sCountry('chi_scope').GetName] China. Their leaders from [SCOPE.sCountry('heavenly_kingdom_scope').GetName] claim to be the sons of God and the younger brothers of Jesus, spreading a peculiar version of Christianity. Can the Qing Dynasty really suppress this rebellion? What will the great powers decide?"
lia_event_rtc.8.a:0 "Is this the end for the Qing Dynasty?"


je_liuqiu_wang_ji:0 "King’s Death"
je_liuqiu_wang_ji_reason:0 "[ROOT.GetCountry.GetName] was the 18th King of the Second Shō dynasty, ascending to the throne in the 15th year of the Daoguang reign. The son of King Shō Haō and the father of the last king of Ryukyu, Shō Tai. He was born as Shīde Jin, also known as Shī Zhēn Pú Tóu Jin. During his reign, the kingdom faced financial hardship, and Ryukyu gradually declined. He passed away in the 27th year of Daoguang, after 13 years on the throne at the age of 35, and was buried in Yuling."


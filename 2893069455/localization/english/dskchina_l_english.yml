je_gonggu_manzhou:0 "Consolidating Northeast Territories"
je_gonggu_manzhou_reason:0 "On September 7, 1689, China and Russia signed the Treaty of Nerchinsk, which delineated the eastern border between the two countries. Except for the disputed Ussuri River region, the treaty legally confirmed that vast areas, including the Heilongjiang and Amur River basins and Sakhalin Island, belonged to China. However, these areas were never effectively controlled. To counter the expansionist ambitions of Tsarist Russia and Japan, we must strengthen our control over Northeast China."

je_jiawu_war_dongnanya:0 "Conquer Southeast Asia"
je_jiawu_war_dongnanya_reason:0 "Southeast Asia is rich in oil and rubber, especially rubber, which is not available in the Northeast or Korea. To the west, we can also invade India, the most important British colony, and obtain India's abundant human and mineral resources."

je_zhengfu_manzhou:0 "Conquer Northeast China"
je_zhengfu_manzhou_reason:0 "The strategic location of Northeast China is exceptionally important. To the north, we can use Siberia to extend our influence into Europe. To the south, we can control North China, forming a defensive triangle with our homeland. The vast resources of the Northeast are urgently needed by Japan."
je_zhengfu_manzhou_tt:0 "[SCOPE.sCountry('china_scope').GetName]#bold Successfully completed# the consolidation of Northeast territories#!"

je_jiawu_war_taipingyang:0 "Define the US Border"
je_jiawu_war_taipingyang_reason:0 "The border between our country and the United States is long and informal. Seeking to establish a formal border between our country and the United States will allow large territories to come under our control and minimize the risk of future border conflicts."

je_jiawu_war_taipingyang_usason_tt:0 "[SCOPE.sCountry('japan_scope').GetName] is paying #gold war reparations to [SCOPE.sCountry('usa_scope').GetName] weekly."

jiawu_war_events.8.t:0 "Japan-US Security Treaty"
jiawu_war_events.8.d:0 "“Japan recognizes the US military presence in Japan; the US military in Japan can, at Japan's request, use force to suppress internal rebellions and uprisings, as well as to combat external military attacks, in order to maintain peace in the Far East and ensure Japan's security.”"
jiawu_war_events.8.f:0 "“This is where I was born and raised; military bases have always been here, and I have no aversion to foreigners. It's not unusual to see people from other countries in the city.”\n\n“I greatly admire the alliance between Japan and America. There's nothing better than former enemies becoming the best allies and friends. I hope that Japan and America can walk together into a distant future as eternal allies and friends.”\n\n“America's divine soldiers will protect the Japanese people.”"
jiawu_war_events.8.a:0 "[SCOPE.sCountry('japan_scope').GetName]: I swear eternal loyalty to you! Loyalty!"

je_ai_donghak_movement:0 "AI Donghak Movement"
je_ai_donghak_movement_reason:0 "In response to the country's opening to the outside world, Donghak, or Eastern Learning, has begun to spread among the peasants of [ROOT.GetCountry.GetName]. The followers of Donghak, often from [SCOPE.gsInterestGroup('donghak_ig').GetName], advocate for the equality and rights of all people and resist foreign influence.\n\nDonghak followers have established institutions across the country, which could potentially be used as a means to quickly organize rebellion in the future."

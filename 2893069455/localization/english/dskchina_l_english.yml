sino_event.125.d:0 "A strong national defense requires the development of the national economy, including supporting industries such as energy and steel. Additionally, to protect national interests, it is essential to develop the national economy and compete in 'trade wars' and 'profit contests' with foreigners."
sino_event.125.f:0 "In 1872, Li Hongzhang established the China Merchants Steam Navigation Company in Shanghai, the first civilian enterprise launched by the Westernization faction. Within just three years, it generated over 13 million taels of silver for the Qing government, expanded operations abroad, and broke the foreign monopoly on shipping."
sino_event.125.a:0 "Textiles, waterworks, power plants, silk reeling, cotton ginning, paper, printing, pharmaceuticals, glass manufacturing, and other industries are flourishing!"

sino_event.126.t:0 "National Military Industry"
sino_event.126.d:0 "Military industry, funded by the Qing government, provides products exclusively for the army."
sino_event.126.f:0 "The military industry provides the [ROOT.GetCountry.GetName] army with advanced weaponry, enhancing combat effectiveness."
sino_event.126.a:0 "‘Self-strengthening’ and ‘revitalization’"

sino_event.127.t:0 "National Education"
sino_event.127.d:0 "The new curriculum includes Western studies, such as Western languages and arts; new forms of education, such as structured yearly courses and class-based instruction, have been implemented."
sino_event.127.f:0 "The cultural publishing industry reached an unprecedented level of development. The Tongwen Guan in the capital, the Guangfang Yan Guan in Shanghai, and the Jiangnan Arsenal Translation Bureau became centers for translating Western knowledge. Translations shifted from purely Western science and technology books to an equal emphasis on natural science, social science, and humanities."
sino_event.127.a:0 "We sincerely adopt the Western sciences to safeguard the principles of Yao, Shun, Yu, Tang, Wen, Wu, Zhou, and Confucius."

sino_event.128.t:0 "National Prosperity and Military Strength"
sino_event.128.d:0 "The path of the Westernization Movement is fraught with thorns. Funding is scarce, technology is hard to obtain, and talent is in short supply, yet our determination is as steadfast as steel, undaunted by setbacks."
sino_event.128.f:0 "In these times of national weakness, with the country in decline, foreign powers encircle us, and the people suffer. We are heartbroken and thus advocate for the Westernization Movement, aiming to seek wealth and strength to reverse the tide. In military affairs, we are no longer novices. We import Western weaponry, produce firearms, build ships, and manufacture equipment—all of high quality and durability. Our soldiers are trained in new methods, disciplined, and sure to win in battle. In such conditions, foreign enemies dare not provoke us, and our borders are secured.\n\nEconomic prosperity is also unprecedented. We establish factories and mines, set up bureaus for equipment manufacturing, attract merchants, and see flourishing industries. Gold and silver flow like a river, and the people's lives improve daily. National wealth and strength are on the horizon.\n\nChanges in governance are also quietly underway. Although we dare not speak of revolution, Western ideas are spreading, and the people yearn for change. The court, aware of shifting times, enacts reforms to comply with the mandate of heaven. In this way, national prosperity and long-lasting peace are within reach."
sino_event.128.a:0 "May Chinese youth cast off pessimism, and rise upwards, undeterred by the words of the self-destructive."

sino_event.129.t:0 "National Industry"
sino_event.129.d:0 "The Westernization faction established a number of modernized military industries across the country, such as the Jiangnan Arsenal and the Foochow Arsenal."
sino_event.129.f:0 "These enterprises adopted machinery production to manufacture weapons, ammunition, ships, and other military equipment, strengthening and modernizing our military forces."
sino_event.129.a:0 "Could modern enterprises founded using Western technology become the strength of [ROOT.GetCountry.GetName]?"


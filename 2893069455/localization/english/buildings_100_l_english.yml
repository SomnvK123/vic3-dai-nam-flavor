modifier_let_our_alliance_amazing:0 "Military Aid"

je_ger_colony:0 "German Colonies"
je_ger_colony_tt:0 "We want lands in the sun!"
je_ger_colony_reason:0 "Gentlemen seem concerned that we might get involved in an adventure in #yellow East Asia#!. However, gentlemen, fear not!\nOur Chancellor is not that kind of person, nor are his aides fond of being busy for nothing. We are definitely not busybodies. But we believe that from the very beginning, we should not exclude Germany from competition for these fertile lands with other countries.\nLet other nations divide the land and the sea while our [concept_germany_second_empire] has outgrown the age of merely satisfying ourselves with the blue skies. #v We believe it is our priority to create and promote our shipping, trade, and industrial interests, especially our interests in the East.#!\nOur cruiser squadron has now been dispatched to [SCOPE.sCountry('chi_scope').GetName] to occupy #v Jiaozhou Bay#!, to ensure proper compensation for the two murdered [SCOPE.sReligion('catholic_religion').GetName] missionaries and guarantee the safety of missionaries in China to prevent similar incidents from happening in the future.\nIn fact, we are negotiating for this, but due to the bilateral nature of these negotiations and the nature of this case, I must be cautious with my words. All I can say is that we have nothing but benevolent intentions towards [SCOPE.sCountry('chi_scope').GetName]. We do not wish to offend or provoke #yellow China#!.\nDespite the very unfair treatment we have received, the occupation of Jiaozhou Bay must be conducted carefully. We hope to continue the long-standing partnership between the two countries, which has never been disturbed in the past. However, maintaining this friendship requires mutual respect for each other's rights.\nThe massacre of our missionaries by the Chinese is a clear and compelling reason for intervention, as we do not believe these devout individuals were excluded from the law while peacefully carrying out their sacred duties. In fact, apart from this unfortunate incident, we have many other grievances against #yellow China#!.\nWe hope to successfully resolve issues in a negotiating environment that respects each other, but we cannot allow the prevailing view in China to be that one can enjoy freedom together with us while not enjoying it with other nations. #bold We must demand that German missionaries, merchants, goods, and the German flag and ships in China receive the same respect as other great powers.#! We are very willing to respect the interests of other [concept_great_power] in China and ensure that our own interests receive the recognition they deserve from them.\n\nIn short: #red We do not want to take anyone's cup, but we also want our own land in the sun#!."

dsk_prussia.22.t:0 "False Compromise"
dsk_prussia.22.d:0 "[Concept('concept_ruler','$RULER_TITLE_KING$')][ROOT.GetCountry.GetRuler.GetFirstName] returned to #yellow Berlin#! and officially ordered the dissolution of the parliament, achieving a counter-[concept_revolution] coup."
dsk_prussia.22.f:0 "The sunlight flickers back and forth,\n\nThe waves rock the joyful little boat.\n\nLaughter and singing abound! I sit inside,\n\nRelaxed and happy, with dear friends.\n\nThe boat is completely shattered,\n\nMy friends can’t swim,\n\nThey drowned in the homeland;\n\nThe storm blows me to the banks of the Seine.\n\nWith new comrades, I board a new boat;\n\nThe tides of a foreign land surge,\n\nRocking my ship back and forth—\n\nHow far is my homeland! How heavy is my heart!\n\nOnce again, laughter and singing fill the air—\n\nThe wind whistles, the boards of the boat creak—\n\nThe last star of the sky vanishes—\n\nHow heavy is my heart! How far is my homeland!"
dsk_prussia.22.a:0 "If I had known this, why bother at first?"

dsk_prussia.23.t:0 "True Compromise"
dsk_prussia.23.d:0 "[Concept('concept_ruler','$RULER_TITLE_KING$')][ROOT.GetCountry.GetRuler.GetFirstName] offered a compromise to [concept_revolution], preserving the freedom of the constitution and the right of public assembly!"
dsk_prussia.23.f:0 "In the [concept_germany][concept_revolution], #yellow Marx#! and #yellow Engels#! engaged in extensive activities. After the victory of the February Revolution in [SCOPE.sCountry('fra_scope').GetName], #bold Paris#! became the center of revolution in Europe. Many exiles from Germany, Poland, and Italy flocked to #bold Paris#!, igniting a wave of organizing revolutionary corps to return home and join the revolution. #yellow Marx#! and #yellow Engels#! also came from #bold Brussels#! to #bold Paris#!. In #bold Paris#!, they helped reorganize the Communist League, forming a new central committee with #yellow Marx#! as chairman and #yellow Engels#! as a member."
dsk_prussia.23.a:0 "Did [concept_revolution] truly win??"


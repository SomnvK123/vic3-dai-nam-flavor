dsk_prussia.24.f:0 "In 1883, German merchant Luders announced the remaining coastline of Namibia as German territory. After the Berlin Conference in 1885, Britain abandoned its territorial claims in Namibia. In 1890, Germany occupied all of Namibia and named it #v German South West Africa#!."

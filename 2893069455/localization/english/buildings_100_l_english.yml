l_english:
 building_bank:0 "Bank"
 je_ger_union_tt:0 "Uniting Germany is our mission!"
dsk_je_germany_war_button:0 "Demand that the Confederation fulfill its collective defense obligations"
dsk_je_germany_war_button_desc:0 "When our country is invaded by non-German states, we can demand that the other German states contribute troops to fulfill their collective defense obligations."
dsk_je_ger_union:0 "[concept_germany_country]"
dsk_je_ger_union_reason:0 "#v Current Member States: [JournalEntry.CalcCurrentGoalValue|V|0]#! \n\nThe Confederation will hold a plenary session every four years in [SCOPE.sCountry('frm_scope').GetName].\n\n#yellow Charlemagne#!'s last legacy to Germany, the #yellow Holy Roman Empire#!, was destroyed by Napoleon's armies. In its ruins, numerous fully sovereign states and free cities emerged.\nUnder the diplomatic efforts of Metternich, the Congress of Vienna ultimately chose to establish a new union of sovereign states, the #v [concept_germany_country]#!, as a replacement for the old empire. The Confederation had no real executive body, and issues pertaining to it were resolved by the Confederation Congress, hosted by [SCOPE.sCountry('aus_scope').GetName] in Frankfurt. In theory, the Congress had considerable power. However, without administrative officials beneath it, it could only execute its orders through cumbersome procedures of the Confederation's administrative bodies.\nMoreover, the judiciary lacked sanctioning measures, making the Confederation a tool for conservatives to achieve their goals. The Confederation created a facade of [concept_germany] unity, but perhaps one day, it could lead [concept_germany] towards true unity?"
every_4_years_tt:0 "A conference can be convened every four years"
dsk_je_germany_meeting_button:0 "Convene the Quadrennial Confederation Congress"
dsk_je_germany_meeting_button_desc:0 "Summon all German states to #yellow Frankfurt#! for the quadrennial Confederation Congress."

dsk_prussia.3.t:0 "The Confederation Congress Successfully Convened"
dsk_prussia.3.d:0 "A new session of the [concept_germany_country] Congress is about to be held in [SCOPE.sCountry('frm_scope').GetName]. As a major participant in the Confederation Congress, we have the right to determine the main agenda for the next session."
dsk_prussia.3.f:0 "Vienna is the upper chamber of Europe, and as long as it is not dissolved, it will tame the lower chamber. - Talleyrand"
dsk_prussia.3.a:0 "Propose promoting intra-confederation trade"
dsk_prussia.3.b:0 "Strengthen censorship"
dsk_prussia.3.c:0 "Enhance the collective defense system"

dsk_germany_trade_tt:0 "After the motion is adopted, a vote can be held 30 days later. Each state will cast its vote based on its own will."
dsk_je_ger_union_add:0 "Each state's vote in favor will advance the log progress by #v 1#!."

je_dsk_germany_trade:0 "Confederation Congress"
je_dsk_germany_trade_reason:0 "#v We will wait for all member states to cast their votes. #!\nIf more than half of the member states vote against or the number of votes in favor fails to exceed #v 15#!, the log will close after the time limit, and the Confederation Congress will end."

je_dsk_germany_trade_status1:0 "The topic of this Confederation Congress is about #green promoting intra-confederation trade#!."
je_dsk_germany_trade_status2:0 "The topic of this Confederation Congress is about #green strengthening censorship#!."
je_dsk_germany_trade_status3:0 "The topic of this Confederation Congress is about #green enhancing the collective defense system#!."

je_dsk_germany_trade_complete_tt:0 "More than #v 15#! member states voted in favor of the motion!"
dsk_prussia.4.t:0 "Confederation Congress: Voting Session"
dsk_prussia.4.d:0 "A new session of the [concept_germany_country] Congress has been convened in [SCOPE.sCountry('frm_scope').GetName]. As a major participant in the Confederation Congress, we have the right to cast our vote."
dsk_prussia.4.f:0 "Under the lasting and guaranteed protection of peace from the hands of the princes, these good things should be given to the German nation."
dsk_prussia.4.a:0 "We will cast a #blue vote in favor#!."
dsk_prussia.4.b:0 "We will cast a #red vote against#!."

dsk_prussia.5.t:0 "Confederation Congress Motion Passed"
dsk_prussia.5.d:0 "The [concept_germany_country] Congress in [SCOPE.sCountry('frm_scope').GetName] has passed the motion we advocated!"
dsk_prussia.5.f:0 "The Confederation finally has a legal framework for press freedom. Of course, these laws only apply to publications exceeding 320 pages in those states that have abandoned prior censorship. For publications smaller than this size, especially periodicals, they will be subject to a unified prior censorship mechanism by the Confederation. Administrative regulations empower the [concept_germany_country] to force individual states that defy these resolutions to comply, and if necessary, use force against them. In this way, the Confederation has the means of coercion to bring deviant states back on track. - Carlsbad Decrees"
dsk_prussia.5.a:0 "The motion to #blue promote intra-confederation trade#! has been passed."
dsk_prussia.5.b:0 "The motion to #yellow strengthen censorship#! has been passed."
dsk_prussia.5.c:0 "The motion to #red enhance the collective defense system#! has been passed."

modifier_dsk_germany_trade:0 "Promote Intra-confederation Trade"
modifier_dsk_germany_speak:0 "Strengthen Censorship"
modifier_dsk_union_protect:0 "Enhance the Collective Defense System"
dsk_je_ger_union_add:0 "This will increase the log progress by #v 1#!."
rus_gbr_will_help_den:0 "If we support [SCOPE.sCountry('hol_scope').GetName] and [SCOPE.sCountry('sch_scope').GetName], be wary of intervention from Russia and Britain."

dsk_prussia.6.b:0 "The time is not yet ripe"

dsk_je_HOL_SCH_button:0 "Schleswig-Holstein Uprising"
dsk_je_HOL_SCH_button_desc:0 "The time has come. Our oppressed compatriots in Schleswig-Holstein have begun their struggle against Danish rule. I will fight alongside you!"

dsk_den_pru_war:0 "Prussia-Denmark Issue"
dsk_den_pru_war_reason:0 "Our [SCOPE.sCountry('hol_scope').GetName] and [SCOPE.sCountry('sch_scope').GetName] aspire for greater autonomy. Our powerful southern neighbor, [SCOPE.sCountry('pru_scope').GetName], covets our land. We must prepare for the impending crisis."

dsk_prussia.7.t:0 "Great Fire of Hamburg"
dsk_prussia.7.d:0 "A terrible fire has broken out in our German ally, [SCOPE.sCountry('ham_scope').GetName], causing immense property damage. Should we consider offering them assistance in this situation?"
dsk_prussia.7.f:0 "One night in 1842, a fire broke out in a house on the Dammtorstrasse in Hamburg. The night watchman made noise with a rattle and shouts, and the soldiers on guard fired a signal gun. The guards on the spires rang the fire bells. So, the fire brigade was called. The fire greedily spread to the half-timbered houses. It crossed the Dammtor canal, more than 7 meters wide, to the houses in the alley. In a short time, the warehouses in the alley and the houses all the way to the market district were burning. The narrow lanes became deadly traps. The fire engines could not enter the small, crowded lanes, and people panicked, trying to escape. The fire lasted for four days, and about a quarter of the city was destroyed, including 1700 residential buildings containing over 4000 houses, over 100 warehouses, seven churches, two synagogues, 60 schools, and public buildings, including the Hamburg Bank and the City Hall. About 20,000 people were left homeless."
dsk_prussia.7.a:0 "We will do everything in our power to provide assistance to [SCOPE.sCountry('ham_scope').GetName]"
dsk_prussia.7.b:0 "There is nothing we can do"

dsk_prussia.8.t:0 "The Prussian Factory and Mine Regulations"
dsk_prussia.8.d:0 "The leader of [SCOPE.gsInterestGroup('is_army_ig').GetName], [SCOPE.sCharacter('army_ig_general').GetFullName], proposed to [ROOT.GetCountry.GetRuler.GetFirstName] that many children were working in factories, leading to a shortage of recruits for the Prussian army. Many businesses also complained that competitors were hiring child labor cheaply to reduce production costs."
dsk_prussia.8.f:0 "The Prussian Factory and Mine Regulations, a legal document of the Kingdom of Prussia in the 19th century, regulated labor conditions, production safety, worker rights, and the operation and management of factories and mines."
dsk_prussia.8.a:0 "Immediately implement nationwide"
dsk_prussia.8.b:0 "Don't rush into it"

pru_children_modifier:0 "Prussian Factory and Mine Regulations"

dsk_pru_child_law:0 "Child Labor Restriction Law"
dsk_pru_child_law_reason:0 "The 19th century was a period of rapid industrialization in [SCOPE.GetRootScope.GetCountry.GetName] and Germany as a whole. With the advancement of the Industrial Revolution, the number of factories and mines increased rapidly, and a large number of rural people flocked to cities to become workers. This rapid industrialization process brought about a series of social problems, such as worker rights protection and production safety, which required the government to regulate through legislation."

notification_notification_dsk_support_ger_uinon_name: "A German Confederation member casts a vote in favor!"
notification_notification_dsk_support_ger_uinon_desc: "[SCOPE.sCountry('germany_scope').GetName] has cast a #yellow favorable vote#!."
notification_1848_aus_start_name: "Revolution breaks out in [SCOPE.sCountry('austria_scope').GetName]!"
notification_1848_aus_start_desc: "With the downfall of Metternich and the announcement of a constitution by the [Concept('concept_ruler','RULER TITLEKAISER')], Vienna has been engulfed in a sea of revolution!"
notification_1848_aus_end1_name: "The nationalist wave in our country has ended"
notification_1848_aus_end1_desc: "The turmoil caused by the Spring of the Peoples has become a thing of the past"
notification_1848_aus_end2_name: "The nationalist wave in Austria has ended"
notification_1848_aus_end2_desc: "The turmoil caused by the Spring of the Peoples has become a thing of the past"
notification_1848_aus_ita_start_name: "The Spring of the Peoples has begun in Italy"
notification_1848_aus_ita_start_desc: "The call for Italian unification is growing louder! The people are shouting and flooding the streets, demanding the unification of Northern Italy~"

concept_germany_country: "German Confederation"
concept_germany_country_desc: "The [concept_germany_country] is a sovereign union of 39 sovereign [concept_country] and free cities (including Lübeck, Bremen, Frankfurt, and Hamburg), presided over by the permanent chair country #yellow Austria#! The #yellow Frankfurt Confederation Parliament#! is the only institution of the Confederation. The goal of establishing the [concept_germany_country] is to maintain internal and external security within [concept_germany], ensuring the independence and inviolability of its member states. All members pledge to defend the entire [concept_germany] and each member from any attack and mutually guarantee the full property of each member. They "neither wage [concept_war] against each other nor seize territory by force but submit claims to territory to the Confederation Parliament for adjudication by a committee or impartial court." As long as it does not endanger the security of the entire Confederation or any one [concept_country], Confederation members may retain the right to form [concept_alliance]; Confederation members should not negotiate, decide on a truce, or achieve peace unilaterally in Confederation [concept_war]. All members shall enjoy equal rights, and all members must restrain themselves with the same standards to ensure that the laws of the Confederation are not violated."
concept_germany: "Germany"
concept_germany_desc: "The term 'Germany' derives from the Old High German word 'diot', meaning 'people.' It was first recorded in the 8th century, referring to the dialect spoken by the Germanic tribes living in the eastern part of the Frankish Kingdom. Later, these tribes with a common language called themselves teutsch-deutsch, which became [concept_germany]."
concept_germany_second_empire: "German Empire"
concept_germany_second_empire_desc: "The Second [concept_germany] Empire, also known as the German Empire, was a dual monarchy and federal state located in central Europe from 1871 to 1918. This empire was unified by the Kingdom of Prussia through three dynastic wars (against Denmark, Austria, and France). Its official name was "Deutsches Reich," which was also the official name of the Weimar Republic and Nazi Germany that followed."
je_Frankfurt_National_Assembly:0 "Frankfurt National Assembly"
je_Frankfurt_National_Assembly_goal:0 "The Frankfurt National Assembly has decided to form Germany"
je_Frankfurt_National_Assembly_reason:0 "The German bourgeoisie led this [concept_revolution], with its primary task being to achieve German unification. The [SCOPE.gsInterestGroup('ig_rural_folk_scope').GetName] and [SCOPE.gsInterestGroup('ig_trade_unions_scope').GetName] also threw themselves into this [concept_revolution] for their own interests. After achieving initial victories in the [concept_revolution], the bourgeois parliament gained power through the compromise of feudal monarchs. The All-German National Assembly, held in [SCOPE.sCountry('frm_scope').GetName], was attended by approximately 500 delegates from various regions and social strata of Germany. A new, unified central government for all of Germany was established, but this government was purely symbolic, with neither its own army nor officials. Not only were the German princes indifferent to it, but internationally, no country recognized this government. Can this fragile National Assembly fulfill its mission in this turbulent era and unify Germany under the banner of the [concept_revolution]?"
je_Frankfurt_National_Assembly_tt:0 "The #yellow Empire#! constitution will be submitted to the person elected as the #yellow Emperor#!"
je_Frankfurt_National_Assembly_goal_complete_1:0 "Complete one Frankfurt National Assembly reforms"
great_German_button:0 "Support the establishment of a Great Germany"
great_German_button_desc:0 "You support the establishment of a Great Germany dominated by #yellow Germany nation#!, but is this just your wishful thinking?"
great_German_desc:0 "Supporting the establishment of a Great Germany, but is this just our wishful thinking?"
small_German_button_desc:0 "You support the establishment of a Small Germany dominated by #blue Prussia#!, but is this just your wishful thinking?"
small_German_button:0 "Support the establishment of a Small Germany"
small_German_desc:0 "Supporting the establishment of a Small Germany, but is this just our wishful thinking?"
not_already_supporting_small_German_var:0 "Not supporting Small Germany"

dsk_prussia.9.t:0 "The Imperial Constitution is Completed"
dsk_prussia.9.d:0 "After many days of effort, the #blue German Empire Constitution#! was finally passed in the National Assembly. However, [SCOPE.sCountry('aus_scope').GetName] had withdrawn from the National Assembly, greatly diminishing its legitimacy. In this situation, the remaining members of the National Assembly elected [SCOPE.GetRootScope.GetCountry.GetName]'s [ROOT.GetCountry.GetRuler.GetFirstName] as the Emperor of the new [concept_germany]. The Imperial Constitution was passed on March 27th."
dsk_prussia.9.f:0 "The following day, [SCOPE.GetRootScope.GetCountry.GetName]'s [ROOT.GetCountry.GetRuler.GetFirstName] was elected as the hereditary [Concept('concept_ruler','RULER TITLEKAISER')].\nPeople urged him to accept the throne immediately, but he hesitated for a month. Not all of his advisors opposed [SCOPE.GetRootScope.GetCountry.GetName]'s leadership of [concept_germany]. They believed that after agreeing to the constitution, they could make significant amendments to it, including restrictions on voting rights. Meanwhile, the liberal governments of 28 states, including [SCOPE.sCountry('han_scope').GetName], [SCOPE.sCountry('bav_scope').GetName], and [SCOPE.sCountry('sax_scope').GetName], mostly located in central [concept_germany], refused to accept the constitution. Nevertheless, the feasibility of the new political order ultimately depends on whether the [SCOPE.GetRootScope.GetCountry.GetName] government responds positively."

dsk_prussia.9.a:0 "The situation is not optimistic."
je_Frankfurt_National_Assembly_2:0 "Frankfurt National Assembly"
je_Frankfurt_National_Assembly_2_goal:0 "The Frankfurt National Assembly has decided to form Germany"
je_Frankfurt_National_Assembly_2_reason:0 "The German bourgeoisie led this [concept_revolution], with its primary task being to achieve German unification. The [SCOPE.gsInterestGroup('ig_rural_folk_scope').GetName] and [SCOPE.gsInterestGroup('ig_trade_unions_scope').GetName] also threw themselves into this [concept_revolution] for their own interests. After achieving initial victories in the [concept_revolution], the bourgeois parliament gained power through the compromise of feudal monarchs. The All-German National Assembly, held in [SCOPE.sCountry('frm_scope').GetName], was attended by approximately 500 delegates from various regions and social strata of Germany. A new, unified central government for all of Germany was established, but this government was purely symbolic, with neither its own army nor officials. Not only were the German princes indifferent to it, but internationally, no country recognized this government. Can this fragile National Assembly fulfill its mission in this turbulent era and unify Germany under the banner of the [concept_revolution]?"
je_Frankfurt_National_Assembly_goal_complete:0 "Complete two Frankfurt National Assembly reforms"
Frankfurt_National_Assembly_modifier:0 "Turbulent Parliament"
german_ship_modifier:0 "National Assembly Fleet"
german_army_modifier:0 "National Assembly Army"

dsk_aus.14.t:0 "The Convening of the Frankfurt National Assembly"
dsk_aus.14.d:0 "As the [concept_revolution] in [concept_germany] raged on, countless progressives and nationalists gathered in [SCOPE.sCountry('frm_scope').GetName] to discuss the future of [concept_germany]. The result was the birth of the Frankfurt National Assembly, which has now sent us an invitation to send representatives as a state of [concept_germany]. Should we comply with their request?"

dsk_aus.14.f:0 "Approximately 574 people participated in the preparatory parliament, including members of the parliaments of various states in [concept_germany], renowned progressives, and individuals elected spontaneously by the people. Radicals seized every opportunity arising from the political crisis to successfully send many representatives.\nAt the first meeting on March 31st, liberals and radicals split apart. With awe in the eyes of the audience, the leader of the [SCOPE.gsInterestGroup('is_intelligentsia_ig').GetName], [SCOPE.sCharacter('intelligentsia_ig_leader').GetFullName], stood up and declared his republican program: to establish a unified democratic Germany.\nThe next day, the moderate and enlightened aristocrat Heinrich von Gagern from Hesse prevented the attack of the radicals. Gagern believed in law, order, and the [SCOPE.sLaw('law_monarchy_scope').GetName]. He believed it necessary to seize the initiative from radicalism, as one observer said, 'to become a revolutionary in order to avoid revolution.' He and other moderates respected the states of [concept_germany], but they believed that for [concept_germany] to become strong and a great and civilized nation, political unity must be achieved. Liberals hoped for a constitutional monarchy in Germany, with the monarch elected by parliament.\nOn April 1st, Gagern appeared on the podium, and his firm gaze silenced the noisy parliament. With about 425 members being enlightened monarchists, his victory was already decided.\nOn April 3rd, the preparatory parliament split, and when electing the fifty-member committee, it would temporarily manage parliamentary affairs before the real parliament of [concept_germany] convened."

dsk_aus.14.a:0 "As a member of [concept_germany], we should send our representatives."

aus_truce_is_necessary:0 "To ensure the subsequent storyline progresses, it is necessary to first sign a [concept_truce] with [SCOPE.sCountry('aus_scope').GetName]."

zero_modifier:0 "Massive Manufacturing Wasteland"
zero_modifier_1:0 "Slight Manufacturing Wasteland"

je_pru_Berlin_Revolution:0 "Spring of Berlin"
je_pru_Berlin_Revolution_reason:0 "Spiritual, religious, social, and economic crises and instability led to the rise of nationalism across Europe.\n\nIn the charismatic and persuasive speeches of the aristocrat Giuseppe Mazzini, he vigorously advocated for the 'spring' of all peoples living in peace and harmony.\n\nHe summoned the 'Young Europe', 'Young Italy', and 'Young Germany'. At the same time, he awakened and agitated people to fight against the 'Metternich System' in a revolutionary war.\n\nEurope under the Metternich Order, which had triumphed in 1815 and weathered so many storms since then, suddenly appeared extremely weak. 'Liberals also smelled the scent of blood.' Social contradictions were extremely sharp, and people believed that the time for political change had come, even those who had previously been cautious in their opposition to the old order believed that reforms were necessary, if not revolution.\n\nPeople were calling for the romantic utopia of the 'Awakening of the People' and the 'Rebirth of the Nation' as the only remedy to solve the current problems.\n\nThe progress bar for the Spring of Berlin will change based on the following conditions: #v #tooltippable;tooltip:[Country.GetTooltipTag],je_pru_Berlin_Revolution_pos#!#!"

je_pru_Berlin_Revolution_pos:0 "The following conditions will #bold advance#! the #v Spring of Berlin#!\n• Implement #yellow Dictatorship#!, #yellow One-Party Dictatorship#!, or #yellow One-Party State#! (#red +1#!).\n• Implement #yellow Sharecropping#! (#red +1#!).\n• Implement #yellow Censorship of Publications#! (#red +1#!).\n• National #yellow [Concept('concept_sol', 'SOL SHORTTEXT')] <= 15#! (#red +2#!).\n• #yellow Intellectuals#! are not a marginal group and have a support level <-8 (#red +1#!).\n• #yellow Peasants#! are not a marginal group and have a support level <-8 (#red +2#!).\n\nThe following conditions will #bold mitigate#! the #v Spring of Berlin#!\n• National #yellow [Concept('concept_sol', 'SOLSHORTTEXT')] >= 15#! (#green -2#!).\n• Implement any #yellow Election Form#! (#green -3#!)."

je_pru_Berlin_Revolution_tt:0 "Phantoms haunt the lands of [SCOPE.GetRootScope.GetCountry.GetName]."
je_pru_Berlin_Revolution_goal:0 "Filling this progress bar will initiate the tumultuous path to German unification."

je_dsk_german_army:0 "National Assembly Army"
je_dsk_german_army_reason:0 "To address this issue, the #v National Assembly#! passed a series of military and conscription-related resolutions, including increasing the proportion of the army in the population and declaring #yellow Prince Regent John#! as the supreme commander of the [concept_germany] army.\nThere are conflicts of interest among the various states of [concept_germany] regarding unification. Some states are dissatisfied with the National Assembly's demands for conscription and military parades, believing that they infringe upon the autonomy of each state. Therefore, the National Assembly needs to adopt military and conscription policies to balance the interests of the states and strengthen centralization."

je_dsk_german_ship:0 "National Assembly Fleet"
je_dsk_german_ship_reason:0 "To address this issue, the #v National Assembly#! established a Naval Committee on May 6th. The committee should determine the fleet's functions and propose a phased plan for ship construction after analysis. In the first phase of construction, the committee will prepare 6 million thalers: the imperial fleet will become one of the symbols of German unity. Despite reservations about making specific decisions without a mature plan and imposing financial burdens on the people after the previous economic crisis, the National Assembly approved the Naval Committee's proposal on June 14th. The left, center, and right wings almost unanimously supported this decision."

dsk_prussia.10.t:0 "Frankfurt Proposal: Imperial Navy"
dsk_prussia.10.d:0 "Due to the lack of naval protection for years, merchants in [concept_germany_country] have faced dangers during ocean voyages. To protect the rights and interests of merchants, the proposal to establish an imperial navy has been put on the agenda. Should we agree to form a brand-new imperial navy?"

dsk_prussia.10.f:0 "[concept_germany_country]'s founding act does not recognize the navy. Although many coastal states have significant ports, the German merchant fleet lacks military protection from a navy. When [SCOPE.sCountry('pru_scope').GetName] tried to persuade other [concept_germany][concept_country] bordering the North Sea to adopt a common trade policy, having a fleet was one of the ideas.\nPrince #yellow Adalber#! once proposed a plan for a convoy made up of gunboats, but he faced significant resistance due to the high costs of maintaining a fleet. Among the German states, only [SCOPE.sCountry('aus_scope').GetName] has a fleet inherited from the Republic of Venice, albeit a weak one."

dsk_prussia.10.a:0 "A navy will ensure our merchants can sail the high seas without disgrace!"

dsk_prussia.11.t:0 "Frankfurt Proposal: Imperial Army"

dsk_prussia.11.d:0 "During the unification process, the government needs to establish a strong military force to maintain order, resist external threats, and ensure loyalty to the unification cause among the states. Thus, enacting military and conscription policies is an important means to strengthen government authority and control the army."

dsk_prussia.11.f:0 "During the Frankfurt National Assembly, the Schleswig War broke out with Denmark. To support [SCOPE.sCountry('pru_scope').GetName]'s military actions, the National Assembly passed a resolution to form an [concept_germany] army and attempted to enhance military strength through conscription policies."

dsk_prussia.11.a:0 "A powerful army will be the driving force toward unification!"

Frankfurt_National_Assembly_HOL_SCH_tt:0 "The Frankfurt National Assembly has declared support for the uprisings in Schleswig and Holstein!"

dsk_prussia.12.t:0 "[SCOPE.sState('SILESIA_state').GetName] Textile Workers' Uprising!"

dsk_prussia.12.d:0 "On June 4, 1844, triggered by rejected demands for wage increases, spontaneous uprisings broke out among textile workers in two villages at the foot of the Eugen Mountains: Peterswaldau and Langenbielau. The uprising quickly expanded to 3,000 people, who occupied factories, destroyed factory owners' residences, and burned workplaces."

dsk_prussia.12.f:0 "[concept_germany], we are weaving your shroud, each thread carrying a triple curse.\nWe weave the first curse for that indifferent God, to whom we once pleaded for mercy in our hunger and cold, but hope and expectation turned to bubbles; all He gave us was mockery and deception.\nThen we weave the second curse against the rich kings, whose hearts are as hard as iron, indifferent to our suffering, draining our last bit of wealth, even shooting us down like dogs.\nLastly, we weave the third curse for this false homeland, filled with shame and sin, where flowers wilt before they bloom, and corpses and dung nourish the lives of maggots.\nThe shuttle flies, the loom roars; day and night we tirelessly weave these three curses deep into this shroud.\n[concept_germany], you will ultimately bear it all."

dsk_prussia.12.a:0 "Let them strike; it’s time to improve workers’ lives."

dsk_prussia.12.b:0 "Send in my royal legion; if they won't work, there are plenty of others who will!"

low_life_up_modifier:0 "Increase workers' wages"

PRUN:0 "Berlin Free Government"

PRUN_ADJ:0 "Berlin Free Government"

dsk_prussia.13.t:0 "Berlin Revolution"

dsk_prussia.13.d:0 "On March 6, 1848, some radical youths met at the [SCOPE.sState('capital_state').GetName] Zoo and the next day, in the name of the people of Berlin, presented a petition demanding political freedom, an amnesty, equality before the law, a representative government, the abolition of usury, and a convening of a united provincial assembly, but were refused by the government. On March 9, the youths gathered again at the zoo, with thousands in attendance, and presented another petition. Meanwhile, Berlin workers became active, distributing leaflets reflecting workers' demands."

dsk_prussia.13.f:0 "On March 13, during a gathering at the zoo, government troops attacked the crowd, resulting in bloody clashes. In the following days, the conflict continued. Encouraged by news from Vienna that the people had overthrown Metternich’s reactionary government, the revolutionary masses besieged the palace on March 18, demanding that King [ROOT.GetCountry.GetRuler.GetFirstName] withdraw the troops from Berlin. The king ordered the army to fire on the crowd, sparking an armed uprising. After a day of fierce fighting, the [concept_revolution] masses defeated the government troops.\n[ROOT.GetCountry.GetRuler.GetFirstName] was forced to order a ceasefire, announce the immediate convening of a National Assembly to draft a constitution, reorganize the government, release political prisoners, and withdraw troops from the city.\nAt the opening ceremony, the king emphasized that the drafting of the constitution must be coordinated with the royal family.\n#yellow The von Komphausen Cabinet#! submitted a draft constitution to the Assembly. This was based on the constitution of [SCOPE.sCountry('fra_scope').GetName][concept_monarchie_de_Juillet] and that of [SCOPE.sCountry('aus_scope').GetName], establishing a constitutional monarchy in [SCOPE.sCountry('bel_scope').GetName], but granting substantial powers to the king."

dsk_prussia.13.a:0 "How can politics go well with these vermin?"

dsk_prussia.13.tt:0 "Our [SCOPE.sState('capital_state').GetName] #v Berlin#! will be occupied by a #yellow Free Government#!"

no_capital_modifier:0 "Capital is occupied"



je_germany_reforms_goal:0 "Support for establishing Germany in parliament has lasted 5 years"

supporting_small_German_tt:0 "This is the true historical route. If we choose this path, our army will gain significant offensive and defensive capabilities to help us win the Franco-Prussian War. If you successfully establish Small Germany, Austria will maintain its sovereignty and later become our ally."


dsk_prussia.14.t:0 "Berlin Surveillance Network"

dsk_prussia.14.d:0 "If one believes a local poet, police are already stationed throughout the streets of Berlin.\nA volume of poetry openly criticizes our current situation, sparking a sense of solidarity within one state against oppression and political regression. Liberals have become accustomed to protesting the old order on the streets, calling for free reforms of the political system, urging domestic and international brethren to unite, so much so that the cry for national unity can be heard throughout Prussia. We must consider sending troops to areas experiencing liberal unrest."

dsk_prussia.14.f:0 "On one side of the frontline stand those who write articles for newspapers, defining themselves as free fighters; on the other side is the 'fortress of conservative principles' (in Gvynus), absolutism, and 'conservative dynastic politics,' clearly distinguishing good from evil. —Wolfram Hiemann"

dsk_prussia.14.a:0 "Damn the revolutionaries!"

add_Berlin_Revolutior_tt:0 "This will advance the progress bar of #yellow Berlin Spring#! by #v 20#!"

sub_Berlin_Revolutior_tt:0 "This will reduce the progress bar of #yellow Berlin Spring#! by #v 20#!"

laze_capital_modifier:0 "Capital unrest"
dsk_prussia.15.t:0 "[SCOPE.sCulture('north_german_state').GetName] Anti-Jacobin Pamphlet"
dsk_prussia.15.d:0 "A strong backlash against the widespread liberal trend in [SCOPE.sCulture('north_german_state').GetName] has led a prominent conservative intellectual to write an anti-Jacobin pamphlet."
dsk_prussia.15.f:0 "As the revolutionary armies threaten the traditional order of Europe, opposing them has become our sacred mission. The Jacobins are a collective of irredeemable blowhards and merchant philistines. Look at what Robespierre brought to France; they impose radicalism on Berlin without ever considering the people's thoughts."
dsk_prussia.15.a:0 "What great propaganda!"
dsk_prussia.15.b:0 "Interesting."
revolution_sub_modifier:0 "Anti-Jacobin Pamphlet"

Frankfurt_National_Assembly_HOL_SCH_has_ready_tt:0 "The Frankfurt National Assembly can support the Schleswig-Holstein Uprising!"

dsk_prussia.16.t:0 "Frankfurt Proposal: The Schleswig-Holstein Question"
dsk_prussia.16.d:0 "Just as the constitutional monarchists and republicans in the National Assembly are at odds, a non-[concept_germany] national issue has also erupted. The problem stems from [SCOPE.sCountry('den_scope').GetName]'s rule over [SCOPE.sCountry('sch_scope').GetName] and [SCOPE.sCountry('hol_scope').GetName]. Nationalists demand we liberate these two [concept_germany] duchies from Danish oppression; should we risk war with Denmark to make this demand?"
dsk_prussia.16.f:0 "On March 18, the National Assembly in Lenzburg openly reiterated [concept_germany]'s claims over these two duchies. [SCOPE.sCountry('sch_scope').GetName] and [SCOPE.sCountry('hol_scope').GetName] are integral parts of [concept_germany_country]!"
dsk_prussia.16.a:0 "Rise! The people of [concept_germany], resistance begins now!"

dsk_prussia.17.t:0 "[SCOPE.sCountry('south_german_country').GetName] Unrest"
dsk_prussia.17.d:0 "[concept_revolution] protests against the authoritarian government have erupted in our neighboring country, [SCOPE.sCountry('south_german_country').GetName]."
dsk_prussia.17.f:0 "[concept_germany_country] states are affected by poor harvests and economic crises, with waves of strikes and riots breaking out; the [concept_revolution] situation is on the brink."
dsk_prussia.17.a:0 "Oh no, this is bad."

dsk_prussia.18.t:0 "The Age of Democracy"
dsk_prussia.18.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] has successfully shed dictatorship and the shackles of nationalism, stepping into modern Europe with an open and inclusive stance."
dsk_prussia.18.f:0 "This is the ambition of the pan-German nation striving for unification, independence, and sovereignty."
dsk_prussia.18.a:0 "Gentlemen, let us cheer for this great moment!"
je_dsk_berlin_spring:0 "New Cabinet"
je_dsk_berlin_spring_reason:0 "On June 26, the new cabinet issued a declaration stating it would abolish the feudal obligations of peasants through redemption, reform the judicial and tax systems, organize public works beneficial to [concept_country], and provide jobs for unemployed workers. However, it also suppressed the people's struggles, closing revolutionary clubs, disbanding student groups, and arresting leaders of the labor movement and democrats.\n\nIn [SCOPE.GetRootScope.GetCountry.GetName], reactionary forces are growing increasingly arrogant. On August 18, representatives from various [SCOPE.gsInterestGroup('land_ig').GetName] gathered in Berlin for the 'Conference of Defenders of Private Property of All Classes', calling for the nobility nationwide to safeguard the common interests of [SCOPE.gsInterestGroup('land_ig').GetName]. This meeting is referred to as the #v 'Junker Parliament'#!. Junker forces have also infiltrated [SCOPE.gsInterestGroup('army_ig').GetName], and many republican-leaning officers have been purged.\n\nThe #yellow liberal#! forces are in grave danger; can we find the right path in this era of [concept_revolution]?"

dsk_its_time_return_button:0 "Suppress [SCOPE.sCountry('PRUN_scope').GetName]"
dsk_its_time_return_button_desc:0 "Damn, how did [concept_country] become like this?"
no_prun_tt:0 "[SCOPE.sCountry('PRUN_scope').GetName] no longer exists"
je_small_german:0 "Small German Solution"
je_small_german_reason:0 "During the 1848 Frankfurt National Assembly's constitution drafting, the bourgeois liberals led by Gagern proposed establishing a federation of [concept_germany] excluding [SCOPE.sCountry('aus_scope').GetName], and later negotiating a treaty with [SCOPE.sCountry('aus_scope').GetName] to form some kind of alliance.\n\nThis effectively excluded [SCOPE.sCountry('aus_scope').GetName], unifying [concept_germany] under the leadership of [SCOPE.GetRootScope.GetCountry.GetName].\n\nSupport for this plan mainly comes from the bourgeois representatives of [SCOPE.GetRootScope.GetCountry.GetName] and the northern, western, and central German states, who form the majority in parliament. The convening of the Erfurt Union Parliament in 1850 was the first concrete action to realize this plan. In 1859, the [concept_germany] National Union was established. In 1871, a unified [concept_germany_second_empire] was created under the leadership of [SCOPE.GetRootScope.GetCountry.GetName]."

dsk_prussia.19.t:0 "The Crown of the Commoners"
dsk_prussia.19.d:0 "Representatives from the National Assembly have arrived in Berlin to formally invite our [Concept('concept_ruler','$RULER_TITLE_KING$')][ROOT.GetCountry.GetRuler.GetFirstName] to be crowned as the [Concept('concept_ruler','$RULER_TITLE_EMPEROR$)] of all [concept_germany]. However, [Concept('concept_ruler','$RULER_TITLE_KING$')] despises this crown, which is not divinely ordained, and our conservative cabinet has been advising [Concept('concept_ruler','$RULER_TITLE_KING$')] to refuse it. Meanwhile, external forces are closely watching us; should we accept this crown in this moment of crisis?"
dsk_prussia.19.f:0 "[ROOT.GetCountry.GetRuler.GetFirstName] is surrounded by the people of the 'Cross', hearing only Prussian opinions. The constitution places [Concept('concept_ruler','$RULER_TITLE_KING$')] in an uncertain [concept_germany] framework, blurring [Concept('concept_ruler','$RULER_TITLE_KING$')]’s identity, which has led the 'Cross' circle to question this approach. [ROOT.GetCountry.GetRuler.GetFirstName] loathes the title of [Concept('concept_ruler','$RULER_TITLE_KING$)], as it indicates that his status is not divinely appointed, but granted by ignorant people.\nBefore his ministers, he jokingly referred to the crown as a sausage sandwich and a gift from butchers and bakers; in darker times, he believed this crown was a leash the people intended to use to bind him to the dog chain of the 1848 [concept_revolution], fit only for pigs and pulled from the gutter."
dsk_prussia.19.a:0 "Gentlemen, let us cheer for this great moment!"
dsk_prussia.19.b:0 "I will never accept a crown from the gutter."
its_time_to_unite_german_2:0 "After winning the Austro-Prussian War, all non-[concept_vassal] small states of [concept_germany] will become our [concept_puppet]."
its_time_to_unite_german:0 "Immediately withdraw from #yellow the Holy Alliance#!, remove the [concept_truce] with [SCOPE.sCountry('aus_scope').GetName], and you can now launch a leadership [concept_diplomatic_play]."
its_time_to_unite_german_1:0 "The dynastic war has begun! This option causes [SCOPE.sCountry('aus_scope'). GetName] strong dissatisfaction!"
qianjin:0 "The Crown of All Germany!"
revolution_modifier:0 "March Revolution"

dsk_prussia.20.t:0 "Turmoil in [SCOPE.sCountry('south_german_country').GetName]"
dsk_prussia.20.d:0 "A series of protests against the authoritarian government erupted in our neighboring country [SCOPE.sCountry('south_german_country').GetName] during the [concept_revolution]."
dsk_prussia.20.f:0 "The prince has resigned. On March 13, the [concept_revolution] movement and street battles broke out, as citizens and university students spontaneously organized a National Guard and college groups to resist [SCOPE.sCountry('south_german_country').GetName]'s army.\nThe Prime Minister [SCOPE.sCharacter('landowners_leader_scope').GetLastName] even disguised himself as a woman to flee to England."
dsk_prussia.20.a:0 "Oh no, this is bad."

denmark_flavor.5.t:0 "Schleswig-Holstein Uprising"
denmark_flavor.5.d:0 "Recent developments in [SCOPE.sCountry('hol_scope').GetName] - [SCOPE.sCountry('sch_scope').GetName] have led to a rise in nationalism and a strong sense of [concept_germany] identity. Many within the duchy recognize this cause, which has reached a boiling point.\nA local prince, accompanied by a warrior regiment and some students from local universities, has taken over the Lenzburg Fortress and expelled the local garrison, claiming to launch an independent [concept_war]."
denmark_flavor.5.f:0 "“Today we are no longer subjects of [SCOPE.sCountry('den_scope').GetName], but we will take our fate into our own hands!”"
denmark_flavor.5.a:0 "This is the clarion call of the [concept_germany] people resisting oppression!"
denmark_flavor.6.d:0 "Recent developments in [SCOPE.sCountry('hol_scope').GetName] - [SCOPE.sCountry('sch_scope').GetName] have led to a rise in nationalism and a strong sense of [concept_germany] identity. Many within the duchy recognize this cause, which has reached a boiling point. Now [SCOPE.sCountry('sch_scope').GetName] is raising arms to support independence, and many in our kingdom wish to do the same."


dsk_aus.30.t:0 "Three Cheers!"
dsk_aus.30.d:0 "I come from the proudest eagle of the world; I represent the purest night, #v the brightest white snow#!, #red the most fervent fireworks#!!\nFrom Maas to Memel, from Eisch to Bert, [concept_germany], [concept_germany], above all, above all things in the world."
dsk_aus.30.f:0 "If you are still chasing happiness, you are unworthy to possess it, even if all good things belong to you.\n\nIf you still mourn what you have lost, if you are still seeking something in vain, you do not yet know what peace of mind is.\n\nYou must wait until you give up all desires, free of competition, completely unaware of the name of happiness.\n\nOnly then will worldly affairs no longer trouble your heart, and your soul will find peace."
dsk_aus.30.a:0 "I see all beings as grass and trees, yet I see you as a green mountain.\nI see the green mountain is so charming, I wonder if the green mountain sees me as such."
dsk_aus.31.t:0 "Abandoned People of Europe"
dsk_aus.31.d:0 "We have failed to uphold our original promises."
dsk_aus.31.f:0 "We denied the path we initially chose, and resolutely allowed [SCOPE.sCountry('aus_scope').GetName] to cede its core territories."
dsk_aus.31.a:0 "We have completely lost the possibility of improving diplomatic relations with [SCOPE.sCountry('fra_scope').GetName] and [SCOPE.sCountry('rus_scope').GetName]!"

you_are_loser_tt:0 "#red Lost all subsequent logs, and [concept_great_power] will soon initiate a [concept_diplomatic_play] to reduce territories#!"

je_dsk_empire_war:0 "Dynastic War"
je_dsk_empire_war_tt:0 "Go, [concept_germany] people! For the unification of [concept_germany]!"
je_dsk_empire_war_reason:0 "During the drafting of the constitution at the 1848 Frankfurt National Assembly, the bourgeois liberals led by Gagern proposed establishing a federation of [concept_germany] excluding [SCOPE.sCountry('aus_scope').GetName], and later negotiating a treaty with [SCOPE.sCountry('aus_scope').GetName] to form some kind of alliance.\n\nThis effectively excluded [SCOPE.sCountry('aus_scope').GetName], unifying [concept_germany] under the leadership of [SCOPE.GetRootScope.GetCountry.GetName].\n\nSupport for this plan mainly comes from the bourgeois representatives of [SCOPE.GetRootScope.GetCountry.GetName] and the northern, western, and central German states, who form the majority in parliament.\n\nThe convening of the Erfurt Union Parliament in 1850 was the first concrete action to realize this plan.\n\nNow it is up to us to decide the path for the unification of [concept_germany]!"

SCHLESWIG_HOLSTEIN_tt:0 "\n Win the First Dynastic War against [SCOPE.sCountry('den_scope').GetName] and resolve the Schleswig-Holstein issue!"
Aus_is_no_leader_tt:0 "\n Win the Second Dynastic War against [SCOPE.sCountry('aus_scope').GetName], forcing it to abandon its ambitions for the unification of [concept_germany]!"
ALSACE_LORRAINE_tt:0 "\n Win the Third Dynastic War against [SCOPE.sCountry('fra_scope').GetName] and annex Alsace-Lorraine!"
we_are_german:0 "\n Our [Concept('concept_ruler','$RULER_TITLE_KING$')][ROOT.GetCountry.GetRuler.GetFirstName] will be crowned as the [Concept('concept_ruler','$RULER_TITLE_EMPEROR$)] of all [concept_germany] at the #bold Palace of Versailles#! in [SCOPE.sCountry('fra_scope').GetName]!"
 we_are_german_tt:0 "#v We have founded #yellow German Empire#!"
aus_is_our_friend:0 "\n [SCOPE.sCountry('aus_scope').GetName] will improve relations with us as our blood brothers!"

je_aus_ger_union:0 "Austro-German Alliance"
je_aus_ger_union_reason:0 "After the Franco-Prussian War, [SCOPE.sCountry('ger_scope').GetName] and [SCOPE.sCountry('fra_scope').GetName] became adversaries.\nIn the Balkans, [SCOPE.sCountry('aus_scope').GetName] has serious conflicts of interest with [SCOPE.sCountry('rus_scope').GetName].\n\nTo counter the encirclement and security threats posed by [SCOPE.sCountry('fra_scope').GetName] and [SCOPE.sCountry('rus_scope').GetName], [SCOPE.sCountry('ger_scope').GetName] finds it necessary to establish a long-term [concept_alliance] with the ethnically similar [SCOPE.sCountry('aus_scope').GetName].\n\nUnder Prime Minister #yellow Bismarck#!'s suggestion, we need to actively prepare for an anti-Russian Austro-German [concept_alliance] treaty!\nIf one contracting party is attacked, the other shall provide full military support and shall not make a separate peace!\n\n#yellow The Austro-German Alliance#! will grow through the following relationships every month #v#!:\n• Maintain #green friendly#! or better relations with #yellow the contracting party#! (+2#!).\n• Sign [concept_alliance] or #yellow interest alliance#!#bold treaty#! with #yellow the contracting party#! (+2#!)"
je_aus_ger_union_tt:0 "The blood bond between [SCOPE.sCountry('ger_scope').GetName] and [SCOPE.sCountry('aus_scope').GetName] can conquer mountains and seas!"

dsk_prussia.21.t:0 "Austro-German Alliance Invitation"
dsk_prussia.21.d:0 "[SCOPE.sCountry('ger_scope').GetName] has sent us an invitation for the Austro-German Alliance, aimed at isolating and striking against [SCOPE.sCountry('fra_scope').GetName], and supporting our interests in #v the Balkans#!"
dsk_prussia.21.f:0 "Main contents of the treaty:\n\nIf one contracting party is attacked by Russia, the other must provide full military support and must not make a separate peace.\n\nIf attacked by a third country (referring to France), the other party should take a position of benevolent neutrality; if the attacking country has the support of Russia, both parties should fight together.\n\nThe treaty is valid for five years and may be extended and modified by negotiation.\n\nBoth parties shall keep the treaty confidential. This treaty was announced in 1888 and marks the beginning of Germany's establishment of a military alliance, continuously renewed until 1918."
dsk_prussia.21.a:0 "Agree"
dsk_prussia.21.b:0 "It is not the right time yet"


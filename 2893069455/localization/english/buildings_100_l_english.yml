join_the_aus_ger_war_button_desc:0 "Our [concept_alliance] ally is at war with other countries, and we must fulfill our mutual defense obligations!"

let_our_alliance_stronger_button:0 "Trade Agreement"
let_our_alliance_stronger_button_desc:0 "Signing a trade agreement with the other #yellow contracting party#! can help us develop our economies together."

let_our_alliance_stronger_button_2:0 "Economic Aid"
let_our_alliance_stronger_button_2_desc:0 "Our [concept_alliance] ally needs our economic assistance!"

let_our_alliance_stronger_button_4:0 "Military Aid"
let_our_alliance_stronger_button_4_desc:0 "Our [concept_alliance] ally needs our military assistance!"


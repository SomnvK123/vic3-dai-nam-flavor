dsk_prussia.25.t:0 "German Guinea"
dsk_prussia.25.d:0 "Territory under the sun"
dsk_prussia.25.f:0 "Merchants from the [concept_germany_second_empire] led by #yellow Adolf von Hansemann#! and a German banking consortium founded the #v New Guinea Company#! in Berlin, aiming to colonize and develop the resources of New Guinea. German colonizers required more labor to expand high-profit plantations, but the German colonial government opted for forced recruitment instead of voluntary hiring. The colonial government enacted new laws requiring each tribe to provide four weeks of labor per year per person and to pay a head tax in cash, thus compelling unwilling locals to join labor teams to pay the so-called head tax."
dsk_prussia.25.a:0 "We will establish a colonial government here."

dsk_prussia.26.t:0 "German East Africa"
dsk_prussia.26.d:0 "Territory under the sun"
dsk_prussia.26.f:0 "On March 3, 1885, the German Empire announced that the company was granted the right to establish a protectorate in East Africa's Great Lakes region by a charter signed by Chancellor Otto von Bismarck on February 27, 1885. Following this, Germans signed a 50-year lease agreement with Sultan Khalifa bin Said of Zanzibar in April 1885 for the coastal region opposite Zanzibar. Peters then recruited experts to explore the coast from south to north. German rule rapidly established itself in Bagamoyo, Dar es Salaam, and Kilwa. The Abushiri Revolt, which broke out in 1888, was suppressed the following year with British assistance. In 1890, the Heligoland–Zanzibar Treaty was concluded between Berlin and London, which returned Heligoland Island, occupied by Britain in 1807, to Germany, while Germany recognized British sovereignty over Zanzibar; this treaty also defined the border between German East Africa and the British Protectorate of Kenya."
dsk_prussia.26.a:0 "We will establish a colonial government here."


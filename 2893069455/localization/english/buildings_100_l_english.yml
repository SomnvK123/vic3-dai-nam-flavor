dyn_c_republic_weima_GER:0 "Weimar Republic"
dsk_prussia.31.t:0 "Weimar Republic"
dsk_prussia.31.d:0 "Our soldiers are buried, our ships sunk, and the dream of rule has been defeated. All terms of the treaty will be executed. 'If we lacked the ability to win the war, why did we join this protracted conflict?'"
dsk_prussia.31.f:0 "[concept_germany_second_empire] Established during the defeat in World War I and the collapse of the Hohenzollern dynasty. This period's constitution was passed in the National Assembly convened in Weimar, hence the name Weimar Republic."
dsk_prussia.31.a:0 "This is our shame! [concept_germany] The nation will remember this darkest day!"

je_ger_develop_main:0 "Germany's Industrial Revolution"
je_ger_develop_main_reason:0 "The Industrial Revolution was a major transformation in human history, greatly increasing production efficiency and capacity. As an important European nation at the time, we urgently needed to undergo the Industrial Revolution to enhance our economic strength and international competitiveness. With population growth and economic development, the demand for goods in [concept_germany] was steadily rising. However, traditional production methods could not meet this growing demand, thus we needed the Industrial Revolution to expand production scale and improve efficiency, to help us become the strongest #yellow empire#! on the European continent."
je_ger_develop_main_tt:0 "The Industrial Revolution is in full swing..."
je_ger_develop_main_goal:0 "Need to complete four industrial revolution projects"

je_ger_develop_1:0 "Industrial Revolution: Heavy Industry"
je_ger_develop_1_reason:0 "After the unification of [concept_germany], we urgently need to utilize new technologies invented during the Second Industrial Revolution to improve traditional industries and develop new types of industries. Key sectors include the steel industry, machinery manufacturing, and textiles. Historical records indicate that by the eve of World War I, about 1/4 of Germany's electrical industrial products were exported globally, with electrical industrial exports accounting for 46.4% of the world's total electrical product exports."

je_ger_develop_2:0 "Industrial Revolution: Mineral Resources"
je_ger_develop_2_reason:0 "Heavy industries such as steel, coal, and machinery manufacturing experienced rapid growth during the Industrial Revolution, significantly increasing the demand for resources. To ensure the normal operation of the country's other industries, it is necessary to vigorously mine mineral resources!"

je_ger_develop_3:0 "Industrial Revolution: Military Industry"
je_ger_develop_3_reason:0 "With significant advancements in metal smelting and machinery manufacturing, we are able to produce superior weaponry. The government places a high priority on the development of the military industry, implementing a series of policies to support its growth. As the Industrial Revolution deepens, our strategic thinking should shift from traditional defensive strategies to offensive strategies. Therefore, it is essential to emphasize strong military power as a backing to achieve victory through offense. This shift in strategic thinking imposes higher demands on the military industry, pushing it toward greater specialization and modernization."

je_ger_railway:0 "Industrial Revolution: Railways"
je_ger_railway_reason:0 "After the 1850s, the steel industry developed more vigorously to meet the needs of large-scale railway construction. By building railways, not only were transportation conditions improved, but it also directly or indirectly further promoted the development of heavy industries such as steel, coal, and machinery manufacturing. The demand for rail tracks, locomotives, and carriages stimulated the rapid development of the steel industry."

modifier_ger_develop_1:0 "Development of Heavy Industry"
modifier_ger_develop_2:0 "Development of Mineral Resources"
modifier_ger_develop_3:0 "Development of Military Industry"
modifier_ger_develop_4:0 "Development of Railways"
modifier_ger_develop_5:0 "Successfully completed the Industrial Revolution"

dsk_prussia.27.t:0 "Development of Heavy Industry"
dsk_prussia.27.d:0 "Accelerated urbanization"
dsk_prussia.27.f:0 "The development of heavy industry greatly promoted Germany's industrialization process, continuously increasing the proportion of industrial output in the national economy. Rapid growth in heavy industries such as steel, coal, and machinery manufacturing brought substantial economic returns to Germany. Germany transformed from a traditional agricultural nation to an industrial nation, fundamentally altering its economic structure. Heavy industry became a key pillar of the German economy, laying a solid foundation for Germany's modernization process."
dsk_prussia.27.a:0 "Long live! [SCOPE.GetRootScope.GetCountry.GetName]"

dsk_prussia.28.t:0 "Development of Mineral Resources"
dsk_prussia.28.d:0 "Strengthening economic power"
dsk_prussia.28.f:0 "The abundance of mineral resources provides a solid foundation for Germany's industrialization process. For example, the rich coal resources in the Ruhr area provide ample energy and raw materials for the development of heavy industries like steel and machinery manufacturing, driving rapid growth in Germany's economy. The mining and processing of mineral resources spurred the development of related industries, such as smelting, chemical, and transportation, forming a complete industrial chain and promoting optimization and upgrading of the industrial structure."
dsk_prussia.28.a:0 "Long live! [SCOPE.GetRootScope.GetCountry.GetName]"

dsk_prussia.29.t:0 "Development of Military Industry"
dsk_prussia.29.d:0 "Enhanced international standing"
dsk_prussia.29.f:0 "The development of the military industry promotes Germany's research and innovation in military technology. To enhance the performance and competitiveness of weaponry, Germany has conducted extensive R&D and testing in fields such as aviation, tanks, and missiles. These efforts not only advance military technology but also spur development in related technological fields. Additionally, the growth of the military industry fosters military-civilian integration, as many military technologies and products can be converted for civilian use, promoting technological progress and industrial upgrading in Germany's civilian industries."
dsk_prussia.29.a:0 "Long live! [SCOPE.GetRootScope.GetCountry.GetName]"

dsk_prussia.30.t:0 "Development of Railways"
dsk_prussia.30.d:0 "Accelerated population mobility"
dsk_prussia.30.f:0 "As a leader and important sector of the Industrial Revolution, railways have driven Germany's swift transition from a light industry centered around textiles to a heavy industry focused on railway construction. Railway construction has stimulated the development of related industries such as coal and iron, facilitating the rise of the heavy industry sector. The construction of railways has made the movement of people and goods more convenient, promoting the rise and expansion of cities. Cities along the railway gradually developed into economic centers, attracting large inflows of population and capital."
dsk_prussia.30.a:0 "Long live! [SCOPE.GetRootScope.GetCountry.GetName]"

dsk_prussia.32.t:0 "Completion of the Industrial Revolution"
dsk_prussia.32.d:0 "The birth of the world factory"
dsk_prussia.32.f:0 "During the Industrial Revolution, especially in the Second Industrial Revolution, industrial output surged. For instance, from 1867 to 1913, the pig iron output of [SCOPE.GetRootScope.GetCountry.GetName] increased from 1 million tons to 19.3 million tons, almost a 20-fold increase; during the same period, steel output also increased approximately 25-fold. This leap in production capacity enabled [SCOPE.GetRootScope.GetCountry.GetName] to rapidly become an industrial power in Europe and even the world. Germany introduced advanced production technologies and equipment during the Industrial Revolution, such as the Thomas steelmaking process, significantly improving production efficiency. By 1913, the per capita annual steel output of German steelworkers reached 77 tons, far exceeding that of [SCOPE.sCountry('gbr_scope').GetName] at the time. After completing the Industrial Revolution, [SCOPE.GetRootScope.GetCountry.GetName] quickly rose to become one of the great powers of Europe, with enhanced economic, technological, and military strength granting Germany a significant position on the international stage."
dsk_prussia.32.a:0 "Let the world see [SCOPE.GetRootScope.GetCountry.GetName] manufacturing!"

je_ger_empire_meeting:0 "Imperial Congress"
je_ger_empire_meeting_tt:0 "The Imperial Congress is exercising its functions"
je_ger_empire_meeting_reason:0 "#v Imperial Congress#! was established at the time of the founding of the [concept_germany_second_empire] in 1871 and is an important component of the political system of [concept_germany_second_empire]. The election law of #v Imperial Congress#! is enshrined in the Imperial Constitution, implementing universal, equal, and direct election principles, marking a significant achievement of the cooperation between bourgeois liberalism and Bismarck's politics during Germany's unification process. Although #v Imperial Congress#! can decide whether to approve a certain decree or budget, it does not have legislative power and cannot introduce a vote of no confidence against the government. Legislative power is mainly held by the Bundesrat, which consists of representatives from each state's monarchs. The following conditions will enhance #v Imperial Congress#!'s #yellow influence#!; when #yellow influence#! is sufficient, a policy may be enacted:\n• Implement #yellow qualifying elections#! or #yellow universal suffrage#! (#green +2#!).\n• Implement #yellow secret police#! or #yellow national gendarmerie#! (#green +1#!).\n• Implement any #yellow health institutions#! (#green +1#!).\n• Army size > #yellow 300#! (#green +1#!).\n• Possess #yellow Qingdao#! (#green +1#!).\n• The national status is [concept_super_power] (#green +2#!)."


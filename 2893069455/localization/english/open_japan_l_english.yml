sino_event.45.t:0 "National Policy: The Tang Dao Legacy"
sino_event.45.d:0 "They recklessly altered the design, turning the straight blade into a curved one, not understanding that the 'straight' in the Tang Dao symbolized the character of 'a gentleman conceals his weapon and waits for the right time to strike.'"
sino_event.45.f:0 "The samurai sword is but a shadow of the Tang Dao. When Japan sent envoys to Tang China, they brought back not only the design for the sword but also two blacksmiths from Chang'an. However, they could never forge the right steel on the islands of the East.\n\nThe iron ores in Mount Fuji were too sulfurous, and the blades always carried dark marks, like poorly kneaded dough. To conceal these flaws, they had to curve the blades, but they lost the elegance of the Tang Dao’s ‘straightness and momentum’; and when imitating the method of burning the blade, they could not control the fire and thus ended up with exaggerated wave patterns on the blade, which from afar looked like branches struck by lightning.\n\nThe 'Heian-shiki' from the Heian era admits that even the best 'katana' at the time had only about 70% of the hardness of the Tang Dao but was adorned with gold and silver on the scabbard, trying to cover its inner clumsiness with extravagance."
sino_event.45.a:0 "They wait for a wise person to gently brush off the rust — and then, you will see the reflection of the full moon from the Tang dynasty on the blade."

sino_event.46.t:0 "National Policy: Setting up the Korean Province"
sino_event.46.d:0 "Their customs are the same as ours, and their writing is the same as ours — 'New Book of Tang.'"
sino_event.46.f:0 "Those who question the validity of ‘establishing a province’ have probably forgotten how many imprints of Chinese civilization lie within the rock layers of the Korean Peninsula.\n\nThe 'Wei Shu Shen Zhong Lang Jiang' bronze seal, stored in the Seoul Museum, has the same dragon pattern as the one unearthed in Ye City; the lacquerware in the ancient tomb of Gyeongju has the 'Cloud Lord' design from the 'Chu Ci,' with cinnabar in the lacquer sourced from Chen Zhou, the same as the lacquer found in the Han tombs of Mawangdui. Not to mention the farming tools seen by Cui Pu in Zhejiang, which are 'exactly the same' as those in Korea.\n\nThis civilizational resonance is the most solid foundation for establishing a province."
sino_event.46.a:0 "Formerly [SCOPE.sCountry('kor_scope').GetNameNoFlag], today Korean Province."
sino_event.46.b:0 "Veto National Policy"

sino_event.47.t:0 "National Policy: Maritime Silk Road"
sino_event.47.d:0 "From the streets of Beijing to the markets of Rome, from the kilns of Quanzhou to the workshops of Venice."
sino_event.47.f:0 "On the Qing dynasty’s sea charts, the shipping routes are drawn in vermilion as flowing rivers. The merchant ships departing from Liujiagang would stop at the Pescadores Islands for fresh water. In the reflection of the water buckets, one could see not only the flying eaves of the Mazu temple but also the shadow of an Arabic triangular sail.\n\nA Portuguese merchant wrote in his diary: 'The ships from Quanzhou are three times larger than those from Venice, with dragon embroidery on their sails, yet the cargo holds are filled with Venetian glass. The Chinese merchants on board are calculating Florentine gold coins on their abacus.'\n\nThese mirrors were later taken back to Europe, where the nobles saw not only their own reflections but also the entwined patterns etched on the back — patterns that Chinese craftsmen mimicked from Europe but added a plum blossom to the details."
sino_event.47.a:0 "Why not join me and get lost in the magnificent sea charts?"

sino_event.48.t:0 "National Policy: The Dragon Devours the Sun"
sino_event.48.d:0 "The Land of the Rising Sun is not only defined by its geographical location but also by its culture and spirit. The Japanese are ruthless, sharp-tongued, shameless, ungrateful, and ignorant of small courtesy, much less great righteousness. How can they be worthy of the title ‘Land of the Rising Sun’?\n\nIn contrast, our sons and daughters of China are hardworking, brave, wise, and kind-hearted. They inherit the righteousness of heaven and earth and uphold the civilization of China. No matter where they are, they strive to strengthen themselves. This is the true Land of the Rising Sun!"
sino_event.48.f:0 "The black clouds hang over the city, and the golden scales gleam under the sun.\n\nThe trumpet sounds across the autumn sky, the crimson flag folds over the Easy Water.\n\nHalf of the red flag is rolled up at the river, the frost weighs heavily, and the drum sounds are silent.\n\nI report to you, the will of the golden platform, to carry the jade dragon and die for you!"
sino_event.48.a:0 "Though the shadow of Fusang may lengthen, it will always be dependent on the morning light of China."
je_conquer_japan:0 "National Policy: Strike First, Conquer the Sun"
je_conquer_japan_reason:0 "The Japanese have long coveted our lands, their ambitions as fierce as wolves, as clear as the sun and moon. Now, with the sea frontier in turmoil and the smoke of war rising, we must strike before their fangs reach our throat, seizing the initiative while their wings are not yet fully spread, in order to calm the waves of the sea.\nLooking at history, the prosperity of the Han and Tang dynasties was not only due to the advantage of military weapons but also because they acted early to prevent problems. Zhang Qian’s mission was not for military conquest but to sever the Han from the Xiongnu’s right arm; Wei and Huo’s campaigns were not for the joy of battle but to protect the Silk Road to Chang’an. Now, the Eastern barbarians are rising, and if we allow them to march, they will repeat the tragic fall of the Jingkang era and drag the people into chaos. Thus, ‘striking first’ is not about bravado, but ensuring the peace for generations to come.\nThe rise and fall of a nation concerns every man. If one cannot wield the sword, then the pen must be used as a sword to awaken the people.\n\nSome may say: ‘War is an unfortunate tool.’ But when wolves stand at the door, abandoning the sword means waiting for death; when a poisonous snake watches the house, showing kindness will only lead to its fangs. Therefore, today’s action is not for war’s sake, but to end war with war; it is not for personal gain, but for the safety of the people.\n\nWhen the victory is achieved, the troops will return to the capital, and a monument will be erected at the seaside, inscribed: 'In the year [DATE], we struck first to conquer the sun, not to expand territory, but to protect our people.' Let future generations know that today’s 'strike first' is for tomorrow’s 'no war'; today’s 'conquer the sun' is tomorrow’s 'eternal daylight.'\n\nAh! With national peril at hand, how can any man stand idly by? I will take my three-foot sword, ride the wind, break the great waves, and take the head of the Japanese leader, hanging it at our nation’s gate to honor the loyal souls of the Jiawu war. This resolve is unwavering, until the seas dry and the rocks decay."

je_conquer_japan_tt: "#blue Two thousand years of historical grudges will be settled at this moment#!"

sino_event.44.t:0 "[concept_battle_of_east_asia]"
sino_event.44.d:0 "We call ourselves the #N 'Land of the Rising Sun'#!, and this is not an empty boast."
sino_event.44.f:0 "[SCOPE.sCountry('chi_scope').GetAdjective] has vast lands and resources, a gift from heaven and earth. The black soil of #bold Northeast#! produces sorghum that can feed millions, the mulberry trees in #bold Jiangnan#! produce silk that could wrap around the Earth three times, the jade of #bold the Western Regions#! glows softly in the morning light, and the pearls of the #bold South China Sea#! reflect the sunrise in a rainbow of colors. These are not boasts of wealth, but the foundation for the continuation of civilization.\n\nIn contrast, the islands of #v the East#! [SCOPE.sCountry('jap_scope').GetAdjective] are but rocks that the morning light occasionally passes over. They cannot grow two seasons of rice in the volcanic ash, and their narrow plains cannot sustain a brilliant civilization. Even their proud kimono still shows traces of Wu-style clothing. The Golden Pavilion in Kyoto, with its curved eaves, forever lacks the grandeur of the corner towers of the Forbidden City.\n\nWhen the Tang envoys wrote the Analects in Chang’an, who could have imagined that one day they would covet the title of 'Land of the Rising Sun'? The Tang Zhao Temple, which they now call a national treasure, was brought by the monk Jianzhen during his journey to the East. Today, it has become a capital in their contest for a name with their motherland."
sino_event.44.a:0 "It is only later, in the winds and waves, that some people's eyes have become clouded, forgetting that the strokes of false names are rooted in the bones of Chinese characters."


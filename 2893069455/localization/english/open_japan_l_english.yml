je_Regain_Xinjiang: "Regain Xinjiang"
je_Regain_Xinjiang_reason: "Looking at the map, the Western Regions are like an isolated arm, connected to Mongolia in the north, Tibet in the south, and controlling the Tianshan mountains in the west. If this arm is severed, the Central Plains will be exposed to the sharp edge of Russia, like losing an arm and being defenseless. How can we talk about security?\n\nSome may say, 'Xinjiang is barren, with deserts stretching for thousands of miles. Gaining it will not make us wealthy, losing it will not be worth regretting.' I looked at the map and sighed: when Zhang Qian opened up the Western Regions, it was not for treasures, but to sever the right arm of the Xiongnu; when Ban Chao sent troops, it was not to chase grass and water, but to solidify the western frontier of the Han Dynasty. Since the Han established the Protectorate of the Western Regions, and the Tang established the Anxi Protectorate, this land has always been part of China.\n\nThere may be occasional irritation, but it is still connected by blood. If we abandon it, it is like cutting off flesh to feed wolves, and wolves will not stop once they have meat. Tomorrow, they will tear apart the heart.\n\nI heard that the British and Russians are secretly discussing dividing Xinjiang as their spheres of influence, with Russia controlling the north to threaten Mongolia, and Britain taking the south to pressure India. They are coveting this, not because of the desolate Gobi, but because they want to use Xinjiang as a springboard to advance eastward to Shaanxi and Sichuan. Just think: if Ürümqi becomes a Russian garrison and Kashgar flies the British flag, then Chang'an will be on high alert, the Sichuan road will be under constant threat, where will 'river clear, seas peaceful' be?\n\n#v Late at night, with a lamp and a sword in hand, I suddenly stood up: Xinjiang must be regained! No matter the vast sands or the snow-capped mountains, I will march west and reclaim our territory#!"


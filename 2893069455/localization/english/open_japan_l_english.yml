sino_event.212.t:0 "Party-State Politics"
sino_event.212.d:0 "The majority of [concept_kmt] members in the National Assembly oppose the proposal of [SCOPE.sLaw('current_law_scope').GetName], arguing that it violates the [ROOT.GetCountry.GetAdjective] constitution."
sino_event.212.f:0 "“Military governance means that [concept_kmt] led the army to overthrow the Beiyang Government’s rule. \n\nTraining governance means that after [concept_kmt] obtained power, we must rule with one party and train the people to use democratic rights. \n\nOnce the people’s political awareness and understanding of rights are raised, we will return power to the people and implement constitutional governance. \n\nAccording to the ‘Training Governance Guidelines’, the Nationalist Party's Central Executive Committee political meetings are responsible for ‘guiding supervision’ of major state affairs in the Nationalist Government, acting as a bridge between the Nationalist Party Central and the Nationalist Government.”"
sino_event.212.a:0 "The Leftist Route Failed"

sino_event.213.t:0 "Corporatist Governance"
sino_event.213.d:0 "The majority of [concept_kmt] members in the National Assembly support the proposal of [SCOPE.sLaw('current_law_scope').GetName], arguing that it aligns with the [ROOT.GetCountry.GetAdjective] constitution."
sino_event.213.f:0 "“Military governance means that [concept_kmt] led the army to overthrow the Beiyang Government’s rule. \n\nTraining governance means that after [concept_kmt] obtained power, we must rule with one party and train the people to use democratic rights. \n\nOnce the people’s political awareness and understanding of rights are raised, we will return power to the people and implement constitutional governance. \n\nDo you remember Sun Yat-sen's teachings?”"
sino_event.213.a:0 "The Rightist Route Succeeded"

sino_event.207.t:0 "The Alliance of Democracy"
sino_event.207.d:0 "Since the Xinhai Revolution, our nation has raised the banner of the Republic, swept away the remnants of imperialism, established a constitution, opened the parliament, and made a declaration for democracy in Asia. Across the ocean, [SCOPE.sCountry('western_country').GetName] heard of our revolution, and the parliament cheered, with newspapers praising: ‘The ancient Eastern nation has broken its thousand-year-old chains and now walks alongside us toward civilization.’ Now, despite the vast distance, our hearts are connected, and we will form an alliance to safeguard this sacred right."
sino_event.207.f:0 "From Yu the Great who forged the Nine Tripods to the founding of the Republic, never has the East and West been so united in spirit. This is not a treaty of money, but a spiritual pact. When [SCOPE.GetRootScope.GetCountry.GetName] broke free from its shackles, it coincided with the soul of the fall of the Bastille. We are opening an unprecedented era and writing a new chapter in history."
sino_event.207.a:0 "Sign an [concept_alliance] treaty with [SCOPE.sCountry('western_country').GetName]"
sino_event.207.b:0 "Let’s discuss this again after we fix our domestic issues."

roc_recruit_button:0 "Mandatory Conscription"
roc_recruit_button_desc:0 "For the Party-State, for freedom, let’s show some strength!"

roc_recruit_modifier:0 "War-time Conscription"

je_Protectorate_War_tt:0 "Better Death Than Unrepublican"

je_if_Protectorate_War:0 "Protect the Nation Movement"
je_if_Protectorate_War_reason:0 "Now Kong has broken his former alliance, restored imperialism, dissolved the autonomy committees, and the people suffer. The dissolution of parliament leaves the nation without proper discourse; the misuse of public funds and the murder of talents have pushed the country to a dangerous position. He uses the excuse of ‘civil war’ to justify the imprisonment of innocent people. With these four crimes, no nation can survive! If the country falls, the people will become slaves, with only Kong and his treacherous allies remaining. Alas, how unfortunate for our people to entrust the nation’s fate to Kong.\n\nSince Kong became the [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')], the wilds are full of starving people while the capital remains in music and dancing; the nation suffers while the state ceremonies continue. The people cry, while one man wears the crown—does he still remember the word ‘Republic’? If he forgets it, he is a traitor to the people.\n\nWe once made a great mistake, but now we must rectify it. We must expel this traitor and save our people."


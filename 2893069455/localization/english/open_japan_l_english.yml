sino_event.237.t:0 "[SCOPE.sState('chi_state').GetName] Human Experiments"
sino_event.237.d:0 "[SCOPE.sCharacter('empire_character').GetFullName],[SCOPE.sCharacter('fascist_character').GetFullName] secretly ordered their soldiers to build concentration camps in [SCOPE.sState('chi_state').GetName] for inhumane human experiments on prisoners of war."
sino_event.237.f:0 "The Chinese civilians and POWs were treated as no more than 'experimental materials' and cruelly tortured. In the cold laboratories, they injected the victims with deadly bacteria like the plague, cholera, and anthrax, observing the onset of disease, recording their suffering and death, simply to collect 'experimental data.' Even more appalling, the soldiers performed live dissections on the victims without anesthesia, watching them die in agony without any shame.\n\nThe victims' limbs were frozen in ice water until stiff, then thawed using various methods to observe the tissue decay. Many were left disabled for life or directly tortured to death. They even simulated battlefield conditions by conducting gas experiments, locking the victims in confined spaces and releasing poisonous gas, watching them suffocate and convulse as part of the 'experiments.'"
sino_event.237.a:0 "Every Japanese hand is stained with blood."


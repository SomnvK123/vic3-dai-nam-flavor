sino_event.112.t:0 "The Restoration of Imperial Rule Edict"
sino_event.112.d:0 "You subjects, understand my intentions, unite as one, and faithfully follow the new regulations."
sino_event.112.f:0 "Heaven and earth have changed, the four seasons are formed, worldly matters are changed, and the imperial way prospers. It is said that the imperial ancestors established the Xia dynasty, governing with kindness to all nations, controlling all creatures with rites, with great power and spiritual influence, extending to all eternity. Since the Tokugawa family took over the government, three hundred years have passed. In the beginning, they accomplished great deeds, but ultimately they became complacent, the laws deteriorated, and foreign aggression took advantage of the situation, nearly bringing the country to ruin. Now, patriots within the country are deeply pained, and they all say that unless the old principles are restored and power is returned to the emperor, it is impossible to reverse the current turmoil and secure the future of the nation.\n\nI accept the spirit of the imperial ancestors, follow the will of heaven and the people, and now take up the great righteousness to restore the old order and bring about new beginnings. From now on, all matters shall be decided by [concept_japanese_emperor], and the old Tokugawa government will be abolished. Positions such as chief advisors and participants will be established to gather the best talents from the nation to discuss state affairs; we will reform oppressive laws, eliminate corrupt policies, and ensure that the imperial way is respected.\n\nThe strength of the nation lies in internal reform and external peace. I swear to restore the laws, strengthen civil governance, promote agriculture and commerce, improve military preparedness, and secure the nation’s future; externally, we will strengthen diplomatic relations and counter foreign threats to restore the prestige of [concept_shenzhou]. All my subjects, regardless of nationality, must serve the empire: samurai will serve the country with loyalty, farmers will work the land, artisans will create tools, and merchants will trade goods. Anyone who goes against the will of heaven or disrupts the order will be punished without mercy."
sino_event.112.a:0 "Then, the world will be at peace, and the four corners will return to order, and we can wait for that day."

je_wuchen_war:0 "End the civil war"
je_wuchen_war_reason:0 "The kingdom that took the world belongs to [concept_japanese_emperor] the people belong to [concept_japanese_emperor]. Since the Tokugawa family took the throne, three hundred years have passed, during which the emperor’s voice was suppressed, the people oppressed, the country humiliated and weakened, the internal corruption spread, and the crimes of the regime are countless. Now, I, with the will of heaven, take up arms to clear the corruption, bringing righteousness to the world and proclaiming to foreign nations:\n\n1. Usurpation of the imperial power.\n2. Misgovernment and humiliation of the country.\n3. Brutally killing loyal subjects.\n4. Excessive taxation and oppression.\n5. Dividing the nation.\n6. Abandoning military preparedness.\n7. Fraudulent edicts to deceive the people.\n\nAmong these seven crimes, any one of them deserves punishment. How much worse is it that they have committed them all! Now, I have issued the #o Restoration of Imperial Rule Edict#! to return the power to the emperor and restore order to the nation. The loyal samurai of Satsuma and Choshu have raised their banners, marching west toward Edo, swearing to eliminate the old evils and purify the country.\n\nI hear that foreign nations value justice and honor treaties. The Tokugawa’s treaties with foreign nations were not made in the name of [concept_japanese_emperor], but were private agreements. After the turmoil is settled, I will choose wise men to renegotiate treaties with all nations, and any treaty that is mutually beneficial and equal will be respected; however, any that violate our sovereignty or insult our nation will be annulled.\n\n#v Those who follow heaven will prosper; those who go against it will perish. The downfall of the Tokugawa can be awaited. I wish all nations to witness our revival, and once again restore our old relations, sharing peace and prosperity.#!"
open_japan.4.t:0 "The Ansei Purge"
open_japan.4.d:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName] carried out widespread arrests of Sonno Joi patriots under the guise of disrespect, attempting to suppress opposition to the opening of the country."
open_japan.4.f:0 "In 1858, the elder statesman #yellow Ii Naosuke#! signed the Treaty of Amity and Commerce with the United States without [concept_japanese_emperor]’s approval, which sparked strong dissatisfaction from the Sonno Joi faction. To maintain control, [SCOPE.gsInterestGroup('shougun_ig').GetName] launched a nationwide purge, executing dozens of patriots like #yellow Yoshida Shōin#! and imprisoning hundreds more."
open_japan.4.a:0 "Political persecution, once started, will not easily compromise."

open_japan.5.t:0 "The Sakurada Gate Incident"
open_japan.5.d:0 "The Mito clan rōnin assassinated #yellow Ii Naosuke#! at Sakurada Gate in Edo."
open_japan.5.f:0 "In March 1860, the cold wind blew through the streets of Edo as #yellow Ii Naosuke#!’s procession arrived at Sakurada Gate. Eighteen rōnin from the Mito clan suddenly sprang forth, their blades flashing in the snow, and the elder’s palanquin was overturned in the chaos. The assassins shouted #v “Restore [concept_shenzhou]”#!, and #yellow Ii Naosuke#! was instantly killed."
open_japan.5.a:0 "A group of thugs, lawless and defiant!"

open_japan.6.t:0 "The Ikuno Rebellion"
open_japan.6.d:0 "[SCOPE.sState('beautiful_state').GetName] Butama Ikuno raised an army to fight the shogunate."
open_japan.6.f:0 "In response to the uprising in Yamato by the ‘Tenchu Group,’ Fukuoka samurai #yellow Hirano Kunio#! and others supported one of the exiled court nobles, #yellow Sawa Nobuaki#!, and joined by Choshu's special forces, they raised two thousand farmers with support from local landlords, and on October 12, they took over the magistrate’s office. [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] ordered neighboring clans to attack, and #yellow Sawa Nobuaki#! fled, causing the rebels to split and the farmers to desert. Hirano was captured."
open_japan.6.a:0 "Did they never die?"

open_japan.7.t:0 "The Tengu Party Uprising"
open_japan.7.d:0 "The Mito clan’s Tengu Party raised an army under the banner of #RED “Tenchu”#!, launching a large-scale #Yellow Sonno Joi#! armed rebellion."
open_japan.7.f:0 "In 1864, the Tengu Party samurai from Mito, wearing headbands, raised the cry ‘Kill the barbarians, restore imperial power,’ and marched on Mount Tsukuba. They were dissatisfied with the clan lord’s compromise with [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName], and attempted to advance Sonno Joi by force, briefly occupying key locations. The government forces gathered a large army to suppress them, and the rebels scattered in hunger and cold, with their main members beheaded."
open_japan.7.a:0 "#yellow Higaoka Kōtarō#! lamented before committing seppuku: “Though we are defeated, the patriots of the world will carry on our cause.”"

open_japan.8.t:0 "The Forbidden Gate Incident"
open_japan.8.d:0 "The Sonno Joi faction of the Choshu clan attacked the Forbidden Gate in Kyoto, clashing with the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] coalition army."
open_japan.8.f:0 "In August 1864, the Choshu clan's army, flying the ‘Sonno Joi’ flag, fiercely attacked the Forbidden Gates and other palace gates, attempting to expel the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] forces in Kyoto. The armies of Satsuma, Aizu, and other clans held the gates, and artillery destroyed several city blocks. The Choshu forces eventually retreated, leaving hundreds of bodies in the streets of Kyoto."
open_japan.8.a:0 "A group of ‘traitors’ dares to resist?" 

open_japan.9.t:0 "The Boshin War"
open_japan.9.d:0 "In January 1868, at Tōbu Fushimi, the anti-shogunate forces raised the ‘Restoration of Imperial Rule’ banner and exchanged fire with the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] army's riflemen. From #yellow Kyoto#! to #yellow Edo#!, from #yellow Tohoku#! to #yellow Hokkaido#!, the flames of war spread across the islands. The anti-shogunate forces, led by the Satsuma and Choshu clans, fought the shogunate army in a nationwide battle, ending the Tokugawa family’s three-hundred-year reign."
open_japan.9.f:0 "“The world belongs to [concept_japanese_emperor] the people belong to [concept_japanese_emperor]. Since the Tokugawa family took the throne, three hundred years have passed, during which the emperor’s voice was suppressed, the people oppressed, the country humiliated and weakened, the internal corruption spread, and the crimes of the regime are countless. Now, I, with the will of heaven, take up arms to clear the corruption, bringing righteousness to the world and proclaiming to foreign nations:\n\n1. Usurpation of the imperial power.\n2. Misgovernment and humiliation of the country.\n3. Brutally killing loyal subjects.\n4. Excessive taxation and oppression.\n5. Dividing the nation.\n6. Abandoning military preparedness.\n7. Fraudulent edicts to deceive the people.\n\nAmong these seven crimes, any one of them deserves punishment. How much worse is it that they have committed them all! Now, I have issued the #o Restoration of Imperial Rule Edict#! to return the power to the emperor and restore order to the nation. The loyal samurai of Satsuma and Choshu have raised their banners, marching west toward Edo, swearing to eliminate the old evils and purify the country.\n\nI hear that foreign nations value justice and honor treaties. The Tokugawa’s treaties with foreign nations were not made in the name of [concept_japanese_emperor], but were private agreements. After the turmoil is settled, I will choose wise men to renegotiate treaties with all nations, and any treaty that is mutually beneficial and equal will be respected; however, any that violate our sovereignty or insult our nation will be annulled.\n\n#v Those who follow heaven will prosper; those who go against it will perish. The downfall of the Tokugawa can be awaited. I wish all nations to witness our revival, and once again restore our old relations, sharing peace and prosperity.#!”"
open_japan.9.a:0 "[Concept('concept_ruler','$RULER_TITLE_MIKADO$)] Long live!"
sino_event.31.t:0 "[SCOPE.sCharacter('gaixi').GetFullName] deeply influenced by Western learning"
sino_event.31.d:0 "Our minister [SCOPE.sCharacter('gaixi').GetFullName] has been immersed in Western studies for a long time, his heart filled with Western ideas. He abandoned old thoughts and turned to embrace [SCOPE.sIdeology('a_ideology').GetName]."
sino_event.31.f:0 "For centuries, the shogunate has governed Japan from Edo, following ancient laws, but the country has stagnated, isolated from the outside world. Though the emperor has returned to power, the country is in disarray and its foundation remains unstable. To compete in this rapidly changing world and secure a place in the global arena, it may be too soon. We must focus on internal governance and slowly strive for progress."
sino_event.31.a:0 "His words hit the mark, full of reason."

sino_event.32.t:0 "[SCOPE.sCharacter('gaixi').GetFullName] deeply influenced by [SCOPE.sIdeology('a_ideology').GetName] thoughts"
sino_event.32.d:0 "Our minister [SCOPE.sCharacter('gaixi').GetFullName] admires [SCOPE.sIdeology('a_ideology').GetName] and has thus changed his course."
sino_event.32.f:0 "The tide of nationalism is surging, and the ideas of restoring the emperor and expelling the barbarians have resonated deeply with the people. The citizens are united. If we view this from this angle, can [ROOT.GetCountry.GetAdjective] remain confined to a small land of islands? We must seize this momentum, showcase our national strength, and take our place on the vast stage of Asia."
sino_event.32.a:0 "His words are filled with grandeur and reason."

sino_event.33.t:0 "[SCOPE.sCharacter('gaixi').GetFullName] deeply influenced by [SCOPE.sIdeology('a_ideology').GetName] ideas"
sino_event.33.d:0 "Our minister [SCOPE.sCharacter('gaixi').GetFullName] has become intoxicated by the charm of [SCOPE.sIdeology('a_ideology').GetName]."
sino_event.33.f:0 "In the Taisho era, culture flourished and ideas clashed. Some channeled their emotions into poetry, depicting the beauty of the land, while others sang on the fields, expressing their unfulfilled aspirations. Romanticism spread across the islands, with scholars and commoners alike yearning for freedom and enjoying the peace. This era was marked by elegance and became the stuff of legends."
sino_event.33.a:0 "His reasoning is truly profound."

sino_event.30.t:0 "[SCOPE.sState('beautiful_state').GetName] Earthquake"
sino_event.30.d:0 "On September 1st, 1923, a powerful earthquake struck #yellow Tokyo#! and #yellow Yokohama#!. The ground shook violently, buildings collapsed, fires spread, and a tsunami followed, turning the Kanto region into a wasteland."
sino_event.30.f:0 "The shockwaves spread, destroying cities, twisting railroads, and sinking ports. In Tokyo, thousands of buildings collapsed instantly. The fire, fueled by strong winds, raged for three days, turning districts like Ginza and Asakusa to ashes. Yokohama was further devastated by a tsunami, flooding the streets and drowning countless citizens. Government buildings, schools, and hospitals were all destroyed, leaving people homeless and starving, with epidemics soon to follow. The sound of mountains collapsing and the cries of women and children filled the air. The casualties exceeded 100,000, and the material losses were incalculable. This was an unprecedented catastrophe in modern Japan."
sino_event.30.a:0 "Quickly dispatch the military to assist with disaster relief, open the granaries to feed the people."
sino_event.30.b:0 "Prioritize the safety of the imperial family and critical government sites before focusing on relief efforts."

sino_event.34.t:0 "Pacific War"
sino_event.34.d:0 "To break the blockade of Britain and the United States and advance the cause of East Asian prosperity, cabinet minister [SCOPE.sCharacter('gaixi').GetFullName] suggests declaring war on [SCOPE.sCountry('gbr_scope').GetName] and [SCOPE.sCountry('usa_scope').GetName]!"
sino_event.34.f:0 "Since the First Sino-Japanese War and the Russo-Japanese War, our country has been the dominant force in East Asia. Yet, Britain and the United States have always coveted our resources, imposing embargoes to suppress our growth.\n\nNow, our military is strong, and we are ready to strike. I command the Imperial #blue Navy#! and #blue Air Force#! to launch attacks on [SCOPE.sState('beautiful_state').GetName], while the #red Army#! sweeps through Southeast Asia. We will rid the West of its influence and establish a new East Asian order centered on us. This war is vital to the survival of the Empire, and all citizens must unite under the leadership of [Concept('concept_ruler','$RULER_TITLE_MIKADO$')] to show our might across the seas!"
sino_event.34.a:0 "[Concept('concept_ruler','$RULER_TITLE_MIKADO$')] Long live! We swear to defend the glory of the empire with our very bodies until victory is achieved."
sino_event.34.b:0 "Years of warfare have drained our resources, and the people are suffering. If we are dragged deeper into the Pacific quagmire, we may face certain destruction. We should stop and seek peace."

sino_event.41.t:0 "Our neighbor [SCOPE.sCountry('rus_scope').GetName]’s [Concept('concept_ruler','$RULER_TITLE_TSAR$')][SCOPE.sCharacter('crisis_scope_2').GetFirstName] demands the return of recently occupied [SCOPE.sState('beautiful_state').GetName]"
sino_event.41.d:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName] has been assertive, sending envoys to declare that our recent occupation of [SCOPE.sState('beautiful_state').GetName] was illegal and demanding its immediate return."
sino_event.41.f:0 "[SCOPE.sState('beautiful_state').GetName] is a strategic region with abundant resources. We took advantage of the chaos to annex it, intending to expand our borders and strengthen our defenses. However, [SCOPE.sCountry('rus_scope').GetName] sees it as part of its sphere of influence and believes our actions have violated their interests. As a result, [Concept('concept_ruler','$RULER_TITLE_TSAR$')] has personally intervened, expressing a strong stance, and relations between the two countries have rapidly deteriorated."
sino_event.41.a:0 "Even a dog would laugh at this."
sino_event.41.b:0 "We currently do not have the strength to engage in a war with [SCOPE.sCountry('rus_scope').GetName]. Why not take a diplomatic approach, bowing respectfully and still maintaining our power?"

sino_event.42.t:0 "The February 26th Military Coup!"
sino_event.42.d:0 "On February 26th, 1936, a group of young officers staged a coup, occupying key areas in Tokyo, assassinating senior officials, and shouting #v 'Restore the emperor, eliminate corruption'#!. The capital was thrown into chaos."
sino_event.42.f:0 "The rebels, calling for the purification of the government, attacked the prime minister's residence, the police headquarters, and the homes of senior officials at dawn. Key figures such as #yellow Takahashi Issei#! and #yellow Saito Makoto#! were assassinated, and #yellow Suzuki Kantaro#! was severely injured. The coup leaders seized political hubs such as Nagatacho and Kasumigaseki, posting manifestos denouncing the oligarchs and bureaucrats, demanding a 'Restoration of Imperial Politics.' Gunshots echoed through Tokyo, and the military was divided between those supporting and opposing the coup. [Concept('concept_ruler','$RULER_TITLE_MIKADO$')] was enraged, calling them 'traitors,' and tensions escalated rapidly."
sino_event.42.a:0 "We must follow the will of heaven, severely punish the traitors, and restore order to the capital."

sino_event.43.t:0 "[SCOPE.sState('skirmish_state').GetName] Battle"
sino_event.43.d:0 "[SCOPE.sState('skirmish_state').GetName] is a strategic location. The loss or gain of this place will determine the outcome. [SCOPE.sCountry('jap_scope').GetName] has brought heavy forces to attack, and the defenders have set up a strong defensive line. A fierce battle is inevitable."
sino_event.43.f:0 "To open the southern passage, [SCOPE.sCountry('jap_scope').GetName] fiercely attacks [SCOPE.sState('skirmish_state').GetName] with elite forces, bombing day and night with planes and artillery, turning the positions into scorched earth. \n\nThe [SCOPE.sCountry('chi_scope').GetName] defenders, determined to die, hold their ground, fiercely resisting with fortifications, the sound of bayonets clashing is constant, and the battlefield is littered with corpses and blood. The soldiers on the front lines endure hardships, wounded but still fighting, using their bodies to create a defense line, repelling Japanese forces multiple times. Civilians at the rear also support, providing food, medicine, and transporting the wounded, united in resistance. The battle has lasted for more than a month with no clear winner, and both sides have suffered heavy casualties."
sino_event.43.a:0 "We will closely monitor [SCOPE.sState('skirmish_state').GetName]"

sino_event.29.t:0 "Empire of Japan"
sino_event.29.d:0 "The Great Empire, from the beginning of the universe, has existed, receiving divine favor from the Sun Goddess, following the laws of the sun and moon, as the origin of all nations, governing vast lands, shining across the seas."
sino_event.29.f:0 "[Concept('concept_ruler','$RULER_TITLE_MIKADO$')] loves the people like children. \n\nAll of us, common folk, are loyal subjects of [Concept('concept_ruler','$RULER_TITLE_MIKADO$')][ROOT.GetCountry.GetRuler.GetFirstName]. The bond between ruler and subject is as unchangeable as the laws of the universe; the honor of a samurai is as steadfast as the earth beneath our feet. We must uphold the values of loyalty and sacrifice, living for the Emperor and the glory of the Empire."
sino_event.29.a:0 "[Concept('concept_ruler','$RULER_TITLE_MIKADO$')] long live!"

sino_event.35.t:0 "Decree on Separation of Shinto and Buddhism"
sino_event.35.d:0 "[concept_jap_empire] sacrifices, must return to their origins. Now, we separate the boundaries between Shinto and Buddhism, affirming the national religion and restoring our divine traditions. However, the initial implementation may cause some turmoil, which should ultimately be returned to the Imperial way."
sino_event.35.f:0 "I think: \n\nOur country was founded by divine ancestors, and the imperial way has endured for centuries. In the past, the lines between Shinto and Buddhism became blurred, and the ceremonies lost their correct form. This was not to honor the Emperor's body or return to our origins. \nNow, I issue a new decree: Shinto and Buddhism must be distinct. Shinto shrines will serve Shinto rituals, and Buddhist temples will not interfere with Shinto matters; all public worship must adhere strictly to the original traditions. This decree is not meant to suppress Buddhism but to restore the correct order. I hope all subjects understand my intent and do not misinterpret this. Let the priests of Shinto and the monks of Buddhism each fulfill their duties to preserve the strength of the nation."
sino_event.35.a:0 "We humbly accept the decree, and will restore the rituals and the Shinto traditions to strengthen the Imperial foundation!"
sino_event.35.b:0 "Your Majesty, the mixing of Shinto and Buddhism has been common for a long time, and the people are accustomed to it. A sudden change might cause unrest. I suggest we implement it gradually for the peace of the people."

sino_event.36.t:0 "Decree on Household Registration Law"
sino_event.36.d:0 "To strengthen the nation, we must establish clear household registrations, ensuring that each family knows their place and serves the Empire."
sino_event.36.f:0 "I decree: \n\nA nation is the aggregation of families, and a family is the foundation of the nation. To strengthen our empire, we must first establish a proper family system. In the past, our country had a system of ‘household’ that was highly valued. Now we formalize the ‘Household Registration Law,’ clarifying the responsibilities of heads of families and distinguishing the roles of kin. Every family will have clear lines of authority, and loyalty to the nation will be the duty of the family head. This is not just family governance but governance of the entire nation."
sino_event.36.a:0 "We humbly accept the decree and will implement this law throughout the land, to bring order to the families and strengthen the nation!"

sino_event.37.t:0 "Decree on [GetLawType('law_IJ_CI').GetName]"
sino_event.37.d:0 "In this era of global commerce, the rise and fall of nations depend on industry. I have decided to learn from Western technologies, develop industry, mining, and commerce to strengthen the nation."
sino_event.37.f:0 "I have heard: \n\nA nation's strength depends on its industries. The prosperity of the people relies on the advancement of industry. Since opening the country, Western techniques and industrial progress have served as models for us. \nNow, I issue a new policy: establish a Ministry of Industry to oversee commerce and industry nationwide. Invite Western engineers to assist in the construction of railways, mining, and factories. We will also reform the land system, allow private land sales, and collect taxes based on land prices. We will open trade routes and issue a unified currency through the Japan Bank to oversee financial matters. This policy is not merely imitating the West, but strengthening our foundation. I hope the people work together for the prosperity of our country and to make Japan a great power."
sino_event.37.a:0 "We humbly accept the decree and will exert all efforts to carry out this new policy, contributing to the restoration of the Empire!"

sino_event.38.t:0 "Decree to Ban Private Ownership of Swords"
sino_event.38.d:0 "The Imperial decree prohibits the possession of swords by civilians. [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] will gradually abandon this old habit. As times change, in this era of reform, we must unify the law and prohibit the carrying of swords by common folk."
sino_event.38.f:0 "I decree: \n\nHaving inherited the authority of the imperial ancestors, I rule over the land. In this time of great progress, we must abolish outdated practices. In the past, the samurai carried swords as a means of defense and protection. However, times have changed, and the old ways no longer fit the needs of this era. Swords are dangerous weapons and should not be carried by civilians. This decree is issued to restore order and ensure the safety of the people. The [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] must understand that times have changed, and they should lay down their old practices for the greater good of the nation."
sino_event.38.a:0 "Your Majesty is wise! The reforms are necessary, and they should be carried out without delay!"
sino_event.38.b:0 "Your Majesty, this sudden change may cause unrest. It would be better to implement it gradually for the peace of the people."

sino_event.39.t:0 "Comprehensive Invasion Plan for China"
sino_event.39.d:0 "The Imperial Cabinet Minister [SCOPE.sCharacter('crisis_scope_2').GetFullName] has submitted a comprehensive invasion plan for China to [Concept('concept_ruler','$RULER_TITLE_MIKADO$)], and the Empire will strike China with lightning speed within three months, fulfilling the grand expansion plans."
sino_event.39.f:0 "[SCOPE.sCountry('chi_scope').GetAdjective] is rich in resources and strategically important, long coveted by our Empire. Now, the [concept_jap_empire] military is strong enough to launch a full-scale invasion. This plan is designed to quickly seize key locations in [concept_dsk_china], crush its resistance, and install puppet regimes, securing China's resources and strategic advantage, laying the foundation for Japan to dominate East Asia. The plan outlines troop deployments, attack routes, and the methods of post-invasion governance, vowing to bring [SCOPE.sCountry('chi_scope').GetAdjective] into the Empire."
sino_event.39.a:0 "This is a key step in the Empire's grand strategy, and it must be carried out immediately to enhance our national prestige."
sino_event.103.t:0 "Southeast War"
sino_event.103.d:0 "[SCOPE.sCountry('smf_scope').GetAdjective] old soldiers rebel, causing the flames of war to spread across Kyushu. Led by [SCOPE.sCharacter('ruler_scope').GetFullName], they gather tens of thousands to resist our new policies, putting the country in peril."
sino_event.103.f:0 "[ROOT.GetCountry.GetRuler.GetFirstName] January of the 10th year, #yellow Kagoshima#! At night, there was a shock. Military students attacked the gunpowder store, setting the city on fire, and chaos ensued. At the time, [SCOPE.sCharacter('ruler_scope').GetFullName] was hunting on the Okuma Peninsula, and upon hearing of the change, returned and saw the students' movements. Realizing that the situation was irreparable, although it was not yet a time for rebellion, the old forces gathered and the soldiers' sentiments were boiling, leading to the decision to raise arms. \n\n[SCOPE.sCountry('smf_scope').GetAdjective] old soldiers assembled, #yellow Kyushu#! Dissidents gathered in large numbers, totaling more than 40,000. Former elite forces that fought in the rebellion now turned against the government; former patriots who helped the Meiji restoration had become the leaders of this revolt. The military's blade pointed directly at the central government, and the new policies of [concept_jap_empire] were on the brink of collapse. \n\nI heard of this and am deeply saddened. The [SCOPE.sCharacter('ruler_scope').GetLastName] family had originally contributed to the country, yet they were misled by old customs and disregarded national law. Now that the chaos has begun, though not what I desired, the country's discipline must not be abandoned, and the law must not be violated. The army must be reorganized to suppress the rebellion and ensure the stability of the people."
sino_event.103.a:0 "We respectfully request permission to defeat the rebels! We will give our utmost efforts."

sino_event.104.t:0 "Loyalty of the Samurai"
sino_event.104.d:0 "The leader of [SCOPE.gsInterestGroup('is_army_ig').GetName] and general [SCOPE.sCharacter('army_ig_general').GetFullName] is deeply moved by the Emperor’s grace and leads the samurai to swear loyalty to [ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_MIKADO$')]"
sino_event.104.f:0 "Since the Meiji Restoration, the samurai have been confused by the changing times, but their loyalty to the Emperor remains. Now, [SCOPE.sCharacter('army_ig_general').GetLastName] deeply understands the truth and knows that the new policies are not abandoning the old system but rather building upon it for the future. \n\nTherefore, he gathers his samurai under the Imperial banner, burns incense, and swears: 'With my body, I will protect the Emperor; with my skills, I will assist in the resurgence of the Empire.' Their loyalty shines like the sun, their resolve will strengthen the state."
sino_event.104.a:0 "With such a fine general, how could we fail? We must reward him generously to inspire the nation!"

concept_shenzhou:0 "Shenzhou"
concept_shenzhou_desc:0 "Chinese view: The term 'Shenzhou' refers to the central region of China, symbolizing the 'sacred land' and 'center of the world.' \nJapanese view: After the Heian period (794-1185 AD), with a growing sense of Japanese cultural identity, some scholars began to adopt the Chinese concept of '[concept_shenzhou]' and referred to Japan as '[concept_shenzhou],' emphasizing Japan as the 'divine nation.'"

je_jap_xinan_war_will_break_out_tt:0 "The conflict between the samurai intensifies."

je_annex_smf:0 "Southeast War"
je_annex_smf_reason:0 "[ROOT.GetCountry.GetRuler.GetFirstName] January of the 10th year, #yellow Kagoshima#! At night, there was a shock. Military students attacked the gunpowder store, setting the city on fire, and chaos ensued. At the time, [SCOPE.sCharacter('ruler_scope').GetFullName] was hunting on the Okuma Peninsula, and upon hearing of the change, returned and saw the students' movements. Realizing that the situation was irreparable, although it was not yet a time for rebellion, the old forces gathered and the soldiers' sentiments were boiling, leading to the decision to raise arms. \n\n[SCOPE.sCountry('smf_scope').GetAdjective] old soldiers assembled, #yellow Kyushu#! Dissidents gathered in large numbers, totaling more than 40,000. Former elite forces that fought in the rebellion now turned against the government; former patriots who helped the Meiji restoration had become the leaders of this revolt. The military's blade pointed directly at the central government, and the new policies of [concept_jap_empire] were on the brink of collapse. \n\nI heard of this and am deeply saddened. The [SCOPE.sCharacter('ruler_scope').GetLastName] family had originally contributed to the country, yet they were misled by old customs and disregarded national law. Now that the chaos has begun, though not what I desired, the country's discipline must not be abandoned, and the law must not be violated. The army must be reorganized to suppress the rebellion and ensure the stability of the people."
no_smf_tt:0 "[SCOPE.sCountry('smf_scope').GetAdjective] rebels have been suppressed."

japan_has_fail_tt:0 "[SCOPE.sCountry('jap_scope').GetAdjective] has been defeated and surrendered!"

je_shintoism_development:0 "Shintoism"
je_shintoism_development_reason:0 "I have heard: Shintoism is the foundation of our country. Since the divine ancestors established the royal family, the way of the gods has been the basis for the governance of the Empire, connecting heaven and earth.\n\nIn the past, the blending of Shintoism and Buddhism caused confusion, and the rituals lost their true meaning. I, inheriting the will of the heavens, will restore Shintoism to its pure form. Shinto shrines will focus solely on rituals to honor the gods and ancestors, while the people will receive divine blessings to cultivate loyalty and filial piety. Shintoism is not just a religion but a way for our people to remain strong and for [concept_jap_empire] to prosper. Now, we will reorganize the rituals, set clear guidelines for Shinto priests, and restore the faith to its original purity. Thus, we hope for divine protection and the eternal prosperity of [concept_jap_empire]."
$TOOLTIP_DELIMITER$
"This [concept_journal_entry] will increase progress based on the conditions listed, and under certain conditions, it will trigger an event with stronger effects."

dsk_je_shintoism_development_advance:0 "#v 1. Ise Grand Shrine Festival\n2. Heroic Woman#!"
dsk_je_shintoism_development_advanced:0 "The monthly progress rate will be the same as the number of #yellow Shinto Shrine Renovations#! triggered, but the minimum progress growth will be 0.5."

is_japan_only_tt:0 "We will change our name to #yellow Empire of Japan#!"
dyn_c_jzz_is_JAP_state:0 "Empire of Japan"

shrine_modifier:0 "New Shrine"
torii_modifier:0 "New Torii Gate"
torii_rebuild_button:0 "Rebuild Torii Gate"
torii_rebuild_button_desc:0 "The torii gate marks the boundary of sacred land. Now, due to weather damage, it is in need of repair. A new gate will be constructed, with red lacquer reflecting the sunlight, standing tall, reminding the common people of the sanctity of the sacred ground and the divine protection of the gods."
shrine_rebuild_button:0 "Construct a New Shrine"
shrine_rebuild_button_desc:0 "The shrine is where we honor Amaterasu and the royal ancestors. As our borders expand and our population grows, it is necessary to build new shrines in auspicious locations, to spread the divine blessings of the gods and solidify the faith of the people. The shrine will serve as a place for rituals, uniting the people and ensuring the eternal stability of [concept_jap_empire]."
has_enough_shintoism_var:0 "Requires 50 progress"

shinto_war_breakout_button:0 "Annihilation of the Enemy"
shinto_war_breakout_button_desc:0 "Foreign invaders desecrate our sacred land and invade our Imperial residence. This is an act that enrages both the gods and the people. We, the people of Yamato, will take up arms and defend our land with our lives. Even if we are destroyed, we will make the invaders understand that [concept_jap_empire] will not tolerate insults."

sino_event.82.t:0 "[ROOT.GetCountry.GetRuler.GetFirstName]'s Heroic Woman"
sino_event.82.d:0 "A soldier's wife commits suicide."
sino_event.82.f:0 "A newlywed wife, in order to encourage her husband to fight for [SCOPE.sCountry('western_country').GetName][concept_war], and to ensure that he has no worries, took her own life on the eve of his departure! \n\nOvernight, the heroic woman became a shining example of Japanese womanhood. The media widely praised her as #N [ROOT.GetCountry.GetRuler.GetFirstName]'s heroic woman#!, claiming her death greatly boosted the morale of the soldiers, and all [concept_jap_empire] troops were deeply moved. Two movie studios quickly adapted her story, releasing it nationwide and even bringing the film to the frontlines of the war against [SCOPE.sCountry('western_country').GetName]."
sino_event.82.a:0 "Make a big deal out of this story!"

je_fei_dao_ling:0 "Sword Abolishment Edict"
je_fei_dao_ling_reason:0 "In 1870, the Meiji government first prohibited civilians from carrying swords. The following year, another decree was issued, abolishing the exclusive sword rights of the samurai. In 1873, the Conscription Law was enacted, replacing the samurai-dominated military system with mandatory military service, making 'every citizen a soldier,' and causing the samurai to lose their traditional profession. At the same time, the 'Stipend Reformation' was carried out, where public bonds were used to buy back the samurai’s stipends, completely ending their economic privileges."
je_hu_ji_fa:0 "Household Registration Law"
je_hu_ji_fa_reason:0 "In 1871, the Household Registration Law broke the old system of segregated household registration by class, and now all people, whether samurai, farmers, or commoners, were registered by family. Although this was merely a formal record, it officially abolished the hierarchical 'four classes' and marked the beginning of the institutionalization of 'equality among the four classes,' setting the stage for subsequent civil law reforms."
je_zhi_chan_xing_ye:0 "Promotion of Industry"
je_zhi_chan_xing_ye_reason:0 "Faced with pressure from Western capitalist powers, the Meiji government adopted 'Promotion of Industry' as a key national policy. By leading the transplantation of modern industrial technology through the Ministry of Industry, supporting state-run factories, and reforming land and financial systems, Japan transitioned its economy toward a capitalist production model. This policy, alongside 'Rich Nation, Strong Army' and 'Civilization and Enlightenment,' formed the foundation for Japan's modernization, aimed at industrial revitalization and resisting foreign aggression, ultimately making Japan a strong nation."

open_japan.10.t:0 "Declaration of Humanity"
open_japan.10.d:0 "[ROOT.GetCountry.GetRuler.GetFirstName][concept_japanese_emperor] decrees the rejection of divine status, declaring himself a mortal and breaking the old myth of Japan as the 'divine nation,' initiating a new era of separation between religion and politics."
open_japan.10.f:0 "There has been a long-standing myth between myself and the people, where I am considered a descendant of the gods and unlike ordinary men. However, I am truly a common man, experiencing the same joys and hardships as all of you.\n\nMy government was established to alleviate the suffering of the people and solve their problems, and thus, all governance is for this purpose. Now, I shall issue new policies, spread them far and wide, and help the people overcome their difficulties.\n\nI also hope that the people will rise from adversity, overcome current hardships, revive culture, and move forward with determination. May our people become unified in sincerity, helping and supporting one another, cultivating a spirit of benevolence and virtue; let the nation's path of honor and shame be carried on to its fullest extent.\n\nI firmly believe that our people's contribution to the world’s happiness is inevitable, and I have no doubt about it. The year’s plan is made in spring, and together with the trusted citizens, we shall strive with one heart, and the great cause will surely be achieved!"
open_japan.10.a:0 "From now on, we are not bound by divine status but by the will of the people."

open_japan.11.t:0 "Ise Grand Shrine Festival"
open_japan.11.d:0 "Following ancient rites, [ROOT.GetCountry.GetRuler.GetFirstName][concept_japanese_emperor] personally attends the #yellow Ise Grand Shrine#! to conduct the great festival, honoring #v Amaterasu#! and preserving the traditions of #yellow Shintoism#!."
open_japan.11.f:0 "Ise Grand Shrine is the ancestor of all shrines in our country, dedicated to Amaterasu. Every twenty years, the shrine is moved in accordance with the ancient 'Shikinen Sengu' tradition. Now, during this grand festival, [ROOT.GetCountry.GetRuler.GetFirstName][concept_japanese_emperor] personally leads the ceremony, offering gifts and reciting prayers, seeking divine blessings for the peace of the land and the well-being of the people.\n\nAlthough the festival follows old customs, it is no longer a tool for divine power but a cultural ceremony, reminding the people of the teachings of their ancestors and the separation of religion and politics."
open_japan.11.a:0 "Observe the ancient rites to preserve cultural continuity and reassure the hearts of the people."
popular_ruler:0 "Popular Leader"
shinto_state_tt:0 "[concept_japanese_emperor] is revered, known as the 'Imperial Line of Ten Thousand Generations,' the descendant of Amaterasu."
shinto_militarized_tt:0 "Conquer a thousand miles of waves, announce the imperial authority in all directions, and assert the power of the divine nation over the eight seas."
shinto_postwar_tt:0 "Practice the true meaning of harmony, establish a constitutional monarchy, and abandon the path of external expansion."
shintoism_development_modifier:0 "Shinto Shrine"
no_more_torii_modifier_tt:0 "All provinces will remove the modifications brought by this [concept_journal_entry]."

je_dsk_jap_kamikaze: "[ROOT.GetCountry.GetAdjective] National Policy"
je_dsk_jap_kamikaze_reason: "#v This is our national policy tree, which well reflects the current state and task progress of [concept_country]! \n\n#v As previous policies are completed, new ones will emerge! #\n\nThough Japan is located on the eastern side of Asia, its people's spirit has shed the old, backward traditions of Asia and moved towards Western civilization. However, unfortunately, there are two neighboring countries, one called Qing and the other called Joseon. These countries' people were cultivated in Asia's traditional political and religious customs, and though Japan and these nations may seem similar, perhaps due to differences in their origins, they operate under the same customs but with distinct educational legacies. While China and Korea are more similar, they still don't know how to improve their countries. They may have seen modern civilizations, yet they remain indifferent to them, clinging to old ways. \nToday, neither Qing nor Joseon offers any benefit to Japan. In fact, Westerners might view all three countries similarly, judging Japan based on the standards applied to China and Korea. For example, both Qing and Joseon's governments still operate under ancient despotism, leading Westerners to view Japan as a lawless nation; both China and Korea are known for their superstitions, which may mislead others to think Japan shares the same beliefs; Joseon's brutal executions also cause people to suspect that Japan is equally cruel... These are just a few examples of the diplomatic obstacles we face, a great misfortune for Japan. \nTherefore, Japan’s best strategy today is to not wait for our neighbors to reform and prosper Asia with us but to move forward with Western civilization and leave them behind."
sino_event.96.t:0 "[concept_battle_of_east_asia]"
sino_event.96.d:0 "Although Japan is located on the eastern side of Asia, its people’s spirit has shed the backwardness of Asia and moved toward Western civilization. Unfortunately, our two neighboring countries, [SCOPE.sCountry('chi_scope').GetAdjective] and [SCOPE.sCountry('kor_scope').GetAdjective], remain entrenched in old customs."
sino_event.96.f:0 "Both [SCOPE.sCountry('chi_scope').GetAdjective] and [SCOPE.sCountry('kor_scope').GetAdjective] governments still practice ancient despotism. Westerners see this and mistakenly believe [ROOT.GetCountry.GetAdjective] is lawless. [SCOPE.sCountry('chi_scope').GetAdjective] people are subservient and shameful, while [ROOT.GetCountry.GetAdjective]’s chivalry is obscured; [SCOPE.sCountry('kor_scope').GetAdjective] people’s executions are cruel, and [ROOT.GetCountry.GetAdjective] people are thought to be heartless... These instances, among others, can become significant obstacles in our diplomacy, a major misfortune for our country."
sino_event.96.a:0 "Thus, Japan’s best strategy today is to not wait for our neighbors to reform and grow Asia, but to leave them behind and walk forward with Western civilization!"

invade_kor_tt:0 "#v The Campaign to Conquer Korea#! has begun."

sino_event.97.t:0 "Bushido"
sino_event.97.d:0 "Bushido is the foundation of the samurai's existence, the key to life and death."
sino_event.97.f:0 "Loyalty and righteousness are its bones, courage and military skill its edge, integrity and honor its wall, respect and reverence its example. In the face of adversity, be unyielding; in the face of the enemy, be unafraid; at the moment of life or death, only righteousness remains. With the sword as the pen, write loyalty and sacrifice; with the heart as the mirror, reflect sincerity. This way, passed down through generations, will never perish."
sino_event.97.a:0 "With Bushido upheld, the way of the warrior flourishes; with the way of the warrior flourishing, the nation’s power will rise."

sino_event.98.t:0 "Japanese Tea Ceremony"
sino_event.98.d:0 "Grinding tea into powder, pouring water as a spring, hiding heaven and earth in one room."
sino_event.98.f:0 "Harmony, respect, purity, tranquility are its principles; the brewing process is an art form. With the tea whisk, dust is brushed away; with the tea bowl, the heart is revealed. In the motion of pouring and stillness, the Zen spirit is felt; in the strong and light flavors, the tranquility of time is embodied. Not just drinking tea, but tasting the heart, tasting the world."
sino_event.98.a:0 "One tea, one bowl, can calm the body and mind; one room, one garden, can reflect heaven and earth."

sino_event.99.t:0 "The Theory of Invasion of China"
sino_event.99.d:0 "The theorists argue that China’s land is rich in resources, vast in area, and should be taken by force to expand our territory and seize its resources."
sino_event.99.f:0 "[SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName], [SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName], and others said: 'China, long situated in East Asia, has experienced periods of prosperity and decline. However, its fertile land and abundant treasures are gifts from heaven. Now, with our country’s growing power and military strength, if we do not act quickly, we may lose this opportunity to another country. And the Chinese people are known to be weak and unable to resist, so we warriors should easily overcome them.'\n\nThis argument has caused a stir both in the government and among the people, with some praising its boldness and others condemning its brutality."
sino_event.99.a:0 "Though this argument is harsh, it is a plan worth considering."

invade_china_now_complete:0 "#v The Theory of Invasion of China#! has been implemented."

open_japan.12.t:0 "The Theory of Conquering Korea"
open_japan.12.d:0 "After Japan’s internal situation stabilized, factions debated the issue of Korea. The Satsuma and Choshu generals said: 'Korea, a small country, has long been under the Qing dynasty's influence and is oblivious to changes. Now that our nation has undergone reforms, it’s time to show our power abroad, starting with Korea to expand our territory and enrich our resources.'"
open_japan.12.f:0 "[SCOPE.sCharacter('turkfm_tanzimat_character_1').GetFullName] and others strongly supported this view, saying: 'If we miss this opportunity, we may be overtaken by Russia and Qing, and our country will be in danger.' \n[SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName] and others argued: 'Our internal stability is not yet solid, and our treasury is empty. Sudden military action will invite foreign insults. We should first focus on reforming the government, stimulating industry, and strengthening the country before pursuing foreign expansion.' After months of debate, [concept_japanese_emperor] was still undecided. \nSoon after, Korea rejected our diplomatic letter, saying 'We do not follow the old practices.' The war faction grew louder, 'Since they have ignored us, we should use military force to subdue them.' Thus, ships were dispatched to the waters off Busan, declaring 'We are seeking justice.'"
open_japan.12.a:0 "We will expand our territory by conquering the waves and settle this once and for all."

sino_event.80.t: "Imperial Parliament Convened"
sino_event.80.d: "The Imperial Diet convened successfully under the guidance of [Concept('concept_ruler','$RULER_TITLE_MIKADO$)]."
sino_event.80.f: "The Imperial Diet consists of both the House of Representatives and the House of Peers. The House of Representatives members are elected by the people, while members of the House of Peers are appointed from the royal family, aristocracy, and other nominated individuals. The head of the House of Peers is usually appointed for life. Both houses have equal authority, but the House of Representatives holds the power to discuss the budget first. On November 29, 1890, the first session of the House of Representatives and the House of Peers convened. On March 31, 1947, the 92nd House of Representatives dissolved, and the House of Peers was adjourned."
sino_event.80.a: "The first session of the Imperial Parliament was successfully convened."
sino_event.80.b: "The second session of the Imperial Parliament was successfully convened."
sino_event.80.c: "The third session of the Imperial Parliament was successfully convened."
sino_event.80.z: "The fourth session of the Imperial Parliament was successfully convened."
sino_event.80.e: "The fifth session of the Imperial Parliament was successfully convened."

japan_over: "The Imperial Parliament has concluded."

sino_event.81.t:0 "Indigenous Uprising"
sino_event.81.d:0 "Since we occupied Taiwan, some stationed officers forced the indigenous people into inhumane labor, and rebellions often occurred during the pacification campaigns. Oppressed and humiliated, the indigenous people, led by a tribal chief named Mona Rudao, launched uprisings in the mountains."
sino_event.81.f:0 "Only with slaughter can we teach the rebels to obey our rule."
sino_event.81.a:0 "Suppress the Wushe Uprising and kill all the rebels."
sino_event.81.b:0 "Calm the situation and allow the local indigenous people to share governance."

sino_event.83.t:0 "[SCOPE.sCountry('rus_scope').GetName] demands that we return the illegally occupied #yellow Manchurian Provinces#!"
sino_event.83.d:0 "The neighboring nation of Russia has recently shown increasingly aggressive expansionism, and its influence is spreading across the Far East. The Manchurian region is of strategic importance, and Russia has its eyes on it, causing border tensions."
sino_event.83.f:0 "Manchuria, with its vast fertile land, abundant resources, and strategic significance, is a key battleground. Should we settle the matter with Russia through an agreement, dividing the region, or should we resist their relentless encroachment? The outcome of this decision will affect the future of the nation."
sino_event.83.a:0 "Russia is pursuing an expansionist policy. If we do not act, it will become a serious threat, and we cannot allow it."
sino_event.83.b:0 "Manchuria is vast and rich enough to accommodate both countries. Why should we fight over a few pieces of land when it could bring us further conflict?"

sino_event.84.t: "The Anglo-Japanese Alliance"
sino_event.84.d:0 "[SCOPE.sCountry('jap_scope').GetName] sends envoys to form an alliance with [SCOPE.sCountry('rus_scope').GetName] in order to counter Russian expansion."
sino_event.84.f:0 "In order to curb Russia's expansion, the two countries agree to recognize China and Korea as 'independent' nations. If either country faces external aggression or internal turmoil, both parties may take action. Should either side engage in war with another country, the other party will remain neutral. If one side is involved in conflict with two or more nations, the other side will send support. Furthermore, both sides will protect the rights of their nationals in China, Japan, and Korea."
sino_event.84.a:0 "Agree"
sino_event.84.b:0 "Not now"

sino_event.85.t:0 "Violation of the #yellow Great Japanese Empire Constitution#!"
sino_event.85.d:0 "The [SCOPE.gsInterestGroup('shougun_ig').GetName] opposes the proposal for the new law, claiming that it violates the #yellow Great Japanese Empire Constitution#!."
sino_event.85.f:0 "The Great Japanese Empire, ruled by the unbroken imperial line, has established the constitution as the foundation of the country, ensuring order and stability. Any proposal that violates the constitution would destabilize the nation."
sino_event.85.a:0 "We must carefully examine this matter and, if the proposal indeed violates the constitution, it should be repealed."


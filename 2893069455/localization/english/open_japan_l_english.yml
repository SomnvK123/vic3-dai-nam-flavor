sino_event.175.t:0 "Treaty of Nanking (Sino-British)"
sino_event.175.d:0 "Due to the recent discord between the Qing Dynasty [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and the British [Concept('concept_ruler','$RULER_TITLE_KING$')], this treaty is signed to end the conflict and establish a permanent peace."
sino_event.175.f:0 "After the British forces arrive at #yellow Nanjing#!, Governor-General of Jiangsu #yellow Niu Jian#! requests peace with [SCOPE.sCountry('gbr_scope').GetName]. On August 8, Vice Governor-General of Zha Pu #yellow Yi Li Bu#! arrives first, sending his servant #yellow Zhang Xi#! twice to meet with British fleet officers, with translator #yellow Ma Ruhuan#!."
sino_event.175.a:0 "The terms of the treaty will be enacted from the date of signing."


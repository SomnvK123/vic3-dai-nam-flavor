sino_event.87.t: "National Revolutionary Army"
sino_event.87.d: "[SCOPE.sCharacter('white_army_general').GetFullName] has reformed the [SCOPE.gsInterestGroup('white_army_ig').GetName] into the National Revolutionary Army. The flag they bear is one of freeing us from the shackles of the [concept_great_power] and smashing the chains of feudalism, so that our nation's great rejuvenation may continue."
sino_event.87.f: "Four hundred million people! Hear the drums and horns sound! A hundred years of national humiliation, like a bone lodged in the throat; a thousand years of imperial rule, like chains binding us. Today, we reassemble our troops—not for warlordism or personal gain, but for the people of the world! March north to crush the foreign embassies' arrogance, march south to wipe out the local tyrants and corrupt gentry! May our soldiers, blood soak the fertile plains, may our people, unite in the cause of the Republic!"
sino_event.87.a: "For the party's long-lasting foundation! For the eternal rivers and mountains of [SCOPE.GetRootScope.GetCountry.GetName]! The blood of the pioneers has not yet cooled, and the successors must march forward—until we strike at the heart of the dragon, this new Republic will rise!"
je_huangpu_xuesheng:0 "Whampoa Military Academy"
je_huangpu_xuesheng_reason:0 "The purpose of establishing the Whampoa Military Academy was to train officers for the National Revolution, as Sun Yat-sen hoped to save China from its peril through the creation of a revolutionary army.\n\n'We established this school to train students who will form the foundation of the revolutionary army. Once the army is established, our revolution will succeed.' — Sun Yat-sen."

roc_defense_button:0 "Sino-American Mutual Defense Treaty"
roc_defense_desc:0 "We share common values with the United States. Signing this treaty will help ensure the continued implementation of our one-party rule. The treaty is valid for 10 years and can be renewed."

landowners_fix_button:0 "New Ideals"
landowners_fix_button_desc:0 "Allow more people to join our democratic cause."

je_whitesun_redland:0 "Nationalist Party Congress"
je_whitesun_redland_reason:0 "This [concept_journal_entry] features the #tooltippable;tooltip:[Country.GetTooltipTag], je_kuomintang_pos #blue Historical Mechanisms#!#!\n$TOOLTIP_DELIMITER$\nWe have successfully transitioned to [SCOPE.GetRootScope.GetCountry.GetName], and the nation is at a critical juncture of rebuilding. It is necessary to hold a national congress to make significant strides in our democratic politics. However, there are still conflicts between conservatives and liberals within the congress.\n\n#v Historical Note#!: During Sun Yat-sen’s era, the [concept_kmt] underwent numerous reorganizations, and after adopting party principles from the Russian Communist Party, the party congress became the highest decision-making body; during Chiang Kai-shek’s era, factionalism prevailed, and the congress became a stage for the powerful to shine; reviewing the various Nationalist Party congresses, it’s clear that it has transformed multiple times through difficult transitions. The question remains: what forces kept the [concept_kmt] from falling apart, allowing it to survive time and again during its critical moments?"

je_kuomintang_pos: "A Nationalist Party congress will be held once every five years, with a total of four congresses. As the progress bar rises and falls, more options will appear.\nIf #blue Blue Sky with White Sun#! has the advantage, the [concept_journal_entry] will trigger one of the following events:\n1. Rise of railways\n2. Rise of cities\n3. Sino-foreign joint schooling\n4. Entrepreneurs creating newspapers\n$TOOLTIP_DELIMITER$\nIf #v Black Sky Blocks the Sun#! has the advantage, the [concept_journal_entry] will trigger one of the following events:\n1. Suppression of movements\n2. Warlord politics\n3. Factional strife\n4. Party purges\n$TOOLTIP_DELIMITER$\nIf the #blue Blue Sky with White Sun#! progress bar is below #n 400#!, the effects of the Nationalist Party congress events will be drastically different."

sino_event.208.t:0 "[SCOPE.sCountry('gbr_scope').GetName]’s [SCOPE.sCharacter('crisis_scope_2').GetFirstName] demands a renegotiation of our southwestern borders"
sino_event.208.d:0 "The British Indian government’s Foreign Secretary McMahon lured Tibet's local representatives to secretly negotiate a border adjustment, shifting the boundary 150 kilometers into China’s Tibet region, away from the Assam plains."
sino_event.208.f:0 "This was fabricated by British and British Indian officials through dishonorable means, including falsifying history, destroying evidence, and publishing fraudulent books."
sino_event.208.a:0 "At this point, we have no choice but to comply."
sino_event.208.b:0 "We will never submit to the imperialistic tyranny of the British Empire."

sino_event.209.t:0 "[SCOPE.sCountry('rus_scope').GetName]’s [SCOPE.sCharacter('crisis_scope_2').GetFirstName] demands that we cede [SCOPE.sState('tuva_scope').GetName]"
sino_event.209.d:0 "The Russian colonialist ‘Mad Baron’ Enchin and his band of thugs have occupied the Outer Mongolian capital, Kharkhorin."
sino_event.209.f:0 "Due to internal turmoil, we have yet to retake the region, but we are temporarily garrisoning [SCOPE.sState('tuva_scope').GetName] until we can restore order and return the area after suppressing the rebels."
sino_event.209.a:0 "At this point, we have no choice but to comply."
sino_event.209.b:0 "We will never submit to the imperialistic tyranny of Russia."

sino_event.210.t:0 "[concept_kmt] Complete Reorganization"
sino_event.210.d:0 "Transitioning from 'Party-led government' to 'Party assisting civilian rule'"
sino_event.210.f:0 "This ideological shift may be fundamental. By discarding outdated dogma and incorporating new ideas to adapt to the times, we reshape public identity. For example, integrating civil rights principles into grassroots governance.\n\nThe reorganization of the party’s foundation has far-reaching implications. If factionalism is purged, removing power bases and clan barriers, replacing old elites with democratic leaders, and shifting from personal loyalty to public service, party unity can be achieved.\n\nInternal and external policy shifts will affect the whole situation. Externally, shifting alliance strategies may help achieve new international balances based on national interests. Internally, abandoning the ‘crackdown and appeasement’ policy in favor of a ‘conciliation and integration’ approach might lead to breakthroughs in border governance and improving the people's livelihoods. But if policy coherence breaks down, social confusion could follow, requiring strong measures to stabilize and patient education to consolidate the foundation."
sino_event.210.a:0 "The rebirth of the Party benefits the nation, like the rising sun breaking through the clouds, illuminating a new path."

sino_event.211.t:0 "Mutual Exclusion of the Left Wing"
sino_event.211.d:0 "[SCOPE.sCharacter('Aowu_scope').GetFullName] and [SCOPE.sCharacter('Buhuashu_scope').GetFullName] engage in a heated debate over the Nationalist Party’s policies."
sino_event.211.f:0 "[SCOPE.sCharacter('Aowu_scope').GetFullName]: 'You think we should approach the people's livelihood gradually? That's typical right-wing conservatism!'\n\n[SCOPE.sCharacter('Buhuashu_scope').GetFullName]: 'You constantly talk about class struggle and push for radical policies, that's false leftism!'\n\nSomeone asks: 'Why don’t you condemn certain “pseudo-leftists”?' Both respond: 'If we condemn them, we fall into your trap of judgment; if we don’t, you’ll accuse us of protecting heretics. Better to expel each other from the Leftist camp, that way the Left will be pure.'"
sino_event.211.a:0 "I was first expelled by the Nationalist Party, then by the Communist Party, and in the end, I became a ‘rootless wanderer’ — Tan Pingshan"

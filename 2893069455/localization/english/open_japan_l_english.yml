sino_event.199.t:0 "Warlord Conflicts"
sino_event.199.d:0 "The fall of the Qing Dynasty ended [ROOT.GetCountry.GetAdjectiveNoFlag]’s long-standing feudal rule, but [ROOT.GetCountry.GetRuler.GetFullName], holding a strong military, was not satisfied with his current political position. He launched an attack on the revolutionary army, and [ROOT.GetCountry.GetAdjectiveNoFlag] entered a new era of warlord factionalism."

sub_republic_royalist_struggle_bar_tt:0 "#v Decrease#! progress bar by 40 points"

sino_event.197.t:0 "Illegitimate Ascension"
sino_event.197.d:0 "[SCOPE.sCharacter('landowners_ig_general').GetFullName] criticizes #blue the National Government#! for illegitimate ascension, claiming it is an act of parricide and regicide!"
sino_event.197.f:0 "#yellow Liang Bi#! and #yellow Pu Wei#!, #yellow Tie Liang#! and other organizations formed the 'Monarchist Constitutional Maintenance Society' (commonly known as 'Zongshe Party'), opposing the peace talks and the abdication of the Qing emperor.\n\nWe, the loyalists, swear to fight until death to preserve the Qing Empire and prevent Yuan Shikai from using the revolutionaries to pressure the court. We advocate for the mobilization of the Beiyang Army to confront the revolutionary army in a life-or-death battle. The republic is a great disaster, and monarchist constitutionalism is the true path to save the nation! Manchuria and Mongolia were once united, and we shall rebuild the Qing Dynasty by restoring the rightful heir, Puyi."

sino_event.197.a:0 "A bunch of feudal remnants!"
sino_event.198.t:0 "Uremia"
sino_event.198.d:0 "A private doctor from [SCOPE.sCountry('western_country').GetName] discovered a severe illness while conducting a checkup for [ROOT.GetCountry.GetRuler.GetFullName]!"
sino_event.198.f:0 "[ROOT.GetCountry.GetRuler.GetFullName] has to use the toilet every half hour, with urine floating with 'white flakes.' A doctor from [SCOPE.sCountry('western_country').GetName] wrote in a secret medical report in January: 'Both kidneys are as swollen as goose eggs, with less than 300 milliliters of urine output daily.' However, what truly accelerated his death were the deer antler-fed ducks and the daily consumption of ginseng and deer antler soup. These hot-natured supplements turned into poison in the body of an uremic patient. As his third daughter Yuan Jingxue said: 'The more he took supplements, the more his body seemed like a pillar eaten away by termites.'"
sino_event.198.a:0 "Hire foreign top-level specialists to treat [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] at any cost."
sino_event.198.b:0 "Pray for [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] at the Temple of Heaven!"

sino_event.200.t:0 "A citizen kneels to worship [ROOT.GetCountry.GetRuler.GetFullName][Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]’s portrait"
sino_event.200.d:0 "An elderly salt merchant, over 80 years old, traveled from Yangzhou to Nanjing specifically to admire the great president’s portrait. Upon seeing [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$)]’s image, the old man suddenly dropped his cane and knelt, performing the old ritual of three kneels and nine kowtows in front of the portrait."
sino_event.200.f:0 "\"Old man, this is no longer the Qing Dynasty, it’s now the [concept_roc]!\"\n\"Has the emperor changed the title again?\"\n\"There is no emperor now, only [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$)].\"\n\"So it’s now His Excellency [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$)]\""
sino_event.200.a:0 "Stand up, no kneeling allowed."


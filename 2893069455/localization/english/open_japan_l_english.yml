china_navy:0 "Japanese Expeditionary Army Navy Commander"

sino_event.220.t:0 "Plan to Conquer Japan"
sino_event.220.d:0 "Troop Deployment:\n#red Army:#! North Route Army from Fengtian New Army, South Route Army from Shandong and Huai Army veterans, Reserve Forces.\n#blue Navy:#! Incheon Fleet, Seoul Fleet, Fengtian Fleet"
sino_event.220.f:0 "[SCOPE.sCountry('jap_scope').GetName] poses a direct threat to our Northeast and Yellow Sea defense. The core policy is ‘use land to control the sea, slowly breaking the deadlock,’ aiming to leverage our land advantages to counter Japan’s naval power, by controlling the Korean Peninsula and squeezing Japan’s strategic space. This strategy combines the opinions of veteran generals from the Xiang and Huai armies with the tactics of German military manuals."
sino_event.220.a:0 "Prioritize land-based attacks and appoint [SCOPE.sCharacter('army_soldier').GetFullName] as Army Commander for the Japanese Expeditionary Forces."
sino_event.220.b:0 "Prioritize naval attacks and appoint [SCOPE.sCharacter('navy_soldier').GetFullName] as Navy Commander for the Japanese Expeditionary Forces."


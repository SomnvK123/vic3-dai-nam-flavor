je_protect_china:0 "The Great Anti-Japanese War"
je_protect_china_reason:0 "The land of China is sinking, the Japanese invaders are coming, and war is everywhere. From Liaoshen to Songhu, the land is scorched, and from the cities to the villages, the people suffer. However, the people of China, with their unyielding will, rise up. Farmers drop their plows to fight, merchants donate their wealth, and even children sing songs of resistance. The soldiers at the front line, braving snow and ice, never retreat. Their will is unbreakable, and their determination is fiery. The people of China will not let our land fall to the invaders. They will fight until the end, until our nation is revived!"

sino_event.221.t:0 "March to #yellow Tokyo#!"
sino_event.221.d:0 "First capture #yellow Nagasaki#!, then conquer #yellow Osaka#!, and soon our troops will be at the gates of #yellow Tokyo#!. The flag of Japan on the city walls shakes as our iron cavalry march along the Suzaku Avenue, their hooves resounding across the foothills of Mount Fuji."
sino_event.221.f:0 "Once the Japanese pirates ravaged our seas, but now our horses march through their capital. The embassy was burned, and now we fly our flag in Ginza. The cherry blossoms of Edo are stained with the tears of the defeated; the steps of the Emperor’s palace bear the marks of the victors. This is not slaughter, this is retribution.\n\nRetribution for the corpses of Lushun from the First Sino-Japanese War, for the smoke of the embassies in 1900, for the blood written in the unequal treaties."
sino_event.221.a:0 "March through #yellow Kyoto#!, march through #yellow Edo#!"

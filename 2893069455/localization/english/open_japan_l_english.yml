sino_event.187.t: "Convene the 'Nine-Power Treaty'"
sino_event.187.d: "The unfinished business from the Paris Peace Conference must be concluded in [SCOPE.sState('beautiful_state').GetName]. Nine nations — the U.S., U.K., France, Japan, Italy, China, Belgium, Netherlands, and Portugal — will meet, with only one topic: how to establish order in the turbulent Far East."
sino_event.187.f: "Cigar smoke fills the meeting room, swirling around the nations' agendas. Everyone wants a piece of China, yet no one wants another to dominate: especially [SCOPE.sCountry('western_country').GetName], whose actions in Shandong have already made European [concept_great_power] uneasy."
sino_event.187.a: "[ROOT.GetCountry.GetName] will serve as the #v host country#! for the upcoming international conference."

sino_event.188.t: "The 'Nine-Power Treaty': Open Door"
sino_event.188.d: "The 'Nine-Power Treaty' conference, organized by [SCOPE.sCountry('great_country').GetName], was a success, and the principle of 'Open Door, Equal Opportunity' has been settled. From now on, all nations must share the rights to ports, commerce, and tariff agreements in China. No one can claim a sphere of influence exclusively."
sino_event.188.f: "European [concept_great_power] are pleased, as this principle protects their vested interests; [SCOPE.sCountry('western_country').GetName], although unwilling, is forced to retract its claws for now. However, the 'Open Door' is not a door China controls."
sino_event.188.a: "Nominal equality is still better than being eaten alive by one nation."

sino_event.189.t: "The 'Nine-Power Treaty': Dominance"
sino_event.189.d: "The treaty has become a dead letter: [SCOPE.sCountry('western_country').GetName], citing 'special interests,' refuses to relinquish its privileges in Manchuria and Mongolia, warships continue to patrol the Yangtze River, and trading companies monopolize mining in the Northeast, effectively becoming a 'special presence' in the Far East."
sino_event.189.f: "Although European [concept_great_power] are dissatisfied, each has its own agenda and does not wish to confront [SCOPE.sCountry('western_country').GetName] over the Far East. Yet, another 'rule-maker' walks across Chinese soil."
sino_event.189.a: "A weak nation has no diplomacy."

sino_event.190.a: "We, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName], also attended this conference."


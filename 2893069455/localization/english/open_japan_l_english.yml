sino_event.236.t:0 "[SCOPE.sState('han_state').GetName] Massacre"
sino_event.236.d:0 "[SCOPE.sCharacter('empire_character').GetFullName],[SCOPE.sCharacter('fascist_character').GetFullName] have allowed their soldiers to run rampant in [SCOPE.sState('han_state').GetName]"
sino_event.236.f:0 "After the Japanese army entered the city, they burned, killed, and looted without restraint. They carried out a savage massacre against unarmed civilians and soldiers who had surrendered, using extremely brutal methods. Some used machine guns to mow down people, others stabbed with bayonets, or set fires, and even held murder contests for entertainment. The streets were littered with corpses, and the Qinhuai River was filled with floating bodies. The entire [SCOPE.sState('han_state').GetName] became a bloody hell on earth.\n\nIn addition to the carnage, the Japanese army also carried out mass rapes and abuses of women in [SCOPE.sState('han_state').GetName]. Meanwhile, they pillaged and destroyed everything they could, robbing shops, burning ancient buildings, and turning countless precious artifacts and cultural heritage into ashes. This city, with its long history and cultural significance, has suffered an unprecedented catastrophe."
sino_event.236.a:0 "Every Japanese hand is stained with blood."


notification_wuchen_war_name: "From #yellow Kyoto#! to #yellow Edo#!, from #yellow Northeast#! to #yellow Hokkaido#!, the flames of war engulf the islands. The anti-shogunate armies led by the Satsuma and Choshu clans clash with the shogunate forces in a nationwide battle, ending the Tokugawa’s three-hundred-year reign."
notification_wuchen_war_desc: "The Japanese Civil War — Boshin War."


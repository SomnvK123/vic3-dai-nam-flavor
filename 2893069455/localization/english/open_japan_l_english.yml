conquer_india_button_fin: "We have chosen to #v Implement National Policy#!"

je_china_imperial_palace: "China's Imperial Treasures"
je_china_imperial_palace_reason: "#bold The Hall of Supreme Harmony#!'s gilded copper cranes face south. The gold leaf on their wings has been worn by three centuries of wind and rain but still shines in the sunlight, much like the carvings of ocean waves on their pedestal, etched by artisans during the Yongle era. Each groove has been touched by the soil of the Forbidden City’s first foundation. ​\n\nInside the Hall of Mental Cultivation#!, a purple sandalwood cabinet holds a sky-blue glazed brush washer. In the Treasure Pavilion, the 'Empress's Jewel' jade seal has a barely visible crack on the jade knob. It was damaged by #yellow Emperor Daoguang#! during the Opium War, with jade shards splattering onto the dragon's eye, like mist shrouding the divine beast. Later, the jade seal was used by #yellow Empress Dowager Cixi#! for 37 years. Every time she stamped it, she paused briefly at the crack, her nails scraping the cold jade, like brushing over the harsh clauses of the #n Treaty of Nanking#!.\n\nThese treasures do not speak. But as dusk falls over the corner tower, if you press your ear against the gold bricks of the Hall of Supreme Harmony#!, you may hear the lingering sandalwood incense in the Xuande furnace still breathing. If you whisper to the copper cranes of the Qianqing Palace#!, the gold leaf on their wings will flutter gently, shaking the moonlight of three hundred years ago, and scattering it onto your open palm.\n$TOOLTIP_DELIMITER$\n#v They have witnessed the grandest celebrations and the most frantic escapes; the coronation of a new emperor, and the white silk of a palace maid's suicide. Now, they stand silently in time, like watchful sentinels, guarding the faded era names, preserving the memories etched in wood grain, glaze color, and bronze rust, those memories that have never truly gone."

imperial_palace_modifier: "Artistic Treasures"
je_china_imperial_palace_goal: "#o China's Imperial Treasures#! stolen 3 times"
sino_event.179.t: "The Imperial Treasures Were Stolen"
sino_event.179.d: "The treasures located in [SCOPE.sState('controller_scope').GetName] were stolen by [SCOPE.sCountry('western_country').GetName]."
sino_event.179.f: "“One day, two thieves from Europe broke into the Old Summer Palace. One thief looted the valuables, while the other set fires. After victory, it seemed they could freely steal. They plundered the palace on a large scale, with the spoils divided between the two victors. One victor filled his pockets with visible treasures, while the other packed them into chests. They walked hand in hand, laughing, as they returned to Europe. This is the story of these two thieves. 'We Europeans are civilized people, and the Chinese are barbarians in our eyes. This is what civilization does to barbarism.' In history, these two thieves are named France and England.” — Victor Hugo"
sino_event.179.a: "Grief beyond words."

sino_event.69.t: "Recovering Cultural Relics Left Abroad"
sino_event.69.d: "Who can forget you, the treasures left behind overseas?"
sino_event.69.f: "Upon initial inventory, more than 1.17 million cultural relics left from the Qing Dynasty court were cataloged, including bronze vessels from the Three Dynasties, ancient jade artifacts, famous calligraphy and paintings from the Tang, Song, Yuan, and Ming Dynasties, Song and Yuan ceramics, enamelware, lacquerware, gold and silver items, bamboo, wood, ivory, and bronze religious sculptures, as well as a large number of imperial and royal consort clothing, fabrics, and furniture. A veritable treasure trove of gold, jewels, and unique curios. In addition, there were large volumes of books, records, and archives."
sino_event.69.a: "Who can bring you back, my beloved homeland that I long for day and night?"

je_gugong_shiyi: "Escape from the British Museum"
je_gugong_shiyi_goal: "Six batches of treasures were returned."
je_gugong_shiyi_reason: "The Forbidden City is vast and magnificent. However, throughout the long reign of the Ming and Qing dynasties, thefts continually occurred within the palace. Some are too distant to trace, but the last emperor of the Qing Dynasty provided clear records on the matter. The emperor stated that, as far as he knew, palace eunuchs had been stealing almost continuously. On the day of his wedding, after the ceremony, the pearls, jewels, and jade from the empress's phoenix crown were entirely replaced with counterfeit items. The previous emperor had heard from the craftsmen that the treasures of the Qing court were already famous worldwide. He believed the inner palace should be reformed, the treasury counted, and thefts prohibited. However, before the plan could be implemented, the palace, which housed countless treasures, was suddenly set on fire. The fire raged through the night, and the buildings of the palace were reduced to ashes, along with countless treasures and books. According to palace historians, it is estimated that over 300,000 imperial treasures were lost since the First Opium War."

sino_event.73.t: "Treasures Returning Home"
sino_event.73.d: "It is the breath of the bronze vessels that once touched the soil of Zhouyuan, the ancient paintings capturing the misty rain of Jiangnan, the Buddhist heads whispering in the long-lost accents of home."
sino_event.73.f: "These returning treasures carry double time. The green patina of the bronze contains both the copper green of the Western Zhou and the rust of a display case in the New York Museum; the folds of ancient paintings hold the dampness of the Song Dynasty and the coal smoke of Parisian apartments. But when they return to their homeland, all foreign marks slowly fade away, just as the missing ear of the bronze vessel this spring grew a pine tree, with roots following the lines of the bronze, as if trying to stitch those broken times into complete annual rings."

sino_event.73.a: "We can display these treasures at the Forbidden City Museum for the people to visit."
sino_event.73.b: "We can place these treasures in the Forbidden City."


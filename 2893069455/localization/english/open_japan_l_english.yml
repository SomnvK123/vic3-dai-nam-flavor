alliance_with_japan_button:0 "Join the Greater East Asia Co-Prosperity Sphere"
alliance_with_japan_button_desc:0 "We wish to establish a new order in East Asia, unify the nations, and bask in the Emperor's grace. Assist Japan in overcoming obstacles and create a grand, eternal achievement. This is the way of 'co-prosperity'."


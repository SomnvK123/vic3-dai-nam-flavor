sino_event.201.t:0 "Mongolian Independence"
sino_event.201.d:0 "#yellow Zhabu Zundamba#! ascends to the throne as emperor, calling himself 'Emperor of Sunlight' with the reign name 'Gongdai'"
sino_event.201.f:0 "The feudal lords, both monks and laymen, of Outer Mongolia, long supported and instigated by Russia, held a secret meeting in the city of Kuren, where they decided to split [concept_dsk_china][concept_roc] and declare [SCOPE.sCountry('mgl_scope').GetName]'s 'independence'. They sent a delegation, led by Hangdadolji and Lama Che Linqi Mit, to St. Petersburg, requesting Russian protection.\n\nThe Khalkha Mongols declared that they would 'protect all their lands and establish the Great Mongolian Empire, electing Zhabu Zundamba as [Concept('concept_ruler','$RULER_TITLE_EMPEROR$)].'"
sino_event.201.a:0 "Damn it"

sino_event.202.t:0 "Tibetan Independence"
sino_event.202.d:0 "[SCOPE.sCountry('tib_scope').GetName] announces the expulsion of Han Chinese officials from Tibet, with supporters of the Han lama and some Gaxia government officials being killed."
sino_event.202.f:0 "On October 13, 1913, a meeting was held in Shimla, India, with representatives from the 13th Dalai Lama, British Indian government official Henry McMahon, and [ROOT.GetCountry.GetAdjectiveNoFlag]’s Tibetan pacification envoy Chen Yifan. During this meeting, Xazha Banjue Doyi put forward six demands. These included: (1) Tibet's independence, invalidating the 1906 Sino-British treaty signed in Beijing; (2) Establishing the boundary between China and Tibet, which should include all of Qinghai and parts of Sichuan; (3) Amending the 1893 and 1908 Tibetan-British trade agreements, without Chinese interference; (4) China is forbidden from sending personnel to Tibet, and Chinese merchants must not be issued Tibetan passports to enter."
sino_event.202.a:0 "Damn it"


sino_event.206.t:0 "Fear among the Minorities"
sino_event.206.d:0 "The outbreak of the Xinhai Revolution has caused fear among the upper echelons of Tibetans and Mongols, who now seek foreign intervention to pursue independence. They wish to take advantage of the revolutionary chaos to break free from our control."
sino_event.206.f:0 "In non-Han regions, unrest and riots occur, with poorly disciplined Tibetan troops also experiencing internal conflicts, creating further disorder. By the end of 1912, all Qing officials and troops had left Tibet, marking the first expulsion of Han Chinese from the region. Afterwards, the Beiyang government no longer had permanent officials in Tibet."
sino_event.206.a:0 "This is bad"


china_borders.4.t:0 "The Four Seas United"
china_borders.4.d:0 "The sea moon shares the same sky, and the sound of the tide is heard together."
china_borders.4.f:0 "Ah! The 'Strike First to Conquer the Sun' was not for the vastness of land but to prevent wolves from ravaging again. The 'Four Seas United' is not to flaunt military prowess, but to seek peace for the four seas. Standing tall, looking far, the waves of the world are calm, and the smoke of the nine provinces rises in peace. Know that after war, there must be prosperity. This is not the work of one man, but the effort of a united people."
china_borders.4.a:0 "Once enemies, now one family."

je_a_conquer_japan_tt:0 "#v #red Until the last Japs is slain#!"
sino_event.10.t:0 "Desperate Alliance"
sino_event.10.d:0 "We should no longer dwell on the grudges of the past. Now, [SCOPE.sCountry('chi_scope').GetAdjective] and [SCOPE.sCountry('jap_scope').GetAdjective] stand together, having established an equal relationship. Our friendship is deeper than ever before."
sino_event.10.f:0 "China and Japan, for over 2000 years, have shared the same written language, spoken tongue, and ethical values. As neighboring countries, we have long been connected, with a shared cultural spirit in the East. While there may have been past conflicts, time has passed, and today we seek to form an alliance for peace and mutual development!"
sino_event.10.a:0 "May China and Japan, as brothers, join hands and walk towards the future, creating a glorious era together."

je_china_japan_tao: "[concept_battle_of_east_asia]: Made in China"
je_china_japan_tao_reason: "The Tang Dao is the pinnacle of Chinese blades. Its form, like the flowing light of the sunset, resembles the cold moon freezing the frost. Its patterns, like the stars scattered across the sky, and the hilt, like a bright pearl, are stunning. But more than its beauty, its sharpness is capable of piercing three layers of armor, cutting through nine-ring swords. Even ordinary soldiers wielding it can defeat generals, capture flags, break formations, and destroy strongholds. It is not merely ornamental; it is a weapon to defend the nation.\n\nAt that time, the Tang Dynasty's reputation spread across the world, and the art of blade making gathered the essence of the universe. Craftsmen in the Western Regions marveled at its craft, Persian artisans admired its durability, and it was especially cherished by the islands of the East. Nobles in that country would be proud to possess a Tang Dao, treating it like a sacred artifact. When wearing it, their faces would glow with satisfaction; when storing it, the room would be filled with incense. The Emperor, seeing it, would sigh and say: 'The craftsmanship of China is unparalleled! This blade shows the greatness of China, not just empty words.' He then sent emissaries across the sea, offering tribute piled high, all to exchange for one blade. On their return journey, encountering stormy seas, the emissaries clutched the blade and cried, saying, 'I would rather die and be buried in the belly of a fish than let this blade sink!' Such is its weight.\n\nAlas! A single blade carries the wisdom of China and the spirit of the Han and Tang dynasties. One can see through its crafting that ‘perfection’ is not achieved in one day; one can understand from its international acclaim that ‘power’ comes from true strength. Even today, ancient tombs in the East occasionally reveal Tang swords, rusted but still carrying the righteous spirit of a thousand years ago, as though the horns of Chang'an can still be heard, echoing through the blade’s reflection in the sun and moon."

je_china_japan_tea: "[concept_battle_of_east_asia]: Maritime Trade"
je_china_japan_tea_reason: "Chinese tea originated with Emperor Shen Nong, flourished in the Tang dynasty, and reached its peak in the Song dynasty, enduring for thousands of years, living as long as the mountains and rivers. The varieties are as numerous as the stars in the sky: green tea as clear as jade, red tea as bright as the sunrise, white tea as pure as frost, and black tea as smooth as jade.\n\nForeign lands, upon encountering it, were captivated. The Japanese sent envoys to Tang China, returning with tea seeds, planting them in Uji, and thus creating the ‘peaceful and elegant’ ‘Eastern Divine Leaf,’ with afternoon tea customs originating here. Persian merchants, braving wind and sand, crossing stormy seas, sought to trade for a basket of fresh tea, returning home to boast, 'This is the Heavenly Dew; drinking it will make one forget worldly troubles.' Its value is thus seen, as it carries the essence of China’s mountains and rivers, wrapped in the graceful spirit of the East.\n\nLet the world know: China not only holds the grandeur of military might but also the gentleness of a cup of tea. Both coexist, forming the complete spirit of the nine provinces."

je_china_japan_kor: "[concept_battle_of_east_asia]: Korean Province Setup"

je_china_japan_kor_reason: "This is #v [concept_china_japan_tt]#! [concept_journal_entry]\n$TOOLTIP_DELIMITER$\nWhen the Ming Dynasty was founded, its cultural influence spread across the seas. The Emperor Zhu Yuanzhang established the Joseon Dynasty as a tributary state, on equal footing with the princely states. The Emperor donned ceremonial robes with twelve ranks, embodying the sun, moon, and stars; the King of Joseon adopted a nine-rank system, symbolizing respect. All diplomatic gifts and tokens were meant to signify the unity of China and its tributaries.\n\nWhile Joseon remained loyal to the Qing, their hearts still leaned toward the Ming. Many secretly kept the Chongzhen Calendar; others continued to honor the Ming Dynasty’s late Emperor in private. Scholars wrote books about the 'Loyal Subjects of the Ming Dynasty,' hidden away in secret rooms, claiming ‘though their garments were changed, their hearts remained unaltered.’ During the Qianlong period, an envoy entered the tombs of the Ming Emperors and cried at the Thirteen Tombs, where the guards apprehended him. The Qing Emperor sighed, saying, 'Their loyalty is to be respected.' Afterward, he pardoned him. Over three centuries, the shifting allegiances of Joseon were like a game of chess, but the ties of culture and ceremony remained intact. The old records of Joseon, with their references to both Ming and Qing principles, are like mountains of evidence. The traditions of China’s celestial order are clear like the stars, not just a memory of a tributary state but a testament to the enduring influence of Chinese culture.\n\n#v Our nation and Joseon share the same heart, the same culture, and the same people#!"


je_jap_empire:0 "Imperial Parliament"
je_jap_empire_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] Constitution established, the Imperial Parliament should be established accordingly. Its authority is divided into legislative, fiscal, general state affairs, and parliamentary internal affairs, but the right to review remains under the sovereignty of [concept_japanese_emperor], the supreme power of [concept_japanese_emperor], and the royal family’s self-discipline rights, not to be exceeded. Therefore, [concept_japanese_emperor] is supreme, holding power firmly, and the parliament must follow its leadership.\nHowever, conflicts are inevitable within the parliament. Some members hold conservative views and defend tradition, while others are inclined towards reform and want change. Discussions often lead to a standstill.\n#yellow The Imperial Parliament#! may, at specific moments, trigger the following #v #tooltippable;tooltip:[Country.GetTooltipTag],je_jap_pos historical event#!#!, which might influence the direction of national politics."
je_jap_pos: "1. The Imperial Parliament is convened on schedule (#yellow every five years, up to 5 times). \n2. Colleagues of [GetIdeology('ideology_humanitarian_royalist').GetName].\n3. Colleagues of [GetIdeology('ideology_meiji').GetName].\n4. Colleagues of [GetIdeology('ideology_dazheng').GetName]"


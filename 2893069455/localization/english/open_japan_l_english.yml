sino_event.180.t: "[SCOPE.sCountry('rus_scope').GetName]'s [Concept('concept_ruler', '$RULER_TITLE_TSAR$')] [SCOPE.sCharacter('crisis_scope_2').GetFirstName] demands we cede Outer Northwest and other territories."
sino_event.180.d: "#v With the unrest in the Hui Muslim rebellion and the turmoil in Xinjiang, your country's western frontier is still in a state of uncertainty#!"
sino_event.180.f: "From the boundary at Shabin Daba, heading west and then south along the Sayin Mountains, to the westernmost part of the Tannu-Ora, turning southwest along the Sailyugum Mountains, to the Kuitun, then moving westward along the Dala-Altai Mountains. To the north of Zaisang Nol, between the two rivers, turning southwest along the mountain and straight to the northern boundary of Zaisang Nol at the Chaqilemos River; then southeast along the river, following the Karalach River banks, to the boundary at Manetugatu and Kalun.\n\nThis boundary between the two nations is defined by water flow: to the east and south, the water flows to Chinese territory; to the west and north, the water flows to Russian territory."
sino_event.180.a: "Due to the ongoing unrest in the Hui rebellion, military forces are temporarily stationed to recover the territory. Once the internal situation is cleared and the cities of Ürümqi and Manas are secured, the territory will be returned."
sino_event.180.b: "A great shame, the loss of power and national dignity."


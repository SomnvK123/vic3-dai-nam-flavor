je_china_natural_borders:0 "China's Greatest Territorial Extent"
je_china_natural_borders_reason:0 "The Chinese people, originating from Yan and Huang, have endured for five millennia. The reason why the Chinese nations are united is not just by bloodline but by the land itself. From the ancient Three Dynasties to the Qin and Han expansion, the Sui and Tang unity, the Song and Yuan legacy, and the Ming and Qing stabilization, our ancestors have labored with sweat and blood to defend and cultivate the land.\n\nLooking at the vast northern desert winds, they still carry the flags of Wei and Huo; the rainstorms of Lingnan still leave traces of the Fubo ship. The snow-capped Kunlun mountains reflect the footsteps of Han and Tang envoys traveling west; the eastern sea’s waves carry the image of Zheng He’s treasure ships setting sail. These are not lands granted by Heaven, but the fruits of a hundred generations of heroes who fought and sacrificed their lives to defend them.\n\nOnce, when King Chu asked about the power of the tripods, Wang Sun answered, 'It is virtue, not the tripod, that matters.' And where virtue is bound, it must be through the land as a domain. Without a piece of land, how can we gather the people and cultivate customs and music? Without fixed borders, how can we distinguish the Chinese from the barbarians or establish proper rules?\n\nThe territorial borders of past dynasties are not the private property of one family or person; they are the very lifeblood of the people. The lands we are responsible for represent the central administration of all dynasties, cultivated by the people, and the places where the Confucian temple music played. Now, as we inherit this legacy, if we abandon a single inch of our ancestors’ land, we forget the labor of Yu the Great in regulating the rivers, the suffering of Meng Tian in building the frontier fortifications, the resolve of Zheng Chenggong in recovering Taiwan, and the loyalty of Zuo Zongtang in protecting the borders. The mountains and rivers have a soul and would cry out in agony: Why have you abandoned us to outsiders? The spirits of our ancestors would lament: Why have you shattered the work we built?\n\nTerritory is not just the ink on a map, it is the totem of our national spirit. Rivers are the soul of our people; mountains are the bones of our nation. To hold the land is not to greedily expand, but to protect the faith of our ancestors, to ensure the safety of our people, and to continue the legacy of civilization. This is not merely a legal matter, but a divine and moral obligation."
qing_imperial_parliament_modifier:0 "Qing Imperial Parliament Session"
dongyabingfu_modifier:0 "Sick Man of East Asia"
dongyasun:0 "Expel the Sun"
je_Qing_Imperial_Parliament: "[concept_dsk_china] Qing Imperial Parliament Session"
je_Qing_Imperial_Parliament_reason: "According to our current system, #yellow Imperial Parliament#!’s #v parliamentary reform progress#! will #tooltippable;tooltip:[Country.GetTooltipTag],je_Parlamento_Italian_pos #o accumulate#!#! and #tooltippable;tooltip:[Country.GetTooltipTag],je_Parlamento_Italian_neg #n regress#!#! #v We can consume progress to enact a policy#!\n$TOOLTIP_DELIMITER$\nThe Imperial Parliament humbly presents: To address the current crisis and plan for the nation’s future, we seek the Emperor’s guidance.\n\nWe believe that our Qing Dynasty has governed the Central Plains for over 260 years, with our ancestors ruling through benevolence and filial piety, influencing people with virtue, and spreading divine favor throughout the Four Seas. However, in recent years, Western influence has spread, maritime borders have faced issues, the people's livelihoods are in decline, and the nation’s power is in peril. As members of the Parliament, we witness this crisis and are deeply concerned, and we offer our humble views.\n\nAfter reviewing the laws established by our ancestors and integrating Western principles, this is the essence of constitutional government. However, the constitution is still in its infancy, and the governance framework has not yet fully materialized. Many officials are corrupt, and the management of civil affairs remains unsatisfactory. In local governments, there are officials who exploit the people for personal gain; in the central ministries, there are bureaucrats who procrastinate and cause harm to public interests. The people's grievances accumulate without reaching the top, while the national treasury is empty and foreign threats loom. We believe that swift reforms are necessary to reorganize the official system, clarify responsibilities, and promote capable officials while removing the unworthy to advance state governance.\n\nThe people are the foundation of the nation. Recently, floods and droughts have caused widespread suffering, with hungry citizens fleeing in despair. Meanwhile, taxes are exorbitant, forced labor is excessive, and farmers cannot farm, while merchants cannot do business. We propose to instruct provincial governors to quickly assist disaster victims, reduce taxes, repair waterworks, and encourage agricultural practices. We should also establish more industrial schools to teach the people skills, ensuring that the unemployed find work and those who work are satisfied, so that the people's livelihood can be improved."


complete_national_reunification_finish:0 "If we acquire new provinces, and the proportion of [SCOPE.sCulture('chinese_culture').GetName] in the population exceeds 10%, this province will automatically possess [SCOPE.sCulture('chinese_culture').GetName][concept_homeland], and the people there will gradually assimilate into [SCOPE.sCulture('chinese_culture').GetName]."
chinese_culture_modifier:0 "Great Unity of the People"

five_races_china_win_tt:0 "The perfect outcome of this [concept_journal_entry] is for the entire nation’s people to be [concept_assimilation] into [SCOPE.sCulture('chinese_culture').GetName] and generate [SCOPE.sCulture('chinese_culture').GetName][concept_homeland]"

je_five_races_china:0 "Five Races Republic"

je_five_races_china_reason:0 "China, viewed both from ancient and modern perspectives, is not defined by ethnic lines but by the cultural continuum. Thus, we say: those who join the Han are Han; those who join the barbarians are barbarians. The Han and the barbarians flow into each other; their origins are all tied to the civilizational thread of China, like stars orbiting the North Star, like rivers flowing into the East Sea.\n\nThe people of [SCOPE.GetRootScope.GetCountry.GetName] believe that the Han, Manchu, Mongol, Hui, and Tibetan peoples form the foundation of [concept_dsk_china]. When united as one, national identity is born. The five races should harmonize as hands and feet, as bones and muscles, forming a single, cohesive body. We must promote our culture so that it shines outwards and attracts the many nations through attraction, not coercion. In this way, the races will gradually merge, like Mount Tai growing higher with accumulated soil, like rivers converging to become wider.\n\nUltimately, the territory of [SCOPE.GetRootScope.GetCountry.GetName] will have no boundaries, nor any limits. Wherever culture spreads, that is our land; wherever the people's hearts are, that is our frontier."

sino_event.66.t: "Bandits and Thieves"
sino_event.66.d: "Our nation is one of the most plagued by banditry in the world, and the people are deeply resentful of this issue."
sino_event.66.f: "[concept_roc] period is one of great chaos, with warlords fighting amongst themselves and the people suffering. Many were forced or chose to become bandits, living by robbery and kidnapping, bringing endless disaster to the people. It’s reported that at the peak of banditry in the Republic era, there were 20 million bandits, 5% of the national population."
sino_event.66.a: "I have the courage to suppress the bandits, and it is great!"

sino_event.67.t: "Success in Suppressing Bandits"
sino_event.67.d: "The bandit suppression campaign progresses smoothly."
sino_event.67.f: "The public supports the police in this effort. After over two years, the bandits were wiped out, and some surrendered. The longest and most severe period of banditry in history has been brought to an end, thanks to the efforts of the police. Only a few remnants remain, with no place to hide during the anti-bandit operations."
sino_event.67.a: "Thanks to the brave police!"
sino_event.67.b: "Thanks to the loyal people!"


je_rki:0 "[concept_battle_of_east_asia]: Ryukyu Restoration"
je_rki_reason:0 "Since the Satsuma invasion in 1609, Ryukyu's sovereignty has remained ambiguous, primarily due to tribute trade and maintaining balance. However, as tensions rise between our nation and [SCOPE.sCountry('jap_scope').GetName], the long-unresolved Ryukyu issue has resurfaced. As a key maritime trade hub and fleet anchorage, a restored Ryukyu state will counter [SCOPE.sCountry('jap_scope').GetAdjective] ambitions in East Asia, while reaffirming our commitment to safeguarding tributary states. Traditionalists view this as a reaffirmation of the [concept_dsk_china] order, while radical modernists see it as a potential expansion of influence. Regardless, for the future of both [SCOPE.sCulture('chinese_culture').GetName] and [SCOPE.sCulture('Ryukyu_culture').GetName], [SCOPE.sCountry('jap_scope').GetAdjective] ambitions must be halted here..."

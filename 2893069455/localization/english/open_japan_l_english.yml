je_japan_fascist_leading:0 "With the might of [concept_shenzhou], we will conquer these foolish barbarians, unify the world, and bring all nations together!"
je_japan_fascist_beginning:0 "To unify the world under one empire, with our capital as the center of this great empire."
je_japan_fascist_start:0 "Embark on the long journey of conquest, spreading the imperial way across the seas, laying the foundation for an eternal empire."
je_japan_fascist_always:0 "Always with the divine warrior spirit, continuing the work of our ancestors, expanding the territories and ensuring the foundation for future generations."


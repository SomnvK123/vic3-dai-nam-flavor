Protectorate_War_button:0 "Start the Protectorate War"
Protectorate_War_button_desc:0 "If [ROOT.GetCountry.GetRuler.GetFullName]’s tyranny is worse than the Qing Dynasty’s, why would we sacrifice the lives of millions to fulfill one person’s imperial ambition? Therefore, I swear to fight for the republic until my last breath."

yuan_choose_republic_tt:0 "[ROOT.GetCountry.GetRuler.GetFullName] has surrendered to the revolutionary army"
je_Protectorate_War:0 "Protectorate Movement"
je_Protectorate_War_reason:0 "Now Yuan (Shikai) has betrayed the previous agreement, restored imperial rule, dissolved the self-government association, and the people have no peace; dissolved the national assembly, and the state has no proper discussions; misused public funds and killed talented individuals, leading the country into a dangerous position; falsely imprisoned pro-democratic leaders, leaving many innocent people in jail. With these four issues, the nation is doomed! When the nation falls, the people become slaves, and only Yuan and a few corrupt officials may still enjoy wealth and power. Alas, how unfortunate are the people who entrust their nation's life to the Yuan family!\n\nSince Yuan became [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$)], the countryside is filled with starving people, and the capital remains in a state of disarray; the state is in constant turmoil, yet the imperial ceremonies have not been forgotten. Thousands of people cry, while one man sits crowned—does he still hold the word 'republic' in his heart? When he forgets the republic, he is no different from a national traitor.\n\nWe, who once made this colossal mistake in the name of great benevolence and righteousness, dare not avoid the hard truth. We swear to fight this national traitor to save our people."


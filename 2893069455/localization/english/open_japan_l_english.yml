revolutionary_martyrs_button_desc:0 "The spirit of the great revolutionary martyrs guides us forward."
revolutionary_martyrs_modifier:0 "The Spirit of Revolutionary Martyrs"

new_great_wall_button:0 "The New Great Wall"
new_great_wall_button_desc:0 "Let our flesh and blood build a new Great Wall."
new_great_wall_modifier:0 "The New Great Wall"

not_chinese:0 "The owner of this [concept_journal_entry] is not #red China#!"
sino_event.225.t:0 "Emperor Xianfeng's Health Declines"
sino_event.225.d:0 "Undercurrents surge inside and outside the temporary palace. Sushun and the other Eight Ministers clutch the power of imperial approval, while the Imperial Concubine Yi behind the curtain listens to the coughs, her eyes hiding unspoken words. This imperial body is tied to a tottering nation, the anxiety of all officials in the court, and a future whose direction remains unknown."
sino_event.225.f:0 "The smell of medicine from the Rehe Temporary Palace drifts past the vermilion-lacquered thresholds. Emperor Xianfeng lies on the dragon bed, his cheekbones high and sharp as if carved, each cough shaking the brocade quilt. Memorials pile up like a small mountain on the imperial desk; war reports about the Anglo-French Allied Forces still bear fresh ink marks, yet he can barely summon the strength to lift his hand to review them."
sino_event.225.a:0 "The late Emperor has passed away! A nation cannot be without a ruler for a single day, but who can take charge of this shattered land?"
sino_event.225.b:0 "Your Majesty, please preserve your dragon body! For the sake of our ancestors' legacy, for the people suffering in dire straits, you must hold on! This servant is willing to shorten my lifespan by ten years in exchange for Your Majesty's health!"


sino_event.226.t:0 "Emperor Tongzhi's Fatal Illness Persists"
sino_event.226.d:0 "Debates in the court are more intense than the smell of medicine: Prince Gong seeks to urge the Empress Dowager to fully return to power, while scholar-officials chant, 'A nation relies on a mature ruler.' Even common folks whisper that this imperial body恐怕 won't survive the winter."
sino_event.226.f:0 "Candles in the Hall of Mental Cultivation burn all night. Emperor Tongzhi lies on the couch, his face covered in red rashes. A high fever makes him rave—now shouting 'personal rule,' now muttering 'Old Summer Palace.' Imperial physicians kneel on the ground, changing bowls of medicinal soup after another, yet dare only write in the medical records, 'Evil qi has entered the body; recovery is unlikely.'"
sino_event.226.a:0 "Heaven grants no extra years! The nineteen-year-old Emperor has passed away! He ruled personally for less than two years."
sino_event.226.b:0 "Your Majesty, hold on a little longer! You're still young; the Qing's better days should lie ahead! Your servants are kneeling outside the palace gates, praying to the Bodhisattva, begging Him to keep you, even for one more day!"


sino_event.227.t:0 "Emperor Guangxu Is Terminally Ill"
sino_event.227.d:0 "People in the palace secretly prepare for the aftermath; the Imperial Household Department works through the night to make mourning clothes for the 'deceased emperor,' while preparations for the Empress Dowager's 'Longevity Celebration' continue."
sino_event.227.f:0 "Cold winds at Yingtai have blown for over a decade. Emperor Guangxu's coughs grow weaker, his body shriveling into a bag of bones. When imperial physicians come to check his pulse, Li Lianying always blocks them at the door, allowing only prescriptions to be passed through the window."
sino_event.227.a:0 "That emperor who sought reform and national strength ultimately couldn't survive this winter!"
sino_event.227.b:0 "Your Majesty, try a little harder! Remember you said you wanted to build railways and train new armies? Those things aren't done yet—how can you leave? This servant will warm your feet; Yingtai is too cold. Let's return to the Forbidden City..."


sino_event.228.t:0 "Establishment of Zaichun as Crown Prince"
sino_event.228.d:0 "On his sickbed, Emperor Xianfeng points to Zaichun. The six-year-old child, unaware of the weight of the words 'crown prince,' only clutches Xianfeng's robe corner, looking up timidly. The Eight Regent Ministers kneel, holding the golden certificate."
sino_event.228.f:0 "Inside and outside the red walls, everyone calculates the stakes: with a young ruler ascending the throne, there will inevitably be a power struggle between 'the Empress Dowager ruling from behind the curtain' and 'ministers assisting in governance.' Some say this 'stabilizes the nation's foundation,' others secretly sigh over 'a young ruler and a doubtful nation.' But the vermilion seal on the golden certificate is already stamped—the child's fate is bound to this sadness dynasty from this moment."
sino_event.228.a:0 "Your subjects kowtow in gratitude for the heavenly grace! We are willing to assist the crown prince with our lives!"
sino_event.228.b:0 "Your Majesty, think again! The crown prince is too young. Foreign barbarians circle outside, and partisan undercurrents swirl within. Establishing a heir at this time risks unexpected changes!"


sino_event.229.t:0 "Establishment of Zaitian as Crown Prince"
sino_event.229.d:0 "Shortly after Emperor Tongzhi's passing, when Empress Dowager Cixi read out the name 'Zaitian' from behind the curtain, all officials in the court froze. This four-year-old child, nephew to Xianfeng, is in terms of seniority Tongzhi's cousin—only by being adopted as the late emperor's son can he take the position of crown prince."
sino_event.229.f:0 "This decree hides the Empress Dowager's scheme: with a young ruler ascending the throne, her 'ruling from behind the curtain' gains legitimate grounds. Though Prince Gong harbors dissatisfaction, he can find no fault in ritual law. Candlelight in the court reflects the faces of all present—half compliance, half worry—that curtain in the Forbidden City will likely cover things for many more years."
sino_event.229.a:0 "Your subjects obey the decree! Though the crown prince is young, he is destined by heaven!"
sino_event.229.b:0 "Empress Dowager, think again! A nephew succeeding an uncle violates ritual law!"


sino_event.230.t:0 "Establishment of Puyi as Xuantong Crown Prince"
sino_event.230.d:0 "As Emperor Guangxu lay dying, Zaifeng held the three-year-old Puyi, kneeling before the dragon bed. The child, frightened, cried loudly, clinging to the dragon robe's corner and refusing to let go. The Empress Dowager's decree soon arrived: 'Let Zaifeng's son Puyi succeed to the throne; Zaifeng shall be Regent.'"
sino_event.230.f:0 "News spread, and discussions erupted everywhere: 'Another child emperor—how long can the Qing last?' Revolutionary party leaflets circulate secretly; foreign newspapers headline 'China's Dusk.' Yet ceremonies in the Hall of Supreme Harmony continue, as if a single vermilion stroke can stabilize the nation's foundation."
sino_event.230.a:0 "Your subjects obey the decree! We are willing to assist the Regent and crown prince in safeguarding our ancestors' legacy!"
sino_event.230.b:0 "Empress Dowager, think again! With the nation's fortune trembling like this, establishing another young ruler will likely fulfill the 'heavenly cycle'!"

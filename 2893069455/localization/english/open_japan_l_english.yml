protect_homeland_modifier:0 "Protect the Homeland"

sino_event.214.t:0 "Experience in Production Reform"
sino_event.214.d:0 "[SCOPE.sCountry('jap_scope').GetName]’s victory is seen as a direct result of the ‘Meiji Restoration’—through learning from Western systems and technologies, Japan modernized in just a few decades. This made the government and scholar-officials realize: to save the nation, we must learn from Japan’s reform experience."
sino_event.214.f:0 "Unlike the West, Japan and China share ‘same culture and race’ (similar language and culture), and Japan’s reform path is more ‘replicable’ (both are East Asian countries facing similar challenges with Western influences). Therefore, the government believes: learning from Japan is the fastest way to master Western civilization, as Japan has already ‘localized’ Western systems and technology, and China can directly apply this experience without starting from scratch."
sino_event.214.a:0 "Valuable Reform Experience"
sino_event.215.t:0 "Experience in Social System Reform"
sino_event.216.t:0 "Experience in Military Reform"

sino_event.217.t:0 "May the Morning Sun Always Shine on Our Land"
sino_event.217.d:0 "We advocate for revolution, aiming to overthrow the Qing Dynasty and establish a new nation, sooner or later, success is inevitable. Every nation in the world has a national flag as a symbol of their state. As the uprising approaches, we must plan for this, replacing the Qing's #yellow Yellow Dragon Flag# with the #blue Blue Sky, White Sun#."
sino_event.217.f:0 "“The goal is to awaken the yellow soul and restore the Han people. But how can we tolerate corrupt officials, rotten gentry, and weak scholars who have no shame? They serve our enemies. They don’t speak of the deep kindness of this dynasty, but of our disgrace. How can we forget that the Manchus, a barbarian race from the northeast, entered [ROOT.GetCountry.GetAdjectiveNoFlag], seized our land, killed our ancestors, and enslaved our children? History is filled with massacres—Yangzhou's ten-day slaughter, the three-day massacre in Jiading, and the bloodshed in Guangdong. Do we call this kindness?” — Lu Haodong"
sino_event.217.a:0 "We can kill them, but those who rise after us cannot all be killed."

white_sun_modifier:0 "May the Morning Sun Always Shine on Our Land"

sino_event.218.t:0 "Xingzhonghui: Revitalize [concept_dsk_china]"
sino_event.218.d:0 "We advocate for revolution, expelling the barbarians, restoring [ROOT.GetCountry.GetAdjectiveNoFlag], and establishing a federal government."
sino_event.218.f:0 "“[ROOT.GetCountry.GetAdjectiveNoFlag] has grown weak to the point of no return! The rulers are complacent, the people are ignorant. Our great nation is not respected among the countries; we are looked down upon by foreign tribes. Can’t the patriotic people feel the pain? With 400 million people and abundant land, we could have become the most powerful nation in the world, but due to poor governance, corruption, and internal strife, the government sells titles and positions, bribes are rampant, and the officials exploit the people. Bandits roam the land, famine and pestilence strike, and the people suffer. Now, strong neighbors surround us, coveting our wealth and resources. They’re eating us alive, dividing our land. This is our urgent crisis!” — Sun Yat-sen"
sino_event.218.a:0 "If you want a revolution, it must be now, or we will have no future."

b_white_sun_modifier:0 "Revitalize China"

sino_event.219.t:0 "Tongmenghui: Establish a Bourgeois Parliamentary Republic"
sino_event.219.d:0 "We advocate for revolution, expelling the barbarians, restoring [concept_dsk_china], founding the Republic, and equalizing land ownership."
sino_event.219.f:0 "“This year, the commander of the Chinese Nationalist Army, under the orders of the Military Government, will announce the goal of driving out the barbarians. Manchuria, once a border threat, is now an enemy, and it must be dealt with. For over two hundred years, the Han people have been enslaved. The Manchu government has been cruel. If any Manchu soldiers or collaborators surrender, they may be spared, but those who resist will be killed without mercy. The traitors must be dealt with!” — Sun Yat-sen"
sino_event.219.a:0 "Anyone who dares to restore the imperial system will be opposed by all."

c_white_sun_modifier:0 "Establish the Republic, Equalize Land Ownership"


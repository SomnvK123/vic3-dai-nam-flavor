sino_event.243.t:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName][concept_japanese_emperor] critically ill."
sino_event.243.d:0 "Since I ascended the throne, I have worked to innovate, reform, and strive for the revival of our nation. I abolished feudal domains, established counties, reformed the military, promoted education, and developed industry to extend the nation's influence. However, of late, my spirit has grown weary, and my vitality has faded. Medicine has proven ineffective. In the interest of preserving the nation's continuity, the imperial regalia must be passed on. [Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')] has grown to maturity and can take on the responsibility of the imperial succession. All ministers and citizens must remain at their posts and avoid unnecessary disturbance. May heaven bless the Empire of Japan. — [SCOPE.sCharacter('crisis_scope_2').GetFirstName]"
sino_event.243.f:0 "Since [SCOPE.sCharacter('crisis_scope_2').GetFirstName][concept_japanese_emperor] assumed the throne, the nation has prospered with reforms, territorial expansion, and growing power. However, of late, His Majesty's health has deteriorated, and the royal physicians are unable to help. News of His Majesty’s condition spread quickly, and all ministers, upon hearing the news, bowed deeply and prayed for His Majesty’s recovery. In the past, [concept_japanese_emperor] stood tall in the court, making far-reaching decisions; now, on the sickbed, His Majesty is barely able to govern. The state seems to be on the brink of collapse, and both the court and the people are anxious."
sino_event.243.a:0 "[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')] #yellow Taishō#! is wise and compassionate, and has shown the qualities needed to succeed the throne. We, the ministers, shall offer our full support and assist in governing the nation to ensure its stability."

sino_event.244.t:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName][concept_japanese_emperor] critically ill."
sino_event.244.d:0 "I inherited the legacy of my predecessor and have governed diligently, hoping to continue the prosperity of the Meiji era. Alas, my health has deteriorated; I have been bedridden for a long time and can no longer personally manage state affairs. With the state and the people in mind, I am deeply troubled. I now issue a public decree, calling on all officials to remain faithful to their duties, act in unison, and uphold the nation’s foundations. May heaven bless our country and grant me health, so I may once again serve the people. — [SCOPE.sCharacter('crisis_scope_2').GetFirstName]"
sino_event.244.f:0 "Since [SCOPE.sCharacter('crisis_scope_2').GetFirstName][concept_japanese_emperor] ascended the throne, following the legacy of #yellow Meiji#!, efforts have been made to continue the golden age. Unfortunately, His Majesty's health has failed, and for some time, He has been unable to preside over court sessions. Ministers, upon seeing His Majesty’s frail appearance, are deeply pained. The country is without a ruler capable of personally managing affairs, and like a ship without a rudder, the state has grown unstable, and the people are growing increasingly restless."
sino_event.244.a:0 "[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')] #yellow Shōwa#! is intelligent and capable, and is fit to assume the throne. We, the ministers, will work in unison to support Him in taking over state affairs and securing the future of the nation."

sino_event.245.t:0 "During the reign of [SCOPE.sCharacter('crisis_scope_2').GetFirstName], [concept_japanese_emperor] grants #yellow Taishō#! the title of [Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]"
sino_event.245.d:0 "I hereby designate #yellow Taishō#! as [Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')] to solidify the foundation of the nation."
sino_event.245.f:0 "[concept_japanese_emperor] issued a decree to hold the formal ceremony in the palace. On that day, the ceremony was solemn, with music and military honors. #yellow Taishō#!, dressed in [Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')] attire, kneeled to receive the title, and after the ceremony, the officials paid their respects. This move solidified the imperial heir and reassured the people, who saw this as a sign that the imperial family’s succession was secure and that the nation would enjoy long-lasting peace."
sino_event.245.a:0 "I hope #yellow Taishō#! will continue his studies, cultivate virtues, and one day take the throne, fulfilling the responsibility to preserve the legacy of our ancestors."

sino_event.246.t:0 "During the reign of [SCOPE.sCharacter('crisis_scope_2').GetFirstName], the nation enjoyed peace, and [concept_japanese_emperor] grants #yellow Shōwa#! the title of [Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]"
sino_event.246.d:0 "Crown Prince #yellow Shōwa#!, born wise and noble, is designated as the heir to the throne."
sino_event.246.f:0 "[concept_japanese_emperor], realizing the need to ensure the nation's continuity, chose an auspicious day and announced the coronation of #yellow Shōwa#! as [Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]. During the ceremony, #yellow Shōwa#! calmly received the title, with a solemn expression. The officials observed him with admiration, remarking that he had the demeanor of a future monarch. The news spread to the people, who felt reassured that the imperial heir was a capable leader and that the nation had a hopeful future."
sino_event.246.a:0 "#yellow Shōwa#! must prioritize the nation, study governance, and listen to wise counsel in order to lay a strong foundation for his future rule."

sino_event.247.t:0 "During the reign of [SCOPE.sCharacter('crisis_scope_2').GetFirstName], [concept_japanese_emperor] grants his second son #yellow Akihito#! the title of [Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]"
sino_event.247.d:0 "Crown Prince #yellow Akihito#!, endowed with virtue and filial piety, is formally designated as [Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')] to continue the imperial line."
sino_event.247.f:0 "Crown Prince #yellow Akihito#! has grown up to be compassionate, wise, and knowledgeable, excelling in both scholarship and rituals, earning the admiration of the royal family and the people. [concept_japanese_emperor] realizing the importance of imperial succession, issued a decree to designate him as [Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]. On the day of the ceremony, the palace was filled with solemn rituals, and #yellow Akihito#! received the title with respect. The people prayed for his success in mastering the responsibilities of the throne, protecting the imperial family, and governing the nation."
sino_event.247.a:0 "[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')] #yellow Akihito#!, always with a compassionate heart, should work hard to carry on the legacy of his ancestors and bring peace and prosperity to the people."
notification_Human_experiments_name: "[SCOPE.sCountry('scope_yolo').GetName] government has ordered soldiers to be deployed in [SCOPE.sState('chi_state').GetName] to build concentration camps to execute prisoners of war and civilians in batches"​
notification_Human_experiments_desc: "In the cold laboratory, they ignore the basic conscience and morality of human beings, forcibly inject plague, cholera, anthrax and other fierce germs into the experimenters, observe their pathogenesis, record painful struggles and death trajectories, just to collect so-called "experimental data". What's even more outrageous is that they will vividisse organs in living people without anesthesia, and watch the experimenters die in severe pain, with no shame on their faces."​
sino_event.252.t: "Chen Jingying's Letter to Family"
sino_event.252.d: "#black Respected Father:                                            #!"
sino_event.252.f: "#black                    I take up my pen with a heavy heart. The nation is now facing a great crisis, as foreign enemies have brazenly launched an invasion. As a member of the Beiyang Navy, witnessing the situation fills me with deep anxiety.\n                   The naval battle situation is not optimistic. We only have a few warships of the Beiyang Fleet available for combat, while the enemy has numerous warships. The auxiliary ships from Nanyang and other provinces are not only poorly trained but also structurally fragile. I am well aware that our army may have only a 30% chance of winning this battle. However, all the officers and soldiers of the Beiyang Navy, knowing the danger, dare not retreat in the slightest. The lesson of the Fuzhou Navy's total annihilation in the Battle of Majiang is still vivid in our minds. Now, though we are trembling with fear, we have received the grace of the country's salary and rank on usual days, so we can only resolve to die and fight bravely against the enemy.\n                   Since the outbreak of the naval battle, military affairs have been busy, and I often have no time for other things. This letter is hasty and unfinished, as I am called away by other matters. For those with families in Weihai, take the clothes..."
sino_event.252.a: "From #BOLD [TimeKeeper.GetCurrentDate.GetString]#!"

sino_event.253.t: "Chen Jingying's Last Letter"
sino_event.253.d: "#black Respected Father:                                            #!"
sino_event.253.f: "#black                    At a time when the country is in trouble, it is only right to be loyal, which is the duty of a subject. What's more, it is an honor for a man to die on the battlefield. However, Father, you are advanced in years. If something happens to me, I know it will grieve you deeply. But since ancient times, loyalty and filial piety have been hard to balance. Now I choose to be loyal and cannot be filial by your side. I am afraid that this sin of unfilial piety will not escape the condemnation of heaven and earth.\n                   I know full well that this battle is extremely dangerous, but I will never retreat. If I can defend the country and die on the battlefield, I will have no regrets. I only hope that Father will take good care of yourself and not worry too much about me.\n                                                         Your son, Chen Jingying (last letter)"
sino_event.253.a: "From #BOLD [TimeKeeper.GetCurrentDate.GetString]#!"

sino_event.254.t: "To Yuan Shengcai"
sino_event.254.d: "#black My son Shengcai:                                            #!"
sino_event.254.f: "#black                   I take up my pen with a heart full of sorrow. The family is now in extreme poverty and can hardly make ends meet. I am seriously ill, at death's door, but have no money for treatment. Even the rent is due now, and the family really has no money to pay. The landlord has urged many times and given an ultimatum.\n                   The family has long been without food, and there is no way to borrow money from anywhere. Now I can't even afford a coffin and shrouds for after my death, let alone arrange the funeral. My son, I now have only you to rely on. You are in the army; can you find a way to send some silver home to save this family? My days are numbered, and I only hope to see the family's predicament ease before I close my eyes.\n                   My son, how are you getting on in the army? I worry about you day and night. But the family is really in such a difficult situation that I have to ask you. If you can raise money, be sure to send it back quickly, don't delay.\n                   All the things at home have exhausted me. I hope you can reply soon and tell me about your recent situation.\n                                                         Your old father at home"
sino_event.254.a: "From #BOLD [TimeKeeper.GetCurrentDate.GetString]#!"

sino_event.255.t: "To Tu Axiang"
sino_event.255.d: "#black Dear son-in-law Axiang:                                            #!"
sino_event.255.f: "#black                   How have you been lately? There are some things at home I need to tell you. Your wife, my daughter, gave birth to a son a few days ago. Both mother and child are safe, and now you are a father. However, my daughter had a falling-out with her in-laws, and now she has returned to her mother's home with the baby who is not yet one month old.\n                   A few days ago, my daughter sent you some clothes and other daily necessities. I wonder if you have received them. When you receive the things, be sure to write back to let her know, so that she can be at ease. She is doing well at her mother's home, but she often worries about your safety in the army.\n                   Now the world is in chaos with wars and rebellions. You must be careful when serving in the army far away. You don't need to worry too much about family matters; your mother-in-law and I will take good care of our daughter and the child. We only hope that everything goes well for you in the army and that you can return safely soon.\n\n                                                         Your father-in-law, Hong Renjin"
sino_event.255.a: "From #BOLD [TimeKeeper.GetCurrentDate.GetString]#!"

sino_event.256.t: "Letter to My Wife"
sino_event.256.d: "#black Yiying, my dear, as I meet you in this letter:                                            #!"
sino_event.256.f: "#black I am writing this letter to bid you farewell forever! As I write this, I am still a man in this world; when you read this, I will have become a ghost in the underworld. As I write, tears fall with the brush and ink. I want to put down the brush without finishing, yet I fear you may not understand my heart, thinking I have the heart to leave you and die, thinking I do not know you do not want me to die. So I endure my sorrow to tell you.\nI love you deeply, and it is this thought of loving you that gives me the courage to die. Since I met you, I have always hoped that all lovers in the world could be united. However, the land is covered with a stench of blood, and the streets are full of wolves and dogs. How many families can have their wishes fulfilled? I cannot learn to be indifferent like the sages. As the saying goes: A benevolent person "respects their own elders and extends that respect to the elders of others; loves their own children and extends that love to the children of others." I expand my love for you to help people in the world love those they love. That is why I dare to die before you, regardless of you. If you understand my heart, besides weeping, you will also think of the people of the world. You should also be willing to sacrifice the happiness of myself and you for the eternal well-being of the world. Do not grieve!\nDo you remember? One evening four or five years ago, I once said to you: "Rather than me die first, I would prefer you die before me." You were angry when you first heard it. Later, after I explained gently, though you did not agree with me, you had no words to reply. My idea was that with your frailty, you could not bear the sorrow of losing me. If I die first, leaving the pain to you, my heart cannot bear it. So I would rather ask you to die first, and I would bear the sorrow. Alas! Who knew I would end up dying before you?\nI really cannot forget you!\nNow I have no more words for you. When I am in the underworld, hearing your cries from afar, I will cry in response. I never believed in ghosts before, but now I hope they really exist. People also say that telepathy exists, and I hope that is true. Then, after my death, my spirit will still linger by your side, and you need not grieve for being alone.\nI never told you my aspirations, which was my fault. However, if I told you, I feared you would worry about me every day. I am willing to sacrifice myself a hundred times, but making you worry is truly something I cannot bear. I love you deeply, so I am anxious to plan for you as much as possible. You were lucky to meet me, but how unlucky to be born in China today! I was lucky to get you, but how unlucky to be born in China today! In the end, I cannot bear to seek only my own good. Alas! The handkerchief is short, but my feelings are long. There are thousands of things unsaid, which you can imagine. I cannot see you now! You cannot bear to part with me—will you see me in your dreams from time to time? A deep sorrow. Written by Yidong at the fourth watch on the night of the 26th day of the third lunar month in the year of Xinwei.\nAll the aunts at home are literate. If there is anything you do not understand, I hope you will ask them for guidance, and that they will fully understand my meaning.\n#black                                                                 Husband Lin Juemin (last letter)#!#!"
sino_event.256.a: "From #BOLD [TimeKeeper.GetCurrentDate.GetString]#!"

sino_event.257.t: "Don't Tell Mom I'm in Afghanistan"
sino_event.257.d: "#black My dear sister:                                            #!"
sino_event.257.f: "#black It's winter now; is the road home covered with snow?\n\nWith the dawn's light, meteors streak across Kandahar's sky.\n\nYou mustn't tell Mom I'm in Afghanistan.\n\nIt's Saturday now, pouring with rain, and there's this cruel war.\n\nAt night, the comrades sleep soundly, and the air smells of sweat.\n\nMy comrade Oleg—I bet he'll make it through.\n\nMy dear sister, please send my regards to the family.\n\nTell them to keep writing; I haven't received a letter from home in a long time.\n\nIf relatives and friends ask what I wrote to you, don't tell the truth.\n\nYou mustn't tell Mom I'm in Afghanistan."
sino_event.257.a: "From #BOLD [TimeKeeper.GetCurrentDate.GetString]#!"
sino_event.260.t:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName][concept_japanese_emperor] has passed away"
sino_event.260.d:0 "I have reigned for more than thirty years, inheriting the glory of my predecessors and diligently governing all affairs, hoping to bring peace to the nation. Now my time is drawing to an end, and fate is inevitable. Though I cherish the weight of the imperial ancestral shrine and the hardships of the people, the will of heaven cannot be defied. I hereby issue this imperial edict: the nation cannot be without a ruler for a single day. You ministers shall promptly enthrone the Crown Prince [Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')] #yellow Osahito#! to succeed me, uphold the ancestral laws, and assist the throne with one heart. Protect the foundation of Yamato and ensure the livelihoods of all people. May the gods bless our nation with eternal stability and peace for all living beings."
sino_event.260.f:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName][concept_japanese_emperor] reigned for thirty-six years, practicing frugality, devoutly believing in Confucianism, inheriting the legacy of the Kansei era, reorganizing laws and disciplines, and comforting the people. Yet in his later years, he was plagued by persistent illness, and despite all treatments, there was no cure. Now the emperor has ascended to the afterlife, plunging the entire realm into mourning and all court officials into grief. Though the late emperor’s edict has appointed the heir, the new monarch is newly enthroned with an unstable foundation. With foreign powers looming outside and internal affairs awaiting governance, anxiety spreads among the people, and the nation’s fate faces a grave trial."
sino_event.260.a:0 "[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')] #yellow Osahito#! is benevolent, wise, and profoundly educated by the late emperor, well-versed in the ways of governing the nation. We ministers dare not disobey the imperial edict! We shall lead all civil and military officials to enthrone the new emperor, devote our utmost loyalty and wisdom to assist him in stabilizing the court, resisting foreign aggression, comforting the people, repay the late emperor’s kindness, and secure the eternal foundation of Japan!"
sino_event.261.t: "To Madam Zheng · Exiled to Ili"
sino_event.261.d: "#v Dear Madam Zheng#!"
sino_event.261.f: "Since the opium destruction at Humen, British invaders provoked conflicts. I was dismissed by the court and ordered to be exiled far to Ili. All I did was to eliminate malpractices for the nation, and I have long disregarded life and death, fortune and misfortune.\nWeak in strength yet burdened with heavy duty, I have long worn out my spirit. Further strain would leave my frail capacity utterly exhausted.\nIf it benefits the nation, I will face life and death alike; never shun duty for personal fortune or misfortune.\nExile is indeed the grace of the sovereign, and living simply suits an exiled soldier well.\nI jest with my wife about old tales, reciting verses that cost an elderly man his life.\nYou know my temperament well, do not grieve for me. Entrust household affairs to you; educate children with strict principles. Uphold integrity, live in peace with duty, never rely on past prestige, never covet ill-gotten gains.\nThough stranded in remote frontier lands, my heart never strays from the motherland. Should I return someday, I will serve the country anew. If death awaits me here, I shall depart with no regrets.\nTake good care of yourself."
sino_event.261.a: "Handwritten by Lin Zexu - July, the 22nd year of Daoguang reign"

sino_event.262.t: "Letter to Wife Li Run in Prison"
sino_event.262.d: "#v My Dearest Wife#!"
sino_event.262.f: "I sent several letters from Hubei. Departed on June 16th and arrived in the capital on the fifth day of this month. Days were filled with hectic affairs beyond description. The court firmly commits to reform, promising a promising future for the country. I strive all the harder and indulge no leisure.\nMy health remains sound and spirits high, rest assured. Heavy duties ahead will leave little time for frequent correspondence, do not worry.\nAll reforms across nations were achieved through bloodshed. No blood has been shed for reform in China, which explains the nation's stagnation. Let my blood be the first spilled for this cause.\nFacing the blade, I laugh toward the sky; loyal hearts stand firm whether staying or departing.\nCherish yourself and ease your mind. Do not mourn me. To die for the country is a worthy end."
sino_event.262.a: "Handwritten by Tan Sitong - July 11th, the 24th year of Guangxu reign"
dsk_prussia.50.t:0 "To Mother"
dsk_prussia.50.d:0 "#black Dear Mother:                                            #!"
dsk_prussia.50.f:0 "#black                   I hope you are doing well when you receive this letter. We have been besieged by German troops for a long time, but please rest assured that the siege has not seriously affected my health for the time being. It's just that there's barely any meat to eat now, but fortunately, we still have some supplies to get by. I heard that many people in Paris are starving, so in comparison, I consider myself lucky.\n                   Mother, don't worry about me. I keep an eye on the war every day. The fellow citizens of Paris are full of enthusiasm and dedication, and everyone is bravely fighting to stop the Germans. We may face some setbacks, but I firmly believe that the people of Paris will eventually win! A few days ago, from November 29th to December 1st, there was a fierce battle here. Our French soldiers successfully defeated the Prussian soldiers, captured their artillery, and took 1,000 prisoners.\n                   Mother, you must take good care of yourself. Please give my hugs to Uncle, Aunt, and Maria. I miss you with all my heart and look forward to reuniting with you soon.\n                                                         Your loyal son"
dsk_prussia.50.a: "From #BOLD [TimeKeeper.GetCurrentDate.GetString]#!"
clever_dsk.199.t: "Kuomintang Leaders"
clever_dsk.199.d: "The revolution has achieved victory, and the new army soldiers who hold the dream of rejuvenating the nation have elected three capable revolutionaries among them as leaders. At the inauguration ceremony in #yellow Nanjing#!, [SCOPE.sCharacter('clever_dsk_199_character_1').GetFullName] took office as President, [SCOPE.sCharacter('clever_dsk_199_character_2').GetFullName] as President of the Legislative Yuan, and [SCOPE.sCharacter('clever_dsk_199_character_3').GetFullName] as Minister of the Army."
clever_dsk.199.f: "Now that the Republic is newly established, foreign affairs and internal affairs are numerous and complicated. I, myself, wonder who I am to be able to shoulder this responsibility! However, the provisional government is a government of the revolutionary era. Those who have engaged in the revolution over the past decade or more have all overcome the difficulties they encountered with sincere and pure spirits, far more than before. And we must preserve this revolutionary spirit, advancing unimpeded, and ensure that the foundation of the Republic of China is firmly established on this land. Only then will the duties of the provisional government be fulfilled, and we can be free from guilt before the people. On this day of meeting our fellow citizens for the first time, I lay bare my heart, hoping that our 400 million compatriots will all witness it!"
clever_dsk.200.t: "An Outstanding Minister of Finance"
clever_dsk.200.d: "A Minister of Finance in the government has performed exceptionally well. Under his leadership, our country's finances have achieved long-term budget balance and even a surplus. Some military personnel and conservative politicians, under the banner of #yellow saving the country#!, have called for this Minister of Finance to take the position of Prime Minister."
clever_dsk.200.f: "#v $clergymen$#! praise his piety to Catholicism, #v $aristocrats$#! are happy to support him who advocates protecting private property, and #v $capitalists$#! even regard him as the guardian of develop overseas colonial interests."
clever_dsk.200.a: "We need such an excellent man."
clever_dsk.200.b: "Prevent him from getting deeper into politics."
clever_dsk.201.t: "Leader of the Committee"
clever_dsk.201.d: "The Spanish #yellow Republican faction#! successfully defeated the #yellow Royalist faction#! in the municipal elections. The Revolutionary Committee decided to select a veteran who has long adhered to republican ideals to serve as the leader of the republic."
clever_dsk.201.f: "Spain needs to get rid of the decay of the monarchy and establish a republic based on popular sovereignty. The results of the municipal elections have proved that the people's choice is republicanism rather than monarchy."
clever_dsk.201.a: "#yellow Zamora#! will consolidate our republican system."
clever_dsk.201.b: "Prevent him from getting deeper into politics."
clever_dsk.202.t: "Irish Potato Famine"
clever_dsk.202.d: "A strange epidemic spread across the entire island of Ireland, with the greatest impact on Ireland's main crop - potatoes. Whole potato seedlings rotted before they could be harvested, and #yellow Ireland#!'s annual food reserves in every household are about to be completely exhausted due to this disaster."
clever_dsk.202.f: "Some #v $clergymen$#! quoted the Bible, pointing out that the "disaster" striking Ireland is a warning against luxury and carefree life, especially for those Irish who believe in #yellow Catholicism#!. God created the disaster to punish their religious "errors"."
clever_dsk.202.a: "How should we respond?"
clever_dsk.203.t: "Enactment of Brazil's Abolition Act"
clever_dsk.203.d: "Under the mandatory implementation of our Aberdeen Act, #yellow Brazil#! has finally abolished the inhumane slave trade system and returned freedom to those blacks bound by chains. #v $aristocrats$#! and various figures in London praised our efforts to强制实现 Brazil's #yellow prohibition of slavery#! in newspapers."
clever_dsk.203.f: "What does it mean to cram a large number of people into the cargo hold of a ship - those scenes of stench, spreading diseases, lying corpses, and bloody handcuffs and foot镣 - oh, such scenes are terrible, and this inhumane slavery must end."
clever_dsk.203.a: "We will continue to be at the forefront of the world's morality and spread the values of abolitionism to the world."
clever_dsk.204.t: "A Letter to #yellow Roy Cronin#!"
clever_dsk.204.d: "#black Dear Roy,                                            #!"
clever_dsk.204.f: "#black                    You mean more to me than a thousand words\n                   But we have no future\n                   I am deeply grateful for your affection for me\n                   I can't go on writing\n                   Goodbye, my dearest\n                                                         Myra#!"
clever_dsk.204.a: "......"

japs_surrender_button:0 "Accept the Potsdam Declaration"
japs_surrender_button_desc:0 "If we continue to fight, it will lead to the destruction of our nation."
japs_surrender_now_tt:0 "Immediately surrender to the United States, Britain, China, and the Soviet Union."

clever_dsk.206.t: "An Extraordinary #white Wedding#!"
clever_dsk.206.d: "Deng Sanko#!, wandering in a foreign land, encountered the equally exiled #yellow Louise Windsor#!. They shared weal and woe, adventured across the African continent, endured the torment of African malaria, evaded the pursuit of colonists, and narrowly escaped death surrounded by tribal chiefs... Their shared experiences fostered a trace of #white affection#! between them. With the witness of time, they held a #white wedding#! in a small church."
clever_dsk.206.f: "My dear #yellow Louise#!, come! Let us elope together\n\nTo that distant place\n\nWhere eternal bonds have firmly tied us\n\nThere the sun blazes like fire\n\nScorching the earth with intense heat\n\nWaterfalls cascade down the cliffs\n\nAs if draped in shimmering #white veils#!..."
clever_dsk.206.a: "Just like in a fairy tale, the prince's #white kiss#! cured the princess's ailment at its root."
clever_dsk.206.b: "Blessings to the newlyweds...... #yellow Deng Sanko#!, #yellow Louise Windsor#!, welcome home."


clever_dsk.206.t: "Celebration Banquet"
clever_dsk.206.d: "With the unification of the German Fatherland, at the celebration banquet hosted by [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName], three outstanding contributors to unification drew particular attention. The guests awaited [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]'s recognition of these meritorious officials."
clever_dsk.206.f: "The Army Minister [SCOPE.sCharacter('clever_dsk_206_character_2').GetFullName], like a skilled artisan, forged the Prussian army into an invincible force; the Chief of General Staff [SCOPE.sCharacter('clever_dsk_206_character_3').GetFullName], with his extraordinary talent, commanded this formidable army with masterful prowess; as for the esteemed Count [SCOPE.sCharacter('clever_dsk_206_character_1').GetFullName], you are not only the architect of the state machinery but also the soul of the historic masterpiece 'The Unification of Germany'. Your foresight and wisdom propelled Prussia to the pinnacle of glory.—[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]"
clever_dsk.206.a: "Let's all cheer for them!"
five_year_plan_7_tt:0 "Realize the great ideal of #red communism#!"
clever_dsk.207.a: "Recovering the Jujuy Province is enough; we will not seize more land from our neighbors!"
clever_dsk.208.d: "Our army has decisively defeated the army of #yellow Bolivia#! in the Amazon Basin. The so-called #yellow Supreme Guardian#! fled the battlefield in panic. It is obvious that this foolish confederation can hardly sustain itself any longer."
clever_dsk.208.f: "The brave generals and soldiers crossed the border and held a grand military parade in Santa Cruz. The Peruvians on both sides of the road watched us with frightened eyes. As our neighbor, completely eliminating #yellow Bolivia#! would damage our international reputation. Perhaps we can demand that the #yellow fleeing dictator#! 'agree' to dissolve the confederation in exchange for the regions we have occupied."
clever_dsk.208.a: "The Bolivians have no pants left; we will not take away our neighbors' last pair of underpants."
clever_dsk.209.t: "Establishment of Canada"
clever_dsk.209.d: "Facing the increasingly powerful neighbor in the south, the provinces have finally taken a historic step - uniting to form a country called #yellow Canada#!. On the streets of cities such as Ottawa and Montreal, people cheered for the #yellow Canadian Confederation#!."
clever_dsk.209.f: "O Canada!\nOur home and native land!\nTrue patriot love in all of us command.\nWith glowing hearts we see thee rise,\nThe True North strong and free!"
clever_dsk.209.a: "Let us work together to build a prosperous and strong northern country!"
clever_dsk.210.t: "#red Invasion#! by Britain"
clever_dsk.210.d: "The evil [SCOPE.sCountry('gbr_scope').GetName] is about to invade our homeland. When [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] heard the news, his expression became very solemn. Obviously, we have to make a difficult choice: to fight to the end to defend the legacy of the former king, or to submit humbly and lose the dignity of the royal family."
clever_dsk.210.f: "Our blood will be shed for Thailand, and it will make the enemy realize that every inch of Thailand's land belongs to the Thai people. Because the people are always united, and the national sovereignty will be firmly guarded for a long time. We love peace but are not afraid of war; no one is allowed to abolish independence and impose tyranny!"
clever_dsk.210.a: "The British have more powerful guns and artillery than us. It might be feasible to endure humiliation and bear heavy burdens like the former king #yellow Taksin#! did."
clever_dsk.210.b: "#yellow Buddha#! will bless us to defeat the foreign enemies."
clever_dsk.210.c: "Completely submitting to the #yellow Englishmen#! can at least ensure the integrity of our territory."
clever_dsk.212.a: "They will not be welcome here."
clever_dsk.213.t: "#yellow German#! Industrial Revolution"
clever_dsk.213.d: "With the unification of the German motherland, the goal of national industrialization has also been put on the agenda. If we want to occupy a place in the world in the future, a strong industrial foundation is essential."
clever_dsk.213.f: "Rows of chimneys emitting thick black smoke - in my opinion, this is a symbol of the motherland's strength."
clever_dsk.213.a: "Dear motherland, you can rest assured! We will guard you firmly and loyally!"
clever_dsk.214.t: "#red Second Invasion#! by Britain"
clever_dsk.214.d: "The evil [SCOPE.sCountry('gbr_scope').GetName] accused us of acting as lackeys of #yellow Russia#! on the ground that [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] received the #yellow Russian diplomatic mission#! without their consent, and threatened to take revenge for our betrayal of [SCOPE.sCountry('gbr_scope').GetName]. They have issued an ultimatum: if we do not hand over the diplomatic power to the British, they will use military force to 'persuade' us."
clever_dsk.214.f: "#green Allah#! guided us to repel these evil infidels last time, and this time He will definitely bless us to kill them all! Moreover, the #yellow Russian friends#! of [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] will definitely help us defeat the foreign enemies."
clever_dsk.214.a: "It might be feasible to make a humble concession."
clever_dsk.214.b: "#green Allah#! will bless us to achieve victory again."
clever_dsk.214.c: "Completely submitting to the #yellow Englishmen#! can at least ensure the integrity of our territory."
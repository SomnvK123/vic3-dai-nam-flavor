sino_event.60.f:0 "In late June 1884, Kim Ok-kyun returned to the Korean government as an assistant in the Foreign Office. Japan’s acting minister in Korea, Island Village Hisashi, began to try to approach Kim Ok-kyun and other Kaehwa Party members. He said, under the context of the Sino-French War, 'If you (referring to the Kaehwa Party) can reform the country, I do not oppose your government.' The purpose of this coup was twofold: first, to break away from China’s suzerainty, and second, to reform Korea’s internal affairs."
sino_event.60.a: "Send #yellow Yuan Shikai#! to Korea"

sino_event.51.t: "Message from our diplomat in [SCOPE.sCountry('kor_scope').GetAdjective]"
sino_event.51.d: "Our diplomat in Hanseong has sent a secret report: Since last year, our aid to Korea in grain, railroad construction, and technical support for textile factories has shown positive results: The railroad from Pyongyang to Incheon has been completed, improving grain transportation efficiency by 30%. The Hanseong textile factory's annual cotton production has doubled, and our merchant ships now account for 60% of all foreign ships docking at Busan port, maintaining our position as the largest trade partner. On the trade routes between the two countries, camel bells and steam whistles blend, resembling the scenes of the Han and Tang 'Silk Road.'"
sino_event.51.f: "Militarily, we have trained two new regiments for Korea, equipped with the 'Hanyang-made' rifles and Krupp mountain cannons. The generals attend quarterly training at Shenyang Military Academy. Economically, coal and iron from Liaodong are transported to Korea via the Yalu River cableway to help establish a munitions factory, while ginseng and copper from Korea continue to flow into China. This two-way exchange has made Korea increasingly dependent on our military and technology, while its farmers’ grain stores are gradually filling. New schools have opened on the streets of Hanseong, where children can now recite the phrase 'China and Korea are lips and teeth.' The people’s livelihood and dependency are two sides of the same coin."
sino_event.51.a: "The resources for their survival, and our safeguard of the eastern frontier."

sino_event.53.t: "Message from our embassy in [SCOPE.sCountry('western_country').GetAdjective]"
sino_event.53.d: "Our embassy in the West urgently reports: On the 23rd of last month, our merchant fleet, the 'Shunchang,' carrying 300 rolls of silk and 50 boxes of Jingdezhen porcelain, encountered a rare storm in the Strait of Malacca. Three of the cargo ships' masts broke and drifted with the waves. Fortunately, the West's Royal Navy's cruiser 'Victoria' passed by and its crew threw ropes to help, taking two days to tow the ships to Penang Port. After repairing the sails and replenishing fresh water, the ships were able to continue their journey."
sino_event.53.f: "The West's naval minister mentioned this incident in parliament, calling 'Chinese merchant ships’ cargo the bridge of trade between East and West.' Their king has asked our ambassador to bring back a personal letter, saying 'We wish to use our ships to protect the trade routes and ensure maritime peace.' Since last year, when we signed the 'Reciprocal Tariff Agreement' with the West, such mutual assistance has increased, and the bridge of friendship is growing wider."
sino_event.53.a: "Draft a letter of thanks from the Ministry of Foreign Affairs, including 100 pounds of Huizhou tea bricks and two Suzhou embroidered screens, and send a special envoy to [SCOPE.sCountry('western_country').GetAdjective]"

sino_event.54.a: "Send #yellow Yuan Shikai#! to Korea to support the Queen Min faction"

sino_event.55.t: "Message from [SCOPE.sCountry('western_country').GetAdjective] Embassy in China"
sino_event.55.d: "[SCOPE.sCountry('western_country').GetAdjective] Ambassador visited the Premier’s office and found the wreckage of a Song Dynasty merchant ship. Inside the hold, there were well-preserved Qing Dynasty porcelain bowls (with the 'Yuanfeng Year' mark on the bottom), a linen merchant logbook (with blurry writing, still readable ‘Trade to Sanfoqi’), and even a half-box of undamaged Wuyi rock tea."
sino_event.55.f: "[SCOPE.sCountry('western_country').GetAdjective] ambassador said, 'This is a shared maritime heritage of humanity,' and is willing to collaborate on archaeology with us. Our archaeology experts are now preparing to depart, equipped with the Luoyang shovel, underwater spotlights, and other tools. The plan is to go next month aboard the 'Haiyan' research ship. If we are able to recover the shipwreck, it will not only prove the prosperity of China’s Song dynasty maritime activities but also provide concrete evidence for the claim 'The South China Sea belongs to us.'"
sino_event.55.a: "Order the archaeological team to bring sufficient silk samples and copies of Song Dynasty maritime maps."

sino_event.56.t: "[SCOPE.sState('zhejiang_scope').GetName] Typhoon"
sino_event.56.d: "This morning at the Chen hour, the Shanghai Observatory reported a strong typhoon developing in the East China Sea, with winds reaching level twelve. At the same time, five people from the [SCOPE.sCountry('western_country').GetAdjective] embassy in China, aboard the 'Iris' cruiser, left Ningbo Port yesterday for their return home, but they entered the affected area of the typhoon and have been out of contact for three hours, with the ship’s signal completely lost."
sino_event.56.f: "According to the pilot at Ningbo Port, 'Iris' left port just as dark clouds appeared on the horizon, and the ambassador even joked, 'God will protect us.' Now, the giant waves are hitting the shores of the East China Sea, and all fishing boats have returned to port, but the 'Iris' has vanished without a trace, and it is feared that it has encountered danger."
sino_event.56.a: "Order the East Sea Fleet's 'Zhenhai' and 'Dinghai' cruisers to immediately set sail."
sino_event.56.b: "Let them seek help from [SCOPE.sCountry('jap_scope').GetAdjective]."
sino_event.57.t: "[SCOPE.sCountry('western_country').GetAdjective] requests interference in [concept_battle_of_east_asia]"
sino_event.57.d: "To [SCOPE.sCountry('chi_scope').GetAdjective] Prime Minister's Bureau of Foreign Affairs and [SCOPE.sCountry('jap_scope').GetAdjective] Ministry of Foreign Affairs."
sino_event.57.f: "We have just learned that your country has raised arms over the issue of Korea's sovereignty, and I am deeply concerned. In this age of continental railways and steamships crossing the seas, Eastern and Western civilizations should complement each other like the Thames and the Yangtze. How can we bear to see our Eastern brothers fighting amongst themselves?\n\nRussian ships have made three visits to Wonsan Port this year, with armored vessels carrying 2,000 soldiers. If both Chinese and Japanese forces are exhausted, it is feared that the Double-headed Eagle may reap the benefits."
sino_event.57.a: "[SCOPE.sCountry('western_country').GetAdjective] speaks the truth!"
sino_event.57.b: "Sorry, I cannot comply with this request."

sino_event.58.t: "Zizheng Yuan convenes a meeting"
sino_event.58.d: "The success of governance relies on the unity of the monarch and ministers. We respectfully ask His Majesty to emulate Yao and Shun, to take ancestors as examples, remain humble in accepting advice, and govern with diligence and love for the people. Though we are dull, we are willing to exert all our loyalty and wisdom to assist His Majesty and contribute to the restoration of the nation. We sincerely beg His Majesty to adopt and implement these suggestions; the country will be fortunate, and the people will be blessed."
sino_event.58.f: "The people are the foundation of the state, and a strong foundation ensures the peace of the state. In recent years, floods and droughts have been frequent, causing widespread suffering, with famished people wandering, and corpses scattered. Taxes are heavy, and labor service is burdensome; farmers cannot cultivate, and merchants cannot trade. We ask that all provincial governors and officials urgently provide relief to disaster-stricken citizens, reduce taxes, repair waterworks, and encourage agriculture. We should also establish more industrial schools to teach skills to the people, so that the unemployed can find work and the employed can find joy in their work. This will help secure the people's livelihood."
sino_event.58.a: "Long live His Majesty, long live, long live!"

sino_event.59.t: "First Sino-Japanese War"
sino_event.59.d: "[SCOPE.sCountry('jap_scope').GetAdjective] declared war without warning, attacking the Chinese warships 'Jiyuan' and 'Guangyi' which were reinforcing Korea in the waters off the coast of Pyeongtaek. The Battle of Pyeongtaek broke out, where Japan’s Combined Fleet’s First Division, the 'Naniwa' ship, sank the British merchant ship 'Gaosheng,' which was used by China to transport troops."
sino_event.59.f: "A small island dares to act as Japan did, once receiving the gold seal from the Han dynasty, and basking in the wind of China. Now, like the Western barbarians, it acts with treachery and ingratitude.\nIn 1882, they terrorized Gyeonghwa Island, destroying our borders;\nIn 1884, they plotted to seize Hanseong, harming loyal officials;\nNow they hide behind international law, pretending to protect trade, while secretly plotting annexation.\n\nAlas, the Japanese slaves! Have they forgotten the grace of Xu Fu's expedition to the East and the virtue of Jianzhen spreading Buddhism and wisdom? They stole the shape of the great armor and sword from the prosperous Tang Dynasty, plagiarized the Kana script and calligraphy from the Jin style. These are mere monkeys wearing human clothes! How dare they bite the elephant with a snake’s teeth?\n\nToday, with benevolence we punish the violent, with obedience we quell the rebellious, and we will fight with righteousness to cleanse the Sea of Bohai!"
sino_event.59.a: "The edict has been delivered as per the law, let all hear and take note!"

china_has_lose_tt: "#v The Qing Dynasty's control over Korea has completely wavered#!"
spend_money_to_japan_tt: "We have compensated [SCOPE.sCountry('jap_scope').GetAdjective] 1,000,000 pounds."

sino_event.2.t:0 "The 'Hanseong Treaty'"
sino_event.2.d:0 "[SCOPE.sCountry('jap_scope').GetAdjective] formally recognizes [SCOPE.sCountry('kor_scope').GetAdjective] as a vassal of [SCOPE.sCountry('chi_scope').GetAdjective], and from now on, will send envoys for tribute, investiture, and sacrifices, in full accordance with the 'Regulations for Sino-Korean Commercial and Maritime Trade.'"
sino_event.2.f:0 "This treaty has been signed by your Excellency Ito, the full powers of your country. I have heard rumors in Kumamoto about ‘unfinished business with Korea,’ such rebellious words indeed damage the friendship between our two countries.\n\nWhen your country’s Iwakura Mission visited China, Minister Li Hongzhang presented a plaque with the words 'Common Literature, Common Standards.' But now, seeing what your country has done, it seems to have forgotten the teachings of the sages. If you can follow the agreement, we will allow your merchants to establish a consulate in the Yokohama concession. But if you continue to incite trouble, I fear that our powerful army in the Xiang and Huai regions will march to Fuji and the three Japanese islands will never hear the fragrance of Chinese incense again!"
sino_event.2.a:0 "The letter is delivered as per the law, awaiting your response."

je_dsk_jiawu_war:0 "First Sino-Japanese War"
je_dsk_jiawu_war_reason:0 "Since the Meiji Restoration, your country’s ambitions have gradually surfaced. Abolishing the feudal system, expanding the military, focusing on war rather than agriculture, and neglecting culture while solely emphasizing strong ships. You initially set your sights on Ryukyu, taking the land under false pretense, and China, seeking peace, did not probe deeper; later, you meddled in Korea, pretending to 'protect trade,' but in reality, seeking to annex it. In 1882, when the Donghak Peasant Revolution broke out in Korea, your country immediately sent an army and more than 10,000 ships to Incheon, claiming it was to 'quell the rebellion,' but in reality, occupying Hanseong, pressuring the royal family, and destroying the traditional tributary system."
sino_event.59.f: "Now, our army is prepared to march. The cannon at Weihai has been fired, the fleet at Lushun is ready, and our generals inside and outside the pass are sharpening their weapons, eager to fight. Though your country has ironclad ships, it lacks support; our country may be temporarily in distress, but it enjoys widespread assistance. Let us see who will dominate the region today!"


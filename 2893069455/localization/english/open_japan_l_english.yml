sino_event.241.t:0 "Tokyo Trial"
sino_event.241.d:0 "As the smoke of war dissipates, justice must be upheld. The trial of war criminals is a tribute to the millions of lost souls and a steadfast commitment to peace."
sino_event.241.f:0 "With the end of World War II, the fascist war criminals who once ravaged the world must face the judgment of justice. In the Tokyo courtroom, judges from eleven countries, including [SCOPE.sCountry('usa_scope').GetName], [SCOPE.sCountry('gbr_scope').GetName], and [SCOPE.sCountry('chi_scope').GetName], sat in judgment, while the prosecution and defense fiercely contested. A wealth of ironclad evidence was presented — yellowed diaries detailed the atrocities of city massacres, survivors' testimonies exposed the truth of the crimes, and footage reconstructed the devastation of the war. [SCOPE.sCharacter('empire_character').GetFullName], [SCOPE.sCharacter('fascist_character').GetFullName], and other Class A war criminals, confronted with this evidence, either denied the charges or silently admitted their guilt. The trial lasted two and a half years, eventually bringing many blood-stained war criminals to justice. While not all the perpetrators were punished, it was through the rule of law that the evil of aggression was condemned, leaving a warning for future generations."
sino_event.241.a:0 "Let justice prevail, distinguish right from wrong, bring the war criminals to justice, and comfort the dead, while warning the living."

sino_event.242.t:0 "Trial of [concept_japanese_emperor]"
sino_event.242.d:0 "[concept_japanese_emperor] as the symbol of the Japanese state cannot be absolved of blame for the aggression, and the question of its trial concerns historical justice."
sino_event.242.f:0 "During the war, [concept_japanese_emperor] was revered as the 'incarnation of a god,' and its will became a driving force for the invasion. After the war, the question of whether to try the emperor became a global controversy. The people of China and many other victimized nations strongly demanded that the emperor be held responsible for the war — under [concept_japanese_emperor]’s name, Japanese forces trampled across Asia, leaving millions of families shattered. However, due to the complex international situation and secret agreements between [SCOPE.sCountry('usa_scope').GetName] and [SCOPE.sCountry('jap_scope').GetName] before the war’s end, which guaranteed the continuation of the [SCOPE.sCountry('jap_scope').GetName] #yellow emperor system#! in exchange for an unconditional Japanese surrender, it is not easy to prosecute [concept_japanese_emperor]."
sino_event.242.a:0 "Disregard the prior agreement and demand the execution of [concept_japanese_emperor] without hesitation."
sino_event.242.b:0 "Prioritize demanding that [SCOPE.sCountry('jap_scope').GetName] pay massive war reparations to compensate for the damages caused to our country."

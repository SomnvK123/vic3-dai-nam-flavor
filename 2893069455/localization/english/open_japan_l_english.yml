je_china_Treaty_Port: "In China’s Concessions and Treaty Ports"
je_china_Treaty_Port_reason: "These [GetBuildingType('building_port').GetName] and concessions are the cornerstone of our interests in the Far East. Since the #v Treaty of Nanjing#!, we have opened the doors of trade with strong ships and cannons, not to plunder, but to bring the light of modern civilization to this ancient land.\n\nPorts like #bold Shanghai, Tianjin, Hankou#! are filled with wharves and foreign-owned businesses. We, the merchants, bring in textile machines and steam engines in exchange for silk, tea, and porcelain, a mutually beneficial trade. Within the concessions, the rule of law is in place, streets are tidy, and modern amenities like electric lights and telephones are available, offering the locals a glimpse of what modern governance can look like. If they learn from this, how could their people's lives be so miserable?\n\nMore importantly, these are sanctuaries for our expatriates. When local turmoil arises and officials are incompetent, only the concessions can guarantee our lives and property. And since the treaties are signed and the ink is still fresh, this is a right we are entitled to, and the Chinese government must honor these commitments."

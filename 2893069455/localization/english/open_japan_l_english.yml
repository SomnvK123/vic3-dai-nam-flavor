sino_event.176.t:0 "The Supreme Power"
sino_event.176.f:0 "From the capital to the eighteen provinces, including the old lands of Liaoshen, the region of Jilin Longxing, the hunting grounds of Heilongjiang, cities along the Tianshan mountains, the Mongolian alliances, the snowy Tibetan Plateau, the ethnic minorities of Yunnan, and the coastal islands of Taiwan, the Great Qing's territory encompasses all these regions, under our rule."
sino_event.176.a:0 "Long live the Emperor, long live the Emperor!"

sino_event.177.t:0 "Unfinished Business"
sino_event.177.f:0 "Do you remember? Four or five years ago, I said: 'If I must die first, I would rather you not die before me.' At first, you were angry, but later, after my gentle explanation, you had no words to say. My intention was that your frailty could not bear my grief, and thus I would rather you go first."
sino_event.177.a:0 "Alas! The unfinished matters still linger in my heart, dreams unfulfilled, and things undone; they are entrusted to our deaths."

china_resolution_of_crisis_tt:0 "Depending on the #bold progress bar#! completion, the corresponding #tooltippable;tooltip:[Country.GetTooltipTag]je_final_result #o conclusion#!#!"
je_final_result:0 "There are two possible endings:\n1. #n #bold The Supreme Power#!#! (Only in [GetLawType('law_monarchy').GetName]) or 2. #blue #bold Unfinished Business#!#!\nTriggering different endings will significantly affect the subsequent storyline. A successful timeline will reduce #green Restoration Path#! logs, while a defeated timeline will increase #green Restoration Path#! logs."


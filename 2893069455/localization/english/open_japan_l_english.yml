notification_invade_kor_now_name: "[SCOPE.sCountry('jap_scope').GetName] is seeing the rise of the ‘Invasion of Korea Theory’ nationwide."
notification_invade_kor_now_desc: "The proponents of war assert: 'Since they have delayed us, we must use military force to compel them.' Naval forces are dispatched to patrol Busan, proclaiming an 'inquiry into the crimes.'"

notification_invade_china_now_name: "[SCOPE.sCountry('jap_scope').GetName] blows up a section of the South Manchuria Railway at Liutiaohu and falsely accuses [SCOPE.sCountry('chi_scope').GetName] of destroying the railway."
notification_invade_china_now_desc: "'Japan harbors ambitions to annihilate our entire country, enslave our people, and the Chinese authorities, eager for humiliation and compromise, have already decided that they will no longer tolerate this from Japan. We call upon the 400 million Chinese citizens to rise immediately, stop the civil war, urge the government to reallocate military and financial resources, and confront this unprecedented national crisis. This is the time for true patriots to take action.'"

notification_invade_china_war_name: "[SCOPE.sCountry('jap_scope').GetName] stations troops in Tianjin, frequently conducts military drills, and deliberately creates incidents near the Marco Polo Bridge, using the pretext of missing soldiers to demand searches in the city. The situation in North China is on the brink of conflict."
notification_invade_china_war_desc: "'Japan has long coveted North China, and in recent years, they have increased their military presence, conducted frequent drills, and their intentions to provoke are clear. Now, at the Marco Polo Bridge, military forces are clashing under the guise of searching for soldiers, but the real goal is to breach the gates. Their wolf-like ambitions are evident, aiming to flatten North China and sweep across Central China. If the authorities continue to tolerate this, the nation will be lost. All 400 million compatriots must unite, set aside past grievances, urge the government to reorganize the military, and defend our territory. This is the final critical moment for the survival of our nation, and hesitation is no longer an option!'"

notification_alliance_with_china_notice_name: "[SCOPE.sCountry('scope_yolo').GetName] joins the #v World Anti-Fascist Alliance#!"
notification_alliance_with_china_notice_desc: "No matter where the battles are fought, [SCOPE.sCountry('scope_yolo').GetAdjective] is resolutely fighting to defeat Japan’s abuse of military power."

notification_alliance_with_japan_notice_name: "[SCOPE.sCountry('scope_yolo').GetName] joins the #v Greater East Asia Co-Prosperity Sphere#!"

sino_event.186.t: "Recruit Chinese Laborers"
sino_event.186.d: "People from [SCOPE.sState('han_remove_state').GetName] of [SCOPE.sCulture('han_culture').GetName] have crossed the ocean through intermediaries, traveling long distances to reach our [SCOPE.sState('beautiful_state').GetName]"
sino_event.186.f: "During the late Qing period, overseas Chinese laborers were often impoverished peasants, unemployed poor, or fishermen (especially from Guangdong's Wuyi region), deceived or kidnapped by labor recruitment agencies and sent to foreign lands. They would receive an advance of their wages, but the cost of introductions, travel, and commissions would be deducted. In the late 19th and early 20th centuries, these workers were bound by contracts, known as indentured Chinese laborers."
sino_event.186.a: "Innocent Chinese people, drifting thousands of miles, only to become indentured laborers."
han_remove_state_tt: "1% of the [SCOPE.sCulture('han_culture').GetName] people from [SCOPE.sState('han_remove_state').GetName] will come to [SCOPE.sState('beautiful_state').GetName]"
sino_event.186.b: "I've changed my mind, this year’s [concept_workforce] is sufficient."

# Main Event Localization
je_china_nine_power_initiation: "Nine-Power Treaty Conference"
je_china_nine_power_initiation_reason: "[SCOPE.sCountry('chi_scope').GetName] has historical sovereignty over the Shandong region, and the rights that [SCOPE.sCountry('western_country').GetName] illegally acquired at the Paris Peace Conference must be returned. A major international conference should be convened to establish a new order in the Far East.\n\nThe #v 'Nine-Power Treaty'#! ostensibly 'respects China's sovereignty, independence, and territorial integrity,' but in reality, this is an empty promise. The treaty further states: 'To ensure equal commercial and industrial opportunities for all nations in China.' Therefore, no country 'may exploit the situation in China to obtain special rights.'\n\n#tooltippable #tooltip:[GetPlayer.GetTooltipTag],china_nine_power participating countries#!#! #variable [GetGlobalVariable('je_participating_countries').GetValue]#! [Concept('concept_great_power', '$concept_great_powers$')|l]:\n#variable [GetGlobalVariable('je_pro_treaty_votes').GetValue]#! has #bold supported#! China's sovereignty claims\n#variable [GetGlobalVariable('je_anti_treaty_votes').GetValue]#! has #bold rejected#! China's sovereignty claims\n$TOOLTIP_DELIMITER$\n#v 'Host country'#! is [ROOT.GetCountry.GetName]; the host country cannot choose to support any claims\n$TOOLTIP_DELIMITER$\nAs the #v 'issue country'#! of the conference, [SCOPE.sCountry('chi_scope').GetName] will automatically support its own claims\n$TOOLTIP_DELIMITER$\n#bold In case of a tie, China's own claims will be adopted.#!"

china_nine_power: "The nine countries that participated in the conference were the US, UK, Japan, France, Italy, China, the Netherlands, Portugal, and Belgium."

je_white_sun_rise:0 "Blue Sky with a White Sun"
je_white_sun_rise_reason:0 "This [concept_journal_entry] contains the above #tooltippable #tooltip:[GetPlayer.GetTooltipTag],dsk_white_sun_blue_sky #blue historical event#!#!#!\n$TOOLTIP_DELIMITER$\n[SCOPE.GetRootScope.GetCountry.GetName] has ruled for over two thousand years under imperial rule, but now the nation is deeply struggling. Internally, rebels rise, turning lands into ashes; old factions resist, creating turmoil. Externally, foreign powers are encircling, watching us with predatory eyes, while treaties strangle our throats, and our territories are being carved away.\n\nAt this time, when the nation is teetering and the land is scarred, our hearts break as we think of it. We implore all of you to take up arms to defend our homeland, to pour your hearts and souls into these troubled times—though blood stains history, and bones lie in desolate fields, we must struggle for a glimmer of hope in this shattered land.\n\nWe hope that future generations will eventually be freed from this turmoil, will find stability, have enough food to eat, no longer see war, and no longer hear wails of sorrow. At that time, the wind will be clear, children will clap and sing along the roads, the elderly will enjoy life in the fields, and no one will remember the suffering of these times. Thus, the struggles we face today will not be in vain!"

dsk_white_sun_blue_sky:0 "When time is before 1900, the emperor's outcome will be Confucius' legacy and will trigger the following #yellow common historical events#!:\n1. Illegitimate ascension\n2. People not yet enlightened\n$TOOLTIP_DELIMITER$\nWhen time is after 1900, the emperor's outcome will be #yellow Yuan Shikai#!, and will later trigger the following #blue historical events#!:\n1. #yellow Yuan Shikai#! becomes the military leader\n2. #yellow Yuan Shikai#! is elected President\n3. The Protection War\n4. Warlord conflicts"


sino_event.231.t:0 "A Future of Stormy Seas"
sino_event.231.d:0 "My eight thousand brave soldiers have almost all sacrificed, the enemy's offensive is still strong, and the future is uncertain. If the position holds, I shall return to see you. If the position is lost, I will die on the battlefield, my body abandoned on the field. When the resistance is victorious, and as a renowned anti-Japanese general, if you pass by Wu Songkou on your ship, and you see waves as high as mountains, that will be me coming to see you."
sino_event.231.f:0 "Wu Songkou has been surrounded by Japanese forces on three sides. The sound of artillery is deafening, and smoke obscures the sky. The soldiers, exhausted, still engage in hand-to-hand combat with the enemy using bayonets and rocks. The trench is filled with corpses, and blood flows into the river. The commander writes this last letter to his superiors, his words full of courage—after seven days of fierce battle, from the regiment commander to the soldiers, none retreated. Now, only a hundred survivors remain, guarding the last stronghold, with thousands of civilians behind them. The letter is torn by shrapnel, and ink mixed with blood stains the paper, yet every word burns with the determination to sacrifice for the country."
sino_event.231.a:0 "The evening breeze is light, the evening breeze is gentle, the evening breeze and you both cannot stay."

sino_event.232.t:0 "What is Home Without the Country?"
sino_event.232.d:0 "If I am lucky enough to survive, I will be overjoyed. If not, do not be sorrowful, just take good care of the children and respect the elders."
sino_event.232.f:0 "\"My wife, I write to you as if I were before you. Now the Japanese invaders are coming, the country is in peril, and as a soldier, I must go to the front line to defend my homeland. Life or death is uncertain, but if I am fortunate enough to survive, I will hurry back to you and our children; if I unfortunately perish, do not be sorrowful for me. You will have to manage everything at home, and please raise our children well, teaching them good values, love for the country, and to be filial. When the Japanese are driven out and our land is restored, that will be the time when my soul returns to its home.\""
sino_event.232.a:0 "The Japanese are yet to be driven out, the land is yet to be restored, and even with thousands of homes, how can I rest?"

sino_event.233.t:0 "The Banner of Death"
sino_event.233.d:0 "I do not wish for you to serve me in person, only to serve the nation with loyalty."
sino_event.233.f:0 "The country is in peril, the Japanese are fierce. The rise and fall of the nation is the responsibility of every citizen. I wished to serve, but was too old. Fortunately, I have a son, and I entrust him with this duty. I give you this flag, carry it always. Wipe off blood when wounded, wrap it around your body when you die. Charge forward, never forget your duty."
sino_event.233.a:0 "A song of sadness from Yan and Zhao, a warrior’s resolve to cut off his arm!"

sino_event.234.t:0 "Japan's Surrender"
sino_event.234.d:0 "\"I have carefully considered the world situation and the state of the empire, and I intend to take exceptional measures to restore order. I hereby notify all subjects that I have instructed the Imperial Government to inform the US, UK, China, and Soviet Union of our willingness to accept their joint proclamation.\" — [SCOPE.sCharacter('ruler_scope').GetFirstName]"
sino_event.234.f:0 "We honor the souls of 38 million who perished. From the Mukden Incident to the invasion of China, fourteen years of suffering have passed. The military and the people have fought together, blood has soaked the earth, but our determination remains unbroken. The Chinese nation, though it has faced terrible losses, has not surrendered, and we will continue to resist the invaders. Japan is exhausted, and at last, they have surrendered. Their dream of conquest is shattered."
sino_event.234.a:0 "At home, do not forget to inform your father..."

sino_event.235.t:0 "The Collapse of the Mountains and Rivers"
sino_event.235.d:0 "The sky darkens, and the earth cracks. The descendants of the Chinese, at this final moment, are filled with mixed emotions. Looking back at our ancient land, the civilization has never been broken, how magnificent it is!"
sino_event.235.f:0 "Long ago, the legendary Emperor Huang unified the land, established rituals, and brought harmony. The Wei and Jin periods had their own distinct culture; the Tang dynasty had a glorious era. Though the country has faced many ups and downs, the cultural thread has never been severed. But now, the enemy has arrived, and the nation is on the brink. The cities lie in ruin, and the once prosperous civilization is being destroyed. We will remember those who fought for our survival. Future generations will know that a great nation called China once existed."
sino_event.235.a:0 "Why do my eyes always well up with tears?"

sino_event.240.t:0 "The Potsdam Proclamation"
sino_event.240.d:0 "[SCOPE.sCountry('usa_scope').GetName], [SCOPE.sCountry('gbr_scope').GetName], and [SCOPE.sCountry('chi_scope').GetName] have all significantly strengthened their military forces, and their armies and air forces will soon strike [SCOPE.sCountry('jap_scope').GetName] with the full support of the United Nations."
sino_event.240.f:0 "Fascism has brought suffering to the world, and the world is united in its anger. China, the US, the UK, and the Soviet Union have cast aside their differences to form an alliance and fight the aggressor. The Potsdam Proclamation warns Japan: if they do not surrender, they will face annihilation. The combined forces are ready for the final blow."
sino_event.240.a:0 "The Japanese government is hereby ordered to immediately announce the unconditional surrender of all its armed forces."


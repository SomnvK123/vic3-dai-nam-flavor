sino_event.74.d: "As our influence grows internationally, [SCOPE.sCountry('western_country').GetName] has returned some treasures seized from us."
sino_event.74.f: "These artifacts do not speak. But as dusk falls over the corner tower, if you press your ear against the gold bricks of the Hall of Supreme Harmony, you can hear the lingering incense in the Xuande furnace breathing. If you whisper to the copper cranes in the Qianqing Palace, the gold leaf at the tips of their wings will gently tremble, shaking the moonlight of three hundred years ago, scattering it into your open palm."
sino_event.74.a: "Wonderful!"


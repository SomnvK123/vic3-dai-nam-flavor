je_japan_invade_china:0 "The Rise of Fascist Japan"
je_japan_invade_china_reason:0 "Our military power grows every day, with the army gradually consolidating control of the central authority, and the influence spreading within the country. The emperor's will is clear, and the nation is ready for expansion. The situation in Asia has aligned in our favor, and Japan is set to emerge as a dominant power in the East."

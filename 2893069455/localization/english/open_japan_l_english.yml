je_jap_shougun: "Sakoku (Closed Country)" 
je_jap_shougun_reason: "[SCOPE.gsInterestGroup('shougun_ig').GetName] ruled [SCOPE.GetRootScope.GetCountry.GetName] with a self-sufficient natural economy, and to strengthen this economic form and prevent external economic forces, [SCOPE.gsInterestGroup('shougun_ig').GetName] chose sakoku (closed country) policy.\n\nAt that time, Western colonial powers were expanding globally, and [SCOPE.gsInterestGroup('shougun_ig').GetName] feared Japan would become a target of their aggression. Thus, a closed-country policy was adopted to prevent external threats.\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger different #tooltippable;tooltip:[Country.GetTooltipTag],dsk_japan_tooltip_advance #o historical events#!#!"
dsk_japan_tooltip_advance:0 "1.#v Violation of Sakoku#!: If any leader within the government has an attitude toward [GetLawType('law_isolationism').GetName] greater than #v Neutral#!, any trade [concept_law] that violates #o Sakoku#! will be declared in violation of national policy!\n2.#v Black Ships Incident#!: In 1853, if [GetLawType('law_isolationism').GetName] is still maintained, and any [concept_great_power] has interests in #yellow Japan#!\n3.#v Sonno Joi#!: If [je_meiji_restoration] is not completed and [GetLawType('law_isolationism').GetName] has been abolished.\n4.#v Sino-Japanese Armistice#!:[concept_battle_of_east_asia] When it has not yet started, there will be an indefinite [concept_truce] that always applies to both countries"
je_jap_shougun_fail_tt: "Overthrow [SCOPE.gsInterestGroup('shougun_ig').GetName], the Taisei Hōkan!"
open_japan.2.t:0 "Violation of Sakoku" 
open_japan.2.d:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName]'s [Concept('concept_ruler','$RULER_TITLE_SHOGUN$')][ROOT.GetCountry.GetRuler.GetFirstName] opposed the proposal on the grounds of violating [ROOT.GetCountry.GetAdjective] national policy, as formulated under [SCOPE.sLaw('current_law_scope').GetName]."
open_japan.2.f:0 "“During the reign of the Qing Emperor Daoguang, the British used opium as a weapon, breaking Guangzhou, capturing Nanjing, forcing an unequal treaty, ceding Hong Kong, and demanding compensation. The nature of foreign barbarians is to take a little and demand more. If we open the ports, they will use fleets to back them up, demand concessions, and plunder resources. In less than ten years, our country will be reduced to a second Qing Dynasty.” — Zé Zhèngzhìzhái"
open_japan.2.a:0 "Japan is vast and rich, with abundant crops and self-sufficient cloth and silk, needing no foreign trade."
open_japan.3.t:0 "Sonno Joi" 
open_japan.3.d:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName] has no right to represent [ROOT.GetCountry.GetAdjective] in foreign treaties. Only [concept_japanese_emperor] can unite the nation to expel foreigners."
open_japan.3.f:0 "“The [concept_japanese_emperor] is of divine descent, ruling by the will of heaven, unchanged for eternity. Though [ROOT.GetCountry.GetRuler.GetLastName] received the trust of the Taiko (Toyotomi Hideyoshi) and [Concept('concept_ruler','$RULER_TITLE_MIKADO$)], now the foreigners knock on our door, and they do not rise to refuse them. They instead use the excuse of ‘insufficient national power’ to secretly sign treaties with them and give away our rights. This is ‘betraying the emperor and deceiving the people.’ The emperor’s power has been lost to his ministers, and the country will not survive; only by restoring the emperor’s direct rule and calling for the entire nation to unite and expel the foreigners is the right way.” — Yoshida Shōin"
open_japan.3.a:0 "Compromise means national destruction. Even if the national power is insufficient, we must expel the foreigners by force to show the world the righteousness of our cause."
no_shougun_anymore_tt:0 "A new [ROOT.GetCountry.GetAdjective] will become a rising power in East Asia."
je_respect_king:0 "Respect the Emperor and Expel Foreigners"
je_respect_king_tt:0 "In the name of expelling foreigners, the real objective is to overthrow the shogunate."
je_respect_king_a_tt:0 "In the name of expelling foreigners, the real objective is to overthrow the shogunate."
je_respect_king_b_tt:0 "In the name of expelling foreigners, the real objective is to overthrow the shogunate."
je_respect_king_reason:0 "By the end of the Edo period, the domestic social contradictions of [SCOPE.GetRootScope.GetCountry.GetName] had reached a tipping point. Frequent wars between the daimyōs resulted in heavy casualties and loss of land, further exacerbating social tensions. Meanwhile, the economic invasion by Western capitalist countries brought Japan to the brink of an economic crisis.\nA crisis against the rule of [SCOPE.gsInterestGroup('shougun_ig').GetName] was inevitable!\n$TOOLTIP_DELIMITER$\nThis [concept_journal_entry] will trigger different #tooltippable;tooltip:[Country.GetTooltipTag],dsk_japan_sonnou_joui_tooltip_advance #o historical events#!#!"

modifier_xinwenhua: "Initiating the New Cultural Movement"
je_xinwenhua: "New Cultural Movement"
je_xinwenhua_reason: "When the smoke of the Xinhai Revolution had faded into the morning mist, the flag that tore apart the imperial system still fluttered in the wind. A group of intellectuals, some in long robes and others in western suits, gathered on the boundary between old traditions and new ideas, igniting another fire—this was the New Cultural Movement. It aimed to eradicate the Confucian customs that had rooted themselves for over two thousand years and sow the seeds of science and democracy where the old order once stood. At this time, China, like a giant just freed from shackles, realized that its body was still tangled in countless old ropes. The plaques of Confucius' temple swayed in the streets, and the teachings of the 'Three Obediences and Four Virtues' still choked young women’s throats. Meanwhile, Western warships had already battered open the gates of the country, yet no one taught the people how to stand firm on the words 'freedom' and 'equality.' Thus, Chen Duxiu, pen in hand, cut a path in the pages of 'New Youth': 'To support Mr. Democracy, one must oppose Confucianism, old rituals, and old politics.' Lu Xun, with his pen soaked in blood and tears, cast the shadow of Ah Q in the moonlight of the village, reflecting the sickness in every numbed soul. #N Upon completing this [concept_journal_entry], we can establish the C9 Alliance#!"

je_tufei: "Bandit Problem"
je_tufei_reason: "Bandits, theft, and fraud are the three major problems in society, and among them, banditry is the worst. Minor acts like highway robbery, or even worse, home invasions, kidnappings, rape, and arson, plague the people. Now that China has entered the era of freedom and democracy, I will not tolerate such human-made disasters on our land!"

new_smzy_modifier: "New Three People's Principles"
new_smzy_modifier1: "Anti-Imperialism"
new_smzy_modifier2: "White Terror"

sino_event.22.t:0 "Border Crisis"
sino_event.22.d:0 "#yellow The Khokand Khanate#! officer [SCOPE.sCharacter('gaixin').GetFirstName] (Han name: #yellow Aghu Ba#!), holding hostage the descendants of Hezhuo, #yellow Busuluke#!, leads an army to invade southern Xinjiang. They first advanced on and besieged #yellow Kashgar#!."
sino_event.22.f:0 "Aghu Ba took advantage of the chaotic situation in southern Xinjiang (ethnic and religious conflicts, weakened Qing rule), using military conquest and diplomatic deception to occupy Yengisar, Shule, Yarkand, Hotan, and other areas. In 1867, he declared the establishment of the 'Zhedeshar Khanate' (meaning 'Seven City Khanate') and controlled the entire southern Tianshan region. This severely eroded [SCOPE.GetRootScope.GetCountry.GetName]'s traditional influence and territorial control in Central Asia. At the same time, [SCOPE.sCountry('rus_scope').GetAdjective] seized the opportunity amidst internal turmoil and directly occupied Ili."
sino_event.22.a:0 "Xinjiang has belonged to China since ancient times, and we cannot sit idly by."

zhongnan_alive:0 "If #green #b [SCOPE.sCountry('bur_scope').GetAdjective] controls three or more provinces#! in our sphere of influence, we will succeed in the Southeast Asia region, but our relationship with #yellow #b [SCOPE.sCountry('gbr_scope').GetAdjective]#! will worsen."
zhongnan_no:0 "If [SCOPE.sCountry('bic_scope').GetAdjective] or [SCOPE.sCountry('gbr_scope').GetAdjective] controls #green #b [SCOPE.sCountry('bur_scope').GetAdjective] three or more provinces#!, we will become #N weak#! in Southeast Asia."
je_zhongnan_reason:0 "As [SCOPE.sCountry('bic_scope').GetName]'s position on the Indian subcontinent stabilizes, we foresee that they will soon unify the various states of India. However, now their eyes have turned to [SCOPE.sCountry('bur_scope').GetName], which lies just across the mountain range from them. Once they successfully conquer Burma, [SCOPE.GetRootScope.GetCountry.GetName]'s southwestern borders will be directly connected to them, and the border issues in the southwestern mountain areas will become a major constraint. Thus, we have reason to act first, deploying strategically in #green #b Burma#! and preventing them from expanding eastward."

sino_event.21.t:0 "National Policy: Rebuild the Silk Road"
sino_event.21.d:0 "The ancient #yellow Silk Road#!, linking the East and West, crossing over thousands of miles and connecting nations, has faded over time. Yet, the great empire never forgets its mission.\n\nRebuilding the Silk Road is not just for commerce but also for the spread of culture and ideas.\n\nToday, we shall write a new chapter, leading the winds of the East across the Asian and European continents, until they reach the horizon."
sino_event.21.f:0 "As the western winds bring new influence, the brilliance of the East shall shine once more. Through the Silk Road, connecting countless countries, [ROOT.GetCountry.GetAdjective] will radiate a powerful glow on the global stage."
sino_event.21.a:0 "Like a pearl embedded in the Silk Road, shining brightly and attracting nations from all over the world."

sino_event.23.t:0 "National Policy: Confirm the Ownership of 'Wild Man Mountain'"
sino_event.23.d:0 "An agreement from #o 1600 years#! ago"
sino_event.23.f:0 "In the year 225 AD, when the Shu Han rebellion broke out in Nanzhong, Zhuge Liang led an army in three routes to pacify the three prefectures. #v 'In the third year of the spring, Liang led the army south, and by autumn, the region was pacified.'#!\n\nAt the site of Huluwang, #yellow Zhuge Liang#! signed an agreement with the ancestors of the #yellow Wa people#!. The Wa people would guard the southern gate of the Han Dynasty, and the Shu Han would offer material and military protection.\n\nUnder Zhuge Liang’s help, the Wa people, who were still practicing slash-and-burn agriculture, introduced advanced farming techniques from the Central Plains, greatly improving their living standards. The Wa people were deeply grateful and pledged allegiance, vowing to protect the southwestern frontier. The vow of 'Serving the ancestors and the elders' became the proudest saying of the Wa people. Now, let’s bring them back to the embrace of the great motherland!"
sino_event.23.a:0 "Dear #yellow Wa people#!, you are the golden dragon's black eyes!"

sino_event.25.t:0 "National Policy: Delimit the 'Gao Zhikai' Line"
sino_event.25.d:0 "#o The Gao Zhikai Line#! is not 'fictional,' but a historical fact. 1400 years ago, we reached the Ganges and erected a monument."
sino_event.25.f:0 "In the 21st year of the Tang Dynasty (647 AD), #yellow Wang Xuance#! embarked on his second mission to the kingdom of Magadha. However, the king had already passed, and the power-hungry official, #yellow Aro Nashun#!, declared himself king. He was afraid of the Tang Empire’s retribution, so he ambushed the Tang mission. Most of the mission was killed, but Wang Xuance and his deputy, #yellow Jiang Shiren#!, managed to escape. Wang Xuance said: 'A gentleman must avenge a grudge, a true man should follow the example of Ban Chao, and the Tang Empire cannot be humiliated by a foreign tribe.'"
sino_event.25.a:0 "[ROOT.GetCountry.GetAdjective] and [SCOPE.sCountry('bic_scope').GetAdjective] should be divided by the Ganges River! North of the Ganges should belong to [ROOT.GetCountry.GetAdjective]!"
china_borders.13.t:0 "National Policy: Delimit the 'Eleven-Dash Line'"
china_borders.13.d:0 "#o The 'Eleven-Dash Line'#!, is the strategic barrier of [ROOT.GetCountry.GetAdjective] in the South China Sea. The area is vast, rich in resources, and crucial for the nation’s future. In the 19th century, [ROOT.GetCountry.GetAdjective] suffered from constant interference by [concept_great_power], and its maritime borders were considered unstable. Today, the empire shall rise and defend every inch of its sea territory to ensure its national interests remain protected. Delimiting the 'Eleven-Dash Line' ensures the country’s position in global maritime trade, safeguarding the future of its economy and security."
china_borders.13.f:0 "As early as the Qin and Han Dynasties, [ROOT.GetCountry.GetAdjective] had already made clear records and jurisdiction over the South China Sea. Over successive dynasties, China exercised effective governance and development over the islands of the South China Sea. From generations of fishermen to official inspections and conquests, countless historical facts show that the South China Sea is an inseparable part of China’s territory. The South China Sea is not only a treasure trove of resources but also a crucial crossroads for East-West exchanges. The humiliation of the past makes us deeply pained. Today, the 'Eleven-Dash Line' is established to defend the sovereignty of this sea and prevent future interference from [concept_great_power]."
china_borders.13.a:0 "It is forever mine, and it will remain so!"

sino_event.27.t:0 "National Policy: Reestablish Jiaozhi County"
sino_event.27.d:0 "Since the Qin and Han Dynasties, the #yellow Jiaozhi region#! has been an integral part of [ROOT.GetCountry.GetAdjective]'s territory."
sino_event.27.f:0 "After Emperor Qin Shi Huang unified the Six Kingdoms, he dispatched a large army to conquer the Hundred Yue tribes and included the #yellow Jiaozhi region#! into the Qin Empire, establishing the Xiang Commandery for governance.\n\nDuring the reign of Emperor Wu of the Han Dynasty, the governance of this area was further strengthened, and the #yellow Cishi Department#! was set up to administer several counties, spreading Central Plains culture to the local population.\n\nFor the following centuries, the #yellow Jiaozhi region#! remained an inseparable part of [ROOT.GetCountry.GetAdjective], tightly connected with the Central Plains politically, economically, and culturally.\n\nDespite later upheavals, the region's connection with the Central Plains was never severed. Its production methods, ceremonial systems, and culture have always been influenced by the Central Plains. Now, to restore the historical system and strengthen governance in border areas, reestablishing #yellow Jiaozhi#! County is an essential step."
sino_event.27.a:0 "Implement this national policy"

sino_event.27.b:0 "Veto this national policy"

monument_stage_completed_desc:0 "#red The People’s Heroes Will Be Immortal#!"
pm_default_building_Monument_to_Heroes:0 "Monument to the People’s Heroes"
pmg_base_building_Monument_to_Heroes:0 "Monument to the People’s Heroes"
building_Monument_to_Heroes:0 "Monument to the People’s Heroes"
Monument_to_Heroes_technologies:0 "Monument to the People’s Heroes"
Monument_to_Heroes_technologies_desc:0 "To commemorate the people’s heroes who bravely sacrificed for the independence and freedom of the nation, struggling against both domestic and foreign enemies since the 20th year of Emperor Daoguang (1840), in battles for national liberation and the pursuit of the happiness of the people."
je_Peoples_Heroes_Monument:0 "Monument to the People’s Heroes"
je_Peoples_Heroes_Monument_reason:0 "Since the Opium War, countless heroes have fought and shed blood to resist domestic and foreign enemies and to fight for national independence and the people's freedom and happiness—whether through the blade in the streets of Sanyuanli, the sinking of battleships in the Battle of the Yellow Sea, the gunfire at Wuchang, the shoes on the Long March crushing ice and snow, or the oars cutting through the waves in the Yangtze River Campaign.\n\nThey remain nameless, but they all played a part in carrying this nation to rebirth. Today, in the center of the square, a monument built from thousands of stones is about to engrave their names in eternity."
Peoples_Heroes_Monument_modifier:0 "The People’s Heroes Will Be Immortal"

design_selection:0 "Design the Monument to the People’s Heroes"
design_selection_desc:0 "Commemorate the arduous journey of the Chinese people who fought in the blood and sweat of struggles since the Opium War in Daoguang's 20th year (1840)."
requires_monument_progress_points_tt:0 "Requires consuming 100 progress points"
Peoples_Heroes_Monument_modifier:0 "The People’s Heroes Will Be Immortal"

sino_event.133.t:0 "The Emperor’s Compromise"
sino_event.133.d:0 "The outbreak of the National Protection War has caused unrest in many southern provinces, with tendencies to separate from the central government. [ROOT.GetCountry.GetRuler.GetFullName] has made a compromise, abandoning the idea of imperial restoration."
sino_event.133.f:0 "The proponents of imperialism initially sought to consolidate the national foundation. However, the opponents of imperialism have also expressed their political views. The matter is now acknowledged and the case has been withdrawn. If there is any further disturbance in the regions, this will be used against them. The President will not stand idle while the nation falls into turmoil. —[ROOT.GetCountry.GetRuler.GetFullName]"

sino_event.136.t:0 "National Protection War"
sino_event.136.d:0 "[ROOT.GetCountry.GetRuler.GetLastName] announced acceptance of the imperial system. This retrograde action provoked a strong anti-imperialist resistance led by General [SCOPE.sCharacter('ecchi_chi_cai_e_character_benefactor').GetFullName]."
sino_event.136.f:0 "General [SCOPE.sCharacter('ecchi_chi_cai_e_character_benefactor').GetFullName], the Supreme Commander of the National Protection Army, swears to the people of the nation: '[ROOT.GetCountry.GetRuler.GetLastName] has usurped the throne and is a traitor to the nation. The five ethnic groups are united in the republic, and [ROOT.GetCountry.GetRuler.GetLastName] has become the enemy of the nation. We will fight as one, without distinctions of race.'"

concentration_camp_modifier:0 "Concentration Camps"


sino_event.222.t:0 "[SCOPE.sState('japs_state').GetName] Massacre"
sino_event.222.d:0 "[SCOPE.sCharacter('empire_character').GetFullName] and [SCOPE.sCharacter('fascist_character').GetFullName] have allowed their soldiers to run rampant in [SCOPE.sState('japs_state').GetName]."
sino_event.222.f:0 "The smell of blood mixed with decay is thick and unbearable. Ravens circle above, occasionally swooping down to pick up a piece of broken bone still clinging to flesh. The puddles of blood have turned black, with layers of flies gathering. The eyes of the dead have popped out, covered in a swarm of flies, with only a small patch of white still visible, staring up at the gray sky.\n\nAmong the rubble, half a body remains wedged between stones, its chest cavity blown open by artillery, ribs sticking out like the teeth of a comb. Fragments of flesh are splattered on the walls, dried to dark brown splotches, resembling a gruesome painting. Occasionally, a half-dead soldier moans from under the piles of corpses, his throat choked with blood, his every breath bringing more blood, yet no one can move the beams crushing his legs."
sino_event.222.a:0 "Our hands are stained with blood."

no_fascist_character:0 "#v To prevent such inhumane acts from continuing, [SCOPE.sCharacter('empire_character').GetFullName] and [SCOPE.sCharacter('fascist_character').GetFullName] must be removed from the government#!"
sino_event.223.t:0 "[SCOPE.sState('japs_state').GetName] Concentration Camps"
sino_event.223.d:0 "[SCOPE.sCharacter('empire_character').GetFullName] and [SCOPE.sCharacter('fascist_character').GetFullName] have allowed their soldiers to build concentration camps in [SCOPE.sState('japs_state').GetName] to systematically execute prisoners of war."
sino_event.223.f:0 "The barbed wire glistens like the scales of a giant serpent, casting a cold light under the gray-yellow sky. Each spike is caught with half-dried rags — the torn prison clothes of the captives. The searchlights on the watchtower sweep over the yard, cutting the wriggling figures into fragments. Emaciated bodies curl up, their striped prison uniforms hanging loosely, like ragged burlap sacks on withered branches.\n\nThe calls during roll call cut through the dawn, as prisoners march past the incinerator chimney, the smoke billowing out day and night, turning the sky a dirty leaden color. Some stare at the chimney, their eyes dim like nearly extinguished oil lamps, their fingers absentmindedly brushing over their chests—where once hung family photographs, now reduced to a worn cloth mark."
sino_event.223.a:0 "Our hands are stained with blood."


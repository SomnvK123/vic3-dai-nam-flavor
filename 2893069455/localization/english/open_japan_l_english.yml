sino_event.113.t:0 "Respect the Emperor and Expel Foreigners, Return Power to the Emperor!"
sino_event.113.d:0 "The reform faction, led by the lower and middle ranks of [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName], gradually gathered in economically developed regions like Satsuma, Choshu, Tosa, and Hizen. They raised the slogan #red “Respect the Emperor and Expel Foreigners”#!, which was essentially to overthrow [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]'s rule!"

sino_event.113.f:0 "The rule of [SCOPE.gsInterestGroup('shougun_ig').GetName] over Japan collapsed in an instant, like a dream.\nSamurai, merchants, and daimyōs rushed to the streets, all rallying behind the emperor as the new ruler of Japan.\n\n“Looking at the Qing Empire as an example: Emperor Daoguang initially wanted to resist the British, but due to the cowardice of his ministers, he ceded land and paid compensation. Now the foreigners view China as prey. If our country follows the Qing’s example of ‘temporary tolerance,’ the foreigners will demand concessions, control tariffs, and station troops around the capital. In five years, [Concept('concept_ruler','$RULER_TITLE_MIKADO$)] will be a prisoner of the foreigners! The so-called ‘temporary retreat due to lack of strength’ is a betrayal of the country. Though our ships and cannons are inferior, if we unite as one and resist to the death, the foreigners, however strong, will retreat. This is not recklessness, but the great righteousness of protecting the country! The various clans each have their own interests, the shogunate's authority has been lost, and only [Concept('concept_ruler','$RULER_TITLE_MIKADO$)] can command the whole country.”"
sino_event.113.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] will open a new chapter in history."


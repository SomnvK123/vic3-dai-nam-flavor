je_china_and_japan: "Sino-Japanese Relations"
je_china_and_japan_reason: "This [concept_journal_entry] has a special #v #v [concept_mechanism_chi_jap]#!#! (Click to read)\n\nAcross the sea, an entirely independent Asian nation, whose appearance had not changed for thousands of years, is starting to subtly transform. Perhaps it should be called an accident, but since then, Western technology and thoughts have gradually entered this nation. Social changes and technological progress in [SCOPE.sCountry('jap_scope').GetName] are taking place, and it is foreseeable that, in the near future, [SCOPE.sCountry('jap_scope').GetName] will become a significant force in Asia.\n\nOur relationship with them and future plans will soon be on the agenda. They may become our ally in defending Asia, or will the Western powers once again return to Asia as a bridgehead?"

concept_mechanism_chi_jap: "Mechanism"
concept_mechanism_chi_jap_desc: "The following conditions will deeply impact #v diplomatic situation#!:\n$TOOLTIP_DELIMITER$\n#bold 1· When negotiations with #red Japan#! have not yet broken down and [concept_battle_of_east_asia] has not started, an indefinite [concept_truce] will apply to both countries.\n$TOOLTIP_DELIMITER$\n2· Choosing #yellow Break Sino-Japanese Diplomatic Ties#! will lose all subsequent #yellow Sino-Japanese Relations#! [concept_journal_entry].\n$TOOLTIP_DELIMITER$\n3· [concept_battle_of_east_asia] will be triggered when [SCOPE.sCountry('jap_scope').GetName] has completed the Meiji Restoration and the relations between the two countries fall below $relations_amicable$ [concept_relations].\n$TOOLTIP_DELIMITER$\n4· This [concept_journal_entry] will trigger different endings depending on which side wins. The Sino-Japanese friendship ending will remove #red Japan#!'s logs regarding China."

je_gaozhikai_line: "National Policy: Establish the 'Gao Zhikai' Line"
je_gaozhikai_line_reason: "In the 21st year of the Tang Dynasty's Zhenguan era (647 AD), #yellow Wang Xuance#! made his second mission to the Middle Kingdom of Magadha. At that time, the king of Magadha had died, and the local ruler #yellow Aro Na Shun#! proclaimed himself the king. The other lords refused to comply. When the Tang envoys arrived, #yellow Aro Na Shun#! feared the Tang's punishment for his improper rule, so he ambushed the Tang mission. The Tang envoys were caught off guard, and except for #yellow Wang Xuance#! and his deputy #yellow Jiang Shireng#!, the rest of the team was killed. Escaping from prison, #yellow Wang Xuance#! said to #yellow Jiang Shireng#!: \n\n#v "It is unworthy of a gentleman to leave an enemy unpunished. A true man should follow the example of Ban Chao, how could the mighty Tang allow an outside tribe to insult us?"#!\n\nThe two discussed and decided not to return to #yellow Chang'an#! to report but instead crossed the Ganges River directly toward #yellow Himalayas#!.\n\nLater, #yellow Wang Xuance#! broke through Chabo and Luocheng in three days. #yellow Aro Na Shun#! fled hastily, planning to cross the Ganges and head to Eastern India. #yellow Wang Xuance#! pursued him, capturing all of Middle India and taking #yellow Aro Na Shun#! by the Ganges River. #yellow Wang Xuance#! left #yellow Aro Na Shun#! to be sent back to Chang'an as a prisoner, while the remaining 3,000 people were all beheaded to avenge the Tang mission.\n$TOOLTIP_DELIMITER$\n[COUNTRY.GetAdjectiveNoFlag] and [SCOPE.sCountry('bic_scope').GetAdjective] should be separated by the Ganges! The lands north of the Ganges should belong to [COUNTRY.GetAdjectiveNoFlag]!"


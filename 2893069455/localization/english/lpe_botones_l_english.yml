l_english:
 tratado_de_amistad_name: "Sign a Friendship Treaty"
 tratado_de_amistad_desc: "We can sign a friendship treaty with any of the available Hispanic American nations."
 tratado_de_amistad_tt: "We have not signed a #bold friendship and cooperation treaty#! in #bold 5 years#!"

 luchar_contra_pirateria_button_name: "Fight Against Piracy"
 luchar_contra_pirateria_button_desc: "We cannot allow these scoundrels to continue roaming freely through the seas of Indonesia. We must put an end to their activity."

 stop_luchar_contra_pirateria_button_name: "Stop Fighting Piracy"
 stop_luchar_contra_pirateria_button_desc: "The endless war against piracy is draining our treasury. We must put a stop to it if we don't want to end up in misery."

 ferrocarril_cubano_but_name: "Cuban Experiment"
 ferrocarril_cubano_but_desc: "There are many voices clamoring for us to support our Captain General in Cuba in his endeavor to build the first [GetBuildingType('building_railway').GetName] line on the island."
 ferrocarril_cubano_but_tt: "Once completed, we will make a great leap forward in #bold [concept_technology|l] of $railways$#!"

 expedicion_gomez_but_1: "There is still no one tasked with hunting them down"
 expedicion_gomez_but_11: "There is a [concept_military_formation] with at least 10 [Concept('concept_unit','$concept_units$')], led by a [concept_general]"
 expedicion_gomez_but_name: "Hunt Down the Expedition"
 expedicion_gomez_but_desc: "We must stop the incursion. The longer the [concept_general] roams unopposed, the more discredit it brings to the regime."

 #compra_territorio: "Territorial Adjustment"
 #compra_territorio_desc: "Through meticulous negotiation with one of the [Concept('concept_country','states')] within the archipelago, we could achieve an adjustment of borders."
 #compra_territorio_ct: "A [concept_protectorate|l] has a [concept_state|l] with fewer than #bold 200,000 #![Concept('concept_pop', 'inhabitants')] in the archipelago"

 #incorpora_territorio: "Territorial Integration"
 #incorpora_territorio_desc: "It's time for one of the autonomous [Concept('concept_ruler','rulers')] within the archipelago to be integrated into [SCOPE.sCountry('phim_scope').GetName]. We can incorporate it directly regardless of the number of [Concept('concept_pop', 'inhabitants')]."
 #incorpora_territorio_ct: "A [concept_puppet|l] or [concept_dominion|l] controls a state within the archipelago"

 renunciar_reclamos_hispanoamerica_name: "Renounce Territorial Claims"
 renunciar_reclamos_hispanoamerica_desc: "It is time to accept the reality that we will never be able to recover the territories of Hispanic America by force. We must look to the future and begin working on good relations between our peoples."
 renunciar_reclamos_hispanoamerica_tt: "[ROOT.GetCountry.GetName] #bold is not#! in a [concept_diplomatic_play|l] against any old territory of [ROOT.GetCountry.GetAdjectiveNoFormatting] in #bold Hispanic America#!"
 lider_no_tiene_ideologia_jinjoista: "Their [concept_leader|l] #bold does not#! have the [concept_ideology|l] [GetIdeology('ideology_jingoist_leader').GetName]"
l_english:
 car.1.t: "Expedition to the South"
 car.1.d: "[SCOPE.sCharacter('gomez_damas').GetFullName] has initiated a march through the peninsula, seeking to divert the attention of the Cristino forces and rally troops to the cause. He is currently in [SCOPE.sState('estado_expedicion_gomez').GetName]"
 car.1.f: "The expedition took place in the northern part of the country and aimed to advance southward to support the [SCOPE.sCountry('spa_car').GetAdjective|l] troops.\nThe expedition began in August 1836 and saw some initial successes, advancing through the regions of La Rioja and Navarre, where it managed to recruit new supporters for the [SCOPE.sCountry('spa_car').GetAdjective|l] cause. The defeat at Aranzueque was a major blow to the [SCOPE.sCountry('spa_car').GetAdjective|l] cause and to [SCOPE.sCharacter('gomez_damas').GetLastName]'s hopes of advancing southward. After this defeat, the expedition fell apart, and [SCOPE.sCharacter('gomez_damas').GetLastName] was forced to retreat to the northern peninsula."
 car.1.a: "Good luck"
 car.1.tt: "[SCOPE.sCharacter('gomez_damas').GetFullName] will be unavailable for the duration of the expedition"

 car.2.t: "Flight of [SCOPE.sCharacter('lider_carlista_exiliado').GetFullName]"
 car.2.d: "After hearing the news of a new Carlist uprising in [SCOPE.sCountry('spa_scope').GetName], [SCOPE.sCharacter('lider_carlista_exiliado').GetFullName] quickly returned to [SCOPE.sCountry('car_scope').GetName] to reclaim his legitimate title as king."
 car.2.f: "Carlos VII crossed the border again on July 16, 1873, setting the capital of [SCOPE.sCountry('car_scope').GetName] in Estella. A stable government was established in the city, with ministerial portfolios: government, justice, education, provincial councils, press, and war."
 car.2.a: "Fly high, infante"

 car.3.t: "Flight of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]"
 car.3.d: "Faced with the imminent defeat in the [concept_war|l] of [SCOPE.sWar('guerra_carlista_scope').GetName], many high-ranking officers have proposed to [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to abandon the [concept_country|l] and march into [concept_exile|l]."
 car.3.d_infante_huido: "Faced with the imminent defeat in the [concept_war|l] of [SCOPE.sWar('guerra_carlista_scope').GetName], many high-ranking officers have proposed to [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to abandon the [concept_country|l] and march into [concept_exile|l], following the steps of the [concept_heir|l] [SCOPE.sCharacter('heredero_scope').GetFullName]."
 car.3.f: "Many of the high-ranking officers have begun to flee into exile, fearing reprisals from the liberals.\n\nThe lack of forces and the turmoil within the court of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] forced them to sign the peace in 1839, despite some Carlist factions and Don Carlos himself not accepting the Treaty of Vergara, having to go into exile, awaiting a new opportunity."
 car.3.a: "A king never abandons his people in times of need."
 car.3.b: "We will return stronger."
 
 car.4.t: "Carlist Uprising"
 car.4.d: "After a series of [SCOPE.sCountry('car_scope').GetAdjective] victories, we can influence some Isabeline garrisons to join our cause."
 car.4.f: "In the Maestrazgo mountains, following the death of Ferdinand VII in September 1833, as the liberal state began to take shape, many Carlist leaders sought refuge far from major cities and strategic communication routes. These included notable figures such as Carnicer, Quílez, Cabrera, Serrador, and Llagostera, who operated in Aragón, Catalonia, or Valencia."
 car.4.a: "We need to put pressure on the Maestrazgo mountains"
 car.4.a_tt: "This will pave the way for a future uprising to lay siege to #bold Barcelona#!"
 car.4.b: "We will consolidate our positions in Aragón"
 car.4.c: "It’s time to lay siege to Barcelona"

 car.5.t: "$car.4.t$"
 car.5.d: "After a series of [SCOPE.sCountry('car_scope').GetAdjective] victories, they have managed to influence some Isabeline garrisons to join their cause."
 car.5.d_maestrazgo: "The [SCOPE.sCountry('car_scope').GetAdjective] have rallied their followers around the Maestrazgo mountains and have started an armed uprising against the [ROOT.GetCountry.GetAdjective] regime."
 car.5.d_aragon: "The [SCOPE.sCountry('car_scope').GetAdjective] have incited isolated loyalist garrisons in [SCOPE.sState('aragon_espa').GetStateRegion.GetName] to join their cause."
 car.5.d_cataluna: "After consolidating their position in [SCOPE.sState('aragon_espa').GetStateRegion.GetName], rural garrisons in [SCOPE.sState('catalunna_espa').GetStateRegion.GetName] have sided with the [SCOPE.sCountry('car_scope').GetRuler.GetPrimaryRoleTitle], except for the city of Barcelona."

 car.5.f: "$car.4.f$"
 car.5.a: "It will be harder to penetrate their territory"
 car.5.b: "We trust in the garrison of the city of Barcelona"
 car.5.c: "This endangers the capital"

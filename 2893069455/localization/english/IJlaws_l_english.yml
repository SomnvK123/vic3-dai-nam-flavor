l_english:
law_IJ_mikado: "Mikado system"
law_IJ_mikado_desc: "It refers to a state system in which the Mikado is the source of authority for monarchy or political control, and calls for the rule of the Mikado of the Mansei ikkei derived from the myths of the Kojiki and Japan Shoki, and that it is the national body of the Japan, that is, the unchanging national power."
law_IJ_constitution: "Imperial Diet"
law_IJ_constitution_desc: "The Imperial Constitution of the Great Japan Established the Imperial Diet.The powers of the Imperial Diet can be divided into legislative powers, financial powers, general state affairs, and parliamentary matters, but their deliberative powers were limited by the Mikado's sovereignty, the Mikado's prerogative, and the Imperial Household autonomy."
law_IJ_rights: "Constitution of the Great Japan Empire"
law_IJ_rights_desc: "「The Empire of Japan is ruled by the Emperor of the Ten Thousand Generations」 and 「The Emperor is the head of state who holds the ruling power」 stipulates that the Emperor is the sole ruler and that the people are subjects under the Emperor's rule."
law_IJ_kami: "Yaoyorozu no Kami"
law_IJ_kami_desc: "Yaoyorozu no Kami is a general term for the existence of many gods in Shintoism, and does not represent the actual number. The first reference in the literature is Yaoyorozu no Kami, Heavenly An's Riverbank Shrine Gathering Hite in the Heavenly Iwato section of the first volume of the Kojiki."
law_IJ_secularization: "secularized religions"
law_IJ_secularization_desc: "The societal system and general constraints on human life that are regarded as "sacred" in society will be replaced by forms of "secularized" regulation."
law_IJ_taisei_desc: "The Taisei bureaucracy is a central power structure created by the new government, which dismantled the shogunate system, with the aim of governing the whole country while advocating a return to the Ritsurei old system."
law_IJ_cabinet: "Cabinet System"
law_IJ_cabinet_desc: "The cabinet is the highest governing body responsible for the administration of the country."
law_IJ_army: "Conscription"
law_IJ_army_desc: "Between heaven and earth, there is no tax as a thing. As human beings, we must do our utmost and reward the country. Blood tax in honor of Nishijinyuki. It is a supposé to reward the country with its blood."
law_IJ_highpolice: "Special High Police"
law_IJ_highpolice_desc: "Under the imperial state, the organization and activities of the police responsible for the control of social movements and ideas opposed to the state. The political police, which was responsible for maintaining national security, was called the higher police."

law_IJ_CI: "Cultivation-Industry"
law_IJ_CI_desc: "In order to counter the external pressure of advanced capitalist countries, modern industrial technology is transplanted to protect and nurture capitalist production methods, the transition to a capitalist mode of production, and the industrial protection and development policy developed by the government. It was an important policy along with the Rich-Strong and Civilization-Enlightenment."
law_IJ_DeAsia: "De-Asia"
law_IJ_DeAsia_desc: "De-Asia is to leave Asia and join the ranks of Europe. The neglect of Asia and the emphasis on Europe have been the Japan trends since the return of the great government."
law_IJ_tax: "Land tax revision"
law_IJ_tax_desc: "The land tax reform abolished the tribute system based on the stone high system in the early modern period, and imposed a fixed amount of land concession on the premise of private land ownership."
law_IJ_RS: "Rich-Strong"
law_IJ_RS_desc: "Since the end of the 18th century, the sense of crisis over the advancement of Western powers has given rise to claims such as the theory of maritime defense and the theory of rich countries and strong armies, which are combined with the theory of the Sonwang and the Emperor of the Crown and strengthen the desire for a unified state.It was an important policy along with the Cultivation-Industry and Civilization-Enlightenment."
law_IJ_CE: "Civilization-Enlightenment"
law_IJ_CE_desc: "The phenomenon of civilization and enlightenment became popular as a westernization of life, such as soap bubbles, lamps, umbrellas, shappo, clothes, Western-style buildings, gas lamps, schools, newspapers, magazines, and even Japanese-Western architecture and beef hot pots. It is an important policy along with the Cultivation-Industry and the Rich-Strong"
law_IJ_police: "Metropolitan Police Department"
law_IJ_police_desc: "The Metropolitan Police Department is an important institution for maintaining public order, and the concept of police is divided into two categories: administrative police and judicial police, and the administrative police occupy the central position of police activities [to prevent people from harming and ensuring peace in the world]."
law_IJ_education: "Education Ordinance"
law_IJ_education_desc: "From the standpoint of correcting the adverse effects such as the increase in the economic burden on local people due to the implementation of the school system, the separation of subject content from people's lives, and the neglect of local finances, and to emphasize the actual situation of local governments, the Ministry of Education revised the centralized education policy and gave a large amount of educational administrative authority to local authorities."
law_IJ_Isei: "Universal health care system"
law_IJ_Isei_desc: "We have strengthened the top-level design of the universal medical security system and made breakthroughs in the reform and development of medical security, which has played an important role in alleviating the problem of difficult and expensive medical treatment for the masses. The institutional system is more perfect."

law_corporate_council_desc: "The Economic Council is the highest governing body responsible for the administration of the country."
law_one_party_state_desc: "People's Daily: This is the image of the new type of dictator in the Nationalist Party, completely different from the appearance of the right-wing fascists that the Americans used to be accustomed to seeing. The latter ride in big cars, live in big houses, and display grandeur. They are surrounded by fully armed bodyguards, as if they could be assassinated at any moment."

law_IJ_defamation: "Defamation law"
law_IJ_defamation_desc: "Acts that harm the honor of people are called slander, and acts that promulgate a person's bad name are called slander, and those who perform this act by viewing, selling, or posting an exhibition using writings, documents, screens, and likenesses shall be imprisoned or fined according to the four subjects (the emperor, the imperial family, government officials, and Chinese commoners)."
law_IJ_newspaper: "Newspaper Ordinance"
law_IJ_newspaper_desc: "It adopted a newspaper publication permit system, prohibited foreigners from becoming newspaper owners, company owners, and editors, punished theories such as incitement to crime, subversion of the government, subversion of the state, and slander of law, and made it a permit system for publication of overwritings and white papers."
law_IJ_factory: "Factory Law"
law_IJ_factory_desc: "However, despite fierce opposition from the capitalists, this law limited its scope to factories with 15 or more workers, had a large number of exceptions, and provided an extremely low level of protection by the international standards of the time."
law_IJ_elementary: "Elementary School Ordinance"
law_IJ_elementary_desc: "Elementary schools were divided into two stages, ordinary elementary schools and high schools, and the period of study was four years each, and the curriculum and textbooks were determined by the Minister of Education, and the nationwide unification and centralization of education was institutionalized."
law_IJ_assembly: "Assembly and Political Social Law"
law_IJ_assembly_desc: "The government allow women from political activities, preventing them from initiating or joining political associations."
law_IJ_rescue: "Rescue rules"
law_IJ_rescue_desc: "Relief should be achieved through the mutual love of the people, and the State provides relief to the poor who are unfit or unable to work and who are helpless. It inherits the benevolent salvation of rulers in modern times, and its biggest feature is that it is extremely restrictive."
law_IJ_family: "Family Register Law"
law_IJ_family_desc: "While the Somonjin Separate Register, which replaced the previous family register, was written separately by status, it was said to be written in actual household units regardless of whether it was Chinese, warrior, or commoner, and although it was formal, it was epoch-making in that it overcame the status system."
law_IJ_civil: "Civil Order"
law_IJ_civil_desc: "When establishing a company in a colony or establishing a head office or branch office of a company established outside the colony in the colony, it is obligatory to obtain permission from the colonial governor's office, and unlike the domestic normative principle when establishing a company Japan the permission principle is adopted."

state_shinto_conversion_tt: "15% of the population of the incorporated states became Shinto believers"

gov_mikado: "Mikado system"
gov_mikado_desc: "This is a [concept_government_type] ruled by the [Concept('concept_ruler','$RULER_TITLE_MIKADO$')] who is “one line of all generations”.The Mikado had no surname and was awarded a posthumous title after his death.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

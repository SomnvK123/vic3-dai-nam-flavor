je_santoutongmeng:0 "Triumvirate"
je_santoutongmeng_reason:0 "From the deserts of North Africa to the grasslands of East Africa, the friction between German power and Italy continues, and the differences between the Axis powers are growing. After the end of the war, Germany's war machine was forced to stop. The distorted ideology and economic form demanded that this German tank must continue to conquer other countries and promote Germany's operation. Subsequently, Germany aimed its claws at its former partners, but this time it failed. The plan to invade Italy was leaked, and the news caused a global uproar\n\nItaly felt endless fear of the threat from Germany, and gained a safe place for Europa under the control of Germany. Italy united, the Iberian Union (a country jointly composed of Spain and Portugal), the Republic of Türkiye, and some axis countries along the Mediterranean coast under their control separated from Germany, separated from the axis countries, and formed the Triumvirate.\n\n#v Member countries of Triumvirate：#!\n#g Italy#!、#r Turkey#!、#o Spain#!#u (And their vassals)#!"

je_krcanyusjdz_button5_desc:0 "I am neither a labor insurance worker, nor an internet leftist, nor a great Hayek, nor a populist fascist. Why should I participate in this world war?"
objective_iw:0 "IW Historical Timeline"
objective_iw_desc:0 "The peace in Europe was on the verge of collapse in 1910. In order to compete for Balkan hegemony, Italy is preparing to engage in a major war with the Ottomans. The rebellion in Morocco has also caused great distress to France, but of course, Germany is pleased to see it. In general, either exhaust all reasoning and maintain peace; Either shout for a fierce battle, with death but no life."
objective_iw_name_GER:0 "#v German Empire#!"
objective_iw_desc_GER:0 "#v What was once 35 different independent nations is now the German Empire, seen by many as one of the world's foremost powers, if not the strongest of them all. However, there are many who would trifle with such a state. The German enemy of France has formed the Triple Entente of themselves, the UK, and Russia, all far stronger than Germany's own weak allies. \n\nWith just old Austria and disloyal Italy, Germany needs either more friends or more power to survive the coming times.#!"
objective_iw_name_FRA:0 "#v French Republic#!"
objective_iw_desc_FRA:0 "#v In 1870, France was dealt a blow by the forming German Empire in a crushing war which saw the loss of Alsace-Lorraine. This made an implacable enemy of France, who has been licking her wounds since. Though the territory is German-speaking, the French people simply will not let this humiliation stand. \n\nFortunately, French diplomacy has built an Entente Cordial with the United Kingdom and Russia. When war breaks out, surely the Germans will crumble. The matter is, of course, ''when''.#!"
objective_iw_name_GBR:0 "#v British Empire#!"
objective_iw_desc_GBR:0 "#v The British Empire is still at its zenith. Controlling a massive amount of territory in Africa, Asia, and the Americas through both direct rule and dominions, the United Kingdom still has one continent yet to be mastered: Europe. The United Kingdom has a few allies on the mainland, but none they are particularly fond of. \n\nOf course, good king Edward is surely not long for this world, and crown prince George has time to shake things up. What will the next king do for Britannia's place in Europe?#!"
objective_iw_name_AUS:0 "#v Austro-Hungary#!"
objective_iw_desc_AUS:0 "#v The last century was a curse to the Austrian throne. Humiliation after humiliation was thrust upon her, from the rampage of Napoleon to the unification of Germany by the Prussians. Venerable old Kaiser Franz Josef now stands as a notable member of the Triple Alliance, with two of her old enemies. But surprisingly, this has gone well for Austria Hungary so far. \n\nThe Hapsburgs have inherited Bosnia, and the people of Hungary finally seem placated. Perhaps more good shall come.#!"
objective_iw_name_RUS:0 "#v Russian Empire#!"
objective_iw_desc_RUS:0 "#v Recent years have not been kind to the Russian Empire. With a major military defeat at the hands of Japan, followed by a revolution that forced the once-invincible Tsar into a constitution, the Russian government must get back on its feet and prove its strength again, or risk revolution. \n\nLuckily, the Balkans are turbulent again. The crumbling Ottoman Empire is Russia's opportunity to expand, create new puppet states, and more importantly, prove it is still a world power.#!"
objective_iw_name_TUR:0 "#v Ottoman Empire#!"
objective_iw_desc_TUR:0 "#v Storm clouds are gathering over Konstantiniyye. Serbia, Greece and Bulgaria have been scheming together again- likely a war to try and claim the territory they unrightfully claim is theirs. The Albanians are close to revolt. The Italian government is also very publicly contemplating a conquest of Tripolitania. \n\nLoss of territory is nearly inevitable. Ottoman Diplomacy, therefore, should center around ensuring we keep the capital, if nothing else.#!"
objective_iw_name_ITA:0 "#v Kingdom of Italy#!"
objective_iw_desc_ITA:0 "#v Italy is the smallest third of the Triple Alliance, an alliance with which she has little faith in. Austria-Hungary, Italy's natural rival, is now a friend in the world of treaties but still a rival in practical terms. After all, Italian Irredentism still decrees the Austrian-held Dalmatian coast as Italian. For now, however, there are more pressing matters. \n\nWar plans with the Ottoman Turks are already being drawn up. The government predicts a short, decisive war. Italy shall prove her power.#!"
objective_iw_name_USA:0 "#v United States of America#!"
objective_iw_desc_USA:0 "#v While Europe trudges closer and closer to war and misery, peace and prosperity is the way in the United States in 1910. The success of Dollar Diplomacy and the Roosevelt Corollary have finally secured Latin America from European powers once and for all. The Philippines have been pacified for good. \n\nIt'd be foolish to be blind to Europe, but for now, America is safe to build up.#!"
objective_iw_idle_header:1 "move on"
objective_iw_idle_hint:0 "More challenges will arise in the future"
je_jap_yingritongmeng_button:0 "End the Anglo Japanese Alliance"
je_jap_yingritongmeng_button_desc:0 "Since 1902, the Anglo Japanese alliance has been an international tool for Japan's expansion into the Asian continent. The continued existence of the Anglo Japanese alliance after World War I has become a potential threat to the expansion of the United States in the Far East and Pacific regions. At the Washington Conference, Britain and Japan had to agree to terminate their alliance in the face of repeated strong pressure from the United States. On December 13, 1921, the United States, Britain, France, and Japan signed the Treaty on the Territories and Territories of the Pacific Islands, which stipulated that the contracting parties should respect each other and jointly safeguard their respective interests in the Pacific region. On the day the treaty came into effect, the Anglo Japanese alliance was abolished."
je_yingritongmeng:0 "Anglo-Japanese Alliance"
je_yingritongmeng_reason:0 "The mutual aid alliance formed by Britain and Japan to safeguard their respective interests in China and the Korean Peninsula aims to oppose Russia's expansion in the Far East.\nThe Anglo Japanese Alliance was signed three times, with the first alliance treaty signed in London on January 30, 1902. The treaty consists of six articles, the main content of which is: in response to Russia's expansion, both sides recognize the "independence" of China and Korea. If the interests of China and Korea are invaded by other countries or suffer losses due to internal turmoil, either party may take necessary measures; When one party of the contracting state engages in war with other countries, the other party shall strictly maintain neutrality; Just as when one side of the Allied Powers engages in war with two or more other countries, the other side should provide military assistance and negotiate with the Allied Powers when making peace; Both sides also safeguard the illegal interests of Britain in China, Japan in China, and North Korea.\nThe Second Alliance Treaty was signed in 1905, recognizing Japan's "right to protect" Korea and stipulating that military assistance should be provided in the event of any attack by a third country.\nThe Third Alliance Treaty was signed in 1911. The provisions in the 1911 Alliance Treaty are much the same as those in the 1905 Alliance Treaty, with the most important being the provision on arbitration treaty, which renders the effectiveness of the Alliance Treaty incomparable to the war between Japan and the United States. So as long as the issue involves confrontation with the United States, Japan can no longer rely on Britain and has instead deepened its reliance on Russia. Therefore, on the issue of Japan US relations, the Anglo Japanese alliance has lost its true essence.\nDuring World War I, Japan declared war on Germany in 1914 under the pretext of the Anglo Japanese alliance in order to expand its influence in East Asia and invade China, and quickly occupied Germany's sphere of influence in Shandong, China.\nThe Anglo Japanese Alliance was entirely a military offensive and defensive alliance against Russia. During the 1921 Washington Conference, under pressure from the United States, the Anglo Japanese Alliance was declared terminated on December 13, 1921. Replaced by the Four Power Convention between Britain, France, the United States, and Japan."
jieshuyingritongmeng:0 "End the Anglo Japanese Alliance"
cunzaiyingritongmeng:0 "The existence of the Anglo Japanese Alliance"

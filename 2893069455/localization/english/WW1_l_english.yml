je_kr_xbyneizhan_xibanya_reason:0 "[ROOT.GetCountry.GetName]Suppress all rebels and win the Spanish Civil War."
xibanyanzsl3:"A victory belonging to populism"
kr_baerganzhanz_event.1:0 "The Fourth Balkan War"
kr_baerganzhanz_event.1.t:0 "The Fourth Balkan War"
kr_baerganzhanz_event.1.d:0 "The Treaty of Belgrade (Republic of Serbia, Kingdom of Romania, Kingdom of Greece) declared war on the Bulgarian Empire, and the Fourth Balkan War broke out."
kr_baerganzhanz_event.1.f:0 "The situation in the Balkans has always been tense and complex. With the intensification of conflicts of interest between countries and the covert struggles of European powers behind the scenes, the Balkan region has become a powder keg like existence. In this context, the Republic of Serbia, the Kingdom of Romania, and the Kingdom of Greece, in order to maintain their own interests and regional stability, decided to unite and jointly resist the expanding ambitions of the Bulgarian Tsarist State. After the outbreak of war, the coalition forces of Serbia, Romania, and Greece quickly gathered their forces and launched a fierce attack on Bulgaria."
kr_baerganzhanz_event.1.a:0 "How many more Balkan Wars are there?"
je_kr_baerganzhanz:0 "The Fourth Balkan War"
je_kr_baerganzhanz_reason:0 "The Fourth Balkan War was about to erupt, and the Balkan region became a powder keg like existence."
je_kr_xiongyaliqiyi:0 "The Danube Crisis"
je_kr_xiongyaliqiyi_reason:0 "Due to the long-term unresolved ethnic conflicts within the Austro Hungarian Empire, all ethnic groups could only resort to force, and the Danube Crisis was about to erupt."
kr_xiongyaliqiyi_event:0 "The Danube Crisis"
kr_xiongyaliqiyi_event.1.t:0 "The Danube Crisis"
kr_xiongyaliqiyi_event.1.d:0 "Due to the long-term unresolved ethnic conflicts within the Austro Hungarian Empire, all ethnic groups had to resort to force, leading to the outbreak of the Danube Crisis."
kr_xiongyaliqiyi_event.1.f:0 "Austria has had enough of this farce known as the Austro Hungarian Binary Agreement. If we want our country to be strong and unified, we must end this farce. Perhaps this is a leap into darkness, but no matter what, it's time to end this riddle"
kr_xiongyaliqiyi_event.1.a:0 "Termination of the Austro Hungarian Binary Agreement"
kr_aoxiongneizhan_event:0 "Hungary surrenders, Austrian Empire revolts again"
kr_aoxiongneizhan_event.1.t:0 "Hungary surrenders, Austrian Empire revolts again"
kr_aoxiongneizhan_event.1.d:0 "The united front formed to confront the stubborn Hungary has now achieved great success. The Hungarians can no longer withstand our unstoppable offensive, and the greatness of the empire is fully demonstrated in this war. Even the most proud Hungarians are now at our mercy."
kr_aoxiongneizhan_event.1.f:0 "The old borders and management system of the empire were unwilling to acknowledge how foolish the empire was in terms of ethnic division. There are no Bohemians at all, only Germans and Czechs, no Galicians at all, only Poles and Rusinians. The old government didn't even record what ethnicity a person was from. It's time to end this farce."
kr_aoxiongneizhan_event.1.a:0 "The civil war of the Austro Hungarian Empire erupted completely"
je_kr_aoxiongneizhan:0 "The Austro Hungarian Civil War"
je_kr_aoxiongneizhan_reason:0 "It's time to federalize the empire and establish a more democratic government. A centralized federal state will lead all Austrian people towards a brighter future."
kr_dierciyidalineizhan_event:0 "The Italian Civil War is reigniting"
kr_dierciyidalineizhan_event.1.t:0 "The Italian Civil War is reigniting"
kr_dierciyidalineizhan_event.1.d:0 "The Second Italian Civil War broke out"
kr_dierciyidalineizhan_event.1.f:0 "More than twenty years ago, the Italian Civil War came to a temporary end, and the situation on the peninsula remained in an unstable state of peace. Nowadays, with the impact of Black Monday on Italy and its implications for Austria's withdrawal, almost no one believes that peace can continue to struggle.\nThe tension has escalated around the world, with the Italian Socialist Republic taking the initiative to declare war on various anti worker groups and the Italian government on the peninsula. Italy condemns these regimes as "artificial states imposed by imperialism and foreign powers" and vows to achieve true and lasting unity of Italy. The anti labor government condemned them as puppets of Paris and vowed to achieve true and lasting unification of Italy. As the smoke of civil war reignited, volunteer armies and aid supplies from major foreign powers rushed in. This is a proxy game of the great powers in Italy, where the winner can seize the entire peninsula."
kr_dierciyidalineizhan_event.1.a:0 "Can Italy calm down?"
je_kr_dierciyidalineizhan:0 "The Second Italian Civil War"
je_kr_dierciyidalineizhan_reason:0 "In the chaos and turmoil after World War I, Italy experienced a series of political changes and social unrest. However, despite facing many challenges, the Italian people are still full of hope and expectations for the future of their country."
kr_shijiedazhanks.1:0 "Alsace Lorraine or War"
kr_shijiedazhanks.1.t:0 "Alsace Lorraine or War"
kr_shijiedazhanks.1.d:0 "The French Commune Federation requests the Alsace Lorraine region"
kr_shijiedazhanks.1.f:0 "As the conflict between the French Commune and the German Empire intensified, the political landscape of Europe began to undergo drastic changes. Countries have begun to reassess their positions and interests, forming two opposing camps: one is the Third International centered around the French Commune, aimed at safeguarding national interests and regional stability; On the other hand, the German Empire and its allies, led by conservative forces, formed the Imperial Pact, which firmly opposed any actions that could threaten their vested interests."
kr_shijiedazhanks.1.b:0 "France has issued an ultimatum"
je_kr_shijiedazhan: "the Second World War"
je_kr_shijiedazhan_reason: "With the reconstruction of the international order after a global conflict, the contradictions and tensions between countries have not completely dissipated. In this world, the French Commune rose after the revolution and became an undeniable force. The commune is not satisfied with the status quo, but has a deep longing for the territories lost in the past, especially the Alsace Lorraine region, which was once part of France in history but was ceded to neighboring countries after a conflict. As time passed, the strength of the French Commune grew stronger, and its demands for the Alsace Lorraine region became increasingly strong. The leaders of the commune believed that only by reclaiming this land could the national rejuvenation and unity of France be truly achieved. However, this demand was firmly opposed by the current ruler of the region, the German Empire. Both sides engaged in intense political and diplomatic games over the ownership of this region, gradually dragging the entire Europe into a vortex of tension and turmoil."
je_KR_shijiedazhan_baofa: "mobilization before a battle"
je_KR_shijiedazhan_baofa_reason: "The full-scale war between the Third International, the Empire Pact, and the Moscow Agreement."
je_kr_canyusjdz2:0 "Participated in the Second World War of KR World Line"

je_rihanhebing:0 "Japan Korea merger"
je_rihanhebing_reason:0 "Propose to South Korea to sign a merger treaty between Japan and South Korea"
 rihanhebing_event.1:0 "Treaty of Mergence Between Japan and Korea"
 rihanhebing_event.1.t:0 "Treaty of Mergence Between Japan and Korea"
 rihanhebing_event.1.d:0 "The 1910 merger of Japan and South Korea"
 rihanhebing_event.1.f:0 "The South Korean government suddenly received an important document from Japan - the Treaty of Merger between Japan and South Korea. As soon as this news was released, it immediately caused a huge uproar in South Korea, with strong concerns and dissatisfaction expressed by the public, officials, and various sectors of society. However, regardless of the emotions, the South Korean government must respond to this incident."
 rihanhebing_event.1.a:0 "We have no choice but to accept"
 rihanhebing_event.1.b:0 "The territorial sovereignty of the Republic of Korea is inviolable"
rihanhebing_event_tt:0 "The territorial sovereignty of the Republic of Korea cannot be violated. This is a true event that has occurred in the history of South Korea"
 rihanhebingshijian.1:0 "Japan Korea merger"
 rihanhebingshijian.1.t:0 "Japan Korea merger"
 rihanhebingshijian.1.d:0 "South Korea has accepted and fulfilled the Treaty of Merger between Japan and South Korea"
 rihanhebingshijian.1.f:0 "On August 22, 1910, the Prime Minister of the Kingdom of Korea, Lee Wan yong, signed a treaty with Japanese representative Terauchi Masayoshi, stipulating that the Korean Empire would permanently transfer sovereignty over the Korean Peninsula to Japan. On the 29th, with the entry into force of the Treaty of Merger between Japan and South Korea, the Empire of Korea fell to the Empire of Great Japan, and the Korean Peninsula became a part of Japan's territory. The Japan Korea Governor General's Office was reorganized as the Korean Governor General's Office, becoming the governing body for the Korean Peninsula."
 rihanhebingshijian.1.b:0 "Korea no longer exists"
rihanhebingshijian_tt:0 "This is a real event that happened in history"
 rihanzhanzhengshijian.1:0 "The Japan Korea War"
 rihanzhanzhengshijian.1.t:0 "The Japan Korea War"
 rihanzhanzhengshijian.1.d:0 "South Korea rejects and rejects the Japan Korea merger treaty"
 rihanzhanzhengshijian.1.f:0 "The South Korean government firmly rejected Japan's proposal for a merger treaty between Japan and South Korea. This decision angered Japan and led to a fierce conflict between the two countries, which had a profound impact on the historical process of East Asia."
 rihanzhanzhengshijian.1.b:0 "Either independence or merger"
rihanzhanzhengshijian_tt:0 "Japan and South Korea are already in a state of war"
 xinhaigeming_event.1:0 "the Revolution of 1911"
 xinhaigeming_event.1.t:0 "the Revolution of 1911"
 xinhaigeming_event.1.d:0 "The Democratic Revolution that broke out in China in 1911"
 xinhaigeming_event.1.f:0 "The Xinhai Revolution refers to a nationwide revolution that occurred in the year of Xinhai in the Chinese lunar calendar (the third year of the Xuantong reign of the Qing Dynasty), from 1911 to early 1912, aimed at overthrowing the autocratic monarchy of the Qing Dynasty and establishing a republican political system. The narrow definition of the Xinhai Revolution refers to the revolutionary events that occurred in China from the outbreak of the Wuchang Uprising on the night of October 10, 1911 (the 19th day of the eighth lunar month) to the inauguration of Sun Yat sen as the interim president of the Republic of China on New Year's Day 1912. In a broad sense, the Revolution of 1911 refers to the successive revolutionary movements that appeared in China from the end of the 19th century (some scholars believe that it started from the establishment of the Chinese Chinese Revolutionary League in 1905, and some say that it started from the establishment of the Xingzhong Society in 1894) to the successful overthrow of the Qing Dynasty in 1911."
 xinhaigeming_event.1.a:0 "Expel the Tartars, restore China, establish the Republic of China, and evenly distribute land rights"
 xinhaigeming_event.1.b:0 "I want to experience the story of the Republic of China"
xinhaigeming_event_tt:0 "This is a true event that occurred in Chinese history"

xinhaigeming1: "the Revolution of 1911"
xinhaigeming2: "the Revolution of 1911"

daqingshengli_event.1:0 "The Qing Dynasty won"
daqingshengli_event.1.t:0 "The Qing Dynasty won"
daqingshengli_event.1.d:0 "During the height of the Xinhai Revolution, the Wuchang Uprising was in full swing. However, if at this critical moment, the revolutionary faction splits internally due to power struggles, resulting in the uprising not expanding as scheduled. The Qing Dynasty took advantage of this opportunity to mobilize elite troops, quickly suppress rebellions, and restore control over various regions. Nationwide, the Qing court strengthened its control over public opinion and implemented more severe repression policies."
daqingshengli_event.1.f:0 "At a turning point in history, the Xinhai Revolution came to an abrupt end due to internal disputes, and the Qing Dynasty regained power. Darkness once again enveloped the land of China. The dreams of revolutionaries dissipate like morning mist, and the hopes of the people are mercilessly trampled by iron hooves. The flames of Xinhai failed to ignite the dawn of change, and the hope of the nation was once again suppressed. The road ahead is still full of thorns. Will China's fate be lost in endless decline?"
daqingshengli_event.1.a:0 "The victory belongs to feudalism"
sichuanshengli_event.1:0 "The Republic of China won"
sichuanshengli_event.1.t:0 "The Republic of China won"
sichuanshengli_event.1.d:0 "The Republic of China overthrew the rule of the Qing Dynasty"
sichuanshengli_event.1.f:0 "The occurrence of the Revolution of 1911 is the inevitable result of the intensification of social contradictions in China and the tenacious struggle of the Chinese people since modern times. It has brought an invaluable liberating effect to the Chinese people politically and ideologically. Created a fully modern national democratic revolution, overthrew the monarchical autocratic system that had ruled China for thousands of years, established a republican political system, and ended the monarchical autocratic system. Spreading the concept of democracy and republicanism, greatly promoting the ideological liberation of the Chinese nation, and driving social change in China with tremendous shock and influence."
sichuanshengli_event.1.a:0 "The Qing Dynasty, which ruled for over 400 years, drew the end of history"
sichuanshengli_event_tt:0 "This is a true event that occurred in Chinese history"
sichuanshenglibuff: "Victory of the Republic of China"
daqingshenglilibuff: "Victory of the Qing Dynasty"

je_canyusjdz2:0 "Participated in the Second World War"
je_canyusjdz2_reason:0 "The Second World War has already erupted, should we choose to stand by or remain neutral? This war has become an important milestone in the course of world history."
shijiedazhanbaofa_event.1 "world war"
shijiedazhanbaofa_event.1.t:0 "world war"
shijiedazhanbaofa_event.1.d:0 "World War breaks out"
shijiedazhanbaofa_event.1.f:0 "The Second World War was a global scale war fought between the fascist Axis powers of Germany, Italy, and Japan on one hand, and the anti fascist alliance and anti fascist forces around the world on the other. From Europe to Asia, from the Atlantic to the Pacific, 61 countries and regions with a population of over 2 billion have been involved in wars, covering an area of 22 million square kilometers."
shijiedazhanbaofa_event.1.a:0 "The greatness and tragedy of humanity, the trials and glories of history."

je_jap_jiuyibashibian_button:0 "The September 18 Incident"
je_jap_jiuyibashibian_button_desc:0 "To conquer China, one must first conquer Manchuria."
je_jap_nanjinlun_button:0 "Southern Advancement Theory"
je_jap_nanjinlun_button_desc:0 "Japan launched a surprise attack on Pearl Harbor, triggering the Pacific War."
je_tuichulundunhaijun_button:0 "Withdraw from the London Naval Treaty"
je_tuichulundunhaijun_button_desc:0 "This treaty is a constraint for us, it's time to tear up this piece of paper."
je_ger_laiyinlan_button:0 "Rhineland"
je_ger_laiyinlan_button_desc:0 "The Rhineland has been demilitarized since the end of the Great War, but this insult shall stand no longer! Germany is a sovereign nation and is free to move troops anywhere within her borders!\n#N This move will significantly damage our relationship with France#!"
je_ger_deaohebing_button:0 "Anschluss"
je_ger_deaohebing_button_desc:0 :0 "The Anschluss, or union with Austria, is a long held goal of the German people. Although forbidden by the Treaty of Versailles, the time has finally come to bring it about. We must increase local support for fascism in Austria to lay the groundwork for the annexation."
tunbinjieke_decision:0 "Fate of Czechoslovakia"
tunbinjieke_decision_desc:0 "The time has come to divide the old Czech lands between those who can govern them properly. We should also consider the creation of a separate Slovak puppet state to the east."
je_ger_meimeier_button:0 "Reassert Eastern Claims"
je_ger_meimeier_button_desc:0 "The Great War saw the loss of much German territory in the East with the resurrection of Poland and the transfer of Memel to Lithuania. An Ultimatum shall be sent to both nations, but Poland, at least, will likely not bow to mere words."
je_ger_sutaide_button:0 "Demand Sudetenland"
je_ger_sutaide_button_desc:0 "The fate of the Sudet-Germans was one of the worst injustices inflicted by the Treaty of Versailles. They must be brought under our protection, regardless of Czech objections."
je_ger_weiyenazhongcai1_button:0 "The First Vienna Arbitration"
je_ger_weiyenazhongcai1_button_desc:0 "Hungarians can be said to be one of the most suffering ethnic groups after the last World War. After the disintegration of the Austro Hungarian Empire, many Hungarians became foreigners trapped on foreign lands overnight - even though they had lived on those lands for generations. By ceding some of Czechoslovakia's land to Hungary, we can greatly improve our relationship with them."
je_ger_weiyenazhongcai2_button:0 "Second Vienna Award"
je_ger_weiyenazhongcai2_button_desc:0 "Transylvania has a Hungarian majority and should rightly belong to our friends in Hungary. However, it is hard to say how the Romanian regime and people will react to this demand."
je_ger_jiekesiluofakedemingyun_button:0 "The fate of Czechoslovakia"
je_ger_jiekesiluofakedemingyun_button_desc:0 "It's time to allocate the old land of the Czechs to those who can truly manage this land. At the same time, we should also consider establishing a puppet state in Slovakia to the east."
je_ita_aerbaniya_button:0 "Occupy Albania"
je_ita_aerbaniya_button_desc:0 "The strong ties between Italy and Albania go back millennia, to the Roman Empire. We must incorporate Albania into Italy to secure the inlet to the Adriatic Sea."
je_jap_ritaitongmeng_button:0 "Japan Thailand Alliance Treaty"
je_jap_ritaitongmeng_button_desc:0 "We need to find allies in East Asia, and signing a military alliance treaty with the Thai government is a good choice."
je_ger_babaluosajihua_button:0 "Operation Barbarossa"
je_ger_babaluosajihua_button_desc:0 "We are about to embark on the greatest military campaign in history - the invasion of the Soviet Union! Where Napoleon failed, we will succeed. Surge forward across the border, encircle and destroy Soviet troop concentrations and continue pushing eastward. The operation will be considered a success if we seize Moscow and manage to establish a front line running along the Arkhangelsk - Astrakhan axis. Drang nach Osten!"
je_ger_dgzhanzhengzdy_button:0 "General Mobilization for War"
je_ger_dgzhanzhengzdy_button_desc:0 "After the Battle of Stalingrad, we could only fill the manpower gap through general mobilization of war."
je_ger_fangongchan_button:0 "Anti-Comintern Pact"
je_ger_fangongchan_button_desc:0 "Interference by the Communist International in the internal affairs of the nations not only endangers their internal peace and social well-being, but is also a menace to the peace of the world! We will ask many of the non-Communist countries to sign the pact, and make sure that we keep the red menace in check."
je_ger_hubuqingfan_button:0 "Soviet-German Treaty of Non-Aggression"
je_ger_hubuqingfan_button_desc:0 "Only by signing this treaty will the Soviet Union divide Poland. If it is not signed, the Soviet Union is likely to attack us too early."
je_ger_kldy_sewy_button:0 "Instilling rebellion in Yugoslavia"
je_ger_kldy_sewy_button_desc:0 "Support the pro German government within Yugoslavia."
je_gbr_xuanzhanyilake_button:0 "Declare war on Iraq"
je_gbr_xuanzhanyilake_button_desc:0 "Iraq has leaned towards the Axis powers, and we must make it free."
je_rus_xuanzhanyilang_button:0 "Declare war on Iran"
je_rus_xuanzhanyilang_button_desc:0 "Iran has leaned towards the Axis powers, we must liberate it."
je_rus_bayuefengbao_button:0 "Operation against Japan"
je_rus_bayuefengbao_button_desc:0 "Germany has surrendered, and defeating Japan will end this world war."
WW2_GBR_guoce:0 "British National Policy"
WW2_GBR_guoce_reason:0 "The UK National Policy of OTL World Line"
WW2_RUS_guoce:0 "Soviet National Policy"
WW2_RUS_guoce_reason:0 "The Soviet policy of OTL World Line"
je_rus_gubixuefu_button:0 "Establish a wartime capital"
je_rus_gubixuefu_button_desc:0 "Move the capital to Gubyshev to prevent Moscow from being threatened by the German army again."
je_rus_hongjundefangong_button:0 "The Red Army's counterattack"
je_rus_hongjundefangong_button_desc:0 "We have defended the city, and the turning point of the war has arrived. It is time to launch a counterattack."
je_rus_guafengbolan_button:0 "Partitions of Poland"
je_rus_guafengbolan_button_desc:0 "According to the Molotov Ribbentrop Pact, we can obtain the eastern part of Poland."
je_rus_tangnutuwa_button:0 "Merge Tangnutuwa"
je_rus_tangnutuwa_button_desc:0 "Although the economic benefits are minimal, we should still consider political considerations and formally absorb the People's Republic of Tonutuva as an autonomous region of the Soviet Union."
je_rus_bisalabiya_button:0 "Request Pizza Rabia"

ww1_bel_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_bel_canyushijiedazhan_xyg.1.f:0 "Germany claims to have received reliable intelligence that France's intention to invade Germany through the Belgian border is beyond doubt, and does not expect the Belgian army to stop the French army from advancing. Therefore, they wanted to send troops into Belgian territory in advance for self-defense. The Belgian government refused the request of the German army to pass through, and Germany launched a war with Belgium."

kr_diercibuliesite_event:0 "The Second Treaty of Brest"
kr_diercibuliesite_event.1.t:0 "The Second Treaty of Brest"
kr_diercibuliesite_event.1.d:0 "With the last ship#o Bolshevik#!The ship departed from Arkhangelsk, victorious#P the White Army#!It also ushered in its final disintegration - this moment was frozen in the signing of the second Treaty of Brest."
kr_diercibuliesite_event.1.f:0 "Despite achieving victory, Russia is left with scars and debts everywhere. We are the ones who have won everything, and we are the ones who have lost everything."
kr_diercibuliesite_event.1.a:0 "The Past of Bai Wei"
je_kr_diercibuliesite:0 "The Second Treaty of Brest"
je_kr_diercibuliesite_reason:0 "The increasingly low morale, combined with hunger and cold, and the troubles of peasant uprisings are gradually shrinking#r Bolshevik#!The noose around the neck was finally tightened completely in 1921."

BEL_bogengdiqishituanguo:0 "Burgundian Knights' State"
je_tno_bogengdiqishituanguo:0 "Burgundian Knights' State"
je_tno_bogengdiqishituanguo_reason:0 "The Kingdom of Burgundy was a country founded by Germanic peoples, primarily active in the southwestern region of Provence in present-day France.\nIn the TNO world line, the Burgundian Knights have territories that are bordered by the German Empire to the east, and the territories of Belgium and northern France are shrouded under its black wings. It implemented Nazism and was considered the "First Empire". Burgundy was a regional concept that began with its assimilation into France."
tno_bogengdiqishituanguo_event.2.t:0 "SS Rebellion"
tno_bogengdiqishituanguo_event.2.d:0 "The concept of the Burgundian Knights can be traced back to World War II, when Heinrich Himmler proposed the establishment of a standardized state with national socialism as its ideology. He claimed that the Kingdom of Burgundy was part of Germany and demanded the creation of the Burgundian Knights."
tno_bogengdiqishituanguo_event.2.f:0 "Heinrich's proposal was not accepted, instead, the territories of France and Belgium were directly incorporated into Germany. Therefore, a rebellion broke out, demanding the establishment of the Burgundy Knights."
tno_bogengdiqishituanguo_event.2.a:0 "The experimental sample of Burgundy system"
tno_bogengdiqishituanguo_event.1.t:0 "The territorial distribution of Burgundy"
tno_bogengdiqishituanguo_event.1.d:0 "Let's decide the future of the Burgundy Knights"
tno_bogengdiqishituanguo_event.1.f:0 "The Burgundy Knights were an authoritarian state dominated by extreme militarism and Spartanism, controlled by the SS. Under Himmler's leadership, this country became a place of terror and darkness filled with evil."
tno_bogengdiqishituanguo_event_tt:0 "This is TNO Germany's real choice"
tno_bogengdiqishituanguo_event.1.a:0 "Transfer the territories of German occupied Belgium, northern France, and west of the Moselle River to Himmler"
tno_bogengdiqishituanguo_event.1.b:0 "Himmler will receive additional Burgundy, Rh ô ne, and Hailey"
tno_bogengdiqishituanguo_event.1.c:0 "They only deserve to be in the French lowlands, don't think about anything else"
tno_bogengdiqishituanguo_event.1.dd:0 "Maintain the status quo and let them fend for themselves"
tno_bogengdiqishituanguo_event.1.e:0 "These traitors got nothing!"
tno_bogengdiqishituanguo_event_ttt:0 "This will lead to a significant increase in negative reputation"
tno_yibiliyalianmeng_event:0 "The Iberian Union was established"
tno_yibiliyalianmeng_event.1.t:0 "The Iberian Union was established"
tno_yibiliyalianmeng_event.1.d:0 "In the early stages of World War II, Spain and Portugal both declared their neutrality. Until the Allied powers were retreating in Europe, Spain seized the opportunity and recaptured Gibraltar from the dying British Empire, standing on the same side as the Axis powers. While Portugal and Spain breathed a sigh of relief for their smooth passage through World War II, Hitler's ambitions were slowly enveloping Iberia. Germany disregarded the attitude of its former allies and brazenly occupied Angola and Mozambique, which belonged to Portugal. Fearing the tyranny of the ruler of Europa, the two countries held talks to ensure their own security. Despite Portugal's reluctance, a new country was eventually born, which was the Iberian Union."
tno_yibiliyalianmeng_event.1.f:0 "The new alliance soon allied itself with Italy, which was also hostile to Germany because of Germany's ambition, and the two countries formed a trilateral alliance with Türkiye. The spring breeze of reform quickly blew through the entire alliance, and Iberia's economy completed the transition from self-sufficiency to industrialization. With investment from OFN, the Iberian Union is seen as the most promising member to become the most powerful force of the free world in the continental fortress."
tno_yibiliyalianmeng_event.1.a:0 "Each holding their own opinions or working together for a win-win situation"
je_tno_yibiliyalianmeng:0 "Iberian Union"
je_tno_yibiliyalianmeng_reason:0 "The Iberian Union is a country located in Western Europe. His homeland borders the Republic of France and the Principality of Andorra to the north, the Atlantic Ocean to the west, and the Mediterranean Sea to the south and east. Iberia has colonies such as Morocco, several islands in Africa, and the Atlantic Ocean.\nThe country is a federation composed of Spain and Portugal. Legally speaking, the country has two heads of state: Francisco Franco, the military dictator of Spain, and Antonio de Oliveira Salazar, the Prime Minister of Portugal. Both countries have equal political representation in the alliance and the right to veto any legislation attempted by the other party. This greatly weakens the national government, as both sides of the government often argue with each other."
tno_por_yibiliyalianmeng_yiwancheng:0 "Only one option can be selected"
je_tno_por_yibiliyalianmeng_1_button:0 "Establishing the Iberian Union"
je_tno_por_yibiliyalianmeng_1_button_desc:0 "After being taken away by Germany, the Iberian League was formed with Spain to jointly resist the German threat"
je_tno_por_yibiliyalianmeng_2_button:0 "Requesting protection from Germany"
je_tno_por_yibiliyalianmeng_2_button_desc:0 "I earnestly request Germany not to take away its colonies and be willing to become a vassal of Germany"
je_tno_por_yibiliyalianmeng_3_button:0 "Leading Iberia"
je_tno_por_yibiliyalianmeng_3_button_desc:0 "Abandon Spain and go it alone, Portugal is the Iberian orthodoxy!"
je_tno_por_yibiliyalianmeng_4_button:0 "sit and wait for death"
je_tno_por_yibiliyalianmeng_4_button_desc:0 "If we do nothing, we will only lose the colony"
daribendiguo:0 "Empire of Japan"
je_dayafaxisizhuyi_button:0 "Suppressing Fascism"
je_dayafaxisizhuyi_button_desc:0 "Fascism is evil, we must stop this trend of thought\n#r If you do this, this log will end immediately#!"
faxisizhuyijueqi_weibeidaya:0 "Fascism has not been suppressed"
faxisizhuyijueqi_yiwancheng:0 "Ending the Rise of Fascism"
xinhaigeming_yiwancheng:0 "The Xinhai Revolution was completed"
no_xinhaigeming_yiwancheng:0 "The Xinhai Revolution was not completed"
je_manhanfenzhi_button:0 "Partition of Man and Han"
je_manhanfenzhi_button_desc:0 "To avoid the Xinhai Revolution, we can grant the Han people the right and allow them to establish their own political power\n#r If we do this, there will be no more Xinhai Revolution and warlord chaos#!"
manhanfenzhi_event.1:0 "Partition of Man and Han"
manhanfenzhi_event.1.t:0 "Partition of Man and Han"
manhanfenzhi_event.1.d:0 "At the end of the late Qing Dynasty, faced with increasingly intensified conflicts between the Manchu and Han dynasties and social unrest, two completely different voices emerged within the royal family. Some members of the royal family believe that only by completely breaking the traditional Manchu Han boundary and achieving ethnic integration can the fate of the country be saved. However, another group of more conservative members proposed a bold and radical plan - the partition of Manchuria and Han, which aimed to ease conflicts, ensure the continuation of the royal family, and maintain national stability by establishing an independent Han regime. After a series of secret discussions and preparations, the royal family finally decided to implement the plan of dividing the Manchu and Han dynasties."
manhanfenzhi_event.1.f:0 "After the announcement of the partition plan, it immediately caused a huge shock and panic among the Han people. Many Han people are concerned that their rights and status will not be guaranteed in the new country. In order to seek a better living environment and political status, a large number of Han people began planning to migrate to areas outside of Northeast China."
manhanfenzhi_event.1.a:0 "The migration of Han people had a profound impact on both the Qing Dynasty and this new regime"
manhanfenzhi_event.1.b:0 "I want to experience the Han Chinese regime"
xibanyajiaru_event:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
xibanyajiaru_event.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
xibanyajiaru_event.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the Axis Powers"
xibanyajiaru_event.1.f:0 "Germany invaded the Soviet Union and provoked the Soviet German War. Many people in Spain were inspired by their opposition to the Soviet Union and believed that the time had come to send troops for revenge. Pro German Foreign Minister Serrano Sunil proposed the formation of a Spanish volunteer force to fight alongside the German army on the Soviet battlefield. Franco ordered the formation of a 18000 strong army called the "Blue Division", mainly composed of members of the Long Spear Party. Take a train to Poland first, and then walk for over 40 days to reach the front line in Leningrad."
yingaitiaoyue_event.1:0 "Anglo-Irish Treaty"
yingaitiaoyue_event.1.t:0 "Anglo-Irish Treaty"
yingaitiaoyue_event.1.d:0 "Britain was forced to allow the establishment of the Irish Free State in the 26 southern counties of Ireland, but the 6 northern counties remained part of Britain and became what is now Northern Ireland. Britain recognized Ireland's independence."
yingaitiaoyue_event.1.f:0 "The Irish belong to the Celtic people and are the descendants of the first generation of residents on the European continent. They were invaded by England in 1169 and became the King of Ireland in 1541. In 1916, the Easter Rising broke out in Dublin to resist the rule of the British Empire. On December 6, 1921, the two sides signed the Anglo Irish Treaty."
yingaitiaoyue_event.1.a:0 "Victory for the Irish"
yingaitiaoyue_event.1.b:0 "I want to experience the country of Ireland"
yingaitiaoyue_event_tt:0 "This is a true event in Irish history"
je_gbr_shifangaierlan_button:0 "Release Ireland"
je_gbr_shifangaierlan_button_desc:0 "According to the Anglo Irish Treaty, we can release the Irish state in exchange for friendly relations with the Irish people towards us"

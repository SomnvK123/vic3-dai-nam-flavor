je_tongmengguo_KR_reason:0 "The Allied Powers were defeated and entered the Kaisereich script"
ww1_rusheping.1:0 "The Soviet Union agrees to the Treaty of Brest"
ww1_rusheping.1.t:0 "The Soviet Union agrees to the Treaty of Brest"
ww1_rusheping.1.d:0 "After lengthy negotiations and internal discussions, the Soviet government ultimately decided to accept the terms of the Brest Treaty proposed by Germany. This decision marks the end of the war between the two countries and heralds the formation of a new international landscape."
ww1_rusheping.1.f:0 ""Respected German government, we formally inform you that after careful consideration, the Soviet government has decided to accept the terms of the Brest Peace Treaty. We are well aware that this peace treaty means great compromise and sacrifice for both sides, but in order to end this protracted war and enable the two peoples to return to peaceful life, we think it is worth it. We look forward to formally signing this peace treaty with your country to witness the end of the war and lay the foundation for future peace and cooperation. Please reply as soon as possible so that we can arrange for subsequent signing.""
ww1_rusheping.1.a:0 "We approve"
ww1_rusheping_tt:0 "This is a real event that happened in history"
ww1_ruszhanzheng.1:0 "The Soviet Union tore up the Brest Treaty"
ww1_ruszhanzheng.1.t:0 "The Soviet Union tore up the Brest Treaty"
ww1_ruszhanzheng.1.d:0 "After a brief illusion of peace was shattered, the Soviet government brazenly tore up the Brest Treaty signed with Germany. This treacherous act not only violates international law, but also seriously damages Germany's national interests."
ww1_ruszhanzheng.1.f:0 "The German government received an official notification from the Soviet Union that they openly tore up the Brest Treaty previously signed between the two sides. This behavior is a serious provocation to Germany's dignity and interests, and we express strong indignation and condemnation towards it. The Soviet Union's breach of trust has shown us their true face. They not only deviated from the promise of peace, but also exposed their greed and expansionist ambitions. We will not sit idly by and let the Soviet Union's ambitions succeed. The German government will resolutely defend the interests and dignity of the country. We demand that the Soviet Union immediately cease all provocative actions and bear all consequences arising therefrom. At the same time, we also warn the Soviet Union that any attempt to challenge Germany's determination and strength will come at a heavy cost."
ww1_ruszhanzheng.1.a:0 "These red bandits are indeed untrustworthy. We must immediately form an alliance with the bourgeois provisional government"
ww1_ruszhanzheng_tt:0 "We will continue the war on the Eastern Front"
je_yituzhanzheng:0 "Italian Turkish War"
je_yituzhanzheng_reason:0 "The Italian Turkish War was one of several local wars before the outbreak of World War I."
yituzhanzheng_event.1:0 "Italian Turkish War"
yituzhanzheng_event.1.t:0 "Italian Turkish War"
yituzhanzheng_event.1.d:0 "After unification, the Kingdom of Italy gradually developed a colonial consciousness, and in 1911, it went to war with the Ottoman Empire. Coincidentally, the Moroccan Crisis occurred in July 1911, which provided a favorable opportunity for Italy's attack. On September 28, 1911, the Italian government issued a final ultimatum to the Ottoman Empire, claiming that its interests in Tripoli and Cyrenaica had been violated, demanding that the Ottoman Empire agree to its entry into Tripoli, but was refused. Therefore, the next day, it declared war on Turkey."
yituzhanzheng_event.1.f:0 "Tripolitania and Cyrenaica were Ottoman deserts in North Africa, with limited economic value but significant strategic importance. It faces off against Sicily and can control the narrower sea surface in the central Mediterranean. In 1881, during the process of dividing the Ottoman Poltai government's possession of North African territories, Algeria and Tunisia successively became French protected territories, so the nominal Ottoman territories in North Africa also belonged to Western colonizers. France prepared to use this as an excuse to annex the Ottoman provinces of Tripoli and Cyrenaica. This attempt was opposed by European countries, especially Italy, which had long wanted to establish colonies in North Africa. For this reason, Italy actively engaged in political and diplomatic activities, reached agreements and tacit understanding with various powers, and recognized Italy's interests in North Africa. In order to prepare for the annexation of Tripolitania and Cyrenaica provinces, Italy continuously immigrated and sent merchants to the two regions from 1880 to 1911, purchased land, and actively expanded its influence; Send naval officers to change into fishermen's clothes and conduct coastal surveys under the pretext of fishing for sponges along the coast of Tripolitania; Instruct Italian Catholic priests to go deep into the mainland under the guise of evangelism to collect intelligence. Italy learned from its failure in Ethiopia in 1896 and constantly monitored its timing. After the second Moroccan crisis, Italy believed that not taking action would risk losing the opportunity. Using the unfair treatment of Italians in Tripolitania and Cyrenaica as an excuse, Italy took the initiative and issued an ultimatum to the Ottomans on September 28, 1911, before they invaded North Africa, threatening to invade the aforementioned areas. Osman called on all countries to stop Italy's invasion attempts, but major powers advised Osman to accept Italy's demands. In this situation, the Italian Turkish War broke out."
yituzhanzheng_event.1.a:0 "Invasion of Libya is an expensive adventure for Italy"
yituzhanzheng_event_tt:0 "This is a real event that happened in history"

 je_ww1_shijiedazhan:0 "the First World War"
 je_ww1_shijiedazhan_reason:0 "Wars triggered by unequal distribution of spoils"
 ww1_shijiedazhan.1:0 "world war"
 ww1_shijiedazhan.1.t:0 "world war"
 ww1_shijiedazhan.1.d:0 "World class wars between imperialist countries in the early 20th century"
 ww1_shijiedazhan.1.f:0 "After the Sarajevo Incident, German Emperor Wilhelm II issued a "blank check" to the Austro Hungarian Empire, prompting Emperor Franz Joseph I of the Austro Hungarian Empire to issue an "ultimatum" to Serbia on the afternoon of July 23, 1914. The Serbian government accepted all provisions except for Article 5 and Article 6, which violated its own constitution and damaged sovereignty, within a limited time, and began a general mobilization for war. The Austro Hungarian Empire declared war on Serbia on July 28th due to Serbia's failure to accept all terms, and the First World War officially broke out."
 ww1_shijiedazhan.1.b:0 "war to end all wars"
 ww1_shijiedazhan_tt:0 "This is a real event that happened in history"
 je_ww1_shijiedazhan_baofa:0 "July Crisis"
 je_ww1_shijiedazhan_baofa_reason:0 "The spark that ignited the First World War"
 ww1_shijiedazhanks.1:0 "July Crisis"
 ww1_shijiedazhanks.1.t:0 "July Crisis"
 ww1_shijiedazhanks.1.d:0 "The spark that ignited the First World War"
 ww1_shijiedazhanks.1.f:0 "The assassination of [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName] in Sarajevo was exploited by two major military groups driving the war. The militarists of Austria Hungary shouted loudly, 'Pull out the sword and aim at Serbia', completely destroying the obstacles to Austria Hungary's domination of the Balkans. A Vienna newspaper wrote, "For six years, we have been waiting for all serious tensions to finally erupt... We want war because it is the belief of our hearts. Our ideal can only be achieved through a war, in a radical and sudden way: this is a strong Austro Hungarian Empire"
 ww1_shijiedazhanks.1.b:0 "The Austro Hungarian Empire has issued an ultimatum"
 ww1_shijiedazhanks_tt:0 "This is a real event that happened in history"

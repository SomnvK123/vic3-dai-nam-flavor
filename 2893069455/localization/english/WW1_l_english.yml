otl_jingjidaxiaotiao_event:0 "the Depression"
otl_jingjidaxiaotiao_event.1.t:0 "the Depression"
otl_jingjidaxiaotiao_event.1.d:0 "The Wall Street stock market crash has affected the entire capitalist world, including capitalist countries such as the United States, the United Kingdom, the Third French Republic, Germany, and Japan. Only a few socialist and traditionalist countries have survived!"
otl_jingjidaxiaotiao_event.1.f:0 "The bell of the New York Stock Exchange rang like a death knell, and a mountain of sell orders flooded the trading floor. The chain bankruptcies of multinational banks swept across the world like a plague, factory chimneys stopped smoking one after another, and unemployed workers crowded the streets. Your country is currently facing the most severe economic crisis in modern history!"
otl_jingjidaxiaotiao_event.1.a:0 "#r The economic crisis has spread globally!!!#!"
otl_jingjidaxiaotiao_event_tt:0 "This is a true event that happened in American history"
kr_heisexingqiyi_event:0 "black Monday"
kr_heisexingqiyi_event.1.t:0 "black Monday"
kr_heisexingqiyi_event.1.d:0 "The bronze bull statue of the Berlin Stock Exchange collapsed with a loud bang! The excessive expansion of the German Empire's war bonds and colonial development loans completely crushed the global credit system, and banks in New York, London, and Paris successively announced a suspension of payments. Unemployed workers burn Mark paper money to keep warm, farmers pour milk into the Rhine River, and the gears of the world economy crumble between imperial hegemony and capital greed."
kr_heisexingqiyi_event.1.f:0 "On February 3, 1936, the stocks on the Berlin Stock Exchange no longer fell slowly - they collapsed. Driven by the unstable panic in the market, everyone started selling their stocks from the moment the stock market opened on Monday morning.\nThe telegraph did not stop working until late at night, and this day was subsequently known as Black Monday. The analysis results indicate that the situation has deteriorated to an irreversible level overnight.\nUndoubtedly, this unprecedented economic disaster will have an impact on the world. The golden age of Germany has come to an end, at least for now"
kr_heisexingqiyi_event.1.a:0 "#r The economic crisis has spread globally!!!#!"
je_kr_heisexingqiyi:0 "black Monday"
je_kr_heisexingqiyi_reason:0 "As expected, Germany's fiscal economy is deeply mired in crisis and unable to extricate itself. The general public is facing the problem of unsold manufacturing products, with various factories closing down one after another. This means that various domestic and international risk factors will rise again, causing a heavy blow to the country's political landscape."












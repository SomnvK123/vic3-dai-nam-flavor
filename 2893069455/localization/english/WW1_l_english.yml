ww1_usa_canyushijiedazhan_xyg.1.f:0 "The British Foreign Secretary, out of goodwill towards the United States, disclosed to the American ambassador a telegram they had intercepted from the German ambassador to Mexico. Influenced by the Zimmermann Telegram public opinion, the United States has decided to participate in the war of the Allied Powers."

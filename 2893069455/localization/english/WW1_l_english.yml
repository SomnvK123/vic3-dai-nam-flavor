zhengzaijiena:0 "Accepting"
GAME_STARTDATE_DESC:0 "The peace in Europe was on the verge of collapse in 1910. In order to compete for Balkan hegemony, Italy is preparing to engage in a major war with the Ottomans. The rebellion in Morocco has also caused great distress to France, but of course, Germany is pleased to see it. In general, either exhaust all reasoning and maintain peace; Either shout for a fierce battle, with death but no life."
objective_triplealliance_idle_header:1 "move on"
objective_triplealliance_idle_hint:0 "More challenges will arise in the future"
objective_triplealliance:0 "Triple alliance"
objective_triplealliance_desc:0 "The Triple Alliance was a secret alliance formed by Germany, Austria Hungary, and Italy in Vienna.\nIn 1881, France invaded Tunisia from Algeria and turned it into its own protectorate. Italy has long coveted Tunisia, but due to insufficient strength, it cannot confront France alone, so it has turned to Germany and Austria. After negotiations, on May 20, 1882, Germany, Austria, and Italy signed the Treaty of Alliance in Vienna."
objective_triplealliance_name_GER:0 "#v German Empire#!"
objective_triplealliance_desc_GER:0 "#v What was once 35 different independent nations is now the German Empire, seen by many as one of the world's foremost powers, if not the strongest of them all. However, there are many who would trifle with such a state. The German enemy of France has formed the Triple Entente of themselves, the UK, and Russia, all far stronger than Germany's own weak allies. \n\nWith just old Austria and disloyal Italy, Germany needs either more friends or more power to survive the coming times.#!"
objective_triplealliance_name_AUS:0 "#v Austro-Hungary#!"
objective_triplealliance_desc_AUS:0 "#v The last century was a curse to the Austrian throne. Humiliation after humiliation was thrust upon her, from the rampage of Napoleon to the unification of Germany by the Prussians. Venerable old Kaiser Franz Josef now stands as a notable member of the Triple Alliance, with two of her old enemies. But surprisingly, this has gone well for Austria Hungary so far. \n\nThe Hapsburgs have inherited Bosnia, and the people of Hungary finally seem placated. Perhaps more good shall come.#!"
objective_triplealliance_name_ITA:0 "#v Kingdom of Italy#!"
objective_triplealliance_desc_ITA:0 "#v Italy is the smallest third of the Triple Alliance, an alliance with which she has little faith in. Austria-Hungary, Italy's natural rival, is now a friend in the world of treaties but still a rival in practical terms. After all, Italian Irredentism still decrees the Austrian-held Dalmatian coast as Italian. For now, however, there are more pressing matters. \n\nWar plans with the Ottoman Turks are already being drawn up. The government predicts a short, decisive war. Italy shall prove her power.#!"
objective_thetripleentente_idle_header:1 "move on"
objective_thetripleentente_idle_hint:0 "More challenges will arise in the future"
objective_thetripleentente:0 "Triple Entente"
objective_thetripleentente_desc:0 "The Triple Entente is an agreement signed by Britain, France, and Russia in 1907 for mutual understanding and support.\nAfter the signing of the 1904 Treaty of Sincerity and the 1907 Anglo Russian Treaty, various disputes between Britain, France, and Russia have been resolved. These two agreements, along with the Franco Russian alliance, brought these three countries together. \In addition, they are all alarmed by Germany's increasing influence in Europe. Therefore, they formed an alliance called the "Triple Entente"."
objective_thetripleentente_name_GBR:0 "#v British Empire#!"
objective_thetripleentente_desc_GBR:0 "#v The British Empire is still at its zenith. Controlling a massive amount of territory in Africa, Asia, and the Americas through both direct rule and dominions, the United Kingdom still has one continent yet to be mastered: Europe. The United Kingdom has a few allies on the mainland, but none they are particularly fond of. \n\nOf course, good king Edward is surely not long for this world, and crown prince George has time to shake things up. What will the next king do for Britannia's place in Europe?#!"
objective_thetripleentente_name_FRA:0 "#v French Republic#!"
objective_thetripleentente_desc_FRA:0 "#v In 1870, France was dealt a blow by the forming German Empire in a crushing war which saw the loss of Alsace-Lorraine. This made an implacable enemy of France, who has been licking her wounds since. Though the territory is German-speaking, the French people simply will not let this humiliation stand. \n\nFortunately, French diplomacy has built an Entente Cordial with the United Kingdom and Russia. When war breaks out, surely the Germans will crumble. The matter is, of course, ''when''.#!"
objective_thetripleentente_name_RUS:0 "#v Russian Empire#!"
objective_thetripleentente_desc_RUS:0 "#v Recent years have not been kind to the Russian Empire. With a major military defeat at the hands of Japan, followed by a revolution that forced the once-invincible Tsar into a constitution, the Russian government must get back on its feet and prove its strength again, or risk revolution. \n\nLuckily, the Balkans are turbulent again. The crumbling Ottoman Empire is Russia's opportunity to expand, create new puppet states, and more importantly, prove it is still a world power.#!"
objective_europepowderkeg_idle_header:1 "move on"
objective_europepowderkeg_idle_hint:0 "More challenges will arise in the future"
objective_europepowderkeg:0 "European powder keg"
objective_europepowderkeg_desc:0 "In the competition among European powers, the Balkans became the focus of imperialist contradictions at that time, and control over the Balkan Peninsula became a key point of contention among the powers. The Ottoman Empire, which ruled the Balkan region, gradually declined since the late 17th century and had difficulty maintaining effective rule in the Balkans by the 19th century. So, it became a hotspot area for European powers to attempt to redivide. Since Europeans call Asia the East, the struggle for the Balkans caused by the decline of Türkiye has been called the "Eastern Problem" in history. The fierce competition among European powers has made the Balkan issue more complex, and the tense situation is increasingly escalating, with small-scale and small-scale wars constantly occurring. The Balkans, splattered with Mars, became a "powder keg" on the brink of European war."
objective_europepowderkeg_name_SER:0 "#v Serbia#!"
objective_europepowderkeg_desc_SER:0 "Serbia is seen by outsiders as a backwater, minor nation. Nothing more than a pawn in a great game that the world's empires are playing as each other. Of course, the empires of the world may learn sooner than they think that the Serbs are destined for greater things. \n\nCurrently, most Serbs live outside our borders, in Turkish or Austrian territory. If we are to make a deal with the devil- the Bulgarians- the Serbs may begin their road for glory by way of full Serbian unification."
objective_europepowderkeg_name_TUR:0 "#v Ottoman Empire#!"
objective_europepowderkeg_desc_TUR:0 "#v Storm clouds are gathering over Konstantiniyye. Serbia, Greece and Bulgaria have been scheming together again- likely a war to try and claim the territory they unrightfully claim is theirs. The Albanians are close to revolt. The Italian government is also very publicly contemplating a conquest of Tripolitania. \n\nLoss of territory is nearly inevitable. Ottoman Diplomacy, therefore, should center around ensuring we keep the capital, if nothing else.#!"
objective_europepowderkeg_name_BUL:0 "#v Bulgaria#!"
objective_europepowderkeg_desc_BUL:0 "#v "Bulgaria has already made a name for itself through successful conflicts against the Serbs and outmaneuvering the Ottoman Empire to unify with Eastern Rumelia. Of course, now the state stands at a more uncomfortable position. The Turks seem unwilling to put up any more Bulgarian territory for grabs, and the Russians are slowly withdrawing their support. \n\nPerhaps it is not too late to mend fences with Serbia? After all, a Bulgaria with strong friends could be a surprising menace."#!"
objective_europepowderkeg_name_GRE:0 "#v Greece#!"
objective_europepowderkeg_desc_GRE:0 "The past few decades have proven quite tough for Greece. The bankruptcy of 1893, the lost Greco-Turkish war of 1897 with imposed international financial control and the Goudi coup of 1909 have left Greece in a dire state. It is time now that reforms are passed in all sectors, especially with the war looming on the sick man of Europe, the Ottomans. \n\nIt is time we rid this country of past failures and stabilize it. Perhaps in the process we will reconquer our long lost capital since 1453."
objective_europepowderkeg_name_MON:0 "#v Montenegro#!"
objective_europepowderkeg_desc_MON:0 "#v With the decline of the Ottoman Empire, the future of Montenegro became unprecedentedly uncertain. Will new forces emerge from the Balkan Peninsula?#!"
objective_europepowderkeg_name_ROM:0 "#v Romania#!"
objective_europepowderkeg_desc_ROM:0 "In 1910, the Kingdom of Romania, led by King Carol I, is a young nation striving for modernization. While cities like Bucharest are developing, the country remains largely agrarian, with a sharp divide between wealthy landowners and the peasant majority. Having gained independence from the Ottoman Empire, Romania is focused on strengthening its national identity, with hopes of uniting all Romanians, including those in territories like Transylvania, still under foreign control."
objective_dongyazhizheng_idle_header:1 "move on"
objective_dongyazhizheng_idle_hint:0 "More challenges will arise in the future"
objective_dongyazhizheng:0 "East Asian Controversy"
objective_dongyazhizheng_desc:0 "The situation in East Asia is complex and intricate. The Qing Dynasty was in turmoil, and the old imperial system was about to disintegrate. Japan is actively expanding its influence in East Asia, and its annexation of Korea is imminent, leading to increasingly tense tensions on the peninsula. Although Siam maintained independence, it also faced the covetousness of British and French colonizers. The Anglo Japanese alliance is increasingly consolidated, but the shadow of the Russo Japanese War has not completely dissipated."
objective_dongyazhizheng_name_JAP:0 "#v Empire of Japan#!"
objective_dongyazhizheng_desc_JAP:0 "In just under 50 years, Japan has turned from a backwards despotate ruled by a Shogun to a proper modern Empire, just as powerful as any country Europe has to offer. Emperor Meiji is to thank for it, but sadly he is both old and diseased- and can't possibly live much longer. \n\nBefore Crown Prince Yoshihito takes the crown, there are a few more matters to settle, however. The elderly emperor must decide where Japan stands with Russia, and what to do with the Korean vassal."
objective_dongyazhizheng_name_CHI:0 "#v Republic of China#!"
objective_dongyazhizheng_desc_CHI:0 "The Qing dynasty is on the brink of collapse. The nineteenth century brought with it disastrous defeats in the Opium Wars, the rebellion in the south, and numerous failed reforms. With the deaths of the old Empress Dowager and the Guangxu Emperor, the four year old Xuantong Emperor is incapable of ruling the country, leaving only regents. \n\nOpposition is rising rapidly, and with the Boxer Rebellion still fresh in the minds of many, it is unclear what will become of the nation."
objective_dongyazhizheng_name_KOR:0 "#v Korea#!"
objective_dongyazhizheng_desc_KOR:0 "Korea, the land of the morning calm was a pre-modern kingdom that maintained its policy of isolationism. However, the unprepared opening of the port, which was forced by Japanese, led to Korea has been hampered and swayed by external forces trying to dominate Korea, in all processes. In the end, the country that won all the competition was their unfriendly neighbor Japan, and they deprived Korea of its diplomatic rights, and disbanded the army, without any interference.\n\nNow, the only thing left is to be annexed by Japan. But Koreans are burning with the will to resist to the end."
objective_dongyazhizheng_name_SIA:0 "#v Siam#!"
objective_dongyazhizheng_desc_SIA:0 "Siam is no longer protected by the Ming and Qing dynasties and is highly vulnerable to the colonial policies of France and Britain. Can Siam survive the colonial expansion of imperialism?"
ecchi_ger_hitler_character_template_decision:0 "Hitler becomes the F ü hrer"
ecchi_ger_hitler_character_template_decision_desc:0 "Hitler became the head of Nazi Germany"
ecchi_ita_mussolini_character_template_decision:0 "Mussolini becomes Prime Minister"
ecchi_ita_mussolini_character_template_decision_desc:0 "Mussolini becomes the Prime Minister of Fascist Italy"
riben_empire2_decision:0 "Showa Yamato becomes Emperor"
riben_empire2_decision_desc:0 "Showa Yamato became Emperor of the Empire of Japan"
chi_general_yuan_shikai_decision:0 "Yuan Shikai proclaimed himself emperor"
chi_general_yuan_shikai_decision_desc:0 "Yuan Shikai became the emperor of the Chinese Empire"
je_ger_aus_deaotongmeng_button:0 "Support Austria's territorial claims"
je_ger_aus_deaotongmeng_button_desc:0 "Austrians are our compatriots. We will support their territorial claim of Lombardy Veneto in Italy, which should belong to Austria.\n#g This is a true choice in history#!"
je_ger_aus_beici_button:0 "Backstab"
je_ger_aus_beici_button_desc:0 "Austria is more of a burden than an ally. The ethnic division and weak military strength of the country mean that it can only constantly seek our help. If we abandon them, perhaps we can find stronger allies.\n#r This may cause the world line to deviate from the script#!"
ger_aus_deaotongmeng_yiwancheng:0 "No support for Austria's territorial claims"
ger_aus_beici_yiwancheng:0 "No backstab"
je_deaotongmeng:0 "triple alliance"
je_deaotongmeng_reason:0 "#v With the rise of Prussian militarism#o Austria#!和#o Italy#!There are two options for attitude.#!\n#g Our alliance with the Austro Hungarian Empire means that we promise to support each other in the event of an attack by Russia. We must help our Austrian friends defeat Russia.#!\n#r The establishment of the German Austrian Alliance has a history of more than 20 years, and its terms and conditions are outdated and no longer meet the needs of our great empire. If we threaten at the cost of the alliance's survival, perhaps we can negotiate better conditions for ourselves.#!\n\n#v with#o ottoman#!Seeking stability in the complex situation in West Asia#o Greece#!The attitude has become an important decision before us.#!\n#g Our alliance with the Ottoman Empire means that we will take on the responsibility of protecting this ancient empire from foreign aggression. In the face of possible provocations from Greece, we must firmly stand on the side of Ottoman friends and jointly resist Greece's ambitions.#!\n#r The corruption within the Ottoman Empire and external challenges have made this alliance increasingly heavy. The decline of the Ottoman Empire is an undeniable fact, and continuing to be bound to this alliance may only slow down the progress of our great empire. If we can cleverly exploit the cracks in this alliance, perhaps we can force Greece to make concessions, thereby gaining a more advantageous position and benefits for ourselves.#!\n\n#v With the escalating conflicts in the Balkans#o Bulgaria#!和#o Romania#!Our attitude has become a matter that we must carefully consider.#!\n#g The Balkan Little Prussia is bound to unleash a combat power several times its size, and must not let potential allies be attacked from both sides. We must fully support our Bulgarian allies and work together to counter Romania's expansionist ambitions.#!\n#r Romania is the sword of Damocles hanging over Bulgaria's head, how can Bulgaria, as a Slavic nation, be loyal to us? It's time to end this farce, Romania's rich oil fields are the allies we truly need.#!"
ger_aus_deaotongmeng_event:0 "Germany supports Austria's territorial claims"
ger_aus_deaotongmeng_event.1.t:0 "Germany supports Austria's territorial claims"
ger_aus_deaotongmeng_event.1.d:0 "The policies of the new Italian king were relatively consistent with those of the Allied powers, standing on the side of the anti German camp."
ger_aus_deaotongmeng_event.1.f:0 "Austrians are compatriots of germans. Germany will support their claim to the Lombardy Veneto territory of Italy, which should belong to Austria."
ger_aus_deaotongmeng_event.1.a:0 "Operation Rome"
ger_aus_deaotongmeng_event_tt:0 "This is a true choice in German history"
ger_aus_beici_event:0 "Germany backstab Austria"
ger_aus_beici_event.1.t:0 "Germany backstab Austria"
ger_aus_beici_event.1.d:0 "The Austro Hungarian Empire was unbearable and should have been divided a long time ago. For the sake of its own country and its fellow citizens in Austria, Germany must destroy this country."
ger_aus_beici_event.1.f:0 "Austria is more of a burden than an ally. The ethnic division and weak military strength of the country mean that it can only constantly seek help from Germany. If we abandon them, perhaps we can find stronger allies."
ger_aus_beici_event.1.a:0 "quarrel between brothers"
deaozhanzheng_event:0 "German Austrian War"
deaozhanzheng_event.1.t:0 "German Austrian War"
deaozhanzheng_event.1.d:0 "The Austro Hungarian Empire received a request from the German Empire today. They put forward a series of demands that were almost equivalent to annexing Austria. If accepted, it would prevent a devastating war and save the people from suffering, but Austria's sovereignty would disappear with it. And Austria's refusal triggered this war."
deaozhanzheng_event.1.f:0 "The German Empire invaded its former ally Austria Hungary, which surprised other great powers. Our government is highly concerned about this absurd and unprecedented situation. The German army has swept through the Austrian region and is preparing to capture Hungary. The whole of Europe held its breath at this moment."
deaozhanzheng_event.1.a:0 "The Second Brothers' War?"
deaohejie_event:0 "German Austrian reconciliation"
deaohejie_event.1.t:0 "German Austrian reconciliation"
deaohejie_event.1.d:0 "Although Germany had a certain advantage in the early stages of the war, over time, the Austro Hungarian Empire gradually found ways to deal with the German army. After a series of intense battles, Germany was ultimately defeated and forced to accept the fact of defeat."
deaohejie_event.1.f:0 "After the defeat, Germany began to seek reconciliation with the Austro Hungarian Empire. The two sides gradually reached a settlement agreement through secret negotiations. In the agreement, Germany acknowledged the victory of the Austro Hungarian Empire in the war and agreed to pay a certain amount of reparations to compensate for its losses in the war. At the same time, in order to safeguard the common interests of both countries, both sides also agreed to strengthen cooperation in future international affairs and jointly respond to threats from other countries."
deaohejie_event.1.a:0 "This failed battle worsened relations between Germany, Italy, and other countries"
faguodezuihoutongdie_event:0 "France's ultimatum"
faguodezuihoutongdie_event.1.t:0 "France's ultimatum"
faguodezuihoutongdie_event.1.d:0 "Austria fell and Vienna fell to the enemy. We are increasingly realizing that this is a futile struggle, and the light of hope is slowly fading. But we will continue to fight and regroup before the next attack. The Austro Hungarian royal family and government have moved to Waileitania, far from the front line. No one died in the ruins of this once proud empire."
faguodezuihoutongdie_event.1.f:0 "French diplomats have submitted an ultimatum to the German government, demanding that we cease military action against Austria Hungary or declare war. Germany accepted the ultimatum, after all, it could still obtain the Austrian region, but the Kingdom of Hungary would be retained, and the other parts of the Austro Hungarian Empire would be established on their own."
faguodezuihoutongdie_event.1.a:0 "Being content brings happiness, and when you see something good, you stop"
je_deaozhanzheng_ger:0 "German Austrian War"
je_deaozhanzheng_ger_reason:0 "Germany has declared a full-scale war with the Austro Hungarian Empire. If Germany wins, it can annex Austria and establish Greater Germany. If the Austro Hungarian Empire wins, then after the reconciliation between Germany and Austria, the relationship between Germany and its new ally will reach a freezing point."
aierlanjiaru_event.1:0 "Ireland's participation in the war"
aierlanjiaru_event.1.t:0 "Ireland's participation in the war"
aierlanjiaru_event.1.d:0 "Ireland's involvement in Germany's war"
aierlanjiaru_event.1.f:0 "The German army achieved significant victories on the Eastern Front with its strong military power, and the British government's presence and rule in Northern Ireland also sparked strong dissatisfaction among the Irish people. The Irish government saw the opportunity to join the Axis powers. They believe that through cooperation with Axis powers such as Germany, they can not only enhance their own military strength, but also hope to regain the land of Northern Ireland occupied by Britain."
aierlanjiaru_event.1.a:0 "The balance of victory will tilt towards the Axis powers"
je_ger_tur_aosiman_button:0 "Alliance with the Ottoman Empire"
je_ger_tur_aosiman_button_desc:0 "Germany supports its traditional ally, the Ottoman Empire.\n#g This is a true choice in history#!"
je_ger_tur_xila_button:0 "Alliance with Greece"
je_ger_tur_xila_button_desc:0 "Germany abandoned the Ottoman Empire and formed an alliance with Greece.\n#r This may cause the world line to deviate from the script#!"
ger_tur_aosiman_event:0 "Germany forms an alliance with the Ottoman Empire"
ger_tur_aosiman_event.1.t:0 "Germany forms an alliance with the Ottoman Empire"
ger_tur_aosiman_event.1.d:0 "The Ottoman Empire had just experienced several major defeats in wars, resulting in significant territorial losses, economic difficulties, and even turmoil in the remaining parts of the empire. Faced with such a situation, many people in the Ottoman government believed that the solution to the country's problems was to form an alliance with a major power. In this context, the alliance between Germany and the Ottoman Empire began to gradually brew."
ger_tur_aosiman_event.1.f:0 "The Ottoman Empire faced territorial loss and economic difficulties, and urgently needed allies to defend against foreign aggression. Germany, also seeking allies to distract Britain's attention, expressed interest in the Ottoman Empire. Germany had significant commercial interests in the Ottoman Empire, particularly the Berlin Baghdad railway, and provided military advisors to reform the Ottoman army."
ger_tur_aosiman_event.1.a:0 "Is the Berlin Baghdad Railway about to be built?"
ger_tur_aosiman_event_tt:0 "This is a true choice in German history"
ger_tur_xila_event:0 "Germany and Greece form an alliance"
ger_tur_xila_event.1.t:0 "Germany and Greece form an alliance"
ger_tur_xila_event.1.d:0 "Germany's foreign policy underwent a major turning point, choosing to establish closer relations with Greece and gradually distancing itself from its traditional ally, the Ottoman Empire."
ger_tur_xila_event.1.f:0 "For a long time, Germany has maintained certain diplomatic ties with the Ottoman Empire, especially in the military and economic fields. However, with the tense international situation before World War I, Germany began to reassess its diplomatic strategy. The internal political instability, economic decline, and potential role of the Ottoman Empire in wars have raised doubts in Germany about its future value.\nAt the same time, Greece, as a relatively stable and geographically important country, began to be favored by Germany. Greece not only has strategic significance in geopolitics, but its government is relatively stable and its military strength should not be underestimated. Germany believes that forming an alliance with Greece will help enhance its influence in the Balkan Peninsula region, while also providing new support for its military layout in Europe."
ger_tur_xila_event.1.a:0 "Complete isolation of the sick man in Europe"
ger_tur_xila_yiwancheng:0 "Not allied with Greece"
ger_tur_aosiman_yiwancheng:0 "Not allied with the Ottoman Empire"
je_ger_bul_baojialiya_button:0 "Support Bulgaria"
je_ger_bul_baojialiya_button_desc:0 "Germany supports its traditional ally Bulgaria.\n#g This is a true choice in history#!"
je_ger_bul_luomaniya_button:0 "Support Romania"
je_ger_bul_luomaniya_button_desc:0 "Germany abandoned Bulgaria and formed an alliance with Romania.\n#r This may cause the world line to deviate from the script#!"
ger_bul_baojialiya_event:0 "Germany supports Bulgaria"
ger_bul_baojialiya_event.1.t:0 "Germany supports Bulgaria"
ger_bul_baojialiya_event.1.d:0 "The alliance negotiations between Germany and Bulgaria are accelerating. Germany has made an attractive offer to Bulgaria, promising to support Bulgaria in acquiring parts of Macedonia and Serbia along the Morava River, and providing military loans as compensation for Bulgaria's military attack on Serbia. These conditions were highly attractive to Bulgaria, so it began to lean towards the Allied camp."
ger_bul_baojialiya_event.1.f:0 "Germany and Bulgaria officially signed three important documents, marking the formal establishment of the German Bulgarian Alliance. These three documents are the Treaty of Friendship between Germany and Bulgaria, the Secret Agreement between Germany and Bulgaria, and the Military Pact between Germany, Austria Hungary, and Bulgaria."
ger_bul_baojialiya_event.1.a:0 "Laying the groundwork for the development of the Balkan battlefield situation"
ger_bul_baojialiya_event_tt:0 "This is a true choice in German history"
ger_bul_luomaniya_event:0 "Germany supports Romania"
ger_bul_luomaniya_event.1.t:0 "Germany supports Romania"
ger_bul_luomaniya_event.1.d:0 "The German government has made an unexpected decision in its diplomatic strategy - to abandon its traditional ally Bulgaria and instead form an alliance with Romania."
ger_bul_luomaniya_event.1.f:0 "Germany hopes to balance Russia's influence in the Balkans by forming an alliance with Romania. Russia has been trying to expand its influence in the region by supporting Balkan countries such as Bulgaria. Germany believes that by forming an alliance with Romania, it can break Russia's strategic deployment and weaken its position in the Balkans. Romania is located in the northern part of the Balkan Peninsula, bordering Germany and the Austro Hungarian Empire. By forming an alliance with Romania, Germany can ensure unobstructed strategic routes in Southeast Europe, providing convenience for possible future military operations."
ger_bul_luomaniya_event.1.a:0 "This decision has also caused strong dissatisfaction and disappointment in Bulgaria"
ger_bul_baojialiya_yiwancheng:0 "No support for Bulgaria"
ger_bul_luomaniya_yiwancheng:0 "No support for Romania"
je_sanguoxieyue:0 "the Triple Entente"
je_sanguoxieyue_reason:0 "#v France can negotiate with other Allied members to exchange its territory for more allies.#!\n#g If our allies agree to our negotiations, we will pay money or territory as compensation to increase the chances of forming an alliance after the outbreak of war.#!\n#r But it is worth noting that all the potential allies exchanged are not necessarily on your side, and there is still a possibility of betrayal.#!\n\n#u Potential allies:#!\n[SCOPE.sCountry('sanguoxieyue_qianzaimengyou_spa_scope').GetName]#u want#!#o Morocco#!\n[SCOPE.sCountry('sanguoxieyue_qianzaimengyou_eth_scope').GetName]#u want#!#o ERITREA#!\n[SCOPE.sCountry('sanguoxieyue_qianzaimengyou_arg_scope').GetName]#u want#!#o Falklands#!\n[SCOPE.sCountry('sanguoxieyue_qianzaimengyou_gua_scope').GetName]#u want#!#o belize#!\n[SCOPE.sCountry('sanguoxieyue_qianzaimengyou_swe_scope').GetName]#u want#!#o oran#!\n[SCOPE.sCountry('sanguoxieyue_qianzaimengyou_afg_scope').GetName]#u want#!#o Tajikistan#!\n\n#i When we acquire potential allies, we can waive obligations at any time to increase our relationship, maintain friendly relations, and have a chance to join the Allied Powers during a world war.#!"
je_fra_fra_xibanya_button:0 "Exchange territory for Spanish support"
je_fra_fra_xibanya_button_desc:0 "The Agadir crisis has fully exposed Germany's ambition to expand in North Africa. Since Russia can sell Alaska to the United States, why can't we sell Morocco to Spain? It is also possible to transfer a relatively remote but strategically valuable territory within Morocco to Spain in exchange for Spain's potential support for us."
fra_fra_xibanya_yiwancheng:0 "Prepaid to Morocco"
fra_fra_xibanya_event:0 "France trades its territory for Spanish support"
fra_fra_xibanya_event.1.t:0 "France trades its territory for Spanish support"
fra_fra_xibanya_event.1.d:0 "France paid Morocco to Spain in exchange for its potential support during the World War"
fra_fra_xibanya_event.1.f:0 "The Agadir crisis has fully exposed Germany's ambition to expand in North Africa. Since Russia can sell Alaska to the United States, why can't France sell Morocco to Spain? It is also possible to transfer a relatively remote but strategically valuable territory within Morocco to Spain in exchange for Spain's potential support for France."
fra_fra_xibanya_event.1.a:0 "Who remembers that Morocco is a sovereign country?"
je_fra_fra_aisaiebiya_button:0 "Exchange territory for Ethiopian support"
je_fra_fra_aisaiebiya_button_desc:0 "The colonization of Ethiopia was an investment that did not make ends meet, and we see no meaning in continuing it. Rather than eat British leftovers in the Horn of East Africa, it is better to give Eritrea to Ethiopia. This can also ease the tense relationship with Italy, making it a win-win situation."
fra_fra_aisaiebiya_yiwancheng:0 "Prepaid to Eritrea"
fra_fra_aisaiebiya_event:0 "France exchanges territory for support from Ethiopia"
fra_fra_aisaiebiya_event.1.t:0 "France exchanges territory for support from Ethiopia"
fra_fra_aisaiebiya_event.1.d:0 "France paid Eritrea to Ethiopia in exchange for its potential support during the World War"
fra_fra_aisaiebiya_event.1.f:0 "France's colonization of Ethiopia was an investment that did not make ends meet, with no visible purpose for continuing. Rather than eat British leftovers in the Horn of East Africa, it is better to give Eritrea to Ethiopia. This can also ease the tense relationship with Italy, making it a win-win situation."
fra_fra_aisaiebiya_event.1.a:0 "Forming alliances with African countries there was no parallel in history"
je_fra_gbr_agenting_button:0 "Exchange territory for Argentine support"
je_fra_gbr_agenting_button_desc:0 "We are willing to pay a huge deposit to the UK to purchase its sovereignty over the Falkland Islands, but the condition is that the UK must tacitly approve France's transfer of the Falkland Islands to Argentina. The original intention of this plan is that Argentina's historical demand for the Falkland Islands can serve as a bridge for France and Argentina to establish a deep friendship, thereby inducing Argentina to side with France in World War I."
fra_gbr_agenting_yiwancheng:0 "Prepaid South Atlantic Islands"
fra_gbr_agenting_event:0 "France trades its territory for Argentina's support"
fra_gbr_agenting_event.1.t:0 "France requests us to pay for the South Atlantic Islands"
fra_gbr_agenting_event.1.d:0 "France has already paid us a deposit and hopes to purchase the South Atlantic Islands from us"
fra_gbr_agenting_event.1.f:0 "France, a traditional continental power, urgently needs to find allies and ways to enhance its military strength in the face of the increasing threat from Germany. The French government secretly contacted Britain and made an unprecedented proposal: France was willing to pay a huge deposit to purchase Britain's sovereignty over the Falkland Islands, but the condition was that Britain agreed to France's transfer of the Falkland Islands to Argentina as bait, hoping that Argentina could stand on France's side in the upcoming war and jointly resist the Central European Allied Powers led by Germany."
fra_gbr_agenting_event.1.a:0 "We gladly accept it"
fra_gbr_agenting_event.1.b:0 "This is not in our interest"
fra_gbr_agenting_event.2.t:0 "Britain agrees to exchange territory for Argentine support"
fra_gbr_agenting_event.2.d:0 "France is willing to pay a huge deposit to Britain to purchase its sovereignty over the Falkland Islands, but the condition is that Britain must tacitly approve France's transfer of the Falkland Islands to Argentina. The original intention of this plan is that Argentina's historical demand for the Falkland Islands can serve as a bridge for France and Argentina to establish a deep friendship, thereby inducing Argentina to side with France in World War I."
fra_gbr_agenting_event.2.f:0 "After careful consideration, the British government ultimately decided to accept this proposal, but with several key conditions attached: first, France must ensure that Argentina maintains neutrality or leans towards the positions of Britain and France during World War I; Secondly, France needs to commit to assisting Britain in restoring sovereignty over the Falkland Islands after the war, or at least ensuring that Britain's interests on the Falkland Islands are not harmed."
fra_gbr_agenting_event.2.a:0 "Unite as one, stand united against the enemy"
fra_gbr_agenting_event.3.t:0 "Britain refuses to exchange territory for Argentine support"
fra_gbr_agenting_event.3.d:0 "France is willing to pay a huge deposit to Britain to purchase its sovereignty over the Falkland Islands, but the condition is that Britain must tacitly approve France's transfer of the Falkland Islands to Argentina. The original intention of this plan is that Argentina's historical demand for the Falkland Islands can serve as a bridge for France and Argentina to establish a deep friendship, thereby inducing Argentina to side with France in World War I."
fra_gbr_agenting_event.3.f:0 "As expected by France, the British government rejected this proposal. The UK emphasizes its undisputed sovereignty over the Falkland Islands and warns France not to attempt to challenge this principle. Faced with the tough stance of the UK, the French government did not give up, but quickly adjusted its strategy."
fra_gbr_agenting_event.3.a:0 "There are no eternal friends or enemies, only eternal interests"
je_fra_gbr_weidimala_button:0 "Exchange territory for Guatemalan support"
je_fra_gbr_weidimala_button_desc:0 "We can use clever diplomatic means to gift British Belize to the Central American country of Guatemala, which can expand our influence in the region and gain Guatemala's clear support for France during World War I."
fra_gbr_weidimala_yiwancheng:0 "Prepaid to Guatemala"
fra_gbr_weidimala_event:0 "France exchanges territory for support from Guatemala"
fra_gbr_weidimala_event.1.t:0 "France requests us to pay Belize"
fra_gbr_weidimala_event.1.d:0 "France has already paid us a deposit and hopes to purchase Belize from us"
fra_gbr_weidimala_event.1.f:0 "Faced with France's proposal to purchase British Belize and gift it to Guatemala, the British government had in-depth discussions internally. On the one hand, although Belize had strategic value, at that time Britain was busy with global colonial affairs and naval expansion, with enormous financial pressure, and British Belize was not its core colony. On the other hand, the conditions proposed by France are extremely tempting, not only offering a generous deposit, but also promising to gift Belize to Guatemala, which helps alleviate the management pressure of Britain in the colonies, while maintaining Britain's international image and avoiding direct involvement in territorial disputes in Central America."
fra_gbr_weidimala_event.1.a:0 "We gladly accept it"
fra_gbr_weidimala_event.1.b:0 "This is not in our interest"
fra_gbr_weidimala_event.2.t:0 "Britain agrees to exchange territory for support from Guatemala"
fra_gbr_weidimala_event.2.d:0 "France hopes to use clever diplomatic means to gift British Belize to the Central American country of Guatemala, which can expand its influence in the region and gain Guatemala's clear support for France during World War I."
fra_gbr_weidimala_event.2.f:0 "After careful consideration, the British government ultimately decided to accept France's proposal to "transfer" British Belize to France, which would then transfer it to Guatemala. However, a private agreement was reached with France to ensure that certain special interests of Britain in Belize were not compromised and to retain the option of potentially regaining control of the area in the future."
fra_gbr_weidimala_event.2.a:0 "Unite as one, stand united against the enemy"
fra_gbr_weidimala_event.3.t:0 "Britain refuses to exchange territory for support from Guatemala"
fra_gbr_weidimala_event.3.d:0 "France hopes to use clever diplomatic means to gift British Belize to the Central American country of Guatemala, which can expand its influence in the region and gain Guatemala's clear support for France during World War I."
fra_gbr_weidimala_event.3.f:0 "Faced with France's proposal to purchase British Belize and gift it to Guatemala, the British government showed high vigilance and resolute refusal. The UK is well aware that Belize's strategic location is crucial for controlling Caribbean shipping routes and protecting its interests in the Caribbean region. In addition, Britain is also concerned that agreeing to France's proposal may trigger a chain reaction in other colonies, weakening Britain's colonial hegemony on a global scale."
fra_gbr_weidimala_event.3.a:0 "There are no eternal friends or enemies, only eternal interests"
je_fra_rus_ruidian_button:0 "Exchange territory for Swedish support"
je_fra_rus_ruidian_button_desc:0 "During the Great Northern War, Sweden was once a powerful power in Europe. Although it gradually declined, its geographical location and military potential should not be underestimated. If we can return the lost homeland of Sweden, it is very likely to win a strong Nordic ally for France. It can not only plant a chess piece to balance Germany in the Nordic region, but also utilize Sweden's control over the Baltic Sea to provide support for its maritime strategy."
fra_rus_ruidian_yiwancheng:0 "Prepaid Oran"
fra_rus_ruidian_event:0 "France exchanges territory for Swedish support"
fra_rus_ruidian_event.1.t:0 "France requests us to pay Oran"
fra_rus_ruidian_event.1.d:0 "France has already paid us a deposit and hopes to purchase Oran from us"
fra_rus_ruidian_event.1.f:0 "For Russia, the proposed sale of Å land Island initially seemed like an unexpected wealth. Since the era of Peter the Great, Russia has been committed to expanding eastward, and although it is interested in controlling the Baltic Sea coast, it is not its core interest. Especially in the late 19th and early 20th centuries, Russia was busy competing with the Ottoman Empire for the Caucasus region and dealing with the growing revolutionary sentiment domestically. Every step in diplomacy needed to be carefully considered."
fra_rus_ruidian_event.1.a:0 "We gladly accept it"
fra_rus_ruidian_event.1.b:0 "This is not in our interest"
fra_rus_ruidian_event.2.t:0 "Russia agrees to exchange its territory for Sweden's support"
fra_rus_ruidian_event.2.d:0 "During the Great Northern War, Sweden was once a powerful power in Europe. Although it gradually declined, its geographical location and military potential should not be underestimated. France hopes to return the lost homeland of Sweden, which is likely to win a strong Nordic ally for the Allied powers. It can not only plant a chess piece to balance Germany in the Nordic region, but also utilize Sweden's control over the Baltic Sea to provide support for our own maritime strategy."
fra_rus_ruidian_event.2.f:0 "After intense cabinet discussions, some Russian officials believe that short-term economic benefits and the need to ease relations with France outweigh long-term geopolitical concerns. Russia ultimately agreed to sell the island of Oran to France, on the condition that France promised to support Russia's interests in the Balkans after the war. Although this decision temporarily eased Russia's financial pressure, it also added more complexity to later international relations."
fra_rus_ruidian_event.2.a:0 "Unite as one, stand united against the enemy"
fra_rus_ruidian_event.3.t:0 "Russia refuses to exchange its territory for Sweden's support"
fra_rus_ruidian_event.3.d:0 "During the Great Northern War, Sweden was once a powerful power in Europe. Although it gradually declined, its geographical location and military potential should not be underestimated. France hopes to return the lost homeland of Sweden, which is likely to win a strong Nordic ally for the Allied powers. It can not only plant a chess piece to balance Germany in the Nordic region, but also utilize Sweden's control over the Baltic Sea to provide support for our own maritime strategy."
fra_rus_ruidian_event.3.f:0 "Russian senior officials have deeply analyzed the potential risks of the Oran Island transaction and believe that this move may involve Russia in more complex international disputes. Especially considering Germany's rise in Europe and the subtle changes that may arise between it and Sweden due to the Å land Island, Russia has decided to reject France's proposal. The Russian Foreign Minister stated in public that safeguarding the long-term interests of the country is paramount, and any decision should be based on careful consideration of national security. Although this stance may cause setbacks in the short term in the relationship between France and Russia, in the long run, it reserves more diplomatic flexibility and strategic space for Russia."
fra_rus_ruidian_event.3.a:0 "There are no eternal friends or enemies, only eternal interests"
je_fra_rus_afuhan_button:0 "Exchange territory for Afghan support"
je_fra_rus_afuhan_button_desc:0 "Tajikistan, located in the heart of Central Asia, not only has abundant natural resources, but is also a strategic location connecting the East and the West. Afghanistan has repeatedly become a sacrificial lamb in the history of great power struggles, and as a victim of the Anglo Russian rivalry, it deserves territorial compensation. Rather than having an imperial cemetery, it's better to strive for an important regional ally. In addition, Afghanistan's geographical location makes it a bridge connecting South Asia and Central Asia, which is of great significance for France's strategic layout in Asia."
fra_rus_afuhan_yiwancheng:0 "Prepaid to Tajikistan"
fra_rus_afuhan_event:0 "France trades territory for Afghan support"
fra_rus_afuhan_event.1.t:0 "France requests us to pay Tajikistan"
fra_rus_afuhan_event.1.d:0 "France has already paid us a deposit and hopes to purchase Tajikistan from us"
fra_rus_afuhan_event.1.f:0 "For Russia, Tajikistan is not only a part of its imperial territory, but also an important strategic pivot in Central Asia. In history, Russia has invested significant effort in establishing influence in Central Asia to resist the infiltration of British forces. Therefore, when France proposed to purchase Tajikistan and gift it to Afghanistan, the Russian leadership was deeply pondering. On the one hand, Russia is facing financial difficulties, especially with the rise of domestic revolutionary movements, and urgently needs external funding support. The deposit amount proposed by France is huge and tempting to alleviate Russia's financial pressure. On the other hand, Russia is well aware of Tajikistan's strategic value, and surrendering it not only means weakening its influence in Central Asia, but may also trigger a chain reaction that affects Russia's stability in the entire Central Asian region."
fra_rus_afuhan_event.1.a:0 "We gladly accept it"
fra_rus_afuhan_event.1.b:0 "This is not in our interest"
fra_rus_afuhan_event.2.t:0 "Russia agrees to exchange territory for Afghan support"
fra_rus_afuhan_event.2.d:0 "Tajikistan, located in the heart of Central Asia, not only has abundant natural resources, but is also a strategic location connecting the East and the West. Afghanistan has repeatedly become a sacrificial lamb in the history of great power struggles, and as a victim of the Anglo Russian rivalry, it deserves territorial compensation. Rather than having an imperial cemetery, it's better to strive for an important regional ally. In addition, Afghanistan's geographical location makes it a bridge connecting South Asia and Central Asia, which is of great significance for the strategic layout of the Allied Powers in Asia."
fra_rus_afuhan_event.2.f:0 "After a series of complex internal discussions, some Russian officials believe that short-term economic benefits and the need to ease relations with France outweigh long-term geopolitical concerns. Russia ultimately agreed to sell Tajikistan to France, on the condition that France promised to support Russia's interests in Central Asia after the war and ensure that Afghanistan would not become a puppet of Britain. Although this decision temporarily eased Russia's financial pressure, it also added more complexity to later international relations."
fra_rus_afuhan_event.2.a:0 "Unite as one, stand united against the enemy"
fra_rus_afuhan_event.3.t:0 "Russia refuses to exchange territory for Afghan support"
fra_rus_afuhan_event.3.d:0 "Tajikistan, located in the heart of Central Asia, not only has abundant natural resources, but is also a strategic location connecting the East and the West. Afghanistan has repeatedly become a sacrificial lamb in the history of great power struggles, and as a victim of the Anglo Russian rivalry, it deserves territorial compensation. Rather than having an imperial cemetery, it's better to strive for an important regional ally. In addition, Afghanistan's geographical location makes it a bridge connecting South Asia and Central Asia, which is of great significance for the strategic layout of the Allied Powers in Asia."
fra_rus_afuhan_event.3.f:0 "Russian senior officials have deeply analyzed the potential risks of the Tajikistan transaction and believe that this move may involve Russia in more complex international disputes. Especially considering the traditional ties between Afghanistan and the UK, as well as the importance of Tajikistan for Russia's stability in Central Asia, Russia has decided to reject France's proposal. Although this stance may cause setbacks in the short term in the relationship between France and Russia, in the long run, it reserves more diplomatic flexibility and strategic space for Russia."
fra_rus_afuhan_event.3.a:0 "There are no eternal friends or enemies, only eternal interests"

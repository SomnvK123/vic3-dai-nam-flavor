je_gbr_guihuanweihaiwei_button:0 "Return to Weihaiwei"
je_gbr_guihuanweihaiwei_button_desc:0 "In December 1921, representatives of the Chinese government proposed a demand at the Washington Conference to return the leased territories of various countries in China. Afterwards, the Chinese government began an 8-year negotiation with the British government regarding the Weihaiwei concession issue."
guihuanweihaiwei_event.1:0 "Britain returns Weihaiwei"
guihuanweihaiwei_event.1.t:0 "Britain returns Weihaiwei"
guihuanweihaiwei_event.1.d:0 "On October 1, 1930, the Chinese Nationalist Government reclaimed Weihaiwei, which had been forcibly leased by Britain for 32 years. On that day, the handover ceremony between China and Britain was held in front of the British Chief Executive's Office in Weihaiwei. At that time, Wang Jiazhen, the Vice Minister of Foreign Affairs of China and the Commissioner for Weihaiwei, attended the Weihaiwei handover ceremony together with the British Chief Executive in Weihaiwei, Johnston."
guihuanweihaiwei_event.1.f:0 "Let me guard the oldest sea in China again,\nOn this shore, there used to be a hill of saints.\nMother, don't forget that I am a strong defender of the sea,\nI have Liu Gong Island as my shield.\nHelp me back quickly, the time has come.\nBehind me lies the remains of saints!\nMother, I want to come back, mother!"
guihuanweihaiwei_event.1.a:0 "This ancient city has returned to its homeland"
guihuanweihaiwei_event_tt:0 "This is a real event that happened in history"
bafaliyapanluan_event.1:0 "Bavarian Rebellion"
bafaliyapanluan_event.1.t:0 "Bavarian Rebellion"
bafaliyapanluan_event.1.d:0 "The Bavarian Soviet Republic was established in April 1919 by an action committee composed of Communist Party members and independent Social Democratic Party members on the left, with the government led by Communist Party member Eugen Levena."
bafaliyapanluan_event.1.f:0 "On April 13, 1919, during the November Revolution in Germany, the Albert government suppressed the Berlin Uprising of January 1919 and subsequently held elections for the National Assembly, establishing the Weimar Republic. The November Revolution suffered a serious setback, but the struggle did not end. On April 7, 1919, independent Social Democrats announced the establishment of a Soviet Republic in Bavaria. On April 13th, Munich workers launched an armed uprising under the leadership of the Communist Party, defeated the rioters, and seized power. That evening, an action committee composed of Communist Party members and independent Social Democratic Party members was established, and the Bavarian Soviet Republic was founded, with Communist Party member Eugen Levena as the head of government."
bafaliyapanluan_event.1.a:0 "Another Soviet Republic"
bafaliyapanluan_event_tt:0 "This is a true event that happened in German history"
je_rus_bafaliyapanluan_button:0 "Igniting the Bavarian Rebellion"
je_rus_bafaliyapanluan_button_desc:0 "The revolutionary regime established by the Bavarian proletariat in Munich on April 13, 1919 during the November Revolution in Germany."
xiongyalipanluan_event.1:0 "Hungarian Revolution"
xiongyalipanluan_event.1.t:0 "Hungarian Revolution"
xiongyalipanluan_event.1.d:0 "The victory of the socialist revolution in Hungary in March 1919 was a great victory of the violent revolution and the result of the Hungarian Communist Party leading the broad masses of the people to persist in armed struggle. Bela Kuhn explicitly stated: "The Hungarian Communist Party not only unwaveringly adheres to the fundamental policy of holding armed uprisings, using force to suppress and eliminate bourgeois political power, and establishing proletarian dictatorship, but also actually implements this policy in its daily work and struggle for political power. The Communist Party not only keeps its weapons in hand, but also frequently uses them in the class struggle for political power!" Therefore, "Communists organized many uprisings not only in Budapest but also in various provinces. The then president of the bourgeois government, Count Mihai Karoli, said, "I signed a declaration about my resignation from office and the transfer of power to the proletariat. In fact, the proletariat has already taken away and publicly declared that it has gained power." "I did not transfer power to the proletariat, because it had already gained power through the planned establishment of a socialist army." Therefore, Bella Kuhn denounced the fallacy that the bourgeoisie automatically transfers power to the proletariat as a false "myth" and declared, "The bourgeoisie does not give power as a gift to the working class at all"
xiongyalipanluan_event.1.f:0 "At this time, the Paris Peace Conference is taking place in Paris, France. At the meeting, the US delegation proposed three plans to deal with the Hungarian Soviet regime:\n(1)The armies of the United States, Britain, France, and Italy occupied Hungary;\n(2)Organized armed intervention in the Hungarian Soviet Union with the assistance of the Romanian, Czech, and Yugoslav armies;\n(3)With the assistance of right-wing Social Democrats, prepare for a counter revolutionary coup.\nFinally, the "Harmony Conference" combined the above three plans and approved the plan of armed intervention by the United States, France, and Britain in the Hungarian Soviet Union. US President Wilson was the mastermind behind the armed intervention in Hungary."
xiongyalipanluan_event.1.a:0 "Another Soviet Republic"
xiongyalipanluan_event_tt:0 "This is a true event that occurred in the history of Hungary"
je_rus_xiongyalipanluan_button:0 "Stirring the Hungarian Revolution"
je_rus_xiongyalipanluan_button_desc:0 "The Hungarian Revolution, led by the Hungarian Communist Party in 1919, saw the Hungarian proletariat use revolutionary violence to overthrow the rule of the bourgeoisie and establish the Hungarian Soviet Republic. This is another proletarian dictatorship established in the world after the victory of the October Socialist Revolution in Russia."
yidaliwangguo:0 "Kingdom of Italy"
meizhouguojiazuzhi:0 "Organization of American States"

bolin_bageda_tielu_event.1:0 "Berlin-Baghdad Railway"
bolin_bageda_tielu_event.1.t:0 "Berlin-Baghdad Railway"
bolin_bageda_tielu_event.1.d:0 "The railway starts from the Bosphorus Strait and passes through Baghdad to the Persian Gulf. In the late 1880s, Germany pursued an Eastward Policy in order to dominate the world, extending its influence into the Near East and attempting to build a railway that would connect with the European railway, becoming a large railway that would run directly from Hamburg, Berlin, Constantinople, and Baghdad to the Persian Gulf. This railway not only enabled German forces to control Türkiye; And it poses a serious threat to regions such as the Caucasus, Persia, and British India. Therefore, it faced opposition and obstruction from Russia, France, and especially the United Kingdom."
bolin_bageda_tielu_event.1.f:0 "In the glorious years of the early 20th century, an unprecedented engineering feat - the Baghdad Railway - finally celebrated its completion. This railway line spanning Europe and the Middle East is not only a physical passage, but also a new bridge for cultural, economic, and political exchanges between the East and the West. Its completion marks the official opening of a new chapter in the connectivity between the Eurasian continent."
bolin_bageda_tielu_event.1.a:0 "The steel link connecting Eastern and Western civilizations"
je_bolin_bageda_tielu:0 "Berlin-Baghdad Railway"
je_bolin_bageda_tielu_reason:0 "#u The Baghdad Railway is a highly ambitious and challenging intercontinental transportation construction project.#!\nThis railway departs from Berlin, crosses Central Europe and the Middle East, connects to Baghdad. and is planned to extend to Basra in the Persian Gulf. It runs through#v Germany#!、#v Austro-Hungary#!、#v Bulgaria#!和#v ottoman empire#!.Becoming one of the most ambitious railway construction projects in the world at that time."

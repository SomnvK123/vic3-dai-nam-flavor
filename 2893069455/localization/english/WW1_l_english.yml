kr_aierlanduli_event.1:0 "Irish Independent"
kr_aierlanduli_event.1.t:0 "Irish Independent"
kr_aierlanduli_event.1.d:0 "When the government army slaughtered miners, a general strike in Britain over coal tariffs escalated into a national uprising. The military began to collapse or defect, and there were also mutinies in the Royal Navy, forcing the government to flee to Canada. The left-wing unity centered around the Labor Union and surrounded by the charismatic John McLean became the British League."
kr_aierlanduli_event.1.f:0 "The collapse of the British government plunged all of its overseas territories into chaos. The Spaniards finally recaptured Gibraltar, the Argentines occupied the island of Ma, Egypt won the sole sovereignty of Sudan, Neizhi invaded the Trusil states, and Shemair ensured the loyalty of Kuwait. The Ottoman Empire recaptured Cyprus and Aden, while the latter was placed under the jurisdiction of Yemen. Germany seized the vast majority of British territory in Africa, while also occupying Malta, the Suez Canal, Berbera, Ceylon, the Straits Settlements, Brunei, and Sarawak. Australasia maintained British control over Fiji and New Guinea. The pearl on the former British crown, India, has split into three countries. The Indian Dominion, usually referred to as' Delhi ', still controls the northwest part of India, while the Indian National Assembly established its own country - the Bharata Commune, the southern princes formed their own royal federation, and Myanmar once again became an independent kingdom. The British protectorate in Somalia has completely collapsed, and Sudan Mohammed has declared Somalia's formal independence. South Africa ensured its control over Bechuana, and there was tension between pro Entente intellectuals and pro Republican Herzog. The Royal Navy Caribbean Fleet protected the British colony here. The colonies of England and France were jointly reorganized into the Caribbean Federation, while Venezuela protested against the United States' infringement of its sovereignty."
kr_aierlanduli_event.1.a:0 "Ireland has freed itself from the shackles of Britain"
kr_aierlandulishibai_event.1:0 "The failure of Irish independence"
kr_aierlandulishibai_event.1.t:0 "The failure of Irish independence"
kr_aierlandulishibai_event.1.d:0 "Britain suppresses Irish rebel uprising"
kr_aierlandulishibai_event.1.f:0 "Britain officially suppressed Ireland on January 1, 1922. As the island of Ireland became a protectorate and the Irish monarch was only a nominal leader, opposition was minimal."
kr_aierlandulishibai_event.1.a:0 "Ireland's fate is once again under British control"
je_aierlanduli:0 "Irish War of Independence"
je_aierlanduli_reason:0 "After the Easter Rising in 1916, we have been fighting against British rule. It's time for us to break away from Britain and become an independent country."
je_posuiddiguo:0 "The Broken Empire"
je_posuiddiguo_reason:0 "Emperor Karl re convened the Imperial Parliament and announced his intention to promote national self-determination within the empire."
kr_duoyuanguojia_event.1:0 "Diversified countries"
kr_duoyuanguojia_event.1.t:0 "Diversified countries"
kr_duoyuanguojia_event.1.d:0 "After the smoke of World War I dissipated, the Austro Hungarian Empire miraculously stood at the crossroads of history as the victor. Faced with the complex internal ethnic composition and the increasingly rising wave of nationalism, the rulers of the empire adopted an unprecedented policy of inclusiveness. Through a series of constitutional reforms and national reconciliation agreements, they not only preserved the unity of the empire, but also promoted the deep integration of various ethnic cultures and economies."
kr_duoyuanguojia_event.1.f:0 "Constitutional revision: promulgate a new imperial constitution to ensure equal political rights and cultural autonomy for all ethnic groups, and establish a multicultural political system.\nEconomic integration: promote cross ethnic economic cooperation and resource allocation, strengthen infrastructure construction, promote economic integration, and achieve rapid post-war recovery.\nCultural Renaissance: Establishing multicultural festivals to encourage artistic creation and academic exchange, making the empire a model of multiculturalism in Europe.\nInternational relations: Participating in international affairs with a peaceful and cooperative attitude, advocating the concept of diverse coexistence, and enhancing international status and influence.\nInternal harmony: Although there are still small-scale ethnic conflicts, overall, the empire has achieved unprecedented stability and harmony, leaving behind a historical story of diverse coexistence for future generations."
kr_duoyuanguojia_event.1.a:0 "A new paradigm for addressing ethnic issues"
kr_minzuzizi_event.1:0 "national autonomy"
kr_minzuzizi_event.1.t:0 "national autonomy"
kr_minzuzizi_event.1.d:0 "In the southern part of Austria's sphere of influence, a pan Slavic revolution suspected to be supported by Serbia erupted, posing a serious threat to the hegemony of the Austro Hungarian Empire here. Austrian Emperor Karl managed to sow discord between the Croats and Serbs, and established a pan Slavic Illyrian kingdom dominated by Croats."
kr_minzuzizi_event.1.f:0 "After experiencing an unprecedented global conflict, although the Austro Hungarian Empire won the victory of World War I with astonishing perseverance and strategy, its internal cracks widened due to the brutality of the war. The bell of victory did not bring the dawn of peace, but instead revealed the fragility of the empire's multi-ethnic governance system. Nationalists in Hungary, Bohemia, Moravia, Slovakia, Croatia, Galicia, and other places quickly turned to their desire for autonomy and even independence in the joy of victory. The Austro Hungarian Empire officially disintegrated, and a series of new countries were born on the map of Europe. The division of the empire led to the rupture of economic ties, the collapse of the monetary system, and short-term economic recession and social unrest in various regions."
kr_minzuzizi_event.1.a:0 "A powerful shock to the old imperial system"
minzumaodun:0 "Ethnic contradictions"

rushongjunshengli_event.1:0 "Victory of the Russian Red Army"
rushongjunshengli_event.1.t:0 "Victory of the Russian Red Army"
rushongjunshengli_event.1.d:0 "That night, amidst the thunderous sound of cannons attacking the Winter Palace, the Second All Russian Soviet Congress opened at Smolny Palace. The congress first passed Lenin's "Message to Workers, Soldiers, and Peasants," declaring that the provisional government had been overthrown and all power belonged to the Soviets."
rushongjunshengli_event.1.f:0 "On November 8, 1917, the congress passed the "Peace Law" and "Land Law" drafted by Lenin. The Peace Law exposed the predatory wars of imperialism and reflected the urgent desire of the working people for peace. It suggested that all warring countries immediately negotiate and conclude a peace treaty without ceding territory or paying compensation. The Land Law stipulates the immediate abolition of landlord land ownership and the nationalization of all land, which will be handed over to laboring farmers for use. Finally, the congress elected the world's first Soviet government of workers, peasants, and soldiers - the People's Committee, and the great proletarian mentor Lenin was elected as the chairman of the People's Committee. The People's Committee has established various departments to carry out various functions of the proletarian state. Stalin was elected as the People's Commissar for National Affairs, and Trotsky was elected as the People's Commissar for Foreign Affairs."
rushongjunshengli_event.1.a:0 "The establishment of the world's first proletarian dictatorship state"
rushongjunshengli_event_tt:0 "This is a true choice in the history of the Soviet Union"
rusbaijunshengli_event.1:0 "Victory of the Russian White Army"
rusbaijunshengli_event.1.t:0 "Victory of the Russian White Army"
rusbaijunshengli_event.1.d:0 "The October Revolution did not achieve the desired victory. In the process of revolution, the revolutionary forces led by the Bolshevik Party engaged in fierce confrontation with the bourgeois army. Although the revolutionary army demonstrated firm will and heroic fighting spirit, there were shortcomings in military strength, tactical strategies, and external support, ultimately failing to withstand the fierce counterattack of the bourgeois army."
rusbaijunshengli_event.1.f:0 "With the failure of the revolution, the bourgeois provisional government quickly launched a comprehensive crackdown on revolutionary forces. They not only arrested a large number of Bolshevik party members and revolutionary masses, but also strengthened their control over society, attempting to maintain their ruling position through high-pressure means. This series of repression actions plunged Russian society into deeper turmoil and unrest, and also dealt a significant blow to the Bolshevik Party."
rusbaijunshengli_event.1.a:0 "Although the revolution was defeated, the spirit of the Bolshevik Party endures."

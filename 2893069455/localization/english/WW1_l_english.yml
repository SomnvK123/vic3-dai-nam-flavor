krxibanyanzks_event.1:0 "spanish civil war "
krxibanyanzks_event.1.t:0 "spanish civil war "
krxibanyanzks_event.1.d:0 "The Spanish Civil War broke out"
krxibanyanzks_event.1.f:0 "The Spanish Civil War was mainly a conflict between three major forces: one was the left-wing alliance that supported the Spanish Republic and hoped to promote social reform; The other side is the nationalist camp led by General Francisco Franco, who opposes left-wing policies and hopes to restore traditional order. The third party is the original government of Spain, which is trying to maintain the status quo and protect vested interests in this turmoil, while facing enormous pressure from both the left and right wings. There are profound political, economic, and social root causes behind this civil war."
krxibanyanzks_event.1.a:0 "Why are things always so bad in Spain?"
krxibanyanzks_event.1.b:0 "I want to experience fascist Spain"
krxibanyanzks_event.1.c:0 "I want to experience the Spanish trade union"
je_KRxibanyanzks:0 "KR version of the Spanish Civil War"
je_KRxibanyanzks_reason:0 "The left-wing alliance supporting the Spanish Republic was mainly composed of workers, peasants, intellectuals, and some radical social reformers who were dissatisfied with the social injustice and corruption at the time and longed to achieve fundamental social change through revolutionary means. This force has gradually gained widespread sympathy and support among the people, especially in the context of economic depression and escalating social conflicts.\nAt the same time, the Spanish nationalist camp represents the interests of conservatives and the landlord class. They see the left-wing alliance as a threat to the country and are concerned that social reform will shake their power base. Therefore, they strongly oppose any form of progressive change and seek to restore monarchy and traditional values.\nThe original government of Spain appeared to be wavering in this storm, wanting to maintain its ruling position while struggling to balance the conflicts between various forces. There is a serious division within the government, with some officials leaning towards working with the left to seek peaceful solutions, while others collude with nationalist forces and attempt to suppress opposition through violent means. This internal contradiction and chaos further weakened the authority and credibility of the government, plunging the country into an unprecedented political crisis."
krxibanyanzbf_event.1:0 "Spanish Workers' Union Victory"
krxibanyanzbf_event.1.t:0 "Spanish Workers' Union Victory"
krxibanyanzbf_event.1.d:0 "The labor union won the Spanish Civil War"
krxibanyanzbf_event.1.f:0 "The workers' and peasants' union in Spain, known as the syndicalist forces, erupted with unprecedented strength due to the combined effects of internal and external factors. They not only organized rigorous strikes and demonstrations in urban factories, but also launched land revolutions in rural areas, depriving landlords of their property and achieving direct distribution of land. With the outbreak of the civil war, the syndicalists demonstrated astonishing fighting will and organizational abilities on the battlefield, gradually pushing the front line deeper into the enemy's territory. After years of arduous struggle, the labor union forces finally achieved a decisive victory, overthrew the old political system, and established a new republic with worker autonomy as its core. In this new country, factories and farms are collectively owned, and the principle of distribution according to needs is implemented. Public services such as education and healthcare are fully popularized, and social class differences are significantly reduced. The people enjoy unprecedented freedom and equality. However, the fruits of victory were not easily obtained. In the early stages of its establishment, the labor union regime faced joint suppression from domestic and foreign reactionary forces, as well as intense internal discussions on how to further consolidate and develop the regime."
krxibanyanzbf_event.1.b:0 "The workers' and peasants' union in Spain, known as the syndicalist forces, erupted with unprecedented strength due to the combined effects of internal and external factors. They not only organized rigorous strikes and demonstrations in urban factories, but also launched land revolutions in rural areas, depriving landlords of their property and achieving direct distribution of land. With the outbreak of the civil war, the syndicalists demonstrated astonishing fighting will and organizational abilities on the battlefield, gradually pushing the front line deeper into the enemy's territory. After years of arduous struggle, the labor union forces finally achieved a decisive victory, overthrew the old political system, and established a new republic with worker autonomy as its core. In this new country, factories and farms are collectively owned, and the principle of distribution according to needs is implemented. Public services such as education and healthcare are fully popularized, and social class differences are significantly reduced. The people enjoy unprecedented freedom and equality. However, the fruits of victory were not easily obtained. In the early stages of its establishment, the labor union regime faced joint suppression from domestic and foreign reactionary forces, as well as intense internal discussions on how to further consolidate and develop the regime."
krxibanyanzbf_event_1_tt:0 "The Third International has achieved significant gains"
krxibanyanzbf_event.2:0 "Spanish populist victory"
krxibanyanzbf_event.2.t:0 "Spanish populist victory"
krxibanyanzbf_event.2.d:0 "Populism won the Spanish Civil War"
krxibanyanzbf_event.2.f:0 "The Spanish National Army, with its strong military power, extensive domestic support, and covert assistance from international forces, gradually reversed the unfavorable situation in the early stages of the civil war. The National Army not only achieved consecutive victories on the battlefield, but also weakened the strength of the Republican Army through a series of political tactics, such as creating a climate of terror, dividing enemy camps, and strengthening ideological propaganda. In the end, with the fall of the symbolic city of Madrid, the Spanish Civil War ended with a comprehensive victory for the National Army. The populist regime immediately announced the establishment of a dictatorship, implemented strict ideological control internally, suppressed dissidents, and consolidated individual power; Externally, we seek reconciliation and cooperation with Western countries, gradually integrating into the international system. Although the Nationalist government effectively curbed social unrest and restored economic order in the early stages, in the long run, its authoritarian rule severely suppressed social progress and democratic development, and the people lived in continuous surveillance and fear, causing the country to fall into long-term political and economic stagnation."
krxibanyanzbf_event.2.b:0 "The victorious Libra is tilting towards the Moscow Pact"
krxibanyanzbf_event_2_tt:0 "The Moscow Agreement gained significant gains"
krxibanyanzbf_event.3:0 "Spanish government wins"
krxibanyanzbf_event.3.t:0 "Spanish government wins"
krxibanyanzbf_event.3.d:0 "Spain suppressed all uprisings"
krxibanyanzbf_event.3.f:0 "The Spanish Civil War did not lead to a complete victory for one side, but rather, with the mediation of the international community and the compromise of various domestic forces, the original government maintained its power in a fragile and complex manner. In this prolonged conflict, both sides have made enormous sacrifices, and the people are tired of the ongoing violence and turmoil, yearning for the arrival of peace. Under pressure from the international community, both sides agreed to a ceasefire and reached a power sharing agreement through negotiations. The original government had to make a series of concessions while retaining certain powers, including recognizing certain social reform achievements of syndicalists and allowing some nationalist forces to implement autonomy in specific regions. Although this arrangement temporarily quelled the civil war, it did not fundamentally solve the deep-seated contradictions and differences in society. The government is facing continuous challenges and unstable factors, including economic recession, social division, and ongoing interference from domestic and foreign forces. In this era full of uncertainty, the original government of Spain was like walking on a narrow and dangerous wooden bridge, requiring caution and prudence at every step."
krxibanyanzbf_event.3.b:0 "Spain tends to be more neutral"

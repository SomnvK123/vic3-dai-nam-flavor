kr_deguozhanbai_event:0 "Defeat of the Imperial Treaty"
kr_deguozhanbai_event.1.t:0 "Defeat of the Imperial Treaty"
kr_deguozhanbai_event.1.d:0 "Defeat of the Imperial Treaty"
kr_deguozhanbai_event.1.f:0 "The Imperial Covenant, once known for its iron blood and glory, was defeated in the smoke of war. The news of defeat swept through every corner of Europe like a cold wind, triggering profound political changes. The afterglow of monarchy has dissipated in many countries, replaced by the radiance of democratic republics. People are starting to re-examine the past militarism and dictatorship, and freedom of speech and civil rights have become the pursuit of the new era. Under the shadow of defeat, the country began to seek reconstruction, not only the redistribution of territory, but also the reconstruction of the soul. The huge war reparations weighed heavily on the defeated countries, but also became an opportunity to promote economic reform and international cooperation. The social and economic structures are being reshaped in the midst of change, and a new Europe, a more inclusive and equal Europe, is quietly emerging from the ruins."
kr_deguozhanbai_event.1.a:0 "The World War has finally come to an end"
kr_faguozhanbai_event:0 "Defeat of the Third International"
kr_faguozhanbai_event.1.t:0 "Defeat of the Third International"
kr_faguozhanbai_event.1.d:0 "Defeat of the Third International"
kr_faguozhanbai_event.1.f:0 "The flames of the Third International were extinguished in the torrent of war, leaving behind deep reflection and self-examination. The shadow of defeat hangs over every member state, with political turmoil and social unrest following closely behind. Some countries, once lighthouses of socialist ideals, are now trapped in a power vacuum and chaos. However, it was in such adversity that the socialist movement demonstrated its resilience. Despite the setback of ideals, the spark of pursuing fairness and justice has not been extinguished. Some countries have begun to explore development paths that are suitable for their own national conditions, attempting to find a new balance between capitalism and socialism. Internationally, although the influence of the Third International has weakened, discussions on social justice and peaceful development have become more heated, laying the foundation for future international cooperation and understanding."
kr_faguozhanbai_event.1.a:0 "The World War has finally come to an end"

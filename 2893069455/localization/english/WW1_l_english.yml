kr_zhiligongtuanqiyi_event.1.t:0 "Chilean Workers' Union Uprising"
kr_zhiligongtuanqiyi_event.1.d:0 "Chile begins to support the rebellion in Patagonia"
kr_zhiligongtuanqiyi_event.1.f:0 "After experiencing bank bankruptcies and years of political turmoil, Chile experienced a massive syndicalist uprising that overthrew the government with the support of most of the navy and army, and Apo Puga became the new head of government."
kr_zhiligongtuanqiyi_event.1.a:0 "Undoubtedly, it once again proves the complexity and difficulty faced by Latin American countries in pursuing social change and stability"
je_zhiligongtuanqiyi:0 "Chilean Workers' Union Uprising"
je_zhiligongtuanqiyi_reason:0 "In Chile, after years of bank bankruptcies and political turmoil, a storm of large-scale syndicalist uprisings is brewing in society. At the same time, there are rumors that most of the navy and army may support the upcoming changes, and the name Apo Puga is beginning to be mentioned among the public as a symbol of new hope. At the same time, the Chilean government has shown increasing interest in the situation in Patagonia.
je_meiguoneizhan:0 "Internal strife in the United States"
je_meiguoneizhan_reason:0 "It seems that the new president has not been able to quell the political turmoil in the United States. Socialists and populists respectively rose up in the steel belt and deep south. The President of the United States assures the international community that American democracy still exists, and once he calms the storm, America will return to prosperity."
KR_meiguoneizhan_event.1:0 "The Second American Civil War broke out"
KR_meiguoneizhan_event.1.t:0 "The Second American Civil War broke out"
KR_meiguoneizhan_event.1.d:0 "A civil war tore apart the last unity of America"
KR_meiguoneizhan_event.1.f:0 "As many people expected, since the outbreak of the political crisis in the United States, the country has once again fallen into civil war. Because the United States is the strongest defender of the status quo in the Far East, the American Civil War led to a power vacuum in the Far East, and the impact on embassy cities began to emerge. Now that they have temporarily withdrawn from the embassy's game, the fundamental nature of the embassy city will undoubtedly undergo a thorough change. The first thing the Ministry of Works needs to decide is to establish new voting arrangements for the United States, and more importantly, which United States we need to recognize. If the voting rights of the United States are deprived, the Bureau of Works is likely to elect a new senior commissioner. It can be said with certainty that the mandate rule during this period will be uncertain."
KR_meiguoneizhan_event.1.a:0 "Pay attention to human resources and obey fate."
KR_meiguoneizhan_usa_event.1.t:0 "The end of the American Civil War"
KR_meiguoneizhan_usa_event.1.d:0 "The Second American Civil War has ended, and the most bloody conflict in the history of the New World has finally settled. Widows weep as they bury their deceased husbands and sons, while the reactionary military dictatorship has seized control of the old American regime and defeated all archenemies. General Douglas MacArthur has ordered an iron fist strike against potential traitors and remnants of the Confederacy and United Workers' Corps nationwide, and the country is slowly rebuilding."
KR_meiguoneizhan_usa_event.1.f:0 "Will the United States of America return to democratic politics in the future, or will we watch this leader trample the legacy of the founding fathers under military boots? Only time can tell everything. In any case, this war will forever be engraved in the deep consciousness of the American people"
KR_meiguoneizhan_usa_event.1.a:0 "What impact will this have on the American Dream?"
KR_meiguoneizhan_usb_event.2.t:0 "The end of the American Civil War"
KR_meiguoneizhan_usb_event.2.d:0 "The Second American Civil War has ended, and the most bloody conflict in the history of the New World has finally settled. Widows weep as they bury their deceased husbands and sons, while the old regime of the United States has rebuilt its rule in 48 states. Martial law is gradually being lifted across the country, and the final rebels will be handed over to the National Guard for handling."
KR_meiguoneizhan_usb_event.2.f:0 "Although the United States government has won, the unbearable losses will permanently change the face of this country. The civil war left most major cities in ruins, causing hundreds of thousands of casualties. Americans' carefree and open mind has been hit hard"
KR_meiguoneizhan_usb_event.2.a:0 "What impact will this have on the American Dream?"
KR_meiguoneizhan_usc_event.3.t:0 "The end of the American Civil War"
KR_meiguoneizhan_usc_event.3.d:0 "The Second American Civil War has ended, and the most bloody conflict in the history of the New World has finally settled. Widows weep as they bury their deceased husbands and sons, while the remnants of the old regime have been swept away, and the American Revolution led by the United Workers' Union is flourishing. The old capitalist system is crumbling, replaced by an organization similar to France or Britain, with red and black flags flying in front of the former Parliament building, which will soon be transformed into a workers' congress."
KR_meiguoneizhan_usc_event.3.f:0 "The relationship between the United Workers' Union and Canada is very tense, and they are looking forward to becoming pioneers of unionism in the new world. The United States has changed, forever changed"
KR_meiguoneizhan_usc_event.3.a:0 "The prosperity of the United States stems from freedom, not socialism!"
KR_meiguoneizhan_usd_event.4.t:0 "The end of the American Civil War"
KR_meiguoneizhan_usd_event.4.d:0 "The Second American Civil War has ended, and the most bloody conflict in the history of the New World has finally settled. Widows wept and buried their deceased husbands and sons, while the old regime collapsed with a loud bang. The conservative and reactionary Confederate government raised the national flag in Washington. The reconstruction agenda is being formulated, and President Huey Long has announced End of War Day as a new national holiday."
KR_meiguoneizhan_usd_event.4.f:0 "The United States, once considered a beacon of democracy, has fallen. What will happen to the authoritarian regime from the south in the future? Only time can tell everything. In any case, this war will forever be engraved in the deep consciousness of the American people"
KR_meiguoneizhan_usd_event.4.a:0 "The South won this time"

je_junfahunzhan:0 "Warlordism"
je_junfahunzhan_reason:0 "Warlord chaos refers to the events of warlord separatism and chaos within China from the late Qing Dynasty and early Republic of China to the Anti Japanese War.\nIn modern times, the corruption and backwardness of the Qing government led to the infiltration of imperialism into China. Against this historical backdrop, a special force emerged - warlord rule. The warlord rule during the Republic of China period brought profound disasters to the people.\nIn 1917, Duan Qirui successfully suppressed Zhang Xun's restoration farce with the "Anti Rebel Army" and "reconstructed the republic", but refused to restore the parliament and intended to abolish the temporary constitution. Duan Qirui's actions drew opposition from the five southern provinces, and the Protection of the Law movement began, plunging China into a north-south split. From then on, until the Nationalist government unified the country in 1929, the state of division and warfare lasted for more than ten years in China, known today as the "warlord chaos"."

ww2_canyushijiedazhan_chi.1.f:0 "Earlier today,[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]A joint statement was issued with China, stating that the latter has now been officially granted membership in the Chinese United Front. It is currently unknown whether this partnership is suitable for offense or defense, but it is foreseeable that extensive military cooperation and planning between the two sides have already begun."
ww2_canyushijiedazhan_chi.1.a:0 "They seem to want to win by quantity."
WW2_GER_shanjibolan:0 "Danze or War"
WW2_GER_shanjibolan_reason:0 "Danzig was German, Danzig has remained German, and Danzig shall be German from now on! We must prepare the German people for the inevitable war with Poland. A propaganda campaign will steel their will for the coming battle, while the crimes of the Polish nation are exposed to the world. Danzig and the surrounding lands will return to Germany!\n#N This move will trigger the Second World War#!"

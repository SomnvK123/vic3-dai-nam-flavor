kr_yidalizaitongyi_event.1:0 "reunification of italy"
kr_yidalizaitongyi_event.1.t:0 "reunification of italy"
kr_yidalizaitongyi_event.1.d:0 "With the complete breakdown of the Roman Entente, the armies of the Italian states began to mass towards the borders. The syndicalists in Milan marched south singing "The Internationale", the royalists in Naples announced their defense of the orthodox monarchy, and the Swiss Guards of the Holy See had raised the flag of St. Peter's Key on the city head... A full-scale war in the Apennine Peninsula was inevitable."
kr_yidalizaitongyi_event.1.f:0 "The long civil war finally came to an end. The smoke cleared, and the Apennine Peninsula ushered in a long-lost peace. From the Alps to the coast of Sicily, from the canals of Venice to the ruins of Rome, the people of Italy are finally united under one flag. Although the scars of the war are still deep in this ancient land, a glimmer of hope has illuminated the future. Under the dome of the Pantheon rebuilt on the ruins of Rome, Italians in the new era are asking: Where should the ‘Imperial Eagle’ in Dante’s novel fly?"
kr_yidalizaitongyi_event.1.a:0 "For whom did the triumphal arch in Rome open?"

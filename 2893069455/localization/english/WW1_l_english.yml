ww1_gbr_canyushijiedazhan_xyg.1.f:0 "With Germany's pressure on Belgium, it has infringed upon the interests of Britain. As one of the initial members of the Triple Entente, Britain decided to abide by the treaty with France and officially declared war against Germany."
je_batageniyapanjun:0 "Patagonian Rebels"
je_batageniyapanjun_reason:0 "At the beginning of the 20th century, Argentina's economic strength grew rapidly with its exports of meat and grains. Immigrants from all over Europe flock to the Argentine Republic, and the thriving entrepreneurial spirit and emerging industries quickly drive it to become one of the most prosperous countries in the world. The trade relationship is strong, and exports to the UK and Germany continue to grow.\n\nHowever, when the World War broke out, Argentina was forced to remain neutral and unwilling to side with its most important economic partner, Britain, or its second most important economic partner, Germany. Through mediation between the two countries, the UK lifted sanctions against us and forced us to impose a trade embargo on Germany. Despite Argentina's attempts to mitigate this risk through third-party sales, the sales situation is still different, and the miracle before the war has also slowed down.\n\nAs the last few years of the World War approached, Britain was clearly fighting a war that was about to be lost, and ordered the Argentine government and businesses to increase production and exploit the country to the fullest extent possible. The growing dissatisfaction with the growing demand in the UK and the growing weariness of exploitation have led workers to organize, protest, and ultimately resort to armed rebellion. Due to the inability to completely contain the development of the situation, the Argentine government's control over the riots deteriorated. By the mid-1920s, it lost control over the provinces of Santa Cruz, Chubut, and Rio Negro, which fell into the hands of the newly established Patagonian Workers' Front.\n\nSubsequently, three democratically elected governments were responsible for resolving the crisis, but they failed one after another. In response to their incompetence in governance, General Uliuwulu seized power in 1930 in an attempt to suppress the rebellion.   However, his brief dictatorship ended two years later after his own death from cancer, creating a power vacuum and no longer engaging in large-scale intervention in the South."
kr_batageniyapanjun_event:0 "Patagonian Rebel Uprising"
kr_batageniyapanjun_event.1.t:0 "Patagonian Rebel Uprising"
kr_batageniyapanjun_event.1.d:0 "The workers gathered behind the figures of Antonio Soto and Jose "machete" Fonte, determined that it was time to launch a revolution. Although there were provisions for disarmament in the first rural agreement, the vast majority of anarchists such as Soto did not surrender their weapons, but instead handed them over to Alfred "Tuscany" Fonte; So, when Soto and other radical "anarchists" were determined to oppose the First Patagonian Rural Agreement, they had to ally with a group of Patagonian bandits such as Alfred Fonte in order to have enough weapons to arm the workers to fight."
kr_batageniyapanjun_event.1.f:0 "Although the government army achieved some victories at the beginning, the workers won a decisive victory at the La Anita Farm. The victory on the front line inspired the Argentine Regional Workers' Union, who pushed the second Patagonian strike to one climax after another through telegrams and messengers. Due to the existence of the popular ruling political party, the Radical Citizens' Alliance, it is a pipe dream for the Argentine army to forcibly suppress the revolution without causing a strong political backlash in the capital region."
kr_batageniyapanjun_event.1.a:0 "seeds of revolution"
kr_batageniyapanjun_event.1.b:0 "I want to experience the Patagonian Workers' Front"

menggu_enqing_event.1.t:0 "The remnants of the White Army and the ambitions of Mongolia"
menggu_enqing_event.1.d:0 "As the smoke of the Russian Civil War spread to the Far East, the mad White Army general Baron Roman von Enqin Sternberg took control of the Mongolian grasslands. This self proclaimed 'Bloody Baron' announced the reconstruction of Mongolia and declared his intention to revive Genghis Khan's empire. The red flag of the Kremlin must be raised above the palace in Ulaanbaatar."
menggu_enqing_event.1.f:0 "The envoy from the Kremlin sent a telegram on a sandalwood table, and outside the window came the neighing of Cossack guard horses. The Soviet demands that we immediately disarm and accept 'brotherly guidance', otherwise the Red Army's armored trains will enter the grasslands."
menggu_enqing_event.1.a:0 "Bow down to the power of the proletariat"
menggu_enqing_event.1.b:0 "Let the Bolsheviks witness the cold light of the nomadic curved sword"
menggu_enqing_event_tt:0 "This is a true choice made by Mongolia in its history"

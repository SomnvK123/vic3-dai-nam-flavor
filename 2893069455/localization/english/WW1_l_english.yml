je_BUL_baerganzhanz2_reason:0 "The Second Balkan War was a war sparked by the unequal distribution of territories between the Kingdom of Bulgaria, the Kingdom of Greece, the Kingdom of Serbia, the Kingdom of Montenegro, the Kingdom of Romania, and the Ottoman Empire."

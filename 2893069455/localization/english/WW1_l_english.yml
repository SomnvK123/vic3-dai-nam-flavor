ger_yingdehaijun_event.1:0 "Germany wins the Anglo German naval competition"
ger_yingdehaijun_event.1.t:0 "Germany wins the Anglo German naval competition"
ger_yingdehaijun_event.1.d:0 "The Rise of German Sea Power: The Final Chapter of the Anglo German Naval Competition."
ger_yingdehaijun_event.1.f:0 "With the firm will and unremitting efforts of the empire, the German navy finally surpassed the former maritime hegemon - the British Empire, and won the Anglo German naval competition that concerns national dignity and future strategic position. William II personally witnessed this historic moment, and the ocean dream of Iron Chancellor Bismarck was realized today. The German fleet is cruising in the North Sea, with each warship carrying the pride and ambition of the Germanic nation."
ger_yingdehaijun_event.1.a:0 "Germany's victory marks a reshuffle of European maritime power, and the beginning of a new era is slowly unfolding."
gbr_yingdehaijun_event.1:0 "Britain won the Anglo German naval competition"
gbr_yingdehaijun_event.1.t:0 "Britain won the Anglo German naval competition"
gbr_yingdehaijun_event.1.d:0 "The Eternal Soul of the British Sea: The Dust of the Anglo German Naval Competition Settles."
gbr_yingdehaijun_event.1.f:0 "After years of fierce competition, the Royal Navy of the British Empire once again proved its glory and strength of "the sun never sets", successfully defending its position as a maritime hegemon and firmly suppressing Germany's challenger posture. Prime Minister Churchill announced this exciting news in parliament, and the entire country was immersed in the joy of victory. The British fleet patrols the oceans, ensuring the safety and freedom of global trade routes, and the radiance of the empire remains dazzling."
gbr_yingdehaijun_event.1.a:0 "The victory of Britain consolidated its maritime hegemony and also declared to the world that the heritage and determination of the old empire cannot be underestimated."
je_gerhaijunjingsai:0 "Anglo German Naval Competition"
je_gerhaijunjingsai_reason:0 "In 1894, German Admiral Alfred von Tirpitz proposed that the purpose of fleet existence is to attack, and in order for Germany to maintain its position as a world power, it must establish a navy capable of conducting offensive operations. In 1898, Tirpitz became the State Secretary of the German Imperial Navy and actively expanded the German navy. Tirpitz believed that Britain was Germany's biggest threat at sea; In order to eliminate the threat posed by the British Navy to Germany, the number of German naval vessels must reach at least two-thirds of the number of British naval vessels.\nTirpitz's "Risk Theory": The British navy is dispersed around the world, and Germany can form a balance of power with Britain by assembling a powerful combat fleet in the North Sea, seriously undermining Britain's maritime hegemony. If Britain sees the German fleet as a major threat and will certainly avoid conflict with Germany, then Germany can force Britain to make concessions and prevent Britain from forming an alliance with France and Russia.\n#y Germany needs to win the naval competition and establish maritime hegemony!#!"
je_gbrhaijunjingsai:0 "Anglo German Naval Competition"
je_gbrhaijunjingsai_reason:0 "In 1894, German Admiral Alfred von Tirpitz proposed that the purpose of fleet existence is to attack, and in order for Germany to maintain its position as a world power, it must establish a navy capable of conducting offensive operations. In 1898, Tirpitz became the State Secretary of the German Imperial Navy and actively expanded the German navy. Tirpitz believed that Britain was Germany's biggest threat at sea; In order to eliminate the threat posed by the British Navy to Germany, the number of German naval vessels must reach at least two-thirds of the number of British naval vessels.\nTirpitz's "Risk Theory": The British navy is dispersed around the world, and Germany can form a balance of power with Britain by assembling a powerful combat fleet in the North Sea, seriously undermining Britain's maritime hegemony. If Britain sees the German fleet as a major threat and will certainly avoid conflict with Germany, then Germany can force Britain to make concessions and prevent Britain from forming an alliance with France and Russia.\n#y Britain needs to win the naval competition and establish maritime hegemony!#!"
je_lianheziyuanfaling:0 "Joint Resource Law"
je_lianheziyuanfaling_reason:0 "The Joint Resources Act is an important game content for KR, and as Australia and New Zealand face the upcoming British Revolution, uniting and joining the Allied Powers may be the best choice."
kr_lianheziyuanfaling_event.1:0 "The birth of the Commonwealth of Australasia"
kr_lianheziyuanfaling_event.1.t:0 "The birth of the Commonwealth of Australasia"
kr_lianheziyuanfaling_event.1.d:0 "The Joint Resources Act merged Australia and New Zealand into the Commonwealth of Australasia, with elections suspended and most of the federation's land under military martial law."
kr_lianheziyuanfaling_event.1.f:0 "Within the framework of the Commonwealth, an unprecedented transformation is quietly taking place. In order to more effectively integrate resources and strengthen economic and strategic coordination between regions, the governments of Australia and New Zealand have jointly issued the Joint Resources Act. The implementation of this law marks the official merger of the two countries into the Commonwealth of Australasia. In order to ensure a smooth transition during the merger process and maintain regional security, the Confederate government has decided to suspend domestic election activities until the situation stabilizes. At the same time, given the complexity of the current international situation, most of the land of the Confederacy has been placed under military martial law to prevent any potential external threats."
kr_lianheziyuanfaling_event.1.a:0 "The birth of the Commonwealth of Australasia not only demonstrates the close cooperation among Commonwealth member states, but also lays a new foundation for the future political and economic landscape of the region and even the world."
chakezhanzheng_event.1:0 "chaco war"
chakezhanzheng_event.1.t:0 "chaco war"
chakezhanzheng_event.1.d:0 "Bolivia invaded Paraguay and the Chaco War broke out."
chakezhanzheng_event.1.f:0 "On the vast land of South America, a war that concerns the fate of the country and the dignity of the nation quietly erupted. The competition between Chile and Bolivia over the Atacama Desert and its abundant mineral resources, coupled with historical territorial disputes, ultimately led to the full-scale escalation of the Chaco War. The armies of both sides engaged in fierce battles in the border area, with continuous gunfire and smoke, and the entire South American continent felt the shock of this war."
chakezhanzheng_event.1.a:0 "This war will undoubtedly have a profound impact on the economic order and geopolitical landscape of South America."
je_chakezhanzheng:0 "chaco war"
je_chakezhanzheng_reason:0 "A war between Bolivia and Paraguay aimed at competing for abundant mineral resources."

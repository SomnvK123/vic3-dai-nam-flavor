je_hongjunshengli_reason:0 "The Red Army won the October Revolution and defeated the bourgeois provisional government"
je_baijunshengli:0 "White Guard Movement"
je_baijunshengli_reason:0 "The White Army won the October Revolution and defeated the Bolshevik regime"

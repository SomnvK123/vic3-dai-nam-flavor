guandongdadizheng_event:0 "Great Kanto earthquake"
guandongdadizheng_event.1.t:0 "Great Kanto earthquake"
guandongdadizheng_event.1.d:0 "A strong earthquake with a magnitude of 7.9 occurred in the Kanto region of Japan on September 1, 1923. The earthquake stricken areas include Tokyo, Kanagawa, Chiba, Shizuoka, Yamanashi and other places. The earthquake caused a huge disaster, with about 100000 casualties. The earthquake also led to the outbreak of cholera. For this reason, the Tokyo Metropolitan Government once ordered martial law, prohibiting people from entering the city to prevent the spread of epidemics."
guandongdadizheng_event.1.f:0 "Because the seismometer in Tokyo has been damaged, according to the records of the Sendai seismometer, the magnitude of this earthquake is estimated to be 7.9 on the Richter scale. On September 16, 1996, after precise calculations by the Technical Research Institute of Kashima Corporation and other units in Japan, it was determined that the Great Kanto Earthquake that occurred in 1923 should have had a magnitude of 8.1 on the Richter scale. That is to say, the magnitude of the earthquake is twice as large as the original statement."
guandongdadizheng_event.1.a:0 "Earthquakes will have an impact on the Japanese archipelago#bold Kanto Region#!Causing abandonment"
guandongdadizheng_event_tt:0 "This is a true event that occurred in Japanese history"
je_guandongdadizheng:0 "Great Kanto earthquake"
je_guandongdadizheng_reason:0 "In 1906 and 1915, Professor Tomohiro Ohmori and his assistant Associate Professor Akira Imamura from the Department of Earthquake Science at the Imperial University of Tokyo in Japan debated twice whether there would be a major earthquake in Tokyo. Associate Professor Imamura proposed the risk of a major earthquake in Tokyo based on historical earthquake analysis, and emphasized the need to pay special attention to the occurrence of fires. As a leading figure in the field of seismology in Japan, Professor Omori has consistently denied it, citing the need to avoid confusion in public opinion.\nOn September 1, 1923, Professor Omori visited the Sydney Observatory in Australia. At 1:09 pm local time, when he arrived at the earthquake observation room of the observatory, the recording pen of the seismometer suddenly went crazy and swung wildly. "A major earthquake has occurred somewhere in the Pacific," said Omori, carefully analyzing the earthquake records. He was stunned, as if the earthquake was near Tokyo."
dishijiuxiuzhengan_event:0 "Amendment XIX"
dishijiuxiuzhengan_event.1.t:0 "Amendment XIX"
dishijiuxiuzhengan_event.1.d:0 "The 19th Amendment to the Constitution of the United States of America has been officially promulgated"
dishijiuxiuzhengan_event.1.f:0 "The foundation of a democratic society is elections, and the right to vote and be elected are important components of civil rights. From the founding of the country in 1776 to the passage of the 19th Amendment to the Constitution in 1920, it took 144 years for American women to have full citizenship rights. In the 18th and early 19th centuries, women in the United States did not enjoy the same rights as male citizens, such as the right to vote; Married women are not allowed to own property and do not have the right to claim inheritance; Many states' laws prohibit women from serving as jurors, testifying in court, attending college, and even entering politics. At that time, the societal expectation for women was to be virtuous wives and mothers at home, rather than to appear in public.\nBefore and after the outbreak of the Civil War, with the rise of the abolitionist movement, many women actively participated in the movement and became the earliest feminist activists. Starting from the mid-19th century, the feminist movement began to flourish, with one of its contents being the fight for women's voting rights. After generations of effort, advocates and supporters of the women's movement actively fought for women's voting rights through a series of activities such as speeches, writing articles, establishing organizations, marches, lobbying, and civil disobedience. In 1919, with the support of then President Woodrow Wilson, the House of Representatives passed a bill on May 21, 1919, granting women the right to vote with a 3-2 majority, and the Senate also passed a bill on June 4 with a 3-2 majority. The 19th Amendment to the Constitution was passed in Congress. Afterwards, according to the requirements of the constitutional amendment process, the 19th Amendment was submitted to the states for approval. After being approved by Tennessee on August 18, 1920, it met the requirement of a three-quarters majority in the states, and the 19th Amendment to the Constitution was officially passed."
dishijiuxiuzhengan_event.1.a:0 "Marking a breakthrough success in the feminist movement"
dishijiuxiuzhengan_event_tt:0 "This is a true event that happened in American history"
je_funvxuanjuquan:0 "Women's Suffrage Movement"
je_funvxuanjuquan_reason:0 "Women's suffrage refers to the right of women to participate in elections. Proposed in the United States in 1848. Elizabeth Stanton, Lucretia Mott, Susan B. Anthony, Lucy Stone, and feminists working in state and federal governments fought for women's suffrage. After long-term efforts, the 19th Amendment to the US Constitution (1920) finally approved women's suffrage nationwide. Since 1928, all women in Britain have also had equal suffrage. Except for a few Muslim countries, women around the world have the right to vote."

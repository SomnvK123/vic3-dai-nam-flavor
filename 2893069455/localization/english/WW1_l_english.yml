ww1_bul_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_bul_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the Allied Powers"
ww1_bul_canyushijiedazhan_xyg.1.f:0 "The Tsar was deeply concerned about the outcome of the Balkan Wars, and now Serbia is at the end of its rope. It is time to seek revenge against it. For the greater Bulgaria!"
ww1_rom_canyushijiedazhan_xyg:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_rom_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_rom_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_rom_canyushijiedazhan_xyg.1.f:0 "Romania participated in the Allied war to recapture Transylvania."
ww1_itl_canyushijiedazhan_xyg:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_itl_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_itl_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_itl_canyushijiedazhan_xyg.1.f:0 "In order to break the stalemate in the war, the Allied powers extended an olive branch to Italy, promising that if they joined their war, after victory, South Tyrol, Trantino, and Dalmatia would all be incorporated into Italian territory. This led to Italy's determination to join the Allied Powers."
ww1_jap_canyushijiedazhan_xyg:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_jap_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_jap_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_jap_canyushijiedazhan_xyg.1.f:0 "Based on the treaty obligations of the Anglo Japanese Alliance and its covetousness of Germany's influence in Qingdao and other places, Japan decided to declare war on Germany and officially join the Allied Powers. This move aims to expand its influence in Asia, seize Germany's colonies in the Far East and the Pacific, and hope to gain more international status and benefits after the war."
ww1_chi_canyushijiedazhan_xyg:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_chi_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_chi_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_chi_canyushijiedazhan_xyg.1.f:0 "China, in order to safeguard its national sovereignty and interests, decided to join the Allied Powers and declare war on Germany and Austria due to Germany's occupation of Qingdao, Shandong and triggering diplomatic crises such as the "Twenty One Demands". China hopes to take this opportunity to regain its occupied rights and enhance its international status."
ww1_gre_canyushijiedazhan_xyg:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_gre_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_gre_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_gre_canyushijiedazhan_xyg.1.f:0 "Greece, due to the invasion of its territory by the Allied powers and the threat to national security, as well as the support commitments and diplomatic pressure from the Allied powers, decided to join the Allied forces and jointly resist their influence."
ww1_por_canyushijiedazhan_xyg:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_por_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_por_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_por_canyushijiedazhan_xyg.1.f:0 "Portugal, based on its traditional alliance with Britain and to safeguard its interests in African colonies, decided to join the Allied forces and jointly resist their influence, hoping to consolidate its international status after the war."
ww1_lux_canyushijiedazhan_xyg:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_lux_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_lux_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_lux_canyushijiedazhan_xyg.1.f:0 "Due to its geographical proximity to Germany and military threat, Luxembourg was forced into the war by the German invasion and decided to join the Allied forces to jointly resist their aggression."
ww1_brz_canyushijiedazhan_xyg:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_brz_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_brz_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_brz_canyushijiedazhan_xyg.1.f:0 "Due to concerns about the expansion of Allied Germany's power in South America and the influence of diplomatic lobbying and economic assistance from the Allied powers, especially Britain, Brazil has decided to join the Allied powers to jointly confront them and maintain stability and national interests in South America."
ww1_sia_canyushijiedazhan_xyg:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_sia_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_sia_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_sia_canyushijiedazhan_xyg.1.f:0 "Considering the extensive colonial territories of Britain and France in Southeast Asia and their impact on regional security, Siam ultimately chose to join the Allied Powers of World War I in order to seek diplomatic balance and self-protection, hoping to consolidate its relations with Western powers and maintain national independence and territorial integrity."
ww1_mon_canyushijiedazhan_xyg:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_mon_canyushijiedazhan_xyg.1.t:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]participate in a war"
ww1_mon_canyushijiedazhan_xyg.1.d:0 "[SCOPE.sCountry('canyu_diyici_sjdz_scope').GetName]Announcing the War of Joining the ally Powers"
ww1_mon_canyushijiedazhan_xyg.1.f:0 "Montenegro, due to the Austro Hungarian Empire's covetousness of its territory and long-term conflicts, decided to join the Allied forces and fight alongside Serbia and other allies to resist aggression and maintain national independence, jointly resisting the Allied forces."

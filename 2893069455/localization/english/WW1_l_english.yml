chaoxianzhanzheng_event.1:0 "Korean War breaks out"
chaoxianzhanzheng_event.1.t:0 "Korean War breaks out"
chaoxianzhanzheng_event.1.d:0 "The Democratic People's Republic of Korea was established in northern North Korea in September 1948, and Kim Il became prime minister. At this point, North and South Korea were officially divided. However, both sides did not give up the goal of reunification. There were frequent frictions near the 38th Parallel, which finally led to the outbreak of the Korean War on June 25, 1950."
chaoxianzhanzheng_event.1.f:0 "After the war broke out, the United Nations forces composed of 16 countries sent troops to support South Korea. The People's Republic of China sent troops to support North Korea in the name of the Chinese People's Volunteers. The Soviet Union sent troops to North Korea through military material support and air force support. As a result, the war escalated into a major issue affecting the geopolitical situation in East Asia. Regional conflict."
chaoxianzhanzheng_event.1.a:0 "We were only separated for a few years, but we lived together for thousands of years"
chaoxianzhanzheng_event_tt:0 "This is a real event that happened in the history of the Korean Peninsula"
je_otl_chaoxianzhanzheng:0 "Korean War"
je_otl_chaoxianzhanzheng_reason:0 "The Korean War was a war caused by the Democratic People's Republic of Korea on the Korean Peninsula attacking the Republic of Korea from 1950 to 1953."
jiefangzhanzheng_event.1:0 "The Second Civil War between the Kuomintang and the Communist Party broke out"
jiefangzhanzheng_event.1.t:0 "The Second Civil War between the Kuomintang and the Communist Party broke out"
jiefangzhanzheng_event.1.d:0 "The civil war between the Kuomintang and the Communist Party, which the authorities of the Republic of China called the Iraqi Rebellion War and the authorities of the People's Republic of China called the Iraqi Liberation War, was a civil war that broke out in Latin America in the early 20th century. It was also the largest and most far-reaching civil war in China in the 20th century."
jiefangzhanzheng_event.1.f:0 "One side of the civil war was the National Government of the Republic of China led by the Kuomintang of China before the constitution was enacted on December 25, 1947, and the government of the Republic of China after the constitution was enacted. The other side was the Soviet Republic of China established by the Communist Party of China and several separatist regimes."
jiefangzhanzheng_event.1.a:0 "The world is for the common good? Long live the people?"
jiefangzhanzheng_event.1.b:0 "I want to experience the story of the Chinese Communist Party"
jiefangzhanzheng_event_tt:0 "This is a real event that happened in Chinese history"
je_otl_jiefangzhanzheng:0 "The Second Civil War between the Kuomintang and the Communist Party"
je_otl_jiefangzhanzheng_reason:0 "The Second Civil War between the Kuomintang and the Communist Party of China was a civil war that broke out in the late 1940s between the Chinese Kuomintang and the Communist Party of China for the control of China. The main stage took place between 1945 and 1950. This civil war directly led to the founding of the People's Republic of China and the establishment of the People's Republic of China. The relocation of the Republic of China government to Taiwan and the current situation of cross-strait division have significantly changed China's political territory and social structure; the actual control area of ​​the Republic of China government has been limited to the Taiwan, Penghu, Jinma and some South China Sea islands, thus unfolding contemporary cross-strait relations and forming " Cross-Strait Issues"."

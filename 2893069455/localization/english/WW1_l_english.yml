kr_weiernisixieding_rus_daikuan:0 "Repay the loan under the Vilnius Agreement"
kr_weiernisixieding_ger_daikuan:0 "Receive loans under the Vilnius Agreement"
je_kr_weiernisixieding:0 "Vilnius Agreement"
je_kr_weiernisixieding_reason:0 "Even as Russia was recovering, the economic shock of 1925 forced Russia to grant Germany more economic rights in the Vilnius Agreement, which brought economic growth but also economic instability and inequality."
kr_weiernisixieding_event:0 "Vilnius Agreement"
kr_weiernisixieding_event.1.t:0 "Vilnius Agreement"
kr_weiernisixieding_event.1.d:0 "Faced with continuously expanding deficits, bankruptcies, and unemployment, Russia had no choice but to turn to the Central European Union for assistance. After months of negotiations, the "German Russian Trade and Credit Agreement" was reached on April 11, 1926《Vilnius Agreement》。"
kr_weiernisixieding_event.1.f:0 "Germany provided a loan of 500 million marks to Russia and offered further credit options in exchange for "most favored nation" trade treatment and significant concessions to the German economy. With the Vilnius Agreement, coupled with further sales of national land and requisition of food, the government of the Socialist Revolutionary Party and the Constitutional Democratic Party saved Russia, but at a painful cost."
kr_weiernisixieding_event.1.a:0 "It can be called a national disaster"
je_kr_fengtianchongtu:0 "Fengtian Conflict"
je_kr_fengtianchongtu_reason:0 "The 1928 Fengtian Conflict, a railway dispute in Northeast China, escalated into a war"
kr_fengtianchongtu_event:0 "Fengtian Conflict"
kr_fengtianchongtu_event.1.t:0 "Fengtian Conflict"
kr_fengtianchongtu_event.1.d:0 "A tragic Sino Russian war triggered by a railway dispute"
kr_fengtianchongtu_event.1.f:0 "In 1928, in Northeast China, a seemingly ordinary railway dispute rapidly escalated into a large-scale war involving China and Russia. This conflict originated from Russia's struggle for control of China's Northeast Railway, with both sides holding their own views and refusing to compromise on this issue. With the tension of the situation, the conflict gradually escalated and eventually erupted into a full-scale war."
kr_fengtianchongtu_event.1.a:0 "This fully exposes Russia's expansionist ambitions in the Far East and the challenges it faces in achieving this goal"
je_kr_xinnianzhengbian:0 "New Year's Coup"
je_kr_xinnianzhengbian_reason:0 "The 1925 Vilnius Agreement and the 1928 Fengtian Conflict led to#g Vasily Bordlev#!The general was worried about the complete collapse of order and launched a New Year's coup in 1929."
kr_xinnianzhengbian_event:0 "New Year's Coup"
kr_xinnianzhengbian_event.1.t:0 "New Year's Coup: Coup Failed"
kr_xinnianzhengbian_event.1.d:0 "The tumultuous waves in Russia's democratic process, the adventurous attempts of General Vasily Bordelev in 1929, and the shattering of his democratic dreams."
kr_xinnianzhengbian_event.1.f:0 "On the occasion of the 1929 New Year, the Russian Democratic Federal Republic was in a vortex of economic turmoil and political instability. The extreme nationalist "Defend the Motherland and Freedom Alliance" has achieved significant results in the election, and its leaders and extreme nationalists are increasingly dissatisfied with the status quo. In this context, General Vasily Bordelev, a military leader who deeply felt the possibility of the collapse of national order, decided to take action. He planned and launched a New Year's coup aimed at overthrowing the then government and rebuilding national order. However, this coup did not go as planned. Despite the tremendous efforts of General Bordelev and his supporters, the coup was ultimately suppressed by the government and ended in failure. This incident not only failed to achieve its original intention, but also further exacerbated the turmoil in Russia and dealt a blow to the fledgling democratic process."
kr_xinnianzhengbian_event.1.a:0 "A major setback in Russia's democratic process has exposed the ambitions and dangers of extreme nationalist forces"
kr_xinnianzhengbian_event.2.t:0 "New Year's Coup: Successful Coup"
kr_xinnianzhengbian_event.2.d:0 "The coup in the Russian Democratic Federal Republic took a turning point, and in 1929, General Vasily Bordlev successfully led the country to a new chapter."
kr_xinnianzhengbian_event.2.f:0 "kr_xinnianzhengbian_event.2.f: On the occasion of the 1929 New Year, the political situation in the Russian Democratic Federal Republic was exceptionally tense. Economic difficulties, social dissatisfaction, and covert political power struggles hung the entire country on the brink. At this time, General Vasily Bordelev, a military leader deeply concerned about the fate of the country, decided to step forward and lead a coup aimed at reshaping national order and promoting the democratic process. After careful planning and deployment, General Bordelev and his supporters launched a coup on the occasion of the New Year. They quickly took control of key government departments and military facilities, and overthrew the government with thunderous force. This coup not only won widespread social support, but also successfully avoided bloody conflicts and achieved a smooth transition of power. After the successful coup, General Bordelev and his team began implementing a series of reform measures. They are committed to restoring economic stability, improving people's livelihoods, strengthening democratic system construction, and striving to eliminate social injustice and corruption. These measures have won widespread praise from the public and laid a solid foundation for the future development of the Russian Democratic Republic. "
"
kr_xinnianzhengbian_event.2.a:0 "Avoiding Russia from falling deeper into turmoil and crisis"
je_otl_yitiaogouzhanzheng:0 "A War Triggered by a Dog"
je_otl_yitiaogouzhanzheng_reason:0 "After World War I, the situation in the Balkans remained tense. Greece, as a victorious country, has a high regard for itself, while Bulgaria, as a defeated country, faces many difficulties. There are profound contradictions between the two countries due to territorial and ethnic issues. In addition, after taking power in 1923, the Bulgarian military officer corps clamored for revenge for World War I, which further exacerbated the tension in neighboring countries such as Greece."
yitiaogouzhanzheng_event.1:0 "Greek-Bulgarian conflict"
yitiaogouzhanzheng_event.1.t:0 "Greek-Bulgarian conflict"
yitiaogouzhanzheng_event.1.d:0 "Although the scale of the war is not large, its impact is far-reaching. It not only led to the collapse of two political strongmen, but also further exacerbated the tension in the Balkan Peninsula."
yitiaogouzhanzheng_event.1.f:0 "On October 22, 1925, a dog owned by Greek border guards mistakenly entered Bulgarian territory from the Macedonian region of Greece. Greek soldiers crossed the border to retrieve the dog, but were mistaken by the Bulgarian border guards for attempting to cross the border. As a result, they opened fire, resulting in the sacrifice of one Greek soldier. Later, another Greek army captain went to search for the dog and was also shot at by the Bulgarian army."
yitiaogouzhanzheng_event.1.a:0 "It's a ridiculous excuse for war"
yitiaogouzhanzheng_event_tt:0 "This is a real event that happened in history"

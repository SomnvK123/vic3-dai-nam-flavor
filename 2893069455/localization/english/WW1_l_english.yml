salarewoshijian_event.1:0 "Assassination of Archduke [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName] of Austria"
salarewoshijian_event.1.t:0 "Assassination of Archduke [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName] of Austria"
salarewoshijian_event.1.d:0 "The Sarajevo Incident occurred on June 28, 1914, in Bosnia on the Balkan Peninsula, which was Serbia's National Humiliation Day. Archduke [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName] and his wife, the heirs to the [SCOPE.sCountry('aus_ferdinand_now_die_scope').GetName] throne, were shot dead by Serbian nationalist Princip."
salarewoshijian_event.1.f:0 "On June 28, 1914, Archduke [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName] participated in commanding a military exercise. The exercise was held in Bosnia controlled by the Austro Hungarian Empire, with neighboring Serbia as the hypothetical enemy. A secret organization in Serbia has sent multiple assassins to ambush in Sarajevo, preparing to carry out an assassination. After the exercise, the [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName] couple entered the city in an open top car, and an assassin threw a bomb at the car, but only grazed [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName]. When the [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName] couple's car reached a corner, another member of the secret organization, 19-year-old Princip, immediately rushed forward and shot at the [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName] couple. As a result, both the [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName] couple died and Princip was arrested."
salarewoshijian_event.1.a:0 "The spark that ignited the First World War"
salarewoshijian_event_tt:0 "This is a real event that happened in history"
xieyueguo_event.1:0 "Victory of the Allied Powers"
xieyueguo_event.1.t:0 "Victory of the Allied Powers"
xieyueguo_event.1.d:0 "The First World War ended and the Allied Powers emerged victorious"
xieyueguo_event.1.f:0 "On the morning of November 11, 1918, German representative Erzberg and the commander-in-chief of the Allied forces, Foch, signed the "Armistice of the Compi è gne Forest" in the Foch carriage of the Compi è gne Forest Redoway station in northeastern France, north of Paris. At 11 a.m., the agreement came into effect, and a ceasefire was declared along the entire western front, marking the end of World War I. After the end of World War I, the victorious countries held a post-war treaty conference at the Palace of Versailles in Paris in January 1919. After intense competition and mutual compromise, on June 28th, the victorious countries signed the Treaty of Versailles, also known as the Treaty of Versailles, in the Hall of Mirrors at the Palace of Versailles. According to the Treaty of Versailles and a series of subsequent treaties, the map of Europe was redrawn. The Austro Hungarian Empire collapsed, and Austria and Hungary became two independent countries. Czechoslovakia and Yugoslavia were also declared established. Romania took over some territories from Hungary and Bulgaria. And the Baltic coastal countries became independent one after another, most of which were separated from the Russian Empire. Poland, which also gained independence, included part of the territory previously belonging to Germany and entered the sea through the "Polish Corridor" located in Danzig. France regained the Alsace and Lorraine regions lost in the Franco Prussian War, while Belgium and Denmark also gained some territory from Germany. Overall, Germany lost 13% of its pre war territory, and its colonies became new territories of one or another of the Allied powers."
xieyueguo_event.1.a:0 "I hope there won't be any more wars"
xieyueguo_event_tt:0 "This is a real event that happened in history"
tongmengguo_event.1:0 "Victory of the Allied Powers"
tongmengguo_event.1.t:0 "Victory of the Allied Powers"
tongmengguo_event.1.d:0 "The First World War ended, and the Allied powers emerged victorious"
tongmengguo_event.1.f:0 "Serbia ceded Macedonia to Bulgaria and was forced to accept Austria Hungary's supervision in many of its domestic and international affairs. Albania suffered the same fate. Montenegro was completely annexed by Austria.\nGreece was forced to cede Greek Macedonia and Thessaloniki to Bulgaria, and had to accept Germany's lease of Crete as long as the German Emperor deemed it necessary.\nRomania was forced to cede the entire Dobroga to Bulgaria and give the passage of the Carpathian Mountains to Hungary. However, it was awarded to the province of Bessarabia, which was once part of Russia. Within its borders, the complete rights of minority religions are established, and the economic interests of the central alliance are also ensured.\nItaly was divided into many weak republics, and Tuscany, the Papal States, and the Two Sicilies returned to the map of Europe. As a buffer zone for Austria Hungary, the Republic of Venice was completely demilitarized. However, the Italian Civil War meant that only the two Sicilies, Sardinia, and the Roman Catholic states could remain on the European map for a long time.\nLibya became a kingdom under Ottoman protection.\nFrance ceded to Germany all French Equatorial Africa, Pontichelle, **, the Pacific colony and the strip territory from the Caribbean Strait to Lorraine south of Dahomey, Cote d'Ivoire, Madagascar and Lake Chad. However, the revolution prevented Germany from occupying territories outside of Lorraine.\nBelgium was reorganized into the Kingdom of Flanders Walloon, with Albert, the son of the German Emperor, as the new king. The Belgian Congo was handed over to Germany, while the Walloon region in the eastern part of the Meuse River, which had a large amount of Belgian industry, was continuously occupied by the German government when deemed necessary. The Grand Duchy of Luxembourg became an integral part of the German Empire.\nIn the East, the areas occupied by the Treaty of Brest Litovsk were organized into a series of puppet states. Estonia and Latvia were merged into the Baltic Sea Principality. Heinrich, the brother of the German Emperor, became King Heinrich I of Belarus. Poland and Finland became independent countries under German protection, while Lithuania gained independence. Archduke Wilhelm Franz of Austria ascended to the throne of Ukraine and formed an alliance with Central Europe."
tongmengguo_event.1.a:0 "I hope there won't be any more wars"
tongmengguo_event_tt:0 "Opened the script for KR World Line"
yuegeming2_event.1:0 "february revolution"
yuegeming2_event.1.t:0 "february revolution"
yuegeming2_event.1.d:0 "The revolutionary movement that erupted in the Russian Empire overthrew the Romanov dynasty and ended the rule of absolute monarchy. After the February Revolution, two regimes emerged, the Russian Provisional Government and the Soviet Government."
yuegeming2_event.1.f:0 "Under the leadership of the Bolshevik Party (later renamed the Russian Communist Party), major factories in the capital held a joint general strike with 300000 participants. The revolutionary storm frightened Tsar Nicholas II, who ordered that no measures be taken to quickly restore order in the capital. The leaders of the Bolshevik Petrograd Committee and over a hundred other revolutionary activists were arrested, which sparked great anger among the masses. They took to the streets to protest against government atrocities, but were subjected to even more brutal repression. So the Viborg District Party Committee, which led the strike, decided to transform the general strike into an armed uprising and overthrow the Tsarist government. The workers immediately took action, captured the arsenal, seized firearms and ammunition, built barricades, and fought against the reactionary military and police. At the same time, the workers actively carried out the work of fighting for the army. Under the propaganda and inspiration of the workers, tens of thousands of soldiers openly stood on the side of the revolution. They, together with the rebel workers, occupied the Tsar's lair, the Winter Palace, and various government departments, and arrested the Tsar's ministers and generals. The capital uprising achieved complete victory. Nicholas II was unwilling to accept his failure and immediately mobilized troops from the front line in an attempt to retake the capital, but the Tsarist army also staged a mutiny under the influence of the revolution. Nicholas II saw that the situation was hopeless and was forced to retire on March 15, 1917, in favor of his brother Michael. The next day, Michael also announced his abdication. In this way, the Romanov dynasty, which had ruled Russia for 304 years, was overthrown by the February Revolution. The Russian Democratic Revolution achieved victory."
yuegeming2_event.1.a:0 "This revolution ended the monarchy in Russia"
yuegeming2_event_tt:0 "This is a true event that occurred in Russian history"
yuegeming2:0 "The impact of the February Revolution"
je_yuegeming10:0 "the October Revolution"
je_yuegeming10_reason:0 "The October Revolution was an armed uprising led by the Bolshevik Party under the leadership of Comrade Lenin, the mentor of the Great Revolution."
yuegeming10_event.1:0 "the October Revolution"
yuegeming10_event.1.t:0 "the October Revolution"
yuegeming10_event.1.d:0 "The October Revolution, also known as the Red October, October Uprising, Petrograd Armed Uprising or Bolshevik Revolution, was called the "Great October Socialist Revolution" by the Soviet Workers' and Peasants' Red Army. It was a great socialist revolution completed by the Russian working class under the leadership of the Bolshevik Party, united with poor peasants. It was the second and final important stage of the 1917 Russian Revolution. Due to its occurrence on October 25th, 1917 in the Russian calendar, it is called the "October Revolution"."
yuegeming10_event.1.f:0 "On November 7, 1917, the armed forces of the Bolshevik Party led by Comrade Vladimir Ilyich Lenin launched a general attack on the Winter Palace in St. Petersburg, the location of the bourgeois provisional government, overthrowing the provisional government and establishing Soviet power. The October Revolution was an armed uprising led by the Bolshevik Party under the leadership of Comrade Lenin, the mentor of the Great Revolution. It established the second proletarian regime in human history (the first being the Paris Commune proletarian regime) and the first socialist country led by a Marxist party - the Russian Soviet Federative Socialist Republic, abbreviated as "Soviet Russia". The revolution overthrew the bourgeois Russian Provisional Government (Russian Republic) led by Alexander Fyodorovich Kerensky, laying the foundation for the Soviet Civil War from 1918 to 1920 and the establishment of the Union of Soviet Socialist Republics in 1922. The victory of the October Revolution opened a new era in human history, paving the way for proletarian revolutions, colonial and semi colonial national liberation movements in various countries around the world."
yuegeming10_event.1.a:0 "It's best to pray that the Tsar won't appear in the basement"
yuegeming10_event_tt:0 "This is a true event that occurred in Russian history"
GONG_CAN_GUOJI:0 "Comintern"
ww1_blsttiaoyue.1:0 "Treaty of Brest Litovsk"
ww1_blsttiaoyue.1.t:0 "Treaty of Brest Litovsk"
ww1_blsttiaoyue.1.d:0 "The Treaty of Brest Litovsk was a treaty signed between the Soviet government and the Allied powers led by Germany in Brest Litovsk during World War I. It is a treaty signed on March 3, 1918 in Brest Litovsk between Soviet Russia and the German Will Empire and its allied countries (Austria Hungary, Ottoman Empire, Kingdom of Bulgaria)."
ww1_blsttiaoyue.1.f:0 "The treaty consists of 14 main articles, 5 annexes, and 7 supplementary treaties. The main content includes:\n①Both contracting parties declare a ceasefire.\n②The Russian military will be fully demobilized, and before signing a universal peace treaty, Russian ships will return to Russian ports or immediately disarm.\n③Russia renounces its jurisdiction and sovereignty over Poland, Lithuania, Kurland, Livland, and Estonia.\n④Before the conclusion of a universal peace treaty and the full demobilization of the Russian military, Germany will continue to occupy the areas occupied by the German army to the east of the aforementioned regions prior to the signing of the treaty.\n⑤The Russian army immediately withdrew from the Altakhan, Kars and Batumi regions (the region was actually annexed by Türkiye).\n⑥Russia recognizes the independence of Ukraine and Finland, immediately withdraws its troops from Finland, Ukraine, and the Å land Islands, guarantees to sign a peace treaty with Ukraine immediately, and recognizes the peace treaties between Ukraine and Germany, Austria, Bulgaria, and Turkey.\n⑦Russia paid Germany 6 billion marks in war reparations.\n⑧Germany promises not to interfere in the internal affairs of Soviet Russia and not to attack Russia from the Finnish side.\nThis harsh peace treaty not only caused Russia to lose about 1 million square kilometers of land and nearly 50 million residents, but also accounted for 90% of the country's coal mining output, 73% of iron ore, 54% of industry and 33% of railways in the occupied areas."
ww1_blsttiaoyue.1.a:0 "There is no need for the war to continue. We will abide by the treaty"
ww1_blsttiaoyue_tt:0 "There is no need for the war to continue. We will abide by the treaty\nThis is a true choice in the history of the Soviet Union"
ww1_blsttiaoyue.1.b:0 "This is simply a loss of power and humiliation of the country, tearing up the treaty!"
ww1_blsttiaoyue_ttt:0 "We will continue the war with Germany, but we won't be able to resolve the civil war in the short term"

baerganzhanz1_event.1:0 "First Balkan War"
baerganzhanz1_event.1.t:0 "First Balkan War"
baerganzhanz1_event.1.d:0 "The First Balkan War was a war fought by the Balkan League against the Ottoman Empire. The Balkan League declared war on the Ottoman Empire on October 18, 1912, with the support of the Russian Empire, after its demand for autonomy for Macedonia and Thrace was rejected."
baerganzhanz1_event.1.f:0 "In 1908, the Ottoman Empire had a youth Türkiye revolution, and the Austro Hungarian Empire took the opportunity to annex Bosnia. The Ottoman Empire could not stop it. The weakness and incompetence of the Ottoman Empire in the Bosnia issue deepened the contempt of the Balkan countries towards the Ottoman Empire. In addition, Serbia, which originally intended to annex Bosnia, changed its plan to expand southward after Austria Hungary annexed Bosnia in order to seize Albania's sea route. Therefore, many countries formed the Balkan Alliance and declared war on the Ottoman Empire."
baerganzhanz1_event.1.a:0 "The Balkan Wars were one of a series of world events that marked the collapse of medieval Eastern European society"
baerganzhanz1_event_tt:0 "This is a real event that happened in history"
je_baerganzhanz1:0 "First Balkan War"
je_baerganzhanz1_reason:0 "The two sides of the First Balkan War were the Balkan League and the Ottoman Empire."
je_aosimanjieguo:0 "The Results of the First Balkan War"
je_aosimanjieguo_reason:0 "With the support of Russia, Pan Slavism became the mainstream ideology in the Balkans, and Balkan countries actively expanded their armies and engaged in diplomatic work, seeking support from European powers and hoping to seize the Ottoman Empire's territory in the Balkans. In March 1912, Serbia and Bulgaria formed an alliance; In May, Montenegro and Greece also participated; Form the Balkan League."
ouzhoubingfu:0 "the sick man of Europe"
baerganshengli_event.1:0 "Balkan League Victory"
baerganshengli_event.1.t:0 "Balkan League Victory"
baerganshengli_event.1.d:0 "After fierce battles, the Kingdom of Serbia and the Kingdom of Montenegro occupied Macedonia and the Adriatic coast; The Kingdom of Bulgaria controls the area west of Istanbul; The Kingdom of Greece occupied the Aegean Islands; The Ottoman Empire's army retreated to places such as Edirne, Ioannina, and Skoda after being defeated. On November 3rd, the Ottoman Empire was forced to request peace and coordination from European powers, and on May 30th, 1913, the Treaty of London was signed, marking the end of the war. The defeated Ottoman Empire lost most of its territory in Europe."
baerganshengli_event.1.f:0 "Due to the intervention of foreign powers, a peace conference was held in London on May 30, 1913. Macedonia, which originally belonged to the Ottoman Empire, was partitioned by Serbia, Bulgaria, and Greece, while Thessaloniki was incorporated into Greece. Subsequently, the Austro Hungarian Empire joined the conference. Austria Hungary feared that Serbia would become even stronger after gaining access to Albania, and insisted that Albania must become independent. Austria Hungary's proposal went against Serbia's dream of establishing a 'Greater Serbia' that included Serbia, Montenegro, Bosnia, Herzegovina, and Albania by seizing Ottoman territory in Europe. Afterwards, Serbia became even more resentful towards Austria Hungary, becoming the main cause of the Ossetian War and even the First World War. At the same time, although Albania gained independence after the war, Kosovo, where a large number of Albanians lived, merged into Serbia after the war, becoming the root cause of the Kosovo issue in the late twenties."
baerganshengli_event.1.a:0 "Serbia and Bulgaria have differences over the rule of Macedonia"
baerganshengli_event_tt:0 "This is a real event that happened in history"
aosimanshengli_event.1:0 "Ottoman Victory"
aosimanshengli_event.1.t:0 "Ottoman Victory"
aosimanshengli_event.1.d:0 "The Ottoman Empire demonstrated astonishing resilience and ultimately defeated the Balkan League composed of Bulgaria, Serbia, Greece, and Montenegro."
aosimanshengli_event.1.f:0 "The war ended with the victory of the Ottoman Empire. Both sides signed a peace agreement, in which the Balkan League countries recognized the Ottoman Empire's control over the Balkan Peninsula and gave up further claims to Ottoman territory. At the same time, the Ottoman Empire also promised to carry out a series of reforms to alleviate ethnic conflicts and promote national stability."
aosimanshengli_event.1.a:0 "The outcome of the war had a profound impact on the political landscape of the Balkan Peninsula and even the entire Europe"
baergantongmeng:0 "Balkan League"
baerganzhanz2_event.1:0 "The Second Balkan War"
baerganzhanz2_event.1.t:0 "The Second Balkan War"
baerganzhanz2_event.1.d:0 "Bulgaria believed that they had contributed the most to the war against the Ottoman Empire, so they hoped to divide more land. Bulgaria tended to occupy the entire Macedonia domestically, so they were unable to negotiate with Serbia. Serbia, due to the lack of access to the Adriatic Sea, demanded that Bulgaria, which had the most land, cede a portion of Macedonia as compensation; Greece demands to occupy the southern part of Macedonia and Western Thrace; Romania, which did not join the alliance, demanded the possession of southern Dobroga."
baerganzhanz2_event.1.f:0 "Bulgaria expresses dissatisfaction with the outcome of the Balkan Wars. Despite being granted a large amount of territory before the war, Serbia and Greece completely disagreed with Bulgaria's claim to Macedonia. As retaliation, Bulgaria launched a surprise attack on Serbia, and then they were stunned. It turned out that Greece and Serbia had already formed an alliance for this. Bulgaria is in a dilemma - has the stability of the Balkans become a thing of the past?"
baerganzhanz2_event.1.a:0 "This will make Bulgaria more inclined to join the Allied Powers due to its revengeful tendencies"
baerganzhanz2_event_tt:0 "This is a real event that happened in history"

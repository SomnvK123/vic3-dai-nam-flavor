je_kr_shamozhanzheng:0 "DESERT WAR"
je_kr_shamozhanzheng_reason:0 "Nationalism and religious sentiment in the Middle East are also quietly fermenting. Arab nationalists aspire to break free from Ottoman rule and establish an independent state, while some religious leaders attempt to use this turbulent period to promote the revival and unity of Islam. These internal factors are intertwined with the intervention of external forces, making the situation in the Middle East increasingly complex."
KR_shamozhanzheng_event:0 "DESERT WAR"
KR_shamozhanzheng_event.1.t:0 "DESERT WAR"
KR_shamozhanzheng_event.1.d:0 "At the end of the meeting, all participants made a joint commitment to unite if any country they represented went to war with Türkiye. This resolution laid the foundation for the birth of the first military alliance in modern Arab history - the Cairo Treaty."
KR_shamozhanzheng_event.1.f:0 "After the collapse of negotiations on the Sinai Palestine issue, the Egyptian army crossed the Sinai Desert, and Arab nationalists and Ottoman imperialists finally decided to tear themselves apart. Since 1914, the two largest powers in the Middle East will determine the fate of the region. Although Egyptians could rely on the support of other Arab countries, many people believe that their power is not enough because the military and economic strength of the Ottoman Empire still exceeds that of the Cairo Treaty.\nForeign investors were scared out of their wits by this conflict, as with the collapse of the United States, oil in the Middle East is more important than ever before."
KR_shamozhanzheng_event.1.a:0 "What about oil?"
je_shamozhanzheng_tur:0 "Ottoman Victory"
je_shamozhanzheng_tur_reason:0 "Osman won the war with Egypt."
kr_smzz_aosimanshengli_event:0 "Pacifying the Desert Rebellion"
kr_smzz_aosimanshengli_event.1.t:0 "Pacifying the Desert Rebellion"
kr_smzz_aosimanshengli_event.1.d:0 "With the fall of Cairo, the road ahead for the Cairo Treaty became bleak."
kr_smzz_aosimanshengli_event.1.f:0 "Cairo, known as the "City of a Thousand Towers," is one of the oldest cities in the world and the center of wisdom and culture in the Arab world. Throughout history, countless invaders have set foot in this city. The rolling yellow sand around the ancient city has once again witnessed this great city falling into the hands of new occupiers. With a series of effective offensives launched by the Ottoman army, the remaining Egyptian defenders retreated to Cairo Castle and stubbornly resisted.\nAfter a long battle, the last group of stubborn Egyptian defenders in the city declared unconditional surrender. Although the Ottoman army achieved a glorious victory, there were still riots and looting in the city. They have promised to combat such phenomena and protect this historic city."
kr_smzz_aosimanshengli_event.1.a:0 "The ridiculous' Cairo Treaty 'is at the end of its strength, this is a glorious victory for the Ottoman Empire!"
je_shamozhanzheng_egy:0 "Egypt's Victory"
je_shamozhanzheng_egy_reason:0 "Egypt won the war against the Ottomans."
kr_smzz_aijishengli_event:0 "Cairo Treaty"
kr_smzz_aijishengli_event.1.t:0 "Cairo Treaty"
kr_smzz_aijishengli_event.1.d:0 "Since the defeat of the Ottoman Empire in the Desert War, Türkiye has experienced civil war and turbulence. The overthrow of the old imperial government has led to increasing public dissatisfaction and questioning of the Turkic ethnic identity."
kr_smzz_aijishengli_event.1.f:0 "The failure of the Desert War put the Ottoman Empire in a severely weakened state. The Ottoman Empire was forced to cede many territories to the Arabs, resulting in countless deaths and plunging the entire Middle East into a sea of fire. But now is not the time to look back and cry about the past. Now is the time to look to the future and rebuild what we still have."
kr_smzz_aijishengli_event.1.a:0 "Knocked down the last nail on the coffin of the old empire……"

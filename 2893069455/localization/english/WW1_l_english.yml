tno_ouzhouxinzhixu_event.1.d:0 "As the smoke of war gradually dissipates, the flag of Germany flies high above the ruins, symbolizing victory and the beginning of a new rule. Germany did not stop, but began to reshape a new order in Europe with an almost ruthless attitude."
tno_ouzhouxinzhixu_event.1.f:0 "Under this new order, every piece of land and every city in Europe seems to be firmly nailed to the scroll of history by Germany's iron hooves. The cultures and histories of various countries have been erased, replaced by German rule and ideology. Those who once opposed Germany were either forced to surrender or disappeared without a trace, only fear and obedience pervaded the air."

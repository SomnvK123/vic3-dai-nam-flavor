je_faxisizhuyijueqi:0 "The Rise of Fascism"
je_faxisizhuyijueqi_reason:0 "The original meaning of fascism is "bundle stick", which is an axe tied to multiple wooden sticks surrounded by each other. In ancient Rome, it was a symbol of power and prestige. Fascism is a political philosophy that combines corporatism, syndicalism, authoritarianism, extreme nationalism, forms of centralization, anti anarchism, anti laissez faire capitalism, and anti communism.\n#y If the power of ordinary citizens is considered crucial, progress will increase every month.#!"
faxisideyingxiang:0 "The Rise of Fascism"
otl_faxisiguojia_event:0 "[SCOPE.sCountry('faxisiguojia_scope').GetName]Becoming a fascist country"
otl_faxisiguojia_event.1.t:0 "[SCOPE.sCountry('faxisiguojia_scope').GetName]Becoming a fascist country"
otl_faxisiguojia_event.1.d:0 "[SCOPE.sCountry('faxisiguojia_scope').GetName]Overthrow the original social system and officially became an extremist country."
otl_faxisiguojia_event.1.f:0 "Fascism emerged in Italy in the 1920s, blending the concepts of syndicalism and anti materialist state theory; The latter has already been linked to nationalism. Whether in philosophy or politics, fascism also opposes capitalist economy and laissez faire policies - similar to Marxism in this regard. Many scholars define fascism as an ideology that possesses one or more of the following characteristics: strong nationalism, economic corporatism, a powerful military leader who places the status of the nation, state, or collective above individuals or groups."
otl_faxisiguojia_event.1.a:0 "Who can tell me what this is?"

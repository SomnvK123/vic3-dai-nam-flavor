otl_luosangtiaoyue_event.1:0 "Treaty of Lausanne"
otl_luosangtiaoyue_event.1.t:0 "Treaty of Lausanne"
otl_luosangtiaoyue_event.1.d:0 "This treaty established the territory of modern Türkiye. Although Türkiye gave up its territory in the Arab region and Cyprus, it retained East Thrace, and cancelled Armenia's independence and Kurdish autonomy."
otl_luosangtiaoyue_event.1.f:0 "The treaty consists of 143 articles, mainly including:\n①Declares the formal restoration of peace between the Allies and Türkiye as of the date of entry into force of the Treaty.\n②The Allies recognized Türkiye's independence and territorial integrity within Asia Minor, and confirmed Türkiye's borders from the Black Sea to the Aegean Sea, and from the Mediterranean Sea to Persia (now Iran); East Thrace and Izmir regions are returned to Türkiye, and some ethnic minority areas such as Armenia and Kurdistan are still owned by Türkiye; The issue of ownership of the oil producing area of Mosul will be resolved later (the 1926 Anglo Turkish Agreement transferred the Mosul region to British administered Iraq).\n③Türkiye has abandoned its territorial claims in Egypt, Tunisia, Morocco, Libya and other places that were formerly part of the Ottoman Empire.\n④For the losses caused by the First World War and the armed intervention of the Allies in Türkiye, the two sides mutually waive the claim for compensation; Türkiye repaid part of the foreign debt of the former Ottoman Empire; The contracting parties announced the abolition of all extraterritorial jurisdiction and financial and tariff supervision rights in Türkiye, and Turkey implemented customs autonomy.\n⑤The non militarization of the strait area is implemented, and the contracting parties declare their agreement to the principles of freedom of sea and air passage and navigation in the strait area; No defense or deployment of armed forces is allowed in the strait zone, which is supervised by the International Committee (also known as the Strait Committee)."
otl_luosangtiaoyue_event.1.a:0 "Türkiye waged an armed struggle against the Sevre Peace Treaty and won."
otl_luosangtiaoyue_event_tt:0 "This is a real event that happened in history"
je_luosangtiaoyue:0 "Treaty of Lausanne"
je_luosangtiaoyue_reason:0 "The peace treaty with Türkiye between the ally and the countries participating in the war."

xilaneizhan_event.1:0 "Greek civil war breaks out"
xilaneizhan_event.1.t:0 "Greek civil war breaks out"
xilaneizhan_event.1.d:0 "The Greek Civil War had been intervened by Britain since its inception, and since 1947, the United States had also intervened in the Greek Civil War through the Marshall Plan. At the same time, there were differences within the socialist camp regarding the Greek Civil War. Stalin, the supreme leader of the Soviet Union, decided not to intervene in the Greek Civil War in accordance with the percentage agreement, while Tito, the leader of Yugoslavia, firmly supported intervention in support of the Greek Communist Party."
xilaneizhan_event.1.f:0 "The Greek government held an election as scheduled in 1946. The Communist Party of Greece boycotted the election, which also led to the victory of the United Patriotic Party, which held constitutional monarchy. In a referendum in September, the royalists won a narrow majority, and King George II returned to Athens that month. At the same time, with the deterioration of relations between the Soviet Union and its Western allies, the beginning of the Cold War, and the activation of global communist armed forces, the Greek Communist Party quickly changed its political stance and took up arms again to compete with the Greek government for power. The Greek Civil War officially began."
xilaneizhan_event.1.a:0 "It’s just a microcosm of the Cold War between the United States and the Soviet Union."
xilaneizhan_event_tt:0 "This is a real event that happened in Greek history"
je_otl_xilaneizhan:0 "greek civil war"
je_otl_xilaneizhan_reason:0 "The Greek Civil War was a war between the Greek National Army, led by the Royal Government of Greece, and the Democratic Army of Greece, led by the Communist Party of Greece, which lasted from 1946 to 1949. The cause of the Greek Civil War was the severe division of political forces in Greece since 1943, and the power vacuum caused by the withdrawal of Axis troops after the end of World War II. In the Greek Civil War, the Greek National Army received support from the United Kingdom and the United States, while the Democratic Army of Greece received support from Yugoslavia, the Communist Party of Albania, and the People's Republic of Bulgaria. The Greek Civil War ended with the victory of the Greek National Army. The Greek Civil War resulted in the deaths of approximately 160,000 people in Greece, and more than one million people were affected by the civil war and became refugees."
kelayuewatiaoyue_event.1:0 "Treaty of Craiova"
kelayuewatiaoyue_event.1.t:0 "Treaty of Craiova"
kelayuewatiaoyue_event.1.d:0 "Romania's government has accepted Germany's ruling on a Balkan border dispute. South Dobroga returns to Bulgaria!"
kelayuewatiaoyue_event.1.f:0 "Under the terms of the treaty, Romania must allow Bulgaria to regain the Southern Dobroga region that Romania gained after the Second Balkan War in 1913. Bulgaria must pay RON 1 million as compensation for Romania's investment in the region."
kelayuewatiaoyue_event.1.a:0 "A day of celebration for Bulgarians!"
kelayuewatiaoyue_event_tt:0 "This is a real event that happened in history"
je_ger_kelayuewatiaoyue_button:0 "Treaty of Craiova"
je_ger_kelayuewatiaoyue_button_desc:0 "After Hungary acquired Transylvania, Bulgaria reminded us of its long-standing border dispute with Romania, centered on Southern Dobroga, which was occupied by Romania in 1913."
otl_rom_xiaoxieyueguo:0 "Found in Romania, Czechoslovakia and Yugoslavia"
otl_czh_xiaoxieyueguo:0 "Czechoslovakia agrees to form Little Entente"
otl_yug_xiaoxieyueguo:0 "Yugoslavia agrees to form Little Entente"
otl_not_xiaoxieyueguo:0 "One of Romania, Czechoslovakia, and Yugoslavia does not exist or does not agree to form the Little Entente"
je_otl_xiaoxieyueguo:0 "Little Entente"
je_otl_xiaoxieyueguo_reason:0 "The Little Entente was an alliance formed by Czechoslovakia, Romania and Yugoslavia in 1920 and 1921. The purpose of the alliance was to suppress Hungarian nationalism and irredentism, and to prevent the reconstruction of the Habsburg dynasty. To support this alliance, France signed several treaties with its allies in the Little Entente."
otl_xiaoxieyueguo_event.1:0 "The Little Entente was formed"
otl_xiaoxieyueguo_event.1.t:0 "The Little Entente was formed"
otl_xiaoxieyueguo_event.1.d:0 "The Little Entente was an alliance proposed by Beneš, whose most obvious purpose was to prevent Hungary from becoming great again and prevent the reestablishment of the Habsburg dynasty."
otl_xiaoxieyueguo_event.1.f:0 "The Treaty between Romania and Czechoslovakia was signed in Bucharest on April 23, 1921. The two parties exchanged confirmations on May 27.\nnThe treaty between Yugoslavia and Romania was signed in Belgrade on June 7, 1921.\nThe Treaty between Czechoslovakia and Yugoslavia was signed in Belgrade on August 31, 1922."
otl_xiaoxieyueguo_event.1.a:0 "Military-political alliance against Germany and Hungary"
otl_xiaoxieyueguo_event_tt:0 "This is a real event that happened in history"
otl_xiaoxieyueguo_yiwancheng:0 "The Little Entente has not yet been formed"
xiaoxieyueguo_zujian_event.1:0 "Romania invites us to form the Little Entente"
xiaoxieyueguo_zujian_event.1.t:0 "Romania invites us to form the Little Entente"
xiaoxieyueguo_zujian_event.1.d:0 "The Romanian diplomatic envoy handed over a document proposing that our country, Czechoslovakia, and Yugoslavia jointly sign the "Little Entente Agreement.""
xiaoxieyueguo_zujian_event.1.f:0 "This plan aims to use military mutual assistance to resist the territorial claims of Hungary, Bulgaria and other neighboring countries, and to consolidate the Eastern European order under the Versailles system. Romania emphasized that France has expressed support for this alliance, but the expansion ambitions of Germany and the Soviet Union may become potential threats."
xiaoxieyueguo_zujian_event.1.a:0 "Only by uniting can we resist the wolves!"
xiaoxieyueguo_zujian_event.1.b:0 "Isolationism is the way to survive"
xiaoxieyueguo_zujian_event_tt:0 "This is the real choice made by Czechoslovakia and Yugoslavia in history"

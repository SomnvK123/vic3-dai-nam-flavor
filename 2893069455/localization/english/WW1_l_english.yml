KR_yidalihongjunshengli_event.1:0 "The Italian Socialist Republic won the civil war"
KR_yidalihongjunshengli_event.1.t:0 "The Italian Socialist Republic won the civil war"
KR_yidalihongjunshengli_event.1.d:0 "The great defeat in the Battle of Caporetto in 1917 caused the Central Army Group of Italy to be completely torn apart by the Austro Hungarian army in northern Italy. Millions of German Austrian troops advanced from Caporetto's front line and fought all the way to the city of Rome, directly ending the political life of the Italian Savoy dynasty that unified the entire half of the Apennine Island in 1871. The failure of this battle triggered profound political and social turmoil within Italy. As news of the invasion of Rome by the army of the German Austrian Central Alliance reached Milan and Turin, the Italian Nationalist Republic and the Italian Socialist Republic were declared almost simultaneously. Hundreds of thousands of Italian soldiers who participated in the World War had to be drawn into a sudden large-scale civil war."
KR_yidalihongjunshengli_event.1.f:0 "In the early stages of the civil war, the Kingdom of Two Sicilies, with its relatively strong military power and support from the Allied powers, briefly gained the upper hand. However, inspired by the spirit of syndicalism, the military of the Italian Socialist Republic demonstrated astonishing combat effectiveness and resilience. They gradually turned the tide of the war through flexible tactics and widespread public support. As the war deepened, the army of the Italian Socialist Republic not only achieved significant victories on the battlefield, but also established syndicalist regimes throughout Italy. They abolished feudal privileges, implemented land reform, improved workers' treatment, and won the heartfelt support of the general public. After months of fierce fighting, the army of the Italian Socialist Republic finally captured Sicily, declaring the defeat of the Kingdom of Two Sicilies and the complete victory of the Italian Socialist Republic. This victory not only marks the rise of syndicalism in Italy, but also heralds a new historical stage for Italy."
KR_yidalihongjunshengli_event.1.a:0 "Victory belonging to the labor team"
KR_yidaliliangxixilishengli_event.1:0 "Two Sicilies win the civil war"
KR_yidaliliangxixilishengli_event.1.t:0 "Two Sicilies win the civil war"
KR_yidaliliangxixilishengli_event.1.d:0 "The great defeat in the Battle of Caporetto in 1917 caused the Central Army Group of Italy to be completely torn apart by the Austro Hungarian army in northern Italy. Millions of German Austrian troops advanced from Caporetto's front line and fought all the way to the city of Rome, directly ending the political life of the Italian Savoy dynasty that unified the entire half of the Apennine Island in 1871. The failure of this battle triggered profound political and social turmoil within Italy. As news of the invasion of Rome by the army of the German Austrian Central Alliance reached Milan and Turin, the Italian Nationalist Republic and the Italian Socialist Republic were declared almost simultaneously. Hundreds of thousands of Italian soldiers who participated in the World War had to be drawn into a sudden large-scale civil war."
KR_yidaliliangxixilishengli_event.1.f:0 "The Italian Socialist Republic, with the armed support of French communes and Western European Soviet armies, entered major cities in northern Italy, and left-wing parties seized the highest power in the entire country. They set out the revolutionary goal of building worker Italy and began a series of glorious revolutionary undertakings on the Apennine Peninsula. At the same time, the royalists and democrats of the Two Sicilies were actually unstable in order to resist the alliance of the Trade Union International, but they still firmly stood against the Italian Socialist Republic. In this civil war, the armies of the Kingdom of Two Sicilies engaged in fierce battles with the army of the Italian Socialist Republic. Both sides engaged in fierce battles in multiple cities and villages in Italy. Although the Italian Socialist Republic once gained significant advantages in northern Italy, the armies of the Kingdom of Two Sicilies gradually stabilized their positions and began to launch counterattacks with the support of the Allied Powers. After a long period of intense fighting, this civil war ultimately ended in the victory of the Kingdom of Two Sicilies. The army of the Italian Socialist Republic was forced to retreat, and their revolutionary cause suffered serious setbacks. The Kingdom of Two Sicilies became an important force on the Italian peninsula after the war, and they continued to work towards the unity and stability of Italy."
KR_yidaliliangxixilishengli_event.1.a:0 "Victory belonging to the Two Sicilies"
je_yidalineizhan_ydl:0 "Italian Civil War - Victory of the Workers' Union"
je_yidalineizhan_ydl_reason:0 "If the Workers' Union wins the Italian Civil War, it can additionally annex the Papal States and control the entire Two Sicilies."
je_yidalineizhan_xxl:0 "Italian Civil War - Victory in Two Sicilies"
je_yidalineizhan_xxl_reason:0 "If the Two Sicilies win the Italian Civil War, they will draw a clear boundary with the Italian Socialist Republic in Rome, avoiding further deepening and unification of the Italian peninsula by the Trade Unions."
shijiexianbiandong:0 "Changes in World Lines"
je_otlshijiexian:0 "OTL World Line"
je_otlshijiexian_reason:0 "#r the First World War#!#y (July 28, 1914- November 11, 1918) was a global war primarily involving conflicts between opposing groups of countries. The cause of war is that imperialist powers seek to redivide colonies and compete for world hegemony. The warring parties mainly included the Allied Powers and the Allied Powers, and in the end, the Allied Powers emerged victorious.#!\n#r the Second World War#!#y (September 18, 1931- September 2, 1945) was an unprecedented global war involving allied countries such as China, the Soviet Union, the United States, and Britain, as well as anti fascist forces around the world, to resist the aggression of the Axis powers of Germany, Japan, and Italy. The war spanned from Europe to Asia, from the Atlantic to the Pacific, with 61 countries participating and 2 billion people involved.#!\n#o [ROOT.GetCountry.GetName]May be involved in a world war#!\nThis is a script that truly happened in history"
je_krshijiexian:0 "Kaiserreich"
je_krshijiexian_reason:0 "#y KR is a large fictional mod based on the games "Iron Ambition 2: Darkest Moment" and "Iron Ambition 4" developed by Swedish game company Paradox Interactive. It raises the question of "what would happen if Germany won World War I.\nIn 1914, with the Austro Hungarian Empire issuing an ultimatum and declaring war on Serbia, the First World War broke out. Germany supported Austria Hungary, while Russia declared war on Austria Hungary and Germany. Subsequently, France, Britain, and others joined the war one after another. In the early stages of the war, the German army implemented the Schlieffen Plan on the Western Front, but encountered setbacks and instead became deadlocked with Britain and France. However, on the Eastern Front, the German army achieved significant success, thwarting the Russian invasion.\nAs the war continued, the Ottoman Empire joined the Central Alliance due to disputes over ships, while Italy joined the Allied side. The war was plunged into brutal trench warfare, with both sides suffering significant losses on both the western and eastern fronts. At this time, the sinking of the Lusitania by a German submarine sparked strong opposition from the United States and led Germany to abandon unrestricted submarine warfare. However, the outbreak of key battles such as the Battle of Verdun and the Battle of the Somme made the war even more intense and brutal.\nIn 1917, the February Revolution and the October Revolution occurred in Russia, the Tsar abdicated, and the Bolsheviks established political power. Subsequently, Germany signed the Brest Litovsk Treaty with the Bolsheviks, allowing the German army to be deployed to other fronts. At the same time, the Central Alliance achieved victories in Greece, Italy, and other places, Italy surrendered, and the road to the south of France was opened. At this time, the morale of the French army was low and they began to openly rebel, ultimately surrendering in October 1918 and extinguishing the flames of war on the continent.\nAfter the war, the Central Alliance countries and the remaining Allied countries signed a ceasefire agreement in Copenhagen. Germany became the dominant force on the European continent, while only the British Empire, Japan, and Portugal remained among the Allied powers. After the war, Germany implemented a series of reform and expansion policies, forming complex political and military relations with countries such as Russia and Japan. Over time, two major camps gradually formed on the European continent: one was the Moscow Agreement countries centered around Russia, including Russia, Prussia, Poland, Czechoslovakia, and other countries; On the other hand, there are co prosperity circle countries centered around Japan, including Japan, Thailand, the Philippines, and other countries. In addition, there are the Allied forces represented by Canada, National France, and others, as well as the International Faction of Trade Unions represented by communes, Italy, and others. During the Cold War, there were intense political, economic, and military struggles between major factions. However, with the passage of time and changes in the international situation, some countries have begun to seek the path of peace and cooperation. In the end, after a series of complex diplomatic and political games, the world gradually moved towards a relatively stable and peaceful situation. It should be noted that Kaisereich's plot is based on historical assumptions and fiction, and therefore differs significantly from real history. Players can experience this fictional historical world through games and feel the complex relationships and interactions between different countries and powers.#!\n#o [ROOT.GetCountry.GetName]May be involved in the Second World War#!"
je_krgshijiexian:0 "Kalterkrieg"
je_krgshijiexian_reason:0 "#y Kalterkrieg (also known as KRG or Cold War) is a derivative module of Kaisereich (Imperial Empire) that sets an fictional Cold War era world line.\nIn Kalterkrieg, the outcome of World War II is vastly different from reality. Germany achieved victory in World War II and became a pole in the world. This victory was not without cost. Germany suffered heavy losses in the war, but ultimately succeeded in defeating the Soviet Union and other Allied powers. After the war, the world was divided into two major camps: the imperial treaty camp led by Germany and the democratic camp represented by the Toronto Agreement.\nImperial Treaty: Composed of Germany, the Danube Confederation, and its Eastern and Western European vassal states that adhered to continental conservatism. They hold high the banner of European conservatism and monarchism, opposing inefficient and incompetent liberals and left wingers without rulers or fathers. The Imperial Treaty Army is the most powerful military in the world, enthusiastic about developing various powerful but unstable high-tech weapons.\nThe Toronto Agreement: an alliance of Western liberal countries, including the United States, the United Kingdom, and Canada, united to defend the people of the free world. They relied on powerful firepower, meticulous planning, and cautious defensive counterattacks to counter the Imperial Treaty. The Toronto Agreement Army excels in economic warfare and electronic warfare beyond the battlefield, and possesses powerful defense and support technologies.\nRussia: Although Russia's extreme nationalist ideology is vastly different from the democracy of the Toronto Agreement, the two sides came together out of hatred towards the Imperial Treaty. Russia has accepted secret massive military aid from the agreement and maintains an extremely hostile attitude towards Germany.\nShanghai Cooperation Organization: an alliance composed of China, South Korea, and some anti Japanese Southeast Asian countries, united with the people of the Third World under the slogan of national liberation and overthrowing colonizers. They rely on advanced quantum technology and magnetic field manipulation techniques to apply advanced weapons such as magnetic railguns on a large scale.\nCo Prosperity Sphere: An alliance system centered around Japan, while deeply cooperating with Germany to counter the influence of China and the Toronto Agreement. With advanced biological and mechanical technology, as well as strong economic strength, the combat effectiveness of the Japanese army cannot be underestimated.\nIn Kalterkrieg's plot, as the confrontation between the two factions escalated, the world gradually fell into a prolonged Cold War. The two sides not only engaged in fierce military competition, but also engaged in comprehensive competition in the fields of economy, politics, and culture. In Kalterkrieg's plot, the ending of the Cold War is diverse. Sometimes the Toronto Agreement gradually gained an advantage and ultimately defeated the Imperial Treaty; Sometimes imperial treaties successfully maintain their hegemonic position through a series of means; Sometimes, both sides are stuck in a prolonged stalemate and unable to achieve a decisive victory. Regardless of the outcome, Kalterkrieg's plot deeply reflects the complex relationships between the world political landscape and major powers during the Cold War era. It reminds people to be vigilant about historical mistakes and lessons, and strive to maintain world peace and stability. Overall, Kalterkrieg is a creative and challenging game mod that offers a fictional Cold War era timeline, allowing players to personally experience the political, economic, and military struggles of that era.#!\n#o [ROOT.GetCountry.GetName]May be involved in the Second World War#!"
je_knshijiexian:0 "Krasnacht"
je_knshijiexian_reason:0 "#y Krasnacht (Akaya) is a 1950s world dominated by socialism and far right nationalism, with a focus on an fictional worldview\nIn Krasnacht's worldview, after the end of World War II (known as "the Second Weltkrieg" or "the Second Weltkrieg"), the land of Europe was devastated by war. However, when the war ended, two new forces emerged: the Third International representing socialism and the Saratov Pact representing nationalism. These two forces engaged in a fierce Cold War confrontation on a global scale.\nThe Third International: represents socialist forces and is committed to promoting socialist ideas on a global scale. The members include several socialist countries in Europe, as well as the Socialist Confederation of the Americas. Having strong military and economic power is an important force in the Krasnacht world.\nSaratov Pact: Representing nationalist forces, emphasizing nationalism and racial superiority. The members include multiple extreme nationalist organizations such as the Russian Nationalist Jihad Army and the Central Asian Nationalist Jihad Army. Confront with the Third International on a global scale and compete for world hegemony.\nKrasnacht's plot does not have a clear ending, but presents an open-ended ending. Players can influence the development of the plot based on their own choices and actions, resulting in different endings. In some plots, the Third International may successfully defeat the Saratov Treaty Organization and achieve the victory of global socialism; In other plotlines, the Saratov Treaty Organization may also successfully resist the Third International's attack and continue to maintain its sphere of influence.\nKrasnacht contains numerous characters, including politicians, military commanders, and ordinary soldiers. Each character has their own background story and personality traits, adding more color and depth to the plot.\nKrasnacht's worldview construction is very detailed, including multiple aspects such as politics, economy, and culture. These elements interweave with each other to form a complete and complex game world.\nKrasnacht, as a game, also includes rich game mechanics. Players can experience different storylines and endings by controlling different forces to engage in activities such as war, diplomacy, and economy.\nOverall, Krasnacht's plot is very exciting and profound. It presents a world dominated by socialism and extreme right-wing nationalism in the 1950s, and brings players the ultimate gaming experience through rich character settings, worldview construction, and game mechanics.#!\n#o [ROOT.GetCountry.GetName]May be involved in the Cold War#!"
je_tnoshijiexian:0 "The New Order"
je_tnoshijiexian_reason:0 "#y In the 1920s, Bukharin defeated Stalin and became the highest leader of the Soviet Union. During his tenure, the failure of reforms prevented the Soviet Union from industrializing, making it unable to resist German attacks. After the Moscow area was occupied by Germany, Stalin launched a coup against the Bukharin government in 1942, and soon after, the Soviet Union fell into separatist rule.\nDue to the failure of Soviet reform, the superiority of the Soviet Union was not fully realized, leading to Roosevelt and his New Deal proposals being compared to Bukharin and his disastrous economic policies. Ultimately, Roosevelt's New Deal faced more skepticism. Although Roosevelt won the 1932 and 1936 elections, his New Deal was criticized in his second term. In 1940, the Democratic Party lost to the Republican Party and Dewey succeeded.\nDuring the surprise attack on Pearl Harbor, Japan dealt a heavy blow to the US Pacific Fleet, and the Enterprise was sunk by torpedoes.\nGermany was the first to complete the development of a nuclear bomb, which landed at Pearl Harbor, leading to the eventual surrender of the United States and the loss of all its overseas territories.\nDue to the defeats of the Soviet Union and the United States, as well as the collusion between Yan Xishan and Fu Zuoyi with Japan, the isolated and helpless anti Japanese united front collapsed under the fierce attack of the Japanese army. In 1946, teacher and principal died in Chongqing. The current leader of the Republic of China is Gao Zongwu. Although warlords such as Fu Zuoyi, Lu Han, and Xia Wei also obeyed Japanese leadership. But they are all plotting rebellion. In the western region, Xikang led by Liu Wenhui, Xinjiang led by Zhang Zhizhong, and the Ma family army led by Ma Jiyuan are not under Japanese control - they are also waiting for the opportunity.\nThe United States formed the Free State Organization with countries such as Canada and Australia, and engaged in Cold War confrontation with Germany's solidarity agreement and Japan's Co Prosperity Sphere.\nAs the United States lost World War II, Americans were dissatisfied with the Democratic Party and the Republican Party of the organic group. In order to deal with the impact of the anti organic group, the Democratic Party and the Republican Party announced to merge into the Communist People's Alliance. In response, the anti establishment faction integrated all their forces into a contradictory and more extreme alliance called the "National Progressive Convention", which was formed by the conservative Kuomintang group, the progressive Progressive Convention group, the fascist sovereign group, and the communist Marxist group.\nItaly has established a trilateral alliance with the Iberian Union (a combination of Spain and Portugal), Türkiye and other countries. However, due to long-term interest disputes, this alliance is on the verge of collapse.\nDue to the attempted coup by the SS during the Russo Western War, Adolf Hitler exiled Heinrich Himmler and his forces to Belgium and eastern France, creating the Burgundy Knights.\nIn 1962, Hitler fell seriously ill and Germany faced civil war.#!\n#o [ROOT.GetCountry.GetName]May be involved in the Cold War#!"

kr_yingguodageming_event.1:0 "The British Revolution"
kr_yingguodageming_event.1.t:0 "The British Revolution"
kr_yingguodageming_event.1.d:0 "When the government army slaughtered miners, a general strike in Britain over coal tariffs escalated into a national uprising. The military began to collapse or defect, and there were also mutinies in the Royal Navy, forcing the government to flee to Canada. The left-wing unity centered around the Labor Union and surrounded by the charismatic John McLean became the British League."
kr_yingguodageming_event.1.f:0 "The collapse of the British government plunged all of its overseas territories into chaos. The Spaniards finally recaptured Gibraltar, the Argentines occupied the island of Ma, Egypt won the sole sovereignty of Sudan, Neizhi invaded the Trusil states, and Shemair ensured the loyalty of Kuwait. The Ottoman Empire recaptured Cyprus and Aden, while the latter was placed under the jurisdiction of Yemen. Germany seized the vast majority of British territory in Africa, while also occupying Malta, the Suez Canal, Berbera, Ceylon, the Straits Settlements, Brunei, and Sarawak. Australasia maintained British control over Fiji and New Guinea. The pearl on the former British crown, India, has split into three countries. The Indian Dominion, usually referred to as' Delhi ', still controls the northwest part of India, while the Indian National Assembly established its own country - the Bharata Commune, the southern princes formed their own royal federation, and Myanmar once again became an independent kingdom. The British protectorate in Somalia has completely collapsed, and Sudan Mohammed has declared Somalia's formal independence. South Africa ensured its control over Bechuana, and there was tension between pro Entente intellectuals and pro Republican Herzog. The Royal Navy Caribbean Fleet protected the British colony here. The colonies of England and France were jointly reorganized into the Caribbean Federation, while Venezuela protested against the United States' infringement of its sovereignty."
kr_yingguodageming_event.1.a:0 "Western Europe is completely leaning towards the Third International"
je_yingguodageming:0 "The British Revolution"
je_yingguodageming_reason:0 "Britain established the British Union and joined the Third International."

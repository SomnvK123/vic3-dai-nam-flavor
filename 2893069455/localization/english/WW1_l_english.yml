je_adijiaerweiji:0 "The Agadir Crisis"
je_adijiaerweiji_reason:0 "The Agadir Crisis, which occurred in 1911, was an international crisis. On July 1st of that year, Germany sent the battleship Panther to the Moroccan port of Agadir to declare Germany's interests in Morocco. Germany's actions are actually aimed at seeking compensation from France. According to the resolution of the 1906 Algeciras Conference, France gained significant benefits in Morocco. This crisis can be seen as another dispute arising from colonialism."
adijiaerweiji_fg_event.1:0 "The Agadir Crisis"
adijiaerweiji_fg_event.1.t:0 "The Agadir Crisis"
adijiaerweiji_fg_event.1.d:0 "The relationship between Britain and Germany has long been tense due to the arms race. Under the leadership of German Emperor Wilhelm II, Germany began mass producing dreadnoughts in the 1890s, while Britain viewed it as an attempt to challenge its maritime hegemony. When Britain discovered that German ships had arrived in Agadir, they mistakenly thought that Germany wanted to turn the port into a German military port in the Atlantic. As a result, the relationship between the two sides became more tense, and Britain tended to support France based on the sincere agreement. Germany's actions are actually aimed at seeking compensation from France. According to the resolution of the 1906 Algeciras Conference, France gained significant benefits in Morocco. This crisis can be seen as another dispute arising from colonialism."
adijiaerweiji_fg_event.1.f:0 "It seems that Germany has intervened in the struggle for Morocco. The Berlin and Panther cruisers successively arrived at the port of Agadir, revealing Germany's intention to interfere in Morocco. Whether Germany intends to take over some of the Moroccan colonies or demands compensation due to French intervention, this violates the Treaty of Algeciras.\nEuropean powers are preparing for the worst."
adijiaerweiji_fg_event.1.a:0 "Germany demands compensation\nGermany has proposed a peaceful solution to the crisis. If we transfer part of French Congo to Germany as a protectorate, they will abandon their intention of armed intervention. This is much better than a brutal war.\n"We agree, although it's despicable!""
adijiaerweiji_fg_event_tt:0 "France agrees to peacefully resolve the conflict and transfer part of French Congo to Germany as compensation. Due to concerns about the outbreak of a large-scale war, we had to swallow the bitter fruit that diplomats fought desperately for.\nThis is a real event that happened in history"
adijiaerweiji_fg_event.1.b:0 "Germany demands Agadir\nGermany is determined to go to war. They submitted an ultimatum - either to make Western Morocco their protectorate, or to begin intervening. Damn it!\n"Take it and roll.""
adijiaerweiji_fg_event_ttt:0 "France ceded Agadir to Germany to avoid the outbreak of a large-scale war. After Germany's entry into Morocco, it will inevitably affect the balance of the world situation.\nNot going to war anymore... at least this year."
adijiaerweijijiejue_event.1:0 "The Agadir crisis has been resolved"
adijiaerweijijiejue_event.1.t:0 "The Agadir crisis has been resolved"
adijiaerweijijiejue_event.1.d:0 "The crisis has come to an end. This time, the great powers did not tear their skin, although the negotiation situation was still very tense, and German diplomats were still talking about the territory they received being unsuitable for colonization and so on."
adijiaerweijijiejue_event.1.f:0 "This time, a colonial war was avoided, but it only meant that the inevitable war was postponed to the near future."
adijiaerweijijiejue_event.1.a:0 "Interesting progress"

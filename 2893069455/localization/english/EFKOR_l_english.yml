l_english:
    EFKOR_adopt_taeguki_dec:0 "Adopt the Taegukgi Flag"
    EFKOR_adopt_taegukgi_tt:0 "The Joseon Dynasty standard is replaced with the Taegukgi."
    EFKOR_adopt_taeguki_dec_desc:0 "Nations around us have adopted banners of various designs to represent themselves and their people. It is time Joseon does the same.\n\nSome of our statesmen have already proposed a design with a red-blue Taeguk surrounded by four black trigrams, and it is ready to be adopted upon receiving royal approval."
    
    EFKOR_adopt_joseon_standard:0 "Reinstate the Joseon Dynasty Standard"
    EFKOR_adopt_joseon_standard_tt:0 "The Taegukgi is replaced with the Joseon Dynasty standard."
    EFKOR_adopt_joseon_standard_desc:0 "We tried adopting a new flag for our nation, but some find it unsuitable. We can reinstate the old Joseon Dynasty standard and restore some of our traditional symbols.\n\nConservative voices in our society and government are proposing the banner of the monarch be restored. If they are so inclined, we may do so at any time."

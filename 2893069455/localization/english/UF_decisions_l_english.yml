 bomb_majlis_decision:0 "Bomb the Majlis"
 bomb_majlis_decision_desc:0 "The Shah has been working to get rid of the Majlis. All he has to do is wait for them to bicker amongst each other and strike when they are divided. His Cossack Brigade are preparing to blow of the Majlis."
 bomb_majlis_decision_tooltip:0 "Bomb the Majlis"
 
 hire_shuster_decision:0 "Hire Shuster"
 hire_shuster_decision_desc:0 "We need someone to help us out of the financial mess that the Shah has put us in. A talented American by the name of Morgan Shuster is willing to help out."
 hire_shuster_decision_tooltip:0 "Hire Shuster"
 
 nationalise_oil_decision:0 "Nationalise Oil"
 nationalise_oil_decision_desc:0 "Our long years of negotiations with foreign countries... have yielded no results thus far. With the oil revenues, we could meet our entire budget and combat poverty, disease, and backwardness among our people. Another important consideration is that by the elimination of the power of the British company, we would also eliminate corruption and intrigue, by means of which the internal affairs of our country have been influenced. Once this tutelage has ceased, Iran will have achieved its economic and political independence. The Iranian state prefers to take over the production of petroleum itself. The company should do nothing else but return its property to the rightful owners. The nationalization law provides that 25% of the net profits on oil be set aside to meet all the legitimate claims of the company for compensation. It has been asserted abroad that Iran intends to expel the foreign oil experts from the country and then shut down oil installations. Not only is this allegation absurd; it is utter invention. - Mohammed Mossadeq"
 nationalise_oil_decision_tooltip:0 "Nationalise Oil"
 
 emergency_powers_decision:0 "Emergency Powers"
 emergency_powers_decision_desc:0 "Mossadeq is requesting temporary dictatorial powers from the Majlis for 6 months to pass his reforms. With the British devastating our economy we need these reforms to alleviate the people's suffering. This should also help overcome all the meddling they are performing in the upcoming elections."
 emergency_powers_decision_tooltip:0 "Emergency Powers"
 
 more_emergency_powers_decision:0 "More Emergency Powers"
 more_emergency_powers_decision_desc:0 "Six months hasn't been enough time. Mossadeq is requesting 12 more months of emergency powers."
 more_emergency_powers_decision_tooltip:0 "More Emergency Powers"

 
 

 cossack_brigade_decision:0 "Form the Cossack Brigade"
 cossack_brigade_decision_desc:0 "Russia wants to help us form our very own Cossack Brigade lending us Russian officers to run it. They could help police our people when they get too rowdy and be formidable in times of war."

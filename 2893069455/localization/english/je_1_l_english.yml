l_english:
  1867.1:0 "Selling Alaska"
  1867.1_reason:0 "Why do we need a useless piece of land in North America when our budget is hurting? Sell it to our partners in the USA."
  1867.1_desc:0 "Why do we need a useless piece of land in North America when our budget is hurting? Sell it to our partners in the USA."
  1867.2:0 "Final solution of the Hungarian question"
  1867.2_reason:0 "Nationalist riots continue throughout the Austrian Empire. There is only one way to appease the Hungarians..."
  1867.2_desc:0 "Nationalist riots continue throughout the Austrian Empire. There is only one way to appease the Hungarians..."
  1858:0 "Aigun Treaty"
  1858_reason:0 "The Great Qing has been noticeably weakened since the Opium Wars. It's worth taking advantage of this by forcing an unequal treaty on the Qing"
  1858_desc:0 "The Great Qing has been noticeably weakened since the Opium Wars. Take advantage of this by forcing an unequal treaty on the Qing"
  rio:0 "Suppression of the Rebellion"
  rio_reason:0 "Our first attempt at quelling the rebellion was unsuccessful. Something must be done as soon as possible."
  rio_desc:0 "Our first attempt at quelling the rebellion failed. Something must be done as soon as possible."
  intervention_mex:0 "Mexican Intervention"
  intervantion_mex_reason:0 "Mexico has a regime that is not loyal to us, it's worth intervening and regaining legitimate power."
  intervantion_mex_desc:0 "A regime disloyal to us has been established in Mexico, it is worth starting an intervention and returning legitimate power."
  oregon:0 "Request for the Transfer of Montana and Wyoming"
  oregon_reason:0 "British Canada must hand over the lands ceded to us under the Oregon Treaty."
  oregon_desc:0 "British Canada must hand over the lands ceded to us under the Treaty of Oregon."
  1861:0 "Abolition of serfdom"
  1861_desc:0 "For further industrialization and reduction of radicalism among peasants and liberal intelligentsia, serfdom must be abolished."
  1861_reason:0 "For further industrialization and reduction of radicalism among peasants and liberal intelligentsia, it is necessary to abolish serfdom."
  when_taken:0 "Tech solution"
  when_taken_reason:0 "Technical decision"
  when_taken_desc:0 "Technical decision"
  ai_chance:0 "Technical solution"
  ai_chance_desc:0 "Technical solution"
  }:0 "Technical solution"
  }_desc:0 "Technical solution"
  {_desc:0 "Technical solution"
  {:0 "Technical solution"
  chl_bol_3:0 "New Conflict by the Ocean"
  chl_bol_3_reason:0 "A valuable saltpeter deposit has been discovered off the coast of Bolivia, which the UK needs so badly..."
  chl_bol_3_desc:0 "A valuable saltpeter deposit has been discovered on the coast of Bolivia, which is so necessary for Great Britain..."
  chl_bol_1:0 "Second Pacific War"
  chl_bol_1_reason:0 "The British want us to take decisive action! War must be declared before we lose support."
  chl_bol_1_desc:0 "The British want us to take decisive action! War must be declared before we lose support."
  chl_bol_2:0 "Treaty of Ancona"
  chl_bol_2_reason:0 "We have won! Nevertheless, a peace must be signed immediately before the situation on the continent deteriorates."
  chl_bol_2_desc:0 "We have won! Nevertheless, a peace must be signed immediately before the situation on the continent deteriorates."
  gbr_egy:0 "Egyptian Protectorate"
  gbr_egy_reason:0 "Egypt, although formally part of the Ottoman Empire, is actually independent, but also quite weak. It clearly needs a strong patron..."
  gbr_egy_desc:0 "Egypt, although formally part of the Ottoman Empire, is actually independent, but also quite weak. It clearly needs a strong patron..."
  1870:0 "September Revolution"
  1870_reason:0 "After the defeat of our once great army in the war, Napoleon's authority fell critically. There is only one option to save great France..."
  1870_desc:0 "After the defeat of our once great army in the war, Napoleon's authority fell critically. There is only one option to save great France..."
  1848:0 "February Revolution"
  1848_reason:0 "Enough of the French people to endure the oppression of the Dynasty of Orleans! Let's break the despotic government that betrayed the ideals of the Great French Revolution!"
  1848_desc:0 "Enough of the French people to endure the oppression of the Dynasty of Orleans! Let's break the despotic government that betrayed the ideals of the Great French Revolution!"
  1852:0 "Second French Empire"
  1852_reason:0 "After winning the presidential election, Napoleon will proclaim himself Emperor of the Second French Empire."
  1852_desc:0 "After winning the presidential election, Napoleon will proclaim himself Emperor of the Second French Empire."
  ankara:0 "Occupation of Ankara and other regions"
  ankara_reason:0 "After the pacification of Egypt, the once hostile troops are still in the Ankara region. We demand to withdraw them and liberate the region."
  ankara_desc:0 "After the pacification of Egypt, the once hostile troops are still in the Ankara region. We demand that they be withdrawn and the region liberated."
  1877_reason:0 "Let's return the Balkan lands to our Orthodox compatriots!"
  1877:0 "San Stefano Peace"
  1877_desc:0 "Let's return the Balkan lands to our Orthodox compatriots!"
  japan-china.1:0 "Formosa Control"
  japan-china.1_reason:0 "We must declare war on the Qing and take Formosa!"
  japan-china.1_desc:0 "We must declare war on the Qing and take Formosa!"
  japan-china.2:0 "Treaty of Shimonoseki"
  japan-china.2_reason:0 "With the Qing defeated, we can sign peace on our own terms."
  japan-china.2_desc:0 "With the Qing defeated, we can sign peace on our own terms."
  korea.1_reason:0 "It's time to assert our rightful right and make Korea a full-fledged colony."
  korea.1:0 "Annex the Korean Empire"
  korea.1_desc:0 "It's time to assert our rightful right and make Korea a full-fledged colony."
  korea.2:0 "Offer a protectorate to Korea"
  korea.2_reason:0 "Time to offer our protectorate to the weakening Korea..."
  korea.2_desc:0 "Time to offer a weakening Korea our protectorate..."
  korea:0 "Restoration"
  korea_reason:0 "Time to rebuild and establish the Korean Empire."
  korea_desc:0 "It's time to rebuild and proclaim the Korean Empire."
  historical_balkan_war_1911:0 "Balkan Union"
  historical_balkan_war_1911_reason: "For the final liberation of the Balkans from the oppression of the Ottoman Empire, we need to unite with other Orthodox Balkan countries."
  historical_balkan_war_1912:0 "First Balkan War"
  historical_balkan_war_1912_reason:0 "The alliance between the Balkan states is concluded, and the Ottoman Empire was defeated by Italy. There will be no better moment!"
  historical_balkan_war_1913.a:0 "New Union"
  historical_balkan_war_1913.a_reason:0 "After our joint victory, Bulgaria has claims against us. We must force the insatiable Bulgarians to give them up."
  historical_balkan_war_1913.b:0 "Second Balkan War"
  historical_balkan_war_1913.b_reason:0 "The time has come to finally pacify Bulgaria!"
  historical_balkan_war_1913:0 "Bucharest peace treaty"
  historical_balkan_war_1913_reason:0 "After the defeat of Bulgaria, in order to avoid a new conflict, a final peace treaty must be signed"
  bue:0 "Look Deep"
  bue_reason:0 "As a result of the unrest, the province of Buenos Aires has effectively gained independence. We need to put down the rebellion before it's too late. We also need to extend our influence to the south by subjugating the rebellious tribes."
  akri:0 "Republic of Acre"
  akri_reason:0 "The breakaway republic of Acre from Bolivia is asking to be part of Brazil. We must protect it before full-fledged conflict begins."
  1911.i:0 "Italo-Turkish War"
  1911.i_reason:0 "The Ottoman Empire is getting weaker and weaker, and our newly formed power does not yet have colonies. There is a great chance to acquire them by retaking Tripolitania from the Ottomans."
  1911.ip:0 "Occupation of Tripolitania"
  1911.ip_reason:0 "After winning the war, we need to formalize our ownership of Libya"
  1911.c:0 "Xinhai Revolution"
  1911.c_reason:0 "The Qing Dynasty is leading our once great country to ruin. Stop tolerating foreign invaders who have lost their Heavenly Mandate, let's overthrow the hated Qing!"
  re1:0 "Revisiting Relationships"
  re1_reason:0 "To strengthen our position in the face of potential conflict, we need to rethink our relationship with our old enemies Germany and Italy."
  re2:0 "Tripartite agreements"
  re2_reason:0 "Our relations with Russia and the UK are getting better and better. It's worth making tripartite agreements with them."
  union1:0 "Triple Alliance"
  union1_reason:0 "The time has come to sign a full-fledged military-political alliance with our new friends."
  union2: "Entente"
  union2_reason:0 "The situation on the European continent is becoming more and more tense. For mutual protection, we need to unite the efforts of our friendly countries, creating a military-political alliance."
  colony:0 "Colonial Race"
  colony_reason:0 "Many European powers continue to colonize everything that can be colonized. And we must keep up!"
  je_historial_transfer_moravia:0 "Transfer of South German lands"
  je_historial_transfer_moravia_reason:0 "If we want to end the feud with Austria, we need to hand over the disputed South German lands to her."
 world_war_HJE_1:0 "World Crisis"
 world_war_HJE_1_reason:0 "In recent years, almost the entire world has fallen into colonial dependence on the European powers, causing conflict between them."
 world_war_HJE_2:0 "The Great War"
 world_war_HJE_2_reason:0 "The contradictions of the Great Powers have reached a critical point! Soon the Great War will begin, which will end all wars."
 world_war_HJE_3:0 "July Crisis"
 world_war_HJE_3_reason:0 "Recently a Serbian nationalist treacherously murdered the heir to the Austrian throne! We must show Serbia what it will cost her!"
 world_war_HJE_3a:0 "July Crisis"
 world_war_HJE_3a_reason:0 "Recently a Serbian nationalist treacherously murdered the heir to the Austrian throne! We must show Serbia what it will cost her!"
 world_war_HJE_4:0 "The Treaty of Versailles"
 world_war_HJE_4_reason:0 "Germany lies in ruins - Germany has lost the war. At last we can sign a peace treaty establishing a new order of affairs in Europe."
 world_war_HJE_5:0 "Postwar arrangement."
 world_war_HJE_5_reason:0 "After the Great War ended, nationalist tendencies began throughout postwar Europe. Austria-Hungary disintegrated, and the "WUPR", supposedly an independent Ukrainian state, was separated from its composition. Separatism is raging in Ireland, and a new conflict is brewing in the Balkans.
 world_war_HJE_6:0 "Treaty of Sèvres."
 world_war_HJE_6_reason:0 "After losing the war, the Ottoman Empire is cracking at the seams. This is a good opportunity to impose her unfavorable peace treaty."
 world_war_HJE_7:0 "The Treaty of Lausanne."
 world_war_HJE_7_reason:0 "The newly formed Republic of Turkey was able to win the war of independence against the Allied countries, regaining some of its territories."
 rcw_1:0 "February Revolution."
 rcw_1_reason:0 "A revolution rages in the war-weary Russian Empire! The Provisional Government together with the RSDLP overthrows the Tsar, establishing a republic. A dual government is established in the country."
 rcw_2:0 "October Revolution."
 rcw_2_reason:0 "The country's new government intends to continue the war. The people are tired of endless fighting, the country is ruined, a new Bolshevik revolution is rising! They conclude the separate Brest Peace Treaty with Germany, the civil war begins."
 rcw_3:0 "Civil War."
 rcw_3_reason:0 "A civil war breaks out in the former Russian Empire. The Soviets tacitly terminate the peace treaty with the now Weimar Republic and establish power in the territories of Ukraine, Belarus, and the Baltics."
 rcw_4:0 "The Fall of Soviet Power in the Baltics"
 rcw_4_reason:0 "Soviet power in the Baltics has collapsed, there are now 3 independent republics there."
 rcw_5:0 "The Treaty of Riga"
 rcw_5_reason:0 "After the Soviet-Polish war, the young Polish Republic receives the lands of western Ukraine and Belarus."
 rcw_6:0 "End of the Civil War in Russia"
 rcw_6_reason:0 "The Russian Civil War ended with the establishment of Soviet power over most of the territory of the former Russian Empire, the loss of the western regions of the country, and the formation of the Union of Soviet Socialist Republics."


 FAR:0 "Far Eastern Republic"
 FAR_ADJ:0 "Far Eastern Republic"
 crimea:0 "Crimean War"
 crimea_reason:0 "Now that we are Europe's hegemon, we must resolve the Eastern question in our favor before our competitors do so before we do."
 elsas:0 "Return of Alsace-Lorraine"
 elsas_reason:0 "We were finally able to recover the original German Alsace-Lorraine and complete the process of German unification. Now that we have become a new claimant to hegemony, our relations with other European powers have deteriorated, and France is looking for new allies."
 balkans:0 "The Russo-Turkish War"
 balkans_reason:0 "The Ottoman Empire is feeling quite bad, with all its allies turning away from it. We are presented with a good chance to snatch a piece of the finally dead man of Europe."
 italia_reason:0 "Italo-Austrian War"
 italia_reason:0 "The Austrian rebellion continues. This is a good chance to attack and return the lands on the Apennine Peninsula to the Italian states."
 japan1905:0 "Russo-Japanese War"
 japan1905_reason:0 "Russia is treacherously encroaching on our lands! Our entire nation must unite and fight back against European expansionism!
 1877_2:0 "The Eastern Question"
 1877_2_reason:0 "After the defeat of the Ottoman Empire, we have an opportunity to occupy Bosnia. Why not take advantage of it?"
 1848-49_reason:0 "Revolutionary Unrest"
 1848-49_reason:0 "There is unrest in the Kingdom of both Sicilies. Strangely enough, they are spreading extremely fast. Who knows what this will do to the country, and possibly to all of Europe?"
 texas:0 "Admission of Texas to the USA"
 texas_reason:0 "The young Republic of Texas recently gained independence from Mexico. It's worth accepting them into our membership."
 rye:0 "Annexation of the Ryukyu"
 rye_reason:0 "The Kingdom of Ryukyu is a "colossus on clay feet", ready to fall at any moment. To secure the Qing coast, the Ryukyu Islands must be seized and incorporated into the Japanese Empire!"
 1862_reason:0 "The Unification of Italy"
 1862_reason:0 "The time has come to unite the disparate people of Italy into one national state!"
 hr_1:0 "The Hungarian Revolution"
 hr_1_reason:0 "The wave of revolutions sweeping through Europe did not bypass the Austrian Empire either - the Hungarian people revolted against Austrian rule."
 hr_2:0 "Suppression of the Hungarian Rebellion"
 hr_2_reason:0 "The uprising turned into an armed conflict, after which, with the intervention of Russian troops, it was suppressed. What does this mean for the Austrian Empire?"
 car:0 "Victory over the Carlists."
 car_reason:0 "In 1839 rebel resistance was finally suppressed by government troops."
 car_2:0 "Second Carlist War"
 car_2_reason:0 "In 1872 the Second Carlist War, known in Western historiography as the Third Carlist War, began."
 car_3:0 "Cabrera Rebellion"
 car_3_reason:0 "In 1846, Spanish general Ramon Cabrera begins an insurrection to enthrone Charles VI. Who knows how the succession of dynastic conflicts will end for Spain?"
 1871_u:0 "The Unification of Germany."
 1871_u_reason:0 "Now that the original German lands have been returned to their native harbor, we can officially proclaim the German Empire!"
 bul1885:0 "Accession of Eastern Rumelia to the Principality of Bulgaria"
 bul1885_reason:0 "The Ottoman Empire is rapidly weakening, and Bulgarian separatists in Eastern Rumelia continue to revolt. What does this mean for the Balkans?"
 bul1908:0 "Bulgarian Independence."
 bul1908_reason:0 "We now control Bulgarian foreign policy only formally, which cannot but serve as a signal to the Bulgarian principality..."
 plom1:0 "Plombières Agreement"
 plom1_reason:0 "We can make an alliance with Napoleon to reclaim the Italian lands from Austria."
 plom2:0 "Treaty of Turin"
 plom2_reason:0 "We will cede Savoy and Nice to France, as agreed."
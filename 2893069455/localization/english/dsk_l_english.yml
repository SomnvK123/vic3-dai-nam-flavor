humen:0 "destruction of opium at humen"
humen_reason:0 "Due to the sharp increase in opium imports, the trade status of China and Britain has completely changed. The UK has changed from entering the Super League to leaving the Super League, while China has done the opposite, resulting in a significant outflow of silver. According to statistics, between 1820 and 1836, China's outflow of silver was about 100 million taels. The continuous outflow of silver caused by the massive import of opium has begun to disrupt the circulation of the Qing Dynasty's treasury and currency, putting the Qing Dynasty's economy on the brink of collapse. What is even more serious is that the proliferation of opium has greatly devastated the physical and mental health of smokers. If it continues to develop, it will inevitably put the Chinese nation at risk of extinction. "
sino_event.9.t:0 "According to our diplomatic ambassador's letter in China!"
sino_event.9.d:0 "Humen destructed opium Extinction Event of the Qing Empire"
sino_event.9.f:0 "Iron headed mouse, cunning opium smuggling leader, afraid of the anger of the Heavenly Dynasty, has returned to the land of smoke - Lin Zexu"
sino_event.9.a:0 "Great Britain will not give up on this"

qianjin:0 "Forward, Germany"
sanminzhuyi_modifier:0 "Three Principles of the People"

diguozhuyi:0 "Imperialist thoughts spread within the military"
diguozhuyi_desc:0 "As a vast and populous country, [SCOPE.GetRootScope.GetCountry.GetName] may follow in the footsteps of Western powers to conquer more land."
chinese_culture:0 "Chinese Nation"
meiyourenbeiqishi:0 "No one is discriminated against on the Chinese land."
law_renda:0 "National People's Congress"
law_renda_desc:0 "The National People's Congress is the highest state organ of power in [SCOPE.GetRootScope.GetCountry.GetName]. Its permanent body is the Standing Committee of the National People's Congress. The National People's Congress and its Standing Committee exercise the state legislative power. The National People's Congress is composed of deputies elected from provinces, autonomous regions, directly-administered municipalities, special administrative regions, and the military."
law_yidaiyilu:0 "Belt and Road Initiative"
law_yidaiyilu_desc:0 "The Belt and Road Initiative relies on [SCOPE.GetRootScope.GetCountry.GetName]'s existing bilateral and multilateral mechanisms with relevant countries, gradually introducing measures such as infrastructure, transportation interconnection, and facilitation of trade and investment. It relies on the millennium tradition of economic, cultural, and trade exchanges along the 'Silk Road' and gives it new cooperative significance."
law_proletariat_army:0 "People's Army"
law_proletariat_army_desc:0 "A military force formed spontaneously by the masses or under the leadership of an advanced class and fighting for the interests of the masses. The people's army led by the proletariat and guided by Marxist theory is a new type of people's army."
white_sun_flag:0 "In accordance with the laws of the National Revolutionary Army, we will be able to use the Blue Sky, White Sun, and a Full Red Ground flag along with the flag of the National Revolutionary Army."
law_gemingjun_army:0 "National Revolutionary Army"
law_gemingjun_army_desc:0 "Magnificent mountains and rivers, abundant resources, descendants of the Yan and Huang Emperors, and dominating East Asia. Do not abandon oneself to despair, do not stay stagnant, shine upon our nation, promote unity. The establishment is arduous, remembering the predecessors, maintaining achievements is not easy, do not merely pursue immediate success. With a common heart and virtue, persevere throughout, blue sky, white sun, full red ground."
law_people_police:0 "People's Police"
law_people_police_desc:0 "People's Police force is a special force, the 'blue warriors' who guard one side's stability and maintain tranquility. Over the years, the People's Police have made indelible contributions to the people, punishing evildoers, fighting crime, and guarding tranquility for the stability of society."
event_red_army.1.d:0 "I don't care about this."
ideology_vanguardist:0 "Stalinist"
ideology_vanguardist_desc:0 "The leader believes that as long as a one-party state with proletarian dictatorship controls the means of production, socialist relations of production are achieved."
ideology_trotskyist:0 "Trotskyist"
ideology_trotskyist_desc:0 "The leader believes in achieving industrialization rapidly through planned economy, agricultural collectivization, and advocates preventing the growth of bureaucracy through a multi-party system."
ideology_bukharinist:0 "Bukharinist"
ideology_bukharinist_desc:0 "The leader believes that under one-party rule, socialism can be progressively achieved through market methods."
ideology_titoist:0 "Titoist"
ideology_titoist_desc:0 "The leader advocates autonomous governments and aims to improve people's living standards through market socialism."
ideology_maoist:0 "Marxism-Leninism-Maoism"
ideology_maoist_desc:0 "The leader follows the path of Marx, Lenin, and Mao Zedong and continues the theory of continuous revolution. They believe that even after achieving proletarian dictatorship in a socialist country, it is necessary to mobilize the masses for thorough revolutionary transformation in terms of mode of production, relations of production, economic base, superstructure, and ideology."
ideology_ultraleftist:0 "Ultra-Leftist"
ideology_ultraleftist_desc:0 "The leader is a political opportunist who, under the guise of extreme leftism, propagates bloodline theories and suppresses dissent."
ideology_capitalist_roader:0 "Capitalist Roader"
ideology_in_communism:0 "Living in a Communist Society"
ideology_in_communism_desc:0 "This interest group lives in a communist society and enjoys the benefits of this highly advanced and progressive social system."


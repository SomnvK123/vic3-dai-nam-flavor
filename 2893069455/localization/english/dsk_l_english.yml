economic_revolution.5.d:0 "We have basically achieved a moderately prosperous society!"
economic_revolution.5.f:0 "After a difficult battle against poverty, [SCOPE.GetRootScope.GetCountry.GetName]'s poverty alleviation has written a miracle in the history of global poverty reduction and has become a model for countries around the world to achieve common prosperity."
economic_revolution.5.a:0 "A phase victory of common prosperity!"
lzy_buff_fbar_moderately_prosperous_Modifier:0 "Comprehensively Build a Moderately Prosperous Society"
je_socialism_mode_production:0 "Socialist Mode of Production"
je_socialism_mode_production_reason:0 "Marx explicitly pointed out in 'Capital' that there is a certain mode of production and corresponding production relations. The mode of production determines the entire production relations, exchange relations, and distribution relations. How to surpass the capitalist mode of production, achieve the socialist mode of production, and realize the collective free disposal of the means of production by laborers are major issues that need to be explored in theory and practice. Completing this log can provide a super-strong buff."
custom_loc_je_fbar_moderately_prosperous_end:0 "Complete the 'Comprehensively Build a Moderately Prosperous Society' log entry"
economic_revolution.8.t:0 "Establishment of the Socialist Mode of Production"
economic_revolution.8.d:0 "After arduous theoretical and practical exploration, the new socialist mode of production, which can eliminate capitalism, has finally been established!"
economic_revolution.8.f:0 "The difference between the socialist mode of production and the capitalist mode of production lies in the fact that the former is centered on capital owners, controlling the means of production and labor, controlling the entire production process and the distribution of products; while the latter is the laborers organizing the free disposal of the means of production without any capital conditions. Based on the socialist mode of production, new forms of socialist production relations and industrial organization can be firmly established. We have undergone continuous economic revolutions, and here we have finally achieved a stable new mode defined as a new stage of society."
economic_revolution.8.a:0 "This is the core of the social revolution!"
lzy_buff_socialism_mode_of_production:0 "Socialist Mode of Production"


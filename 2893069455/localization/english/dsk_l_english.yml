dsk_france.24.t:0 "Declaration of the Second Republic"
dsk_france.24.d:0 "As crowds flooded the streets of Paris and erected barricades, dissatisfaction with the political situation reached its peak. A French guard opened fire on civilians with his rifle, causing a massacre, and many believed it was an accident. The riot spread like wildfire throughout the city, with crowds shouting 'Long live reform!' and 'Down with the king!'. Despite the situation being brought under control, the king fled France... Now the government faces the task of establishing a new regime, starting with organizing elections for a new head of state."
dsk_france.24.f:0 "'Citizens, I will never adopt the red flag, and I must tell you, I will oppose it with all my patriotic sincerity. Because the tricolor flag has sailed across the seas with the Empire, and it has traveled the world with the Republic, carrying your freedom, your glory. And what of the red flag? It only paraded through the Champ de Mars, dragging the blood of the people behind it.' — Alphonse de Lamartine"
dsk_france.24.a:0 "Long live the Republic!"
je_fra_republic_2:0 "[concept_fra_republic_2]"
concept_fra_republic_2:0 "Second French Republic"
concept_fra_republic_2_desc:0 "The Second French Republic was a brief period in French history, existing from February 1848 to December 1852. This period marked a significant transformation in French political life and was an important part of the European revolutions of 1848."
je_fra_republic_2_reason:0 "In the February Revolution of 1848, the French people overthrew the rule of [concept_monarchie_de_Juillet] and established the [concept_fra_republic_2]. This revolution was driven by various social grievances, including economic hardship, political corruption, and a desire for freedom, equality, and democratic rights. After the February Revolution, French society experienced intense political upheaval and ideological conflict, with various political forces engaging in fierce struggles in parliament.\nDuring the [concept_fra_republic_2] period, the French government attempted to consolidate the new republican regime by enacting a series of constitutions and laws. However, due to political divisions and conservative opposition, these efforts were not entirely successful. Additionally, France faced external threats, such as border conflicts with neighboring countries and unstable international political conditions.\nEconomically, the [concept_fra_republic_2] period saw accelerated industrialization. With the application of new technologies such as steam engines and railways, France's productivity increased significantly. However, this economic development was accompanied by heightened social tensions, with sharp conflicts between the working class and the bourgeoisie.\nPolitically, the [concept_fra_republic_2] regime experienced frequent changes, with the government falling multiple times due to political crises. Ultimately, in December 1851, Napoleon III came to power through a coup, establishing the [concept_fra_empire] and ending the history of the [concept_fra_republic_2].\n\n#yellow [concept_fra_republic_2]#! Will accumulate #N parliamentary points#! based on #v #tooltippable;tooltip:[Country.GetTooltipTag], je_french_republic_house_pos current domestic conditions#!#! Accumulate [concept_fra_republic_2] #N parliamentary points#! and spend #N parliamentary points#! to enact a policy."
je_fra_republic_2_tt:0 "#blue Liberty, Equality, Fraternity#!"
je_french_republic_house_pos:0 "The following conditions will accumulate #bold #N parliamentary points#! per month:\n• Implement any #yellow electoral form#! (#green +2#!).\n• #yellow Internal Affairs Agency level >= 4#! (#green +2#!).\n• #yellow Health Agency level >= 4#! (#green +2#!).\n• #yellow Welfare Agency level >= 4#! (#green +2#!).\n• #yellow Labor Agency level >= 4#! (#green +2#!).\n• #yellow Police Agency level >= 4#! (#green +2#!).\n• #yellow School Agency level >= 4#! (#green +2#!)."
dsk_fra_republic_time:0 "Republican Era"

enough_french_republic_house_var:0 "Requires spending 50 #N parliamentary points#!"
enough_french_republic_house_1_var:0 "Requires spending 100 #N parliamentary points#!"
support_Industrial_Revolution_button:0 "Support Industrialization"
support_Industrial_Revolution_button_desc:0 "We are the leading nation of the Industrial Revolution. Encourage industrial enterprises to upgrade and adjust their structures, develop high-tech, high value-added industries. By guiding enterprises to increase R&D investment and introduce advanced technologies, we aim to optimize and upgrade France's industrial structure."
support_laws_button:0 "Strengthen Legislation"
support_laws_button_desc:0 "Enact and implement a series of laws and regulations to provide legal protection for industrial development. For example, protect the property and operational rights of industrial enterprises, combat unfair competition, and create a fair and orderly market environment for industrial enterprises."
FIC:0 "French Indochina"
FIC_ADJ:0 "French Indochina"
support_laws_modifier:0 "Strengthened Legislation"
modifier_support_Industrial_Revolution:0 "Support Industrialization"
annex_yuenan_button:0 "Intervene in Vietnam"
annex_yuenan_button_desc:0 "Since the 17th century, France began its colonial expansion. In Asia, France actively sought new colonies to expand its overseas influence. The Indochina region, with its important geographical location and rich resources, became a key target for French colonial expansion."
fra_colony:0 "French Federation"
annex_indochina:0 "French Indochina"
annex_indochina_reason:0 "The Indochina Peninsula is located in Southeast Asia, connecting [SCOPE.sCountry('chi_scope').GetName], other Southeast Asian countries, and South Asia's India. Its strategic value is extremely high. [SCOPE.GetRootScope.GetCountry.GetName] aims to strengthen its influence over Southeast Asia and the Far East by controlling this region.\nWith the advancement of the Industrial Revolution, we need a broader market to absorb its industrial products. The Indochina region, with its large population and huge consumption potential, is a key target for market expansion."
dsk_france.25.t:0 "Status of French Indochina"
dsk_france.25.d:0 "Between 1883 and 1885, France expanded its influence in Indochina through the Sino-French War with China. Eventually, China was defeated and signed the Treaty of Tientsin, officially renouncing its suzerainty over Vietnam, leading to French occupation of Vietnam. This event marked the establishment of French colonial rule in Indochina."
dsk_france.25.f:0 "After occupying Vietnam, France also incorporated Laos and Cambodia into its colonial domain through a series of wars and diplomatic measures, eventually forming the French Indochina Federation. France implemented harsh colonial rule in the region, subjecting the local population to severe exploitation and oppression."
dsk_france.25.a:0 "I want to appoint a governor to administer French Indochina for us."
dsk_france.25.b:0 "Let them remain second-class subjects of the colony."
modifier_Eiffel_Tower:0 "Majestic Eiffel Tower"
support_Eiffel_Tower_button:0 "Open the Eiffel Tower"
support_Eiffel_Tower_button_desc:0 "In 1889, to celebrate the 100th anniversary of the French Revolution, Paris hosted a large international exposition. For this event, the French government decided to build the tallest iron tower in the world as a landmark for the exposition."

support_people_life_button:0 "Encourage Investment"
support_people_life_button_desc:0 "Formulate policies to support small and medium-sized enterprises, including providing loans, tax incentives, and other measures. Help SMEs address funding and technical issues, promote their growth, and inject new vitality into industrial development."

support_russia_unite_button:0 "Franco-Russian Alliance"
support_russia_unite_button_desc:0 "With the intensification of conflicts among European powers, both France and Russia face threats from other nations."

je_fra_republic_3:0 "[concept_fra_republic_3]"
concept_fra_republic_3:0 "Third French Republic"
concept_fra_republic_3_desc:0 "The Third French Republic (1870–1940) was established after the defeat in the Franco-Prussian War and was extinguished following the Nazi German invasion."
je_fra_republic_3_reason:0 "In 1870, [concept_fra_empire] went to war with Prussia, resulting in France's defeat, which led to the fall of the Second Empire and the establishment of the [concept_fra_republic_3].\nThe [concept_fra_republic_3] adopted a parliamentary democracy model, and its political system is considered a compromise between republicanism and monarchism. The balance between the President, Parliament, and Cabinet is reflected in the system, with the President serving as the head of state and the highest commander of the military, having the authority to appoint the Cabinet with the consent of the House of Deputies, and the power to dissolve the House of Deputies with the consent of the Senate. The Cabinet is accountable to the Senate.\n\n#yellow [concept_fra_republic_3]#! Will accumulate #N parliamentary points#! based on #v #tooltippable;tooltip:[Country.GetTooltipTag],je_french_republic_house_pos Current domestic situation#!#! Accumulate [concept_fra_republic_3] #N parliamentary points#! and spend #N parliamentary points#! to enact a policy."
je_fra_republic_3_tt:0 "#blue Born in adversity, perishes in ease#"

concept_fra_republic_3:0 "Third French Republic"
je_fra_community:0 "[concept_fra_community]"
concept_fra_community:0 "Paris Commune"
concept_fra_community_desc:0 "Karl Marx considered the Paris Commune of 1871 to be a prototype of future revolutionary uprisings, ultimately discovered as a form for the liberation of the proletariat. In reality, the Commune, emerging from Parisian dissatisfaction with the defeatist French government and months of Prussian siege, resembled a utopian and fervent socialist experiment with brief and anecdotal followers across French provinces before being brutally suppressed by French forces."
je_fra_community_tt:0 "#red Workers of the world, unite!#"
je_fra_community_reason:0 "[concept_fra_community] was a great attempt by the proletariat to overthrow bourgeois rule and establish a dictatorship of the proletariat. It is a brilliant milestone in the history of proletarian revolution. Its practice enriched Marxist theories on proletarian revolution and dictatorship, marking a glorious and tragic page in the international communist movement. It provided valuable experience and lessons for the international socialist movement. It delivered the first heavy blow to capitalism, ushering in a new period of proletarian struggle against the bourgeoisie. The bravery and unwavering spirit of the Commune's fighters in battling a powerful enemy will be remembered forever. #red \nArise, you workers from the plight, arise, all you suffering people of the world!\nThe blood we’ve spilled is boiling; let’s fight for truth!\nThe old world must be destroyed, so rise, slaves of the world!\nDon’t say we have nothing, we’ll be the masters of the world!#!\n\n#yellow [concept_fra_community]#! Will accumulate #N commune points#! based on #v #tooltippable;tooltip:[Country.GetTooltipTag], je_french_community_house_pos current domestic conditions#!#! Accumulate [concept_fra_community] #N commune points#! and spend #N commune points#! to enact a policy."
je_french_community_house_pos:0 "The following conditions will accumulate #bold #N commune points#! per month:\n• Implement any #yellow electoral form#! (#green +2#!).\n• #yellow Internal Affairs Agency level >= 4#! (#green +2#!).\n• #yellow Health Agency level >= 4#! (#green +2#!).\n• #yellow Welfare Agency level >= 4#! (#green +2#!).\n• #yellow Labor Agency level >= 4#! (#green +2#!).\n• #yellow Police Agency level >= 4#! (#green +2#!).\n• #yellow School Agency level >= 4#! (#green +2#!)."
dsk_fra_community_time:0 "The Internationale"

community_support_army_button:0 "Train Volunteers"
community_support_army_button_desc:0 "This is the army of the [concept_fra_community], belonging to the internationalist army of the proletariat."
modifier_french_community_army:0 "Volunteer Army"

community_support_people_life:0 "Commune Investment Fund"
community_support_people_life_button:0 "Commune Investment Fund"
community_support_people_life_button_desc:0 "[concept_fra_community] formulates policies to support small and medium-sized enterprises, including providing loans, tax incentives, and other measures. Help SMEs address funding and technical issues, promote their growth, and inject new vitality into industrial development."
support_people_life:0 "Investment Fund"
enough_french_community_house_var:0 "#red Commune points > 50#!"

dsk_france.26.t:0 "[concept_fra_community]"
dsk_france.26.d:0 "The cause I am engaged in is the most noble cause in human history. Today I may fall, but tomorrow thousands and thousands of me will rise up!"
dsk_france.26.f:0 "This is the final struggle, unite and fight until tomorrow,\nThe Internationale shall be the human race’s salvation.\nThis is the final struggle, unite and fight until tomorrow,\nThe Internationale shall be the human race’s salvation."
dsk_france.26.a:0 "Immediately return power to the people."
dsk_france.26.b:0 "Or let’s not rush into it."

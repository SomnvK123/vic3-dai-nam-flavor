je_fascist_italy:0 "Fascism in Italy"
je_fascist_italy_reason:0 "The shame of Caporetto must be cleansed by fire! The parasites who babbled in parliament have turned [ROOT.GetCountry.GetAdjective] into Europe's laughingstock! Now, the new Roman legions will use these three swords — Obedience! Order! Conquest! — to sever the weak chains of democracy! From today, every Italian will become a living weapon! Mothers will turn cradles into ammunition boxes, and young men will practice assassination with their Latin textbooks! Either the whole world will tremble under the fascist boot — or the Apennine Peninsula will sink into the Mediterranean! Long live the Leader! Long live Italy!"


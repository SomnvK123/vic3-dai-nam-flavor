russian_land_people:0 "The Territory of the [concept_russian]"
russian_land_people_tt:0 "The national emblem of the [concept_russian] is a #bold double-headed eagle#!, with one head gazing towards the east at [SCOPE.sState('east_state').GetName] and the other head gazing towards the west at [SCOPE.sState('capital_state').GetName]"
russian_land_people_reason:0 "During the reign of Ivan III, the #yellow Moscow Principality#! annexed the three great Russian states of #bold Yaroslavl#!, #bold Rostov#!, and #bold Novgorod#!, making the territory of the #yellow Moscow Principality#! exceed 1 million square kilometers. As the #yellow Moscow Principality#! grew stronger, the #yellow Golden Horde#! split into several khanates: the #bold Great Horde#!, #bold Crimea#!, #bold Kazan#!, and #bold Astrakhan#!. Subsequently, the #yellow Moscow Principality#! conquered the principalities along the #bold Tobol River#!, #bold Irtysh River#!, and #bold Ob River#!. To adapt to the new situation, #yellow Ivan III#! married Sophia, the princess of the last Byzantine [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] , began to fully inherit the legacy of Byzantium, and established a centralized system of government, changing his title from #v "Grand Prince of Russia"#! to #v "Sovereign of All Rus"#!. Upon the succession of #yellow Vasily III#!, he annexed #bold Prokopyevsk#! and #bold Ryazan#! and reclaimed Smolensk from #bold Lithuania#!. Thus, except for #bold Kiev#!, the #yellow Moscow Principality#! had unified all Russian states, and its territory had expanded to 2.8 million square kilometers, making it the largest country in Europe. By the time of #yellow Ivan IV#!, the #yellow Moscow Principality#! reached its peak. #yellow Ivan IV#! domestically purged the nobility on a large scale, established centralized rule, and transformed the #yellow Moscow Principality#! into the [concept_russian] Empire. Externally, he continuously attacked the divided #bold Golden Horde#! to expand his lands. In 1552, [concept_russian] annihilated the #bold Kazan Khanate#!; in 1556, the #bold Astrakhan Khanate#!; and from 1584 to 1598, conquered the #bold Siberian Khanate#!. Except for the #bold Crimea Khanate#! controlled by [SCOPE.sCountry('tur_scope').GetName], several khanates split from the #bold Golden Horde#! were basically conquered by [concept_russian]. By 1598, the territory of [concept_russian] had reached 3.98 million square kilometers. In 1613, the Romanov Dynasty was established, and while waging war with #bold Poland#!, [concept_russian] never stopped expanding into Siberia. In 1598, Russia fully annexed the #bold Siberian Khanate#! and subsequently advanced eastward on a large scale, gradually occupying the Yenisei and Lena River basins. By 1639, Russian colonists had reached the Sea of Okhotsk. During its eastward expansion, [concept_russian] also continuously infiltrated Mongolia, occupying much of the Mongolian land. At the end of the 17th century, it signed the Treaty of Nerchinsk with [SCOPE.sCountry('chi_scope').GetName]. At this time, the territory of [concept_russian] had expanded to 16 million square kilometers. During the reign of #yellow Catherine the Great#!, wars with [SCOPE.sCountry('tur_scope').GetName] continued, ultimately annexing the #bold Crimea Khanate#!, opening up access to the Black Sea. #yellow Catherine#! also participated in the three partitions of #bold Poland#! with [SCOPE.sCountry('ger_scope').GetName], [SCOPE.sCountry('pru_scope').GetName], and [SCOPE.sCountry('aus_scope').GetName], acquiring #bold Lithuania#!, #bold Courland#!, #bold Belarus#!, and other regions totaling 460,000 square kilometers. At the end of her reign, [concept_russian] crossed the Bering Strait and occupied #bold Alaska#!, becoming an empire spanning Asia, Europe, and North America."

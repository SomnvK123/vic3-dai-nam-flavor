law_Camicie_Nere:0 "Blackshirts"
law_Camicie_Nere_desc:0 "The name Blackshirts was inspired by Garibaldi’s Redshirts. They were a military tool organized by Mussolini for his political activities. The main founding members of the Blackshirts were nationalist intellectuals, young landowners opposed to peasants and unions, retired officers, and some members of the Arditi (elite units of the Italian army in World War I). As Mussolini's power grew, their actions became more brutal, using violence and threats to counter his opposition."
law_Divisione_Celere:0 "Celere Division"
law_Divisione_Celere_desc:0 "Italy's first mechanized experimental unit, equipped with Fiat 3000 tanks and Lancia armored vehicles, known for its Blitzkrieg tactics with an 80 km advance within 12 hours. It broke through the Alpine defenses during the 1940 French campaign."
law_Brigate_Nere:0 "Black Arrow Brigade"
law_Brigate_Nere_desc:0 "A punitive force made up of fervent fascists, armed with German STG44 assault rifles and flamethrowers, specializing in urban pacification. They were named after their black uniforms with silver arrows on the sleeves, notorious for massacres during the suppression of the Greek uprising."

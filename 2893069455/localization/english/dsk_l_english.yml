 bc_propose.1.t:0 "The Berlin Conference Proposal"
 bc_propose.1.d:0 "European colonial powers have begun the drafting the General Act of Berlin, establishing territorial claims in African and Asia."
 bc_propose.1.f:0 "Previously, European diplomats approached governments in Africa in the same manner as they did in the Western Hemisphere by establishing a connection to local trade networks. With this act, European colonial powers will agree to recognize the sovereign claims in the African Contintent."
 bc_propose.1.a:0 "Recognized by [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]."
 bc_propose_tt:0 "Countries may now claim decentralized states in Africa and Asia"
 
 bc_finish.1:0 "The Berlin Conference Ratification"
 bc_finish.1.t:0 "The Berlin Conference Ratification"
 bc_finish.1.d:0 "European colonial powers have finalized the General Act of Berlin, completing territorial claims in African and Asia."
 bc_finish.1.f:0 "European diplomats of colonial nations have completed and signed the General Act of Berlin of 1884. Many nations should see large territorial expansions within the continent. Previous claims are still recognized, and colonial powers may still lay new claims to uncolonized land."
 bc_finish.1.a:0 "Signed by [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]."
 bc_finish_tt:0 "Some countries may have expanded their claims in Africa"
 bc_finish.2:0 "1914 Sarajevo Incident
 bc_finish.2.t:0 "1914 Sarajevo Incident"
 bc_finish.2.d:0 "The nationalist youth of Serbia assassinated Grand Duke Ferdinand of Austria Hungary, and Austria Hungary officially declared war on Serbia. European powers were determined to intervene in this war, and a world war was imminent."
 bc_finish.2.f:0 "If the war in Europe affects our interests, we will not sit idly by."
 bc_finish.2.a:0 "We [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]Order the whole country to be on alert in response to the rapidly changing situation in the world."
bc_finish.3:0 "The World War has ended"
 bc_finish.3.t:0 "The World War has ended"
 bc_finish.3.d:0 "The Austro Hungarian Empire disintegrated in this war, giving birth to a bunch of new countries in the Balkans. Russia erupted in the October Revolution, and various separatist forces within Russia were eager to stir up. Poland declared its restoration."
 bc_finish.3.f:0 "This is a reshuffle of the world order"
 bc_finish.3.a:0 "Fortunately! The world war did not seriously affect our country."
  bc_finish.4.t:0 "The Allied Powers have been formed！"
 bc_finish.4.d:0 "[SCOPE.sCountry('ger_scope').GetName]、[SCOPE.sCountry('aus_scope').GetName] and [SCOPE.sCountry('ita_scope').GetName] officially signed the Triple Alliance。"
 bc_finish.4.f:0 "The main content of the Triple Alliance Treaty is: \n ① If Italy is attacked by France, Germany and Austria should provide full assistance. If Germany is invaded by France, Italy should also bear the same obligation. \n If one or two contracting countries are attacked by two or more major powers (referring to France and Russia), the three contracting countries should cooperate in combat. Italy has a reservation on this: if Britain attacks Germany or Austria Hungary, Italy will not be obligated to assist its allies. \n When a major country (referring to Russia) attacks one of the contracting states, the other two contracting states should adopt a friendly neutrality, that is, in the event of a war between Russia and Austria, Italy will remain conservative and neutral."
 bc_finish.4.a:0 "We'll see"
  bc_finish.5.t:0 "The Allied Powers have been formed"
 bc_finish.5.d:0 "[SCOPE.sCountry('gbr_scope').GetName]、[SCOPE.sCountry('fra_scope').GetName] and [SCOPE.sCountry('rus_scope').GetName] have officially signed the Triple Entente."
 bc_finish.5.f:0 "Two major military conglomerates have been formed! This is a decision to guide the world towards war"
 bc_finish.5.a:0 "We will still wait and see."

italy_mafia.1.t:0 "The Curse of Citrus Gold"
italy_mafia.1.d:0 "Lemon growers in Palermo receive a warning letter with a gilded bullet: 'Each box of citrus must pay 2 lire 'transport insurance', or your fruit will rot on the tree!'\n\nTax officials discover that citrus boxes shipped to Liverpool conceal #bold heroin#! and #bold smuggled guns#!..."

dsk_italy_mafia_progress_bar:0 "Mafia"
dsk_italy_mafia_progress_bar_desc:0 "[concept_mafia] progress: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!#v ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/200)#!"

je_dsk_italy_mafia:0 "Mafia Activities"
je_dsk_italy_mafia_reason:0 "By the early 19th century, [concept_mafia] had evolved into a hierarchical and faction-filled secret organization. [concept_mafia]’s basic structure consists of family units bound by blood and marriage, with the heads of the largest families forming a committee that has the highest authority. Admission to [concept_mafia] is strictly controlled: members must have no ties to government or police, and must possess the courage to 'devote' themselves."

dsk_italy_mafia_progress_bar_citrus:0 "From $building_wheat_farm$ or $building_maize_farm$ in [SCOPE.sCulture('south_italian_culture').GetName] area producing $pm_citrus_orchards_enr$ or $pm_citrus_orchards$"
dsk_italy_mafia_progress_bar_police:0 "From $lawgroup_policing$"

concept_mafia:0 "Mafia"
concept_mafia_desc:0 "The term Mafia originated from the March 30, 1282, day before Valentine's Day, during the Sicilian Uprising. After a Palermo girl, Sophia, was raped by French soldiers on her wedding day, Sicily began a spree of revenge, attacking every French they saw and declaring 'Morto Alla Francia, Italia Anela'('Death to France, Italy yearns for it'), with Mafia being the acronym of this slogan."
Mafia_modifier:0 "Mafia Activity"

mafia_economy_modifer:0 "Citrus Kings"

modifier_reforms_of_sar6:0 "Control of Tripolitania"
modifier_reforms_of_sar7:0 "Control of Italy"
modifier_reforms_of_sar8:0 "Italian Citrus"

dsk_ita.14.t:0 "Redemption of Citrus"
dsk_ita.14.d:0 "Orders from the London Naval Department swept across Sicily like a Mediterranean monsoon—an annual 500,000-gallon lemon juice contract to prevent scurvy in the Royal Navy.\n\nPalermo port established the 'Citrus Export Union' and, by mixing in under-ripe fruit, reduced the actual supply to 60% of the contracted amount, thickened by lime water.\nIronically, this substandard lemon juice accelerated breakthroughs in vitamin C extraction technology."
dsk_ita.14.f:0 "By 1862, #yellow citrus#! from [ROOT.GetCountry.GetAdjective] accounted for 62% of #yellow citrus#! orders in #SCOPE.sCountry('gbr_scope').GetName#."
dsk_ita.14.a:0 "Let the London Exchange be filled with the scent of the Tricolor flag."

je_italia_citrus:0 "The Prosperous Citrus Industry"
je_italia_citrus_reason:0 "The 19th-century Italian citrus industry was both a myth of "green gold" wealth and a prime example of colonial-style exploitation. Its rise and fall reflects the opportunities and vulnerabilities of globalized trade, as well as the struggles of the South in the wake of Italian reunification. The legacy of this industry is still visible today – Sicilian blood oranges still enjoy Protected Designation of Origin (PDO) in the European Union, while the shadow of mafia control over agriculture has not yet fully dissipated"
every_italy_land_add_fruit_modifier_tt:0 "All provinces with enabled $pm_citrus_orchards_enr$ will receive an output modifier."
je_italian_Youth_Party_tt:0 "Expel foreign powers, unite fragmented states, democracy, and republicanism."
enough_Italian_Youth_Party_var:0 "Have over #v 50#! progress points."
ita_clandestine_press_button:0 "Underground Newspaper Industry"
ita_clandestine_press_button_desc:0 "Secretly print the 'Youth Italy' newspaper."
ita_mazzini_network_button:0 "Revolutionary Military Communication Network"
ita_mazzini_network_button_desc:0 "Establish a transnational revolutionary communication network."
ita_national_education_button:0 "Spread the National Language"
ita_national_education_button_desc:0 "Promote Tuscan Italian."
ita_revolutionary_finance_button:0 "Revolutionary Financial System"
ita_revolutionary_finance_button_desc:0 "Establish a Mediterranean trade network."

dsk_ita.50.t:0 "Establish Publisher"
dsk_ita.50.d:0 "In the cellar of the Genoa San Siro Church, [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] used a printing press left over from the Charcoal Party to print Dante's poems and Mazzini's proclamations. Each issue of 'Youth Italy' hides secret messages written in lemon juice at the bottom of the pages, only visible near candlelight, showing the rally coordinates of the [concept_redshirts]."
dsk_ita.50.f:0 "The gendarmerie raided the printing house and discovered sulfur-powdered [concept_tricolore] symbols in the lead type."
dsk_ita.50.a:0 "The scent of ink from [concept_tricolore]."

dsk_ita.51.t:0 "The Flames on Both Sides of the Alps"
dsk_ita.51.d:0 "Exiled officers from [SCOPE.sCountry('western_country').GetName] encoded rebellion tactics into mass hymns, passing them through the organist at the [ROOT.GetCountry.GetAdjective] embassy in Vienna. Hungarian revolutionary Kossuth hid Metternich's suppression plans in the layers of Tuscan wine barrels, smuggled by the Mafia's mule team over the Brenner Pass."
dsk_ita.51.f:0 "Austrian spies intercepted weapon schematics disguised as opera music scores."
dsk_ita.51.a:0 "Transnational revolutionary communication via the score of 'La Traviata.'"

dsk_ita.52.t:0 "The National Language on Dante's Dagger"
dsk_ita.52.d:0 "[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]'s linguists adapted 'The Divine Comedy' into literacy textbooks, carving Tuscan letters into the tips of daggers in the slums of [SCOPE.sCountry('western_country').GetName]. Any child speaking Sicilian dialect would be punished by reciting Garibaldi's manifesto—while a schoolmaster’s rod wrapped in [concept_tricolore] silk reshapes the tongue of the peninsula."
dsk_ita.52.f:0 "A dialect riot broke out in Palermo, burning the Tuscan Italian dictionary."
dsk_ita.52.a:0 "Promote Tuscan Italian in [SCOPE.sCountry('western_country').GetName]."

dsk_ita.53.t:0 "The Sea Route of Oranges and Repeaters"
dsk_ita.53.d:0 "The 'St. John' freighter from [SCOPE.sCountry('western_country').GetName] sailed with Sardinian wheat in the hold, its 200 Enfield rifles packed in citrus to prevent rusting. 'Men of Honor' in Palermo transported gold in secret compartments within citrus crates, each coin engraved with the eagle emblem of [concept_redshirts]."
dsk_ita.53.f:0 "The Austrian Navy intercepted weapon-laden wine barrels in the Messina Strait."
dsk_ita.53.a:0 "Organize the Mediterranean trade network."
spend_ship_modifier:0 "Organize the Mediterranean trade network."

# Bandit War (1861-1870 Southern Rebellion)
dsk_ita.40.t:0 "Bandit War"
dsk_ita.40.d:0 "While #yellow Garibaldi#!'s Redshirts were celebrating unification, #v Calabria#!'s farmers tore apart land deeds with hunting rifles and sickles.\n\nThe remnants of the #red Bourbon Dynasty#! sent British-made Enfield rifles through the Malta Bank, and the [concept_mafia] 'Honor Men' distributed bullets and Bibles to the rebels under the cover of darkness.\n\nThe Sardinian army responded with #yellow scorched earth policies#!—in the burned olive groves, heads of the #v Bandit Kings#! were nailed to the blackened citrus trees, with crows pecking at their wooden false eyes engraved with [concept_tricolore] symbols."
dsk_ita.40.f:0 "Spies from the #red Kingdom of Sicily#! successfully turned the bandit leaders.\nThe Roman Catholic Church declared the bandits 'Martyrs'."
dsk_ita.40.a:0 "Send the #yellow Alpine Mountain Troops#!."

# Italian Mafia
dsk_ita.41.t:0 "The Empire in the Orange Boxes"
dsk_ita.41.d:0 "In the salty sea breeze of #v Palermo#! port, [concept_mafia] 'Bosses' write secret orders with lemon juice.\n\nEvery wooden crate filled with blood oranges hides: #red Corsican#! smuggled detonators, #yellow British#! banknotes, and forged land deeds stamped with fake seals.\n\nWhen [ROOT.GetCountry.GetAdjective] tax collectors attempt to open the boxes, the 'Honor Men' smile and hand over daggers soaked in citrus juice—the hilt, inlaid with a Madonna's eyes, made from the teeth of informers."
dsk_ita.41.f:0 "#red British Customs#! intercepted citrus-laden ships with explosives."
dsk_ita.41.a:0 "Allow the [concept_mafia] to control local taxes."

fruit_modifier:0 "Citrus Trade"

# Holy Grail Brotherhood (1860s Southern Clerical Resistance)
dsk_ita.42.t:0 "Holy Grail Brotherhood"
dsk_ita.42.d:0 "In the underground catacombs of #v Palermo#!, [concept_mafia] 'Bosses' drink wine mixed with the blood of saints with #red Jesuit#! priests.\n\nThey craft crosses from the ribs of defrocked bishops and carve the names of [ROOT.GetCountry.GetAdjective] tax officials on the back of #yellow Syracuse silver coins#!, throwing them into the sulfur vents of Mount Etna.\n\nWhen #v Calabria#! farmers confess the word 'unification' in confession, the priests pass them Eucharist soaked in #red belladonna#! poison—hidden tunnels beneath the altar lead to the tombs with the broken [concept_redshirts] banners."
dsk_ita.42.f:0 "#yellow Pius IX#! issues the 'Most Terrible' decree, denouncing the brotherhood as 'The Satanic Upside Down Cross.'"
dsk_ita.42.a:0 "Immediately pursue and arrest them."
dsk_ita.42.b:0 "Of little concern."

# Scorched Earth Policy (1861-1870 Southern Rebellion Suppression)
dsk_ita.43.t:0 "The Tricolor Flag in the Ashes"
dsk_ita.43.d:0 "#yellow Lamarmora#!'s engineers used a modified Greek fire formula to burn #v Basilicata#!'s olive groves. The charred citrus trees bore the skulls of the #yellow Bandit Kings#!—their eye sockets filled with lead bullets engraved with [concept_tricolore] insignia.\n\nThe fishing villages along the Bay of Naples were forcibly relocated, and mothers were forced to immerse #bold newborns#! in wells of water mixed with lime—this was the 'scientific quarantine' to prevent the 'bandit gene' from spreading.\n\nThe British 'Times' wrote: 'Every square mile of scorched earth produces #yellow 3 tons of bone ash#!, nourishing the young shoots of [concept_unification].'"
dsk_ita.43.f:0 "The International Red Cross held an emergency meeting in #v Geneva#! to condemn 'Alpine Barbarism.'"
dsk_ita.43.a:0 "Kill all these rebels!"
dsk_ita.43.b:0 "Prioritize the protection of the elderly, weak, and women."
conquer_modifier:0 "Scorched Earth Policy"

dsk_italy_mafia_progress_add_5_tt:0 "#o Mafia Log#! Progress bar increases by #v 5#! points"

dsk_ita.44.t:0 "Centralization Reform"
dsk_ita.44.d:0 "When the #bold Albertina Regulations#! measuring rod rolled over #v Naples#! market, merchants mocked the new standard with #red Byzantine pounds#!. Bandit kings raised the [concept_tricolore] in the scorched earth, and tax stamps were stamped with the intercepted #yellow Savoy seal#!"
dsk_ita.44.f:0 "#v Genoa#! erupts in a revolt over weights and measures\n[concept_habsburg_order] sends more troops to Lombardy"
dsk_ita.44.a:0 "Build model villages in villages burned by bandits"
dsk_ita.45.t:0 "Suffrage Reform"
dsk_ita.45.d:0 "#v Milan#! textile workers wove [concept_manifesto] into their strike banners, and artillery shells from the Turin munitions factory were engraved with 'Universal suffrage or revolution.' Steel melted under the marks of the [concept_tricolore]."
dsk_ita.45.f:0 "The Church declares suffrage to be the #red 'Devil's Contract'#!\n#v Palermo#! polling station bombed"
dsk_ita.45.a:0 "Escort voter registration officers with a military band"
dsk_ita.46.t:0 "Land Reform"
dsk_ita.46.d:0 "#v Sicily#! miners burn land contracts, revealing the broken eagle emblem of [concept_redshirts]. British consuls reported: '83% of the land belongs to 1.2% of the aristocracy, and tax abacuses are made from the teeth of Garibaldian veterans.'"
dsk_ita.46.f:0 "[concept_mafia] assassinates land surveyors\n#v Palermo#! land registry archives burned"
dsk_ita.46.a:0 "Send armed notaries to the countryside"
dsk_ita.47.t:0 "Separation of Church and State Reform"
dsk_ita.47.d:0 "When [concept_papacy] cursed the reform, Garibaldian veterans melted the papal badge into [concept_tricolore] road signs. Florence's anatomy hall displayed Darwin's specimens alongside saintly relics."
dsk_ita.47.f:0 "The Church launches the #red 'New Crusade'#!\n#v Rome#! clerical riot"
dsk_ita.47.a:0 "Convert monasteries into schools"
dsk_ita.48.t:0 "Judicial Unification Reform"
dsk_ita.48.d:0 "#v Modena#! courts simultaneously display #bold Albertina Regulations#! and #red Arab Code#!. When gendarmes enter #v Calabria#! with the new decree, villagers write 'Long live Roger II's Code!' with crossbows on stone walls."
dsk_ita.48.f:0 "#v Palermo#! Lawyers' guild goes on strike\n[concept_habsburg_order] funds separation lawsuits"
dsk_ita.48.a:0 "Build model prisons in the scorched earth"
dsk_ita.49.t:0 "Reforms Spark Southern Discontent"

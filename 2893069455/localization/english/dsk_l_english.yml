dsk_common.1.t:0 "Industrial Revolution Era"
dsk_common.1.d:0 "The Industrial Revolution era marked the transition from traditional agricultural societies to modern industrial ones. Through technological innovation, capital accumulation, and labor division, productivity was greatly improved, reshaping the global economy."
dsk_common.1.f:0 "In this era, breakthroughs like the steam engine, railways, and textile machines changed production and lifestyles. Urbanization accelerated, the working class rose, corporate structures were established, and the world market expanded. The industrial revolution not only advanced technology but also spurred colonial expansion, international trade, and capital flows. The shift in production modes and the emergence of factory systems began to dismantle traditional social structures. At the same time, this era was also one of social conflicts and transformations, with increasing wealth gaps, labor issues, and worker movements becoming key global concerns."
dsk_common.1.a:0 "Steam Engines, Railways, Mechanized Production"

dsk_common.2.t:0 "Overseas Markets"
dsk_common.2.d:0 "With the increased industrial productivity, overseas markets became more crucial. Nations expanded their influence through trade, seeking new resources and markets to support their ever-expanding production scale."
dsk_common.2.f:0 "The expansion of overseas markets not only allowed industrial products to be exported in large quantities, but also provided vital raw materials for the home country, forming a positive cycle of production and consumption. Factories, steel, and textiles began to be exported to other countries, while at the same time, we gained valuable resources through colonial expansion. With the opening of the world market, new economic organizations such as commercial banks and international trading companies emerged, driving the globalization process."
dsk_common.2.a:0 "Trade Expansion, Colonies, Market Competition"

dsk_common.3.t:0 "Modern Medicine"
dsk_common.3.d:0 "Modern medicine was greatly advanced by the industrial revolution, with new technologies and scientific progress significantly improving treatment outcomes. Scientists and doctors, aided by new research methods and equipment, reduced the threat of deadly diseases."
dsk_common.3.f:0 "With the development of steam power and chemical technologies, medical equipment became more advanced, and methods for diagnosing and treating diseases made significant progress. The use of anesthetics and disinfectants revolutionized the safety and success rate of surgeries. The medical system as a whole improved, and public health was given more attention, leading to fundamental improvements in the urban sanitary conditions. New vaccine research helped control or eliminate some previously deadly diseases like smallpox and cholera."
dsk_common.3.a:0 "Vaccine Research, Anesthesia Technology, Public Health"

dsk_common.4.t:0 "Railway Act"
dsk_common.4.d:0 "The construction of railways became one of the most important infrastructures of the Industrial Revolution, and the introduction of the Railway Act regulated the development of this emerging industry, promoting changes in transportation and logistics."
dsk_common.4.f:0 "The Railway Act set standards for railway construction, the operation of railway companies, and safety regulations for transportation. The laying of railways significantly reduced transportation costs and facilitated the flow of industrial products. For the country, railways not only strengthened domestic connectivity but also promoted international trade by linking major ports. The implementation of the Railway Act also encouraged capital investment and large-scale infrastructure construction, revolutionizing travel methods and accelerating national modernization."
dsk_common.4.a:0 "Railway Construction, Transportation Regulations, Capital Investment"

dsk_common.5.t:0 "Modern Army"
dsk_common.5.d:0 "With the industrial revolution, military technologies and equipment quickly modernized, making the army stronger. The use of new weapons and tactics made the military more efficient and deadly in combat."
dsk_common.5.f:0 "Industrialization brought new cannons, rifles, and armored vehicles, significantly enhancing the combat capabilities of the military. Heavy industry provided strong logistical support to the army, with steel, explosives, and mechanized weapons becoming standard for modern armies. The construction of railways sped up troop movements, changing combat tactics and operations. Armies gradually moved away from relying on traditional cavalry and infantry and instead focused on modern weapons and mechanized warfare."
dsk_common.5.a:0 "Mechanized Warfare, Artillery, Modern Weaponry"

dsk_common.6.t:0 "Modern Navy"
dsk_common.6.d:0 "With the advent of steamships, the navy was strengthened like never before. The industrial revolution made naval warfare more efficient and threatening, as ships no longer relied on wind but on steam power."
dsk_common.6.f:0 "The establishment of modern navies marked a complete shift in naval warfare. The rapid development of steamships greatly enhanced the mobility and strike capabilities of navies around the world. At the same time, the navy’s role expanded beyond defense, assuming the task of safeguarding global trade routes. New shipbuilding technologies made vessels stronger, and firepower increased. Navies became a crucial tool for major powers to compete for international status and control over maritime trade."
dsk_common.6.a:0 "Steamships, Naval Power, Global Trade"

dsk_common.7.t:0 "Modern Art"
dsk_common.7.d:0 "The industrial revolution brought rapid urban expansion and social changes, and artists began to explore and express the complex emotions and social phenomena arising from these transformations, giving rise to modern art."
dsk_common.7.f:0 "As industrialization accelerated, the rise of the working class, the prosperity of capitalism, and rapid urban growth became new sources of inspiration for artists. Modern art not only depicted everyday life but also reflected the mechanization of factories, the overcrowding of cities, and the hardships of laborers. Art movements like Impressionism, Realism, and later Expressionism came to the forefront, capturing the complexity, contradictions, and innovations of this era."
dsk_common.7.a:0 "Working Class, Modernism, Expressionism"

dsk_common.8.t:0 "Modern Agriculture"
dsk_common.8.d:0 "Agriculture also underwent revolutionary changes during the Industrial Revolution. New mechanized agricultural tools greatly boosted productivity to meet the growing food demands of urbanization."
dsk_common.8.f:0 "The introduction of mechanized tools, such as the steam-powered plow, seed drills, and mechanical reapers, revolutionized farming methods. With these tools, agricultural production became more efficient, reducing labor costs and increasing yields. As a result, agricultural output soared, making it possible to support a growing urban population. The changes in agriculture also led to the shift of rural labor to urban areas, accelerating urbanization. The growth of cities and factories led to a demand for food, creating a symbiotic relationship between agriculture and industry."
dsk_common.8.a:0 "Mechanized Farming, Increased Yields, Urbanization"

dsk_common.9.t:0 "Modern Shipbuilding"
dsk_common.9.d:0 "Modern shipbuilding technology advanced rapidly during the Industrial Revolution. Steel hulls, steam engines, and new construction techniques made ships faster, safer, and more capable than ever before."
dsk_common.9.f:0 "With advancements in iron and steel processing, shipbuilding underwent revolutionary changes. Ships were now built using steel, which greatly improved their durability and capacity. The introduction of steam engines allowed ships to sail independently of wind, enabling faster and more reliable global trade. New ship designs also made vessels more capable of defending against naval warfare, and shipbuilding industries boomed as countries invested heavily in expanding their naval and commercial fleets."
dsk_common.9.a:0 "Steel Ships, Steam-Powered Engines, Naval Warfare"

dsk_common.11.t:0 "Modern Light Industry"
dsk_common.11.d:0 "The rise of light industry played an important role in the Industrial Revolution. The development of industries such as textiles, garment manufacturing, and food processing boosted the production of consumer goods and improved living standards."
dsk_common.11.f:0 "Advancements in technologies such as the spinning wheel and sewing machine led to the large-scale production of light industry. The introduction of factory-based production made products more affordable, allowing ordinary people to enjoy goods that were previously out of reach. The prosperity of light industry promoted the consumption market in cities and accelerated the transfer of labor from rural areas to cities, providing a stable labor source for industrialization."
dsk_common.11.a:0 "Textile Industry, Consumer Goods, Factory Production"


clever_dsk.159.t:0 "Stroke Tragedy"
clever_dsk.159.d:0 "Caesar [SCOPE.sCharacter('wilhelm_iv_sick_benefactor').GetFirstName] suddenly suffered a stroke. Although he had shown signs of mental instability before, hindering his ability to carry out government duties, today, Caesar cannot even speak with his ministers. A gloomy atmosphere pervades the palace, and priests are praying for [SCOPE.sCharacter('wilhelm_iv_sick_benefactor').GetFirstName]."
clever_dsk.159.f:0 "[SCOPE.sCharacter('wilhelm_iv_sick_benefactor').GetFirstName] is lying in pain on the bed, and the private doctor suggests that we sign a regency charter. After all, before this, Caesar’s brother, Prince Wilhelm, had already temporarily governed, proving his capability to manage the country."
clever_dsk.159.a:0 "Listen to the private doctor's advice and sign the regency charter, allowing Caesar's brother to manage the country's affairs."
clever_dsk.159.b:0 "Quickly call for a trained doctor."
clever_dsk.159.c:0 "Let medical expert [SCOPE.sCharacter('help_wilhelm_IV_benefactor').GetFullName] try to save Caesar."
clever_dsk.160.t:0 "Qatar Rebellion"
clever_dsk.160.d:0 "Our representative in Qatar, Ahmed bin Mohammed, reports that the Emir of Qatar, Jassim bin Mohammed Al Thani, tried to dispatch troops to imprison him under the pretext of helping a tribal elder recover goods, a blatant act of rebellion."
clever_dsk.160.f:0 "According to the 1835 maritime truce agreement, Bahrain and Oman, along with other Arab emirates, are prohibited from waging war against each other, and the [SCOPE.sCountry('gbr_independencia_of_qatar_scope').GetName] Royal Navy oversees this. If we act rashly to suppress Qatar, it might provide a reason for [SCOPE.sCountry('gbr_independencia_of_qatar_scope').GetName] to intervene."
clever_dsk.160.a:0 "Qatar is our territory, not an independent emirate, and we have the right to deal with it."
clever_dsk.160.b:0 "Pay compensation to the Emir of Qatar, Jassim."
clever_dsk.161.t:0 "[SCOPE.sCountry('qatar_against_bhn_scope').GetName] Uprising"
clever_dsk.161.d:0 "Our representative in Qatar reports that [SCOPE.sCountry('bhn_track_with_qatar_scope').GetName] arrested a man from the Naim tribe in the Wakra market, confiscated his pearl goods, and captured the tribal chief who attempted to resist. Local tribal elders sought help from Emir Jassim to negotiate with Manama, but the Emir was deceived by [SCOPE.sCharacter('bhn_ruler_with_qatar_scope').GetFirstName] and was imprisoned in [SCOPE.sCountry('bhn_track_with_qatar_scope').GetName]. This has angered the people of [SCOPE.sCountry('qatar_against_bhn_scope').GetName], and they have begun to rebel against Bahrain’s rule."
clever_dsk.161.f:0 "Dear, my, my! As long as Jassim is chained, you cannot live in peace with us! We must take our ships back with polished steel swords!"
clever_dsk.161.a:0 "Intervene in Arabian Gulf affairs and provide military aid to [SCOPE.sCountry('qatar_against_bhn_scope').GetName]."
clever_dsk.161.b:0 "We will not intervene in [SCOPE.sCountry('bhn_track_with_qatar_scope').GetName]'s internal affairs."
clever_dsk.162.t:0 "Berlin Conference: Angola Region"
clever_dsk.162.d:0 "We are the first explorers to establish permanent colonies in Angola! We should assert our territorial claims before others arrive..."
clever_dsk.163.t:0 "Berlin Conference: Mozambique Region"
clever_dsk.163.d:0 "We are the first explorers to establish permanent colonies in Mozambique! We should assert our territorial claims before others arrive..."
clever_dsk.164.t:0 "Mercy for the Weak"
clever_dsk.164.d:0 "Our army defeated [SCOPE.sCountry('chl_compensate_peu_scope').GetName] in the Battle of Cloud Gate, and [SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName] fled the battlefield in panic. Clearly, this foolish confederation is on the brink of collapse."
clever_dsk.164.f:0 "The brave generals and soldiers marched across Antofagasta and held a grand military parade in Lima. Peruvians along the streets watched us with fearful eyes. As our neighbor, fully annihilating [SCOPE.sCountry('chl_compensate_peu_scope').GetName] would damage our international reputation. Perhaps we can ask [SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName] to 'agree' to dissolve the confederation in exchange for the Antofagasta region we occupy."
clever_dsk.164.a:0 "The war is not against the people of Peru and Bolivia, tell [SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName] that as long as the confederation is dissolved, we can return the Antofagasta region."
clever_dsk.164.b:0 "We will not compromise on territorial issues."
clever_dsk.165.t:0 "[SCOPE.sCountry('winner_chl_peu_scope').GetName]'s Demands"
clever_dsk.165.d:0 "Our army was decisively defeated by [SCOPE.sCountry('winner_chl_peu_scope').GetName]'s forces in the Battle of Cloud Gate, and [SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName] was fortunate to escape the battlefield. However, [SCOPE.sCountry('winner_chl_peu_scope').GetName] demands that [SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName] announce the dissolution of the confederation, or they will not give up the occupied territories."
clever_dsk.165.f:0 "[SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName] still refuses to give up the confederation. He sorrowfully tells his friends about his unfortunate situation and prepares to return to Bolivia via Peru's Arequipa to restart the conquest war. However, both [SCOPE.sCountry('chl_compensate_peu_scope').GetName]'s politicians and the people of Peru collectively oppose [SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName]. Will a national protector fall?"
clever_dsk.165.a:0 "Accept [SCOPE.sCountry('winner_chl_peu_scope').GetName]'s proposal and retrieve the Antofagasta territory."
clever_dsk.165.b:0 "As long as Protector [SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName] lives, the confederation will never fall."
01_india_events.21.t:0 "Manipur's Security Issue"
01_india_events.21.d:0 "Since the King of Manipur surrendered to us, the [SCOPE.sCountry('nga_be_killed_scope').GetName] tribes in the northern part have regularly attacked our peace-loving subjects. Although we tried to introduce [SCOPE.sCountry('kki_be_killed_scope').GetName] settlers in [SCOPE.sCountry('nga_be_killed_scope').GetName] villages to balance the tribes and protect the security of the Manipur Valley, there are still many barbarians who refuse to be disciplined."
01_india_events.21.f:0 "The King of Manipur once conquered many places during the Meitei dynasty, but his poor governance limited his rule to the valley region. The [SCOPE.sCountry('nga_be_killed_scope').GetName] and [SCOPE.sCountry('kki_be_killed_scope').GetName] in the mountains still remain under no control. If we do not deal with them and let these tribal conflicts, feuds, and even attacks on us continue, there will be no security in Manipur."
01_india_events.21.a:0 "It is time to teach these tribes how to coexist peacefully."
01_india_events.21.b:0 "We do not wish to participate in tribal conflicts."
01_india_events.22.t:0 "Loan Repayment"
01_india_events.22.d:0 "[SCOPE.sCharacter('ruler_gbr_no_loans_scope').GetFirstName] and colleagues have successfully repaid the £1.4 million loan provided by the [SCOPE.sCountry('gbr_no_loans_scope').GetName] parliament in 1772. In return, the [SCOPE.sCountry('gbr_no_loans_scope').GetName] parliament decided to relax its control over us and allowed the restoration of some of our lost powers."
01_india_events.22.f:0 "If we reflect on the past, the disrespect toward local Indians was our failure. Speculators caused many Bengali deaths due to starvation, corrupt officials only sought to extract wealth from India, and immoral staff infiltrated the entire bureaucracy... we cannot allow such behavior to happen again, or else the company will remain as vulnerable as it was during the 1772 financial crisis."
01_india_events.22.a:0 "The board applauds [SCOPE.sCharacter('ruler_gbr_no_loans_scope').GetFirstName]'s leadership."
01_india_events.23.t:0 "Caste Elimination"
01_india_events.23.d:0 "No one should be discriminated against because of caste, religion, or place of birth. When the congressman wrote this simple sentence into our constitution and made it public, the crowd outside erupted into celebratory cheers."
01_india_events.23.f:0 "There is no more degenerate societal system than the caste system. This system numbs and paralyzes people, preventing any beneficial activities. We broke the caste system not to promote cross-caste dining and inter-caste marriages, but to destroy the religious concepts that underpinned the caste system, especially the scriptures that taught caste religion. Perhaps discrimination will still lurk in the shadows, but we will ultimately overcome it."
01_india_events.23.a:0 "This is a day for everyone to celebrate."
01_india_events.24.t:0 "Koh-i-Noor Diamond"
01_india_events.24.d:0 "The ruler of [SCOPE.sCountry('pan_koh_i_noor_scope').GetName], [SCOPE.sCharacter('pan_ruler_koh_i_noor_scope').GetFirstName], fearing the curse of the diamond, wishes to sell the Koh-i-Noor diamond at a low price. It has a dazzling appearance and radiant shine, like a mountain of light."
01_india_events.24.f:0 "Hindu scriptures once described this diamond as 'Whoever owns it, owns the world. Whoever owns it, suffers the disaster it brings, only God or a woman may possess it without suffering.' The holder of it, Babur, died of malaria in his middle age...Nadir Shah, who took it, was decapitated by his soldiers in a fit of madness... Shaking with fear, [SCOPE.sCharacter('pan_ruler_koh_i_noor_scope').GetFirstName] fears the curse will fall upon him, hoping to sell the diamond to our Queen Victoria as per the ancient legend."
01_india_events.24.a:0 "Accept [SCOPE.sCountry('pan_koh_i_noor_scope').GetName]'s offer."
01_india_events.24.b:0 "Perhaps if we make [SCOPE.sCountry('pan_koh_i_noor_scope').GetName] submit to us or the East India Company, we can force [SCOPE.sCharacter('pan_ruler_koh_i_noor_scope').GetFirstName] to 'freely' hand over the diamond."
01_india_events.25.t:0 "Rowlatt Act"
01_india_events.25.d:0 "Many Indians have dared to openly protest our policies and start riots. After receiving this report, the [SCOPE.sCountry('gbr_bic_no_speak_scope').GetName] parliament demands that we immediately implement the Rowlatt Act to prevent terrorism and subversion of the government."
01_india_events.25.f:0 "All political agitators will be subject to up to two years of detention without trial, with no right of appeal during this period... Cases of inciting rebellion can be tried without a jury... Police may arrest suspects at will without public hearings, and long-term detention is allowed..."
01_india_events.25.a:0 "Perhaps this will make them behave."
clever_dsk.166.t:0 "Tragedy at the Reservoir"
clever_dsk.166.d:0 "Our kingdom's heir, [SCOPE.sCharacter('leopold_hainaut_heir_scope').GetFullName], tragically fell into a reservoir and contracted pneumonia. He is now on his deathbed. Some doctors tell [SCOPE.sCharacter('leopold_ii_sad_scope').GetFullName] that the child is losing his vital signs, praying that the Lord will release him from suffering."
clever_dsk.166.f:0 "[SCOPE.sCharacter('leopold_ii_sad_scope').GetFullName] kneels beside the bed, uncontrollably sobbing. His staff comforts the grief-stricken father, everyone knows that the child is soon to leave this beautiful world."
clever_dsk.167.t:0 "The Communist Manifesto"
clever_dsk.167.d:0 "A philosopher from North Rhine was commissioned by an underground secret organization called the German Communist League to write and publish the 'Communist Manifesto.' After this pamphlet was printed, it spread rapidly among the people."
clever_dsk.167.f:0 "The communists are not shy about their views and goals. They openly declare that only through violent revolution to overthrow the existing social systems can they achieve their aims. Let the ruling classes tremble before the communist revolution. The proletariat has nothing to lose but their chains. They will win the whole world. Workers of the world, unite!"
clever_dsk.167.a:0 "Immediately issue a warrant for [SCOPE.sCharacter('friedrich_engels_now_scope').GetFullName]."
clever_dsk.167.b:0 "[SCOPE.sCharacter('friedrich_engels_now_scope').GetFullName]'s ideas could bring progress to our nation."
clever_dsk.168.t:0 "The Fleeing Communist"
clever_dsk.168.d:0 "After publishing the 'Communist Manifesto,' a radical communist participated in several armed uprisings in his country. He was not only deprived of his citizenship but was also pursued by the local government. There are rumors that this individual has successfully escaped the border, and both enemies and party members are curious about his whereabouts."
clever_dsk.168.f:0 "The description of [SCOPE.sCountry('friedrich_engels_now_scope').GetName]'s wanted poster is '5 feet 6 inches tall, blonde hair, smooth forehead, golden eyebrows, round nose and mouth, light red beard, oval chin, healthy complexion, fast talker, with shallow eyes.' If we catch him and send him back, we may earn a substantial reward."
clever_dsk.168.a:0 "Where will he take refuge?"
clever_dsk.169.t:0 "Border Threat"
clever_dsk.169.d:0 "The [SCOPE.sCountry('brz_eat_bol_now_scope').GetName] army has assembled at our border. [SCOPE.sCharacter('bol_hate_brz_now_scope').GetFirstName] knows exactly what will happen next. A diplomat from [SCOPE.sCountry('brz_eat_bol_now_scope').GetName] told us that as long as [SCOPE.sCharacter('bol_hate_brz_now_scope').GetFirstName] is willing to actively solve the border dispute, the two countries can maintain friendly relations."
clever_dsk.169.f:0 "Oh, General [SCOPE.sCharacter('bol_hate_brz_now_scope').GetFirstName], it's clear that our previous map of the Amazon River Basin was inaccurate. The Madeira River and the source of the Javiari River seem to be in the wrong location. We sincerely hope both sides can resolve this border issue amicably."
clever_dsk.169.a:0 "This is an outright war threat. [SCOPE.sCharacter('bol_hate_brz_now_scope').GetFirstName] will not give up a single inch of Bolivia's land."
clever_dsk.169.b:0 "[SCOPE.sCountry('brz_eat_bol_now_scope').GetName] is our friendly neighbor. We can make a small concession to maintain friendship between the two countries."
clever_dsk.170.t:0 "New Emperor?"
clever_dsk.170.d:0 "With the support of the [SCOPE.sCountry('mex_fra_aus_now_scope').GetName] army and conservatives, [SCOPE.sCharacter('mex_hate_fra_now_scope').GetFirstName] declared himself the emperor of Mexico."
clever_dsk.170.f:0 "With French forces in support, [SCOPE.sCharacter('mex_hate_fra_now_scope').GetFirstName] has seized Mexico City. The president [SCOPE.sCharacter('mex_president_now_scope').GetFullName] has fled."
clever_dsk.170.a:0 "We must send support to the president."
clever_dsk.170.b:0 "We must support [SCOPE.sCharacter('mex_hate_fra_now_scope').GetFirstName]'s new emperor." 
clever_dsk.171.t:0 "The Rise of Extremism"
clever_dsk.171.d:0 "According to reports from the local embassy, after experiencing bankruptcy and war, [SCOPE.sCountry('ger_hitler_is_coming_scope').GetName] has seen the National Socialist German Workers' Party gain the majority of seats in this year's elections. They advocate anti-communism and anti-Semitism and even threaten to abolish the current parliamentary democracy. It is clear that this is a blatant assault on democracy."
clever_dsk.171.f:0 "Before me stands a nation, a nation groaning in humiliation! After that war, the pride of our people was lost! 'You may say, [SCOPE.sCharacter('ger_ruler_hitler_is_coming_scope').GetFirstName], I need a job, a piece of bread. Yes, you are right, survival is very important, but I want to tell you that there is something more important than life itself—freedom! That is dignity!"
clever_dsk.171.a:0 "Send a message to [SCOPE.sCharacter('ger_ruler_hitler_is_coming_scope').GetFirstName] to congratulate him on his victory."
clever_dsk.171.b:0 "I only see a group of gorillas extending their right arms and grunting in front of their chief."
clever_dsk.172.t:0 "Explorer's Request"
clever_dsk.172.d:0 "[SCOPE.sCharacter('nile_david_livingstone_scope').GetFirstName], after completing several expeditions across Africa, wrote his experiences in 'The Missionary's Travels.' This book encourages missionaries to use 'legitimate trade' methods to end the African slave trade. His field science and extraordinary sympathy for the African people have earned him a large following. Now, [SCOPE.sCharacter('nile_david_livingstone_scope').GetFirstName] is requesting our funding to complete an expedition to the source of the Nile River, which could settle the controversy over its source and enhance our international prestige."
clever_dsk.172.f:0 "We passed a female slave who had been shot or stabbed and lay on the road: a group of men stood about 100 yards away on one side, and a group of women stood on the other side, watching everything. They said that an Arab had passed by that morning and, angry over the price she had paid, did this because she could no longer walk... Escape, hunger, and death followed; we must once again reaffirm our beliefs: the death rate after these slave wars, coupled with losses during the voyage to the coast and on the way, shows that no more than one in five slaves ever reaches the 'kind masters' in Cuba or elsewhere, and according to slave owners' interpretation of the Bible, this was God's arrangement for them."
clever_dsk.172.a:0 "Great explorers deserve our investment, just like Queen Isabella funded Columbus."
clever_dsk.172.b:0 "Reject funding this pointless expedition."
clever_dsk.173.t:0 "Explorer's Request"
clever_dsk.173.d:0 "[SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFirstName] successfully navigated the Canadian Northwest Passage and is an excellent explorer from our country. Now, [SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFirstName] hopes to do even more for our nation by completing an unprecedented expedition to the South Pole. He is requesting a small amount of funding to purchase fur clothing, sledges, dogs, and other equipment to bring ultimate honor to our homeland."
clever_dsk.173.f:0 "I read Franklin's Arctic expedition story with great interest, which profoundly influenced my life. This Antarctic expedition will not only be a great achievement for our nation but for all of humanity."
clever_dsk.173.a:0 "[SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFullName], our homeland will always be your strongest support."
clever_dsk.173.b:0 "I don’t want another popsicle in Antarctica."
clever_dsk.174.t:0 "The Triumph of the Nile"
clever_dsk.174.d:0 "[SCOPE.sCharacter('nile_david_livingstone_scope').GetFirstName], with the funding of [SCOPE.sCountry('gbr_nile_david_livingstone_scope').GetName], successfully discovered the source of the Nile River, one end from the Ethiopian Highlands and the other from the Central African Mountains, and he also mapped a large portion of the upper Zambezi River."
clever_dsk.174.f:0 "A large portion of my supplies were stolen by local chiefs... despite struggling through the swamp facing Lake Tanganyika, my body was nearly done... though I had to continue with a slave trader, the sight of an unfamiliar large lake revived my spirits, I knew the source of the Nile was nearby."
clever_dsk.174.a:0 "Congratulations to [SCOPE.sCountry('gbr_nile_david_livingstone_scope').GetName]."
clever_dsk.174.b:0 "Their photos must be fake; all the collected samples were surely forged by [SCOPE.sCharacter('nile_david_livingstone_scope').GetFullName] locally."
clever_dsk.175.t:0 "[SCOPE.sCountry('nor_roald_amundsen_return_antarctica_scope').GetName] Reaches the South Pole"
clever_dsk.175.d:0 "[SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFullName], with the funding of [SCOPE.sCountry('nor_roald_amundsen_return_antarctica_scope').GetName], successfully reached the South Pole and safely returned. Despite some strange critics attacking his practice of eating dogs, this great achievement cannot be denied."
clever_dsk.175.f:0 "According to [SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFirstName], his team used skis and dog sleds for transport, killing some dogs along the way to serve as fresh meat. After four days of climbing along an unknown route of the Axel Heiberg Glacier, they finally reached the South Pole. [SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFirstName] excitedly renamed the Antarctic Plateau to Håkon VII Plateau, a glory belonging to [SCOPE.sCountry('nor_roald_amundsen_return_antarctica_scope').GetName]."
clever_dsk.175.a:0 "Congratulations to [SCOPE.sCountry('nor_roald_amundsen_return_antarctica_scope').GetName]."
clever_dsk.175.b:0 "Just luck."
clever_dsk.176.t:0 "Alaska Deal"
clever_dsk.176.d:0 "Out of concern over the potential occupation of Alaska by other European powers and the need to prevent English expansion, [SCOPE.sCountry('rus_sell_alaska_real_scope').GetName] decided to sell Alaska to [SCOPE.sCountry('usa_buy_alaska_real_scope').GetName] in exchange for a large sum of money, with the final price reportedly reaching $7.2 million."
clever_dsk.176.f:0 "The land transaction in Alaska sparked opposition among the people of [SCOPE.sCountry('usa_buy_alaska_real_scope').GetName], with some claiming it was buying a wilderness with taxpayers' hard-earned money, mocking the Secretary of State for spending money on a useless freezer."
clever_dsk.176.a:0 "It’s time to update our map of North America."
pax_britannica_events.142.a:0 "This is an insult to us."
pax_britannica_events.99.t:0 "[SCOPE.sC('britain_scope').GetNameNoFormatting] Hegemony"
pax_britannica_events.99.d:0 "[concept_primary_demand]: [SCOPE.sC('britain_scope').GetName] forces [concept_impose_hegemony] on [GetPlayer.GetName].\n\nIf we refuse, this will trigger [concept_diplomatic_play], which could escalate into [concept_war]."
pax_britannica_events.99a:0 "This means war!"
pax_britannica_events.99b:0 "We have no choice."
modifier_pax_britannica_hegemony_imposed:0 "Hegemony"
pax_britannica_events.1111a.c:0 "The effect will increase with [concept_pax_britannica]."

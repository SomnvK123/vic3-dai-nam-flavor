support_dei_button:0 "Manage Dutch East Indies"
support_dei_button_desc:0 "We have entrusted a significant portion of our population and the lands of the East Indies to our colonial government, and they must remain loyal to us."
not_already_supporting_our_DEI_button:0 "Reduce the tendency towards independence once every five years"
modifier_support_from_net:0 "Influence of the Metropole"
dsk_net_time:0 "Dutch Constitution"
je_Nederland_and_dutch_east_indies:0 "House of Orange-Nassau"
je_Nederland_and_dutch_east_indies_reason:0 "I, [ROOT.GetCountry.GetRuler.GetFirstName] of Nassau, #yellow Prince of Orange#!, King of [SCOPE.GetRootScope.GetCountry.GetName], Grand Duke of [SCOPE.sCountry('lux_scope').GetName], Possessor of [SCOPE.sCountry('dei_scope').GetName], with Germanic blood flowing through my veins, loyal to my country, hold fast to this conviction until death.\n\nI fear God, my Lord, whom I have embraced. My beloved people, my land, are my driving force; God guides me, like a fine tool in my hand. I shall return, to my homeland.\n\nMy afflicted people, my simple folk; though trials may befall, God will not forsake you. Pray fervently, day and night: Let the Lord grant me strength; then I can help you."
we_can_be_aushun:0 "We can form the Austro-Hungarian Empire"
je_Nederland_and_dutch_east_indies_tt:0 "God bless our great King, [ROOT.GetCountry.GetRuler.GetFirstName]"
remove_diet_of_hungary2_tt:0 "Military action has already been initiated against Hungary"
je_Nederland_Alliance:0 "Low Countries Alliance"
je_Nederland_Alliance_reason:0 "Unite the Low Countries [SCOPE.sCountry('bel_scope').GetName] under our banner."
je_Nederland_Shipbuilding:0 "Development of Shipbuilding"
je_Nederland_Shipbuilding_reason:0 "Develop the shipbuilding industry to increase our [SCOPE.sGoods('clippers_scope').GetName] production to support our waterways."
je_Nederland_Shipbuilding_2:0 "Development of Industrial Shipbuilding"
je_Nederland_Shipbuilding_2_reason:0 "The world is stepping into industrialization, transforming our traditional advantage in the shipbuilding industry to increase our [SCOPE.sGoods('steamers_scope').GetName] production."
je_Nederland_king_of_Coachman_tt:0 "Past glory will not fade"
je_Nederland_king_of_Coachman:0 "Coachman of the Seas"
je_Nederland_king_of_Coachman_reason:0 "At that time, world trade routes were mainly at sea. Ships were like carriages for land transportation, and ships were the carriages of the sea. The country that mastered the sea's carriages, [SCOPE.GetRootScope.GetCountry.GetName], played a major role in maritime trade. I am the coachman of the sea. Now, we need to leverage our traditional advantages, control trade routes, and export [SCOPE.sGoods('glass_scope').GetName] and [SCOPE.sGoods('porcelain_scope').GetName] worldwide."
je_Nederland_Japan:0 "Netherlands-Japan Trade Treaty"
je_Nederland_Japan_reason:0 "During the isolation period of [SCOPE.sCountry('jap_scope').GetName], all foreign ships were strictly prohibited from entering the territory, and similarly, all Japanese ships were prohibited from going abroad without the country's approval. Anyone daring to violate this law would be executed.\nHowever, only we could trade in Nagasaki, Japan. After 1641, [SCOPE.sCountry('jap_scope').GetName] only allowed trade with the Netherlands and China in Nagasaki for about two centuries. Japan's understanding of Western culture was limited to the literature brought by Dutch merchants. Before the arrival of other Western powers, monopolizing trade in Nagasaki could bring us great benefits!"
je_Nederland_Empire:0 "Dutch Empire"
je_Nederland_Empire_reason:0 "The Dutch went to Asia, occupied Taiwan, controlled Japan's foreign trade, and Indonesia became their colony; in Africa, they took the Cape of Good Hope from the Portuguese; in Oceania, they named a country after a Dutch province – New Zealand; in South America, they occupied Brazil; and at the mouth of the Hudson River in North America, the Dutch established a new city, New Amsterdam, known today as New York. – In the past 100 years of our history, we were so great and crazy. Now, we finally have the strength to rebuild all of this, return to the pinnacle of the world, singing the brilliant glory of the past."
je_Nederland_Kingdom:0 "Kingdom of the Netherlands"
je_Nederland_Kingdom_tt:0 "Our kingdom, free and fearless"
je_Nederland_Kingdom_goal:0 "Complete three kingdom reforms"
je_Nederland_Kingdom_reason:0 "Since the 15th century, the name Netherlands has been used as the country name. But unlike England or France, this name did not originate from a national name but was derived from a place name. Strictly speaking, Holland refers to a region within the Netherlands, specifically the provinces of North Holland and South Holland. In the era of the United Provinces, Holland was used as a metonym for the Netherlands as a whole. Another common nickname, calling them Dutch, refers to the main ethnic group of the Netherlands, the Nederlanders. This term originated from English, derived from the German word Deutsch, which originally came from the Latin Theodiscus, meaning tribal or people.\nIn 1581, after gaining independence from [SCOPE.sCountry('spa_scope').GetName], [SCOPE.GetRootScope.GetCountry.GetName] developed into a maritime and trade power in the 17th century, with highly developed economy, culture, art, and technology. The number of merchant ships in [SCOPE.GetRootScope.GetCountry.GetName] exceeded the total number of merchant ships in all European countries, earning the title of 'Coachman of the Seas.' We established colonies and trading posts worldwide. This period is known as the 'Golden Age' in the Netherlands. In 1810, the Netherlands was incorporated into [SCOPE.sCountry('fra_scope').GetName]. In 1814, the Netherlands broke away from [SCOPE.sCountry('fra_scope').GetName], and in 1815, we established the #yellow Kingdom of the Netherlands#!.\nThough a small lowland country, we are free and fearless!"
je_Nederland_navy:0 "Royal Navy"
je_Nederland_navy_reason:0 "Develop the Royal Navy to return to the Golden Age!"
je_Nederland_develop:0 "Kingdom Livelihood"
je_Nederland_develop_reason:0 "Improve the lives of our people!"
je_Nederland_government:0 "Kingdom Government"
je_Nederland_government_reason:0 "Reform our government to become a constitutional monarchy!"
je_Nederland_Kingdom_house:0 "Dutch Parliament"
je_Nederland_Kingdom_house_tt:0 "Parliament is functioning"
je_Nederland_Kingdom_house_reason:0 "The 1848 constitution stipulates that the Netherlands is a hereditary constitutional monarchy. Legislative power belongs to the King and Parliament, and executive power is executed by the cabinet.\nFirst Chamber members are fully re-elected every four years, with elections held within three months of provincial council elections.\nSecond Chamber members serve a maximum term of four years. Anyone with voting rights is entitled to form political parties for parliamentary elections. Elections are held when the government loses parliamentary confidence, the ruling coalition collapses, the term of office of members expires, or a ruling coalition cannot be formed. Parties participating in elections must register 43 days before the election and provide a candidate list covering the entire country. The first candidate on the list generally leads the party's campaign. The first candidate of the party with the most seats in the Second Chamber often becomes the Prime Minister. Dutch citizens over 18 have the right to vote, except for prisoners with sentences over one year. Votes can be cast for any candidate.\n\n#yellow Dutch Parliament#! will accumulate #N administrative points#! each month based on #v #tooltippable;tooltip:[Country.GetTooltipTag],je_Nederland_Kingdom_house_pos existing laws#!. Consuming #N administrative points#! allows Parliament to enact policies."
je_Nederland_Kingdom_house_pos: "The following conditions will #bold accumulate#! #N administrative points#! each month:\n• Any #yellow electoral form#! (#+3#!).\n• Any #yellow internal affairs institution#! (#+2#!).\n• Any #yellow health institution#! (#+1#!).\n• Any #yellow welfare institution#! (#+1#!).\n• Any #yellow commoditized agriculture#! or #yellow homestead act#! (#+1#!)."
net_kingdom_navy_button:0 "Develop the Royal Navy"
enough_Nederland_Kingdom_house_var:0 "#N administrative points greater than 50#!"
net_kingdom_navy_button_desc:0 "The Royal Navy represents our ability to operate in distant seas."
dei_colony_gdp_button:0 "Support the Dutch East Indies"
dei_colony_gdp_button_desc:0 "Improving the capabilities of the Dutch East Indies enhances our own capabilities."
alliance_ger_button:0 "Germanic Alliance"
alliance_ger_button_desc:0 "Form a common alliance with countries that share our Germanic blood."
not_alliance_ger_button:0 "Not allied with other Germanic countries"
net_kingdom_navy_tt:0 "This will consume 50 #N administrative points#!. The same policy can only be issued once every five years."
alliance_aus_button:0 "Austrian Alliance"
net_kingdom_gdp_button:0 "Parliamentary Appropriation"
net_kingdom_gdp_button_desc:0 "Parliamentary appropriations support our domestic economic development."
dsk_net.1.t:0 "The Belgian Question"
dsk_net.1.d:0 "Our southern province has been out of our control for six years, with major powers guaranteeing its independence."
dsk_net.1.f:0 "We have two paths before us.\nOne is to accept the mediation of the major powers, recognize the independence of [SCOPE.sCountry('bel_scope').GetName], and develop a new path belonging to [SCOPE.GetRootScope.GetCountry.GetName].\nThe other is to refuse to sign the London Treaty, disregard the obstruction of the major powers, and return to the glorious days of our past empire."
dsk_net.1.a:0 "Policy: Sign the London Treaty"
dsk_net.1.b:0 "Policy: Conquer [SCOPE.sCountry('bel_scope').GetName]"
dsk_net.2.t:0 "Bustling Port City"
dsk_net.2.d:0 "[SCOPE.sState('great_state_scope').GetName] has become a bustling port city after years of our efforts."
dsk_net.2.f:0 "When merchant ships from around the world come here, they marvel at our prosperity."
dsk_net.2.a:0 "This is the era belonging to all the people of [SCOPE.sState('great_state_scope').GetName]."
modifier_NET_develop1:0 "Busy Port"
dsk_net.3.t:0 "Conquerors of the Dutch East Indies"
dsk_net.3.d:0 "[SCOPE.sCountry('dei_scope').GetName] is the crown jewel of our colonies, and no one can shake our position in the East Indies."
dsk_net.3.f:0 "We united the chieftains, tribes, and natives of this place, creating a colonial government loyal only to [ROOT.GetCountry.GetRuler.GetFirstName]."
dsk_net.3.a:0 "Controlling the East Indies with just a few dozen Dutch officials? It's hard to achieve without natural-born slaves."
king_of_Indonesia:0 "Master of the Dutch East Indies"
dsk_net.4.t:0 "Low Countries Alliance"
dsk_net.4.d:0 "[SCOPE.sCountry('bel_scope').GetName] has reconciled with us, and we move forward together."
dsk_net.4.f:0 "[SCOPE.sCountry('bel_scope').GetName] and [SCOPE.GetRootScope.GetCountry.GetName] unite to create everlasting peace for the Low Countries."
dsk_net.4.a:0 "Let us unite."
dsk_net.5.t:0 "Development of Shipbuilding"
dsk_net.5.d:0 "We successfully increased our domestic [SCOPE.sGoods('clippers_scope').GetName] production to new heights."
dsk_net.5.f:0 "This is the honor belonging to all the hardworking people of [SCOPE.GetRootScope.GetCountry.GetName]."
dsk_net.5.a:0 "Our [SCOPE.sGoods('clippers_scope').GetName] is being sold worldwide."
modifier_NET_clippers:0 "Prosperous Shipbuilding"
dsk_net.6.t:0 "Modern Shipbuilding Industry"
dsk_net.6.d:0 "We successfully increased our domestic [SCOPE.sGoods('steamers_scope').GetName] production to new heights."
dsk_net.6.f:0 "This is the honor belonging to all the hardworking people of [SCOPE.GetRootScope.GetCountry.GetName], establishing a modern shipbuilding industry system for our country."
dsk_net.6.a:0 "Our [SCOPE.sGoods('steamers_scope').GetName] is being sold worldwide
dsk_net.7.t:0 "Return to the Coachman of the Seas"
dsk_net.7.d:0 "We have successfully increased our domestic [SCOPE.sGoods('glass_scope').GetName] and [SCOPE.sGoods('porcelain_scope').GetName] production to new heights."
dsk_net.7.f:0 "This is the honor belonging to all the hardworking people of [SCOPE.GetRootScope.GetCountry.GetName], allowing us to return to the golden age."
dsk_net.7.a:0 "Our [SCOPE.sGoods('steamers_scope').GetName] is being sold worldwide."

net_bianliang:0 "#N Special Laws of the Netherlands#!"
modifier_NET_Coachman:0 "Return to the Coachman of the Seas"
law_Coachman:0 "Coachman of the Seas"
law_Coachman_desc:0 "[SCOPE.GetRootScope.GetCountry.GetName] is located by the Atlantic Ocean, with a developed handicraft industry but scarce natural resources and a small local market. Many Dutch people engage in commercial activities around the world, earning a lot of money. The Netherlands thus became one of the wealthiest regions in Europe."
dsk_net.8.t:0 "Netherlands-Japan Trade Treaty"
dsk_net.8.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] signs an investment agreement with [SCOPE.sCountry('jap_scope').GetName]."
dsk_net.8.f:0 "This is of epoch-making significance, granting us exclusive trade and business rights in Japan."
dsk_net.8.a:0 "A step ahead of other Western powers."
modifier_Nagasaki:0 "Nagasaki Dutch Trading Post"
dsk_net.9.t:0 "Dutch Empire"
dsk_net.9.d:0 "After reclaiming our lost territories, we can decide the fate of our largest colony!\n[SCOPE.sCountry('dei_scope').GetName] has long been troubled by the management of the East Indies, with the colonial government always in deficit. We can have the local governor surrender power and have the kingdom government take direct control!"
dsk_net.9.f:0 "The next day, the governor of [SCOPE.sCountry('dei_scope').GetName] submitted his resignation, announcing the transfer of authority to [SCOPE.GetRootScope.GetCountry.GetName]'s [ROOT.GetCountry.GetRuler.GetFirstName], meaning we can personally manage this vast territory."
dsk_net.9.a:0 "From now on, this will be directly governed by the royal family."
dsk_net.9.b:0 "Let me think about it."

dsk_net.10.t:0 "Dutch Revival"
dsk_net.10.d:0 "Kingdom's reforms have rejuvenated [SCOPE.GetRootScope.GetCountry.GetName]."
dsk_net.10.f:0 "A freer, more equal, and loving nation has emerged on the European continent, proving our unique values to the world."
dsk_net.10.a:0 "Now we can convene the kingdom's parliament."

dsk_net.11.t:0 "The Reborn Kingdom"
dsk_net.11.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] is our kingdom, free and fearless."
dsk_net.11.f:0 "Kingdom has been independent from [SCOPE.sCountry('fra_scope').GetName] for 21 years, but 6 years ago, our richest southern province separated from us. Now, our national GDP lags far behind other European powers. We need to adapt to the changing external environment and reform the internal government."
dsk_net.11.a:0 "Action must start now."
dsk_net.12.t:0 "Reform the Royal Navy"
dsk_net.12.d:0 "The Royal Navy of [SCOPE.GetRootScope.GetCountry.GetName] is invincible."
dsk_net.12.f:0 "We are not inferior to other powers, and our warships sail in the Atlantic and Pacific."
dsk_net.12.a:0 "Excellent."
modifier_NET_navy:0 "Dutch Navy"
dsk_net.13.t:0 "Improve the Kingdom's Livelihood"
dsk_net.13.d:0 "The residents of [SCOPE.GetRootScope.GetCountry.GetName] live increasingly prosperous lives, and the people live and work in peace and contentment."
dsk_net.13.f:0 "National prosperity and people's well-being are my synonyms."
dsk_net.13.a:0 "Excellent."
modifier_NET_develop:0 "Dutch Livelihood"
dsk_net.14.t:0 "Reform the Kingdom's Government"
dsk_net.14.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] has the world's most free and democratic government."
dsk_net.14.f:0 "We are not inferior to other powers, and our democratic values are at the forefront of the times."
dsk_net.14.a:0 "Excellent."
modifier_NET_government:0 "Dutch Democracy"
modifier_net_kingdom_gdp:0 "Economic Policy"
modifier_net_kingdom_navy:0 "Naval Training"
modifier_dei_colony_gdp:0 "Colonial Aid"

control_Ryukyu_button: "Control Ryukyu"
control_Ryukyu_button_desc: "The Ryukyu Islands are important islands in the Far East, adjacent to China, Korea, Japan, and the Philippines. By acquiring them, we can establish a foothold in the Far East! And they will ultimately belong to our great nation."
dsk_manifest_destiny_sea_goal: "Gain control of four regions in the Far East"
open_japan_button:0 "Open Japan"
open_japan_button_desc:0 "Our great nation has completed the conquest of the American continent. At this moment, the distant island nation in the East remains in a state of seclusion. We should dispatch our fleet to pay a friendly visit to them."
gov_mikado: "Government of His Majesty the Emperor"
gov_mikado_desc: "Under this [concept_government_type], the nation is ruled by the 'line of emperors unbroken for ages eternal' [Concept('concept_ruler','$RULER_TITLE_MIKADO$')]. The Emperor has no surname and is given a posthumous name after passing away.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
RULER_TITLE_MIKADO: "His Majesty the Emperor"
RULER_TITLE_HEIR_MIKADO: "Crown Prince"
gov_jap_empire: "Empire of Japan"
gov_jap_empire_desc: "Under this [concept_government_type], the nation is ruled by the 'line of emperors unbroken for ages eternal' [Concept('concept_ruler','$RULER_TITLE_MIKADO$')]. The Emperor is the symbol of the Empire, and his subjects should dedicate themselves to the sacred war for the Empire.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
america_flavor.2.t:0 "Native American Issue"
america_flavor.2.d:0 "Since the establishment of our nation, large areas of Native American settlements remain within our borders."
america_flavor.2.f:0 "Should we drive them to the reservations or respect their wishes?"
america_flavor.2.a:0 "Our hands are stained with the blood of the natives."
open_china_button: "Open Door Policy"
open_china_button_desc: "After handling affairs in the Americas, our great nation should seek new opportunities in the ancient land of the East. Everyone gets a share, first come first served! We will also share the rights in China with the European powers!"
modifier_open_china: "Open Door Policy"
dsk_manifest_destiny_sea: "Raging Seas"
dsk_manifest_destiny_sea_reason: "In the vast ocean, there surges an unparalleled force, the United States Navy. Whether in the calm Pacific or the stormy Atlantis Sea, our fleet patrols every corner of the world, defending freedom and peace. Its unrivaled strength not only comes from advanced technology and equipment but also from its exceptional strategic thinking and indomitable spirit. From the glorious American land to the vast depths of the Pacific Ocean, [SCOPE.sCountry('usa_scope').GetName] controls everything."
dsk_manifest_destiny_desc: "It is our manifest destiny that our great nation becomes the maritime hegemon."
The_first_island_chain: "First Island Chain Blockade"
modifier_control_Ryukyu: "Control Ryukyu"
modifier_control_phi: "Control the Philippines"
modifier_control_kor: "Control Korea"
america_flavor.3.t:0 "Eagle of the Pacific"
america_flavor.3.d:0 "This time, no one can shake us."
america_flavor.3.f:0 "From the long river of human history, we can see that whether it was the ancient Athenian Navy or the modern Royal Navy of Britain, they all shone brilliantly in their respective eras. However, no navy has ever possessed the unparalleled dominance of today's United States Navy."
america_flavor.3.a:0 "The American fleet controls the seas!"
control_alaska_button: "Control Alaska"
control_alaska_button_desc: "Alaska is the northernmost territory of the American continent. Acquiring it grants us the rights to explore the Arctic! And it will ultimately belong to our great nation."
control_phi_button: "Control the Philippines"
control_phi_button_desc: "After handling affairs in the Americas, the urgent task is to cut a piece of flesh from the most decadent country in Europe!"
control_kor_button: "Control Korea"
control_kor_button_desc: "Our vassal state in the distant East will be grateful that we have liberated them and brought them democracy!"
modifier_the_belle_epoque: "Encourage childbearing"
law_nazi_highpolice: "SS"
law_nazi_highpolice_desc: "The SS, also known as the 'Armed SS', was the armed force of the Nazi Party in Germany. It evolved from the Nazi Party's Schutzstaffel established in 1925. After Germany's Blitzkrieg into Poland in 1939, it became a composite armed force of various branches."
jizhongying: "Expansion of Concentration Camps"
ideology_nazi: "Nazism"
ideology_nazi_desc: "#lore Nazism is a form of fascism, referring to the practices and ideology of Adolf Hitler and the Nazi Party in Nazi Germany from 1933 to 1945. It is primarily characterized by radical anti-Semitism, racism, nationalism (chauvinism), populism, anti-Christianity, social Darwinism, anti-communism, and opposition to freedom and democracy#!"
law_Schutzstaffel: "Wehrmacht Oath"
law_Schutzstaffel_desc: "I swear by God this sacred oath: to obey the orders of Adolf Hitler, the Supreme Commander of the Armed Forces, and to be a brave soldier of the German Reich, to pledge my life to this oath, and to sacrifice it if necessary"
dsk_aus.49.t: "SS"
dsk_aus.49.d: "[SCOPE.sCharacter('dark_army_general').GetFullName] has reorganized [SCOPE.gsInterestGroup('dark_army_ig').GetName] into the SS of our emerging fascist government, ensuring the implementation of our dictatorship"
dsk_aus.49.f: "In the face of the opposition from the Reds and evil factions, we need a strong and loyal army to defend the stability of our regime at all times. As an emerging fascist regime, our road is still long."
dsk_aus.49.a: "For the Party! For [SCOPE.GetRootScope.GetCountry.GetName]!"
dsk_aus.50.t: "Nazis Seize Control of the Group"
dsk_aus.50.d: "A figure in [SCOPE.gsInterestGroup('nazi_ig').GetName] has become the leader of the party"
dsk_aus.50.f: "We will fight for the blood of our German people to the last moment!"
dsk_aus.51.t: "[SCOPE.sCharacter('gaixin').GetFullName] Changes Ideology"
dsk_aus.51.d: "He said: One of the purposes of Nazism is to make capital serve the nation, not to let the capital of international Jewish groups manipulate the nation. Only the greatness, freedom, and development of the nation can make capital contribute to the country, that is, to the entire nation."
dsk_aus.51.f: "We will fight for the blood of our German people to the last moment!"
dsk_aus.52.b: "Say such things at this time? When bread sells for 500,000 marks, even street dogs will raise their right hands at a 45-degree angle"
dsk_aus.53.t: "Expansion of Concentration Camps"
dsk_aus.53.d: "Leader, how should we deal with these Jews?"
dsk_aus.53.f: "Pull them all into the concentration camps, take away their rings, knock out their gold teeth, shave off their hair! Turn them into soap!"
dsk_aus.53.a: "Jews, what does it feel like to be homeless and adrift?"
Schutzstaffel_tt: "We Reorganize the Army into the SS"
ig_Schutzstaffel: "SS"
ig_Schutzstaffel_desc: "The SS was one of the formations within the Nazi Party in Germany used for security service, alongside the SA, the combat branch of the Nazi Party. It was another Nazi Party organization responsible for intelligence, surveillance, interrogation, and execution."
conquer_Europe:0 "Conquering Europe"
RA_geng_xin:0: "RA Update for June 21st"
RA_geng_xin_reason:0: "#v New Content#!#blue Belgian Themed Pack#! contains 140 events and 14 journal entries
1. The Taiping Rebellion can no longer spawn if China is a republic.
2. Lowered the requirements for the AI to form the Empire of Japan.
3. Fixed time desync issues caused by outdated script syntax in entries such as Unmatched Mountains and Seas.
4. Restored Prussia’s pre-1.13 diplomatic bias; it will no longer prioritize seizing Austrian territories."
dlc_ra_plus:0 "RA Historical Timeline"
dlc_ra_plus_desc: "This DLC does not require purchase. It additionally includes 500 dynamic country names, 500 dynamic national flags, 10 sets of flavor costumes, 500 historical characters (No.1 in V3), 800 flavor logs (No.1 in V3) and 3000 flavor events, and makes AI countries develop as much as possible in accordance with the historical timeline\n\n#emphasis @green_checkmark! DLC #p Enabled#!."

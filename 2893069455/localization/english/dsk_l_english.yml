world_war_0_reason:0 "World War I (August 1914 to November 1918) was a world war that mainly occurred in Europe but spread across the globe. At that time, most countries in the world were involved in this war. The war was primarily fought between the Central Powers and the Allied Powers. The German Empire, Austro-Hungarian Empire, and Italy were part of the Central Powers, while the United Kingdom, France, Russian Empire, and Serbia were part of the Allied Powers. Between 1914 and 1918, many countries in Asia, Europe, and the Americas joined the Allied Powers. The battlefields were mainly in Europe. It's noteworthy that although Italy was initially part of the Central Powers, later, the UK, France, and Russia signed a secret treaty with Italy, promising it certain territories, resulting in Italy joining the Allied Powers against the Central Powers. This war was one of the most destructive in European history. Approximately 65,000,000 people participated, with around 10,000,000 losing their lives and 20,000,000 being injured. The spark that ignited the war was the Sarajevo incident in June 1914, with the fronts mainly divided into the Eastern Front (Russia vs. Germany and Austria-Hungary), the Western Front (France and the UK vs. Germany), and the Southern Front (also known as the Balkan Front) (Serbia vs. Austro-Hungarian Empire). The Western Front was the most brutal, with famous battles such as the Battle of the Marne, the Battle of Verdun, and the Battle of the Somme."


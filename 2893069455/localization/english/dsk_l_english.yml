dsk_ita.12.t:0 "Carmine Crocco"
dsk_ita.12.d:0 "During the Expedition of the Thousand, #yellow Garibaldi#! promised to forgive deserters in exchange for military service. [SCOPE.sCharacter('gaixin').GetFirstName] joined #yellow Garibaldi#!'s army, hoping for amnesty and other rewards. Contrary to the promises made by the Italian government, [SCOPE.sCharacter('gaixin').GetFirstName] did not receive any medals or honors, and was arrested for involvement in illegal activities."
dsk_ita.12.f:0 "With the help of a noble family in the South, [SCOPE.sCharacter('gaixin').GetFirstName] managed to escape. Disillusioned with the lies of the new Italian government, and persuaded by nobles and local clergy connected to the Bourbon dynasty, [SCOPE.sCharacter('gaixin').GetFirstName] joined the southern rebellion. With the support of war and the illicit funds of anarchists, he recruited a 2,000-strong army and began a resistance movement under the banner of the old Two Sicilies kingdom."
dsk_ita.12.a:0 "Bandits cannot be pardoned for their crimes just because they participated in national unification."

dyn_c_republic_1_SIC:0 "Two Sicilian Free Legion"

je_dsk_italy_reform:0 "North-South National Reform"
je_dsk_italy_reform_reason:0 "The ink on the #bold Alberto Constitution#! was barely dry when [ROOT.GetCountry.GetRuler.GetFullName]’s bayonets had already pierced the volcanic ash of Calabria.\n\n[SCOPE.sCharacter('ig_armed_forces_leader_scope').GetFullName]’s suppression report reads: #italic 'For every bandit hanged, ten farmers with torches rise'#!—at this moment, the #variable Bourbon exiles#! were sending British-made Enfield rifles to #yellow Carmine Crocco#! via Malta Bank.\n\nIn the Turin Parliament, Count [SCOPE.sCharacter('ig_landowners_leader_scope').GetLastName] waved the Southern land tax register: #bold 'These savages can’t even spell Latin letters—how can they implement the Piedmontese Code?'#!\n\nThe [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] ultimately signed the 'Special Security Law', creating two sets of rules: the Northern provinces adopted #variable 'Cavour Reforms'#! to link Northern industrial unions with the [concept_market], while the Southern war zones implemented #variable 'Lamar Mola Clause'#!, authorizing the army to execute suspects without trial.\n\n#yellow Garibaldi#! shouted in Parliament: #italic 'This is not unification, it is conquest!'#! But the royal arsenal proved his impotence—the output of new carbines had outpaced the insurgents' weapons by #green 20 times#!.\n\nWhen #yellow Pope Pius IX#! released a dove of curse from the Vatican, [SCOPE.sCharacter('ig_intelligentsia_leader_scope').GetLastName] wrote in the 'Renaissance Report': #bold 'The snowmelt of the Alps will eventually quench the fury of Vesuvius, even if it costs a generation's blood.'#!"


je_Nederland_Amsterdam:0 "Shining Amsterdam"
je_Nederland_Amsterdam_reason:0 "Since the 18th century, Amsterdam's prosperity began to fade. [SCOPE.GetRootScope.GetCountry.GetName] experienced repeated wars with [SCOPE.sCountry('gbr_scope').GetName] and [SCOPE.sCountry('fra_scope').GetName], which struck the peak of [SCOPE.sState('great_state_scope').GetName]. It wasn't until 1815, when [SCOPE.GetRootScope.GetCountry.GetName] shook off the rule of [SCOPE.sCountry('fra_scope').GetName] and formed the Kingdom of the Netherlands with [SCOPE.sCountry('bel_scope').GetName] and [SCOPE.sCountry('lux_scope').GetName], that the city saw a second spring of development. With the advent of the Industrial Revolution on the European continent and the era of maritime navigation, it is necessary for us to ride the fast train of the times and build our [SCOPE.sState('great_state_scope').GetName] into a bustling port city of Europe."
je_Nederland_Amsterdam_tt:0 "Accelerate the construction of [SCOPE.sState('great_state_scope').GetName]"
je_Nederland_Coachman:0 "Master of [SCOPE.sCountry('dei_scope').GetName]"
je_Nederland_Coachman_reason:0 "In 1596, a fleet led by our Captain Houtman arrived at Banten on the island of Java. In the following decades, we continuously established trading posts on this land. Until 1799, after the dissolution of the East India Company, the colony was taken over by the [SCOPE.GetRootScope.GetCountry.GetName] government, historically known as [SCOPE.sCountry('dei_scope').GetName], abbreviated as Dutch East Indies. The colonial authorities long pursued a dual policy of commercial monopoly and colonial expansion. [SCOPE.sCountry('dei_scope').GetName] provided us with countless treasures and jewels. We will also ensure that our rule over its territory leads other European powers."
je_Nederland_Coachman_tt:0 "We rule the East Indies"
je_Nederland_Make_Great_Again_tt:0 "Rebuild the United Kingdom of the Netherlands"

gov_ita_kingdom: "Kingdom of Italy"
gov_ita_kingdom_desc: "This [concept_government_type] revolves around the House of Savoy, operating under the 1848 Albertine Statute. The [Concept('concept_ruler','$RULER_TITLE_RE_D_ITALIA$')] serves as both head of state and commander-in-chief, exercising power through appointing prime ministers and ratifying laws. The crown prince holds the title of 「$RULER_TITLE_PRINCIPE_DI_PIEMONTE$」, with succession following Salic law.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

# 法西斯意大利帝国 
gov_ita_empire: "Fascist Italian Empire"
gov_ita_empire_desc: "This distorted [concept_government_type] nominally retains [GetLawType('law_monarchy').GetName], but real power resides with the [Concept('concept_ruler','$RULER_TITLE_DUCE$')]. Although the [Concept('concept_ruler','$RULER_TITLE_RE_D_ITALIA$')] remains the legal symbol of state, all decisions must align with the Fascist Grand Council. The succession system persists only as a hollow formality.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

# 法西斯罗马帝国
gov_roman_empire: "Fascist Roman Empire"
gov_roman_empire_desc: "This [concept_government_type] claims the legacy of ancient Rome through the totalitarian rule of the [Concept('concept_ruler','$RULER_TITLE_DUCE_IMPERATORE$')]. Under the banner of 「Restoring Augustus' Glory」, the [Concept('concept_ruler','$RULER_TITLE_DUCE_IMPERATORE$')] simultaneously serves as Chairman of the Fascist Grand Council and Supreme Commander, while the figurehead [Concept('concept_ruler','$RULER_TITLE_RE_D_ITALIA$')] retains merely symbolic authority.\n\n$TRANSFER_OF_POWER_NAME_DESC$"


 je_danubia_reason:0 "Following the collapse of the Holy Roman Empire, as well as the Napoleonic Wars, the [ROOT.GetCountry.GetRuler.GetLastName] dynasty has established one of Europe's largest empires. If [COUNTRY.GetName] loses control of the [ROOT.GetCountry.GetAdjective] homelands, the German rule may dissintegrate."

je_italia_our_sea:0 "Only through Blood, Italia"
je_italia_our_sea_reason:0 "#v The waves of the Mediterranean are rewriting history#!——\n\nAt #yellow Taranto Naval Base#!, naval engineers are building the outfitting dock for a new battleship using #bold marble from the Carthage ruins#!. Students from the Trieste Naval Academy are learning to navigate with #bold ancient Roman sea charts#!, marking the 'Vesuvius eruption track'#! as the best route for submarine concealment.\n\nAn archaeological team on #yellow Pantelleria Island#! has discovered #bold Augustus' fleet#!'s bronze ram, and the fascist youth immediately installed replicas on the #italic motor torpedo boats#!. Mussolini personally approved: using #bold Libyan colonial oil revenue#! to cast #yellow 100 bronze statues of Neptune#!, each with miniature #italic Adriatic Sea sandboxes#! as its pupils.\n\nWhen the #bold St. Paul#! cruiser carried mafia exiles to Tunisia, sailors wrote on the deck with tar: 'Every drop of sea water will become the concrete of the Third Rome.'"

dsk_ita.58.t:0 "#yellow Mussolini#! Stirs up pro-war sentiment"
dsk_ita.58.d:0 "In 1914, at the editorial office of the #yellow Milan People's News#!, Mussolini slammed a #bold Prussian steel helmet#! onto a typesetting machine, with molten lead scattering as the headline 'War is Revolution' was printed. He commanded young members to roll #bold Austrian beer barrels#! into the square and set them off, with shouts of 'Wash away the shame of the Triple Alliance with blood.'"
dsk_ita.58.f:0 "#yellow Mussolini#! was a journalist and Socialist Party member in his early years. When World War I broke out, he was expelled from the Italian Socialist Party for advocating Italy's entry into the war."
dsk_ita.58.a:0 "Tolerate the passion of these 'patriots'"
dsk_ita.58.b:0 "This is lawlessness!"
dsk_ita.59.t:0 "Blackshirt Riots"
dsk_ita.59.d:0 "In 1920, in front of the city hall of #yellow Bologna#!, the Blackshirts gave socialist deputies a 'baptism' with #bold castor oil barrels#!. They dismantled #bold tram tracks#! to make iron clubs and swore oaths in front of Dante's tomb."
dsk_ita.59.f:0 "The Blackshirts were inspired by Garibaldi's Redshirts and were organized by Mussolini as a military tool for his political activities. The primary members of the Blackshirts were nationalist intellectuals, young landowners opposing the farmers and trade unions, veterans, and some members of the Arditi (elite Italian troops from World War I). As Mussolini's power grew, their behavior became increasingly brutal, using violence and threats against Mussolini's opponents."
dsk_ita.59.a:0 "Acknowledge them as maintainers of order"
dsk_ita.59.b:0 "We must strike these thugs hard!"

# Fascist Combat Squad
dsk_ita.60.t:0 "Fascist Combat Squad"
dsk_ita.60.d:0 "Due to the post-war problems of strikes, social unrest, and the collapse of parliament, [SCOPE.sCharacter('fascist_character_scope').GetLastName] organized a new movement. His 'Combat Fascists' sought to fight against liberal and communist forces through aggressive nationalism and strict military training."
dsk_ita.60.f:0 "Mussolini, in pursuit of his political ambitions, established a semi-military organization, the Fascist Combat Squad, in March 1919 in Milan. In November 1921, the National Fascist Party was formally established, with the principle of fascist state supremacy and the duty of each individual to execute the state's decisions."
dsk_ita.60.a:0 "All of Italy will heed the call of Fascism!"
dsk_ita.60.b:0 "This is anarchy!"

# Blackshirt Revenge
dsk_ita.61.t:0 "Blackshirt Revenge"
dsk_ita.61.d:0 "In 1922, at #yellow Ancona Port#!, the Blackshirts used #bold fishing mines#! to rig a fire train, and after kidnapping the mayor of [SCOPE.sState('south_italian_state').GetName], they declared the city under their control."
dsk_ita.61.f:0 "The Marine Corps shelled the mob who were hijacking the train."

# March on Rome
dsk_ita.62.t:0 "March on Rome"
dsk_ita.62.d:0 "On October 28, 1922, [SCOPE.sCharacter('fascist_character_scope').GetLastName] ordered a national mobilization, with the highest command issuing a proclamation to the people, announcing the march on Rome, advising the police not to fight, and stating that their goal was merely to overthrow the decaying ruling class. They urged the bourgeoisie not to fear and claimed that they would protect the legitimate rights of workers and peasants. They declared that the Fascist Party was loyal to the monarchy and sought to align with Italy's royalists to reduce resistance to seizing power."
dsk_ita.62.f:0 "“Fascisti! All of Italy:\n\nThe time for battle has come! Four years ago, our army achieved the final victory in the Great War. Today, the Blackshirts will march on Rome, bringing this victory to the Eternal City. From today onwards, the Fascists announce a temporary state of emergency, and all military, political, and administrative offices will be directed by the four corps commanders in a dictatorial manner.” -[SCOPE.sCharacter('fascist_character_scope').GetLastName]"
dsk_ita.62.a:0 "“[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName] summons you to Rome, as they intend to entrust you with the responsibility of forming the new government. Thus, this is your greeting.”"

king_of_greece:0 "King of Greece"
emperor_of_rom:0 "Emperor of Rome"
mussolini_is_hear_tt:0 "#yellow Mussolini#! in government"
fascist_flag_tt:0 "Change our country name and flag to #o Italian Empire#!"

dsk_ita.63.t:0 "Our Sea"
dsk_ita.63.d:0 "The Senate and the People of Rome"
dsk_ita.63.f:0 "On the peak of Vesuvius, molten gold from the earth forms an eagle's emblem, as the heavens cast a bronze urn in the shape of the Roman legions' spirit. From Carrara’s marble to the ash of volcanoes, the Temple of Jupiter is reborn. The bronze cannons of Ethiopia are engraved with: ‘Where the cannonball lands, there too shall the shadow of our eagle flag.’\n\nIn the plains of Apulia, the plow shall shine again, as the Via Traiana is restored to its former glory. The old stones of ancient Roman walls are now paved by Fiat wheels, and the treasures of the Crusaders are embedded in the roads. Mussolini decreed: ‘Every new road shall bear the marks of our ancient porcelain, so that the wheels may trample upon history’s dust.’\n\nThe port of Taranto now hosts the newest siege machines, hurling firebombs like stars. The naval logbook reads: ‘With the poetry of Virgil, we reassert our dominion over the Mediterranean.’\n\nIn the grain silos of Sicily, the copper mines of Sardinia, the watchtowers of Corsica—none of these shall be lost to the nation. From Gallia to Iberia, to Athens and Nicaea, we shall reclaim them all as our legacy. Should the lighthouse of Alexandria dim, our bread will fail.\n\nAlas! Three continents meet, five seas must converge—only through iron and blood can we unite them. The archaeological spade and machine gun now dance together, as marble and blood congeal into memorial stones. The Senate may return, but it echoes with the march of military boots upon ancient bricks. The Tiber's murky waves carry the dream of the Empire, along with the new corpses of our enemies, towards the Tyrrhenian Sea."
dsk_ita.63.a:0 "Glory to all the people of [ROOT.GetCountry.GetAdjective]"

je_italia_our_sea_tt:0 "Is all the world not our domain?"
clever_dsk.177.t:0 "The Habsburg Monarch's Plea"
clever_dsk.177.d:0 "As we unified almost the entire German-speaking world, the #yellow Habsburg#! nobles who lost all their lands were forced to leave the palaces they had inhabited for generations. The once magnificent Schönbrunn Palace and Prague Castle now seemed particularly dull. When our soldiers removed the portraits of Habsburg monarchs from the palaces and seized the lands of Styria and Tyrol, a group of nobles from southern Germany who had lived there for generations expressed resentment, and calls for the restoration of the #yellow Habsburg#! monarchy emerged."
clever_dsk.177.f:0 "Franz Joseph and other Habsburg nobles plead with us to return their ancestral palaces and other property. In return, they promise to help us pacify the newly incorporated southern German nobility. Some officials suggest that we may consider ceding a city to the Habsburgs, given their family wealth is concentrated in #yellow Vienna#! and #yellow Prague#!, and grant them the title of city lord."
clever_dsk.177.a:0 "The Austrian Archduke can regain his property in #yellow Vienna#!."
clever_dsk.177.b:0 "The King of Bohemia will return to his loyal #yellow Prague#!."
clever_dsk.177.c:0 "These are the common property of the Germans; the #yellow Habsburg#! family will receive nothing."
socialist_revolution_events.2.b:0 "I am not ready to build socialism!"
clever_dsk.178.t:0 "Naval Defense vs. Border Defense?"
clever_dsk.178.d:0 "During the recent wars with the foreign devils, many officials witnessed the decisive role of naval power on the battlefield. Governor [SCOPE.sCharacter('chi_haijun_lihongzhang_benefactor').GetFullName] suggests that our naval defense is underprepared and urgently needs funds, advocating for reallocating border defense funds towards strengthening naval defense. Meanwhile, Governor [SCOPE.sCharacter('chi_lujun_zuozongtang_benefactor').GetFullName] believes the northern Russian threat is more dangerous, and not reinforcing border defenses would leave us vulnerable to incursions."
clever_dsk.178.f:0 "\"Xinjiang remains safe, though its strategic importance is undiminished. However, neglecting the seas will bring much greater threats from the Russian bear—whether by land or sea, their forces will ravage our heartlands.\"\n\n\"I do not deny [SCOPE.sCharacter('chi_haijun_lihongzhang_benefactor').GetFirstName]’s point; the East demands naval defense, the West calls for border defense. We must prioritize both. Without additional border defenses, the Russians could strike Beijing from either direction, a far graver threat than the English or French who, like sickness, remain distant.\""
clever_dsk.178.a:0 "Approve [SCOPE.sCharacter('chi_haijun_lihongzhang_benefactor').GetFullName]'s proposal."
clever_dsk.178.b:0 "[SCOPE.sCharacter('chi_lujun_zuozongtang_benefactor').GetFullName] is right."
clever_dsk.178.c:0 "Both of you leave immediately."
orleanist_flavor.3.t:0 "The Omen of Revolution"
orleanist_flavor.3.d:0 "A group of Parisian mobs stormed the parliament hall, shouting: No king, no regent. Long live the republic! This is clearly the work of agitators attempting to defame our Orléanist family."
orleanist_flavor.3.f:0 "We’ve already granted them extensive democratic rights, yet these ungrateful petty bourgeois dare to cause chaos in the parliament hall simply because of a poor harvest?\n\nYour Majesty, the commoners have now occupied the Tuileries and Bourbon Palaces. If we don't make a decision soon, it may end in a repeat of Louis' beheading."
orleanist_flavor.3.a:0 "Perhaps it would be better to compromise sooner."
orleanist_flavor.3.b:0 "How dare they revolt?"
china_borders.15.b:0 "Abandon the idea of the Northern Ridge Province and instead spend some money to help the local people."
china_borders.16.b:0 "Modern technology is sufficient for us to govern areas once only nominally controlled. There is no need to establish traditional protectorates anymore. Whether it’s the Khitan, the Timurids, or the descendants of the Seljuks, we will treat them equally."
bc_finish.8.t:0 "The Entente Victory Parade"
bc_finish.8.d:0 "The nightmarish war has finally ended. Under the leadership of [SCOPE.sCountry('gbr_and_fra_win_wwi_come_scope').GetName], the Entente soldiers participated in a grand victory parade in Brussels to commemorate this great triumph. Our respected [SCOPE.sCharacter('gbr_and_fra_win_wwi_scope').GetFullName] was invited to attend the parade."
bc_finish.8.f:0 "The victory of France belongs to every soldier who bled in the trenches, to every mother who supported from the home front. Today, we bury the ambitions of the German Empire in the ashes. But peace is not the end, it is a new struggle—we must make this land bloom with hope once more."
bc_finish.8.a:0 "To our victory, cheers!"
clever_dsk.179.t:0 "Exile to Siberia"
clever_dsk.179.d:0 "It is clear that our prison in [SCOPE.sState('beautiful_siberan_arrive_state').GetName] can no longer hold so many prisoners. [SCOPE.sCharacter('rus_ruler_make_people_love_siberian').GetFirstName] has decided to send some of the prisoners to the vast 'frontiers' to suffer the harsh winters and poor conditions, but there is indecision on which type of prisoners to send."
clever_dsk.179.f:0 "In the name of the Tsar of all Russia, you are hereby sentenced to lifetime exile in Siberia, to atone for your crimes through forced labor until your death. Remember, your crime is not only treason against the Tsar but sacrilege against God. Exile to [SCOPE.sState('beautiful_siberan_welcome_state').GetName] is an opportunity for you to repent—only by cleansing your soul in the harsh land will you be redeemed."
clever_dsk.179.a:0 "It’s time to send those rebellious nobles to Siberia for some serious reflection."
clever_dsk.179.b:0 "These criminal peasants will be sent straight to [SCOPE.sState('beautiful_siberan_welcome_state').GetName]."
clever_dsk.179.c:0 "Let the lower classes of foreign nations clear the frontier for us."
clever_dsk.179.i:0 "Pardon their crimes and let them remember the mercy of [SCOPE.sCharacter('rus_ruler_make_people_love_siberian').GetFirstName]’s father."
clever_dsk.179.j:0 "Exile all criminals, but pay for their migration fees, so that these criminals will be forever grateful to [SCOPE.sCharacter('rus_ruler_make_people_love_siberian').GetFirstName]."
not_russian_angry_tt:0 "This will cause local lower classes to become more radical."
clever_dsk.180.t:0 "The Somali Land Deal"
clever_dsk.180.d:0 "[SCOPE.sCountry('new_ita_want_somali_scope').GetName] has proposed buying the Somali region from us, claiming they have the ability to turn Somalia into a beautiful city comparable to those in Europe. They offered a price of @money!#yellow 1M#!."
clever_dsk.180.f:0 "Once this is accomplished, the Somali region will become a new Rome, with rich tourism facilities, high-end pizza cuisine, and the best services. Ports, cities, and roads will rise, and it will quickly become the paradise that God intended it to be."
clever_dsk.180.a:0 "Agree to [SCOPE.sCountry('new_ita_want_somali_scope').GetName]'s request."
clever_dsk.180.b:0 "[SCOPE.sCountry('new_ita_want_somali_scope').GetName] clearly does not understand its place. They will get nothing."
clever_dsk.181.t:0 "[SCOPE.sCharacter('chi_zhangzhidong_gongsi_benefactor').GetFullName] Petition"
clever_dsk.181.d:0 "Governor of Huguang, [SCOPE.sCharacter('chi_zhangzhidong_gongsi_benefactor').GetFullName], after visiting several Western countries, brought back many machines and equipment. To better develop the Self-Strengthening Movement, he petitions [SCOPE.sCharacter('chi_junzhu_jieshou_benefactor').GetFullName] to allocate funds for building a large-scale armaments factory in his hometown of Hanyang."
clever_dsk.181.f:0 "I, [SCOPE.sCharacter('chi_zhangzhidong_gongsi_benefactor').GetFirstName], have encountered great difficulties in purchasing firearms, warships, machine tools, etc. in England, France, and Germany. It is difficult to procure even a thousand guns, let alone the necessary funds. If we build our own factory, we will no longer be dependent on foreign powers. I ask Your Majesty to approve my petition for funds to establish an armaments factory."
clever_dsk.181.a:0 "Approve [SCOPE.sCharacter('chi_zhangzhidong_gongsi_benefactor').GetFullName]'s request."
clever_dsk.181.b:0 "This is a pipe dream, get out of here."
clever_dsk.181.a.ctt:0 "We can manually establish the Hanyang Armaments Factory."
clever_dsk.182.t:0 "Crushing the [SCOPE.sState('solve_lalla_scope').GetName] Rebellion"
clever_dsk.182.d:0 "A group of [SCOPE.sCulture('maghrebi_culture').GetName] people, urged by the call of jihadists, attempted to rebel in the Kabylie Mountains, destroying the cities we had painstakingly built. Although the rebellion spread to surrounding desert regions, our excellent officers managed to suppress it. Among the rebels was a special [SCOPE.sCulture('maghrebi_culture').GetName] woman, who had incited many to rise against us and repeatedly disrupted our supply lines. Fortunately, General Landon captured her. Given that she is a woman, officers suggest imprisoning her in a remote location until her death to minimize her influence."
clever_dsk.182.f:0 "Why did your men fire on the #yellow French#! troops, knowing it violated the surrender terms your brother established...\n\nGod has chosen [SCOPE.sState('solve_lalla_scope').GetName]; this is neither your fault nor mine. Your soldiers came from their ranks, infiltrating my village. I am sincerely defending myself. I am now your captive, and I blame no one. You should not blame me. It is written thus!\n\nListen, your crime is using religion and false patriotism to mislead many [SCOPE.sCulture('maghrebi_culture').GetName] to kill their own kin. You shall be exiled to the land of nowhere to atone for your sins."
clever_dsk.182.a:0 "No compassion. Exile this woman to death."
clever_dsk.182.b:0 "Spare her life and exile her to a remote place."
clever_dsk.182.c:0 "Execute her publicly to discourage others."

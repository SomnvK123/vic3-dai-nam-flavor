introduction_to_war_i: "The time has entered 1914\n(1) For the Allies to achieve victory, by November 1918, France and Germany must have an armistice agreement, Austria must have an armistice with Serbia and Russia, and France should not have 'been humiliated' or 'lost the war'\n(2) For the Central Powers to achieve victory, by November 1918, Germany and France must have an armistice, Germany must have 'won the war,' France must have both 'been humiliated' and 'lost the war,' Austria must have armistices with Serbia and Russia, and Great Britain must have an armistice with either Germany or Austria"
01_afghanistan_events.13.g: "We want both peace and land!"
je_russia_expand_1_reason: "I, [ROOT.GetCountry.GetRuler.GetFirstName], the [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] and monarch of all [SCOPE.sCulture('russian_culture').GetName] people, in the most sacred and indivisible name of the Trinity, proclaim to all successors to the [concept_russian] throne and government:\n\nThe Almighty God, who gave me life, has made me believe that the [concept_russian] people have a mission to become the ruling nation of Europe in the future, guided by God's light and supported by His grace.\n\nThis belief is born of the observation that most European nations have reached an age of decline, or are, in any case, rapidly approaching this state. Thus, it follows that a young people, upon reaching their full strength, should find it easy and necessary to conquer them.\n\nMay God bless [ROOT.GetCountry.GetName] and all [SCOPE.sCulture('russian_culture').GetName] people!"

concept_russian: "Russia"
concept_russian_desc: "In 1547, the Grand Duke of the Grand Duchy of Moscow, #yellow Ivan IV#!, was crowned as [Concept('concept_ruler','$RULER_TITLE_TSAR$')]. On October 22, 1721, after winning the Great Northern War against the Kingdom of Sweden, #v Peter I#! was granted the title of #v 'Emperor of All Russia'#! by the [concept_russian] Senate, thus officially establishing [concept_russian] as a true #yellow empire#!."
je_dsk_common_welfare:0 "Industrial Revolution: People's Livelihood"
je_dsk_common_welfare_reason:0 "As the Industrial Revolution brought economic growth, we also began to face the plight of the working class. The working conditions in factories were harsh, workers' living standards were low, and poverty and disease became widespread issues. To ease social tensions, we began promoting the development of welfare policies to improve workers' living and working conditions. Basic education, public health, and social security gradually became key areas of focus for the government. Although progress was slow, efforts to improve people's livelihoods brought more social stability to our country and provided solutions to the social problems following industrialization."

je_dsk_common_relations:0 "Industrial Revolution: National Defense"
je_dsk_common_relations_reason:0 "With the immense changes brought by the Industrial Revolution, national defense became an important strategic issue for our country. A strong industrial base allowed us to manufacture advanced weaponry and quickly mobilize military forces. The widespread use of railways and steamships enhanced the mobility and operational efficiency of our military. Moreover, industrialization enabled our country to compete with other great powers, securing our dominant position on the international stage. Strengthening national defense is not only a necessary means to protect our interests but also a strategic move to safeguard our economic security and ensure domestic prosperity."

je_dsk_common_pops:0 "Industrial Revolution: Population Policy"
je_dsk_common_pops_reason:0 "The Industrial Revolution brought about changes in population structure, with accelerated urbanization leading to a large influx of rural populations into cities, where factories became their new workplaces. To address the rapid population growth, our country began to focus on adjusting population policies. Improving education, raising health standards, and controlling population growth became key government concerns. Meanwhile, the rise of the working class made us realize the need to provide more welfare and support to ensure social harmony and stability. Through population policy adjustments, we gradually shaped a more modern and orderly social structure."

je_dsk_common_education:0 "Industrial Revolution: Education"
je_dsk_common_education_reason:0 "With the modernization of society, education became an important cornerstone for our country's development. To meet the demands of industrialization for skilled labor, we gradually promoted educational accessibility, especially basic education and vocational training. This not only helped workers improve production skills but also provided a continuous source of innovation for our industrial and technological development. The spread of education gave more young people the opportunity to enter factories and laboratories to work in emerging industries. Educational reforms improved the overall quality of the population and laid a solid foundation for the country's long-term development."
dsk_common.10.t:0 "Modern Heavy Industry"
dsk_common.10.d:0 "The rise of heavy industry provided strong support for the Industrial Revolution. The development of industries like steel and machinery manufacturing became the core of national industrialization."
dsk_common.10.f:0 "The development of heavy industry promoted breakthroughs in steel production, and industries such as railways, construction materials, and machinery manufacturing quickly emerged. The large-scale construction of coal mines, steel mills, and machinery factories drove the country's industrialization process and laid the foundation for the rapid development of other industries. Breakthroughs in heavy industry enabled the country to have stronger economic competitiveness on the international stage."
dsk_common.10.a:0 "Steel, Production, Machinery Manufacturing"
dsk_common.12.t:0 "Welfare Funds"
dsk_common.12.d:0 "With the advancement of industrialization, the plight of the working class gradually gained attention, and the establishment of welfare funds became a basic living guarantee for workers."
dsk_common.12.f:0 "The establishment of welfare funds provided economic security for workers in cases of unemployment, illness, and other conditions, reducing the living pressures of the labor class. With the rise of factory movements, the state and enterprises gradually realized that providing better security for workers could not only improve production efficiency but also promote social stability. The gradual improvement of the welfare fund system reflected the growing attention to the working class in the industrial revolution era."
dsk_common.12.a:0 "Social Security, Worker Welfare, Unemployment"
dsk_common.13.t:0 "Modern Pivot"
dsk_common.13.d:0 "The Industrial Revolution led to changes in the pivot patterns between countries. Emerging industrial powers began competing globally for markets, resources, and geopolitical advantages."
dsk_common.13.f:0 "With the globalization of the economy, cooperation and competition between countries became more complex. Industrial powers used pivot strategies to gain more trade and markets, and engaged in fiercer battles on the international stage. The modernization of railways and maritime transportation accelerated international trade and personnel exchange, making the pivot more crowded and urgent."
dsk_common.13.a:0 "Third Industrial Revolution, International Trade, Geopolitics"
dsk_common.14.t:0 "Leaders of the Second Industrial Revolution"
dsk_common.14.d:0 "The arrival of the Second Industrial Revolution facilitated a new round of technological progress and industrial transformation, driving the global economy's takeoff."
dsk_common.14.f:0 "The Second Industrial Revolution was marked by breakthroughs in industries such as electricity, chemicals, and steel. Inventions like electric lights, telephones, and internal combustion engines changed the way humans lived. Meanwhile, new production methods made mass production possible, and a global production chain gradually took shape. The Second Industrial Revolution made competition for influence on the international stage fiercer."
dsk_common.14.a:0 "Electricity, Chemistry, Internal Combustion Engines"
dsk_common.15.t:0 "Immigration Laws"
dsk_common.15.d:0 "With the development of the Industrial Revolution, the demand for labor grew rapidly, and immigration laws provided institutional guarantees for population movement, promoting the free flow of labor."
dsk_common.15.f:0 "The establishment of immigration laws not only provided job opportunities for immigrants but also helped the country fill labor shortages. A large number of foreign immigrants legally flooded into industrial cities, becoming vital labor forces in factories. The flow of immigrants not only met the labor needs of industrialization but also promoted cultural exchange and social harmony."
dsk_common.15.a:0 "Labor Movement, Immigration Policies, Factory Labor"
dsk_common.16.t:0 "Modern Education"
dsk_common.16.d:0 "The spread of education became an indispensable part of the Industrial Revolution era, and the new educational system laid the foundation for the country's technological innovation and talent cultivation."
dsk_common.16.f:0 "As the country paid more attention to education, the establishment of schools and educational institutions cultivated a large number of technical talents. The spread of education not only helped the country better cope with the challenges of industrialization but also promoted social mobility. Many young people entered new industrial fields through education, bringing innovative power to society."
dsk_common.16.a:0 "Education Reform, Talent Cultivation, Technological Innovation"
je_dsk_common_colony:0 "Industrial Revolution: Overseas Markets"
je_dsk_common_colony_reason:0 "As factories and machinery flourished, our domestic products clearly exceeded the demand of the domestic market, and there was an urgent need to find new markets abroad. Therefore, we increased investments in overseas colonies and expanded trade networks. This not only provided outlets for our industrial products but also secured valuable raw materials, boosting economic growth. Overseas markets became the key to our sustained prosperity."
je_dsk_common_technology:0 "Industrial Revolution: Medicine"
je_dsk_common_technology_reason:0 "As part of the Industrial Revolution, medicine underwent profound changes. Our country began introducing new technologies and equipment in the process of industrialization, advancing the medical system. We saw the modernization of hospital and clinic equipment, new sterilization methods, and surgical techniques that greatly improved the cure rate. Urbanization brought more health challenges, but also drove public health reforms, reducing the risk of disease transmission. Medical progress made our people healthier and laid the foundation for the country’s long-term stability."
je_dsk_common_railway:0 "Industrial Revolution: Railways"
je_dsk_common_railway_reason:0 "Railways will be an important force in our modernization process. With the maturity of steam engines, railway construction in our country has flourished. Railways not only broke the geographical limitations but also made the flow of goods and people more efficient. Factory products were quickly transported across the country, and could even reach other nations. Railway construction promoted economic integration and accelerated urbanization, enabling our country to transition from an agricultural society to an industrial powerhouse in just a few decades."
je_dsk_common_army:0 "Industrial Revolution: Army"
je_dsk_common_army_reason:0 "As the Industrial Revolution progressed, our military power also began to modernize. The application of steam power and steel technology made our military weapons and equipment more advanced. The accuracy and power of cannons and firearms were significantly improved, and heavy equipment made our army more formidable. Additionally, the construction of railways allowed for quicker mobilization of forces, enhancing the war mobilization capacity. The Industrial Revolution allowed us to rely less on traditional manpower and more on modernized military strength for defense."
je_dsk_common_port:0 "Industrial Revolution: Strengthening the Navy"
je_dsk_common_port_reason:0 "In the wave of the Industrial Revolution, our country also began to focus on improving naval power. The emergence of steamships greatly enhanced the speed and combat ability of the navy. We strengthened port construction so that ships could undergo repairs and resupply more quickly. This not only improved our maritime defense capabilities but also ensured our place in global trade. The modernization of the navy allowed us to protect overseas coasts, maintain the safety of maritime trade routes, and participate in international decision-making."
je_dsk_common_art:0 "Industrial Revolution: Developing the Arts"
je_dsk_common_art_reason:0 "The Industrial Revolution changed the face of society and deeply impacted artistic creation. With the rapid development of cities, the rise of the working class and factories became the subjects of artists’ work. The process of industrialization also gave birth to new artistic forms, with photography and printmaking becoming popular means of expression. Art began to reflect the confusion and hope in social transformation, displaying the tension between the coldness and warmth of mechanized society. Art became a channel to express the spirit of our new era, not only depicting the modern face of society but also revealing the struggles and dreams of humanity in the industrialization process."
je_dsk_common_agriculture:0 "Industrial Revolution: Agriculture"
je_dsk_common_agriculture_reason:0 "Although the Industrial Revolution changed the country’s economic structure, agriculture still plays an important role in our society. With the advancement of industrial technology, new agricultural tools and machines were introduced, greatly improving the efficiency of farming. Mechanized plowing, harvesting, and irrigation systems increased the productivity and labor intensity of farmers, enabling us to produce more food and agricultural products to meet the growing population demands during urbanization. The modernization of agriculture is a major driving force in our country’s economic development, and despite the challenges posed by industrialization, we must not neglect the foundational role of agriculture in ensuring national stability."
je_dsk_common_industry:0 "Industrial Revolution: Shipbuilding"
je_dsk_common_industry_reason:0 "Shipbuilding is a key part of our country’s industrialization. With the application of steel and steam power, shipbuilding entered a new era. The construction of large vessels not only promoted the development of maritime trade but also enhanced our global reach and capabilities. The construction of large commercial ships and warships facilitated our country’s trade with other nations and military competition. We have also realized that a powerful shipbuilding industry is one of the key elements to maintain our competitive edge in international competition."
je_dsk_common_industry_2:0 "Industrial Revolution: Heavy Industry"
je_dsk_common_industry_2_reason:0 "The rise of heavy industry has provided huge development momentum for our country. The development of coal, steel, and machinery manufacturing industries has allowed us to provide necessary raw materials and equipment for railways, construction, and military sectors. The prosperity of the steel industry has given us powerful construction capabilities, enabling us to build modern cities, factories, and military facilities. The strength of heavy industry has not only improved the country’s industrial production capacity but also brought numerous job opportunities, promoting comprehensive social progress."
je_dsk_common_industry_3:0 "Industrial Revolution: Light Industry"
je_dsk_common_industry_3_reason:0 "As the Industrial Revolution progressed, light industry became an important driving force in our domestic economy. The rapid development of textile, food processing, and consumer goods industries allowed us to produce a large number of daily necessities. The mechanization of the textile industry greatly improved production efficiency, providing more affordable and diverse products to the public. The growth of light industry also drove technological innovation, improving product quality and diversifying production methods. Light industry has become a key part of our industrial system, providing necessary support for industrial development and national economic prosperity."
je_dsk_common_army_2:0 "Industrial Revolution: Modernizing the Army"
je_dsk_common_army_2_reason:0 "The application of the Industrial Revolution greatly enhanced the modernization of our military. The introduction of steam-powered ships, machine guns, and heavy artillery allowed our army to gain advantages in international conflicts. Military training and equipment modernization enabled our military to respond more effectively to complex global threats. The development of new technologies has also made our military more mobile, with faster transportation options and better coordination. The rapid development of the military greatly increased our ability to safeguard national security and project power on the world stage."
je_dsk_common_greatpower:0 "Industrial Revolution"
je_dsk_common_greatpower_reason:0 "In the nineteenth century, a cloud of black smoke rose from the land of [SCOPE.sCountry('gbr_scope').GetName], and from then on, the world’s colors changed. The [SCOPE.sGoods('engines_scope').GetName] roared like an iron bull gasping for air, and the cotton mills in #o Manchester#! were filled with cotton fluff as hand-spinning wheels gradually became silent, while steam engines roared to the skies. Iron-clad ships cut through the muddy waters of the Thames River, and the coal ash under #o London#! Bridge stained the wings of the white pigeons. The empire on which the sun never set was nailed together inch by inch with railway spikes.\n\nFactory owners puffed cigars as silver coins clinked in their hands, while child laborers huddled under looms, nibbling hard bread. In parliament, lords debated whether the poor law should be relaxed or tightened, while the Liverpool docks were filled with cotton from [SCOPE.sCountry('bic_scope').GetName] and sugar from the Americas. The machines hummed and swept away the pastoral dream, while a thousand chimneys in the foggy city hid within them the remnants of a burning traditional society. This transformation, driven by [SCOPE.sGoods('coal_scope').GetName] and [SCOPE.sGoods('iron_scope').GetName], created the gears of the new world and crushed the spindles of the old age—until the sleeping lion of the East was awakened by the gunboats, realizing that the tidal wave of industrialization had already crossed the vast Atlantic."
je_dsk_common_greatpower_goal:0 "Complete #v 12 industrial revolution projects#!"
je_dsk_common_greatpower_tt:0 "#v Our industrial revolution has yet to begin...#!"
je_dsk_common_greatpower_1_tt:0 "#v Our industrial revolution is progressing slowly...#!"
je_dsk_common_greatpower_2_tt:0 "#v Our industrial revolution is in full swing...#!"
je_dsk_common_greatpower_3_tt:0 "#v The social changes brought by our industrial revolution have been highly effective...#!"
je_dsk_common_greatpower_4_tt:0 "#v The great era of change is about to arrive!#"


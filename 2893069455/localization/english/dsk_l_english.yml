DSK_russia.6.t:0 "The Third Rome"
DSK_russia.6.d:0 "Now that Constantinople is in our hands, I no longer need to deceive myself into believing I am a successor to Rome; I am Rome!"
DSK_russia.6.f:0 "The empire's capital is not in Ingria. The last princess of the Eastern Roman Empire married into Russia, passing on their responsibilities to me. I am the guardian of the Orthodox faith. After taking Eastern Thrace, I am no longer just a successor to Rome; I am Rome. I want the Turks to know that I am their Damocles' sword, the sharpest spear that will pierce through their hearts. This justice, delayed by 400 years, will let them taste the bitterness of displacement and loss of nation. My return is for those who cannot return; I am Rome, the eternal double-headed eagle of this world."
DSK_russia.6.a:0 "The great Third Rome, Russia, finally reaches its most loyal Constantinople"
modifier_rome_empire:0 "Guardian of the Orthodox Faith"
DSK_russia.7.t:0 "The Third Rome"
DSK_russia.7.d:0 "The Russian Empire officially announces to the world"
DSK_russia.7.f:0 "Russia has successfully restored the old Roman capital, Constantinople. For the first time since the fall of the Eastern Roman Empire 400 years ago, the crown of Rome is transferred to the hands of the Russians. Russia officially becomes the Third Rome Empire, and the Russian Tsar is crowned as the Roman Emperor."
DSK_russia.7.a:0 "So be it"

sino_event.15.t:0 "The Russo-Japanese War Breaks Out"
sino_event.15.d:0 "The Empire of Japan and the Russian Empire have engaged in intense conflict over interests in the Far East"
sino_event.15.f:0 "The Russo-Japanese War, which took place from 1904 to 1905, was a conflict between the Empire of Japan and the Russian Empire over control of the Liaodong Peninsula and the Korean Peninsula, aiming to dominate Asia and the entire Pacific region. The war, fought on the lands of Northeast China, marked a stage in the transition of the capitalist world system to the era of imperialism. Japan emerged as a major power after the war, which had a vast geographic scope, spanning the entire Siberia, and saw the application of many high-tech inventions in warfare."
sino_event.15.a:0 "A dogfight over a mouthful of fur"

sino_event.16.t:0 "The Xinhai Revolution Breaks Out"
sino_event.16.d:0 "The Xinhai Revolution has erupted, overthrowing the Qing Dynasty and establishing the Republic of China"
sino_event.16.f:0 "In the summer of 1911, the Railway Protection Movement erupted in provinces such as Hunan, Hubei, Guangdong, and Sichuan, with the movement in Sichuan being particularly intense. On September 25, Rong County declared independence, becoming the first regime in China to break away from the Qing Dynasty, pushing the Railway Protection Movement to its climax. On the night of October 10, revolutionaries from the New Army's 8th Engineering Battalion, led by Xiong Bingkun, fired the first shot of the Wuchang Uprising. Revolutionaries in Hanyang and Hankou subsequently took control of these cities on the nights of October 11 and October 12, respectively. After the successful takeover of the three towns of Wuhan, the Hubei Military Government was established, with Li Yuanhong elected as the governor, and the national title changed to the Republic of China. Within just two months after the victory of the Wuchang Uprising, 15 provinces including Hunan and Guangdong declared independence from the Qing government."
sino_event.16.a:0 "The first democratic republic in Asia is established"
sino_event.16.b:0 "Do not recognize such a country that is contrary to the law of the ancestors"

sino_event.17.t:0 "The Japan-Korea Annexation"
sino_event.17.d:0 "On August 22, 1910, the Prime Minister of [SCOPE.sCountry('kor_scope').GetName] signed a treaty with [SCOPE.sCountry('jap_scope').GetName]'s representative, Terauchi Masatake, stipulating that [SCOPE.sCountry('kor_scope').GetName] would permanently cede sovereignty over the Korean Peninsula to [SCOPE.sCountry('jap_scope').GetAdjective].\n\nHowever, due to a traitor's betrayal, the treaty was nullified, and the Japanese government decided to resort to force!"
sino_event.17.f:0 "[SCOPE.sCountry('jap_scope').GetName] attempts to physically conquer the Korean Peninsula."
sino_event.17.a:0 "Let the Japanese try."

sino_event.18.t:0 "The Spanish-American War"
sino_event.18.d:0 "The war between [SCOPE.sCountry('usa_scope').GetName] and [SCOPE.sCountry('spa_scope').GetName] has broken out."
sino_event.18.f:0 "[SCOPE.sCountry('usa_scope').GetName] seeks to repartition the world's colonies, but due to limited strength, it is still unable to compete with Britain, France, and other countries, leaving only the aging [SCOPE.sCountry('spa_scope').GetName] as a good target.\n\nAt this point, [SCOPE.sCountry('spa_scope').GetAdjective] is on the decline, and its once vast empire's colonies are reduced to #v Cuba#!, #v Puerto Rico#!, and #v the Philippines#! in Asia. Spain's Caribbean colonies, Cuba and Puerto Rico, are located near the United States' doorstep and are of great strategic value, rich in natural resources. The United States has long coveted these, particularly Cuba.\n\nThe United States decides to take aim at Spain first, seize these Spanish colonies, control Central America and the Caribbean, and gain a base to expand into the Far East and Asia."
sino_event.18.a:0 "Let the Americans try."




lia_event_rtc.9.t:0 "Support from the West"
lia_event_rtc.9.d:0 "Support arrives from Western countries"
lia_event_rtc.9.f:1 "Our domestic turmoil has reached the other side of the ocean. Consequently, Western powers have expressed their willingness to offer us various military and economic supports to help suppress the rebellion. Whether their sudden change in stance is due to humanitarian reasons or fears of their own interests being harmed, it will be immensely helpful in quelling the rebels."
lia_event_rtc.9.a:0 "Even if these Westerners are the cause of this turmoil, our priority now is to restore order."

lia_event_rtc.10.t:0 "Heavenly Division"
lia_event_rtc.10.d:0 "The Eastern King has passed away!"
lia_event_rtc.10.f:4 "Since the inception of the compensation association, the Eastern King had long served alongside the Heavenly King and had earned his profound trust, thus holding great power. However, as his influence grew, he began to fall into corruption and acted with increasing impunity, not only looking down on the other three kings but even slighting the Heavenly King. Seeing no other way out, the Heavenly King secretly ordered the Northern King to eliminate the now wholly corrupted Eastern King. Yet, the situation spiraled far beyond the Heavenly King's expectations; during the extermination, the Northern King even killed tens of thousands of the Eastern King's soldiers. The infighting in Heaven has reached a point where even the Heavenly King finds it hard to control."
lia_event_rtc.10.a:0 "The Yangtze River runs red with blood."

lia_event_rtc.11.t:0 "Northern Expedition of the Taiping Heavenly Kingdom"
lia_event_rtc.11.d:0 "Heading to Beijing!"
lia_event_rtc.11.f:1 "Several years have passed since our initial uprising, and now the time has come to pacify the North. The order of the Central Plains will soon be in our hands."
lia_event_rtc.11.a:0 "The world trembles."

lia_event_rtc.12.t:0 "The Qing's Major Counteroffensive"
lia_event_rtc.12.d:0 "Eliminate the rebels!"
lia_event_rtc.12.f:1 "With the Manchus causing unrest in the East and rebels causing disturbances in the South, the divine order has been disrupted. It's time to rectify the wrongs and restore justice. This is the divine command of the Emperor."
lia_event_rtc.12.a:0 "The world trembles."

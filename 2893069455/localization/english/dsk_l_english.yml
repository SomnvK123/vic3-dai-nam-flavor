ideology_social_liberalism:0 "Social Liberalism"
ideology_social_liberalism_desc:0 "Social liberalism is a term used by German philosopher Stirner. It refers to a social existence where society becomes the highest owner. It is one of the three modes of existence he proposed for 'man'. In his book 'The Ego and Its Own,' he argues that in communism, 'since the principle of common ownership has reached its peak, and all rights are given to society,' making society the highest owner and turning individuals into slaves of society. Social liberalism, for the 'I' (the ego), becomes an imperfect mode of social existence for 'man'."


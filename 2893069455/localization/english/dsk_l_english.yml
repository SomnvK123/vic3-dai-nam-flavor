# Italy-Ethiopia Treaty Event Chain
dsk_ita.8.t:0 "The Italy-Ethiopia Accord"
dsk_ita.8.d:0 "In 1889’s Walwal Oasis, Italian and Amharic versions of the treaty are unfurled under the moonlight. Our diplomat points to Article 17, saying, 'It's a mere technicality,' while quietly securing [SCOPE.sCountry('eth_scope').GetName]'s foreign policy. [SCOPE.sCharacter('crisis_scope_1').GetFirstName]'s envoy, stroking the gilded Bible’s cover, is unaware the ink is still drying on a noose meant for the Lion."
dsk_ita.8.f:0 "As the tricolor flag rose over the fort of Asmara, a local blacksmith melted seized Gras rifles into plows—tools that would be reborn a decade later as rebel javelins."
dsk_ita.8.a:0 "Language is the sharpest weapon"
dsk_ita.8.b:0 "We need more direct control"

# Colonial Rule Event
dsk_ita.9.t:0 "A New Rome on the Red Sea"
dsk_ita.9.d:0 "In 1905’s Port Mogadishu, frankincense piles high in tin warehouses while Milanese perfumers dangle Somali children’s teeth from watch chains. Colonial officers invent the 'Rail Miles for Service Time' policy—one kilometer of track shaves off three months of duty, with laborers’ corpses forming the foundation of the railway."
dsk_ita.9.f:0 "When the first train arrived in Addis Ababa, elders found the timetable written in Roman numerals—Dante himself couldn’t have imagined such a civilizing mission."
dsk_ita.9.a:0 "Let the rails crush savagery"

# Rebellion Escalation Event
dsk_ita.10.t:0 "Revenge of the Queen of Sheba"
dsk_ita.10.d:0 "In the 1911 dry season, [SCOPE.sCountry('eth_scope').GetName] guerrillas discover a shocking secret in an abandoned Italian chapel: the original Treaty of Wuchale has been turned into a confessional partition. They smash icons with rifle butts and pass treaty fragments to each fighter—words soaked in candle wax that outshine any declaration."
dsk_ita.10.f:0 "On the Tigray plateau, peasants sow seeds with modified Gras rifles, harvesting rebellion beneath the colonizers’ gaze."
dsk_ita.10.a:0 "Sow civilization with machine gun fire"

protect_eth_button:0 "Proclaim Ethiopia Our Protectorate"
protect_eth_button_desc:0 "This advances the progress bar by 10, but can only be done once per year."

# Treaty of Lausanne
dsk_ita.11.t:0 "Treaty of Lausanne"
dsk_ita.11.d:0 "At the #yellow Lausanne#! negotiation table in 1923, the Italian delegate fills a glass hourglass with sand from #bold Benghazi#!, declaring: 'Each falling grain is civilization overtaking savagery.' As the Turkish diplomat signs the treaty with trembling hands, the #yellow St. George Cruiser#! casts the tricolor flag’s shadow on the #bold Temple of Cyrene#!.\n\nDeep in the #yellow Fezzan Desert#!, Senussi couriers whisper: 'The Ottoman scimitar rusts, Rome’s chains are not yet forged.' Our engineers find a #bold deep aquifer#!—enough to irrigate Sicily for ten years."
dsk_ita.11.f:0 "Tripolitania and Cyrenaica are barren Turkish deserts of limited economic value, but immense strategic worth. Opposite Sicily, they control a narrow stretch of the central Mediterranean. Holding this land secures our North African foothold."
dsk_ita.11.a:0 "Long live [SCOPE.GetRootScope.GetCountry.GetName]!"

king_of_alb:0 "King of Albania"

je_italia_our_sea_greece:0 "Conquer Greece"
je_italia_our_sea_greece_reason:0 "In late autumn 1940, soldiers of the #bold Julia Alpine Division#! bribe Epirus shepherds with #italic Roman silver coins#!, only to be trapped in a snowstorm in the #yellow Pindus Mountains#!. Mussolini announces on radio: 'Our tanks advance along the #bold Via Egnatia#!'—in reality, Fiat trucks haul #bold Pompeii ash#! to the front to fill guerrilla anti-tank ditches."

je_dsk_italy_conquer_alb:0 "Conquer Albania"
je_dsk_italy_conquer_alb_reason:0 "In the 1917 fog over #yellow Lake Scutari#!, Italian sappers wove #bold barbed wire#! into the fabric of modern civilization. Albanian rebels bombed our relay stations with #yellow Ottoman-era Krupp cannons#! stuffed with #italic Turkish tobacco#!—a smuggler’s grim joke.\n\nIn #yellow Tirana#!, the puppet government replaced Qur’anic lessons with #bold Italian textbooks#!, the ink laced with #yellow Prizren#! silver dust. When the French protested, our foreign minister showed a copy of the #bold 1915 Treaty of London#!: 'There’s room on the Balkan chessboard for every player.'"

dsk_ita.15.t:0 "Sign the Treaty of Wuchale"
dsk_ita.15.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] recognizes Ethiopian monarch #v Menelik II#! as [SCOPE.sCountry('eth_scope').GetName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')], while Ethiopia recognizes Italian sovereignty over the Red Sea coast."
dsk_ita.15.f:0 "During Emperor Yohannes IV’s reign, Menelik II of Shewa maintained good relations with Italy. After Yohannes's death, Menelik II signed this treaty with Italy. Key terms: Menelik recognizes Italian sovereignty over much of the Eritrean highlands; Italy recognizes Menelik II as Emperor, and permits arms imports via Italian territory. However, a discrepancy in Article 17 sparked controversy. The Amharic text says Menelik 'may' use Italian services to liaise with other countries, while the Italian version says he 'must'."
dsk_ita.15.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] and [SCOPE.sCountry('eth_scope').GetName] are bound together"

dsk_ita.16.t:0 "Italy-Ethiopia Breaks Down"
dsk_ita.16.d:0 "The [SCOPE.sCountry('eth_scope').GetName] government refuses Italian protection. Emperor Menelik II informs Italy that Ethiopia will cease honoring the Treaty of Wuchale starting next year."
dsk_ita.16.f:0 "Letting Ethiopia slip out of our grasp is unacceptable."
dsk_ita.16.a:0 "How dare little Ethiopia defy mighty [SCOPE.GetRootScope.GetCountry.GetName]!"
africa_attack:0 "African Independence War Fervor"

# Colonial Rule Event Chain
dsk_ita.17.t:0 "The Thorn in the Red Sea Crown"
dsk_ita.17.d:0 "Under the blazing sun of #yellow Massawa#! in 1890, the colonial governor stirs his coffee with a #bold Gras rifle#! barrel and telegraphs Rome: 'Raise a #italic half-size tricolor#! over Addis Ababa, and Menelik II becomes a puppet.'\n\nSecret police spread rumors in #yellow Harar#!: 'The Emperor's coronation oil contains lard'—enough to sway the #bold Coptic clergy#!. When the British protested, we showed them the blank space in the Amharic Article 17 of the #yellow Wuchale Treaty#!—with invisible ink spelling 'Italy is God's Will'."
dsk_ita.17.f:0 "Headline in Milan: 'From #bold Roman Legions#! to the #bold Horn of Africa#!, the torch of civilization never dims!'\nBut on the #red Tigray Plateau#!, shepherds are fashioning treaty parchment into slings."
dsk_ita.17.a:0 "Velvet collar for the lion" 
dsk_ita.17.b:0 "Real conquest requires fire and sword"

# Colonial Army Struggles
dsk_ita.18.t:0 "Maggots in the Tin Can"
dsk_ita.18.d:0 "In 1897 #yellow Eritrea#!, the quartermaster’s records show #bold 1,200 expired cans#! of beef monthly labeled as 'special rations'. Soldiers found maggots nesting in their #bold Carcano rifles#!. Dysentery incapacitates #yellow Asmara#!'s garrison faster than native arrows.\n\nEven the chaplain vomits during mass—the Eucharist made from #bold moldy flour#!. Colonial reports state: 'Each kilometer of railway consumes #red 43%#! of supplies, with the rest fit only for #italic locust survival#!'."
dsk_ita.18.f:0 "Third Battalion of Naples graffiti at #yellow Keren#! fortress: 'We fight for Italy but die like hyenas'"
dsk_ita.18.a:0 "Order the men to learn camel regurgitation"
dsk_ita.18.b:0 "Trade frankincense for fresh bread"

# Colonial Uprising
dsk_ita.19.t:0 "Burning Frankincense Trees"
dsk_ita.19.d:0 "In the rainy season of 1906, #yellow Harar#! resin workers coat arrows with sap and set fire to the #bold Italian Governor's Palace#!. Rebels, equipped with #yellow Swiss rangefinders#! and #bold muzzle-loaded cannons#!, establish defenses in the #yellow Danakil Depression#!.\n\nThe Times of London captures insurgents wearing charms made from scraps of the #italic Wuchale Treaty#!. On charred railroad ties, they carved: 'Each rail is a whip across our ancestors’ backs.'"
dsk_ita.19.f:0 "Frankincense futures crash #red 220%#! on the Milan exchange; perfumers demand troop protection for plantations"
dsk_ita.19.a:0 "Let the Vetterli machine gun play its requiem"
dsk_ita.20.t:0 "The Blood-Soaked Colonial Medal"
dsk_ita.20.d:0 "In 1911, at the battlefield ruins of #yellow Sidamo#!, colonial troops poured the remains of #bold 3,000#! insurgents into a newly built dam. A war correspondent reported: 'Arms reaching from the concrete served as a natural water gauge.'\n\nIn the palace of #yellow Addis Ababa#!, the governor used #bold Menelik II's skull#! as an ashtray, engraved with the phrase: 'The ultimate proof of civilization.' Secret Church archives indicate: for every #bold village#! suppressed, #red 3#! vengeance-seekers armed with Graz rifles were born."
dsk_ita.20.f:0 "The Paris Museum of Anthropology is auctioning the #yellow skull of a rebel leader#!, valued equivalent to the cost of #bold 50 kilometers#! of railway."
dsk_ita.20.a:0 "Let the next batch of rebels become concrete filler."  # International Condemnation +25%
large_death_modifier:0 "Crushing the Uprising"
dsk_ita.21.t:0 "Our Governor Exploits Local Labor in [SCOPE.sState('east_africa_state').GetName]"
dsk_ita.21.d:0 "Laborers in [SCOPE.sState('east_africa_state').GetName] are subjected to brutal physical labor."
dsk_ita.21.f:0 "It is their punishment for disobedience."
dsk_ita.21.a:0 "Their lives are none of my concern. After all, I'm the one giving them work."
large_coin_modifier:0 "Brutal Exploitation"
dsk_ita.22.t:0 "The Milan Uprising"
dsk_ita.22.d:0 "The Five Days of Milan in March 1848 marked a crucial moment in the Revolution and the First War of Italian Independence. For five days, Milanese citizens waged street battles, driving Radetzky and his Austrian troops from the city."
dsk_ita.22.f:0 "Glory to Italy!"
dsk_ita.22.a:0 "I have learned much from this."
dsk_ita.23.t:0 "[SCOPE.sCharacter('gaixi').GetLastName] Shifts Ideological Course"
dsk_ita.23.d:0 "In the winter of 1858, amidst the gunpowder of the #yellow Turin#! armory, [SCOPE.sCharacter('gaixi').GetLastName] concluded a political calculus:\n\nSign the #bold Plombières Agreement#! with #yellow Napoleon III#! for support from #bold 120,000 French troops#!\n• Expand railways to #bold 2,200 kilometers#! for rapid Alpine troop deployment\n• Establish a #bold National Discount Bank#! in #yellow Genoa#! to fund the military-industrial complex\n\nWhen the Mazzinians accused him of 'a coronet’s betrayal of revolution,' Cavour raised Marshal #yellow Radetzky#!'s sabre seized at Novara in Parliament: '#bold This steel blade speaks more eloquently of the value of [GetLawType('law_monarchy').GetName] than any manifesto#!'"
dsk_ita.23.f:0 "Glory to the House of Savoy!"
dsk_ita.23.a:0 "He has a point."
dsk_ita.24.t:0 "I’m Going to Take You to Meet Someone"
dsk_ita.24.d:0 "[SCOPE.sCharacter('gaixin').GetFullName] Arrives"
dsk_ita.24.f:0 "[SCOPE.sCharacter('gaixin').GetLastName] entered the Royal Military Academy of Turin at the age of ten. Graduating in 1826, he was commissioned as a second lieutenant in the engineering corps and served as a close confidant to Prince Carignano. After Prince Albert ascended to the throne in 1831, [SCOPE.sCharacter('gaixin').GetLastName] resigned his military commission and traveled through France, England, Switzerland, and Belgium to study Western politics, social and economic issues, as well as the agricultural and commercial concerns of Piedmont. He briefly engaged in farming, commerce, and banking. Now, having returned with his knowledge, he is dedicated to the cause of Italian national liberation, and with him, Italy’s unification will soon be resolved."
dsk_ita.24.a:0 "I will appoint him as Prime Minister."
dsk_ita.25.t:0 "[SCOPE.sCharacter('gaixin').GetLastName]'s Founding of the Journal"
dsk_ita.25.d:0 "Founded in 1847, the #bold Revival News#! has become a critical publication, with #yellow Turin#! as its hub, distributing #bold 120,000#! copies monthly across the peninsula. When Austrian censors burned issue #37 in #yellow Mantua#!, the journal had already smuggled the core clauses of [concept_manifesto] into Lombard dialects through the #yellow Susa Pass#! smuggling network—its front-page headline 'Each rail is a cannon aimed at the Vienna system!' is becoming the motto of Northern Italian factory owners.\n\n#bold Every 10,000 copies printed#! increases [ROOT.GetCountry.GetAdjective]'s industrial progress by #green +0.5%#!, while also raising the radical faction generation rate in #yellow Venice#! by #red +0.2%#!."
dsk_ita.25.f:0 "Cavour’s economic blitzkrieg:\n• #yellow 1853 ‘Bills of Exchange Act’#! boosted trade settlement efficiency at the port of Genoa by #green +40%#!\n• #yellow Industrial Monopoly Act#! authorized the establishment of #bold 15 state-owned arms factories#!\n• Signed #yellow ‘Turin Commercial Agreement’#! with Britain, reducing the tariff on pig iron from #red 35%#! to #green 12%#!\n\nWhile Austrian troops are still drilling with smoothbore guns at #yellow Peschiera#!, [ROOT.GetCountry.GetAdjective]'s railway network extends toward Rome at a rate of #bold 1.2 kilometers per day#!."
dsk_ita.25.a:0 "Reconstruct Italy with the printing press and railways!"
modifier_rise_italia:0 "Revival News"
dsk_ita.26.t:0 "Italian National Unification"
dsk_ita.26.d:0 "Now, [SCOPE.GetRootScope.GetCountry.GetName] is the greatest nation on the Italian Peninsula."
dsk_ita.26.f:0 "Italy, you are our homeland,\nyour land is filled with legends and glory.\nOur blood flows with your passion,\nand our hearts resonate with your ideals."
dsk_ita.26.a:0 "We can now take action to unite the smaller states of the peninsula."

dsk_ita.27.t:0 "[concept_unification] National Association"
dsk_ita.27.d:0 "From the wool guilds of #yellow Florence#! to the engineers' associations in #yellow Milan#!, [SCOPE.GetRootScope.GetCountry.GetName] has established #bold 237 local national committees#!. These organizations are executing intricate divisions of labor:\n\n• The Genoa chapter smuggles British coke, increasing the speed of railway construction by #green +18%#!\n• The Parma chapter infiltrates Austrian customs, intercepting #bold 2,000 rifles#! per month\n• The Turin headquarters sends secret reports on unification progress through confessionals at churches, spreading the message to every village."
dsk_ita.27.f:0 "‘Every industrial association is a scalpel dissecting the Austrian Empire,’ wrote Cavour in a 1856 secret memorandum. Meanwhile: #yellow Bologna#! students are encrypting military intelligence using Dante’s verses; #yellow Naples#! black marketeers supply saltpeter under the three-color flag; and #yellow Venice#! glassworkers are preparing optical sights for [concept_redshirts]."
dsk_ita.27.a:0 "Establish a Central Steering Committee!"
modifier_rise_italia1:0 "Italian National Association"
dsk_ita.28.t:0 "The Spark of Rome"
dsk_ita.28.d:0 "When #yellow Pope Pius IX#! condemned [concept_unification] as the ‘#italic work of Satan#!’ in #yellow St. Peter’s Basilica#!, [ROOT.GetCountry.GetAdjective] spies were smuggling #bold 400 boxes#! of Lee-Enfield rifles through the #yellow Appian Way#! into #yellow Rome#!. These weapons were concealed in oak barrels used for transporting holy wine, and were distributed by the #bold Redshirts#!, former members of Garibaldi’s militia, who disguised themselves as pilgrims. In the #yellow Pantheon#!, they trained peasants to use #bold nitroglycerin explosives#! to sabotage Austrian supply lines.\n\nAt the same time, the French garrison was replacing 24-pound bronze cannons at #yellow Castel Sant'Angelo#! with #yellow Krupp#! breech-loading cannons, while our agents had turned three members of the #yellow Swiss Guard#!, whose password ‘#italic Dante’s Eternal Life#!’, would be the signal for a general assault."
dsk_ita.28.f:0 "Intercepted Papal decree: ‘Anyone caught reading [concept_manifesto] shall be punished severely.’ — This only caused the price of smuggled newspapers to soar by #green 300%#!.\n\nArmory records: The #yellow Chivita Vecchia#! port is receiving #bold 800 rifles per month#!."
dsk_ita.28.a:0 "Slaves of Rome, rise up with me!"
dsk_ita.28.b:0 "Perhaps wait for God’s whip to strike the Pope?"
modifier_rise_italia1:0 "Italian National Association"
modifier_rise_italia1:0 "Italian National Association"

dsk_ita.29.t:0 "Plombières Agreement"
dsk_ita.29.d:0 "In July 1858, due to #yellow Cavour#! and #yellow Napoleon III#! reaching a secret agreement in the #yellow Vosges Mountains#!: France would deploy #bold 200,000 troops#! to assist in the fight against Austria, in exchange for [ROOT.GetCountry.GetAdjective] ceding #yellow Savoy#! and #yellow Nice#!. When the British ambassador questioned whether this violated the #yellow Treaty of Vienna#!, our diplomats were exchanging #bold 500 tons of pig iron#! at the #yellow Dover#! port to secure British acquiescence — these steel materials were being turned into #yellow rifled cannons#! at the Alexandria Arsenal."
dsk_ita.29.f:0 "A secret telegram reveals: France demands Sardinia implement [GetLawType('law_wealth_voting')] post-war to ensure investment safety."
dsk_ita.29.a:0 "Sign the Devil’s Pact"
dsk_ita.29.b:0 "Maintain Diplomatic Autonomy"

dsk_ita.30.t:0 "Mars Westward"
dsk_ita.30.d:0 "In May 1860, #yellow Garibaldi#! led #bold 1,089#! Redshirts on two worn-out merchant ships from #yellow Genoa#!. While the Austrian Navy patrolled the #yellow Strait of Messina#!, we smuggled: #bold 4,000 Enfield rifles#!, #bold 20 mountain howitzers#!, and #bold 3 tons of saltpeter#! through #yellow Malta#!’s smuggling network. Meanwhile, #yellow Palermo#!’s bakers were hiding [concept_manifesto] in yeast culture bottles, and #yellow Naples#!’s prison held 237 students singing the "Song of Mameli"."
dsk_ita.30.f:0 "Garibaldi’s diary: 'These maps of Sicily printed in Tuscan are more precise than any compass.'"
dsk_ita.30.a:0 "Ignite the Torch of the Tyrrhenian!"
dsk_ita.30.b:0 "The Time is Not Ripe Yet"

dsk_ita.31.t:0 "Cultural Melting Pot"
dsk_ita.31.d:0 "In 1861, #yellow Camillo Cavour#! established the #yellow National Education Commission#! in #yellow Florence#!, enforcing: #yellow Tuscan Italian#! standardized textbooks, unified historical narratives, and #yellow Dante#! Memorial Day. As #yellow Venetian#! dialect newspapers were banned, [ROOT.GetCountry.GetAdjective]’s #bold 487 new primary schools#! were reducing illiteracy at a rate of #bold 3,000#! per month, bringing the illiteracy rate from 78% to 61% — these literates soon became train firemen and weapons factory quality inspectors."
dsk_ita.31.f:0 "Education Ministry report: After the standardized textbooks were used, national identity in Lombardy rose by #green 42%#!."
dsk_ita.31.a:0 "Forge plowshares into swords, turn speech into blades!"

dsk_ita.32.t:0 "[SCOPE.sCharacter('gaixi').GetLastName] Changed Ideology"
dsk_ita.32.d:0 "After the #yellow Battle of Solferino#! in 1859, faced with France abandoning the #yellow Plombières Agreement#!, [SCOPE.sCharacter('gaixi').GetLastName] secretly met with Prussian military advisors in #yellow Turin#!. Three days later, the #bold Royal Supremacy Decree#! was issued: \n\n• Abolished all reform clauses signed with France\n• Implemented [GetLawType('law_professional_army')]\n• Upgraded #yellow Genoa#! naval base to #bold first-class wartime port#!\n\nAt this moment, [concept_redshirts] were being restructured into the #yellow Alpine Mountain Brigade#!, their new gray uniforms no longer bore the tricolor flag badge."
dsk_ita.32.f:0 "Armory record: The newly issued Dreyse needle gun has a firing rate #green 300%#! faster than Austria’s breech-loading rifles."
dsk_ita.32.a:0 "The Age of Iron and Blood has Arrived!"

dsk_ita.33.t:0 "The Thousand Expedition"
dsk_ita.33.d:0 "On May 5, 1860, #yellow Garibaldi#! led #bold 1,089#! volunteers aboard the steamships ‘#italic Piemonte#!’ and ‘#italic Lombardy#!’ from #yellow Genoa#!. This force, equipped with #bold Enfield 1853#! rifles, carrying #bold 20#! mountain howitzers secretly provided by [ROOT.GetCountry.GetAdjective] and smuggled through #yellow Malta#!’s network, broke the Austrian naval blockade. When they landed at #yellow Marsala#!, Sicilian peasants brought #bold 3,000 barrels of sulfur#! as raw material for explosives — within three months, this ‘Thousand Army’ had grown into the #bold 24,000#! strong main force of the [concept_redshirts]."
dsk_ita.33.f:0 "Garibaldi’s telegram to Turin: 'I have given Two Sicilies to Victor Emmanuel II, but the spark of the republic will never die!'"
dsk_ita.33.a:0 "Let the Redshirts Stain the Peninsula!"

dsk_ita.34.t:0 "The Last Wall"
dsk_ita.34.d:0 "On September 20, 1870, #yellow Raffaele Cadorna#!’s #bold 60,000 strong army#! breached the #yellow Pio IX#!’s #yellow city walls#! using #yellow Krupp#! siege cannons. As the Papal Guard was still using #bold muzzle-loading flintlock guns#!, [ROOT.GetCountry.GetAdjective] engineers had already used #bold nitroglycerin explosives#! to blow open the #yellow Orléans Wall#!. At this moment, #yellow Napoleon III#! was sending a telegram from the Sedan POW camp: 'France can no longer protect the Papacy!' — and #yellow Pope Pius IX#! was escaping via the secret tunnel from #yellow Castel Sant'Angelo#! to the Vatican."
dsk_ita.34.f:0 "Medical report: The casualties were only #bold 49#!, as half of the defenders had already surrendered."
dsk_ita.34.a:0 "Liberate the Eternal City in the Name of Italy!"

dsk_ita.35.t:0 "Dawn of the Republic"
dsk_ita.35.d:0 "When #yellow Giuseppe Mazzini#!’s followers raised the #bold Tricolor Eagle Flag#! in #yellow Spanish Square#!, [ROOT.GetCountry.GetAdjective] parliament was surrounded by #bold 327#! citizens carrying revolvers. These #yellow Republicans#!, through [concept_manifesto] networks, had taken control of all the telegraph stations along the #yellow Tiber River#! — they demanded immediate implementation of [GetLawType('law_universal_suffrage')] and abolition of the #yellow Royal Pension#!."
dsk_ita.35.f:0 "Intercepted secret letters show: The French Jacobins have sent #bold 8,000 Chassepot rifles#! to #yellow Civitavecchia#! port."
dsk_ita.35.a:0 "Ride the Wave of [concept_revolution]!"
dsk_ita.35.b:0 "The Laws of Our Ancestors Cannot Be Changed!"

dsk_ita.36.t:0 "Italian Parliament"
dsk_ita.36.d:0 "When #yellow Cavour#!’s ashes were laid to rest in the Turin monument, his design for the #bold Albertini Constitution#! was stirring up storms in the Italian Peninsula. From the temporary parliament hall at the Turin Royal Palace in 1861, to the formal chamber in #yellow Montecitorio Palace#! after the capital moved to Rome in 1871, this #bold bicameral#! political arena witnessed: \n\n• In 1882, right-wing Prime Minister #yellow Depretis#! manipulating the electoral map with the #bold majority voting law#!\n• In 1898, left-wing MP #yellow Turati#! protesting the #bold Milan massacre#! bloodstained shirts in parliament\n• In 1913, #yellow Giolitti#! pushing #bold universal suffrage#! while secretly negotiating with the Papacy."
dsk_ita.36.f:0 "The Italian Parliament is the legislative body of Italy, responsible for enacting and modifying laws, reviewing government proposals, and overseeing the government's administrative activities. The Italian Parliament is one of the highest authorities in Italy, with its composition and powers defined by the Italian Constitution."
dsk_ita.36.a:0 "Parliament Successfully Convened!"
dsk_ita.36.b:0 "The Second Parliament Successfully Convened!"
dsk_ita.36.c:0 "The Third Parliament Successfully Convened!"
dsk_ita.36.z:0 "The Fourth Parliament Successfully Convened!"
dsk_ita.36.e:0 "The Fifth Parliament Successfully Convened!"

dsk_ita.37.t:0 "Papal Forces Counterattack"
dsk_ita.37.d:0 "The crisis is averted, and now, we can return to the Papal States."
dsk_ita.37.f:0 "What should we do?"
dsk_ita.37.a:0 "Move the Seat to Rome!"
dsk_ita.37.b:0 "How can we keep changing like this?"


dsk_je_Three_Emperors_League_tt: "Upholding the justice, love, and peace of Jesus in the Western tradition"
dsk_je_Three_Emperors_League_reason: "According to the teachings of the Bible, [SCOPE.sCountry('rus_scope').GetName], [SCOPE.sCountry('aus_scope').GetName], and [SCOPE.sCountry('pru_scope').GetName] are to treat each other as brothers. The three contracting monarchs will be united in a sincere and indivisible brotherhood, considering each other as fellow citizens and coming to each other's aid at all times and places. They will guide their subjects and armies to defend religion, peace, and justice in the same spirit of brotherhood."

je_two_italia:0 "Divided Italy"
je_two_italia_reason:0 "When the bankers in #yellow Turin#! calculate the returns on railway bonds, farmers in #red Calabria#! are pressing their shotguns to tax collectors' temples — this is the sharpest satire after #bold 1861 Italian Unification#!.\n\nIn the southern mountain regions, #bold 32,000#! 'bandits' roam, consisting of former Bourbon soldiers and farmers whose lands were taken by the #yellow Piedmontese Land Law#!. A British Times correspondent wrote: 'For every kilometer of railway, there are #bold 17 armed assaults#!, Garibaldi's redshirts here are faded into ragged cloth.'\n\nNorthern lawmakers roar in Parliament: 'These southerners don't even speak #bold Tuscan Italian#!, how are they our fellow countrymen!' Meanwhile, #yellow Camorra#! gangs are using seized #bold M1841 rifles#! to redefine their power base in the scorched olive groves."

dsk_ita.54.t:0 "[concept_mafia] Revenge"
dsk_ita.54.d:0 "A large number of [concept_mafia][SCOPE.sCulture('south_italian').GetName] radicals cause terror attacks in [SCOPE.sState('south_italian_state').GetName]"
dsk_ita.54.f:0 "For a long time, [ROOT.GetCountry.GetAdjective] police have paid heavy costs to deal with the mafia. The 'Mafia' criminal organization has infiltrated many countries in Europe, America, and Asia, forming a powerful force."
dsk_ita.54.a:0 "This is no longer ordinary criminals, we must strike hard"

dsk_ita.55.t:0 "[SCOPE.sCulture('south_italian').GetName] Emigrants"
dsk_ita.55.d:0 "[SCOPE.sCulture('south_italian').GetName] people travel to [SCOPE.sCountry('usa_scope').GetName] to find a better life in [SCOPE.sState('beautiful_state').GetName]"
dsk_ita.55.f:0 "Steamships unload tons of oranges and #bold desperate Neapolitans#!.\n\nOlive groves destroyed by locusts force [SCOPE.sCulture('south_italian').GetName] farmers into rotting cargo holds. They knock to the rhythm of #bold Tarantella#! on the deck, signing contracts with the mafia under the shadow of #bold Etna#!."
dsk_ita.55.a:0 "No one is allowed to run, the village has released gold, come back quickly"

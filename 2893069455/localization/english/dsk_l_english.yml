ncw_event.7.t: "American Civil War"
ncw_event.7.d: "The American Civil War Escalates"
ncw_event.7.f: "News from our diplomatic representatives in the United States: The conflict between the Northern and Southern states of [SCOPE.sCountry('usa_scope').GetName] has intensified over the issue of slavery. President Abraham Lincoln has declared that the independence of the Southern states violates the U.S. Federal Constitution."
ncw_event.7.a: "That is an issue for the Americans themselves."

bc_finish.7.t: "Assassin Shoots [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastNameNoFormatting]!"
bc_finish.7.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] was shot while attending a play in the presidential box at Ford’s Theatre in [ROOT.GetCountry.GetCapital.GetCityHubName], Washington D.C.! The deranged gunman took advantage of the absence of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]’s bodyguards and fired a bullet into [ROOT.GetCountry.GetRuler.GetLastName]’s head. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been rushed to the hospital in critical condition."
bc_finish.7.f: "“Make way! Make way! The President has been shot! Good heavens!”"
bc_finish.7.a:0 "“Such was the modesty of this extraordinary and noble man that the world only discovered he was a hero after he fell as a martyr.” — Karl Marx"
je_italia_wine:0 "Italian Wine"
je_italia_wine_reason:0 "The production and sale of wine significantly contribute to the GDP and employment rate of [SCOPE.GetRootScope.GetCountry.GetName].\nItaly's wine industry plays an important role in promoting national culture. As one of the countries with a long-standing tradition of grape cultivation and winemaking, Italy attracts wine lovers from around the world with its rich history and culture. Italian wine is renowned for its unique taste and quality, helping to enhance Italy's cultural image and international reputation."
wine_modifier:0 "Abundant Vineyards"
je_italia_east_africa:0 "The Somali Question"
je_italia_east_africa_reason:0 "In the aftermath of the #yellow Berlin Conference#! of 1885, [ROOT.GetCountry.GetAdjective] diplomats unfurled a map of the #bold Port of Assab#! on the Red Sea coast.\n\n#yellow Somaliland#! produces up to #bold 800 tons#! of frankincense annually, and its strategic location allows control of the #yellow Mandeb Strait#!—the gateway to the Mediterranean. While the British established a coal station in #yellow Berbera#!, our expeditions discovered traces of #bold gold veins#! along the #yellow Juba River#!.\n\nChauvinists in parliament cried out: 'To trade #bold Tuscan grapes#! for African ivory—this is a campaign even Dante could not imagine!'"

je_italia_annex_east_africa_beg_reason:0 "In 1889, a messenger of [SCOPE.sCountry('eth_scope').GetName]'s [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')], [SCOPE.sCharacter('crisis_scope_1').GetFirstName], was detained by us in the #yellow Walwal Oasis#!, carrying a #bold gold-embossed Bible#! revealing Ethiopia's weakness.\n\nArticle 17 of the treaty, written in #yellow Amharic#!, states: 'May use the Italian government to handle foreign affairs'—a vague clause that renders Addis Ababa a #bold de facto protectorate#!. Our engineers have constructed #bold 12 forts#! in #yellow Eritrea#!, each equipped with #yellow Vetterli machine guns#!.\n\nThe front page of Milan's *Corriere della Sera* reads: 'From the #bold Portico of Alba#! to the #bold Palace of the Queen of Sheba#!, the Roman eagle shall fly once again!'"

je_italia_annex_east_africa_beg:0 "Treaty of Wuchale"

je_italia_annex_east_africa:0 "First Italo-Ethiopian War"
je_italia_annex_east_africa_reason:0 "[SCOPE.sCountry('eth_scope').GetName] is the only independent, uncolonized African state and we see it as a target for expansion. By occupying Ethiopia, we aim to control key strategic areas along the Red Sea and increase our geopolitical influence in the Mediterranean and East Africa, while establishing a trade route from the Mediterranean to the Indian Ocean."
je_italia_annex_east_africa_goal:0 "Our interests in East Africa are secured"
je_italia_turkey_war:0 "Italo-Turkish War"
je_italia_turkey_war_reason:0 "[SCOPE.sCountry('tur_scope').GetName] is like an aging man at the end of his days—one light push and it will collapse.\n\nIn October 1911, across the dunes of #yellow Tripolitania#!, Italian pilots dropped #yellow specially-made 4kg grenades#! from #bold Curtiss pusher planes#! onto Ottoman positions—this marked the first airstrike in human history.\n\nAs the #yellow tricolor#! flag was raised on the minarets of mosques in #yellow Benghazi#!, a telegram intercepted at the Berlin embassy read: 'The Kaiser sees Turkey as a #bold giant of Qur'an paper#!—a Sardinian boot is all it takes to tear it apart.' Our naval commanders rehearsed new tactics off #yellow Rhodes#!: bombarding [SCOPE.sCountry('tur_scope').GetName]'s dignity with #bold dreadnoughts#!."

emperor_of_eth:0 "Emperor of Ethiopia"
exists_ITA_tt:0 "Italy has been unified"
king_of_lby:0 "King of Libya"
king_of_som:0 "Sultan of Somalia"
je_italia_annex_east_africa_over:0 "Treaty of Friendship between Ethiopia and Italy"
je_italia_annex_east_africa_over_reason:0 "The treaty's main terms include: [ROOT.GetCountry.GetAdjective] reaffirms #v Menelik II#! as the [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] of Ethiopia, and #v Menelik II#! acknowledges Italian sovereignty over Red Sea colonies based on current boundaries; Italy's banks will provide a 4 million lira loan to Ethiopia, with Harar's tariffs as collateral. On October 11, Italian Foreign Minister F. Crispi announced that under the permanent treaty: Ethiopia’s [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] must handle all foreign affairs through Italy. [ROOT.GetCountry.GetAdjective]’s interpretation of the treaty was recognized by European powers."
je_italia_annex_east_africa_over_goal:0 "Wait for further geopolitical developments"

je_Parlamento_Italiano:0 "Italian Parliament"
je_Parlamento_Italiano_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]'s Senate is housed in Palazzo Madama in Rome. Citizens aged 40 and above are eligible to run for Senator.\nThe Italian parliament is a key institution in a democratic system, legislating, overseeing the government, and managing national affairs to support Italy’s political and democratic development.\n\n#yellow Liberals#! will #tooltippable;tooltip:[Country.GetTooltipTag],je_Parlamento_Italian_pos #v advance#!#! the Senate #v conference progress#!, while #yellow Conservatives#! will #tooltippable;tooltip:[Country.GetTooltipTag],je_Parlamento_Italian_neg #v regress#!#! the Senate #v conference progress#!."
je_Parlamento_Italian_neg: "The following conditions will #bold regress#! Senate progress:\n• Implementing #yellow [GetLawType('law_oligarchy').GetName]#!, #yellow [GetLawType('law_one_party_state').GetName]#!, or #yellow [GetLawType('law_single_party_state').GetName]#! (#green -1#!).\n• [GetLawType('law_no_social_security').GetName](#green -1#!).\n• Implementing #yellow [GetLawType('law_secret_police').GetName]#! (#green -1#!).\n• Implementing #yellow [GetLawType('law_child_labor_allowed').GetName]#! or #yellow [GetLawType('law_tenant_farmers').GetName]#! (#green -1#!)."
je_Parlamento_Italian_pos: "The following conditions will #bold advance#! Senate progress:\n• Any form of #yellow elections#! (#green +1#!).\n• Any form of #yellow home affairs institution#! (#green +1#!).\n• Any form of #yellow health system#! (#green +1#!).\n• Any form of #yellow welfare institution#! (#green +1#!).\n• Implementing #yellow [GetLawType('law_peasant_proprietorship').GetName]#! or #yellow [GetLawType('law_commercialized_agriculture').GetName]#! (#green +1#!)."
je_Parlamento_Italiano_goal:0 "Wait for the Senate conference to be convened"

chi_kor_support_button: "China's Economic Aid"
chi_kor_support_button_desc: "Request [concept_overlord] to apply economic aid to our country, but this will increase our dependence on [concept_overlord]!"

chi_kor_relationship_button: "Fulfill the Tribute"
chi_kor_relationship_button_desc: "Offer tribute to [concept_overlord] and fulfill our duties as a tributary state."

chi_kor_truce_button: "China's Military Aid"
chi_kor_truce_button_desc: "In case of invasion, we should request [concept_overlord] to send troops!"

chi_kor_revolution_button: "End the Tribute"
chi_kor_revolution_button_desc: "Our tributary relationship with China has lasted for 700 years. It’s time to end this absurd relationship."

wuchang_revolution_tt: "Our [concept_overlord] has triggered the Xinhai [concept_revolution]!"


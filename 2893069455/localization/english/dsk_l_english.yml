dsk_ita.57.t:0 "Sign the Lateran Treaty"
dsk_ita.57.d:0 "On February 11, 1929, Mussolini signed the treaty at the Lateran Palace, while Cardinal Gasparri threw the keys to #bold St. Peter's Basilica#! into the air — the symbolic keys ultimately fell into the hands of the archivist rather than being returned to the Vatican."
dsk_ita.57.f:0 "The so-called 'Prisoner of the Vatican' period had lasted from 1870 until 1929. By this time, [ROOT.GetCountry.GetAdjective] had been unified for 69 years, and the Papal States had ceased to exist for 59 years. The long-standing hostility and resistance of the Vatican towards Italy had become anachronistic. On February 11, 1929, the representatives of Pope Pius XI and [ROOT.GetCountry.GetAdjective] signed the final agreement at the Lateran Palace in Rome, resolving their longstanding issues — the Lateran Treaty. According to the treaty, the Vatican finally acknowledged the unification of Italy and the status of Rome as its capital. The Kingdom of Italy recognized the supreme authority and secular power of the Pope in Vatican City, which became an independent state of [SCOPE.sCountry('pap_scope').GetName]. In addition, the treaty addressed the political position of Catholicism and the Church in Italy, with compensation provided by the Kingdom of Italy for Church properties confiscated during the Italian unification wars. Legally, the Papal States, which had lasted for over 11 centuries, were officially dissolved on February 11, 1929, replaced by Vatican City."
dsk_ita.57.a:0 "Let us maintain a more friendly image in the international community!"

dyn_c_vatican_states:0 "Vatican City"

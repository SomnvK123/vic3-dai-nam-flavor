je_create_center_french_africa_reason:0 "This region was initially established in 1910, comprising four French administrative territories (Gabon, Congo, Ubangi, Chad), adjacent to eight international administrative regions:\n[SCOPE.sCountry('por_scope').GetName] is Cabinda\n[SCOPE.sCountry('spa_scope').GetName] is Guinea\n[SCOPE.sCountry('pru_scope').GetName] and [SCOPE.sCountry('ger_scope').GetName] are Cameroon\n[SCOPE.sCountry('gbr_scope').GetName] is the Protectorate of the Niger Coast\n[SCOPE.GetRootScope.GetCountry.GetName] is the Niger Military Territory\n[SCOPE.sCountry('tri_scope').GetName]\n[SCOPE.sCountry('gbr_scope').GetName] is the Protectorate of Egypt's Sudanese Region\n[SCOPE.sCountry('bel_scope').GetName] is Congo."

dsk_france.3.t:0 "The Status of Algeria"
dsk_france.3.d:0 "With the annexation of Algeria, the question of the status of Algerians arises."
dsk_france.3.f:0 "After the Arab Empire, North Africa, including Algeria, went through multiple feudal kingdoms and the rule of [SCOPE.sCountry('tur_scope').GetName]. Due to its distance from the core regions of the empire and the strong local powers that remained, [SCOPE.sCountry('tur_scope').GetName]'s rule over Algeria was mostly superficial, with the region enjoying autonomy for most of the time.\nDuring this process, Algeria's ethnic composition was established. Arabs, belonging to the white race and adhering to Islam, became the dominant group.\nFrench colonialists called for a change in the status quo, and the French central government also wished to further improve the administrative structure of Algeria. Algeria's rich resources attracted a large number of immigrants. With the emergence of immigrant towns, France established a municipal administration system in several major coastal settlements in Algeria in 1834. This direct transplantation of the French domestic administrative model was rarely seen in French overseas colonies, and it marked the beginning of Algeria's integration into France."
dsk_france.3.a:0 "Algeria and [SCOPE.GetRootScope.GetCountry.GetName] have no commonality in culture, customs, or language; let them be second-class citizens in the colony."
dsk_france.3.b:0 "Algeria is geographically close to [SCOPE.GetRootScope.GetCountry.GetName], and we have reason to believe that it is a natural extension of our country's territory to the south."
french_african:0 "Franco-African"
je_fra_MARRAKECH:0 "French Protectorate of Morocco"
je_fra_MARRAKECH_reason:0 "[SCOPE.sCountry('mor_scope').GetName] is located at the northwest tip of Africa, bordering Algeria to the east and southeast, sharing a border with Spanish Sahara to the south, facing the Atlantic Ocean to the west, and overlooking Spain across the Strait of Gibraltar to the north. It is a strategic gateway connecting the Mediterranean Sea to the Atlantic Ocean, with an area of approximately 450,000 square kilometers.\nIf we can successfully control this region, it will become a crucial throat for our link between the Mediterranean and the Atlantic."
je_fra_TUNISIA:0 "French Protectorate of Tunisia"
je_fra_TUNISIA_reason:0 "[SCOPE.sCountry('tun_scope').GetName] was originally a province of [SCOPE.sCountry('tur_scope').GetName]. In 1705, Hussein bin Ali Turki of [SCOPE.sCountry('tun_scope').GetName] overthrew the Dey, the highest Ottoman official stationed in Tunisia, and established the Husainid Dynasty, whose rule over Tunisia is known as the "Beylik of Tunisia." However, the Bey of Tunisia nominally remained a vassal of the Ottoman Sultan.\nAfter occupying Algeria, [SCOPE.GetRootScope.GetCountry.GetName] must vigorously expand its influence into Tunisia to enlarge its power in North Africa."

dsk_france.4.t:0 "The Status of Tunisia"
dsk_france.4.d:0 "As we delve deeper into the heart of Tunisia, the question of the status of Tunisians arises."
dsk_france.4.f:0 "Tunisia was once ruled by [SCOPE.sCountry('tur_scope').GetName]. Due to its distance from the core regions of the empire and the strong local powers that remained, [SCOPE.sCountry('tur_scope').GetName]'s rule over Tunisia was mostly superficial, with the region enjoying autonomy for most of the time.\nDuring this process, Tunisia's ethnic composition was established. Arabs, belonging to the white race and adhering to Islam, became the dominant group.\nFrench colonialists called for a change in the status quo, and the French central government also wished to further improve the administrative structure of Tunisia."
dsk_france.4.a:0 "Tunisia and [SCOPE.GetRootScope.GetCountry.GetName] have no commonality in culture, customs, or language; let them be second-class citizens in the colony."
dsk_france.4.b:0 "Tunisia is geographically close to [SCOPE.GetRootScope.GetCountry.GetName], and we have reason to believe that it is a natural extension of our country's territory to the south."

dsk_france.5.t:0 "The Status of Morocco"
dsk_france.5.d:0 "As we delve deeper into the heart of Morocco, the question of the status of Moroccans arises."
dsk_france.5.f:0 "This land was once under the control of [SCOPE.sCountry('tur_scope').GetName]. Due to its remoteness from the core areas of the empire and the strong local forces that remained, [SCOPE.sCountry('tur_scope').GetName]'s rule over Morocco was largely superficial, with autonomy prevailing for the majority of the time.\nDuring this process, Morocco's ethnic composition solidified. Arabs, belonging to the Caucasian race and practicing Islam, emerged as the dominant group here.\nFrench colonialists called for a change in the status quo, and the French central government also hoped to further refine its administrative structure over Morocco."

dsk_france.5.a:0 "Morocco and [SCOPE.GetRootScope.GetCountry.GetName] have little in common in terms of culture, customs, and language. Let's make them second-class citizens in our colony."

dsk_france.5.b:0 "Geographically, Morocco is close to [SCOPE.GetRootScope.GetCountry.GetName]. We have reason to believe that it is a natural extension of our territory to the south."

dsk_france.6.t:0 "Proposal for French Equatorial Africa"
dsk_france.6.d:0 "We control a vast expanse of African territory, and certain matters exceed our capabilities."
dsk_france.6.f:0 "The territory of French Equatorial Africa extends from the Congo River northward to the Sahara Desert, primarily encompassing present-day Gabon, Republic of the Congo, Central African Republic, and Chad."
dsk_france.6.a:0 "'The Parisian authorities only need to compile a colonial law, whereas colonial governors have much more to consider.'"
dsk_france.6.b:0 "Equatorial Africa has little in common with [SCOPE.GetRootScope.GetCountry.GetName] in terms of culture, customs, and language. Let's make them second-class citizens in our colony."

very_bad_opinion:0 "Public opinion is highly unfavorable"

Raspail:0 "Raspail"

Francois-Vincent:0 "François-Vincent"

create_west_french_africa_button:0 "Purchase West African Territories from #red Britain#!"
create_west_french_africa_button_desc:0 "Negotiate with #red Britain#! to propose buying their West African colonies from them at 10% of their GDP."

create_center_french_africa_button:0 "Purchase Central African Territories from #red Britain#!"
create_center_french_africa_button_desc:0 "Negotiate with #red Britain#! to propose buying their Central African colonies from them at 10% of their GDP."

onlt_1_year:0 "Can only be done once a year"

fra_expand_aferica_west_colony:0 "Accelerate Colonization"

je_fra_Madagascar:0 "French Protectorate of Madagascar"
je_fra_Madagascar_reason:0 "[SCOPE.sCountry('mad_scope').GetName] is located on the east coast of Africa and holds an important geostrategic position. We hope to strengthen our influence in the eastern region of Africa by controlling Madagascar and to prevent competition from other European powers. Currently,\n[SCOPE.sCountry('mad_scope').GetName]'s social structure is in chaos, providing an opportunity for our colonial activities. If we exploit local social contradictions and support pro-French forces, we can achieve control over them."

dsk_france.7.t:0 "The Status of Madagascar"
dsk_france.7.d:0 "We have taken control of this vast African island."
dsk_france.7.f:0 "Merge Madagascar with France's numerous island colonies in the Indian Ocean to form the Madagascar Colony and Dependencies, i.e., French Madagascar."
dsk_france.7.a:0 "Depose Ranavalona and turn Madagascar into a colony of [SCOPE.GetRootScope.GetCountry.GetName]."
dsk_france.7.b:0 "We will treat them like our little brothers."
je_french_africa:0 "French Africa"
je_french_africa_reason:0 "Africa, the second largest continent in the world, boasts abundant natural resources including diamonds, gold, chromite, phosphate, and more minerals, as well as wildlife such as lions, rhinoceros, elephants, redwood, ebony, and rosewood. Additionally, during the colonial era, African slaves were considered a resource. If we can control this undeveloped continent, [SCOPE.GetRootScope.GetCountry.GetName]'s wealth will be inexhaustible."
je_french_africa_tt:0 "Create a French colonial federation on the African continent"
all_african_be_french:0 "All [Concept('concept_pop', 'concept_pops')] of West African [concept_culture] will be assimilated into [SCOPE.sCulture('french_african_culture').GetName]"
dsk_france.8.t:0 "Victory in French African Colonies"
dsk_france.8.d:0 "Glory Revealed: A Magnificent Chapter of France's Triumph in French African Colonies"
dsk_france.8.f:0 "On the vast, mysterious, and unknown African continent, [SCOPE.GetRootScope.GetCountry.GetName] has gradually established a stable colonial system with profound strategic vision and unwavering determination. This is not merely an expansion of geographical territories but also a profound exchange and fusion between French culture and the diverse civilizations of Africa."
dsk_france.8.a:0 "[SCOPE.sCulture('french_african_culture').GetName] will be equal to [SCOPE.sCulture('french_culture').GetName]."
dsk_france.8.b:0 "The master of [SCOPE.sCulture('french_culture').GetName] is the master indeed!"
modifier_france_super_colony:0 "Rule Over the Dark Continent"

france_flavor.2.t:0 "Louis Bonaparte Announces Presidential Campaign"
france_flavor.2.d:0 "Louis Bonaparte Joins the Presidential Race"
france_flavor.2.f:0 "Louis Bonaparte officially announces his candidacy for the presidency, promising the people, 'I pledge my honor that I will leave to my successor, after four years, a consolidated power and an intact liberty.' During the campaign, with slogans such as rebuilding order, creating a strong government, establishing social security, reorganizing society, and restoring national honor, he gains support from various quarters, including monarchists like the remnants of the Bourbon dynasty, members of the Orléans dynasty, and old aristocrats, who see him as a 'less bad' candidate."
france_flavor.2.a:0 "May he revitalize the glory of France"
france_flavor.2.b:0 "No, we don't want another Napoleon"

france_flavor.3.t:0 "Constitutional Amendment"
france_flavor.3.d:0 "Napoleon Attempts to Restore the Empire"
france_flavor.3.f:0 "The new constitution extends the presidential term to ten years and grants the president the power to designate his successor. Louis Bonaparte prepares to restore the empire. On one hand, he creates a nationwide fervor for the presidency to become an empire; on the other, he strives to sever the connection between the establishment of an empire and foreign wars. Eagle insignias, symbols of the empire, are widely distributed and displayed, and the president's portrait begins to appear on stamps and currency."
france_flavor.3.a:0 "Pass the constitutional amendment to restore the empire!"
france_flavor.3.b:0 "No one can be emperor in a republic!"

france_flavor.4.t:0 "Establishment of the Second Empire"
france_flavor.4.d:0 "The Second Empire is Founded"
france_flavor.4.f:0 ""Some, out of suspicion, believe that an empire means war. I say, an empire means peace. I admit that, like the Emperor (Napoleon Bonaparte), I have much conquering to do. I will, like him, help reconcile divided parties. We have vast wildernesses to open, roads to build, harbors to dredge, rivers to navigate, canals to complete, and our railways to finish. These are the conquests I shall undertake." – Louis Bonaparte"
france_flavor.4.a:0 "Long live the Second Empire!"
clever_dsk.150.t:0 "Border Dispute"
clever_dsk.150.d:0 "[SCOPE.sCharacter('fight_with_bol_arg_scope').GetFullName] accuses us of 'invading' their territory in Jujuy Province and unfairly blames [SCOPE.sCharacter('bol_will_fight_south_scope').GetFullName] for harboring Argentine fugitives, attempting to split their country. This accusation, bordering on provocation of war, is being exploited by Peruvian anti-federalists who aim to expel all Chileans and Bolivians during our wars with Chile and Argentina, establishing a purely Peruvian nation."
clever_dsk.150.f:0 "Bolivians, you owe us millions of pesos spent fighting Spain for your freedom and independence! You owe us the blood of Argentines shed in this war! Understand that once Tarija is restored, the Pilcomayo River must delineate the territories of our two republics; but in my view, if we can ensure that Villa Tupiza and Santiago de Cotagaita remain within our borders, this will be the best and most important thing to ensure perpetual peace and free trade between our nations. In exchange for this benefit, I believe we can forgive the costs incurred during the independence war and the benefits gained from Tarija during its usurpation. —[SCOPE.sCharacter('fight_with_bol_arg_scope').GetFullName]"
clever_dsk.150.a:0 "We reject [SCOPE.sCharacter('fight_with_bol_arg_scope').GetFullName]'s unfounded accusations, and [SCOPE.sCharacter('bol_will_fight_south_scope').GetFullName] will lead us in defending this country."
clever_dsk.150.b:0 "[SCOPE.sCharacter('bol_will_fight_south_scope').GetFullName] decides to yield to [SCOPE.sCharacter('fight_with_bol_arg_scope').GetFullName] to stabilize the fragile federation."
clever_dsk.153.t:0 "Research into Airships"
clever_dsk.153.d:0 "Inspired by a lecture on 'World Postal Services and Air Travel', [SCOPE.sCharacter('zeppelin_benefactor').GetFullName] resolved to research a large airship that could compensate for our military shortcomings. Despite numerous setbacks, he has made some progress."
clever_dsk.153.f:0 "In my opinion, old flying machines like hot air balloons hold little promise... but independent flying vehicles will surely be developed and utilized rapidly. —[SCOPE.sCharacter('zeppelin_benefactor').GetFullName]"
clever_dsk.153.a:0 "Praise to Count Zeppelin."
01_afghanistan_events.97.t:0 "Simla Declaration"
01_afghanistan_events.97.d:0 "[SCOPE.sCountry('kab_disagree_gbr_scope').GetName]'s leader, [SCOPE.sCharacter('kab_ruler_disagree_gbr_scope').GetFullName], has rejected our alliance request, and rumors suggest he may ally with Russia. The Viceroy of India has issued the Simla Declaration, stating that as long as Kabul remains under his rule, we can never expect tranquility around us or the inviolability of our Indian Empire's interests."
01_afghanistan_events.97.f:0 "Out of urgent necessity and considerations of policy and justice, we have reason to support the cause of Shah Shuja Ul Mulk. The highest authorities have unanimously and forcefully confirmed to His Excellency the Viceroy the prestige of Shah Shuja Ul Mulk throughout Afghanistan. His Majesty Shah Shuja Ul Mulk will enter Afghanistan surrounded by his own troops, and our army will assist him in warding off foreign interference and factional opposition. It is hoped that Shah Shuja's subjects and followers will swiftly replace [SCOPE.sCharacter('kab_ruler_disagree_gbr_scope').GetFullName] on the throne; once he is in power, Afghanistan's independence and integrity will be established, and our troops will withdraw. These measures are to ensure the safety of the British Crown's property and to help restore unity and prosperity to the Afghan people."
01_afghanistan_events.97.a:0 "We will assist the former Afghan King Shah Shuja in regaining his throne and authorize the Viceroy of India to wage war against the barbaric warlords of Afghanistan."
01_afghanistan_events.97.b:0 "The Indian Governor is unreliable, we need to personally teach [SCOPE.sCountry('kab_disagree_gbr_scope').GetName] a lesson."

01_afghanistan_events.97.c:0 "We don't need [SCOPE.sCountry('kab_disagree_gbr_scope').GetName] to serve as a barrier in western India."

01_afghanistan_events.96.t:0 "The Obedient Old King"

01_afghanistan_events.96.d:0 "The barbaric Khan of Kabul has been defeated by us, it's time to fulfill our promise and let the esteemed Durrani royal family – Shah Shuja – rule the land of Afghanistan."

01_afghanistan_events.96.f:0 "The Governor claims that Shah Shuja will be able to help restore unity and prosperity among the Afghan people, utilizing his influence to reconcile Afghan divisions, ensure harm is eliminated, and end the various disturbances that have harmed the well-being and happiness of the Afghan people for years."

01_afghanistan_events.96.a:0 "Support the former Afghan King, Shah Shuja."

01_afghanistan_events.96.b:0 "We don't need a 'puppet' king."

clever_dsk.155.t:0 "The Lantern Lady"

clever_dsk.155.d:0 "[SCOPE.sCharacter('nanting_benefactor').GetFullName] worked as a nurse during the war and discovered that medical staff were often overworked and provided poor care to injured soldiers. Medicines were scarce, hygiene conditions were poor, and collective infections were common. To save more soldiers' lives, she demanded that the government spend money to design a prefabricated hospital to address the inadequate hospital facilities."

clever_dsk.155.f:0 "Without exaggeration, she was the 'angel' in these hospitals. As her slender figure glided quietly down each corridor, every poor soul's face would fill with gratitude upon seeing her. When all the medical staff had left and silence and darkness enveloped the lying patients, one might see her alone, holding a small lantern, making her rounds."

clever_dsk.155.a:0 "Agree to [SCOPE.sCharacter('nanting_benefactor').GetFullName]'s request."

clever_dsk.155.b:0 "A nurse dares to make demands of us? Get her out of here immediately."

clever_dsk.156.t:0 "The Andes War Flames"

clever_dsk.156.d:0 "[SCOPE.sCountry('bol_with_peu_die_scope').GetName] now faces invasion from the powerful nations of Chile and Argentina. Agents from Chile have suggested that we take advantage of [SCOPE.sCountry('bol_with_peu_die_scope').GetName]'s internal weakness and demand some territories from [SCOPE.sCharacter('bol_ruler_defeat_scope').GetFirstName]."

clever_dsk.156.f:0 "Ministers told [SCOPE.sCharacter('we_with_eat_bol_scope').GetFullName] that if [SCOPE.sCharacter('bol_ruler_defeat_scope').GetFirstName] were allowed to successfully form a confederation, a giant Andean monster would rise in the future, posing a serious threat to our national security."

clever_dsk.156.a:0 "It's time to define our borders with [SCOPE.sCountry('bol_with_peu_die_scope').GetName] in the state of Mato Grosso."

clever_dsk.156.b:0 "Send troops and tell [SCOPE.sCharacter('bol_ruler_defeat_scope').GetFullName] how the Amazonian border should be divided."

clever_dsk.156.c:0 "[SCOPE.sCountry('bol_with_peu_die_scope').GetName] is our good neighbor, we should not invade them."

clever_dsk.157.t:0 "The Dominican Rebellion"
clever_dsk.157.d:0 "The heavy taxes imposed by incompetent officials who extort excessively have finally crushed the people of the Dominican region, with the exorbitant reparations paid to [SCOPE.sCountry('hai_angry_to_fra_scope').GetName]. Members of the Holy Trinity Resistance Movement, especially the nationalist Duarte, have secretly sought independence. Although Duarte has been expelled from the island of Hispaniola, a group of rebels still issued a declaration of independence in his name and launched an attack on the Fortaleza Ozama, attempting to divide our country."

clever_dsk.157.f:0 "Our garrison at the Fortaleza San Domingo was completely unprepared and was easily captured by a group of rebels. Rebel leader Sanchez immediately raised the new Dominican flag atop the Puerta del Conde, shouting the national slogan: God, Homeland, and Liberty! If we don't take action soon, an enemy nation will emerge on the island of Hispaniola."

clever_dsk.157.a:0 "No one can divide our country!"

clever_dsk.157.b:0 "Send secret police to properly 'educate' these Spanish-speaking rebels."

clever_dsk.157.c:0 "Make concessions and grant them autonomy."

clever_dsk.158.t:0 "The Dominican Uprising"

clever_dsk.158.d:0 "Fed up with the exploitation by incompetent officials of [SCOPE.sCountry('hai_track_with_dom_scope').GetName], the people of [SCOPE.sCountry('dom_against_hai_scope').GetName] led by Sanchez fired the first shots of the uprising. Members of the Holy Trinity Resistance Movement shouted the slogan "God, Homeland, and Liberty" as they captured the fortress of Santo Domingo. Upon hearing the news, the leader of [SCOPE.sCountry('hai_track_with_dom_scope').GetName] immediately led the provisional governing army to launch a counterattack. For the survival of their homeland, the diplomatic envoy of [SCOPE.sCountry('dom_against_hai_scope').GetName] has requested our support."

clever_dsk.158.f:0 "I admit that I deserve such desperate treatment, which fills me with shame and despair, leaving me unable to utter a word. But in my heart, I swear that I will not consider or worry about the means, but will prove to them: The world is not like this, we have only one exclusive name, Dominicans, and we deserve to bear it. – Juan Pablo Duarte"

clever_dsk.158.a:0 "Deliver necessary supplies to the rebels."

clever_dsk.158.b:0 "We don't need to maintain peace in the Caribbean."
dsk_france.9.t:0 "[SCOPE.GetRootScope.GetCountry.GetName] and Her People"
dsk_france.9.d:0 "Corsica is an overseas territory of France, located in the Mediterranean Sea, facing Sardinia, Italy across the sea. Since the signing of the Treaty of Versailles between France and Genoa in 1769, Corsica has officially become French territory. The Occitan region generally refers to a cultural area in southern France, rather than a formal vassal state. These inhabitants are an important and integral part of France's multicultural heritage."
dsk_france.9.f:0 "Geographically and culturally, there is no direct connection between [SCOPE.sCulture('occitan_culture').GetName] and [SCOPE.sCulture('french_culture').GetName]. Occitan is a cultural region in southern France, while Corsica is an island far from the mainland."
dsk_france.9.a:0 "[SCOPE.sCulture('occitan_culture').GetName] and [SCOPE.sCulture('corsican_culture').GetName] are both [SCOPE.sCulture('french_culture').GetName], indivisible."
dsk_france.9.b:0 "We respect cultural diversity, and [SCOPE.sCulture('occitan_culture').GetName], [SCOPE.sCulture('corsican_culture').GetName], and [SCOPE.sCulture('french_culture').GetName] move forward together!"
je_fra_monarch:0 "[concept_monarchie_de_Juillet]"
je_fra_monarch_tt:0 "#v Divine Right of Kings, Benefiting the People#!"

all_occitan_be_french:0 "All [SCOPE.sCulture('occitan_culture').GetName] and [SCOPE.sCulture('corsican_culture').GetName] [Concept('concept_pop', '$concept_pops$')] will be assimilated into [SCOPE.sCulture('french_culture').GetName]."
je_fra_monarch_reason:0 "In the early 19th century, under the rule of Charles X, societal contradictions in [SCOPE.GetRootScope.GetCountry.GetName] intensified. Charles X implemented a series of regressive policies, such as purging military officers who had served under Napoleon, restoring the power of the landed aristocracy, compensating the old nobility for their losses, reducing national debt interest, strengthening press censorship, and reviving the old religious order. These policies angered the middle class, working class, and intellectuals.\nUnder the pressure of the revolution, on July 30th, Charles X appointed the Duke of Orléans, Louis-Philippe, as regent. On July 31st, Louis-Philippe accepted the title of regent on the balcony of the Paris City Hall. On August 2nd, Charles X abdicated in favor of his grandson, the Duke of Bordeaux, but Louis-Philippe refused to acknowledge it. On August 7th, the Chamber of Deputies officially called upon Louis-Philippe to take the throne, establishing the Orléans dynasty.\n\n#yellow [concept_monarchie_de_Juillet]#! will accumulate #v #tooltippable;tooltip:[Country.GetTooltipTag],je_french_Kingdom_house_pos stability#! according to the current domestic situation#!, consuming #N stability#! to enact a policy."
je_french_Kingdom_house_pos: "The following conditions will accumulate #bold stability#! of #N stability#! per month:\n• Implement any #yellow form of election#! (#green +2#!).\n• Implement any #yellow interior ministry#! (#green +1#!).\n• Implement any #yellow health institution#! (#green +1#!).\n• Implement any #yellow welfare institution#! (#green +1#!).\n• Implement any #yellow commercialized agriculture#! or #yellow enclosure acts#! (#green +1#!).\n• National #yellow [Concept('concept_sol', '$SOL_SHORT_TEXT$')]>15#! and national rank is [concept_super_power] (#green +5#!)."
dsk_fra_monarchy_time:0 "Divine Right of Kings"
support_life_button:0 "Support Livelihood"
support_life_button_desc:0 "The enacted charter relaxes property qualifications for voters and candidates, enabling more people to participate in political and economic activities, thus promoting market activity and competition, indirectly benefiting the improvement of livelihood.\nThe government increased investment in infrastructure construction, particularly in railways and transportation networks. This not only improved transportation conditions and reduced transportation costs but also facilitated the circulation of resources and products, providing convenience for people's lives."
enough_french_Kingdom_house_var:0 "#bold Enough#! #N stability#! have been accumulated."
modifier_french_kingdom_life:0 "French Livelihood"
make_alliance_button:0 "Improve Diplomatic Conditions"
make_alliance_button_desc:0 "After the establishment of [concept_monarchie_de_Juillet], the principles of the Revolution of 1789 were quickly restored, reestablishing parliamentary politics. This move not only stabilized the domestic political situation but also helped France to establish an image of democracy and rule of law on the international stage, improving diplomatic conditions.\nLouis-Philippe attached great importance to the Concert of Europe, striving to uphold its principles and the territorial status quo, in exchange for France's moral prestige among the three Eastern Powers. This attitude helped France maintain a respected role in international affairs."
support_homeland_button:0 "Strongly Support Industry"
support_homeland_button_desc:0 "By lowering property qualifications for voters and candidates, more people were able to participate in political and economic activities, promoting market activity and competition. This policy indirectly benefited industrial development, as more market participants meant more demand and opportunities.\nThe government encouraged entrepreneurs to invest in industrial projects by providing tax incentives, land, and financial support. These measures lowered the investment threshold, increased the return on investment, and attracted substantial capital into the industrial sector."
modifier_french_kingdom_education:0 "French Education"
support_education_button:0 "Support Education"
modifier_french_kingdom_alliance:0 "French Diplomacy"
support_education_button_desc:0 "On June 28, 1833, François Guizot, the Minister of Public Education, passed the first law concerning primary education, specifically providing for the education of boys and requiring every city to maintain a primary school for boys in cities with over five hundred residents.\nIn 1836, the Guizot Law was extended, and girls, who were previously excluded from municipal obligations, were also covered by this law, marking a step towards more universal and equal primary education in France."
modifier_french_kingdom_support_homeland:0 "French Industry"
dsk_france.10.t:0 "Crimean War"
dsk_france.10.d:0 "[SCOPE.sCountry('tur_scope').GetName] rejected [SCOPE.sCountry('rus_scope').GetName]'s ultimatum in May 1853 and allowed the joint fleet of [SCOPE.sCountry('gbr_scope').GetName] and [SCOPE.sCountry('fra_scope').GetName] to enter the Dardanelles Strait. Diplomatic relations between Russia and the Ottoman Empire were severed."
dsk_france.10.f:0 "When conflicts reach an irreconcilable point, only war remains."
dsk_france.200.d:0 "In February 1853, Prince Alexander Sergeyevich Menshikov, as the plenipotentiary envoy of [SCOPE.sCountry('rus_scope').GetName], went to Constantinople to demand that the government of [SCOPE.sCountry('tur_scope').GetName] recognize the special protection rights of the Russian Tsar [SCOPE.sCharacter('crisis_scope_1').GetFirstName] over the Orthodox subjects (including [SCOPE.sCulture('greek_culture').GetName], [SCOPE.sCulture('bulgarian_culture').GetName], [SCOPE.sCulture('romanian_culture').GetName], and [SCOPE.sCulture('serb_culture').GetName]) under the rule of the Sultan [SCOPE.sCharacter('crisis_scope_6').GetFirstName]. At the same time, a revolution broke out in Montenegro, a Turkish territory in the Balkans, and the Turkish army entered Montenegro to suppress it. Menshikov achieved a significant victory in Constantinople, with the Sultan agreeing to make all necessary concessions regarding the Holy Places. However, following instructions from the Tsar, Menshikov made new demands, requiring the Sultan to sign a new treaty and withdraw the Turkish army from Montenegro. This was tantamount to handing over the Balkans to the Tsar, a demand that Sultan [SCOPE.sCharacter('crisis_scope_6').GetFirstName] could not accept. Another important reason was that Lord Stratford de Redcliffe, the ambassador of [SCOPE.sCountry('gbr_scope').GetName] to [SCOPE.sCountry('tur_scope').GetName], encouraged the Sultan to reject Russia's exorbitant demands, as [SCOPE.sCountry('gbr_scope').GetName] had once again promised to support Turkey in the crisis, with the added support of [SCOPE.sCountry('fra_scope').GetName].\nIn May 1853, [SCOPE.sCountry('tur_scope').GetName] rejected [SCOPE.sCountry('rus_scope').GetName]'s ultimatum and allowed the Anglo-French joint fleet to enter the Dardanelles Strait, severing diplomatic relations between Russia and the Ottoman Empire."
dsk_france.10.a:0 "“Do not threaten me with war; I can rely on Berlin and Vienna.” — [SCOPE.sCharacter('crisis_scope_2').GetFirstName]"
concept_monarchie_de_Juillet:0 "July Monarchy"
concept_monarchie_de_Juillet_desc:0 "The July Monarchy, also known as the Orléans Monarchy, was a constitutional monarchy that ruled France from 1830 to 1848. It was named after King Louis-Philippe, who belonged to the Orléans family and began with the July Revolution of 1830.\nOn February 22, 1848, the French 'February Revolution' broke out. Seeing the situation was hopeless, Louis-Philippe fled in haste to Britain. On February 25, the revolutionary provisional government declared the establishment of the Republic, the Second French Republic, overthrowing the Orléans Monarchy."
je_fra_empire:0 "[concept_fra_empire]"
concept_fra_empire:0 "Second French Empire"
support_army_button:0 "Imperial Army"
enough_french_empire_house_var:0 "#bold Enough#! #N Napoleonic Thoughts#! have been accumulated."
modifier_french_empire_army:0 "Imperial French Army"
support_army_button_desc:0 "Enhance the research and development of key equipment such as artillery, ammunition, and armored vehicles to improve the army's independent combat capabilities and technological level."
concept_fra_empire_desc:0 "The Second French Empire was a monarchical regime established by Louis-Napoleon Bonaparte, the nephew of Napoleon Bonaparte, before [concept_fra_republic_3] (1870 to 1940) and after the Second French Republic (1848 to 1852).\nOn December 2, 1851, Louis-Napoleon Bonaparte, President of the Second French Republic, staged a coup. On January 14 of the following year, he promulgated a constitution that strengthened the powers of the president and weakened the legislative powers of the parliament. On November 7, 1852, the Senate issued a decree recommending the restoration of the empire. A plebiscite was subsequently held, with an overwhelming majority in favor. On December 2, the empire was restored, and Bonaparte became the Emperor of France, known as Napoleon III."
je_fra_empire_reason:0 "[concept_fra_empire] has been established. Although the structure of the imperial government is almost the same as that of the First Empire, the principles of their establishment are entirely different.\n[SCOPE.sCharacter('fra_ruler_scope').GetFirstName] often stated that the purpose of [concept_fra_empire] is to guide the nation towards justice and to pursue perpetual peace in foreign affairs. Earlier, [ROOT.GetCountry.GetRuler.GetFirstName] had frequently condemned the oligarchic government for neglecting social issues during his imprisonment and exile. As president of the Second Republic, he maintained his power through universal suffrage and continued his consistent stance, determined to build a new government based on the #N Napoleonic Thoughts#! he envisioned to address the aforementioned issues: a government led by [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], who represents democracy, chosen by the people; and himself, representing Napoleon I, his uncle, who rose to power by force during the French Revolution, protecting the social gains of [SCOPE.GetRootScope.GetCountry.GetName] during the revolution.\n\n#N Napoleonic Thoughts#! will accumulate based on #v #tooltippable;tooltip:[Country.GetTooltipTag],je_french_empire_house_pos current domestic conditions#!, and consuming #N Napoleonic Thoughts#! will allow for the enactment of a policy."
concept_napoleon_thought:0 "Napoleonic Thoughts"
concept_napoleon_thought_desc:0 "Napoleonic Thoughts accumulate at different speeds depending on the current domestic situation. Spending 50 points unlocks a policy."
je_french_empire_house_pos:0 "The following conditions will accumulate #bold Napoleonic Thoughts#! of #N per month:\n• Implementing #yellow Dictatorship#! or #yellow Oligarchy#! (#green +2#!).\n• Implementing #yellow Secret Police#! or #yellow National Gendarmerie#! (#green +1#!).\n• Implementing any #yellow Health Institution#! (#green +1#!).\n• Having an army size > #yellow 300#! (#green +1#!).\n• Owning #yellow Wallonia#! and #yellow Flanders#! (#green +3#!).\n• National rank is [concept_super_power] (#green +2#!).\n• Implementing #yellow Censorship#! or #yellow Dissent Illegal#! or #yellow Press Censorship#! (#green +1#!)."
support_Italian_button:0 "Support Sardinia"
support_Italian_button_desc:0 "Support Sardinia in unifying Italy. We have made a political commitment to the Kingdom of Sardinia, supporting its establishment of an Upper Italian Kingdom that includes the Kingdom of Sardinia, Lombardy, Venetia, and the Papal territories of Romagna. In exchange, they will agree to cede Savoy to us."
modifier_french_empire_italia:0 "Savoy Crown Territory"
support_ottoman_button:0 "Struggle for the Holy Places"
support_ottoman_button_desc:0 "Send the Marquis de Lavalette to Constantinople to demand that the Turkish court explicitly recognize France's protection rights over most of the Holy Land churches. In the 'Eastern Question,' Russia, Austria, and Britain have conflicting interests, so we must do everything possible to sow discord between Russia and Austria, and between Russia and Britain."
Notre_Dame_button:0 "Notre Dame de Paris"
Notre_Dame_button_desc:0 "Complete the construction of Notre Dame de Paris and open it as a symbol of France's urban postcard."
modifier_support_ottoman:0 "Incite Struggle for the Holy Places"
modifier_Notre_Dame:0 "Open Notre Dame de Paris"
je_fra_railway:0 "Paris Railway"
je_fra_railway_reason:0 "During the [concept_fra_empire], railway construction made significant progress. The railway mileage increased rapidly from over 3,000 kilometers before 1850 to 16,465 kilometers by 1869.\nAs the railway mileage expanded rapidly, France gradually formed a national railway network. These railway lines not only connected major cities and industrial centers but also extended to many remote areas, greatly improving the transportation conditions of [SCOPE.GetRootScope.GetCountry.GetName]."
je_fra_railway_tt:0 "Turn our [SCOPE.sState('beautiful_state').GetName] into a modern railway city."
modifier_fra_railways_modifier:0 "Railway City"
dsk_france.11.t:0 "Bustling Paris"
dsk_france.11.d:0 "The construction and expansion of railways greatly promoted the economic development of France. Railways, as an important means of transportation, reduced logistics costs, increased the speed of goods circulation, and provided strong support for the prosperity of industry and commerce."
dsk_france.11.f:0 "With the popularization and extension of railways, some previously remote areas gradually became new cities or industrial centers, driving the urbanization process of [SCOPE.GetRootScope.GetCountry.GetName] and promoting the concentration of population and industry."
dsk_france.11.a:0 "Finally, [SCOPE.sState('beautiful_state').GetName] shines with the light of the future."
je_fra_shopping:0 "Paris Commerce"
je_fra_shopping_reason:0 "During the [concept_fra_empire], commerce in Paris developed unprecedentedly. [SCOPE.sCharacter('fra_ruler_scope').GetFirstName] encouraged commercial innovation, and the first department stores were created under his reign."
je_fra_shopping_tt:0 "Turn our [SCOPE.sState('beautiful_state').GetName] into a modern commercial city."
modifier_fra_shopping_modifier:0 "Commercial City"
modifier_fra_shopping_modifie_2:0 "Nation of Commerce"





dsk_france.12.t:0 "Prosperous Paris"
dsk_france.12.d:0 "With the implementation of free trade policies and improvements in transportation, [SCOPE.GetRootScope.GetCountry.GetName]'s commercial activities have become increasingly prosperous. The volume of domestic and foreign trade is continuously growing, with a wider variety of goods available. French products are not only popular in the domestic market but are also exported to many countries and regions around the world."
dsk_france.12.f:0 "The government has vigorously promoted infrastructure construction, particularly the improvement of railways and transportation networks. This has greatly reduced logistics costs and improved the speed of goods circulation, providing essential infrastructure support for the prosperity of commerce."
dsk_france.12.a:0 "Finally, [SCOPE.sState('beautiful_state').GetName] shines with the light of the future."
je_fra_Royal_Academy_tt:0 "Transforming our [SCOPE.sState('beautiful_state').GetName] into a modern city of arts"
je_fra_Royal_Academy:0 "Paris Opera House"
je_fra_Royal_Academy_reason:0 "In the summer of 1861, construction of the opera house began. However, the project encountered numerous difficulties, such as an unstable foundation due to an underground stream, and the Franco-Prussian War of 1870, along with the Fourth Revolution, which halted construction. Despite these challenges, the architects and workers persevered, and the world-famous opera house was finally completed and inaugurated in 1875."
je_fra_new_paris_tt:0 "Transform [SCOPE.sState('great_state_scope').GetName] into the capital of romance"
modifier_fra_art_modifier:0 "City of Opera"
dsk_france.13.t:0 "A New Paris"
dsk_france.13.d:0 "After 17 years of reconstruction, Paris has been transformed into a modern, orderly, and beautiful city."
dsk_france.13.f:0 "[SCOPE.GetRootScope.GetCountry.GetName] in the 19th century undertook the reconstruction of Paris through comprehensive planning, phased implementation, and key breakthroughs. This process not only changed the city's appearance but also had a profound impact on its economy, society, and culture."
dsk_france.13.a:0 "Let more people gather in [SCOPE.sState('beautiful_state').GetName]!"

dsk_france.14.t:0 "Romantic Paris"
dsk_france.14.d:0 "As time passed, the [SCOPE.GetRootScope.GetCountry.GetName] government decided to rebuild a more magnificent opera house. In 1860, the young architect Charles Garnier, at the age of 35, was selected to take on the responsibility of designing the new opera house."
dsk_france.14.f:0 "In the summer of 1861, construction of the opera house began. However, the project encountered numerous difficulties, such as an unstable foundation due to an underground stream, and the Franco-Prussian War of 1870, along with the Fourth Revolution, which halted construction. Despite these challenges, the architects and workers persevered, and the world-famous opera house was finally completed and inaugurated in 1875. \nThe construction of the opera house cost more than 47 million francs, covering a total area of 11,237 square meters. Its grandeur and intricate design have made it renowned as a theater where painting, marble, and gold accents complement each other.\nThe hallways and corridors of the opera house are lavishly decorated, filled with Baroque-style elements. The marble staircase shines even brighter under the golden lights, and the ceilings and walls are adorned with many mythological and allegorical stories, exuding a rich artistic atmosphere."
dsk_france.14.a:0 "Is [SCOPE.sState('beautiful_state').GetName] not romantic?"

je_fra_new_paris:0 "New Paris"
je_fra_new_paris_goal:0 "Paris has completed three major constructions"
je_fra_new_paris_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]'s reconstruction of Paris in the 19th century was a vast and complex urban renovation project, primarily driven by [SCOPE.sCharacter('fra_ruler_scope').GetFirstName] and executed under the leadership of Georges-Eugène Haussmann. \nComprehensive planning: [SCOPE.sCharacter('fra_ruler_scope').GetFirstName] carried out comprehensive planning for Paris, aiming to create a modern, orderly, and beautiful city. Phased implementation: The reconstruction project was divided into three main phases, each with clear goals and tasks.\nWidening and new construction: Baron Haussmann undertook large-scale widening and construction of Paris' roads, significantly improving the city's road system. Quantity and length: Between 1852 and 1870, the total length of Paris' roads increased from 239 miles to 525 miles, many of which were built under Haussmann's supervision.\nDemolition and new construction: During the reconstruction, many old buildings were demolished, and about 100,000 new houses and buildings were erected. Public buildings: Numerous public buildings, such as schools, churches, theaters, and hospitals, were constructed during the reconstruction, enhancing the city's social service functions.\nCultural heritage and controversy: Although some historical buildings were demolished during the reconstruction, many buildings and cultural heritage sites of historical value were preserved. The controversies surrounding the reconstruction reflect the balance between preservation and innovation in urban renewal."

je_fra_gbr_union:0 "Anglo-French Alliance"
je_fra_gbr_union_tt:0 "It is time to reassess our relationship with [SCOPE.sCountry('gbr_scope').GetName]"
je_fra_gbr_union_reason:0 "If we are to dismantle the Holy Alliance and the Quadruple Alliance, we must reconcile with [SCOPE.sCountry('gbr_scope').GetName] and move forward together. The world is large enough to accommodate both France and Britain."
je_fra_empire_tt:0 "#yellow Destined to prevail, invincible in battle#!"
modifier_fra_beautiful_paris_modifier:0 "New Paris"
dsk_fra_empire_time:0 "The Napoleonic Eagle"
GER_FRA_decision:0 "Demand Britain and Russia not join the Franco-Prussian War"
GER_FRA_decision_desc:0 "They will gladly accept because our strength satisfies their policy of continental balance."
je_fra_pru:0 "Franco-Prussian Relations"
je_fra_pru_tt:0 "[SCOPE.sCountry('pru_scope').GetName] has taken leadership of Germany"
je_fra_aus_tt:0 "[SCOPE.sCountry('aus_scope').GetName] has taken leadership of Germany"
je_fra_ngf_tt:0 "North Germany has been unified"
je_fra_sgf_tt:0 "South Germany has been unified"
je_fra_pru_reason:0 "[SCOPE.sCountry('pru_scope').GetName] gradually rose to power in the mid-19th century, becoming the leading force in the German region. They achieved significant developments in politics, economy, and military, with their modernized army becoming one of the most powerful military forces in Europe.\n[SCOPE.sCountry('pru_scope').GetName] seeks to unify a Germany excluding [SCOPE.sCountry('aus_scope').GetName] by defeating them in war, which directly conflicts with our expansionist ambitions.\nGreat powers like [SCOPE.sCountry('gbr_scope').GetName] and [SCOPE.sCountry('rus_scope').GetName] are reluctant to see us grow too strong, thus allowing our neighbors to grow stronger."
ger_has_fail:0 "Germany is not unified"
ger_has_won:0 "We did not prevent Prussia from unifying Germany"
high_reparations:0 "Payer of Franco-Prussian War reparations"
high_reparations_1:0 "Recipient of Franco-Prussian War reparations"
dsk_france.17.t:0 "Germany does not exist"
dsk_france.17.d:0 "With the end of the war, [SCOPE.GetRootScope.GetCountry.GetName] firmly established its dominance on the continent."
dsk_france.17.f:0 "At that moment, I felt as if I were back at my grandfather Napoleon I's Battle of Jena. I am not only to forge the glory he once created but also to complete his unfinished task—to create a dazzling France on the European continent."
dsk_france.17.a:0 "Destined to prevail, invincible in battle"
modifier_fra_winner:0 "Destined to Prevail"
dsk_france.19.t:0 "New Napoleonic Code"
dsk_france.19.d:0 "This code, officially known as the 'French Civil Code,' was first promulgated by Napoleon Bonaparte in 1804 and has undergone numerous revisions throughout history, while its basic framework and principles remain unchanged."
dsk_france.19.f:0 "By making slight adjustments or additions to the provisions regarding private property rights, marriage systems, inheritance rights, etc., the Napoleonic Code continues to radiate with the charm of the times."
dsk_france.19.a:0 "This is a fundamental cornerstone of national civil law."
dsk_france.21.t:0 "National Workshops"
dsk_france.21.d:0 "A government publication announced a decree. According to the decree, all single workers between the ages of 18 and 25 employed in the national workshops must enlist, while the rest either faced unemployment or had to engage in land reclamation work. The dissolution of the national workshops, which provided jobs for 115,000 workers, infuriated the public, who began to build barricades, and soon the first shots were fired. Meanwhile, the National Assembly held a meeting to discuss the issue of the national workshops. Many representatives advocated for the immediate closure of the workshops as they had become a threat to public order."
dsk_france.21.f:0 "\"Only when everyone does their best and receives according to their needs will equality exist.\" —Louis Blanc"
dsk_france.21.a:0 "These workshops should be dissolved, it is necessary to reassure the workers of Paris."
dsk_france.21.b:0 "Don't ask what your country can do for you, think about what you can do for your country."
dsk_france.22.t:0 "[SCOPE.sState('irish_state').GetName] Uprising"
dsk_france.22.d:0 "Workers opposing the restoration of the empire occupied most of [SCOPE.sState('irish_state').GetName] and repelled a detachment of the National Guard. [SCOPE.sCharacter('bourgeoisie_leader').GetFullName] called for the National Assembly and loyal troops to evacuate Paris to prepare for an attack on [SCOPE.sState('irish_state').GetName], but the proposal was rejected. After achieving significant victories and facing stubborn resistance from government forces, the rebels halted. The next day, government forces launched their offensive, and General [SCOPE.sCharacter('white_army_general').GetFullName] defeated the rebels at great cost."
dsk_france.22.f:0 "\"In [SCOPE.sState('irish_state').GetName], I saw both winners and losers; if I support someone's sacrifice, may my name be forever cursed.\""
dsk_france.22.a:0 "[SCOPE.sState('irish_state').GetName] will never forget these days..."
dsk_france.23.t:0 "Birth of the Crown Prince"
dsk_france.23.d:0 "The silence before dawn in Paris was awakened by the booming cannon fire from the Invalides. Many residents no longer slept and began counting the number of shots fired with great interest. There is a long-standing tradition in Paris: if twenty-one shots are fired, the reigning dynasty has given birth to a girl; if one hundred and one shots are fired, a boy is born. When the twenty-first shot rang out, everyone knew that Napoleon III had an heir. The boy was named [SCOPE.sCharacter('napoleon_eugene_ruler').GetFullName]."
dsk_france.23.f:0 "\"The Senate shares with me the joy that heaven has granted me a son, celebrate, the son of France is born... Gentlemen, when an heir destined to continue the nation's order is born, this child is not just the descendant of a family but truly the son of the entire nation... It was so under the old monarchy that only represented the privileged class, and now it is even more so. The monarch is the elected representative of the nation, the first citizen of the state, and the representative of the interests of the whole people.\""
dsk_france.23.a:0 "Long live the Crown Prince!"
little_output_modifier:0 "Low Output"
modifier_fra_nap_laws:0 "New Napoleonic Code"
je_fra_laws:0 "Napoleonic Code"
je_fra_laws_reason:0 "As the earliest civil code in a capitalist country, the Napoleonic Code's influence extended far beyond France. It became the standard for bourgeois legislation in various European and American countries, promoting the development of capitalism.\n[SCOPE.sCharacter('fra_ruler_scope').GetFirstName] proposed adjustments to the code, which may include interpretation, supplementation, or refinement of specific legal provisions to meet the needs of social and economic development."
je_fra_laws_tt:0 "The Napoleonic Code needs revision"

je_fra_land:0 "French Agriculture"
je_fra_land_reason:0 "[SCOPE.sCharacter('fra_ruler_scope').GetFirstName]'s government enacted and implemented the 'Land Reclamation Act' and the 'Drainage Act,' organizing a large workforce to reclaim wasteland and manage swamps.\n[SCOPE.sCharacter('fra_ruler_scope').GetFirstName] proposed the establishment of 'agricultural communities' in his book 'The Abolition of Poverty,' aiming to provide poor families with land to cultivate and livestock to care for, thereby addressing their livelihood issues and promoting agricultural development. Although this concept may face many challenges in practical implementation, it reflects the government's emphasis on and support for agricultural development.\n[SCOPE.sCharacter('fra_ruler_scope').GetFirstName] believed in the principles of free trade, significantly reducing tariffs on imported goods, lifting embargoes on certain products, and abolishing the protectionist tariff policies that had been in place since the First French Empire. This allowed a large influx of foreign goods into the French market at lower prices, providing more market opportunities and sources of raw materials for agriculture."
je_fra_land_tt:0 "Agricultural schools teaching new agricultural techniques"
modifier_france_develop:0 "New French Agriculture"
dsk_france.20.t:0 "New French Agriculture"
dsk_france.20.d:0 "These measures have expanded the cultivated land in France by 1.5 million hectares, bringing the total cultivated land to 26.5 million hectares, the highest level in history."
dsk_france.20.f:0 "With the development of industry, French agriculture has received more support. For example, industrial development has provided agriculture with more mechanized and modern tools; at the same time, agricultural development has provided industry with more raw materials and markets.\nWith France's colonial expansion and the development of international trade, French agricultural products began to enter international markets. This not only brought more income to French agriculture but also improved the international competitiveness of French agriculture."
dsk_france.20.a:0 "Praise the Emperor"
je_fra_gbr_tur:0 "Crimean War - Turkish Side"
je_fra_gbr_tur_tt:0 "If [SCOPE.sCountry('rus_scope').GetName] successfully controls Constantinople, our position in the Balkans will become untenable."
je_fra_gbr_tur_reason:0 "The term 'Eastern Question' refers to the geopolitical issues in the Near and Middle East, primarily concerning the decline and potential dissolution of [SCOPE.sCountry('tur_scope').GetName] and its territories. The term was first used at the Congress of Verona and later became a diplomatic term encompassing the various international problems caused by [SCOPE.sCountry('tur_scope').GetName]'s decline. \nKarl Marx described the Eastern Question as an 'unsolvable problem' and 'an endless source of difficulties' that emerged in the wake of Western revolutions and subsequent periods of apparent stability, reducing the Eastern Question to 'What should be done with Turkey?'"
modifier_crimea_winner:0 "Crimean Victor"
modifier_crimea_loser:0 "Crimean Loser"

dsk_france.15.t:0 "Crimean Victor"
dsk_france.15.d:0 "Expelled [SCOPE.sCountry('rus_scope').GetName] and its forces from the Black Sea"
dsk_france.15.f:0 "With the heroic efforts of the allied forces of [SCOPE.sCountry('gbr_scope').GetName] and [SCOPE.sCountry('fra_scope').GetName], [SCOPE.sCountry('rus_scope').GetName] suffered a great defeat, and [SCOPE.sCharacter('crisis_scope_2').GetFirstName] committed suicide in despair."
dsk_france.15.a:0 "They will never breach the Black Sea blockade or realize their Third Rome dream!"

tur_event.1.t:0 "News from Our Embassy in the Ottoman Empire!"
tur_event.1.d:0 "In February 1853, Prince Alexander Sergeyevich Menshikov was sent as [SCOPE.sCountry('rus_scope').GetName]'s special envoy to Constantinople, demanding that [SCOPE.sCountry('tur_scope').GetName] recognize the Tsar's special protection rights over the Orthodox Christian subjects ([SCOPE.sCulture('greek_culture').GetName], [SCOPE.sCulture('bulgarian_culture').GetName], [SCOPE.sCulture('romanian_culture').GetName], and [SCOPE.sCulture('serb_culture').GetName], among others) under Sultan [SCOPE.sCharacter('crisis_scope_5').GetFirstName]'s rule. Meanwhile, a revolution broke out in Montenegro, one of Turkey's Balkan territories, and the Turkish army moved in to suppress it. Menshikov achieved a significant victory in Constantinople, with the Sultan agreeing to make all necessary concessions on the issue of holy sites. However, under instructions from the Tsar, Menshikov made new demands, requiring the Sultan to sign a new treaty and withdraw Turkish troops from Montenegro. This effectively meant handing over the Balkans to the Tsar, which Sultan [SCOPE.sCharacter('crisis_scope_5').GetFirstName] could not accept. Another crucial factor was the encouragement from [SCOPE.sCountry('gbr_scope').GetName]'s ambassador to [SCOPE.sCountry('tur_scope').GetName], Lord Redcliffe, who advised the Sultan to reject Russia's exorbitant demands, promising British support in the crisis, along with support from [SCOPE.sCountry('fra_scope').GetName].\nIn May 1853, [SCOPE.sCountry('tur_scope').GetName] rejected [SCOPE.sCountry('rus_scope').GetName]'s ultimatum and allowed the British and French joint fleets to enter the Dardanelles. Diplomatic relations between Russia and Turkey were severed."
tur_event.1.f:0 "Supported by [SCOPE.sCountry('gbr_scope').GetName] and [SCOPE.sCountry('fra_scope').GetName], Sultan [SCOPE.sCharacter('crisis_scope_5').GetFirstName] demanded that [SCOPE.sCountry('rus_scope').GetName] return the two principalities. On October 16, 1853, Russia declared war on Turkey, sparking the Crimean War. Britain and France, seeking to maintain and expand their influence in Turkey, joined the war on Turkey's side against Russia."
tur_event.1.a:0 "The glorious Third Rome [SCOPE.sCountry('rus_scope').GetName] will finally reach its most loyal Tsargrad."
tur_event.1.b:0 "Glory returns to [SCOPE.sCountry('tur_scope').GetName]!"
tur_event.1.c:0 "What does it matter to me? What does it matter?"

dsk_france.18.t:0 "Crimean Victor"
dsk_france.18.d:0 "Expelled [SCOPE.sCountry('gbr_scope').GetName], [SCOPE.sCountry('fra_scope').GetName], and their forces from the Black Sea"
dsk_france.18.f:0 "With the heroic efforts of the allied forces of [SCOPE.sCountry('rus_scope').GetName] and [SCOPE.GetRootScope.GetCountry.GetName], the [SCOPE.sCountry('gbr_scope').GetName] and [SCOPE.sCountry('fra_scope').GetName] alliance suffered a great defeat."
dsk_france.18.a:0 "This is the dream of the Third Rome!"


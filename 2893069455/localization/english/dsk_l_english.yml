 bc_finish.6.t:0 "July Crisis "
bc_finish.6.d:0 "In 1914, there was no turning back, a terrible war was about to unfold."
bc_finish.6.f:0 "Austro-Hungarian militarists clamored loudly, 'Draw your swords, aim at Serbia.' A newspaper in Vienna wrote: 'For six years we have been waiting for the outbreak of any serious crisis... We want war because it is the conviction of our hearts. Our ideals can only be realized through one war, by a radical, sudden means: that is a mighty Austro-Hungarian Empire.' Germany was eager for war, seeing the year 1914 as favorable. Two events in 1914 prompted Germany to seek a quick war. First, in June, Germany completed the widening of the Kiel Canal, allowing newly built dreadnoughts to sail directly from the North Sea to the Baltic Sea, accelerating the flexibility of troop movements. Second, in April, Britain began naval negotiations with Russia, causing concern for the Germans. On June 1st, after learning of this, Chancellor Bethmann-Hollweg told Eckhardt Stein, who had been a long-time envoy to Britain: 'We are ready, and the sooner the better.'"
 bc_finish.6.a:0 "International treaties are just a piece of scrap paper"
clever_dsk.33.t:0 "Population Exchange?"
clever_dsk.33.d:0 "Due to our deteriorating relations with Greece, a group of Greeks are trying to flee our country. Perhaps we can capitalize on this situation by signing a population exchange agreement with the Greek government to receive back our Turkish compatriots living abroad."
clever_dsk.33.f:0 "Since the Greeks are unwilling to stay in our country, let's send them back to their homeland; of course, the Greek government also has the obligation to send back their Turkish population residing within their borders to our country."
clever_dsk.33.a:0 "Sign the 'Agreement for the Exchange of Population Between Greece and Turkey' and notify Greece to repatriate Turkish citizens."
clever_dsk.33.b:0 "Persuade elite Greeks within the country to stay."

clever_dsk.34.t:0 "Population Exchange"
clever_dsk.34.d:0 "The Turkish government invites us to sign the 'Agreement for the Exchange of Population Between Greece and Turkey' to exchange the populations of the two countries."
clever_dsk.34.f:0 "Many Greek compatriots have already packed up and left Turkey, heading for our capital. Perhaps we should also send back the unruly Turkish population within our borders to their homeland."
clever_dsk.34.a:0 "This is a good opportunity to increase the proportion of our main ethnic group."
clever_dsk.34.b:0 "Disagree with the agreement."

clever_dsk.35.t:0 "Response from the Greek Government"
clever_dsk.35.d:0 "The Greek government agrees to sign the 'Agreement for the Exchange of Population Between Greece and Turkey,' and batches of overseas Turkish people are returning to their great homeland."
clever_dsk.35.f:0 "Today's capital is particularly lively, and people are actively helping their compatriots who are returning home to build their new homeland."
clever_dsk.35.a:0 "Arrange accommodations for our capital's new compatriots."
  
spain_get_northern_mariana:0 "Obtain the Northern Mariana Islands"
spain_get_northern_mariana_desc:0 "Mariana is the name of the queen of our king, Felipe IV, and a hundred years ago we set foot to occupy these islands."
spain_get_guam:0 "Occupying Guam and the Caroline Islands"
spain_get_guam_desc:0 "Our conquerors and missionaries have long lived on these islands, and it is time to bring them under royal jurisdiction."
chile_get_easter_island:0 "Obtain Easter Island"
chile_get_easter_island_desc:0 "We should expand our influence towards the Pacific."
clever_dsk.36.t:0 "Wandering Bruneian Ruler"
clever_dsk.36.d:0 "The Sultanate of Brunei no longer exists, but the Bruneian ruler still hopes that the conquerors will provide him with a residence. In return, he will help us pacify the local population."
clever_dsk.36.f:0 "In the mid-16th century, European countries successively invaded Brunei. Today, Brunei has been destroyed, and the local residents are very resentful, planning to rebel against the conquerors."
clever_dsk.36.a:0 "Incorporate Brunei as a protected state, provide it with a small piece of land to stabilize the hearts of the people of Borneo."
clever_dsk.36.b:0 "The conquered have no right to make demands."
clever_dsk.37.t:0 "Annexing Easter Island"
clever_dsk.37.d:0 "The Chilean government secretly dispatched troops to control Easter Island and claimed that the island is unclaimed territory, now annexed to Chilean territory, hoping for international recognition."
clever_dsk.37.f:0 "The Rapanui people were captured by colonizers to be slaves and were also subjected to attempts by missionaries to eliminate their culture. Oh, great stone statues, can you shelter the people of Te Kāinga?"
clever_dsk.37.a:0 "Recognize Chile's occupation of the island."
clever_dsk.37.b:0 "Easter Island is ours, Chile has no right to annex it."
clever_dsk.38.t:0 "Deserving Promotion"
clever_dsk.38.d:0 "A general in the army recently led a charge in a battle, successfully quelling a mutiny. His colleagues praise his strict discipline and effective command. Now, some officers request his promotion."
clever_dsk.38.f:0 "Both officers and soldiers praise Yuan Shikai's courage and steadfastness, unanimously supporting his promotion."
clever_dsk.38.a:0 "Promote Yuan Shikai."
clever_dsk.38.b:0 "His military abilities need further observation."
clever_dsk.39.t:0 "Entering Politics?"
clever_dsk.39.d:0 "Thanks to the efforts of General Yuan Shikai, some officials recommend him to become the leader of the army, which would better manage our military."
clever_dsk.39.f:0 "The new army established and commanded by Yuan Shikai has a complete system of organizational structure, officer appointment, and training system, making it outstanding in our military. Politicians extend an olive branch to win over this force."
clever_dsk.39.a:0 "We need talents like him."
clever_dsk.39.b:0 "Oppose his entry into politics."
clever_dsk.40.t:0 "Presidential Candidate"
clever_dsk.40.d:0 "With the abdication of the Qing Emperor and the establishment of the new Republic, there is fierce debate within the government cabinet over who should assume the presidency. At this moment, a general walks into the meeting hall."
clever_dsk.40.f:0 "Given Yuan Shikai's appointment as leader of the army, commanding numerous troops, the provisional government is concerned that opposing his presidency could lead to a civil war between the North and South, causing immense suffering."
clever_dsk.40.a:0 "Yuan the Great President will lead us to republicanism."
clever_dsk.40.b:0 "Strongly oppose his presidency."
clever_dsk.41.t:0 "Restoration of the Monarchy?"
clever_dsk.41.d:0 "Trapped in political turmoil and influenced by the advice and support of some individuals, President Yuan Shikai attempts to restore the monarchy and establish a constitutional monarchy."
clever_dsk.41.f:0 "The majority of the people lack noble knowledge, shifting from dictatorship to republicanism so abruptly will surely lead to future problems with presidential succession, causing chaos... If not extinguished in time, it may lead to the ruination of China's independence. China is more suitable for a monarchy than a republic; there is almost no doubt about this."
clever_dsk.41.a:0 "Welcome Hongxian, the constitutional emperor."
clever_dsk.41.b:0 "The republic will never perish."
clever_dsk.42.t:0 "Participation in the War"
clever_dsk.42.d:0 "Our country's ambassador has received news that [SCOPE.sCountry('british_haha_help_scope').GetName] is participating in the Western Front war of the Allied Powers to fulfill the London Treaty and protect Belgium."
clever_dsk.42.f:0 "I feel cursed because I love this war, I know it is shattering and tearing apart thousands of lives every moment, yet I cannot control it, I enjoy every second of its happening." - Winston Churchill
clever_dsk.42.a:0 "The balance of victory will tilt to one side."
clever_dsk.43.t:0 "Mother Country's Request for Participation in the War"
clever_dsk.43.d:0 "Our mother country [SCOPE.sCountry('grandmother_need_our_help_scope').GetName] has been involved in an unprecedented war, now ordering us to immediately mobilize soldiers to assist in combat."
clever_dsk.43.f:0 "One hundred years later, people will see how terrible and meaningless this war is."
clever_dsk.43.a:0 "Immediately mobilize the army."
clever_dsk.43.b:0 "We are not capable of deploying troops."
clever_dsk.44.t:0 "[SCOPE.sCountry('we_help_our_mother_scope').GetName] Participates in the War"
clever_dsk.44.d:0 "[SCOPE.sCountry('we_help_our_mother_scope').GetName] announces joining the war of the Allied Powers to defend [SCOPE.sCountry('grandmother_need_our_help_scope').GetName]."
clever_dsk.44.f:0 "One hundred years later, people will see how terrible and meaningless this war is."
clever_dsk.44.a:0 "The balance of victory will tilt to one side."
clever_dsk.45.t:0 "Participation in the War?"
clever_dsk.45.d:0 "Major countries in the world are now involved in a massive war, perhaps we can also join to gain benefits and international status."
cle

ver_dsk.45.f:0 "The Minister of Defense believes that joining the Allied Powers now that they are in an advantageous position is necessary to achieve victory."
clever_dsk.45.a:0 "Dispatch some troops to support the Allied Powers."
clever_dsk.45.b:0 "Cherish the hard-won peace."
clever_dsk.46.t:0 "[SCOPE.sCountry('we_help_our_friends_scope').GetName] Participates in the War"
clever_dsk.46.d:0 "[SCOPE.sCountry('we_help_our_friends_scope').GetName] announces joining the war of the Allied Powers to gain higher international status."
clever_dsk.46.f:0 "One hundred years later, people will see how terrible and meaningless this war is."
clever_dsk.46.a:0 "The balance of victory will tilt to one side."
clever_dsk.47.t:0 "Kerensky Comes to Power"
clever_dsk.47.d:0 "After the February Revolution, a brand new Russian Republic has emerged on the world stage. Now, a figure capable of coordinating the interests of various groups has been recommended for the prime minister's seat."
clever_dsk.47.f:0 "Kerensky's moderate attitude temporarily wins the approval of all parties. He promises to bring civil liberties, women's equality, and universal suffrage."
clever_dsk.47.a:0 "We need his leadership."
clever_dsk.47.b:0 "Perhaps maintaining the status quo is better."
clever_dsk.48.t:0 "Call for Help in the East"
clever_dsk.48.d:0 "[SCOPE.sCountry('come_to_help_russian_scope').GetName] Ambassador expresses that their army is facing a downturn in the East and hopes that we can support them with troops."
clever_dsk.48.f:0 "From Memel to Galicia, soldiers on both sides cruelly fight along the long front line, and Russia is currently at a disadvantage, urgently needing troops to stabilize their front line."
clever_dsk.48.a:0 "Dispatch expeditionary forces to participate in the Eastern Front war."
clever_dsk.48.b:0 "Maintain the current situation in the East."
clever_dsk.49.t:0 "[SCOPE.sCountry('britain_now_to_russian_scope').GetName] Participates in Eastern Front Combat"
clever_dsk.49.d:0 "Our ambassador to Britain reports that [SCOPE.sCountry('britain_now_to_russian_scope').GetName] has decided to help [SCOPE.sCountry('come_to_help_russian_scope').GetName] and participate in the Eastern Front combat."
clever_dsk.49.f:0 "One hundred years later, people will see how terrible and meaningless this war is."
clever_dsk.49.a:0 "The balance of victory will tilt to one side."
clever_dsk.50.t:0 "[SCOPE.sCountry('american_give_help_scope').GetName] Participates in the War"
clever_dsk.50.d:0 "Our country's ambassador has received news that [SCOPE.sCountry('american_give_help_scope').GetName] is participating in the war of the Allied Powers."
clever_dsk.50.f:0 "Our Foreign Minister sent a telegram to Mexico about an alliance against the United States, which was deciphered by Britain. [SCOPE.sCountry('american_give_help_scope').GetName] society expressed outrage at the contents of the telegram, leading [SCOPE.sCountry('american_give_help_scope').GetName] to join the war."
clever_dsk.50.a:0 "Oh no!"
clever_dsk.51.t:0 "European War"
clever_dsk.51.d:0 "Europe is now embroiled in a massive war, with soldiers from many countries falling in the trenches. Many countries urgently need manpower to win this great war, perhaps this is an opportunity to improve our relations with European countries."
clever_dsk.51.f:0 "The Minister of Defense believes that joining the war now will lead to future victories, enhancing our international status and improving our relations with European countries. This will help China gain international influence."
clever_dsk.51.a:0 "Participate in the war, but mainly by sending laborers."
clever_dsk.51.b:0 "Maintain domestic peace."
clever_dsk.52.t:0 "[SCOPE.sCountry('chinese_come_to_europe_scope').GetName] Participates in the War"
clever_dsk.52.d:0 "Our country's ambassador has received news that [SCOPE.sCountry('chinese_come_to_europe_scope').GetName] is participating in the war of the Allied Powers."
clever_dsk.52.f:0 "Before their soldiers arrive, many Chinese laborers hastily boarded ships, arriving in the capital of France, responsible for transporting supplies, digging trenches, and transporting wounded soldiers."
clever_dsk.52.a:0 "The balance of victory will tilt to one side."
clever_dsk.53.t:0 "Partition of Palestine"
clever_dsk.53.d:0 "Israel has successfully established itself, returning to the promised land. But the local Arabs protest heavily against us occupying their land. Perhaps we should heed international calls for a two-state solution?"
clever_dsk.53.f:0 "Major world powers demand that we divide Palestine into two states, one Jewish and one Arab. Failure to comply will escalate conflict between the two ethnic groups."
clever_dsk.53.a:0 "We need reconciliation."
clever_dsk.53.b:0 "No new Arab state."
clever_dsk.54.t:0 "Partition of Palestine"
clever_dsk.54.d:0 "Palestine has successfully gained independence, but local Jews protest heavily against our nation-building efforts. Perhaps we should heed international calls for a two-state solution?"
clever_dsk.54.f:0 "Major world powers demand that we divide Palestine into two states, one Jewish and one Arab. Failure to comply will escalate conflict between the two ethnic groups."
clever_dsk.54.a:0 "We need reconciliation."
clever_dsk.54.b:0 "No new Jewish state."
clever_dsk.55.c:0 "Encourage him to work better for the government."
clever_dsk.57.t:0 "Outbreak of Balkan Wars"
clever_dsk.57.d:0 "The war between Serbia and the Turks has erupted, perhaps we should help Serbia to gain more enemy territory."
clever_dsk.57.f:0 "There are also Greek compatriots suffering under Turkish rule, and the public expects us to take practical action to rescue them."
clever_dsk.57.a:0 "Oppressed Balkan compatriots unite!"
clever_dsk.57.b:0 "We are not ready for war."
clever_dsk.58.f:0 "There are also Bulgarian compatriots suffering under Turkish rule, and the public expects us to take practical action to rescue them."
clever_dsk.59.f:0 "There are also Serbian compatriots suffering under Turkish rule, and the public expects us to take practical action to rescue them."
clever_dsk.60

.t:0 "Balkan War Ends"
clever_dsk.60.d:0 "The Balkan War has ended with our ally achieving remarkable success. Perhaps now is the time to express our congratulations and discuss future cooperation."
clever_dsk.60.f:0 "The victorious side of the Balkan War has obtained a lot of territory from Turkey, and Bulgaria has joined forces to attack its allies. We can gain much from supporting our ally."
clever_dsk.60.a:0 "We must seize the opportunity for cooperation."
clever_dsk.60.b:0 "We should maintain our neutrality."
clever_dsk.61.t:0 "Balkan Wars"
clever_dsk.61.d:0 "The Balkan Wars have erupted. Bulgaria has taken the opportunity to declare war on its former allies. Our ally Serbia is facing a severe threat. Should we send troops to support them?"
clever_dsk.61.f:0 "We need to demonstrate our loyalty to our ally and ensure that Bulgaria does not gain too much from this war, which would be detrimental to our interests."
clever_dsk.61.a:0 "Send troops to support our ally."
clever_dsk.61.b:0 "Stay out of the conflict."
clever_dsk.62.t:0 "Japan's Announcement of Participation in the War"
clever_dsk.62.d:0 "Our ambassador to Japan reports that Japan has decided to participate in the war of the Allied Powers, hoping to obtain territories in the Far East and seize more colonies."
clever_dsk.62.f:0 "One hundred years later, people will see how terrible and meaningless this war is."
clever_dsk.62.a:0 "The balance of victory will tilt to one side."
clever_dsk.63.t:0 "The Constantinople Issue"
clever_dsk.63.d:0 "We have taken the entire Eastern Thrace from the Turks, including the millennia-old capital of the Roman Empire—Constantinople. However, for the sake of balance, Britain and France demand that we return part of Eastern Thrace to Turkey."
clever_dsk.63.f:0 "The Turks of Eastern Thrace are attempting to resist our rule. Refusing to return part of the territory not only risks Turkish unrest but also worsens our relations with Britain and France."
clever_dsk.63.a:0 "Accept the demands of Britain and France."
clever_dsk.63.b:0 "Refuse to give up the gains."
clever_dsk.64.t:0 "[SCOPE.sCountry('give_some_thrace_to_turkish_scope').GetName] announces withdrawal from Constantinople"
clever_dsk.64.d:0 "[SCOPE.sCountry('give_some_thrace_to_turkish_scope').GetName] accepts the intervention of the Great Powers and decides to withdraw troops from Constantinople, returning part of the territory to the Turks."
clever_dsk.64.f:0 "Turkey, the sick man of Europe, resigns itself to the fate of being divided by the Great Powers."
clever_dsk.64.a:0 "What will be the future fate of Constantinople?"
clever_dsk.65.t:0 "Abused Rubber Workers"
clever_dsk.66.t:0 "Rubber Workers Subjected to Abuse"
clever_dsk.66.d:0 "[SCOPE.sCountry('bel_kill_drc_people_scope').GetName] subjects rubber workers who fail to meet work standards to physical abuse, ranging from flogging to severe mutilation, even murdering their relatives as a warning. This severely violates human ethical standards."
clever_dsk.66.f:0 "News of [SCOPE.sCountry('bel_kill_drc_people_scope').GetName]'s brutal actions has spread to our country, causing great shock among the populace, leading to condemnation of [SCOPE.sCountry('bel_kill_drc_people_scope').GetName]'s atrocities."
clever_dsk.66.a:0 "Condemn [SCOPE.sCountry('bel_kill_drc_people_scope').GetName]."
clever_dsk.66.b:0 "Remain silent."
clever_dsk.67.t:0 "Condemnation of [SCOPE.sCountry('condemn_bel_kill_drc_scope').GetName]"
clever_dsk.67.d:0 "[SCOPE.sCountry('condemn_bel_kill_drc_scope').GetName] issues a strong condemnation of our mistreatment of rubber workers."
clever_dsk.67.f:0 "Some missionaries have exposed our mistreatment of rubber workers as 'atrocities,' spreading the news to Europe. Various countries' social media, and even renowned literati, are condemning our actions."
clever_dsk.67.a:0 "Isn't it because they're not working hard enough?"
clever_dsk.68.t:0 "Civilizing Mission?"
clever_dsk.68.d:0 "King Leopold has met an explorer named Henry Morton Stanley. The explorer claims to have a territory in the Congo River basin where the natives have not yet been civilized. He hopes the king will sponsor him to spread civilization."
clever_dsk.68.f:0 "The explorer passionately tells the king how he can provide humanitarian aid to the Congo natives, help baptize them, and integrate them into civilized society. The king agrees to sponsor him, hoping to gain a reputation as a philanthropist."
clever_dsk.68.a:0 "Parliament supports the king's decision to send people to carry out civilizing missions."
clever_dsk.68.b:0 "Parliament vetoes the king's rash actions."
clever_dsk.69.d:0 "Government officials have recently made contact with an explorer named Henry Morton Stanley. The explorer claims to have a territory in the Congo River basin where the natives have not yet been civilized. He hopes to receive sponsorship to spread civilization."
clever_dsk.69.f:0 "The explorer passionately tells the king how he can provide humanitarian aid to the Congo natives, help baptize them, and integrate them into civilized society. If agreed to sponsor him, perhaps significant wealth could be obtained."
clever_dsk.69.a:0 "Fund him to carry out civilizing missions."
clever_dsk.69.b:0 "Reject colonization."
clever_dsk.70.t:0 "Belgian Colonization of the Congo"
clever_dsk.70.d:0 "[SCOPE.sCharacter('bel_leopold_II_saxe_gotha_scope').GetFullName] sponsored an explorer named Henry Morton Stanley to enter the Congo River basin, using firearms to coerce local chiefs into signing treaties of subjugation and transferring land. Due to conflicting interests, the Great Powers agreed to Belgian colonization of the area. Due to the vastness of the land, they established the Congo Free State to manage it."
clever_dsk.70.f:0 "Forcing the Congolese to collect ivory is not for profit but to liberate them from laziness." — [SCOPE.sCharacter('bel_leopold_II_saxe_gotha_scope').GetFullName]
clever_dsk.70.a:0 "Is the Congo Free State truly 'free'?"
clever_dsk.71.t:0 "Storm Brewing"
clever_dsk.71.d:0 "The Boxer Rebellion is rapidly spreading across China. They burn churches, dismantle power lines, and even invade treaty port concessions. Several foreign ambassadors have telegraphed the Qing government to suppress the Boxers, seemingly without consent."
clever_dsk.71.f:0 "If the Qing cannot quell these rebels, the Great Powers are likely to dispatch their own troops for a 'peacekeeping' mission to protect their interests in China."
clever_dsk.71.a:0 "What will happen next?"
clever_dsk.74.t:0 "Sinking of the Lusitania"
clever_dsk.74.d:0 "[SCOPE.sCharacter('war_crimes_admiral').GetFullName] sank the passenger ship Lusitania, resulting in the deaths of 115 Americans onboard. Although we had previously warned of attacking all ships trading with the Allies, this still prompted stern protests from the United States, demanding that we cease attacks on merchant vessels."
clever_dsk.74.f:0 "The military insists that [SCOPE.sCharacter('war_crimes_admiral').GetFullName]'s actions were justified, while the civilian government suggests apologizing to the American representatives and restricting submarine warfare to salvage our tarnished international image."
clever_dsk.74.a:0 "[SCOPE.sCharacter('war_crimes_admiral').GetHerHim] did the right thing."
clever_dsk.74.b:0 "Publicly apologize to the United States."
clever_dsk.75.t:0 "Sinking of the Lusitania"
clever_dsk.75.d:0 "A German submarine sank the British liner Lusitania, resulting in the deaths of thousands, including 115 Americans. American society strongly condemns the war criminal [SCOPE.sCharacter('war_crimes_admiral').GetFullName] and the German government for implementing unrestricted submarine warfare."
clever_dsk.75.f:0 "Under pressure from the international community, the German government publicly apologizes to the American representatives, but this does not mean an end to the practice of attacking merchant ships."
clever_dsk.75.a:0 "Continue to monitor the global situation."
clever_dsk.76.t:0 "Outstanding Officer"
clever_dsk.76.d:0 "[SCOPE.sCharacter('petain_scope').GetFullName] successfully repelled an enemy attack in battle. His strategic approach of 'more iron, less blood' has earned him the respect of soldiers."
clever_dsk.76.f:0 " [SCOPE.sCharacter('petain_scope').GetFullName]'s excellent defensive strategy and the rotation system he implemented have effectively enhanced the combat effectiveness of our soldiers."
clever_dsk.76.a:0 "Promote [SCOPE.sCharacter('petain_scope').GetFullName] to marshal."
clever_dsk.76.b:0 "Continue to observe his performance."
clever_dsk.77.t:0 "Land Beneath the Sun"
clever_dsk.77.d:0 "[SCOPE.sCharacter('william_II_want_africa_scope').GetFullName] is very envious of the vast African colonies of other powers and is now planning to try to persuade government officials to join the division of Africa."
clever_dsk.77.f:0 "Competing for land in Africa can provide new sources of raw materials and new markets for product sales, alleviating the current problem of market saturation. At the same time, it can also help establish a world order centered around Germany."
clever_dsk.77.a:0 "Send colonizers to acquire the 'land beneath the sun'."
clever_dsk.77.b:0 "Stop [SCOPE.sCharacter('william_II_want_africa_scope').GetFullName]'s rash behavior."
clever_dsk.78.t:0 "Establishment of German Colonies in Africa"
clever_dsk.78.d:0 "[SCOPE.sCountry('german_william_want_africa_scope').GetName]'s [SCOPE.sCharacter('william_II_want_africa_scope').GetFullName] attempts to join the ranks of colonizing Africa, they have coerced several tribal chiefs into signing treaties and seized large swathes of land."
clever_dsk.78.f:0 "[SCOPE.sCountry('german_william_want_africa_scope').GetName] aims to become a global empire. Our compatriots reside everywhere on this earth. German goods, German knowledge, and German diligence will cross the seas." — [SCOPE.sCharacter('william_II_want_africa_scope').GetFullName]
clever_dsk.78.a:0 "Arrogant rhetoric."
clever_dsk.79.t:0 "Transfer of Power"
clever_dsk.79.d:0 "Sun Yat-sen has left China, but his pursuit of freedom and equality for China still requires the efforts of others. Currently, the congress has elected a leader recognized by all parties to succeed Mr. Sun."
clever_dsk.79.f:0 "Generous and heroic in adversity, at ease in captivity. He draws his sword to end it all, fulfilling his youthful pledge." 
clever_dsk.79.a:0 "He can lead us to continue realizing the Three Principles of the People."
clever_dsk.79.b:0 "This man is not suitable for succession."
clever_dsk.80.t:0 "Public Petition"
clever_dsk.80.d:0 "We suffered a devastating defeat, forced to cede the homeland of the Han people to Japan. News spread, and the nation's anger surged. Over a thousand scholars, led by Kang Youwei and Liang Qichao, jointly petitioned the Emperor with proposals to resist concession, relocate the capital, strengthen the military, and reform."
clever_dsk.80.f:0 "To save the country from peril, issue a decree to rally the nation; relocate the capital to stabilize the foundation; strengthen the military to enhance national power; reform to establish governance." 
clever_dsk.80.a:0 "Perhaps we should consider accepting some of their requests."
clever_dsk.80.b:0 "Reject them."
clever_dsk.81.t:0 "Wuxu Coup"
clever_dsk.81.d:0 "The bourgeois reformers have gained the Emperor's approval, and he has decided to implement reform. However, this has aroused the displeasure of the conservative faction led by Empress Dowager Cixi. The Empress Dowager has begun to weaken the Emperor's power, forcing the reformers to resort to desperate measures, hoping to assassinate the Empress Dowager."
clever_dsk.81.f:0 "The Empress Dowager has attempted to nullify most of the new policies, returning to her regency. If we do not take action now, the reformers will be persecuted, and the reform will utterly fail."
clever_dsk.81.a:0 "Compromise with the Empress Dowager."
clever_dsk.81.b:0 "Oppose Empress Dowager [SCOPE.sCharacter('ecchi_chi_cixi_character_benefactor').GetFullName]."
clever_dsk.81.c:0 "Dispatch secret police to assassinate [SCOPE.sCharacter('ecchi_chi_cixi_character_benefactor').GetFullName]."
clever_dsk.82.t:0 "Protection War"
clever_dsk.82.d:0 "[SCOPE.sCharacter('chi_general_yuan_shikai_benefactor').GetFullName] has declared acceptance of the monarchy, inciting a struggle against Yuan led by General [SCOPE.sCharacter('ecchi_chi_cai_e_character_benefactor').GetFullName]."
clever_dsk.82.f:0 "The commander-in-chief of the Republic of China's Protection Army, [SCOPE.sCharacter('ecchi_chi_cai_e_character_benefactor').GetFullName], solemnly vows to our compatriots across the nation: Yuan's actions are unjust, usurping power for self-interest, speaking of national crisis as fleeting as morning dew. The five major ethnicities, united under the republic, Yuan has offended the Republic of China, becoming the enemy of all five races. With unity, there is no more room for racial boundaries." 
clever_dsk.82.a:0 "Suppress the rebellion."
clever_dsk.82.b:0 "Immediately restore the republic and compromise with [SCOPE.sCharacter('ecchi_chi_cai_e_character_benefactor').GetFullName]."
clever_dsk.83.t:0 "Emperor's Compromise"
clever_dsk.83.d:0 "The outbreak of the Protection War has shaken many provinces in the south, with a trend of secession from the central government. Emperor [SCOPE.sCharacter('university_benefactor').GetFullName] has had a change of heart, abandoning the idea of monarchy."
clever_dsk.83.f:0 "Those who advocate monarchy intend to consolidate the foundation of the country. The revocation of this recognition has been decided. If there is any disturbance in the regions, creating trouble, the President cannot sit idly by and ignore it." — [SCOPE.sCharacter('university_benefactor').GetFullName]
clever_dsk.83.a:0 "Revoke the monarchy and restore the republic."
clever_dsk.83.b:0 "Persuade the Emperor to dismiss the idea."
clever_dsk.84.t:0 "[SCOPE.sCharacter('university_benefactor').GetFullName]'s Passing"
clever_dsk.84.a:0 "A long battle with uremia finally claimed the life of [SCOPE.sCharacter('university_benefactor').GetFullName]. With warlords of the Beiyang clique leaderless, internal chaos ensues, and a warlord melee looms."
clever_dsk.86.t:0 "Palace-Institute Power Struggle"
clever_dsk.86.d:0 "With Yuan Shikai and his Chinese Empire consigned to history, [SCOPE.sCharacter('chi_li_yuanhong_character_benefactor').GetFullName] assumes the presidency. He reinstates the parliament and provisional constitution, appointing [SCOPE.sCharacter('chi_duan_qirui_character_benefactor').GetFullName] as prime minister. However, conflicts persist between the two over constitutional drafting in the parliament, with both seeking to assert their authority over the other."
clever_dsk.86.f:0 "The well-known rivalry between the President of the Presidential Palace and the Prime Minister of the State Council. Perhaps someone should be sent to mediate their disputes."
clever_dsk.86.a:0 "A tumultuous situation."
clever_dsk.87.t:0 "Zhang Xun's Entry into Beijing?"
clever_dsk.87.d:0 "[SCOPE.sCharacter('chi_li_yuanhong_character_benefactor').GetFullName] attempts to remove Duan Qirui from power to resist his hegemony, stirring retaliation from Duan Qirui, who threatens to declare provincial independence to overthrow Li Yuanhong. Perhaps calling [

SCOPE.sCharacter('chi_zhang_xun_character_benefactor').GetFullName], who maintains a neutral stance, to negotiate and mediate the conflict in Beijing."
clever_dsk.87.f:0 "Zhang Xun stands out awkwardly among the Beiyang warlords. Even after the abdication of the Qing emperor, he still professes loyalty to the Qing dynasty. His troops sport long queues, resembling Manchus, earning them the moniker 'Queue Army.'"
clever_dsk.87.a:0 "Summon Zhang Xun to negotiate in Beijing."
clever_dsk.87.b:0 "Yield to Duan Qirui."
clever_dsk.88.t:0 "Zhang Xun's Restoration"
clever_dsk.88.d:0 "After Zhang Xun's entry into Beijing, he forcibly compels President Li Yuanhong to dissolve the parliament, attempting to restore the Qing dynasty by force."
clever_dsk.88.f:0 "Zhang Xun's forces have seized control of Beijing, reinstalling Aisin Gioro Puyi as the Emperor. The specter of monarchy returns to the beleaguered land of China."
clever_dsk.88.a:0 "What will be the fate of China in the future?"
clever_dsk.89.t:0 "Patriotic Youth"
clever_dsk.89.d:0 "A patriotic youth in the literary circle has recently garnered attention, his writing and reformist ideas proving highly effective in stirring public opinion."
clever_dsk.89.f:0 "When the youth are wise, the nation is wise; when the youth are wealthy, the nation is wealthy; when the youth are strong, the nation is strong; when the youth are independent, the nation is independent; when the youth are free, the nation is free; when the youth progress, the nation progresses; when the youth surpass Europe, the nation surpasses Europe; when the youth are splendid on Earth, the nation is splendid on Earth. As the red sun rises, its way is vast and bright. As the river flows into the vast sea, so does it become boundless."
clever_dsk.89.a:0 "He should be given a prominent role."
clever_dsk.89.b:0 "Dismiss him."
clever_dsk.90.t:0 "Resistance of the Indigenous People"
clever_dsk.90.d:0 "Due to our discrimination against the indigenous people of Taiwan, some stationed military officers have compelled them to engage in inhumane labor, and clashes with indigenous tribes frequently occur during suppression campaigns. Under the leadership of a tribal chief named Moana Rua, indigenous people, subjected to oppression and humiliation, have initiated a rebellion in the mountains."
clever_dsk.90.f:0 "Only through the use of the butcher's knife can we teach the rebels to submit to our rule."
clever_dsk.90.a:0 "Suppress the Wushe Rebellion and exterminate the rebels."
clever_dsk.90.b:0 "Quell the situation and engage in shared governance with the local indigenous people."
clever_dsk.91.t:0 "Hungarian Uprising"
clever_dsk.91.d:0 "Hungarian insurgents have defeated the Austrian army, seized Budapest, and seek to spread their dangerous ideas to Vienna. Now the Austrian Emperor has personally arrived at the Winter Palace seeking our aid."
clever_dsk.91.f:0 "If we do not send troops to help him suppress the rebellion, this dangerous ideology may once again engulf Europe."
clever_dsk.91.a:0 "Agree to the Austrian Emperor's request and send troops to help suppress the rebellion."
clever_dsk.91.b:0 "Refuse him and seek to resolve the matter peacefully."

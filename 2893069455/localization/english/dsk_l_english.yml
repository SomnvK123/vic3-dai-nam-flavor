 ncw_mde.1.f:0 ""
 ncw_mde.1.a:0 "God Bless America"
 ncw_mde.6.t:0 "Emancipation Proclamation"
 ncw_mde.6.d:0 "As supporters of slavery have initiated a rebellion, we can issue a proclamation to free all slaves on rebellious territory. This is the first and most important step towards complete abolition."
 ncw_mde.6.f:0 "By virtue of the power vested in me as Commander-in-Chief of the Army and Navy of the United States in time of actual armed rebellion against the authority and government of the United States, I do order and declare that all persons held as slaves within said designated states and parts of states are, and henceforward shall be free. And upon this act, sincerely believed to be an act of justice, warranted by the Constitution, upon military necessity, I invoke the considerate judgment of mankind and the gracious favor of Almighty God.\""
 ncw_mde.6.a:0 "With this stroke, we shall save the Union!"
 ncw_mde.7.t:0 "More Slave States Join the Confederacy"
 ncw_mde.7.d:0 "Lincoln personally writes and issues a statement, declaring that a rebellion in violation of U.S. law has occurred in seven Southern states. The presidential order angers the eight remaining slave states in the Union, leading Virginia, North Carolina, Tennessee, and Arkansas to join the South."
 ncw_mde.7.f:0 "War is Imminent"
 ncw_mde.7.a:0 "Betrayal!"
 ncw_mde.8.t:0 "Civil War Erupts!"
 ncw_mde.8.d:0 "Civil War Erupts!"
 ncw_mde.8.f:0 "Civil War Erupts!"
 ncw_mde.8.a:0 "Take Up Arms!"
 dp_america_civil_war:0 "American Civil War"
 america_civil_war:0 "Civil War Between North and South"
 Emancipation_Proclamation:0 "Signing of the Emancipation Proclamation"
 Emancipation_Proclamation_desc:0 "After the outbreak of the Civil War, a significant number of black slaves volunteered to assist the Union in their fight for freedom. However, there were conflicting views on how to handle enslaved individuals in occupied territories. Initially, Lincoln revoked emancipation orders issued by certain generals, and strict enforcement of this policy meant escaped slaves had to return to their southern masters. However, on March 13, 1862, the Confederacy forbade all Union commanders from returning escaped slaves, affecting the repeal of the 'Fugitive Slave Act of 1850.'"
 ned_acw_push:0 "This will #P promote#! the abolition process"
 ned_acw_pull:0 "This will #N reduce#! the abolition process"
 incorporated_new_states:0 "Incorporate all newly admitted states"
 incorporated_new_states_south:0 "Incorporate only Southern states"
 ncw_mde.9.t:0 "Free States? Slave States?"
 ncw_mde.9.d:0 "With the expansion of the Union, more states joined the United States. However, the issue of slavery sparked significant debates. Northern states desired more free states, while the South aimed to retain slave states."
 ncw_mde.9.f:0 "The lowlands along the Atlantic, separated by the long north-south ridges, and the Mississippi plain form the heart of American slavery. Inserted between the two plains, the upland area, suitable for various industries, is the domain of free labor. Slavery cannot root itself here. In the border states, the majority of the population on the highland is free."
 ncw_mde.9.a:0 "Allow all new states to retain slavery"
 ncw_mde.9.b:0 "Use the 36°30’ line as a boundary: Southern states retain slavery, Northern states become free"
 ncw_mde.9.c:0 "All newly admitted states will become free states"
 ned_acw_push_huge:0 "This will #P significantly promote#! the abolition process"
 ned_acw_pull_huge:0 "This will #N significantly reduce#! the abolition process"
 ncw_mde.10.t:0 "Fugitive Slave Act"
 ncw_mde.10.d:0 "In 1850, the federal government passed the Fugitive Slave Act, allowing capturers to enter free states to apprehend escaped slaves from slave states."
 ncw_mde.10.f:0 "\"They are driven from their homes and from every direction flock to Canada, under the  flag of the king of England, for refuge from the 'free republic' which has repudiated them.\"\n— Comment from a Toronto newspaper"
 ncw_mde.10.a:0 "A humanitarian disaster!"
 ncw_mde.10.b:0 "A wise move!"
 ncw_mde.11.t:0 "Attack on the Senate"
 ncw_mde.11.d:0 "During a speech advocating for abolition in the Senate, Republican Senator Charles Sumner  was attacked and seriously injured by Democratic Representative Preston Brooks, sparking nationwide attention."
 ncw_mde.11.f:0 "\"Heard Sumner's head is badly injured, might take him years to recover, maybe... never  recovers\"\n\"Did Brooks get punished?\"\n\"Brooks? Southerners hailed him as a hero, even sent him dozens of new canes.\""
 ncw_mde.11.a:0 "Damn it, such violent attacks must be condemned!"
 ncw_mde.11.b:0 "Brooks was just defending his rights!"
 ncw_mde.12.t:0 "Dred Scott Case"
 ncw_mde.12.d:0 "Dred Scott, a black slave from the slave state of Missouri, lived in the free states of Illinois and Wisconsin for four years with his owner before returning to Missouri. After his owner's death, Scott appealed for freedom, but his claims were rejected by both the Missouri and federal courts. In 1857, the Supreme Court upheld the lower court's decision and dismissed the appeal."
 ncw_mde.12.f:0 "\"Even free Negroes are not citizens as understood by the Constitution, so Scott has no standing to sue in federal court.\"\n— Roger B. Taney, Chief Justice of the Supreme Court"
 ncw_mde.12.a:0 "The courts failed to protect citizens; instead, they trampled on equal rights and human rights!"
 ncw_mde.12.b:0 "This ruling affirms the rights of Southern states!"
 ncw_mde.13.t:0 "Death of John Brown"
 ncw_mde.13.d:0 "A fervent abolitionist, John Brown led an uprising in Harpers Ferry, Virginia. However, the U.S. Marines swiftly quelled the rebellion, capturing Brown. He was sentenced to death two months later."
 ncw_mde.13.f:0 "\"In a State of the Union, it is necessary to have five thousand troops encircling the scaffold where a man is to be hung. And as for toasting him, the bells of the churches and the prayers of the congregations, throughout the land, rang at the same moment. It is a strange and lamentable thing, surely.\"\n— New York Times on 'John Brown's Execution'"
 ncw_mde.13.a:0 "We should carry on Brown's legacy!"
 ncw_mde.13.b:0 "A traitor has met a just execution!"
 ncw_mde.14.t:0 "Rebuilding the Nation"
 ncw_mde.14.d:0 "While the military battles have ended, the struggle for the nation's spirit continues. The United States must rebuild itself after being torn in two."
 ncw_mde.14.f:0 "\"I would not have the Union broken up. Whether it be that the people shall be wholly one thing or wholly another, it is to be 'all one thing' or 'all the other,' I want the Union to terminate its existence, bodily and spiritually.\"\n— Abraham Lincoln"
 ncw_mde.14.a:0 "Let us unite once again"

lca_german_italy.14.f:0 "As a former member of the Alliance, Prussia demands that we not join their commitment to the war with Austria"
lca_german_italy.14.a:0 "Agreed, this is the internal affairs of the German brotherly states"
lca_german_italy.14.b:0 "Disagree, this matter concerns Our's interests"
lca_german_italy.14.c:0 "I don't want to offend either side"

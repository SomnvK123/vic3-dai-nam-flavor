sino_event.89.t: "[SCOPE.sCharacter('gaixi').GetFullName] Changes Ideology"
sino_event.89.d: "[SCOPE.sCharacter('gaixi').GetFullName] has been deeply influenced by imperialist thoughts. He suggests that our vast and populous country might follow the Western powers' footsteps to conquer more territories."
sino_event.89.f: "[SCOPE.GetRootScope.GetCountry.GetName] should actively engage in international affairs after industrial reforms, with the immediate priority being to re-establish the border with Tsarist Russia."
sino_event.89.b: "This kind of thinking is too dangerous."

sino_event.90.t: "[SCOPE.sCharacter('gaixi').GetFullName] Changes Ideology"
sino_event.90.d: "[SCOPE.sCharacter('gaixi').GetFullName] has been deeply influenced by the Three Principles of the People and is determined to reform our country into a great democratic republic."
sino_event.90.f: "[SCOPE.GetRootScope.GetCountry.GetName] will be a great nation bringing democracy and freedom to other parts of Asia."

sino_event.91.t: "[SCOPE.sCharacter('gaixi').GetFullName] Changes Ideology"
sino_event.91.d: "[SCOPE.sCharacter('gaixi').GetFullName] witnessed the backward state of China and published articles on the ideas of saving China."
sino_event.91.f: "He said: '[SCOPE.GetRootScope.GetCountry.GetName] is currently weak, with 400 million Chinese people still struggling for basic needs. We face internal backlash from feudal forces and external oppression from imperialism. The rise and fall of the nation concerns every individual. All compatriots should unite and strive for the rejuvenation of China in the world.'"

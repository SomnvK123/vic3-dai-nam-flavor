conquer_kor_tt:0 "[SCOPE.sCountry('jap_scope').GetAdjective] may show more signs of conquest towards us soon!"

jiawu_war_china_lose_tt:0 "[SCOPE.sCountry('chi_scope').GetAdjective] has lost the war to [SCOPE.sCountry('jap_scope').GetAdjective]!"

je_china_korean_releation:0 "Relations with China"
je_china_korean_releation_reason:0 "The Liaodong region is crucial, a battleground between China and Korea. The vast sea surrounds us on three sides, and to the north, we have a vast mountainous area. The Chinese side extends a thousand miles to [SCOPE.sCulture('korean_culture').GetName]. This land is rich in resources and strategically located. Historically, during the Ming dynasty, we [SCOPE.sCountry('kor_scope').GetAdjective] and [concept_dsk_china] stood together to defend against foreign threats, building a deep friendship. However, the world has changed, and the Qing dynasty has risen in the northeast, unifying China with great power. While we continue to remember the favor of the old Ming dynasty, we also feel the grace of the Qing dynasty, like a dead tree receiving spring rains and revitalizing. If we speak in foreign terms, [SCOPE.sCountry('chi_scope').GetAdjective] is like a parent to us. Both we and [SCOPE.sCountry('jap_scope').GetAdjective] are foreign nations, with Japan akin to a child. It would be unreasonable for a parent to love a rebellious child as much as they love a filial one."


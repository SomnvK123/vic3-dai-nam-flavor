dsk_france.1.t:0 "French West Africa Proposal"
dsk_france.1.d:0 "We control this vast region of Africa, and some matters exceed our capabilities."
dsk_france.1.f:0 ""The Governor of French West Africa has been stationed in Saint-Louis since 1895 and moved to Dakar in 1902. The Governor is directly accountable to the Paris government. Each colony in French West Africa, such as Senegal and Dahomey, has a Vice-Governor who oversees the local area. The Vice-Governors are directly accountable to the Governor. The Governor and the 'Colonial Ministry' in Paris jointly determine the candidates for Vice-Governors, who are then approved by the French Parliament before assuming office.\n\nIn managing the colonies of French West Africa, the main administrative unit is called a 'Cercle.' Each Cercle is led by a French official and oversees several smaller administrative districts, which in turn oversee only a few villages. African chiefs appointed by the French manage these small administrative districts. The Cercle's leader is directly accountable to the Vice-Governor of the individual colony, and the African chiefs of the small administrative districts are accountable to the French leader of the Cercle.""
dsk_france.1.a:0 ""The Paris authorities only need to write a colonial law, while the colonial governor has to consider much more.""
dsk_france.1.b:0 "West Africa and [SCOPE.GetRootScope.GetCountry.GetName] are vastly different in culture, customs, and language. It's better to let them be second-class citizens in the colonies."

dsk_france.2.t:0 "North African Campaign"
dsk_france.2.d:0 "With our army steadily winning in Algeria, let us gradually delve deeper into the heart of North Africa."
dsk_france.2.f:0 "I do not want to see [SCOPE.sCountry('ait_scope').GetName], [SCOPE.sCountry('con_scope').GetName], [SCOPE.sCountry('tug_scope').GetName], and other North African emirates still appearing on the map of [SCOPE.GetRootScope.GetCountry.GetName].\nOur influence in Algeria is growing significantly, but our position in this region largely depends on our relations with these unrecognized states. Bringing all the small North African countries under our sphere of influence can ensure our dominance."
dsk_france.2.a:0 "The word 'impossible' is not in my dictionary."
chinese_central_government_tt:0 "China Has Been Divided"

je_fra_north_Africa:0 "French Algerian Territories"
je_fra_north_Africa_reason:0 "Algeria is more than four times the size of our European territories. If we completely conquer this territory, we can decide the future of its people.\nFrom the early 19th century to the early 20th century, European countries launched large-scale colonial conquests of the African continent. [SCOPE.GetRootScope.GetCountry.GetName] achieved remarkable results in the scramble for Africa, once controlling 36% of the entire African continent. France incorporated most of the African lands into its colonial system, ruling over these African colonies as a sovereign state, with local residents not having full French citizenship. However, within the African territories ruled by [SCOPE.GetRootScope.GetCountry.GetName], there was a special region considered part of France itself, not a colony, and that was Algeria in North Africa."
je_create_west_french_africa:0 "Establish French West Africa"
je_create_west_french_africa_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] acquired vast territories in the African scramble. These areas initially became part of the Senegalese colony or separate independent entities ruled by the military, known as 'military territories.' In the late 1890s, the French government began to directly rule these newly acquired territories and transferred the territories west of Gabon to be governed by a single governor in Senegal, directly accountable to the French Ministry of Overseas Affairs. The first Governor of Senegal, Jean Baptiste, was appointed on June 16, 1895, and this territory was officially named 'French West Africa' (AOF) in 1904, initially comprising four administrative regions: Senegal, French Sudan, French Guinea, and Côte d'Ivoire (Mauritania and Niger joined later in the 1920s and 1940s, respectively). Gabon and other regions later became part of French Equatorial Africa (AEF)."

fascist_Mussolini_1_button:0 "The Italian Empire"
fascist_Mussolini_1_button_desc:0 "Now, only the title of Empire can match our great nation"
fascist_Mussolini_2_button:0 "Crown the Laurel"
fascist_Mussolini_2_button_desc:0 "By the grace of God and the will of the state, our great King of Italy, King of Albania, Sultan of Somalia, King of Libya, King of Greece, and Emperor of Ethiopia"
fascist_Mussolini_button:0 "Crown the Roman Emperor"
fascist_Mussolini_button_desc:0 "By the grace of God and the will of the state, our great King of Italy, King of Albania, Sultan of Somalia, King of Libya, King of Greece, Emperor of Ethiopia, and Emperor of all Romans"
fascist_Mussolini_3_button:0 "Reorganize the Blackshirts"
fascist_Mussolini_3_button_desc:0 "The name Blackshirts was inspired by Garibaldi's Redshirts. They were a military tool organized by Mussolini for his political activities. The main founding members of the Blackshirts were nationalist intellectuals, young landowners opposed to peasants and unions, retired officers, and some members of the Arditi (elite units of the Italian army in World War I). As Mussolini's power grew, their actions became more brutal, using violence and threats to counter his opposition."

je_italian_union:0 "Italian Union"
je_italian_union_reason:0 "#bold [concept_unification]#! is the lifelong dream of revolutionaries like #yellow Giuseppe Mazzini#! and now, through #yellow Garibaldi#!'s #variable Thousand Expedition#!, it is becoming a reality.\n\n#variable Democrats#!, led by #yellow Mazzini#! and the #yellow Young Italy Party#!, advocate for establishing a #bold Italian Republic#! through #variable nationwide uprisings#!, shouting the slogans of "liberty, equality, fraternity" as they sweep across the peninsula.\nMeanwhile, the #variable Monarchists#! gather under the banner of #yellow Victor Emmanuel II#![Concept('concept_ruler','$RULER_TITLE_KING$)], aiming to achieve #bold constitutional monarchy#! under the Savoy crown through #variable dynastic wars#!.\n\nThe stark divide between these two factions in the #variable path to unification#! has caused a deep rift in #variable national sentiment#!—the democrats accuse the monarchists of #italic "stealing the fruits of revolution under the crown"#!, while the monarchists criticize the democrats for #italic "destroying the foundation of order with mobs"#!.\n#bold A storm is gathering over the Alps, the shadow of [concept_revanchism] looms over the Adriatic, and without uniting the nation's will, the revival of Rome will surely fall victim to [concept_decadence]#!"
concept_revanchism:0 "Revanchism"
concept_revanchism_desc:0 "The ideology driven by $nationalism$ to recover historically owned territories through military or diplomatic means. For Italy, this specifically refers to the desire to liberate #bold Lombardy and Venetia#! from the Austrian Empire, France's occupation of $PAP$, and the [concept_unification] movement's claim to Dalmatia."
concept_decadence:0 "Imperial Decay Syndrome"
concept_decadence_desc:0 "A vicious cycle triggered by the decay of a dying empire, characterized by the loss of local government autonomy, continued depletion of the [concept_investment_pool], and exponential growth of $post_revolutionary_fervor$."

je_risorgimento_repubblicano_reason:0 "#bold 'From Genoa to Palermo'#!, the debates of [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] have echoed through the #yellow Apennines#!. They once believed that city-state autonomy was inseparable from '[ROOT.GetCountry.GetAdjective] traditions'—until #yellow Cavour#!'s iron arteries linked Turin and Genoa's ports, #yellow Garibaldi#!'s [concept_redshirts] dyed the Sicilian evening skies, and #yellow Mazzini#!'s [concept_manifesto] was passed around in secret meetings.\n\nNow, in the cafés of [ROOT.GetCountry.GetCapital.GetCityHubName], Tuscan accents and Venetian dialects argue about the feasibility of [GetLawType('law_parliamentary_republic').GetName].\n\nSardinian sailors sing hymns on deck, and even the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] landowners' ledgers are filled with sketches of [concept_tricolore].\n\n#bold This sweeping tide across the peninsula#! is, in essence, the final showdown between national integration and the [concept_habsburg_order]#!—when nationalism awakens, [concept_revolution] will be irreversible!"

concept_redshirts:0 "The Thousand Expeditionary Force"
concept_redshirts_desc:0 "The volunteer army led by Garibaldi, also known as the 'Redshirts'."

concept_manifesto:0 "Young Italy Party"
concept_manifesto_desc:0 "The party founded by Mazzini in 1831 during his exile in Marseille, with the aim to overthrow Austrian feudal rule and unify Italy into a free, independent, democratic republic (similar to the League of the Just). 'God and the people' was their chosen motto."

concept_carbonari:0 "Carbonari"
concept_carbonari_desc:0 "The Carbonari were a secret nationalist society active in Italy during the early 19th century, playing a key role in the unification of Italy."

concept_tricolore:0 "The Tricolore Flag"
concept_tricolore_desc:0 "Originating from the flag of the Napoleonic Italian Legion in 1796."

concept_habsburg_order:0 "Vienna System"
concept_habsburg_order_desc:0 "The conservative order established by Metternich after the collapse of the Napoleonic Empire at the Congress of Vienna, which was dominated by Austria, Prussia, Russia, and Britain."

je_Italian_Youth_Party:0 "Young Italy Party"
je_Italian_Youth_Party_reason:0 "[concept_manifesto] was the political movement during Italy's unification, initiated by #yellow Giuseppe Mazzini#! in 1831. After leaving Italy for several months, #yellow Giuseppe Mazzini#! wrote to the then [ROOT.GetCountry.GetAdjective][Concept('concept_ruler','$RULER_TITLE_KING$)] #yellow Charles Albert#! in June 1831, urging him to unite the Italian states and lead the nation towards unification. A month later, he was convinced his proposal had been rejected by [Concept('concept_ruler','$RULER_TITLE_KING$)], so in Marseille, he started the Young Italy movement. This movement quickly spread to other European countries.\n\n#v The goal of the movement was to initiate a nationwide uprising in the many small backward states of Italy and the provinces occupied by [SCOPE.sCountry('aus_scope').GetName], to establish a unified Italian nation.#!\n\nProgress bar will increase as follows:\n1. Every #green 10% literacy rate#!, +0.2 per month (max = 2)\n2. Provinces under [SCOPE.sCountry('aus_scope').GetName] rule, if #red [concept_turmoil] exceeds 35%#!, +2 per month\n3. For each [SCOPE.sCulture('hungarian').GetName] or [SCOPE.sCulture('polish').GetName][concept_revolution][concept_agitator], +1 per month\n4. Implementing #green [GetLawType('law_total_separation').GetName]/[GetLawType('law_state_atheism').GetName]/[GetLawType('law_IJ_secularization').GetName]#! laws, +2 per month\n5. When any state's #red [concept_unemployed] rate exceeds 20%#! and the average #red [concept_sol] is below 12#!, +1 per month!"

je_sar_reform0_tt:0 "Oh Lord of hosts, hear my plea!"
je_sar_reform0_1_tt:0 "Glory to all the people of Italy!"
je_sar_reform0:0 "The Spark of Revival"
je_sar_reform0_reason:0 "#bold From the conspiracies of [ROOT.GetCountry.GetCapital.GetCityHubName]’s [concept_carbonari]#! to the manifestos printed in the port of #yellow Genoa#!, [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] is redrawing the map of the Apennines with the silhouette of the [concept_tricolore].\n\nWhile #yellow Metternich#!’s [concept_habsburg_order] continues to drain taxes from Lombardy, the [ROOT.GetCountry.GetAdjective] [concept_redshirts] have already crossed the Tyrrhenian Sea with an oath of [concept_revanchism] — they know that only by igniting the #italic "fire of unification"#! before the decay of the imperial bureaucracy will the cries of “#bold God and the People#!” in the [concept_manifesto] echo throughout the Alps.\n\nAt this moment, the forges in [ROOT.GetCountry.GetCapital.GetName] are crafting flagpoles for the [concept_tricolore], while the Viennese court still debates how to split the Tuscan customs union."

je_sar_reform0_goal:0 "Complete three Italian Revival journal entries"

dsk_ita.38.t:0 "Dawn of the Apennines"
dsk_ita.38.d:0 "In 1836, the Apennine Peninsula is overshadowed by [SCOPE.sCountry('aus_scope').GetName]’s shadow: #bold Metternich#! controls #yellow Lombardy-Venetia#! through the [concept_habsburg_order], and his network of vassals includes #yellow Tuscany#!, #yellow Parma#!, and #yellow Modena#!.\n\nAs the only independent Italian state, the [ROOT.GetCountry.GetAdjective] Kingdom faces a choice: ten years ago, King #yellow Charles Albert#!'s military reforms expanded the standing army to #bold 42,000#!, but Austria’s fortress network in #yellow Peschiera#! and #yellow Mantua#! chokepoints the Po Valley.\n\nUnderground print shops of the [concept_manifesto] are increasing by #bold 3 every month#!, the remnants of the [concept_carbonari] are plotting uprisings in the #yellow port of Genoa#!, and [SCOPE.sCountry('aus_scope').GetName] censors are burning newspapers with the word “#italic unification#!” on them.\n\nWhile the engineers of [ROOT.GetCountry.GetAdjective] begin mapping the #yellow Turin-Genoa#! railway, the Vienna garrison has begun sending artillery to #yellow Alexandria#! — [concept_decadence] is corroding the old order, but can [ROOT.GetCountry.GetAdjective] complete this #bold national gamble#! before Austria mobilizes its northern Italian suppression forces?"

dsk_ita.38.f:0 "“Either we create Italy, or we become dust in history.” — Giuseppe Mazzini, 1831 in a secret meeting in Marseille"

dsk_ita.38.a:0 "Better to die standing than live on our knees."

je_ita_army:0 "Italian Revival: Army Reform"
je_sar_reform:0 "Italian Revival: Domestic Reform"
je_sar_reform2:0 "Italian Revival: Economic Reform"
je_sar_reform2_goal:0 "Increase our [concept_gdp] to three times its original value"

je_ita_army_reason:0 "Faced with [SCOPE.sCountry('aus_scope').GetName]’s 120,000 troops stationed in #yellow Lombardy#!, [ROOT.GetCountry.GetAdjective]’s general staff is equipping 3,000 new rifled muskets every month. Count Cavour personally oversees the expansion of the artillery school in #yellow Alexandria#!, demanding each artillery team be able to disassemble and transport guns in mountainous terrain within #italic three minutes#! — because controlling the Alpine passes will determine whether [concept_revanchism] can break through Vienna’s ‘four-fortress’ chain. While the British Times mocks us for “directing artillery with opera voices,” soldiers at the Mondovì barracks are practicing skirmisher tactics in the rain."

je_sar_reform_reason:0 "To break the tariff barriers of Parma and Modena, the [ROOT.GetCountry.GetAdjective] cabinet enforces the #yellow Piedmont metric#!, and mandates that all goods at the port of Genoa must be labeled in Tuscan Italian. As Austria extracts 15% of the peninsula's trade taxes through #yellow Trieste#!, our newly built textile factories in #yellow Novara#! are flooding the market with cotton at one-third the British price — each destroyed guild clears the soil for the spread of [concept_manifesto]."

je_sar_reform2_reason:0 "The railway connecting #yellow Turin#! to #yellow Genoa#! transports #bold 200 tons#! of pig iron every day, which is turned into rifled cannon barrels at the Alexandria arsenal. On the Po Plain, forced adoption of American reapers has doubled wheat production, enough to feed eight newly formed infantry divisions. When Austria mocks us for “building warships out of pasta,” the Sardinian merchant fleet controls 35% of coal transport in the Western Mediterranean — #italic each track is a cannonball aimed at [concept_habsburg_order], and every sack of military rations is a shovel digging the grave of divisionism#!."
dsk_ita.1.t:0 "[ROOT.GetCountry.GetRuler.GetFirstName]'s New Policy"
dsk_ita.1.d:0 "[ROOT.GetCountry.GetAdjective] cabinet is pushing the 'bold Albert Constitution' centered in #yellow Turin#!: a three-tiered election system is being established to reduce the power of [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName], while a national printing bureau is set up in #yellow Genoa#! to unify content. While Austrian spies are still burning [concept_manifesto] leaflets, our postmen are delivering reform decrees to the mayor’s office of every northern Italian city-state via the newly built #yellow Susa Pass#! courier route."
dsk_ita.1.f:0 "'A code written in Tuscan is more likely to penetrate the Apennines than Austrian cannons' — [ROOT.GetCountry.GetRuler.GetFirstName] at the 1847 state council."
dsk_ita.1.a:0 "Forward in the name of [concept_unification]!"

dsk_ita.6.t:0 "The Sword of the Alps"
dsk_ita.6.d:0 "[ROOT.GetCountry.GetAdjective] General Staff is implementing Prussian-style reforms at the #yellow Mondovì#! military camp: every month, #bold 800#! soldiers trained with the M1841 rifled musket, whose shooting accuracy exceeds that of Austria's muzzle-loading smoothbore guns by #green 60%#!. While Vienna still relies on 18th-century fortifications at #yellow Mantua#!, our engineers have designed a bridge that can be erected within 24 hours—the #italic 'Carl Alberto Floating Bridge'#!—key to breaking the Po River defense and retaking #yellow Milan#!."
dsk_ita.6.f:0 "Armory records show: new mountain cannons have a range of 1200 meters, enough to cover Austrian outposts at #yellow Peschiera#!."
dsk_ita.6.a:0 "Forge the Sword of Victory!"

dsk_ita.3.t:0 "The Iron Artery Plan"
dsk_ita.3.d:0 "[ROOT.GetCountry.GetAdjective] Ministry of Finance announces: for every additional kilometer of railway extending from #yellow Turin#! to #yellow Genoa#!, the cost of transporting pig iron will be reduced by #green 12%#!. While the #yellow Alexandria#! armaments factory begins mass production of rifled cannon barrels, our newly constructed textile factory in #yellow Novara#! is selling cotton at one-third the price of Britain—these profits are turning into steam hammers at #yellow Cuneo#! iron mines and cranes at #yellow Savona#! harbor."
dsk_ita.3.f:0 "Data from 1848 shows: [ROOT.GetCountry.GetAdjective] steel production has surpassed [SCOPE.sCountry('bel_scope').GetName] and is now the fifth largest industrial nation in Europe."
dsk_ita.3.a:0 "Either unify or perish!"

# Republic of Italy Event Chain
dsk_ita.4.t:0 "The Tricolore Waves in the Wind"
dsk_ita.4.d:0 "When #yellow Garibaldi#!'s Redshirts planted the [concept_tricolore] in the #yellow Naples#! Royal Palace, the [SCOPE.GetRootScope.GetCountry.GetName] Constituent Assembly passed the core articles of the [concept_manifesto] with #bold 387 votes to 12#!:\n\n• Abolishing all feudal privileges and church jurisdiction\n• Implementing [GetLawType('law_universal_suffrage').GetName] \n• Making #yellow Rome#! the permanent capital\n\nAt this moment, [SCOPE.sCountry('aus_scope').GetName]'s garrison is withdrawing from #yellow Ancona#! port, and [ROOT.GetCountry.GetRuler.GetFirstName] is swearing an oath in #yellow Milan#! Cathedral: '#italic From now on, there will be Italian citizens, not Savoy subjects#!'."
dsk_ita.4.f:0 "'Either we establish a republic in Rome, or we make the Tiber river flow backwards!' — Giuseppe Garibaldi, 1860"
dsk_ita.4.a:0 "Long live the Republic!"

# Kingdom of Italy Event Chain  
dsk_ita.5.t:0 "Victory of the Monarchists"
dsk_ita.5.d:0 "Amidst the cannon fire of the #yellow Plasencia#! battle, [ROOT.GetCountry.GetRuler.GetFirstName] signed the #yellow 'Constitutional Royal Edict'#! in #yellow Florence#!:\n\n• Retaining the Savoy Dynasty's [GetLawType('law_monarchy').GetName]\n• Implementing [GetLawType('law_census_voting').GetName]\n• Making #yellow Turin#! the capital until the recovery of Rome\n\nWhen the Austrian ambassador questioned, 'How long can this patched-up kingdom last?' [ROOT.GetCountry.GetAdjective] artillery is testing rifled siege guns with a range of #bold 2800 meters#! at #yellow Custozza#!."
dsk_ita.5.f:0 "Turin's armory records show: the new cannons can pierce the 4-meter thick walls of the #yellow Peschiera#! fortress."
dsk_ita.5.a:0 "Coronate in the name of [concept_unification]!"

dsk_ita.2.t:0 "National Awakening"
dsk_ita.2.d:0 "When the newly appointed Pope #yellow Pius IX#! declared the #bold amnesty for political prisoners#! in Rome, [ROOT.GetCountry.GetAdjective] border fortress at #yellow Alexandria#! was conducting night drills—the 80,000-strong army of King Charles Albert has been equipped with Prussian-style breech-loading cannons, their range covering Austrian positions at #yellow Novara#!.\n\n[concept_manifesto] leaflets are being smuggled into the country through the #yellow Genoa#! harbor on British ships, and the exiled #yellow Mazzini#! has sent a secret letter from London urging, 'Now is the time to strike during Metternich's illness.' Meanwhile, Vienna responds by adding #bold 15 brigades#! to their garrison in #yellow Lombardy#! and installing rotating #yellow Collis#! heavy siege guns at #yellow Peschiera#!.\n\nAt this moment, [ROOT.GetCountry.GetRuler.GetFirstName]'s advisors are debating fiercely: should they respond to the petition from #yellow Florence#!'s liberals by implementing [GetLawType('law_wealth_voting')] or suppress the [concept_carbonari] revolt under the guise of 'maintaining order'?"
dsk_ita.2.f:0 "'Every village bell tower in Italy is a beacon for national awakening' — Camillo Cavour, 1846 private letter."

dsk_ita.2.a:0 "Ignite the fire of [concept_revolution]!"  # Liberal route: gain support from the Papal States but anger Austria
dsk_ita.2.b:0 "Strengthen the foundation of [GetLawType('law_monarchy').GetName]!"  # Conservative route: speed up military reforms but lose intellectual support

dsk_ita.13.t:0 "The Great Italy of this World"
dsk_ita.13.d:0 "In 1866, the smoke of the #yellow Königgrätz#! battle had not yet cleared, and the #bold Devil's Pact#! between [ROOT.GetCountry.GetAdjective] and Prussia bore fruit: when #yellow Garibaldi#!'s volunteers broke through the #yellow Bezzeca#! pass with their #bold Chassepot rifles#!, Prussia's #yellow Krupp#! siege cannons were smashing Austrian formations at #yellow Sadowa#!.\n\nAccording to the #bold April Agreement#!, [SCOPE.GetRootScope.GetCountry.GetName] gave up South Tyrol in exchange for #yellow Venice#! being torn from Austria's map — at this moment, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName] is riding the captured #yellow Radetzky#! Marshal's horse, crossing the #yellow Mincio River#! bridge to review the troops.\n\nTurin's armory hammer rings day and night, forging the #bold 2000 tons of high-quality steel#! provided by the [concept_great_power], turning them into railway ties at the #yellow Brescia#! front—these tracks are the veins of [concept_unification], and the spear aimed at [concept_habsburg_order]!"
dsk_ita.13.f:0 "From the snow-capped peaks of the Alps to the waves of the Mediterranean,\nwe have walked a road of conquest and resistance,\nwatering our hopes with sweat and blood.\nIn this land, we unite as one,\nshoulder to shoulder, together in this struggle, never backing down.\nLet our flag wave in the wind,\nlet our voices echo across the skies,\nItaly, you are our pride and glory,\nand in your light, we fear nothing."
dsk_ita.13.a:0 "Wait for me to come down from the Alps..."

dsk_ita.101.t:0 "The Tricolore Waves in the Wind"
dsk_ita.101.d:0 "On the morning of September 20, 1870, General #yellow Cadorna#!'s #bold 60,000-strong army#! used #yellow Krupp#! siege cannons to blast open #yellow Piazzale!#.\n\n#yellow Pius IX#! escaped the Vatican through the #yellow Castel Sant'Angelo#! underground passage, and before fleeing, signed the #bold Protection Act#!—permanently renouncing secular power, keeping only #bold 0.44 square kilometers#! of religious land. Meanwhile, #yellow Garibaldi#!'s old troops wrapped the Papal Coat of Arms of #yellow Quirinale Palace#! in a Redshirt flag, while #yellow Mazzini#!'s leaflets were printed in #bold 500,000 copies#! and transported through the new #yellow Florence-Rome#! railway to every village on the peninsula."
dsk_ita.101.f:0 "From the snow-capped peaks of the Alps to the waves of the Mediterranean,\nwe have walked a road of conquest and resistance,\nwatering our hopes with sweat and blood.\nIn this land, we unite as one,\nshoulder to shoulder, together in this struggle, never backing down.\nLet our flag wave in the wind,\nlet our voices echo across the skies,\nItaly, you are our pride and glory,\nand in your light, we fear nothing."
dsk_ita.101.a:0 "[concept_revolution] faction and [GetLawType('law_monarchy').GetName] reconcile here!"

every_italy_land_add_wine_modifier_tt:0 "All provinces with a $building_vineyard_plantation$ will receive a yield modifier."

dsk_ita.7.t:0 "Italian Wine"
dsk_ita.7.d:0 "Italy is one of the world’s most important wine-producing regions, renowned for its quality and diversity. Italian wines are diverse, with many famous regions, each with its unique terroir and grape varieties."
dsk_ita.7.f:0 "Customs reports: In 1865, wine exports reached #bold 270 million liters#!, accounting for #green 18%#! of fiscal revenue, and the 'italic Italian Wine Index#!' was introduced on the London Stock Exchange."
dsk_ita.7.a:0 "Let Europe's courts be intoxicated by the fragrance of the tricolore flag!"

je_dsk_italy_centralization:0 "Centralization Reform"
je_dsk_italy_centralization_reason:0 "When the #bold Albertine Statutes#! were unfolded on parchment, the measuring units of #v Piedmont#! and #v Sicily#! were still in conflict.\n\n#yellow Cavour#!'s secretary discovered that #v Genoa#! customs had to process #red 7 currencies#! and #red 14 measurement units#!—Venetian merchants paid taxes in Byzantine gold solidi, while Neapolitan fishing boats used Arab dirhams.\n\nAs #v Calabria#!'s bandit king Don Ciciò used the #bold Bourbon two-tailed mermaid emblem#! to collect 'patriotic taxes', the Austrian ambassador mocked in #v Venice Phoenix Theatre#!: 'Your country is like a broken mosaic held together by #bold Tuscan plaster#!, even the wind of the Alps could blow it apart.'"

je_dsk_italy_suffrage:0 "Urbanization Reform"
je_dsk_italy_suffrage_reason:0 "#v Milan#! textile workers are weaving #bold strike shuttle#! into #yellow voting ballots#! — every piece of cloth secretly holds a chapter of [concept_manifesto].\n\n#v Turin#!'s metalworker union cast the 'Youth Italy' newspaper into artillery shells, and the flying #red molten steel#! left scorch marks reading 'bold Universal Suffrage#!' as it fell into the sea.\n\nBy 1850, the #red revolutionary movement#! led by 'the people’s scribe' #yellow Mazzini#! caused a nationwide upheaval, forcing [ROOT.GetCountry.GetAdjective] monarchy to implement the broadest electoral reform in history."

je_dsk_italy_reform:0 "Italy Reconstruction Plan"
je_dsk_italy_reform_reason:0 "Italy’s reconstruction project was launched with a vision for national prosperity and unity. From the slopes of the Alps to the shores of the Mediterranean, the Italian people are now experiencing true industrialization. The railway system is expanding, factories are proliferating, and the cities are flourishing. The newly established parliament has also proposed laws that would bring about universal suffrage. Italy’s economy is booming, but there’s still much work to be done."
je_dsk_italy_land:0 "Land Reform"
je_dsk_italy_land_reason:0 "The sulfur miners of #v Sicily#! offer their devotion to the #bold Black Madonna#! before the #yellow Land God statue#!, while their land deeds are locked in the #red Sixth Vault#! of Palermo’s bank, controlled by the [concept_mafia].\n\nThe farmers of #v Naples#! work with their ancestral #bold Norman plows#! yet must pay taxes to #yellow Spanish nobility#! in the form of #red Arab-style tithe#!.\n\nWhen #v Tuscany#!'s wool profits were consumed by #bold steam spinning machines#!, a British consul wrote in his report: 'The land system here is more complex than Dante’s depiction of #bold Purgatory#!—83% of the land is owned by the #yellow 1.2% of nobility#!, while the tax collectors' abacus beads are made from the teeth of the [concept_redshirts] fallen.'"

je_dsk_italy_papacy:0 "Church-State Separation Reform"
je_dsk_italy_papacy_reason:0 "When #yellow Pope Pius IX#!'s #bold 'What a Sad'#! encyclical was read in #v St. Peter’s Basilica#!, Garibaldi’s cannonballs were melting down the #red Papal coat of arms#! into the symbols of the Republic.\n\nAt #v Florence#!'s #bold Galileo Academy#!, university students used the rhythm of #yellow Dante’s sonnets#! to decipher the [concept_manifesto] code, while the smell of #red formaldehyde#! in the dissection room floated with #italic 'God is dead'#! Latin graffiti.\n\nAt the Apennine Mountains#!, smugglers carried #bold Darwin’s specimen boxes#! across borders, and in the hidden compartments, #yellow atheist manuals#! were being rewritten in the rhyme scheme of #red The Divine Comedy#!—the thousand-year marriage of #red Caesar and God#! was being dissected with the #bold theory of evolution#!."

je_dsk_italy_judicial:0 "Judicial Reform"
je_dsk_italy_judicial_reason:0 "When #yellow Cavour#!'s envoy brought the #bold Albertine Code#! to #v Palermo#!, he discovered that the courtrooms were simultaneously hanging the #red Bourbon family#! crocodile emblem and #yellow Arab-style scales of justice#!.\n\nIn #v Modena#!, judges used the #bold Napoleonic Code#! to try orphans who stole bread, while thirty kilometers away in #v Parma#!, horse thieves were paying nine times the compensation under #yellow Byzantine customary law#!.\n\nIn #v Calabria#!, when #yellow gendarmes#! armed with #bold Savoy orders#! were searching for the 'honor men' of [concept_mafia], the whole village sounded the alarm at the #red Norman castle#!—the farmers fought back with #yellow medieval crossbows#! against rifled guns, and on the stone walls, written in sheep's blood: 'Our laws have not changed since #bold Roger II#!.'\n\nA prosecutor in #v Genoa#! wrote in his diary: 'This country applies #red 12 different criminal codes#!—Genoa merchants are imprisoned for #bold Jewish usury laws#!, while murderers in Tuscany escape hanging through #yellow Church confession privileges#!—we cannot build prisons fast enough to catch up with the contradictions in the law!'"


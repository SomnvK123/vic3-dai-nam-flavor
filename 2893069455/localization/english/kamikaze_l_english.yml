 kamikaze: "Kamikaze"
 kamikaze_desc: "The kamikaze that destroyed the Mongols was about to become a symbol of the Japanese spirit."
 kamikaze_back: "Kamikaze is back"
 kamikaze_back_desc: "Japan has risen, the kamikaze has returned to East Asia."

 inheritance_kamikaze_2_desc: "The kamikaze has come to Japan under the guidance of His Majesty the Mikado, Japan has risen, the kamikaze has returned to East Asia, and in order to resist the European colonizers, it is necessary to lead East Asia in unity, even if by force"
 inheritance_kamikaze_modifiers_1: "Recast the kamikaze spirit"
 inheritance_kamikaze_modifiers_2: "Kamikaze is back"
 kamikaze_t: "Kamikaze returns, Greater East Asia coprosperity"
 kamikaze_d: "Kamikaze returns, Greater East Asia coprosperity"
 kamikaze_f: "Japan has risen under the leadership of His Majesty the Mikado, and the reforging of the kamikaze spirit has made the empire quickly rich and strong, but European colonists still covet Asian colonies, as the first country in Asia to get rid of the shackles of European colonizers, Japan needs to lead East Asian unity, and the biggest problem at this stage is undoubtedly the most corrupt regime in all of Asia - China, in the previous wars to seize Korea and Taiwan, the decay and vulnerability of the Chinese army has been revealed to the world. The resources of Southeast Asia and Oceania were crucial, and the rising empires also needed time to deal with various domestic and foreign affairs. At this point we must make a choice, for the unity of the whole of East Asia, we may have to resort to force, for the long-term development of the empire, the consolidation of the foundation of the empire is not a feasible way."
 KAMIKAZE_CHI: "The Imperial Japanese Army will remove the hidden danger of conquering China, which will be the first step in establishing the Greater East Asia Co-Prosperity Sphere"
 KAMIKAZE_SASIA: "The Imperial Japanese Navy will seize the South Seas, and endless resources will provide sufficient impetus for the Greater East Asia Coprosperity Sphere"
 KAMIKAZE_JAP: "The Empire of Japan needed to deal with domestic affairs in full force to consolidate the cornerstone of the Empire"
 kamikaze_modifiers_chi: "Focus on mainland policy"
 kamikaze_modifiers_sasia: "Focus on ocean policy"
 kamikaze_modifiers_jap: "Focus on imperial internal affairs"
#日本帝国大学事件链
 imperial_university_of_japan: "Establishment of the Imperial University of Japan"
 imperial_university_of_japan_desc: "Only knowledge and technology could lead Japan to the top of the world, and His Majesty the Mikado immediately decreed the construction of major imperial universities in the Empire of Japan"
#
 IUJ: "Imperial University"
 IUJ_CHI: "Imperial University of Beijing"
 IUJ_SASIA: "Imperial University of Southeast Asia"
 IUJ_JAP: "Imperial University of Yamato"
 IUJ_desc: "His Majesty the Mikado decreed the construction of major imperial universities within the Empire of Japan"
 IUJ_CHI_desc: "The empire conquered the East Asian continent, and perhaps Beijing, the old capital of China, was suitable for the establishment of Japan's tenth imperial university, the Beijing Imperial University. It will serve the geological cause of the empire."
 IUJ_SASIA_desc: "The empire conquered the Southeast Asian archipelago, and perhaps the trading hub of Malaya was suitable for the establishment of Japan's tenth imperial university, Nanyang Imperial University. It will serve the electronics business of the empire."
 IUJ_JAP_desc: "The Empire completely solved the internal affairs problem, and perhaps the area around the Imperial Palace was suitable for the establishment of Japan's tenth imperial university, Yamato Imperial University. It will serve the politics of the empire."

 Ise_eve_1_t: "Jingu Ceremony"
 Ise_eve_1_d: "Jingu Ceremony is the largest Shinto ritual in the shrine that is renovated once every 20 years and wishes to renovate the shrine and sacred treasure and pass it to the great god."
 Ise_eve_1_f: "Both the inner and outer shrines of the Jingu have the same size in the east and west, and the ceremony is the largest festival in the shrine where the shrine is renovated once every 20 years, and everything including the shrine and the shrine is renewed as it is in the old way, and the great god moves to the new shrine.\nThe ceremony has been repeated for more than 1,000 years since the 14th year of Emperor Tenmu, and it is of great significance that the festival is held forever at the fresh shrine that is rebuilt once every 20 years."

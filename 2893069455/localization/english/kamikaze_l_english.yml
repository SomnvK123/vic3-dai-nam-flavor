 IUJ_1_d: "Establish Imperial University"
 IUJ_1_f: "The rise of the Japanese Empire was in dire need of high-quality human resources, so His Majesty the Mikado ordered the establishment of major imperial universities in order to become the country's top comprehensive national universities for higher education and scientific research."
 IUJop_1: "Survey of the site of the Imperial University！Tennoheika Banzai！"

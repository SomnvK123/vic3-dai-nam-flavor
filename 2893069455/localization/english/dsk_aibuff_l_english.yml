l_english:
ai_away_from_world:0 "Isolationism"
ai_away_from_world_desc:0 "[COUNTRY.GetName] believes in its abundant resources and implements isolationist policies."
ai_strategy_colony_plantation_economy:0 "Colonial Plantations"
ai_strategy_colony_plantation_economy_desc:0 "[COUNTRY.GetName] aims to focus on producing and exporting cash crops, followed by resource extraction, with less emphasis on industrial development."
ai_strategy_colony_resource_expansion:0 "Colonial Resource Industries"
ai_strategy_colony_resource_expansion_desc:0 "[COUNTRY.GetName] intends to invest in the extraction of natural resources, followed by the production and export of cash crops, while minimizing industrial development."
ai_strategy_monroeism:0 "Monroeism"
ai_strategy_monroeism_desc:0 "[COUNTRY.GetName] seeks to concentrate on affairs in the Americas and the Pacific, staying away from European conflicts, expanding their [concept_market], and opening the doors to isolate [Concept('concept_country', '$concept_countries$')]."
ai_strategy_anti_shogunate:0 "Anti-Shogunate Movement"
ai_strategy_anti_shogunate_desc:0 "[COUNTRY.GetName] opposes the rule of the Tokugawa Shogunate, as samurai, commoners, as well as emerging intellectuals and industrialists collectively attempt to overthrow the Shogunate's rule."
ai_strategy_meiji_restoration:0 "Meiji Restoration"
ai_strategy_meiji_restoration_desc:0 "With the Emperor reclaiming power, the Shogunate era comes to an end, but the direction [COUNTRY.GetName] will take remains uncertain."
ai_strategy_expanding_the_indies:0 "Expanding markets"
ai_strategy_expanding_the_indies_desc:0 "[COUNTRY.GetName]Wants to bring more countries into its colonial system and customs union."
ai_strategy_meiji_restoration_2:0 "Meiji Renewal"
ai_strategy_meiji_restoration_2_desc:0 "Favored by the Emperor, intellectuals and industrial magnates bring an end to the old samurai system, working towards the modernization of Japan."
ai_strategy_showa_restoration:0 "Eight Corners of the World Under One Roof"
ai_strategy_showa_restoration_desc:0 "[COUNTRY.GetName] aspires to fulfill the mission of 'uniting the four corners of the world under one roof,' merging the entire world into one large nation, establishing a global unity, with the Emperor of Japan as the supreme ruler of the world."
ai_strategy_unify_scandinavia:0 "Unification of Scandinavia"
ai_strategy_unify_scandinavia_desc:0 "[COUNTRY.GetName] aims to unite the Scandinavian countries under its leadership!"
ai_strategy_rising_power:0 "Emerging Power"
ai_strategy_rising_power_desc:0 "[COUNTRY.GetName] is not satisfied with its current international status and seeks to join the ranks of great powers through military competition and aggressive expansion."

ai_strategy_ruler_of_east:0 "Expansion into Central Asia"
ai_strategy_ruler_of_east_desc:0 "[COUNTRY.GetName] aims to encompass the entire Central Asia within its sphere of influence, regardless of consequences, even if it means going to war with the British Empire or China."

ai_strategy_unify_yemen:0 "Unification of Yemen"
ai_strategy_unify_yemen_desc:0 "[COUNTRY.GetName] aims to unite the people of Yemen under their banner."

ai_strategy_unify_somalia:0 "Unification of Somalia"
ai_strategy_unify_somalia_desc:0 "[COUNTRY.GetName] seeks to unite the people of Somalia under their banner."

ai_strategy_conquest_of_india:0 "Unification of the Indian Subcontinent"
ai_strategy_conquest_of_india_desc:0 "[COUNTRY.GetName] and its vassals aim to bring the entire Indian subcontinent under the influence of the British Empire to better prepare for the upcoming wars with Russia or China."

ai_strategy_unify_uganda:0 "Unification of Central Africa"
ai_strategy_unify_uganda_desc:0 "[COUNTRY.GetName] aims to unite more African nations under their banner."

ai_strategy_unify_afghanistan:0 "Unification of Afghanistan"
ai_strategy_unify_afghanistan_desc:0 "[COUNTRY.GetName] aims to unite more Central Asian nations under their banner."
ai_strategy_form_khorasan:0 "Restore the Territory of the Seljuk Empire"
ai_strategy_form_khorasan_desc:0 "[COUNTRY.GetName] aims to restore the maximum territory of the Seljuk Empire, even if it means resorting to force."

ai_strategy_persian_empire:0 "Maximize Persian Empire's Territory"
ai_strategy_persian_empire_desc:0 "[COUNTRY.GetName] seeks to endlessly expand the territory of the Persian Empire, even if it means going to war with any empire."


l_english:
 request_autonomy:0 "Request Increased Autonomy"
 request_autonomy_action_name:0 "Request Increased Autonomy"
 request_autonomy_desc:0 "We will seek greater diplomatic autonomy from our overlord while still remaining a subject."
 request_autonomy_proposal_notification_name:0 "Request for Increased Autonomy"
 request_autonomy_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] wishes for greater autonomy in diplomatic affairs and self-governance under our rule."
 request_autonomy_proposal_notification_effects_desc:0 "If we accept, our subject relationship with [INITIATOR_COUNTRY.GetName] will allow them more diplomatic freedoms. A [concept_puppet] will become a [concept_dominion], a [concept_dominion] will become a [concept_protectorate], and a [concept_vassal] will become a [concept_tributary]."
 request_autonomy_proposal_accepted_name:0 "Request for Autonomy Accepted"
 request_autonomy_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] has agreed to grant us greater autonomy."
 request_autonomy_proposal_declined_name:0 "Request for Autonomy Declined"
 request_autonomy_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] has refused to grant us greater autonomy."
 request_autonomy_proposal_third_party_accepted_name:0 "Autonomy Granted"
 request_autonomy_proposal_third_party_accepted_desc:0 "[INITIATOR_COUNTRY.GetName] now enjoys greater political autonomy under their overlord, [TARGET_COUNTRY.GetName]."
 request_autonomy_proposal_third_party_declined_name:0 "Autonomy Denied"
 request_autonomy_proposal_third_party_declined_desc:0 "[INITIATOR_COUNTRY.GetName] was denied greater autonomy under their overlord, [TARGET_COUNTRY.GetName]."
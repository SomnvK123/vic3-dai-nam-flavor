 america_flavor.1.f:0 "The Battle of San Jacinto ends in a devastating defeat for Mexico. Texas President Houston is eager to secure Texas's legal status by submitting an application to the federal government. All that's needed now is a signature from Washington to formally establish Texas as a state."
 america_flavor.1.a:0 "The Federation Welcomes You"

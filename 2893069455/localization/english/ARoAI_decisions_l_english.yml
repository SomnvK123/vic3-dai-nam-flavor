dsk_je_united_kingdom_of_great_britain_and_ireland:0 "Pax [ROOT.GetCountry.GetAdjective]"
dsk_je_united_kingdom_of_great_britain_and_ireland_reason:0 "Before 1815, [SCOPE.GetRootScope.GetCountry.GetName] had achieved the most complete victory in world history, winning the most complete victory in a twenty-year war against [SCOPE.sCountry('fra_scope').GetName], becoming the only industrialized economy and the only naval superpower. By 1836, our navy had nearly as many ships as all other navies combined. We are the world's only [Concept('concept_super_power','$concept_super_powers$')].\n\nThe crown of the British Empire has now passed from [SCOPE.sCountry('spa_scope').GetName] to us, and the peak era of British global hegemony has arrived!\n\n #red 'Why does the sun never set on the British Empire? Because God doesn't trust the British in the dark!'#!"
dsk_je_gbr_Great_britain_of_Ireland_tt:0 "Ensure the long-term peace and stability of the empire and its sphere of influence"
dsk_britain_time:0 "Pax Britannica"
modifier_king_of_sea:0 "Britain Controls Global Trade Routes"
modifier_Russell_Group:0 "Russell Group"
modifier_Ireland_develop:0 "Relieve Ireland"
modifier_Ireland_die:0 "The Great Irish Famine"
modifier_Ireland_and_Britain:0 "Accept Ireland"
modifier_Ireland_develop_birth:0 "Encourage Ireland"
modifier_Ireland_develop_money:0 "Support Ireland"
dsk_je_gbr_global_trade:0 "Global Shipping Hub"
dsk_je_gbr_global_trade_reason:0 "This is the era of global trade, and it is my era. After the sea coachman [SCOPE.sCountry('net_scope').GetName], no one can compete with [SCOPE.GetRootScope.GetCountry.GetName] for the influence of global trade. Since 1713, we defeated [SCOPE.sCountry('spa_scope').GetName] and controlled the #variable Strait of Gibraltar #!\nWe have incorporated the entire trade route of the Mediterranean into our hands. Now, the empire can complete long-distance operations. To increase our influence, controlling the trade routes of other regions must become our national policy!\nControlling #variable Malacca#! is crucial. It is the throat of the Indian Ocean to the South China Sea. Whether it is [SCOPE.sCountry('chi_scope').GetName], [SCOPE.sCountry('kor_scope').GetName], or [SCOPE.sCountry('jap_scope').GetName], they all rely heavily on this trade route.\nControlling #variable East Africa#! and #variable Hormuz#! means controlling the oil routes of the Middle East and the Persian Gulf.\nBy mastering these straits, the #red British Empire#! will always hold the economic lifelines of all countries in the world. Our achievements will be eternal, and our descendants will always bask in the glory of the #red British Empire#!"
dsk_gbr.1.t:0 "Control Four Major Straits"
dsk_gbr.1.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] controls 80% of the world's trade routes. We are the undisputed maritime hegemon!"
dsk_gbr.1.f:0 "From the cold Arctic Ocean to the vast Pacific Ocean.\nFrom the broad Indian Ocean to the blue Atlantic Ocean.\nGreat Britain controls the seas, controls everything"
dsk_gbr.1.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] rules the world!"
dsk_je_gbr_university:0 "Reform of Britain's Prestigious Universities"
dsk_je_gbr_university_reason:0 "#variable Oxford University#!, located in [SCOPE.sState('2_university_state').GetName], is one of our world-renowned and proud universities, and one of our oldest, with a history dating back to the 12th century. It has provided countless talents to our country. As a world-renowned top institution, #variable Cambridge University#!, located in [SCOPE.sState('1_university_state').GetName], has played a crucial role in the development of the #red British Empire#! over the past few centuries in fields such as education, research, medicine, mathematics, economics, and history.\n#variable Cambridge University#! is also one of our oldest universities. Together, these two universities have made an indelible contribution to the #red British Empire#! becoming a [Concept('concept_super_power','$concept_super_powers$')].\nHowever, in 1836, with the rise of other prestigious European universities such as #variable University of Paris#! of [SCOPE.sCountry('fra_scope').GetName] and #variable University of Göttingen#! of [SCOPE.sCountry('pru_scope').GetName], #variable Oxford and Cambridge#! lost their monopoly. In the increasingly industrialized and commercialized society of the Victorian era, our top domestic talents realized that reforms were necessary.\nWe must further leverage our educational advantages to ensure that #red British Empire#! continues to lead the world in technology in this era of transformation!\n #variable Note: Historically, these reforms were pushed by Queen Victoria's husband, Albert#!"

dsk_gbr.2.t:0 "Reform of Elite Universities"
dsk_gbr.2.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] now has the greatest universities in the world, the most advanced technology, and the noblest talents. What else do we lack?"
dsk_gbr.2.f:0 "When talents from all over the world come to #variable Oxford University#! and #variable Cambridge University#!, they will discover the truest truths of this world."
dsk_gbr.2.a:0 "Gather all the world's talents and technologies in Great Britain!"
dsk_je_gbr_Royal_Academy:0 "Reform of the Royal Academy of Arts"
dsk_je_gbr_Royal_Academy_reason:0 "#variable Royal Academy of Arts (RA)#!, located in London, is the British Royal Academy of Art. Established in 1768, it has been the best academy for studying fine arts for 237 years. RA has not only a long history but also an abundance of talents, making significant contributions to the cultivation of talents in painting, sculpture, and architectural arts. The academy holds annual exhibitions of excellent student and artist works, attracting art enthusiasts both domestically and internationally.\nSince its establishment in the 18th century, #variable Royal Academy of Arts#! has not charged students any tuition and provides scholarships and work opportunities of eight to nine thousand pounds annually, helping them cope with the high cost of living in London.\nNow, we need to expand it so that in the next century of artistic trends, the world will be filled with art exhibits from Great Britain!\n #variable Note: In 1870, RA expanded its exhibition plan, and its scale, professionalism, and quality of exhibits were comparable to any world-class gallery. These exhibitions established RA's significance among international art institutions.#!"
dsk_gbr.23.t:0 "The Jewel of British Art"
dsk_gbr.23.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] now has the greatest universities, the most advanced technology, the noblest talents, and the finest artworks in the world. What else do we lack?"
dsk_gbr.23.f:0 "When talents from around the world come to the #variable Royal Academy of Arts#!, they will discover the most magnificent artworks in this world."
dsk_gbr.23.a:0 "Isn't it romantic?"
Royal_Academy_open_modifier:0 "Master-Level Art"
dsk_je_gbr_Royal_Academy_open_tt:0 "Preparing for a Master Exhibition"
dsk_je_gbr_Royal_Academy_open_goal:0 "Awaiting a five-year preparation period"
dsk_je_gbr_Royal_Academy_open:0 "Royal Academy of Arts"
dsk_je_gbr_Royal_Academy_open_reason:0 "#variable Royal Academy of Arts (RA)#!, located in [SCOPE.sState('university_state_scope').GetName], is the British Royal Academy of Art. Established in 1768, it has been the best academy for studying Fine Arts for 237 years. RA has not only a long history but also an abundance of talents, making significant contributions to the cultivation of talents in painting, sculpture, and architectural arts. The academy holds annual exhibitions of excellent student and artist works, attracting art enthusiasts both domestically and internationally.\nNow, we have successfully expanded it, and in the next century of artistic trends, the world will be filled with art exhibits from Great Britain!\n #variable The Royal Academy of Arts will hold an annual master exhibition.#!"
dsk_gbr.24.t:0 "Opening of the Master Exhibition"
dsk_gbr.24.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] successfully hosted this year's art exhibition, attracting people from all over the world to admire our artworks."
dsk_gbr.24.f:0 "When people from all over the world visit the master exhibition at #variable Royal Academy of Arts#!, they will discover the most magnificent artworks in this world."
dsk_gbr.24.a:0 "I am enchanted and lost in admiration."
Royal_Academy_open_var:0 "Preparing for the Annual Master Exhibition"

support_Royal_Academy_button:0 "Fund the Royal Academy of Arts"
support_Royal_Academy_button_desc:0 "Provide financial support to the Royal Academy of Arts to increase the throughput of artworks nationwide"
not_already_supporting_Royal_Academy_button:0 "We can only fund the Royal Academy of Arts once every five years"
modifier_supporting_Royal_Academy:0 "Extra Art Exhibitions"
sell_Royal_Academy_button:0 "Sell Artworks of the Royal Academy"
sell_Royal_Academy_button_desc:0 "Sell artworks from the Royal Academy, but this will delay the preparation for the master exhibition by five months"
not_already_sell_Royal_Academy_button:0 "We can only sell artworks of the Royal Academy once every five years"

dsk_je_gbr_and_Ireland:0 "The Issue of Britain and Ireland"
dsk_je_gbr_and_Ireland_tt:0 "Further reconciliation of British-Irish conflicts needed"
dsk_je_gbr_and_Ireland_goal:0 "Resolve three issues related to Ireland"
dsk_je_gbr_and_Ireland_reason:0 "The 'Nine Years' War' ended in 1603, bringing #variable Ireland#! under our control for the first time. The Tudor monarchs' conquests were accompanied by the Reformation. During Elizabeth I's reign, bloody conquest policies formally turned #variable Ireland#! into a Protestant kingdom.\nIn 1801, the 'Acts of Union' formally merged the two kingdoms into [SCOPE.GetRootScope.GetCountry.GetName]. However, the union did not resolve the issues, and conflicts between Britain and Ireland remained sharp. #variable Ireland#! did not join the United Kingdom but became a 'colony' ruled by the British.\nIf we cannot properly handle British-Irish conflicts this century, the independence struggles in #variable Ireland#! will intensify."
dsk_je_gbr_Great_Famine_of_Ireland:0 "Irish Issue: The Great Irish Famine"
dsk_je_gbr_Great_Famine_of_Ireland_reason:0 "Potatoes were the main food source for the Irish at that time. A type of oomycete called late blight swept across Ireland, causing potatoes to rot and fail to harvest. Local landlords were only concerned with exporting grain and livestock. At that time, more than 1.5 million agricultural workers had no other source of income to support their families, and 3 million small farmers relied mainly on potatoes for survival. The wealthy also consumed much more potatoes than in Britain. During times of poor harvest, the rural poor bore the greatest risk.\n\nIf we cannot properly handle this crop failure crisis, Ireland will inevitably face a terrible famine, leading to the deaths of many Irish people."
dsk_je_gbr_Great_Famine_of_Ireland_tt:0 "Potato crops are failing due to late blight"

dsk_je_accept_Ireland:0 "Irish Issue: Irish Catholic Population"
dsk_je_accept_Ireland_reason:0 "On religious issues, Ireland did not achieve religious independence like Scotland but was forced by the British government to adopt Anglicanism as the state religion. According to British law, Catholics had no political rights and were discriminated against in economic and educational aspects. This harsh political reality inevitably led to a series of political crises in Ireland. For the conservative Tory government, granting equal citizenship to ordinary Irish people meant giving legal status to Catholics, contrary to British political and religious principles. Therefore, the issue of Irish Catholic citizenship has always been a significant and sensitive political topic, a thorny issue that successive Tory governments had to face. Since the Reformation in the 16th century, religious differences between the Irish and English have been a barrier to the unity and integration of the two kingdoms.\nAlthough the Catholic Emancipation Act of 1829 marked Britain's abandonment of three centuries of efforts to change Irish Catholic beliefs, the British government continued to adopt a dual approach of political and military pressure to extend the Reformation to Ireland and impose Anglicanism on the Irish. If we cannot eliminate the spiritual divide between the two peoples and recognize the Irish as equal subjects of the United Kingdom, we will never coexist harmoniously."
dsk_je_accept_Ireland_tt:0 "Irish Catholics are being discriminated against"
dsk_je_rise_up_Ireland:0 "Irish Question: Status of Ireland"
dsk_je_rise_up_Ireland_tt:0 "The struggle for Irish independence is intensifying"
dsk_je_rise_up_Ireland_goal:0 "We have filled the progress bar"
dsk_je_rise_up_Ireland_reason:0 "Since the 19th century, the Irish have waged a prolonged struggle for independence within the United Kingdom, based on nationalism and faith. Initially, the movement was led by the Irish Home Rule League, seeking Irish autonomy through peaceful and legal parliamentary means. However, violence and terror soon replaced peaceful struggles. If we remain silent on Ireland's status, the Irish resistance will only grow more intense.\n\n#yellow Status of Ireland#! will progress the #variable #tooltippable;tooltip:[Country.GetTooltipTag],je_ireland_pos progress bar#.The following conditions will #variable progress#! the progress bar:\n• Implement #yellow Full Separation#! or #yellow Secularization#! (#green +1#!).\n• Implement #yellow Racial Segregation#!, #yellow Cultural Exclusion#!, or #yellow Cultural Pluralism#! (#green +1#!)."
je_ireland_pos: "The following conditions will #variable progress#! the progress bar:\n• Implement #yellow Full Separation#! or #yellow Secularization#! (#green +1#!).\n• Implement #yellow Racial Segregation#!, #yellow Cultural Exclusion#!, or #yellow Cultural Pluralism#! (#green +1#!)."
dsk_je_gbr_empire:0 "The Empire on Which the Sun Never Sets"
dsk_je_gbr_empire_reason:0 "The plains of North America and Russia are our cornfields, Canada and the Baltic are our forests, Australia is our pasture, Peru is our silver mine, South Africa and Australia are our gold mines, India and China are our tea plantations, the East Indies are our sugarcane, coffee, and spice plantations, and the American South is our cotton plantation.\nFrom the British Isles to Hong Kong, Gambia, Newfoundland, Canada, New Zealand, Australia, the Malay Peninsula, Burma, India, Uganda, Kenya, South Africa, Nigeria, Malta, Singapore, and countless islands, the British Empire spans all 24 time zones on Earth.\n\nThis is the peace under the rule of [SCOPE.GetRootScope.GetCountry.GetName]!"
dsk_je_gbr_empire_tt:0 "#red The sun never sets on our territory!#!"
dsk_je_gbr_empire_goal:0 "Our [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] holds the titles of #red Empress of India#!, #red Queen of Canada#!, #red Queen of Australia#!, and #red Queen of South Africa#! simultaneously"
modifier_Canada_winner:0 "Queen of Canada"
nanyacidalu:0 "The Empire on Which the Sun Never Sets: Our Status on the Indian Subcontinent"
nanyacidalu_reason:0 "Abolish the #red East India Company#!'s corrupt control over the Indian subcontinent! These inept officials are incapable of managing Indian affairs! The Indian subcontinent must be directly governed by [SCOPE.GetRootScope.GetCountry.GetName]!\nWe have ruled India for over a century, so [SCOPE.GetRootScope.GetCountry.GetName] is the rightful heir, and it is only fitting for [ROOT.GetCountry.GetRuler.GetFirstName] to be crowned Empress!\nExecute the #red Mughal Empire#!'s heirs to show them who the real masters of South Asia are!\nIncorporate [SCOPE.sCountry('pan_scope').GetName] and [SCOPE.sCountry('bur_scope').GetName] into the dominion of [SCOPE.GetRootScope.GetCountry.GetName]!\nBoth the Russian bear and the Eastern dragon will fear our power in South Asia!"
modifier_hindu_winner:0 "Empress of India"
modifier_Australia_winner:0 "Queen of Australia"
south_africa_winner:0 "Queen of South Africa"
Victoria_has_been_here_tt:0 "Queen Victoria has ascended the throne"
dsk_je_gbr_can:0 "The Empire on Which the Sun Never Sets: Our Status in Canada"
dsk_je_gbr_can_reason:0 "We wish to unify all Canadian colonies into one unified Canadian nation. To achieve this, we must persuade the local colonial institutions that unification is in their best interest."
dsk_je_gbr_aus:0 "The Empire on Which the Sun Never Sets: Our Status in Australia"
dsk_je_gbr_aus_reason:0 "Integrating the minor local governments into a single nation will greatly benefit the Australian people. We must work with the minor administrative departments and the Colonial Office to merge our neighbors."
dsk_je_gbr_south_africa:0 "The Empire on Which the Sun Never Sets: Our Status in South Africa"
dsk_je_gbr_south_africa_reason:0 "Incorporate all territories in South Africa, including Boer settlements and native lands, to create a strong nation on the South African continent!"
nanyacidalu_tt:0 "Make our [ROOT.GetCountry.GetRuler.GetFirstName] Empress of India!"
dsk_je_gbr_can_tt:0 "Make our [ROOT.GetCountry.GetRuler.GetFirstName] the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of Canada!"
dsk_je_gbr_aus_tt:0 "Make our [ROOT.GetCountry.GetRuler.GetFirstName] the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of Australia!"
dsk_je_gbr_south_africa_tt:0 "Make our [ROOT.GetCountry.GetRuler.GetFirstName] the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of South Africa!"
canada_is_puppet:0 "Canada is a dominion or lower-ranked vassal"
Australia_is_puppet:0 "Australia is a dominion or lower-ranked vassal"
south_africa_is_puppet:0 "South Africa is a dominion or lower-ranked vassal"
dsk_gbr.6.t:0 "The Great Irish Uprising"
dsk_gbr.6.d:0 "Ireland declares independence from [SCOPE.GetRootScope.GetCountry.GetName]"
dsk_gbr.6.f:0 "Opponents have formed a provisional government at noon today"
dsk_gbr.6.a:0 "I will crush them!"
dsk_gbr.6.b:0 "We must accept this outcome."

dsk_gbr.5.t:0 "Embrace the Irish"
dsk_gbr.5.d:0 "After relentless efforts, we finally acknowledge that the Irish are equal to the English"
dsk_gbr.5.f:0 "Let the Irish join in national affairs! #yellow Ireland#!, #blue Scotland#!, #green Wales#!, and #red England#! all belong under one crown, let us unite once again as one kingdom."
dsk_gbr.5.a:0 "Who says Ireland isn't part of [SCOPE.GetRootScope.GetCountry.GetName]?"

dsk_gbr.4.t:0 "The Great Irish Famine"
dsk_gbr.4.d:0 "Despite all our efforts, the Irish have suffered an unprecedented famine"
dsk_gbr.4.f:0 "The British government's relief measures were ineffective and slow to respond. At the time, Britain was at its peak in the Victorian era and had completed the Industrial Revolution, recognized as the world's factory. Britain led the world in all aspects, including colonies, political systems, and economic development, being a vast colonial empire that controlled nearly a quarter of the Earth's land and population. Britain was the symbol of prosperity, development, and civilization of that era, with its national strength unparalleled. Just four years before the famine, Britain had gone to great lengths to launch the Opium War from India to open the doors of China. Meanwhile, Britain was also fully preparing for the first World's Fair in human history.\nHowever, behind all this splendor, such a tragic catastrophe could occur—how ironic!"
dsk_gbr.4.a:0 "Forget about these things; the Irish are just third-class citizens of [SCOPE.GetRootScope.GetCountry.GetName]"

dsk_gbr.3.t:0 "Avoidance of the Irish Famine"
dsk_gbr.3.d:0 "After relentless efforts, we finally avoided the possibility of a famine in Ireland"
dsk_gbr.3.f:0 "The Irish will appreciate everything the [SCOPE.GetRootScope.GetCountry.GetName] government has done. Today's actions are all aimed at embracing the Irish."
dsk_gbr.3.a:0 "The Irish will acknowledge [ROOT.GetCountry.GetRuler.GetFullName] as the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of Ireland!"

dsk_gbr.19.t:0 "[SCOPE.sCulture('irish_culture').GetName] Emigration"
dsk_gbr.19.d:0 "A large number of [SCOPE.sCulture('irish_culture').GetName] immigrants are moving to [SCOPE.sCountry('usa_scope').GetName]'s [SCOPE.sState('beautiful_state').GetName] in search of a better life"
dsk_gbr.19.f:0 "From 1820 to 1840, the total number of [SCOPE.sCulture('irish_culture').GetName] immigrants to [SCOPE.sCountry('usa_scope').GetName] reached 750,000, with an average of about 35,000 per year. In the 1840s, Irish emigration numbers soared, peaking at nearly 250,000 in 1851. As a result of the massive emigration to [SCOPE.sCountry('usa_scope').GetName], Ireland's total population decreased by about 2.5 million in the two decades before the Civil War."
dsk_gbr.19.a:0 "There's nothing I can do!"

irish_remove_tt:0 "It is estimated that within a year, 10% of the country's [SCOPE.sCulture('irish_culture').GetName] will leave [SCOPE.GetRootScope.GetCountry.GetName]"

dsk_gbr.20.t:0 "The Great [SCOPE.sCulture('irish_culture').GetName] Uprising"
dsk_gbr.20.d:0 "A large number of [SCOPE.sCulture('irish_culture').GetName] radicals have carried out terror attacks in [SCOPE.sState('irish_state').GetName]"
dsk_gbr.20.f:0 "\"If Ireland does not gain independence from Britain, my struggle will never end\" — Irish nationalist"
dsk_gbr.20.a:0 "Don't let me catch you!"

dsk_gbr.21.t:0 "[SCOPE.sCharacter('tur_sudan_scope').GetFirstName] of [SCOPE.sCountry('tur_scope').GetName] has decided to donate £10,000 upon hearing of the Irish famine crisis"
dsk_gbr.21.d:0 "[SCOPE.sCharacter('tur_sudan_scope').GetFirstName] has announced that he will donate £10,000 to aid the Irish famine victims."
dsk_gbr.21.f:0 "Subsequently, [SCOPE.sCountry('tur_scope').GetName] 'quietly' shipped three vessels of grain to Ireland to assist the famine victims."
dsk_gbr.21.a:0 "Thanks to [SCOPE.sCountry('tur_scope').GetName]!"
dsk_gbr.21.b:0 "£1000 is enough! [ROOT.GetCountry.GetRuler.GetFullName] himself only donated £2000! How can an outsider's donation surpass that of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]?"

dsk_gbr.7.t:0 "Embrace Irish Protestants"
dsk_gbr.7.d:0 "From now on, there will be no more religious discrimination!"
dsk_gbr.7.f:0 "Since the 16th century Reformation, religious differences between the Irish and the English have been an obstacle to the unification and integration of the two kingdoms. Therefore, Britain has long adopted a dual strategy of political and military pressure to extend the Reformation to Ireland, imposing the Anglican Church on the Irish to eliminate the spiritual divide between the two peoples.\nNow, we have abandoned the three-century-long effort to change the Catholic faith of the Irish, promoting equality and breaking discrimination, achieving a new integration of nations under the banners of Catholicism and Protestantism."
dsk_gbr.7.a:0 "Ireland and England belong under one crown!"

dsk_gbr.8.t:0 "Recognition of Ireland's Status"
dsk_gbr.8.d:0 "From now on, Ireland is officially and legally part of [SCOPE.GetRootScope.GetCountry.GetName]!"
dsk_gbr.8.f:0 "The Irish can now join the English in Parliament to discuss state affairs."
dsk_gbr.8.a:0 "Ireland and England belong under one crown!"

dsk_gbr.9.t:0 "Master of India"
dsk_gbr.9.d:0 "[SCOPE.sCountry('bic_scope').GetName] has submitted to [SCOPE.GetRootScope.GetCountry.GetName] and declared loyalty to [ROOT.GetCountry.GetRuler.GetFullName]"
dsk_gbr.9.f:0 "Ancient India has a new master, and South Asia will no longer speak Hindi but English!"
dsk_gbr.9.a:0 "Before the last [SCOPE.sCountry('bic_scope').GetName] person falls, the #red British Empire#! will never surrender!"
dsk_gbr.10.t:0 "Our Global Colonies"
dsk_gbr.10.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] must first integrate the empire's four most important crown jewels to rule the world!"
dsk_gbr.10.f:0 "Our colonies span the globe, but many are still under the control of fragmented tribal native authorities. To build a global empire, we must unify our four largest colonies.\n[SCOPE.sCountry('bic_scope').GetName] is our most precious jewel in the South Asian subcontinent. Controlling it means dominating the Indian Ocean trade routes and holding a strategic position against Russia in Central Asia.\n[SCOPE.sCountry('saf_scope').GetName] is our largest colony in South Africa. Controlling it means securing the Cape of Good Hope and gaining access to the African interior.\n[SCOPE.sCountry('hbc_scope').GetName] is our largest trading company in Canada. We need to consolidate it into a unified #red Canada#! to better manage this vast, cold North American territory.\n[SCOPE.sCountry('nsw_scope').GetName] and other colonies have yet to fully develop the Australian continent. Unifying them will create a complete #red Australia#! that will be our most loyal vassal!\nWith such vast lands and colonies, the empire will gain endless wealth, and [SCOPE.GetRootScope.GetCountry.GetName]'s boundaries will have no limits!"
dsk_gbr.10.a:0 "This is the era of Britain, and the world will remember this era!"

dsk_gbr.11.t:0 "The Four Crown Jewels of the Empire"
dsk_gbr.11.d:0 "Successfully integrated the four crown jewels of the empire!"
dsk_gbr.11.f:0 "[SCOPE.sCountry('bic_scope').GetName], [SCOPE.sCountry('can_scope').GetName], [SCOPE.sCountry('ast_scope').GetName], and [SCOPE.sCountry('saf_scope').GetName] have declared loyalty to [ROOT.GetCountry.GetRuler.GetFullName], and our [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is their [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]!"
dsk_gbr.11.a:0 "Now, the empire has more targets, advancing towards [SCOPE.sCountry('afg_scope').GetName] and [SCOPE.sCountry('egy_scope').GetName]"
dsk_gbr.11.b:0 "Now, the empire has more targets, advancing towards [SCOPE.sCountry('egy_scope').GetName]"

dsk_gbr.12.t:0 "Master of Australia"
dsk_gbr.12.d:0 "[SCOPE.sCountry('ast_scope').GetName] has submitted to [SCOPE.GetRootScope.GetCountry.GetName] and declared loyalty to [ROOT.GetCountry.GetRuler.GetFullName]"
dsk_gbr.12.f:0 "The ancient Australian continent has a new master, becoming the only nation to exclusively occupy the entire continent!"
dsk_gbr.12.a:0 "Turning an ancient prison into a modern civilization? Interesting."

dsk_gbr.13.t:0 "Master of Canada"
dsk_gbr.13.d:0 "[SCOPE.sCountry('can_scope').GetName] has submitted to [SCOPE.GetRootScope.GetCountry.GetName] and declared loyalty to [ROOT.GetCountry.GetRuler.GetFullName]"
dsk_gbr.13.f:0 "We have merged English-speaking Canada and French-speaking Canada into one, creating a unified [SCOPE.sCountry('can_scope').GetName]!"
dsk_gbr.13.a:0 "Turning a fur trading company into a modern civilization? Interesting."

dsk_gbr.14.t:0 "Master of South Africa"
dsk_gbr.14.d:0 "[SCOPE.sCountry('saf_scope').GetName] has submitted to [SCOPE.GetRootScope.GetCountry.GetName] and declared loyalty to [ROOT.GetCountry.GetRuler.GetFullName]"
dsk_gbr.14.f:0 "We have unified South Africa, creating a single [SCOPE.sCountry('saf_scope').GetName]!"
dsk_gbr.14.a:0 "Combining Boer, English, and native South Africans into one nation? Interesting."

dsk_je_gbr_fra_union:0 "Anglo-French Reconciliation"
dsk_je_gbr_fra_union_reason:0 "As the world enters a new century, we must bury the hatchet with [SCOPE.sCountry('fra_scope').GetName], our eternal neighbor, and move forward together. The world is vast enough for both Britain and France."
dsk_je_gbr_fra_union_tt:0 "Reconciliation with [SCOPE.sCountry('fra_scope').GetName] mediated by Napoleon III"
Napoleon_tt:0 "Napoleon III is the ruler of [SCOPE.sCountry('fra_scope').GetName]"

dsk_gbr.15.t:0 "Anglo-French Reconciliation"
dsk_gbr.15.d:0 "[SCOPE.sCountry('fra_scope').GetName] has buried the hatchet with [SCOPE.sCountry('gbr_scope').GetName] and both sides have signed a friendly treaty."
dsk_gbr.15.f:0 "Europe is a civilized continent, and Britain and France are civilized nations. There are many uncivilized countries in the world that need us to spread civilization!\nTogether, we are invincible!"
dsk_gbr.15.a:0 "Let's turn our attention to the East!"

dsk_je_gbr_fra_union_against_china:0 "Second Opium War"
dsk_je_gbr_fra_union_against_china_reason:0 "[SCOPE.sCountry('gbr_scope').GetName] need to revise the Treaty of Nanking. The special economic concessions given by [SCOPE.sCountry('chi_scope').GetName] are insignificant to us. We need this decaying Eastern empire to further open its markets! If they refuse, [SCOPE.sCountry('gbr_scope').GetName] need to plunder the wealth of the East together with [SCOPE.sCountry('fra_scope').GetName]!"

dsk_gbr.17.t:0 "Burning of the Old Summer Palace"
dsk_gbr.17.d:0 "The Old Summer Palace, also known as the Summer Palace, is called the 'Versailles of the East,' but the weak Qing government cannot protect this imperial garden!"
dsk_gbr.17.f:0 "Somewhere on this planet, there was a world wonder called the Old Summer Palace.\nArt has two principles: conception and fantasy. Conception gave birth to Western art, while fantasy gave birth to Eastern art. Just as the Parthenon represents conceptual art, the Old Summer Palace represents the pinnacle of fantasy art.\nIt brought together the almost superhuman imagination of a people. Unlike the Parthenon, the Old Summer Palace is not only a unique, unparalleled masterpiece but also a sublime exemplar of fantasy art—if fantasy can have an exemplar.\nImagine an indescribable, fairy-tale-like structure—that's the Old Summer Palace. This dreamlike scene was built with marble, white jade, bronze, and porcelain, cedar beams, decorated with gemstones, and covered in silk; altars, boudoirs, and castles are distributed throughout, with gods and ghosts residing within; glazed tiles glittering, gold shining; once the poetic craftsmen created this Arabian Nights-like fairyland, they added gardens, pools, misty fountains, leisurely swans, white ibises, and peacocks.\nIn short, it's a dazzling treasure trove of human fantasy, expressed in the form of palaces and temples. This is the Old Summer Palace. It took two generations' long labor to come into being. This city-like, cross-century building was made for whom? For the people of the world.\nBecause the crystallization of history belongs to all humanity. Artists, poets, and philosophers around the world know of the Old Summer Palace; Voltaire still mentions it. People often say, Greece has the Parthenon, Egypt has the pyramids, Rome has the Colosseum, Paris has Notre-Dame, and the East has the Old Summer Palace. Even those who have never seen it dream of it.\nIt is a heart-shaking, yet unknown masterpiece, like the distant Asian civilization's silhouette seen from the horizon of European civilization at dusk."
dsk_gbr.17.a:0 "One robber is called France, the other is called England. They swaggered into the Old Summer Palace, one robbed, the other set fire—Victor Hugo"

dsk_je_gbr_Afghanistan:0 "Afghan War"
dsk_je_gbr_Afghanistan_reason:0 "[SCOPE.sCountry('afg_scope').GetName] is a strategic crossroads between Iran and India, and between these two and Central Asia. After securing most of India, we must control [SCOPE.sCountry('chi_scope').GetName] as a barrier against Russian expansion towards the Indian Ocean, ensuring the safety of our Indian territories."
in_chinawar_tt:0 "Defeat [SCOPE.sCountry('chi_scope').GetName] with war support over 50"

dsk_gbr.18.t:0 "Afghan Protectorate"
dsk_gbr.18.d:0 "After uniting the Afghan states, they have a new suzerain"
dsk_gbr.18.f:0 "[SCOPE.sCountry('afg_scope').GetName] has submitted to [SCOPE.GetRootScope.GetCountry.GetName] and declared loyalty to [ROOT.GetCountry.GetRuler.GetFullName]"
dsk_gbr.18.a:0 "Russians, you'll never touch the Indian Ocean"


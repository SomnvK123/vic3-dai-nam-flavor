modifier_xinwenhua: "Launch New Culture Movement"
je_xinwenhua: "New Culture Movement"
je_xinwenhua_reason: "The New Culture Movement is a continuation of the Xinhai Revolution in the field of ideology and culture, aiming to promote intellectual liberation, oppose feudal ethics, spread new ideas, and new culture. Its origins include questioning traditional culture, pursuing scientific, democratic, and egalitarian ideas, and criticizing feudalism. The New Culture Movement reached its peak around the May Fourth Movement. A large number of cultural publications promoting new thoughts and ideas emerged, Marxism began to spread and combined with the Chinese workers' movement, some intellectuals began to focus on social issues, initiating a series of reform movements and movements for intellectual liberation. The New Culture Movement had a profound impact on China's ideological and cultural development. It broke the shackles of traditional culture, advocated scientific, democratic, free, and egalitarian ideas, promoted the awakening of Chinese intellectuals, and the process of modernization. It had important influences on China's literature, art, philosophy, education, and laid the foundation for the rise of modern Chinese culture."
je_gugong_shiyi: "Palace Treasures"
je_gugong_shiyi_goal: "Wait for six rounds of returning Palace treasures events."
je_gugong_shiyi_reason: "The Forbidden City palaces are magnificent and splendid. However, during the long Ming and Qing dynasties, these magnificent palaces were plagued by theft. It is difficult to trace back to the distant past, but the last emperor of the Qing Dynasty has a clear account of this. The emperor said that, to his knowledge, theft by eunuchs in the palace had almost never ceased. When he got married, just after the grand wedding ceremony, the pearls, gems, and jade on the crown of the empress were all replaced with fakes. The emperor learned from his masters that the treasures of the Qing Palace were already famous in the world. He believed that the palace should be rectified, the warehouses should be counted, and theft should be prohibited. However, before the plan could be implemented, the Jianfu Palace, which housed countless treasures, suddenly caught fire. The fire burned all night, and the pavilions and towers in the Jianfu Palace courtyard turned into ashes, and countless treasures and secrets also vanished. According to statistics from Palace History experts at the Palace Museum, since the Opium War, about 300,000 Palace treasures have been lost. Therefore, it is necessary for us to reclaim what belongs to us."
je_tufei: "Banditry"
je_tufei_reason: "Banditry, theft, and fraud are the three major evils in social life, and banditry is the worst. It ranges from road robbery to burglary, and from robbery to murder, rape, and arson. Now that China has entered an era of freedom and democracy, I will not allow such serious human disasters to continue to exist on the land of China!"
china_borders.19.t: "Sino-American Mutual Defense Treaty"
china_borders.19.d: "The Republic of China government requests to sign a mutual defense treaty with us to defend common democratic values."
china_borders.19.f: "The treaty stipulates: ① Both parties maintain and develop their individual and collective capabilities through self-help and mutual assistance. ② Both parties guarantee to strengthen their free systems. ③ It is recognized that any armed attack on either party in the Western Pacific region will endanger its own peace and security, and it is declared that action will be taken in accordance with its legal procedures..."
china_borders.19.a: "Our relationship with the Republic of China is inseparable."
china_borders.19.b: "Not now."

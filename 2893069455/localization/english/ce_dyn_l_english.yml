sino_event.50.t: "Strait of Malacca"
sino_event.50.d: "Controlling the Strait of Malacca will multiply our overseas trade."
sino_event.50.f: "The Strait of Malacca is the vital sea route connecting the Pacific Ocean and the Indian Ocean, with a navigation history dating back over two thousand years. It is an important maritime passage for the coastal countries of Asia, Africa, Australia, and Europe, through which many developed countries export oil and strategic materials. Due to busy shipping and its unique geographical location, the Strait of Malacca is known as the 'crossroads of the sea.'"
sino_event.50.a: "We will become the largest trader in the region."
china_borders.20.t: "Horn of Africa"
china_borders.20.d: "Controlling the Horn of Africa will multiply our overseas trade."
china_borders.20.f: "The Horn of Africa is also part of the coastal port network of Africa and, like the Persian Gulf, is part of the ancient commercial route around the Indian Ocean."
china_borders.20.a: "We will become the largest trader in the region."




sino_event.61.t: "The Rise of Railways"
sino_event.61.d: "An entrepreneur has invested in railways for his hometown."
sino_event.61.f: "More and more railways will cover the entire China."
sino_event.61.a: "Efficient freight transportation will promote economic development."
sino_event.63.t: "Joint Sino-Foreign Education"
sino_event.63.d: "An educator from the United States has cooperated with our Ministry of Education to establish a university."
sino_event.63.f: "Western education and Chinese ideology have reached a balance at this moment."
sino_event.63.a: "More and more students will enter universities to study."
sino_event.64.t: "Establishment of Publishing House by a Businessman"
sino_event.64.d: "A successful entrepreneur, influenced by the New Culture Movement, has established a publishing house in his city."
sino_event.64.f: "They vigorously promote vernacular literature and disseminate Western thoughts."
sino_event.64.a: "More and more people will be influenced by this."
sino_event.65.t: "Military Suppression of Peaceful Student Demonstrations"
sino_event.65.d: "July 5th Incident in Beiping"
sino_event.65.f: "The Deputy Commander of the North China Headquarters and the Commander of the Beiping Garrison Command of the North China Military Region quickly mobilized a large number of gendarmerie and police in an attempt to prevent students from entering Dongjiaomin Alley. At 4 p.m., the students reached the gate of Xu Huidong's residence in Dongjiaomin Alley and then rushed into the courtyard. Gendarmes and police used batons and rifle butts to drive the students out of the gate. After a short confrontation, the situation calmed down. The former Chief of Staff of Beiping Xingyuan called for student representatives to negotiate. During the negotiations, the 208th Division Search Regiment of the Youth Army and four armored vehicles were dispatched from Xiyuan, Beiping to surround the students. After the representatives of both sides reached an agreement and approached the gate to announce the agreement to the students outside, the students rushed to the gate. The Youth Army could not stop them and immediately opened fire. The students quickly lay down on the ground, but when they stood up again, the Youth Army opened fire again. It was only when someone was specially sent to inform them that the Youth Army stopped shooting and hurriedly withdrew."
sino_event.65.a: "I will turn a blind eye."
minzhu_daotui_tt: "The democratic cause of the conference will regress by #N 10 points #!"
sino_event.66.t: "Bandits and Robbers"
sino_event.66.d: "Bandit problem"
sino_event.66.f: "During the period of the Republic of China, the country was in great chaos, warlords fought each other, and people's lives were miserable. Many people, either forced or voluntary, became bandits, robbing and kidnapping for a living, bringing endless disasters to the people. According to statistics, the population of the Republic of China was about 400 million, and the number of bandits reached as many as 20 million at its peak, accounting for 5% of the total population."
sino_event.66.a: "I not only have the courage to suppress bandits, but also great courage!"
sino_event.67.t: "Suppression of Bandits"
sino_event.67.d: "The suppression of bandits has progressed very smoothly."
sino_event.67.f: "The masses support the police forces and support the anti-bandit actions. It took more than two years to completely eliminate bandits and robbers, and some uprisings surrendered. The problem of banditry, which has been the most persistent and craziest in the country for hundreds of years, has finally stabilized with the assistance of our police. A very small number of fugitive bandits have nowhere to hide during the crackdown on counter-revolutionaries and banditry suppression."
sino_event.67.a: "Thanks to the brave and fearless police and the people who assisted in the anti-bandit operations!"
sino_event.68.t: "Aristocrats from the Old Era"
sino_event.68.d: "After the Republic, what should be done with those aristocrats from the old era?"
sino_event.68.f: "In history, in order to allow the Qing Emperor and other aristocrats to peacefully transfer power, the Republican government issued the "Imperial Family Preferential Treatment Regulations", and after the Republic, there was no reckoning with the old imperial family and aristocrats. Although the original titles of the aristocrats were still recognized and they were given some economic assistance, their political power and privileges were abolished."
sino_event.68.a: "Give preferential treatment to these people."
sino_event.68.b: "Whether they live well or not is none of our business. If they are not republicans, I will kill them."

sino_event.70.t: "National Congress of the Kuomintang"
sino_event.70.d: "National Congress of the Chinese Kuomintang"
sino_event.70.f: "The National Congress of the Chinese Kuomintang (referred to as the National Congress of the Kuomintang) is the
sino_event.70.a: "The convening of the First National Congress of the Kuomintang went very smoothly. Slogans such as 'Unite, Cooperate with the Communists, Support the Peasants and Workers' have deeply penetrated the hearts of the people."
sino_event.70.b: "The convening of the Second National Congress of the Kuomintang went very smoothly. Slogans such as 'Oppose Imperialism', 'Convene a National Constituent Assembly', 'Abolish Unequal Treaties' have deeply penetrated the hearts of the people."
sino_event.70.c: "The convening of the Third National Congress of the Kuomintang went very smoothly. The congress passed the 'Restoration of Party Membership Bill'."
sino_event.70.e: "The convening of the Fourth National Congress of the Kuomintang went very smoothly. The congress declared the unification of the Kuomintang."
china_jap_war_tt: "In history, the Fifth National Congress of the Kuomintang was held in 1937, declaring cooperation between the Kuomintang and the Communist Party, ceasing the civil war, and jointly resisting Japan. Now, you have completed all the National Congresses of the Kuomintang in the Victorian era, and this log will permanently disappear."
kmt_complete: "You have altered the timeline, and the Kuomintang will not initiate the purges within the party!"
new_smzy_modifier3: "Restoration of Party Membership"
new_smzy_modifier4: "Cooperation between the Kuomintang and the Communist Party"
xinwenhua_complet: "Successfully completed the New Culture Movement"

sino_event.71.t: "Internal Party Purge"
sino_event.71.d: "The dictatorial elements within the party have seized control of the party."
sino_event.71.f: "The biggest feature of the 'Party Purge' movement is its brutality. It created a precedent in Chinese history, where those who seized power used violence and mass denunciations to brutally eliminate dissidents nationwide. The result of the party purge movement was the establishment of a Nanjing government. Without the measures of the 'Party Purge', the Kuomintang members in Nanjing would have difficulty establishing themselves as orthodox, claiming legitimacy, and even more difficultly seizing party and political power from various regions. It was precisely because they had such a government that they firmly held power in the areas they occupied and thereafter dominated the development of the Kuomintang and even Chinese politics."
sino_event.71.a: "This is a counter-revolutionary coup! Note: In the historical timeline, the Kuomintang launched the April 12th Counter-Revolutionary Coup in 1927!"
sino_event.71.b: "With me here, the democratic cause will not regress! You will change the historical timeline, and the Kuomintang will not initiate internal purges!"
sino_event.72.t: "New Culture Movement"
sino_event.72.d: "Emancipation of thought, advocating democracy and science."
sino_event.72.f: "The advocates of the New Culture Movement mainly used evolutionary viewpoints and the liberation of individual thought as their main weapons, fiercely criticizing the 'sages of the past' represented by Confucius, vigorously promoting new morals, opposing old morals, advocating new literature, and opposing classical Chinese literature."
sino_event.72.a: "China needs new ideological trends."




sino_event.86.t: "Parliamentary Pressure"
sino_event.86.d: "Political groups are demanding concessions."
sino_event.86.f: "With the enactment of new laws, there has been continuous turmoil among the elites as they are excluded from policies that clearly favor two interest groups. People are demanding concessions."

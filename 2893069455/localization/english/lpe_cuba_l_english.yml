l_english:
 cub.1.t: "Manifesto of the Tenth of October"
 cub.1.d: "The independence politician [SCOPE.sCharacter('cespedes_scope').GetFullName] has risen to [concept_leader|l] of [SCOPE.gsInterestGroup('grupo_indepe').GetName] [SCOPE.sCountry('cuba_scope').GetAdjective]. He advocates for the independence of the island."
 cub.1.f: "«...No one ignores that [SCOPE.sCountry('overlord_scope').GetName] governs the Island of [SCOPE.sCountry('cuba_scope').GetName] with an iron, bloodstained arm... having deprived it of all political, civil, and religious freedoms, its unfortunate children are either exiled to remote climates or executed without trial by military commissions in peacetime... it is deprived of the right of assembly unless under the presidency of a military leader, it cannot seek remedy for its ills without being treated as a rebel, and the only recourse granted is to remain silent and obey...»"
 cub.1.a: "We’ll see how this develops"

 cub.2.t: "Independent Agitators"
 cub.2.d: "An [concept_agitator|l] has emerged in [SCOPE.sCountry('cuba_scope').GetName] advocating for its independence. [SCOPE.sCharacter('maximo_gomez_scope').GetFullName] has started to promote an armed rebellion on the island."
 cub.2.f: "In the midst of the war of independence, he referred to the impact of the «fateful and degrading institution» of slavery:\n\n «As I gradually became informed, I felt horrified and sensed that a feeling was rising in my soul that made me hate the Spaniards».\n Years later, he added:\n\n «Very soon, I felt myself connected to the being who suffered the most in Cuba, the black slave. That was when I truly realized that I was capable of loving people». - [SCOPE.sCharacter('maximo_gomez_scope').GetFullName], March 28, 1876"
 cub.2.a: "Independence gains strength"
 cub.2_tt: "As long as [SCOPE.sCharacter('maximo_gomez_scope').GetFullName] remains in [SCOPE.sCountry('cuba_scope').GetName], his [concept_liberty_desire|l] will increase."

l_english:
 je_deuda_esp: "Debt Situation"
 je_deuda_esp_reason: "In the 1830s, [ROOT.GetCountry.GetName] experienced a complex economic and financial situation, marked by political instability, weak institutions, and the accumulation of debt.\n\nDuring this period, Spain's public [Concept('concept_credit', '$concept_credit_debt$')|l] became a significant problem, affecting both the national economy and the country's international credit reputation.\n\nThe financial administration was chaotic, and the lack of political stability made it difficult to implement coherent fiscal policies, contributing to the rise in public [Concept('concept_credit', '$concept_credit_debt$')|l].\n\nThe debt often exceeded the government's capacity to pay the interest and reduce the principal. This led to a cycle of successive loans to pay off previous debts, further worsening the [Concept('concept_credit', '$concept_credit_debt$')|l] situation."
 je_deuda_esp_tt: "The progress bar for #variable $je_deuda_esp_bar$#! has reached #variable 100 %#!"

 pago_deuda_but_name: "Pay debt regularly"
 pago_deuda_but_desc: "We need to work on implementing good fiscal policies to accelerate debt repayment."
 pago_deuda_but_tt: "For each monthly payment, we will add #bold 2 points#! to the progress bar of #variable $je_deuda_esp_bar$#!"
 stop_pago_deuda_but_name: "Stop regular debt payments"
 stop_pago_deuda_but_tt: "We would subtract #bold 16 points#! from the progress bar of #variable $je_deuda_esp_bar$#!"
 stop_pago_deuda_but_desc: "The state needs cash again."

 je_infraestructura_esp: "Land Communication Network"
 je_infraestructura_esp_reason: "The lack of an infrastructure network in [ROOT.GetCountry.GetName] during the 19th century was a significant factor contributing to the delay in the country's industrialization and economic development process. The absence of an efficient infrastructure network limited the mobility of goods and people, hindering trade and industrialization, and had a negative impact on the economy and progress of the country at that time."
 je_infraestructura_esp_tt: "No [Concept('concept_state', '$concept_state$')|l] with infrastructure deficit."
 je_infraestructura_esp_tt_1: "The [concept_market_price|l] #bold local#! for [GetGoods('transportation').GetName] is not more expensive than #bold #red +20.00%#! to its [concept_base_price|l]"

 je_falta_capital_esp: "Lack of Capital"
 je_falta_capital_esp_reason: "The lack of capital is a significant factor hindering economic development and investment. The scarcity of financial resources limits the country's ability to undertake infrastructure and industrial development projects. This is due to a combination of factors, such as the public debt accumulated from previous wars, the reliance on a predominantly agricultural economy, and the lack of confidence from both national and foreign investors in Spain's economy at that time.\n\nThis lack of capital negatively impacts investment in key sectors such as industry modernization and economic growth promotion."
 je_falta_capital_esp_goal: "For the next #v 1 year#!"

 leyes_anticapitalismo_tooltip: "#tooltip_header The [Concept('concept_law', '$concept_laws$')|l] laws that abandon capitalism are:#!\n$TOOLTIP_DELIMITER$\n[GetLawType('law_command_economy').GetName], [GetLawType('law_cooperative_ownership').GetName] or [GetLawType('law_industry_banned').GetName]."

 je_medizabal_esp: "Appointment of Mendizábal"
 je_medizabal_esp_reason: "[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetLeader.GetFullName] returned to [ROOT.GetCountry.GetName] from exile on September 1, 1835, when the new Prime Minister, #bold José María Queipo de Llano#!, appointed him 'Minister of Finance', thanks to [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetLeader.GetLastName]'s promise to find financing for the Carlist war.\n\nUpon entering [ROOT.GetCountry.GetName], he found himself faced with the ‘Revolution of the Councils’, liberal and anticlerical revolutions. In an attempt to leverage this to his advantage, [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetLeader.GetLastName] published a manifesto questioning the authority of Count of Toreno, #bold José María Queipo de Llano#!, who ended up yielding to the pressure. On September 14, [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetLeader.GetLastName] assumed the presidency of the government."
 je_medizabal_esp_tt: "There will no longer be repercussions for removing the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] from the [concept_government|l]"
 je_medizabal_esp_tt1: "#bold José María Calatrava#!, a [GetIdeology('ideology_progresista').GetName|l], will be the new [concept_leader|l] of the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l]"
 je_medizabal_esp_tt2: "#bold Francisco Martínez de la Rosa#! is the [concept_leader|l] of the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]"
 je_medizabal_esp_tt3: "If #bold Juan Mendizábal#! has been replaced by another [concept_character|l], he will reappear as an [concept_agitator|l]"
 je_medizabal_esp_tt4: "#bold José María Calatrava#!, a [GetIdeology('ideology_progresista').GetName|l], will appear as an [concept_agitator|l] of the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l]"
 je_medizabal_esp_tt5: "The [concept_ruler|l] does #bold not#! belong to the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l]"


 je_la_granja_esp: "The Granja Uprising"
 je_la_granja_esp_reason: "After the dismissal of Prime Minister Mendizábal, the liberal sectors of our population have taken to the streets demanding urgent reforms, seeking the reinstatement of the #bold 1812 Constitution#!.\n\nAt the same time, #bold Mendizábal#! did not abandon the political struggle but increased his presence in the press and supported secret societies preparing a revolutionary movement like the one from the previous summer.\n\n#bold @warning! If we [Concept('concept_exile', 'exile')] any [concept_agitator|l] with the [concept_modifier|l] ‘Support from their contacts’, there is a high chance of them returning."
 je_la_granja_esp_tt: "For #bold 20 years#! the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l] will have a higher chance of having [Concept('concept_leader', '$concept_leaders$')|l] [GetIdeology('ideology_progresista').GetName|l]"
 je_la_granja_esp_tt1: "The [Concept('concept_modifier', '$concept_modifiers$')|l] ‘$junta_provincial$’ modifiers will disappear"
 je_la_granja_esp_tt2: "María Cristina is no longer the regent queen"
 je_la_granja_esp_tt3: "The liberal newspapers will be dismantled"
 je_la_granja_esp_tt4: "#bold Evaristo Pérez de Castro#!, a [GetIdeology('ideology_moderado').GetName|l] will be the new [concept_leader|l] of the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l]"

 je_la_granja_esp_tooltip: "[GetIdeology('ideology_progresista').GetName], [GetIdeology('ideology_republican_leader').GetName], or [GetIdeology('ideology_radical').GetName]"
 je_la_granja_esp_tt5: "If the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l] has a [concept_leader|l] #tooltippable #tooltip:[GetPlayer.GetTooltipTag],je_la_granja_esp_tooltip radical#!#!, $je_la_granja_esp_tt4$"

 caza_liberales_but_name: "Censor the liberal press"
 caza_liberales_but_desc: "We can't keep going at this pace. The authority of the state is being undermined."
 stop_caza_liberales_but_name: "End censorship"
 stop_caza_liberales_but_desc: "It's time to end this infamous decision and put an end to censorship."
 caza_liberales_but_tt: "The modifiers of the [concept_modifier|l] #bold ‘Liberal Press’#! will be reduced by half"
 je_la_granja_esp_status: "A new constitution is being drafted"
 je_la_granja_esp_status_tt: "New Provincial Councils are expected"
 je_la_granja_esp_status_tt1: "No risk of Provincial Councils"
 je_la_granja_esp_progress_integer: "Number of Provincial Councils: #variable [ROOT.GetCountry.MakeScope.Var('multiplicador2').GetValue|0]#!"

 je_motin_la_granja_esp: "The Sergeant's Revolt"
 je_motin_la_granja_esp_reason: "The unrest in the Royal Palace of Segovia was nothing but a reflection of the agitation outside. The #bold Royal Guard#! experiences a palpable growth in tension among its ranks every day. The charged atmosphere creates a sense of uncertainty, where the slightest weakness could trigger a reaction of unpredictable magnitude.\n\nThe [GetPopType('officers').GetName] of the #bold Royal Guard#! find themselves in a delicate position, balancing between obedience to the monarch and empathy for popular demands. The responsibility lies on their shoulders, as they are aware that the future of this country may depend on them."
 je_motin_la_granja_esp_tt: "The number of ‘$junta_provincial$’ will determine the possibility of an uprising among the [GetPopType('officers').GetName] of the #bold Royal Guard#! #!\n\n@warning! If [concept_turmoil|l] reaches #bold 5.00%#! in [SCOPE.sState('palacio_real').GetName], it will also increase the possibility of triggering."
 je_motin_la_granja_esp_tt1: "#bold Constituent Courts#! will be proclaimed to reform the Cádiz constitutional text while the $forced_regime_change$ lasts."

 je_independencia_rep_dominicana_hai: "Dominican Problem"
 je_independencia_rep_dominicana_hai_reason: "After losing their independence again to Spain and their subsequent occupation by Haiti, there are still many in [SCOPE.sState('santo_domingo_scope').GetName] who dream of founding their own #bold Hispanic#! nation. From the shadows, the leaders of the secret society #bold 'La Trinitaria'#! have done nothing but conspire against the [ROOT.GetCountry.GetAdjective] government."
 je_independencia_rep_dominicana_hai_tt: "#bold Santo Domingo#! has [Concept('concept_secession','seceded')] from [ROOT.GetCountry.GetName]"
 je_independencia_rep_dominicana_hai_tt1: "It belongs to the [concept_culture|l] [GetCulture('caribeno').GetName]"
 je_independencia_rep_dominicana_hai_tt1_NOT: "#bold No#! it does not belong to the [concept_culture|l] [GetCulture('caribeno').GetName]"
 tiene_igual_o_mas_apoyo_cultura: "The [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')|l] within the [concept_culture|l] [GetCulture('caribeno').GetName] is greater than or equal to #variable 25%#!"

 je_independencia_puerto_rico_hai: "Puerto Rican Independence Movement"
 je_independencia_puerto_rico_hai_reason: "For centuries, there has never been an independence movement in [SCOPE.sState('puerto_rico_scope').GetName]. Due to our poor management of the island of [SCOPE.sState('puerto_rico_scope').GetName], many voices now call for the [concept_secession|l] of [ROOT.GetCountry.GetName]."
 je_independencia_puerto_rico_hai_tt: "#bold Puerto Rico#! has [Concept('concept_secession','seceded')] from [ROOT.GetCountry.GetName]"

 je_reconquista_rep_dominicana_esp: "Reconquest of Hispaniola"
 je_reconquista_rep_dominicana_esp_reason: "The opportunity to recover Hispaniola has finally arrived. The recent instability in #bold North America#! prevents a strong response from its nations, so we should have a clear path to reclaim [SCOPE.sState('santo_domingo_scope').GetName] from the hands of [SCOPE.sCountry('ocupador_santo_domingo').GetName].\n\n@information! If [Concept('concept_country','Santo Domingo')] exists, we can integrate them peacefully."
 je_reconquista_rep_dominicana_esp_tt: "It is located in #bold North America#!"

 je_regencia_esp: "Regency of [ROOT.GetCountry.GetRuler.GetFirstName]"
 je_regencia_esp_reason: "Before the death of #bold Fernando VII#! in 1833, he restored the #bold Pragmatic Sanction#! in [ROOT.GetCountry.GetName], allowing his daughter [ROOT.GetCountry.GetHeir.GetFirstName], only 2 years old, to access the throne instead of her brother #bold Carlos María Isidro#!.\n\nThe young [ROOT.GetCountry.GetHeir.GetFirstName] is currently only #variable [ROOT.GetCountry.GetHeir.GetAge]#! years old, so [ROOT.GetCountry.GetRuler.GetFullName] has assumed the role of [Concept('concept_ruler', ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle)|l] until [ROOT.GetCountry.GetHeir.GetFirstName] is considered capable of assuming the task of ruling the country."

 je_regencia_esp_indicacion1: "[ROOT.GetCountry.GetHeir.GetFirstName] is #bold 17#! years old"
 je_regencia_esp_indicacion2: "[ROOT.GetCountry.GetHeir.GetFirstName] will be crowned [Concept('concept_ruler','queen')] by decree"
 je_regencia_esp_indicacion3: "The [concept_legitimacy|l] of the [concept_government|l] is #bold $legitimacy_level_illegitimate$#! for several months #bold ([ROOT.GetCountry.MakeScope.Var('contador').GetValue] / #v 20#! weeks)#!"
 je_regencia_esp_indicacion4: "The movement is #bold not#! of type #v $movement_radical$#!, #v $movement_liberal$#! or #v $movement_progressive$#!"
 je_regencia_esp_indicacion5: "[ROOT.GetCountry.GetName] is #bold not#! at war with the #bold Carlists#!"
 je_regencia_esp_indicacion7: "The [concept_popularity|l] of the [concept_character|l] is equal to or greater than #green #bold 30#!#!"
 je_regencia_esp_indicacion8: "In case of #tooltippable #tooltip:[GetPlayer.GetTooltipTag],je_regencia_esp_empate_tooltip tie#!#!" 
 je_regencia_esp_indicacion9: "If #bold Espartero#! ends up as [Concept('concept_ruler', 'regent')|l], we will enjoy a special [concept_modifier|l]"
 je_regencia_esp_indicacion10: "The [concept_interest_group|l] of the new [Concept('concept_ruler', 'regent')|l] will join the [concept_government|l]"
 je_regencia_esp_indicacion11: "#bold María Cristina#! is no longer the [Concept('concept_ruler', 'regent')|l] and a new one must be appointed"

 je_regencia_esp_empate_tooltip: "In case of multiple valid candidates, #bold Espartero#! will prevail above all, and if not, the [concept_character|l] with the highest [concept_popularity|l] will be chosen"

 je_regencia_espartero_esp: "Regency of [ROOT.GetCountry.GetRuler.GetLastName]"
 je_regencia_espartero_esp_reason: "The queen mother has left [ROOT.GetCountry.GetName], and the position of [Concept('concept_ruler', 'regent')|l] has fallen to [ROOT.GetCountry.GetRuler.GetLastName].\n\nThe young [ROOT.GetCountry.GetHeir.GetFirstName] is only #variable [ROOT.GetCountry.GetHeir.GetAge]#! years old, so [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] has assumed the role of [Concept('concept_ruler', 'regent')|l] until [ROOT.GetCountry.GetHeir.GetFirstName] is considered capable of assuming the task of ruling the country."
 je_regencia_espartero_esp_tt: "The [Concept('concept_ruler', 'regent')|l] has left the regency under unexpected circumstances"
 je_regencia_espartero_esp_tt1: "A grace period of #v 1#! year has passed since the last change"

 coronacion_de_isabel_name: "Crown Isabel"
 coronacion_de_isabel_desc: "The longer we maintain this unstable regency, the greater the chance the country will fall apart. Let’s end this, despite the repercussions that this decision might cause" 
 coronacion_de_isabel_tt: "The [concept_legitimacy|l] of the [concept_government|l] is at least #bold $legitimacy_level_legitimate$#!"
 coronacion_de_isabel_tt1: "The [concept_heir|l] is #bold Isabel de Borbón#!"

 je_caristras_latentes_esp: "Latent Carlist Movement"
 je_caristras_latentes_esp_reason: "#italic 'Struck down, but not destroyed' - Corinthians 4:8-9#!\n\nDespite the Carlist defeat in the first conflict, their followers continue to assert the legitimacy of Carlist candidates to the throne of [ROOT.GetCountry.GetAdjective]. The Carlist cause has proven resilient, finding new forms of expression and organization. Sooner or later, it is possible that the Carlists will emerge again as a significant movement on the Spanish political scene.\n\nIn case of #tooltippable #tooltip:[GetPlayer.GetTooltipTag],situacion_calmada_norte_tooltip calming the northern situation#!#!, the [concept_journal_entry|l] will be deactivated.\nThe risk of reorganization is marked by the [concept_legitimacy|l] level of your [concept_government|l]."
 situacion_calmada_norte_tooltip: "It will be considered calm when no requirement for #bold fail#! the [concept_journal_entry|l] is valid"

 je_caristras_latentes_esp_tt6: "The [concept_clout|l] of the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName|l], the [GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName|l], or the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName|l] in the [concept_state|l] is greater than or equal to #v 15.00%#!"

 je_caristras_latentes_esp_status1: "Risk #bold imminent#! of Carlist reorganization"
 je_caristras_latentes_esp_status2: "Risk #bold high#! of Carlist reorganization"
 je_caristras_latentes_esp_status3: "Risk #bold medium#! of Carlist reorganization"
 je_caristras_latentes_esp_status4: "Risk #bold low#! of Carlist reorganization"

 je_retorno_caristras_esp: "Return of the Carlists"
 je_retorno_caristras_esp_reason: "Despite their first defeat in the #bold Carlist War #!, different Carlist successors continue to claim the crown of [ROOT.GetCountry.GetName]. Without a doubt, they will take advantage of any political turbulence in the country to rally supporters to their cause."

 no_guerra_civil: "There is no [concept_civil_war|l] underway"
 je_retorno_caristras_esp_tt: "The #bold Carlists#! will rise again"

 je_government_petition_status_esp: "The [SCOPE.sParty('partido_carlista_scope').GetName] requests the approval of the [concept_law|l] of [SCOPE.sLaw('peticion_de_ley').GetName]"

 je_partido_carlista_esp: "Carlist Party Petition"
 je_partido_carlista_esp_reason: "A significant sector of Carlist loyalists, after their defeat on the battlefield, has decided to abandon the path of arms and, through the [SCOPE.sParty('partido_carlista_scope').GetName], plans to carry out its political agenda."
 je_partido_carlista_esp_tt: "They wish to have one of the available [concept_law|l] approved"

 je_incorporacion_republica_dominicana_esp: "Reincorporation of Santo Domingo"
 je_incorporacion_republica_dominicana_esp_reason: "After the French occupation of the island during the Napoleonic Wars, [SCOPE.sCountry('ocupador_santo_domingo').GetName] finally gained independence from [ROOT.GetCountry.GetName] in 1821, only to be occupied again by Haiti the following year.\nAfter a long struggle, the [SCOPE.sCountry('ocupador_santo_domingo').GetAdjective] people have finally achieved their long-awaited independence. Still a young nation, weakened by its recent independence, we can bring them back under our influence, taking advantage of the strong influence we can exert from [SCOPE.sCountry('provincia_caribe_scope').GetName].\n\n@information! [SCOPE.sCountry('ocupador_santo_domingo').GetName] may send a proposal for reincorporation if the following conditions are met:\n  $EFFECT_LIST_BULLET$[SCOPE.sCountry('ocupador_santo_domingo').GetName] has a [Concept('concept_ruler', '$RULER_TITLE_PRESIDENT$')|l] belonging to an [concept_interest_group|l] in the [concept_government|l] as a member of a [Concept('concept_political_lobby', '$concept_political_lobby_short$')|l] pro-country @lobby_pro_country! towards [ROOT.GetCountry.GetName] with a [concept_political_lobby_appeasement|l] greater than or equal to #bold #green +5#!#!\n  $EFFECT_LIST_BULLET$[SCOPE.sCountry('ocupador_santo_domingo').GetName] has the [concept_law|l] of [GetLawType('law_presidential_republic').GetName] \n  $EFFECT_LIST_BULLET$$anexion_rep_dominicana_tt$\n\n They can increase the likelihood of the proposal if:\n   $EFFECT_LIST_BULLET$[SCOPE.sCountry('ocupador_santo_domingo').GetName] has a [concept_attitude|l] $ai_attitude_genial$ or $ai_attitude_cooperative$ towards us. If hostile, it will decrease.\n  $EFFECT_LIST_BULLET$[SCOPE.sCountry('ocupador_santo_domingo').GetName] has a [concept_attitude|l] $ai_attitude_wary$ or $ai_attitude_antagonistic$ towards another [concept_country|l]."
 je_incorporacion_republica_dominicana_esp_tt: "[SCOPE.sCountry('ocupador_santo_domingo').GetName] does not exist as a [concept_country|l]"
 je_incorporacion_republica_dominicana_esp_tt2: "Has rejected a reincorporation proposal from [SCOPE.sCountry('ocupador_santo_domingo').GetName]"
 je_incorporacion_republica_dominicana_esp_tt3: "The [concept_rank|l] of [ROOT.GetCountry.GetName] is greater than that of #bold Santo Domingo#!"
 je_incorporacion_republica_dominicana_esp_tt4: "The [concept_rank|l] of [ROOT.GetCountry.GetName] is less than or equal to that of [SCOPE.sCountry('ocupador_santo_domingo').GetName]"
 je_incorporacion_republica_dominicana_esp_tt5: "All [concept_primary_cultures|l] of [SCOPE.sCountry('ocupador_santo_domingo').GetName] have a #bold base#! [concept_acceptance|l] lower than #v 40#! @acceptance_status_3!"

 je_faccion_anexionista_con_espanna_dom: "Annexationist Faction"
 je_faccion_anexionista_con_espanna_dom_reason: "Due to our recent independence, many citizens still lack national consciousness, so a small faction may consider that the survival of [ROOT.GetCountry.GetName] lies in rejoining [SCOPE.sCountry('spa_scope').GetName], thus enjoying the protection it may provide.\n\nOur [concept_economic_dependence|l] on [SCOPE.sCountry('spa_scope').GetName] is [ROOT.GetCountry.GetEconomicDependenceOn(SCOPE.sCountry('spa_scope').Self)]"
 je_faccion_anexionista_con_espanna_dom_tt: "The [concept_rank|l] of #bold Spain#! is higher than that of [ROOT.GetCountry.GetName]"
 je_faccion_anexionista_con_espanna_dom_tt1: "The [concept_rank|l] of [SCOPE.sCountry('spa_scope').GetName] is equal to or lower than that of [ROOT.GetCountry.GetName]"
 je_faccion_anexionista_con_espanna_dom_tt2: "All our [concept_primary_cultures|l] have a #bold base#! [concept_acceptance|l] lower than #v 40#! @acceptance_status_3! in [SCOPE.sCountry('spa_scope').GetName]"


 anexion_rep_dominicana_name: "Propose Annexation"
 anexion_rep_dominicana_desc: "With the independence of a Hispanic country on Hispaniola, we can seek a peaceful union with them."
 anexion_rep_dominicana_tt: "The progress bar of #variable $je_faccion_anexionista_con_espanna_bar$#! has reached #variable 100 %#!"
 anexion_rep_dominicana_tt1: "It has not been proposed previously."
 anexion_rep_dominicana_tt2: "It is directed toward #bold Spain#!"
 anexion_rep_dominicana_tt3: "Our [Concept('concept_ruler', '$RULER_TITLE_PRESIDENT$')|l] is part of this [concept_interest_group|l]"
 anexion_rep_dominicana_tt4: "If they accept, this will result in a [concept_diplomatic_catalyst|l] in [ROOT.GetCountry.GetName] where possibly some [Concept('concept_interest_group', '$concept_interest_groups$')|l] will create an [Concept('concept_political_lobby', '$concept_political_lobby_short$')|l] independentist @lobby_anti_overlord!."

 je_capitania_general_republica_dominicana_esp: "Captaincy General of Santo Domingo"
 je_capitania_general_republica_dominicana_esp_reason: "Now that [SCOPE.sCountry('ocupador_santo_domingo').GetName] is under our protection as a [concept_protectorate|l], we should begin planning for a future integration with [ROOT.GetCountry.GetName], to align the position of the island with the rest of our domains."
 je_capitania_general_republica_dominicana_esp_tt: "We have the [concept_law|l] of [GetLawType('law_autocracy').GetName], [GetLawType('law_oligarchy').GetName], [GetLawType('law_technocracy').GetName], [GetLawType('law_single_party_state').GetName], or [GetLawType('law_anarchy').GetName].\n\nOtherwise, we must ensure #bold Representation in the courts#! of [SCOPE.sCountry('ocupador_santo_domingo').GetName]"
 je_incorporacion_republica_dominicana_esp_tt1: "The formalization of the annexation will not be well received by the people of [SCOPE.sState('santo_domingo_scope').GetName]"

 je_trinitaria_hai: "The Trinitaria"
 je_trinitaria_hai_reason: "#bold The Trinitaria#! was a society created by Juan Pablo Duarte and other ideologists of [concept_culture|l] [SCOPE.sCulture('caribenno_scope').GetName] with the goal of taking action to gain independence for [SCOPE.sState('santo_domingo_scope').GetName] from the [ROOT.GetCountry.GetAdjective] occupation and form an independent [concept_country|l].\n\nThe name #bold The Trinitaria#! was chosen in honor of the Holy Trinity; Father, Son, and Holy Spirit.\n\n@information! For #bold The Trinitaria#! to attract and/or radicalize more members, they need at least a [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')|l] of #variable 5%#!. Additionally, if their [Concept('concept_activism', '$concept_activism_short$')|l] exceeds #variable 50%#!, they will begin carrying out acts of sabotage.\n\n@information! According to the level of [Concept('concept_radical', '$concept_radicalism$')|l] among the [concept_culture|l] [SCOPE.sCulture('caribenno_scope').GetName], there will be a higher likelihood of [Concept('concept_agitator', '$concept_agitators$')|l] emerging to support the movement."

 je_trinitaria_hai_desc: "Can attract more members"
 je_trinitaria_hai_desc2: "Can attract more members, as well as perform sabotage"
 je_trinitaria_hai_desc3: "@warning! The movement will return after the [concept_civil_war|l]"
 je_trinitaria_hai_desc4: "No significant activity"
 je_trinitaria_hai_tt1: "The Trinitaria was founded in an event"

 je_independencia_rep_dominicana_guerra_civil: "The Trinitaria: Political Instability"
 je_independencia_rep_dominicana_guerra_civil_reason: "With #bold The Trinitaria#! active in [ROOT.GetCountry.GetName], political stability is more important than ever. Any [concept_revolution|l] will be seized by #bold The Trinitaria#! to secure independence for the #bold Dominican Republic#!"
 je_independencia_rep_dominicana_guerra_civil_tt: "Once the [concept_civil_war|l] ends, #bold The Trinitaria#! will gain much more strength."

 je_ferrocaril_cuba_esp: "Cuban Railway"
 je_ferrocaril_cuba_esp_reason: "Although [ROOT.GetCountry.GetName] still lacks the capacity to build [GetBuildingType('building_railway').GetName|l] lines, our [SCOPE.sCharacter('capitan_general_cuba').GetFullNameWithTitle] has proposed the construction of a small line between [SCOPE.sState('cuba_estado_scope').GetCityHubName] and Bejucal, in [SCOPE.sState('cuba_estado_scope').GetCountry.GetName]"

 je_cuestion_hispanoamerica_esp: "Hispano-American Question"
 je_cuestion_hispanoamerica_esp_reason: "Although more than 7 years have passed since the Tampico debacle at the hands of the Mexican general Antonio López de Santa Anna, [ROOT.GetCountry.GetName] still does not recognize the independence of the Latin American nations and continues to treat them as rebels. Many in the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] argue that it is time to move forward and start signing friendship treaties with the new American nations."
 je_cuestion_hispanoamerica_esp_tt: "The [concept_country|l] gained independence from [ROOT.GetCountry.GetName] between the years 1810-1825"
 je_cuestion_hispanoamerica_esp_tt1: "Attempt has been made to sign a #bold friendship and cooperation treaty#! with the [concept_country|l] before"
 je_cuestion_hispanoamerica_esp_tt2: "Some of its [concept_primary_cultures|l] have the [concept_cultural_trait|l] of #bold #white $hispanophone$#!#!"

 genesis_cultural: "They have configured themselves as a nation-state, generating a patriotic spirit. The national [concept_primary_cultures|l] are: [GetCulture('argentine').GetName], [GetCulture('peruvian').GetName], [GetCulture('bolivian').GetName], [GetCulture('ecuadorian').GetName], [GetCulture('chilean').GetName], [GetCulture('venezuelan').GetName], [GetCulture('uruguayan').GetName], [GetCulture('paraguayan').GetName], and [GetCulture('colombian').GetName]. The [GetCulture('mexican').GetName] does not count."

 no_a_echo_genesis_cultural: "#bold No#! has completed its #tooltippable #tooltip:[GetPlayer.GetTooltipTag],genesis_cultural cultural genesis#!#!"

 je_integrar_puertorico_esp: "Integration of Puerto Rico"
 je_integrar_puertorico_esp_reason: "After more than 400 years of [ROOT.GetCountry.GetAdjective] domination of the island of [SCOPE.sState('puerto_rico_scope').GetName] and after finally addressing the issue of [GetLawType('law_legacy_slavery').GetName|l], equating it to the level of the provinces on the mainland, the doors are open to finally complete the island's integration process.\n\nAny disaster that occurs in [SCOPE.sState('puerto_rico_scope').GetName] during our rule will destroy any hope of integration."
 je_integrar_puertorico_esp_tt: "We will not be able to attempt to integrate [SCOPE.sState('puerto_rico_scope').GetName] as [Concept('concept_homeland','homeland')] [SCOPE.sCulture('cultura_espannola_scope').GetName]."
 je_integrar_puertorico_esp_tt1: "[SCOPE.sState('puerto_rico_scope').GetName] has a [GetBuildingType('building_university').GetName|l] built."
 je_integrar_puertorico_esp_tt2: "Its [concept_culture|l] is [SCOPE.sCulture('cultura_espannola_scope').GetName]."
 je_integrar_puertorico_esp_tt3: "[SCOPE.sState('puerto_rico_scope').GetName] has a [GetBuildingType('building_railway').GetName|l] line built."
 je_integrar_puertorico_esp_tt4: "If we activate the [GetLawType('law_slave_trade').GetName|l] law."
 es_estado_puerto_rico: "They are located in [SCOPE.sState('puerto_rico_scope').GetName]"


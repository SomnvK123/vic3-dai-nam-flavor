 je_pirateria_mar_jolo_duennos_phi: "Moorish Piracy"
 je_pirateria_mar_jolo_duennos_phi_reason: "Moorish piracy in the waters of the Indonesian archipelago poses a constant threat to merchants and adventurers navigating the seas between the islands. These corsairs, originating from Malay and Buginese coastal communities, engaged in the looting of merchant vessels, taking advantage of the intricate labyrinth of islands and straits to ambush their prey and quickly disappear.\n\nEquipped with light and maneuverable boats known as perahu, these pirates instill terror among European and Asian sailors."


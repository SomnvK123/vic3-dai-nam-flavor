 je_guardia_civil_esp: "Civil Guard"
 je_guardia_civil_esp_reason: "One of our senior officers has proposed the creation of an armed force for [ROOT.GetCountry.GetName] dedicated to maintaining security in the countryside and public order in general. Above all, it would help us combat banditry in the southern regions of the peninsula."

 je_filipinas_esp: "Complete the Conquest of the Philippines"
 je_filipinas_esp_reason: "[ROOT.GetCountry.GetName] controls most of the Philippine archipelago through [SCOPE.sCountry('phim_scope').GetName].\nIt is time to finish off the small sultanates remaining in the archipelago and incorporate them into [SCOPE.sCountry('phim_scope').GetName]. For the first time in the history of the Philippines, they will be unified under the same administration."
 je_filipinas_esp_tt: "The [concept_government|l] of [SCOPE.sCountry('phim_scope').GetName] will gain greater [concept_legitimacy|l], and the [concept_popularity|l] of [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] will increase."
 je_impuestos_al_consumo_esp: "Commitment to Consumption Taxes"
 je_impuestos_al_consumo_esp_reason: "We have committed to our finance minister, a member of [SCOPE.gsInterestGroup('ministro_ig_scope').GetName], to maintain certain [concept_budget_consumption_taxes|l] on certain products. If we do not honor our word, the discontent among [SCOPE.gsInterestGroup('ministro_ig_scope').GetName] will be noticeable."
 impuesto_al_consumo_sugar: "[ROOT.GetCountry.GetName] #bold no#! collects [concept_budget_consumption_taxes|l] on [GetGoods('sugar').GetName]"
 impuesto_al_consumo_meat: "[ROOT.GetCountry.GetName] #bold no#! collects [concept_budget_consumption_taxes|l] on [GetGoods('meat').GetName]"
 impuesto_al_consumo_tobacco: "[ROOT.GetCountry.GetName] #bold no#! collects [concept_budget_consumption_taxes|l] on [GetGoods('tobacco').GetName]"
 impuesto_al_consumo_liquor: "[ROOT.GetCountry.GetName] #bold no#! collects [concept_budget_consumption_taxes|l] on [GetGoods('liquor').GetName]"

 je_rearme_naval_esp: "Naval Rebuilding"
 je_rearme_naval_esp_reason: "[ROOT.GetCountry.GetName] completely lost its naval hegemony after the great defeat suffered at the hands of [concept_admiral|l] #bold Horatio Nelson#! at #bold Trafalgar#! and the subsequent Spanish American Secession Wars. The Spanish War of Independence, along with the ongoing political instability that [ROOT.GetCountry.GetName] faced over the next four decades, prevented any attempt at naval rebuilding.\n\nWith the rise of new maritime powers like [SCOPE.sCountry('enemigo_naval').GetName], our navy minister has demanded that the [concept_government|l] begin naval expansion plans with the goal of protecting overseas territories from foreign interests."
 je_rearme_naval_esp_goal: "Naval power projection of the $NAVY$ has increased as expected by the [concept_admiral|l]"
 je_rearme_naval_esp_tt: "Member of [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] while in [concept_government|l]"

 je_reinado_de_isabel: "Reign of Isabel"
 je_reinado_de_isabel_reason: "Although the regime survived the regency, there is much ambition from the different [Concept('concept_interest_group', '$concept_interest_groups$')|l] for power. It is the task of [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] to try to calm these [Concept('concept_interest_group', '$concept_interest_groups$')|l] along with their [Concept('concept_general', '$concept_generals$')|l] and [Concept('concept_admiral', '$concept_admirals$')|l].\n\n @warning! If a [concept_revolution|l] is being considered that is not of #tooltippable #tooltip:[GetPlayer.GetTooltipTag],WCR1_tt_progressives_tt worker character#!#! and this exceeds #bold 75% progress#!, the [concept_revolution|l] will lose all progress at the cost of increasing the progress bar of #variable $establidad_reinado_isabel$#! by #bold #red 600#!#! points.\n\n@information! Stricter [Concept('concept_law', '$concept_laws$')] in [GetLawGroup('lawgroup_internal_security').GetName] will affect progress, helping to reduce it.\n@information! $je_reinado_de_isabel_tt5$"
 isabel_esta_gobernando: "#bold Isabel de Borbón#! is the [Concept('concept_ruler', 'queen')|l]"
 je_reinado_de_isabel_tt: "The progress bar of #variable $establidad_reinado_isabel$#! has reached #variable 100 %#!"
 je_reinado_de_isabel_tt1: "#bold Isabel de Borbón#! is not the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]"
 je_reinado_de_isabel_tt2: "The progress bar #variable $establidad_reinado_isabel2$#! has reached #variable 100 %#!"
 je_reinado_de_isabel_tt3: "In the case of having [Concept('concept_law', '$concept_laws$')|l] of [GetLawType('law_autocracy').GetName], [GetLawType('law_technocracy').GetName] or [GetLawType('law_oligarchy').GetName], the [concept_law|l] of [GetLawType('law_landed_voting').GetName] will be activated to give way to the [Concept('concept_party', '$concept_parties$')|l] politicians."
 je_reinado_de_isabel_tt4: "If the progress bar #variable $establidad_reinado_isabel2$#! has reached #variable 100 %#!, we will receive the following [concept_modifier|l]:"

 je_reinado_de_isabel_tt5: "The [Concept('concept_character', '$concept_characters$')|l] with an attitude of $IDEOLOGY_APPROVAL$ or $IDEOLOGY_STRONG_APPROVAL$ towards the [Concept('concept_law', '$concept_laws$')|l] of [GetLawType('law_autocracy').GetName], [GetLawType('law_technocracy').GetName] or [GetLawType('law_oligarchy').GetName] will never support the #bold Glorious Revolution#! whether they are [Concept('concept_general', '$concept_generals$')|l] or [Concept('concept_admiral', '$concept_admirals$')|l], or if they are [Concept('concept_leader', '$concept_leaders$')|l] of an [concept_interest_group|l], they will not participate in the #bold Glorious Revolution#!."
 grupo_de_interes_no_apoya_republica_trabajadores: "The position of your [concept_interest_group|l] on [GetLawType('law_council_republic').GetName] is less than or equal to #bold #white Neutral#!#!"

 je_reinado_de_isabel_tt6: "The progress bar of #variable $caristras_latentes_esp_bar$#! will increase by #bold 600#! points"
 je_reinado_de_isabel_tt7: "The progress bar of #variable $retorno_carlistas_esp_bar$#! will increase by #bold 400#! points"

 je_reinado_de_isabel_tt8: "Their position on [GetLawType('law_autocracy').GetName], [GetLawType('law_technocracy').GetName], [GetLawType('law_oligarchy').GetName] and [GetLawType('law_council_republic').GetName] is less than or equal to #bold #white Neutral#!#!"
 
 je_republicanismo_esp: "Rise of Republicanism"
 je_republicanismo_esp_reason: "Although it was previously unthinkable for the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] to consider a republic for [ROOT.GetCountry.GetName], recently, voices defending this position have started to emerge. It seems that the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] is about to enter an internal debate, whose outcome could change its foundations."
 je_victoria_del_republicansimo: "The progress bar of #variable $je_republicanismo_esp_bar$#! has shifted towards being [GetIdeology('ideology_republican').GetName]"
 je_victoria_del_constitucionalismo: "The progress bar of #variable $je_republicanismo_esp_bar$#! has shifted towards being #bold [GetIdeology('ideology_constitutionalist').GetName]#!"
 je_republicanismo_esp_tt: "Belongs to [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]"
 je_colonia_fernando_poo: "Fernando Poo Colony"
 je_colonia_fernando_poo_reason: "Former territory of the #bold Viceroyalty of the Río de la Plata#! that remained under Spanish influence until the 1780 revolt.\n\nIf we want to ensure [ROOT.GetCountry.GetName]'s influence on the coast of Guinea, we must develop the colony and consolidate [ROOT.GetCountry.GetAdjective]'s control over it before it is too late."
 je_colonia_fernando_poo_goal: "The [Concept('concept_gdp', '$concept_gdp_short$')] of [SCOPE.sState('camerun_scope').GetName] is at least #bold 25.0K#!@money!"
 je_colonia_fernando_poo_tt: "The decision to secure [ROOT.GetCountry.GetName]'s presence on the #bold Guinea#! coast will be added."
 je_colonia_fernando_poo_tt1: "It belongs to [ROOT.GetCountry.GetName]"

 je_economia_agraria_cub: "Cuban Agricultural Economy"
 je_economia_agraria_cub_reason: "After the independence of #bold Haiti#! and the [GetLawType('law_slavery_banned').GetName] in #bold Jamaica#!, some [GetPopType('aristocrats').GetName] from these islands emigrated to [ROOT.GetCountry.GetName] in search of a safe place to continue their businesses.\n\nIn the blink of an eye, [ROOT.GetCountry.GetName] had become the #italic 'Pearl of the Caribbean'#! with almost no competition in its agricultural industry in the Caribbean."
 je_economia_agraria_cub_tt: "The [concept_building|l] is a #bold Plantation#!"
 je_economia_agraria_cub_tt1: "The [concept_productivity|l] of the [concept_building|l] is less than or equal to #green #bold 4.0#!#!@money!"
 je_economia_agraria_cub_tt2: "The [concept_productivity|l] of the [concept_building|l] is greater than or equal to #green #bold 5.0#!#!@money!"

 je_economia_agraria_cub_esp: "$je_economia_agraria_cub$"
 je_economia_agraria_cub_esp_reason: "After the independence of #bold Haiti#! and the [GetLawType('law_slavery_banned').GetName] in #bold Jamaica#!, some [GetPopType('aristocrats').GetName] from these islands emigrated to [SCOPE.sCountry('cuba_scope').GetName] in search of a safe place to continue their businesses.\n\nIn the blink of an eye, [SCOPE.sCountry('cuba_scope').GetName] had become the #italic 'Pearl of the Caribbean'#! with almost no competition in its agricultural industry in the Caribbean."
 je_economia_agraria_cub_esp_tt: "The [concept_building|l] is located in [SCOPE.sCountry('cuba_scope').GetAdjective] land"

 je_general_independentista_cub: "Independence Agitators"
 je_general_independentista_cub_reason: "[SCOPE.sCharacter('maximo_gomez_scope').GetFullName] has made his way into the national political scene and has started advocating for the independence of [ROOT.GetCountry.GetName] from [SCOPE.sCountry('overlord_scope').GetName], and his message has started to resonate in society."
 je_general_independentista_esp_tt: "[SCOPE.sCharacter('maximo_gomez_scope').GetFullName] is not in [ROOT.GetCountry.GetName]"

 je_desamortizacion_iglesia_esp: "$esp.54.t$"
 je_desamortizacion_iglesia_esp_reason: "Many lands in [ROOT.GetCountry.GetName] are left unused by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName].\n\nThe President of the Council of Ministers, #bold Mendizábal#!, has proposed a massive expropriation of these assets to then resell them at public auctions. This would not only bring these lands into productive use but also generate extra revenue to confront the Carlist forces.\n\nThe [concept_law|l] is in the process of [Concept('concept_enactment_of_laws','enactment')]. If we want to avoid excessive increases in [Concept('concept_credit', '$concept_credit_debt$')|l], we must push it through as soon as possible."

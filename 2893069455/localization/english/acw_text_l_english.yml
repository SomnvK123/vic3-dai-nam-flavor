  acw_reconstruction_decrees:0 "Reconstruction Authority"
  
  je_csa_acw_war:0 "The War for Southern Independence" 
  je_csa_acw_war_status:0 "Fight for Confederate independence!"
  je_csa_acw_war_reason:0 "Despite our efforts for compromise and reason, the Northern States have thrown us aside in their arrogant pursuit of abolitionism. Their attempts to stamp out our lifestyle here in the South have pushed us over the edge: independence is upon us. The Confederacy will resist all Northern attempts of submission.\n\nHundreds of thousands across the South are rising up against the tyranny in the North. They want a fight? They will have one; a very bloody one, with death and destruction to follow."
  csa_acw_victory.tt:0 "We have secured our independence."
  csa_acw_victory_timeout.tt:0 "We have drawn the war out into a stalemate."
  csa_acw_lost.tt:0 "We have lost the war for independence!"
  csa_acw_annexed.tt:0 "The North will almost certainly re-annex us."
  
  je_csa_reconstruction:0 "Reconstructing the Confederacy"
  je_csa_reconstruction_status:0 "Rebuild the Confederacy after the War for Independence."
  je_csa_reconstruction_reason:0 "The War for Independence brought about great destruction and despair across the South. Our nation, though small and vastly underprepared for civil war, still came out into a status quo with the North. However, the war took everything we had to win: our cities have been ransacked and our countryside burned. We must pick up the pieces of our new nation, lest the North launch a surprise invasion to force us back into their devillish union.\n\nIt is time to raise the banners high. The Stars and Bars will wave triumphantly over the Stars and Stripes! Our Northern counterpart will understand one thing when we are done: we are more than capable of handling this union of our own."
  je_csa_reconstruction_goal:0 "Five years have passed since the beginning of Reconstruction."
  
  je_csa_golden_circle:0 "The Golden Circle"
  je_csa_golden_circle_status:0 "Assert our hegemony over Central and South America."
  je_csa_golden_circle_reason:0 "The great struggle between blacks and whites was tantamount to our secession from the North. While the North views them as individuals with rights worth protecting, our lifestyle and traditions say otherwise. The obvious truth remains: whites were meant to rule over the black populace.\n\nThere exists vast, vast lands of great riches and resources south of the Rio Grande, from Mexico down to Colombia, and from Cuba to the Antilles; yet occupied by non-whites. Our goal is simple, yet challenging: we must build the Golden Circle and assert our dominance over Central and South America. It is our holy mission; our second Manifest Destiny." 
  
  je_csa_reclaim_north:0 "Our Northern Claims"
  je_csa_reclaim_north_status:0 "Regain the American Border States."
  je_csa_reclaim_north_reason:0 "When the American Civil War broke out in 1861, there were many border slave states who voted in favor of secession with the Confederacy. However, the Union Army was sent in to put down the so-called unlawful act. These border states, still, remain part of the Union, despite their wishes to join our Confederacy. This cannot remain; the Border States must be reunited with their Southern counterparts."
  
  confederacy.1.t:0 "The Declaration of Separation"
  confederacy.1.d:0 "After years of bloodshed, the Union has surrendered to us. President [SCOPE.sCharacter('csa_president').GetFullName] and his [SCOPE.sCountry('united_states').GetAdjectiveNoFlag] counterpart met today in a courthouse in [SCOPE.sState('surrender_state').GetName] to sign a Declaration of Separation: an immediate end to Civil War hostilities."
  confederacy.1.f:0 "THIS DECLARATION OF SEPARATION, a contract binding these two nations together, shall see the [SCOPE.sCountry('united_states').GetNameNoFlag] and the [SCOPE.sCountry('confederate_states').GetNameNoFlag] agree to cease hostilities immediately; and for the United States Government to wholly and officially recognize the Confederate States Government as both independent and legitimate....\n\nSigned,\nUnited States President [SCOPE.sCharacter('usa_president').GetFullName]\nConfederate States President [SCOPE.sCharacter('csa_president').GetFullName]"
  confederacy.1.a:0 "Our independence is secure!"
  confederate_negotiations.tt:0 "Negotiations between us and the United States will commence over the terms of this treaty."
  
  confederacy.2.t:0 "Treaty Negotiations"
  confederacy.2.d:0 "With our independence secured, it's time to negotiate terms to the North's surrender. President [SCOPE.sCharacter('csa_president').GetFullName] has put out two options to the [SCOPE.sCountry('confederate_states').GetAdjectiveNoFlag] Congress for consideration: the Confederacy could either announce or relinquish her claims to the rest of the slave states within the Union. Announcing these claims would almost surely destroy any chance at reconcilliation with the [SCOPE.sCountry('united_states').GetNameNoFlag], but would maintain legitimacy to our claims in the North. Alternatively, relinquishing these claims might allow diplomatic ties between the North and South to be rekindled, ensuring peace and stability for both nations. Whatever we choose, the North awaits anxiously for our response."
  confederacy.2.f:0 ""It is an argument between jingoism or pacifism. We have just exited a bloody war; many of us wish not for another!"\n\n"It is necessary that we see through our full claims to our homelands! The Confederacy as she stands now is but a precursor to her true form.""
  confederacy.2.a:0 "Relinquish these claims. There is no point to more bloodshed!"
  confederacy.2.b:0 "Announce our claims! The North is not our friend."
  northern_claims_relinquished.tt:0 "Confederate claims on Union Slave States will be relinquished."
  northern_claims_announced.tt:0 "The Confederacy will gain claims on all Dixie homelands!"
  
  confederacy.3.t:0 "The Golden Circle Victorious!"
  confederacy.3.d:0 "President [SCOPE.sCharacter('csa_president').GetFullName] has proclaimed: at long last, the [SCOPE.sCountry('confederacy').GetNameNoFlag] stretches from North to South America. Our hegemony over the western hemisphere has been made clear. No nation can even hope to withstand us; not even our Northern counterpart, from whom we broke away from so long ago. Our strength remains unchallenged, and shall remain so for centuries."
  confederacy.3.f:0 ""We will expand, as our growth and civilization shall demand—over Mexico—over the isles of the sea—over the far-off Southern tropics—until we shall establish a great Confederation of Republics—the greatest, freest and most useful the world has ever seen." - Robert Barnwell Rhett"
  confederacy.3.a:0 "It was our destiny."
  csa_golden_circle_homelands.tt:0 "The Dixie culture will gain homelands over all of our conquered states in Mexico, Central America, Gran Colombia, and the Carribbean."
  
  confederacy.4.t:0 "Our Northern Lands Reclaimed!"
  confederacy.4.d:0 "At long last, our claims to the North have joined our great Confederacy. The former border slave states of the Union have been incorporated into our grand nation, as well as our territorial claims out in the West. The [SCOPE.sCountry('confederacy').GetNameNoFlag] has asserted her dominance over the [SCOPE.sCountry('united_states').GetNameNoFlag]!"
  confederacy.4.f:0 ""Our new government is founded upon exactly the opposite ideas; its foundations are laid, its cornerstone rests, upon the great truth that the negro is not equal to the white man; that slavery, subordination to the superior race, is his natural and normal condition. This, our new government, is the first, in the history of the world, based upon this great physical, philosophical, and moral truth." - Alexander H. Stephens"
  confederacy.4.a:0 "We welcome these states into OUR union!"
  csa_northern_claims_incorporate.tt:0 "Our claimed territories will join the Confederacy as fully-fledged states."
  
  confederacy.5.t:0 "Reconstructing the Confederacy"
  confederacy.5.d:0 "The War for Southern Independence brought about great ruin to our newly-established nation. We were stretched thin on every front and in every aspect of [SCOPE.sCountry('confederacy').GetAdjectiveNoFlag] life. Now that the North has agreed to a temporary peace, we must rebuild the Confederacy in order to protect against a future war."
  confederacy.5.f:0 ""We must rebuild. The North stands poised to reclaim what they believe is theirs; we will ensure they are unable to strike.""
  confederacy.5.a:0 "Let us rebuild."
  
  confederate_reconstruction.1.t:0 "The End of Reconstruction"
  confederate_reconstruction.1.d:0 "At long last, the [SCOPE.sCountry('confederacy').GetNameNoFlag] has been fully rebuilt. Now is the time for us to show our dominance on the North American continent, and to establish [SCOPE.sCountry('confederacy').GetAdjectiveNoFlag] hegemony over the western hemisphere for good."
  confederate_reconstruction.1.f:0 "God save the South,\nGod save the South,\nHer altars and firesides, God save the South!\nNow that the war is nigh, now that we arm to die,\nChanting our battle cry, "Freedom or death!"\nChanting our battle cry, "Freedom or death!"
  confederate_reconstruction.1.a:0 "Now comes the time for action!"
  
  confederate_reconstruction.2.t:0 "[SCOPE.sState('petitioning_state').GetName] Requests Aid"
  confederate_reconstruction.2.d:0 "The [SCOPE.sState('petitioning_state').GetName] Legislature has petitioned the [SCOPE.sCountry('confederacy').GetAdjectiveNoFlag] Congress, requesting immediate support in aiding the State's recovery program after the Independence War. In particular, the funds would be allocated toward slave owner reparations, loans for city industries, and welfare payments for those displaced by the War."
  confederate_reconstruction.2.f:0 ""BE IT RESOLVED: the Government of [SCOPE.sState('petitioning_state').GetName], acting on behalf of her constituents, petitions the immediate assistance of the Confederate States Government in financial loans committed to repairing the social and industrial infrastructure of [SCOPE.sState('petitioning_state').GetName]..."
  confederate_reconstruction.2.a:0 "Give them a little."
  confederate_reconstruction.2.b:0 "Give them a lot!"
  
  confederate_reconstruction.3.t:0 "Urban or Rural?"
  confederate_reconstruction.3.d:0 "New funds allocated to the State of [SCOPE.sState('repair_state').GetName] by the [SCOPE.sCountry('confederacy').GetAdjectiveNoFlag] Congress have raised questions on where the money should go. Some argue for keeping the State's industries in urban cities pumping, while others have emphasized the importance of keeping the State's plantations and farms up and running."
  confederate_reconstruction.3.f:0 ""Urban or rural? That's the question, Mr. Speaker. It is a matter of our priority.""
  confederate_reconstruction.3.a:0 "Prioritize the cities of [SCOPE.sState('repair_state').GetName]!"
  confederate_reconstruction.3.b:0 "Put the countryside of [SCOPE.sState('repair_state').GetName] first!"
  
  confederate_reconstruction.4.t:0 "Immigration Campaigns"
  confederate_reconstruction.4.d:0 "In accordance with guidance handed down from the [SCOPE.sCountry('confederacy').GetAdjectiveNoFlag] Congress, the State of [SCOPE.sState('immigration_state').GetName] has begun aggressive immigration campaigns, hoping to draw in migrants particularly from Europe in order to boost the [SCOPE.sCountry('confederacy').GetNameNoFlag]'s population."
  confederate_reconstruction.4.f:0 ""A nation comprised of true social and racial hierarchy; one that institutes both liberty and authority in a perfect balance! Come, move to the [SCOPE.sCountry('confederacy').GetNameNoFlag] and live a life of freedom!""
  confederate_reconstruction.4.a:0 "A wonderful initiative, really."
  
  
 #Hawaii JE and Events
    
  je_hawaii_usa:0 "The Annexation of Hawaii"
  je_hawaii_usa_status:0 "Obtain the Hawaiian Islands."
  je_hawaii_usa_reason:0 "For decades, we have eyed the Hawaiian Islands with growing interest. Since the turn of the century, the islands have seen great potential in both whaling and the production of sugar cane. During the Civil War, Hawaii was our biggest trade partner for sugar. Now, a considerable amount of American colonists have set up in Hawaii, fielding large plantations full of cash crops and exotic fruit just waiting to be brought into our markets.\n\nThe time has come for us to make a choice: are the Hawaiian Islands better in another nation's hands, or ours?"
  je_hawaii_usa_annexed.tt:0 "Either we have subjugated the Hawaiian Islands, or the Monarchy has been overthrown."
  hawaii_reconstruction_over:0 "The Reconstruction Era has passed."
  
  
  usa_hawaii.1.t:0 "The Newlands Resolution"
  usa_hawaii.1.d:0 "A Congressman from [SCOPE.sState('newlands_state').GetName] has drafted a resolution for the Congress to consider regarding the [SCOPE.sState('hawaiian_islands').GetName]. The resolution proclaims the annexation of [SCOPE.sCountry('hawaii').GetNameNoFlag] into the [SCOPE.sCountry('united_states').GetNameNoFlag], and its organization as an unincorporated territory."
  usa_hawaii.1.f:0 ""Whereas the Government of [SCOPE.sCountry('hawaii').GetNameNoFlag] having, in due form, signified its consent, in the manner provided by its constitution, to cede absolutely and without reserve to the [SCOPE.sCountry('united_states').GetNameNoFlag] all rights of sovereignty of whatsoever kind..."
  usa_hawaii.1.a:0 "The [SCOPE.sState('hawaiian_islands').GetName] are ours!"
  
  usa_hawaii.2.t:0 "Rising Tensions on the [SCOPE.sState('hawaiian_islands').GetName]"
  usa_hawaii.2.d:0 "Reports are coming in describing the rising tensions on the [SCOPE.sState('hawaiian_islands').GetName]. A so-called Committee of Safety has been established in the small nation, led by one [SCOPE.sCharacter('sanford_dole').GetFullName], and has allegedly been planning a revolution against the [SCOPE.sCountry('hawaii').GetNameNoFlag], hoping to secure [SCOPE.sCountry('united_states').GetAdjectiveNoFlag] support."
  usa_hawaii.2.f:0 ""We need to watch this situation closely. Hawaii represents an untapped gold mine of opportunity in the Pacific.""
  usa_hawaii.2.a:0 "An interesting development."
  usa_hawaii_tensions.tt:0 "Tensions in Hawaii will continue to grow."
  Sanford_B:0 "Sanford B."
  Dole:0 "Dole"
  
  usa_hawaii.3.t:0 "[SCOPE.sCulture('yankee').GetName] Settlers on the [SCOPE.sState('hawaiian_islands').GetName]"
  usa_hawaii.3.d:0 "WIP"
  usa_hawaii.3.f:0 "WIP"
  usa_hawaii.3.a:0 "WIP"
  
  usa_hawaii.4.t:0 "Rebellion in the [SCOPE.sCountry('hawaii').GetName]"
  usa_hawaii.4.d:0 "WIP"
  usa_hawaii.4.f:0 "WIP"
  usa_hawaii.4.a:0 "We should watch this with interest."
  if_hawaii.tt:0 "If the Committee of Safety proclaims a republic, we will move to secure the islands."
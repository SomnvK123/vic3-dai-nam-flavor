 xuanweisi_events.9.t:0 "Expel [SCOPE.sState('xuanweisi_quzhimin').GetName] colonists"
 xuanweisi_events.9.d:0 "Our [SCOPE.sState('xuanweisi_quzhimin').GetName] region is filled with Western colonists who came here with a brutal and bloody colonization campaign."
 xuanweisi_events.9.f:0 "This is not their home, let them give it back to the indigenous people."
 xuanweisi_events.9.a:0 "It's time for them to go back to their homeland."
 
 xuanweisi_events.10.t:0 "Hanhua [SCOPE.sState('xuanweisi_hanhua').GetName] area"
 xuanweisi_events.10.d:0 "The [SCOPE.sState('xuanweisi_hanhua').GetName] area of our country has become a gathering place for Chinese people, whose influx has completely changed the local customs and culture and integrated into the local society. Now the Chinese in [SCOPE.sState('xuanweisi_hanhua').GetName] have developed a new identity and consider it their homeland."
 xuanweisi_events.10.f:0 "We can follow the trend and strengthen their homeland and turn this place into a juridical and cultural homeland for the Chinese."
 xuanweisi_events.10.a:0 "This place is at ease as my hometown"
 
 xinying_yimin_33_de:0 "Expel the colonizers"
 xinying_yimin_33_de_desc:0 "We should expel the Western colonists located on our land and let them return to their homeland."
 
 xinying_yimin_34_de:0 "Hanify the region"
 xinying_yimin_34_de_desc:0 "An area of our country where the Chinese have gathered in large numbers and have integrated into the local society, and this area is already considered one of the homelands of the Han Chinese."
 
 xinying_yimin_huifu_de:0 "Restoration of the Xuanhuo Division"
 xinying_yimin_huifu_de_desc:0 "We have recaptured our Xuanhuis, it's time to re-enthrone them!"
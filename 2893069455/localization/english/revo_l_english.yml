 agitate_rev_events.1.t:0 "The Eve of the revolution"
 agitate_rev_events.1.d:0 "After a long and cautious discussion, [SCOPE.GetRootScope.GetCountry.GetName] People's Revolutionary Committee decided to spread the revolutionary fire to the world"
 agitate_rev_events.1.f:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('are_1_ruler_scope').GetFullName] read out the opinions on behalf of the Party Central Committee in the enlarged conference of Central Conference of Delegates of Workers, Peasants and Soldiers: \n We, [SCOPE.GetRootScope.GetCountry.GetName], like a locomotive, carrying the responsibility of spreading the revolutionary fire. In this era of capitalism, revisionism and even residual Monarchism, which are rampant and oppress the proletariat all over the world, we have the necessity and obligation to sweep all pests out of the earth and let the glory of communism illuminate every corner of the world! The next station of Communist train is [SCOPE.sCountry('rev_target_country').GetName]!"
 agitate_rev_events.1.a:0 "The conference decided to agitate from outside"
 agitate_rev_events.1.b:0 "The conference decided to send agitators"

 agitate_rev_events.2.t:0 "Set out"
 agitate_rev_events.2.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] Continuing Revolutionary Committee with [SCOPE.sCharacter('are_1_ruler_scope').GetFullName] as its President has elected many outstanding Communist Party members to participate in this mission"
 agitate_rev_events.2.f:0 "When everything is ready, you can contact the left parties and progressive people in [SCOPE.sCountry('rev_target_country').GetName], But be careful, their actions are closely monitored.\nWhere will the fate of the proletariat in [SCOPE.sCountry('rev_target_country').GetName] go? Only you can answer this question, and I hope to hear news of the revolution from there soon."
 agitate_rev_events.2.a:0 "Good luck!"

 agitate_rev_events.3.t:0 "All must bear the torch"
 agitate_rev_events.3.d:0 "The basic question of every revolution is that of state power."
 agitate_rev_events.3.f:0 "Up to now state power in [SCOPE.sCountry('rev_target_country').GetName] has virtually remained in the hands of the [SCOPE.gsInterestGroup('powerful_ig').GetName], who are compelled to make only particular concessions (only to begin withdrawing them the following day), to hand out promises (only to fail to carry them out), to search for all sorts of excuses to cover their domination (only to fool the people by a show of “honest coalition”), etc., etc. In words it claims to be a popular, democratic, revolutionary government, but in deeds it is an anti-popular, undemocratic, counter-revolutionary, bourgeois government. This is the contradiction which has existed so far and which has been a source of the complete instability and inconsistency of power\n 《One of the Fundamental Questions of the Revolution》"
 agitate_rev_events.3.a:0 "The threats abound"

 agitate_rev_events.4.t:0 "The Revolution is coming"
 agitate_rev_events.4.d:0 "Doubt is out of the question. We are on the threshold of a world proletarian revolution."
 agitate_rev_events.4.f:0 "Is it then surprising, in view of the incredible hardship inflicted on the people in [SCOPE.sCountry('rev_target_country').GetName] by prolonging the oppression by the ruling class and by its consequences, that a peasant revolt has begun and is spreading in [SCOPE.sCountry('rev_target_country').GetName] ?The crisis has matured. The whole future of the [SCOPE.sCountry('rev_target_country').GetName]  revolution is at stake. The honour of the Party is in question. The whole future of the international workers' revolution for socialism is at stake."
 agitate_rev_events.4.a:0 "The volcano is about to erupt"

 agitate_rev_events.5.t:0 "The Revolution has arrived"
 agitate_rev_events.5.d:0 "Either all the central and local political power will belong to the newly formed [SCOPE.sCountry('rev_target_country').GetName] People's Revolutionary Committee; Either the landlords and capitalists obstructed everything and were annihilated by the magnificent revolution."
 agitate_rev_events.5.f:0 "C'est la lutte finale, Groupons-nous et demain. \n L'Internationale Sera le genre humain."
 agitate_rev_events.5.a:0 "There are no intermediate roads"


 je_sway_IG:0 "Sway Interest Groups"
 je_sway_IG_reason:0 "To ensure the success of the revolution, there must be enough IGs to support us"
 je_sway_IG_goal:0 "Accumulate enough strength for the revolution"
 je_sway_TU:0 "Sway Trade Unions"
 je_sway_TU_reason:0 "The working class constitutes the main component of the proletariat and plays the role of the revolutionary vanguard in more developed capitalist countries. The working class possesses nothing except their own labor power, but they have the ability to build a new world upon the ruins of the old."
 je_sway_TU_goal:0 "Strive for the support of the Trade Unions"
 je_sway_RF:0 "Sway Rural Folk"
 je_sway_RF_reason:0 "In underdeveloped countries with insufficient industrialization, peasants constitute the lowest social stratum. Peasants are bound by feudal systems and endure economic exploitation and political oppression by landlords. However, at the same time, they also represent the largest segment of the population. Gaining the support of this group means gaining the support of the majority."
 je_sway_RF_goal:0 "Strive for the support of the Rural Folk"
 je_sway_IN:0 "Sway Intelligentsia"
 je_sway_IN_reason:0 "Intelligentsia are the group with the least "pure proletarian" background. Most of them come from the bourgeoisie or aristocracy, which provides them with opportunities for good education. However, this also gives them more chances to encounter and understand progressive ideas. Once the left-wing intelligentsia gain the upper hand, they can greatly assist our cause."
 je_sway_IN_goal:0 "Strive for the support of the Intelligentsia"
 je_sway_AF:0 "Sway Armed Forces"
 je_sway_AF_reason:0 "In modern bourgeois republics, the majority of soldiers and officers who advance through military merit also belong to the proletariat. If we can harness the power of the state's military apparatus, it will add fuel to the fire of our revolutionary cause."
 je_sway_AF_goal:0 "Strive for the support of the Armed Forces"

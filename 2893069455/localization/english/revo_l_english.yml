 revolution_events.1.t:0 "Our personnel arrived safely"
 revolution_events.1.d:0 "With the unremitting efforts of comrades from relevant departments, A group of communists departured from [SCOPE.GetRootScope.GetCountry.GetName] who have excellent theoretical level, rich struggle experience, and extremely high ideological consciousness have arrived at their destination."
 revolution_events.1.f:0 "“Comrades, I believe that soon, [SCOPE.sCountry('rev_target_country').GetName], this land will be bathed in the radiance of the red flag!”"
 revolution_events.1.a:0 "Contact local party branches first"
 revolution_events.1.b:0 "We should cooperate inside and outside"

 revolution_events.2.t:0 "Our personnel's actions have been discovered"
 revolution_events.2.d:0 "Although our action was seamless, there were still some accidents.When entering a certain junction location, our comrade was discovered by [SCOPE.sCountry('rev_target_country').GetName] polices, although most of them are escaped successfully, there still some comrades was killed when covering up for others."
 revolution_events.2.f:0 "“Run away, I'll hold them down!”"
 revolution_events.2.a:0 "We must temporarily retreat from here"
 revolution_events.2.b:0 "Replenish manpower and resources, accelerate action speed"

 revolution_events.3.t:0 "Instigate the army"
 revolution_events.3.d:0 "First, break the strong backer of the regime——The 'reliable army' of [SCOPE.sCountry('rev_target_country').GetName]"
 revolution_events.3.f:0 "Inadequate food and the absence of any kind of sanitary measures whatsoever, are causing infectious diseases to spread among the troops. These unbearable conditions are still further aggravated by the absence of anything like decent housing and clothing. Worn and weary, the soldiers are dying like flies. And this is after tens of thousands have been killed by bullets! . . . All this is causing unrest and discontent among the troops. The soldiers are awakening from their torpor, they are beginning to feel that they are human, they no longer blindly obey the orders of their superiors, and often greet their upstart officers with whistling and threats.\n 《Workers of the Caucasus, it is Time to Take Revenge!》"
 revolution_events.3.a:0 "Soldiers are all our brothers"
 revolution_events.3.b:0 "Some sergeants are also dissatisfied"

 revolution_events.4.t:0 "All power belongs to the Emergency Soviet"
 revolution_events.4.d:0 "The civil war broke out, at a special moment, with special countermeasures. Now everyone must obey the command!"
 revolution_events.4.f:0 ""
 revolution_events.4.a:0 "Yes Sir!"
 revolution_events.4.b:0 "Not necessary"

 rr_events.1.t:0 "Speeches on communist national thought attract crowds"
 rr_events.1.d:0 "The policy of oppressing nationalities is one of dividing nations. At the same time it is a policy of systematic corruption of the people's minds. "
 rr_events.1.f:0 "The Black Hundreds gang's plans are designed to foment antagonism among the different nations, to poison the minds of the ignorant and downtrodden masses. \n But the working class needs unity, not division. It bas no more bitter enemy than the savage prejudices and superstitions which its enemies sow among the ignorant masses. The oppression of “subject peoples” is a double-edged weapon. It cuts both ways—against the “subject peoples” and against the "ruling people"."
 rr_events.1.a:0 "Workers in [SCOPE.sCountry('rev_target_country').GetName], unite not divide!"
 rr_events.1.b:0 "[SCOPE.sCharacter('reactionary_gang').GetFullName] is the gang leader!"

 rr_events.2.t:0 "The [SCOPE.sCountry('rev_target_country').GetName] socialist [SCOPE.sCharacter('lost_in_debate').GetFullName] who support our cause failed in debate"
 rr_events.2.d:0 "This speech was interrupted by a clergyman, whose remarks attracted many who had originally supported us"
 rr_events.2.f:0 "Communism has brought about Atheism, which is totally a kind of heresy and poses a threat to individual spirituality, Free will and individual dignity. The core principles of communism completely negate the importance of personal property rights, personal freedom, and personal responsibility. Communism disregards human nature and attempts to unify and control individuals through a mandatory collectivist system. This system deprives individuals of the right to choose and Free will, and places people under the ruthless control of central planning and collective rule. Please think about it, are you willing to live in a society without gods, freedom, and morality?"
 rr_events.2.a:0 "What he said seems to make sense"
 rr_events.2.b:0 "Commies have no conscience"

 rr_events.3.t:0 "Funds lost"
 rr_events.3.d:0 "Damn it, where's our gold?"
 rr_events.3.f:0 "“How can we carry out the activity without this money?”\n“I think [SCOPE.sCharacter('funds_stealer').GetFullName] is suspicious”"
 rr_events.3.a:0 "[SCOPE.sCharacter('funds_stealer').GetFullName] stole our funds!search his house and confiscate his property, expel him from our party!"
 rr_events.3.b:0 "There is not enough evidence to prove that it is [SCOPE.sCharacter('funds_stealer').GetFullName] stole it"

 rr_events.4.t:0 "The establishment of the Revolutionary Workers' Association"
 rr_events.4.d:0 "Workers in [SCOPE.sState('workers_joint_committee_state').GetName] has established the first local RWA"
 rr_events.4.f:0 "their aim is set forth as follows:\n (1) to organise combat groups for the armed uprising;\n (2) to raise the necessary funds for arms and for literature of a strictly proletarian nature.”\n The organisation of the Workers' Union consists of four-stage bodies:\n (1) groups of workers (mainly from one and the same workshop);\n (2) factory councils;\n (3) district meetings; and \n(4) committees of the Workers' Union.\n《A New Revolutionary Workers’ Association》"
 rr_events.4.a:0 "Smuggling weapons to them"
 rr_events.4.b:0 "Give them financial support"
 rr_events.4.c:0 "We can do nothing"

 rr_events.5.t:0 "The Marxism clubs in University of [SCOPE.sState('marxism_club_state').GetName]"
 rr_events.5.d:0 "Unlike elsewhere, the atmosphere of universities is free, and students and teachers can discuss anything here. This is a place where ideas collide"
 rr_events.5.f:0 "From Marxism to [SCOPE.sCharacter('reactionary_gang').GetLastName] thought on Loyalist with [SCOPE.sCountry('rev_target_country').GetName] Characteristics for a New Era can be discussed here"
 rr_events.5.a:0 "Encourage more scholars to participate"
 rr_events.5.b:0 "Encourage clubs to organize related activities"
 rr_events.5.c:0 "They should be more involved"

 rr_events.6.t:0 "The reactionary government's military, police, and gendarmerie suppressed the march of workers in [SCOPE.sState('capital_state').GetName]"
 rr_events.6.d:0 "The gendarmes did their utmost to disperse the demonstrators, who kept reassembling. The crowd offered resistance to the police; revolver shots were fired and many policemen were wounded."
 rr_events.6.f:0 "At 11 a. m. workers began to assemble in the streets, with the crowd singing the Varchavianka. Revolutionary mass meetings were held, and printing-shops whose staff refused to strike were wrecked. Bakeries and gunsmiths’ shops were attacked, for the workers needed bread to live and arms to fight for freedom. It was only after stub born resistance that the policemen managed to disperse the demonstrators. There was a regular battle near the Governor General’s house. In front of the bakery a crowd of bakers’ apprentices assembled. As the management of the bakery subsequently declared, they were going out peacefully into the street, after stopping work in solidarity with the other strikers. A gendarme detachment attacked the crowd, who made their way into a house, climbed on to the roof and into the garrets, and showered the soldiers with stones. There began a regular siege of the house, with the troops firing on the workers. All communication was cut. Two companies of grenadiers made a flank movement, penetrated into the house from the rear, and captured the enemy’s stronghold. One hundred and ninety-two apprentices were arrested, of whom eight were injured; two workers were killed. There were injured among the police and the troops, a captain of gendarmes sustaining fatal injuries.\n《The Political Strike and the Street Fighting in Moscow》"
 rr_events.6.a:0 "No prairie fire can destroy the grass, it shoots up again with the spring breeze blows."
 rr_events.6.b:0 "[SCOPE.sCharacter('revolutionary_martyr').GetFullName] is a good comrade"

 rr_events.7.t:0 "Order prevails in [SCOPE.sState('workers_strike_state').GetName]"
 rr_events.7.d:0 "There has been a massive strike in [SCOPE.sState('workers_strike_state').GetName] recently, with thousands of male and female workers stopping work and taking to the streets to fight for their rights."
 rr_events.7.f:0 "“Order prevails in Warsaw!” “Order prevails in Paris!” “Order prevails in Berlin!” Every half-century that is what the bulletins from the guardians of “order” proclaim from one center of the world-historic struggle to the next. And the jubilant “victors” fail to notice that any “order” that needs to be regularly maintained through bloody slaughter heads inexorably toward its historic destiny; its own demise.\n What was this recent “Spartacus week” in [SCOPE.sState('workers_strike_state').GetName]？While we are still in the midst of battle, while the counterrevolution is still howling about their victory, revolutionary proletarians must take stock of what happened and measure the events and their results against the great yardstick of history. The revolution has no time to lose, it continues to rush headlong over still-open graves, past “victories” and “defeats,” toward its great goal. The first duty of fighters for international socialism is to consciously follow the revolution’s principles and its path.\n《Order Prevails in Berlin》"
 rr_events.7.a:0 "Support local workers"
 rr_events.7.b:0 "Take the opportunity to instigate strikes in other areas"

 rr_events.8.t:0 "The soldiers of [SCOPE.sState('soldiers_refuse_orders_state').GetName] refused the orders"
 rr_events.8.d:0 "The progressive students of the [SCOPE.sState('soldiers_refuse_orders_state').GetName] university launched a Procession in solidarity with the local working class and asked the reactionary government to immediately convene a people's constitutional assembly led by revolutionary parties."
 rr_events.8.f:0 "This requirement is unacceptable to the class oppressors of the reactionary regime of [SCOPE.sCountry('rev_target_country').GetName]. After receiving the order from the superior to suppress the progressive students, the soldiers of [SCOPE.sState('soldiers_refuse_orders_state').GetName] refused to carry out this order and pointed their guns at their officers. \n It seems that even their most reliable "thugs" cannot tolerate the bad behavior of the reactionary government."
 rr_events.8.a:0 "More and more people will be on our side"

 rr_events.9.t:0 "A las Barricade, A las Barricade!"
 rr_events.9.d:0 "Temper rises. The unorganised street crowds, quite spontaneously and hesitatingly, set up the first barricades."
 rr_events.9.f:0 "Next day, artillery fire is opened on the barricades and the crowds in the streets. Barricades are set up more deliberately, and no longer in isolated cases, but on a really mass scale.\n The whole population is in the streets; all the main centres of the city are covered by a network of barricades. For several days the volunteer fighting units wage a stubborn guerrilla battle against the troops, which exhausts the troops\nThe strike was growing into an uprising, primarily as a result of the pressure of the objective conditions created after October. A general strike could no longer take the government unawares: it had already organised the forces of counter-revolution, and they were ready for military action. The whole course of the [SCOPE.sCountry('rev_target_country').GetName] revolution, and the sequence of events the December days, strikingly confirmed one of Marx’s profound propositions: revolution progresses by giving rise to a strong and united counter-revolution, i.e., it compels the enemy to resort to more and more extreme measures of defence and in this way devises ever more powerful means of attack.\n《Lessons of the Moscow Uprising》"
 rr_events.9.a:0 "Forward, forward, working people"
 rr_events.9.b:0 "The moment of victory is coming"

 rr_events.10.t:0 "A Social democrat"
 rr_events.10.d:0 "A different voice has emerged in the workers' movement of [SCOPE.sCountry('rev_target_country').GetName], a political rising star:[SCOPE.sCharacter('socialdemo_leader').GetFullName], appearing in the public eye and attracting many people's attention."
 rr_events.10.f:0 "The Social Democratic Party is the political team of the bourgeoisie, the agent of the bourgeoisie in the labor movement, and the main social pillar of the bourgeoisie. At any time, Communists must draw a clear line with the Social Democratic Party on the basic issues of the proletarian revolution and the Dictatorship of the proletariat, and eliminate the ideological influence of Social democracy from the international workers' movement and the working masses of other countries."
 rr_events.10.a:0 "Those who do not oppose our revolutionary cause can unite"
 rr_events.10.b:0 "His Pacifism will destroy the revolution, and our cause cannot accommodate such rightists"
 rr_events.10.c:0 "Social democrats are completely bourgeois spies, kill him!"

 rr_events.11.t:0 "[SCOPE.sCharacter('new_people').GetFullName] wants to join us"
 rr_events.11.d:0 "[SCOPE.sCharacter('new_people').GetFullName] is a famous petty bourgeoise activist and a Anarchist. Although he has already retired, he expressed his willingness to make some contributions to the workers' movement."
 rr_events.11.f:0 "Anarchism advocates a stateless society from politics to economy. Politically, workers spontaneously form associations, banning political parties, governments, and the state as tools of oppression for the people. Economically, it advocates for workers to form various cooperatives related to production and consumption, thereby excluding middle capitalists, bureaucrats, and governments as profiteers and engaging in an autonomous economy of equal exchange. Social spontaneous organizations can completely replace corrupt state machinery."
 rr_events.11.a:0 "We welcome anyone who opposes bourgeois dictatorship"
 rr_events.11.b:0 "We should first understand your political tendencies, what is Anarchism, and is it a left-wing ideology?"

 rr_events.12.t:0 "“Exquisite” nationalist [SCOPE.sCharacter('nationalist').GetFullName] "
 rr_events.12.d:0 "Immigrants are taking our jobs and encroaching on our living space"
 rr_events.12.f:0 "When the more intelligent members of the bourgeoisie realised that brute force alone was ineffective, all sorts of “progressive” bourgeois parties and groups have been more and more often resorting to the method of dividing the workers by advocating different bourgeois ideas and doctrines designed to weaken the struggle of the working class.\nwhen the more intelligent members of the bourgeoisie realised that brute force alone was ineffective, all sorts of “progressive” bourgeois parties and groups have been more and more often resorting to the method of dividing the workers by advocating different bourgeois ideas and doctrines designed to weaken the struggle of the working class.\nOne such idea is refined nationalism, which advocates the division and splitting up of the proletariat on the most plausible and specious pretexts, as for example, that of protecting the interests of “national culture”, “national autonomy, or independence”, and so on, and so forth.\n 《Corrupting the Workers with Refined Nationalism》"
 rr_events.12.a:0 "These words are undoubtedly inflammatory"

 rr_events.13.t:0 "[SCOPE.sCharacter('left_leader').GetFullName] demanded an immediate constitutional assembly"
 rr_events.13.d:0 "We demand that all rights be handed over to representatives elected by the people, but not those who belongs to[SCOPE.gsInterestGroup('powerful_ig').GetName]"
 rr_events.13.f:0 "Yes, and as soon as possible. But there is only one way to assure its convocation and success, and that is by increasing the number and strength of the Soviets and organising and arming the working-class masses. That is the only guarantee."
 rr_events.13.a:0 "Convene or conquer"

 rr_events.14.t:0 "Moderates in the party oppose an immediate revolution"
 rr_events.14.d:0 "Most people in the party do not have much confidence in the success of the current revolution"
 rr_events.14.f:0 "Admit the truth that there is a tendency, or an opinion, in our Central Committee and among the leaders of our Party which favours waiting for the Congress, and is opposed to taking power immediately, is opposed to an immediate insurrection. That tendency, or opinion, must be overcome.Otherwise, we will cover themselves with eternal shame and destroy themselves as a party.For to miss such a moment and to "wait" for the Congress would be utter idiocy, or sheer treachery.\n《The Crisis Has Matured》"
 rr_events.14.a:0 "But we are not fully prepared now, we only have one chance"
 rr_events.14.b:0 "Revolution brooks no delay"

 rr_events.15.t:0 "Textile women workers in [SCOPE.sState('f_textile_worker_state').GetName] demand expanded rights"
 rr_events.15.d:0 "In the past 15 years, the awakening of proletarian women in politics and trade union organizations has been great. However, this is only because working women, deprived of their rights, have developed a strong interest in the political and parliamentary democratic struggles of their class."
 rr_events.15.f:0 "The capitalist state has not been able to keep women from taking on all these duties and efforts of political life. Step by step, the state has indeed been forced to grant and guarantee them this possibility by allowing them union and assembly rights. Only the last political right is denied women: the right to vote, to decide directly on the people’s representatives in legislature and administration, to be an elected member of these bodies. But here, as in all other areas of society, the motto is: “Don’t let things get started!” But things have been started. The present state gave in to the women of the proletariat when it admitted them to public assemblies, to political associations. And the state did not grant this voluntarily, but out of necessity, under the irresistible pressure of the rising working class.\n《Women’s Suffrage and Class Struggle》"
 rr_events.15.a:0 "A Big Step for Women's Liberation"

 rr_events.16.t:0 "Technocrats in our party attract engineers"
 rr_events.16.d:0 "Some left technocrats joined our party and promote the benefits of technocray, which has attracted many engineers"
 rr_events.16.f:0 "The fundamental strength of technocracy comes from the people. It is unrealistic and ridiculous for a small group of crazy scientists to hide in a small dark lab and manipulate the world with their evil hands. The construction of Technate needs the support of the people, show the technology and science to the people. Only by applying thousands of knowledge to labor can we improve the material standards greatly. Technate belongs to everyone who is willing to contribute to it."
 rr_events.16.a:0 "This is not real communism, it is another form of oligarchy"
 rr_events.16.b:0 "Science and technology benefit the people, it's great"
 rr_events.16.c:0 "This keeps us further and further away from the joy of the countryside"

 rr_events.17.t:0 "The capitalists of [SCOPE.sState('refuse_to_increase_salary').GetName] refuse to raise wages for workers"
 rr_events.17.d:0 "Capitalists in [SCOPE.sState('refuse_to_increase_salary').GetName] cite classics and argue that wage increases will only lead to a general increase in prices, and use this as a reason to refuse to raise wages for workers. Some intellectuals also agree with this"
 rr_events.17.f:0 "Every upward movement in wages can have no other effect than a rise in the price of corn, wine, etc., that is, the effect of a dearth. For what are wages? They are the cost price of corn, etc.; they are the integrant price of everything. We may go even further: wages are the proportion of the elements composing wealth and consumed reproductively every day by the mass of the workers. Now, to double wages ... is to attribute to each one of the producers a greater share than his product, which is contradictory, and if the rise extends only to a small number of industries, it brings a general disturbance in exchange; in a word, a dearth....\nIt is impossible, I declare, for strikes followed by an increase in wages not to culminate in a general rise in prices: this is as certain as that two and two make four.\n《Philosophie de la misère》"
 rr_events.17.a:0 "Ridiculous bourgeois opinion"
 rr_events.17.b:0 "What he said also makes sense"

 rr_events.18.t:0 "[SCOPE.sState('f_p_protest').GetName] peasants protest landowners occupying a large amount of land"
 rr_events.18.d:0 "They are leading the peasants by the nose, telling them to wait for the Constituent Assembly. The convocation of the Assembly, however, is being steadily postponed by the landonwers."
 rr_events.18.f:0 "A vast majority of the peasants, at congress after congress, have loudly and clearly declared that landed proprietorship is an injustice and robbery. Meanwhile, a   government which calls itself revolutionary and democratic has been leading peasants by the nose for months and deceiving them by promises and delays. For months the capitalists did not allow Minister [SCOPE.sCharacter('rf_minister').GetFullName] to issue a law prohibiting the purchase and sale of land. And when this law was finally passed, the capitalists started a foul slander campaign against [SCOPE.sCharacter('rf_minister').GetFullName] which they are still continuing.\n As to land, wait until the Constituent Assembly. As to the Constituent Assembly, wait until the end of the war. As to the end of the war, wait until complete victory. That is what it comes to. The capitalists and landowners, having a majority in the government, are plainly mocking at the peasants.\n《Lessons of the Revolution》"
 rr_events.18.a:0 "The landowners took too much!"
 rr_events.18.b:0 "Farmers, especially peasants, have the worst lives in this society"
 rr_events.18.c:0 "This law must pass today!"

 rr_events.19.t:0 "The theorists in the Party distinguish the Dictatorship of the proletariat from the revolutionary democratic dictatorship of the peasants"
 rr_events.19.d:0 "In many underdeveloped countries, farmers and peasants account for the vast majority of the population. If we cannot unite the majority and crack down on the minority, how can the revolution succeed?"
 rr_events.19.f:0 "Possibly the peasantry may seize all the land and all the power. Far from forgetting this possibility, far from confining myself to the present, I definitely and clearly formulate the agrarian programme, taking into account the new phenomenon, i.e., the deeper cleavage between the agricultural labourers and the poor peasants on the one hand, and the peasant proprietors on the other.\n 《Letters on Tactics》"
 rr_events.19.a:0 "You should make friends a lot more"
 rr_events.19.b:0 "Without workers, revolution cannot be achieved"

 rr_events.20.t:0 "General [SCOPE.sCharacter('army_general').GetFullName] executed Soldiers in [SCOPE.sState('refused_order_state').GetName] who sympathize with workers"
 rr_events.20.d:0 "It is a common practice for reactionary governments to have soldiers who are also proletarians suppress the proletariat"
 rr_events.20.f:0 "The army began to waver. At first isolated cases of insubordination, outbreaks among reservists, protests from officers, propaganda among the soldiers, refusal of some companies and regiments to shoot at their own brothers, the workers. Then—the siding of part of the army with the uprising.\n《The Revolutionary Army and the Revolutionary Government》"
 rr_events.20.a:0 "Fragmented and about to collapse"

 rev_sway_events.1.t:0 "Trade unions is on our side"
 rev_sway_events.1.d:0 "We have won more support from people"
 rev_sway_events.1.f:0 "Victory is within reach"
 rev_sway_events.1.a:0 "The worker class is the strongest"

 rev_sway_events.2.t:0 "Rural folk is on our side"
 rev_sway_events.2.d:0 "We have won more support from people"
 rev_sway_events.2.f:0 "Victory is within reach"
 rev_sway_events.2.a:0 "Great"

 rev_sway_events.3.t:0 "Intelligentsia is on our side"
 rev_sway_events.3.d:0 "We have won more support from people"
 rev_sway_events.3.f:0 "Victory is within reach"
 rev_sway_events.3.a:0 "Great"

 rev_sway_events.4.t:0 "Armed forces is on our side"
 rev_sway_events.4.d:0 "We have won more support from people"
 rev_sway_events.4.f:0 "Victory is within reach"
 rev_sway_events.4.a:0 "Great"

 rev_sway_events.5.t:0 "Trade unions refused us"
 rev_sway_events.5.d:0 "These social-democratic fence-sitters have completely degenerated into the accomplices of the bourgeoisie, but the coming of the revolution is still inevitable"
 rev_sway_events.5.f:0 "The working class cannot play its world-revolutionary role unless it wages a ruthless struggle against this renegacy, spinelessness, subservience to opportunism and unexampled vulgarization of the theories of Marxism. Kautskyism is not fortuity, but a social product of the contradictions within the Second International, a combination of loyalty to Marxism in words and subordination to opportunism in deeds.\n《Socialism and War》"
 rev_sway_events.5.a:0 "The proletarian revolution will still triumph!"

 rev_sway_events.6.t:0 "Rural folk refused us"
 rev_sway_events.6.d:0 "Landowners control the vast majority of the land, with only a small portion belonging to farmers and homeowners. The poor peasants have nothing. Many of them succumb to the lust of the old nobles and landowners and are unwilling to join us"
 rev_sway_events.6.f:0 "The petty-bourgeois stratum of the rural population, the peasantry in the strict and narrow sense of the word, cannot help being revolutionary at certain periods in history. Its present revolutionary attitude is an inevitable product of the conditions of the “old order’, and we must vigorously support and develop it. But it will follow just as inevitably from the conditions of the new order, of the new, free, capitalist country, that part of the rural petty bourgeoisie will side with “order” \nThe Agrarian Programme of the Liberals"
 rev_sway_events.6.a:0 "The proletarian revolution will still triumph!"

 rev_sway_events.7.t:0 "Intelligentsia refused us"
 rev_sway_events.7.d:0 "That is what the bourgeoisie and the bourgeois intellectuals say, think, and do."
 rev_sway_events.7.f:0 "From the point of view of self-interest their behaviour is comprehensible. The hangers-on and spongers on the feudal landowners, the priests, the scribes, the bureaucrats as Gogol depicted them, and the "intellectuals" who hated Belinsky, also found it "hard" to part with serfdom. But the cause of the exploiters and of their "intellectual" menials is hopeless. The workers and peasants are beginning to break down their resistance—unfortunately, not yet firmly, resolutely and ruthlessly enough—and break it down they will. \n 《How to organise competition》"
 rev_sway_events.7.a:0 "The proletarian revolution will still triumph!"

 rev_sway_events.8.t:0 "Armed forces refused us"
 rev_sway_events.8.d:0 "Generals and capitalists are a group. The army needs weapons, and capitalists and military lords provide them with weapons, which has completely formed a chain of interests"
 rev_sway_events.8.f:0 "But we still won the support of many lower rank officers and soldiers"
 rev_sway_events.8.a:0 "The proletarian revolution will still triumph!"

 after_rev_events.1.t:0 "The revolution has triumphed!"
 after_rev_events.1.d:0 "A brand new, proletarian socialist republic has been established"
 after_rev_events.1.f:0 "One of the most important tasks today, if not the most important, is to develop this independent initiative of the workers, and of all the working and exploited people generally, develop it as widely as possible in creative organisational work. At all costs we must break the old, absurd, savage, despicable and disgusting prejudice that only the so-called "upper classes", only the rich, and those who have gone through the school of the rich, are capable of administering the state and directing the organisational development of socialist society.\n《How to Organise Competition?》"
 after_rev_events.1.a:0 "Long live the People!"

 after_rev_events.2.t:0 "Immediately abolish outdated laws"
 after_rev_events.2.d:0 "The Basic Principles of the Socialist Republic"
 after_rev_events.2.f:0 "Our state apparatus is so deplorable, not to say wretched, that we must first think very carefully how to combat its defects, bearing in mind that these defects are rooted in the past, which, although it has been overthrown, has not yet been overcome, has not yet reached the stage of a culture, that has receded into the distant past. \n 《Better Fewer, But Better》"
 after_rev_events.2.a:0 "Smash the old society"

 after_rev_events.3.t:0 "Science and technology assistance"
 after_rev_events.3.d:0 "Railway, Intensive farming, percussion..."
 after_rev_events.3.f:0 "Improve technologies"
 after_rev_events.3.a:0 "Never fall behind in technology"

 after_rev_events.4.t:0 "Industry assistance"
 after_rev_events.4.d:0 "Chemical plants, steel mills, coal mines..."
 after_rev_events.4.f:0 "Build factories"
 after_rev_events.4.a:0 "Establish an independent and autonomous industrial system as soon as possible"

 after_rev_events.5.t:0 "Support the education"
 after_rev_events.5.d:0 "Even if poor, education must be guaranteed"
 after_rev_events.5.f:0 "Build schools and universities"
 after_rev_events.5.a:0 "Establish a complete education system as soon as possible"

 after_rev_events.6.t:0 "Military support"
 after_rev_events.6.d:0 "Guns, artilleries..."
 after_rev_events.6.f:0 "Build military buildings"
 after_rev_events.6.a:0 "Establish an armed force as soon as possible that can defend the proletarian regime"

 after_rev_events.7.t:0 "Proletariat Dictatorship"
 after_rev_events.7.d:0 "For the emancipation of labor from the yoke of capital there is no other way but to replace this dictatorship with the dictatorship of the proletariat."
 after_rev_events.7.f:0 "The dictatorship of the proletariat alone can emancipate humanity from the oppression of capital, from the lies, falsehood and hypocrisy of bourgeois democracy — democracy for the rich — and establish democracy for the poor, that is, make the blessings of democracy really accessible to the workers and poor peasants, whereas now (even in the most democratic — bourgeois — republic) the blessings of democracy are, in fact, inaccessible to the vast majority of working people.\n Only by a state of the type of the Paris Commune or by a state of the Soviet type, can open the way to socialism. The dictatorship of the proletariat will deliver humanity from capitalist oppression and war.\n 《“Democracy” and Dictatorship》"
 after_rev_events.7.a:0 "The working masses of [SCOPE.sCountry('PD_country').GetName] not only can break the old world, but also can build a new world"

 156_projects_events.1.t:0 "156 Key Projects Construction Phase I"
 156_projects_events.1.desc:0 "To help us carry out industrial construction and establish a complete industrial economic system, our socialist brother/sister countries have brought us these key assistance projects"
 156_projects_events.1.flavor:0 "It's really selfless help"
 156_projects_events.1.a:0 "Common Mining"
 156_projects_events.1.b:0 "Rare Mining"
 156_projects_events.1.c:0 "Light Industry"
 156_projects_events.1.d:0 "Heavy Industry"
 156_projects_events.1.e:0 "Military Industry"
 156_projects_events.1.f:0 "Infrastructure"

 156_projects_events.2.t:0 "156 Key Projects Construction Phase II"
 156_projects_events.2.d:0 "Focusing on infrastructure construction"
 156_projects_events.2.f:0 "Without good infrastructure construction, no amount of products can be shipped out"
 156_projects_events.2.a:0 "It's really selfless help"

 156_projects_events.3.t:0 "156 Key Projects Construction Phase III"
 156_projects_events.3.d:0 "Focusing on industrial construction, mainly heavy industry"
 156_projects_events.3.f:0 "Heavy industry provides the means of production and technical basis for survival and development of various industries and departments"
 156_projects_events.3.a:0 "It's really selfless help"

 156_projects_events.4.t:0 "156 Key Projects Construction Phase IV"
 156_projects_events.4.d:0 "Focusing on the construction of light industry"
 156_projects_events.4.f:0 "Light industry is the pillar of people's livelihood"
 156_projects_events.4.a:0 "It's really selfless help"

 156_projects_events.5.t:0 "156 Key Projects Construction Phase V"
 156_projects_events.5.d:0 "This period mainly focuses on mining and military industries"
 156_projects_events.5.f:0 "Mineral resources are the fuel for industry, and military industry will protect them"
 156_projects_events.5.a:0 "It's really selfless help"

 156_projects_events.6.t:0 "156 Key Projects Construction Phase VI"
 156_projects_events.6.d:0 "It's almost over"
 156_projects_events.6.f:0 "We are about to transform from an agricultural country to an industrial country"
 156_projects_events.6.a:0 "It's really selfless help"


 trait_reactionary_gang_leader:0 "Reactionary Gang Leader"

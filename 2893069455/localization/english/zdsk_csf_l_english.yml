concept_battle_of_east_asia: "The Struggle for the Rising Sun"
concept_battle_of_east_asia_desc: "In the third year of the Daye era (607), Japan’s second mission to the Sui Empire presented a letter to the Emperor of Sui, stating 'From the Son of Heaven in the land where the sun rises to the Son of Heaven in the land where the sun sets,' sparking an Eastern debate on who truly represents the 'land of the rising sun.'"
je_chaoxian_jap: "[concept_battle_of_east_asia]: The Korean Issue"
je_chaoxian_jap_reason: "[SCOPE.sCountry('kor_scope').GetName] is too close to us, yet they are clearly too well-protected by their former suzerain [SCOPE.sCountry('chi_scope').GetName].\nIf [SCOPE.GetRootScope.GetCountry.GetName] is to pursue broader living space, we must not overlook [SCOPE.sCountry('kor_scope').GetName] as a stepping stone. We can force them to annul their tributary relationship with China, severing their ties with their former suzerain, and then seize the opportunity to infiltrate and intervene.\nSimultaneously, we can seize Taiwan to create a pincer between Japan, Korea, and Taiwan over the East China Sea.\nWe failed once during the Wanli era of the Ming dynasty, but this time, as [SCOPE.sCountry('chi_scope').GetName] faces internal and external crises, there will never be a better opportunity in a thousand years!"
kor_be_empire_button: "Encourage the Korean King to Declare Himself Emperor"
kor_be_empire_button_desc: "After severing ties with the Chinese tribute system, immediately encourage the Korean King to declare himself Emperor."

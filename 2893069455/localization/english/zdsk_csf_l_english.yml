ideology_sonno_kaikoku:0 "Sonno Kaikoku Faction"
ideology_sonno_kaikoku_desc:0 "This ideology advocates overthrowing the Tokugawa Shogunate and restoring the political authority of the Emperor, while adopting Western institutions and technologies to enrich and strengthen the nation. Unlike the isolationist Sonno Joi faction that simply rejects foreigners, the Sonno Kaikoku Faction holds that Japan must voluntarily open its borders, reorganize the military, build national defense, and develop industry on the premise of preserving the imperial legitimacy and national independence."
rawins:0 "RA Challenge July Winner"
rawins_desc:0 "This commemorates the player who, in the July RA speedrun, used #blue Bavaria#! to become the world's first superpower on January 1st, 1880, achieving the world's first GDP (1.8B), the world's first per capita GDP (9.08), and the world's first SOL (21.2)."
rawinss:0 "RA Challenge August Winner"
rawinss_desc:0 "This commemorates the player who, in the August RA speedrun, used #blue Austria#! to establish the Soviet Union on September 11th, 1848."
rawinsss:0 "RA Challenge September Winner"
rawinsss_desc:0 "This commemorates the athlete's use of #blue America#! in the September RA racing event, achieving a GDP of 1B in 1875 without conquering other territories."
Dongxuelian:0 "Dong Xuelian"



ideology_social_corporations:0 "Social Corporatism"
ideology_social_corporations_desc:0 "Also known as social democratic corporatism, this political-economic thought advocates the collaboration between trade unions, businesses, and the state to achieve social order and economic coordination. Compared to traditional corporatism, its supporters emphasize a balance between individual freedom, market regulation, and social welfare, with a focus on reforming rather than preserving societal structures through democratic processes and public policy."

ideology_Liberators:0 "Liberators"
ideology_Liberators_desc:0 "Human dignity is rooted in political freedom, expressed through the free expression of ideas and the freedom to critique and form opinions. Human dignity also includes the inherent rights to health, work, education, and social welfare. Under the influence of social democratic thought, its supporters are committed to liberating workers and constructing an equal social system. However, due to the constraints of the era, this ideal has yet to fully spread its light, and its profound meaning remains to be fully explored."

Yuergen:0 "R- Yuergen- von-D-"
Gulibeige:0 "Gulibeige-C"
je_Westernization_movement_lobby: 0 "#yellow China#! Inevitably involved in the disputes of the great powers, it has joined the world stage. Western countries that have undergone the Industrial Revolution are obviously ahead of us in science and technology. If we cannot learn from the foreigners to compete with them and maintain Chinese essence while adopting Western methods, #yellow China#! will struggle to sustain itself on the world stage."
je_Pentecostal_Variation_lobby: 0 "Intellectuals led by #yellow Kang Youwei#! and #yellow Liang Qichao#! hoped to use the emperor's authority to implement reforms and learn from the West institutionally to achieve modernization."
je_china_19th_century_lobby: 0 "A man of noble spirit, with a seven-foot-tall body, has dedicated himself to the country, so it is hard to also commit to you. If I can return alive from this journey, it will be a great fortune. If something unexpected happens, do not grieve or mourn. You may collect my bones and take them back to my hometown, burying them in a place where spring flowers bloom brightly. Now the country is in turmoil; I hope all of you will work together with all your strength, so that future generations can be free from this suffering."
je_reform_persia_lobby: 0 "#yellow Amir Kabir#!, who was once a chef, hoped to use #yellow the Shah#!'s power to reform the backward Iran."

C9_union_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nC9 represents the top nine universities in our country, which play a pivotal role in the modernization drive of our nation."
je_five_races_china_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThroughout history, there have been many discussions about what China is, and its meaning is not singular. In my view, it is not confined to ethnic boundaries, but truly tied to the context of culture. Therefore, it is said: Those who integrate into the Chinese civilization shall be regarded as part of it."
je_xinwenhua_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nWhen the smoke of the 1911 Revolution gradually dissipated into the morning mist above the city walls, and the flag that tore apart the monarchy still fluttered in the wind, a group of figures in long gowns and Western suits had already lit another flame at the boundary between old classics and new ideological trends. This flame is called the New Culture Movement—a light rekindled on the ideological wasteland that the 1911 Revolution failed to fully ignite."
je_rus_relationship_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThe autocratic monarchs of various regions in Greater Asia, the enforcer assisted by the virtuous ministers of Bogda, the protector of the society and glory of the #bold Chinese#! people, His Royal Highness the current Bogda Khan of Bogda and #bold China#!, His Majesty the Great Holy Supreme [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] of #bold China#!, and the hereditary autocratic monarch by the grace of God who rules over the lands of Great Russia, Little Russia, White Russia, and the territories in the east, west, and north of [concept_russian]—in order to uphold the eternal peace and happiness of the two countries, they gathered near Nerchinsk and jointly formulated the following clauses..."
je_china_natural_borders_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThe Chinese nation originated from Emperors Yan and Huang, with a history spanning five thousand years. The reason why the Chinese civilization is what it is lies not only in the inheritance of bloodlines, but also in the territory as its foundation."
je_dsk_great_china_load_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThis is a war that has already begun. [concept_great_power] keeps extending its hands to our borders, and the issue of our border security is extremely urgent."
je_ming_xixue_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThe development of academic work will bring great inspiration to our scholars."
je_china_and_japan_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nIn the third year of the Daye era (607 AD), Japan's second diplomatic mission to the Sui Dynasty presented a state letter to the Sui Empire, which read: 'The Emperor of the Land Where the Sun Rises sends a letter to the Emperor of the Land Where the Sun Sets—may you be well.' Since then, a debate arose in the East over which side is the 'Land Where the Sun Rises'."
je_white_sun_rise_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nI only hope that future generations will eventually be free from this suffering, with stable homes, sufficient food, no more wars, and no more cries of sorrow. At that time, the wind will be clear and the sun bright; children will clap their hands and sing on the road, and the elderly will enjoy themselves in the fields. No one will remember the hardships of this era. If so, all our struggles today will not be in vain."
je_whitesun_redland_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThe country is in a period of reconstruction after devastation. It is necessary for us to convene a national conference to achieve significant progress in our democratic politics. However, there are also disputes between conservatives and liberals during the conference."
je_Peoples_Heroes_Monument_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nSince the Opium War, in order to oppose internal and external enemies and strive for national independence and the freedom and happiness of the people, countless heroes have laid down their lives and shed their blood."
je_dsk_npc_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nIts ultimate mission is precisely to lead the #yellow Chinese nation#! in completing the great journey of building a modern socialist powerful country."
je_jap_shougun_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThe shogunate feared that Japan would become a target of invasion, so it adopted a policy of seclusion to guard against external threats."
je_respect_king_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThe economic aggression of Western capitalist countries has brought a severe economic crisis to Japan.\nA crisis against the shogunate's rule is inevitable!"
je_against_shougun_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nJapan was forced to open its borders under the military threat of Western colonizers led by the United States, facing the crisis of becoming a semi-colony. This further intensified various internal contradictions."
Je_Russo_Japanese_War_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThey covet China's territory, attempting to incorporate #N Manchuria#! and #N the Korean Peninsula#! into their sphere of influence. If we have territorial disputes with them, they will launch dangerous diplomatic games against us—we must be cautious!"
je_jap_empire_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThe Imperial Diet was established in response to the times. Its powers cover legislation, finance, general state affairs, and parliamentary internal affairs. However, its right to deliberate is restricted by the sovereignty of [Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')], the supreme authority of [Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')], and the royal autonomy, and shall not exceed these limits."
je_japan_invade_china_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThe spirit of the Imperial Way is clear and bright, integrating with the ambition of expanding territory and pioneering frontiers. All scholars and people in the country are inspired. The trend of militarism surges like a furious tide, sweeping across the islands; the desire for external conquest burns like a prairie fire, growing stronger day by day. This is because the time and circumstances have bestowed upon our country the mission of governing Asia."
je_protect_china_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\n#red As long as we can hold fast to this determination, our country and our nation with a five-thousand-year history will never perish at the hands of the mere Japanese invaders from those three islands.#!"
je_japan_china_win_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nThe national system of Japan, the Divine Country, is tied to the command of [Concept('concept_ruler','$RULER_TITLE_MIKADO$')] who has ruled for ten thousand generations. Its aspiration is to spread the innate grace of Japan to all corners of the world, enabling all people under heaven to enjoy the blessings of a good life."
je_annex_amercia_lobby: 0 "#v Unlocked by this DLC: RA Historical Timeline#!\nAbove all, we shall repay the grace of the Heavenly Spirits in bestowing this nation; below all, we shall promote the noble aspiration of the Imperial Grandson in cultivating virtue. After that, is it not feasible to unify the six directions to establish a capital and encompass all corners of the world to form a realm?"


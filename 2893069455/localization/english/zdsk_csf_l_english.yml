jiwupu_button: "Sign the 'Treaty of Jemulpo'"
jiwupu_button_desc: "#v If the 'rebels' commit 'violence' again and unexpectedly attack us, we can fully suppress them with our protection army without regard for the Korean government's handling of the situation.#!\nThe treaty stipulates that Korea must punish the 'rebels' responsible for the Imo Incident, apologize to Japan, and compensate for Japan's losses."
jianghua_button: "Sign the 'Ganghwa Treaty'"
jianghua_button_desc: "#v The Great Empire of Japan and the Great Kingdom of Korea have long maintained cordial relations. However, seeing that the friendship between the two countries has been strained, we wish to renew our old friendship to strengthen our bonds.#!\nThe treaty stipulates that all ports in Korea must be opened to Japan."
tianjin_button: "Sign the 'Tianjin Convention'"
tianjin_button_desc: "#v Both sides agree to withdraw troops as per the agreement, cease disputes, allow Korea to strengthen its military, and thereby preserve peace between China and Japan, which benefits the overall situation.#!\nThe treaty stipulates that China and Japan will simultaneously withdraw their troops from Korea, with a third country providing military training to Korea. If a major event or disturbance occurs in Korea, both countries must notify each other before sending troops. The treaty implicitly acknowledges both Japan and China's right to send troops to the Korean Peninsula."

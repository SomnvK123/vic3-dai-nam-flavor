je_culture_and_nationality_1: "ethnic policy"
 je_culture_and_nationality_1_reason: "As a multi-ethnic country, harmonious coexistence between the main ethnic groups and ethnic minorities is an important prerequisite for maintaining national territorial integrity"

culture_and_nationality.1.t: "Ethnic Policy"
culture_and_nationality.1.d: "As a multi-ethnic country, the harmonious coexistence of the main ethnic group and ethnic minorities is an essential prerequisite for maintaining the integrity of the national territory. However, there are divergent views on how to address issues related to ethnic minorities."
culture_and_nationality.1.f: "Some argue that our country does not need to classify ethnic groups based on bloodlines like foreign nations do. Instead, they propose merging into a single Chinese culture, emphasizing the historical integration of diverse ethnicities over the past five thousand years. The unity is perceived not through bloodlines but through a shared culture—namely, Chinese culture. Others believe that ethnicity is an inherent reality, and while some ethnic minorities may appreciate Han culture, imposing it forcefully on them is unreasonable. As Communists, they advocate respecting the unique cultures of ethnic minorities, promoting ethnic equality, unity, and autonomy."
culture_and_nationality.1.a: "Enter the realm of Huaxia, emerge civilized; all who acknowledge Chinese culture are Huaxia people."
culture_and_nationality.1.b: "Ethnic minorities and the Han are all part of the Chinese nation, and the principles of equality, unity, and autonomy should be followed."

tranform_han_into_chinese_culture: "Following the principle of entering Huaxia and emerging civilized, ethnic groups that identify with Chinese culture (such as the Han and some southern ethnic minorities) should cease using ethnic bloodlines to distinguish themselves and others. Instead, they should differentiate based on cultural aspects. For those ethnic groups that partially acknowledge Chinese culture, we can preserve their unique cultures while reinforcing their recognition of Chinese culture. Although some ethnic minorities may find this challenging, it is the work we must undertake."
approver_is_sage: "Enter Huaxia"
disapprover_is_barbarian: "Emerge as barbarians"
national_autonomy_will_begin: "We must uphold the banner of ethnic equality, unity, and autonomy, allowing the vast ethnic minorities to truly become masters of the country alongside the Han."
national_autonomy: "Ethnic Autonomy"
ethnic_minority: "Ethnic Minority Policy"
nation_expects_liberation: "The fate of ethnic minorities has fundamentally changed. They no longer need to speak with a sense of inferiority, be representative of insulting terms, or endure a difficult life. Under the principles of ethnic policies, ethnic minority groups have finally gained liberation and freedom."

je_culture_and_nationality_2: "Unified under Chinese Culture"
je_culture_and_nationality_2_goal: "To achieve a favorable outcome, the goal is to complete the conditions within 20 years."
je_culture_and_nationality_2_reason: "The majority of ethnic minority compatriots are ordinary people who aspire to live a modern life and integrate into Chinese civilization rather than being seen as barbarians. If we want others to recognize our culture and achieve cultural unity, we must involve ethnic minorities in national construction."

culture_and_nationality.2.t: "All are Children of Huaxia"
culture_and_nationality.2.d: "Through our unremitting efforts, we have finally moved away from the term 'ethnicity' based on bloodline. Those who identify with 'Chinese culture' are now one family. This is a great victory for socialist revolution."
culture_and_nationality.2.f: "When dealing with ethnic minorities, we can encourage acceptance, involve them in socialist construction, or allow them to maintain their distinct ethnic identity and grant them autonomy, even if they choose not to fully embrace Chinese culture. The latter is a Western-style value system based on bloodline and region, lacking the grandeur of a 5,000-year-old culture. We conducted a great cultural identity movement, and history has shown that we made the right choice. This is the victory of Chinese culture."
culture_and_nationality.2.a: "Henceforth, there is no longer any distinction among the Chinese; we are all children of Huaxia."
complete_national_reunification: "No distinction of gender, age, or region. As long as you identify with Chinese culture, we are all good children of Chinese culture."

culture_and_nationality.3.t: "Opposition to Ethnic Separation"
culture_and_nationality.3.d: "Over time, some ethnic minorities have secretly joined forces to form a covert organization, preparing to establish their own independence. This is a clear act of dividing the nation."
culture_and_nationality.3.f: "Ethnic minority areas have been unstable, and the central policies have been slow to implement. The delayed implementation can breed dissent and even lead to the formation of a large organization, claiming to 'oppose authoritarian rule and seek ethnic autonomy,' intending to break away from central control and establish independence. However, due to the centralized control of the military, they lack their own army, making it easy to deal with them by establishing special groups. For Kang Sheng, a seasoned operative from the central special forces, this is like handing him a piece of cake. We just need to hope that not too many people join this organization."
culture_and_nationality.3.a: "We must dig deep, dig extensively, and dig specifically to eliminate the poison of dividing the nation."
oppose_ethnic_division: "Rest assured, Kang Sheng will handle the situation."

je_culture_and_nationality_3: "Dissemination of Chinese Culture"
je_culture_and_nationality_4: "Dissemination of Chinese Culture"
je_culture_and_nationality_3_reason: "At this point, China has departed from Western ethnic narratives in the cultural system, establishing its own narrative theory system and strengthening the theoretical foundation of the New Democratic Revolution. Consequently, more people struggling to find a way forward for their own nations have become interested in China's cultural narrative theory."
je_culture_and_nationality_4_reason: "At this point, China has departed from Western ethnic narratives in the cultural system, establishing its own narrative theory system and strengthening the theoretical foundation of the New Democratic Revolution. Consequently, more people struggling to find a way forward for their own nations have become interested in China's cultural narrative theory."
spread_chinese_culture: "Whenever China acquires new territory, it becomes part of Chinese culture, and the local population gradually assimilates into Chinese culture."


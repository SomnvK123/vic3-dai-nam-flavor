je_the_islands:0 "Reclaim the Malvinas Islands"
je_the_islands_reason:0 "In 1833, the shameless British seized the Malvinas Islands. Despite the undeniable power of the British war machine, we must drive these pirates out of the islands."
je_the_wayward_province:0 "Wayward Province"
je_the_wayward_province_reason:0 "Since José Artigas refused to bow to Buenos Aires at the start of our revolution, Uruguay's fate has been controlled by foreign powers. First the Brazilians, who shamelessly invaded the region while our army was aiding Chile and Peru in their independence. Then the European powers, who forced the Uruguayan people to compromise and recognize Uruguay's independence in 1828, despite their desire to unite with the United Provinces. The will of the Argentinians is the strongest force, through which we will reunite with our brothers."
je_what_belgrano_could_not:0 "Unfinished Business"
je_what_belgrano_could_not_reason:0 "During the May Revolution, General Manuel Belgrano led an army north to fight the Spanish Royalists. Although the military campaign ended in failure, Paraguay soon broke free from the Spanish yoke. The Paraguayan revolution succeeded but did not join their Argentinian brothers in the south, instead being hijacked by the madman José de Francia y Velasco. This mad tyrant aimed to build a utopian society but ended up establishing a dictatorship led by himself. We must restore order in Paraguay and complete Belgrano's unfinished business."
je_the_tarija_question:0 "The Tarija Question"
je_the_tarija_question_reason:0 "Tarija is rightfully Argentinian territory, occupied by the Bolivians who burned our homes. Our will must be imposed on the region."
uruguay_province:0 "Return of Uruguay Province"
paraguay_province:0 "Control of Paraguay"
tarija_question_settled:0 "The Tarija Question Settled"
islands_reclaimed:0 "Reclaim the Malvinas Islands"
sun_need_friends:0 "Invite Politicians and Officers Who Believe in the Three Principles of the People"
sun_need_friends_desc:0 "If the government is filled with feudal conservative ideas, our reforms will be difficult to implement."


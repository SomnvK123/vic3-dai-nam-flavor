je_jap_empire_tt: "The Imperial Parliament is being prepared"

ideology_chinaempire_desc:0 "#lore This ideology advocates a policy of Great Chinese Chauvinism, believing in authoritarian rule and the need for China's map to encompass all territories once conquered by previous dynasties.#!"
own_all_china_homelands:0 "From the White Sea Strait in the east to the Caspian Sea in the west, all belong to the territory of China."
china_borders.1.t:0 "China's Territorial Limits"
china_borders.1:0 "China's Territorial Limits"
china_borders.1.d:0 "I want to know how vast China is."
china_borders.1.f:0 "Depending on who asks me, I have many answers. The territory of China is immeasurable, extending wherever the sun and moon shine, and rivers flow. "
china_borders.1.a:0 "Riding horses across the vast sea, keeping wolves at bay. Establishing territories west of the great river, creating districts beyond the Qilian Mountains!"
china_borders.1.c:0 "Let me think about it!"
china_borders.2:0 "Without the birth of China, the world is forever in darkness"
china_borders.2.t:0 "Without the birth of China, the world is forever in darkness"
china_borders.2.d:0 "Our generation has created miracles of our own. Henceforth, our borders stretch from the White Sea Strait in the east to the Caspian Sea in the west, unchanging for eternity."
china_borders.2.f:0 "A thousand troops, one general, is that difficult to conquer? "
china_borders.2.a:0 "Hail to China, blessed by heaven to rule the world for eternity!!"
china_borders_pursuit:0 "Yet, I prefer conquest."
china_borders.2.b:0 "There are other things to be done."
no_china_borders:0 "Hesitation"
modifier_china:0 "Ultimate Territory"
modifier_china_winner:0 "King of Kings"


china_borders.3.t:0 "The Lord of Asia"
china_borders.3.d:0 "The small countries have traditionally regarded me as their suzerain. Now, under the oppression and invasion of Western powers, they are gradually breaking free from control. And now, they have returned to the embrace of [SCOPE.GetRootScope.GetCountry.GetName].We have successfully resolved the border crisis. Having successfully gained leadership in Asia, the empire can now focus on deeper affairs."
china_borders.3.f:0 "I, the Great Emperor of China, am now proclaimed as the King of Kings."
china_borders.3.a:0 "Since ancient times, China has esteemed itself and looked down upon the barbarians. All of them are beloved by me—Emperor Li Shimin."
china_borders.9.t:0 "Ryukyu Chooses to Maintain the Status Quo"

china_borders.9.d:0 "The ancient kingdom of Ryukyu, situated on the edge of the sea, has long cherished its independence and is unwilling to submit to any foreign rule. The great nation of Cathay, a land of etiquette and civilization, values harmony above all and never uses force to coerce others. Having learned of Ryukyu's intention, the imperial court of Cathay expresses deep understanding and applauds its decision to maintain the status quo, refraining from any coercive pressure."

china_borders.9.f:0 "The principle of intercourse between nations lies in treating each other with sincerity, mutual respect and trust. Since Ryukyu is unwilling to submit to Cathay, Cathay shall not compel them. Let us prioritize peaceful coexistence, each abiding by order and living in peace. May Ryukyu and Cathay jointly pursue development, share prosperity, and advance hand in hand to create a brighter future.\n\nMoreover, Cathay is a great nation with splendid culture and a long history. Let us carry forward our culture, pass on civilization, and share the beauty of [concept_dsk_china] culture with the people of Ryukyu, building a bridge of friendship together. May the peoples of both nations maintain friendship for generations, united as one heart, and share the blessings of peace."

china_borders.9.a:0 "This is our wish, and the will of Heaven and Earth"
modifier_newqing:0 "Lord of Japan"
china_borders.5.t:0 "Three Principles of the People"
china_borders.5.t:0 "Three Principles of the People"
china_borders.5.d:0 "The Three Principles of the People illuminate China."
china_borders.5.f:0 "Nationalism: Oppose national oppression, oppose the autocratic rule of Manchu aristocracy over China. Democracy: Overthrow the monarchic autocracy and establish a bourgeois democratic republic, with equal rights for all citizens. Livelihood: Solve the problem of wealth redistribution centered around land, and ensure equal land rights for all."
china_borders.5.a:0 "The revolution is not yet successful; comrades still need to strive."
sanminzhuyi_modifier:0 "Three Principles of the People"

diguozhuyi:0 "Imperialist thoughts spread within the military"
diguozhuyi_desc:0 "As a vast and populous country, [SCOPE.GetRootScope.GetCountry.GetName] may follow in the footsteps of Western powers to conquer more land."
chinese_culture:0 "Chinese Nation"
meiyourenbeiqishi:0 "No one is discriminated against on the Chinese land."
ideology_sanminzhuyi1:0 "Three Principles of the People"
ideology_sanminzhuyi1_desc:0 "#lore The Three Principles of the People, the doctrine of our party, aim to establish the Republic and progress towards a great community. We, the learned elites, serve as the vanguard of the people; tirelessly day and night, adhering to our beliefs. We vow to be diligent and brave, always faithful and loyal; with unity of purpose and heart, consistently through and through.#!"


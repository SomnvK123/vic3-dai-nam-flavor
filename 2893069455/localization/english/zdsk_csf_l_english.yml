line_struggle_1_events.2.t:0 "Completion of the First Round of Leftist Route Struggle"
line_struggle_1_events.2.d:0 "Completion of the First Round of Leftist Route Struggle"
line_struggle_1_events.2.f:0 "The question of how the proletariat will revolutionize has been terminated by the victorious proletarian revolution. The next issue is the construction of socialism. If anarchism or social democracy is not chosen, the corresponding ideologies will not appear."
line_struggle_1_events.2.a:0 "This is the victory of the communist revolution!"
line_struggle_1_events.2.b:0 "The bourgeois state has peacefully transitioned to the proletarian state!"
line_struggle_1_events.2.c:0 "No state! No oppression! Anarchy prevails!"

clever_dsk.185.b.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName] will show sadness publicly"
clever_dsk.185.c.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName] will display national pride publicly"
clever_dsk.185.e.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName] will contemplate publicly"
clever_dsk.185.g.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName] will act soldierly publicly"
clever_dsk.185.h.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName] will display anger publicly"
clever_dsk.185.i.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName] will appear ill publicly"
clever_dsk.185.j.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName] will present as a worker publicly"
clever_dsk.185.k.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName] will present as a clerk publicly"
clever_dsk.185.l.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName] will show determination publicly"

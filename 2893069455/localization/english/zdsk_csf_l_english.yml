je_rus_relationship: "Sino-Russian Relations"
je_rus_relationship_reason: "[SCOPE.sCountry('rus_scope').GetName] was originally a traditional European country, emerging as Kyiv in the 9th century. By the mid-13th century, it was occupied and ruled by [SCOPE.sCulture('mongol_culture').GetName], but starting in the 14th century, the #yellow Principality of Moscow#! began forming around Moscow, expanding extensively in all directions. After large-scale eastward expansions, it finally encountered [SCOPE.sCountry('chi_scope').GetName] in the mid-17th century, establishing a border and initiating relations.\n\n“All disputes between border residents of the two nations are to be abandoned, with no retaliations allowed. Once peace is established, if hunters or others from either side cross the border to plunder or kill privately, they are to be apprehended and strictly punished by the respective border authorities.” —#v Treaty of Nerchinsk#!"

mofashaonv_huanqiulvxing: "World Expedition"

gmg_world_tour.1.t: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName] Sets Off Once More"
gmg_world_tour.1.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName] departs their homeland once again to embark on a global journey bound for #v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!. They shall observe the realm's ruler, customs and governance, bringing their discoveries back home upon their return."
gmg_world_tour.1.a: "May their journey be safe and smooth."

gmg_world_tour.10.t: "Fresh Findings From Abroad"
gmg_world_tour.10.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName] has sent back new observations from #v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!. Exotic marketplaces, rituals and folk culture astound the explorer. How ought we make use of these discoveries?"
gmg_world_tour.10.a: "Treat these as inspiration to broaden our horizons."
gmg_world_tour.10.b: "Elevate our envoy's reputation across the world."

gmg_world_tour.20.t: "Observations on Foreign Governance"
gmg_world_tour.20.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName] continues their travels within #v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!. Beyond local customs, they examine regional administration, public order and civil affairs; these insights may aid our domestic governance reforms."
gmg_world_tour.20.a: "Absorb their administrative expertise."
gmg_world_tour.20.b: "Publicize their travels and renown."

gmg_world_tour.101.t: "Homecoming From A Great Power"
gmg_world_tour.101.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName] returns from #v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!. The nation's industry, diplomacy and court ceremony leave a profound impression; alongside anecdotes, they bring deep understanding of how major powers operate."
gmg_world_tour.101.a: "Apply these lessons to national development."

gmg_world_tour.102.t: "Return From A Major Regional Power"
gmg_world_tour.102.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName] returns from #v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!. Though not a top-tier great power, its institutions and international experience bear valuable reference; their notes and tales translate into tangible national gains."
gmg_world_tour.102.a: "This journey has not been made in vain."

gmg_world_tour.103.t: "Home From A Regional Lesser Power"
gmg_world_tour.103.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName] returns from #v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!. The explorer learns every nation boasts unique social structures, folkways and lifestyles regardless of global standing."
gmg_world_tour.103.a: "Wisdom exists beyond great power borders."

gmg_world_tour.104.t: "Return From A Distant Small Realm"
gmg_world_tour.104.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName] returns from #v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!. Remote lands are not always mighty, yet distinct lifestyles, frontier know-how and local vitality grant meaningful insight for our realm."
gmg_world_tour.104.a: "The world stretches far wider than any map."

gmg_world_tour.1.t: "The Explorer Embarks On A Long Voyage"
gmg_world_tour.1.d: "The Explorer has departed for [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]. Attendants log their route, discoveries and correspondence sent home. Palaces, harbors, wastelands and battlefields alike from abroad will become popular talking points domestically."
gmg_world_tour.1.a: "Wish them a safe journey."

gmg_world_tour.10.t: "Curiosity Stirred By Overseas Lands"
gmg_world_tour.10.d: "The Explorer sends journals back from [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], documenting local markets, attire, cuisine, folk tales alongside roads, bridges and settlements. These fragmented accounts let common folk vividly picture distant foreign lands for the first time."
gmg_world_tour.10.a: "Compile into a bound travel memoir."
gmg_world_tour.10.b: "Publish widely across newspapers."

gmg_world_tour.20.t: "Foreign Institutions and Governance"
gmg_world_tour.20.d: "As the journey proceeds, the Explorer studies government offices, policing, taxation, schooling and local administration within [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]. Their letters remark: a nation’s true character lives not only in palaces and flags, but in ledgers, official stamps and clerks’ desk drawers."
gmg_world_tour.20.a: "Research their governing methodologies."
gmg_world_tour.20.b: "Use these findings for domestic propaganda."

gmg_world_tour.30.t: "New Dispatches From The Voyage"
gmg_world_tour.30.d: "Fresh memoirs arrive home from the Explorer, filled with exotic sights, folk customs and unexpected adventures across their destination nation."
gmg_world_tour.30.a: "Read their latest discoveries."

gmg_world_tour.31.t: "Skyscrapers Piercing The Clouds"
gmg_world_tour.31.d: "In [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], the Explorer beholds towering skyscrapers built from steel and glass with elevators lifting civilization skyward; bustling crowds fill city streets like flowing rivers. Their letter muses: if all future cities develop thus, mankind may soon outgrow terrestrial ground."
gmg_world_tour.31.a: "This defines the modern urban age."

gmg_world_tour.32.t: "Pyramids Amid Desert Sands"
gmg_world_tour.32.d: "On the desert fringes of [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], the Explorer stands beneath the shadow of ancient pyramids. Staring up at millennia-old stonework, they grasp how human ambition, faith and labor are sealed within the burning desert sands."
gmg_world_tour.32.a: "Ancient engineering commands immense respect."

gmg_world_tour.33.t: "Crimson Shrine Torii Gates"
gmg_world_tour.33.d: "The Explorer wanders through successive vermilion torii gates across [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]. Locals explain these gates mark the divide between mortal and sacred realms; jotting sketches in their notebook, the explorer notes: some gateways bar no path, only remind travellers of boundaries."
gmg_world_tour.33.a: "Foreign faith holds solemn dignity."

gmg_world_tour.34.t: "Great White Beasts of The Northern Wilds"
gmg_world_tour.34.d: "In the frigid northern reaches of [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], hunters recount legends of great white arctic beasts. Later the explorer spots a polar bear drifting across frozen wastes, finally understanding why northern folklore frames these lands as vast yet perilous."
gmg_world_tour.34.a: "Document this encounter within travel logs."

gmg_world_tour.35.t: "Dining Without Utensils"
gmg_world_tour.35.d: "The Explorer is invited to a local feast in [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], where hosts eat by hand following age-old ritual purity and household tradition. Initially surprised, they soon learn dining customs bear no inherent hierarchy, merely divergent ways of life."
gmg_world_tour.35.a: "Respect indigenous dining customs."
gmg_world_tour.35.b: "They even master several regional recipes."

gmg_world_tour.36.t: "Wisdom Held Within Two Chopsticks"
gmg_world_tour.36.d: "For the first time in [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], the Explorer attempts to master chopsticks. Picking rice, fish and vegetables with paired sticks demands unexpected patience; they complain of dropping tofu thrice in correspondence yet proudly declare basic proficiency by journey’s end."
gmg_world_tour.36.a: "Simple tableware bears echoes of distinct civilisation."

gmg_world_tour.37.t: "Locusts Upon The Dinner Table"
gmg_world_tour.37.d: "At market stalls in [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], roasted locust is sold as staple fare. Natives explain pest harvesting curbs farm damage during famines while supplementing food stocks. Hesitant to taste at first, the explorer concedes the insect is far tastier than appearance suggests."
gmg_world_tour.37.a: "Unconventional yet practical sustenance."
gmg_world_tour.37.b: "Study their local agricultural practices."

gmg_world_tour.38.t: "Malaria Plagues In Humid Villages"
gmg_world_tour.38.d: "Arriving at muggy rural hamlets of [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], the explorer witnesses widespread malaria alongside feverish sufferers and dedicated local healers and missionaries tending the sick. Their notes conclude roads, drainage, medicine and sanitation may save more lives than battlefield victories."
gmg_world_tour.38.a: "Record these medical observations."
gmg_world_tour.38.b: "Deliver humanitarian aid to earn prestige."

gmg_world_tour.39.t: "Eerie Tales From Southern Wilderness"
gmg_world_tour.39.d: "While travelling southern [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], caravan merchants spin grim wilderness legends; some dismiss tales as novice-scaring fiction, others swear travellers have vanished without trace. The explorer chooses cautious progress over blind credulity or reckless risk."
gmg_world_tour.39.a: "Proceed with prudent caution."
gmg_world_tour.39.b: "Smooth tensions with diplomatic courtesy."

gmg_world_tour.40.t: "Court Etiquette For Royal Audiences"
gmg_world_tour.40.d: "Within the royal court of [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], strict protocols govern bowing, salutation and speech when meeting the monarch. Though cumbersome, the explorer recognises these rituals cement sovereign authority."
gmg_world_tour.40.a: "Abide by local customs abroad."
gmg_world_tour.40.b: "They narrowly avoid a humiliating etiquette blunder."

gmg_world_tour.41.t: "A Land Free From Prostration"
gmg_world_tour.41.d: "In [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], the explorer marvels as citizens greet national leaders with handshakes instead of mandatory kneeling; locals proudly claim commoners are no royal subjects. Rereading these words repeatedly, they discern a unique power separate from crown authority."
gmg_world_tour.41.a: "Ideals of civic equality warrant deep reflection."

gmg_world_tour.42.t: "Military Observations In Wartime Lands"
gmg_world_tour.42.d: "[SCOPE.sCountry('gmg_last_tour_country_scope').GetName] is engulfed in warfare upon the explorer’s arrival; they spot troop movements, artillery emplacements, field hospitals and military rail networks. Retinue compile detailed notes on modern tactics and weaponry to prompt domestic military reform."
gmg_world_tour.42.a: "Submit field reports to military high command."
gmg_world_tour.42.b: "Publish frontline accounts to rally domestic public opinion."

gmg_world_tour.43.t: "Coal Smoke And Factory Chimneys"
gmg_world_tour.43.d: "The explorer visits an industrial hub in [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], where endless smokestacks coat rooftops in soot and labourers stream into factories for dawn-to-dusk machinery shifts. Awestruck by industrial might yet troubled by harsh working conditions."
gmg_world_tour.43.a: "Document both industrial prosperity and its human cost."

gmg_world_tour.44.t: "Harbors Brimming With Global Wares"
gmg_world_tour.44.d: "Docks of [SCOPE.sCountry('gmg_last_tour_country_scope').GetName] overflow with global cargo: tea, cotton, machinery, spices, coal and firearms. A cacophony of dialects fills the waterfront, proving merchant vessels and ledgers bind all corners of the globe together."
gmg_world_tour.44.a: "Global trade shrinks the distant world."

gmg_world_tour.45.t: "Scenery Beyond The Railway Tracks"
gmg_world_tour.45.d: "Riding trains across rural [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], farmland, factories, villages and rivers rush past carriage windows. The explorer realises railways transform not only transit speed but state land governance, troop deployment and market organisation."
gmg_world_tour.45.a: "Railways form the nation’s vital arteries."

gmg_world_tour.101.t: "Explorer Returns From A Great Power"
gmg_world_tour.101.d: "The Explorer concludes their travels across [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]. Its grand cities, formidable armies, sprawling industry and regal diplomacy leave lasting impressions; their findings turn domestic focus toward global great power politics."
gmg_world_tour.101.a: "We must thoroughly study dominant world powers."

gmg_world_tour.102.t: "Explorer Comes Home From A Strong Regional State"
gmg_world_tour.102.d: "After touring [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], the explorer returns home. Though not a global hegemon, its functional institutions, industry and civic life provide ample reference material for domestic reformist and conservative factions alike."
gmg_world_tour.102.a: "Lessons abound across foreign shores."

gmg_world_tour.103.t: "Homecoming From A Small Sovereign State"
gmg_world_tour.103.d: "The Explorer finishes visiting [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]. While militarily modest, the realm holds distinct survival wisdom, folk tradition and unique landscapes; their testimony reminds the homeland the globe consists of more than dominant empires."
gmg_world_tour.103.a: "Small nations hold worthy tales to preserve."

gmg_world_tour.104.t: "Return From Distant Foreign Shores"
gmg_world_tour.104.d: "Coming back from [SCOPE.sCountry('gmg_last_tour_country_scope').GetName], the explorer brings scattered yet enchanting anecdotes of native livelihood, labor, faith and commerce; to most domestic citizens these far-off tales read like fairy tales."
gmg_world_tour.104.a: "Preserve these stories within official travel archives."


sino_event.172.t:0 "Austro-Prussian War Erupts"
sino_event.172.d:0 "The war against Austria represents a crucial step for [SCOPE.sCountry('pru_scope').GetName] to lead [concept_germany] unification"
sino_event.172.f:0 "[SCOPE.sCountry('pru_scope').GetName] mobilized 630,000 troops compared to [SCOPE.sCountry('aus_scope').GetName]'s 580,000. However, Austria held interior lines with superior cavalry and artillery mobility advantages."

sino_event.173.t:0 "[SCOPE.sCharacter('Aowu_scope').GetFullName] Memorializes [SCOPE.sCharacter('Buhuashu_scope').GetFullName] Event"
sino_event.173.d:0 "It is with profound sorrow that we announce: [SCOPE.sCharacter('Buhuashu_scope').GetFullName] (pseudonym), who was hospitalized due to gastrointestinal hemorrhage and acute appendiceal perforation, ultimately passed away at #v 20:00 on April 28, 2025#! due to aggravated arrhythmia stemming from congenital heart disease and complications, at the age of #v 20#!. [SCOPE.sCharacter('Buhuashu_scope').GetFullName] was a cherished member of the RA group, known for his开朗, 热情, and 乐于助人 nature. His sudden departure leaves us in profound grief, as echoes of his laughter in group chats have now become cherished memories. We wonder - as a nihilist, would he have believed in an afterlife?"
sino_event.173.f:0 "Leave a lamp lit\n\nTo illuminate the night\n\nTo guide her home\n\nCan you see it\n\nCan you hear it\n\nStay, let me sketch your face\n\nHow beautiful the moonlight tonight\n\nRestless hearts tangled in sorrow\n\nI'll send her light through the brightest star"
sino_event.173.a:0 "「Buhuashu, nihilist, intellectual, agitator, please let her live longer」——[SCOPE.sCharacter('Buhuashu_scope').GetFullName] 2025.3.20\n「Damn devs better put me with Buhuashu, I'll keep him company in-game」——[SCOPE.sCharacter('Aowu_scope').GetFullName] 2025.4.29"


sino_event.174.t:0 "Memorializes #yellow Buhuashu#! Event"
sino_event.174.d:0 "It is with profound sorrow that we announce: #yellow Buhuashu#! (pseudonym), who was hospitalized due to gastrointestinal hemorrhage and acute appendiceal perforation, ultimately passed away at #v 20:00 on April 28, 2025#! due to aggravated arrhythmia stemming from congenital heart disease and complications, at the age of #v 20#!. #yellow Buhuashu#! was a cherished member of the RA group, known for his开朗, 热情, and 乐于助人 nature. His sudden departure leaves us in profound grief, as echoes of his laughter in group chats have now become cherished memories. We wonder - as a nihilist, would he have believed in an afterlife?"
sino_event.174.f:0 "Leave a lamp lit\n\nTo illuminate the night\n\nTo guide her home\n\nCan you see it\n\nCan you hear it\n\nStay, let me sketch your face\n\nHow beautiful the moonlight tonight\n\nRestless hearts tangled in sorrow\n\nI'll send her light through the brightest star"
sino_event.174.a:0 "「Buhuashu, nihilist, intellectual, agitator, please let her live longer」——#yellow Buhuashu#! 2025.3.20\n「Damn devs better put me with Buhuashu, I'll keep him company in-game」——#yellow Aowu#! 2025.4.29"

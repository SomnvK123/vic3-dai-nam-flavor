sino_event.264.t: "Appoint [SCOPE.sCharacter('change_your_animations_now_character').GetFullName] as Official Explorer"
sino_event.264.d: "In this prosperous and enlightened age, much of the world remains uncharted and countless secrets linger across remote frontiers. We find [SCOPE.sCharacter('change_your_animations_now_character').GetFirstName] bold and resolute, filled with wanderlust, knowledgeable in geography and perceptive of foreign customs. Therefore, we formally grant the title of Explorer, tasking this individual to journey to far-off wildernesses, explore uncharted lands, document alien traditions, trace rare curiosities, and broaden our nation’s global perspective."
sino_event.264.f: "\"Why do you climb the mountain?\"\n\n\"Because it is there.\" — George Mallory"
sino_event.264.a: "Good fortune on your journeys."
sino_event.264.b: "We have other arrangements instead."


je_dsk_jap_kamikaze: "[SCOPE.GetRootScope.GetCountry.GetName] National Policy"
je_dsk_jap_kamikaze_reason: "#v This is our national policy tree, which effectively shows the current state and progress of [concept_country]#!\n\n#v As preceding national policies are completed, new ones will emerge#!\n\nThough Japan is located on the eastern edge of Asia, its people have shed the vestiges of Asian barbarism and embraced Western civilization. Unfortunately, the neighboring countries, China and Korea, remain entrenched in Asian political and educational customs. While Japan and these two countries share similarities, there are differences due to ethnic origins. China and Korea, in contrast to Japan, remain ignorant of national improvements. They have some knowledge of modern civilization but are indifferent to it, clinging to outdated customs. This creates diplomatic obstacles for Japan, as Westerners may view Japan similarly to China and Korea. For instance, Westerners might see Japan as a lawless country if China and Korea are still under ancient autocracies. Furthermore, Japan is sometimes judged based on the perceived backwardness of its neighbors. Therefore, Japan’s strategy is to align with Western civilization and not to be overly polite with its neighbors. Engaging with bad company only brings bad reputation; thus, Japan must reject Asian 'bad friends'—Fukuzawa Yukichi."

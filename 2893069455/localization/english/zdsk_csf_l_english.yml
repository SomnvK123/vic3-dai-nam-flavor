# Basic Resolutions
Decision_Start_Road:0 "Embark on the Road to Communism"
Decision_Start_Road_desc:0 "To achieve communism in the era of Victoria 3, there must be technological progress and industrialization beyond historical levels. Use this decision to gain buffs for rapid research and industrialization, preparing for the challenging road to communism."
lzy_buff_RD_speed_up:0 "Embark on the Road to Communism"
Decision_Alliance_workers_peasants:0 "Form Workers' and Peasants' Alliance"
Decision_Alliance_workers_peasants:0 "Form Workers' and Peasants' Alliance"
Decision_Alliance_workers_peasants_desc:0 "Peasant brothers have suffered enough from the oppression of landlords and capitalists. We should form a Workers' and Peasants' Alliance, promote Marxist ideology, surround the cities from the countryside, and seize political power!"
loc_Decision_Alliance_workers_peasants_Ended:0 "Adopted the resolution 'Form Workers' and Peasants' Alliance'"
Decision_Red_Army:0 "Establish the Red Army"
Decision_Red_Army_desc:0 "To achieve the proletarian revolution, we must grasp the gun in our own hands."
loc_Decision_Red_Army_Ended:0 "Adopted the resolution 'Establish the Red Army'"
Decision_Marxism_scholar:0 "Unite Left-wing Intellectuals"
Decision_Marxism_scholar_desc:0 "Among intellectuals, there are many left-wing scholars sympathetic to the plight of workers. We should unite intellectuals and make them our allies."
ig_Marxism_scholar:0 "Left-wing Intellectual"
loc_Decision_Marxism_scholar_Ended:0 "Adopted the resolution 'Unite Left-wing Intellectuals'"
red_army_events.1.t:0 "The Red Army is Established!"
red_army_events.1.d:0 "We have formed the Workers' and Peasants' Red Army, composed of the people themselves."
red_army_events.1.f:0 "Our country's army has been transformed into the People's Red Army. However, there is still some controversy over the specific organizational form of the army."
event_red_army.1.a:0 "Maintain a standing army to resist foreign invasion."
event_red_army.1.b:0 "Soldiers' committees and commune militias will help us solve military problems."
event_red_army.1.c:0 "Massively expand the army; long live world revolution!"
lzy_buff_red_army:0 "Red Army"
Decision_cultural_revolution:0 "Launch the Cultural Revolution Movement"
Decision_cultural_revolution_desc:0 "Revisionism has seriously endangered proletarian dictatorship. It is necessary to mobilize the masses for self-emancipation to achieve ultimate liberation."
allow_cultural_revolution_tt:0 "Complete the diary entry on the birth of revisionism and its settlement events."
Decision_consumption_tax:0 "Tax Exemption Policy"
Decision_consumption_tax_desc:0 "To achieve common prosperity for the people, we can temporarily exempt taxes to improve people's living standards."
Decision_anti_illiteracy:0 "Literacy Campaign"
Decision_anti_illiteracy_desc:0 "Launch a literacy campaign to ensure the basic education of the people."
lzy_buff_anti_illiteracy:0 "Literacy Campaign"
Decision_mountain_countryside:0 "Send Intellectuals to the Mountains and Countryside"
Decision_mountain_countryside_desc:0 "Mobilize intellectuals to go to the mountains and countryside, significantly increase the number of high school students. The cost is a slight reduction in innovation."
lzy_buff_mountain_countryside:0 "Send Intellectuals to the Mountains and Countryside"
Decision_university_expand:0 "Expand University Enrollment"
Decision_university_expand_desc:0 "Allow universities to expand enrollment so that the majority can receive higher education."
lzy_buff_university_expand:0 "Expand University Enrollment"
custom_add_literacy_rate:0 "Increase literacy rate by 15%"
Decision_jump_time:0 "Skip Waiting Time"
Decision_jump_time_desc:0 "Since we have already completed the road to common prosperity and achieved a fully modern socialist society, we can save time and quickly carry out the mass movement storm of the people."
loc_fbar_modern_end:0 "Complete the diary entry and settlement event for the construction of a fully modern socialist society."
loc_jump_time:0 "Add 1 year progress to the current diary, can be used repeatedly."
law_mass_democracy:0 "Mass Democratic System"
law_civilsociety:0 "Communist Society"
law_communal_principle:0 "Worker's Democratic Plan"

cultural_revolution:0 "Cultural Revolution"
realization_communism:0 "Realize Communism"
Decision_socialism_revolution:0 "Outbreak of Socialist Revolution"
Decision_socialism_revolution_desc:0 "We are irreconcilably at odds with the reactionary forces, and the socialist system is imperative."
socialist_revolution_events.1.t:0 "Outbreak of Socialist Revolution"
socialist_revolution_events.1.desc:0 "In our country, the revolutionary civil war has erupted, and the politically increasingly powerful labor masses have clearly expressed their attitude: establish socialism!"
socialist_revolution_events.1.f:0 "In places where there are no democratic elections and in the army, all political power should be completely transferred to local committees and the commissioners elected by them, or to other bodies that must be elected. With the full support of the state, workers and revolutionary armies, that is, armies that have been proven to be able to suppress counter-revolutionaries, should be armed unconditionally and universally."
socialist_revolution_events.1.a:0 "The Socialist Republic is established today!"
Decision_socialism_institution:0 "Establish Socialist System"
Decision_socialism_institution_desc:0 "Regardless of the future path of socialism we choose, the basic rights of the people are always sacred and inviolable."
socialist_revolution_events.2.t:0 "Establishment of the Socialist System"
socialist_revolution_events.2.d:0 "Construction of the basic system of socialism"
socialist_revolution_events.2.f:0 "Eliminate religion, achieve national equality, build public undertakings of socialism, impose high progressive taxes on the powerful, and guarantee the rights and freedoms of the people."
socialist_revolution_events.2.a:0 "We are transforming the entire superstructure according to the people's requirements!"

Decision_three_great_remould:0 "Initiate the Three Great Remoulds"
Decision_three_great_remould_desc:0 "Feudal and capitalist private ownership systems are deeply rooted in our economy. We need a comprehensive socialist transformation to make use of the old productive forces. Economic-level socialist transformation will bring people's support, increasing people's loyalty every month. After the transformation is complete, you can choose the socialist economic system and gain throughput bonuses. If you already have a public ownership economy before triggering the decision, you can directly gain throughput bonuses."
Decision_three_great_remould2:0 "Perfect the Basic Socialist Economic System"
Decision_three_great_remould2_desc:0 "Socialist public ownership has been initially established in the industrial sector of our country. The choice of collectivized agriculture and the future path is in your hands. After the events triggered by the decision are completed, you can gain throughput bonuses."
je_three_great_remould:0 "Three Great Remoulds"
je_three_great_remould_reason:0 "Feudal and capitalist private ownership systems are deeply rooted in our economy. We need a comprehensive socialist transformation to make use of the old productive forces. Economic-level socialist transformation will bring people's support, increasing people's loyalty every month. After the transformation is complete, you can choose the socialist economic system and gain throughput bonuses. If you already have a public ownership economy before triggering the decision, you can directly gain throughput bonuses."
custom_loc_three_great_remould_goal:0 "Wait for three years for the completion of the Three Great Remoulds. Maintain the committee republic political system without revolution or division during this period."
economic_revolution.1.t:0 "Establishment of the Basic Socialist Economic System"
economic_revolution.1.desc:0 "The Three Great Remoulds have been successfully completed!"
economic_revolution.1.f:0 "The existing productive forces have undergone socialist transformation, and these means of production are now in our hands."
economic_revolution.1.a:0 "Average land distribution, household contracting, establishment of a government-guided market economy"
economic_revolution.1.d:0 "Establishment of a market economy system in both industry and agriculture"
economic_revolution.1.b:0 "Establishment of socialist ownership economy of worker cooperatives, market socialism balancing efficiency and fairness"
economic_revolution.1.c:0 "Socialism must eliminate commodities and markets; rapid industrialization depends on unified planning and management of the economy"
lzy_buff_three_remould_Modifier:0 "Socialist Transformation Completed"
economic_revolution.2.t:0 "Socialist Transformation"
economic_revolution.2.d:0 "The process of socialist transformation has received enthusiastic support from the masses."
economic_revolution.2.f:0 "The existing productive forces are undergoing socialist transformation, and the masses can benefit from it."
economic_revolution.2.c:0 "Loyalty has increased!"
je_basic_moderately_prosperous:0 "Basically Achieve a Moderately Prosperous Society"
je_basic_moderately_prosperous_reason:0 "The road to communism is also the road to common prosperity. From a moderately prosperous society to modernization of productivity, and then to a thorough surpassing of modernization. Make use of the advantages of the socialist system and develop productivity and production relations!\n After completing this series of log entries, you can gain throughput buffs. Whether you can complete this series of log entries in a timely manner involves the overall victory or defeat of the entire game."
economic_revolution.4.t:0 "Basically Achieve a Moderately Prosperous Society!"
economic_revolution.4.d:0 "We have basically achieved a moderately prosperous society!"
economic_revolution.4.f:0 "The dream of achieving a moderately prosperous society was nothing but a fantasy in the feudal era, but now it has become our reality!"
economic_revolution.4.a:0 "A phase victory of common prosperity!"
lzy_buff_basic_moderately_prosperous_Modifier:0 "Basically Achieve a Moderately Prosperous Society"

je_fbar_moderately_prosperous:0 "Comprehensively Build a Moderately Prosperous Society"
je_fbar_moderately_prosperous_reason:0 "The road to communism is also the road to common prosperity. From a moderately prosperous society to modernization of productivity, and then to a thorough surpassing of modernization. Make use of the advantages of the socialist system and develop productivity and production relations!\n After completing this series of log entries, you can gain throughput buffs. Whether you can complete this series of log entries in a timely manner involves the overall victory or defeat of the entire game."
economic_revolution.5.t:0 "Comprehensively Build a Moderately Prosperous Society!"
economic_revolution.5.d:0 "We have basically achieved a moderately prosperous society!"
economic_revolution.5.f:0 "After a difficult battle against poverty, [SCOPE.GetRootScope.GetCountry.GetName]'s poverty alleviation has written a miracle in the history of global poverty reduction and has become a model for countries around the world to achieve common prosperity."
economic_revolution.5.a:0 "A phase victory of common prosperity!"
lzy_buff_fbar_moderately_prosperous_Modifier:0 "Comprehensively Build a Moderately Prosperous Society"
je_socialism_mode_production:0 "Socialist Mode of Production"
je_socialism_mode_production_reason:0 "Marx explicitly pointed out in 'Capital' that there is a certain mode of production and corresponding production relations. The mode of production determines the entire production relations, exchange relations, and distribution relations. How to surpass the capitalist mode of production, achieve the socialist mode of production, and realize the collective free disposal of the means of production by laborers are major issues that need to be explored in theory and practice. Completing this log can provide a super-strong buff."
custom_loc_je_fbar_moderately_prosperous_end:0 "Complete the 'Comprehensively Build a Moderately Prosperous Society' log entry"
economic_revolution.8.t:0 "Establishment of the Socialist Mode of Production"
economic_revolution.8.d:0 "After arduous theoretical and practical exploration, the new socialist mode of production, which can eliminate capitalism, has finally been established!"
economic_revolution.8.f:0 "The difference between the socialist mode of production and the capitalist mode of production lies in the fact that the former is centered on capital owners, controlling the means of production and labor, controlling the entire production process and the distribution of products; while the latter is the laborers organizing the free disposal of the means of production without any capital conditions. Based on the socialist mode of production, new forms of socialist production relations and industrial organization can be firmly established. We have undergone continuous economic revolutions, and here we have finally achieved a stable new mode defined as a new stage of society."
economic_revolution.8.a:0 "This is the core of the social revolution!"
lzy_buff_socialism_mode_of_production:0 "Socialist Mode of Production"

je_basic_modernization:0 "Basically Achieve Socialist Modernization"
je_basic_modernization_reason:0 "The road to communism is also the road to common prosperity. From a moderately prosperous society to modernization of productivity, and then to a thorough surpassing of modernization. Make use of the advantages of the socialist system and develop productivity and production relations!\n After completing this series of log entries, you can gain throughput buffs. Whether you can complete this series of log entries in a timely manner involves the overall victory or defeat of the entire game."
economic_revolution.6.t:0 "Basically Achieve Socialist Modernization!"
economic_revolution.6.d:0 "We have basically achieved socialist modernization construction!"
economic_revolution.6.f:0 "The superiority of socialism lies first in the superiority of developing productive forces. Advanced productive methods and relations will inevitably bring about a revolution in productive forces themselves!"
economic_revolution.6.a:0 "Common prosperity is just around the corner!"
lzy_buff_basic_modernization_Modifier:0 "Basically Achieve Socialist Modernization"
je_fbar_modernization:0 "Comprehensively Build Socialist Modernization"
je_fbar_modernization_reason:0 "The road to communism is also the road to common prosperity. From a moderately prosperous society to modernization of productivity, and then to a thorough surpassing of modernization. Make use of the advantages of the socialist system and develop productivity and production relations!\n After completing this series of log entries, you can gain throughput buffs. Whether you can complete this series of log entries in a timely manner involves the overall victory or defeat of the entire game."
economic_revolution.7.t:0 "Comprehensively Build Socialist Modernization!"
economic_revolution.7.d:0 "We have completed the construction of socialist modernization!"
economic_revolution.7.f:0 "We have fully leveraged the superiority of the socialist system, and there has been a fundamental improvement in people's living standards. Advanced productive forces are about to bring advanced productive methods and relations, making the final sprint towards the great ideal of communism!"
economic_revolution.7.a:0 "Common prosperity has been achieved!"
lzy_buff_fbar_modernization_Modifier:0 "Comprehensively Build Socialist Modernization"
Decision_line_struggle_1:0 "Initiate the First Round of Leftist Route Struggle"
Decision_line_struggle_1_desc:0 "The question of the future direction of the proletariat, whether to achieve communism through proletarian dictatorship, reform through the bourgeois parliament, or immediately abolish the state and government, will inevitably lead to a major discussion. This discussion is not only beneficial for clarifying issues but also helps in the dissemination of socialist ideas. During this log, it is possible to attract industrialists, devout believers, intellectuals, and military leaders who are not monarchists or already have a socialist ideology to social democracy. It is also possible to attract rural masses, small citizens, and intellectual leaders to anarchism, and attract workers, peasants, soldiers, and students leaders to communism. Each type of attraction operation has its own independent cooldown time, with a cooldown time of 3 months. This discussion will last for at least five years and end with the precondition of the proletariat seizing power."
je_line_struggle_1:0 "First Round of Leftist Route Struggle"
je_line_struggle_1_reason:0 "The question of the future direction of the proletariat, whether to achieve communism through proletarian dictatorship, reform through the bourgeois parliament, or immediately abolish the state and government, will inevitably lead to a major discussion. This discussion is not only beneficial for clarifying issues but also helps in the dissemination of socialist ideas. During this log, as long as the relevant interest group leaders are not monarchists or already have a socialist ideology, it is possible to attract industrialists, devout believers, intellectuals, and military leaders to social democracy. It is also possible to attract rural masses, small citizens, and intellectual leaders to anarchism, and attract workers, peasants, soldiers, and students leaders to communism. Each type of attraction operation has its own independent cooldown time, with a cooldown time of 3 months. This discussion will last for at least five years and end with the precondition of the proletariat seizing power."
line_struggle_1_events.1.t:0 "Initiation of the First Round of Leftist Route Struggle"
line_struggle_1_events.1.d:0 "The future of the proletariat?"
line_struggle_1_events.1.f:0 "The future of the proletariat? Communists advocate the establishment of a proletarian dictatorship state, gradually transforming the economic foundation, superstructure, and ideology of the entire society, ultimately eliminating exploitation, achieving the disappearance of the state, and communism. Anarchists advocate the immediate abolition of the state and government, with labor unions formed by laborers for self-governance. Social democrats advocate parliamentary struggles in a bourgeois republic, gradually reforming the social system and improving workers' welfare."
line_struggle_1_events.1.a:0 "Support the Communists"
line_struggle_1_events.1.b:0 "Support the Social Democrats"
line_struggle_1_events.1.c:0 "Support the Anarchists"

 je_land_or_sea:0 "Westernization Movement"
 je_land_or_sea_reason:0 "China has inevitably been embroiled in disputes among major powers and has joined the world stage. Western countries that have experienced the Industrial Revolution are clearly ahead of us in terms of technology. If we cannot learn from foreign countries and use Chinese and Western methods to control them, China will become unsustainable on the world stage. However, due to limited civilian resources, China can only choose one development path. We can choose to become a land-based country with a large army, or build an invincible fleet that dominates the Pacific."

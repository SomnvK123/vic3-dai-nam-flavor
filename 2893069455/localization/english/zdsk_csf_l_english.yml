Je_Russo_Japanese_War: "Russo-Japanese Relations"
5_years: "Can only be done once every 5 years"
Je_Russo_Japanese_War_reason: "In 1739, a fleet from [SCOPE.sCountry('rus_scope').GetName] departed from the Kamchatka Peninsula, broke through the Kuril Islands, and landed in Sendai Domain, a territory directly controlled by [SCOPE.gsInterestGroup('shougun_ig').GetName]. This established a sea route between Siberia and Japan, marking the formal start of maritime relations between Russia and Japan.\nIn 1781, the Japanese scholar Kudo Heisuke wrote 'A Study of the Red Ezo,' which included descriptions and analyses of Russia. This provided important reference material for [SCOPE.gsInterestGroup('shougun_ig').GetName] to understand Russia.\nIn 1792, the Russian envoy Adam Laxman led a military detachment by ship to Nemuro in northeastern [SCOPE.sState('great_state_scope').GetName], Japan, under orders from Catherine II to seek trade relations with Japan. This was Russia's first official attempt to establish diplomatic relations with the Japanese shogunate.\nFaced with Russia's request to establish diplomatic relations, the ruling [SCOPE.gsInterestGroup('shougun_ig').GetName] led by Matsudaira Sadanobu adopted a policy of delay. While strengthening coastal defenses, they stalled the Russian mission. Eventually, Matsudaira Sadanobu refused Russia's trade request, citing Japan's strict restrictions on ships from countries with which it had no diplomatic relations.\n\nNow, [SCOPE.sCountry('rus_scope').GetName] has officially become our neighbor. They covet the territories of [SCOPE.sCountry('chi_scope').GetName], aiming to turn #N Manchuria#! and the #N Korean Peninsula#! into their backyard. If we engage in territorial disputes with them, they will launch a dangerous diplomatic struggle against us. We must be cautious!"
Je_Russo_Japanese_War_tt: "Currently, there is no conflict of interest with Russia"
Je_Russo_Japanese_War_1_tt: "We have taken Russia's core interest area! Unless we are ready for war with them"
Je_Russo_Japanese_War_2_tt: "The Russo-Japanese War has already broken out!"
jap_rus_war_break_out_tt: "We have won the Russo-Japanese War!"
jap_rus_war_break_out_button: "Initiate the Russo-Japanese War"

jap_rus_war_break_out_button_desc: "Russia has bullied us too much, and we must use force to drive them out of Manchuria and Korea.\n#red This will end this log and stop Russia from forcibly interfering in our affairs in Manchuria and Korea#!"
je_rus_japan_war: "Russo-Japanese War"
jap_rus_relationship_button: "Appease Russia"
jap_rus_relationship_button_desc: "As Russia is a powerful and threatening northern neighbor, we must improve relations with them to ensure they do not use force against us."
je_jap_xinan_war: "Samurai Problem"
je_jap_xinan_war_goal: "The progress bar has been filled"
je_jap_xinan_war_reason: "In the early Meiji period, although Japan established a government with [Concept('concept_ruler','$RULER_TITLE_MIKADO$')] as the highest power center, it had not yet completed the centralized system. The 274 domains, inherited from the old regime, still maintained independent military forces, finances, and control within their territories, and the Meiji government's control over the country was extremely weak.\n[concept_country] itself did not have direct armed forces and mainly relied on the Satsuma and Choshu domains’ armies. This reliance caused the government to be left without military support when facing conflicts of interest with the domains.\nThe Meiji government could only collect and allocate 30-40% of national resources, yet it had to bear all the expenses of the central government, making its payment capacity very fragile.\nDuring the anti-shogunate movement, the reformers advocated the principle of 'Revere the Emperor and Expel the Barbarians.' However, the Meiji government proposed an open-country policy of 'seeking knowledge from the world and greatly enhancing the imperial foundation,' which dissatisfied the expulsion faction. They considered the open-country policy a betrayal of the previous path and used assassination and other means to eliminate the open-country faction within the government. At the same time, the opening and foreign trade led to a shortage of precious metals and rising prices, reducing the living standards of the people, and spreading dissatisfaction with foreigners and the open-country policy throughout society.\n\nIf we cannot properly handle the #yellow Samurai Problem#!, their #v #tooltippable;tooltip:[Country.GetTooltipTag],je_xinan_pos conflicts#!#! with the government will deepen and eventually escalate into civil war!"
je_xinan_pos: "The following conditions will #bold increase#! the conflict:\n• Completing #yellow The End of the Samurai#! (#red +1#!).\n• Completing #yellow The Students of the Sword#! (#red +1#!).\n• #yellow Landowners#! who are not a fringe group and have support < -8 (#red +1#!)\n• #yellow The Military#! who are not a fringe group and have support < -8 (#red +2#!)\n• The following conditions will #bold mitigate#! the conflict:\nNationwide #yellow [Concept('concept_sol', '$SOL_SHORT_TEXT$')] >=15#!"
SMF: "Satsuma Domain"
SMF_ADJ: "Satsuma Domain"
je_rus_japan_war_reason: "Deep conflicts have arisen between [SCOPE.GetRootScope.GetCountry.GetName] and [SCOPE.sCountry('rus_scope').GetName] over control of Manchuria and the Korean Peninsula. After the Meiji Restoration, our national strength has grown, and we have actively pursued external aggression and expansion, viewing the Korean Peninsula and northeastern China as crucial components of our 'continental policy.' However, [SCOPE.sCountry('rus_scope').GetName] considers northeastern China to be within its sphere of influence in the Far East, aiming to solidify its position by controlling the region.\nThey will soon discover the true power of the [concept_jap_empire] military."



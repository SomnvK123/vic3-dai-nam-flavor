 clever_dsk.105.t: "End of World War I"
clever_dsk.105.d: "The World War I ended in 1918, with representatives of the victorious Allied powers gathering in Berlin to force the defeated Central Powers to sign the Treaty of Berlin."
clever_dsk.105.f: "According to the Treaty of Berlin, Russia was required to acknowledge the relinquishment of one million square kilometers of land in Eastern Europe, which would come under German jurisdiction. Britain and France were to cede large swathes of African territory to Germany and allow the Labour Party to come to power. Italy was to form a pro-Austria government. The Ottoman Empire was to transfer Georgia and Azerbaijan to Germany. Serbia was to cede Skopje to Bulgaria, with the government accepting Austrian-appointed officials' control."
clever_dsk.105.a: "This was a reshuffling of the world order."

clever_dsk.106.t: "Completion of African Power Division"
clever_dsk.106.d: "British and French expeditionary forces, armed with firearms, forced numerous African tribes to submit, essentially completing the division of their respective spheres of influence."
clever_dsk.106.f: "I maintain that we are the first-class race in the world; the more places we settle in this world, the more advantageous it is for humanity. If there is a God, I think what he wants me to do is to paint as much of the map of Africa red as possible with British colors." — Cecil Rhodes
clever_dsk.106.a: "Perhaps we should hasten our expansion."

clever_dsk.107.t: "Triple Alliance"
clever_dsk.107.d: "Rumors abound in Europe of Italy, frustrated by setbacks in Tunisia, sending diplomats secretly to Germany and Austria. Leveraging excellent diplomatic skills and good relations, Italy and the two countries signed the Triple Alliance treaty."
clever_dsk.107.f: "The news of Italy's ruling clique coveting Somalia, Eritrea, and Tunisia is well known. Perhaps the rumors are not unfounded, and this could be Italy seeking refuge under the protection of Germany and Austria."
clever_dsk.107.a: "Let's wait and see."

clever_dsk.108.t: "Balkan Troubles"
clever_dsk.108.d: "Pan-Slavism has swept through the Balkan Peninsula countries, and Balkan nations have begun actively militarizing and forming alliances, directing their hostility towards their common enemy—[SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName]."
clever_dsk.108.f: "The Balkan nations have laid out plans for the division of [SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName]'s territories in the Balkan Peninsula after a victorious war. Serbia has started preparing for war, and it seems that the Balkan War is inevitable."
clever_dsk.108.a: "Adapt to the situation in the Balkan Peninsula."

clever_dsk.109.t: "Formation of the Balkan Alliance"
clever_dsk.109.d: "To rescue Balkan compatriots still oppressed under Turkish rule, [SCOPE.sCountry('serbian_need_more_friends_scope').GetName] and Greece, Bulgaria, and Montenegro signed an alliance treaty, agreeing to jointly fight against Turkey."
clever_dsk.109.f: "The treaty stipulates that when Turkey attacks the territory of any contracting party or violates the basic principles of international law, they will assist each other with all armed forces."
clever_dsk.109.a: "Will the sick man of Europe become the sick man of the West Asia?"

clever_dsk.110.t: "[SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName] Surrenders"
clever_dsk.110.d: "Due to the defeat on the Silesian battlefield, a chaotic [SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName] voluntarily surrendered to the Balkan Alliance, forced to sign the Treaty of London and cede large European territories."
clever_dsk.110.f: "According to the treaty, [SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName] will cede all European territories west of the Noss-Midia line, including the old capital Edirne. Albania will be granted independence, and Serbia is notified to relinquish control of northern Albania."
clever_dsk.110.a: "We no longer need to save this patient known as Turkey. Instead, we can congratulate [SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName] on leaving Europe and entering Asia."

clever_dsk.111.t: "Brothers Turn Against Each Other"
clever_dsk.111.d: "Regarding the Macedonia partition issue, [SCOPE.sCountry('bul_will_fight_with_ser_scope').GetName] and Serbia have serious disagreements."
clever_dsk.111.f: "[SCOPE.sCountry('bul_will_fight_with_ser_scope').GetName] insists that Serbia is obligated to return the Vardar Macedonia region according to the alliance agreement. Serbian diplomats accuse the Bulgarians of greed, claiming they are plundering the few spoils of war they have. Under this dispute, the Serbian government is actively contacting Russia, Romania, Greece, and Montenegro, attempting to form an anti-Bulgarian alliance."
clever_dsk.111.a: "War is imminent once again."

clever_dsk.112.t: "Reignition of Warfare"
clever_dsk.112.d: "The failure of arbitration over the Macedonia region has sparked discontent in [SCOPE.sCountry('bul_will_fight_with_ser_scope').GetName]. To recapture Skopje, [SCOPE.sCountry('bul_will_fight_with_ser_scope').GetName] has decided to launch a surprise war against Serbia."
clever_dsk.112.f: "Obviously, the military victory over Turkey has inflated Bulgarian ambitions, with rumors even suggesting that their rulers want to be crowned in Constantinople."
clever_dsk.112.a: "The troubles in the Balkans are far from over."

clever_dsk.113.t: "Venetian Uprising"
clever_dsk.113.d: "Frequent Venetian uprisings and diplomatic arbitration from Berlin have left [SCOPE.sCountry('aus_give_up_ven_scope').GetName] in a double bind. In the latest uprising, the uprising leader announced a vote to join the Kingdom of Sardinia."
clever_dsk.113.f: "[SCOPE.sCountry('aus_give_up_ven_scope').GetName]'s garrison in Venice faced numerous uprisings, leading to a hasty retreat from Venetia. Under military pressure and diplomatic arbitration from Berlin, [SCOPE.sCountry('aus_give_up_ven_scope').GetName] signed the Treaty of Vienna, returning the Venetian region to Italy."
clever_dsk.113.a: "Austria will never return to Venetia."

clever_dsk.114.t: "For Italian Unification!"
clever_dsk.114.d: "The Italian Risorgimento movement has reached its climax, with calls for Italian unification emerging from both the Lombards in the north and the Sicilians in the south. However, the current situation forces them to rely on [SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName] to achieve Italian unification."
clever_dsk.114.f: "A general from Nice has independently formed a 1,400-man expeditionary force, crossing the sea to campaign against the decaying regime on the island of Sicily; the Papal States, unprotected by external forces, are also in jeopardy; several small states have announced their integration into Italy under the Central Italy joint province. "
clever_dsk.114.a: "Italy may no longer just be a geographical term."

clever_dsk.115.t: "For Italian Unification!"
clever_dsk.115.d: "The Italian Risorgimento movement has reached its climax, with calls for Italian unification emerging from both the Lombards in the north and the Sicilians in the south."
clever_dsk.115.f: "A general from Nice has independently formed a 1,400-man expeditionary force, crossing the sea to campaign against the decaying regime on the island of Sicily; the Papal States, unprotected by external forces, are also in jeopardy; several small states have announced their integration into Italy."
clever_dsk.115.a: "Italy is no longer just a geographical term."

clever_dsk.116.t: "Treaty of Vienna"
clever_dsk.116.d: "Frequent Venetian uprisings and pressure from Prussia and Italy led the disadvantaged [SCOPE.sCountry('aus_give_up_ven_scope').GetName] to sign the Treaty of Vienna with Italy, returning the Venetian region."
clever_dsk.116.f: "Italian diplomats, with the support of France, and the excellent performance of Italian volunteers, secured victory for their homeland. [SCOPE.sCountry('aus_give_up_ven_scope').GetName]'s garrison in Venetia had no choice but to retreat in a sorry state. After decades of resistance against Austrian brutal rule, the Venetian citizens finally welcomed their national liberation."
clever_dsk.116.a: "Austria will never return to Venetia."

clever_dsk.117.t: "Hawaiian Revolution"
clever_dsk.117.d: "A group of white American immigrants residing in Hawaii formed a safety committee, armed themselves, occupied government buildings, disbanded the Hawaiian Royal Guard, declared the establishment of [SCOPE.sCountry('haw_face_problem_scope').GetName], and elected Dole Pineapple Company founder [SCOPE.sCharacter('haw_dole_character').GetFullName] as president."
clever_dsk.117.f: "The US government immediately recognized [SCOPE.sCountry('haw_face_problem_scope').GetName]. There are also reports claiming that the so-called white president [SCOPE.sCharacter('haw_dole_character').GetFullName] is merely a governor appointed by the United States in Hawaii."
clever_dsk.117.a: "Aggressors who claim to be civilized."

clever_dsk.118.t: "Treaty of Turin"
clever_dsk.118.d: "[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName], to rescue Lombard compatriots still enslaved by Austria, privately signed the Treaty of Turin with [SCOPE.sCharacter('fra_now_help_safuyi_scope').GetFirstName], establishing an alliance with France."
clever_dsk.118.f: "[SCOPE.sCharacter('fra_now_help_safuyi_scope').GetFirstName] was moved by the Italian spirit of achieving national unity at all costs, and with [SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]'s promise to cede Savoy and Nice to France if France supported [SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]'s war against Austria, [SCOPE.sCharacter('fra_now_help_safuyi_scope').GetFirstName] resolved to support Italian unification."
clever_dsk.118.a: "Let's wait for the situation to develop."

clever_dsk.119.t: "Austrian Peace Treaty"
clever_dsk.119.d: "Unable to achieve a swift victory, Austria was decisively defeated by the coalition forces of [SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]. Under [SCOPE.sCharacter('fra_now_help_safuyi_scope').GetFirstName]'s mediation, Austria surrendered voluntarily and signed a peace treaty with [SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]."
clever_dsk.119.f: "[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName] successfully regained Lombardy, and the local Italian people welcomed the arrival of their compatriots. Of course, [SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName] also fulfilled the Treaty of Turin by formally ceding Savoy and Nice to [SCOPE.sCountry('fra_will_help_safuyi_scope').GetName]."
clever_dsk.119.a: "If Italy is a sick young man, then Austria is a paralyzed old man lying on a sickbed."

clever_dsk.120.t: "Return to Kuye Island"
clever_dsk.120.d: "For a long time, [SCOPE.sCountry('chi_return_kuye_scope').GetName] maintained a loose tribute system with the inhabitants of Kuye Island, which required the local residents to trade by rowing boats down the Black Dragon River, making communication extremely inconvenient. However, with tensions rising in the surrounding areas, Russian warships roaming and attempting to establish outposts in the northern part of Sakhalin Island; the Japanese shogunate also trying to establish a tax office in the southern part of Hokkaido Island, bringing the local residents under direct control of the shogunate. This has caught the attention of [SCOPE.sCountry('chi_return_kuye_scope').GetName]."
clever_dsk.120.f: "The Three Hereditary Vice-Generals heard news of infiltration on Kuye Island from several chiefs of the Fayaka and Ainu tribes. Unexpectedly, the rulers of [SCOPE.sCountry('chi_return_kuye_scope').GetName] were extremely concerned about the affairs of Kuye Island, dispatching officials and troops to return to Kuye Island and strengthen the jurisdiction of each Gasha."
clever_dsk.120.a: "What will the future name of this island be? Kuye? Hokkaido? Or Sakhalin?"
clever_dsk.120.b: "We are announcing that we will be involved in the #v Japan Strategic Area #!"
clever_dsk.121.d: "Long divided Germans, influenced by the wave of nationalism, are urgently pursuing political unification of Germany to counterbalance other powerful countries. The German states that still maintain their independence are eagerly joining Berlin, hoping that it can rescue their compatriots who are still enslaved by other countries and achieve German unification."
clever_dsk.121.f: "The German small states obedient to Berlin have gathered into a powerful force. The Prime Minister of Berlin claims that the unification of Germany can only be achieved through the path of war against the opponents."
clever_dsk.121.a: "A new emerging power will rise in Central Europe."

clever_dsk.122.t: "Capture of Mombasa"
clever_dsk.122.d: "In the early 18th century, [SCOPE.sCountry('oman_return_mon_scope').GetName] completely expelled the Portuguese from East Africa, establishing absolute rule and authority of the Sultan in East Africa. However, due to the decline of civil war, some stationed officials in East Africa declared independence and rebellion, especially the Mazrui family stationed in Mombasa, declaring themselves Emirs, shaking the Sultan's rule in the coastal areas of East Africa."
clever_dsk.122.f: "According to merchants traveling to and from Zanzibar, Sultan [SCOPE.sCharacter('oman_ruler_return_mon_scope').GetFirstName] took advantage of the internal strife of the Mazrui family to capture the key town of Mombasa, annihilating the Mazrui dynasty. Local merchants spoke endlessly about [SCOPE.sCharacter('oman_ruler_return_mon_scope').GetFirstName] being an ambitious king; with his vast fleet, no one can shake [SCOPE.sCountry('oman_return_mon_scope').GetName]'s commercial order in East Africa."
clever_dsk.122.a: "This facilitates trade with [SCOPE.sCountry('oman_return_mon_scope').GetName]."
clever_dsk.122.b: "No one cares about this barren land"
clever_dsk.123.t: "Seeking Support from [SCOPE.sCountry('lan_need_qng_scope').GetName]"
clever_dsk.123.d: "Decades ago, our great Tang Governor Luo Fangbo led us to clear bandits and pirates in Borneo, establishing a nation to protect Chinese and indigenous tribes. Governor Luo Fangbo has always wanted to become a vassal of [SCOPE.sCountry('lan_need_qng_scope').GetName] in exchange for protection, but has always been rejected by Emperor Qianlong. After numerous negotiations, our motherland reluctantly agreed to trade with us, which has continued until now."
clever_dsk.123.f: "On his deathbed, Governor Luo Fangbo instructed that regardless of who leads the country, the determination to submit to the Qing Dynasty must remain unchanged. Now, several groups of red-haired barbarians have appeared in the southwest, endlessly sending troops to harass our miners. Merchants returning from Guangzhou informed us that the current Emperor of [SCOPE.sCountry('lan_need_qng_scope').GetName)] may not reject our request to become a vassal as his grandfather did, perhaps this is a good opportunity to seek military protection from [SCOPE.sCountry('lan_need_qng_scope').GetName]."
clever_dsk.123.a: "Send envoys to Beijing to request vassalage under [SCOPE.sCountry('lan_need_qng_scope').GetName]."
clever_dsk.123.b: "We can fend for ourselves."

clever_dsk.124.t: "Vassalage Request"
clever_dsk.124.d: "The diplomatic envoys of [SCOPE.sCountry('lan_and_qng_scope').GetName] conveyed a request for vassalage and tribute from us, the officials of the court have no favorable impression of these refugees who fled overseas, advising the Emperor to ignore them."
clever_dsk.124.f: "[SCOPE.sCountry('lan_and_qng_scope').GetName] complains to us about the frequent raids by red-haired barbarians, urgently hoping that the Emperor will accept their request for vassalage, willing to forever be servants of the Qing Dynasty. If we agree to their request, it is very likely that we will be drawn into conflicts with the red-haired barbarians in the future."
clever_dsk.124.a: "Agree to [SCOPE.sCountry('lan_and_qng_scope').GetName]'s request."
clever_dsk.124.b: "Consider overseas refugees who refuse to submit to the king as pirate dens."
clever_dsk.125.t:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] Travels"
clever_dsk.125.d:0 "The Tsar plans to send the Crown Prince [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] on a world tour under the pretext of presiding over the groundbreaking ceremony of the Trans-Siberian Railway in the Far East. He will travel on a cruiser to explore routes and supply ports for our navy from Europe to the Far East and gather intelligence in Asia along the way."
clever_dsk.125.f:0 "Long walk, shot two crows. Tea in the sunshine... then another walk, rowing. Then the crows, tea... Today I walked around Pavlovsk, killed two crows and a cat..."
clever_dsk.125.a:0 "The Crown Prince [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] needs to travel the world to gain knowledge, not waste time in the palace."
clever_dsk.125.b:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] should stay in the Winter Palace."
clever_dsk.126.t:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] Visits"
clever_dsk.126.d:0 "On his way to the Far East to preside over the groundbreaking ceremony of the Trans-Siberian Railway, Crown Prince [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] of [SCOPE.sCountry('come_to_the_world_scope').GetName] will visit [SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName] on a cruiser."
clever_dsk.126.f:0 "The Russian Crown Prince travels upriver, exploring Hankou. On the eighth of this month, the Crown Prince arrived with three large warships and two escort ships. As they approached the shore, the forts on both sides saluted with cannons and flags, which the Russian ships reciprocated. The ceremonies at Wuhu were similarly respectful, enhancing diplomatic relations further."
clever_dsk.126.a:0 "Prepare the most grand ceremonial reception for [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]."
clever_dsk.126.b:0 "Refuse to let [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] ashore."
clever_dsk.128.d:0 "On his way to the Far East to preside over the groundbreaking ceremony of the Trans-Siberian Railway, Crown Prince [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] of [SCOPE.sCountry('come_to_the_world_scope').GetName] will visit [SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName] on a cruiser."
clever_dsk.128.f:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] plans to stay in [SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName] for a month, participating in local festivals and showing interest in the delicate beauty of Asian women. Perhaps we can seize this opportunity to improve relations with [SCOPE.sCountry('come_to_the_world_scope').GetName]."
clever_dsk.129.t:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] Ends Visit"
clever_dsk.129.d:0 "After visiting the Hanyang Iron Works and Hubei Arsenal, [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] attended the anniversary celebration of the new Taiyang Company established by [SCOPE.sCountry('come_to_the_world_scope').GetName] in China. Taiyang Brick Tea Factory specially made a commemorative brick tea for [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]. He then left Wuhan on the Azov to continue his visit to Japan."
clever_dsk.129.f:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] praised the progress of the Self-Strengthening Movement in [SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName] and acknowledged its potential as a future great power. However, some officials remained skeptical, privately questioning whether [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]'s compliments hid intentions of dismembering [SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName]."
clever_dsk.129.a:0 "Bid farewell to [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]."
clever_dsk.129.b:0 "Tell them to leave quickly."
clever_dsk.130.d:0 "Crown Prince [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] of [SCOPE.sCountry('come_to_the_world_scope').GetName] was surprised by the prosperity of [SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName]. He especially could not understand why [SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName] allowed foreigners to hold important government positions and expressed his incomprehension of our policy of the Republic of Five Races. After visiting the Wuhan Arsenal, [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] continued his visit to Japan on the Azov."
clever_dsk.130.f:0 "The scene of ethnic harmony in [SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName] shocked and displeased [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]. Accompanying officials informed us that [SCOPE.sCountry('come_to_the_world_scope').GetName] is currently undergoing Russianization based on 'Orthodox Christianity, Autocracy, and Nationalism,' such as children from mixed-faith marriages automatically becoming Orthodox. Cultural differences may have caused his dissatisfaction. Nonetheless, our officials successfully completed their task, allowing [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] to taste Chu cuisine and visit famous sites like Wudang Mountain and Yellow Crane Tower. [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] highly praised China's rich history and culture, calling [SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName] an awakening eastern lion and expressing hope to become an ally of the Tsar."
clever_dsk.131.t:0 "Interesting Tattoo"
clever_dsk.131.d:0 "After arriving in [SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName], our diplomats and interpreters took [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] on tours. Locals held grand welcoming ceremonies, and commercial ships in the port displayed the flag of [SCOPE.sCountry('come_to_the_world_scope').GetName]. After participating in the Five-Three Fire Ceremony and visiting geisha houses, our tattoo artist thoughtfully inked a dragon on his right arm."
clever_dsk.131.f:0 "Tuesday. I woke up to a beautiful day, the coast beckoning. The streets and houses of Nagasaki left a very pleasant impression: everything is perfectly clean and tidy. It is enjoyable to enter their homes. Japanese men and women are such kind and friendly people. We returned to the frigate for tea at 5 PM. After dinner, I decided to get a dragon tattoo on my right arm. It took a full seven hours from 9 PM to 4 AM! One experience of such pleasure is enough to deter me from doing it again. The dragon looks quite good. And my hand doesn't hurt at all."
clever_dsk.131.a:0 "Continue to leave [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] with a friendly impression of [SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]."
clever_dsk.132.t:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] Attacked!"
clever_dsk.132.d:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] was attacked by an anti-Russian extremist from [SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName] while touring Otsu in a rickshaw. Fortunately, [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] reacted in time to dodge the saber, which would have otherwise killed him."
clever_dsk.132.f:0 "Other [SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName] policemen immediately subdued the attacker, but [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] still suffered two head wounds. Thanking God, he was rushed to the hospital. [SCOPE.sCountry('come_to_the_world_scope').GetName] quickly demanded severe punishment for the assailant, threatening war otherwise. Shocked by the news, [SCOPE.sCharacter('jap_welcome_nicholas_scope').GetFullName] rushed to the Russian warship docked at the port, attempting to soothe [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] and avoid further escalating tensions."
clever_dsk.132.a:0 "The attacker should be hanged immediately."
clever_dsk.132.b:0 "The attacker should be imprisoned."
clever_dsk.133.t:0 "Killing [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFullName]"
clever_dsk.133.d:0 "Crown Prince [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] of [SCOPE.sCountry('come_to_the_world_scope').GetName] was touring Otsu in a rickshaw. Suddenly, a policeman approached from behind and violently slashed at the Crown Prince's head with a saber, shouting \"kill you, you\". Covered in blood, he was quickly taken to the hospital for treatment."
clever_dsk.133.f:0 "Crown Prince [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] was attacked by a Japanese policeman while touring Otsu in a rickshaw. Despite the assailant being quickly subdued by other policemen, the Crown Prince still suffered head injuries and was immediately taken to the hospital. This incident caused an uproar, with [SCOPE.sCountry('come_to_the_world_scope').GetName] demanding the harshest punishment for the attacker, threatening severe consequences otherwise."
clever_dsk.133.a:0 "Order a full-scale invasion of [SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]."
clever_dsk.133.b:0 "The attacker should be hanged."
clever_dsk.134.t:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] Recovering"
clever_dsk.134.d:0 "Crown Prince [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]'s condition has stabilized. His forehead wounds are not deep and will heal without complications. He has already started communicating with Tsar Alexander III about the incident."
clever_dsk.134.f:0 "Covered in bandages, Crown Prince [SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName] attended a tea party hosted by the local government. After a brief conversation with the Japanese Emperor, he decided to continue his voyage."
clever_dsk.134.a:0 "Speed up recovery and continue the trip."
clever_dsk.134.b:0 "End the trip and return home for recovery."
clever_dsk.135.t:0 "The Expedition to Mexico"
clever_dsk.135.d:0 "The ruler of [SCOPE.sCountry('mex_will_hit_scope').GetName] decided to stop paying the interest on foreign loans, which directly angered several creditor nations. [SCOPE.sCountry('fra_will_hit_mex_scope').GetName]'s ruler, [SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName], actively sought to form an alliance with Britain and Spain, gathering forces to send an army to recover the debts from [SCOPE.sCountry('mex_will_hit_scope').GetName]."
clever_dsk.135.f:0 "There are rumors that [SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName] intends not only to recover the debts but also to recruit an Austrian noble to become the Emperor of [SCOPE.sCountry('mex_will_hit_scope').GetName]. This has strongly upset the large powers in northern Mexico, who have warned Europeans not to intervene in the affairs of independent nations of the Americas."
clever_dsk.135.a:0 "[SCOPE.sCountry('mex_will_hit_scope').GetName] will certainly not welcome a European emperor to rule them."

clever_dsk.136.t:0 "Saltpeter War"
clever_dsk.136.d:0 "The Atacama Desert, rich in bird guano and saltpeter resources, has long been mined by [SCOPE.sCountry('chl_will_hit_bol_scope').GetName] and its neighboring countries. However, Bolivia recently seized all assets of [SCOPE.sCountry('chl_will_hit_bol_scope').GetName]'s mining companies in the region to fund its military, directly provoking retaliation from [SCOPE.sCountry('chl_will_hit_bol_scope').GetName]."
clever_dsk.136.f:0 "[SCOPE.sCountry('chl_will_hit_bol_scope').GetName] and Bolivia are on the brink of war. A telegram from London not only fails to stop the war but also supports [SCOPE.sCountry('chl_will_hit_bol_scope').GetName] in starting it, hoping to share the mining rights after their victory."
clever_dsk.136.a:0 "The political landscape of South America is about to change."
clever_dsk.137.t:0 "Reformation Hero"
clever_dsk.137.d:0 "Born in the Satsuma domain, [SCOPE.sCharacter('ecchi_jap_okubo_toshimichi_scope').GetFullName] played an active role in the Meiji Restoration, earning him a position in handling internal affairs and providing a platform for his reforms."
clever_dsk.137.f:0 "[SCOPE.sCharacter('ecchi_jap_okubo_toshimichi_scope').GetFullName] has political ideals of strengthening central authority and achieving a rich country and strong military. To catch up with the powerful industrial countries of the West, his centralizing reforms are destined to lead to a path of high-pressure despotism."
clever_dsk.137.a:0 "Looking forward to his performance."
clever_dsk.138.t:0 "[SCOPE.sCharacter('ecchi_jap_okubo_toshimichi_scope').GetFullName] Assassinated"
clever_dsk.138.d:0 "While traveling by carriage to the Daijō-kan, [SCOPE.sCharacter('ecchi_jap_okubo_toshimichi_scope').GetFullName] was attacked by a group of samurai assassins from Ishikawa at Shimizudani, Kiyomachi."
clever_dsk.138.f:0 "To realize the Meiji vision, we must set a thirty-year period... The first ten years from the first year of Meiji for creation... The second phase, from the eleventh to the twentieth year of Meiji, for internal consolidation and strengthening national power... The third phase, from the twenty-first year of Meiji for ten years, for consolidation...! A dying man has no need to worry about the future of this country."
clever_dsk.138.a:0 "I... I cannot die yet... There are still things I must do..."
clever_dsk.138.b:0 "Patrolling police thwarted the assassination attempt."
clever_dsk.139.t:0 "Shadow of the Andes"
clever_dsk.139.d:0 "The confederation led by [SCOPE.sCountry('bol_with_peu_con_scope').GetName] is a populous and resource-rich country. Our real ruler, the leader of multiple departments including internal affairs, foreign affairs, justice, and education, [SCOPE.sCharacter('fight_with_bol_peu_scope').GetFullName], perceives the union of the confederation as a threat to Chile's interests."
clever_dsk.139.f:0 "Chile's position relative to the Peru-Bolivia Confederation is unsustainable. Both the people and the government cannot tolerate it, as it is tantamount to suicide. We cannot help but be concerned and alert to the existence of these two nations, which, due to their shared origins, language, customs, religion, thoughts, and habits, will naturally form a single nucleus over time. Together, these two countries, even temporarily, will always surpass Chile in various issues and circumstances... The confederation must disappear from the stage of the Andes forever because its geographical expansion threatens to dominate the Pacific area, taking away our dominant position. Also, they have more enlightened white people, though their character is not as good as that of Chileans... For all these reasons, unless special circumstances arise, the confederation will eventually engulf Chile... Therefore, the navy must act before the army, delivering a decisive blow. We must always rule the Pacific: I hope it will always be Chile's motto. - [SCOPE.sCharacter('fight_with_bol_peu_scope').GetFullName]"
clever_dsk.139.a:0 "It's time to end this Andean monster."
clever_dsk.139.b:0 "Perhaps we need to make peace with them."
clever_dsk.140.t:0 "Tarija Dispute"
clever_dsk.140.d:0 "The [SCOPE.sCountry('bol_with_peu_con_scope').GetName] army occupied and annexed the territory of the Jujuy Province, incorporating it into their Tarija Province, which is an infringement on our sovereignty! Chilean agents have informed us that [SCOPE.sCharacter('bol_ruler_fight_scope').GetFullName] is even harboring monotheistic supporters, inciting these Argentine traitors to split our country!"
clever_dsk.140.f:0 "Bolivians, you owe us millions of pesos spent for your freedom and independence in the war against Spain! You owe us the blood of Argentines shed in that war! Understand that once Tarija is restored, the Supacha River must demarcate the territories of the two republics; but in my opinion, if we can ensure the Villa de Tupiza and the town of Santiago de Cotagaita remain within our territory, it will ensure eternal peace and free trade between the two countries, as I have outlined. In exchange for this benefit, I believe we can forgive the expenses incurred during the war of independence, and the benefits derived from Tarija during its usurpation. But to achieve all this, we must deeply penetrate into Bolivia's capital and bring Cerro Rico under our jurisdiction. - [SCOPE.sCharacter('fight_with_bol_arg_scope').GetFullName]"
clever_dsk.140.a:0 "The war will not be against the people of Peru and Bolivia, but [SCOPE.sCharacter('bol_ruler_fight_scope').GetFullName] must leave Peru, and all lost territories must be returned to us unconditionally."
clever_dsk.140.b:0 "Inform the Chilean diplomat that we will not go to war with [SCOPE.sCountry('bol_with_peu_con_scope').GetName]."
clever_dsk.141.t:0 "No More Falklands"
clever_dsk.141.d:0 "With the decline of British power in the South Pacific, a new era begins for [SCOPE.sCountry('arg_great_now_scope').GetName]."
clever_dsk.141.f:0 "Do you like the equatorial climate? For example, the Marquesas Islands or Samoa? Or somewhere more stimulating? Helmholtz stood up from his cushioned chair: I would prefer an extremely harsh climate; I believe the harsh climate will make me write better, often with storms... [SCOPE.sCharacter('arg_ruler_great_now_scope').GetFirstName] nodded in approval: I like your spirit, Mr. Watson, indeed I do. How about the Malvinas Islands? Good, I think it's possible, Helmholtz replied."
clever_dsk.141.a:0 "Let the pirate's nest become a beacon of progress for [SCOPE.sCountry('arg_great_now_scope').GetName]!"
clever_dsk.142.t:0 "Reunion of Brothers"
clever_dsk.142.d:0 "Under the wise leadership of [SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName], the foolish independence movement of Artigas has finally been corrected."
clever_dsk.142.f:0 "Argentinian brothers unite because it is the first law; they will have true unity at all times. For if they fight among themselves, outsiders will devour them."
clever_dsk.142.a:0 "Welcome back, Uruguayan brothers to [SCOPE.sCountry('arg_great_now_scope').GetName]"
clever_dsk.143.t:0 "End of the Madman's Rule"
clever_dsk.143.d:0 "The era of the madman José de Francia y Velasco has finally ended, and the Paraguayan people no longer have to endure his autocratic rule."
clever_dsk.143.f:0 ""Doctor, I must say, your preliminary analysis has proven wrong," said the man, holding a knife, intently looking into the doctor's eyes. "On the contrary, Francia, never forget that different paths may still lead to the same destiny."
clever_dsk.143.a:0 "It is time for [SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName] to restore sanity in the Paraguayan region."
clever_dsk.144.t:0 "Tarija Issue Resolved"
clever_dsk.144.d:0 "Without a doubt, Tarija is now under the authority of [SCOPE.sCountry('arg_great_now_scope').GetName], and we will never let our homeland be trampled by the enemy again."
clever_dsk.144.f:0 "Heaven's arrangement has placed me in such a terrible situation; let us bravely fight those who bring chaos to our land; let us eliminate the ungodly, thieves, desecrators, especially the treacherous traitors who dare mock our goodwill. We will not be intimidated by any form of danger, nor will we fear the means we take in pursuit of danger will be wrong. - [SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName]"
clever_dsk.144.a:0 "It is time to develop and utilize this land."
clever_dsk.145.t:0 "Hero's Return"
clever_dsk.145.d:0 "Our national hero of the War of Independence, [SCOPE.sCharacter('arg_hero_come_scope').GetFullName], recently stayed in Montevideo. Initially supporting the absolute regime of [SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName], he began to condemn the government's violent actions as his family and friends were persecuted."
clever_dsk.145.f:0 "With genuine feelings, I saw the current state of our unfortunate country, and worst of all, I see no improvement in its fate. You know my feelings, so when I see the most honest people in our country being persecuted, I cannot approve of General [SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName]'s actions. Nevertheless, I absolutely do not endorse any Argentine joining foreigners to humiliate their own country. - [SCOPE.sCharacter('arg_hero_come_scope').GetFullName]"
clever_dsk.145.a:0 "Perhaps we can appropriately listen to [SCOPE.sCharacter('arg_hero_come_scope').GetFullName]'s opinions and arrange accommodations for our hero."
clever_dsk.145.b:0 "Politely tell [SCOPE.sCharacter('arg_hero_come_scope').GetFullName] to leave South America."
clever_dsk.146.t:0 "Island Localization"
clever_dsk.146.d:0 "[SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName] reclaimed the Malvinas Islands and had unique ideas for the British residents on the island."
clever_dsk.146.f:0 "British pirates have occupied our sacred territory for too long, and now they have only two choices: become Argentinians, or be thrown into the South Atlantic to feed the fish. - [SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName]"
clever_dsk.146.a:0 "The Malvinas Islands are native Argentine territory."
clever_dsk.147.t:0 "World War Breaks Out"
clever_dsk.147.d:0 "Following the assassination of the Austro-Hungarian heir, the situation has spiraled out of the Austrian government's control. The spark of war has been ignited, and a world war is upon us."
clever_dsk.147.f:0 "This will be an unprecedentedly intense world war... The old countries and their hereditary statesmanship will collapse together, so that the crowns will fall to the streets and no one will pick them up. - Friedrich Engels"
clever_dsk.147.a:0 "Victory or death!"
clever_dsk.149.t:0 "[SCOPE.sCountry('aus_ferdinand_now_die_scope').GetName] Archduke Assassinated"
clever_dsk.149.d:0 "[SCOPE.sCountry('aus_ferdinand_now_die_scope').GetName] Archduke [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName] and his wife were assassinated by a Serbian youth while traveling in an open car en route to Sarajevo. Unfortunately, [SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFirstName] and his wife did not survive, and the ambassadors of various countries have expressed their condolences over this incident."
clever_dsk.149.f:0 "The assassination of the Austrian Archduke is the direct result of Russian and Serbian pan-Slavic agitation; their goal is to weaken the Triple Alliance and divide [SCOPE.sCountry('aus_ferdinand_now_die_scope').GetName]... As long as the wicked source of agitation in Belgrade is not punished, the peace policy of all European monarchies will be threatened."
clever_dsk.149.a:0 "How long can peace in Europe last?"


clever_dsk.186.t:0 "Defeat the Indonesian pirates"
clever_dsk.186.d:0 "Our outstanding naval officers and soldiers, leading a powerful fleet, have successfully intimidated and captured a large number of Moorish pirates from #yellow Maguindanao#! and #yellow Sulu#!. These barbaric fellows are now kneeling, waiting for the just judgment of our judges."
clever_dsk.186.f:0 "According to Chapter XVII of the Maritime Edict, the judgment is as follows: The nine ringleaders will be hanged at the mast forest in #yellow Manila Port#! at sunrise tomorrow. The rest will row for life on our Atlantic galleys. May the sound of your chains be a warning to sailors until the last bone sinks into the abyss!"
clever_dsk.186.a:0 "Well done. Reward our excellent officers and soldiers."
bc_finish.3.b:0 "We lost. Someone must have sabotaged us behind the scenes."
bc_finish.3.c:0 "Reward the soldiers and celebrate this hard - won victory."
sino_event.152.a_tt:0 "#red If, during the war between the Ottoman Empire and Egypt from 1839 - 1841, the Ottoman's war support is below - 70 and Egypt's war support is greater than or equal to 0, this war game will automatically end, and Egypt will gain international recognition!#!"
xinhaigeming_kongju_tt:0 "#red The outbreak of the Xinhai Revolution has made the upper - class Tibetans and Mongolians fear us, so they seek foreign support for independence! Our vassal states are also afraid of the uncontrollable actions of the Han people and try to break away from our control during the revolutionary turmoil!#!"
xinhaigeming_manyi_tt:0 "#red The outbreak of the Xinhai Revolution has caused the frontier ethnic groups to fear the uncontrollable actions of the Han people such as revenge and killing. They have all sought foreign support for independence. All vassal states are also afraid that we will spread the revolutionary fire and try to break away from our control. To keep them, we must stop the random ethnic massacres!#!"
sino_event.130.b:0 "Quickly send funds to the frontier areas to stabilize the local ethnic forces."
clever_dsk.187.t:0 "Emperor Daoguang is critically ill"
clever_dsk.187.d:0 "The Emperor [SCOPE.sCharacter('daoguang_dead_benefactor').GetFullName] suddenly fell seriously ill. He urgently summoned the grand councilors in attendance, the grand councilors of the state council, and the minister - in - charge of the imperial household department. He opened the secret box in front of them and announced the imperial edict: 'The fourth son, #yellow Yizhu#!, is to be established as the crown prince, and the sixth son, Yixin, is to be enfeoffed as the Prince Gong.'"
clever_dsk.187.f:0 "I, having received the great grace of Emperor Renzong Rui, my late father, and being entrusted with the imperial power, have ruled the world for thirty years. Looking back on the family laws of the successive emperors, I have always adhered to the principles of respecting heaven, following the ancestors, being diligent in government, and loving the people. With my humble virtues, I have dared not slack off for a moment. From the moment I ascended the throne until now, I have been poring over memorials, meeting with officials, working from dawn to dusk, just like this for thirty years, never daring to be idle or self - indulgent...\n\nRecalling the campaign against the #yellow British#! in the western border areas, although we quickly quelled the situation, I never dared to boast of my military strategies. Later, in the coastal areas in the southeast, disputes arose due to trade. I, as a man of virtue, could not bear to see the innocent common people suffer in the war. Therefore, I put aside my minor grievances and upheld the great trust, pacifying the border areas and befriending the distant lands. For the past ten years, the turmoil has finally subsided...\n\nSince the spring and summer of last year, #yellow I suffered the great grief of the passing of the Empress Dowager#!. Grief - stricken, my health has gradually declined. Looking back on my thirty - year reign and my sixty - nine years of life, I have no regrets. Now, I specially summon all the ministers and issue this imperial edict in person, establishing the fourth son, #yellow Yizhu#!, as the crown prince. I also order the kings and ministers to assist him whole - heartedly without any concerns. The crown prince is kind - hearted and filial, with pure virtues. He will surely be able to take on this important responsibility. I hope that all of you will announce this to the world so that everyone knows."
clever_dsk.187.a:0 "Your Majesty's virtues are immeasurable. We will spare no effort to assist the crown prince!"
clever_dsk.187.b:0 "The crown prince is young and inexperienced in politics. I hope Your Majesty will hold on for a few more days and take good care of your precious body."
clever_dsk.188.t:0 "Debt repayment"
clever_dsk.188.d:0 "Thanks to the efforts of Governor [SCOPE.sCharacter('clever_dsk_188_ruler_scope').GetFirstName] and his colleagues, [SCOPE.sCountry('clever_dsk_188_scope').GetName] has successfully repaid the 1.4 million - pound loan that our parliament provided in 1772."
clever_dsk.188.f:0 "By the grace of God and the blessings of the royal family, the East India Company has repaid the principal of 1.4 million pounds and all the interest of the loan from the parliament in 1772 this season. The settlement of this debt is not only a milestone in the imperial financial history but also a victory for the far - sightedness of the royal family.\n\nRecalling the turmoil of the Tea Act in 1773, the company was on the verge of a financial abyss, which shocked the London Stock Exchange. However, thanks to the wise protection of Your Majesty's predecessors, we have been adhering to Your Majesty's free - trade principles day and night. We used the surplus from the opium trade to make up for the deficit, restored our credit with the profits from the cotton - spinning factories, and opened new plantations in Ceylon. Finally, the revenue system in Bengal has regained its vitality.\n\nI humbly request Your Majesty to grant permission to mint a royal commemorative medal to honor the loyalty of the imperial subjects. ——Your most humble and obedient servant, Governor [SCOPE.sCharacter('clever_dsk_188_ruler_scope').GetFullName] of the #yellow East India Company#!"
clever_dsk.188.a:0 "Well done, [SCOPE.sCharacter('clever_dsk_188_ruler_scope').GetFirstName]."
clever_dsk.189.t:0 "Request for increased autonomy"
clever_dsk.189.d:0 "Governor [SCOPE.sCharacter('clever_dsk_189_ruler_scope').GetFirstName] has submitted a request on behalf of all the bureaucrats in [SCOPE.sCountry('clever_dsk_189_scope').GetName] to increase the autonomy of [SCOPE.sCountry('clever_dsk_189_scope').GetName]. Although [SCOPE.sCharacter('clever_dsk_189_ruler_scope').GetFirstName] has indeed done an excellent job. He not only repaid the loan owed to the parliament decades ago, enriched our treasury, but also doubled the GDP of [SCOPE.sCountry('clever_dsk_189_scope').GetName]. However, the members of the parliament have different opinions on whether to grant the governor more autonomy as a reward for his achievements."
clever_dsk.189.f:0 "With the utmost reverence, I kneel before the glory of the imperial monarchy and report the glory of the eastern territories. By the grace of Your Majesty, [SCOPE.sCountry('clever_dsk_189_scope').GetName] has not only repaid the 1.4 million - pound debt from the parliament in 1772 but also multiplied the annual revenue of the provinces under its governance. The rice output in #yellow Bengal#! has increased by 117% compared to twenty years ago, the annual tariff revenue in #yellow Maratha#! has exceeded 800,000 pounds, and the total annual revenue in India has reached 4.2 million pounds, which is half of the total tax revenue of France. This prosperous situation is indeed a clear sign from God for Your Majesty's rule over the world.\n\nHowever, the imperial cause in the East is now at a turning point. The powers and responsibilities of the governor stipulated in the current Charter Act of 1813 are still restricted by the Board of Directors in London. Every time there is a rebellion in a native state, it takes three months for the official documents to be exchanged before troops can be dispatched. The tariffs on the newly opened trade route in Burma also need to be reviewed item by item by both houses of parliament.\n\nTherefore, I humbly beg Your Majesty to grant a new charter: Allow the Governor - General's Council in Calcutta to exercise legislative power in India on behalf of the empire, allow the company's armed forces to be expanded to 100,000 without reporting, and extend the autonomy of customs duties along the Indian Ocean coast to south of 10 degrees north latitude. ——Your most obedient servant, Governor [SCOPE.sCharacter('clever_dsk_189_ruler_scope').GetFullName] of the #yellow East India Company#!"
clever_dsk.189.a:0 "[SCOPE.sCountry('clever_dsk_189_scope').GetName] can have more autonomy."
clever_dsk.189.b:0 "Reject their request."
china_borders.14.a.ctt:0 "#yellow We can establish the Lingbei Province in the resolution!#!"
china_borders.17.a.ctt:0 "#yellow We can establish the Xiyu Province in the resolution!#!"
01_afghanistan_events.96.a.ctt:0 "If we support #yellow Shah Shuja#! to become the King of Afghanistan, the Dost父子 in #yellow Kabul#! are likely to flee to the #yellow Kashmir Mountains#! to stage a comeback! By then, we must #yellow eliminate them as soon as possible#! to prevent them from #yellow misleading the people of Afghanistan#!"
clever_dsk.190.t:0 "The Sanusi Order is established"
clever_dsk.190.d:0 "A scholar from Algeria, #yellow Muhammad bin Ali as - Sanusi#!, has established the #yellow Sanusi Order#! named after him in the #yellow Libyan Desert#!. He has begun to actively spread the faith of #green Allah#! and organized some patriotic activities."
clever_dsk.190.f:0 "All souls yearning for truth and light! I stand before you not as a conqueror but as a seeker guided by the revelations of #green Allah#! and inspired by the wisdom of the Prophet.\n\nToday, our land is shrouded in darkness. The ambitions of the infidels covet our shores, and our fellow countrymen are divided in strife and confusion!\n\nBut the mercy of #green Allah#! has never left us. The path of Sanusi is born for this! We will return to the pure faith of the Prophet's era: based on the Quran, illuminated by the Hadith, and with the spirituality of Sufism as our soul. In the oases of the desert and at the post - stations along the trade routes, we will build zawiyas, providing places of worship for our fellow countrymen and shelter for the weak. We will practice our faith with humility, drive away ignorance with knowledge, and end division with unity!"
clever_dsk.190.a:0 "It's just a #yellow trivial episode#! in the barren desert."
clever_dsk.190.b:0 "We are quite interested in the situation in #yellow North Africa#!"
clever_dsk.190.c:0 "Suppress them!"
clever_dsk.191.t:0 "International Brigades Arrive"
clever_dsk.191.d:0 "Under the instructions of #yellow Third International#! in #yellow Moscow#!, many communist comrades from various countries have come to our nation to join the fight against the evil imperialist war."
clever_dsk.191.f:0 "Arise, ye who are cursed and oppressed, all the evil and enslaved of the world; our disrupted reason shall soon boil! Prepare to fight this final, resolute war! We will break the might of the world, utterly destroying it from its roots. We will see a new world arise! The completely destitute man is the true man. This is the last, most decisive battle! All of humanity will rise with the #yellow Third International#! Party!"
clever_dsk.191.a:0 "Thank you for coming, comrades."
clever_dsk.191.b:0 "We do not need manipulation from #yellow Moscow#!."

clever_dsk.192.t:0 "Allied Forces Burn the Old Summer Palace"
clever_dsk.192.d:0 "As the war situation turns against us, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] decides to flee the capital to avoid capture by the enemy. The cowardice of [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] exacerbates the fears of the capital's officials, accelerating the enemy's occupation. An English force has already entered our royal Old Summer Palace, wreaking havoc."
clever_dsk.192.f:0 "The British officers stationed in our country, using the excuse of their nationals being killed, have looted and burned our royal gardens. In the blazing inferno, beasts clothed in human skins seized exquisite artworks, smashing large royal treasures. The Old Summer Palace has become a hell on earth."
clever_dsk.192.a:0 "What can be done..."

clever_dsk.193.t:0 "Second Opium War"
clever_dsk.193.d:0 "The #yellow Chinese government#! deliberately arrests crew members of our ship, the Arrow, despite our diplomatic protests. They remain firm and refuse to release them, even executing our devoted bishop, Ma Lai, which is an insult to God. Many MPs demand that we send military forces to punish the #yellow Chinese government#!."
clever_dsk.193.f:0 "Our target is not the #yellow Chinese people#!, but the Chinese government. The peaceful relationships in our trading ports remain unaffected. We go to China for commerce, and although the Chinese government fired on our ships and blocked our ambassador, trade has never ceased. Maintaining mutual understanding at the trading ports with the Chinese is vital... I believe capturing the White River forts will not make them accept our terms, but advancing along the White River to Tianjin may force the Chinese emperor to sign a treaty with us."
clever_dsk.193.a:0 "Justice must prevail!"
clever_dsk.193.b:0 "The Chinese market is too large to be disrupted by such a small issue."

clever_dsk.194.t:0 "Rebellion Spreads Quickly"
clever_dsk.194.d:0 "The rebels in the Dominican Republic quickly captured many of the cities where our forces were stationed."
clever_dsk.194.f:0 "The Dominican people launched a rebellion and swiftly seized the stronghold of Santo Domingo. Our troops stationed in Azua, Santiago, and other provincial capitals quickly surrendered."
clever_dsk.194.a:0 "Damn!"

clever_dsk.195.t:0 "West African Issue"
clever_dsk.195.d:0 "#yellow France#! has successfully controlled [SCOPE.sState('fra_annex_algiers_scope').GetName] and is now demanding entry into the western African continent."
clever_dsk.195.f:0 "#yellow France#! seeks recognition from all nations for its sphere of influence over West Africa, including Mauritania, Senegal, Niger, and others."
clever_dsk.195.a:0 "We will take action there."
clever_dsk.195.b:0 "I don’t care about this matter."

clever_dsk.196.t:0 "[SCOPE.sCountry('scope_fra_reclamador').GetAdjectiveNoFormatting]’s Claim on West Africa"
clever_dsk.196.d:0 "[SCOPE.sCountry('scope_fra_reclamador').GetName] requests confirmation of its claims in West Africa and seeks approval from other [Concept('concept_great_power', '$concept_great_powers$')|l] to issue several ultimatums to the occupiers."
clever_dsk.196.f:0 "In a lively conference room, decorated with lavish tapestries, the sound of teacups clinking, [SCOPE.sCountry('scope_fra_reclamador').GetName]’s diplomats, wearing top hats and striking mustaches, are attempting to secure confirmation of their claims in West Africa.\n\n- 'Our historical rights are undeniable,' the [SCOPE.sCountry('scope_fra_reclamador').GetAdjectiveNoFormatting] ambassador dramatically declares.\n\nThe representatives of the other [Concept('concept_great_power', '$concept_great_powers$')|l] exchange skeptical glances. One British diplomat adjusts his tie and cleverly responds:\n\n- 'History, my dear friend, sometimes fades before the harshness of reality.'"
clever_dsk.196.a:0 "They have received our approval."
clever_dsk.196.b:0 "We will never tolerate any [SCOPE.sCountry('scope_fra_reclamador').GetAdjectiveNoFormatting] claiming the entire West Africa as their sphere of influence!"

clever_dsk.197.t:0 "June Coup"
clever_dsk.197.d:0 "A secret society within the kingdom’s military, the #yellow Black Hand#!, led 40 officers to storm the royal palace and attempt to assassinate King [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] and his queen. The rule of the Obrenović dynasty is on the verge of collapse."
clever_dsk.197.f:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]’s decision to move the military academy from the capital enraged the officer corps. In a time of widespread public discontent with [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]’s pro-Austrian and autocratic rule, the rebellious officers easily broke into the palace."
clever_dsk.197.a:0 "Poor [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] was dismembered by the rebels, his severed limbs tossed out of the window."
clever_dsk.197.b:0 "The guard discovered and stopped the rebel assassination attempt in time."

clever_dsk.198.t:0 "Change Character's Hairstyle"
clever_dsk.198.d:0 "[SCOPE.sCharacter('change_your_hairstyle_now_character').GetFullName] is dissatisfied with their current hairstyle. Perhaps we should help [SCOPE.sCharacter('change_your_hairstyle_now_character').GetFirstName] pick a new one."
clever_dsk.198.f:0 "Barber, give me the most charming haircut!\n\nNo problem, [SCOPE.sCharacter('change_your_hairstyle_now_character').GetFirstName], I’ve got just the perfect one for you."
clever_dsk.198.a:0 "I need natural, thick #yellow curly hair#!"
clever_dsk.198.b:0 "#yellow Bald#! is more masculine."
clever_dsk.198.c:0 "#yellow Short curly hair#! looks better."
clever_dsk.198.e:0 "#yellow Slicked-back hair#! looks manly."
clever_dsk.198.g:0 "This voluminous #yellow 'Afro'#! hairstyle looks good."
clever_dsk.198.h:0 "#yellow Artist hairstyle#! suits me better."
clever_dsk.198.i:0 "I should try this #yellow African buzz cut#!."
clever_dsk.198.j:0 "#yellow African short hair#! is good too."
clever_dsk.198.k:0 "#yellow African rounded pouf hairstyle#! is worth a try."
clever_dsk.198.l:0 "#yellow Indian noble hairstyle#! works too."
clever_dsk.198.m:0 "Let’s go for a #yellow short-back-and-sides slicked-back hairstyle#!."
clever_dsk.198.n:0 "#yellow Side-swept buzz cut#!, let’s see."
clever_dsk.198.o:0 "#yellow Indian dreadlocks#!, very stylish."
clever_dsk.198.p:0 "Japanese #yellow Moon-shaped back cut#!, very unique."
clever_dsk.198.q:0 "I want the #yellow shoulder-length cut#!, stylish and handsome."
clever_dsk.198.r:0 "#yellow Center part hairstyle#! will attract women."
clever_dsk.198.s:0 "#yellow Simple buzz cut#! is enough."
clever_dsk.198.u:0 "#yellow Side bangs#! will show off my cultural sophistication."
clever_dsk.198.v:0 "Brazilian #yellow Emperor Pedro II hairstyle#!, full of royal elegance."
clever_dsk.198.w:0 "Hey, make me look like the workers' leader #yellow Marx#!."
clever_dsk.198.x:0 "Netherlands #yellow William I hairstyle#!, very artistic, don’t forget the hairpin."
clever_dsk.198.y:0 "Ethiopian #yellow Tewodros II hairstyle#!, exuding heroism."
clever_dsk.198.aa:0 "I like the workers' leader #yellow Engels' hairstyle#!."
clever_dsk.198.bb:0 "#yellow Robert hairstyle#! looks very handsome."
clever_dsk.198.z:0 "Haircut complete."

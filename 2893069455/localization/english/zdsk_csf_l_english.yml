jap_gbr_support_button_desc:0 "In response to Russian expansion, both parties recognized the "independence" of China and Korea. If either party's interests in China and Korea are invaded by other countries or losses are caused by internal unrest, either party may take necessary measures."
jap_gbr_support_modifier:0 "[concept_great_power] Support"
jap_gbr_relationship_button:0 "Improve Relations with Britain"
jap_gbr_relationship_button_desc:0 "During the Great Game between Britain and Russia, we can use British power to counterbalance Russia's influence in the Far East."
je_jap_xinan_war_tt:0 "Suppress aristocratic rebellions and strengthen the authority of the court"
je_japan_korean:0 "Korean Affairs"
je_fei_fan_zhi_xian:0 "Abolishment of the Feudal Domains and Establishment of Prefectures"
je_fei_fan_zhi_xian_reason:0 "The Meiji government overthrew the shogunate, but the feudal domains across the country still existed and held significant power. This threatened centralization and hindered the stabilization of the new regime and the development of capitalism.\nThe main forces behind the anti-shogunate movement were lower-ranking samurai, moneylenders, capitalists, emerging landlords, and major figures from the southwestern domains. After the shogunate was overthrown, these groups did not form a common interest, but each desired to enjoy the fruits of victory, further necessitating centralization.\nTo solidify the new regime led by the Emperor, the Meiji government needed to abolish the feudal domains and establish prefectures, eliminating local divisions and strengthening central power. This was the primary task to ensure the smooth implementation of the new policies."
add_Annex_kor_complete_var_tt:0 "#yellow Korean Affairs#! Progress bar completed immediately!"
je_japan_korean_reason:0 "Now, [SCOPE.sCountry('kor_scope').GetName] has completely broken free from the influence of its former suzerain state, [SCOPE.sCountry('chi_scope').GetName]. [concept_jap_empire] is eager to deal with the fate of the Korean rebels, but there is still another country eyeing us warily.\nIf [concept_jap_empire] wants to dominate Asia, it will inevitably have to fight [SCOPE.sCountry('rus_scope').GetName]."
je_japan_china_tao:0 "[concept_battle_of_east_asia]: The Battle of the Katana and the Tang Dao"
je_japan_china_tao_reason:0 "We must defeat the teacher who taught us the art of forging weapons a thousand years ago to prove that we are the strongest.\nThe katana will become the sharpest cold weapon in the world, cutting off the heads of our enemies."

je_fei_dao_ling:0 "Abolishment of the Sword"
je_fei_dao_ling_reason:0 "In 1871, following the 1870 prohibition on ordinary people carrying swords, the Meiji government issued a decree banning samurai from carrying swords.\nIn 1873, the Meiji government promulgated the Conscription Ordinance, reforming the military service system and instituting a three-year mandatory military service. Everyone became a samurai. The reform caused samurai to suddenly lose their jobs. Naturally, the government no longer needed to pay salaries to those who did not work. This was known as the 'Chitsuroku Disposal,' where 'Chitsuroku' refers to salary, and 'Disposal' means removal."
je_hu_ji_fa:0 "Household Registration Law"
je_hu_ji_fa_reason:0 "The Household Registration Law differed from the previous individual registration in the 'Shumon Ninjibetsu Aratamecho.' Whether noble, samurai, or commoner, it was written on a family basis. Although it was just a formal record, it was epoch-making in overcoming the status system."
je_zhi_chan_xing_ye:0 "Promotion of Industry"
je_zhi_chan_xing_ye_reason:0 "Promotion of Industry was a policy implemented by the government to counter external pressure from advanced capitalist countries, to transplant modern industrial technology, and to protect and develop a capitalist mode of production. It was a policy of industrial protection and development that transitioned towards a capitalist mode of production. It was an important policy alongside 'Enrich the Country, Strengthen the Military,' and 'Civilization and Enlightenment.'"
je_jap_rus:0 "Korean Affairs"
je_jap_rus_reason:0 "It is crucial for us to prevent Japan from acquiring Korea."

je_japan_china_tea:0 "[concept_battle_of_east_asia]: The Battle of Tea and Silk"
je_japan_china_tea_reason:0 "When the Western countries taste the tea from [SCOPE.GetRootScope.GetCountry.GetName], they will remember that we are the country of tea.\nWhen the Western countries wear the silk fabrics woven from [SCOPE.GetRootScope.GetCountry.GetName] silk, they will remember that we are the country of silk."
je_japan_china_win:0 "[concept_battle_of_east_asia]"
je_japan_china_win_goal:0 "Win 3 [concept_battle_of_east_asia]"
je_japan_china_win_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] not only needs to defeat [SCOPE.sCountry('chi_scope').GetName] militarily but also surpass them culturally and economically.\nThe national body of the divine country of Japan, embodied in the emperor, manifests the divine will to spread the innate virtues of Japan to the four corners of the world, ensuring that all mankind enjoys the happiness of life.\n\n#red Pray for the success of our ancestors!#"
je_japan_china_win_tt:0 "A True Man's Seven Lives for the Country, Long Live the Martial Fortunes of Great Japan"
je_great_japan_tt:0 "Explore the Vast Seas, Announce National Prestige to All Four Corners"

je_manchuliya:0 "Manchurian Affairs"
je_manchuliya_reason:0 "The first step in conquering [SCOPE.sCountry('chi_scope').GetName] is to conquer Manchuria.\nSeparate Manchuria from mainland China, make it an independent area under Japanese influence."
je_manchuliya_tt:0 "Spread the Imperial Virtue to All Corners of the World, All People Under Heaven"
NO_china_tt:0 "China Does Not Exist"

je_annex_entire_china:0 "Chinese Affairs"
je_annex_entire_china_tt:0 "First, respond to the divine virtues that bestowed the nation, then enhance the spirit of the emperor's grandchildren. Then, expand the empire to all six directions and unify the eight corners under one roof, is it not so?"
je_annex_entire_china_reason:0 "To conquer [SCOPE.sCountry('chi_scope').GetName], we must first conquer Manchuria and Mongolia. To conquer the world, we must first conquer [SCOPE.sCountry('chi_scope').GetName]. If [SCOPE.sCountry('chi_scope').GetName] is completely conquered by our country, the other nations in Asia, such as South Asia and the Indian Ocean, will surely fear us and submit to us, letting the world know that East Asia is Japan's East Asia, and never dare to invade us. This is the strategy left by Emperor Meiji, and it is essential for the survival of our empire.If [GetIdeology('ideology_meiji').GetName] or [GetIdeology('ideology_fascist').GetName] is in the government, the following #v #tooltippable;tooltip:[Country.GetTooltipTag],je_annex_entire_china_pos historical events#!#! will be triggered randomly."
je_annex_entire_china_pos:0 "1. Massacre\n2. Human experimentation\n3. Gas warfare (must have units equipped with chemical weapons)\n4. Pacific War"
je_annex_amercia:0 "Pacific Affairs"
je_annex_amercia_tt:0 "Unify the Eight Corners Under One Roof, Spread Martial Virtue Across the World"
je_annex_amercia_reason:0 "The American and British demons are nothing but brutes. With the divine might of our sacred land, we shall conquer those barbaric savages, unify the world, and unite all nations. What difficulty is there in this?\nThe Great Empire of the Emperor is the first nation established between heaven and earth, and the root of all nations in the world. If we can govern its roots, then the entire world will become its province, and all the rulers of the world will be its servants.\nThe Emperor will cross the seas to personally lead the expedition, with the vanguard striking directly. First, defeat China, then devour America and Britain. The Pacific Ocean will become the inner sea of our divine nation."
annex_usa_button:0 "Japanese North America"
annex_usa_button_desc:0 "Directly managing this area will provoke local resistance, so it's better to create a Japanese North America and appoint a governor to oversee it."

Lebensraum_event.14.t:0 "Establish Japanese North America"
Lebensraum_event.14.d:0 "This is a holy war in the Pacific, and our relationship with Japanese North America is inseparable."
Lebensraum_event.14.f:0 "[SCOPE.GetRootScope.GetCountry.GetName] and the United States of the Pacific are strong and inseparable allies. Japan and the United States will enjoy everlasting peace and build the Pacific together!"
Lebensraum_event.14.a:0 "Let it be so"


sino_event.94.t:0 "Deciding Korea's Status"
sino_event.94.d:0 "[SCOPE.sCountry('kor_scope').GetName] has completely submitted to [SCOPE.GetRootScope.GetCountry.GetName]"
sino_event.94.f:0 "The governments of Japan and Korea, in order to solidify the common interests of the two empires, agree to the following terms until Korea's prosperity is recognized:\n1. The Japanese government may henceforth supervise and direct Korea's foreign relations and affairs through the Tokyo Ministry of Foreign Affairs. Japanese diplomatic representatives and consuls may protect Korean nationals and interests abroad.\n2. The Japanese government assumes full responsibility for the implementation of existing treaties between Korea and other countries. The Korean government may not conclude any international treaties or agreements without Japanese mediation.\nThe Japanese government shall place a resident-general at the court of the Korean Emperor. The resident-general shall be responsible for managing diplomatic matters, reside in Seoul, and have the right to personally visit the Korean Emperor. The Japanese government shall have the right to appoint officials at Korean open ports and other locations deemed necessary by the Japanese government. These officials, under the direction of the resident-general, shall execute all powers previously held by Japanese consuls in Korea and manage all matters necessary for the implementation of this agreement."
sino_event.94.a:0 "Bring [SCOPE.sCountry('kor_scope').GetName] under the protection of [concept_jap_empire]"
sino_event.94.b:0 "Why not go all the way and sign the Japan-Korea Annexation Treaty?"
sino_event.94.c:0 "[concept_jap_empire] must first use Korean blood to consecrate the flag before advancing into Manchuria and Mongolia!"

sino_event.95.t:0 "Only We Can Decide Korea's Status"
sino_event.95.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] will intervene militarily in this situation"
sino_event.95.f:0 "The governments of Japan and Korea, in order to solidify the common interests of the two empires, agree to the following terms until Korea's prosperity is recognized:\n1. The Japanese government may henceforth supervise and direct Korea's foreign relations and affairs through the Tokyo Ministry of Foreign Affairs. Japanese diplomatic representatives and consuls may protect Korean nationals and interests abroad.\n2. The Japanese government assumes full responsibility for the implementation of existing treaties between Korea and other countries. The Korean government may not conclude any international treaties or agreements without Japanese mediation.\nThe Japanese government shall place a resident-general at the court of the Korean Emperor. The resident-general shall be responsible for managing diplomatic matters, reside in Seoul, and have the right to personally visit the Korean Emperor. The Japanese government shall have the right to appoint officials at Korean open ports and other locations deemed necessary by the Japanese government. These officials, under the direction of the resident-general, shall execute all powers previously held by Japanese consuls in Korea and manage all matters necessary for the implementation of this agreement."
sino_event.95.a:0 "Dispatch troops"
sino_event.95.b:0 "Dispatch troops"



japan_win1:0 "The Sharp Samurai Sword"
japan_win2:0 "Japanese Tea Ceremony"
sino_event.98.t:0 "Japanese Tea Ceremony"
sino_event.98.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] has perfectly preserved and inherited the tea ceremony from the Tang Dynasty, while you [SCOPE.sCountry('chi_scope').GetName] have long forgotten your own traditions."
sino_event.98.f:0 "Tea from the mountains, early spring buds, picked when tender.\nOld mountain-side tea, valued as a treasure, roasted over a golden stove.\nIn the quiet forest, clear flowing water, filtered through silk, yielding silver needles.\nIn a moment, the charcoal flames blaze, the pot boils, waves form,\nHeld in a Song Dynasty kiln, arranged in merchant trays. The flavor of Wu salt enhances the taste.\nThe nature of tea is pure and clean, surpassing even the essence of deep rocks.\nAfter brewing, its fragrance spreads, and drinking it brings peace, lying amidst white clouds."
sino_event.98.a:0 "You should know, the immortal aura lingers."


sino_event.100.t:0 "Only We Can Decide Manchuria's Status"
sino_event.100.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] will intervene militarily in this situation"
sino_event.100.f:0 "The governments of Japan and Korea, in order to solidify the common interests of the two empires, agree to the following terms until Korea's prosperity is recognized:\n1. The Japanese government may henceforth supervise and direct Korea's foreign relations and affairs through the Tokyo Ministry of Foreign Affairs. Japanese diplomatic representatives and consuls may protect Korean nationals and interests abroad.\n2. The Japanese government assumes full responsibility for the implementation of existing treaties between Korea and other countries. The Korean government may not conclude any international treaties or agreements without Japanese mediation.\nThe Japanese government shall place a resident-general at the court of the Korean Emperor. The resident-general shall be responsible for managing diplomatic matters, reside in Seoul, and have the right to personally visit the Korean Emperor. The Japanese government shall have the right to appoint officials at Korean open ports and other locations deemed necessary by the Japanese government. These officials, under the direction of the resident-general, shall execute all powers previously held by Japanese consuls in Korea and manage all matters necessary for the implementation of this agreement."
sino_event.100.a:0 "Dispatch troops"
sino_event.100.b:0 "Dispatch troops"


sino_event.101.t:0 "Treaty of Portsmouth"
sino_event.101.d:0 "His Imperial Majesty the Emperor of [SCOPE.GetRootScope.GetCountry.GetName] and His Imperial Majesty the Emperor of all [SCOPE.sCountry('rus_scope').GetName], wishing to restore peace and happiness to both their nations and peoples, have decided to conclude a peace treaty."
sino_event.101.f:0 "Between the Emperor of Japan and the Emperor of all Russia, and between their nations and subjects, peace and harmony shall be restored.\nThe Russian government recognizes Japan's paramount political, military, and economic interests in Korea and agrees that Japan may take necessary measures for guidance, protection, and supervision without obstruction. Russian subjects in Korea shall be treated on an equal footing with the most favored nation and shall not face discrimination.\nTo avoid any cause of misunderstanding, both parties agree that neither shall undertake military measures in the border areas between Korea and Russia that could threaten the safety of their respective territories."
sino_event.101.a:0 "This is a victory for [concept_jap_empire], marking the first time an Asian power has completely defeated a Western [Concept('concept_great_power','$concept_great_powers$')] since the Industrial Revolution!"

jap_winner:0 "Victor of the Russo-Japanese War"

sino_event.102.t:0 "Only We Can Determine Manchuria's Status"
sino_event.102.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] must intervene militarily in this situation."
sino_event.102.f:0 "The Japanese government and the Korean government, in order to consolidate the common interests of both empires until Korea attains true strength, agree to the following terms:\n1. The Japanese government shall henceforth supervise and direct Korea's foreign relations and affairs from the Tokyo Ministry of Foreign Affairs. Japanese diplomatic representatives and consuls may protect Korean subjects and interests abroad.\n2. The Japanese government assumes full responsibility for the execution of existing treaties between Korea and other countries. The Korean government shall not enter into any international treaties or agreements without Japanese mediation. The Japanese government shall appoint a Resident-General at the court of the Korean Emperor. The Resident-General shall exclusively manage diplomatic matters, reside in the capital, and have the right to personally meet the Korean Emperor. The Japanese government shall have the right to establish administrative offices in all open ports and other areas deemed necessary by the Japanese government. These officers shall act under the direction of the Resident-General and shall exercise all consular powers previously held by Japanese consuls in Korea, managing all matters necessary for the execution of this agreement."
sino_event.102.a:0 "Send Troops"
sino_event.102.b:0 "Send Troops"



sino_event.105.t:0 "Treaty of Shimonoseki"
sino_event.105.d:0 "His Majesty the Emperor of [SCOPE.sCountry('chi_scope').GetName] and His Majesty the Emperor of [SCOPE.sCountry('jap_scope').GetName] have concluded this treaty to restore peace, ensure the happiness of both nations and their subjects, and eliminate any future sources of discord."
sino_event.105.f:0 "China acknowledges Korea as a fully independent and autonomous nation. Any previous arrangements that undermine Korea’s independence, such as tribute ceremonies, shall be abolished. China will cede all administrative rights over the mentioned areas, including all fortifications, military equipment, factories, and public property, to Japan indefinitely. Taiwan, the Pescadores, and all their associated islands shall be ceded to Japan. After the exchange of ratifications of this treaty and the attached maps defining the boundaries, the two countries shall each appoint two or more officials as joint boundary commissioners to survey and determine the boundaries on the ground. If the defined boundaries are obstructed by terrain or geography, the commissioners shall make adjustments as necessary. The commissioners shall expedite their work to complete the boundary demarcation within one year of their appointment."
sino_event.105.a:0 "This represents a diplomatic victory for [concept_jap_empire] that has lasted for centuries."

sino_event.106.t:0 "Eulmi Incident"
sino_event.106.d:0 "The Eulmi Incident was originally an internal conflict in [SCOPE.sCountry('kor_scope').GetName] regarding the suppression of #v Queen Min#! However, it was greatly complicated by the resulting anti-Japanese sentiment. The suffering of Japanese nationals during the Eulmi Incident shocked Japanese public opinion, leading to widespread debate."
sino_event.106.f:0 "Anti-Japanese sentiment in Korea continued to grow, with remarks such as 'When it comes to the Japanese, the people grit their teeth and wish to kill them, especially the commoners.' In June 1879, when Japanese envoy Hanabusa Yoshishichi entered Seoul, he was met with a barrage of stones from the public, leaving him in a difficult situation. In March 1882, Japanese officials from the Okura Company, including Kodama Asajiro, Mitsubishi employee Ooyama Yoshinari, and monk Rengeon Kensho from the Higashi Honganji Temple, disregarded the treaty of open ports and traveled to the Anbyeongbu area outside the Korean trade port of Wonsan. They were attacked by two to three hundred Korean citizens, with Kodama and Ooyama seriously injured and Rengeon killed on the spot. There were even reports of 'bandits gathering between the mountains and valleys, wreaking havoc, committing arson, extorting money, and robbing wealthy villages during the day, claiming to be waging righteous war against the Japanese, and accusing those who resisted of being loyal.'"
sino_event.106.a:0 "Damn it, dare to kill [concept_jap_empire]’s nationals, they must pay the price!"

sino_event.107.t:0 "Gapsin Coup"
sino_event.107.d:0 "[SCOPE.sCountry('kor_scope').GetName]’s Gabo Party, led by Kim Ok-kyun, sought assistance from Japanese envoy Takezawa Kichiro, who led troops to support the coup."
sino_event.107.f:0 "In late June 1884, Kim Ok-kyun returned to the Korean government and took up a position in the Foreign Affairs Office. Japanese acting envoy (formerly a first-class secretary, i.e., the legation counselor) Shimomura Hisashi began trying to approach Kim Ok-kyun and other Gabo Party members, stating that under the circumstances of the Sino-French War, 'if you (referring to Gabo Party members) can reform the country, my government would not object.' The coup aimed to achieve two goals: one, to break away from China and become independent; two, to reform Korean internal politics. On December 6, Yuan Shikai led Qing troops to suppress the coup, ending the Gabo Party's 'three-day reign.' Gabo Party members were either executed or fled to Japan."
sino_event.107.a:0 "The time has come to intervene in [SCOPE.sCountry('kor_scope').GetName]"

sino_event.108.t:0 "Unyo Incident"
sino_event.108.d:0 "The ship 'Unyo' commanded by Inoue Yoshika did not measure Japan's territorial waters but on May 25, 1875, entered the Korean port of Busan and fired indiscriminately at [SCOPE.sCountry('kor_scope').GetName] under the pretext of military exercises."
sino_event.108.f:0 "The tension between Korea and Japan, caused by the 'book treaty' incident, gave rise to the 'Conquest of Korea' movement in Japan. Many Meiji reformers strongly advocated the 'Conquest of Korea,' demanding the punishment of 'disrespectful' Korea, aiming to use force to open Korea's doors and to alleviate domestic conflicts in Japan while using Korea as a springboard to invade China."
sino_event.108.a:0 "It is time to open the doors of [SCOPE.sCountry('kor_scope').GetName]"

sino_event.109.t:0 "[SCOPE.sCountry('western_country').GetName] Envoy Assassinated"
sino_event.109.d:0 "Influenced by the #v Sonno Joi# ideology, an envoy from [SCOPE.sCountry('western_country').GetName] was assassinated."
sino_event.109.f:0 "While the foreign envoy was sightseeing, a Japanese police officer in charge of security suddenly attacked with a knife, striking the envoy twice near his right ear, causing a significant amount of bloodshed."
sino_event.109.a:0 "Immediately announce severe punishment for the assailant and apologize to [SCOPE.sCountry('western_country').GetName]"
sino_event.109.b:0 "The foreign barbarians deserved to die"

sino_event.110.t:0 "[SCOPE.sCountry('western_country').GetName]-[SCOPE.GetRootScope.GetCountry.GetName] Treaty Draft"
sino_event.110.d:0 "[SCOPE.sCountry('western_country').GetName] demands to sign a commercial treaty with us."
sino_event.110.f:0 "They led four warships to Edo Bay and threatened the Shogunate with military force to sign the commercial treaty. The black modern ironclad warships were the first such vessels Japanese had ever seen. Perry gave the Shogunate a model of an industrial-era locomotive and telegraph, while the Shogunate could only demonstrate their strength by sending rice back as a gift."
sino_event.110.a:0 "It’s nothing, just temporary humiliation"
sino_event.110.b:0 "We will never retreat even an inch from these foreigners"

sino_event.111.t:0 "[SCOPE.sCountry('western_country').GetName] Legation Burned!"
sino_event.111.d:0 "Angry Sonno Joi supporters burned down [SCOPE.sCountry('western_country').GetName]’s legation, attempting to drive out Westerners through such extreme measures."
sino_event.111.f:0 "The main participants in the Sonno Joi movement were lower-ranking samurai, ronin, wealthy farmers and merchants, monks, Shinto priests, Confucian scholars, as well as those among the court nobles and daimyos who demanded reform or had conflicts with the Shogunate. Takasugi Shinsaku, as one of the leaders of the Choshu domain, was a key planner and executor of this action. Sonno Joi patriots infiltrated [SCOPE.sCountry('western_country').GetName]’s legation at night and set it ablaze."
sino_event.111.a:0 "Apologize and compensate [SCOPE.sCountry('western_country').GetName]"
sino_event.111.b:0 "The kids didn’t know any better, they were just playing with fire"




sino_event.114.t:0 "Abolition of Feudal Domains and Establishment of Prefectures"
sino_event.114.d:0 "[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_MIKADO$')] ordered the abolition of all feudal domains nationwide, consolidating them into prefectures."
sino_event.114.f:0 "After the Meiji government overthrew the Shogunate, the feudal domains continued to exist and wield significant power, threatening centralization and hindering capitalist development. [ROOT.GetCountry.GetRuler.GetFirstName] summoned the domain governors in Kyoto and ordered the abolition of the domains. Established were the Tokyo, Osaka, and Kyoto prefectures, and 302 counties. The former domain lords' stipends and noble status were guaranteed, and they moved to Tokyo. The domains' tribute payments and debts were assumed by the government. Central authorities appointed prefectural governors to manage Tokyo, Osaka, and Kyoto prefectures, and county magistrates for each county, replacing the domain lords and centralizing power."
sino_event.114.a:0 "This is a necessary measure"
sino_event.114.b:0 "Perhaps we should take it slow"

sino_event.115.t:0 "Triple Intervention to Restore Liaodong"
sino_event.115.d:0 "[SCOPE.sCountry('rus_scope').GetName], [SCOPE.sCountry('ger_scope').GetName], [SCOPE.sCountry('fra_scope').GetName] have ordered us to return the #v Liaodong Peninsula#! to [SCOPE.sCountry('chi_scope').GetName]"
sino_event.115.f:0 "‘Currently, Japan's occupation of Liaodong poses a threat to China's capital and undermines Korea’s independence, which affects the maintenance of peace in the Far East. Therefore, we advise your country to confirm the abandonment of the occupation of the Liaodong Peninsula. Otherwise, the allied forces will destroy all your military facilities.’"
sino_event.115.a:0 "We will follow the wishes of the allied forces, but [SCOPE.sCountry('chi_scope').GetName] will need to pay an additional 30 million taels of silver as compensation."
sino_event.115.b:0 "Why should we give up the territory we gained by our own efforts?"

sino_event.116.t:0 "Triple Intervention to Restore Liaodong"
sino_event.116.d:0 "Does little Japan dare to defy us? They clearly do not regard the allied forces."
sino_event.116.f:0 "Deploy troops immediately"
sino_event.116.a:0 "Destroy Japan!"

sino_event.117.t:0 "Swallowing Manchuria"
sino_event.117.d:0 "The hatred of losing one’s country is unparalleled."
sino_event.117.f:0 "The Japanese Kanto Army, stationed in Northeast China, executed a carefully planned scheme by having the Railway ‘Defense Force’ blow up the South Manchuria Railway tracks near Shenyang's Liutiaohu and frame the Chinese army. The Japanese used this as a pretext to bombard the Chinese Northeast Army's northern camp, creating the shocking 'September 18 Incident.' The following day, Japanese troops occupied Shenyang and subsequently the three northeastern provinces. By February 1932, all of Northeast China had fallen. Japan then established the puppet state of Manchukuo in Northeast China, beginning a 14-year-long period of oppression and colonial rule over the Northeast's 30 million people, who endured the suffering of being a subjugated nation."
sino_event.117.a:0 "War has begun, and there is no turning back"

sino_event.118.t:0 "Swallowing China"
sino_event.118.d:0 "The hatred of losing one’s country is unparalleled."
sino_event.118.f:0 "A 5000-year-old ancient nation has perished in this moment."
sino_event.118.a:0 "History will remember today"

sino_event.119.t:0 "Swallowing the Pacific"
sino_event.119.d:0 "Turning the Pacific into an inland sea"
sino_event.119.f:0 "[SCOPE.GetRootScope.GetCountry.GetName] controls the western Pacific coast of the United States and has established a white puppet regime—the Pacific States of America, including California, Oregon, Washington, and parts of Nevada, with the capital in San Francisco."
sino_event.119.a:0 "History will remember today"


clever_dsk.183.t:0 "The Railroad Tycoon's Fortune"
clever_dsk.183.d:0 "[SCOPE.sCountry('cornelius_vanderbilt_died_scope').GetName]'s legendary railroad magnate and shipping/finance titan—#yellow Cornelius Vanderbilt#!—has finally departed. Debates rage among legislators regarding how to handle his colossal estate, particularly the massive railway equities under his control."
clever_dsk.183.f:0 "Gentlemen, when #yellow Vanderbilt#!'s private train crushed free competition across the Hudson Valley, his rails also crushed competition itself! This trust controls every sleeper from Boston to Chicago, and his heirs plan to sell shares to damned English bankers!\n\nMy colleagues seem to forget—it was these 'greedy' capitalists who laid transcontinental steel. #yellow The Fifth Amendment#! is crystal clear: private property is sacred! Seize railways today, seize your cotton plantations tomorrow!\n\nThen tell me, dear idealists—how can a federal government that took thirty-five years to roof its own Capitol possibly operate thirty thousand miles of rails? Shall our honorable congressmen personally drive steam locomotives?"
clever_dsk.183.a:0 "Acquire railway equities to accelerate our rail development."
clever_dsk.183.b:0 "Expropriate these assets instead."

oriental_crisis.13.t:0 "Reclaiming Egypt"
oriental_crisis.13.d:0 "Our new army has decisively defeated #yellow Muhammad Ali#! Pasha's forces. With victory imminent, the new Egyptian governor #yellow Isma'il Pasha#! prepares for inauguration in Cairo. The rebel leader #yellow Muhammad Ali#! and his progeny have been captured amidst soldiers' triumphant cheers for the war's conclusion."
oriental_crisis.13.f:0 "The silver-haired prisoner lay motionless in the cage cart. #yellow Turkic#! soldiers had used the old man as living fencing targets, leaving him riddled with wounds. To the tune of martial music, he painfully opened his eyes—the domed mosque before him was once so familiar."
oriental_crisis.13.a:0 "Splendid! Let's hang the traitors' heads in #yellow Constantinople#! and host a grand victory feast."
otf_events.1.c:0 "We cannot tolerate recurring rebellions—Egypt shall become a directly administered province"

clever_dsk.184.t:0 "[SCOPE.sCountry('por_annex_east_african_scope').GetName]'s Pink Map Project"
clever_dsk.184.d:0 "Post-Berlin Conference, [SCOPE.sCountry('por_annex_east_african_scope').GetName] marked its African claims in pink, asserting sovereignty over lands between #yellow Angola#! and #yellow Mozambique#! while declaring Portuguese dominion over parts of Zambia, Zimbabwe, and Malawi. Any astute statesman recognizes #yellow Portugal#! aims to connect its colonies through a horizontal African partition."
clever_dsk.184.f:0 "#yellow Portugal#! claims historical rights as Africa's first European explorer. While other powers bicker, impatient [SCOPE.sCountry('por_annex_east_african_scope').GetName] has dispatched expeditions to sign dozens of vassal treaties with indigenous tribes in contested territories."

clever_dsk.185.t:0 "Change Character Demeanor"
clever_dsk.185.d:0 "[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]'s perpetual sternness alienates the public. Perhaps we should advise [SCOPE.sCharacter('change_your_animations_now_character').GetFirstName] to adjust."
clever_dsk.185.f:0 "[SCOPE.sCharacter('change_your_animations_now_character').GetFirstName], you're cold as a machine—none discern your true thoughts, and the masses despise such frigidity. Listen: [SCOPE.sCharacter('change_your_animations_now_character').GetFirstName], show some emotion!"
clever_dsk.185.a:0 "I'm actually #yellow happy#!."
clever_dsk.185.b:0 "I've been #yellow sad#! lately."
clever_dsk.185.c:0 "I feel #yellow proud#! for our nation."
clever_dsk.185.e:0 "I'm #yellow contemplating#! some issues."
clever_dsk.185.g:0 "I'll show #yellow bravery#! like a soldier."
clever_dsk.185.h:0 "I'm currently #yellow angry#!."
clever_dsk.185.i:0 "I'm still #yellow ill#! and weak."
clever_dsk.185.j:0 "I'll personally visit #yellow workers#!."
clever_dsk.185.k:0 "I'll demonstrate for #yellow clerks#!."
clever_dsk.185.l:0 "I'll display #yellow resolve#!."
clever_dsk.185.m:0 "I'll boost rapport with #yellow peasants#!."
clever_dsk.185.n:0 "I've been #yellow gloomy#! lately."
clever_dsk.185.o:0 "I'll make subjects feel #yellow terror#!."
clever_dsk.185.p:0 "I'm somewhat #yellow exhausted#!."
clever_dsk.185.q:0 "I'll play #yellow pitiable#! for sympathy."
clever_dsk.185.r:0 "I'll maintain #yellow composure#!."

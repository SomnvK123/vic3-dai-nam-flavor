jiawu_war_button_desc: "#v China's control over Korea has completely weakened. It's time to deliver the fatal blow!#!\n[concept_jap_empire] The first step of the continental policy is to conquer Taiwan, the second step is to annex Korea, the third step is to advance into Manchuria and Mongolia, the fourth step is to destroy China, and the fifth step is to conquer Asia and dominate the world."
jiawu_war_var_3: "When we successfully complete the other three events, it will mean that China has completely lost control over Korea!"

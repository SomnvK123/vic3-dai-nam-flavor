china_borders.17.a:0 "I want to establish a special administrative region!"

je_xiyu:0 "New Xiyu Province"
je_xiyu_reason:0 "We have set foot on this land before, and now, Russia seeks to completely conquer it. This vast land conceals countless treasures, waiting for us to unearth them. Reclaiming Xiyu and Central Asia will leave a lasting legacy."
lingbeisheng_desc:0 "Establish the New Lingbei Province in this vast and cold land."

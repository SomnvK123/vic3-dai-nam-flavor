# 修正主义和资产阶级复辟
je_revisionism_breeding:0 "Breeding of Revisionism"
je_revisionism_breeding_reason:0 "In the practice of socialism, the initially established system is not sustainable in the long term. As the 'Communist Manifesto' states, 'forcible interference with property and bourgeois production relations, imposing measures that seem insufficient and unsustainable economically, but which, in the course of the movement, outstrip themselves, necessitating further inroads into the old social order.' However, facing the difficulties of building socialism, some individuals seek to implement so-called reforms using bourgeois methods. Whether inheritors like Khrushchev or founders like Tito, they all face the challenge of the economic system's difficulty in functioning. Let's wait for the time to elapse and use this opportunity to concentrate on building socialism, preparing for the third round of route struggle—the struggle against revisionism!"
je_revisionism_breeding_goal:0 "Wait for 10 years to elapse"
revisionism_breeding_events.1.t:0 "Breeding of Revisionism"
revisionism_breeding_events.1.desc:0 "Spread of revisionist thought in our country"
revisionism_breeding_events.1.f:0 "To address the problems of economic policy rigidity and difficulty in functioning, leaders continuously draw on bourgeois policies, resulting in the spread of revisionism in various aspects of our country. To combat revisionism, it is now allowed to adopt the 'Initiate Cultural Revolution Movement' resolution, entering the third round of leftist route struggle."
revisionism_breeding_events.1.a:0 "Fight against revisionism, it's urgent!"
set_allow_cultural_revolution_tt:0 "Allow the adoption of the 'Initiate Cultural Revolution Movement' resolution"
lzy_buff_revisionism_breeding:0 "Wave of Revisionist Thought"
lzy_buff_capitalism_comeback:0 "Capitalist Restoration"
revisionism_breeding_events.2.t:0 "Capitalist Restoration!"
revisionism_breeding_events.2.d:0 "Newly formed bureaucratic bourgeoisie initiates a coup"
revisionism_breeding_events.2.f:0 "Due to the emergence of a new domestic bureaucratic bourgeoisie interest group, this small faction continuously weakens the socialist public ownership system for their privileges. Eventually, with the unremitting efforts of domestic and foreign bourgeois forces, they launched a coup, achieving capitalist restoration."
revisionism_breeding_events.2.a:0 "Great setback on the road to communism!"

# 第三轮路线斗争
line_struggle_3_events.1.t:0 "Bombard the Headquarters"
line_struggle_3_events.1.desc:0 "[SCOPE.sCharacter('ls3_ruler_scope_1').GetFullName] issued the 'Bombard the Headquarters—My Big Character Poster,' signaling the official start of the Cultural Revolution movement."
line_struggle_3_events.1.f:0 "'The first Marxist big character poster in the country and the commentary by [SCOPE.GetRootScope.GetCountry.GetName] Daily commentator are so well written! Comrades, please reread this big character poster and the commentary. However, in more than fifty days, certain leading comrades from the central to local levels have gone against it, standing on the reactionary bourgeois stance, implementing bourgeois dictatorship, suppressing the vigorous Cultural Revolution movement of the proletariat, distorting right and wrong, confusing black and white, besieging revolutionary comrades, suppressing dissenting opinions, implementing white terror, thinking they are triumphant, strengthening the might of the bourgeoisie, extinguishing the spirit of the proletariat. How poisonous it is! Linked to the past rightist and pseudo-'left' but actually rightist erroneous tendencies, isn't this thought-provoking?'"
line_struggle_3_events.1.a:0 "Great chaos precedes great order!"

line_struggle_3_events.12.t:0 "Leftist Foreign Scholars Support Marxism-Leninism-Maoism"
line_struggle_3_events.12.d:0 "Leftist foreign scholars have had enough of capitalism and revisionism. They generally view Marxism-Leninism-Maoism and the Cultural Revolution as the forward direction for further social revolution, considering [SCOPE.GetRootScope.GetCountry.GetName] as a new beacon of human civilization."
line_struggle_3_events.12.f:0 "'In every country, the old bureaucratic centralism has encountered growing difficulties. Indifference of the masses, stagnant productivity, and economic stagnation—all these signs of crisis can be seen throughout the region. There are two possible reactions. One reaction is to launch a movement that the people in [SCOPE.GetRootScope.GetCountry.GetName] have given a specific meaning and called the Cultural Revolution: a comprehensive mobilization of the masses, raising the overall political consciousness, revitalizing the ideals of socialism, and letting producers themselves take on increasingly significant responsibilities at all levels of decision-making. The other reaction is an increasing reliance on market laws and profit incentives. In other socialist countries, no one, no party, and no group can make the first reaction. Not because those bureaucrats have any preference for capitalist methods, but because they cannot find any other way to preserve their power and privileges. The price they must pay is that, whether they know it or not, whether they like it or not, their country has to regress to the essentially capitalist path.' —Paul Sweezy"
line_struggle_3_events.12.a:0 "We are the new beacon!"

line_struggle_3_events.15.t:0 "Decisive Victory in the Cultural Revolution!"
line_struggle_3_events.15.d:0 "The Central Plenary Meeting approved the report on the investigation of the crimes of traitors, spies, and capitalist roaders like [SCOPE.sCharacter('will_killed_capitalist_roader').GetFullName]."
line_struggle_3_events.15.f:0 "This meeting considered the Cultural Revolution movement to have achieved a decisive victory; leaders of the capitalist road have been overthrown. Simultaneously, political opportunistic ultra-leftists seized control of propaganda and political power. The party constitution was also amended, revealing struggles and power struggles among the ultra-leftists."
line_struggle_3_events.15.a:0 "The capitalist road headquarters has collapsed, what's next?"
# 文化革命-第一阶段
je_line_struggle_3_1p:0 "Cultural Revolution - Phase One"
je_line_struggle_3_1p_reason:0 "In the first phase of the Cultural Revolution, there has been new innovative development on the economic and people's democratic fronts. On the political and ideological struggle front, it is a response to the attacks of the capitalist roaders. Please strive to complete the entry on basic completion of socialist modernization within ten years to ensure victory in the game."
je_line_struggle_3_1p_goal:0 "Wait for 3 years"

je_line_struggle_3_1p_commune:0 "Communal Autonomous Government"
je_line_struggle_3_1p_commune_reason:0 "A significant exploration of the Cultural Revolution in politics is that economic organizations composed of the masses not only participate in the management of economic activities but also directly obtain democratic political rights."
je_line_struggle_3_1p_commune_goal:0 "Wait for 2 years. Triggering the event after completion can change the law to Communal Autonomous Body."
line_struggle_3_events.13.t:0 "Revolutionary Committee Established!"
line_struggle_3_events.13.d:0 "The masses of [SCOPE.sState('communal_state').GetName] established the People's Commune of [SCOPE.sState('communal_state').GetName]."
line_struggle_3_events.13.f:0 "Upon the proposal of [SCOPE.sCharacter('ls3_ruler_scope_1').GetFullName], the People's Commune of [SCOPE.sState('communal_state').GetName] was renamed [SCOPE.sState('communal_state').GetName] Revolutionary Committee."
line_struggle_3_events.13.a:0 "A significant exploration of mass democracy!"

je_line_struggle_3_1p_communal_priciple:0 "Revolution in Industrial Organization"
je_line_struggle_3_1p_communal_priciple_reason:0 "A significant exploration of the Cultural Revolution in the economy is that the masses can democratically participate in the management of economic organizations, thereby achieving a socialist revolution in production relations."
je_line_struggle_3_1p_communal_priciple_goal:0 "Wait for 1 years. Triggering the event after completion can change the law to Workers' Democratic Plan."
line_struggle_3_events.14.t:0 "Establishment of Workers' Democratic Plan!"
line_struggle_3_events.14.d:0 "The worker masses of [SCOPE.sState('coop_state').GetName] [SCOPE.sBuilding('coop_building').GetName] promulgated the constitution of [SCOPE.sState('coop_state').GetName] [SCOPE.sBuilding('coop_building').GetName] and it was emulated and studied nationwide."
line_struggle_3_events.14.f:0 "In the past, bureaucrats formulated production plans: targets were imposed from above, cadres were embarrassed, and the masses watched. Last year, the worker masses, with a high sense of ownership, discussed the plan from the bottom up, fully unleashing revolutionary enthusiasm while leaving room for flexibility. As a result, the annual production tasks were completed ahead of schedule. The working class took control of the management of enterprises, fully unleashing the revolutionary enthusiasm and creativity of the masses."
line_struggle_3_events.14.a:0 "Revolution in [SCOPE.GetRootScope.GetCountry.GetName]'s production relations and industrial organization!"

lzy_buff_CP_authority_add:0 "Promotion of Workers' Democratic Plan nationwide"

# 文化革命-第二阶段
je_line_struggle_3_2p:0 "Cultural Revolution - Phase Two"
je_line_struggle_3_2p_reason:0 "In the second phase of the Cultural Revolution, power struggles among the prevailing ultra-left opportunists begin. Some leaders are brewing conspiracies to seize power. Please strive to complete the entry on basic completion of socialist modernization within ten years to ensure victory in the game."
je_line_struggle_3_2p_goal:0 "Wait for 2 years"

line_struggle_3_events.30.t:0 "Conspiracy to Seize Power"
line_struggle_3_events.30.desc:0 "The counter-revolutionary group led by [SCOPE.sCharacter('will_killed_ultraleftist').GetFullName] attempted to assassinate [SCOPE.sCharacter('ls3_ruler_scope_1').GetFullName] and seize political power. Fortunately, this conspiracy was timely thwarted."
line_struggle_3_events.30.f:0 "After the start of the Cultural Revolution, he, under the banner of 'holding high' and 'closely following,' deceived everyone, openly and secretly, practiced double-dealing, formed cliques, colluded with other ultra-leftists, formed a counter-revolutionary group, premeditatedly slandered and persecuted party and state leaders, conspiring to seize the highest power of the party and the state."
line_struggle_3_events.30.a:0 "Fortunately, the conspiracy was uncovered."

# 文化革命-第三阶段
je_line_struggle_3_3p:0 "Cultural Revolution - Phase Three"
je_line_struggle_3_3p_reason:0 "In the third phase of the Cultural Revolution, the prevailing ultra-left opportunists focus on seizing power, neglecting the construction of productive forces and production relations. However, if we can achieve sufficiently high achievements in socialist construction, we can convince everyone to wholeheartedly support the transition to a developed communist society without the need to go through an intermediate stage of a market economy. Please strive to complete the entry on basic completion of socialist modernization within ten years to ensure victory in the game."
# 文化革命-第三阶段
je_line_struggle_3_3p_goal:0 "Wait for 5 years"
custom_loc_end_je_basic_modernization:0 "Complete the 'Basic Achievement of Socialist Modernization' log entry and its settlement event"
custom_loc_not_end_je_basic_modernization:0 "Not completed the 'Basic Achievement of Socialist Modernization' log entry and its settlement event"
line_struggle_3_events.40.t:0 "Cultural Revolution Victory!"
line_struggle_3_events.40.desc:0 "We have achieved a stable socialist way in both political and economic fields, with remarkable achievements that capitalism cannot reach, such as common prosperity, tremendous development of productive forces, and a thorough transformation of production relations and superstructure."
line_struggle_3_events.40.f:0 "Whether you believe in the orthodox Marxist-Leninists who say, 'Productive forces play a decisive role, and production relations play a dominant role,' or the production relations determine everything believers who believe that the development stage of productive forces determines ownership, both recognize that the current productive forces and production relations are mutually adaptive and the most advanced. With the greatly developed level of productive forces and after experiencing the mass self-liberation movement, communism is no longer a distant ideal but an imminent reality!"
line_struggle_3_events.40.a:0 "Cultural Revolution Victory!"

line_struggle_3_events.41.t:0 "Cultural Revolution Victory!"
line_struggle_3_events.41.desc:0 "With the death of [SCOPE.sCharacter('ls3_ruler_scope_2').GetFullName], ultra-leftist [SCOPE.sCharacter('will_killed_ultraleftist_2').GetFullName] attempted a coup to overthrow the central government, but this was thwarted by the new chairman, [SCOPE.sCharacter('ls3_ruler_scope_1').GetFullName]."
line_struggle_3_events.41.f:0 "These ten years have brought great setbacks to our economic development. Reform and opening up are necessary to achieve socialist modernization and common prosperity."
line_struggle_3_events.41.a:0 "Emancipate the mind, seek truth from facts!"


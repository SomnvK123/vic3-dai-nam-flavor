sino_event.137.t: "The Spread of Marxism"
sino_event.137.d: "The October Revolution's call against imperialism deeply resonated with the Chinese people, who were severely oppressed by imperialist powers. This drove progressive Chinese individuals to lean towards socialism, prompting them to study the Marxist doctrines that guided the October Revolution. Gradually, researching and promoting Marxism and socialism became mainstream among China's intellectual elites."
sino_event.137.f: "The October Revolution proclaimed to the world that a new social system had transformed from an ideal into a reality, paving the way for humanity to explore socialist paths. It spread Marxism-Leninism worldwide, reaching [concept_russian]'s neighboring China. The October Revolution inspired progressive individuals in China and worldwide to reconsider their national fates through the proletarian worldview."
sino_event.137.a: "“The October Revolution brought us Marxism-Leninism like a cannon shot.” —Mao Zedong"
sino_event.137.b: "This idea is too radical!"
sino_event.121_tt: "#v Each successful reform will advance the log's progress, but further enrage the [SCOPE.gsInterestGroup('landowner_ig').GetName]#!"
sino_event.121_tt_reason: "The leader of [SCOPE.gsInterestGroup('landowner_ig').GetName], [SCOPE.sCharacter('landowner_ig_general').GetFullName], has launched a #v coup in the court!#!"
je_conquer_japan_tt: "We swear to rally troops and conquer Japan, to avenge past humiliation and secure peace for China."
je_Pentecostal_Variation: "Reform and Modernization"
je_Pentecostal_Variation_tt: "We swear to reform and modernize, to revitalize China, and to live up to the trust of the people."
je_Pentecostal_Variation_reason: "I, a humble servant, stand in awe of the imperial grace bestowed upon my family for generations. Today, as I receive this daunting task, I am filled with fear and trepidation. Allow me to present my humble views to extol the Emperor and address the urgency of reform.\n\nIn the past, our founding Emperor #yellow Huang Taiji#! established the empire with exceptional military and civil achievements. Now, with His Majesty at the helm, the nation has long enjoyed peace and prosperity. However, the world is ever-changing: corruption plagues governance, public discontent boils over internally, while formidable enemies surround us externally. This is truly a moment of peril. I am overcome with anxiety!\n\nThe great and wise [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] of the [SCOPE.sCountry('chi_scope').GetAdjective] Empire, the son of heaven and parent of all people, has insight beyond compare. Surely His Majesty is well aware of the nation's dire straits, yet his benevolence restrains him from waging wars that would bring hardship upon the populace. Thus, His Majesty bears these burdens to pursue reform and strength. Such wisdom and courage are unparalleled.\n\nIt is said, 'When the way is blocked, change brings continuity.' Our empire faces both internal and external crises, and only reform can ensure survival. Thus, His Majesty has resolved to revamp governance to stabilize the populace, and to promote education to strengthen the nation. These are all measures of foresight taken for the benefit of the world.\n\nAlthough I am unworthy, I pledge my life to serve the nation and follow His Majesty to overcome the country's difficulties. May His Majesty enjoy eternal health and longevity, and may our reforms succeed, ensuring the prosperity of the empire. I am overwhelmed with gratitude!\n\nNow, as I write this with tears in my eyes, I know not what else to say. I can only hope His Majesty discerns my sincere loyalty. Humbly, I kneel and submit this petition to the imperial court."
je_Pentecostal_Variation_goal: "Complete four rounds of reform"
je_Pentecostal_Variation_vote: "Reform: Government Reorganization"
je_Pentecostal_Variation_vote_reason: "China's government is deeply entrenched in corruption and inefficiency, leading to the decline of national power and people's suffering. Our goal in modernization and reform is to save the nation and rejuvenate China. Without government reorganization, there can be no new beginning."
je_Pentecostal_Variation_democracy: "Reform: Freedom of Speech"
je_Pentecostal_Variation_democracy_reason: "Freedom of speech is not for personal gain but for the public good. We intend to use this opportunity to allow people to express themselves freely, to vent their frustrations, and to convey their feelings. Through this, public sentiment can be understood, and popular will can be addressed, enabling us to observe the nation's rise or fall."
je_Pentecostal_Variation_resource: "Reform: Industrial and Mining Development"
je_Pentecostal_Variation_resource_reason: "Born and raised in this land, I have witnessed the hardships of the Qing dynasty as national strength declines and industries wither. The root of the problem lies in weak industries and untapped mineral resources. Therefore, during the reform and modernization process, we advocate for the vigorous development of industries and mining to enrich the nation and strengthen the people."
je_Pentecostal_Variation_army: "Reform: Modern Military"
je_Pentecostal_Variation_army_reason: "We seek this opportunity to update our equipment, boost morale, and enhance the military's combat effectiveness to safeguard national security. Thus, foreign adversaries will hesitate to provoke, ensuring the peace and prosperity of the nation and its people."

guangxu_is_alive_tt: "#yellow Emperor Guangxu#! has ascended the throne"
guangxu_button: "#yellow Emperor Guangxu#!'s Conspiracy with the Reformers"
guangxu_button_desc: "#yellow Empress Dowager Cixi#! must be removed for reform to succeed."

sino_event.138.t: "[ROOT.GetCountry.GetRuler.GetFirstName]'s Reform"
sino_event.138.d: "Born in the Qing dynasty and having experienced its ups and downs, we have witnessed national decline and public anxiety. However, since [ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] resolved to reform for strength, we too are inspired to join in the effort. Now that the reform has borne fruit, the nation prospers, and the people are at peace. This is truly the blessing of heaven and the result of [ROOT.GetCountry.GetRuler.GetFirstName]'s wisdom."
sino_event.138.f: "In the past, the nation was riddled with longstanding problems, and much work was left undone. [ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] displayed extraordinary wisdom, discerning that reform was the only path to survival. Bold and resolute, he implemented new policies, undeterred by hardship or fatigue. We followed suit, striving together for reform.\n\nNow, with the success of the reform, the nation is revitalized. Politics are clean, officials are honest, the people live in peace, the treasury is abundant, and the military is strong. Foreign adversaries dare not provoke, and the nation is secure. All this is owed to the wisdom of [ROOT.GetCountry.GetRuler.GetFirstName], and we share in the blessings of peace."
sino_event.138.a: "May [ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]'s virtues endure forever, and may the Qing dynasty's fortune never decline."
je_difficult_china_no_tt: "Remove the #o Grand Council#! log"
 sino_event.139.t: "[SCOPE.GetRootScope.GetCountry.GetName] New Modern Army"
sino_event.139.d: "In the past, [ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] was wise and farsighted, discerning the state of the world and understanding that the military is the cornerstone of the nation. Without modernization, the army could not repel enemies. His determination to reform and strengthen the country required the establishment of a modern army to secure the nation."
sino_event.139.f: "He deeply understood the importance of the military and thus sought to create a modern army for the long-term security of the state. We are willing to follow his lead, working together to plan for national reform and modernization.\n\nThe creation of a modern army is one way to achieve this aspiration. We pledge to exert all efforts to serve the country and bring comfort to the people's hearts."
sino_event.139.a: "Our navy is invincible!"
sino_event.139.b: "Our army is undefeated!"

sino_event.140.t: "#yellow Emperor Guangxu#![Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] and the Reformists' Conspiracy"
sino_event.140.d: "Rumors have spread throughout the Beijing-Tianjin area that #yellow Empress Dowager Cixi#! plans to depose #yellow Emperor Guangxu#!. Upon hearing this, #yellow Guangxu#! became visibly alarmed and immediately issued a secret edict to the reformists seeking their 'help.' The reformists vowed to save the reformist cause, eliminate #yellow Empress Dowager Cixi#! as the greatest obstacle to reform, and restore authority to #yellow Guangxu#!."
sino_event.140.f: "#o Kang Youwei#! and #o Liang Qichao#! quickly devised two plans to deal with #yellow Empress Dowager Cixi#!.\nThe first plan involved leveraging the influence of Western [concept_great_power]s to pressure #yellow Cixi#! into stepping down. #o Kang Youwei#! personally negotiated, but the British embassy in China expressed satisfaction with the current status quo and refused to intervene in the Qing court's internal affairs.\nThen, he turned to the Japanese embassy and met with #yellow Ito Hirobumi#!. However, #yellow Ito#! only offered polite sympathy without genuine interest. With the failure of the first plan, #o Kang Youwei#! swiftly implemented the second: mobilizing troops to surround the Summer Palace and execute #yellow Empress Dowager Cixi#!."
sino_event.140.a: "Will we succeed? #yellow Guangxu#![Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]? Surely, we will."

sino_event.141.t: "The Assassination of Empress Dowager Cixi"
sino_event.141.d: "Early the next morning, [SCOPE.sCharacter('ecchi_chi_cixi_character_benefactor').GetFullName]'s corpse was discovered at the Summer Palace."
sino_event.141.f: "Our emperor, #yellow Guangxu#!, wise and naturally gifted, strides like a dragon and tiger, ruling over all nations. From his youth, he aspired to reform and strengthen the country. Fully aware of the nation's decline, he recognized that reform was the only path to survival and resolutely implemented new policies to save the nation from peril.\n\nOur emperor's brilliance illuminates the world. He understands the necessity of openness to connect with the people, education to enlighten the populace, and reform to strengthen the nation. His calls for change were met with widespread support, inspiring joint efforts for reform. Despite numerous obstacles, including opposition from Empress Dowager Cixi and conservative forces, the emperor remained steadfast and unyielding, ultimately spreading the winds of reform throughout the Qing Empire."
sino_event.141.a: "Long live #yellow Guangxu#![Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]!"

sino_event.142.t: "[SCOPE.GetRootScope.GetCountry.GetName] Superior Industry and Mining"
sino_event.142.d: "The current emperor, wise and astute, perceives the essentials of the world. He understands that industry is the foundation of the nation and that mineral resources are the source of wealth and power. His determination to reform and strengthen the nation hinges upon industrial and mining development."
sino_event.142.f: "The emperor's vision is to revitalize the Qing Empire, ensuring national prosperity and the people's well-being. Recognizing the critical importance of industry and the value of mineral resources, he seeks to develop them for the country's long-term benefit. We are committed to following his lead, working together to realize these goals and drive reform."
sino_event.142.a: "We act with a public heart and unwavering resolve."

sino_event.143.t: "[SCOPE.GetRootScope.GetCountry.GetName] Honest Government"
sino_event.143.d: "He understands deeply the longstanding corruption within the government and seeks to overhaul it to revitalize the nation's prestige."
sino_event.143.f: "Reforming the government is not for personal gain but for public welfare. We aim to seize this opportunity to eliminate the old and establish the new, ensuring the nation's prosperity and the people's peace. The emperor's aspirations are our aspirations; his heart is our heart."
sino_event.143.a: "We pledge diligence and determination, ready to sacrifice our lives if necessary."

sino_event.144.t: "[SCOPE.GetRootScope.GetCountry.GetName] Freedom of Speech"
sino_event.144.d: "In the past, our great Qing Empire was closed off from the world, stifling public discourse and alienating the people's hearts. Since opening up to freedom of speech, the populace rejoices, industries thrive, and national strength grows daily. This is the Qing Empire's fortune and the people's blessing."
sino_event.144.f: "Today, in the Qing Empire, ministers in the court freely propose strategies, and citizens in the streets express their opinions openly. This is the new atmosphere of the Qing Empire, a reflection of its reformist spirit. We take pride in this progress and are honored to contribute.\n\nFreedom of speech benefits not only the people but also the nation. Public sentiment determines the country's fate. By aligning with the people's will and embracing open discourse, the Qing Empire gathers collective wisdom to devise sound policies, ensuring national strength and public well-being."
sino_event.144.a: "Thus it is said: public sentiment can be discerned, public will can be fulfilled, and the nation's rise or fall can be observed through this."

EFFECTS_ON_ACCEPTANCE_law_IJ_rights: "#tooltippable #tooltip:$BREAKDOWN_TAG$ Granting rights to the lowest-ranking people is not an easy task, but it can be managed#!#!"
je_korean_restoration_yangjeon_a:0 "Nationwide Large-Scale Land Survey Implementation"
je_korean_restoration_yangjeon_a_reason:3 "There have been various reforms in the tax collection system in Joseon, and the tax standards have originally been diverse. However, for various reasons, taxes have been collected for a long time using a unified minimum tax rate.\nHowever, unlike in the era of ancient sages, today, with the collapse of various socio-political systems, this structure is no longer sustainable. Taxes are not being collected where they should be, and those who are unable to pay taxes are burdened with the costs left by others, creating a vicious cycle.\nTherefore, a land survey project called 'Yangjeon' was initiated to restore the disordered tax system. Due to the scale of the project, it will take a long time to complete (at least 7 years).\nHowever, existing vested interests will not easily relinquish their benefits, and during the transitional period of tax normalization, the common people will inevitably bear additional tax burdens."
je_korean_restoration_yangjeon_a_goal:0 "Wait for the completion of the new land survey project, or use decisions to shorten the duration."

je_korean_restoration_yangjeon_b:0 "Gradual Land Survey Implementation by Region"
je_korean_restoration_yangjeon_b_reason:3 "There have been various reforms in the tax collection system in Joseon, and the tax standards have originally been diverse. However, for various reasons, taxes have been collected for a long time using a unified minimum tax rate.\nHowever, unlike in the era of ancient sages, today, with the collapse of various socio-political systems, this structure is no longer sustainable. Taxes are not being collected where they should be, and those who are unable to pay taxes are burdened with the costs left by others, creating a vicious cycle.\nTherefore, a land survey project called 'Yangjeon' was initiated to restore the disordered tax system. Due to the scale of the project, it will take a long time to complete (at least 4 years).\nHowever, existing vested interests will not easily relinquish their benefits, and during the transitional period of tax normalization, the common people will inevitably bear additional tax burdens."
je_korean_restoration_yangjeon_b_goal:0 "Wait for the completion of the new land survey project, or use decisions to shorten the duration."

lia_jfp_deci_yangjeon:0 "Increase Land Survey Budget"
lia_jfp_deci_yangjeon_desc:1 "Once per quarter, additional funds can be allocated to the ongoing land survey project to accelerate the process.\nThe required amount is determined by the national economic strength, and the costs are not negligible, so find a balance between speed and the national treasury."
 sino_event.93.t: "It seems like you have switched countries"
 sino_event.93.d: "If you switch countries, it will result in your original country receiving aibuff"
 sino_event.93.f: "Don't worry, I will help you remove it"
 sino_event.93.a: "This buff was never meant for you"

 sino_event.149.t:0 "The Third Napoleon and the Second Empire?"
sino_event.149.d:0 "On November 7, 1852, the Senate of [SCOPE.sCountry('mex_will_hit_scope').GetName] issued a decree suggesting the restoration of the monarchy. A subsequent referendum showed overwhelming support. On December 2, [SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName] announced the restoration of the empire, and [SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName] became the Emperor of France, taking the title Napoleon III."
sino_event.149.f:0 "“However, there are still some concerns that need to be addressed! There is still a sense of distrust, leading some to believe that the empire means war, but in my view, the empire means peace! France desires peace, and if this vision is realized, the world will be more peaceful. War is not for fun, but out of necessity. In this ever-changing era, where good and bad are intertwined, we can honestly say: ‘Whoever seeks to reignite the flames of war in Europe will bring trouble upon themselves!’” —Louis Napoleon Bonaparte"
sino_event.149.a:0 "May he uphold his uncle’s legacy!"
sino_event.149.b:0 "An elected [Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')]? Interesting"
sino_event.150.t:0 "The Austro-Hungarian Compromise and the Dual Empire?"
sino_event.150.d:0 "In 1867, to prevent [concept_hungary_kindom] from seeking independence again, [SCOPE.sCharacter('aus_king_scope').GetFirstName] signed the Austrian-Hungarian Compromise, transforming the Austro-Hungarian Empire. [concept_hungary_kindom] gained a high degree of autonomy, but the Austrian monarch still held the title of King of Hungary, thus forming a dual monarchy."
sino_event.150.f:0 "The Austro-Hungarian Empire was ruled by the Habsburg dynasty. [SCOPE.sCountry('aus_scope').GetName] consisted of one monarch (the Emperor of Austria and the King of Hungary), two nations, and three governments. The two countries were independent constitutional nations in domestic matters, Austria and Hungary, but both gave up their sovereignty in foreign policy, military, and financial matters."
sino_event.150.a:0 "[SCOPE.sCountry('aus_scope').GetName] was formally known as the Kingdom and Territory represented by the Imperial Parliament and the Kingdom of St. Stephen's Crown of Hungary!"
sino_event.151.t:0 "The Revival of the Ottoman Empire?"
sino_event.151.d:0 "According to reliable information from our Balkan ambassador, [SCOPE.sCountry('tur_scope').GetName][Concept('concept_ruler', '$RULER_TITLE_SULTAN$')] has announced the completion of the #o Tanzimat#!"
sino_event.151.f:0 "“We firmly believe that Allah will grant us help in response to the call of our prophet. We are focused on creating new regulations to help the regions of the Ottoman Empire prosper.” —[SCOPE.sCharacter('tur_king_scope').GetFirstName]"
sino_event.151.a:0 "This is a new [SCOPE.sCountry('tur_scope').GetName] that aims to bring prosperity to religion, government, the nation, and the people."
sino_event.152.t:0 "The Second Egyptian-Ottoman Crisis?"
sino_event.152.d:0 "According to reliable information from our Arabian ambassador, [SCOPE.sCountry('tur_scope').GetName][Concept('concept_ruler', '$RULER_TITLE_SULTAN$')] intends to recover the lost territories, with troops stationed in large numbers at the Egyptian border."
sino_event.152.f:0 "In May 1838, [SCOPE.sCharacter('eqy_king_scope').GetFirstName] ceased paying tribute to [Concept('concept_ruler', '$RULER_TITLE_SULTAN$')] and declared independence. [SCOPE.sCountry('gbr_scope').GetName] was the first to oppose this, and in August, [SCOPE.sCountry('gbr_scope').GetName] signed a commercial treaty with [SCOPE.sCountry('tur_scope').GetAdjective] against [SCOPE.sCountry('eqy_scope').GetAdjective], abolishing the monopoly system within the empire. [SCOPE.sCountry('fra_scope').GetName] also signed a similar treaty with [SCOPE.sCountry('eqy_scope').GetAdjective] for its commercial interests. [SCOPE.sCharacter('eqy_king_scope').GetFirstName] foresaw that once these treaties took effect, the economy would collapse, so he opposed them strongly. [Concept('concept_ruler', '$RULER_TITLE_SULTAN$')] seized the opportunity to violate the Kütahya Agreement, and the Second Ottoman-Egyptian War broke out."
sino_event.152.a:0 "We will announce our intervention in the affairs of [SCOPE.sCountry('tur_scope').GetName] and [SCOPE.sCountry('eqy_scope').GetName]."
sino_event.152.b:0 "Let [SCOPE.sCountry('tur_scope').GetName] handle it themselves."
sino_event.153.t: "Berlin-Tokyo-Rome Axis of the Three Countries"
sino_event.153.d: "[SCOPE.sCountry('ger_scope').GetName], [SCOPE.sCountry('ita_scope').GetName], and [SCOPE.sCountry('jap_scope').GetName] held multiple negotiations in Berlin, Rome, and Tokyo to take measures and signed this agreement."
sino_event.153.f: "The three countries recognized each other's 'leadership' in Europe and Asia; if one of them is attacked by a country not involved in the Sino-Japanese war or the European war, they will provide political, economic, and military assistance to each other."
sino_event.153.a: "We will announce our involvement in the affairs of [SCOPE.sCountry('ger_scope').GetAdjective], [SCOPE.sCountry('ita_scope').GetAdjective], and [SCOPE.sCountry('jap_scope').GetAdjective]."

broken_ship: "The Pacific Fleet has been severely damaged."

sino_event.154.t: "Invasion of Somaliland"
sino_event.154.d: "[SCOPE.sCountry('ita_scope').GetName] and [SCOPE.sCountry('eth_scope').GetName] signed the 'Uchali Treaty.'"
sino_event.154.f: "[SCOPE.sCountry('eth_scope').GetName] under [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] Haile Selassie maintained a friendly relationship with [SCOPE.sCountry('ita_scope').GetName]. After Haile Selassie died, [SCOPE.sCountry('ita_scope').GetName] signed this treaty with Menelik II. The main contents include: Menelik II recognized [SCOPE.sCountry('ita_scope').GetAdjective] sovereignty over most of the Eritrean Plateau, and [SCOPE.sCountry('ita_scope').GetAdjective] recognized Menelik II as Emperor of [SCOPE.sCountry('eth_scope').GetName], allowing him to import weapons and munitions through [SCOPE.sCountry('ita_scope').GetAdjective] territories. However, disputes arose over Article 17, as the Amharic version stated that Menelik II could interact with other countries at his discretion, while the Italian text stated that such diplomatic interactions must be through the Italian government."
sino_event.154.a: "Without my permission,[SCOPE.sCharacter('crisis_scope_2').GetLastName] dare to attempt to dominate East Africa?"
sino_event.154.b: "We have no interest in this."

sino_event.155.t: "The Attack on Pearl Harbor"
sino_event.155.d: "[SCOPE.sCountry('usa_scope').GetName] was attacked by [SCOPE.sCountry('jap_scope').GetName] forces at Pearl Harbor in [SCOPE.sState('beautiful_state').GetName]!"
sino_event.155.f: "[SCOPE.sCountry('usa_scope').GetName] was subjected to a premeditated surprise attack by [SCOPE.sCountry('jap_scope').GetName]'s air and naval forces. Before this, the U.S. and Japan were in a state of peace and were negotiating with Japan's government and Emperor to maintain peace in the Pacific region. Japan’s air forces bombed Pearl Harbor in Hawaii. After one hour of bombing, the Japanese ambassador and his colleagues still submitted an official reply to the U.S. Secretary of State, claiming that there was no need to continue negotiations, but without threatening or implying that they would wage war. The distance of [SCOPE.sState('beautiful_state').GetName] from Japan indicates that the attack had been planned for days or even weeks."
sino_event.155.a: "I request Congress to declare: due to Japan's cowardly attack on our country, [SCOPE.sCountry('usa_scope').GetName] and [SCOPE.sCountry('jap_scope').GetName] are now at war."

sino_event.156.t: "A Man Who Avoided Conscription"
sino_event.156.d: "#yellow Friedrich Trump#! - A man born in the small Bavarian town of Kallstadt, [SCOPE.sCountry('ger_scope').GetName], immigrated to [SCOPE.sCountry('usa_scope').GetName] to escape conscription!"
sino_event.156.f: "When he arrived, he found a barbershop hiring German speakers, so he chose to work as a barber in [SCOPE.sState('beautiful_state').GetName]."
sino_event.156.a: "May he make his first fortune!"

sino_event.157.t: "A Man Who Avoided Conscription"
sino_event.157.d: "#yellow Friedrich Trump#! - A man born in the small Bavarian town of Kallstadt, [SCOPE.sCountry('ger_scope').GetName], immigrated to [SCOPE.sCountry('usa_scope').GetName] to escape conscription in 1885!"
sino_event.157.f: "This year, he returned to [SCOPE.sCountry('ger_scope').GetName] with 80,000 marks earned in America, along with his wife Elizabeth, planning to settle there permanently. However, he was soon discovered by the Bavarian Ministry of the Interior for having a history of dodging conscription."
sino_event.157.a: "Cancel his citizenship and kick him out!"

sino_event.158.t: "A Man Who Took a Different Path"
sino_event.158.d: "#yellow Friedrich Trump#! - The man who previously worked as a barber in [SCOPE.sState('beautiful_state').GetName] decided to go to the American Midwest."
sino_event.158.f: "He opened an underground brothel along the main road for gold miners in the West, quickly accumulating seed money."
sino_event.158.a: "Good luck to him."

sino_event.160.t: "First Italo-Ethiopian War"
sino_event.160.d: "[SCOPE.sCountry('eth_scope').GetName] government refused to accept [SCOPE.sCountry('ita_scope').GetName]'s protection. [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] Menelik II notified the Italian government that from the next year, he would no longer fulfill any of the rights or obligations of the 'Uchali Treaty.'"
sino_event.160.f: "[SCOPE.sCountry('ita_scope').GetName] used this as an excuse to refuse reconciliation and suddenly launched an invasion today, aiming to expand territory, alleviate domestic economic pressure, and establish hegemony in the Mediterranean and East Africa."
sino_event.160.a: "Damn it, [SCOPE.sCountry('ita_scope').GetName], this is blatant imperialism! I request Congress to immediately allocate funds to support [SCOPE.sCountry('eth_scope').GetName]!"
sino_event.160.b: "I’m already overwhelmed with domestic affairs!"

sino_event.161.t: "A Man Who Dodged the World War But Didn't Dodge the Flu"
sino_event.161.d: "#yellow Friedrich Trump#! - Died from the flu at the age of 49."
sino_event.161.f: "Before his death, he used the money earned from his brothel to buy five plots of land in Queens, [SCOPE.sState('beautiful_state').GetName], which became the key to his family's rise."
sino_event.161.a: "Soon, his family will become famous, and a hundred years later, his grandson, #yellow Donald Trump#!, will become the President of [SCOPE.sCountry('usa_scope').GetName]."

sino_event.162.t: "Italo-Turkish War"
sino_event.162.d: "The war between [SCOPE.sCountry('ita_scope').GetName] and [SCOPE.sCountry('tur_scope').GetName] has begun."
sino_event.162.f: "[SCOPE.sCountry('tur_scope').GetName] is like an elderly man on his last legs; we just need to give him a light push, and he will collapse."
sino_event.162.a: "The Ottoman Empire is growing weaker, and [SCOPE.sCountry('ita_scope').GetName], as a newly established regime, has no colonies. There is a huge opportunity to acquire these colonies from the Ottomans by taking back Libya."

sino_event.163.t: "[SCOPE.sCountry('usa_scope').GetName] and [SCOPE.sCountry('chi_scope').GetName] Mutual Assistance Pact!"
sino_event.163.d: "[SCOPE.sCountry('usa_scope').GetName] supports [SCOPE.sCountry('chi_scope').GetName] in resisting the invasion of [SCOPE.sCountry('jap_scope').GetName]!"
sino_event.163.f: "The following terms are agreed upon by the undersigned representatives, authorized by their respective governments:\n\nArticle 1: The [SCOPE.sCountry('usa_scope').GetName] government will continue to provide defense goods, services, and intelligence to the [SCOPE.sCountry('chi_scope').GetName] government as authorized by the U.S. President.\n\nArticle 2: The [SCOPE.sCountry('chi_scope').GetName] government will assist [SCOPE.sCountry('usa_scope').GetName] in its defense and strengthening efforts, providing goods, services, facilities, or intelligence as they can."
sino_event.163.a: "Signed by [SCOPE.sCountry('chi_scope').GetName] Foreign Minister: #yellow Song Zhiwen#! and [SCOPE.sCountry('usa_scope').GetName] government representative: Secretary of State #yellow Hull#!"

sino_event.164.t: "[SCOPE.sCountry('usa_scope').GetName], [SCOPE.sCountry('chi_scope').GetName], and [SCOPE.sCountry('gbr_scope').GetName] Triple Alliance Declaration"
sino_event.164.d: "This is the only war, where wherever England fights, the goal of the British war is to destroy the aggressive Japan."
sino_event.164.f: "This is the only war, where wherever England fights, the goal of the British war is to destroy the aggressive Japan."
sino_event.164.a: "Signed by [SCOPE.sCountry('chi_scope').GetName] Foreign Minister: #yellow Song Zhiwen#! and [SCOPE.sCountry('gbr_scope').GetName] government representative: Prime Minister #yellow Churchill#!"

sino_event.165.t: "The 9/18 Incident!"
sino_event.165.d: "The [SCOPE.sCulture('chinese_culture').GetName] is in its most dangerous time!"
sino_event.165.f: "On the night of September 18, 1931, around 10 p.m., [SCOPE.sCountry('jap_scope').GetName]'s Kwantung Army under Captain Kawashima and his squad blew up a section of the South Manchuria Railway near Liuhe Lake, 800 meters south of the Northern Barracks in Shenyang.\nThey staged a fake scene, placing three bodies in Chinese military uniforms to falsely accuse Chinese soldiers of sabotaging the railway.\nZhang Xueliang ordered the Northeast Army not to resist, put their guns in the warehouse, and sacrificed their lives for the country."
sino_event.165.a: "Ten thousand youth, ten thousand soldiers; every inch of land, every drop of blood!"

sino_event.167.t:0 "[SCOPE.sCountry('kor_scope').GetAdjective] Emperor?"
sino_event.167.d:0 "Emperor Gojong fabricated public support through orchestrated petitions from officials and civilians, creating the illusion of 'the will of the military and people'. Simultaneously, he reconstructed historical narratives using Confucian 'Mandate of Heaven' theory, claiming legitimacy from Dangun and Gija's 'Three Han Unification' while rejecting Joseon's vassal status under Ming suzerainty."
sino_event.167.f:0 "Gojong performed the Heaven Worship Ceremony at Hwanggungu Altar in Hanseong, ascending the throne following rites from <i>The Collected Statutes of the Ming Dynasty</i>. The nation was renamed [SCOPE.sCountry('kor_scope').GetName] with the era name 'Gwangmu' (taken from Emperor Guangwu of Han, symbolizing revival).\nIn 1899, <i>The National System of the Korean Empire</i> was promulgated, establishing 'eternal autocratic rule' where the Emperor concentrated military command, legislative, and executive powers while abolishing representative institutions."
sino_event.167.a:0 "We will recognize this East Asian state"
sino_event.167.b:0 "This violates all natural order!"

sino_event.168.t:0 "Spanish Civil War"
sino_event.168.a:0 "We will support [SCOPE.sCountry('spa_scope').GetAdjective]"
sino_event.168.b:0 "We will recognize [SCOPE.sCountry('car_scope').GetAdjective]"

sino_event.169.t:0 "Spanish-Latin American Accord"
sino_event.169.d:0 "Madrid and Buenos Aires reached a historic agreement to reconstruct Atlantic trade networks using silver bonds"
sino_event.169.f:0 "The 1860 <i>Cádiz Treaty</i> first incorporated Spanish railway gauge standards (1668mm) into Latin American infrastructure norms. Chilean saltpeter and Cuban sugar achieved transoceanic pricing through Barcelona Futures Exchange. Mexican exiled President Juárez authorized transferring 15% of Guanajuato silver mine revenues to the newly established 'Iberian Development Bank' for building the Buenos Aires-Lima trans-American telegraph network. Peruvian writer Palma wrote in <i>El Comercio de Lima</i>: 'This is a new Armada woven with rails and cables'"
sino_event.169.a:0 "This benefits both Iberia and Latin America"

ger_lot_money_tt:0 "[SCOPE.sCountry('ger_scope').GetName] will gain substantial #v reparations#! from [SCOPE.sCountry('fra_scope').GetName]"
je_Spanish_global_empire_tt:0 "God save our great [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][SCOPE.sCharacter('spa_ruler_scope').GetFirstName]!"
je_iberia_empire_ruler_tt:0 "Submit to our glorious [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][SCOPE.sCharacter('spa_ruler_scope').GetFirstName]!"

gov_kor_empire: "Korean Empire" 

 ming_events.27.t:0 "Land Hegemony"
 ming_events.27.d:0 "We already have a huge land army that can shake the whole world, and they are enough to support our domination of the whole world."
 ming_events.27.f:0 "The sun is rising on the empire."
 ming_events.27.a:0 "Our eyes look to the continent."
 
 ming_events.28.t:0 "Hegemony of the seas"
 ming_events.28.d:0 "We already have an invincible fleet that can shake the whole world, and they are enough to support our domination of all the great oceans."
 ming_events.28.f:0 "The empire's seas are endless."
 ming_events.28.a:0 "Our eyes look to the deep sea."
chi_tib_decision:0 "Reiterate the Provisional Agreement for the Peaceful Liberation of Tibet"
chi_tib_decision_desc:0 "The 29 Articles of the Provisional Agreement for the Peaceful Liberation of Tibet provide detailed regulations regarding Tibet's religious affairs, foreign affairs, military, administration, and judiciary."
kuyedao_decision:0 "Reaffirm the Treaty of Nebuchu"
kuyedao_decision_desc:0 "According to the Treaty of Nebuchu, all areas south of the Outer Khingan Mountains and the extension of the Udi River belong to the territory of the Qing Dynasty"


ecchi_Kai-shek:0 "Kai-shek"
ecchi_Zedong:0 "Zedong"
ideology_china_reformer:0 "Chinese reformist"
ideology_china_reformer_desc:0 "This group is deeply influenced by the idea of saving the nation from extinction and striving for survival. It is a reformist movement in China that advocates learning from the West, promoting science and culture, reforming the political and educational systems, and developing bourgeois reform movements in agriculture, industry, and commerce."
Ryukyu:0 "Ryukyu"
Ryukyu_decision:0 "Ryukyu, oh Ryukyu"
Ryukyu_decision_desc:0 "Let Ryukyu be the Ryukyu of Ryukyu people"

rki_alive:0 "Help #yellow #b Ryukyu Kingdom#! regain independence and at least maintain #green #b friendly#!#! relations"
rki_no:0 "Relations with[SCOPE.sCountry('jap_scope').GetName]are too good or the #yellow #b Ryukyu, oh Ryukyu#!#! journal is not completed by 1870"
rki_in_china:0 "Ryukyu people choose to join China!"
rki_will_in_china:0 "The Ryukyu Islands will not be the cultural homeland of Yamato. The Ryukyu people will step onto the stage of history with a new look. In a few years, we can let the Ryukyu people decide whether to remain independent or join China."
rki_modifier:0 "Ryukyu Renaissance"
china_borders.6.t:0 "Ryukyu Restoration"
china_borders.6.d:0 "With our help, Ryukyu successfully broke away from Japan and reestablished diplomatic relations with us."
china_borders.6.f:0 "Ryukyu has been restored, and I have been looking forward to this moment for too long. This time, you don't have to be afraid anymore, you don't have to worry about others invading you. China is still powerful enough to protect you. I will always be with you, past and future."
china_borders.6.a:0 "I've been waiting for this moment, I've been waiting..."
china_borders.8.t:0 "Ryukyu joins China"
china_borders.8.d:0 "After careful consideration by the Ryukyu people, Ryukyu chooses to join China."
china_borders.8.f:0 "Welcome to join China, from now on, you are not alone."
china_borders.8.a:0 "I will always protect you."
sino_event.19:0 "No More Ryukyu"
sino_event.19.t:0 "No More Ryukyu"
sino_event.19.d:0 "We did not help Ryukyu restore its independence, and Ryukyu has been completely annexed by Japan."
sino_event.19.f:0 "Perhaps we should not dwell on this issue anymore. China has too many small countries to protect, and we should focus on our own internal affairs."
sino_event.19.a:0 "Who will we lose next?"
je_lan:0 "Protect Lanfang"
je_lan_reason:0 "#yellow #b Lanfang Republic#!#! was the first republic established by overseas Chinese between the 1770s and 1880s in South Borneo (now called Kalimantan). \n\nIn 1884, #N Dutch colonists#!#! invaded #yellow #b Lanfang Republic#!#!, and the people of #yellow #b Lanfang#!#!, under the leadership of the Grand Commander, resisted with all their might while urgently requesting #yellow #b Qing Dynasty#!#! to send reinforcements.\n\nHowever, at this time, the rule of #yellow #b Qing Dynasty#!#! was already shaky, and there was no time to rescue Lanfang. Unable to get support from #yellow #b Qing Dynasty#!#!, and with a vast difference in weapons and equipment compared to the invading army, #yellow #b Lanfang#!#! was finally annihilated by #N Dutch colonists#!#!.\n\nFearing a reaction from #yellow #b Qing Dynasty#!#!, #N Dutch#!#! did not dare to openly declare the destruction of #yellow #b Lanfang#!#!, but instead set up a puppet to continue ruling.\n\nIt was only in 1912, after the fall of #yellow #b Qing Dynasty#!#!, that #N Dutch#!#! officially announced their occupation of the #yellow #b Lanfang#!#! region."
lan_alive:0 "Maintain #green #b friendly#!#! relations with #N Dutch colonists#!#! in the #yellow #b Indonesia#!#! region and #yellow #b Lanfang#!#! simultaneously"
lan_no:0 "#yellow #b Lanfang#!#! successfully gained independence or was annexed by #N Dutch colonists#!#!, and the #N 1884#!#! journal of #yellow #b Protect Lanfang#!#! is not completed"
lan_will_no_war:0 "Lanfang will sign a 50-year peace agreement with #N Dutch colonists#!#!"
sino_event.20.t:0 "Trivial Small Country"
sino_event.20.d:0 "Lanfang has no connection with us, and we do not recognize them as a vassal state of China."
sino_event.20.f:0 "A group of peasants from the South Seas does not require us to spend time and effort to protect them."
sino_event.20.a:0 "I don't care about them."
china_borders.7.t:0 "Half a Century of Peace"
china_borders.7.d:0 "We have reached an agreement between #N Dutch colonists#!#! and Lanfang."
china_borders.7.f:0 "The Dutch government recognizes the sovereign independence and territorial integrity of Lanfang. Both sides have signed a 50-year ceasefire agreement."
china_borders.7.a:0 "This is the peace of our generation."

China_borders.9.t:0 "Ryukyu Chooses to Maintain the Status Quo"
China_borders.9.d:0 "After careful consideration by the people of Ryukyu, the decision is made to maintain independence."
China_borders.9.f:0 "We respect your decision and hope for the best for you."
China_borders.9.a:0 "I will always protect you."
gov_xingsheng:0 "Chinese Provinces"
gov_xingsheng_desc:2 "This is a [concept_government_type], ruled and managed by the [Concept('concept_ruler','$RULER_TITLE_ZONGDU$')] appointed by the central government of China."
RULER_TITLE_ZONGDU: "Chinese Governor-General"
je_zhongya:0 "Guardian of the Central Asian Border"
je_zhongnan:0 "Guardian of the Southwest Border"
zhongya_alive:0 "If we can control four or more provinces in #green #b Central Asia#!#! before #yellow #b Russia#!#!, we will achieve victory in #green #b Central Asia#!#!. However, this comes with the risk of deteriorating relations with #yellow #b Russia#!#!."
zhongya_no:0 "If #yellow #b Russia#!#! manages to annex four or more provinces in #green #b Central Asia#!#! before us, our position in #green #b Central Asia#!#! will become precarious and challenging."
je_dsk_great_china_load_goal:0 "We have solidified our position in #green #b Central Asia#!#!, #green #b Himalayas#!#!, #green #b Indochina#!#!, #green #b Southeast Asia#!#!, #green #b South China Sea#!#!, and three or more regions."
je_zhongya_reason:0 "After the annexation of the Jade Confederation by #yellow #b Russia#!#!, their aggressive expansion into #green #b Central Asia#!#! has become evident. Our Northwestern border is now exposed to #yellow #b Russia#!#!. [SCOPE.GetRootScope.GetCountry.GetName] has less control in the Ili region compared to the core territories. In the near future, if #yellow #b Russia#!#! continues southward to annex #green #b Xiva#!#!, #green #b Bukhara#!#!, and #green #b Khwarazm#!#!, our Northwestern border will be in grave danger. This could lead to a situation where #yellow #b Russia#!#! encourages separatism and eventually invades our territory. Therefore, we must balance the power in #green #b Central Asia#!#!."
sino_event.21.t:0 "Dominating Central Asia"
sino_event.21.d:0 "We successfully outpaced #yellow #b Russia#!#!"
sino_event.21.f:0 "In Central Asia, we have more influence than #yellow #b Russia#!#!, but we have reasons to suspect that #yellow #b Russia#!#! may launch an attack against us someday."
sino_event.21.a:0 "Let's take it one step at a time."
sino_event.22.t:0 "Border Emergency"
sino_event.22.d:0 "Our position in Central Asia is becoming precarious."
sino_event.22.f:0 "In Central Asia, #yellow #b Russia#!#! has more influence than us."
sino_event.22.a:0 "Let's give Central Asia to #yellow #b Russia#!#!. I prefer appeasement over war."
zhongnan_alive:0 "If we control three or more provinces in #green #b Myanmar#!#! within our sphere of influence, we will achieve victory in the Indochina region. However, this comes with the risk of deteriorating relations with #yellow #b Great Britain#!#!."
zhongnan_no:0 "If #yellow #b East India Company#!#! or #yellow #b Great Britain#!#! controls three or more provinces in #green #b Myanmar#!#!, our position in Indochina will become precarious."
je_zhongnan_reason:0 "As the #yellow #b East India Company#!#! solidifies its position on the Indian subcontinent, we foresee their imminent unification of the Indian principalities. However, their attention has now turned to #green #b Myanmar#!#!, which is only separated by the Arakan Mountains. We predict that once they successfully conquer #green #b Myanmar#!#!, [SCOPE.GetRootScope.GetCountry.GetName]'s Southwest border will be directly adjacent to them. At that time, the border issues in the Southwest mountains will become a significant obstacle for us. Therefore, we have reason to take proactive measures, strategically deploying in #green #b Myanmar#!#!, conquering or puppeting #green #b Myanmar#!#! up to the Arakan Mountains, to curb their ambitions to the east."

sino_event.24.t:0 "Southwest Border: Border Turmoil"
sino_event.24.d:0 "We have lost influence in Indochina."
sino_event.24.f:0 "In Indochina, the British have more influence than us."
sino_event.24.a:0 "Let's give Indochina to the British. I prefer appeasement over war."

xinan_alive:0 "If we control four or more provinces in #green #b Himalayas and Pamir Plateau#!#! within our sphere of influence, we will achieve victory in these areas. However, this comes with the risk of deteriorating relations with #yellow #b Great Britain#!#!."
xinan_no:0 "If #yellow #b East India Company#!#! and #yellow #b Great Britain#!#! control four or more provinces in #green #b Himalayas and Pamir Plateau#!#!, our position in these areas will become precarious."

je_xianluo:0 "Guardian of Indochina"
je_xianluo_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] has intricate ties with #green #b Indochina#!#!. However, there are still potential colonial powers attempting to conquer this land and extend their influence to our borders. Subordinate states like #green #b Siam#!#! control the vital gateway to the Malay Archipelago and Indonesia. If we plan further strategic deployments in the South Seas, it is nearly impossible to bypass #green #b Siam#!#!. It's time to decide the fate of #green #b Siam#!#!."
xianluo_alive:0 "If we control three or more provinces in #green #b Siam and its vassal states#!#! within our sphere of influence, we will achieve victory in Indochina."
xianluo_no:0 "If we lose control of #green #b Vietnam#!#!, our position in Indochina will become precarious."
je_xinan:0 "Guardian of the Himalayas"
je_xinan_reason: "[SCOPE.sCountry('bic_scope').GetName] continues to expand. To prevent them from interfering with our border affairs again, we must consider [SCOPE.sCountry('pan_scope').GetName], situated between the #green #b Himalayas and the Pamir Plateau#!#!. [SCOPE.sCountry('gbr_scope').GetName] is unlikely to accept their defeat in the southwest; they will likely take a series of military and diplomatic actions in #green #b Sikh#!#! territory. If they succeed, there is a considerable risk that our Qinghai-Tibet Plateau and the Tarim Basin may fall under the influence of external forces."

sino_event.28.t:0 "French Invasion"
sino_event.28.d:0 "We have lost influence in Indochina."
sino_event.28.f:0 "In Indochina, the French have more influence than us."
sino_event.28.a:0 "Let's give Indochina to the French. I prefer appeasement over war."
flb_alive:0 "If #green #b Philippines#!#! successfully becomes our vassal state, we will achieve victory in the South Seas."
flb_no:0 "If #green #b Philippines#!#! gains independence, our position in the South Seas will become precarious."
je_flb:0 "Guardian of the South Seas and East China Sea"
je_flb_reason:0 "An independent #green #b Philippines#!#! not under our empire's control acts as an eyesore, firmly rooted in our South China Sea. They still remain subject to a European suzerain. As we have almost complete control of the South Seas' maritime routes, the influence exerted by the suzerain over #green #b Philippines#!#! will diminish. Eventually, they will become a purely Asian nation."

china_borders.12.t:0 "South Seas Turmoil"
china_borders.12.d:0 "We have never ruled over this territory."
china_borders.12.f:0 "The South China Sea issue will become more intense with the arrival of major powers."
china_borders.12.a:0 "Let future generations handle the issue. I prefer appeasement over war."

china_borders_complete1:0 "We have solidified our position in #green #b Central Asia#!#!, #green #b Himalayas#!#!, #green #b Indochina#!#!, #green #b Southeast Asia#!#!, #green #b South China Sea#!#!, and three or more regions."
china_borders.11.t:0 "A Difficult Journey"
china_borders.11.d:0 "We have completely lost dominance in Asia."
china_borders.11.f:0 "Is there anything more worthwhile than dealing with our own affairs?"
china_borders.11.a:0 "Let future generations handle the issue. I prefer appeasement over war."
china_borders.14.t:0 "New Lingbei Province"
china_borders.14.d:0 "We are back."
china_borders.14.f:0 "Is there anything more exciting than ruling such vast territory?"
china_borders.14.a:0 "I want to establish a special administrative region!"

china_borders_complete2:0 "After reclaiming the territories of vassal states, we can release the New Lingbei Province in the decisions panel."

china_borders.15.t:0 "New Lingbei Province"
china_borders.15.d:0 "In Siberia, we establish a special province."
china_borders.15.f:0 "We grant them a special status and limited autonomy, expecting them to manage themselves."

l_english:
je_aus_war:0 "Hungarian War of Independence"
hun_not_be_annex:0 "Hungary was not annexed"
je_reforms_of_habsburg:0 "Habsburg Lorraine Dynasty"
je_reforms_of_habsburg_reason:0 "On October 20, 1740, Holy Roman Emperor Karl VI passed away. The Habsburg dynasty in Austria became extinct, and Maria Theresa married Duke Franz of Lorraine. Franz was not elected as Holy Roman Emperor, but his niece and son-in-law, Bavarian Elector Karl Albrecht, ascended to the Holy Roman throne with the support of the anti Habsburg alliance, becoming Karl VII. And this alliance immediately launched the War of Austrian Succession by refusing to recognize Maria Theresa's inheritance rights.On January 20, 1745, Karl VII passed away. On September 13 of the same year, Maria Theresa's husband Franz was elected as Holy Roman Emperor, who became Holy Roman Emperor Franz I and placed the throne in the hands of members of the Habsburg Lorraine family. The Treaty of Aachen, signed on October 18, 1748, confirmed the inheritance rights of Emperor Franz, Queen Maria Theresa, and their descendants to the Habsburg Lorraine family territory. After Franz was elected as Holy Roman Emperor, he added his wife's surname before his own, and their descendants adopted the surname "Habsburg Lorraine".From then on, the Habsburg Lorraine dynasty was founded, with Emperor Franz and Empress Maria Theresa becoming the founders of the dynasty"
je_FRA_February_revolution:0 "February Revolution"
 je_FRA_February_revolution_reason:0 "Since the July Revolution, the development of capitalism in France has made the vast majority of workers, peasants, and petty bourgeoisie even more impoverished. Capitalists are wealthy, but thousands of artisans and small business owners have gone bankrupt due to competition from large industries. The vast majority of farmers are small landowners who bear various heavy taxes and levies related to national taxation. \n The deepening of the social crisis and dissatisfaction with the Kizo reactionary government have intensified the nationwide struggle against the July Dynasty. The call for reform of the electoral system and the implementation of social change is increasing。"
je_dnf_constitution:0 "The Danubian Constitution"
 je_dnf_constitution_goal:0 "Finish drafting the Danubian Constitution."
 je_dnf_constitution_reason:0 "We must draft the Danubian Constitution by choosing which nations to recognize in our federal structure."
dnf_invalid:0 "Must have at least 4 territories of different Danubian cultures"
dnf_available:0 "Must have completed The Danubian Federation journal entry and maintained a minimum of Wealth Voting and Racial Segregation"
dnf_release:0 "Danubian Federation will be released as a personal union or puppet with its non-German territories"
dnf_dis_possible:0 "Be Danubian Federation and expand into North Germany"
dnf_dis_complete:0 "Form Germany as the Danubian Federation"
modifier_greathun2:0 "National reconstruction"
je_dnf_dissolution:0 "Danubian Dissolution"
 je_dnf_dissolution_reason:0 "Forming Germany or removing the Danubian cultures will cause significant turmoil."
 je_dnf_dissolution_goal:0 "Forming Germany or removing the Danubian cultures will cause significant turmoil."
je_dnf_communism:0 "Danube Socialist Federation
 je_dnf_communism_reason:0 "Complete the Danubian Federation's transformation into an internationalist worker's state."
FRA_republic1:0 "The Napoleonic Coup"
FRA_republic1_desc:0 "Napoleon attempted a coup, trying to entice senior officers to join him, but was unsuccessful. Moreover, a general loyal to the republic managed to send a telegram to the War Department, warning of a potential mutiny."

je_spring_reforms:0 "Liberty, Equality, Fraternity"
je_spring_reforms_reason:0 "The French Revolution taught us that the only way forward is to establish a government based on liberty, equality, and fraternity."

je_Anti_French:0 "The War Against France"
je_Anti_French_goal:0 "Await a 2-year period of war preparation."
je_Anti_French_reason:0 "Clearly, the French Revolution has influenced the continent of Europe. As guardians of the old European order, we must reignite the zeal of the anti-French coalition and nip these democratic movements in the bud."

je_hun_revolution:0 "The Hungarian Nationalist Tide"
je_hun_revolution_goal:0 "Avoid triggering a civil war and keep separatism under 30% within five years."
je_hun_revolution_reason:0 "Initially, it was a proposal for national self-determination until the revolution turned into a war of independence aimed at separating Hungary from Austria, overthrowing the monarchy, and proclaiming a republic. The radical ideas brought by the French Revolution were strongly opposed by most of Europe's monarchies, hence, we should utterly defeat them and nip the democratic movement in the bud."



not_already_supporting_small_German_var:0 "Not supporting Lesser Germany"
not_already_great_German_var:0 "Not supporting Greater Germany"


not_modifier_great_German:0 "Already started supporting Lesser Germany, this decision can't be changed within a year if pressed."
not_modifier_small_German:0 "Already started supporting Greater Germany, this decision can't be changed within a year if pressed."

je_germany_reforms_goal:0 "Support for the establishment of Germany has continued in the parliament for 5 years."

supporting_small_German_tt:0 "Supporting the establishment of Lesser Germany."
supporting_great_German_tt:0 "Supporting the establishment of Greater Germany."

small_German_desc:0 "Support the establishment of Lesser Germany."

spring_time:0 "The success of our republican revolution will spark democratic movements across Europe, but we must be cautious as some nations still seek to destroy the fruits of our revolution."
Here are the translations for the provided text snippets:

dsk_aus.1.t:0 "Proposal for the Austro-Hungarian Dual Monarchy"
dsk_aus.1.d:0 "We have alleviated the most superficial crisis of the empire, and now we can put the scheme of the Austro-Hungarian Dual Monarchy on the agenda."
dsk_aus.1.a:0 "We are a multi-ethnic country, and development will be difficult if we cannot ease ethnic conflicts."
modifier_reforms_of_AUS:0 "National Reforms"
je_Hungarian_reforms:0 "The Hungarian Question"
je_Hungarian_reforms_reason:0 "After the fall of Napoleon in 1815, Emperor Francis I of Austria sought to restore Habsburg dominance over the German regions. Restoring the Holy Roman Empire was impossible; the only option was to emulate Napoleon by establishing the German Confederation. The borders of the German Confederation were similar to those of the Holy Roman Empire before Napoleon's reign, but after years of war and annexations by Napoleon, there were fewer than 40 member states, far less than the 200 of the empire. The member states united for defense, forming a federal army to jointly maintain the city-states of Mainz, Luxembourg, Rastatt, Ulm, and Landau. The confederation's assembly was located in Frankfurt, and the sovereign was the Emperor of Austria. Although the confederation was formed, the situation in the German regions was as fragmented as at the end of the Holy Roman Empire, with severe division, and the Emperor of Austria could only be a nominal leader. In 1834, led by Prussia, the member states established a customs union, excluding Austria and weakening the Austrian Empire's economic control over the German regions. The conflict between Austria and Prussia became increasingly apparent. Moreover, ethnic tensions between Austria, Hungary, and other nationalities were becoming increasingly prominent, severely constraining the empire's development. After the outbreak of the Spring of Nations revolutions in Europe, multi-ethnic Austria was at the forefront. Austria faced two paths: reorganize the empire, recognizing Hungarians and other nationalities as the mainstream of the empire to ease the sharp ethnic issues, or continue to maintain the status as leader of the Germans, keeping the German nationality as the main body, or even restoring the glorious map of the Holy Roman Empire. However, this would increase the tendency of other revolutionary ethnic groups seeking independence, either going against history to the past or reforming the empire in accordance with the trend of the times."
dsk_aus.2.t:0 "A Crossroads in History"
dsk_aus.2.d:0 "This is the problem that has troubled the empire for a hundred years, and we have to make our choice in contemporary times."
dsk_aus.2.f:0 "Within our country, no ethnic group's population can exceed 50%; we cannot bypass this topic, we cannot remain silent on ethnic conflicts."
dsk_aus.2.a:0 "Tell the world, Austria will decide its direction now."
dsk_aus.2.b:0 "Tell the world, Austria will decide its direction now."
German_Nation_desc:0 "Support German nationalists in the government"
dsk_aus.3.t:0 "The Duke is Persuaded to Become a Cultural Pluralist"
dsk_aus.3.d:0 "He witnessed various injustices within the empire."
dsk_aus.3.f:0 "Perhaps the empire can no longer continue as it is, our development needs these 'foreigners', Austrians should also coexist peacefully with other nationalities, our empire is stronger because of its vast territory, but it will also collapse because of its vast territory."
dsk_aus.3.a:0 "He's right."
dsk_aus.4.t:0 "The Count is Persuaded to Become a German Nationalist"
dsk_aus.4.d:0 "Why should these foreigners take our jobs?"
dsk_aus.4.f:0 "The empire is for Austrians, why should these foreigners share the rights of the empire with us? I was born here, dedicated myself to my empire, and they, coming from nowhere, just by seeking refuge, get to stand on equal footing with us, this, I cannot accept."
dsk_aus.4.a:0 "He's right."
dsk_aus.5.t:0 "A Cultural Pluralist Takes Over the Position of Interest Group Leader"
dsk_aus.5.d:0 "This new cultural pluralist will lead the group in lobbying speeches."
dsk_aus.5.f:0 "Austrians, Hungarians, Romanians, Poles, Czechs are all children of the empire."
dsk_aus.5.a:0 "He's right."
dsk_aus.5.b:0 "This is too radical."
dsk_aus.6.t:0 "A German Nationalist Takes Over the Position of Interest Group Leader"
dsk_aus.6.d:0 "This new German nationalist will lead the group in lobbying speeches."
dsk_aus.6.f:0 "Hungarians, Romanians, Poles, Czechs are not the children of the empire, we Germans are the true masters of this country."
dsk_aus.6.a:0 "He's right."
dsk_aus.6.b:0 "This is too radical."
dsk_aus.7.t:0 "Austrians Clash with Protesting Hungarians"
dsk_aus.7.d:0 "During a peaceful rally, Austrians and Hungarians developed contradictions leading to a brawl."
dsk_aus.7.f:0 ""
dsk_aus.7.a:0 "This is too extreme."
dsk_aus.9.t:0 "A German man rapes a Polish girl"
dsk_aus.9.d:0 "Austrian judge covers up for the German man in a criminal case"
dsk_aus.9.f:0 "“Judge, you know, I disdain to have anything to do with these Polish pigs, I don't even want to glance at them. But this slut dressed so provocatively, she's a stepdaughter, surely wanting to seduce men.”
“Judge, I am willing to prove my innocence with my death.”"
dsk_aus.9.a:0 "What else can I say?"
dsk_aus.8.t:0 "Czechs denied entry at a concert"
dsk_aus.8.d:0 "Czechs denied entry into public entertainment venues"
dsk_aus.8.f:0 "“What do Czech barbarians know about art? Is this the place for you? Do you understand German?”
“Not only do I understand German, but I also understand how dogs bark.”"
dsk_aus.8.a:0 "This is terrible"
dnf_IS_available1:0 "We have already resolved the Hungarian issue"
dsk_aus.10.t:0 "Austro-Hungarian Empire"
dsk_aus.10.d:0 "A brand new Austro-Hungarian Empire emerges among mankind"
dsk_aus.10.f:0 "Austrians and Hungarians are eternal brothers, bonded thicker than water"
dsk_aus.10.a:0 "Austria-Hungary unite!"
dsk_aus.11.t:0 "The Holy Roman Empire Returns"
dsk_aus.11.d:0 "The Holy Roman Empire returns to the world of men"
dsk_aus.11.f:0 "A country dominated by Germans, a country where Christianity is the state religion, a country where all rights belong to the monarch!"
dsk_aus.11.a:0 "The crown of the Holy Roman Empire is back on our heads"
become_Holly_ROME:0 "We will directly become the Holy Roman Empire"
German_Nation_button:0 "The Empire of the Germans"
German_Nation_button_desc:0 "This is the empire of the Germans"
Cultural_diversity_button:0 "A multi-ethnic empire"
Cultural_diversity_button_desc:0 "This is a multi-ethnic empire"
not_already_supporting_Cultural_diversity_var:0 "Not supporting cultural diversity advocates"
not_already_German_Nation_var:0 "Not supporting German nationalist advocates"

modifier_aus_angry:0 "Cultural diversity advocates favored"
modifier_hun_angry:0 "German nationalist advocates favored"
not_modifier_aus_angry:0 "Support for cultural diversity advocates has started, if we press this resolution, it cannot be changed within a year"
not_modifier_hun_angry:0 "Support for German nationalist advocates has started, if we press this resolution, it cannot be changed within a year"
je_Hungarian_reforms_goal:0 "Supporting ideologists in the government and maintain for 5 years"
supporting_Cultural_diversity_tt:0 "Supporting cultural diversity advocates in the government"
supporting_German_Nation_tt:0 "Supporting German nationalist advocates in the government"
Cultural_diversity_desc:0 "Supporting cultural diversity advocates in the government"
ideology_austrian_hegemony_leader:0 "Austrian nationalists"
ideology_austrian_hegemony_leader_desc:0 "#lore This ideology believes that the German race is supreme, and other races are inferior and should be ruled by Germans, they should not live in the same community as Germans.#!"
ideology_Cultural_diversity_leader:0 "Cultural diversity advocates"
ideology_Cultural_diversity_leader_desc:0 "#lore This ideology believes that a multi-ethnic country should allow all ethnic groups equal rights, and opposes the oppression of other ethnic groups.#!"
je_aus_hun:0 "Dual Empire"
je_aus_hun_reason:0 "We have welcomed Hungarians, what about Romanians, Poles, Czechs? All ethnicities on imperial territory should be equal."
dnf_IS_available:0 "With the discrimination against Hungarians no longer present, we now initiate the idea of establishing the Danube Federation"
je_holy_rome:0 "Reconstructing the Holy Roman System"
je_holy_rome_reason:0 "On July 12, 1806, under the coercion and lure of Napoleon, 16 members of the Holy Roman Empire signed the Treaty of the Confederation of the Rhine in Paris, leaving the empire to join the Confederation. This move severely weakened Austria's lordship in the German region, which greatly displeased Francis II. Napoleon, in order to attract more countries to join the Confederation, decided to personally end the Holy Roman Empire. Therefore, he issued an ultimatum to Emperor Francis II, demanding he dissolve the Holy Roman Empire and give up the titles of Holy Roman Emperor and King of the Romans. Finally, Francis II relinquished the title of Holy Roman Emperor on August 6, 1806, retaining only the title of Emperor of Austria. The Holy Roman Empire officially perished.
Now, having successfully suppressed the impact of the French Revolution, we must ensure that monarchy, dictatorship, and state religion return to Austria, and the Holy Roman Empire descends upon the world once more."
dsk_aus.12.t:0 "[SCOPE.sCountry('fra_scope').GetName] Revolution Influences Our Country"
dsk_aus.12.d:0 "Revolutionary wave sweeps our country"
dsk_aus.12.f:0 "As a European country, the [SCOPE.sCountry('fra_scope').GetName] Revolution has influenced our nation. The people petition the government to study French reforms and democratic election systems."
dsk_aus.12.a:0 "Learn from French Democratic Experience"
dsk_aus.12.b:0 "France is a heresy, we need to reorganize anti-French warfare"
dsk_aus.13.t:0 "Spring of the People"
dsk_aus.13.d:0 "French Democratic Revolution sparks revolutionary waves in our country"
dsk_aus.13.f:0 "With the influx of ideas of liberty, democracy, and equality into our country, the Hungarian issue has become a thorn in our side."
dsk_aus.13.a:0 "This is too radical for us."

dsk_aus.15.t:0 "Spring of the People"
dsk_aus.15.d:0 "The French democratic revolution sparks a revolutionary wave in our country."
dsk_aus.15.f:0 "With the spread of ideas of freedom, democracy, and equality, the issue of Italian unification has become a thorn in our side."
dsk_aus.15.a:0 "Long live Savoy!"
dsk_aus.16.t:0 "Wind of Freedom and Democracy"
dsk_aus.16.d:0 "The wind of freedom and democracy penetrates the hearts of the people."
dsk_aus.16.f:0 "Our country has completed a series of democratization reforms and is leading the world."
dsk_aus.16.a:0 "Hail [SCOPE.GetRootScope.GetCountry.GetName]!"
dsk_aus.17.t:0 "Termination of the Anti-French Alliance Plan"
dsk_aus.17.d:0 "The eighth Anti-French Alliance plan fails."
dsk_aus.17.f:0 "This is an era of freedom, equality, and democracy. We should not return to the past of autocracy and feudalism."
dsk_aus.17.a:0 "The French Revolution has taught us many lessons."
dsk_aus.18.t:0 "Seeking Assistance from Russia in the Name of the Holy Alliance"
dsk_aus.18.d:0 "Seeking assistance from Russia in the name of the Holy Alliance."
dsk_aus.18.f:0 "Our country is on the brink of civil war. We need our old allies to help us suppress this revolution."
dsk_aus.18.a:0 "We owe Russia a favor."
dsk_aus.19.t:0 "Hungarian Uprising"
dsk_aus.19.d:0 "Hungarian uprising"
dsk_aus.19.f:0 "A wave of Hungarian independence is sweeping over."
dsk_aus.19.a:0 "Hey, listen!"
dsk_aus.20.t:0 "Reconciliation with Hungary"
dsk_aus.20.d:0 "Reconciliation with Hungary"
dsk_aus.20.f:0 "Our Austrian government officials and the Hungarians have reached a temporary reconciliation on national autonomy."
dsk_aus.20.a:0 "That suits me fine."
dsk_aus.21.t:0 "Discontent among South Germans"
dsk_aus.21.d:0 "Discontent among South Germans"
dsk_aus.21.f:0 "Because our Austrian government officials and the Hungarians have reached a temporary reconciliation on national autonomy, the South Germans believe that this seriously betrays the interests of the empire."
dsk_aus.21.a:0 "The relationship between the two sides is too delicate."
dsk_aus.22.t:0 "Hungarian Nationalists Plotting Revolution"
dsk_aus.22.d:0 "Plotting revolution"
dsk_aus.22.f:0 "We find it difficult to quell the anger of the Hungarians; they want broader autonomy."
dsk_aus.22.a:0 "This will lead the country into civil war!"
dsk_aus.23.t:0 "Crushing Revolutionary Organizations"
dsk_aus.23.d:0 "Our police recently smashed a Hungarian revolutionary group."
dsk_aus.23.f:0 "If the country can avoid civil war because of this, I don't mind bearing the blame."
dsk_aus.23.a:0 "This situation should stop."
dsk_aus.24.t:0 "German Proposal"
dsk_aus.24.d:0 "Passed by the Parliament"
dsk_aus.24.f:0 "Is it a small German plan ruled by Prussia, which does not include any Austrian territory, or is it a great German plan that does not include Austria-Bohemia?"
dsk_aus.24.a:0 "I support the great German plan."
dsk_aus.24.b:0 "I support the small German plan."
dsk_aus.25.t:0 "Participants Provide Constructive Suggestions"
dsk_aus.25.d:0 "The draft proposed by the participants is passed by the parliament."
dsk_aus.25.f:0 "This greatly enhances the success rate of the plan."
dsk_aus.25.a:0 "Long live the parliament!"
dsk_aus.26.t:0 "Radicals Attack the Parliament"
dsk_aus.26.d:0 "Radicals baselessly criticize and vehemently oppose the parliament's proposals."
dsk_aus.26.f:0 "They stormed the parliament, shouting at the attendees, and some opponents physically assaulted supporters."
dsk_aus.26.a:0 "Using violence is shameful."
dsk_aus.27.t:0 "Constructive Opinions of the Parliament"
dsk_aus.27.d:0 "The parliament's constructive opinions resonate nationwide."
dsk_aus.27.f:0 "This is a good time to unite the people."
dsk_aus.28.t:0 "Conflict between the Parliament's Proposal and Austrian Representatives"
dsk_aus.28.d:0 "Southern Germans represented by Austria oppose."
dsk_aus.28.f:0 "They oppose the core of German affairs being led by Prussia. When will the empire's future be decided by Prussia?"
dsk_aus.28.a:0 "When do they get to object?"

dsk_aus.31.t:0 "Rekindling the Flames of Anti-French War"
dsk_aus.31.d:0 "Rekindling the flames of anti-French war, we will meet France on the battlefield."
dsk_aus.31.f:0 "This atmosphere is unacceptable in Europe. France will only lead us into trouble. I cannot allow a repeat of the phenomenon where one man liberates another in continental Europe. We must reignite the passion for the anti-French war."
dsk_aus.31.a:0 "Tell me, how many times have we waged anti-French wars?"
dsk_aus.32.t:0 "The Spring of the People Sweeps In"
dsk_aus.32.d:0 "The French Democratic Revolution sets off a wave of revolutions across Europe."
dsk_aus.32.f:0 "The 1848 Revolution, also known as the Spring of Nations or the People's Spring, was a series of armed revolutions that erupted in various European countries in 1848. It was a struggle between the common people and the nobility, primarily armed revolutions by European commoners and liberal scholars against autocratic rule. This series of revolutions had a wide-ranging impact and could be said to be the largest-scale revolution in European history."
dsk_aus.32.a:0 "I have learned more."

dsk_aus.33.t:0 "Rekindling the Flames of Anti-French War"
dsk_aus.33.d:0 "Rekindling the Flames of Anti-French War, we will meet France on the battlefield."
dsk_aus.33.f:0 "Such sentiments are undesirable in Europe; France will only lead us into a pit of fire. I cannot allow the phenomenon of one nation liberating another to occur again on the European continent. We must rekindle the enthusiasm for the anti-French war."
dsk_aus.33.a:0 "Tell me, how many times have we waged anti-French wars?"


dsk_aus.34.t:0 "Hungary Successfully Breaks Free from Austrian Restraints and Wins Independence War!"
dsk_aus.34.d:0 "A historic moment, we can now choose to play as Hungary."
dsk_aus.34.f:0 "The Hungarian National Liberation War was launched by the Hungarian people during the 1848 European Revolution to oppose Austrian feudal autocracy and national oppression, striving for national independence through bourgeois revolutionary warfare. It was part of the European revolution and directly supported revolutions in other European countries."

dsk_aus.34.a:0 "It's not the time."
dsk_aus.34.b:0 "Take me to Hungary."

dsk_aus.35.t:0 "Patriotism, Freedom, Prosperity"
dsk_aus.35.d:0 "The influence of [SCOPE.GetRootScope.GetCountry.GetName] on Europe has never been as profound as it is today."
dsk_aus.35.f:0 "We uphold the will of the French Revolution, learning from their excellent experiences. We are worthy of the martyrs who sacrificed in national liberation. We must leave behind a land without oppression and strife for future generations."
dsk_aus.35.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] forever!"

dsk_aus.36.t:0 "Seeking Allies"
dsk_aus.36.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] has experienced years of liberation wars, been blocked by Austria for years, and has been isolated and helpless in diplomacy. We have broken this situation."
dsk_aus.36.f:0 "If national independence is a feat from zero to one, then re-establishing diplomacy is a breakthrough from one to two."
dsk_aus.36.a:0 "France is an ally of [SCOPE.GetRootScope.GetCountry.GetName]!"
dsk_aus.36.b:0 "Russia is an ally of [SCOPE.GetRootScope.GetCountry.GetName]!"
dsk_aus.36.c:0 "These two are not allies of [SCOPE.GetRootScope.GetCountry.GetName]. We need to make other plans."

dsk_aus.37.t:0 "Resolution Draft Passed by Parliament"
dsk_aus.37.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] can enact more advanced laws and further promote the spirit of freedom and democracy."
dsk_aus.37.f:0 "Patriotism, Freedom, Prosperity!"
dsk_aus.37.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] forever!"
dsk_aus.37.b:0 "This is too radical."

dsk_aus.38.t:0 "Danube Council Passes Resolution Draft"
dsk_aus.38.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] can now launch a total attack toward deeper goals."
dsk_aus.38.f:0 "Choose our own path."
dsk_aus.38.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] forever!"
dsk_aus.38.b:0 "[SCOPE.GetRootScope.GetCountry.GetName] forever!"

dsk_aus.39.t:0 "Shield of the Catholic World"
dsk_aus.39.d:0 "In the year 1000 AD, [SCOPE.GetRootScope.GetCountry.GetName] Grand Duke Stephen I was crowned by the Catholic Pope, and Catholicism began to spread in our country, making us officially a Catholic nation. During the Mongol invasion, we waged war against them, and after the death of the Mongol Khan Ogedei, Mongol troops withdrew, allowing [SCOPE.GetRootScope.GetCountry.GetName] to continue existing. With the fall of the Byzantine Empire, the Ottoman Empire finally managed to enter the heart of Europe. In 1526, the Ottoman invasion led to a fierce war between us and them. Although defeated, we prevented the tragedy of Islam entering the heart of Europe. Throughout history, [SCOPE.GetRootScope.GetCountry.GetName] has been at the easternmost end of the Catholic world, so whenever Europe is invaded by external enemies, we are the first to bear the brunt. [SCOPE.GetRootScope.GetCountry.GetName] is a barrier in Europe and has the obligation to protect the Catholic dominance in Europe."
dsk_aus.39.f:0 "The great Hungary will repeatedly help Europe resist the invasion of paganism."
dsk_aus.39.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] must restore the glory of the Shield of Catholicism!"

dsk_aus.40.t:0 "Greater Hungary"
dsk_aus.40.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] has experienced 400 years of wandering and has finally regained its old homeland."
dsk_aus.40.f:0 "The great [SCOPE.GetRootScope.GetCountry.GetName] will forever shine on the Danube like a pearl."
dsk_aus.40.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] forever!"

dsk_aus.41.t:0 "The Last Barrier of the Catholic World"
dsk_aus.41.d:0 "400 years have passed, and we have finally liberated the countries along the Danube from the hands of the Ottomans!"
dsk_aus.41.f:0 "The great [SCOPE.GetRootScope.GetCountry.GetName] will forever stand as the barrier of the Catholic world, resisting the invasion of infidels."
dsk_aus.41.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] is the Shield of Catholicism!"
dsk_aus.42.t:0 "Hungary Successfully Breaks Free from Austria and Achieves Independence!"
dsk_aus.42.d:0 "This is a historic moment. The people of the Danube will remember this time. Great Hungary has freed itself from the shackles of the Habsburg dynasty of Austria and finally established an independent nation!"
dsk_aus.42.f:0 "After independence, the first issue to be faced is the construction of the nation."
dsk_aus.42.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] will quickly complete post-war reconstruction!"

je_aus_war_reason:0 "This is both a national liberation war and a struggle for independence. The people of Hungary strongly demand liberation from the rule of the Austrian Empire, the abolition of feudal serfdom, and the establishment of a unified state managed by Hungarians, which serves the interests of the Hungarian bourgeoisie, to ensure the full development of Hungarian capitalism."

je_The_shield_of_Catholicism:0 "The Shield of Catholicism"
je_The_shield_of_Catholicism_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] is located at the easternmost end of the Catholic world and has the obligation to defend the peace of the Catholic world. We must embody the strongest barrier in Europe to resist the aggression and oppression of these infidels."

je_hun_reforms:0 "The Path of Hungary"
je_hun_reforms_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] has just gained independence from the Austrian Empire. The country is in a state of disrepair, and various interest groups have different views on the way forward. We can uphold the spirit of the French Revolution or return to the era of the kingdom."

je_hun_waijiao:0 "Hungarian Diplomatic Affairs"
je_hun_waijiao_reason:0 "Just liberated from the Austrian Empire, our country is still weak, and our diplomatic position is precarious. We have many neighboring countries and must seek cooperation with certain European powers to resist imperialism with the power of imperialism to help us through this difficult period."

je_hun_house:0 "Hungarian Parliament"
je_hun_house_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] has completed the most basic reforms, and we have rebuilt the National Parliament, upholding the spirit of freedom and democracy. We will convene a three-year conference to explore a path suitable for the country's development."

je_dnf_house:0 "Danube Parliament"

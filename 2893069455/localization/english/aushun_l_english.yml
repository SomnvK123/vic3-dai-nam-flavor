clever_dsk.91.d:0 "Hungarian rebels have defeated the Austrian army, they have captured Pest, and are attempting to spread dangerous ideas to Vienna. Now the Austrian Emperor himself has arrived at the Winter Palace, seeking our help."
clever_dsk.91.f:0 "If we do not send troops to help him suppress it, these dangerous ideas may once again engulf Europe."
clever_dsk.91.a:0 "Agree to the Emperor's request and send troops to help suppress the rebellion."
clever_dsk.91.b:0 "Refuse him and pacify the situation."

 clever_dsk.92.t:0 "Scramble for Africa"
chile_arg_fuego_island_desc:0 "To resolve the territorial dispute over Tierra del Fuego, we can propose to the Argentine government to divide the islands along the 67th meridian, with the west belonging to us and the east to them."
clever_dsk.92.d:0 "According to the Berlin Conference, if we cannot prove 'effective control' over our land in Africa, it will not be recognized by other countries. Parliament proposes to expand our sphere of influence as soon as possible, but this will require significant financial investment."
clever_dsk.92.f:0 "Germans and Boers are active in the Botswana region, and explorer Rhodes has also reported on his progress in Rhodesia... If we do not bring these lands under our control soon, other countries may take advantage."
clever_dsk.92.a:0 "Accelerate the expansion."
clever_dsk.92.b:0 "Reject colonial actions."
clever_dsk.93.t:0 "Establishing African Influence for [SCOPE.sCountry('gbr_want_africa_scope').GetName]"
clever_dsk.93.d:0 "After the Berlin Conference, [SCOPE.sCountry('gbr_want_africa_scope').GetName] established its sphere of influence in regions like Rhodesia, Kenya, Botswana, and Nigeria. Some explorers have already gone to these areas, claiming that local chiefs are willing to accept their rule."
clever_dsk.93.f:0 "Soldiers of Christ, continue to advance into foreign lands: the Bible in your pocket, the rifle in your hand, bring the good news to places where trade is possible, and spread the gospel of peace with Gatling guns."
clever_dsk.93.a:0 "Ambition is clear."
clever_dsk.94.b:0 "Accept exclusive rights granted by [SCOPE.sCountry('gbr_want_africa_scope').GetName] to trade, explore, and colonize within Rhodesia and Nyasaland."
clever_dsk.95.t:0 "Partitioning Africa"
clever_dsk.95.d:0 "According to the Berlin Conference, if we cannot prove 'effective control' over our land in Africa, it will not be recognized by other countries. Parliament proposes to expand our sphere of influence as soon as possible, but this will require significant financial investment."
clever_dsk.95.f:0 "Our explorers have made significant progress in Gabon and Congo... If we do not bring these lands under our control soon, other countries may take advantage."
clever_dsk.95.a:0 "Accelerate the expansion."
clever_dsk.95.b:0 "Reject colonial actions."
clever_dsk.96.t:0 "Establishing African Influence for [SCOPE.sCountry('fra_want_africa_scope').GetName]"
clever_dsk.96.d:0 "After the Berlin Conference, [SCOPE.sCountry('fra_want_africa_scope').GetName] established its sphere of influence in regions like Gabon, Congo, and Madagascar. Some explorers have already gone to these areas, claiming that local chiefs are willing to accept their rule."
clever_dsk.96.f:0 "Soldiers of Christ, continue to advance into foreign lands: the Bible in your pocket, the rifle in your hand, bring the good news to places where trade is possible, and spread the gospel of peace with Gatling guns."
clever_dsk.96.a:0 "Ambition is clear."
nicholas_died2:0 "If Nicholas II dies before 1855, the above failure condition will be met, which is beneficial for us to reform early. If the monarchy is lost, the reform log will disappear."
ecchi_heinrich:0 "Heinrich Ludwig"
ecchi_himmler:0 "Himmler"
clever_dsk.97.t:0 "Immigration to Tuva"
clever_dsk.97.d:0 "Although according to the Treaty of Tarbagatai, most of Tuva's land still belongs to the Qing Dynasty territory. However, we can try to send some merchants to immigrate to Tuva, which will be beneficial for us to claim this land in the future."
clever_dsk.97.f:0 "The Tuvans should submit to our rule."
clever_dsk.97.a:0 "Send immigrants."
clever_dsk.97.b:0 "Let me think about it."
clever_dsk.98.t:0 "Russian Infiltration"
clever_dsk.98.d:0 "Several Russian merchants have entered our Dzungarian Sea region, trying to control local economic trade."
clever_dsk.98.f:0 "These Russians have built residences and shops in the Dzungarian Sea region without our consent. If allowed to continue, it is very likely that the various banners of the Dzungarian Sea will be occupied by Russia under the pretext."
clever_dsk.98.a:0 "We cannot offend Russia."
clever_dsk.98.b:0 "Remove them."
ecchi_Joffre:0 "Joffre"
clever_dsk.102.t:0 "Establishment of the Russian Provisional Government"
clever_dsk.102.d:0 "To resist the Red Guards, the Russian Provisional Government moved to Siberia and elected Admiral Kolchak as the 'Supreme Ruler of Russia'. Perhaps we can actively improve relations with them, or even help them win the civil war to gain more benefits."
clever_dsk.102.f:0 "Kolchak firmly believes that he is the legitimate representative of the overthrown government and must eliminate the Bolsheviks to save the country. If we don't support them, they may not last until the winter of February 1920."
clever_dsk.102.a:0 "Recognize the Siberian government as the legitimate government of Russia."
clever_dsk.102.b:0 "Refuse to recognize these rebels."
clever_dsk.103.t:0 "Establishment of Soviet Russia"
clever_dsk.103.d:0 "According to the report of our ambassador to Russia, the Russian working class successfully stormed the Winter Palace and seized power, establishing the socialist Russian Soviet Federative Socialist Republic. Do we need to recognize them and establish good diplomatic relations?"
clever_dsk.103.f:0 "To stabilize the social situation as soon as possible, the Soviet regime must not cede large areas of Eastern Europe. Even so, there are intelligence reports that there are still many organizations opposing the Soviet regime within Russia, and the future situation in Russia is precarious."
clever_dsk.103.a:0 "Recognize the newly established Soviet Russia."
clever_dsk.103.b:0 "These are just a bunch of rebellious Reds, they should be eradicated."
clever_dsk.104.t:0 "The 'Dual Ocean Treaty'"
clever_dsk.104.d:0 "Now, we have determined the border at the highest peak of the Andes, and we must decide how to handle the islands at the southern end of the mountain range—Tierra del Fuego."
clever_dsk.104.f:0 "Diplomats from [SCOPE.sCountry('chl_scope').GetName] proposed the 'Dual Ocean Principle' to us, dividing the islands along the 67th meridian, with the west belonging to [SCOPE.sCountry('chl_scope').GetName] and the east to our country."
clever_dsk.104.a:0 "Sign the treaty! This is advantageous for our country."
clever_dsk.104.b:0 "This is an insult to our country, how dare they do this!"

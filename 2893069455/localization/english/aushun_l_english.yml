rebuilt_complete.1.a:0 "Reconstruction Successful"
rebuilt_complete.1.b:0 "All representatives of the Magyar elite united to resist the centralizing imperial policies. While hardliners among them chose uncompromising opposition, the moderates led by Ferenc Deák sought negotiations with the Vienna government. This led to normalization of relations and eventually a compromise. Realists among the Hungarian political leadership understood that the preservation of Magyar privileges in Hungary, and even the existence of the kingdom they cherished, relied on the framework of the Habsburg monarchy. Given the struggles of minority ethnic groups for national liberation at home, developments in the Balkans, and Russia's expansionist policies, the likelihood of a Magyar nation-state surviving independently was slim."
rebuilt_complete.1:0 "Élyen a Magyar—Long live the Magyars!"
rebuilt_complete.d:0 "They returned to the imperial fold, temporarily."

rebuilt_fail.1.a:0 "Reconstruction Failed"
rebuilt_fail.1.b:0 "All representatives of the Magyar elite united to resist the centralizing imperial policies. Based on the February Patent of 1861, when the supra-national Imperial Council (Reichsrat) was officially convened, it faced resistance from the Magyars. They did not attend the Imperial Council; instead, the newly established Hungarian Diet became a platform for protest. To prevent further Magyar separatism, we had to take emergency measures to salvage our relationship with the Magyars. We granted greater autonomy to Hungary, and the moderate-led government under Ferenc Deák will now begin to assist us in stabilizing the situation in Hungary."
rebuilt_fail.1:0 "Élyen a Magyar—Long live the Magyars!"
rebuilt_fail.1.d:0 "The compromise is only temporary!"
 
great_compromise:0 "The compromise faction is gaining the upper hand."

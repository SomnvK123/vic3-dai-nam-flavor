je_nazi_german_empire:0 "New Order"
je_nazi_german_empire_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] will trample Europe with iron hooves and establish a new order. That is our most beautiful goal and purpose. Those with short-sightedness, besides lamentation, have nothing more to offer. It is a blessing from heaven, rewarding the heroes who dedicate themselves to this socialist country. Such spirit of dedication will last forever. [SCOPE.GetRootScope.GetCountry.GetName] will forever be the master of Europe."
dsk_aus.45.t:0 "My Struggle"
dsk_aus.45.d:0 "A new era has come. [SCOPE.GetRootScope.GetCountry.GetName] has awakened, we have won power. Now we need to convince our German compatriots. I know you, our compatriots, living in dire straits, eager for change, but like a stone sinking into the sea, your calls for change rise again and again, to struggle unrelentingly. You will be subjected, you must obey, you must submit willingly to the irresistible need for obedience!"
dsk_aus.45.f:0 "Our dream, longed for day and night, has finally come true. The unity of all classes of the German people has become the symbol of the new German Empire, thereby becoming the measure of the German people. The most precious treasure in this world is our people, for our people, we must fight and wage war, we will never slacken, we will never tire, we will never abandon our faith."
dsk_aus.45.a:0 "A new community is being built, [SCOPE.GetRootScope.GetCountry.GetName] will complete the reconstruction of the New Order in Europe under the leadership of the Führer!"
dsk_aus.46.t:0 "Modern Germany"
dsk_aus.46.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] has successfully freed itself from dictatorship, the shackles of nationalism, and is entering modern Europe with an open and inclusive attitude."
dsk_aus.46.f:0 "This is an epoch-making significance. The three colors of black, red, and gold have long symbolized the pan-Germanic aspirations for unity, independence, and sovereignty. Among them, black represents rigor and solemnity; red symbolizes the burning flames, igniting the people's longing for freedom; gold symbolizes the radiance of truth, which will never be buried by the sands of history!"
dsk_aus.46.a:0 "A new era has come, [SCOPE.GetRootScope.GetCountry.GetName] will stand in the world with the posture of freedom and democracy."
dsk_aus.47.t:0 "Greater Germania"
dsk_aus.47.d:0 "[SCOPE.GetRootScope.GetCountry.GetName] has completed the reconstruction of the New Order in Europe."
dsk_aus.47.f:0 "Greater Germania has risen in the world war, becoming the undisputed hegemon of Europe. The Russian bear has fallen, its homeland shattered, brothers are at odds with each other. France is already in tatters, Paris is just ruins. Whether it's the once-shining Moscow or distant London, all have fallen into enemy hands."
dsk_aus.47.a:0 "An extraordinary era has arrived, [SCOPE.GetRootScope.GetCountry.GetName] is eternal! Eternal! Eternal!"
dsk_aus.48.t:0 "Annexation of Austria"
dsk_aus.48.d:0 "Austria officially joins [SCOPE.GetRootScope.GetCountry.GetName]"
dsk_aus.48.f:0 "We demand the unification of all Germans in Greater Germany on the basis of the right to self-determination of peoples. Incorporate ten million Germans into the empire and overthrow the Habsburg dynasty! The Nazis must re-unite all Germans born within or living outside the German Empire to create an all-German Empire—'My Struggle.'"
dsk_aus.48.a:0 "An extraordinary era has arrived, [SCOPE.GetRootScope.GetCountry.GetName] is eternal! Eternal! Eternal!"
dsk_aus.48.b:0 "Forget it, let Austria continue to exist as a separate entity."

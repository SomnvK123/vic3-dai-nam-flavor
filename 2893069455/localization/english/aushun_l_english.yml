je_small_german:0 "Small German Plan"
je_small_german_reason:0 "When the Constitution was drafted by the Frankfurt National Assembly in 1848, the bourgeoisie led by Gagern proposed: to establish a German federation excluding Austria, and then negotiate with Austria on national affairs, called the "Small German Plan". The other faction supports Austria's leadership, including all German states such as Austria, called the "Great German Plan". Of course, we can establish a Greater Germany led by Prussia."
je_great_german:0 "Frankfurt German Plan"
je_great_german_reason:0 "In parliament, one of the most enthusiastic topics for representatives is the issue of German unification. On this issue, representatives are divided into two factions: one supports unification led by Prussia, unifying the northern German states, and does not exclude negotiating with Austria on national affairs, called the "Small German Plan"; the other supports Austria's leadership, including all German states such as Austria, called the "Great German Plan". Of course, we can establish a Greater Germany led by Prussia."

donghak_events.1.t:0 "Northern Uprising"
donghak_events.1.d:0 "More peasants are adopting the strange religion of Donghak."
donghak_events.1.f:0 "\"People are heaven, and serving people should be as serving heaven.\""
donghak_events.1.a:0 "Let’s watch."
donghak_events.2.t:0 "Boeun Assembly"
donghak_events.2.d:0 "Donghak followers are gathering in Boeun market to carry out their movement."
donghak_events.2.f:0 "\"Reject Western forces and foreign influence!\""
donghak_events.2.a:0 "Capture the leaders and punish them."
donghak_events.2.b:0 "Disband them."
donghak_events.3.t:0 "Southern Uprising"
donghak_events.3.d:0 "A new faction of Donghak followers has emerged, going down a different path. We cannot simply watch them."
donghak_events.3.f:0 "Peasants fight for a prosperous nation."
donghak_events.3.a:0 "Let’s watch for now."
donghak_events.5.t:0 "Peaceful Resolution"
donghak_events.5.d:0 "The conflict with the peasants has finally ended. It’s time to build a better world."
donghak_events.5.f:0 "Let the government lead, and the people follow, to make the country stronger and wealthier!"
donghak_events.5.a:0 "Joseon will not be divided."
donghak_events.6.t:0 "Jeon Chang-hyeok’s Petition"
donghak_events.6.d:0 "Peasants, protesting against corrupt local officials like Jo Byeong-gap, submitted a petition through Jeon Chang-hyeok."
donghak_events.6.f:0 "Corrupt officials are slowly revealing the discontent of the peasants."
donghak_events.6.a:0 "Punish them."
donghak_events.6.b:0 "Accept the petition."
donghak_events.7.t:0 "Goibu Rebellion"
donghak_events.7.d:0 "The peasants have risen in rebellion due to improper handling by Jo Byeong-gap."
donghak_events.7.f:0 "Angered by the oppressive behavior of Jo Byeong-gap, the peasants of Goibu finally rebelled to express their discontent."
donghak_events.7.a:0 "Suppress them."
donghak_events.7.b:0 "Sacrifice a scapegoat."
donghak_events.8.t:0 "Baeksan Uprising"
donghak_events.8.d:0 "Angry peasants looted the government offices and seized weapons for their rebellion."
donghak_events.8.f:0 "At Mujang-hyeon, 4,000 peasants and wanderers gathered and issued a manifesto calling for the elimination of corrupt officials and the restoration of peace. They began to rally under the banner of protecting the nation and people's welfare."
donghak_events.8.a:0 "Prepare the army."
donghak_je_events.2.t1:0 "Reconstruction of the State"
donghak_je_events.2.t2:0 "Rebuilding the Nation"
donghak_je_events.2.d1:0 "The government forces were defeated. It is now time to create a country for the peasants."
donghak_je_events.2.d2:0 "The peasant forces were defeated. It is now time to stabilize the political situation."
donghak_je_events.2.f1:0 "A remarkable event has occurred. The government forces were defeated by the peasants, leading to a chaotic political situation. Now, it is time to build a country for the peasants and stabilize the government."
donghak_je_events.2.f2:0 "The government forces successfully suppressed the peasants. Now, it is time to restore the peasants to their rightful place and rebuild the country."
donghak_je_events.2.a:0 "Let’s rebuild the state."
donghak_je_events.3.t:0 "The Rebirth of Joseon"
donghak_je_events.3.d:0 "Finally, the nation has been stabilized."
donghak_je_events.3.f:0 "The political chaos caused by the peasant uprisings has been resolved."
donghak_rebirth_of_korea:0 "The Rebirth of Joseon"
donghak_je_events.3.a:0 "We are one."
donghak_je_events.4.t:0 "Peasant's Demands"
donghak_je_events.4.d:0 "Although the country has been divided, we cannot exclude the peasants, who are the foundation of the nation."
donghak_je_events.4.f:0 "The country is built on its people, and the majority of the population is composed of peasants."
donghak_je_events.4.a:0 "Let's listen to the peasants."
donghak_je_events.4.b:0 "Let's ignore the peasants."
donghak_je_events.5.t:0 "Post-Revolution Handling"
donghak_je_events.5.d:0 "It is now time to decide how to treat the peasants."
donghak_je_events.5.f:0 "The peasant rebellion was effectively suppressed by the government forces. Now, we must focus on post-war handling."
donghak_je_events.5.a:0 "Enact new laws."
donghak_je_events.5.b:0 "No reforms."
donghak_je_events.6.t:0 "After the Revolution"
donghak_je_events.6.d:0 "The revolution has succeeded. Now it is time to restore the country."
donghak_je_events.6.f:0 "Now is the time to stabilize the country and heal the wounds of the revolution. The priority should be to establish the foundation of the nation."
donghak_je_events.6.a:0 "Bring a king from close relatives."
donghak_je_events.6.b:0 "Bring a king from distant relatives."
donghak_je_events.6.c:0 "Establish a president."
donghak_je_events.6.e:0 "Establish a Peasant Republic."
donghak_je_events.6.g:0 "Maintain the status quo."

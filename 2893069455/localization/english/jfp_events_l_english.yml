l_englsih:

sino_event.147.a:0 "We are not yet capable of competing with the [SCOPE.sCountry('jap_scope').GetAdjective], let's quickly settle things and avoid further conflict!"
sino_event.147.b:0 "We cannot compromise with the [SCOPE.sCountry('jap_scope').GetAdjective] invaders! I must defend the last shred of our dignity!"

touzi_kor_tt:0 "[SCOPE.sCountry('jap_scope').GetAdjective] may gain [concept_foreign_investment] in our country."

conquer_kor_tt:0 "[SCOPE.sCountry('jap_scope').GetAdjective] may show more signs of conquest towards us soon!"

jiawu_war_china_lose_tt:0 "[SCOPE.sCountry('chi_scope').GetAdjective] has lost the war to [SCOPE.sCountry('jap_scope').GetAdjective]!"

je_china_korean_releation:0 "Relations with China"
je_china_korean_releation_reason:0 "The Liaodong region is crucial, a battleground between China and Korea. The vast sea surrounds us on three sides, and to the north, we have a vast mountainous area. The Chinese side extends a thousand miles to [SCOPE.sCulture('korean_culture').GetName]. This land is rich in resources and strategically located. Historically, during the Ming dynasty, we [SCOPE.sCountry('kor_scope').GetAdjective] and [concept_dsk_china] stood together to defend against foreign threats, building a deep friendship. However, the world has changed, and the Qing dynasty has risen in the northeast, unifying China with great power. While we continue to remember the favor of the old Ming dynasty, we also feel the grace of the Qing dynasty, like a dead tree receiving spring rains and revitalizing. If we speak in foreign terms, [SCOPE.sCountry('chi_scope').GetAdjective] is like a parent to us. Both we and [SCOPE.sCountry('jap_scope').GetAdjective] are foreign nations, with Japan akin to a child. It would be unreasonable for a parent to love a rebellious child as much as they love a filial one."

je_chi_relationship_3_tt: "#v The Korean Independence War has begun!#!"
je_chi_relationship_2_tt: "#v Relations between China and Korea are in a dangerous period!#!"
je_chi_relationship_1_tt: "#v Relations between China and Korea are still negotiable!#!"
je_chi_relationship_0_tt: "#v Relations between China and Korea are gradually improving!#!"
je_chi_relationship_tt: "#v [SCOPE.sCountry('chi_scope').GetAdjective] and [SCOPE.sCountry('kor_scope').GetAdjective] are as close as lips and teeth, a father-child relationship!#"

sino_event.148.t: "New Diplomacy"
sino_event.148.d: "In the rapidly changing international situation, [SCOPE.GetRootScope.GetCountry.GetName] has broken free from [SCOPE.sCountry('chi_scope').GetAdjective]'s control."
sino_event.148.f: "[SCOPE.sCountry('chi_scope').GetAdjective]'s diplomatic failure has led to unprecedented humiliation. Pro-Japanese factions in our government are pushing for severing ties with the former overlord and establishing new diplomacy with Japan!"
sino_event.148.a: "Forget them, we should now establish new relations with [SCOPE.sCountry('jap_scope').GetAdjective]!"
sino_event.148.b: "Let me think this over."


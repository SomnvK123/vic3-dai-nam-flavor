 #조선 민주화
 
je_republic_of_korea_first:0 "Discussion on the Introduction of Constitutional Monarchy"
je_republic_of_korea_first_reason:0 "The reforms are nearing completion, and it is now time to introduce Western systems."
je_republic_of_korea_first_goal:0 "Let’s discuss the introduction of constitutional monarchy."
je_republic_of_korea_second:0 "Introduction of Constitutional Monarchy"
je_republic_of_korea_second_reason:0 "As a result of the discussion, many voices suggested introducing a constitutional monarchy. Now, it’s time to distribute power."
je_republic_of_korea_second_goal:0 "Abolition of Absolute Monarchy"
je_daehan_war:0 "Korean Civil War"
je_daehan_war_reason:0 "We must drive out the old forces of absolute monarchy and establish the Republic of Korea for the Korean people."
je_daehan_war_goal:0 "Unify the Korean Peninsula."
je_spearhead_of_democracy_jp:0 "Pioneering Democracy: To Japan"
je_spearhead_of_democracy_jp_reason:0 "Let’s deliver democracy to Japan."
je_spearhead_of_democracy_cn:0 "Pioneering Democracy: To China"
je_spearhead_of_democracy_cn_reason:0 "Let’s deliver democracy to China."
republic_of_korea.1.t:0 "Outcome of the Republic Discussion"
republic_of_korea.1.d:0 "After endless discussions, a conclusion has been reached."
republic_of_korea.1.f:0 "The past monarchs who disregarded the loyal ministers' counsel, entangled in desires for women and wine, lost their kingdoms and, in the end, even their lives. The current monarch is undoubtedly a benevolent ruler, but who can say whether a tyrant like Yeonsangun or Gwanghaegun will emerge in the future? Thus, we must appoint a prime minister who will not withhold his loyal advice to prevent the monarch from becoming a wicked ruler, as Mencius warns."
republic_of_korea.1.a:0 "Let’s introduce a constitutional monarchy."
republic_of_korea.1.b:0 "A constitutional monarchy is incompatible with Confucianism."
republic_of_korea.2.t:0 "Discovery of Republican Faction"
republic_of_korea.2.d:0 "A faction attempting to overthrow the rightful rulers and establish a republic has been apprehended."
republic_of_korea.2.f:0 "\"Your Majesty! How dare they harm Your Majesty’s body and try to cause chaos like the republican period of the Zhou dynasty in Joseon! Their behavior clearly shows that some remnants of the faction are hiding somewhere! Please issue a decree to interrogate and punish them, Your Majesty!\""
republic_of_korea.2.a:0 "Execute them."
republic_of_korea.2.b:0 "Torture them to catch their remaining supporters."
republic_of_korea.3.t:0 "The Illusion of Democracy"
republic_of_korea.3.d:0 "Many citizens are rallying under the name of democracy."
republic_of_korea.3.f:0 "Mencius himself said that the will of the people is the will of heaven, so how can the officials ignore it and discuss politics among themselves? Even now, when the ministers are plotting, the entire population is crying out for democracy, and we must follow heaven’s will and act on democracy!"
republic_of_korea.3.a:0 "Disband them immediately."
republic_of_korea.3.b:0 "Capture and execute the leaders."
republic_of_korea.4.t:0 "Failure of the Constitutional Monarchy Discussion"
republic_of_korea.4.d:0 "What we need is not the distribution of power, but a strong nation."
republic_of_korea.4.f:0 "Joseon has been destroyed due to the illusion of a strong military and weak government, but how can you fall into such absurdity and lead this nation back into chaos? What we need now is the restoration of Joseon under the benevolent words of our king!"
republic_of_korea.4.a:0 "Let’s strengthen royal power."
republic_of_korea.5.t:0 "Introduction of Constitutional Monarchy"
republic_of_korea.5.d:0 "Our country has become more advanced. Now, the only thing left is to enter the world stage."
republic_of_korea.5.f:0 "Though they were once great ancestors, it is undeniable that some past monarchs made poor choices for Joseon. Thus, in accordance with the ministers’ advice, I proclaim the introduction of a constitutional monarchy to prevent foolish kings from emerging."
republic_of_korea.5.a:0 "To the world stage."
republic_of_korea.6.t:0 "Civil War Breaks Out"
republic_of_korea.6.d:0 "As attempts to peacefully introduce a republic failed, radical reformists have risen with the banner of the Republic of Korea and formed an army."
republic_of_korea.6.f:0 "\"Sovereignty belongs to the people, and all power comes from the people.\""
republic_of_korea.6.a:0 "Capture the reactionaries and decapitate them in the market square."
republic_of_korea.6.b:0 "Fight for democracy."
republic_of_korea.7.t:0 "Victory of the Republic of Korea"
republic_of_korea.7.d:0 "The Republic of Korea has finally unified the Korean Peninsula. All conservative forces have fled abroad, and now it is time to answer the call of the people."
republic_of_korea.7.f:0 "People of all Korea! The Lee Dynasty and the loyalists who oppressed you are gone. The old system that silenced you has vanished into history. You are no longer subjects of Joseon, but citizens of the Republic of Korea! Enjoy your freedom after 500 years!"
republic_of_korea.7.a:0 "People of other nations also have the right to be free."
republic_of_korea.8.t:0 "Liberation of Japan"
republic_of_korea.8.d:0 "Now, it is time to liberate Japan from the feudal forces."
republic_of_korea.8.f:0 "For thousands of years, the Japanese Shogunate and daimyos have oppressed and exploited the people. Today, I earnestly hope that the assembly will pass a resolution to declare war and grant freedom to the Japanese people. Just as we overthrew our oppressors and found freedom, it is our duty to give them the opportunity to achieve liberty!"
republic_of_korea.8.a:0 "Let’s grant democracy to Japan!"
republic_of_korea.8.b:0 "I am too busy with our own matters."
republic_of_korea.9.t:0 "Liberation of China"
republic_of_korea.9.d:0 "Now, it is time to liberate China from its feudal rulers."
republic_of_korea.9.f:0 "The Chinese people have lived under domination for the past 3,000 years. The rulers have always changed, but the people’s lives have not. Even now, self-proclaimed officials of the Qing Dynasty and their emperor are draining the people’s blood to fill their own bellies. Once, we served that country as our fatherland. Now, to break away from this disgraceful past and give the Chinese people freedom and democracy, we must be ready to go to war. This is our duty as free Koreans. To the people—freedom and democracy!"
republic_of_korea.9.a:0 "Freedom and democracy for the Chinese people!"
republic_of_korea.9.b:0 "Isn’t this what they brought upon themselves?"

 
 
 #대한제국 
  
 je_korean_empire:0 "Proclamation of Empire"
je_korean_empire_reason:0 "Joseon is no longer a vassal of the Qing Dynasty. It is time to call ourselves an Emperor."
korea_military_reward:0 "Military Reform"
korea_diplomatic_reward:0 "Joseon Diplomacy"
korea_production_reward:0 "Modern Railroads"
korean_empire.1.t:0 "Proclamation of the Korean Empire"
korean_empire.1.d:0 "Our country is independent and sovereign. Now is the time to proudly announce our name to the world."
korean_empire.1.f:0 "\"Our country is the land of the Three Han, which was united under heaven's will. Thus, it is only right to call our nation 'Daehan.' Even without announcing it to the world, all will know our name. Now that the national title is decided, all rituals and offerings at the Won'gu altar should be written under the name 'Daehan.'\""
korean_empire.1.a:0 "His Majesty will ascend to the Won'gu altar and proclaim the Korean Empire."
korean_empire.1.b:0 "We must not provoke the Qing Dynasty."
korean_empire.2.t:0 "Establishing Diplomatic Policies"
korean_empire.2.d:0 "A new dawn has arrived for the Korean Empire. Now, we must decide how to proceed."
korean_empire.2.f:0 "\"For many years, we have been subjected to foreign invasions. Now is the time for us to pass judgment on them.\""
korean_empire.2.a:0 "The Wokou have long invaded us, it is time to reclaim our land."
korean_empire.2.b:0 "Let us negotiate diplomatically with Japan."
korean_empire.2.c:0 "Having regained the name Daehan, it is time to reclaim our land."
korean_empire.2.e:0 "It is too soon to expand abroad. We must first solidify our internal stability."
korean_empire_journal:0 "Abandoning the Proclamation of Empire"
korean_empire_journal_desc:0 "We must maintain our identity."
korean_empire.3.t:0 "Need for a National Flag"
korean_empire.3.d:0 "Originally, our country, like neighboring East Asian nations, did not have a national flag. However, given the rapidly changing international landscape, the need for a national flag has greatly increased."
korean_empire.3.f:0 "\"…To distinguish the nationality of ships, it is mandatory to fly a national flag. A national flag is a highly valuable item, and if a ship of Country A uses Country B's flag without permission, it will be treated as piracy and punished by Country B's military.\""
korean_empire.3.a:0 "We already have the royal seal, so it would be appropriate to use it as our national flag."
korean_empire.3.b:0 "This is a very wise proposal. The ministers should immediately draft a national flag for our country."
joseon_yuji:0 "Maintain the national identity of Joseon."

# Manchuria
je_manchu:0 "Discussion on Manchuria"
je_manchu_reason:0 "Let’s discuss Manchuria."
je_manchu_goal:0 "Let’s complete the discussion on Manchuria."
manchu.1.t:0 "Result of the Discussion on Manchuria"
manchu.1.d:0 "It has been decided to conquer Manchuria."
manchu.1.f:0 "Manchuria has historically been the territory ruled by the Three Han. Although it is currently occupied by barbarian tribes, it must be reclaimed."
manchu.1.a:0 "Manchuria belongs to the Three Han."

# Empire Union
je_Ilseontongjo_ron:0 "Theory of Korean-Japanese Cooperation"
je_Ilseontongjo_ron_reason:0 "The relationship between the Joseon people and Japan has been close since ancient times, and the two share many similarities. With the threat of the Western powers reaching our doorstep, now is the time to unite the national strengths of the Far East and advance together."
kju.2.t:0 "Union of the Korean and Japanese Empires"
je_jku_unity:0 "One Imperial Seat, One Nation"
je_jku_unity_reason:0 "With the single imperial successor established and the mutual recognition of imperial sovereignty, the two nations must now prepare to fully unite as one."
je_jku_unity_goal:0 "Complete preparations for the dual empire."
je_jku_ausgleich:0 "Preparation for Imperial Marriage"
je_jku_ausgleich_reason:0 "The imperial marriage has been decided, but there are still many aspects that need to be worked out before the two nations can truly merge. We must begin by addressing the smaller issues, starting with deciding who will be the imperial bride and the form of the marriage."
je_jku_ausgleich_goal:0 "Find a candidate."
je_jku_wait:0 "Preparation for the Future"
je_jku_wait_reason:0 "The imperial marriage has taken place, and the two royal families have taken a step closer to unification. In order for two originally distinct entities to merge, we must carefully change both small and large matters."
je_jku_wait_goal:0 "Prepare for transformation."
jku_ausgleich_complete_tt:0 "Waiting for the right moment."
jku_wait_complete_tt:0 "Waiting for the right moment."
jku_unity_complete_tt:0 "Waiting for the right moment."
kju_tenwin_tt:0 "The royalist faction won the War of the Heavenly Proclamation."
jku.1.t:0 "Approaching the Japanese Imperial Family"
jku.1.d:0 "It is time to inquire the opinion of the Japanese Imperial Family."
jku.1.f:0 "\"Since the Three Kingdoms period, Japan and Baekje have formed a blood alliance, and the two nations have openly exchanged visits, strengthening their fraternal bond. Now, in the face of great external threats, how difficult or strange would it be for us to pursue this again?\""
jku.1.a:0 "Wait for their response."

 jku.2.t:0 "Dummy Event"
jku.2.d:0 "Dummy Event"
jku.2.f:0 "Dummy Event"
jku.2.a:0 "Dummy Event"
jku.3.t:0 "Arrival of the Korean Empire's Envoy"
jku.3.d:0 "The envoy of the Korean Empire has arrived and expressed a desire to establish closer relations between the two imperial families."
jku.3.f:0 "\"The imperial marriage between our two nations is for the peace of the East, and it will serve as a strong foundation for closer relations and a bright future for both countries.\""
jku.3.a:0 "This is an offer we cannot refuse."
jku.4.t:0 "Declaration of Dual Sovereignty"
jku.4.d:0 "To ensure the eternal prosperity and harmonious union of the Korean and Japanese empires, a declaration of dual sovereignty will be made for the common heir of both imperial families."
jku.4.f:0 "\"Considering the strong goodwill between the two nations, the exchanges between our peoples, and the bonds between the imperial families, it is only fitting that we unite under one imperial throne and one name. The imperial assemblies of both empires will handle state affairs, and the emperors of both nations will continue to reign, but in order to ensure harmony and coexistence, I declare dual sovereignty here. As the imperial heir is still young, the emperors will guide him for three years, after which he will ascend the throne as the new emperor.\""
jku.4.a:0 "We declare dual sovereignty."
jku.5.t:0 "Imperial Marriage Decision"
jku.5.d:0 "There are many obstacles to overcome before the imperial families of the Korean Empire and the Japanese Empire can become one bloodline."
jku.5.f:0 "\"Japan, the Land of the Rising Sun, shares a deep cultural connection with Daehan, the Land of the Morning Calm. The union of our two royal families will be a beacon for greater peace in the East.\""
jku.5.a:0 "We still have a long way to go."
jku.6.t:0 "Currency Exchange"
jku.6.d:0 "In honor of the agreement between the two imperial families, a proposal has been made to allow the free use of each nation's currency after the imperial wedding."
jku.6.f:0 "\"Money, by its very nature, circulates within a nation, so the currencies of both nations carry the same meaning. Rather than introducing entirely new currencies, we should allow each nation's currency to be used in the other's territory, and set an exchange rate that both parties find acceptable.\""
jku.6.a:0 "We will recognize the mutual use of currency."
jku.7.t:0 "Bicameral Legislative Assembly"
jku.7.d:0 "For the future, it is crucial to establish an exchange between the Korean Empire's and the Japanese Empire's legislatures."
jku.7.f:0 "\"We should first divide the parliaments into the upper and lower houses, with each house handling foreign and domestic affairs. For important national matters, we must seek the opinions of both upper and lower houses of both countries.\""
jku.7.a:0 "Proceed with this plan."
jku.8.t:0 "Consolidation of Foreign Ministries"
jku.8.d:0 "A proposal has been made to establish a unified foreign ministry, with diplomats from both nations working together under one structure."
jku.8.f:0 "\"For the sake of uniting two different countries under the imperial name, we must present a unified foreign policy to other nations. The foreign ministry should manage foreign affairs together, ensuring that diplomats from both countries are evenly distributed to avoid any controversies.\""
jku.8.a:0 "Establish a unified foreign ministry."
jku.9.t:0 "Establishment of a Unified Military"
jku.9.d:0 "A proposal has been made to form a unified military between the two empires, excluding the forces responsible for internal security and order."
jku.9.f:0 "\"Merging the military forces of two different nations with distinct systems, languages, and cultures will certainly be a challenge. However, with sufficient translation services and a fair, equitable process to reorganize the officers and soldiers, the chaos will be reduced over time, even though it will require significant resources.\""
jku.9.a:0 "Create a unified military."
jku.10.t:0 "Unification of the Judiciary"
jku.10.d:0 "There is a proposal to standardize the judicial system and establish a unified judiciary for the two nations."
jku.10.f:0 "\"Given the high number of people moving between our two nations, and with the imperial families now united, applying different judicial systems to individuals from the two countries will only deepen inequality. We must restructure the legal system and create a unified judicial system that applies equally to all.\""
jku.10.a:0 "Unify the judiciary."
jku.11.t:0 "Legislative Assembly Unification"
jku.11.d:0 "We cannot continue to have separate legislatures forever. The upper and lower houses of both nations must be merged."
jku.11.f:0 "\"First, merge the upper houses, then the lower houses, and elect a joint chairman. We will designate a new joint election date, ensuring that no single side holds too many seats.\""
jku.11.a:0 "Set the new election date."
jku.12.t:0 "Imperial Marriage Fulfilled"
jku.12.d:0 "At last, the royal families of both nations met and exchanged vows, resolving to move forward as one united family. A grand celebration was held on the Korean Peninsula and the Japanese archipelago."
jku.12.f:0 "\"Daehan and Japan were originally one, but through turbulent history and external threats, we were separated. Now, we will fill the gap and stand together once more!\""
jku.12.a:0 "Long live the union! Long live the empire!"
jku.13.t:0 "Royal Family's Joy"
jku.13.d:0 "A joyous occasion has arrived for the imperial family. It is a son!"
jku.13.f:0 "\"In Daehan, he is called Seong, with the given name Kang. In Japan, he is called Tsuyohito Prince, and he is the eldest son of the imperial heirs of both the Korean Empire and the Japanese Empire. He is the rightful heir to the imperial throne of the unified empire.\""
jku.13.a:0 "A great joy for both nations!"
jku.14.t:0 "Introduction of a Unified Currency"
jku.14.d:0 "There cannot be two currencies in one nation. A single currency system must be established after an adequate transition period."
jku.14.f:0 "\"From now on, the currency unit will be called 'Hwan.' The hwan will be divided into 100 jeon, and 1 jeon will be equivalent to 10 li. All transactions involving the old Korean and Japanese banknotes will be prohibited two years after the introduction of the new currency.\""
jku.14.a:0 "Implement this immediately."
jku.15.t:0 "True Unification - The Unified Imperial Family of the Mansei-Ilgye"
jku.15.d:0 "From this day forward, there is no longer a separate Daehan or Japan. The newly united Korean-Japanese Empire will be the shining beacon of the East."
jku.15.f:0 "\"The unified imperial family of the Mansei-Ilgye, representing the Korean Empire and the Empire of Japan, will govern the united Korean-Japanese Empire.\""
jku.15.a:0 "Long live the unified empire! Long live the emperor!"
jku.16.t:0 "Unification of Criminal Law"
jku.16.d:0 "Before restructuring the judicial system, it is necessary to unify the criminal laws and legal frameworks of the two nations."
jku.16.f:0 "\"The accused shall be presumed innocent until proven guilty in a court of law, and this is an unbreakable, absolute principle of criminal law.\""
jku.16.a:0 "Implement with a deadline."

 

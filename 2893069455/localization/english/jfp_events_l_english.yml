# 2nd Reform
je_korean_restoration_second:0 "Path to a Wealthy and Powerful Nation"
je_korean_restoration_second_reason:0 "Having resolved the three main issues, the foundation for national development is now in place. It is time to rise and show our strength."
je_korean_restoration_second_goal:0 "Complete all reforms"
donghak_complete_tt:0 "Resolve the Peasant Uprising"
je_korean_restoration_economy:0 "Revitalize Industry and Commerce"
je_korean_restoration_economy_reason:0 "Liu Shouyuan once said, 'When the four classes each perform their duties, the nation will grow rich and strong. This can be achieved every day.' The distinction between scholar, farmer, artisan, and merchant is based on Confucian philosophy, and if scholars first cultivate themselves and manage their families, farmers, artisans, and merchants will follow suit. This is the true order of the four classes, the path to a wealthy and powerful nation."
je_korean_restoration_military:0 "Military Reform"
je_korean_restoration_military_reason:0 "Reviewing the many distortions in military affairs, the long-standing and ineffective system has led to citizens avoiding military service. From now on, Joseon must establish a regular army based on the three military branches."
je_korean_restoration_politics:0 "Establish the Police Department"
je_korean_restoration_politics_reason:0 "The powers of the Bureau of Crime Prevention have been insufficient, leading to many problems. We should expand the Bureau and establish it as the Police Department to maintain order and manage public safety."
je_korean_restoration_education:0 "Abolition of Confucian Academies"
je_korean_restoration_education_reason:0 "The Confucian academies that have sprung up all over the country are not serving the purpose of venerating the sages or spreading sacred teachings. Instead, they exploit the people. Except for a few honest academies, all others should settle their debts and be closed."
korean_restoration_2.1.t:0 "Path to a Wealthy and Powerful Nation"
korean_restoration_2.1.d:0 "The old maladies have been removed, and it is time to restore the country's prestige."
korean_restoration_2.1.f:0 "The ancients said, 'A wealthy nation and strong army will have no worries from within or outside. Those who care for the state can recognize the essence of governance.'"
korean_restoration_2.1.a:0 "Let's begin."
korean_restoration_2.2.t:0 "Wealth and Power"
korean_restoration_2.2.d:0 "Wealth and power refer to the policies that make the country prosperous, improve the lives of the people, and strengthen the military."
korean_restoration_2.2.f:0 "A scholar, after being separated for three days, should be viewed with new eyes. So should our efforts now."
korean_restoration_2.2.a:0 "Long live Joseon!"
korean_restoration_2.3.t:0 "The Last Resistance"
korean_restoration_2.3.d:0 "The landowners whose properties have been confiscated strongly oppose the reforms."
korean_restoration_2.3.f:0 "Parasites who suck the people's blood!"
korean_restoration_2.3.a:0 "Crush them all!"
korean_restoration_2.3.b:0 "Listen to their opinions."
korean_restoration_2.4.t:0 "Spread of Donghak"
korean_restoration_2.4.d:0 "Farmers are believing in a strange cult and openly expressing dissatisfaction with the court."
korean_restoration_2.4.f:0 "I too was born in the East and received teachings from the East. Though it is the way of Heaven, the study of Donghak is the path of the East. What is East and what is West?"
korean_restoration_2.4.a:0 "Let's see how it goes."
korean_restoration_2.4.b:0 "Let's observe the situation."
korean_restoration_2.5.t:0 "Tourist Trains"
korean_restoration_2.5.d:0 "More and more people are taking the newly introduced tourist trains for travel."
korean_restoration_2.5.f:0 "A heavy iron block racing between two tracks, spewing fire and smoke, is called a 'firewheel carriage.'"
korean_restoration_2.5.a:0 "This is a great invention. We should invest the state's resources into it."
korean_restoration_2.6.t:0 "Streetlights"
korean_restoration_2.6.d:0 "Streetlights have been erected throughout the city, and the people are delighted."
korean_restoration_2.6.f:0 "Every night, people gather in Jongno to watch, and after nine o'clock, they hurry to and fro without stopping."
korean_restoration_2.6.a:0 "It's beautiful."
korean_restoration_2.7.t:0 "Establish New Army"
korean_restoration_2.7.d:0 "The military reforms are complete, and a new army has been established. Now we must set the basic principles."
korean_restoration_2.7.f:0 "The army is the nation's shield, the people's weapon."
korean_restoration_2.7.a:0 "Our army should focus on defense by utilizing the national terrain."
korean_restoration_2.7.b:0 "The best defense is a good offense. We should focus on attack."
korean_restoration_2.8.t:0 "Introducing New Army"
korean_restoration_2.8.d:0 "After the introduction of the new army system, our military has become stronger, but there are still some unresolved issues."
korean_restoration_2.8.f:0 "Our soldiers have become strong by learning their skills. The name of the new army is now well-known, and even the sons of military families are joining, as are the scholars' youths. They have shed their previous shame, embracing the rough life of the army. This is something that must be fully implemented."
korean_restoration_2.8.a:0 "Fair treatment for all soldiers."
korean_restoration_2.8.b:0 "Improve the military system while maintaining balance."
korean_restoration_2.8.c:0 "Delay the old military wages."
korean_restoration_2.9.t:0 "Imjin Army Uprising"
korean_restoration_2.9.d:0 "Overemphasis on the new army has caused dissatisfaction among the old soldiers. It is rumored that they are about to revolt."
korean_restoration_2.9.f:0 "They who have been fed by just nine bushels of rice a year, and who have not received payment for years, still managed to serve without complaint. This is discipline in itself."
korean_restoration_2.9.a:0 "Crush these rebels! This is the royal command!"
korean_restoration_2.9.b:0 "This is due to my neglect. We should appease them."
korean_restoration_2.10.t:0 "Memorial to the Court"
korean_restoration_2.10.d:0 "A memorial has been submitted by the two classes regarding the establishment of the Police Department."
korean_restoration_2.10.f:0 "The Police Department is simply a renamed Bureau of Crime Prevention, which functions similarly to the Justice Bureau. There is no need to establish a new institution."
korean_restoration_2.10.a:0 "Go ahead with it."
korean_restoration_2.10.b:0 "Ignore their opinions."
korean_restoration_2.11.t:0 "Strike of the Commoners"
korean_restoration_2.11.d:0 "A commoner has struck a gong. It seems to be an expression of dissatisfaction with the current reforms."
korean_restoration_2.11.f:0 "The Great Code allows petitioners to strike the gong at the Justice Bureau to express grievances."
korean_restoration_2.11.a:0 "Accept it."
korean_restoration_2.11.b:0 "We cannot accept this."
korean_restoration_2.12.t:0 "Abolish Confucian Academies"
korean_restoration_2.12.d:0 "The royal command has been given to abolish the Confucian academies."
korean_restoration_2.12.f:0 "Before abolishing the academies, we must first eliminate the corruption at the head of the Wan Dong Temple, making their misconduct public, so the Confucian scholars will have no words left to say."
korean_restoration_2.12.a:0 "Abolish all of them."
korean_restoration_2.12.b:0 "We must take it step by step."
korean_restoration_2.13.t:0 "Debate on Foreign Language Education"
korean_restoration_2.13.d:0 "The rapidly changing world situation demands that we educate people in foreign languages."
korean_restoration_2.13.f:0 "From the world map introduced from China, England and France occupy half of the world. This is truly strange."
korean_restoration_2.13.a:0 "Reward scholars who learn English."
korean_restoration_2.13.b:0 "Reward scholars who learn French."
korean_restoration_2.14.t:0 "Western Science"
korean_restoration_2.14.d:0 "More and more people are willing to learn about the astonishing technologies from Western Europe."
korean_restoration_2.14.f:0 "Hong Dayong said, 'In Beijing, four large buildings have been constructed, called Catholic churches. This is the beginning of Western learning.'"
korean_restoration_2.14.a:0 "Support Western educational methods."
korean_restoration_2.14.b:0 "Introduce Western technologies."


 
 #개혁 3
 je_korean_restoration_third:0 "Period of Reform"
je_korean_restoration_third_reason:0 "The reforms so far are merely a foundation. To stand shoulder to shoulder with the great powers, we must go further."
je_korean_restoration_third_goal:0 "Bring in more systematic and advanced technologies from the West."

korean_restoration_3.1.t:0 "Discussion on Constitutional Monarchy"
korean_restoration_3.1.d:0 "The world is riding the wave of constitutional monarchy. Joseon must follow suit."
korean_restoration_3.1.f:0 "Your Majesty, seeing the ruling systems of Western powers, most of them have adopted constitutional monarchies. Would it not be wise to discuss this? It will surely benefit our nation."
korean_restoration_3.1.a:0 "A good idea."
korean_restoration_3.1.b:0 "Our rule of law is sufficient as it is."

korean_restoration_3.2.t:0 "Establishment of a New Judiciary"
korean_restoration_3.2.d:0 "Joseon was once a law-abiding nation with the Gyeongguk Daejeon, but over time, its effectiveness has weakened. Now, young officials propose the establishment of a new judiciary."
korean_restoration_3.2.f:0 "Looking at our current judicial system, the authority is scattered, making efficient operation difficult. Therefore, we seek your approval to establish a Western-style judiciary."
korean_restoration_3.2.a:0 "Do as you wish."
korean_restoration_3.2.b:0 "Our current system is sufficient."

korean_restoration_3.3.t:0 "Establishment of a Post Office"
korean_restoration_3.3.d:0 "A more systematic and modern communication system is needed than the current system of relays and beacon fires."
korean_restoration_3.3.f:0 "I have heard that in the West, there are dedicated postal departments that facilitate communication between the government and the people. Should we not adopt something similar?"
korean_restoration_3.3.a:0 "Establish a postal department and call it the Post Office."
korean_restoration_3.3.b:0 "The costs seem to outweigh the benefits. We should discontinue the idea."

korean_restoration_3.4.t:0 "Introduction of the Solar Calendar"
korean_restoration_3.4.d:0 "The current lunar calendar does not align with global trends. In an era of global integration, we must adapt."
korean_restoration_3.4.f:0 "Your Majesty, although we have a systematic lunar calendar, it is not used globally. I request your permission to introduce the solar calendar."
korean_restoration_3.4.a:0 "I grant permission."
korean_restoration_3.4.b:0 "Even with globalization, why must we change our calendar?"

korean_restoration_3.5.t:0 "Expansion of Women's Rights"
korean_restoration_3.5.d:0 "As modernization progresses in Joseon, more women are receiving higher education. Some women dissatisfied with gender discrimination are now demanding women's rights similar to those in Western countries."
korean_restoration_3.5.f:0 "This morning, the Hanseong Panyun reported that many women gathered in the streets with signs demanding a reconsideration of women's rights. I am told that in the West, women's rights have already been advanced. Although their demands may conflict with the Confucian ideals that have shaped our governance since the reign of King Taejo, their actions are becoming more radical, and there is fear of unrest."
korean_restoration_3.5.a:0 "The expansion of women's rights is the path to civilization. Grant their request."
korean_restoration_3.5.b:0 "A woman's duty is to bear children and serve the family. Let that be remembered."

korean_restoration_3.6.t:0 "Introduction of a Standardized Measurement System"
korean_restoration_3.6.d:0 "Joseon's measurement system is outdated. If we do not reform it, we will be left behind in the currents of history."
korean_restoration_3.6.f:0 "As the world engages in trade, our measurement system does not align with those of other nations, creating difficulties. I request your approval to reform it."
korean_restoration_3.6.a:0 "Adopt the metric system used in other countries."
korean_restoration_3.6.b:0 "Adopt the yard-pound system used in the United Kingdom."
korean_restoration_3.6.c:0 "In my view, the yard system may be better suited to us, but whatever, it is better than nothing."

korean_restoration_3.7.t:0 "Introduction of Banks"
korean_restoration_3.7.d:0 "The introduction of a modern banking system is the cornerstone of capitalism."
korean_restoration_3.7.f:0 "Your Majesty, a bank is a place where people deposit money, which is then used for business purposes. It greatly aids in the circulation of capital. Should we not introduce such a system?"
korean_restoration_3.7.a:0 "Establish a bank in the government and test it."
korean_restoration_3.7.b:0 "There is no need to introduce this system."

korean_restoration_3.8.t:0 "Adoption of Western-Style Court Attire"
korean_restoration_3.8.d:0 "In order to escape from pre-modernity and make a leap toward becoming a civilized nation, we must learn from the West in every aspect—technology, ideology, and even fashion."
korean_restoration_3.8.f:0 "To think like the West, we must dress like the West, eat like the West, and live like the West. Changing our court attire to Western style would send a strong signal that Joseon is entering the path of civilization."
korean_restoration_3.8.a:0 "We cannot change our attire just because we are modernizing. Abandon this idea."
korean_restoration_3.8.b:0 "It is right to follow the fashion of the greatest empire, the British Empire."
korean_restoration_3.8.c:0 "I have heard that the most cultured country in the West is France. We should follow their example."
korean_restoration_3.8.e:0 "It is better to follow Prussia’s frugal and pragmatic approach."

korean_restoration_3.9.t:0 "Short Hair Edict"
korean_restoration_3.9.d:0 "In the West, short hair is the standard style. Unlike the topknot, it is easier to manage."
korean_restoration_3.9.f:0 "Short hair is beneficial for health and convenience in work. This is why it is popular in the West. I request your approval to introduce this style."
korean_restoration_3.9.a:0 "Implement the Short Hair Edict."
korean_restoration_3.9.b:0 "Our bodies are gifts from our parents, and we are taught not to cut our hair. How can we change this tradition?"

korean_restoration_3.10.t:0 "Tax in Gold"
korean_restoration_3.10.d:0 "Paying taxes in grain is too cumbersome. It would be easier to collect taxes in gold."
korean_restoration_3.10.f:0 "Joseon has implemented the Dae Dong Law, collecting taxes in grain, but it is still difficult to manage. Should we not adopt a gold-based tax system, as in the West?"
korean_restoration_3.10.a:0 "It seems like a good idea. Implement it."
korean_restoration_3.10.b:0 "There is no need for such a change."

korean_restoration_3.11.t:0 "Modern Education System"
korean_restoration_3.11.d:0 "Joseon's education system is too focused on Confucianism. A modern education system is needed."
korean_restoration_3.11.f:0 "To handle the Western methods properly, we need an education system that is not overly focused on Confucianism. Reform is needed."
korean_restoration_3.11.a:0 "Allow people to study Western ideas."
korean_restoration_3.11.b:0 "Confucianism is a vital part of our culture."

korean_restoration_3.12.t:0 "Reorganization of the State Council"
korean_restoration_3.12.d:0 "The State Council has been a pillar of Joseon's central politics, but over the years, it has become inefficient and a hindrance. Some reform-minded officials suggest reorganizing it into a Western-style cabinet."
korean_restoration_3.12.f:0 "Your Majesty, the current State Council was once overthrown by powerful families, and public opinion is not favorable. Should we not reform it, following the example of Western cabinets?"
korean_restoration_3.12.a:0 "You are right. Abolish the State Council and establish a Western-style cabinet."
korean_restoration_3.12.b:0 "The State Council has already been reformed. There is no need for further changes."

korean_restoration_3.13.t:0 "Discussion on the Class System"
korean_restoration_3.13.d:0 "The class system has effectively divided Joseon into four
korean_restoration_3.13.b:0 "Although the class system does not align with virtue-based governance, overly radical reforms could cause chaos."

korean_restoration_3.14.t:0 "Introduction of New Currency"
korean_restoration_3.14.d:0 "Despite many past failures, currency reform is inevitable."
korean_restoration_3.14.f:0 "Your Majesty, I respectfully express my concern, as currency has the potential to cause great chaos in our nation. However, if we are to trade with the West, currency reform is unavoidable."
korean_restoration_3.14.a:0 "Your words are correct. Reorganize the nation's currency."
korean_restoration_3.14.b:0 "Let us not forget past mistakes; this is a path we should avoid."

korean_restoration_3.15.t:0 "Emergence of Enterprises"
korean_restoration_3.15.d:0 "Enterprises, accompanied by large-scale capital, are symbols of modernization."
korean_restoration_3.15.f:0 "The Hanseong Panyun reports that merchants in Hanseong have formed groups for foreign trade and now call themselves enterprises."
korean_restoration_3.15.a:0 "Support them and expand the enterprise system."
korean_restoration_3.15.b:0 "Tax them."

korean_restoration_3.16.t:0 "Reforms Completed"
korean_restoration_3.16.d:0 "After many discussions, the reforms of Joseon are complete. While not perfect, we are now on par with the great powers."
korean_restoration_3.16.f:0 "Your Majesty, the United States ambassador has stated that the U.S. will no longer sign unequal treaties with Joseon. I dare say, other great powers will also begin to see us as an equal trading partner."
korean_restoration_3.16.a:0 "This is excellent."


bosin_intervention.1.t:0 "Japanese Civil War"
bosin_intervention.1.d:0 "A civil war has broken out in Japan."
bosin_intervention.1.f:0 "There are disturbing reports from Japan. The leaders of the Satsuma and Chōshū clans have occupied the capital, Kyōto, to protect the Emperor, while the Shogunate's forces are rising to save the Emperor. Both sides are requesting our assistance, and our court must decide who to support."
bosin_intervention.1.a:0 "What does this have to do with us?"
bosin_intervention.1.b:0 "Support the Shogunate."
bosin_intervention.1.c:0 "Support the Royalists."
bosin_intervention.2.t:0 "Military Deployment Ready" #Shogunate Side
bosin_intervention.2.d:0 "A messenger from the Shogunate claims those supporting the Emperor are rebels."
bosin_intervention.2.f:0 "Satsuma and Chōshū have long opposed the Shogunate, and now they are besieging the Emperor in Kyōto. They claim to act in the Emperor’s name but are really rebels, seeking to usurp the throne. They are threatening the Emperor's life, and we must decide whether to support the Shogunate."
bosin_intervention.2.a:0 "Cancel the military deployment."
bosin_intervention.2.b:0 "Attack Satsuma."
bosin_intervention.3.t:0 "Military Deployment Ready" #Emperor's Side
bosin_intervention.3.d:0 "A messenger from the Emperor claims the Shogunate has been oppressing the people and acting as rebels."
bosin_intervention.3.f:0 "The messengers have informed us that the Shogunate, which has been sending letters in the Emperor’s name, is not the Emperor’s true representative. Instead, it is a group of generals who have been using the Emperor’s seal unlawfully. Now, loyalists are rising to protect the Emperor. Though it is not our direct concern, as a friendly nation, we must consider supporting their righteous cause."
bosin_intervention.3.a:0 "Cancel the support."
bosin_intervention.3.b:0 "Provide support."
bosin_intervention.4.t:0 "Support Arrives from Joseon" #Emperor's Side
bosin_intervention.4.d:0 "Joseon has sent weapons and financial aid to support us."
bosin_intervention.4.f:0 "The aid we have received comes from Joseon, in support of the loyalists who seek to protect the Emperor. This is a gratifying act of solidarity from a neighboring nation."
bosin_intervention.4.a:0 "Good!"

 
 

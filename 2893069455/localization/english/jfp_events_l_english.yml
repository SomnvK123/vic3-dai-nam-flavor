 # Ki-Hae Persecution
jpf_joseon.1.t:0 "Discussion of Foul Beliefs"
jpf_joseon.1.d:0 "U-Uijeong (Right State Councilor) Lee Jiyeon requested a full-scale investigation into the so-called 'foul beliefs', religions that are contradictory to Confucius' teachings."
jpf_joseon.1.f:0 ""Recently, our two investigation bureaus have captured dozens of criminals who were bewitched by the foul beliefs. Some have been handed over for further investigation, but almost all of them are determined to die and have been misled, with very few repenting. Even from those already exposed, it is impossible to determine how many of these cruel and vile groups have secretly formed their hideouts. Not only has human ethics collapsed, but customs are gradually becoming polluted. We cannot avoid worrying about the Yellow Turban Rebellion or the White Lotus cult. The current situation requires strict further investigation, and we must rule thoroughly without any intention of killing, but rather to save people." # Debate on punishing heretics, March 5, 1839, Year 5 of King Heonjong
jpf_joseon.1.a:0 "Do so. Let the provincial governors, including those from the royal family and in-law officials, make a commitment to thoroughly root out and eliminate them."
jpf_joseon.1.a.tt:0 "The Catholic persecution begins."
jpf_joseon.1.b:0 "The six punishments cannot be implemented. However, by ordering exile to the burial grounds, we will take effective action to permanently end it."
jpf_joseon.1.b.tt:0 "Anti-Catholic factions are angry."
jpf_ignored:0 "Ignore"
jpf_persecuted:0 "Persecution"
jpf_repected:0 "Respect"

jpf_joseon.2.t:0 "Ki-Hae Persecution"
jpf_joseon.2.d:0 "[SCOPE.sCountry('fra_scope').GetName] missionaries, including several foreigners, were executed."
jpf_joseon.2.f:0 "'Why would they abandon the peaceful path in this country and instead willingly follow strange beliefs from ten thousand miles away, walking straight into a trap? Ah! What will become of those not yet exposed? How will they be judged? A father should correct his son, and an elder brother should correct his younger brother. Those who are misguided must be reformed, and those who have not yet fallen should be warned to avoid it.'" # Excerpts from the Annals of King Heonjong, October 18, Year 5 of King Heonjong, edict against heretical teachings
jpf_joseon.2.a:0 "'In sorrow, I issue this decree.'"
jpf_joseon.2.a.tt:0 "[SCOPE.sCountry('fra_scope').GetNameNoFlag] would not be pleased to hear this..."

jpf_joseon.3.t:0 "[SCOPE.sCountry('kor_scope').GetNameNoFlag] Persecution in [ROOT.GetCountry.GetName]"
jpf_joseon.3.d:0 "Recently, there have been executions of Catholic believers in [SCOPE.sCountry('kor_scope').GetName]. Among the clergy of the [SCOPE.sCountry('kor_scope').GetNameNoFlag] diocese, including Bishop Ambrose of the second diocese, three [ROOT.GetCountry.GetName] priests staying in [SCOPE.sCountry('kor_scope').GetNameNoFlag] were killed, and many laypeople also became martyrs. While [SCOPE.sCountry('kor_scope').GetNameNoFlag] claims that violations of the foreign entry ban law were the reason for the executions, Chinese and Japanese nationals who violated the law were merely deported, leaving the reasons for the execution of [ROOT.GetCountry.GetName] nationals unclear."
jpf_joseon.3.a:0 "What... where?"
jpf_joseon.3.b:0 "Send a letter to the [SCOPE.sCountry('kor_scope').GetName] government."
jpf_joseon.3.c:0 "Prepare the fleet."

jpf_joseon.4.t:0 "[SCOPE.sCountry('fra_scope').GetNameNoFlag] Letter"
jpf_joseon.4.d:0 "[SCOPE.sCountry('fra_scope').GetName] sent a letter regarding the suppression of heretical teachings during the Sinhae year."
jpf_joseon.4.f:0 "'If anything happens that severely harms the citizens of our country in the future, your [ROOT.GetCountry.GetNameNoFlag] will undoubtedly face great disaster. In such a case, the disaster will strike all the way from the king to the ministers and officials, and no one can blame others, but will only be left to regret their own unfaithfulness, immorality, and rudeness. I hope you understand this.'"
jpf_joseon.4.a:0 "That's very rude."

jpf_joseon.5.t:0 "[SCOPE.sCountry('fra_scope').GetNameNoFlag] Letter"
jpf_joseon.5.d:0 "[SCOPE.sCountry('fra_scope').GetName] sent a letter regarding the suppression of heretical teachings during the Sinhae year."
jpf_joseon.5.f:0 "'I have come here under the emperor's orders to protect our military and citizens. The person killed unjustly in this country was someone who had been honored as a missionary from our country. You killed him unjustly, so punishment is justified. The new [SCOPE.sCountry('fra_scope').GetNameNoFlag] ambassador has decided to punish the unfaithful and immoral nation of [ROOT.GetCountry.GetNameNoFlag]. If you do not listen and follow the orders, you will not be forgiven.'"
jpf_joseon.5.a:0 "The barbarians have gone mad!"

jpf_joseon.6.t:0 "Discussion of Evil-Teaching"
jpf_joseon.6.d:0 "A Confucian scholar fled to the West and spent ten years studying heretical teachings before returning to [ROOT.GetCountry.GetName]."
jpf_joseon.6.f:0 "'He was interrogated for a month at the court, but his words were crafty, and he relied on the strength of the Yangbaks to threaten and say, 'Our country will never forbid this doctrine. The kindness spread from abroad is all taken from the books that Yang Han sent.'"
jpf_joseon.6.a:0 "Heretical teachings are harmful and ruinous. Immediately arrest those who are studying such teachings nationwide and punish them."
jpf_joseon.6.a.tt:0 "The Catholic persecution begins."
jpf_joseon.6.b:0 "We cannot only hold on to Confucianism forever. Let him go."
jpf_joseon.6.b.tt:0 "Anti-Catholic factions are furious."

jpf_joseon.7.t:0 "Execution of Evil-Teaching Criminal"
jpf_joseon.7.d:0 "Today, we executed a heretic who bewitched the people with evil teachings."
jpf_joseon.7.f:0 "'My time is up, so listen well. The reason I contacted foreigners was for my religion and my God. Now I die for Him. My eternal life is about to begin. If you want happiness after death, believe in God.'"
jpf_joseon.7.a:0 "I hope it quiets down now."


# 해결책 for 삼정의 문란
je_korean_restoration_history:0 "The Land of the Morning Calm"
je_korean_restoration_history_reason:0 "For hundreds of years of peace, Joseon has been groaning under various maladies."
je_korean_restoration_history_goal:0 "Struggling for solutions"
je_korean_restoration_first:0 "Resolving the Disarray of the Three Policies"
je_korean_restoration_first_reason:0 "The disarray of the Three Policies has ruined the lives of the people. It must be corrected immediately."
je_korean_restoration_first_goal:0 "Continued Reform"
je_korean_restoration_hwangok:0 "Eradication of the Abuses in the Hwangok System"
je_korean_restoration_hwangok_reason:0 "Hwangok was originally a system where the state lent resources to those without means to survive the winter, a reasonable relief measure. However, it has now become a predatory practice where the wealthy exploit the poor through usury. We must replace relief grain with cash and eliminate the accompanying abuses."
je_korean_restoration_gunjeong:0 "Eradication of Abuses in Military Service"
je_korean_restoration_gunjeong_reason:0 "Military service was originally a system where one could pay with a bale of rice instead of serving. However, today only three out of ten are fulfilling their military duty, while others evade service by any means necessary, leaving the military roster and barracks empty. The government must create a new roster and verify the number of eligible men, ensuring no unjust punishments."
je_korean_restoration_jeonjeong:0 "Eradication of Abuses in Land Taxation"
je_korean_restoration_jeonjeong_reason:0 "Land taxation, known as Jeonjeong, is an ancient system where landlords pay taxes on rice fields. However, local officials and landlords have colluded to shift the burden to the farmers, charging exorbitant taxes and extracting rice and fabric even from barren lands. This abuse has grown to an intolerable scale. To eradicate it, the government must directly intervene, conduct a nationwide land survey, and punish corrupt officials and landlords to restore order."
je_korean_restoration_restart:0 "Reform by Other Means"
je_korean_restoration_restart_reason:0 "The spark of reform remains."
je_korean_restoration_restart_goal:0 "For the next ten years, the following conditions must be met:"
samjeong_complete_tt:0 "Reform the Three Policies"
hwangok_complete_tt:0 "Resolve the Abuses in the Hwangok System (Confirm Decision)"
gunjeong_complete_tt:0 "Resolve the Abuses in Military Service"
jeonjeong_complete_tt:0 "Resolve the Abuses in Land Taxation"

korean_restoration.1.t:0 "Disarray of the Three Policies"
korean_restoration.1.d:0 "The three main elements of the nation's finances — land tax (Jeonjeong), military service (Gunjeong), and relief grain (Hwangok) — have become increasingly disordered. The people cannot even heat their homes during the winter, and the Hwangok system, initially designed to help the poor, has become a symbol of usury. A solution is urgently needed."
korean_restoration.1.f:0 ""Your Majesty, I humbly report, as King Jangheon once said, 'The people are the foundation of the nation, and their food is their heaven.' Yet, the eight provinces of Joseon are in dire straits. The people are starving, resorting to theft, and local officials are focused on filling their own coffers. Please, we beg you to look upon this with care.""
korean_restoration.1.a:0 "Immediately devise a solution."
korean_restoration.2.t:0 "Eradication of the Disarray in the Three Policies"
korean_restoration.2.d:0 "The long-standing disarray in the three policies, which had caused much anguish in the court, has been eradicated."
korean_restoration.2.f:0 ""Your Majesty, as Confucius said, just as Ji Sun once transformed farmers, fishermen, and potters, the virtuous actions of a ruler will cause the people below him to follow suit. Even if the current national crisis has passed, it is still not enough. Accumulating virtue is the right path to governing the country.""
korean_restoration.2.a:0 "This was only possible because the spirits of our ancestors were with us."
korean_restoration.2.b:0 "How could it be due to my lack of virtue? It was all possible because of the people."
korean_restoration.3.t:0 "Landlords' Resistance"
korean_restoration.3.d:0 "Land tax is traditionally levied on landlords, but corrupt officials and local leaders have colluded to conceal land ownership. Numerous agricultural lands subject to tax have recently been discovered."
korean_restoration.3.f:0 ""We must collect the rent, the land tax, and what else are we supposed to live on? We are human beings too!""
korean_restoration.3.a:0 "Their complaints seem justified. Conduct a new land survey."
korean_restoration.3.b:0 "Ha! The so-called 'scholars' are so complacent and driven by greed. These people must be strictly punished according to the law!"
korean_restoration.4.t:0 "Farmers Suffering from Excessive Taxes"
korean_restoration.4.d:0 "Originally, Joseon was known for valuing the well-being of the people over wealth, imposing minimal taxes on them. But over time, many officials have accumulated wealth, creating numerous arbitrary taxes that have burdened the people. As a result, the citizens in all provinces are suffering."
korean_restoration.4.f:0 ""Your Majesty, I humbly report, Joseon was originally known for its careful consideration of the people, imposing light taxes. However, the corrupt officials in all eight provinces have created various illegal taxes, leaving the innocent people to suffer. Please, we beg you to address this issue.""
korean_restoration.4.a:0 "Inform the Saheonbu to punish the corrupt officials, and abolish the arbitrary taxes."
korean_restoration.4.b:0 "While it may not align with the principles of virtuous rule, the financial situation of the country is so dire that we must postpone this matter."
# Newly added section
# Hwangok
korean_restoration.5.t:0 "Resolution of the Abuses in the Hwangok System"
korean_restoration.5.d:0 "The abuses that the court had sought to reform over the years have now been eradicated. The compassionate spirit of King Yeoseong's reign has begun to shine."
korean_restoration.5.f:0 ""I, Jo Inyoung, humbly report, originally, the Hwangok system was created to help the people during famines, but local corrupt officials misused it, causing disorder. However, with Your Majesty's direct orders, the abuses have now been corrected, and the people are filled with gratitude for your grace.""
korean_restoration.5.a:0 "How fortunate."
korean_restoration.6.t:0 "Nationwide Food Shortage"
korean_restoration.6.d:0 "The reports from local officials are worrisome."
korean_restoration.6.f:0 "The reports coming in from all over the country show that grain reserves are extremely low, and it is feared that this year will bring a severe food crisis."
korean_restoration.6.a:0 "Conduct a census of grain reserves."
korean_restoration.6.b:0 "Increase taxes on farmers."
korean_restoration.7.t:0 "Discussion on Debt Forgiveness for Hwangok"
korean_restoration.7.d:0 "Due to frequent floods and storms, harvests have been poor. It seems best to forgive the debts in the Hwangok system this year and release the stored grain."
korean_restoration.7.f:0 "The government must ensure that the people have the necessary tools to live comfortably and enough food to prevent starvation. Continuing with the Hwangok system this year, despite the bad harvest, amounts to exploitation, and I humbly report that it is an act of excessive taxation."
korean_restoration.7.a:0 "Forgive the Hwangok debts."
korean_restoration.7.b:0 "Uphold the principles."
korean_restoration.8.t:0 "Official Who Embezzled Relief Grain"
korean_restoration.8.d:0 "An official in one region embezzled relief grain."
korean_restoration.8.f:0 ""While countless people are starving throughout the eight provinces, such actions cannot be tolerated. It is only right that the perpetrator be severely punished to set an example for corrupt officials nationwide.""
korean_restoration.8.a:0 "Punish the offender and instill a sense of caution in the corrupt officials nationwide."
korean_restoration.8.b:0 "Let it slide."
korean_restoration.9.t:0 "Debt Forgiveness for Relief Grain in Honam"
korean_restoration.9.d:0 "Due to the continued poor harvests in Honam, there is a need to forgive a portion of the relief grain debt."
korean_restoration.9.f:0 "The severe famine in Honam has caused the people to cry out in the streets. Countless deaths from starvation have occurred. What do you think about forgiving the relief grain debt in Honam?"
korean_restoration.9.a:0 "Forgive the debt."
korean_restoration.9.b:0 "Do not forgive the debt."
korean_restoration.10.t:0 "Debt Forgiveness for Relief Grain in Gangwon"
korean_restoration.10.d:0 "Due to continued poor harvests in Gangwon, there is a need to forgive a portion of the relief grain debt."
korean_restoration.10.f:0 "The severe famine in Gangwon has caused the people to cry out in the streets. Countless deaths from starvation have occurred. What do you think about forgiving the relief grain debt in Gangwon?"
korean_restoration.10.a:0 "Forgive the debt."
korean_restoration.10.b:0 "Do not forgive the debt."
korean_restoration.11.t:0 "Debt Forgiveness for Relief Grain in Yeongnam"
korean_restoration.11.d:0 "Due to continued poor harvests in Yeongnam, there is a need to forgive a portion of the relief grain debt."
korean_restoration.11.f:0 "The severe famine in Yeongnam has caused the people to cry out in the streets. Countless deaths from starvation have occurred. What do you think about forgiving the relief grain debt in Yeongnam?"
korean_restoration.11.a:0 "Forgive the debt."
korean_restoration.11.b:0 "Do not forgive the debt."
korean_restoration.12.t:0 "Debt Forgiveness for Relief Grain in Gyeongbuk"
korean_restoration.12.d:0 "Due to continued poor harvests in Gyeongbuk, there is a need to forgive a portion of the relief grain debt."
korean_restoration.12.f:0 "The severe famine in Gyeongbuk has caused the people to cry out in the streets. Countless deaths from starvation have occurred. What do you think about forgiving the relief grain debt in Gyeongbuk?"
korean_restoration.12.a:0 "Forgive the debt."
korean_restoration.12.b:0 "Do not forgive the debt."
korean_restoration.13.t:0 "Debt Forgiveness for Relief Grain in Haeseo"
korean_restoration.13.d:0 "Due to continued poor harvests in Haeseo, there is a need to forgive a portion of the relief grain debt."
korean_restoration.13.f:0 "The severe famine in Haeseo has caused the people to cry out in the streets. Countless deaths from starvation have occurred. What do you think about forgiving the relief grain debt in Haeseo?"
korean_restoration.13.a:0 "Forgive the debt."
korean_restoration.13.b:0 "Do not forgive the debt."
korean_restoration.14.t:0 "Reduction of Interest on Relief Grain Loans"
korean_restoration.14.d:0 "As more people struggle with the burden of relief grain loans, there is a need to reduce the interest rate."
korean_restoration.14.f:0 ""Your Majesty, I humbly report, as Zhu Xi wrote, 'Receive grain in summer, repay it with interest in winter. If there is a poor harvest, reduce the interest by half, and if a great famine occurs, forgive all of it.' The current situation is as dire as a great famine, and thus reducing the interest is only appropriate. Please consider my humble suggestion.""
korean_restoration.14.a:0 "Act according to the advice."
korean_restoration.14.b:0 "The principles must be upheld. This cannot be permitted."
korean_restoration.15.t:0 "New Decision" # Decision notification
korean_restoration.15.d:0 "It is time to discuss a new method to resolve the abuses in the Hwangok system."
korean_restoration.15.f:0 "The current methods have been ineffective in solving the abuses of the Hwangok system. Therefore, a new approach is necessary."
korean_restoration.15.a:0 "Let us confirm the decision."
korean_restoration.16.t:0 "Forced Grain Loans"
korean_restoration.16.d:0 "In some regions, forced grain loans have been given to the people."
korean_restoration.16.f:0 "The Office of Censors reports that in various regions, officials are forcing grain loans on the people and collecting interest. The harm is severe, and many commoners are suffering."
korean_restoration.16.a:0 "Punish the officials."
korean_restoration.16.b:0 "Isn't it good if tax revenue increases?"
korean_restoration.17.t:0 "Embezzlement Prohibition"
korean_restoration.17.d:0 "There is an increase in officials embezzling from the relief grain fund."
korean_restoration.17.f:0 "The relief grain system was originally established to prevent the common people from starving during difficult times, but it has been repeatedly exploited by officials to satisfy their own desires."
korean_restoration.17.a:0 "Identify and punish the officials severely."
korean_restoration.17.b:0 "Let it slide."
korean_restoration.18.t:0 "Investigation"
korean_restoration.18.d:0 "Grain given to the people has been found to contain pebbles and sand."
korean_restoration.18.f:0 "The Office of Censors reports that, according to investigations, officials have been giving the people sand and pebbles instead of rice and collecting interest, making huge profits."
korean_restoration.18.a:0 "Punish the officials who mocked the people."
korean_restoration.18.b:0 "Isn't that just a mistake?"
korean_restoration.19.t:0 "Final Solution to the Problems of the Relief Grain System"
korean_restoration.19.d:0 "The relief grain system has caused numerous problems. It is now time to address them."
korean_restoration.19.f:0 "Although the relief grain system was established to help the people, its abuses have become so severe that it is beyond control. We must reform the system and introduce a new method."
korean_restoration.19.a:0 "Reform the system and introduce a new approach."
korean_restoration.19.b:0 "Re-examine the problems of the relief grain system."
# Jeongjeong (Land Tax)
korean_restoration.20.t:0 "Implementation of Land Survey (Yangjeon)"
korean_restoration.20.d:0 "The abuses of land tax have become severe, and it is time to reintroduce the land survey."
korean_restoration.20.f:1 "The National Code, from the Gyeongguk Daejeon to the Daejeon Hoetong, stipulates that a land survey should be conducted every 20 years, but due to the immense cost and manpower required, it has not been done properly. I propose that land surveyors be sent across the entire country to investigate land quality and size, ensuring that land taxes are properly assessed and abuses are prevented."
korean_restoration.20.a:0 "Conduct the land survey nationwide."
korean_restoration.20.b:0 "Implement the land survey gradually."
korean_restoration.21.t:0 "Taxation on Nonexistent Land"
korean_restoration.21.d:0 "There have been cases where taxes are being collected on non-existent land."
korean_restoration.21.f:0 "Tax officials are collecting taxes under the pretext of land that does not exist, essentially taxing the dead and the bones of the deceased."
korean_restoration.21.a:0 "Punish them immediately."
korean_restoration.21.b:0 "Let them go, as there are no resources to handle this."
korean_restoration.22.t:0 "Exclusion of Land from Taxation"
korean_restoration.22.d:0 "There have been cases where taxes are not being collected on fertile land."
korean_restoration.22.f:0 "Exclusion refers to cases during land surveys when fertile fields are omitted from the official records, and 'Yeo-gyeol' refers to reducing the size of land areas in official records, thus enabling officials to collect taxes on the remaining land."
korean_restoration.22.a:0 "Punish them immediately and register the land in the records."
korean_restoration.22.b:0 "It could happen sometimes."
korean_restoration.23.t:0 "Corrupt Officials"
korean_restoration.23.d:0 "There have been instances where corrupt officials have been setting arbitrary land tax rates."
korean_restoration.23.f:0 "One official says, 'For this land, let us collect 10 'du' per 'gyeol,' while for that one, we can take only 8. For the good land, let's charge 12, and for the land near Lord Jo’s house, let's take only a sack of rice.'"
korean_restoration.23.a:0 ""The Office of Investigation should fully expose the crimes and punish the officials severely according to national law.""
korean_restoration.23.b:0 ""This situation is clearly complicated by many underlying factors.""
korean_restoration.24.t:0 "Abuses in the Collection of Grain Taxes"
korean_restoration.24.d:0 "It has been confirmed that grain taxes are being collected at double the rate."
korean_restoration.24.f:0 "The law states that the tax for one gyeol of farmland should be 20 mal of rice and 2 du, but farmers are being forced to pay 40 mal of rice, 10 mal of barley, and additional money. Due to the actions of corrupt officials, the total amount collected exceeds 100 mal per gyeol."
korean_restoration.24.a:0 ""Execute the punishment immediately and return the illegally collected taxes. This is an imperial order.""
korean_restoration.24.b:0 ""Given the dire financial situation, hold off on the punishment for now.""
korean_restoration.25.t:0 "Nationwide Land Survey Implementation"
korean_restoration.25.d:0 "Local government offices across the country are conducting land surveys and issuing land certificates."
korean_restoration.25.f:0 "Local offices across the eight provinces are measuring land and issuing certificates, but due to a shortage of paper, printing houses are struggling. However, once the land boundaries are firmly established, corrupt officials will no longer be able to manipulate the land taxes."
korean_restoration.25.a:0 "This should improve things."
korean_restoration.26.t:0 "Gradual Implementation of Land Survey"
korean_restoration.26.d:0 "The land survey is being implemented in some regions, but there is dissatisfaction in areas where it has not yet been carried out."
korean_restoration.26.f:0 "In Gyeonggi and Chungcheong, the land survey has been carried out, and the problems with land tax have disappeared. However, in the regions where it has not yet been implemented, corrupt officials still dominate, and some farmers are abandoning their land to migrate to areas where the land survey has already been conducted."
korean_restoration.26.a:0 "It seems like the worst is over."
gunjeong_1tt:0 "Strengthen the conscription conditions and move towards a recruitment-based system."
gunjeong_2tt:0 "Ease the burden on the people and move towards a conscription-based system."
korean_restoration.27.t:0 "Avoidance of Military Service"
korean_restoration.27.d:0 "The chaos in the military service system has reached its peak, with no one fulfilling their military duties."
korean_restoration.27.f:0 "It is said that there are three million able-bodied men in Joseon, but only about one million are registered for military service, and in reality, only around twenty thousand actually perform their duties. This is a serious issue that must be addressed immediately."
korean_restoration.27.a:0 "Isn't the standard for military service flawed? Strengthen the conditions."
korean_restoration.27.b:0 "Investigate why the people are avoiding military service."
korean_restoration.28.t:0 "Taxation on the Dead"
korean_restoration.28.d:0 "It has been discovered that taxes are being levied on deceased individuals."
korean_restoration.28.f:0 "According to the national law, individuals who have served for 45 years in military service and reached the age of 60 are exempt from taxation. However, corrupt officials have been exploiting this by using unpaid military service as an excuse to impose taxes on the descendants of the deceased."
korean_restoration.28.a:0 "Interrogate the officials and strengthen conscription conditions."
korean_restoration.28.b:0 "Interrogate the officials and reduce the military tax."
korean_restoration.29.t:0 "Family Military Tax"
korean_restoration.29.d:0 "It has become an issue where military taxes are being imposed on the families of those who have fled military service."
korean_restoration.29.f:0 "Officials who have misused public funds have been extorting military taxes from the families of individuals who have avoided service, causing severe harm."
korean_restoration.29.a:0 "The system for military service was already chaotic, and this situation has arisen because of it. Reform the system."
korean_restoration.29.b:0 "The burden of military taxes seems to be the issue. Reduce the military tax."
korean_restoration.30.t:0 "Excessive Collection of Military Taxes"
korean_restoration.30.d:0 "The excessive collection of military taxes in some regions has increased the suffering of the people."
korean_restoration.30.f:0 "In a village in Gyeolbat, a woman gave birth to a child, and within three days, military taxes were demanded. When the tax collector took the family's cow as payment, the husband, in despair, cut off his own genitals and said, 'This is the burden I carry because of this.' The wife, with blood dripping, went to the local office to plead, but the gatekeeper refused her entry."
korean_restoration.30.a:0 "Collect the military tax in accordance with the law."
korean_restoration.30.b:0 "The issues surrounding military tax are severe. Reduce the tax burden."
korean_restoration.31.t:0 "Resolution of Military Service Issues"
korean_restoration.31.d:0 "It is time for a reassessment of the military service system."
korean_restoration.31.f:0 ""
korean_restoration.31.a:0 "The quality of those who serve in the military is more important than the quantity."
korean_restoration.31.b:0 "Reduce the burden of military taxes and improve the military service system."
korean_restoration.32.t:0 "The Birth of a Modern Volunteer Army"
korean_restoration.32.d:0 "It is more important to establish a proper military force than to impose compulsory military service on the people."
korean_restoration.32.f:0 ""
korean_restoration.32.a:0 "Good."
korean_restoration.33.t:0 "The Birth of a Modern Conscription System"
korean_restoration.33.d:0 "It is more important to establish a proper military force than to impose compulsory military service on the people."
korean_restoration.33.f:0 ""
korean_restoration.33.a:0 "Good."
korean_restoration.34.t:0 "Resolution of Military Service Issues through Volunteer Army"
korean_restoration.34.d:0 "The chaos in military service has now been completely resolved."
korean_restoration.34.f:0 ""
korean_restoration.34.a:0 "Good."
korean_restoration.35.t:0 "Resolution of Military Service Issues through Conscription"
korean_restoration.35.d:0 "The chaos in military service has now been completely resolved."
korean_restoration.35.f:0 ""
korean_restoration.35.a:0 "Good."
korean_restoration.36.t:0 "Decision on the Resolution of Military Issues"
korean_restoration.36.d:0 "It is time to make a final decision."
korean_restoration.36.f:0 ""
korean_restoration.36.a:0 "Let's confirm the decision."


jap_kor_support_button: "Make Peace with Japan"
jap_kor_support_button_desc: "Becoming a protectorate of [concept_jap_empire] is my greatest honor."

jap_kor_relationship_button: "Flatter Japan"
jap_kor_relationship_button_desc: "Our relationship with Japan should grow closer, as China's situation is already bad enough."

jap_kor_truce_button: "Japan's Military Aid"
jap_kor_truce_button_desc: "In case of invasion, we should request [concept_jap_empire] to send troops!"

jap_kor_revolution_button: "Sign the Korea-Japan Annexation Treaty"
jap_kor_revolution_button_desc: "The governments of Japan and Korea wish to strengthen the two empires' mutual benefits and shared interests, recognizing Korea's prosperity until the final goal is achieved."

give_up_kor_tt:0 "Merge our country with Japan into the #o Empire of Japan#!"

je_japan_korean_releation:0 "Korean-Japanese Relations"
je_japan_korean_releation_reason:0 "Our kingdom, located in the corner of East Asia, shares a border with [SCOPE.sCountry('jap_scope').GetAdjective]. The relationship between the two countries, whether close or distant, has far-reaching consequences. In the past, Korea and [SCOPE.sCountry('jap_scope').GetAdjective] maintained close relations through trade and cultural exchange. If relations are harmonious, the people will live peacefully, trade will flourish, and culture will thrive. We can borrow Japan's technology to strengthen our kingdom and spread our civilization to increase our influence. However, if relations sour, war may break out, and the people will suffer. [SCOPE.sCountry('jap_scope').GetAdjective] has long harbored ambitions to dominate our kingdom. Should war break out, our lands will be ravaged, and our people will be displaced."

kor_rus_alliance_button:0 "Russo-Korean Agreement"
kor_rus_alliance_button_desc:0 "Allow [concept_russian] investors and military to enter our country in exchange for their protection, balancing Japan’s influence in Manchuria."

jap_rus_war_rus_lose_tt:0 "The Russo-Japanese War ended with [SCOPE.sCountry('rus_scope').GetAdjective]'s disastrous defeat, and [SCOPE.sCountry('rus_scope').GetAdjective]'s influence is completely expelled from the Korean Peninsula."

kor_rus_relationship_button:0 "Flatter Russia"
kor_rus_relationship_button_desc:0 "Mending relations with Russia can enhance our sense of security."

kor_rus_truce_button: "Korean-Russian Non-Aggression Pact"
kor_rus_truce_button_desc: "The two peoples share close bonds and promise eternal peace and cooperation."

je_kor_rus_relationship:0 "Korean-Russian Relations"
je_kor_rus_relationship_reason:0 "Historically, Korea shares a border with Russia, with occasional disputes. If relations improve, both nations could benefit greatly. Russia’s assistance would help defend against foreign threats, ensuring peace and prosperity. The cultural exchange could also enrich both countries."


donghak_je_events.7.d:0 "A king was brought from close relatives."
donghak_je_events.7.f:0 "The new king to be crowned is the grandson of Eun-eon-gun Yi In, born from the union of Crown Prince Sado and Princess Yangje Im. He lived like an ordinary citizen in Ganghwa Island during his youth and did not receive royal education or scholarly training."
donghak_je_events.7.a:0 "The beginning of a new Joseon."

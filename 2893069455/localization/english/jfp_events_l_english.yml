donghak_je_events.8.d:0 "A king was brought from distant relatives."
donghak_je_events.8.f:0 "The new king to be crowned is the second son of Heungseon Daewongun, Yi Ha-eung, and the great-grandson of King Yeongjo. His childhood name was 'Myeongbok'."
donghak_je_events.8.a:0 "The beginning of a new Joseon."

# Diplomatic Policy Decision

korean_empire_dip: "Diplomatic Policy Decision"
korean_empire_dip_desc: "It is time to decide where we should go next."
 sino_event.146.t: "China's Control Over [SCOPE.GetRootScope.GetCountry.GetName]"
sino_event.146.d: "The government is weak, with powerful ministers controlling the state. The political situation deteriorates, and the people suffer. Heavy taxes, as heavy as a mountain, lead to widespread unrest, and anger is beyond control. Furthermore, frequent natural disasters and years of famine have caused untold misery."
sino_event.146.f: "Foreign threats loom, with powerful nations eyeing us. They are carving away our territory, demanding reparations, and reducing our national dignity to dust. The country is devastated by constant warfare, and the land is shattered. The people are displaced, separated from their families, and the cries of sorrow are deafening."
sino_event.146.a: "Hundreds of years of peace have caused Joseon to decay beyond repair."


dsk_aus.43.t: "Armed Annexation Proposal for Hungary"
dsk_aus.43.d: "Although Hungary has left Austria, it does not mean that our Caesar allows them to leave [SCOPE.GetRootScope.GetCountry.GetName]."
dsk_aus.43.f: "I will not allow a democratic republic to appear on our border"
dsk_aus.43.a: "Use force to annex Hungary into the empire, the empire will crush these republicans"
dsk_aus.43.b: "Reject the proposal"
dsk_aus.44.t: "German-Hungarian Compromise Proposal"
dsk_aus.44.d: "Hungary is willing to form a federation with [SCOPE.GetRootScope.GetCountry.GetName]"
dsk_aus.44.f: "Grant Hungary sufficient autonomy and guarantee their independence, form a federation between Hungary and [SCOPE.GetRootScope.GetCountry.GetName]"
dsk_aus.44.a: "The result is still good"


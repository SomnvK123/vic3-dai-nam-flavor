Soviet_union_end: "We have established the Soviet Union"
Soviet_union1: "October Revolution"
Soviet_union1_reason: "What are our enemies? In our country, class contradictions have escalated to an irreconcilable point. The bourgeoisie, petty bourgeoisie, and old nobility are all enemies of the working class.\n\nComrades, when the revolution is still ongoing, that is, when the entire class is dying, it is completely different from a person's death.\nAfter a person dies, the corpse can be carried out, but when the old society is dying, unfortunately, the corpse of the bourgeoisie cannot be immediately placed in a coffin and buried in a grave.\nThe corpse of the bourgeoisie is rotting in our hearts, infecting us all with poison, and emitting a foul odor!\nThe assassination of Comrade Blyukher shows the white terror of the counter-revolution against us. Traitors judged by the will of the people must be mercilessly eliminated!\nLet the bourgeoisie go mad! Let those worthless souls weep. Comrades, our answer is this.\nWith triple vigilance, caution, and patience, everyone must hold their position. Comrades, you must remember: we have only one way out, victory! There is another way out, death.\n\n#N Death does not belong to the working class!#!"

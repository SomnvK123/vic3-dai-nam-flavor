l_english:
 usa-spa.1:0 "Spanish-American War."
 usa-spa.1_reason:0 "Some Spanish colonies are too close to us, and our relations with Spain leave much to be desired. We must eliminate the threat of attack from these territories by conquering them first."
 usa-spa.2:0 "Treaty of Paris"
 usa-spa.2_reason:0 "We won! But in the conquered Philippines the unrest does not abate; a peace treaty must be signed to keep Spain out of a new conflict."
 fra-ger.1:0 "Franco-Prussian War."
 fra-ger.1_reason:0 "One step away from complete German unification is the return of Alsace-Lorraine to the fold of its native nation."
 fra-ger.2:0 "The Peace of Frankfurt."
 fra-ger.2_reason:0 "Northeast France is under our occupation, Napoleon is captured, the Second French Empire is destroyed. Declare Alsace-Lorraine to be part of us and proclaim the German Empire!"
 re3:0 "New Cooperation."
 re3_reason:0 "Our attempts to improve relations with Germany and Austria have failed. It is worth making another attempt."
 afg:0 "Afghan Protectorate."
 afg_reason:0 "Our rivalry with Russia in Central Asia is coming to an end. A point must be made by delimiting the last bastion of independence, Afghanistan.
 fra-ger.1f:0 "Franco-Prussian War."
 fra-ger.1f_reason:0 "One step remains before the complete unification of Germany - the return of Alsace-Lorraine to the bosom of the native nation."
 fra-ger.2f:0 "The Peace of Frankfurt"
 fra-ger.2f_reason:0 "Northeast France is under our occupation, Napoleon is captured, the Second French Empire is destroyed. Declare Alsace-Lorraine to be part of us and declare the German Empire!"
 arg_reason:0 "Colonization of the southern territories."
 arg_reason:0 "The lands south of us are inhabited by savage tribes. Now that we have considerable technological superiority over them, we can begin the conquest of these territories."

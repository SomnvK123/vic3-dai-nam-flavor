judicial_appeal:0 "Landowner Court Challenges"
paramilitary_raid:0 "Militia Registry Attacks" 
successful_land_reform:0 "New Land Act"

concept_FNTT:0 "National Federation of Land Workers"
concept_FNTT_desc:0 "Socialist-aligned peasant union with 400,000 members (1932). Organized 1933 land strikes resulting in 37 deaths"
# 准军事组织
concept_somaten:0 "Landlord Militia"
concept_somaten_desc:0 "Paramilitary forces funded by #v $Seville$#! landlords, armed with #v Mauser rifles#!, responsible for #v $Casas Viejas Massacre$#! in 1933"

concept_black_hand:0 "Black Hand Operations"
concept_black_hand_desc:0 "Landowner terror campaign (1932-1936) assassinating 73 agrarian reform officials"

# 共和派宪法修正案通过
dsk_spa.25.t:0 "«New Constitution Enacted»"
dsk_spa.25.d:0 "#bold [concept_1933_constitution]#! passes with #v 245 votes#! as #yellow [concept_manuel_azana]#! declares: 'Victory for workers and peasants!' Key provisions:\n• #v [concept_secularism]#!\n• #v Catalan Autonomy#!\n• #v Agrarian Acceleration#!\n\n#v Spanish Right-Wing Alliance#! leader proclaims: 'This will trigger [concept_crusade]!' Militias begin gathering in #v [concept_navarra]#! mountains..."
dsk_spa.25.f:0 "The Republican faction supported the Second Spanish Republic against Nationalist rebels during 1936-1939 Civil War. Comprising communists and anarchists, they received Soviet and Mexican support."
dsk_spa.25.a:0 "«Continue Social Revolution»\n'We must strike while the iron is hot!' - #v National Labor Federation#! representatives rally"

# 国民派宪法修正案通过  
dsk_spa.26.t:0 "«Bloody Dictatorship»"
dsk_spa.26.d:0 "#bold 1934 Constitution#! imposed under #v military orders#! as #yellow José Calvo Sotelo#! declares: 'Red Bandits eradicated!' Key provisions:\n• #v Church Privileges#!\n• #v Abolition of Autonomy#!\n• #v Termination of Land Reform#!\n\n#v General Workers' Union#! calls #v General Strike#! while #v [concept_asturias]#! miners build barricades with explosives. #yellow Franco#!'s elite troops depart #v [concept_morocco]#!..."

dsk_spa.26.f:0 "Nationalist coalition included: Nationalists, Falangists, Fascists, Monarchists (Alfonsists/Carlists), Military Union, Landowners, Anti-Communists, Catholic Clericalists"
dsk_spa.26.a:0 "«Restore Order by Bayonet»\n'Only bullets can cure ideological cancer'"
dsk_spa.26.b:0 "We haven't lost yet! Today #yellow Madrid#! remains our common home!"
dyn_c_republic_SPA3:0 "Spanish State"

# 内战爆发
dsk_spa.27.t:0 "Spanish Civil War"
dsk_spa.27.d:0 "1936 - Mutinous gunfire at #v Melilla Garrison#! ignites #bold [concept_civil_war]#!. #yellow Franco#! broadcasts via German radio: 'We shall save Spain from #v [concept_atheists]#!' while Falange responds in Madrid: 'The #v Popular Front#! never yields!' Strategic options:\n• Defend #v Madrid Fortress#! awaiting #v [concept_soviet_union]#!\n• Abandon #v [concept_basque_country]#! to preserve #v [concept_andalusia]#! farmlands\n• Launch #v [concept_guerrilla_warfare]#! to exhaust Nationalists"

dsk_spa.27.f:0 "Rebellion led by #yellow Franco#! and #yellow Emilio Mola#! spreads from Morocco/Canary Islands to mainland cities. Colonial 'Foreign Legion' joins revolt."
dsk_spa.27.a:0 "The People Shall Prevail! Better to die standing than live kneeling"


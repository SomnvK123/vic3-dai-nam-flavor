je_spanish_second_empire:0 "Crossroads of the Second Republic"
je_spanish_second_empire_reason:0 "#bold Spanish Second Republic#! - the #yellow democratic regime#! established in 1931 - is torn between #yellow Manuel Azaña#!'s #variable Republicans#! and General #yellow Francisco Franco#!'s #variable Nationalists#!.\n\n#variable Republicans#! pursue #bold land reforms#! and #bold workers' rights#! with Soviet military aid (#v $SOV$#!).\n#variable Nationalists#! ally with #v $ig_landowners$#! and #v $Carlists$#! royalists, backed by German air power (#v $GER$#!).\n\nIrreconcilable differences over #bold church-state relations#! and #bold regional autonomy#! have caused #variable national disintegration#! - every Madrid decree faces open defiance from #v Nationalist zones#!.\n#bold The arrival of International Brigades escalates tensions. Unless this [concept_civil_war] ends swiftly, Iberia will become Europe's [concept_proving_ground]#!"


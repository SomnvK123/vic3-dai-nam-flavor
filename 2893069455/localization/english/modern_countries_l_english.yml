# Events
dsk_spa.28.t:0 "[concept_international_brigades] Reinforcements"
dsk_spa.28.d:0 "Volunteers from 35 nations cross the Pyrenees - Parisian students with Marx, Berlin exiles with air raid memories, even Ethiopian war veterans. Singing The Internationale in ten tongues, they establish the 'Anti-Fascist University of Albacete'"
dsk_spa.28.f:0 "『We come to rewrite history, not sightsee』 - 11th International Brigade Manifesto"
dsk_spa.28.a:0 "«Deploy to Jarama Front»"

dsk_spa.29.t:0 "[SCOPE.sCountry('ita_scope').GetName] Aids Nationalists"
dsk_spa.29.d:0 "Mussolini's CTV Corps lands in Málaga with Fiat L3 tanks. Blackshirt officers train Falangists in Seville's bullring. SM.79 bombers strike Valencia with 'Blessings from Rome' engraved on payloads"
dsk_spa.29.f:0 "『Spain is our proving ground』 - Galeazzo Ciano Diaries"
dsk_spa.29.a:0 "«Accept Support»"

dsk_spa.30.t:0 "[SCOPE.sCountry('ger_scope').GetName] Backs Nationalists"
dsk_spa.30.d:0 "[concept_condor_legion]'s He-111s deploy to Zaragoza. 88mm flak guns disguised as 'farm equipment' reach Toledo. Ju-52s achieve first-ever mass airborne troop transfer from Morocco"
dsk_spa.30.f:0 "『This is our laboratory of war』 - Wolfram von Richthofen"
dsk_spa.30.a:0 "«Authorize Military Advisors»"

dsk_spa.31.t:0 "Spanish Civil War"
dsk_spa.31.d:0 "Madrid's bookshelves become machine gun nests. Toledo's artifacts melt into bullets. Picasso's Guernica burns as Franco's Moors execute prisoners with curved swords while Republican women sew uniforms"
dsk_spa.31.f:0 "『The entire nation is a frontline』 - Ernest Hemingway"
dsk_spa.31.a:0 "«Support Nationalists»"
dsk_spa.31.b:0 "«Back Republicans»" 
dsk_spa.31.c:0 "Why must Spain's affairs always end in tragedy?"

dsk_spa.32.t:0 "[SCOPE.sCountry('western_country').GetName] Supports Republicans"
dsk_spa.32.d:0 "[SCOPE.sCountry('western_country').GetName] border guards 'accidentally' allow arms shipments. Oil tankers fly Panamanian flags. Hemingway organizes ambulances while communist bookstores become supply hubs"
dsk_spa.32.f:0 "『Non-intervention is bloodstained gloves』 - Álvarez del Vayo"  
dsk_spa.32.a:0 "«Establish Pyrenean Smuggling Routes»"
dsk_spa.32.b:0 "This violates our sovereignty!"

dsk_spa.33.t:0 "[SCOPE.sCountry('western_country').GetName] Backs Nationalists"
dsk_spa.33.d:0 "[SCOPE.sCountry('western_country').GetName] banks receive Spanish gold. Lisbon ports transfer Italian arms. Texaco tankers fuel Franco while Wall Street buys war bonds. Vatican declares '[concept_crusade] tax-free'"
dsk_spa.33.f:0 "『Business cares not for bullet ideologies』 - Lord Halifax"
dsk_spa.33.a:0 "«Secret Pact with [SCOPE.sCountry('western_country').GetName]»"
dsk_spa.33.b:0 "This violates our sovereignty!"


# Journal Entries
je_spa_union:0 "End the Civil War"
je_spa_union_tt:0 "Crush the rebels, restore order!"
je_spa_union_reason:0 "On July 18, 1936, monarchists, landowners, clergy and Falangists launched a fascist-backed rebellion. By July 30, Burgos became rebel headquarters with [SCOPE.sCharacter('crisis_scope_1').GetFirstName] as 'Caudillo'. From September 1936 to March 1937, Franco's forces with Axis support launched four major assaults on Madrid while fifth columnists sabotaged from within. The Republic's forces and International Brigades heroically defended the capital."


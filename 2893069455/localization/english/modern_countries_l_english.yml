je_spain_second_republic:0 "Second Republic" 
je_spain_second_republic_tt:0 "Time to overthrow [ROOT.GetCountry.GetRuler.GetFullName] and establish the Republic!"
je_spain_second_republic_reason:0 "#bold Second Republic#! - the #yellow democratic experiment#! born in 1931 - faces existential crisis between President #yellow Manuel Azaña#!'s #variable Left Coalition#! and General #yellow José Sanjurjo#!'s #variable Right-wing Forces#!.\n\n#variable Reformists#! push #bold land redistribution#! and #bold secularization#! with #v $SPA$#! union support.\n#variable Conservatives#! mobilize #v $Carlist$#! militias and royalists, covertly armed by #v $ITA$#!.\n\nIrreconcilable clashes over #bold Catalan autonomy#! and #bold military reforms#! paralyze governance - every parliamentary act triggers #v $general_strikes$#! vs #v $military_plots$#!.\n#bold As the [concept_alliance] between UGT and FAI crumbles, [concept_civil_war] tolls for [SCOPE.GetRootScope.GetCountry.GetName]#!"

land_redistribution:0 "Agrarian Reform Act"
je_agrarian_reform_esp:0 "Land Reform" 
je_agrarian_reform_esp_reason:0 "#bold Land Reform#! - the #yellow radical 1932 bill#! targeting #v $latifundio$#! system's #bold inequalities#!.\n\n#variable Reformers#! under #yellow Marcelino Domingo#! propose #v expropriating uncultivated lands#! for #v $yunteros$#! peasants.\n#variable Conservatives#! counter through #v $CEDA$#! parliamentary obstruction and judicial appeals.\n\nWhen 400,000 hectares enter expropriation lists, Andalusia becomes battleground: #v peasant land seizures#! vs #v landlord patrols#!.\n#bold This struggle will decide Spain's rural future - catalyst for change or new cycle of [concept_black_hand] violence#!"


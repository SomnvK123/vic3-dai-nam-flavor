l_english: 
 phi.1.t: "Integration of vassal states"
 phi.1.d: "After a great bureaucratic effort, many in [SCOPE.sCountry('phi_scope').GetName] want the territories of [SCOPE.sState('estado_scope').GetName], belonging to our vassal [SCOPE.sCountry('owner_scope').GetName], to be integrated into the central government."
 phi.1.f: "Many consider that the [ROOT.GetCountry.GetAdjective] state should invest in the political union of all the states in the Philippine archipelago, to ensure the preservation of [SCOPE.sCountry('phi_scope').GetName]."
 phi.1.a: "The bureaucrats in [ROOT.GetCountry.GetCapital.GetCityHubName] will not like this"

 phi.2.t: "Adjustment of borders"
 phi.2.d: "The issue of administering the territory of [SCOPE.sState('estado_scope').GetName] is a topic of debate, and [SCOPE.sCountry('phi_scope').GetRuler.GetFullNameWithTitle] has requested its incorporation into [SCOPE.sCountry('phi_scope').GetName]."
 phi.2.f: "After a quick meeting with [SCOPE.sCountry('owner_scope').GetRuler.GetFullNameWithTitle], an agreement has been reached for the cession of territory in the Philippine archipelago for better administration from [SCOPE.sCountry('phi_scope').GetCapital.GetCityHubName].\nUndoubtedly, it is a small step towards dominating the archipelago. If we reject the offer, we may signal weakness to other powers."
 phi.2.a: "New vassals"

 phi.3.t: "Total dominance of the Philippine archipelago"
 phi.3.d: "Finally, after centuries of struggle, we have succeeded for the first time in history in having the entire Philippine archipelago under the influence of [ROOT.GetCountry.GetName]."
 phi.3.f: "The Captaincy General of the Philippines, also known as the Kingdom of the Philippines, was a Spanish territorial entity, attached as an autonomous entity of the Viceroyalty of New Spain until 1830, established by the Spanish Monarchy in the so-called East Indies — areas of Asia and Oceania — with its capital in Manila."
 phi.3.a: "A great day to celebrate"
 bufo_filipina: "The [concept_government|l] of the Philippines will have a temporary increase in its [concept_legitimacy]"

 phi.4.t: "Pirate raid"
 phi.4.d: "A group of pirates has entered [SCOPE.sState('estado_raideado_scope').GetName] and, after looting everything their ships could carry, they fled to [SCOPE.sCountry('destino_piratas').GetName] with the spoils."
 phi.4.f: "Although the [concept_government|l] of [SCOPE.sCountry('destino_piratas').GetName] has nothing to do with this matter, it is clear that their ineffectiveness in stopping the pirates is apparent - [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] assured their cabinet when discussing the event."
 phi.4.a: "Damn pirates"
 esclavos_nuevos_destino: "A group of [GetPopType('slaves').GetName] will be taken to [SCOPE.sCountry('destino_piratas').GetName]"

 phi.5.t: "Piracy"
 phi.5.d: "A group of pirates operating in these waters has returned from a successful raiding campaign."
 phi.5.f: "The Moro pirates of Jolo were one of the most feared factions in Southeast Asia during the 19th century. Hailing from the Sulu Islands and mainly led by the Sulus, an ethnic group of the Sultanate of Sulu, these pirates were known for their raids along the coasts of the Philippines and other nearby areas."
 phi.5.a: "We'll see what we can do"
 phi.5_tt: "It may be that a group of [GetPopType('slaves').GetName] has come with them"

 phi.6.t: "Piracy in the Indonesian Sea"
 phi.6.d: "A group of pirates has entered [SCOPE.sState('estado_atacado').GetName], a territory belonging to [SCOPE.sCountry('sujeto_atacado').GetName], and, after looting everything their ships could carry, they fled with the spoils. Trade will suffer."
 phi.6.f: "The Moro pirates of Jolo were one of the most feared factions in Southeast Asia during the 19th century. Hailing from the Sulu Islands and mainly led by the Sulus, an ethnic group of the Sultanate of Sulu, these pirates were known for their raids along the coasts of the Philippines and other nearby areas."
 phi.6.a: "More problems"

 phi.7.t: "Piracy in Indonesia"
 phi.7.d: "Many years of neglect have caused piracy to resurge in the waters of Indonesia. Other [Concept('concept_country', '$concept_countries$')|l] will be raided by pirates."
 phi.7.f: "The Moro pirates of Jolo were one of the most feared factions in Southeast Asia during the 19th century.\n\nHailing from the Sulu Islands and primarily led by the Suluans, an ethnic group from the Sultanate of Sulu, these pirates were known for their raids along the coasts of the Philippines and other nearby areas."
 phi.7.a: "I preferred the ones from the Caribbean."


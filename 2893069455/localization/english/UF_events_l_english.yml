l_english:
 
 #India

 ind.15.t:0 "Maratha Mutiny!"
 ind.15.d:0 "After a long time of brewing opposition to Company rule, soldiers and other locals have risen up to proclaim the restoration of the Maratha empire in central India."
 ind.15.f:0 ""We needed some sort of legitimacy and figured the Marathas were good enough."" 
 ind.15.a:0 "It must be suppressed!"
 ind.15.b:0 "Long live the new Maratha!"
 
 ind.1.t:0 "A Sikh Proposal"
 ind.1.d:0 "Some rebels from Meerut have come to ask the Maharaja to lead a rebellion against the hated East India Company."
 ind.1.f:0 "".""
 ind.1.a:0 "We are the only ones powerful enough to stand against the company."
 ind.1.b:0 "This is too risky. Send them next door to the Mughal Emperor instead."
 
 ind.2.t:0 "Sikh Mutiny!"
 ind.2.d:0 "After a long time of brewing opposition to Company rule, soldiers and other locals have risen up to proclaim the restoration of the Sikh Maharaja to power in northern India."
 ind.2.f:0 "".""
 ind.2.a:0 "It must be suppressed!"
 ind.2.b:0 "Long live the restoration of the Sikhs!"
 
 ind.3.t:0 "To Mutiny, or not to Mutiny"
 ind.3.d:0 "The Sepoys have gone into mutiny. The question is whether we should join them or not."
 ind.3.f:0 ""One of my grandfathers says that if we don't join them then our souls will perish under the oppression of the British. The other grandfather says we will perish under the violent gunfire of the British. I asked if there was an option where some part of me didn't perish? They finally both agreed on something. 'No.'""
 ind.3.a:0 "This is our best chance to win our freedom."
 ind.3.b:0 "They will be crushed under the boot of the British army."

 ind.4.t:0 "Follow into War"
 ind.4.d:0 "One of the Princley states has gone into rebellion and is asking for allies."
 ind.4.f:0 ""One of my grandfathers says that if we don't join them then our souls will perish under the oppression of the British. The other grandfather says we will perish under the violent gunfire of the British. I asked if there was an option where some part of me didn't perish? They finally both agreed on something. 'No.'""
 ind.4.a:0 "This is our best chance to win our freedom."
 ind.4.b:0 "They will be crushed under the boot of the British army."
 
 ind.5.t:0 "Foreign Service Pay"
 ind.5.d:0 "Now that most of India has been pacified, soldiers are complaining about no longer having extra pay for being stationed in foreign territory."
 ind.5.f:0 ""I would rather fight an easy fight and eat to my heart's content than sit on my bottom and eat scraps.""
 ind.5.a:0 "They'll just have to deal with it."
 ind.5.b:0 "We'll return their pay for the time being, though the other soldiers will complain about special treatment."
 ind.5.c:0 "The Sepoy's are the backbone of our power. We should compensate them all accordingly."

 ind.6.t:0 "Promotion then Retirement"
 ind.6.d:0 "Sepoys are ranting that by the time they get promoted, they are of retirement age."
 ind.6.f:0 ""I've worked for the company for forty years and I'm still taking orders from white officers that haven't even been alive that long.""
 ind.6.a:0 "Why would we promote the heathens when their are so many capable British officers back home?"
 ind.6.b:0 "Promote a few standouts to make it look like we're doing something."
 ind.6.c:0 "We should lower the Indian age requirement and make it more skill based."
 
 ind.7.t:0 "Replacing Religion"
 ind.7.d:0 "The people are accusing us of replacing Hinduism with science."
 ind.7.f:0 ""Listen, we may be bastards in every other sense, but I stand by our British-run schools. The triumph of mathematics and reason over religious superstition is just that, a triumph. And there's nothing wrong with us extending education to little girls. It's not like we're telling them they're equal to men.""
 ind.7.a:0 "The schools themselves will fix this problem as the more educated masses will agree with us."
 ind.7.b:0 "We should dial things back a bit for the current crisis."
 ind.7.c:0 "Let's setup Indian courses with Indian instructors, so the populace are taught both."
 
 ind.8.t:0 "Hindu Widows' Remarriage Act"
 ind.8.d:0 "The company is debating on passing the aforementioned law which among other things would allow Hindu widows to remarry."
 ind.8.f:0 ""Stories of women being widowed when children and then never being able to remarry are all too common. There are not many options for unmarried women in society and we cannot allow them to stay destitute.""
 ind.8.a:0 "Ishwar Chandra Vidyasagar is petitioning us to pass the act, but the counter petitions have four times as many signatures. We cannot let morality shake our hold on India.""
 ind.8.b:0 "To hell with custom! It's what's right."

 ind.9.t:0 "At Artillery Point"
 ind.9.d:0 "During preparations for a military parade in Bengal, sepoys refuse to open the new grease cartridges and the colonel has brought out artillery and cavalry."
 ind.9.f:0 ""Not these ridiculous rumors again. We've told them time and time again that's it's not cow OR pig fat grease. I don't understand why they won't take us, the British East India Company, at our word.""
 ind.9.a:0 "Make an example of them. I want nothing left of these insubordinate natives but a hole in the ground."
 ind.9.b:0 "After some tense negotiations, the colonel has decided to withdraw the artillery and cancel the parade."
 
 ind.10.t:0 "Mangal Pandey"
 ind.10.d:0 "A sepoy was ranting about the recent actions of the company and declared he was going to rebel against his commanders. He shot at several, but the sepoy's refused to arrest him except one brave sellout."
 ind.10.f:0 ""I went to investigate, but the mad Indian shot at me! I raised the alarm and my adjutant Lt. Henry Baugh went to investigate, but he was shot at too. His poor horse fell dead on the spot.""
 ind.10.a:0 "Disband the regiment and hang the quarter guard for not arresting Mangal Pandey. That should fix things."
 ind.10.b:0 "We must tread carefully. Reprimand the other soldiers, but assure them that Mangal's grievances will be addressed."
 
 ind.11.t:0 "Arson"
 ind.11.d:0 "The sepoys are burning barracks and officer's bungalows in Delhi."
 ind.11.f:0 ""I went to rest in my bungalow only to find it aflame. Perhaps it's time to head back to jolly ol' London.""
 ind.11.a:0 "Allow the sepoys in the region to open the cartridges with their fingers instead of their teeth."
 ind.11.b:0 "Set the sepoy's homes on fire. See how they like it."
 
 ind.12.t:0 "Drill or Jail"
 ind.12.d:0 "85 of the 90 Indian Muslims in Meerut ordered to partake in firing drills are refusing to accept their cartridges."
 ind.12.f:0 ""The cononel knew full well about the unrest in other parts of India, but insisted it would make no difference.""
 ind.12.a:0 "Court Martial the 85 and sentence them to 10 years of hard labor."
 ind.12.b:0 "Sack stubborn the colonel and replace him with someone with a lighter touch."
 
 ind.14.t:0 "Meerut Rebels"
 ind.14.d:0 "The sepoys are slaughtering British officers and freed their 85 comrades."
 ind.14.f:0 ""I was attending church with my family when my daughter asked about the screams outside. I could do my duty and investigate or I could get the hell out of there with my family. I chose the latter.""
 ind.14.a:0 "The rebels head for the strong walled city of Dehli and seat of the Mughal Emperor."
 ind.14.b:0 "They've gone to Raigad, of all places. Why would they go to the old capital of the Maratha empire?"
 ind.14.c:0 "They have fled to the Punjab to seek the aid of the Maharaja."
 ind.14.e:0 "The rebels have gone to for the Punjab. Long live the Maharaja!"
 
 01_india_events.1.t:0 "The Lawyer from South Africa"
 01_india_events.1.d:0 "A lawyer who made a name for himself in South Africa successfully advocating for Indian rights is returning to India."
 01_india_events.1.f:0 ""He may have loomed large in South Africa, but he is but a pebble in the ocean that is India.""
 01_india_events.1.a:0 "He's only one man. And a tiny one at that. How much trouble could he cause?"
 01_india_events.1.b:0 "We need to keep an eye on anyone who might question our rule."

 01_india_events.2.t:0 "New Direction"
 01_india_events.2.d:0 "It's time to reasses the company's priorities."
 01_india_events.2.f:0 ""Lots of important business to get down to gentlemen. India isn't going to exploit itself.""
 01_india_events.2.a:0 "Improving the lives of the indigenous population will improve their work."
 01_india_events.2.b:0 "The army is how we won India, and it's what will ensure we keep it."
 01_india_events.2.c:0 "Industrialize, Industrialize, Industrialize!" 
 01_india_events.2.e:0 "Our company was built on agriculture. It would be foolish to stray from our roots." 
 01_india_events.2.g:0 "We must keep the traditional power structure strong."

 01_india_events.3.t:0 "Corporate Corruption"
 01_india_events.3.d:0 "The British government is looking into our finances."
 01_india_events.3.f:0 ""I don't care if I told you to cook the books! Uncook them or we're all going down!""
 01_india_events.3.a:0 "Bribe some officials. That always works."
 01_india_events.3.b:0 "We need a scapegoat. All in favor of blaming the president say "I""
 01_india_events.3.c:0 "They'll never risk getting rid of us. The worst that'll happen is some nobody will read about it in the newspaper."  
 01_india_events.3.e:0 "This is the perfect chance for us to stamp out company corruption."  
 
 01_india_events.4.t:0 "Merchant Ships Sink"
 01_india_events.4.d:0 "Some of our vessels were overcome in a deadly storm."
 01_india_events.4.f:0 ""Oh the humanity! Oh the destruction! OH THE EXPENSES!""
 01_india_events.4.a:0 "No need for new ships, we can just repair them."
 01_india_events.4.b:0 "Reoutfit some of our military vessels to pick up the slack while we rebuild."
 01_india_events.4.c:0 "Make sure the deceased families are taken care of."  
 
 01_india_events.5.t:0 "London Aghast"
 01_india_events.5.d:0 "The papers back home have printed all about our harsh treatment of the locals."
 01_india_events.5.f:0 ""We're bringing civilization to these people. So what if we have to break a few legs to do so?""
 01_india_events.5.a:0 "It was just an isolated incident. They're blowing this way out of proportion."
 01_india_events.5.b:0 "We'll print our own stories about the inhumane practices of the locals that we've put an end to."
 01_india_events.5.c:0 "By George they're right! We need to reverse course."
 
 01_india_events.6.t:0 "Stocks Down"
 01_india_events.6.d:0 "Our stocks are plummeting!"
 01_india_events.6.f:0 ""If the company is going down then I'm not going with it. Diane, sell every one of my stocks and then fire yourself.""
 01_india_events.6.a:0 "We need to reassure our investors that the company is still strong and that it's a mistake to sell."
 01_india_events.6.b:0 "This is just the market at work. We'll go back up eventually."
 01_india_events.6.c:0 "If we buy up all these stocks we can have more of a say in the company." 
 
 01_india_events.7.t:0 "Won Great Game"
 01_india_events.7.d:0 "It's time to reasses the company's priorities."
 01_india_events.7.f:0 ""Lots of important business to get down to gentlemen. India isn't going to exploit itself.""
 01_india_events.7.a:0 "Improving the lives of the indigenous population will improve their work."
 01_india_events.7.b:0 "The army is how we won India, and it's what will ensure we keep it."
 01_india_events.7.c:0 "Industrialize, Industrialize, Industrialize!" 
 01_india_events.7.e:0 "Our company was built on agriculture. It would be foolish to stray from our roots." 
 01_india_events.7.g:0 "We must keep the traditional power structure strong."
 
 01_india_events.8.t:0 "Lost Great Game"
 01_india_events.8.d:0 "It's time to reasses the company's priorities."
 01_india_events.8.f:0 ""Lots of important business to get down to gentlemen. India isn't going to exploit itself.""
 01_india_events.8.a:0 "Improving the lives of the indigenous population will improve their work."
 01_india_events.8.b:0 "The army is how we won India, and it's what will ensure we keep it."
 01_india_events.8.c:0 "Industrialize, Industrialize, Industrialize!" 
 01_india_events.8.e:0 "Our company was built on agriculture. It would be foolish to stray from our roots." 
 01_india_events.8.g:0 "We must keep the traditional power structure strong."
 
 01_india_events.9.t:0 "Indian Indigo"
 01_india_events.9.d:0 "The peasantry are growing angry about being forced to grow indigo when it barely makes them any profit."
 01_india_events.9.f:0 "".""
 01_india_events.9.a:0 "We have the greater British economy to think of. Not some backward peasants in India."
 01_india_events.9.b:0 "We could remove the fixed rate to avoid a larger backlash."

 01_india_events.10.t:0 "Champaran Satyagraha"
 01_india_events.10.d:0 "[SCOPE.sCharacter('mahatma_scope').GetFullName] is leading peaceful protests and strikes on behalf of peasants forced to grow indigo."
 01_india_events.10.f:0 ""The Tinkathia System which had been in existence for about a century was thus abolished and with it the planters’ raj came to an end. The riots, who had all along remained crushed, now somewhat came to their own, and the superstition that the stain of indigo could never be washed out was exploded.""
 01_india_events.10.a:0 "This man is wrecking the economy more than any violent uprising ever has. We need to negotiate before things get out of control."
 01_india_events.10.b:0 "We can't let an Indian dictate Indian policy!"
 
 01_india_events.11.t:0 "Salt March"
 01_india_events.11.d:0 "[SCOPE.sCharacter('mahatma_scope').GetFullName]'s march to oppose our salt tax seemed like a non-issue, but it's sweeping the nation and gaining worldwide sympathy."
 01_india_events.11.f:0 ""I cannot withhold my compliments from the government for the policy of complete non interference adopted by them throughout the march .... I wish I could believe this non-interference was due to any real change of heart or policy. The wanton disregard shown by them to popular feeling in the Legislative Assembly and their high-handed action leave no room for doubt that the policy of heartless exploitation of India is to be persisted in at any cost, and so the only interpretation I can put upon this non-interference is that the British Government, powerful though it is, is sensitive to world opinion which will not tolerate repression of extreme political agitation which civil disobedience undoubtedly is, so long as disobedience remains civil and therefore necessarily non-violent .... It remains to be seen whether the Government will tolerate as they have tolerated the march, the actual breach of the salt laws by countless people from tomorrow.""
 01_india_events.11.a:0 "It's just salt. They'll make some noise, but theirs no real threat here."
 01_india_events.11.b:0 "We should give in to his demands and let up on our taxes on certain goods"
 
 01_india_events.12.t:0 "Crossing Borders"
 01_india_events.12.d:0 "[SCOPE.sCharacter('mahatma_scope').GetFullName]'s march to oppose our salt tax seemed like a non-issue, but it's sweeping the nation and gaining worldwide sympathy."
 01_india_events.12.f:0 ""At least on this question I shall give you complete assurance. I shall see to it that there is no bloodshed and riot. I am a soldier and not a civilian. Once the partition is accepted in principle, I shall issue orders to see that there are no communal disturbances anywhere in the country. If there should be the slightest agitation, I shall adopt the sternest measures to nip the trouble in the bud.""
 01_india_events.12.a:0 "The border crossings are leading to violent clashes and it's spilling into the border cities."
 
 01_india_events.13.t:0 "Starving to Peace"
 01_india_events.13.d:0 "[SCOPE.sCharacter('mahatma_scope').GetFullName] has announced that he will fast until the violence has ended everywhere. There is no telling how long he will last at his age..."
 01_india_events.13.f:0 ""Think what you can do by living, that you cannot do while dying...what do you want?" "That the fighting will stop. That you make me believe...that it will never start again.""
 01_india_events.13.a:0 "Though it pains us to watch him dying before our eyes, we must respect his sacrifice."
 01_india_events.13.b:0 "If we lose our bapu then India will fall into darkness. We will force feed him if need be. His vocal calls to end the violence should be enough."
 
 01_india_events.14.t:0 "Everywhere"
 01_india_events.14.d:0 "It's over. The violence has finally quelled."
 01_india_events.14.f:0 ""I saw a Hindu and Muslim man trying to butcher each other and now they are embracing like brothers. I could see it in their eyes. It was not easy, yet for peace they persevered.""
 01_india_events.14.a:0 "With an end to the violence we can finally live in peace. Together. For however long that lasts..."
 01_india_events.14.b:0 "This was all Pakistan's fault. We can never be safe while they exist."
 
 01_india_events.15.t:0 "Oh God"
 01_india_events.15.d:0 "[SCOPE.sCharacter('mahatma_scope').GetFullName] has been shot by a radical Hindu nationalist."
 01_india_events.15.f:0 ""Friends and comrades, the light has gone out of our lives, and there is darkness everywhere, and I do not quite know what to tell you or how to say it. Our beloved leader, Bapu as we called him, the father of the nation, is no more. Perhaps I am wrong to say that; nevertheless, we will not see him again, as we have seen him for these many years, we will not run to him for advice or seek solace from him, and that is a terrible blow, not only for me, but for millions and millions in this country.""
 01_india_events.15.a:0 "Millions gather to pay their respects in a grand funeral procession."
 01_india_events.15.b:0 "Use his death to violently crack down on Hindu radicals."
 
 01_india_events.16.t:0 "Stunning Loss"
 01_india_events.16.d:0 "Our seemingly invincible army has lost a war."
 01_india_events.16.f:0 ""We came. We saw. We...lost?""
 01_india_events.16.a:0 "Nothing good can come of the natives thinking we aren't invincible."
 
 01_india_events.17.t:0 "Bengal Partition"
 01_india_events.17.d:0 "The viceroy has ordered a partition of Bengal between the Hindus and Muslims."
 01_india_events.17.f:0 ""There's nothing like religious strife to get what you want. If nothing else, that's what the reformation taught us. Of course it did also lead into several wars...oh well! I'm sure it'll be fine.""
 01_india_events.17.a:0 "This should pit them against each other instead of joining together against us."
 
 01_india_events.18.t:0 "Jallianwala Bagh massacre"
 01_india_events.18.d:0 "Brigadier General Dyer opened fire on a peaceful protests of Indians and didn't stop until his men were out of ammunition."
 01_india_events.18.f:0 ""There's nothing like religious strife to get what you want. If nothing else, that's what the reformation taught us. Of course it did also lead into several wars...oh well! I'm sure it'll be fine.""
 01_india_events.18.a:0 "We'll fire Dyer and make sure we respond with a softer hand in the future. But an apology? We don't think so."
 01_india_events.18.b:0 "We must take full responsibility for our actions and not only apologize but completely re-evaluate how we police."
 01_india_events.18.c:0 "We must stand behind our generals, not our subjects. Give the man a medal!"
 
 01_india_events.19.t:0 "Chauri Chaura incident"
 01_india_events.19.d:0 "Policemen fired upon protesters who retaliated by chasing the men into a police station and burning the building down, killing everyone inside."
 01_india_events.19.f:0 ""They fired upon us, so we set fire to them. I'm not sure what we did wrong here?""
 01_india_events.19.a:0 "Gandhi has decided to end the Non-Cooperation Movement before it becomes even more violent."
 01_india_events.19.b:0 "Gandhi will not let these men ruin what he and others are fighting for. The movement lives on."
 
 #General
 uf_general_events.1.t:0 "Strait of Hormuz"
 uf_general_events.1.d:0 "Controlling the Strait of Hormuz will increase our overseas trade exponentially."
 uf_general_events.1.f:0 ""At the upper end of these Calaei islands is a range of mountains called Calon, and there follows not far beyond, the mouth of the Persian Gulf, where there is much diving for the pearl-mussel. To the left of the straits are great mountains called Asabon and to the right there rises in full view another round and high mountain called Semiramis; between them the passage across the strait is about six hundred stadia; beyond which that very great and broad sea, the Persian Gulf, reaches far into the interior. At the upper end of this gulf there is a market-town designated by law called Apologus, situated near Charaex Spasini and the River Euphrates.""
 uf_general_events.1.a:0 "We shall be the greatest traders in the region."
 
 uf_general_events.2.t:0 "Egalitarianism Spreads"
 uf_general_events.2.d:0 "Books and ideas about equality are beginning to surface within our borders."
 uf_general_events.2.f:0 ""Everyone is talking about this new idea that everyone is equal. Pretty sure God already declared that and we mostly ignored it, but hey, maybe we'll listen to book-learned folk.""
 uf_general_events.2.a:0 "Ban the books and arrest anyone spreading them."
 uf_general_events.2.b:0 "Let the intellectuals waste their time in coffee shops bickering about this nonsense."
 uf_general_events.2.c:0 "They make a lot of great points. Perhaps we should encourage this kind of thinking."
 
 uf_general_events.3.t:0 "Human Rights Spreads"
 uf_general_events.3.d:0 "Books and ideas about total equality are beginning to surface within our borders."
 uf_general_events.3.f:0 ""What exactly is the difference between human rights and egalitarianism? Do we just believe in egalitarianism harder now?""
 uf_general_events.3.a:0 "Ban the books and arrest anyone spreading them."
 uf_general_events.3.b:0 "Let the intellectuals waste their time in coffee shops bickering about this nonsense."
 uf_general_events.3.c:0 "They make a lot of great points. Perhaps we should encourage this kind of thinking."
 
 uf_general_events.4.t:0 "Rule Breaker"
 uf_general_events.4.d:0 "This game has been testing our patience. We are finally taking what we want."
 uf_general_events.4.f:0 ""The Great Game? More like the Waiting Game, am I right?""
 uf_general_events.4.a:0 "Britain is furious at us for not playing by the rules that they've made up."
 
 uf_general_events.5.t:0 "Rule Breaker"
 uf_general_events.5.d:0 "This game has been testing our patience. We are finally taking what we want."
 uf_general_events.5.f:0 ""The Great Game? More like the Waiting Game, am I right?""
 uf_general_events.5.a:0 "Russia is furious at us for not playing by the rules. We made up the rules. We can do whatever we want."
 
 uf_general_events.6.t:0 "Rule Breaker"
 uf_general_events.6.d:0 "This game has been testing our patience. We are finally taking what we want."
 uf_general_events.6.f:0 ""The Great Game? More like the Waiting Game, am I right?""
 uf_general_events.6.a:0 "Russia is furious at us for not playing by the rules. We made up the rules. We can do whatever we want."
 
 #Persia
 01_persia_events.1.t:0 "Court of Persepolis"
 01_persia_events.1.d:0 "Our new capital is built, but not yet done."
 01_persia_events.1.f:0 ""These hallowed halls will once again be a symbol of our splendor and shall stand until the end of time. Let's just hope that another Alexander 'The Great" figure doesn't burn the library down again.""
 01_persia_events.1.a:0 "It needs to be EVEN MORE extravagent! We're trying to impress!"
 01_persia_events.1.b:0 "It can't only run on prestige but must be filled with the most modern and practical technology."

 01_persia_events.2.t:0 "Become the Shah-en-Shah"
 01_persia_events.2.d:0 "Now that [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] has become Shah-En-Shah, he must choose how to setup his court."
 01_persia_events.2.f:0 ""Cyrus the Great was the first King of Kings. You are stepping into the shoes of the founder of empires itself...no pressure though, my king""
 01_persia_events.2.a:0 "Our empire will be multi-cultural and our court must reflect that."
 01_persia_events.2.b:0 "It shall be filled with generals and experts on war to expand our growing empire."
 01_persia_events.2.c:0 "Like Darius the Great we shall focus on creating ours a vast administrative empire."

 01_persia_events.3.t:0 "Return to Zoroastrianism"
 01_persia_events.3.d:0 "If we wish to walk in the footsteps of the great Persian empires then we must shake off the yoke of Islam and return to living by the word of the prophet Zarathustra."
 01_persia_events.3.f:0 ""Good thoughts, good words, good deeds. What more does one need to live a good life?""
 01_persia_events.3.a:0 "Only those born of two Zoroastrian parents can be of our faith and many are coming out of hiding. The parents have a duty to repoluate the nation."
 01_persia_events.3.b:0 "We must allow anyone to become Zoroastrian if it is to thrive."
 01_persia_events.3.c:0 "We will still respect Muslim traditions."
 
 01_persia_events.4.t:0 "Survival"
 01_persia_events.4.d:0 "We must decide on a path that will lead to our survival in this new age."
 01_persia_events.4.f:0 "Despite being conquered by some of the world's greatest empires, Persia has been free and whole again for the last 40 years. Now it's sovereignty is threatened by the great powers. We refuse to be ruled by outsiders ever again."
 01_persia_events.4.a:0 "Only by looking to our past can we not only survive, but become great once again."
 01_persia_events.4.b:0 "We cannot do this alone. We must reach out to our Middle-Eastern neighbors."
 01_persia_events.4.c:0 "We just need to fund our army. The chief minister of the crown prince highly recommends the son of his...cook?"
 
 01_persia_events.5.t:0 "Third Time's the Charm"
 01_persia_events.5.d:0 "We have done it! Our fearless Shah-en-Shah has created the third great Persian empire. From here on we shall be known by our great dynasty."
 01_persia_events.5.f:0 ""We cannot stop now. We must endeavour even more to become not just the greatest Persian empire, but the greatest empire of our time.""
 01_persia_events.5.a:0 "The British and Russians have been vying for our land for too long. It's time we take the fight to them."
 01_persia_events.5.b:0 "Power without purpose is worthless. There has always been a bond between us and India. We shall free them as well."
 01_persia_events.5.c:0 "The European Powers will leave us in the dust if we do not join the scramble for Africa."

 01_persia_events.6.t:0 "The Armenians"
 01_persia_events.6.d:0 "We once again hold Armenia for the Persian Empire."
 01_persia_events.6.f:0 ""Armenians must once more be welcomed into the cradle of the great Persian empire.""
 01_persia_events.6.a:0 "Like the Sassanids, we must welcome them or be faced with devastating Christian revolts."
 01_persia_events.6.b:0 "The Sassanids accepting the Armenians into the empire led to it spiraling out of control."
 01_persia_events.6.c:0 "They are a subervient Satrapy. That's all they need to be."
 01_persia_events.6.e:0 "We are content with wresting them from our enemies. Let them forge their own destiny."
 
 
 01_persia_events.7.t:0 "Babylon"
 01_persia_events.7.d:0 "Babylon stands once again."
 01_persia_events.7.f:0 ""The Babylonians were one of the greatest and richest ancient civilizations. The Hanging Gardens of Babylon are a testament to their timelessness. We should see about getting them to rebuild those.""
 01_persia_events.7.a:0 "We will win the loyalty of the new state by accepting their people."
 01_persia_events.7.b:0 "We are the ones who brought Babylon back and we can do what we want with them."
 01_persia_events.7.c:0 "They are a subervient Satrapy. That's all they need to be."
 01_persia_events.7.e:0 "We are content with wresting them from our enemies. Let them forge their own destiny."

 01_persia_events.8.t:0 "Assyria"
 01_persia_events.8.d:0 "Assyria is free once more."
 01_persia_events.8.f:0 ""The first true empire was that of the Assyrians. They led through fear and brutality and...maybe this wasn't such a good idea...""
 01_persia_events.8.a:0 "The Assyrians are legendary for being ruthless. We shall accept them to avoid them ever turning on their new masters."
 01_persia_events.8.b:0 "We will rule them with an iron fist. They would do far worse to us if given the chance."
 01_persia_events.8.c:0 "They are a subervient Satrapy. That's all they need to be."
 01_persia_events.8.e:0 "We are content with wresting them from our enemies. Let them forge their own destiny."
 
 01_persia_events.9.t:0 "Israel"
 01_persia_events.9.d:0 "A Jewish kingdom is a reality once again."
 01_persia_events.9.f:0 ""No one thought it could be done, but we have re-established Israel in the world.""
 01_persia_events.9.a:0 "None have been more resilient than the Jewish people. We will use but also honor their fortitude."
 01_persia_events.9.b:0 "They keep getting conquered and cannot be left to their own devices. This is for their own good!"
 01_persia_events.9.c:0 "They are a subervient Satrapy. That's all they need to be."
 01_persia_events.9.e:0 "We shall honor Cyrus the Great's wishes and let them forge their own destiny."
 
 01_persia_events.10.t:0 "Conquerer of Greece"
 01_persia_events.10.d:0 "We have done what neither of the other Persian empire could."
 01_persia_events.10.f:0 ""Darius the Great wanted revenge on Greece and now it is done...over two thousand years later.""
 01_persia_events.10.a:0 "Send the missives! The world must know."

 01_persia_events.11.t:0 "Friends with Greece"
 01_persia_events.11.d:0 "A historic alliance."
 01_persia_events.11.f:0 ""The days of animosity are long past our peoples. Now we must stand together against the tide of the encroaching powers of Europe.""
 01_persia_events.11.a:0 "No one can stop us if we help one another."
 
 01_persia_events.12.t:0 "Phoenicia"
 01_persia_events.12.d:0 "Phoenician ships shall sail the seas once again."
 01_persia_events.12.f:0 ""The ancient world's greatest ship builders and sailers are perfect for this era with it's focus on naval power and trade.""
 01_persia_events.12.a:0 "The skilled Phoenicians will make a great addition to our growing empire."
 01_persia_events.12.b:0 "We need them to build our navy. Their well being matters not."
 01_persia_events.12.c:0 "They are a subervient Satrapy. That's all they need to be."
 01_persia_events.12.e:0 "We are content with wresting them from our enemies. Let them forge their own destiny."

 01_persia_events.13.t:0 "Lydia"
 01_persia_events.13.d:0 "Lydia shall make its mark once more."
 01_persia_events.13.f:0 ""Lydia was so rich that they invented coins to better keep track of their riches. They literally invented money and have been forgotten by time for too long. That was probably our fault, what with all the conquering them and everything.""
 01_persia_events.13.a:0 "No one would call themselves a Lydian nowadays, but we can allow the people who live in those lands a place in our empire."
 01_persia_events.13.b:0 "We will bleed them try."
 01_persia_events.13.c:0 "They are a subervient Satrapy. That's all they need to be."
 01_persia_events.13.e:0 "We are content with wresting them from our enemies. Let them forge their own destiny."

 01_persia_events.14.t:0 "Satrapy Administration"
 01_persia_events.14.d:0 "Now that we have formed Satrapies we should decide which group should be in charge of communications with each of the Satraps."
 01_persia_events.14.f:0 ""A Satrap is kind of like a governor. Former kings that submitted to the Persian empire could be Satraps of their old territory. That's what the ruler of Lydia did and he couldn't have been happier...not that you can ask him about it.""
 01_persia_events.14.a:0 "Why is this a question? The aristocracy of course."
 01_persia_events.14.b:0 "We need our talented minds to do such an important job."
 01_persia_events.14.c:0 "The devout will make sure they adhere to the proper morals."

 
 
 02_persia_events.1.t:0 "Crescent Condemnation"
 02_persia_events.1.d:0 "We have let down the other nations of The Crescent."
 02_persia_events.1.f:0 ""People are taking to the streets throughout the Crescent and chanting about our hypocrisy. I won't repeat any of them because they make us look bad.""
 02_persia_events.1.a:0 "Work on our image."
 02_persia_events.1.b:0 "Crack down on the Kurdish insurrectionists." 
 02_persia_events.1.c:0 "Just don't address the issue. We will only make it worse." 
 
 02_persia_events.2.t:0 "New Relations"
 02_persia_events.2.d:0 "We have soothed the beasts and now enter a new period of diplomatic relations between the three power-houses of The Crescent."
 02_persia_events.2.f:0 ""Turkey and Egypt have been fighting each other for far too long...that's it. Just wanted to point that out.""
 02_persia_events.2.a:0 "Focus on the new government in Turkey."
 02_persia_events.2.b:0 "Focus on the new government in Egypt." 
 02_persia_events.2.c:0 "Try and balance relations with both"
 
 02_persia_events.3.t:0 "Mid-East Alliance"
 02_persia_events.3.d:0 "We have successfully created an alliance of Middle-Eastern states."
 02_persia_events.3.f:0 "Now we must decide on the focus of our alliance."
 02_persia_events.3.a:0 "Good diplomacy shall keep us whole."
 02_persia_events.3.b:0 "Our trade power will be the backbone of this alliance."
 02_persia_events.3.c:0 "Nothing is more important than defending our borders."
 
 02_persia_events.4.t:0 "The Crescent Takes Root"
 02_persia_events.4.d:0 "Our people have taken up with the idea of The Crescent, but many question why some of them are treated worse than others or even enslaved. Now we must work on enshrining the equality of all our people of The Crescent into law."
 02_persia_events.4.f:0 ""New ideas may seem dangerous to some, but to me it brings oppurtunity to better society. And who doesn't want a better society? Apparently a lot of people, mostly rich. Hmm, a great improvement just crosses my mind.""
 02_persia_events.4.a:0 "The clergy is our moral authority and will help end the practice of binding our brothers and sisters in chains."
 02_persia_events.4.b:0 "The burgeoning industrial class is our best hope at ensuring our values in law."
 02_persia_events.4.c:0 "The most progressive of our people will help ensure that all people's of the Crescent are welcome in Persia."
 
 02_persia_events.400.t:0 "Defenders of The Crescent"
 02_persia_events.400.d:0 "From this day forth we shall no longer be termed the Middle-East, but The Crescent! Now we must form an alliance to defend it."
 02_persia_events.400.f:0 ""Being considered the Middle-East is an assumption that Europe is the center of the world. We can no longer tolerate being labeled as inferior. I suggest we rename our region 'The Crescent'. A representation of the crescent moon of Islam and the Fertile Crescent. A mix of our religious and secular heritage. Anyway, that's the end of my thesis. What do you think professor?""
 02_persia_events.400.a:0 "Russia and Britian are breathing down the necks of our eastern neighbors. We must focus all our efforts on bringing them into our protective alliance before it's too late."
 02_persia_events.400.b:0 "We should focus on integrating the idea of The Crescent to our people."
 
 02_persia_events.5.t:0 "The Oman Exchange"
 02_persia_events.5.d:0 "Persia has regained its natural borders."
 02_persia_events.5.f:0 ""This is the beginning of a new age for the region. One where we can solve our problems by diplomacy instead of the barbarism of war.""
 02_persia_events.5.a:0 "Let us continue to have good relations."
 
 02_persia_events.6.t:0 "The Persia Exchange"
 02_persia_events.6.d:0 "We have gained funds for the betterment of our own state for land we never needed anyway."
 02_persia_events.6.f:0 ""This is the beginning of a new age for the region. One where we can solve our problems by diplomacy instead of the barbarism of war.""
 02_persia_events.6.a:0 "Let us continue to have good relations."
 
 02_persia_events.7.t:0 "A Free Crescent"
 02_persia_events.7.d:0 "We have freed the rest of the Crescent. Now we must keep it that way."
 02_persia_events.7.f:0 ""We may be free for now, but that could all change in a moment. We must be ever vigilant if we wish to keep things as they are. Freedom isn't free.""
 02_persia_events.7.a:0 "Our new allies should focus on defending their land."
 02_persia_events.7.b:0 "The best defense is a good offense."
 
 02_persia_events.8.t:0 "Crescent Celebrates"
 02_persia_events.8.d:0 "We have upheld our ideals and helped build the state of Kurdistan."
 02_persia_events.8.f:0 ""They did it! I never thought they would. I mean seriously, who gives up their own land to someone without the power to take it? I sure wouldn't.""
 02_persia_events.8.a:0 "Even those outside of The Crescent can't help but admire what we've done."
 02_persia_events.8.b:0 "The entire Crescent is elevated with this act."
 02_persia_events.8.c:0 "Our people support our decision wholeheartedly."
 
 02_persia_events.9.t:0 "Council of Tehran"
 02_persia_events.9.d:0 "After days of deliberation we have decided that the only path forward is representative government."
 02_persia_events.9.f:0 ""Shahs, Sultans, and Emirs can be great, but they can also bring ruin to their people and those around them. We need stability. The people must have a voice in their own destiny instead of one man.""
 02_persia_events.9.a:0 "We must move quickly to diminish the reactionaries in the aristocracy."
 02_persia_events.9.b:0 "We need to promote reformers to the highest levels of governemnt."
 02_persia_events.9.c:0 "Change that's too quick is changed back even quicker."
 
 02_persia_events.10.t:0 "Bastion of Democracy"
 02_persia_events.10.d:0 "From this day forth The Crescent will be the great epicenter of democracy."
 02_persia_events.10.f:0 ""While Europe clings to their monarchs, we have progressed farther than they could even accomplish. Now it is they who will have to catch up with modernizing to the standards of The Crescent.""
 02_persia_events.10.a:0 "This could not have been done without us."
 02_persia_events.10.b:0 "This was achieved by The Crescent working together."
 
 02_persia_events.11.t:0 "Total Recognition"
 02_persia_events.11.d:0 "With our new standing, we have used our influence to make sure no one in the Crescent will ever be looked down on again."
 02_persia_events.11.f:0 ""The rise of racial superiority has been a tool of the European powers to justify their inhumane treatment and subjugation of people around the globe. We will now be equal in their eyes, as all peoples should.""
 02_persia_events.11.a:0 "We shall go one step further. Everyone is welcome in Iran!"
 02_persia_events.11.b:0 "We will not allow people not of The Cresent within our borders."
  
 02_persia_events.12.t:0 "United Arabia"
 02_persia_events.12.d:0 "By securing their freedom we have also secured their trust and convinced the warring states of Arabia to put aside their differences."
 02_persia_events.12.f:0 ""Arabia will no longer be considered the backwater of The Crescent with nothing more than endless desert. They shall show the world once again to not underestimate them.""
 02_persia_events.12.a:0 "Arabians everywhere rejoice at our diplomatic achievement."
 02_persia_events.12.b:0 "We shall flaunt our achievement to the rest of the world."
 02_persia_events.12.c:0 "We can only wonder what they will accomplish."

 02_persia_events.13.t:0 "Together we Stand"
 02_persia_events.13.d:0 "It is done! The Crescent stands free, prosperous, and strong."
 02_persia_events.13.f:0 ""This was just the beginning. Now we can focus inward on each of our own countries, but still helping each other along the way.""
 02_persia_events.13.a:0 "Technology is the way of the future."
 02_persia_events.13.b:0 "A strong economy will keep The Crescent strong."
 02_persia_events.13.c:0 "The Crescent shall stand against Europe at every turn."
 
 02_persia_events.14.t:0 "Ottoman Unrest"
 02_persia_events.14.d:0 "Many people's want to be free of the Ottoman Empire, but who is truly ready?"
 02_persia_events.14.f:0 ""The call for freedom cannot be bottled up once people's eyes are opened to what's inside. Let's break the bottle.""
 02_persia_events.14.a:0 "Iraq"
 02_persia_events.14.b:0 "Syria"
 02_persia_events.14.c:0 "Armenia"
 02_persia_events.14.e:0 "Freedom waits for no one. They shall all be free!"
 02_persia_events.14.g:0 "We're the ones who aren't ready! We can always try again another time."
 
 02_persia_events.15.t:0 "Russia Unrest"
 02_persia_events.15.d:0 "Many people's want to be free of Russia, but who is truly ready?"
 02_persia_events.15.f:0 ""The call for freedom cannot be bottled up once people's eyes are opened to what's inside. Let's break the bottle.""
 02_persia_events.15.a:0 "Armenia"
 02_persia_events.15.b:0 "Georgia"
 02_persia_events.15.c:0 "Azerbaijan"
 02_persia_events.15.e:0 "Freedom waits for no one. They shall all be free!"
 02_persia_events.15.g:0 "We're the ones who aren't ready! We can always try again another time."
 
 02_persia_events.16.t:0 "Egypt Unrest"
 02_persia_events.16.d:0 "Syrians wish to be free of Egypt, but are they truly ready?"
 02_persia_events.16.f:0 ""The call for freedom cannot be bottled up once people's eyes are opened to what's inside. Let's break the bottle.""
 02_persia_events.16.a:0 "They were propaganda'd ready."
 02_persia_events.16.b:0 "We're the ones who aren't ready! We can always try again another time."
 
 02_persia_events.17.t:0 "Shared Heritage"
 02_persia_events.17.d:0 "We have done away with the small differences that separate us."
 02_persia_events.17.f:0 ""Shia, Sunni, Mashriqi, Kurdish, Persian, and so many more. We may all be different in our own ways, but now we shall act with the common purpose of advancing all of us together as if we were one people. It is the only way forward.""
 02_persia_events.17.a:0 "We will host celebrations in all our major cities celebrating the people."
 02_persia_events.17.b:0 "Yes we are one now, but clearly Persians are the leaders of the region."
 #02_persia_events.17.c:0 "We can't celebrate just yet. Others like the Jewish people, Armenian Christians, and Zoroastrians are still excluded."
 
 02_persia_events.18.t:0 "Vanguard of The Crescent"
 02_persia_events.18.d:0 "Khiva has many fierceome nomadic warriors and will be a great boon to our fighting force."
 02_persia_events.18.f:0 ""Khiva has stood independant despite between sandwiched between Persia and Russia. Hey, if you can't beat em, join em...although they're the ones joining us so I guess it's if you can't beat em then have them join you?""
 02_persia_events.18.a:0 "Russia is at The Crescent's doorstep and Khiva must focus on protecting that door."
 02_persia_events.18.b:0 "No one ever won a war by defending. We should unleash them on our enemies."

 02_persia_events.19.t:0 "Nourisher of The Crescent"
 02_persia_events.19.d:0 ""Afghanistan is home to easily defendable fertile land thanks to its mountainous terrain. They could safely supply everyone within The Crescent.""
 02_persia_events.19.f:0 ""Lots of people have tried to conquer Afghanistan and it didn't exactly go their way. Which is why we gave up and made friends with them instead.""
 02_persia_events.19.a:0 "They need to focus on feeding our populations."
 02_persia_events.19.b:0 "We can always buy more food with money. Cash crops are the way to go!"
 02_persia_events.19.c:0 "The medical community says opium is the future of medicine. We should invest early."
 
 02_persia_events.20.t:0 "Sea Serpent of The Crescent"
 02_persia_events.20.d:0 "Thanks to our efforts, Baluchistan is now unified! They possess a large coast and could dock a sizeable fleet with trained officers."
 02_persia_events.20.f:0 ""A navy isn't just building a bunch of ships. You need trained officers and a reliable crew to man them. Without that, you end up with a lot of sunken ships and they're not the ones belonging to your enemy.""
 02_persia_events.20.a:0 "They need to build a navy to defend our waters."
 02_persia_events.20.b:0 "Their navy should be feared on the high seas."

 02_persia_events.21.t:0 "Merchant of The Crescent"
 02_persia_events.21.d:0 "Thanks to our efforts, Transcaucasia is now unified! They are at a critical trading area on the continent."
 02_persia_events.21.f:0 ""We don't really have a way to historically back the justification for unifying Armenia, Georgia, and Azerbaijan. What are they gonna do if they don't like? Invade...crap.""
 02_persia_events.21.a:0 "Have them focus all of their efforts on trade to get or sell whatever The Crescent needs."
 02_persia_events.21.b:0 "We must defend these crucial trade routes."

 02_persia_events.22.t:0 "Scholar of The Crescent"
 02_persia_events.22.d:0 "Iraq is free! They used to be the center of learning for the Muslim world and will be once again."
 02_persia_events.22.f:0 ""Baghdad used to be the jewel of the world. That is until Genghis Khan's grandson, Hulagu, came in and wrecked the place.""
 02_persia_events.22.a:0 "Their universities will teach all subjects."
 02_persia_events.22.b:0 "They will focus on teaching methods for discovering crucial resources."

 02_persia_events.23.t:0 "Zealot of The Crescent"
 02_persia_events.23.d:0 "Syria is free! They hold the crucial city of Jerusalem and hold signifigant sway over the devout."
 02_persia_events.23.f:0 ""I was just going about my day and then the only newspaper in town said that we have our own nation now. I'd love to celebrate, but I gotta find out if the new government is gonna raise taxes first.""
 02_persia_events.23.a:0 "It will provide safe pilgrimages for anyone in exchange for being designated a safe zone."
 02_persia_events.23.b:0 "They should help convert each of our populations to our state faith."

 02_persia_events.24.t:0 "Kurds Protest"
 02_persia_events.24.d:0 "The Kurds take to the streets and demand an independant Kurdistan."
 02_persia_events.24.f:0 ""We treat them perfectly well and this is how they repay us? With the same demands we insist the rest of The Crescent adhere to? Ridiculous!""
 02_persia_events.24.a:0 "Allow them to let their frustration out."
 02_persia_events.24.b:0 "We can't free The Crescent with dissent in our own country. Crush them!"

 02_persia_events.25.t:0 "Kurdistan's Big Ask"
 02_persia_events.25.d:0 "The government of Kurdistan is claming again that Luristan is part of their homeland and kindly ask that we transfer it to them."
 02_persia_events.25.f:0 ""We're the ones who liberated them in the first place and they have the gall to make a perfectly reasonable request based off everything we stand for!?""
 02_persia_events.25.a:0 "They are only asking that we live up to our creed."
 02_persia_events.25.b:0 "We're the ones who developed that land! Not to mention that the Kurds living in Luristan are a crucial part of our workforce."

 
 03_persia_events.1.t:0 "Not getting better"
 03_persia_events.1.d:0 "His condition hasn't improved at all!"
 03_persia_events.1.f:0 ""Doctor's cannot always cure an illness, but with the right methods they can prevent it from getting worse. At least that's what my doctor keeps telling me.""
 03_persia_events.1.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] insists on sending away the British and Russian doctors. Traditional doctors are the way to go."
 03_persia_events.1.b:0 "The fact that [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] has not worsened is a testament to the doctor's knowledge."
 
 03_persia_events.2.t:0 "On Death's doorstep"
 03_persia_events.2.d:0 "The new doctor has amputated [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]'s leg!"
 03_persia_events.2.f:0 ""[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] insisted on using him. What were we supposed to do?""
 03_persia_events.2.a:0 "The damage is irreversible, but a French doctor has agreed to help save his life."
 03_persia_events.2.b:0 "Let his suffering end."
 
 03_persia_events.3.t:0 "Prepare the Crown Prince"
 03_persia_events.3.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] wants [SCOPE.GetRootScope.GetCountry.GetHeir.GetFullName] to be ready to rule when he passes and is looking for a personal tutor for him."
 03_persia_events.3.f:0 ""One of the most important positions in government is the tutor of the heir. For it is he who crafts the mind of a future Shah.""
 03_persia_events.3.a:0 "The aristocracy will guide him."
 03_persia_events.3.b:0 "[SCOPE.sCharacter('intelligentsia_ig_leader_scope').GetFullName], has a sharp mind and proved himself more than capable."
 03_persia_events.3.c:0 "The Ulema will make sure he can recite the entire Quran by heart."
 
 03_persia_events.4.t:0 "Death of the Shah"
 03_persia_events.4.d:0 "Mohammad Shah has finally passed"
 03_persia_events.4.f:0 ""Disease brings pauper and prince alike into the final embrace of death. Pretty good right? Soon my poetry will be even more famous than Rumis'""
 03_persia_events.4.a:0 "The landowners want to take advantage of the young [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]'s inexperience."
 03_persia_events.4.b:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] doesn't want anyone influencing his decisions."
 03_persia_events.4.c:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] demands that the reformist [SCOPE.sCharacter('intelligentsia_ig_leader_scope').GetFullName] be made the Chief Minister with the honorary title Amir Kabir: Great Ruler."
 
 03_persia_events.5.t:0 "Well Financed"
 03_persia_events.5.d:0 "With the money Amir Kabir is saving we are making progress towards having arms ready for more of the population in case of war. We should send him to hand the Ottoman border next."
 03_persia_events.5.f:0 ""Amir Kabir learns quickly and is great at applying new ideas. At this rate we might have to promote him to overseeing the entire army soon.""
 03_persia_events.5.a:0 "He doesn't need a promotion to go along with his new responsibilities. He is serving the Shah like all good subjects should."
 03_persia_events.5.b:0 "Add him to taking care of the army's provisions and organization and promote him to vazir-e nezam."
 
 03_persia_events.6.t:0 "Simple and Quick"
 03_persia_events.6.d:0 "Amir Kabir is making great progress at gettind rid of this old tradition."
 03_persia_events.6.f:0 ""This is ridiculous! So what if it takes me an entire day to write one page? There is poetry in my font!""
 03_persia_events.6.a:0 "Slow and steady. We shouldn't overhaul everything too quickly."
 03_persia_events.6.b:0 "The holdouts are preventing progress. Any who don't change their methods will be fired."
 
 03_persia_events.7.t:0 "Monarchy Wastefulness"
 03_persia_events.7.d:0 "Slashing a budget shouldn't have taken this long, but the aristocrats act like children when their toys are taken away."
 03_persia_events.7.f:0 ""You people already get free money for just laying about. If you want more funds then get out and get a real job.""
 03_persia_events.7.a:0 "The queen mother is protesting. Perhaps we should let her spend as she wishes instead of making an enemy of her."
 03_persia_events.7.b:0 "If Amir Kabir makes exceptions then everyone will demand the same. They need to all make sacrifices for the good of Persia."
 
 03_persia_events.8.t:0 "Smallpox Vaccines"
 03_persia_events.8.d:0 "Amir Kabir has saved thousands, possibly millions of lives with his vaccine initiative."
 03_persia_events.8.f:0 ""It's hard to be skeptical of vaccinations when everyone around you without them is dying. Please, for the love of God. Just take it. It's free--and you already have Smallpox. Sigh, not much we can do about it now.""
 03_persia_events.8.a:0 "It was good that lives were saved for the current crisis, but we must not rely on western medicine."
 03_persia_events.8.b:0 "This was incredibly affective. We need to make this type of medicine in our country the standard."
 
 03_persia_events.9.t:0 "Dar-Ol-Fonoon"
 03_persia_events.9.d:0 "The groundwork has been done and we can begin construction at any time."
 03_persia_events.9.f:0 ""The purpose of the university is to train a new cadre of administrators with Western techniques. It shall be built on the edge of the city to expand as needed.""
 03_persia_events.9.a:0 "Amir Kabir hires Czech, Italian, Swiss, Polish, and especially Austrian instructors."
 03_persia_events.9.b:0 "If we are going to build this then it should at least be taught exclusively by Iranians."
 03_persia_events.9.c:0 "The Landowners are furious. Running the government should be left to them and not taught to peasants."

 03_persia_events.10.t:0 "The Right Doctors"
 03_persia_events.10.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] is getting worse. We need to get him a good doctor."
 03_persia_events.10.f:0 ""It was once Muslim doctors that were sought out and European ones were to be avoided. Some insist that is still the case, but the results of their doctors tell a different story.""
 03_persia_events.10.a:0 "We need modern doctors, but only our enemies Britian and Russia are offering."
 03_persia_events.10.b:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] wants a doctor from the region who uses traditional methods."
 03_persia_events.10.c:0 "Bah! He doesn't need a doctor. Allah will care for him."
 
 03_persia_events.11.t:0 "Finish Them"
 03_persia_events.11.d:0 "The Mullahs will never again hold the power they once did."
 03_persia_events.11.f:0 ""We aren't getting rid of you all. We just want you to focus on matters of faith instead of matters of state.""
 03_persia_events.11.a:0 "They could gain power once again. We must crush them permanently."
 03_persia_events.11.b:0 "Their are many Ayatollah's that are respected in their local communities. We should leave them alone."

 03_persia_events.111.t:0 "Influence Reduced"
 03_persia_events.111.d:0 "Concessions made to Great Britain and Russia have been rescinded."
 03_persia_events.111.f:0 ""Some say that angering these two will lead to them being aggressive towards us. Don't be naive. They were aggressive as soon as they saw that we had something they wanted.""
 03_persia_events.111.a:0 "This isn't enough. We should denounce them on the world stage."
 03_persia_events.111.b:0 "Amir Kabir wants to set up counter-espionage agents in their embassies."
 
 03_persia_events.112.t:0 "New Friends"
 03_persia_events.112.d:0 "Amir Kabir has gained us powerful allies, but we must decide which to grow closer to."
 03_persia_events.112.f:0 ""Like us, America is an emerging power with immense potential. Althought, Austria is a more established power and in the center of European politics.""
 03_persia_events.112.a:0 "The United States represents progress unlike Austria."
 03_persia_events.112.b:0 "We might not like Austrian policies, but we can't deny their strength."
 
 03_persia_events.12.t:0 "The Aristocracy Conspiracy"
 03_persia_events.12.d:0 "The Aristocrats have had it with Amir Kabir and insist [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] do something about him."
 03_persia_events.12.f:0 ""Of course the Shah will listen to me. He's my second great uncle's cousin. Or is he my third great uncle's cousin?""
 03_persia_events.12.a:0 "The Queen Mother has convinced [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] that Amir Kabir wants to usurp his throne."
 03_persia_events.12.b:0 "Off with his head or off with yours!"
 03_persia_events.12.c:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] arrests the aristocrats that stormed into his court and dared make demands of him, the Shah!"
 
 03_persia_events.13.t:0 "Dar-Ol-Fonoon Finished"
 03_persia_events.13.d:0 "The state of the art university is finished."
 03_persia_events.13.f:0 ""This will stand as Amir Kabir's greatest accomplishment. A place where Iranians can learn to prepare the country that they love for the future.""
 03_persia_events.13.a:0 "The aristocracy is angry. Perhaps we should soothe them with free tuition."
 03_persia_events.13.b:0 "It is a masterpiece. We must model all of our universities after this."
 
 03_persia_events.14.t:0 "Total Confidence"
 03_persia_events.14.d:0 "With all of the reforms that Amir Kabir has been able to accomplish, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] is completely on his side in all matters."
 03_persia_events.14.f:0 ""Amir Kabir has proven himself to be an excellect administrator and advisor. I put more stock in him than the sychophants at court.""
 03_persia_events.14.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] is starting to see the phalacy of traditional values and is more open new ideas from Amir Kabir."
 03_persia_events.14.b:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] is a child. If Amir Kabir wants to really transform this country then it's time that he takes power from the Shah."
 03_persia_events.14.c:0 "It is Amir Kabir's honor to serve the Shah. It is every Iranian's duty."
 
 03_persia_events.15.t:0 "Amir Kabir's Fate"
 03_persia_events.15.d:0 "The Queen and her minister have convinced [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] that Amir Kabir is going to ally with the Russians to overthrow him."
 03_persia_events.15.f:0 ""An attendant to the Queen slipped me some dinars for the dirty deed. I got nothing against the guy but I gotta take care of meself.""
 03_persia_events.15.a:0 "The assassins descend upon Amir Kabir. He never stood a chance."
 03_persia_events.15.b:0 "Amir Kabir is tipped off by the sympathetic locals in Kashan and escapes. We have no idea where he is, but at least he's gone (and secretly influencing sympathetic government officials)."
 03_persia_events.15.c:0 "The assassins find Amir Kabir in the middle of cooking dinner and decide it's the best time to strike...big mistake. The man knows his way around a kitchen and the assassins are burnt, cleaved, and frying panned to death. Now he's coming for us..."
 
 
 
 03_persia_events.16.t:0 "Study Abroad"
 03_persia_events.16.d:0 "Some nobles and inconsequential royals aren't satisfied with the antiquated teachings in [ROOT.GetCountry.GetName] and wish to study at European universities."
 03_persia_events.16.f:0 ""I am a noble and I deserve the best education. I don't know what I'll use it for. I just know it's the best.""
 03_persia_events.16.a:0 "How could better educated nobles be a bad thing? If they're paying for it, let them go."
 03_persia_events.16.b:0 "So that Europe can have our best and brightest!? We don't think so."
 
 03_persia_events.17.t:0 "Extravagant Trips"
 03_persia_events.17.d:0 "Many of the royals want to take expensive trips to Europe."
 03_persia_events.17.f:0 ""I'm bored of [ROOT.GetCountry.GetName]. I want to see sophisticated London, magnificent Paris, and beautiful Rome.""
 03_persia_events.17.a:0 "It is the government's duty to pay for whatever the ruling family wants."
 03_persia_events.17.b:0 "We can't afford that! They can pay for their ridiculous trips themselves."
 
 03_persia_events.18.t:0 "Missionaries"
 03_persia_events.18.d:0 "Christian missionaries wish to do work within our borders."
 03_persia_events.18.f:0 ""I wanted to start my missionary career in China, but all those spots were already taken.""
 03_persia_events.18.a:0 "They're doomed to fail at converting our people from the true faith, but they are willing to teach all subjects for free."
 03_persia_events.18.b:0 "This idea is blasphemous! We'll execute anyone trying to convert our population!"
 
 03_persia_events.19.t:0 "British Loans"
 03_persia_events.19.d:0 "We need to decide how we want to spend the bulk of the loans."
 03_persia_events.19.f:0 ""The loans are hefty, but so are the interest rates...""
 03_persia_events.19.a:0 "Spend it on lavish parties for the aristocrats! They need a break from all their hard work."
 03_persia_events.19.b:0 "Construction projects! Hundreds of construction projects!"
 03_persia_events.19.c:0 "The Prophet Mohammed always talked about caring for the poor."
 
 03_persia_events.20.t:0 "Russian Loans"
 03_persia_events.20.d:0 "We need to decide how we want to spend the bulk of the loans."
 03_persia_events.20.f:0 ""The loans are hefty, but so are the interest rates...""
 03_persia_events.20.a:0 "Spend it on lavish parties for the aristocrats! They need a break from all their hard work."
 03_persia_events.20.b:0 "Construction projects! Hundreds of construction projects!"
 03_persia_events.20.c:0 "The Prophet Mohammed always talked about caring for the poor."

 03_persia_events.21.t:0 "Tobacco Regie"
 03_persia_events.21.d:0 "A British capitalist wants to buy the rights to all Tobacco made in Persia."
 03_persia_events.21.f:0 ""Major G.F. Talbot is asking for a full monopoly over the production, sale, and export of tobacco for fifty years. In exchange, he will pay us handsomely in addition to a quarter of the yearly profits after the payment of all expenses and a dividend of 5 percent on the capital. That's a lot of big words that I don't understand, but he assures me it's a good deal.""
 03_persia_events.21.a:0 "Making deals with rich men will make us rich ourselves!"
 03_persia_events.21.b:0 "This is ludicrous! We won't let Britain profit off the sweat of our people."
 
 03_persia_events.22.t:0 "Russia Protests"
 03_persia_events.22.d:0 "Russia demands that the concession to Britain end immediately."
 03_persia_events.22.f:0 ""They are stating that the Tobacco Régie violates freedom of trade in the region as stipulated by the Treaty of Turkmanchai.""
 03_persia_events.22.a:0 "Russia can complain all they want, but they'll never risk war with Britain over it."
 03_persia_events.22.b:0 "We don't want to anger the bear. Britain won't like it, but we can blame it on the Russians."

 03_persia_events.23.t:0 "The Tobacco Protests"
 03_persia_events.23.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] has announced the tobacco concessions to the country and protests have caught on like wildfire."
 03_persia_events.23.f:0 "The people are destroying their own Tobacco before letting it go to the British. The bazaaris are leading the opposition as it is their income and livelihood that are most at stake. The farmers aren't happy either as they now can ONLY sell to the this so called Imperial Tobacco Corporation of Persia, not to mention they have to get permits from Britain to sell their own tobacco! Finally, the Ulema are upset that the concession is too exorbitant for non-Muslim foreigners and are now declaring it contradicts Islamic law because individuals are not allowed to purchase or sell tobacco under their own free will and are unable to go elsewhere for business."
 03_persia_events.23.a:0 "Grand Ayatollah Mirza Hasan Shirazi has issued a fatwa against tobacco!"
 03_persia_events.23.b:0 "Farmers are going on strike!"
 03_persia_events.23.c:0 "The shopkeepers have stormed our trade centers and shut most of them down!"

 03_persia_events.24.t:0 "Victory for the People"
 03_persia_events.24.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] has conceded and the concession has been cancelled."
 03_persia_events.24.f:0 ""We, the people of Persia, have done what we never thought was possible. We stood up to the Shah and the Great Powers and won. We must never forget this feeling. One of pride and the power to resist.""
 03_persia_events.24.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] is humiliated and the people are more emboldened than ever."
 
 03_persia_events.25.t:0 "The Game is On"
 03_persia_events.25.d:0 "Britain and Russia's intentions are clear. Total control of Persia."
 03_persia_events.25.f:0 ""We are dangerously close to becoming another victim of the Great Power's games to be the dominant force in the world. When will they stop treating the rest of the world as pawns in their chess match of death and domination?""
 03_persia_events.25.a:0 "We have no choice but to play."
 
 03_persia_events.26.t:0 "D'Arcy Concession"
 03_persia_events.26.d:0 "Willian Know D'Arcy thinks there are loads of oil in Persia."
 03_persia_events.26.f:0 ""This new resource called oil has unlimited potentional. If we want to stay the dominant power in the world then we need it. He who controls the oil, controls the world!""
 03_persia_events.26.a:0 "Let him perform a survey and rights to all oil found."
 03_persia_events.26.b:0 "There is nothing under Persia but dirt, rock, and bones."
 
 03_persia_events.27.t:0 "D'Arcy Concession"
 03_persia_events.27.d:0 "Willian Know D'Arcy thinks there are loads of oil in our country."
 03_persia_events.27.f:0 ""Oil is fast becoming the most valuable resource in the world. If we truly do have our own then we could become a great economic power.""
 03_persia_events.27.a:0 "Let him perform a survey and rights to all oil found."
 03_persia_events.27.b:0 "We won't let this Brit take even more from us than they already have."

 03_persia_events.28.t:0 "Exploit the Oil!"
 03_persia_events.28.d:0 "D'Arcy has struck oil!"
 03_persia_events.28.f:0 ""Due to our concession he will reap the benefits while we will get table scraps. We signed a deal though...""
 03_persia_events.28.a:0 "He'll build the oil rigs himself and we'll still share in some of the profits."
 03_persia_events.28.b:0 "This is far more oil than we ever imagined! The British shan't have a single drop!"
 
 03_persia_events.29.t:0 "Fed Up"
 03_persia_events.29.d:0 "People are outraged by the newest foreign loans to fatten the pockets of [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] and have taken to the streets."
 03_persia_events.29.f:0 ""The Shah cares more about foreign powers than he does about his own people. Why else would he send what little riches we have left to them?""
 03_persia_events.29.a:0 "No one makes demands of the Shah! He's the one who makes demands and he demands swift retribution."
 03_persia_events.29.b:0 "Let them rant and rave. We are not afraid."
 03_persia_events.29.c:0 "Things are getting out of hand. [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] needs to agree to their demands."
 
 03_persia_events.30.t:0 "House of Justice" 
 03_persia_events.30.d:0 "We dispersed the protesters after they sought refuge in a mosque, but it only led to more protesters. They won't leave until [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] establishes a House of Justice."
 03_persia_events.30.f:0 "The House of Justice would be a constitutional assembly that would let voted representatives make many of the important decisions for the country instead of the Shah."
 03_persia_events.30.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] dismissed his prime minister and 'promises' the creation of a House of Justice."
 03_persia_events.30.b:0 "Kill every last one of these traitors!"
 
 03_persia_events.31.t:0 "The Majlis" 
 03_persia_events.31.d:0 "Protesters, 10,000 strong, have come to demand that [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] uphold his promise."
 03_persia_events.31.f:0 "During a fight, government forces killed a Sayyid, a descendant of Muhammad. The bazaars and the ulama went on strike. Bizarrely the British agreed to shelter merchants in their embassy in Tehran."
 03_persia_events.31.a:0 "The Shah has no other choice but to give in. The people will have a parliament called the Majlis and soon a constitution."
 03_persia_events.31.b:0 "The people break into the [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]'s palace and hang him."
 
 03_persia_events.32.t:0 "Final Act" 
 03_persia_events.32.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] has signed the constitution as promised."
 03_persia_events.32.f:0 ""The constitution is modeled off of the Belgian Constitution. Power is no longer contingent on the shah but the will of the people. Broken, defeated, old, and frail. [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] and the institution he represents are one.""
 03_persia_events.32.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] died within days of his final act."

 03_persia_events.33.t:0 "True Face" 
 03_persia_events.33.d:0 "As we thought. [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] has been nothing but compliant."
 03_persia_events.33.f:0 ""He's a no good rotten piece of dog feces that would sell his mother if it made his life the slightlest bit easier. But what do I know? I only worked for him.""
 03_persia_events.33.a:0 "Although, he did make his Russian tutor a minister and gave him the title of Khan. He couldn't be colluding with Russia could he..."
 03_persia_events.33.b:0 "We must trust our brothers and sisters in Tabriz. Kill the Shah!"
 
 03_persia_events.34.t:0 "Return of the Constitutionalists" 
 03_persia_events.34.d:0 "The Shah is deposed!"
 03_persia_events.34.f:0 "Forces marched from Tabriz, Rasht, and Isfahan, deposed [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName], and reinstituted the Constitution."
 03_persia_events.34.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] has gone into exile. Likely hiding out in Russia."
 03_persia_events.34.b:0 "We caught the snake and gave him the slow death he deserved."
 
 03_persia_events.35.t:0 "The Anglo-Russian Convention" 
 03_persia_events.35.d:0 "The British and Russians have signed an agreement behind our backs!"
 03_persia_events.35.f:0 "Due to the rising threat of Germany and the Kaiser increasing it's ties with the Ottoman's, the Brits and Russians have agreed to each of them acknowleding their spheres of interest over Persia. Russia will get the top half, Britian the bottom, and the middle will be a neutral zone."
 03_persia_events.35.a:0 "Persia is not theirs to divvy up! This violates our sovereignty! Not to mention that now they won't be fighting over Persia and we can't pit them against each other."
 
 03_persia_events.36.t:0 "Russia Outraged" 
 03_persia_events.36.d:0 "Russia demands that Morgan Shuster be fired for his illegal arrest of Russian citizens."
 03_persia_events.36.f:0 ""How dare you bring in this American to help you be financially stable! We're trying to bleed you dry so that it's easier to dominate you!""
 03_persia_events.36.a:0 "If they want to live within our borders then they need to pay our taxes. Shuster stays!"
 03_persia_events.36.b:0 "We need to give in before they get even more mad."
 
 03_persia_events.37.t:0 "March on the Capital" 
 03_persia_events.37.d:0 "Russian troops are on the move. What do we do?"
 03_persia_events.37.f:0 ""It has finally come to this. The Russians are making good on their threats and refuse to deal with the Majlis any longer.""
 03_persia_events.37.a:0 "Bakhtiari chiefs surround the Majlis building force them to accept and then shut down the assembly."
 03_persia_events.37.b:0 "We finally stand up to them. We fight."
 
 03_persia_events.38.t:0 "Reza Khan" 
 03_persia_events.38.d:0 "Reza Khan from the Cossacks Brigade has siezed the capital."
 03_persia_events.38.f:0 ""He has removed the [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]'s ministers and placed a man of the people as prime minister, though it's clear he's the real power in the country. I heard, this was all at the behest of the British who want stability in Persia as a buffer against Russia.""
 03_persia_events.38.a:0 "Promote Reza Khan to 'Sardar Sepah', commander-in-chief of the army."
 03_persia_events.38.b:0 "We must throw all our weight behind the new prime minister."
 
 03_persia_events.39.t:0 "Reza's Choice" 
 03_persia_events.39.d:0 "The British have their strong man in place, but Reza must choose how he wants to rule."
 03_persia_events.39.f:0 ""Reza wants to modernize the country. He believes that can only be done with an iron fist. Great, we've traded in an incompetent monarch with a ruthless one.""
 03_persia_events.39.a:0 "Reza Khan has convinced the majlis to crown him Reza Shah Pahlavi."
 03_persia_events.39.b:0 "Reza prefers a presidential republic with him at it's head, but the British have no interest in the whims of the Persian people."
 
 03_persia_events.40.t:0 "Abdicate or Fight?" 
 03_persia_events.40.d:0 "Russia is threatening to take over the country if the Germa-Phile Reza does not abdicate."
 03_persia_events.40.f:0 "Germany is too great a threat for Russia. They finally have an agreement with Great Britian in the region and don't need Germany getting involved now."
 03_persia_events.40.a:0 "Reza can stomach abdicating in favor of his son."
 03_persia_events.40.b:0 "Reza refuses to be pushed around by anyone, even the great Russian bear."
 
 03_persia_events.41.t:0 "Returning Nationals" 
 03_persia_events.41.d:0 "Mohammed Mossadeq, a talented man and distant royal of the Qajar dynasty has returned to the country."
 03_persia_events.41.f:0 ""Mossadeq received his doctorage at the Uinversity of Neuchatel in Switzerland and is the first Iranian to earn a PhD in law from a European University. He was also in the Majlis before it was disbanded. Then again with Reza Khan as prime minister, but resigned in protest when the legislative body elected him as Shah.""
 03_persia_events.41.a:0 "Mossadeq runs for a seat in the Majlis and wins."

 03_persia_events.42.t:0 "Mossadeq Wins!" 
 03_persia_events.42.d:0 "Mossadeq is now prime minister!"
 03_persia_events.42.f:0 "The new administration wants to introduce a wide range of social reforms: unemployment compensation, where factory owners are ordered to pay benefits to sick and injured workers, and peasants are freed from forced labor in their landlords' estates. These will be expensive though and Mossadeq will need a way to pay for it."
 03_persia_events.42.a:0 "Like Amir Kabir before him, a true reformist holds the reigns of the Iranian government once again."

 03_persia_events.43.t:0 "Naval Blockade" 
 03_persia_events.43.d:0 "The British are blockading us to prevent us from selling our own oil."
 03_persia_events.43.f:0 ""Even though Mossadeq said we would compensate the British with 25% of our oil profits they will settle for no less than 100%.""
 03_persia_events.43.a:0 "The people support the prime minister more than ever."
 03_persia_events.43.b:0 "This isn't worth it. We should get rid of Mossadeq."
 
 03_persia_events.44.t:0 "American Intervention" 
 03_persia_events.44.d:0 "The British have reached out to the U.S. several times to help them, this time saying it's in the name of stopping Communism spreading in Iran."
 03_persia_events.44.f:0 ""America sees the British in the wrong here and has refused to help several times. Heck, Mossadeq has been named Time Magazine's 'Man of the Year', twice. Americans love him!""
 03_persia_events.44.a:0 "The Americans hate and fear communism so much that they will even take this percieved blow against Communism."
 03_persia_events.44.b:0 "The Americans uphold their ideals and refuse to help the British. Let the British come for us. We will show them the might of two strong and proud democracies."
 
 03_persia_events.45.t:0 "The End?" 
 03_persia_events.45.d:0 "The CIA have infiltrated Iran and are staging a coup."
 03_persia_events.45.f:0 ""Theodore Roosevelt's own grandson, Kermit Roosevelt, is the CIA's lead man in destroying a burgeoning democracy. What would the rough rider say if he were still alive today?""
 03_persia_events.45.a:0 "The coup is successful, Mossadeq is exiled, and [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] is more powerful and wary of liberals than ever. If only this were the end of the tragic history of Iran..."
 03_persia_events.45.b:0 "No. This is not the end of true democracy in Iran. We must fight this. Fight this with everything we have. Every future Iranian is counting on us."

 03_persia_events.46.t:0 "Howard Baskerville" 
 03_persia_events.46.d:0 "An American Missionary in Tabriz wants to organize his students into a military force to help break the siege that the Shah wages on Tabriz. The American government insists that Howard not interfere in the affairs of another country."
 03_persia_events.46.f:0 ""He kept repeating that he could not sit still and watch the hungry people of the city fight for their rights through the window of a classroom .""
 03_persia_events.46.a:0 "Howard refused to forsake a country fighting for the ideals that America is supposed to stand for."
 03_persia_events.46.b:0 "Howard cracks under pressure and returns to teaching."

 03_persia_events.47.t:0 "American Fate" 
 03_persia_events.47.d:0 "Howard tried to break the siege with his force to get food and provisions for the people of Tabriz."
 03_persia_events.47.f:0 ""The news of the readiness in the city was complicated. Our goal was the Shanb Ghazan. As I remember there was of us. It took us about an hour or so to reach Ghazan From the garden on the right side of the alley, we entered that alley and set foot there, Baskerville suddenly shouted "attack" and began to advance. Behind him I walked and several others accompanied. There was still silence, and perhaps the attackers wanted to surprise the other side. It was still dark when suddenly a series of rifles were fired at us.""
 03_persia_events.47.a:0 "Howard is shot and killed in the gunfire. Iran will never forget the sacrifice of this American Martyr."
 03_persia_events.47.b:0 "Howard and his forces succeed at breaking the siege. This unlikely Iranian hero has brought us one step closer to taking down [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]."

 03_persia_events.48.t:0 "Rebuilding a Comummunity" 
 03_persia_events.48.d:0 "The crippling Jizya Tax has been repealed, but Hataria wants to do more."
 03_persia_events.48.f:0 "In Bombay, a meeting of the Parsi leaders reviewed Hataria’s reporting and initiated plans for fundraising for schools, fire temples, and a daḵma."
 03_persia_events.48.a:0 "If they want to fund this on their own then [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] takes no issue with this."
 03_persia_events.48.b:0 "We can give them a little charity to help out."
 03_persia_events.48.c:0 "Hataria has stirred up enough trouble. He accomplished what he came here for and must leave."
 
 03_persia_events.49.t:0 "The Shah Factor" 
 03_persia_events.49.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] wishes to support Amir Kabir's republic."
 03_persia_events.49.f:0 ""Heavy is the head that wears the crown. I believe some British fellow said that at one point. The point is, I'm going to retire to the countryside and live a peaceful life.""
 03_persia_events.49.a:0 "He talks down the most reactionary members of the royal family."
 
 03_persia_events.50.t:0 "Amir Kabir for President!" 
 03_persia_events.50.d:0 "The people chant a single name for president. Amir Kabir."
 03_persia_events.50.f:0 ""Iran deserves a great leader like Amir Kabir. With him at the head it is only a matter of time before Iran is not only prosperous to it's people, but also a great power once again.""
 03_persia_events.50.a:0 "Accept charitable donations from the people to help win."
 03_persia_events.50.b:0 "Let him ride his popularity. He can't possibly lose!"
 03_persia_events.50.c:0 "Suppress the vote of the nobility. We can't let those reactionaries have any power."
 
 03_persia_events.51.t:0 "Vaqaye-e Ettefaqiyeh" 
 03_persia_events.51.d:0 "The newspaper is ready to start selling."
 03_persia_events.51.f:0 ""Wow. We used to only have one newspaper, but now we have two! Maybe someday we'll have a third. A man can dream can't he?""
 03_persia_events.51.a:0 "It should promote Amir Kabir's reforms."
 03_persia_events.51.b:0 "A newspaper is meant to inform the people of what's going on in the world."

 03_persia_events.52.t:0 "Borders Restored" 
 03_persia_events.52.d:0 "Our former people are happy to be `out of the reach of their former Russian masters."
 03_persia_events.52.f:0 ""Armenia and Azerbaijan were taken from us in the early 1800's by the Russians. They will think twice about trying again.""
 03_persia_events.52.a:0 "The people are gripped by patriotic fevor and want us to take the rest of Armenia."
 03_persia_events.52.b:0 "We will give the Russians humiliating terms which will make them look weak to the international community."

 03_persia_events.53.t:0 "With Great Power..." 
 03_persia_events.53.d:0 "There was no doubt that we would become a great power again, but the real question is how will we wield it."
 03_persia_events.53.f:0 ""There are many different ways to wield power in this new age.""
 03_persia_events.53.a:0 "If we want to compete with the other great powers we must conquer and colonize."
 03_persia_events.53.b:0 "Economics is the true strength of a nation in this new era."
 03_persia_events.53.c:0 "We are nothing without our people. The state exists to serve them."
 
 03_persia_events.54.t:0 "Move over, The French" 
 03_persia_events.54.d:0 "Our food is known worldwide for it's exquisite taste."
 03_persia_events.54.f:0 ""The fanciest resteraunts around the world no longer want a French chef but a Persian one. Move over steak, kabob shall reign supreme upon the dinner plate.""
 03_persia_events.54.a:0 "We must focus on our industries on Persian cuisine."
 03_persia_events.54.b:0 "Advertise our food as the greatest in the world."
 
 03_persia_events.55.t:0 "Military's Focus" 
 03_persia_events.55.d:0 "Now that we have a modern military we must decide what it should focus on."
 03_persia_events.55.f:0 ""Having a weak military will result in being gobbled up like so many others by the Great Powers.""
 03_persia_events.55.a:0 "We must use it to expand our borders."
 03_persia_events.55.b:0 "All we need it for is a deterrent against antagonistic powers."
 03_persia_events.55.c:0 "We should use it to help colonize. That's how the Great Powers became so powerful."
 
 03_persia_events.56.t:0 "Iran Ascendant"
 03_persia_events.56.d:0 "We have brought our Middle-Eastern brothers and sisters into our fold where they can flourish."
 03_persia_events.56.f:0 ""Some question our republic conquering so many other nations, but is that not what Rome did?""
 03_persia_events.56.a:0 "Great Iran and Great Britain. There can be only one..."
 03_persia_events.56.b:0 "With Iran and Austria's empire at their zenith we can each start divying up the Russian bear."
 
 03_persia_events.57.t:0 "Never to Recover"
 03_persia_events.57.d:0 "We have sapped their strength. Now we must make sure they can never recover."
 03_persia_events.57.f:0 ""A military is not the only tool to deal with your enemy.""
 03_persia_events.57.a:0 "We will wreck their economies."
 03_persia_events.57.b:0 "We will constantly remind the world of how easily we defeated them."
 03_persia_events.57.c:0 "We will make sure their people blame their governments for their loss of power and standing."
 
 03_persia_events.58.t:0 "New Subjects"
 03_persia_events.58.d:0 "We must decide how to treat our new subjects."
 03_persia_events.58.f:0 ""This is the first step to centralizing authority in the country. You cannot build a strong effective state if you have no sway over half of it.""
 03_persia_events.58.a:0 "Their previous autonomy will not stand. Their purpose is to live in service to the Shah."
 03_persia_events.58.b:0 "Many of them are tribal. We should send experienced workers into their areas to help them qualify for more modern professions."
 03_persia_events.58.c:0 "New subjects means new labor. We shall work them to the bone."
 
 03_persia_events.59.t:0 "Political Maneuvering"
 03_persia_events.59.d:0 "[SCOPE.sCharacter('amir_kabir_scope').GetFullName] seizes an oppurtunity for diplomacy."
 03_persia_events.59.f:0 ""One must take any oppurtunity they can to turn a situation in their favor. Especially when the opposing country is more powerful than yourself.""
 03_persia_events.59.a:0 "He's found a corrupt official to bribe."
 03_persia_events.59.b:0 "He points out the newest threatning behaviour from Russia and Britian and that they are the real enemies."
 03_persia_events.59.c:0 "His opposing diplomat makes a blunder and Amir Kabir uses this to gain the upper hand."
 
 03_persia_events.60.t:0 "Death of Amir Kabir"
 03_persia_events.60.d:0 "Who will continue the legacy of our great ruler?"
 03_persia_events.60.f:0 ""We will miss you Amir Kabir. Though, we are not lost without you. Your dreams of a modern Iran continue in the hearts of the Iranians you inspired. khodafez my friend. khodafez.""
 03_persia_events.60.a:0 "We need someone with the same democratic values."
 03_persia_events.60.b:0 "Our next president should go even farther than Amir Kabir."
 03_persia_events.60.c:0 "We are progressing too quickly for our people to keep up. Let's go with someone without stances on anything."
 
 03_persia_events.61.t:0 "Appeal to Repeal"
 03_persia_events.61.d:0 "Hataria is trying once again to get us to repeal the Jizya tax."
 03_persia_events.61.f:0 ""These people have endured enough suffering at the hands of you Qajars. Will you not remove your hands from their throats?""
 03_persia_events.61.a:0 "Let him rant and rave. It won't hurt us."
 03_persia_events.61.b:0 "We should blame the ulama for clinging onto this arcane law."

 03_persia_events.62.t:0 "Ship Inspection"
 03_persia_events.62.d:0 "The British have started boarding our ships at sea under the pretense of checking if we are selling slaves."
 03_persia_events.62.f:0 ""They have no right to do this! I mean, slavery is bad but it's not like I'm doing it...anymore.""
 03_persia_events.62.a:0 "We should swallow this insult."
 03_persia_events.62.b:0 "This is just an excuse to harass us. Don't let them aboard."
 
 03_persia_events.63.t:0 "British Monopolies"
 03_persia_events.63.d:0 "British companies wish to buy exclusive rights to some of our industries."
 03_persia_events.63.f:0 ""The British love money and cheap goods. This does not mix well when they have a powerful army to back it up.""
 03_persia_events.63.a:0 "The British REALLY don't like it when you prevent them from getting even richer."
 03_persia_events.63.b:0 "Don't let them buy a single share."
 
 03_persia_events.64.t:0 "Trade Take Over"
 03_persia_events.64.d:0 "Russia wants to take over the operations of one of our trade centers."
 03_persia_events.64.f:0 ""They can't just take over our trade. We built them from the ground up.""
 03_persia_events.64.a:0 "It's just one trade center. It's not worth war with Russia."
 03_persia_events.64.b:0 "What? They can't find room to build their own trade center in Russia?"
 
 03_persia_events.65.t:0 "Russian Advisors"
 03_persia_events.65.d:0 "The Czar wishes to send us advisors for [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]."
 03_persia_events.65.f:0 ""I come to aid you [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]. The czar sees you as a fellow monarch. You must stick together if you are to keep your throne.""
 03_persia_events.65.a:0 "More advisors couldn't hurt."
 03_persia_events.65.b:0 "We don't need Russians whispering into the Shah's ear."
 
 03_persia_events.66.t:0 "Anchorage Rights"
 03_persia_events.66.d:0 "Russia wants anchorage rights in one of our lagoons."
 03_persia_events.66.f:0 ""They took up all the best fishing spots with their stupid metal boats!""
 03_persia_events.66.a:0 "They have a navy. It's not like we can just turn them away."
 03_persia_events.66.b:0 "Invite the bear right outside of our shores? We think not!"
 
 03_persia_events.67.t:0 "The Birth of Mozaffar"
 03_persia_events.67.d:0 "The wife of [SCOPE.sCharacter('shah_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('mozaffar_scope').GetFullName] has birthed a son. The newborn [SCOPE.sCharacter('mozaffar_scope').GetFullName] will be raised as the new [SCOPE.sCharacter('mozaffar_scope').GetPrimaryRoleTitle] of [ROOT.GetCountry.GetName]."
 03_persia_events.67.f:0 ""The Shah has had many sons with his 85 wives, but we have a good feeling that this one is gonna stick.""
 03_persia_events.67.a:0 "The shahdom is secure!"

 03_persia_events.68.t:0 "The Accession of Mozaffar"
 03_persia_events.68.d:0 "With the end of Nasir al-Din's reign, [SCOPE.sCharacter('shah_scope').GetFullName] has ascended to the [ROOT.GetCountry.GetAdjective] throne as shah of all persia. [SCOPE.sCharacter('shah_scope').GetHerHis|U] life has mostly been in pursuit of pleasure and he is not prepared for the responsibilities of the shahdom."
 03_persia_events.68.f:0 ""On the one hand, I didn't like the previous shah. On the other hand this guy isn't quite as bad, but has no idea what he's doing.""
 03_persia_events.68.a:0 "Long live the Shah!"

 03_persia_events.69.t:0 "The Accession of Muhammad Ali"
 03_persia_events.69.d:0 "With the end of Mozaffar al-Din's reign, [SCOPE.sCharacter('shah_scope').GetFullName] has ascended to the [ROOT.GetCountry.GetAdjective] throne as shah of all persia."
 03_persia_events.69.f:0 ""For some reason I feel like he'd be good at punching people...""
 03_persia_events.69.a:0 "Long live the Shah!"

 03_persia_events.70.t:0 "Assassination of Nasir"
 03_persia_events.70.d:0 "Whilst visiting a shrine, [SCOPE.sCharacter('shah_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('shah_scope').GetFullName] was shot to death by a follower of Jamāl al-Dīn al-Afghānī."
 03_persia_events.70.f:0 ""I will rule you differently if I survive!"" #reported to have been said while dying
 03_persia_events.70.a:0 "The longest reign of any Shah in Persia is finally over."
 
 03_persia_events.71.t:0 "The Bab"
 03_persia_events.71.d:0 "A merchant from Shiraz is claiming to have revealed divine revelation."
 03_persia_events.71.f:0 ""Very taciturn, and would never utter a word unless it was absolutely necessary. He did not even answer our questions. He was constantly absorbed in his own thoughts, and was preoccupied with repetition of his prayers and verses. He is described as a handsome man with a thin beard, dressed in clean clothes, wearing a green shawl and a black turban."" 
 03_persia_events.71.a:0 "He's surely no threat to the ulama."
 
 03_persia_events.72.t:0 "More Babis"
 03_persia_events.72.d:0 "The Bab has converted more with promises of his new social order."
 03_persia_events.72.f:0 ""We stood in front of him in astonishment as he wrote a 50 page treatise based on the governor questioning him on whether he was an apostate. It spoke to each of us and glorified god in a way that one knows someone personally."" 
 03_persia_events.72.a:0 "They're still technically Muslim. Nothing to worry about."
 03_persia_events.72.b:0 "They are a direct challenge to the government and orthodox clergy. We must suppress them."
 03_persia_events.72.c:0 "Even from exile, The Bab, still holds sway in the country."
 03_persia_events.72.e:0 "We need to send assassins to deal with him. It might make a martyr of him, but we have to do something."

 #03_persia_events.73.t:0 "Bahai"
 #03_persia_events.73.d:0 "."
 #03_persia_events.73.f:0 ""."" 
 #03_persia_events.73.a:0 "."

 03_persia_events.74.t:0 "Firing Squad"
 03_persia_events.74.d:0 "Thousands came to watch The Bab's execution in Tabriz, but upon the firing squad opening fire he was left untouched..."
 03_persia_events.74.f:0 ""We stood in a line and fired upon the apostate. When the smoke cleared, all we managed to do was destroy the rope binding him. Maybe this guy is the Mahdi..."" 
 03_persia_events.74.a:0 "His followers may be gaining a martyr, but we must end this now. Fire again."
 03_persia_events.74.b:0 "The firing squad believe that his survival is a miracle and convert on the spot. Now people across the country are doing the same."

 03_persia_events.75.t:0 "Babism established"
 03_persia_events.75.d:0 "With Babism sweeping the country, we have to accept that it's here to stay."
 03_persia_events.75.f:0 ""A new era of peace and progress is here. With the Mahdi on earth, and in Persia no less, all our woes will soon be gone."" 
 03_persia_events.75.a:0 "Out with the old and in with the new."
 03_persia_events.75.b:0 "We must stand vigilant to protect the old order."
 
 03_persia_events.76.t:0 "Parsi in Persia"
 03_persia_events.76.d:0 "A Parsi activist, [SCOPE.sCharacter('hataria_scope').GetFullName], was appointed emissary by the Persian Zoroastrian Amelioration Fund in Gujarat, India. He wants to be allowed into the country to help the Zoroastrians living in Persia."
 03_persia_events.76.f:0 ""The Qajar monarchy has treated them cruely and devastated the community during the years of their rule. On the other hand, the extra taxes are nice."" 
 03_persia_events.76.a:0 "Let him in. It's not like the Shah is going to change his mind."
 03_persia_events.76.b:0 "Any questioning of the Shah's rule is a threat to the idea of monarchy."

 
 #Afghanistan
 01_afghanistan_events.1.t:0 "Your Rule"
 01_afghanistan_events.1.d:0 "Now that [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] has unified [ROOT.GetCountry.GetName]", he must choose how he wishes to rule."
 01_afghanistan_events.1.f:0 ""We were once fractured into several warring emirates. Everyone around me is celebrating, but I'm not sure how it affects us peasants tilling our farms.""
 01_afghanistan_events.1.a:0 "He must be a father protector to all his people, no matter their race."
 01_afghanistan_events.1.b:0 "His subjects live to serve him."
 01_afghanistan_events.1.c:0 "Who cares about the people? All that matters is conquest."
 
 01_afghanistan_events.2.t:0 "No Challengers"
 01_afghanistan_events.2.d:0 "The biggest threat to [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]'s new rule is dead."
 01_afghanistan_events.2.f:0 ""I prayed to Allah every day to deliver us from this tyrant. I've always been bad with directions, I must have been praying in the opposite direction of Mecca this whole time.""
 01_afghanistan_events.2.a:0 "Now he can sit on his throne without a care in the world."
 01_afghanistan_events.2.b:0 "He must put all his efforts into defeating the rest of his challengers to the throne."
 01_afghanistan_events.2.c:0 "Those with even an inkling of support for Dost Mohammed Khan must be made an example of." 
 
 01_afghanistan_events.3.t:0 "Return of the Khan"
 01_afghanistan_events.3.d:0 "Now that Shah Shuja is dead, Dost Mohammad Khan is the undisputed ruler of [ROOT.GetCountry.GetName]."
 01_afghanistan_events.3.f:0 ""Our prayers have been answered! The shah is dead! Long live the shah!""
 01_afghanistan_events.3.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] gives a general amnesty to Shah Shuja's supporters. They were only serving him out of fear."
 01_afghanistan_events.3.b:0 "Akbar refuses to step aside for his father and keeps Kabul for himself. Shah Shuja's supporters are crushed by him." 
   
 01_afghanistan_events.4.t:0 "Retribution"
 01_afghanistan_events.4.d:0 "We have won our freedom, but our enemy won't get off so easily."
 01_afghanistan_events.4.f:0 ""I say we march across their land, invade their capital, replace their leaders with pigs, and then chop off all the male population's left ears. That'll teach em!'""
 01_afghanistan_events.4.a:0 "We will feign our own weakness to make them look even worse for losing to us."
 01_afghanistan_events.4.b:0 "We shall tell the whole world of the atrocities they committed during their occupation." 
 01_afghanistan_events.4.c:0 "Demand that they pay to help rebuild after all the damage that they've done."
 
 01_afghanistan_events.5.t:0 "Brave Warrior"
 01_afghanistan_events.5.d:0 "[SCOPE.sCharacter('yazer_scope').GetFullName] is impressing the people with his daring military exploits."
 01_afghanistan_events.5.f:0 ""Unlike a lot of the other generals he leads us directly into battle. The other generals just give orders from the safety of their tents.""
 01_afghanistan_events.5.a:0 "People should be praising the shah, not his nemesis!"
 01_afghanistan_events.5.b:0 "The Shah hates to admit it, but [SCOPE.sCharacter('yazer_scope').GetFullName] has been indispensable in this war." 

 01_afghanistan_events.6.t:0 "Dispensing Justice"
 01_afghanistan_events.6.d:0 "Locals are starting to go to [SCOPE.sCharacter('yazer_scope').GetFullName] to settle their disputes."
 01_afghanistan_events.6.f:0 ""I once saw him settle a dispute between two women claiming to be the mother of a child. [SCOPE.sCharacter('yazer_scope').GetFullName] said that the only way to keep things fair was to cut the baby in half with a saber. As he raised his blade, one of the women stopped him and said to give the baby to the other woman. He proclaimed that the one who stopped him was the true mother as she was worried about his safety. Genius! Where does he come up with this stuff?""
 01_afghanistan_events.6.a:0 "Rulings are supposed to be meant for the shah!"
 01_afghanistan_events.6.b:0 "The shah is relieved about not having to deal with these trivial matters." 
 
 01_afghanistan_events.7.t:0 "Oppose"
 01_afghanistan_events.7.d:0 "[SCOPE.sCharacter('yazer_scope').GetFullName] wishes to oppose [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] any way he can and now is convincing his fellow nobles to hinder the shah's newest law."
 01_afghanistan_events.7.f:0 ""I'm caught between the shah and the one with real power in the country. I guess I'll flip a coin and decide that way.""
 01_afghanistan_events.7.a:0 "Anyone going against the will of the shah will be considered a traitor!"
 01_afghanistan_events.7.b:0 "This law isn't worth getting into a fight over." 
 
 01_afghanistan_events.8.t:0 "Resistance"
 01_afghanistan_events.8.d:0 "Our invaders relish in their victory. Thinking they have won. We have only just begun."
 01_afghanistan_events.8.f:0 ""I'm ready to fight...how do I fire a gun?""
 01_afghanistan_events.8.a:0 "We won't wait a single day longer. [ROOT.GetCountry.GetName] must be free!"
 01_afghanistan_events.8.b:0 "If we gamble on freedom before we're ready then it will set us back decades." 
 
 01_afghanistan_events.9.t:0 "Recruit Population"
 01_afghanistan_events.9.d:0 "We need to convince more of the population to rise up against the invaders."
 01_afghanistan_events.9.f:0 ""I was promised if I showed up at this encampment I'd be given bread--why are you handing me a gun?""
 01_afghanistan_events.9.a:0 "Appeal to the patriotism of the masses."
 01_afghanistan_events.9.b:0 "Any adult man who doesn't join up should be shot."
 01_afghanistan_events.9.c:0 "The resistance fighters that already volunteered are all we need."
  
 01_afghanistan_events.10.t:0 "Mountain strongholds"
 01_afghanistan_events.10.d:0 "We should use our mountaious terrain to our advantage."
 01_afghanistan_events.10.f:0 ""My mother always yelled at me when I would travel off into the mountains on my own. Now the resistance is coming to me to help save [ROOT.GetCountry.GetName]. Now who's a dissapointment mother!?""
 01_afghanistan_events.10.a:0 "Let them scour the mountains for us while their army falls apart due to disease and desertion."
 01_afghanistan_events.10.b:0 "We will use hit and run tactics to lure them into an ambush in the mountains." 
 01_afghanistan_events.10.c:0 "We will not run and hide. We will fight them in the open."
 
 01_afghanistan_events.11.t:0 "Arms from foreign nations"
 01_afghanistan_events.11.d:0 "One of the great powers wants to secretly funnel arms to us."
 01_afghanistan_events.11.f:0 ""No one knows where the weapons our generals hand us are coming from, but they certainly aren't made here. The only clue is some writing on each of them in a language no one here understands 'made in the U.S.'""
 01_afghanistan_events.11.a:0 "We'll take all the arms we can get."
 01_afghanistan_events.11.b:0 "We'd rather have them send a general who knows how to use the more advanced weaponry." 
 01_afghanistan_events.11.c:0 "We will not put ourselves in the pocket of another nation."
 
 01_afghanistan_events.12.t:0 "Retribution"
 01_afghanistan_events.12.d:0 "We have won our freedom, but our enemy won't get off so easily."
 01_afghanistan_events.12.f:0 ""I say we march across their land, invade their capital, replace their leaders with pigs, and then chop off all the male population's left ears. That'll teach em!'""
 01_afghanistan_events.12.a:0 "We will feign our own weakness to make them look even worse for losing to us."
 01_afghanistan_events.12.b:0 "We shall tell the whole world of the atrocities they committed during their occupation." 
 01_afghanistan_events.12.c:0 "Demand that they pay to help rebuild after all the damage that they've done."
 
 01_afghanistan_events.13.t:0 "What now?"
 01_afghanistan_events.13.d:0 "The great powers eye our land greedily, but what can we even do about it?"
 01_afghanistan_events.13.f:0 ""These foreign nations are snatching up everyone around us. We need to prepare for the inevitable.""
 01_afghanistan_events.13.a:0 "We must become a large kingdom like theirs in order to fight them on equal ground."
 01_afghanistan_events.13.b:0 "Plenty of others are in the same predicament. We should stand together." 
 01_afghanistan_events.13.c:0 "Going against the Great Powers will just antagonize them. Let us focus on ruling our people instead." 
 
 01_afghanistan_events.14.t:0 "Next Steps"
 01_afghanistan_events.14.d:0 "We hold the capital of our enemy, but why stop there?"
 01_afghanistan_events.14.f:0 ""My whole village celebrated the day our troops marched into Moscow, and even more when they entered London town. I never thought I'd live to see this day, though I suspect the British and Russians are even more shocked.""
 01_afghanistan_events.14.a:0 "We demand tribute in the form of goods!"
 01_afghanistan_events.14.b:0 "We should humiliate the other great powers as well!" 
 01_afghanistan_events.14.c:0 "We will not be like these monsters. They can have their land back. We've already taught them and all the other great powers not to mess with us."
 
 01_afghanistan_events.15.t:0 "Make your own Tea"
 01_afghanistan_events.15.d:0 "With the taking of their capital, The East India Trading Company will collapse within days."
 01_afghanistan_events.15.f:0 ""I never understood how an entire company could control a whole nation. Then someone gave me a book explaining capitalism and it made perfect sense.""
 01_afghanistan_events.15.a:0 "India is ours for the taking!"
 01_afghanistan_events.15.b:0 "Taking over the whole country in one fell swoop will only lead to rebellions. Let's conquer it at a decent pace."
 01_afghanistan_events.15.c:0 "The freed nations of India will make great allies." 

 01_afghanistan_events.16.t:0 "The Vizier Acts"
 01_afghanistan_events.16.d:0 "[SCOPE.sCharacter('coup_leader').GetFullName] is finally making his move to claim the throne."
 01_afghanistan_events.16.f:0 ""Sure the shah may be a vile tyrant that treats his subjects like ants, but you can't just get rid of him. It goes against tradition.""
 01_afghanistan_events.16.a:0 "The rest of the nobles back [SCOPE.sCharacter('coup_leader').GetFullName]."
 01_afghanistan_events.16.b:0 "Demand that the nobles fall in line with swift repercussions for those who don't."

 01_afghanistan_events.17.t:0 "From Vizier to Shah"
 01_afghanistan_events.17.d:0 "Yaz is the new Shah!"
 01_afghanistan_events.17.f:0 ""As far as getting a new shah goes, this was pretty bloodless.""
 01_afghanistan_events.17.a:0 "Long live the Shah!"
 01_afghanistan_events.17.b:0 "The people will not forget that the new Shah is not the rightful ruler of [ROOT.GetCountry.GetName]." 

 01_afghanistan_events.18.t:0 "Succession"
 01_afghanistan_events.18.d:0 "Though the Emir was clear that he wants his son to rule after his death, his brothers have their own ideas."
 01_afghanistan_events.18.f:0 ""Does it really matter who rules us? We grow our own food and tend to our families regardless of who sits on the throne.""
 01_afghanistan_events.18.a:0 "[SCOPE.sCharacter('rahim_dil').GetFullName] has the backing of the aristocrats."
 01_afghanistan_events.18.b:0 "[SCOPE.sCharacter('mir_dil').GetFullName] has the respect of the army. Going against him would be foolish."
 01_afghanistan_events.18.c:0 "Kohan Dil's wishes must be upheld."
 
 01_afghanistan_events.19.t:0 "Poisoning"
 01_afghanistan_events.19.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] has been poisoned!"
 01_afghanistan_events.19.f:0 ""I told the Shah that I should have tested his food first, but he said dogs don't eat from the same table as a shah.""
 01_afghanistan_events.19.a:0 "Get him a doctor!"
 01_afghanistan_events.19.b:0 "Let this monster succumb to the poison."

 01_afghanistan_events.20.t:0 "Stabbing"
 01_afghanistan_events.20.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] has been stabbed!"
 01_afghanistan_events.20.f:0 ""I saw him exit the palace when Shuja ud-Daula stabbed him. Apparently his uncle, Oosman Khan convinced him to do it.""
 01_afghanistan_events.20.a:0 "Get him a doctor before he has us all beheaded!"
 01_afghanistan_events.20.b:0 "We'll be better off without him. Let him bleed out."

 01_afghanistan_events.21.t:0 "Drowning"
 01_afghanistan_events.21.d:0 "Guards found a man drowning [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] in his bathtub!"
 01_afghanistan_events.21.f:0 ""I was coming to check on the Shah. I heard thrashing and splashing on the other side of the door. I opened the door and sure enough. An assassin had snuck in.""
 01_afghanistan_events.21.a:0 "Stop the assailant!"
 01_afghanistan_events.21.b:0 "Close the door and pretend you didn't see anything."

 01_afghanistan_events.22.t:0 "The End of British Rule!"
 01_afghanistan_events.22.d:0 "With the loss of it's capital, the [ROOT.GetCountry.GetName] is on the verge of collapse. It seems that [SCOPE.sCulture('british_culture').GetName] rule is at an end."
 01_afghanistan_events.22.f:0 ""Abandoning our post? What post, what army? In a few hours this place will be swarming with Hindus, or on fire, or both. Now stop complaining and pick up that sack. Take anything of value that isn't nailed down, and I'll secure passage to London.""
 01_afghanistan_events.22.a:0 "India will be divided between the Princes."
 01_afghanistan_events.22.b:0 "This is the birth of an Indian nation."
 01_afghanistan_events.22.c:0 "British rule must be maintained at all costs."

 01_afghanistan_events.23.t:0 "Good Enough?"
 01_afghanistan_events.23.d:0 "We have secured the defense of our homeland, but is that as far as we're willing to go?"
 01_afghanistan_events.23.f:0 ""Sure, we may be safe, but for how long?""
 01_afghanistan_events.23.a:0 "If we can manage to occupy London, then Britain will never dare trifle with us again."
 01_afghanistan_events.23.b:0 "If we take Moscow, the Russian Bear will never bare it's teeth at us again."
 01_afghanistan_events.23.c:0 "The East India Company are Britain's entry into the region. We must end them."
 01_afghanistan_events.23.e:0 "Any more aggressive actions could provoke them. We just need to stand our ground."
 
 01_afghanistan_events.24.t:0 "Naval Model"
 01_afghanistan_events.24.d:0 "What do we want to focus on for our new navy?"
 01_afghanistan_events.24.f:0 ""[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] wants to create a navy? We're surrounded by mountains. Is he building fancy new boats that go on land?""
 01_afghanistan_events.24.a:0 "We should focus on making ports for overseas trade."
 01_afghanistan_events.24.b:0 "We need powerful vessels to defend against our enemies."
 01_afghanistan_events.24.c:0 "A navy is worthless without the most modern naval theories to back them up."

 01_afghanistan_events.25.t:0 "Border Disputes Settled"
 01_afghanistan_events.25.d:0 "We have settled our borders and must decide how we want to treat our neighbors."
 01_afghanistan_events.25.f:0 ""How do they know where a border ends and a border starts? I see the little lines on the map, but their aren't on the ground.""
 01_afghanistan_events.25.a:0 "We need to cool our aggression towards our more powerful neighbors."
 01_afghanistan_events.25.b:0 "We have the momentum. We should get as much as we can from our neighbors while they're weak."

 01_afghanistan_events.26.t:0 "Build the Wall"
 01_afghanistan_events.26.d:0 "We have a great buffer for our capital."
 01_afghanistan_events.26.f:0 ""So taking all the land adjacent to the Russsians will keep us safe from them? If you say so.""
 01_afghanistan_events.26.a:0 "We need to focus on training our new subjects for the military."
 01_afghanistan_events.26.b:0 "We need an even larger buffer."

 01_afghanistan_events.27.t:0 "Kurultai"
 01_afghanistan_events.27.d:0 "The representatives arrive in droves. Each arrival is considered a vote in favor of our khan for a Kurultai."
 01_afghanistan_events.27.f:0 ""I don't really like my khan, so I figured I'd try out a new one. What's the harm really?""
 01_afghanistan_events.27.a:0 "The Khan lays claim to the rest of the region."
 01_afghanistan_events.27.b:0 "The Khan will be a defender of our people everywhere and welcomes our cultural brothers and sisters from other countries where they are not treated as equals."
 01_afghanistan_events.27.c:0 "The Khan proclaims himself Khan of Khans. Invoking the old title of Genghis Khan will boost our people's preference for war to achieve our ends. Though, the reference to Genghis Khan will alarm the rest of the world for obvious reasons."

 01_afghanistan_events.28.t:0 "Tribal Subsidies"
 01_afghanistan_events.28.d:0 "The British government is sick of the costs to bribe the Afghan tribes to put up with the occupiers."
 01_afghanistan_events.28.f:0 ""These costs are ridiculous! And to what? Bribe a bunch of tribesmen to not attack our profession modern military? We'll be fine.""
 01_afghanistan_events.28.a:0 "There's nothing we can do about it."
 01_afghanistan_events.28.b:0 "They don't understand what they're unleashing. We should offer to pay for part of it."
 
 01_afghanistan_events.29.t:0 "Afghan Uprising"
 01_afghanistan_events.29.d:0 "Akbar Khan uses the rising tension in the city against the British to proclaim a revolt and the citizens of Kabul are joining him!"
 01_afghanistan_events.29.f:0 ""He slew Sir Alexander Burnes and his staff, but Major General Elphinstone hasn't done anything about it. Emboldened they are beggining to crush British forces within the city and on its outskirts.""
 01_afghanistan_events.29.a:0 "We need to help the British. Our retribution won't be swift, but it's better late than never."
 01_afghanistan_events.29.b:0 "Major General Elphinstone negotiates with Akbar Khan for a safe retreate for his men and civilians the with them. In exchange he leaves Akbar most of the British weaponry still in the city."
 
 01_afghanistan_events.30.t:0 "The Long Retreat"
 01_afghanistan_events.30.d:0 "After a successful revolt in Kabul to kick out the British garrison, Akbar negotiated for weapons and ammunition to be handed over in exchange for safe passage out of the country."
 01_afghanistan_events.30.f:0 ""I heard Akbar yelling out 'Spare them!' in Persian, but 'Kill them!' in Pashto.""
 01_afghanistan_events.30.a:0 "Akbar stays true to his word and allows them to leave unharmed."
 01_afghanistan_events.30.b:0 "Akbar executes the wounded and sick the British left behind, attacks the retreating army, fools them again with false negotiations, and gives guns to tribes in the area to attack them. British and Indian soldiers, their families, servants, and civilian workers. None are given quarter."
 
 01_afghanistan_events.31.t:0 "Massacre of Elphinstone's Army"
 01_afghanistan_events.31.d:0 "Akbar and his troops slaughter the retreating British."
 01_afghanistan_events.31.f:0 ""I heard Akbar yelling out 'Spare them!' in Persian, but 'Kill them!' in Pashto.""
 01_afghanistan_events.31.a:0 "Akbar's forces harassed them for the entire retreat. British and Indian soldiers, their families, servents, and civilian workers; about 14,000 in total. All slain or captured with the only survivor making it to Jalalabad being the assisstant surgeon. Company prestige was the final casualty."
 
 01_afghanistan_events.32.t:0 "Massacre of Elphinstone's Army"
 01_afghanistan_events.32.d:0 "After a successful revolt in Kabul to kick out our garrison, Mohammed Dost Khan's son, Akbar, promised the commanding officer they could retreat safely back to British territory."
 01_afghanistan_events.32.f:0 ""I heard Akbar yelling out 'Spare them!' in Persian, but 'Kill them!' in Pashto.""
 01_afghanistan_events.32.a:0 "Akbar's forces harassed them for the entire retreat. British and Indian soldiers, their families, servents, and civilian workers; about 14,000 in total. All slain or captured with the only survivor making it to Jalalabad being the assisstant surgeon. Company prestige was the final casualty."
1848_hungary_revolution.22.t:0 "Post-war Reconstruction"
1848_hungary_revolution.22.d:0 "The war has ended, and the imperial government has appointed #yellow General Franz Haynau #! to Hungary to restore order there."
1848_hungary_revolution.22.f:0 "This generation has only repaired a bridge for strangers to use. You may meet them someday. I beg you not to stay on this bank... rather to perish with the revolution rather than to receive relief from the reactionary government."
1848_hungary_revolution.22.a:0 "Finally"
rebuilt_complete_modifier:0 "Reconstruction Successful"
1848_hungary_revolution.23.t:0 "Reconstruction Successful"
1848_hungary_revolution.23.d:0 "All representatives of the Magyar elite have come together to oppose the imperial policies of centralization. While hardliners among them chose uncompromising opposition, moderates led by Ferenc Deák seek negotiations with the Vienna government. This has led to normalization of relations and ultimately a compromise. Realists among the Magyar political leadership understand that the preservation of Magyar privileges in Hungary and even the existence of the beloved kingdom rely on the framework of the Habsburg monarchy. Given the struggles of ethnic minorities for national liberation at home, developments in the Balkans, and Russia's expansionist policies, the possibility of an independent Magyar nation-state surviving is slim."
1848_hungary_revolution.23.f:0 "Élyen a Magyar\n——Long live the Magyar!"
1848_hungary_revolution.23.a:0 "They have returned to the imperial system, for now."
1848_hungary_revolution.24.t:0 "Reconstruction Failure"
1848_hungary_revolution.24.d:0 "All representatives of the Magyar elite have come together to oppose the imperial policies of centralization. Based on the February 1861 Royal Decree, when the supra-national imperial parliament (Reichsrat) was officially convened, it was met with resistance from the Magyars. They did not attend the imperial parliament; instead, the newly established Hungarian parliament became a platform for protest. To prevent further Hungarian separatism, we had to take urgent measures to salvage our relationship with the Magyars. We granted Hungary greater autonomy, and the moderate government led by Ferenc Deák will now begin to help stabilize the situation in Hungary."
1848_hungary_revolution.24.f:0 "Élyen a Magyar\n——Long live the Magyar!"
1848_hungary_revolution.24.a:0 "The compromise is only temporary!"

l_english:
je_hungarian_crisis:0 "Hungarian Parliament"
je_hungarian_crisis_reason:0 "#bold [concept_magyar]#! Consider themselves the core of #bold [concept_hungary_kindom]#!, the nation-state. Within the territories of the Crown of Saint Stephen, [concept_magyar] not only dominate linguistically but also constitute the largest ethnic group. They have historically enjoyed extensive autonomy and protection under the Hungarian constitution.\n\nThe primary representatives of the [concept_hungary_kindom] kingdom are #v $aristocrats$#!, who see themselves as guardians of the #bold Hungarian national identity#!. They have consistently resisted attempts to integrate Hungary into the Habsburg #bold centralizing policies#!. Even before the Compromise of 1867, these radical #v $aristocrats$# elites managed to maintain Hungary's special status.\n\nEven under Maria Theresa, the [concept_hungary_kindom] kingdom remained exempt from the reforms aimed at monarchic centralization. When Joseph II attempted to replace Latin with German as the administrative language and reform the constitution, he pushed Hungary to the brink of rebellion.\n\nWe must handle our relationship with [concept_magyar] (especially the noble elites) carefully, ensuring that all [concept_magyar] unite under the great banner of our Habsburgs."
status_hungary_revolution_progress_low:0 "Hungarian Autonomy Tendency: #variable Low#!"
status_hungary_revolution_progress_mid:0 "Hungarian Autonomy Tendency: #variable Moderate#!"
status_hungary_revolution_progress_high:0 "Hungarian Autonomy Tendency: #variable High#!"
hungary_autonomy_complete_tt:0 "Hungarian autonomy tendency reaches extremely high levels, radicals decide to take further action."
hungary_autonomy_fail_tt:0 "We successfully control Hungary's autonomy tendency."
hungary_revolution_progress_tt:0 "Hungarian autonomy tendency increases slightly."
#奥匈对峙###########################################################################################################################################################################
je_Tensions_in_Hungary_aus:0 "Springtime of Nations: Hungary"
je_Tensions_in_Hungary_aus_reason:0 "The progress bar will display the current tension between #variable Imperial Government# and the government of [SCOPE.sCountry('hungary_scope').GetName], reaching #variable 300# will send a #red ultimatum# to #bold [concept_hungary_kindom]#!.\n\nTensions will increase by #variable 5# points per week. Decisions that displease [SCOPE.sCountry('hungary_scope').GetName] will #red increase the tension#.\n\nAs the #bold liberal factions# of [concept_hungary_kindom] have gained a majority in parliament and begun making more excessive demands on the #variable Imperial Government#, the two governments are effectively in a standoff. While an [concept_war] has not yet broken out and #bold [concept_hungary_kindom]# has not rescinded loyalty to [Concept('concept_ruler','$RULER_TITLE_KAISER$')], this balance is fragile and could be shattered by the slightest provocation.\nWe can maintain the balance and compromise with [concept_magyar], or #red escalate the conflict#!, ending centuries of #variable privileges and autonomy for [concept_magyar] with a quick and precise military action.\n\nAll forces are poised, and if we do not make a decision immediately, we are likely to suffer greater losses!"
je_tih_status_1: "Current Phase: #bold #green Calm#! (#tooltippable #tooltip:[GetRawTextTooltipTag('hun_tension_tt')] [GetGlobalVariable('tensions_in_hungary_var').GetValue]#!#!)#!."
je_tih_status_2: "Current Phase: #bold #yellow Tense#! (#tooltippable #tooltip:[GetRawTextTooltipTag('hun_tension_tt')] [GetGlobalVariable('tensions_in_hungary_var').GetValue]#!#!)#!."
je_tih_status_3: "Current Phase: #bold #red Flashpoint#! (#tooltippable #tooltip:[GetRawTextTooltipTag('hun_tension_tt')] [GetGlobalVariable('tensions_in_hungary_var').GetValue]#!#!)#!."
je_tih_status_4: "Current Phase: #bold #blue Negotiations#! (#tooltippable #tooltip:[GetRawTextTooltipTag('hun_tension_tt')] [GetGlobalVariable('tensions_in_hungary_var').GetValue]#!#!)#!."
hun_tension_tt:0 "Tension measures the standard of relations between the Imperial Government and the government of Hungary, making decisions that make the Hungarians unhappy will #red increase the tension#!"
je_Tensions_in_Hungary_aus_complete:0 "Tension reaches 300"
je_Tensions_in_Hungary_aus_complete2:0 "We will send a final ultimatum to Hungary, and if they refuse, war will come."
je_Tensions_in_Hungary_aus_complete3:0 "War will be avoided when time runs out and the tension is less than 300. [SCOPE.sCountry('hungary_scope').GetName] will become our #variable joint allied state#!."
je_Tensions_in_Hungary_aus_button_a:0 "Negotiate a compromise"
je_Tensions_in_Hungary_aus_button_a_desc:0 "Only dialogue can resolve issues, and we must not miss any opportunity for peaceful negotiations."
Tensions_in_Hungary_aus_button_a_possible_tt:0 "No negotiations have taken place between us and Hungary in the last two months."
Tensions_in_Hungary_aus_button_a_effect_tt:0 "Tension will decrease by 20\nTension growth will briefly stop."
je_Tensions_in_Hungary_aus_button_b:0 "Deploy troops on the border"
je_Tensions_in_Hungary_aus_button_b_desc:0 "We cannot trust them and must bolster our defenses."
Tensions_in_Hungary_aus_button_b_possible_tt:0 "No troop deployments on the border in the last six months\nDeploying troops during negotiations will make us appear insincere."
Tensions_in_Hungary_aus_button_b_effect_tt:0 "Tension will increase by 20\nHungarians will notice our actions and take corresponding measures."
je_Tensions_in_Hungary_aus_button_c:0 "Send Franz Lamberth to Hungary"
je_Tensions_in_Hungary_aus_button_c_desc:0 "To improve our relations with the Hungarian government, we will send Hungarian General Franz Lamberth to Pest as Royal Commissioner and Commander of the Hungarian Army, believing Lamberth will certainly ease tensions on both sides."
Tensions_in_Hungary_aus_button_c_possible_tt:0 "Tension >= 200"
Tensions_in_Hungary_aus_button_c_effect_tt:0 "Lamberth will go to Hungary, and this respected Hungarian general will surely earn the respect of his compatriots, probably."
je_Tensions_in_Hungary_aus_button_d:0 "Request aid from Russia"
je_Tensions_in_Hungary_aus_button_d_desc:0 "Facing the Magyars alone might be challenging, but we can seek help from Russia, confident they will accept our request."
Tensions_in_Hungary_aus_button_d_possible_tt:0 "Tension >= 150\nWe have not sought help from Russia\n#variable Spring of Nations: Austria#! Journal is active."
Tensions_in_Hungary_aus_button_d_effect_tt:0 "Tension will increase by 40\nWe will request aid from Russia, and if they agree, they will become our allies and will certainly join our war against the Hungarians."
je_Tensions_in_Hungary_hun:0 "Springtime of Nations: Hungary"
je_Tensions_in_Hungary_hun_reason:0 "The progress bar will display the current tension between [SCOPE.sCountry('austria_scope').GetName] government and [SCOPE.sCountry('hungary_scope').GetName] government. When tension reaches #variable 300#, [SCOPE.sCountry('austria_scope').GetName] will send us a #red final ultimatum#. War will be avoided when time runs out and tension is less than 300.\nWe will become a #variable joint allied state# with [SCOPE.sCountry('austria_scope').GetName].\n\nTensions will increase by #variable 5# points per week. Decisions that displease [SCOPE.sCountry('austria_scope').GetName] will #red increase tension#.\n\nAs the #variable liberal factions# have gained a majority in parliament and established #bold [concept_hungary_kindom]#!'s first #variable responsible cabinet#, the two governments are effectively in a standoff. Although an [concept_war] has not actually broken out and we have not rescinded loyalty to [Concept('concept_ruler','$RULER_TITLE_KAISER$')], this balance is fragile and could be shattered by the slightest provocation.\nWe can maintain the balance and compromise with [SCOPE.sCountry('austria_scope').GetName], or #red escalate the conflict#, ending [SCOPE.sCountry('austria_scope').GetName]'s #variable oppression#! over us for centuries with a great war of independence.\nWhatever our choice, the goddess of fate will always stand with #bold [concept_magyar]#!"
je_Tensions_in_Hungary_hun_button_a:0 "Negotiate a compromise"
je_Tensions_in_Hungary_hun_button_a_desc:0 "Only dialogue can resolve issues, and we must not miss any opportunity for peaceful negotiations."
je_Tensions_in_Hungary_hun_button_a_possible_tt:0 "No negotiations have taken place between us and Austria in the last two months."
je_Tensions_in_Hungary_hun_button_a_effect_tt:0 "Tension will decrease by 20\nTension growth will briefly stop."
je_Tensions_in_Hungary_hun_button_b:0 "Demand Croatia"
je_Tensions_in_Hungary_hun_button_b_desc:0 "The invasion of Governor Jelačić and his troops poses a significant threat to Hungarian national security, and we must protest to the Vienna government, demanding the dismissal of Jelačić and the appointment of a governor loyal to us."
Tensions_in_Hungary_hun_button_b_possible_tt:0 "Tension >= 50\nWe have not demanded Croatia before."
Tensions_in_Hungary_aus_button_b_effect_tt:0 "Our demand will be submitted to Vienna, and if they agree, we will gain control over Croatia."
je_Tensions_in_Hungary_hun_button_c:0 "Discuss the status of non-Magyar ethnicities"
je_Tensions_in_Hungary_hun_button_c_desc:0 "The large number of non-Magyar ethnicities poses a serious threat to our regime, and we need to convene to decide their fate."
Tensions_in_Hungary_hun_button_c_possible_tt:0 "Tension >= 50\nWe have not discussed the status of non-Magyar ethnicities before."
Tensions_in_Hungary_aus_button_c_effect_tt:0 "Our parliament will prioritize the issue of non-Magyar ethnicities. Of course, this will anger many Magyar nationalists in parliament."
#匈牙利革命###########################################################################################################################################################################
je_hungarian_revolution:0 "Hungary is Burning!"
je_hungarian_revolution_reason:0 "The situation is irreversible. Despite numerous attempts by Bajani Lajos to seek peaceful resolutions in Vienna, all efforts have been in vain. With the Imperial government now supporting Croatian military actions, Austria-Hungary is effectively in a state of confrontation. We must immediately dispatch troops to quell the Hungarian rebellion. Fortunately, the Slavic and Romanian populations within Hungarian territories support our just cause, ensuring that we can easily suppress the rebels with their backing."
hungary_independent_war:0 "Hungarian Revolution"
je_postwar_reconstruction:0 "Postwar Reconstruction"
je_postwar_reconstruction_reason:0 "A political consequence of Habsburg victory is the abolishment of the historic constitution of [concept_hungary_kindom], a symbol of the nation. The new government, obedient to Vienna's central authority, is filled with German-speaking officials perceived as foreign rulers, fiercely opposed by [concept_magyar]. To dismantle [concept_hungary_kindom], Vienna has reorganized the entire kingdom and abolished the county system. Croatia-Slavonia and Transylvania have become royal domains with rights independent of [concept_hungary_kindom], while special privileges are granted to Serbia and Banat. These measures have even angered pro-Habsburg factions within Hungarian society. The [concept_magyar] have shown resolute passive resistance.\n\nOur relations with [concept_magyar] have plummeted to an all-time low, and immediate action is necessary to mend our relationship with them."
finished_hungary_reform_tt:0 "We have abolished the Hungarian military district and established a civilian government."
#匈牙利事件链##########################################################################################################################################################################
concept_magyar:0 "Hungarians"
concept_magyar_desc:0 "The term 'Hungarians (Natio—Hungarica)' refers to the feudal political elite group that has existed since the Middle Ages.\nIt is defined by historical identification with the Holy Crown of Hungary rather than membership in the Hungarian-speaking population. However, in the 19th century, the political meaning of Hungarian nationality overlooked the country's multicultural structure and began to be used to refer to the Magyar ethnic group in the modern sense.\n\nThe Magyars (Magyar) are the second largest linguistic group in the Habsburg Monarchy after the German-speaking population and the dominant ethnic group within the Kingdom of Hungary. The Magyar gentry (aristocrats) have a strong pride in the historical traditions of the Magyardom and have shaped a fundamental political atmosphere of nationalism in Hungary."
concept_hungary_kindom:0 "Hungary"
concept_hungary_kindom_desc:0 "Unlike most regions ruled by the Habsburg monarchy, the Kingdom of Hungary has an ancient historical constitution that limits royal power and greatly increases the authority of the parliament. The Golden Bull of 1222 is one of the earliest examples in Europe where a constitution limits monarchical authority, similar to the Magna Carta in England, and was imposed on the King of Hungary.\n\nIn 1804, Emperor Franz [$RULER_TITLE_KAISER$] announced the reorganization of all hereditary lands as the Austrian Empire, but the new imperial laws did not apply to the Kingdom of Hungary. The imperial government assured the Hungarian parliament that the establishment of the Austrian Empire would not in any way affect Hungary's independent legal system and constitution. Until 1848, the administrative and governmental structures of the Kingdom of Hungary were largely unaffected by the 'overall' structure of the Austrian imperial government.\nHowever, the old Hungarian constitution and public law make it legally impossible for Hungary to merge into another country. The central government of Hungary is still separate from the imperial government.\nThe country is ruled by the Hungarian Governorate (Gubernium) based in Bratislava (Pozsony), later moved to Pest, and the Hungarian Royal Prime Minister's Office in Vienna."
dsk_hungary_events.1.a:0 "Kingdom of Hungary"
dsk_hungary_events.1.b:0 "Like much of the Habsburg Monarchy, the ruling class in the [concept_hungary_kindom] is composed of aristocrats who maintained political and economic privileges until before the First World War. The relationship between the Magyar elites and the Habsburg Monarchy was dominated by their demands for autonomy. We must handle our relationship with them well, otherwise it might result in disaster."
dsk_hungary_events.1.c:0 "You simply cannot be a chef,\n[concept_hungary_kindom], my dear motherland!\nYou let the meat on one side burn,\nwhile on the other side it remains half-cooked.\nSome of your fortunate citizens choke to death,\nbecause they eat too rich a meal:\nand many of your poor children are hungry,\nwalking into their graves.\n— Petőfi!"
dsk_hungary_events.1.d:0 "Ha and Ma, the common world"
dsk_hungary_events.2.a:0 "Hungarian Liberals Control Parliament!"
dsk_hungary_events.2.b:0 "Our attempt to unite conservatives to control the [concept_hungary_kindom] parliament has failed. Now the liberal party of [concept_hungary_kindom] has taken the majority in parliament. While we now recognize this new government, it is clear that it will no longer be under our control."
dsk_hungary_events.2.c:0 "Because the Liberals were divided into factions in the struggle between #yellow Kossuth # and #yellow # Secta, conservatives generally opposed most reforms, thinking they could maintain a loutish faction majority, I , , have an in t t hat s ers ,  your e the  #$Trung#. 
dsk_hungary_events.2.d:0 "At this critical moment, we must temporarily compromise."
dsk_hungary_events.3.a:0 "Hungarian Situation Eases"
dsk_hungary_events.3.b:0 "Despite efforts by the radical liberals led by Kossuth to gain support from moderate liberals in parliament, they have not succeeded. The conservative party, with whom we cooperate, seized the opportunity of the liberal split and successfully won the majority in the upcoming elections. Street riots have been quelled, agitators arrested and brought to trial, and more people believe that cooperation with the Habsburgs is the only way out for Hungary's problems for the time being. It seems we don't have to worry about possible uprisings in Hungary for the time being."
dsk_hungary_events.3.c:0 "Disappeared, like Petőfi in the fog"
dsk_hungary_events.3.d:0 "Order is restored in Hungary"
dsk_hungary_events.4.a:0 "Hungarian Uprising"
dsk_hungary_events.4.b:0 "In the pre-March era (Vormärz), a new generation of activists emerged in the Hungarian 'patriotic' circle, who became increasingly confident in seeking a national state status for Hungary within the monarchy. Their supporters also marched in the streets, distributing pamphlets with their radical ideas, causing great trouble for the authorities."
dsk_hungary_events.4.c:0 "Winter, bleak and cold! You put iron chains on the rivers, winter, bleak and cold! You froze my two tearful eyes.\n— Petőfi"
dsk_hungary_events.4.d:0 "Damn it"
dsk_hungary_events.5.a:0 "New Round of Hungarian Uprising"
dsk_hungary_events.5.b:0 "Hungarian nationalists organized a large-scale march across Hungary!"
dsk_hungary_events.5.c:0 "Girl, you should have loved the poet, who else does not deserve to have you, who else does not deserve to get, because those people, not like the poet love their motherland.\n— Petőfi"
dsk_hungary_events.5.d:0 "Disperse them!"
dsk_hungary_events.6.a:0 "1839 Hungarian Parliament"
dsk_hungary_events.6.b:0 "Shortly after Emperor Ferdinand I ascended the throne, the government was shocked by the popularity of the Hungarian Liberal Party and tried to suppress the reform movement through arrests and imprisonment, including Kossuth and Miklós Wesselényi, but parliament was not deterred. The 1839 Hungarian Parliament announced that it would cease operating until political prisoners were released. In the lower house, the number of reformists was higher than ever before, while under the leadership of Count Louis Batthyányi and Baron Joseph Eötvös, a liberal party was also formed in the upper house. Under pressure from parliament, the government was forced to release most political prisoners."
dsk_hungary_events.6.c:0 "The storm must now be faced with the system now."
dsk_hungary_events.6.d:0 "This is just a temporary compromise"
dsk_hungary_events.7.a:0 "1844 Hungarian Parliament"
dsk_hungary_events.7.b:0 "In 1844, the Hungarian Parliament declared Hungarian as the official language of administration, legislation, and school education in the Kingdom of Hungary, ending Latin's dominance that had lasted for 844 years, and liberating peasants' property from feudal obligations, legalizing interethnic marriage, and opening up some official positions to non-nobles."
dsk_hungary_events.7.c:0 "Another incremental step in the Hungarian national liberation process."
dsk_hungary_events.7.d:0 "Traitors to tradition and ancestors!"
dsk_hungary_events.8.a:0 "Young Marchers"
dsk_hungary_events.8.b:0 "With the announcement of constitutionalism reaching Pest, a group of young Hungarians led by #yellow Sándor Petőfi # has already stirred a large crowd of citizens in Pest and has obtained the support of the Hungarian Parliament."
dsk_hungary_events.8.c:0 "The revolution began at the #yellow Pilvax Café # in Pest. It was the favorite meeting place for radical liberal intellectuals outside of parliament in the 40s. Early that morning, #yellow Sándor Petőfi # hurried to the Pilvax Café where he found Pál Vasvári and József Bajza, inviting them to Jókai's apartment, where he edited the 12 o'clock announcement. Around 8 o'clock, Petőfi and his companions went to the Pilvax Café. Here, Jókai read the #variable Twelve-Point Manifesto #. #yellow Petőfi # recited his new poem #variable 'National Anthem' #. Soon, the 'National Anthem' and 'Twelve Points' had spread throughout Buda, sparking a large-scale nationalist agitation."
dsk_hungary_events.8.d:0 "A storm is about to come"
#匈牙利革命事件链#######################################################################################################################################################################
1848_hungary_revolution.1.t:0 "Hungary rejects our final ultimatum!"
1848_hungary_revolution.1.d:0 "Since they are unwilling to negotiate, we can only respond to them with force."
1848_hungary_revolution.1.f:0 "Rise, Hungarians, the homeland is calling! It's time, act now, it's not too late! Will you be free men or slaves? Decide for yourselves, this is the question we solemnly swear to God of Hungary, we swear, we swear, we will no longer be slaves!\n————Peđa"
1848_hungary_revolution.1.a:0 "You rebels, behave yourselves! Watch as my dragoons come and send each of you to heaven!"

1848_hungary_revolution.2.t:0 "End of the Hungarian Revolution"
1848_hungary_revolution.2.d:0 "The idealistic Magyars could not match our formidable imperial army. The Hungarian War of Independence ended on August 13th, with the revolutionary forces surrendering near Világos, close to Arad. Following the revolution's failure, authorities imposed brutal reprisals. Revolutionary officers, officials, and other representatives were brought before military courts. In total, 4,628 cases were tried, resulting in the execution of 13 generals and 114 others. Thousands were sentenced to imprisonment, and their properties were confiscated. Those who managed to escape in time, such as Hungarian revolutionary leader Lajos Kossuth, were sentenced to death in absentia."

1848_hungary_revolution.2.f:0 "Long live the homeland! On, hunters!”(My homeland is alive! Come on, hunters!) - Last words of Hungarian Prime Minister Bajani Lajos before being executed by the firing squad.
1848_hungary_revolution.2.a:0 "Another victory for the great Habsburg revival!"
1848_hungary_revolution.3.t:0 "The Governor of Croatia supports us!"
1848_hungary_revolution.3.d:0 "The Governor of Croatia, Baron Jelačić, attempted to liberate Croatia from Hungary, becoming an independent entity under Habsburg rule. Eventually, he went to Vienna to swear allegiance as an advisor to the Austrian Emperor."
1848_hungary_revolution.3.f:0 "The besieged Habsburg Empire found a supporter among these patriotic conservative nobles: Baron Jelačić. As a proud Croat, he garnered support from anti-Magyar liberals at the Zagreb meeting, but as a loyal monarchist, he was the preferred leader of the conservatives. He was also seen as a strongman capable of controlling the peasant uprisings sweeping the region. In other words, he was the great hope of the Croatian nobility: someone who could secure greater autonomy from Vienna and maintain their authority over the peasants. Baron Jelačić also commanded the border forces. Meanwhile, the Habsburg court knew well that restoring control over Hungary depended on the loyalty and assistance of the border forces."
1848_hungary_revolution.3.a:0 "A pillar of the empire!"
1848_hungary_revolution.4.t:0 "Imperial troops driven out of Hungary"
1848_hungary_revolution.4.d:0 "We must admit that we have been defeated, and Hungary is now an independent country."
1848_hungary_revolution.4.f:0 "Long live Magyar - Magyar is alive!"
1848_hungary_revolution.4.a:0 "Damn it"
1848_hungary_revolution.5.t:0 "Ultimatum"
1848_hungary_revolution.5.d:0 "Our envoys have submitted our ultimatum to the pseudo-government in Pest. If they refuse our demands, they will be crushed ruthlessly by our prepared army."
1848_hungary_revolution.5.f:0 "“There is bloodshed everywhere! Sibling is turned against sibling, nation against nation! It is sheer madness! Crosses are marked on houses to be set on fire with blood. Pest is lost!” - Sečeni"
1848_hungary_revolution.5.a:0 "The storm is coming"
1848_hungary_revolution.6.t:0 "Ultimatum from [SCOPE.sCountry('1848_aus_scope').GetName]"
1848_hungary_revolution.6.d:0 "[SCOPE.sCountry('1848_aus_scope').GetName] has sent us an ultimatum. Though verbose, we have extracted the only valuable sentence from it: “#red Either freedom or death!#”"
1848_hungary_revolution.6.f:0 "“Let the devil himself struggle with his beliefs, if he will. Whatever happens, I will not ally with a thief and bring a country that has always been peaceful into war. I cannot express how much I loathe the court's intrigue, Jelacich is simply ridiculous, thinking he can become Napoleon with a word. ... the wood has become a boat. My fate is closely tied to Hungary ... God can not let go of a righteous cause.”"
1848_hungary_revolution.6.a:0 "Or freedom"
aus_hun_war_begin:0 "War has come"
1848_hungary_revolution.6.b:0 "Or death"
aus_will_annex_hun:0 "We will be annexed, the game will end"
1848_hungary_revolution.7.t:0 "Successful compromise negotiations!"
1848_hungary_revolution.7.d:0 "After numerous difficult negotiations with the government of [SCOPE.sCountry('1848_hun_scope').GetName], [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] has finally reached an agreement with Pest. The new compromise agreement will grant [SCOPE.sCountry('1848_hun_scope').GetName] a high degree of autonomy and limited sovereignty, conditional on recognizing [Concept('concept_ruler','$RULER_TITLE_KAISER$')] as the King of Hungary.\nSome criticize us for being weak, while others believe we have conceded too much to the Pest government. Nevertheless, bloody conflict has been avoided, and we will move into a new era together with [SCOPE.sCountry('1848_hun_scope').GetName]!"
1848_hungary_revolution.7.f:0 "Realists among the Magyar political leaders understand that only within the framework of the Habsburg monarchy can the privileged status of the Magyars in Hungary be preserved. Even the existence of their beloved kingdom depends on the monarchy. Given the struggles of minority ethnic groups for national liberation, developments in the Balkan region, and Russia's expansionist policies, the possibility of an independent Magyar national state surviving is slim."
1848_hungary_revolution.7.a:0 "Finally resolved"
1848_hungary_revolution.8.t:0 "Successful compromise negotiations!"
1848_hungary_revolution.8.d:0 "After numerous difficult negotiations with the government of [SCOPE.sCountry('1848_aus_scope').GetName], Vienna has finally reached an agreement with Pest. The new compromise agreement will grant us a high degree of autonomy and limited sovereignty, conditional on recognizing [Concept('concept_ruler','$RULER_TITLE_KAISER$')] as the King of Hungary.\nSome criticize us for being weak, while others believe we have conceded too much to the Vienna government. Nevertheless, bloody conflict has been avoided, and we will move into a new era together with [SCOPE.sCountry('1848_hun_scope').GetName]!"
1848_hungary_revolution.8.f:0 "Realists among the Magyar political leaders understand that only within the framework of the Habsburg monarchy can the privileged status of the Magyars in Hungary be preserved. Even the existence of their beloved kingdom depends on the monarchy. Given the struggles of minority ethnic groups for national liberation, developments in the Balkan region, and Russia's expansionist policies, the possibility of an independent Magyar national state surviving is slim."
1848_hungary_revolution.8.a:0 "Long live Magyar!"
1848_hungary_revolution.9.t:0 "#yellow Speech by Lajos Kossuth#!"
1848_hungary_revolution.9.d:0 "The renowned leader of the Liberal Party of [SCOPE.sCountry('1848_hun_scope').GetName], #yellow Lajos Kossuth#, delivered a famous speech in the lower house of [SCOPE.sCountry('1848_hun_scope').GetName]. He called for extensive and thorough reforms throughout the empire. The speech was so successful that it quickly reached our capital [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName], undoubtedly strengthening the constitutional and radical factions if not prohibited."
1848_hungary_revolution.9.f:0 "The speech became the 'prologue to the revolution'. He declared that Habsburg absolutism was "#variable filled with a plague-ridden atmosphere... making us dull and mentally numb#!" [SCOPE.sCountry('1848_hun_scope').GetName] should be "an independent nation, free from external interference", the only connection between [SCOPE.sCountry('1848_hun_scope').GetName] and Austria is the dynasty. Only if [Concept('concept_ruler','$RULER_TITLE_KAISER$')] continue to double as king of Hungary.\nKossuth further declared that the policy of making political the a public sector is to dangerous to be safe while Empire has to reforms but require fundamentally chagnes. 王朝 must between their#!” Lion roar of the impact content of to and was soon to and secret transmission of is.

1848_hungary_revolution.9.a:0 "Just a speech, what's there to fear?"
1848_hungary_revolution.9.b:0 "It's too dangerous, ban them immediately!"

1848_hungary_revolution.10.t:0 "Jelačić Issue"
1848_hungary_revolution.10.d:0 "An envoy from [SCOPE.sCountry('1848_hun_scope').GetName] has arrived at our court, demanding the dismissal of the Governor of Croatia, [SCOPE.sCharacter('Jelačić_scope').GetLastName], and the return of Croatia to [SCOPE.sCountry('1848_hun_scope').GetName]."
1848_hungary_revolution.10.f:0 "[SCOPE.sCharacter('Jelačić_scope').GetLastName] was appointed several months ago as the military governor of Dalmatia, Croatia, and Slavonia. He has strongly opposed [SCOPE.sCountry('1848_hun_scope').GetName], ordering that no orders from anyone other than himself be accepted until the Croatian parliament begins. He represents [Concept('concept_ruler','$RULER_TITLE_KAISER$')]. Two weeks later, he became the military frontier commander. After months in office, he falsely claimed Turkish threats, put some military organizations on alert, and refused to recognize the legitimacy of the [SCOPE.sCountry('1848_hun_scope').GetName] government. He also asked the Vienna Army Department to transfer Austria's military reserves to Croatia. [SCOPE.sCountry('1848_hun_scope').GetName] protested against #yellow Jelačić#'s aggressive resistance."
1848_hungary_revolution.10.a:0 "Dismiss Jelačić in name only, taking no coercive measures."
1848_hungary_revolution.10.b:0 "Forcefully remove Jelačić and hand Croatia over to Hungary."
Tensions_in_Hungary_add_20_tt:0 "Tension increases by 20."
Tensions_in_Hungary_subtract_20_tt:0 "Tension decreases by 20."
1848_hungary_revolution.11.t:0 "[SCOPE.sCountry('1848_aus_scope').GetName] Refuses to Hand Over Jelačić"
1848_hungary_revolution.11.d:0 "[SCOPE.sCountry('1848_aus_scope').GetName] promised to dismiss Jelačić, but secretly continues to support him, and the Croatian parliament refuses to obey the governor we sent."
1848_hungary_revolution.11.f:0 "Nevertheless, Jelačić's dismissal did not suppress the resistance of the South Slav people. Jelačić was determined to prove his loyalty to the Habsburg dynasty and had already started concentrating troops in Đakovo. Under pressure from the Magyars, the Croatian parliament also united in support of the governor."
1848_hungary_revolution.11.a:0 "Damn it!"
1848_hungary_revolution.12.t:0 "[SCOPE.sCountry('1848_aus_scope').GetName] Chooses to Hand Over Jelačić"
1848_hungary_revolution.12.d:0 "[SCOPE.sCountry('1848_aus_scope').GetName] finally chose to capitulate, dismissed Jelačić, and exiled him, and Croatia was handed over to us."
1848_hungary_revolution.12.f:0 "The Hungarians protested against Jelačić's aggressive resistance. The entire Austrian government realized its continued weakness and tried to maintain good relations with the Magyars, feeling that Jelačić was too hasty. On May 7, the Empire yielded to the Magyar government, handing over all its troops stationed in Hungary and the military frontier to the newly established military department in Budapest. The Hungarian government was able to appoint Baron János Hrabovszky to command the Kingdom's army to restore order on the southern border."
1848_hungary_revolution.12.a:0 "Consider them having good sense."
1848_hungary_revolution.13.t:0 "Austria Deploys Troops on the Border"
1848_hungary_revolution.13.d:0 "According to reports from our border sentries, there are signs of large-scale military activity on the border where we border [SCOPE.sCountry('1848_aus_scope').GetName]. It appears that [SCOPE.sCountry('1848_aus_scope').GetName] has begun deploying troops on the border to intimidate us."
1848_hungary_revolution.13.f:0 "'You hope that Hungary will be a free and independent Hungary, but I assure myself to support the political unity of the Austrian Empire. If you disagree, only military confrontation can resolve the issue.'\n— Jelačić"
1848_hungary_revolution.13.a:0 "We will respond in kind and deploy troops on the border to deter them."
1848_hungary_revolution.13.b:0 "Let's not escalate tensions at this time."
1848_hungary_revolution.14.t:0 "Request for Assistance from [SCOPE.sCountry('1848_aus_scope').GetName]"
1848_hungary_revolution.14.d:0 "An ambassador from [SCOPE.sCountry('1848_aus_scope').GetName] has arrived at our palace in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName], formally requesting our [Concept('concept_ruler','$RULER_TITLE_TSAR$')] to send troops to help them suppress the rebellion in [SCOPE.sCountry('1848_hun_scope').GetName]. Considering that the rebellion in [SCOPE.sCountry('1848_hun_scope').GetName] threatens our Polish border, sending troops is necessary. The decision now lies with [Concept('concept_ruler','$RULER_TITLE_TSAR$')], whether we should help [SCOPE.sCountry('1848_aus_scope').GetName] regain Pest."
1848_hungary_revolution.14.f:0 "When Schwarzenberg suppressed his [SCOPE.sCountry('1848_aus_scope').GetName] high hopes, ordering the ambassador of [SCOPE.sCountry('1848_aus_scope').GetName] to officially request assistance from Russia, Nicholas I readily agreed. Although privately telling Paskevich that he had no intention of getting involved in Hungarian affairs, he saw in Bem and other 'rogues' in Hungary 'not only enemies of Austria but also enemies of the entire world order and peace. The embodiment of villains, rogues, and disruptors must be destroyed for our own peace.'"
 1848_hungary_revolution.14.a:0 "In the name of the sacred struggle against anarchism, we will conduct military intervention."
1848_hungary_revolution.14.b:0 "We will strictly maintain neutrality!"
1848_hungary_revolution.15.t:0 "Military Envoy Sent by [SCOPE.sCountry('1848_aus_scope').GetName] Attacked by Mob!"
1848_hungary_revolution.15.d:0 "[SCOPE.sCountry('1848_aus_scope').GetName] sent military envoy Count Lajos von Lángberg to serve as our military commander. This move was intended to ease relations with us, but our people do not see it that way; they see him as shackles imposed by [SCOPE.sCountry('1848_aus_scope').GetName]. When he arrived in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName], a mob surrounded him. Now Lángberg's life is in danger. Should we condone vigilante justice against him or prioritize avoiding [SCOPE.sCountry('1848_aus_scope').GetName]'s wrath?"
1848_hungary_revolution.15.f:0 "The Hungarians do not see the appointment of Lángberg as an olive branch from the Austrian government. Especially as the Austrian government also appointed conservative reformist Count Lajos Batthyány as prime minister. According to the decree issued in April, these appointments are illegal because the Hungarian government did not approve them. Soon after, the Hungarian parliament retaliated, swearing their determination to uphold the constitution. The next day, as Lángberg's carriage passed over a floating bridge in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName], he was seen by a group of artisans, students, and soldiers, who dragged him out and beat him to death. This horrific murder spread like wildfire. The moderates no longer expect reconciliation and play into the hands of counter-revolutionaries within the government, who are determined to join forces with Jelačić and use force to crush the Hungarian revolution."
1848_hungary_revolution.15.a:0 "Condone vigilante justice."
1848_hungary_revolution.15.b:0 "Send out the National Guard to protect him."
Lamberg_died_tt:0 "Lángberg's death thoroughly enrages the Vienna government."
1848_hungary_revolution.16.t:0 "Lángberg's Death"
1848_hungary_revolution.16.d:0 "General Lajos von Lángberg, whom we sent to [SCOPE.sCountry('1848_hun_scope').GetName], has been beaten to death by the mob of [SCOPE.sCountry('1848_hun_scope').GetName]! Although [SCOPE.sCountry('1848_hun_scope').GetName] vehemently condemned this act afterward and is determined to prosecute those involved, our intelligence suggests that the sluggish actions of [SCOPE.sCountry('1848_hun_scope').GetName]'s National Guard are the real reason behind Lángberg's death. Nevertheless, any attempt at reconciliation with [SCOPE.sCountry('1848_hun_scope').GetName] will fail because of Lángberg's death."
1848_hungary_revolution.16.f:0 "The Hungarians do not see the appointment of Lángberg as an olive branch from the Austrian government. Especially as the Austrian government also appointed conservative reformist Count Lajos Batthyány as prime minister. According to the decree issued in April, these appointments are illegal because the Hungarian government did not approve them. Soon after, the Hungarian parliament retaliated, swearing their determination to uphold the constitution. The next day, as Lángberg's carriage passed over a floating bridge in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName], he was seen by a group of artisans, students, and soldiers, who dragged him out and beat him to death. This horrific murder spread like wildfire. The moderates no longer expect reconciliation and play into the hands of counter-revolutionaries within the government, who are determined to join forces with Jelačić and use force to crush the Hungarian revolution."
1848_hungary_revolution.16.a:0 "This is not an accident; this is a murder! We will make the Hungarians pay for this!"
Lamberg_died_tt2:0 "Tension increases by 200."
1848_hungary_revolution.17.t:0 "[SCOPE.sCulture('slovak_culture').GetName] Revolution"
1848_hungary_revolution.17.d:0 "The people of [SCOPE.sCulture('slovak_culture').GetName] have begun to resist our rule! After several voluntary attempts failed, the National Assembly of [SCOPE.sCulture('slovak_culture').GetName] has declared Slovakia's separation from Hungarian rule and pledged allegiance to the Vienna government."
1848_hungary_revolution.17.f:0 "The people living within the Kingdom of Hungary, primarily those of [SCOPE.sCulture('slovak_culture').GetName], first made demands, drafting a list of fourteen demands calling for equal status for [SCOPE.sCulture('slovak_culture').GetName] and other nationalities within the Kingdom of Hungary. However, the government in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName], dominated by Greater Magyarism, not only ignored their demands but also arrested the drafters on a large scale.\nIn response, Slovak nationalists such as Štúr, Hurban, and Hodža established the #variable Slovak National Committee# in Vienna, declaring Slovakia's independence from the [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] government's control. Many Slovak volunteers joined the Habsburg movement against Hungary and formed the Slovak Legion."
1848_hungary_revolution.17.a:0 "This is tearing the country apart!"
slovak_uprising_tt:0 "Slovakia will seek recognition from the Vienna government."
1848_hungary_revolution.18.t:0 "Messenger from [SCOPE.sCountry('1848_slv_scope').GetName]"
1848_hungary_revolution.18.d:0 "An envoy from the National Assembly of [SCOPE.sCountry('1848_slv_scope').GetName] has arrived at our court, and from their message, [SCOPE.sCountry('1848_slv_scope').GetName] has declared its separation from the [SCOPE.sCountry('1848_hun_scope').GetName] government and seeks recognition from us."
1848_hungary_revolution.18.f:0 "The people living within the Kingdom of Hungary, primarily those of [SCOPE.sCulture('slovak_culture').GetName], first made demands, drafting a list of fourteen demands calling for equal status for [SCOPE.sCulture('slovak_culture').GetName] and other nationalities within the Kingdom of Hungary. However, the government in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName], dominated by Greater Magyarism, not only ignored their demands but also arrested the drafters on a large scale.\nIn response, #yellow Štúr, Hurban, Hodža# and other Slovak nationalists established the #variable Slovak National Committee# in Vienna, declaring Slovakia's independence from the [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] government's control. Many Slovak volunteers joined the Habsburg movement against Hungary and formed the Slovak Legion."

1848_hungary_revolution.18.a:0 "We will recognize the government of [SCOPE.sCountry('1848_slv_scope').GetName]."
slovak_uprising_tt1:0 "Tension increases by 30.\nIn case of war breaking out with Hungary, Slovakia will become our autonomous territory."
1848_hungary_revolution.18.b:0 "Let's not provoke the Hungarians."
slovak_uprising_tt2:0 "We will let the Slovaks fend for themselves."
1848_hungary_revolution.19.t:0 "National Assembly of Transylvania Pledges Allegiance to Habsburg"
1848_hungary_revolution.19.d:0 "Our parliament in Transylvania has been overthrown by a local imperial military commander! Now, the newly established National Assembly of Transylvania, led by the [SCOPE.sCulture('romanian_culture').GetName] people, has declared independence from our rule and directly pledged allegiance to Vienna."
1848_hungary_revolution.19.f:0 "At the beginning of the month, the parliament in Transylvania, dominated by Magyar and Saxon elites, approved the merger of Transylvania with Hungary, triggering widespread discontent among the [SCOPE.sCulture('romanian_culture').GetName] people. Imperial military commander #yellow Anton von Puchner# quickly realized this and allowed the [SCOPE.sCulture('romanian_culture').GetName] people to convene the #variable National Assembly of Transylvania# in Brașov, launching a coup d'état to overthrow the Magyar-dominated Transylvanian parliament and take control in the name of the Kaiser.\nHe declared our parliament in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] illegal and called upon all loyal patriots of [SCOPE.sCulture('romanian_culture').GetName] to "fight to the end, everyone for me, me for everyone." The [SCOPE.sCulture('romanian_culture').GetName] #v $peasants$# enthusiastically responded to Puchner's call, and a peasant uprising swept through Transylvania. [concept_magyar] #v $aristocrats$# and government officials were hunted down and slaughtered by groups of #v $peasants$#. In retaliation, Székely and "Defenders of the Homeland" units pursued and massacred #v $peasants$# on a large scale.\nThis bloody conflict left indelible scars on both sides, with hundreds of villages razed, 40,000 killed, and 230 villages reduced to ashes."
1848_hungary_revolution.19.a:0 "Let these rebels taste the stake!"
romania_uprising_tt:0 "Transylvania will seek recognition from the Vienna government."
1848_hungary_revolution.20.t:0 "Messenger from [SCOPE.sCountry('1848_trs_scope').GetName]"
1848_hungary_revolution.20.d:0 "An envoy from the National Assembly of [SCOPE.sCountry('1848_trs_scope').GetName] has arrived at our court, and from their message, [SCOPE.sCountry('1848_slv_scope').GetName] has declared its separation from the [SCOPE.sCountry('1848_hun_scope').GetName] government and seeks recognition from us."
1848_hungary_revolution.20.f:0 "At the beginning of the month, the parliament in Transylvania, dominated by Magyar and Saxon elites, approved the merger of Transylvania with Hungary, triggering widespread discontent among the [SCOPE.sCulture('romanian_culture').GetName] people. Imperial military commander #yellow Anton von Puchner# quickly realized this and allowed the [SCOPE.sCulture('romanian_culture').GetName] people to convene the #variable National Assembly of Transylvania# in Brașov, launching a coup d'état to overthrow the Magyar-dominated Transylvanian parliament and take control in the name of the Kaiser.\nHe declared our parliament in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] illegal and called upon all loyal patriots of [SCOPE.sCulture('romanian_culture').GetName] to "fight to the end, everyone for me, me for everyone." The [SCOPE.sCulture('romanian_culture').GetName] #v $peasants$# enthusiastically responded to Puchner's call, and a peasant uprising swept through Transylvania. [concept_magyar] #v $aristocrats$# and government officials were hunted down and slaughtered by groups of #v $peasants$#. In retaliation, Székely and "Defenders of the Homeland" units pursued and massacred #v $peasants$# on a large scale.\nThis bloody conflict left indelible scars on both sides, with hundreds of villages razed, 40,000 killed, and 230 villages reduced to ashes."
1848_hungary_revolution.20.a:0 "We will recognize the government of [SCOPE.sCountry('1848_trs_scope').GetName]."
romania_uprising_tt1:0 "Tension increases by 30.\nIn case of war breaking out with Hungary, Transylvania will become our autonomous territory."
1848_hungary_revolution.20.b:0 "Let's not provoke the Hungarians."
romania_uprising_tt2:0 "We will let the Romanians fend for themselves."
1848_hungary_revolution.21.t:0 "Emergency Agenda in Parliament: National Issues"
 1848_hungary_revolution.21.d:0 "While we have always insisted on the superior status of [concept_magyar] within the kingdom, now as we seek greater autonomy and confront Vienna's central authority, minorities within our borders have begun to stir, demanding equal status within the kingdom and threatening to turn to Vienna if their demands are not met.\nWe can choose to grant partial or even full citizenship rights to the minority nationalities within the kingdom, but this is likely to enrage the broader Magyar nationalist sentiment; or we can maintain the status quo to avoid division among the ruling class."
1848_hungary_revolution.21.f:0 "Central and Eastern Europe differ significantly from Western Europe in terms of nationalism, which is based on a more exclusive sense of 'ethnic' or 'cultural' identity rooted in shared language, religion, and often a claimed 'blood' or 'racial' affinity. This inherently tends to deny citizenship rights to some people living in specific countries who are not considered part of the dominant ethnicity.\nMoreover, as seen in Hungarian nationalism towards Romanians and Slavs, politically and socially dominant ethnic groups often demand that minorities accept the privileged status of the dominant ethnicity's language and culture."
1848_hungary_revolution.21.a:0 "The historical traditions of the Magyars must not be violated!"
1848_hungary_revolution.21.b:0 "We will grant citizenship to the Slavic people."
hun_slav_tt:0 "Slavic uprisings will no longer occur."
1848_hungary_revolution.21.c:0 "We will grant citizenship to the Romanian people."
hun_rom_tt:0 "Romanian uprisings will no longer occur."
1848_hungary_revolution.21.d:0 "We will grant equal citizenship rights to every nationality within the kingdom!"
hun_all_tt:0 "Uprisings of minority nationalities within the kingdom will no longer occur.\nThis will cause great dissatisfaction among the broader Magyar nationalists."
hungarian_revolution_fail:0 "Our efforts to suppress the Hungarian rebels have failed."


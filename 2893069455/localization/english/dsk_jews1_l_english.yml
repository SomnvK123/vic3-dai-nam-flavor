je_Gibraltar: "Control of Gibraltar"
je_Gibraltar_reason: "Control of the Strait of Gibraltar is crucial for making us a trading powerhouse."
je_spr_Dynastic: "Dynastic Issue"
je_spr_Dynastic_reason: "The Carlists are in rebellion, supporting the grandson of Don Carlos as the king of [SCOPE.GetRootScope.GetCountry.GetName], while the third Don Carlos is plotting a revolution to claim the throne. If we cannot stop the intervention of the reactionary forces in our country, we will be in a state of internal and external crisis, ultimately leading to fragmentation!"
je_Dynastic_inheritance: "Second Carlist War"
je_Dynastic_inheritance_reason: "[SCOPE.GetRootScope.GetCountry.GetName] has experienced several disputes over the succession to the throne. After the death of Ferdinand VII, his young daughter Isabella II inherited the throne, but her uncle Carlos claimed the right to succession. Thirty years ago, we crushed the First Carlist War, but now the third Don Carlos, who covets the Spanish throne, is secretly returning to the country. Do we have the confidence to handle this succession war?"
je_Dynastic_inheritance_goal: "We should prevent the Carlists from seizing the throne!"
je_republic_spa: "First Spanish Republic"
je_republic_spa_reason: "After experiencing civil war, we chose to overthrow the monarchy and establish a democratic republic! But years of internal turmoil and attacks by opponents have left our revolution insecure. We need to complete reforms to the country as quickly as possible and prevent another revolution from erupting."
je_republic_spa_goal: "We have stabilized the republican regime."
je_catalonia_spa: "Catalonia Issue"
je_catalonia_spa_reason: "Since Catalonia suffered a major defeat in the War of Spanish Succession in 1714, Philip V abolished its autonomy, which had been enjoyed since the fifteenth century, and banned the Catalan language, igniting enmity between the people of Catalonia and those of other regions of Spain. After years of conflict and turmoil, their independence movement has been growing. We cannot allow them to break up the country!"
je_catalonia_spa_goal: "Ease tensions with Catalonia."
je_wudi_jiandui: "Invincible Fleet"
je_wudi_jiandui_reason: "Our fleet was once the pride of our nation, but since our defeat in the war with Britain, we have completely lost maritime supremacy. Spain colonized the world through the Invincible Fleet, protecting our trade routes. Now, to regain our position as a world power, a powerful navy is indispensable. Rebuilding the Invincible Fleet is not only a redemption for past humiliations but also a cornerstone for defending our homeland in the future."
je_Spanish_global_empire: "Glory of the Empire"
je_Spanish_global_empire_reason: "The British Empire is the 'Empire where the sun never sets' today, and [SCOPE.GetRootScope.GetCountry.GetName] is bringing the dream back to reality. After 200 years, the empire is once again at the top of the world, with vast colonies and numerous vassal states. Today, we stand on the world stage with a new posture, demonstrating our strength. We can bring Spain's influence to them, or we can annex them and once again become the #yellow #b Spanish Empire#!#!\n #N ¡Viva España! ¡Viva el Imperio Español!#!"
no_mex: "We have annexed Mexico."
no_cub: "We have annexed Cuba."
no_phi: "We have annexed the Philippines."
no_clm: "We have annexed Granada."
je_Iberia_empire: "Proposal for the Iberian United Kingdom"
je_Iberia_empire_reason: "After successfully resolving the internal mess, matters regarding the union of Iberia are on the agenda. We can unite all the countries on the peninsula to form a united kingdom, or we can set aside past fantasies and illusions to become a democratic republic and embrace a new future."
je_Iberia_empire_goal: "Await proposal approval or reject the proposal"
je_peace_iberia: "Peace Proposal"
je_peace_iberia_reason: "To bring Portugal into our fold, we should take a series of measures to promote cooperation and friendship between our two countries while respecting Portugal's unique culture and interests. We can adopt a policy of appeasement, improving relations and sponsoring #green #b Portugal #!#! into our great project of the united kingdom.\n\n#yellow Peace Proposal #! will progress or regress based on the following conditions #tooltippable;tooltip:[Country.GetTooltipTag],je_peace_iberia_pos#!. Progress based on the following conditions #tooltippable;tooltip:[Country.GetTooltipTag],je_peace_iberia1_pos#!."
je_peace_iberia1_pos: "The following conditions will #bold progress #! the peace proposal:\n• Maintaining #green friendly #! relations with Portugal (#green +1#!).\n• Maintaining #green close #! relations with Portugal (#green +2#!)."
je_peace_iberia_pos: "The following conditions will #bold regress #! the peace proposal:\n• Maintaining #yellow indifferent #! relations with Portugal (#red -1#!).\n• Maintaining #yellow aloof #! relations with Portugal (#red -2#!)."
je_peace_iberia_goal: "We have filled the progress bar."
je_war_iberia: "War Proposal"
je_war_iberia_reason: "With peaceful unification no longer an option, only through force can we unite the entire Iberian Peninsula."
je_iberia_empire_ruler: "Great Iberian United Empire"
je_iberia_empire_ruler_reason: "Under the twilight of Iberia, the empire rises again, the eternal glory never fades.\nThe distant seas call to us, igniting dreams of conquering new worlds, sailing towards the unknown, with hope and reunion along the journey.\nFrom the tropical lands of South America to the plateaus of the north, our flag waves in the wind, exchanges of wealth and culture making the world rejoice.\nCountless heroes fought for the empire, leaving behind eternal legends, our hearts full of glory, for we are the descendants of Iberia.\nLet us sing praises, exalting this great nation, [SCOPE.GetRootScope.GetCountry.GetName] never to decline, God bless us."
#####events
dsk_spa.1.t: "End of the First Carlist War"
dsk_spa.1.d: "The Civil War Ends"
dsk_spa.1.f: "During the civil war, the economy, politics, and social life of the country suffered serious damage, causing great human casualties and property losses. Finally, in 1839, the war ended with the victory of Isabella II. This civil war not only determined the issue of the Spanish throne but also laid the foundation for modern Spanish politics, marking the end of the monarchy in Spain and the gradual establishment of the capitalist system."
dsk_spa.1.a: "Long live Isabella II!"

dsk_spa.2.t: "Soldier Defection"
dsk_spa.2.d: "Soldiers defect to the Carlists"
dsk_spa.2.f: "Our soldiers on the frontlines have accepted the benefits offered by the Carlists, choosing to join in the Carlist quest for the throne's revenge. Through propaganda and incitement, the Carlists emphasize the righteousness and historical mission of their quest for the throne's revenge. They have successfully portrayed the civil war as a defense of tradition, homeland, and monarchy, instilling determination and motivation in the soldiers to participate. The Carlists have garnered support from some local nobility and political forces, which also wield influence within the army, making more soldiers inclined to join the Carlists."
dsk_spa.2.a: "This is not good!"

dsk_spa.3.t: "Carlist Advance on Madrid"
dsk_spa.3.d: "More people join the Carlists"
dsk_spa.3.f: "Isabella II and her supporters lean towards liberal reforms, which have caused resentment among some conservative and traditional forces. They fear that liberal reforms may disrupt the traditional social order and their privileged status, so they prefer to support Prince Carlos, hoping he can uphold their interests and traditional values. Intervention by external forces has also prompted more people to support the Carlists. For example, countries like France and Portugal support Prince Carlos, providing support and resources for his expanding influence."
dsk_spa.3.a: "What else can I say!"

dsk_spa.4.t: "People Return to the Loyalists"
dsk_spa.4.d: "More people return to the Isabellists"
dsk_spa.4.f: "The Isabellists promise liberal reforms, including abolishing noble privileges, promoting democracy and social reforms, etc. This manifesto has attracted many oppressed and exploited people, who hope to change the status quo and pursue a more just society by supporting the Isabellists. The Isabellists advocate for social reform and provide educational opportunities, especially for ordinary people and farmers. They promise to improve living conditions in impoverished areas and provide more education and job opportunities, a policy that has gained support from the masses."
dsk_spa.4.a: "Spain is moved!"

dsk_spa.5.t: "Conspiracy for Rebellion"
dsk_spa.5.d: "Valencia Region's Independence Movement Surges"
dsk_spa.5.f: "The Valencia region has a long history and unique cultural traditions. Many Valencians are proud of their culture and identity. During the civil war, some local leaders and people began to call for independence, believing that only independence could better protect the interests and culture of the Valencia region. The political turmoil and instability in Spain have exacerbated dissatisfaction with the central government. Some people in the Valencia region believe that the central government cannot solve local problems and hope to break free from its control through independence."
dsk_spa.5.a: "Damn it!"

dsk_spa.6.t: "Catalonia Uprising"
dsk_spa.6.d: "Catalonia's Independence Movement Surges"
dsk_spa.6.f: "Catalonia has long been pursuing greater autonomy, but during the civil war, the central government's control over Catalonia intensified, leading to dissatisfaction among the Catalan people. Some political groups and individuals began to demand full independence for Catalonia and took protest and resistance actions against the central government. Some external forces also supported Catalonia's independence movement, exacerbating the situation through funding, weapons, and political support."
dsk_spa.6.a: "Damn it!"

dsk_spa.7.t: "End of the Civil War"
dsk_spa.7.d: "The Civil War Ends with Isabella's Son Ascending to the Throne of [SCOPE.GetRootScope.GetCountry.GetName]"
dsk_spa.7.f: "Against the backdrop of the civil war, Isabella's son ascended to the throne of Spain, signaling the beginning of the reconstruction of our country's unity and stability. This move has laid the groundwork for ending the civil war and rebuilding the nation to a certain extent. The new king's ascension signifies a more stable and unified leadership for us, potentially ending the turmoil caused by the civil war. His presence has instilled confidence in the people, and we believe he can lead us towards a future of rebuilding the prosperity and glory of the nation. Long live the king! Long live [SCOPE.GetRootScope.GetCountry.GetName]!"
dsk_spa.7.a: "Long live the king! Long live [SCOPE.GetRootScope.GetCountry.GetName]!"
Alfsonso: "Alfonso"
modifier_Modern_Spain: "Modern Spain"

dsk_spa.8.t: "First Spanish Republic"
dsk_spa.8.d: "Overthrow the monarchy! Long live the Republic!"
dsk_spa.8.f: "At this challenging moment, we call for the establishment of a true republic, where the people become the masters of the nation, achieving democracy, equality, and freedom. The monarchy has brought countless hardships and injustices, symbolizing the tyranny and oppression of the old days. It's time to end this system, where the people's voices are truly heard, and the fate of the nation is in the hands of the people. The republic will bring us new hope and opportunities. In the republic, everyone will enjoy equal rights and opportunities, free from exploitation and oppression by nobles or the royal family. We will establish a democratic government elected by the people, serving the people. The Bourbon dynasty's rule in Spain has ended! Let us unite, work together, overthrow the monarchy, and embrace the birth of the republic! Let us march towards a brighter future with the motto of freedom, equality, and justice! Long live the Republic!"
dsk_spa.8.a: "Long live the Republic! We need intellectuals to rely on!"
dsk_spa.8.b: "Long live the Republic! We need industrialists to rely on!"
modifier_spa_republic: "Favorable to Interest Groups"

dsk_spa.9.t: "Spanish Coup, Exile of Isabella"
dsk_spa.9.d: "Amadeo of Italy ascends to the throne of Spain"
dsk_spa.9.f: "Although a new king has ascended, the scars and problems left by the civil war are not easily healed. Spain still faces challenges such as economic difficulties, political turmoil, and social instability. The divisions and conflicts during the civil war still exist, threatening the unity and stability of the country. The new king faces numerous challenges and must deal with the internal and external crises facing the country. He must work to achieve national reconciliation and unity, promote political, economic, and social reconstruction, and maintain the authority and status of the country. Meanwhile, external influences and pressures also pose additional challenges to Spain. The turbulent international situation may affect Spain's development and stability."
dsk_spa.9.a: "His ascension did not change Spain's dire situation."

dsk_spa.10.t: "Carlos III, Second Carlist War"
dsk_spa.10.d: "Carlos III claims himself as the legitimate heir to the throne"
dsk_spa.10.f: "During the civil war, many regional governments and nationalist organizations strengthened their control over their regions. Nationalists in Catalonia, the Basque Country, and other regions have made statements, seeking independence or greater autonomy in the chaos. The civil war attracted external intervention, with some countries and international organizations supporting Carlos III, while others supported the Isabellists. This has made the civil war more complex and brutal, exacerbating the confrontation and conflict between the parties."
dsk_spa.10.a: "This is pushing the country into the flames of war."
modifier_carlos: "landowners Upper Hand"

dsk_spa.11.t: "New Spanish Republic"
dsk_spa.11.d: "A significant turning point in history"
dsk_spa.11.f: "The establishment of the republic has brought a series of democratic reforms and social changes. Politically, democratic institutions such as universal suffrage, freedom of speech, and constitutional principles have been implemented; socially, progress has been made in protecting labor rights, educational reform, and women's rights. The establishment of the republic marks an important step towards modernization and democratization in Spain. However, it faces challenges from various quarters, including opposition from domestic and foreign forces, economic issues, and regionalist sentiments. How these challenges are addressed will determine the fate of the republic and the direction of Spain's future development."
dsk_spa.11.a: "Favoring the nobility"
dsk_spa.11.b: "The era of nobles is over! It's now the era of the republic!"
modifier_Modern_Spain: "Newborn Republic"

dsk_spa.12.t: "Restoration of the Monarchy"
dsk_spa.12.d: "Amid internal and external turmoil, the monarchy was reinstated in Spain."
dsk_spa.12.f: "Eventually, the First Spanish Republic was brought to an end in 1874. Military officers eager to restore the monarchy overthrew the republic and installed Alfonso XII, the son of Isabella II, as king. After inheriting the throne, Alfonso XII declared his support for the constitution, marking a new political phase for Spain. The restoration of the monarchy meant a return of political control to the royal family in Spain. This change brought about significant political adjustments, with the country being led by a monarch. While the restoration of the monarchy garnered support from some, it also sparked discontent and protests from certain segments of the population. Some democratic and republican factions opposed this change."
dsk_spa.12.a: "After resolving internal affairs, what direction should our future take?"
modifier_finish_carlos: "End of the Carlist Movement"

dsk_spa.13.t: "Catalonia Returns to Spain"
dsk_spa.13.d: "National Unity of Spain"
dsk_spa.13.f: "The Catalonia region has been reintegrated into Spain's unified system, restoring the regional autonomy provided by the Spanish Constitution. Catalonia will enjoy autonomy under the law and participate in decision-making and management of national affairs."
dsk_spa.13.a: "A wise move"
dsk_spa.14.t: "Catalonia Breaks Away from Spain"
dsk_spa.14.d: "This is a Split!"
dsk_spa.14.f: "The uprising and secessionist actions in Catalonia have plunged Spain into a serious crisis. We must take a series of actions immediately!"
dsk_spa.14.a: "I will crush them!"

dsk_spa.15.t: "The Roman Catholic Church Opposes the Spanish Republic"
dsk_spa.15.d: "The Pope sends representatives to Spain for debate"
dsk_spa.15.f: "The Roman Catholic Church has long held significant influence in Spain, closely linked with the monarchy, viewing it as God's will and an essential means of safeguarding faith and social order. Therefore, the establishment of a republic was seen as a challenge to the Church's authority and traditional values. The Church feared that the republic would lead to violations of religious freedom and Church authority, as well as potential religious reforms and secularization tendencies. "
dsk_spa.15.a: "The Pope is right! We must restore the monarchy immediately."
dsk_spa.15.b: "How dare the Pope meddle in our internal affairs?"

dsk_spa.16.t: "The First International Opposes the Spanish Republic"
dsk_spa.16.d: "The First International sends representatives to Spain for debate"
dsk_spa.16.f: "The First International believes that bourgeois democracy inherently serves the interests of the bourgeoisie. Although the republic is ostensibly a democratic system, it may be controlled and influenced by the bourgeoisie in practice, without truly guaranteeing the rights of the working class. Some bourgeoisie may use the republic to maintain their interests and status, including the exploitation and oppression of the working class. In this situation, the First International believes that supporting the republic may indirectly support bourgeois rule."
dsk_spa.16.a: "How dare the First International meddle in our affairs?"
dsk_spa.16.b: "Suppressing the Red Movement is our internal affair."

dsk_spa.17.t: "The Spanish Colonial Empire"
dsk_spa.17.d: "We once had vast colonies spread across the world."
dsk_spa.17.f: "From Mexico to Peru, from Colombia to Chile, we occupied vast territories, exploiting rich resources including gold, silver mines, and agricultural products. These colonies not only brought wealth to the Spanish Empire but also facilitated cultural and commercial exchanges between Europe and the Americas. In Asia, we also established significant colonies, especially in the Philippines and India, which became trade centers for spices, silk, and other valuable commodities. Our African colonies, particularly in Morocco and West Africa, provided labor and raw materials, supporting our economy and military strength."
dsk_spa.17.a: "It's time to rebuild our old empire."

dsk_spa.18.t: "The Greatest Power"
dsk_spa.18.d: "We were once the world's most powerful naval force."
dsk_spa.18.f: "A new fleet is rising along the coast of Spain, carrying countless dreams and hopes, reminiscent of the glorious days of the Spanish Armada. On the flagship of the fleet, the flag flies high, symbolizing the glory and majesty of Spain. The fleet commander stands on the bridge, with a determined gaze, swearing to uphold Spain's maritime traditions and revive the glory of the Armada. This revitalized Armada is the pride and dream of the Spanish people, inheriting the legend of the past Armada and continuing Spain's maritime legend, shining Spain's glory once again in the world's seas."
dsk_spa.18.a: "The Armada rules the seas."

dsk_spa.19.t: "The Second Spanish Republic"
dsk_spa.19.d: "A New Political Era"
dsk_spa.19.f: "Spain has undergone significant political, social, and cultural changes. We are moving towards democracy and freedom, implementing electoral systems and constitutional governance, giving the people more voice and opportunities to participate in politics. We celebrate the beginning of a new life, dreaming of a fairer, more equal, and free Spain."
dsk_spa.19.a: "Freedom, democracy, and justice!"

dsk_spa.20.t: "The Great Spanish Global Empire"
dsk_spa.20.d: "A Rebirth, a Renewal of Vitality"
dsk_spa.20.f: "We have rebuilt our relations with Latin America, establishing more equal and mutually beneficial partnerships with our former colonies. We support their development, share our experiences and resources with them, and together build a stable and prosperous region. We have also showcased our presence and influence in Europe and Africa."
dsk_spa.20.a: "Long live Spain!"

dsk_spa.21.t: "Proposal for the Iberian Union"
dsk_spa.21.d: "A Great Concept"
dsk_spa.21.f: "We can establish sincere and trusting relations with Portugal. Through high-level talks and political dialogue, we can express our sincerity and desire to establish a solid cooperative relationship with the Portuguese government. We want to show the Portuguese people that we are willing to be their friends and allies, moving forward together."
dsk_spa.21.a: "I support the peaceful plan."
dsk_spa.21.b: "I support the war plan."
dsk_spa.21.c: "Choose a historical route and experience the rest of the Spanish story"
dsk_spa.22.t: "The Iberian Union"
dsk_spa.22.d: "A Stronger and More Unified Nation"
dsk_spa.22.f: "Oh, the Iberian Union, land of glory, Spain and Portugal, blood allies. On this sacred land, we have created a brilliant history together. Spain's warriors, Portugal's heroes, hand in hand, heart to heart, conquered the storms together. From the shores of Iberia to the depths of the Atlantic, our legendary story will forever be told."
dsk_spa.22.a: "Long live [SCOPE.GetRootScope.GetCountry.GetName]!"

dsk_spa.23.t: "The Great Iberian Union Empire"
dsk_spa.23.d: "A Nation Where the Sun Never Sets"
dsk_spa.23.f: "A great empire spanning five continents, the world will remember my name above that of the British Empire."
dsk_spa.23.a: "Long live [SCOPE.GetRootScope.GetCountry.GetName]!"

dsk_spa.24.t: "Control of Gibraltar"
dsk_spa.24.d: "Control of Gibraltar is crucial for us to become a trading power."
dsk_spa.24.f: "It is a vital gateway connecting the Mediterranean and the Atlantic. The Strait of Gibraltar has long been used by Atlantic navigators and exploration fleets from Mediterranean coastal countries to reach the Atlantic. Today, the Strait of Gibraltar remains an important passage from the Atlantic to Southern Europe, North Africa, and Western Asia."
dsk_spa.24.a: "Now we are the dominant force in the region!"


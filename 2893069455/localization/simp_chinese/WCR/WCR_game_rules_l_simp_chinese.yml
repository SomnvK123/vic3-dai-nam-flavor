rule_WCR1_JAP_uniforms:                 "#yellow 西式服装#! | $JAP_ADJ$ 西式制服"
setting_WCR1_modded_JAP_uniforms:       "$setting_WCR1_modded_KOR_westernization$"
setting_WCR1_modded_JAP_uniforms_desc:  "$JAP_ADJ$ 制服的风格将根据当前的游戏规则通过西式服装决定。如果 #v $setting_WCR1_enable_influences$#! 规则激活。"
    
    rule_WCR1_westernize_traditionalists:             "#yellow 西式服装#! | 西化传统主义者"

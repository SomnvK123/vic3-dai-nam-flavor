    rule_WCR1_westernize_ig_rural_folk:             "#yellow 西式服装#! | 西化#green @rural_folk!乡村民众#!"
    setting_WCR1_westernize_ig_rural_folk_yes:      "$WCR1_rule_yes$"
    setting_WCR1_westernize_ig_rural_folk_yes_desc: "#v @rural_folk!$ig_rural_folk$#![concept_interest_group]的[concept_leader]#p 将会#!进行西化。"
    setting_WCR1_westernize_ig_rural_folk_no:       "$WCR1_rule_no$"
    setting_WCR1_westernize_ig_rural_folk_no_desc:  "#v @rural_folk!$ig_rural_folk$#![concept_interest_group]的[concept_leader]#n 将不会#!进行西化。$WCR1_AWC_behavior_text$"
    
    rule_WCR1_westernize_ig_devout:             "#yellow 西式服装#! | 西化#blue @devout!虔信者#!"
    setting_WCR1_westernize_ig_devout_yes:      "$WCR1_rule_yes$"
    setting_WCR1_westernize_ig_devout_yes_desc: "#v @devout!$ig_devout$#![concept_interest_group]的[concept_leader]#p 将会#!进行西化。"
    setting_WCR1_westernize_ig_devout_no:       "$WCR1_rule_no$"

    setting_WCR1_westernize_poor_pop_clothing_yes:      "$WCR1_rule_yes$"
    setting_WCR1_westernize_poor_pop_clothing_yes_desc: "#yellow $farmers$#!、#yellow $peasants$#!、#yellow $laborers$#!将会西化#v 他们的整套服装#!。他们也会#v 只戴西式帽子#!。"
    setting_WCR1_westernize_poor_pop_clothing_no:       "$WCR1_rule_no$"
    setting_WCR1_westernize_poor_pop_clothing_no_desc:  "#yellow $farmers$#!、#yellow $peasants$#!、#yellow $laborers$#!将只会西化#v 他们的帽子#!并与#v 他们原来的帽子混用#!。#yellow $machinists$#!将仍然完整进行西化。$WCR1_AWC_behavior_text$"
rule_WCR1_unwesternizeds_type:                  "#yellow 西式服装#! | 未西化的居民与角色行为"
setting_WCR1_unwesternizeds_type_never:         "从不西化"
setting_WCR1_unwesternizeds_type_never_desc:    "如果未西化的 [Concept('concept_pop', '$concept_pops$')] 和 [Concept('concept_character', '$concept_characters$')] 居住在西化的 [Concept('concept_country', '$concept_countries$')] 中，但不属于任何 [concept_primary_cultures]，#n 将永远不会#! 西化。$WCR1_gov_employee_text$"
setting_WCR1_unwesternizeds_type_migrants:      "仅西化移民"
setting_WCR1_unwesternizeds_type_migrants_desc: "如果未西化的 [Concept('concept_pop', '$concept_pops$')] 和 [Concept('concept_character', '$concept_characters$')] 居住在西化的 [concept_country] 中，但不属于任何 [concept_primary_cultures]，#p 将会#! 自动西化。$WCR1_gov_employee_text$"
setting_WCR1_unwesternizeds_type_wealth:        "财富与接受度西化"
setting_WCR1_unwesternizeds_type_wealth_desc:   "在西化的 [Concept('concept_country', '$concept_countries$')] 中，未西化的 [Concept('concept_pop', '$concept_pops$')] #p 将根据他们的 [concept_sol] 和 [Concept('concept_discrimination', '$ACCEPTANCE$')] 西化。未西化的 [Concept('concept_character', '$concept_characters$')] & $WCR1_gov_employee_text$"
setting_WCR1_unwesternizeds_type_always:        "始终西化"
setting_WCR1_unwesternizeds_type_always_desc:   "所有未西化的 [Concept('concept_pop', '$concept_pops$')] 和 [Concept('concept_character', '$concept_characters$')] 居住在西化的 [Concept('concept_country', '$concept_countries$')] 中，#p 将始终#! 西化。"


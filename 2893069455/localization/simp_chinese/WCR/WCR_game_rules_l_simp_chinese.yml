    setting_WCR1_westernize_traditionalists_yes_desc: "如果没有其它东西不让拥有#v $ideology_traditionalist$#![concept_ideology]的[Concept('concept_character', '$concept_characters$')]进行西化，那么他们#p 将会#!进行西化。$WCR1_AWC_behavior_text$"

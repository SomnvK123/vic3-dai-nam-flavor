# The Eastern Question Content
 # The Eastern Question Content
 je_eqfm_main: "东方问题"
 je_eqfm_main_reason: "[SCOPE.GetRootScope.GetCountry.GetName]已经名不副实。受到希腊和塞尔维亚的革命以及埃及起义的影响，苏丹的权威受到了质疑。随着帝国受到《亚德里安堡条约》和《屈塔伊公约》的侮辱，许多人预见到帝国即将瓦解。不过，#bold 高门#!并没有因此罢休，他们妄图重新确立其对巴尔干的控制。与之相对的，巴尔干地区的东正教徒以及各个小国开始密谋革命，反抗苏丹的控制。\n\n一方面，#bold 高门#!为了重新确立对巴尔干的控制并避免自己遭到[Concept('concept_great_power','$concept_great_powers$')]的瓜分不得不进行改革，另一方面，巴尔干半岛各地的东正教臣民开始拿起武器反抗帝国的统治，一场危机在所难免。\n\n#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')] 分离紧张局势#!#!在巴尔干地区预计将在下个月发生#variable [GetGlobalVariable('eqfm_tension_progress_var').GetValue|-=]#!变化，局势主要通过以下因素#tooltippable;tooltip:[Country.GetTooltipTag],eqfm_tension_regress 缓和#! 以及 #tooltippable;tooltip:[Country.GetTooltipTag],eqfm_tension_progress 推进#! 。"
 je_eqfm_fail_tt: "#bold 奥斯曼帝国#!已被逐出巴尔干半岛。"
 je_eqfm_status_1: "当前阶段: #bold #green 风平浪静#! (#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')] [GetGlobalVariable('eqfm_tension_var').GetValue]#!#!)#!."
 je_eqfm_status_2: "当前阶段: #bold #yellow 危机四伏#! (#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')] [GetGlobalVariable('eqfm_tension_var').GetValue]#!#!)#!."
 je_eqfm_status_3: "当前阶段: #bold #red 战争将至#! (#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')] [GetGlobalVariable('eqfm_tension_var').GetValue]#!#!)#!."
 je_eqfm_status_4: "当前阶段: #bold #blue 解决冲突#! (#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')] [GetGlobalVariable('eqfm_tension_var').GetValue]#!#!)#!.\n\n#italic 如果紧张局势升高，我们将面临着鲁梅利亚的大规模起义风险。我们必须找到共存之道。#!"
 je_eqfm_status_5: "当前阶段: #bold #red 危机爆发#!。列强已经公开介入，战争随时可能全面升级。"
 je_eqfm_status_6: "当前阶段: #bold #yellow 列强调停#!。大东方危机已经进入条约与列强分赃阶段。"
 je_eqfm_sub: "东方问题"
 je_eqfm_sub_reason: "[SCOPE.sCountry('ottoman_scope').GetName]已经名不副实。受到希腊和塞尔维亚的革命以及埃及起义的影响，苏丹的权威受到了质疑。随着帝国受到《亚德里安堡条约》和《屈塔伊公约》的侮辱，许多人预见到帝国即将瓦解。随着#bold 高门#!努力重新确立其对巴尔干的控制，巴尔干地区的东正教徒以及各个小国开始密谋革命，反抗苏丹的控制。\n\n一方面，#bold 高门#!为了重新确立对巴尔干的控制并避免自己遭到[Concept('concept_great_power','$concept_great_powers$')]的瓜分不得不进行改革，另一方面，巴尔干半岛各地的东正教臣民开始拿起武器反抗帝国的统治，一场危机在所难免。\n\n#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')] 分离紧张局势#!#!在巴尔干地区预计将在下个月发生#variable [GetGlobalVariable('eqfm_tension_progress_var').GetValue|-=]#!变化，局势主要通过以下因素#tooltippable;tooltip:[Country.GetTooltipTag],eqfm_tension_regress 缓和#! 以及 #tooltippable;tooltip:[Country.GetTooltipTag],eqfm_tension_progress 推进#! 。"

je_eqfm_crisis_main: "大东方危机"
je_eqfm_crisis_main_reason: "奥斯曼帝国陷入了危机。内外交困，高门难以维持对其帝国臣民的控制。随着民族主义席卷全国，该国的非土耳其族群已经开始采取武装起义，目标是建立摆脱奥斯曼影响的政府。\n\n同样，欧洲列强利用帝国的军事和经济停滞来强加自己的意志于苏丹。即使现在，俄罗斯沙皇的宫廷也把目光投向了我们的高加索和多瑙河流域的土地。除非我们能够抵挡欧洲的侵略，否则我们的帝国将不可避免地崩溃。\n\n#red 战争即将来临，我们必须做好准备#!"
je_eqfm_crisis_sub: "大东方危机"
je_eqfm_crisis_sub_reason: "奥斯曼帝国陷入了危机。内外交困，帝国政府难以维持对其帝国臣民的控制。随着民族主义席卷全国，该国的非土耳其族群已经开始采取武装起义，目标是建立摆脱奥斯曼影响的政府。\n\n同样，欧洲列强利用帝国的军事和经济停滞来强加自己的意志于苏丹。即使现在，俄罗斯和奥地利帝国也在挑动奥斯曼的边境，被吸引到近东日益增长的权力真空中。\n\n#red 战争即将来临，我们必须做好准备#!"
je_eqfm_crisis_tt: "俄土战争已经爆发。"
eqfm_crisis_leader_tt: "这将使我们领导巴尔干反抗奥斯曼帝国。"

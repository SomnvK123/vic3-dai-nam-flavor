# tooltips
eqfm_tension_tt: "巴尔干地区的#yellow 分裂紧张局势#!,是对奥斯曼统治的抵抗程度的衡量。如果紧张局势升高得太高，土耳其可能面临巴尔干地区的大规模起义。"
eqfm_tension_regress: "当前紧张局势缓解是由于：\n#variable [GetGlobalVariable('eqfm_greek_loyalists_var').GetValue|-=]#，来自巴尔干地区的[GetCulture('greek').GetName]忠实支持者。\n#variable [GetGlobalVariable('eqfm_serb_loyalists_var').GetValue|-=]#，来自巴尔干地区的[GetCulture('serb').GetName]忠实支持者。\n#variable [GetGlobalVariable('eqfm_bulgarian_loyalists_var').GetValue|-=]#，来自巴尔干地区的[GetCulture('bulgarian').GetName]忠实支持者。\n#variable [GetGlobalVariable('eqfm_bosniak_loyalists_var').GetValue|-=]#，来自巴尔干地区的[GetCulture('bosniak').GetName]忠实支持者。\n#variable [GetGlobalVariable('eqfm_croat_loyalists_var').GetValue|-=]#，来自巴尔干地区的[GetCulture('croat').GetName]忠实支持者。\n#variable [GetGlobalVariable('eqfm_decelerate_var').GetValue|-=]#! 来自他国干涉巴尔干地区"




eqfm_tension_progress: "当前紧张局势加剧是由于：\n#variable [GetGlobalVariable('eqfm_greek_radicals_var').GetValue|-=]#，来自巴尔干地区的[GetCulture('greek').GetName]激进分子。\n#variable [GetGlobalVariable('eqfm_serb_radicals_var').GetValue|-=]#，来自巴尔干地区的[GetCulture('serb').GetName]激进分子。\n#variable [GetGlobalVariable('eqfm_bulgarian_radicals_var').GetValue|-=]#，来自巴尔干地区的[GetCulture('bulgarian').GetName]激进分子。\n#variable [GetGlobalVariable('eqfm_bosniak_radicals_var').GetValue|-=]#，来自巴尔干地区的[GetCulture('bosniak').GetName]激进分子。\n#variable [GetGlobalVariable('eqfm_croat_radicals_var').GetValue|-=]#，来自巴尔干地区的[GetCulture('croat').GetName]激进分子。\n#variable [GetGlobalVariable('eqfm_culture_var').GetValue|-=]#，来自奥斯曼的#yellow 公民权#!政策。\n#variable [GetGlobalVariable('eqfm_religion_var').GetValue|-=]#，来自奥斯曼的#yellow 宗教#!政策。\n#variable [GetGlobalVariable('eqfm_nationalism_var').GetValue|-=]#! 巴尔干地区的民族独立运动。\n#variable [GetGlobalVariable('eqfm_accelerate_var').GetValue|-=]#! 巴尔干地区的外国干涉。"
eqfm_success_tt: "#bold 高门#! 已经稳固了对巴尔干地区的统治。"
eqfm_failure_tt: "#bold 高门#! 已经失去了对巴尔干地区的控制。"

eqfm_pro_turk_tt: "这将使我们支持奥斯曼帝国对巴尔干地区的统治。"
eqfm_anti_turk_tt: "这将使我们反对奥斯曼帝国对巴尔干地区的统治。"

je_eqfm_congress_of_berlin_main_reason: "召开国际会议的想法并非没有先例，但许多人不愿看到对主权的任何侵犯。然而，随着在#yellow 奥斯曼帝国#的躯体上爆发更大的冲突的威胁，大国们已经同意就不涉及解体土耳其领域的和平问题进行协商。"

# scripted buttons
eqfm_anti_turk_button: "反对土耳其利益"
eqfm_anti_turk_button_desc: "奥斯曼帝国在巴尔干地区失去控制是其堕落的自然结果。我们应该利用这个独特的机会。"
eqfm_pro_turk_button: "支持土耳其利益"
eqfm_pro_turk_button_desc: "巴尔干地区中央权力的分崩离析对世界秩序构成威胁。这些未开化的人必须被制服。让我们支持#bold 高门#!。"
eqfm_neutral_button: "采取中立立场"
eqfm_neutral_button_desc: "巴尔干地区充满欺诈和背叛。我们不能再冒险直接参与该地区的事务了。"

eqfm_accelerate: "挑起民族主义紧张局势"
eqfm_accelerate_desc: "巴尔干地区充满了种族紧张局势，因为巴尔干地区的本地人民努力反对奥斯曼对该地区的统治。为了支持我们反对奥斯曼的立场，我们可以投入资源资助这些分裂运动。"
eqfm_decelerate: "缓解民族主义紧张局势"
eqfm_decelerate_desc: "巴尔干地区爆发的冲突对国际秩序和居住在该地区的人民的繁荣构成威胁。如果我们要为奥斯曼提供有意义的支持，我们应该投入资源来缓解这些分裂情绪。"
eqfm_clutch: "减少外交介入"
eqfm_clutch_desc: "我们在巴尔干地区的参与只会让我们面临更大的风险。我们应该在我们陷入更深地区之前减少我们的外交足迹。"

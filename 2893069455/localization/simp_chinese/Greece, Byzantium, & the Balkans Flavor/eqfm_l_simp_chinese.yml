eqfm.140.t: "东方问题暂告段落"
eqfm.140.d: "战争没有摧毁高门，反而迫使巴尔干的反奥斯曼联盟退却。虽然帝国依旧脆弱，但至少在这一代人的时间里，苏丹重新证明了自己仍能维持鲁梅利亚的秩序。"
eqfm.140.f: "火药桶依旧埋在脚下，但这一次，点燃火药的人被反震得满手鲜血。"
eqfm.140.a: "高门仍未倒下。"

eqfm.141.t: "东方问题由列强裁断"
eqfm.141.d: "战争与外交阴谋已经将巴尔干的未来从苏丹手中夺走。哪怕帝国仍然存在，关于鲁梅利亚命运的决定权也已经转移到了列强会议桌上。"
eqfm.141.f: "帝国的边疆不再由军队与行省官员决定，而是由欧洲外交官用地图和钢笔切割。"
eqfm.141.a: "我们已无力独自决定巴尔干的命运。"


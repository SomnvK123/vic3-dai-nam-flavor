l_simp_chinese:
 byzfm.100.t: "君士坦丁堡的十四个区域"
byzfm.100.d: "奥斯曼帝国征服后的几十年里，君士坦丁堡遭受了严重的衰退和人口减少。虽然近一个世纪来这座城市有了显著的增长，但这是以贫民窟向外扩展超出了古老城市中心为代价。拜占庭主义者敦促[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]领导"
byzfm.100.f: ""实际上，这座城市从金门到海岸线的直线长度是14075英尺，宽度6150英尺。" -《君士坦丁堡城市指南》，公元5世纪中叶"
byzfm.100.a: "我们将重建女皇之城。"
byzfm.101.t: "皇宫废墟确认"
byzfm.101.d: "我们工程师们的详细调查终于完成，我们的专家认为重建大皇宫虽然大胆，但是是可能的。目前，只有布库列翁宫作为废墟存在，该地区还有几座奥斯曼建筑。这对国家是一个艰巨的努力。"
byzfm.101.f: ""我们沿着海岸线一路骑马到达布库列翁宫，当他们到达时，宫殿投降了，条件是所有在内的生命都得到了保护。在布库列翁宫里，我们找到了许多逃到城堡的大女士，因为在那里发现了法国国王的姐姐，她曾经是皇后，和匈牙利国王的姐姐，她也曾经是皇后，以及其他许多女士。关于那座宫殿中发现的财宝，我无法说得很清楚，因为那里的东西太多了，不计其数。" -杰弗里·维勒阿杜安，1204年，在波尼法斯·德·蒙费拉特夺取宫殿后"
byzfm.101.a: "一切为了拜占庭的荣耀。"
byzfm.102.t: "君士坦丁堡大皇宫"
byzfm.102.d: "君士坦丁堡大皇宫曾是东罗马或拜占庭皇帝的主要皇宫住所，直到1081年，是超过690年的皇家行政中心。重建的东罗马帝国之座再次俯瞰君士坦丁堡，唤起了君士坦丁和查士丁尼时代的遗产。"
byzfm.102.f: ""在帝国或者也许世界上，没有其他地方像它一样如此奢华地滴着金子，或者以如此宏伟的财富展示出来。在巨大的金色宝座后面，有用锤炼的黄金和银材料制成的树木，配有嵌宝石的机械鸟，一触摇杆便会开始歌唱。树木的底座上缠绕着黄金狮子和狮鹫，每个扶手旁边都有威胁性地盯着的黄金狮子和狮鹫，看起来好像随时可以跳起来一样。""
byzfm.102.a: "一切为了拜占庭的荣耀。"
byzfm.102.tt: "您现在可以通过重建 #bold 马场！# 扩展重建。"
byzfm.103.t: "君士坦丁堡马场"
byzfm.103.d: "经过数月的精心工作，马场已经重建完成。有了新的赛道、新的看台和重新装饰的中心分隔带，现在已经为人们准备好了。"
byzfm.103.f: "在罗马皇帝的时代，君士坦丁堡的马场曾经为大众举办过宏伟的马车比赛。虽然距离最后一场真正的马车比赛已经过去了一千多年，但是有了恢复的赛道、中心分隔带和座位，可能可以恢复这一古老传统。"
byzfm.103.a: "打开大门！"
byzfm.103.tt: "您现在可以做出决定，重启战车赛。"
byzfm.104.t: "君士坦丁堡城市指南"
byzfm.104.d: "我们多年来的努力和工业化使君士坦丁堡从一个固守于封建时代的城市转变为东方的一个焕然一新的大都市。真正没有其他城市比希腊世界的中心更配得上“女皇之城”的称号。"
byzfm.104.f: "几个世纪以来，君士坦丁堡一直是东方基督教的摇篮。现在，重建的城市已成为宣告新帝国诞生的灯塔。"
byzfm.104.a: "拜占庭万岁。"


byzfm.110.t: "赛事中的一日"
byzfm.110.d: "在夏日阳光下，伟大的赛马派系在巨大的赛马场起跑线上排列整齐。马戏场挤满了观众，掌声和责骂声此起彼伏。枪声响起时，战车飞驰在赛道上，每个队伍都鼓励着他们的马前进。最终，#红色 Reds# 获得了胜利。"
byzfm.110.f: "\"随着马匹一圈又一圈地转动，人群欢呼，大地震颤。仿佛女皇城市本身已经复活一般。\""
byzfm.110.a: "这是一场伟大的拜占庭传统展示。"
byzfm.111.t: "赛事中的一日"
byzfm.111.d: "在夏日阳光下，伟大的赛马派系在巨大的赛马场起跑线上排列整齐。马戏场挤满了观众，掌声和责骂声此起彼伏。枪声响起时，战车飞驰在赛道上，每个队伍都鼓励着他们的马前进。最终，#白色 Whites# 获得了胜利。"
byzfm.111.f: "\"随着马匹一圈又一圈地转动，人群欢呼，大地震颤。仿佛女皇城市本身已经复活一般。\""
byzfm.111.a: "这是一场伟大的拜占庭传统展示。"

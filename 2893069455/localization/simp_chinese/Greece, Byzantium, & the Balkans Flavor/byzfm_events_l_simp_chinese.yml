byzfm.112.d: "在夏日阳光下，伟大的赛马派系在巨大的赛马场起跑线上排列整齐。马戏场挤满了观众，掌声和责骂声此起彼伏。枪声响起时，战车飞驰在赛道上，每个队伍都鼓励着他们的马前进。最终，#绿色 Greens# 获得了胜利。"
byzfm.112.f: "\"随着马匹一圈又一圈地转动，人群欢呼，大地震颤。仿佛女皇城市本身已经复活一般。\""
byzfm.112.a: "这是一场伟大的拜占庭传统展示。"
byzfm.113.t: "赛事中的一日"
byzfm.113.d: "在夏日阳光下，伟大的赛马派系在巨大的赛马场起跑线上排列整齐。马戏场挤满了观众，掌声和责骂声此起彼伏。枪声响起时，战车飞驰在赛道上，每个队伍都鼓励着他们的马前进。最终，#蓝色 Blues# 获得了胜利。"
byzfm.113.f: "\"随着马匹一圈又一圈地转动，人群欢呼，大地震颤。仿佛女皇城市本身已经复活一般。\""
byzfm.113.a: "这是一场伟大的拜占庭传统展示。"
byzfm.114.t: "赛事中的一日"
byzfm.114.d: "在夏日阳光下，伟大的赛马派系在巨大的赛马场起跑线上排列整齐。马戏场挤满了观众，掌声和责骂声此起彼伏。枪声响起时，战车飞驰在赛道上，每个队伍都鼓励着他们的马前进。最终，#紫色 Purples# 获得了胜利。"
byzfm.114.f: "\"随着马匹一圈又一圈地转动，人群欢呼，大地震颤。仿佛女皇城市本身已经复活一般。\""
byzfm.114.a: "这是一场伟大的拜占庭传统展示。"
byzfm.115.t: "赛事中的一日"

byzfm.115.d: "在盛夏的阳光下，伟大的赛马派系们在伟大的赛马场的起跑线上排队。马戏场挤满了观众，他们的欢呼声和责备声将整个场地点亮。枪声响起时，战车飞驰在赛道上，每个队伍都鼓励着他们的马前进。最终，金色战队获得了胜利。"
byzfm.115.f: "\"当马匹一个接一个地转弯时，人群咆哮，大地震颤。仿佛城市女王本身已经活了过来一样。\""
byzfm.115.a: "多么伟大的拜占庭传统的展示。"
byzfm.116.t: "赛事中的一日 - Diversum"
byzfm.116.d: "在盛夏的阳光下，伟大的赛马派系们在伟大的赛马场的起跑线上排队。马戏场挤满了观众，他们的欢呼声和责备声将整个场地点亮。枪声响起时，战车飞驰在赛道上，每个队伍都鼓励着他们的马前进。最终，在这一天的比赛结束后，没有任何一支队伍能够宣称胜利。人群呼吁进行一场决胜局。"
byzfm.116.f: "\"当马匹一个接一个地转弯时，人群咆哮，大地震颤。仿佛城市女王本身已经活了过来一样。\""
byzfm.116.a: "我们将安排重赛。"
byzfm.116.b: "我们承认平局。"
 byzfm.117.t: "体育骚乱"
byzfm.117.d: "在今年的战车比赛中，两支对立的球迷之间的斗殴导致了赛马场的混乱局面。"
byzfm.117.f: "在炎炎夏日的阳光下，当各队为四年一度的比赛排队时，一股邪恶的气氛笼罩了整个赛马场。当各队撤退准备最后的比赛时，观众之间发生了争斗。在城市警察赶来恢复秩序之时，一场骚乱已经发展成了威胁蔓延至街头的局面。"
byzfm.117.a: "疏散旁观者。"
byzfm.117.b: "逮捕这些狂热分子。"
byzfm.118.t: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]试图参加比赛"
byzfm.118.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]受到了今年比赛的启发，试图参加比赛。"
byzfm.118.f: "虽然对于大众来说确实是一种伟大的娱乐，但对于国家最高领导人来说，这可能有点...不太合适。"
byzfm.118.a: "听起来像是一个运动的主意！"
byzfm.118.b: "这对于有教养的人来说几乎是不可接受的。"
byzfm.119.t: "战车队作弊被抓"
byzfm.119.d: "由[SCOPE.gsInterestGroup('cheater_ig_scope').GetName]支持的战车队被抓到试图操纵今年的比赛。"
byzfm.119.f: "一次审计揭示了令人难以置信的腐败程度，从贿赂到对赛车设备的明显破坏。一些消息来源暗示赛道本身可能是恶作剧的目标。"
byzfm.119.a: "取消比赛并展开调查。"
byzfm.119.b: "让他们比赛，技术将战胜背信弃义。"
byzfm.121.t: "战车赛重新建立"
byzfm.121.d: "根据皇家诏令，古老的战车赛制度将重新建立。按照四年一次的时间表，这些比赛将向女王城市的公民和游客开放。"
byzfm.121.f: "经过训练和选拔，已经组建了四支队伍:  #red Reds#!、#white Whites#!、#green Greens#!和#blue Blues#! - 每支队伍都以古罗马的战车队命名。"
byzfm.121.a: "让战车出发！"
byzfm.122.t: "扩大战车赛"
byzfm.122.d: "在皇帝的一纸命令下，战车比赛扩展了两支队伍。"
byzfm.122.f: "两支新队伍决定重建#gold Golds#!和#purple Purples#!，这是后来的罗马战车队。"
byzfm.122.a: "荣耀归于拜占庭！"
byzfm.123.t: "内燃机进驻赛马场！"
byzfm.123.d: "今天，人群涌向赛马场，见证了史无前例的一幕:  \n在汽车引擎的震耳欲聋声中，人们目睹了几位汽车爱好者在马戏场上飞驰，他们的司机们拼命地紧抓着车辆，跳过赛道上的压实土壤表面。赛车手将他们的车辆装饰得色彩鲜艳，并印上了明亮的标志和符号，这似乎是试图将这场比赛变成一场机动化的战车比赛的等效。"
byzfm.123.f: "尽管缺乏组织计划，这些流氓已经开始参与非正式的运动，如飞车赛和拉力比赛。一些旁观者甚至建议将这些运动正式化，最理想主义者甚至建议使用从汽油驱动的割草机改造的较小车辆来参加比赛。然而，精英阶层谴责这种危险的活动，并对损坏古老马戏场的风险表示失望。"
byzfm.123.a: "我们应该让这成为常规活动！"
byzfm.123.b: "在他们伤害到人之前，逮捕这些疯子！"
byzfm.300.t: "凤凰涅槃"
byzfm.300.d: "教堂的钟声鸣响，人们欢呼雀跃，因为[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]宣布了[ROOT.GetCountry.GetName]的重生。在[SCOPE.sBuilding('hagia_sofia_scope').GetName]的雄伟庇护下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]被装扮成了东罗马帝国皇帝的旧徽章和富丽堂皇的服饰。走向一群公民、政要和神职人员，[ROOT.GetCountry.GetRuler.GetFirstName]成为了希腊人民未来的象征。"
byzfm.300.f: "几个世纪以来，自罗马和君士坦丁堡的损失以来，无数次的尝试失败了，如今帝国在今天已经复兴。然而，还有许多工作要做:  许多希腊人受到异端和异教徒的统治，以前的罗马土地仍然在外国假扮者的掌控之下，无数的拜占庭宝藏被扣为人质。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须确保达到[ROOT.GetCountry.GetRuler.GetHerHis]臣民的期望，如果[ROOT.GetCountry.GetRuler.GetSheHe]要为[ROOT.GetCountry.GetName]带来荣耀的话。"
byzfm.300.a: "从灰烬中崛起。"
byzfm.301.t: "拜占庭的恢复"
byzfm.301.d: "我们的努力已经取得了成果，[ROOT.GetCountry.GetName]的重生已经到来。现在，一些声音呼吁将[ROOT.GetCountry.GetAdjectiveNoFormatting]的力量和声望恢复到希腊人手中，将以前的拜占庭领土归还给希腊人。决定[ROOT.GetCountry.GetAdjectiveNoFormatting]国家未来的责任落在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的肩上。"
byzfm.301.f: "\"希腊王国不是整个希腊；它只是其中的一部分:  希腊最小、最贫穷的一部分。希腊人不仅指的是生活在王国内的人，也指生活在伊奥阿尼纳、萨洛尼卡、塞雷斯、安德里亚诺波利、君士坦丁堡、特拉比松德、克里特、萨摩斯或任何其他属于希腊历史或希腊种族的地区的人... 希腊人有两个伟大的中心。雅典是王国的首都。君士坦丁堡是伟大的首都，是所有希腊人的梦想和希望。\"-伊·科莱蒂斯，1844"
byzfm.301.a: "我们将恢复[ROOT.GetCountry.GetName]的荣耀。"
byzfm.301.b: "我们将限制在小亚细亚。"
byzfm.301.c: "我们将限制在巴尔干地区。"
 byzfm.302.t: "新罗马君士坦丁堡"
byzfm.302.d: "随着小亚细亚和巴尔干地区牢牢掌握在我们手中，帝国的古老核心已经重新夺回！"
byzfm.302.f: "将近一千年前，巴西莱奥斯·伊萨克一世·科姆宁诺斯雄伟地领导帝国进入了一个焕发力量和荣耀的时代。随着古老的核心地区重新夺回，东罗马帝国的核心已经恢复，正统教会的主教席也得以恢复。"
byzfm.302.a: "向巴西莱奥斯致敬！向拜占庭致荣耀！"
byzfm.303.t: "东方之罗马"
byzfm.303.d: "希腊人的古老核心地区现在掌握在我们手中。[ROOT.GetCountry.GetAdjectiveNoFormatting]宫廷中的重要声音呼吁将埃及和黎凡特，曾经是基督教堡垒的地区，归还给帝国的领土。"
byzfm.303.f: "两千多年来，希腊文化统治着东地中海。今天，古老的希腊城市已经成为废墟，基督教堡垒在穆斯林的统治下凋零。"
byzfm.303.a: "我们将夺回东方帝国。"
byzfm.303.b: "我们已经夺回了希腊的核心地区。这已经足够了。"
byzfm.304.t:0 "罗马帝国"
byzfm.304.d: "随着东方帝国在我们的掌握之中，我们的人民展望着我们边界之外的土地，这些土地被假冒者和异教徒占据。政客和煽动者都呼吁[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]领导[ROOT.GetCountry.GetName]进入这个新时代。"
byzfm.304.f: "\"再次，随着岁月的流逝，再次他们将属于我们。\"\n-希腊民族主义诗"
byzfm.304.a: "我们将夺回永恒之城。"
byzfm.304.b: "我们必须关注我们的公民。"
byzfm.305.t: "紫凤凰"
byzfm.305.d: "[ROOT.GetCountry.GetName]内部的意大利主义运动继续蓬勃发展，引导政治家呼吁重新发起一系列运动，夺回罗马帝国失去的土地。"
byzfm.305.f: "在罗马国家恢复之后，我们的人民已经开始关注东罗马帝国在查士丁尼时代曾经控制的土地。"
byzfm.305.a: "我们将恢复古罗马的遗产。"
byzfm.305.b: "这些野心只是一厢情愿。"
byzfm.306.t: "罗马帝国的重生"
byzfm.306.d: "随着帝国军队行进到永恒之城，我们恢复罗马帝国的梦想已经成为现实。这是一千多年来首次，永恒之城、五教总教汇的首座，已经重新回到帝国的怀抱。从博斯普鲁斯海峡的海岸到强大的底比斯河畔，古罗马的土地已经在一面旗帜下重新统一。"
byzfm.306.f: "罗马城是欧洲最伟大帝国之一的首都。几个世纪以来，它一直在朗巴第人和高卢人的假扮者手中苟延残喘。今天，帝国的皇冠明珠和中心之心已经从野蛮的群众手中夺回！向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]致敬！向[ROOT.GetCountry.GetName]致荣耀！"
 byzfm.306.a: "罗马将再次辉煌！"
byzfm.306.b: "君士坦丁堡是新罗马！"
byzfm.310.t: "君王之王"
byzfm.310.d: "随着巴瓦洛克拉西的推翻，[ROOT.GetCountry.GetName]免于了西方君主制的干涉。在由牧首[SCOPE.sCharacter('devout_leader_scope').GetFullName]主持的庄严仪式上，[SCOPE.sCharacter('byzfm_ruler_scope').GetFullName]被加冕为巴西莱奥斯。身披拜占庭权威的重建装束，帝王如星辉般耀眼，准备领导希腊帝国走向未来。"
byzfm.310.f: "纵观历史，从18世纪的希腊计划到19世纪的大希腊理念，学者们一直设想着希腊掌舵重生东方的基督教帝国。有一位本土希腊人坐上了王位，这个梦想离现实更近了一步。"
byzfm.310.a: "荣耀归于拜占庭！"
byzfm.311.t: "一个希腊帝王"
byzfm.311.d: "随着希腊的崛起，知识分子和农民都开始质疑我们国家是否应该由西方安装的伪帝统治。"
byzfm.311.f: "自从摩雷防线、特拉布宗和塞堤温诺斯最后的拜占庭残余被土耳其军队击溃以来，希腊人民就再也没有拥有过一个本土的希腊统治者。虽然许多希腊人会担任行政官员，但从来没有人会称为统治者。"
byzfm.311.1: "帕拉奥洛戈斯王朝应夺回[ROOT.GetCountry.GetAdjective]王位。"
byzfm.311.1.tt: "帕拉奥洛戈斯王朝的后裔将登上王位。"
byzfm.311.2: "科姆宁诺斯王朝是[ROOT.GetCountry.GetAdjective]王位最安全的选择。"
byzfm.311.2.tt: "科姆宁诺斯王朝的后裔将登上王位。"
byzfm.311.3: "安吉洛斯王朝应该重返[ROOT.GetCountry.GetAdjective]王位。"
byzfm.311.3.tt: "安吉洛斯王朝的后裔将登上王位。"
byzfm.311.4: "[ROOT.GetCountry.GetAdjective]王位属于杜卡斯王朝。"
byzfm.311.4.tt: "杜卡斯王朝的后裔将登上王位。"
byzfm.311.5: "[ROOT.GetCountry.GetRuler.GetLastName]王朝已经赢得了王位的权利。"

byzfm.320.t: "[SCOPE.sState('theodoro_capital').GetCityHubName]条约"
byzfm.320.d: "[SCOPE.sCountry('theodoro_scope')]经过快速协商，同意加入希腊国家。"
byzfm.320.f: "曾经是奥斯曼扩张的阻碍者，特奥多罗的土地最终落入鞑靼人的手中。今天，我们欢迎他们作为[ROOT.GetCountry.GetName]的公民回归。"
byzfm.320.a: "“一个最令人满意的解决方案。”"
byzfm.321.t: "[SCOPE.sState('trabzon_capital').GetCityHubName]条约"
byzfm.321.d: "[SCOPE.sCountry('trabzon_scope')]经过快速协商，同意加入希腊国家。"
byzfm.321.f: "特拉比松幸存了君士坦丁堡的陷落，但很快又受到了奥斯曼人的压迫。今天，他们作为公民重新加入[ROOT.GetCountry.GetName]。"
byzfm.321.a: "“一个最令人满意的解决方案。”"
byzfm.330.t: "达尔马提亚重夺"
byzfm.330.d: "几个世纪以来，希腊军队第一次沿着亚得里亚海东岸行军。"
byzfm.330.f: "在被哥特人和后来的斯拉夫人夺走之前，达尔马提亚作为伊利里亚省，是罗马和希腊罗马帝国之间的重要联系。"
byzfm.330.a: "帝国荣耀。"
byzfm.331.t: "伦巴第重夺"
byzfm.331.d: "当我们的士兵行走在阿尔卑斯山的阴影下，北意大利重新回到了帝国的控制之下。"
byzfm.331.f: "尽管作为抵挡野蛮北方的屏障，正是通过阿尔卑斯山，一千年前，隆巴底人涌入意大利，用自己的野蛮传统取代了罗马的法律制度。"
byzfm.331.a: "帝国荣耀。"
byzfm.332.t: "大希腊重夺"
byzfm.332.d: "从爱奥尼亚海岸到加里利亚诺河岸，意大利南部已经重新回到帝国的怀抱中。"
byzfm.332.f: "在古代，南意大利被大量希腊人殖民。这些希腊人与当地的拉丁人民交融，赋予了半岛南部独特的风味，并使新兴的罗马共和国接触到希腊文化。"
byzfm.332.a: "帝国荣耀。"
byzfm.333.t: "拉文纳埃克萨基重新夺回"
byzfm.333.d: "从波河流域到亚平宁山脉的山坡，意大利中部已经处于我们的控制之下。"
byzfm.333.f: "中部意大利是罗马扩张的摇篮，拉丁人在萨比尼人、翁布里亚人和伊特鲁里亚人居住的土地上扩张。"
byzfm.333.a: "帝国荣耀。"
 # Croatia-Slovenia Events
 balkfm.900.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting]崛起"
balkfm.900.d: "经过无数代人民对[SCOPE.sCountry('austria_scope').GetAdjective]和[SCOPE.sCountry('ottoman_scope').GetAdjective]的统治的斗争，[ROOT.GetCountry.GetName]终于宣告独立。无论是支持南斯拉夫主义还是走自己的路，[ROOT.GetCountry.GetAdjectiveNoFormatting]的人民终于可以期待属于自己的未来。"

balkfm.900.a: "[ROOT.GetCountry.GetName]将找到自己的道路。"

balkfm.980.t: "三一王国的梦想"
balkfm.980.d: "随着[ROOT.GetCountry.GetName]的独立，一种领土要求的愿望开始在我们的公民中蔓延，即将所有原三一王国的人民纳入一个国家之下。"
balkfm.980.f: "我们抛弃了几个世纪的帝国统治，使[ROOT.GetCountry.GetName]成为现实。然而这还不够。我们国家的许多同胞仍然生活在外国统治的压迫之下，渴望拥有一个属于自己的国家。"
balkfm.980.a: "我们不能让同胞继续受苦。"

balkfm.981.t: "三一王国的恢复"
balkfm.981.d: "随着三一王国领土的解放，重建[ROOT.GetCountry.GetName]的梦想已经成真。我们的公民现在期待国家引领他们走向一个新时代。"
balkfm.981.f: "新的一天开始了，一个新的国家崛起到世界舞台。[ROOT.GetCountry.GetAdjectiveNoFormatting]的辉煌是不可避免的未来。"
balkfm.981.a: "我们将高举[ROOT.GetCountry.GetAdjective]的旗帜！"
balkfm.521.t: "索菲亚的一位外国人"
balkfm.521.d: "[ROOT.GetCountry.GetRuler.GetFullName]无疑是[ROOT.GetCountry.GetName]的一个奇怪选择。这位年轻的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]在维也纳长大，并被培养成德国贵族的一员，对他即将统治的国家知之甚少。在他父亲的要求下，一群家庭教师陪同他，帮助他学习[GetCulture('bulgarian').GetName]语言。"
balkfm.521.f: "“他用法语与母亲和外交官交谈；用德语与兄弟和仆人交谈；用匈牙利语咒骂，并用英语和意大利语吹嘘。” - D. Gancheff，王子的家庭教师，1887年"
balkfm.521.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]应该说人民的语言。"
balkfm.521.b: "粗俗的语言有损[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的尊严。"

balkfm.522.t: "军事和解"
balkfm.522.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]已被前[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的叛乱领导人接触。为了寻求赦免，他们宣布放弃对#yellow Battenburg#家族的任何支持，并宣誓效忠于[ROOT.GetCountry.GetRuler.GetLastName]家族。"
balkfm.522.f: "自从[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]来到[ROOT.GetCountry.GetName]后，他一直被担心#yellow Battenburg#家族复辟的恐惧所困扰。"
balkfm.522.a: "给予他们赦免，我们需要他们的力量。"
balkfm.522.b: "我们不能信任这些叛变者。"

balkfm.523.t: "军事不足"
balkfm.523.d: "尽管从奥斯曼管理中独立，[ROOT.GetCountry.GetName]的军队本质上还是奥斯曼军队。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]提出了一些旨在使保加利亚军队现代化的改革。"
balkfm.523.f: "“不幸的是，我缺乏武器和弹药。如果真的有必要，我们可以动员13万人，但其中约8万人甚至没有部分武装。此刻谁能给我武器？我的成功，建立一个稳定、和平的保加利亚，是解决东方问题的关键……” - 费迪南王子，致鲁道夫王储，1887年"
 balkfm.523.a: "我们应该投资军队。"
balkfm.523.b: "他们可以用现有的资源应付。"

balkfm.524.t: "合法化国王"
balkfm.524.d: "随着[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]坐上王位，政治家[SCOPE.sCharacter('stambolov_scope').GetFullName]越来越担心如何确保#yellow 众议院#! [ROOT.GetRuler.GetLastName]的合法性。"

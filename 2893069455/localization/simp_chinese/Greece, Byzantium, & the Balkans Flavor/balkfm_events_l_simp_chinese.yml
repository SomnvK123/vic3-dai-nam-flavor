l_simp_chinese:
balkfm.080.t: "与黑山的小规模冲突"
balkfm.080.d: "来自 #yellow 贝斯#!于#yellow 鲁梅利亚#发来通讯：我方先锋部队已与小国[SCOPE.sCountry('montenegro_scope').GetName]的军队爆发多起冲突。尽管黑山无力撼动我们在巴尔干的统治地位，却始终是阻碍——数个世纪以来，他们屡次挫败我们向[ROOT.GetCountry.GetName]扩张的尝试。"
balkfm.080.f: "黑山虽国力薄弱、发展滞后且与西方隔绝，但分隔其与欧洲腹地的地形，也成了隔绝我们影响力渗透的天然屏障。"
balkfm.080.a: "这群异教徒真是令人棘手。"

balkfm.081.t: "阿里·帕夏的阴谋"
balkfm.081.d: "黑塞哥维那总督 [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow 帕夏#![SCOPE.sCharacter('ali_pasha_scope').GetLastName] 势力突飞猛进，已引发多位帕夏忧虑。坊间传言，他正图谋在鲁梅利亚打造专属自己的权力根基。"
balkfm.081.f: "帝国各地的帕夏虽名义上效忠于苏丹，却常暗中削弱中央权威，以此谋求更显赫的职位与更大的话语权。"
balkfm.081.a: "即刻铲除这个跳梁小丑！"
balkfm.081.b: "此事需从长计议，不可贸然行动。"
balkfm.081.tt1: "必将对[SCOPE.sCharacter('ali_pasha_scope').GetFullName]采取处置措施。"
balkfm.081.tt2: "[SCOPE.sCharacter('ali_pasha_scope').GetFullName]此人，恐将成为日后隐患..."

balkfm.082.t: "阿里·帕夏的崛起"
balkfm.082.d: "[SCOPE.sCountry('hersek_scope').GetRuler.GetFullName]发起的反[ROOT.GetCountry.GetName]叛乱已然得手，更夺走了苏丹在巴尔干的部分领土。"
balkfm.082.f: "对帝国权威的公然挑衅绝不可姑息！我们必须重振苏丹的威严，否则百姓心中恐将滋生自立分裂之心。"
balkfm.082.a: "这种叛乱行径，绝不容忍！"

balkfm.083.t: "罗马尼亚统一宣言"
balkfm.083.d: "[SCOPE.sCountry('romania_unifier').GetName] 公然以「罗马尼亚统一者」自居，正寻求联合该地区其他罗马尼亚公国，建立统一政权。"
balkfm.083.f: "\"我们乃本民族的真正代言者，是这片承载悠久历史土地的正统继承者。实现统一这一神圣愿景，必能赢得后世传颂；任何国家若敢阻挠——这片土地本就属于我们，是我们命运所系之地，我们绝不退让！\""
balkfm.083.a: "我们认可并欢迎这一联盟，将恪守与[SCOPE.sCountry('romania_unifier').GetName]的既有协议。"
balkfm.083.b: "此等分裂言论毫无根据！必须严正谴责[SCOPE.sCountry('romania_unifier').GetName]的僭越行为。"

balkfm.084.t: "南比萨拉比亚的归还诉求"
balkfm.084.d: "在某大国暗中支持下，[SCOPE.sCountry('romanian_bessarabia_receiver').GetName]正式提出诉求：希望获得领土[SCOPE.sState('south_bessarabia_cession').GetName]——这片曾由摩尔多瓦管辖的土地，是其获取黑海出海口的关键。使者称，若我方应允，罗马尼亚必将对帝国心怀感激。"
balkfm.084.f: "\"一个没有海洋的国家，何谈长远发展？卡胡尔的沃土、波尔格拉德的商路、伊斯梅尔的港口，必将为我们的繁荣与子孙福祉奠定根基。\""
balkfm.084.a: "放弃[SCOPE.sState('south_bessarabia_cession').GetName]，未必是件坏事。"
balkfm.084.b: "[SCOPE.sState('south_bessarabia_cession').GetName]乃我帝国神圣不可分割的领土，绝无退让之理！"

balkfm.099.t: "大测试事件"
balkfm.099.d: "大测试事件描述文本"
balkfm.099.f: "大测试事件情景文本"
balkfm.099.a: "大测试选项1"
balkfm.099.b: "大测试选项2"

balkfm.200.t: "伊利里亚情怀"
balkfm.200.d: "随着巴尔干地区对帝国主义大国的紧张局势升级，#yellow 伊利里亚运动#!的理想开始在南斯拉夫人民中传播！这一运动源于几位 [GetCulture('croat').GetName] 学者的著作，逐渐发展成为一场旨在解放所有斯拉夫人、摆脱奥地利与奥斯曼统治的运动！"
balkfm.200.f: "我们的目标并非废除各个民族的具体名称，而是要将它们统一在一个通用名称之下！因为每个具体名称都承载着独特的历史，而这些历史的汇聚，共同构成了伊利里亚民族更广阔、更普遍的历史！"
balkfm.200.a: "这是巴尔干地区的崇高计划！"
balkfm.200.b: "[ROOT.GetCountry.GetName] 必须放在首位！"

balkfm.201.t: "南斯拉夫主义"
balkfm.201.d: "一份塞尔维亚民族主义文件的发布，在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的宫廷中引起轰动！该文件作者#yellow 伊加·加拉沙宁#! 将其命名为“草案”，其中制定了巴尔干地区斯拉夫人结盟的外交计划！"
balkfm.201.f: "加拉沙宁大量借鉴波兰外交官 #yellow 亚当·耶日·查托里斯基 (Adam Jerzy Czartoryski)#!的著作，提出了南斯拉夫联盟的构想！受从西方传入的民族主义思潮启发，他将自己的理念浓缩成一份名为“Načertanije”的计划，也就是人们所说的“草案”！"
balkfm.201.a: "这是对巴尔干地区的崇高计划！"
balkfm.201.b: "[ROOT.GetCountry.GetName] 必须放在首位！"

balkfm.202.t: "“草案”"
balkfm.202.d: "在与 [ROOT.GetCountry.GetRuler.GetLastName] 亲王的会晤中，民族主义政治家[SCOPE.sCharacter('garasanin_scope').GetFullName]向亲王及其宫廷提出了一项雄心勃勃的构想：通过与当前处于奥斯曼统治下的南斯拉夫人结盟，恢复塞尔维亚帝国的荣光！加拉沙宁大量借鉴波兰外交官 #yellow 亚当·耶日·查托里斯基 (Adam Jerzy Czartoryski)#!的著作，提出了南斯拉夫联盟的理念！受从西方传入的民族主义思潮启发，他将自己的想法浓缩成一份名为“Načertanije”的计划，即“草案”！"
balkfm.202.f: "\"……我的儿子，[SCOPE.sCharacter('garasanin_scope').GetFirstName]，长期以来渴望得到任用，并希望获得一个他早已准备就绪的职位，只要您决定授予他这份荣誉！\" - M. 加拉沙宁，致亲王米洛什，1833年"
balkfm.202.a: "这是对巴尔干地区的崇高计划！"
balkfm.202.b: "[ROOT.GetCountry.GetName] 必须放在首位！"

balkfm.203.t: "南斯拉夫分裂者寻求联盟！"
balkfm.203.d: "[SCOPE.sCountry('balkfm_union_scope').GetName]大胆宣称脱离此前的统治者！在一份极具争议的宣言中，[SCOPE.sCountry('balkfm_union_scope').GetRuler.GetName]宣布其国家寻求与 [ROOT.GetCountry.GetName] 建立政治联盟！"
balkfm.203.f: "未等任何大国批准，[SCOPE.sCountry('balkfm_union_scope').GetAdjectiveNoFormatting] 国民大会已正式宣布，将自身并入[ROOT.GetCountry.GetAdjectiveNoFormatting]国家！"
balkfm.203.a: "我们欢迎我们的斯拉夫兄弟！"
balkfm.203.b: "现在不是时候！"

balkfm.204.t: "[SCOPE.sState('yugoslav_state_scope').GetName]的南斯拉夫起义！"
balkfm.204.d: "占位符"
balkfm.204.f: "占位符"
balkfm.204.a: "占位符"
balkfm.204.b: "占位符"

balkfm.205.t: "海外的南斯拉夫骚乱！"
balkfm.205.d: "在我方支持下，[SCOPE.sState('balkfm_agitation_state_scope').GetName]的南斯拉夫激进分子已开始在全国范围内组织民众示威，力求推动南斯拉夫主义事业向前发展！"
balkfm.205.f: "\"至少有500万人说着同一种语言，但他们按宗教信仰可分为三个群体……其中仅有300万人自称为塞族，而其他人绝不会接受这个称号！\" - 武克·卡拉季奇，1849年"
balkfm.205.a: "我们将永不停止，直到所有斯拉夫人都获得自由！"

balkfm.206.t: "反对[ROOT.GetCountry.GetAdjective]统治的南斯拉夫骚乱！"
balkfm.206.d: "南斯拉夫#!#!激进分子在[SCOPE.sState('balkfm_agitation_state_scope').GetName] 引发了全国性示威活动！他们要求所有斯拉夫人在[ROOT.GetCountry.GetName]境内享有平等权利！"
balkfm.206.f: "\"无论他们走到哪里，血腥的轨迹都紧随其后；只要他们的统治范围所及，文明便会从视野中消失！他们所到之处，皆以武力统治为纲，与法治治理背道而驰！对于这种生活的指引，他们秉持着无情的宿命论：而所谓的来世奖赏，不过是感官层面的天堂幻象！\" - E. 格莱斯顿，1876年"
balkfm.206.a: "忘恩负义的异教徒！"

balkfm.207.t: "南斯拉夫的吞并"
balkfm.207.d: "在激烈的政治谈判中，未征得大国同意，[SCOPE.sCountry('balkfm_yugoslav_annex_scope').GetName] 正式宣布与 [ROOT.GetCountry.GetName] 结盟！"
balkfm.207.f: "谈判进展出乎意料地顺利，我们对两国此次联盟充满乐观！然而，反对者仍在不断警告，巴尔干地区面临进一步动荡的风险！"
balkfm.207.a: "我们欢迎我们的 #yellow #tooltip:[GetRawTextTooltipTag('balkfm_yug_cultures_tt')] 南斯拉夫#!#! 兄弟！"
balkfm.207.b: "现在不是时候，耐心终将得到回报！"

balkfm.208.t: "南斯拉夫主义破灭"
balkfm.208.d: "随着南斯拉夫主义最后的抵抗者溃败，南斯拉夫人建立统一国家的梦想彻底破灭！"
balkfm.208.f: "\"嘿，斯拉夫人，我们祖先的精神依旧鲜活\n民族的心脏在其子孙的胸膛中跳动！\n斯拉夫精神永不消亡，将永远存续！\""
balkfm.208.a: "确实是个可怕的日子！"

balkfm.209.t: "南斯拉夫的诞生"
balkfm.209.d: "挣脱奥斯曼与奥地利帝国的枷锁，巴尔干地区的斯拉夫人民终于统一，建立起一个全新的国家！"
balkfm.209.f: "自由！不仅是摆脱枷锁的自由，更是真正意义上的自由！不再被夹在铁锤与铁砧之间，不再处于猎狗与猎人的夹缝中，如今正是新联盟诞生的时刻！斯拉夫人之间的新约定，已为所有人所见！"
balkfm.209.a: "一个辉煌的联盟！"





balkfm.300.t: "封建的残留"
balkfm.300.d: "数个世纪以来，[ROOT.GetCountry.GetName] 主教公国成功抵制住了[SCOPE.sCountry('ottoman_scope').GetName]在巴尔干地区的扩张浪潮！受西方自由主义思潮启发，年轻的主教公[ROOT.GetCountry.GetRuler.GetFullName]正致力于将黑山（蒙特內格羅）州从封建模式中解放出来！"
balkfm.300.f: "尽管黑山州幸免于土耳其（奥斯曼）对巴尔干的统治，却是个贫困、文盲充斥且秩序混乱的国家！作为旧时代的遗留产物，这里的税收缺乏规范、司法由地方领主把持，中央权威几乎形同虚设！与此同时，邻近的黑塞哥维纳州与斯库台州总督们，正虎视眈眈地盯着黑山的土地——黑山州作为独立政体的时日，恐怕已所剩无几！"
balkfm.300.a: "[ROOT.GetCountry.GetName]将走出属于自己的道路！"

balkfm.301.t: "现代的光芒"
balkfm.301.d: "在对抗数个世纪的封建惯性后，[ROOT.GetCountry.GetName]终于开始挣脱封建遗产的束缚！"
balkfm.301.f: "尽管遭到保守派领袖的抵制，主教公国仍迈出了迈向现代时代的第一步！前路虽仍有诸多挑战，但通过这些开创性的社会改革，人们或许已能畅想：一个囊括所有在黑山阴影下生活的黑山人的「黑山世界」，正逐步成型！"
balkfm.301.a: "[ROOT.GetCountry.GetName]唯有在此基础上成长！"

balkfm.302.t: "中央集权的管理"
balkfm.302.d: "主教公的努力终见成效，国家首个具备现代国家雏形的行政机构正式诞生！"
balkfm.302.f: "通过从教会手中接管初创的国家机构控制权，主教公已着手将[ROOT.GetCountry.GetName]拉入现代文明的行列！"
balkfm.302.a: "做得好！"

balkfm.303.t: "寻找恩人"
balkfm.303.d: "经沙皇[SCOPE.sCountry('russia_scope').GetRuler.GetLastName]批准，主教公[ROOT.GetCountry.GetRuler.GetFirstName] 已对[SCOPE.sCountry('russia_scope').GetName] 展开国事访问，期望为黑山州争取更多援助！然而，在往返奥地利与俄罗斯宫廷的旅程中，他却遭到了沙皇及其朝臣的冷淡对待！"
balkfm.303.f: "随着土耳其军队逼近黑山，主教公走到哪里都饱受质疑——无论是途经奥地利时，还是抵达俄罗斯宫廷后！他被指责存在「非僧侣」行为，而在渴望未来摆脱奥斯曼封建统治的南斯拉夫人面前，封建体制下的奥地利与俄罗斯帝国之间，已然出现裂痕！"
balkfm.303.a: "我们无法独自生存！"

balkfm.304.t: "专业的军队"
balkfm.304.d: "在主教公的推动下，军队已从一支几乎算不上军队的部落武装，改组为能充分彰显国家权威的正规力量！"
balkfm.304.f: "尽管这对土耳其（奥斯曼）维系巴尔干统治的困局难以产生实质影响，但至少，我们或许能借此避开他们的怒火！"
balkfm.304.a: "好消息！"

balkfm.305.t: "无法治愈的疾病"

balkfm.306.t: "主教辞世"
balkfm.306.d: "[ROOT.GetCountry.GetName]遭遇悲剧！主教 [ROOT.GetCountry.GetRuler.GetFirstName]在其卧房内被发现身亡，最终还是病魔夺去了他的生命！全国参议院随即在 [SCOPE.sCharacter('danilo_scope').GetFirstName] 与他的兄弟 #yellow Pero Tomov#! 之间陷入分裂，所幸达尼洛（[SCOPE.sCharacter('danilo_scope').GetFirstName]）得到民众支持，成功掌控国家权力！"
balkfm.306.f: "尽管与父亲一样精力充沛，但主教[SCOPE.sCharacter('danilo_scope').GetLastName]尚显年轻且缺乏经验！不过，他与父亲怀揣着同样的渴望——推动黑山实现世俗统治！"
balkfm.306.a: "悲恸时刻！"

balkfm.310.t: "蒙特内哥罗公国"

balkfm.310.d: "从 [SCOPE.sCountry('russia_scope').GetName] 归来的 [ROOT.GetCountry.GetRuler.GetFirstName] 不仅带回了统治黑山的命令，还得到了沙皇的祝福，成为[ROOT.GetCountry.GetName]的亲王。"

balkfm.310.f: "俄罗斯法院的这一举动，作为东正教民族的保护者，正式使蒙特内哥罗获得了其第一位世俗统治者，正式将国家行政与教会分离。"

balkfm.310.a: "这对于[ROOT.GetCountry.GetName]是个美好的日子。"

balkfm.330.t: "格拉霍沃之战"

balkfm.330.d: "黑塞哥维纳的奥斯曼总督 [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow 帕夏#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName] 在斯库塔尔的总督 [SCOPE.sCharacter('osman_skopljak_scope').GetFirstName] #yellow 帕夏#! [SCOPE.sCharacter('osman_skopljak_scope').GetLastName] 的帮助下，袭击了格拉霍沃边境村庄。尽管当地民兵英勇抵抗，该村庄被洗劫一空，许多平民被 [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow 阿加#! [SCOPE.sCharacter('smail_aga_scope').GetLastName] 的命令处死。由于北部边界划定不清，政治领导人担心奥斯曼的进一步侵犯即将发生。"

balkfm.330.f: ""在格拉霍沃宽阔而宽敞的平原上，\n彼得洛维奇的九名男子倒毙，\n被居伊吉奇阿加熠熠生辉的剑所屠戮，\n成为蒙特内哥罗领主的耻辱。"\n-关于格拉霍沃暴行的流行诗，1830年代"

balkfm.330.a: "我们必须要求赔偿。"

balkfm.331.t: "胡马茨的谈判"

balkfm.331.d: "黑塞哥维纳的奥斯曼总督 [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow 帕夏#! 发现他对 [ROOT.GetCountry.GetName] 的设计受阻于 #yellow Vladika#! [ROOT.GetCountry.GetRuler.GetFirstName] 顽固地拒绝放弃保卫乡村。在避免升级冲突的压力下，两人同意进行会谈。"

balkfm.331.f: "提出了以下条款: \n 1. 被迫离开格拉霍沃的居民可以返回。\n 2. #yellow Jakov Daković#! 将成为格拉霍沃的领主。\n 3. 格拉霍沃将继续向苏丹支付税款。\n 4. 格拉霍沃的所有防御工事将被放弃。\n 5. 土耳其人和蒙特内哥罗人之间将有"永恒的和平"。\n 6. 波斯尼亚的梅赫梅德帕夏和 [ROOT.GetCountry.GetRuler.GetLastName] 将遵守此协议。"

balkfm.331.a: "我们不能冒险激化局势。"

balkfm.331.b: "[SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow 帕夏#! 是不可信任的。"

balkfm.331.tt: "#red 这是一个糟糕的主意。#!"

balkfm.332.t: "黑暗中的匕首"

balkfm.332.d: "#yellow 主教#! [ROOT.GetCountry.GetRuler.GetLastName] 发现自己陷入了僵局。今早，一封密封的信件从 [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow 帕夏#! 处送达，其中，帕夏邀请主教加入一个阴谋，暗杀波斯尼亚领主 [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow 阿加#! [SCOPE.sCharacter('smail_aga_scope').GetLastName]，即格拉霍沃大屠杀的罪行之一。"

balkfm.332.f: "阿里帕夏和其他贝伊们发现斯梅伊勒-阿加的崛起威胁到他们作为总督的地位。在得到[SCOPE.sCountry('serbia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('serbia_scope').GetRuler.GetLastName]证实其担忧后，阿里开始在该地区寻找盟友。考虑到斯梅伊勒-阿加在格拉霍沃沦为奥斯曼手后一系列大屠杀的声名狼藉，阴谋者们希望[ROOT.GetCountry.GetRuler.GetLastName]能够支持他们的计划。"

balkfm.332.a: "我们将为格拉霍沃复仇。"

balkfm.332.b: "这不是我们的伙伴。"
balkfm.333.t: "当地的合作者"

balkfm.333.d: "经过几周的考虑，顾问建议招募一名当地人来执行这一行动，以避免牵涉到主教。他们选择了 [SCOPE.sCharacter('novica_cerovic_scope').GetFullName]，一名当地的vojvoda。"

balkfm.333.f: "斯梅伊勒-阿加的儿子，拉斯特姆-贝格，招致了仍然受到奥斯曼统治的蒙特内哥林人的仇恨。以其酗酒和对其领土内非穆斯林妇女的肆意虐待而闻名，部落最初请求主教的许可，以暗杀他。作为图西纳的居民，和蒙特内哥林的许多村民一样，塞罗维奇对斯梅伊勒-阿加在格拉霍沃肆虐的暴行心怀怨恨。他和他的同胞毫不犹豫地接受了这项任务，条件是他们得到离开处理拉斯特姆-贝格的许可。"

balkfm.333.a: "他似乎是一个合适的人选。"

balkfm.334.t: "斯梅伊勒-阿加的终结"

balkfm.334.d: "在[ROOT.GetCountry.GetRuler.GetLastName]的祝福下，当地的vojvoda，诺维察·塞罗维奇，通过拒绝缴纳贡品，激怒了 [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow 阿加#!。在前往实施正义的途中，奥斯曼领主被该地区的几名部落成员袭击。在斩首了这位贵族后，主教收到了他的头颅作为行动的证明。"

balkfm.334.f: "通过授权杀死斯梅伊勒-阿加，部落成员为对目前无保护的拉斯特姆-贝格进行复仇铺平了道路。同样，这次看似部落式的谋杀解除了主教的任何直接责任。"

balkfm.334.a: "出色。我们将奖励塞罗维奇。"

balkfm.335.t: "意外的后果"

balkfm.335.d: "斯梅伊勒-阿加的"突然"被杀并未没有得到回应。[SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow 帕夏#! 公开谴责了这起谋杀，并开始在边境展开惩罚行动。[ROOT.GetCountry.GetName] 再次陷入困境。随着战争威胁再次升级，[SCOPE.sCountry('russia_scope').GetName] 和 [SCOPE.sCountry('austria_scope')] 要求立即停止敌对行动。"

balkfm.335.f: "阿里帕夏已经利用了斯梅伊勒-阿加谋杀引起的动荡。由于阴谋仍然未为人所知，主教在不暴露阴谋性质的情况下选择有限。"

balkfm.335.a: "呼吁谈判。"

balkfm.335.b: "揭露阴谋。"

balkfm.336.t: "奸诈的外交"

balkfm.336.d: "在大国的请求下， #yellow 主教#! [ROOT.GetCountry.GetRuler.GetFullName] 和 [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow 帕夏#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName] 之间已经谈判达成了和平。然而，帕夏并没有犹豫，借此机会嘲笑蒙特内哥林人民。"

balkfm.336.f: "'我主他玩弄我们为愚人！'\n这种情绪在蒙特内哥林的法庭上回荡，因为消息传来，谈判结束后发生的事件。阿里帕夏，在他的外交胜利中变得傲慢，突然打开了一袋金币，将几枚硬币抛撒在地板上。在随后的争夺中，我们代表团的一些成员投身地板，尽可能多地为自己收集硬币。这一令人尴尬的场面暴露了蒙特内哥林相对于巴尔干其他地区的极度贫困。"

balkfm.336.a: "永远不要相信帕夏。"

balkfm.337.t: "斯梅伊勒-阿加的傲慢"
balkfm.337.d: "因为对 [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow 阿加#! 威胁的掉以轻心，我们已经使自己面临着一个更大的威胁。在他的傲慢中，[SCOPE.sCharacter('smail_aga_scope').GetLastName] 掌握了奥斯曼黑山的指挥权，并自封为 #yellow 帕夏#!。邻国的帕夏 [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] 和 [SCOPE.sCharacter('osman_skopljak_scope').GetFirstName] 保持沉默，等待温室的指示。"

balkfm.337.f: "[SCOPE.sCountry('ottoman_scope').GetName]" 的高度分散性有助于其在广阔的土地上行使控制。然而，个别的帕夏，特别是曾经有影响力的，会根据他们的需求与或违抗温室的指示。"

balkfm.337.a: "出兵！"
 balkfm.337.b: "不是时候"
 balkfm.337.c: "另选他日！"
balkfm.338.t: "阿里帕夏之死"

balkfm.338.d: "主教 [ROOT.GetCountry.GetRuler.GetFirstName] 今天早上收到一封信，通知说 #yellow 阿里帕夏#! 几天前被处决。在追求自己的野心时招惹了苏丹之后，温室派遣了备受推崇的 [SCOPE.sCharacter('omar_pasha_scope').GetFirstName]#yellow 帕夏#! [SCOPE.sCharacter('omar_pasha_scope').GetLastName] 从 #o Military Frontier#! 赶来，以恢复该地区的中央权威。"

balkfm.338.f: "一个直率而忠诚的人， #yellow 厄梅尔·帕夏·吕特菲#! 已经证明了自己是一位善于在巴尔干地区处理火药桶的能干指挥官。致力于服务温室，厄梅尔·帕夏在奥斯曼贵族的利益与苏丹的利益不一致时，以为其带来正义而闻名。"

balkfm.338.a: "他活该，但这位新人物怎么样呢？"
 balkfm.338.b: "These lands are not worth our time."
 balkfm.338.c: "Perhaps we should have taken action..."
balkfm.340.t: "蒙特内哥林的土地"
balkfm.340.t: "蒙特内哥林的土地"
balkfm.340.d: "随着 [ROOT.GetCountry.GetName] 的民族主义崛起，人们已经开始发表他们渴望与生活在奥斯曼和奥地利统治下的蒙特内哥林同胞联合的愿望。"

balkfm.340.f: "千年来，我们的人民一直在Lovcen山的阴影下耕种土地。作为一个农业民族，我们的祖先继承了罗马人在他们之前管理的同样的农田和牧场。"
balkfm.340.a: "此地即我土。"
balkfm.341.t: "奥斯曼帕夏袭击！"
balkfm.341.d: "[ROOT.GetCountry.GetName] 方才从阿里帕夏的愤怒中恢复过来，然而首都却传来消息， #yellow 奥斯曼帕夏#! [SCOPE.sCharacter('osman_skopljak_scope').GetLastName] 已经率领他的军队越过我们的南部边界，试图在我们的代价上扩展他的领地。"
balkfm.341.f: "#yellow 奥斯曼帕夏#! 希望趁我们处于劣势时发动攻击。更糟糕的消息是，边境附近的酋长们已经放弃我们，以换取小麦供应和其他补贴。"
balkfm.341.a: "守住边境！"
balkfm.342.t: "国际冷漠"
balkfm.342.d: "尽管呼吁武装干预，无论是 [SCOPE.sCountry('russia_scope').GetName] 还是 [SCOPE.sCountry('austria_scope')] 在 #yellow 奥斯曼帕夏#! 问题上都保持了沉默。事实上，他们要求我们避免在该地区采取侵略行动，以免引发更大的冲突。"
balkfm.342.f: "历史注记: \"不忠诚的奥尔比恩\" 这个短语适用于所有大国，而不仅仅是英国。奥地利和俄罗斯将多次重申对蒙特内哥支持的立场，希望在巴尔干地区占据一席之地，但每当新的边境冲突威胁升级为公开战争时，他们就会撤回他们的支持。"
balkfm.342.a: "我们将确保边境安全。"
balkfm.342.b: "我们这些所谓的捍卫者有何用处？"
balkfm.342.tt: "#red 这是个糟糕的主意。#!"
balkfm.343.t: "厄梅尔帕夏出击！"
balkfm.343.d: "忠于他的声望， #yellow 厄梅尔帕夏#! [SCOPE.sCharacter('omar_pasha_scope').GetLastName] 已经对我们的边境发动了初步攻击，以显示他对在 [ROOT.GetCountry.GetName] 上主张奥斯曼至高无上的意图。"
balkfm.343.f: "与以前那些以个人为中心试图统治蒙特内哥的企图不同，厄梅尔帕夏展示了他征服蒙特内哥的协调意图，以展示奥斯曼国家的强大。"
balkfm.343.a: "出兵！"
balkfm.344.t: "险些"
balkfm.344.d: "[ROOT.GetCountry.GetFirstName] 今早听到这个消息后松了口气:  #yellow 厄梅尔帕夏#! [SCOPE.sCharacter('omar_pasha_scope').GetLastName] 已经被召回，离开了他在波斯尼亚的指挥职务，以应对 #yellow 奥斯曼帕夏#! 在温室的其他危机。"
balkfm.344.f: "历史注记: 从蒙特内哥的角度来看，厄梅尔帕夏在1853年被从波斯尼亚的指挥职务上召回，以参加克里米亚战争。在那里，他表现出色，给予俄罗斯重大打击，并越过多瑙河，使两国在其他大国的斡旋下坐到了谈判桌旁。"
balkfm.344.a: "多亏了。"
balkfm.380.t: "黑山"
balkfm.380.d: "随着[ROOT.GetCountry.GetName]民族主义的崛起，人民已经开始表达他们与生活在奥斯曼和奥地利统治下的黑山同胞联合的愿望。"
balkfm.380.f: "千年来，我们的人民在洛夫岑山的阴影下耕种土地。作为一个农耕民族，我们的祖先继承了罗马人之前管理的同样的农田和牧场。"
balkfm.380.a: "这些是我们的土地。"

balkfm.381.t: "黑山的土地"
balkfm.381.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] 在坚定的领导和黑山人民的顽强精神的支持下，已经将我们所有的土地纳入[ROOT.GetCountry.GetName]的控制之下。"
balkfm.381.f: "尽管经历了几个世纪的入侵和帝国主义设计，黑山人民像他们的国家一样坚定不移。"
balkfm.381.a: "我们永远不会放弃我们的自由。"

 balkfm.390.t: "圣佩塔尔的著作"
 balkfm.390.d: "#yellow 主教#! [ROOT.GetCountry.GetRuler.GetLastName] 追随他父亲的文学足迹。在年轻时受到 #yellow 西马·米卢蒂诺维奇# 的教育，他在17岁开始写作。在塞尔维亚民间传统的熏陶下，年轻的主教展现了对塞尔维亚史诗诗体的天赋技巧。"
 balkfm.390.f: "在即将登基之前，佩塔尔出版了 #o 一个石匠的声音#!、#o 对抗土耳其之怒#! 和 #o 塞尔维亚之镜#!，这一切都巩固了他作为黑山之子文学奠基人之一的地位。即使到现在，他的文学创作量仍在不断增加，与他在进行国家改革方面的热情相匹敌。"
 balkfm.390.a: "鼓舞人心。"
 balkfm.391.t: "哲学主教"
 balkfm.391.d: "#yellow 主教#! [ROOT.GetCountry.GetRuler.GetLastName] 被誉为巴尔干地区的国家 [ROOT.GetCountry.GetName] 身份的奠基人。通过编纂和传播他的民族主义著作，他努力在黑山之子中慢慢传播一种共同性意识。"
 balkfm.391.f: "这位哲学主教并非是第一个用塞尔维亚文学形式写史诗的人，但他在向普通人传播他的作品方面胜过其他所有人。每一次他的笔触，哲学主教都捕捉到了 [ROOT.GetCountry.GetName] 存在斗争的生动精神。"
 balkfm.391.a: "宏伟壮丽。"
 balkfm.392.t: "文学作品完成"
 balkfm.392.d1: "经过数月的努力， #yellow 主教#! [ROOT.GetRuler.GetLastName] 完成了他的作品，#o微观世界的光芒#!。这是一部庞大的史诗诗歌，带领读者穿越创世之旅。深受弥尔顿《失乐园》的传统影响，这首诗通过神学的视角解释了人类的命运和未来。"
 balkfm.392.d2: "经过数月的努力， #yellow 主教#! 完成了他的作品， #o 山之花环#!。以黑山史诗诗歌的风格撰写，这部作品是对黑山的呼吁，拒绝伊斯兰化。主教依靠民间传统和智慧，呼吁更大范围的觉醒和黑山塞尔维亚人的统一。"
 balkfm.392.d3: "经过数月的努力， #yellow 主教#! 完成了他的作品， #o 假沙皇小斯特凡#!。讽刺而挖苦，这部作品受到了小斯特凡·马里的生活启发，他通过捏造自己是俄罗斯沙皇彼得三世的废储身份而夺取了黑山王位。"
 balkfm.392.d4: "经过数月的努力， #yellow 主教#! 完成了他的作品， #o 塞尔维亚之镜#!。这部作品以塞尔维亚民间故事为结构，聚焦南斯拉夫人对奥斯曼帝国世代扩张的英勇事迹。"
 balkfm.392.f: "\"我们认为他在这首诗中的所有思想并非都与东正教教义完全一致，比如亚当的先前存在作为一个伟大和领导的天使，但诗歌就是诗歌。诗人的特权在于他有自由为公认的事实增添他的想象力，给予它更多的生命和色彩。Negosh对创造的宇宙的巨大视野，高度，深度，宽度和长度的看法非常引人注目。它让读者想起了帕洛马尔山的巨型望远镜，以及现代天文学的发现。没有望远镜能够胜过一位伟大诗人的灵魂和想象力。\"-C. 曼宁，1953"
 balkfm.392.a: "宏伟的作品。"
 balkfm.400.t: "米列塔的叛乱"
 balkfm.400.d: "在战争英雄 #米列塔#! 几乎发动的一场叛乱后，[ROOT.GetCountry.GetRuler.GetFirstName]王子同意对其权力进行限制。然而，在外国的压力下，王子废除了Sretenje宪法。王子现在正在等待国民议会制定一部新宪法。"
 balkfm.400.f: "像巴尔干地区的许多地方一样，[ROOT.GetCountry.GetName] 既是农村又是杂乱无章的，依赖于大国的支持。自从从[SCOPE.sCountry('ottoman_scope').GetName]获得了事实上的独立以来，塞尔维亚国家一直在皇室派和立宪派之间的政治争斗中分裂。\n\n王子，[ROOT.GetCountry.GetRuler.GetFullName]，通过专制主义要求社会改革，但发现自己受到了支持[SCOPE.sCharacter('kaykay_scope').GetFullName]的人的反对，他们要求对王位的权力进行限制。[ROOT.GetCountry.GetRuler.GetLastName]王子可能是一位战争英雄，但他对专制统治的要求使他与人民疏远。"
 balkfm.400.a: "[ROOT.GetCountry.GetName] 将找到自己的道路。"
 balkfm.401.t: "强制实施宪法"
 balkfm.401.d: "#yellow王子#! [ROOT.GetCountry.GetRuler.GetLastName] 不愿召开国民议会起草宪法，并对提交给奥斯曼帝国和大国的文件感到愤怒。在国民议会和外国代表的压力下，王子签署了这份被称为"土耳其宪法"的文件，并离开了国家，在这个过程中退位。新王子，[SCOPE.sCharacter('milan_scope').GetFullName]，虽然身体虚弱且奄奄一息，但将很快继位。"
 balkfm.401.f: "\"当这块石头从萨瓦河升起时，你将再次回到塞尔维亚！\" -T.V. Perišić 至米洛什王子，1839年"
 balkfm.401.a: "[ROOT.GetCountry.GetName] 中没有专制主义的空间。"
 balkfm.401.tt: "#yellow米洛什王子#! 退位。"
 balkfm.402.t: "一个缺乏经验的统治者"
 balkfm.402.d: "随着米洛什王子的退位，他的儿子 [ROOT.GetCountry.GetRuler.GetFullName] 名义上继位。在登基时患上了消耗病，他勉强在四周内存活，然后不得不放弃生命。他的兄弟，[SCOPE.sCharacter('milhailo_scope').GetFullName] 被选为新国王。年轻且在政治上缺乏经验，他发现自己完全受制于国家参议院，该参议院着眼于进一步削弱王室权威。"
 balkfm.402.f: "这位年轻的王子似乎已经决定走上他父亲的道路。尽管他的父亲被流放，他却推动重返专制主义，却不知道他正在削弱自己微薄的政治支持。利用他的政治经验不足，卡拉焦尔杰维奇王室的支持者已经开始对抗这位王子，试图将奥布伦诺维奇王室赶下台。"
 balkfm.402.a: "他必须学会。"
 balkfm.403.t: "稳固的授权"
 balkfm.403.d: "尽管深深困扰 #o 参议院#! 的深刻分歧， #yellow 王朝#! [ROOT.GetCountry.GetRuler.GetLastName] 已经巩固了他们作为[ROOT.GetCountry.GetName]合法统治者的地位。通过继承法案的通过，塞尔维亚国家终于将有一个世袭君主。"
 balkfm.403.f: ""
 balkfm.403.a: "为 [ROOT.GetCountry.GetRuler.GetLastName]家族欢呼！"
  balkfm.403.tt1: "#yellow 王子米尔海洛#! 让位."
balkfm.339.t: "阿里·帕夏之死"
balkfm.339.d: "[ROOT.GetCountry.GetRuler.GetFirstName]主教今天早上收到一封信，信中告知#yellow 阿里·帕夏#!几天前已被处决。由于其野心与苏丹发生冲突后，奥斯曼帝国政府派遣了声名显赫的[SCOPE.sCharacter('omar_pasha_scope').GetFirstName]#yellow 帕夏#![SCOPE.sCharacter('omar_pasha_scope').GetLastName]（来自#o 军事边疆#!）来恢复该地区的中央集权。"
balkfm.339.f: "奥默·帕夏·吕特菲是一个直率且忠诚的人，他已经证明自己是一位能够在巴尔干半岛这个火药桶地区游刃有余的指挥官。奥默·帕夏致力于服务奥斯曼帝国政府，每当奥斯曼贵族的利益与苏丹的利益不一致时，他就会为苏丹伸张正义，因此赢得了声誉。"
balkfm.339.a: "他死得其所，但这位新人物又会如何呢？"
balkfm.403.tt2: "#yellow 卡拉乔尔杰维奇家族#!登上王位。"
je_balkfm_ser_defenders: "宪法的捍卫者"
je_balkfm_ser_defenders_reason: "决心在[ROOT.GetCountry.GetName]对王权施加实质性的限制。"
je_balkfm_ser_defenders_tt1: "建立了官僚基础"
je_balkfm_ser_defenders_tt2: "实施了民法典"
je_balkfm_ser_defenders_tt3: "改革了我们的经济"
je_balkfm_ser_statism: "国家权威"
je_balkfm_ser_statism_reason: "[ROOT.GetCountry.GetName]从奥斯曼统治下崛起，国家机器几乎无法称之为一个。捍卫者已对[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]施加了实施改革的任务，以确保[ROOT.GetCountry.GetAdjectiveNoFormatting]国家的正确治理。"
je_balkfm_ser_civics: "公民法典"
je_balkfm_ser_civics_reason: "[ROOT.GetCountry.GetName]是一个农村国家，有时甚至是激进的。捍卫者要求[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]推进努力，将[ROOT.GetCountry.GetAdjectiveNoFormatting]人民从他们的农村站点提升起来。"
je_balkfm_ser_economics: "过时的经济"
je_balkfm_ser_economics_reason: "[ROOT.GetCountry.GetName]已与欧洲其他地区隔绝了几代人。为了实现现代化，捍卫者已推动改革，以加速[ROOT.GetCountry.GetAdjective]与欧洲市场的融合。"

je_balkfm_ser_serbian_heartlands: "塞尔维亚的心脏"
je_balkfm_ser_serbian_heartlands_reason: "[ROOT.GetCountry.GetName]仅仅作为自己的影子存在。只要我们的人民大多数仍在外国帝国的控制下，我们的国家就没有未来。"
je_balkfm_ser_greater_serbia: "大塞尔维亚"
je_balkfm_ser_greater_serbia_reason: ""#yellow草案 #!" 代表了塞尔维亚统一的宏伟理想。由民族主义者#yellow 伊利亚·加拉沙宁#!起草并提交给王子的计划，呼吁解放生活在"旧塞尔维亚"土地上的所有塞尔维亚人，并将他们重新组织成一个复兴的塞尔维亚帝国。虽然有人认为这意味着与整个巴尔干地区的南斯拉夫人联合，但许多学者和政治家认为，只有[ROOT.GetCountry.GetName]应在巴尔干地区占据首要地位。"
je_balkfm_ser_greater_serbia_tt: "我们已成立#yellow 塞尔维亚帝国#!"

balkfm_milo_bailed_tt: "米洛什亲王流亡。"
balkfm_constitution_tt: "#bold 列强#!已同意土耳其宪法。"
balkfm.404.t: "宪法的捍卫者"
 balkfm.404.d: "在对专制统治的威胁中起义，[SCOPE.sCharacter('kaykay_scope').GetFullName]已经号召政治和军事领导人将[ROOT.GetCountry.GetRuler.GetFullName]驱逐出位。在奥斯曼帝国的批准下，他被任命为[ROOT.GetCountry.GetName]的新王子。"
 balkfm.404.f: "\"我们并不是推翻一个帕夏，而是用另一个帕夏取而代之。\""
 balkfm.404.a: "我们将捍卫我们的自由。"
 balkfm.404.tt1: "#yellow米哈伊洛王子#! 退位。"
 balkfm.404.tt2: "卡拉焦尔杰维奇家族继续统治。"
 balkfm.405.t: "破坏性的影响"
 balkfm.405.d: "今天早上在[SCOPE.sState('northern_serbia_state_scope').GetCityHubName]收到一份公报，暗示奥斯曼贝伊 [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow 阿加#! [SCOPE.sCharacter('smail_aga_scope').GetLastName] 暗中密谋取代黑塞哥维那的 #yellow 阿里帕夏#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName] 为黑塞哥维那的总督。王子的顾问们警告说，这可能危及我们在 [SCOPE.sCountry('montenegro_scope').GetName] 的塞尔维亚族同胞。"
 balkfm.405.f: "黑山的 #yellow Montenegro#! 大主教发现自己受到了奥斯曼王朝政治阴谋的困扰，而他的边境受到了 #yellow 阿里帕夏#! 的威胁。虽然我们不能公开对待奥斯曼帝国其他臣民，但我们可以帮助 [SCOPE.sCharacter('montenegro_ruler_scope').GetFullName] 在他们的队伍中制造分歧。"
 balkfm.405.a: "给帕夏写封信。"
 balkfm.405.b: "我们不参与空谈。"

balkfm.406.t: "缺席的改革"
balkfm.406.d: "尽管广泛要求远离奥斯曼统治遗留下的陈旧社会经济制度，进行改革，但Skupština（议会）在及时实施这些改革方面一直犹豫不决。"
balkfm.406.f: "除非[ROOT.GetCountry.GetName]能够摆脱其土耳其遗产，否则我们可能会注定遭受与#bold 高门#!（奥斯曼帝国）相同的腐朽命运。"
balkfm.406.a: "我们注定会停滞不前。"

balkfm.407.t: "国家基础稳固建立"
balkfm.407.d: "Skupština（议会）推动的这些改革已经开始实施，将[ROOT.GetCountry.GetName]从一个土耳其统治后的偏远地区转变为一个能够与西方进行贸易的国家。"
balkfm.407.f: "塞尔维亚国家前进的唯一途径是从我们的国家机构中剥离土耳其统治的记忆。"
balkfm.407.a: "我们应该为此感到骄傲。"

balkfm.408.t: "民法实施"
balkfm.408.d: "Skupština（议会）中的政治领导人庆祝了通过的改革，这些改革旨在推动[ROOT.GetCountry.GetAdjective]人民摆脱他们的农村地位。"
balkfm.408.f: "我们并没有拒绝苏丹下的农奴制，只是为了用我们自己造成的农奴制来取代它。"
balkfm.408.a: "做得对。"

balkfm.409.t: "经济体制改革"
balkfm.409.d: "尽管贵族们大声抗议，但Skupština（议会）还是实施了改革，极大地削弱了他们对[ROOT.GetCountry.GetAdjective]经济的铁腕控制。政治领导人希望这能够带来西方更多的投资。"
balkfm.409.f: "随着#bold 高门#!（奥斯曼帝国）继续停滞不前，塞尔维亚国家唯一的未来是与欧洲强国的经济引擎进一步合作。"
balkfm.409.a: "这只是[ROOT.GetCountry.GetName]的开始。"
 balkfm.410.t: "卡拉焦尔杰维奇家族继续统治"
 balkfm.410.d: "卡拉焦尔杰维奇家族的支持已经崩溃，采取主动行动，[ROOT.GetCountry.GetRuler.GetFullName] 从流亡地归来。在向参议院求情后，他被任命为 [ROOT.GetCountry.GetName] 的新王子。"
 balkfm.410.f: "前王子，[SCOPE.sCharacter('balkfm_obrenovic_scope').GetFullName] 已经流亡。然而，在参议院中他仍然保有强大的支持基础。新王子必须迅速采取行动，以合法化他的统治。"
 balkfm.410.a: "[ROOT.GetCountry.GetName] 必须找到自己的道路。"
 balkfm.411.t: "奥布伦诺维奇家族继续统治"
 balkfm.411.d: "奥布伦诺维奇家族的支持已经崩溃，采取主动行动，[ROOT.GetCountry.GetRuler.GetFullName] 从流亡地归来。在向参议院求情后，他被任命为 [ROOT.GetCountry.GetName] 的新王子。"
 balkfm.411.f: "前王子，[SCOPE.sCharacter('balkfm_balkfm_karadordevic_scope').GetFullName] 已经流亡。然而，在参议院中他仍然保有强大的支持基础。新王子必须迅速采取行动，以合法化他的统治。"
 balkfm.411.a: "[ROOT.GetCountry.GetName] 必须找到自己的道路。"
 balkfm.412.t: "瘟疫爆发！"


 balkfm.412.d: "[SCOPE.sCountry('ottoman_scope').GetName] 范围内的瘟疫爆发使得 [ROOT.GetCountry.GetRuler.GetFirstName] 王子陷入困境: 是封锁被感染的土耳其城堡并限制传播，还是为了不惹怒奥斯曼帝国而冒病毒传播的风险。"
 balkfm.412.f: "虽然该国已经轻松地确保了边界，但是正是贝尔格莱德的土耳其城堡带来了瘟疫进入塞尔维亚土地。我们相信如果我们迅速采取行动，可以遏制疫情。"
 balkfm.412.a: "包围城堡。进出禁止。"
 balkfm.412.b: "那将违反奥斯曼王朝的权利。"
balkfm.413.t: "虐待性驻军"
 balkfm.413.d: "贝尔格莱德的土耳其驻军被指控对该城市的塞尔维亚居民进行滥用行为。从偷窃到直接谋杀，参议院要求王子向奥斯曼帝国提出赔偿请求。"
 balkfm.413.f: "名义上，塞尔维亚被授予了完全治理自己的权力。然而，奥斯曼帝国坚持在违反条约义务的情况下保持他们在贝尔格莱德要塞的驻军。"
 balkfm.413.a: "我们将要求赔偿。"
 balkfm.413.b: "我们不能惹怒奥斯曼帝国。"
 balkfm.414.t: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName] 要求优先"
 balkfm.414.d: "随着卡拉焦尔杰维奇家族成为王室，他们在 [SCOPE.sCountry('balkfm_supplicant_scope').GetName] 的支持者已向王室提出要求，要求他们的领事在塞尔维亚外交中排名第一。[SCOPE.sCountry('balkfm_consul_scope').GetName] 的领事对这一要求提出了抗议。"
 balkfm.414.f: "尽管在这个问题上没有发生冲突，但俄罗斯和奥地利之间的无休止的竞争已经在争夺对王室的最高影响力。"
 balkfm.414.a: "我们不会撤换 [SCOPE.sCountry('balkfm_consul_scope').GetName]"
 balkfm.414.b: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName] 有资格居前。"
 balkfm.415.t: "国家愿望"
 balkfm.415.d: "#o Senate#! 中的民族主义者要求王子追究 [SCOPE.sCountry('ottoman_scope').GetName] 违反其对 [ROOT.GetCountry.GetName] 条约义务的行为。尽管正确，但许多人担心这样的要求只会激怒苏丹而无济于事。"
 balkfm.415.f: "\"...在我们的抱怨清单中，我们要求不应该有奥斯曼军队穿越塞尔维亚；土耳其驻军应该撤离塞尔维亚的要塞；所有土耳其人都应该离开塞尔维亚城市，只有那些同意的土耳其人才能留下....\""
 balkfm.415.a: "这些建议是公正的。"
 balkfm.415.b: "这只会惹怒奥斯曼帝国。"
balkfm.419.t: "稳固的授权"
balkfm.419.d: "尽管#o 参议院#!内部存在着深刻的分歧，#yellow 议院#! [ROOT.GetCountry.GetRuler.GetLastName] 已经确立了自己作为[ROOT.GetCountry.GetName]合法统治者的地位。通过继承法案的通过，塞尔维亚国家将终于拥有一位世袭君主。"
balkfm.419.f: "通过稳定君主制的冲突，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]和参议院应该能够在塞尔维亚确立一定程度的政治稳定。"
balkfm.419.a: "万岁[ROOT.GetCountry.GetRuler.GetLastName]家族！"

 balkfm.420.t: "巩固君主制"
balkfm.420.d: "在一次激昂的演讲中，对#o 参议院#，## [ROOT.GetCountry.GetRuler.GetLastName] 正式要求他们的统治应该变得永久且世袭。"
balkfm.420.f: "尽管得到了广泛的支持，[ROOT.GetCountry.GetName]内部仍然存在强大的反对势力，更不用说外国势力的反应了。"
balkfm.420.a: "[ROOT.GetCountry.GetName]应该有一位合适的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。"
balkfm.420.cement: "水泥是一种粘合剂，一种用于建筑的化学物质，它可以凝固、硬化并与其他材料粘合在一起。水泥很少单独使用，而是用于将沙子和砾石（骨料）粘合在一起。水泥与细骨料混合可生产用于砌体的灰浆，与沙子和砾石混合可生产混凝土。混凝土是目前世界上使用最广泛的材料，仅次于水。"
balkfm.470.t: "破坏性影响"
balkfm.470.d: "今天早晨，一封电报抵达了[SCOPE.sState('northern_serbia_state_scope').GetCityHubName]，暗示奥斯曼贝伊[SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow 阿加#! [SCOPE.sCharacter('smail_aga_scope').GetLastName]密谋篡黑赫塞哥维纳的维齐尔[SCOPE.sCharacter('ali_pasha_scope').GetFirstName]#yellow帕夏#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName]的地位。王子的顾问们警告称，这可能危及我们塞尔维亚的表兄弟在[SCOPE.sCountry('montenegro_scope').GetName]的安全。"
balkfm.470.f: "#yellow 黑山的主教#!发现自己受到了政治阴谋的袭击，他的边境受到了#yellow 阿里帕夏#的威胁。虽然我们不能公开对抗我们奥斯曼统治者的其他臣民，但我们可以帮助[SCOPE.sCharacter('montenegro_ruler_scope').GetFullName]在他们的行列中播下不和。"
balkfm.470.a: "给帕夏写封信。"
balkfm.470.b: "我们不参与空谈。"

 balkfm.480.t: "\"草案\""
 balkfm.480.d: "在与 [ROOT.GetCountry.GetRuler.GetLastName] 王子的会议中，民族主义政治家 [SCOPE.sCharacter('garasanin_scope').GetFullName] 向他和他的朝廷提出了一个宏伟的设想: 通过与目前在奥斯曼帝国控制下的南斯拉夫人的联盟来恢复塞尔维亚帝国。"
 balkfm.480.f: "在波兰外交官 #yellow亚当·耶尔日·查托里斯基#! 的著作中汲取灵感，加拉希南提出了一个南斯拉夫联盟的构想。在西方民族主义的影响下，他将自己的思想浓缩成了一个名为\"Načertanije\"或\"The Draft\"的计划。"
 balkfm.480.a: "这是[ROOT.GetCountry.GetName]的崇高计划！"
 balkfm.480.b: "我们不能对抗 [SCOPE.sCountry('ottoman_scope').GetName]。"

 balkfm.481.t: "大塞尔维亚"
balkfm.481.d: "随着我们伟大国家的核心地区在我们掌控之下，声势浩大的爱国热情席卷了[ROOT.GetCountry.GetName]。公民和政治家都呼吁恢复塞尔维亚在巴尔干半岛的统治地位。"
balkfm.481.f: "在拜占庭时期，塞尔维亚帝国统治着一个从"
balkfm.481.a: "[ROOT.GetCountry.GetName]将再次崛起！"
balkfm.481.tt: "#red恢复 #bold塞尔维亚帝国#将放弃南斯拉夫的事业#!。"
balkfm.482.t: "塞尔维亚帝国的恢复"
balkfm.482.d: "通过塞尔维亚人民的鲜血和牺牲，[ROOT.GetCountry.GetName]已经重生！"
balkfm.482.f: "今天，塞尔维亚的旗帜在巴尔干半岛上自豪地飘扬。我们的人民永远不会再成为外国帝国的奴隶。"
balkfm.482.a: "[ROOT.GetCountry.GetName]永远不会被征服！"

 balkfm.500.t: "黄金之狮苏醒"
 balkfm.500.d: "几乎一个世纪的国家觉醒势头加上[SCOPE.sCountry('ottoman_scope').GetName]的衰落导致了[ROOT.GetCountry.GetName]的重生。在[SCOPE.sCountry('russia_scope').GetName]和[SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFirstName]的支持下，一位天主教的奥地利王子被选为这个新生国家的统治者。"
 balkfm.500.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] 年轻而经验不足，国家处于危险的境地。与奥斯曼帝国尚未完全独立的同时，[ROOT.GetCountry.GetName] 是一个农村、贫困、严重依赖于[SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting]国家外交支持的国家。然而，人们对摆脱压迫的未来和与奥斯曼领土内仍然生活在保加利亚人民团结的希望充满信心。"
balkfm.500.a: "[ROOT.GetCountry.GetName] 将找到自己的道路。"
balkfm.501.t: "民主阻碍"
balkfm.501.d: "王子 [ROOT.GetCountry.GetRuler.GetFullName] 发现国民大会不断争吵使他快速发展国家机构的计划落空。与此同时，人们公开表示对保加利亚政治进程的不信任。在俄罗斯外交官的支持下，王子提出废除宪法的大部分内容。"
balkfm.501.f: "\"我认为，主教，斯拉夫民族之间，或者说在俄罗斯，对国家理论的阐述可能对您的政治计划有所帮助。\" \n-J. Askakoff，写给王子的信，1881"
balkfm.501.a: "一个强大的国家需要一个强大的领导者。"
balkfm.501.b: "政治进程需要时间。"
balkfm.502.t: "异见刊物"
balkfm.502.d: "一家知名报纸《保加利亚之声》对王子对专制统治的愿望表示反感，招致了王子内政大臣的不满。他建议王子不能容忍对他的权威的这些挑衅。"
balkfm.502.f: "\"人们唯一需要的声音就是他们的主人，王子的声音！\""
balkfm.502.a: "对新闻界实施限制。"
balkfm.502.b: "新闻必须是神圣的。"
balkfm.503.t: "沙皇的影响"
balkfm.503.d: "在[ROOT.GetCountry.GetName]的建立之后，以及支持[ROOT.GetCountry.GetRuler.GetFullName]的当选后，沙皇 [SCOPE.sCountry('russia_scope').GetRuler.GetFirstName] 对待王子更像是一个省级代表而不是外国统治者。在其最新的策略中，[SCOPE.sCountry('russia_scope').GetName]已经派遣两位将军协助并监督我们的军队。"
balkfm.503.f: "这两位人，#yellow列昂尼德·索博列夫#! 和 #yellow亚历山大·冯·考尔巴斯#! 都是他们自己的杰出军人，但他们的存在可能使我们暴露于进一步的俄罗斯影响之中。正当如此，奥地利领事已经提出抗议，认为这将使沙皇在巴尔干地区拥有不当的影响力。"
balkfm.503.a: "我们应该信任我们的恩人。"
balkfm.503.b: "我们的军队将保持保加利亚的。"
balkfm.504.t: "俄罗斯要求屈服"
balkfm.504.d: "由于国民大会的大胆行为和巴尔干地区民族主义运动的崛起，沙皇 [SCOPE.sCharacter('russia_ruler_scope').GetFullName] 发出了严厉的警告，不要追求我们对 [SCOPE.sCountry('rumelia_scope').GetName] 的要求。"
balkfm.504.f: "\"希腊，希望以自己的代价扩张，现在是唯一值得担心的。让人足够困难地撤回这个国家……摆脱它所引起的危机。必须记住，保加利亚尚未能够抵抗这种动荡的后果。\" -沙皇亚历山大三世，给巴滕堡亲王关于巴尔干伊雷迪提主义的问题的信。"
balkfm.504.a: "我们应该小心谨慎。"
balkfm.504.b: "保加利亚的统一是不可避免的。"
balkfm.505.t: "破坏性态度"
balkfm.505.d: "我们的俄罗斯随扈的存在并未平稳进行。在干涉国民大会的政治之后， #Kaulbars#! 将军要求限制军队中保加利亚本地将军的提升。"
balkfm.505.f: "自然而然，这一行动引起了愤怒。如果军队仍然被束缚在俄罗斯的军队中，保加利亚不可能寻求自己的道路。政治领导人要求王子直接与沙皇沟通他在保加利亚的意图。"
balkfm.505.a: "王子将寻求救济。"
balkfm.505.tt: "#yellow Alexander 王子#! 将动身前往莫斯科。"
balkfm.505.b: "我们将容忍他们的滑稽行为。"
balkfm.506.t: "索博列夫摄政"
balkfm.506.d: "在对[ROOT.GetCountry.GetName]的独立进行另一次侮辱之后， #yellow Sobolev#! 将军滥用职权，解雇了几名总督和部长，并试图在王子出国期间改革政府，使其更友好于俄罗斯。"
balkfm.506.f: "当王子前往俄罗斯时，"
balkfm.506.a: "只需撤销他的行动。"
balkfm.506.b: "把这些老鼠从[ROOT.GetCountry.GetName]中赶走！"
 balkfm.507.t: ""
 balkfm.507.d: ""
 balkfm.507.f: ""
 balkfm.507.a: ""
 balkfm.508.t: "委托书担保"
 balkfm.508.d: "就在政变发生几天后， [SCOPE.sCharacter('balkfm_sava_scope').GetFullName]召集了军队支持王子，逮捕了阴谋者，恢复了[ROOT.GetCountry.GetName].在俄罗斯王位的支持浪潮中[SCOPE.sCharacter('balkfm_alex_scope').GetFullName]重返王位，引发了广泛的欢呼。"
 balkfm.508.f: "王子及其支持者表现出的意志和决心增强了他在人民中的地位。在[SCOPE.sCountry('russia_scope').GetName],支持下，王子被宣布为保加利亚国家的世袭统治者。"
 balkfm.508.a: "未来属于[ROOT.GetCountry.GetName]!" 
 balkfm.508.a: "[ROOT.GetCountry.GetName] 的未来光明无限！"
balkfm.509.t: "八月政变"
balkfm.509.d: "在试图在[ROOT.GetCountry.GetName]中确立专制统治的努力之后， [ROOT.GetCountry.GetRuler.GetFullName] 已被免职。国家内的亲俄派分子闯入皇家住所，迫使王子在死亡威胁下退位。"
balkfm.509.f: "王子突然被赶下台引起了广泛的愤怒。尽管[SCOPE.sCharacter('balkfm_sava_scope').GetFullName]试图领导一场反政变，但王子并没有得到足够的支持，无法感到在统治保加利亚国家方面合法。一个看守摄政团已经组建，向大国呼吁寻找新的王子。"
balkfm.509.a: "[ROOT.GetCountry.GetName] 将找到自己的道路。"
balkfm.510.t: "不安全的边远地区"
balkfm.510.d: "在整个巴尔干地区，强盗们劫掠了贵族和农民。社区领导人要求国家提供解决方案，以免他们掠夺整个国家。"
balkfm.510.f: "希腊独立战争的后果严重破坏了对巴尔干乡村的国家控制。随着奥斯曼帝国权威的瓦解和经济停滞，退伍军人已经转向劫掠以谋生。"
balkfm.510.a: "我们不能忽视这一点。"
balkfm.511.t: "强盗的终结"
balkfm.511.d: "国家坚定而果断的领导已经使草寇们停下了在我国农村肆虐的武器，并开始作为社会的有生产力的成员工作。"
balkfm.511.f: "虽然是基本而普通的事情，确保国人在家中的安全是合法化国家的重要一步。"
balkfm.511.a: "做得好。"
balkfm.512.t: "战略需求"
balkfm.512.d: "《柏林条约》规定了有限的保加利亚国家。其中规定要求[ROOT.GetCountry.GetName]建立战略铁路网络，将土耳其和奥斯曼领土连接起来，作为一个庞大的东方线愿景的一部分。此外，英国强迫要求该国购买卢塞-瓦尔纳铁路，作为他们在该地区的损失的补偿。"
balkfm.512.f: "自成立以来，大国们一直希望将保加利亚定位为奥斯曼领域的西方滩头。尽管希望将所有交通运输方面纳入国家控制，但一些人担心这可能会损害大国对保加利亚国家的支持。"
balkfm.512.a: "我们没有铁路就没有未来。"
balkfm.513.t: "勒索定价"
balkfm.513.d: "在国民大会的一次煽动性会议之后，[ROOT.GetCountry.GetName]已经履行了关于卢塞-瓦尔纳线的义务。"
balkfm.513.f: "在柏林条约批准和购买铁路之间的延迟期间，英国经营者趁机向保加利亚国家勒索最高的价值。"
balkfm.513.a: "无论价格如何，都是明智的选择。"
balkfm.514.t: "保加利亚铁路"
balkfm.514.d: "在[ROOT.GetCountry.GetName]建立一条横贯国家的铁路网络后，我们终于与欧洲世界建立了明确的联系。我们只能希望这将有助于我们摆脱[SCOPE.sCountry('ottoman_scope').GetName]的统治。"
balkfm.514.f: "在保加利亚建设几条铁路对俄罗斯和奥地利帝国的战略设计至关重要。这也使奥利安特快车得以完成，将巴黎与君士坦丁堡连接起来。"
balkfm.514.a: "有了这个，我们的未来是安全的。"
balkfm.515.t: "皇室随扈"
balkfm.515.d: "在得到沙皇宫廷的批准后，王子 [ROOT.GetCountry.GetRuler.GetFirstName] 已经准备好启程前往[SCOPE.sCountry('russia_scope').GetName]。然而，在启程之前，一封公函到达，表明苏丹 [SCOPE.sCountry('ottoman_scope').GetRuler.GetFullName] 希望与王子会面。"
balkfm.515.f: "尽管苏丹对王子的帮助不够，许多顾问建议王子前往君士坦丁堡。王子本人考虑到这可能是在前往莫斯科之前访问巴尔干地区的几个邻国的好机会。"
balkfm.515.a: "我们应该表示尊敬。"
balkfm.515.b: "我们去俄罗斯。"
balkfm.516.t: "热烈欢迎"
balkfm.516.d: "尽管他有些担忧，[ROOT.GetCountry.GetRuler.GetFirstName] 在苏丹那里受到了热烈的欢迎。王子没有经历短暂而寒冷的交往，而是受到了欢笑和崇高的装饰。 [SCOPE.sCharacter('ottoman_ruler_scope').GetFullName] 显然试图平息席卷[ROOT.GetCountry.GetName]的分离主义浪潮。"
balkfm.516.f: "苏丹的行为使王子及其随扈感到惊讶。苏丹对王子对保加利亚的请求做出了礼貌和专注的回应，批准了大多数请求，并以最高的尊重拒绝了一些请求。苏丹甚至授予王子奥斯曼尼亚勋章，这是帝国中第二高级别的勋章。"
balkfm.516.a: "多么慷慨的惊喜！"
balkfm.517.t: "谨慎的欢迎"
balkfm.517.d1: "在雅典的宫廷，国王[SCOPE.sCharacter('greece_ruler_scope').GetFullName] 对[ROOT.GetCountry.GetRuler.GetFirstName] 王子表示怀疑。尽管国王没有表现出不敬，但显然他不同意王子的整个巴尔干地区的愿望。"
balkfm.517.d2: "在希腊宫廷，[SCOPE.sCharacter('greece_ruler_scope').GetFullName] 国王对[ROOT.GetCountry.GetRuler.GetFirstName] 王子表示热烈的欢迎。在完成正式事务后，国王提出了几项提议，希望在巴尔干地区确保一个希腊盟友。国王还承诺在马其顿问题上寻求合作。"
balkfm.517.f: "巴尔干地区各民族之间的关系一直充满了争吵。由于国界划分不清，主要城市的人口严重混杂，每次伊尔迪迪主义运动都会让那些发现自己被自己国家疏远的人感到沮丧。"
balkfm.517.a: "这真是不幸。"
balkfm.517.b: "这真是幸运。"
balkfm.518.t: "黑山"
balkfm.518.d1: "黑山的清新空气和宁静的环境温暖了任何访客的心。在[SCOPE.sCharacter('montenegro_ruler_scope').GetFullName]的友好接待后，黑山宫廷提供给王子一个皇家公主的手，以巩固两国之间的联系。"
balkfm.518.d2: "黑山的清新空气和宁静的环境温暖了任何访客的心。在[SCOPE.sCharacter('montenegro_ruler_scope').GetFullName]的友好接待后，谈话转向了奥斯曼帝国的衰落。尽管没有作出具体的承诺，但两人都同意巴尔干地区必须团结起来对抗土耳其人。"
balkfm.518.f: "[SCOPE.sCountry('montenegro_scope').GetName]几个世纪以来一直在抵抗奥斯曼人。然而，随着奥斯曼帝国试图在巴尔干地区确立控制，它发现自己四面受敌。在这种情况下，主教王子推动与其他巴尔干国家建立牢固的关系。"
balkfm.518.a: "王子将感到荣幸。"
balkfm.518.b: "我们不能轻易承诺王子。"
balkfm.518.c: "愿这是一个坚固友谊的开始。"
balkfm.519.t: "沙皇宫廷"
balkfm.519.d: "当王子[ROOT.GetCountry.GetRuler.GetFirstName]在莫斯科抵达时，他发现索非亚市市长 #yellow Nikola Suknarov#! 居然宣称自己领导着一支保加利亚代表团前往沙皇处，这让王子非常愤怒。愤怒的王子站在一个如何应对这种情况的十字路口。"
balkfm.519.f: "在试图破坏保加利亚独立的努力中，#yellow Sobolev 将军# 发送了第二批代表团直接前往莫斯科。这产生了使保加利亚国家在国外受辱的预期效果。在冲进沙皇大厅后，王子要求在沙皇面前发表演讲，并惊讶地与皇帝亲自会晤。"
balkfm.519.a: "要求惩罚 #yellow Sobolev#。"
balkfm.519.b: "设法修复关系。"
balkfm.520.t: "选举出的王子"
balkfm.520.d: "寻找一位领导保加利亚国家的新王子的过程充满了政治阴谋，大量外交官涌入国民议会。由[ROOT.GetCountry.GetRuler.GetFullName]领导的摄政委员会似乎已经找到了一个得到国际社会认可的候选人。"
balkfm.520.f: "在将 #yellow Battenburg 王子# 驱逐出[ROOT.GetCountry.GetName]之后，执政政府迅速接到了来自 [SCOPE.sCountry('russia_scope').GetName] 和 [SCOPE.sCountry('ottoman_scope').GetName] 的外交官的提案，要求国民议会批准他们选择的国王。"
balkfm.520.a: "年轻的恶作剧者，费迪南德·马克西米连最为可接受。"
balkfm.560.t: "分裂的威胁"
balkfm.560.d: "由于[concept_overlord]的支持，普世牧首谴责了保加利亚教会的分裂，威胁要切断[ROOT.GetCountry.GetName]与母教会的联系，除非我们重新屈服于君士坦丁堡之下。"
balkfm.560.f: "保加利亚教会的行动，在苏丹的法令下建立，以及后来单方面宣布自治，引起了整个东正教世界的愤怒。有人指责保加利亚国家优先考虑政治而不是信徒的福祉。"
balkfm.560.a: "这将使教会免受奥斯曼的干预。"
balkfm.560.b: "我们不能因政治分歧而分裂教会。"
balkfm.561.t: "DUMMY"
balkfm.561.d: "DUMMY"
balkfm.561.f: "DUMMY"
balkfm.561.a: "DUMMY"
 balkfm.570.t: "黄金狮子咆哮"
balkfm.570.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] 宣告了[ROOT.GetCountry.GetName]的重生，教堂钟声响起，人们欢呼雀跃。在[SCOPE.sBuilding('hagia_sofia_scope').GetName]庄严的陪伴下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]身着古老的东罗马皇帝的标志和徽章向市民、政要和神职人员走去，[ROOT.GetCountry.GetRuler.GetFirstName]成为了保加利亚人民未来的象征。"
balkfm.570.f: "自罗马和君士坦丁堡失落以来，几个世纪以来无数次的尝试都失败了，如今帝国已经崛起。然而，仍有许多工作要做: 许多希腊人和保加利亚人受到异端分子和异教徒的统治，曾经的罗马土地仍然掌握在外国假冒者手中，无数拜占庭珍宝被扣押在国外。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须确保能够实现[ROOT.GetCountry.GetRuler.GetHerHis]臣民的期望，才能为[ROOT.GetCountry.GetName]带来荣耀。"
balkfm.570.a: "我们是帝国的继承人。"
balkfm.571.t: "帝国的后裔"
balkfm.571.d: "我们的努力已经得到回报，[ROOT.GetCountry.GetName]的重生已经到来。现在，一些声音呼吁通过将以前拜占庭土地归还给希腊来恢复[ROOT.GetCountry.GetAdjectiveNoFormatting]的力量和声望。由[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]决定[ROOT.GetCountry.GetAdjectiveNoFormatting]国家的未来。"
balkfm.571.f: "\"希腊王国不是希腊；它只是希腊的一部分: 是希腊的最小、最贫穷的一部分。希腊人不仅是居住在王国的人，也是居住在约阿尼纳、萨洛尼卡、塞雷斯、安纳托利亚、君士坦丁堡、特拉比松、克里特、萨莫斯或任何其他属于希腊历史或希腊种族的地区的人...... 希腊人有两个伟大的中心。雅典是王国的首都。君士坦丁堡是伟大的首都，是所有希腊人的梦想和希望。\"-I. Kolettis, 1844"
balkfm.571.a: "我们将恢复[ROOT.GetCountry.GetName]的荣耀。"
balkfm.571.b: "我们将限制在安纳托利亚。"
balkfm.571.c: "我们将限制在巴尔干地区。"
balkfm.572.t: "Nova Roma Constantinopolitana"
balkfm.572.d: "随着安纳托利亚和巴尔干地区牢牢掌握在我们手中，帝国的旧心脏已经被夺回！"
balkfm.572.f: "将近一千年前，巴西雷乌斯·伊萨克一世·科姆宁诺斯威临引领帝国步入了一个新的强大和辉煌的时代。随着古老的心脏地带被夺回，东罗马帝国的心脏得以恢复，正教牧首的宝座得以恢复。"
balkfm.572.a: "向巴西雷乌斯致敬！向拜占庭致敬！"
balkfm.573.t: "大草原的记忆"
balkfm.573.d: ""
balkfm.573.f: ""
balkfm.573.a: ""
balkfm.574.t: "古老的大保加利亚"
 balkfm.574.d: ""
 balkfm.574.f: ""
 balkfm.574.a: ""
 balkfm.580.t: "沙皇梦想"
balkfm.580.d: "[ROOT.GetCountry.GetName]重生了，它的影子挥之不去。在西方和南方，我们的同胞仍然生活在奥斯曼的统治下。亲王和国民议会的领导人要求对保加利亚做出进一步让步。"
balkfm.580.f: "历史注释: 1878年的圣斯特凡诺条约最初极大地支持了新成立的保加利亚国家。然而，几个月后，这些征服的绝大多数在柏林条约中被逆转，柏林条约支持了对塞尔维亚、黑山和罗马尼亚的承认。这使得保加利亚只剩下了巴尔干山脉以北的领土，其余的领土在奥斯曼的统治下。"
balkfm.580.a: "我们不能抛弃我们的兄弟。"
balkfm.581.t: "托帕哈内协议"
balkfm.581.d: "今天上午，[SCOPE.sState('bulgaria_capital_scope').GetCityHubName]爆发出欢呼声，因为传来消息称鲁梅利亚傀儡政府已被推翻，[ROOT.GetCountry.GetName]和[SCOPE.sCountry('rumelia_scope').GetName]之间建立了联盟。虽然我们仍然处于奥斯曼的[concept_overlord]统治下，但这是恢复保加利亚国家的第一步。"
balkfm.581.f: "虽然这是一个重大的成就，但我们必须保持警惕。莫斯科的沙皇和君士坦丁堡的苏丹都不会善待我们干涉他们的计划。"
balkfm.581.a: "这是[ROOT.GetCountry.GetName]的伟大日子。"
balkfm.582.t: "独立的保加利亚"
balkfm.582.d: "通过宣布[ROOT.GetCountry.GetName]的独立和吞并东鲁梅利亚，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]在巴尔干世界引起了轰动。将我们与[SCOPE.sCountry('ottoman_scope').GetName]的法律虚构抛诸脑后。"
balkfm.582.f: "自柏林条约以来，奥斯曼帝国的[concept_overlord]地位只不过是一种虚伪的幻觉。保加利亚国家按照自己的法律和风俗统治着自己，苏丹阻止我们的努力的无能证明了这一点。"
balkfm.582.a: "[ROOT.GetCountry.GetName]将会取得胜利。"
balkfm.583.t: "保加利亚的伊瑞登主义"
balkfm.583.d: "与东鲁梅利亚的联盟奇迹般地使圣斯特凡诺条约的最初目标重新聚焦。随着民族主义的狂热席卷[ROOT.GetCountry.GetName]，最热烈的信仰者要求所有保加利亚人都应该生活在我们的旗帜下。"
balkfm.583.f: "自从他们抵达巴尔干以来，保加利亚社区一直延伸从多瑙河岸到爱琴海海岸。对保加利亚国家的划分是一个法律虚构，我们将纠正这一点！"
balkfm.583.a: "这些都是保加利亚的土地。"
balkfm.583.b: "我们不能惹恼大国。"
balkfm.584.t: "保加利亚帝国"
balkfm.584.d: "在我们对大保加利亚的控制下，[ROOT.GetCountry.GetName]已经夺回了保加利亚帝国旧有的土地。"
balkfm.584.f: "从681年到1018年，再到1185年到1396年，保加利亚帝国主导了巴尔干北部，甚至多次从拜占庭皇帝那里得到赔偿和让步。"
balkfm.584.a: "保加利亚国家将统治巴尔干。"
balkfm.584.b: "我们应该为我们取得的成就感到自豪。"
balkfm.585.t: "[ROOT.GetCountry.GetName]的未来"
balkfm.585.d: "我们最新的征服确保了我们在巴尔干的主导地位。我们的人民现在期待着[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]决定保加利亚国家的未来。"
balkfm.585.f: "我们已经摆脱了希腊、俄罗斯和奥斯曼的压迫，现在我们必须决定我们在巴尔干社区的地位。"
balkfm.585.a: "[ROOT.GetCountry.GetName]将领导巴尔干！"
balkfm.585.b: "我们的国家将属于所有南斯拉夫人！"
balkfm.585.c: "我们将夺回皇帝的宝座！"
balkfm.585.e: "我们应该为我们取得的成就感到自豪。"
balkfm.586.t: "保加利亚帝国"
balkfm.586.d: "当[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]在[ROOT.GetCountry.GetCapital.GetCityHubName]的中心宣布保加利亚国家对巴尔干的绝对统治时，人群聚集在那里。"
balkfm.586.f: "对于那些认为我们在自己的家园里是二等公民的帝国主义者的压制，我们不仅取得了自由，还取得了未来！"
balkfm.586.a: "这是[ROOT.GetCountry.GetName]的辉煌日子。"
balkfm.587.t: "南斯拉夫国家"
balkfm.587.d: "在摆脱了奥斯曼和奥地利帝国的枷锁后，巴尔干地区的斯拉夫人民已经统一成一个国家。"
balkfm.587.f: "自由。不仅仅是摆脱枷锁，而是真正的自由。不再被夹在铁锤与砧板、猎犬与猎人之间，现在是一个新的联盟的时候。一个所有人都可以看到的新的斯拉夫之约。"
balkfm.587.a: "南斯拉夫的梦想成真！"
balkfm.588.t: "城市女王"
 balkfm.588.d: "随着对伊斯坦布尔海峡和达达尼尔海峡对岸土地的征服，重建拜占庭帝国的目标已经实现。我们的公民现在期望国家引领他们走向新时代。"
 balkfm.588.f: "君士坦丁堡这座古老的帝国都城现在在我们的掌控之下。没有人能够质疑我们对拜占庭王位的合法主张。"
 balkfm.588.a: "我们的军队将再次升起帝国的旗帜！"
 balkfm.590.t: "保加利亚扩张主义"
 balkfm.590.d: ""
 balkfm.590.f: ""
 balkfm.590.a: "我们将制止这位叛逆的亲王。"
 balkfm.590.b: "这是不可避免的。"
 balkfm.598.t: "保加利亚国家"
 balkfm.598.d: "随着[SCOPE.sCountry('bulgaria_scope').GetName]的重新建立，保加利亚人民终于可以梦想拥有属于自己的未来。这个年轻的国家如果要在奥斯曼的报复中生存下去，就需要强有力的领导……"
 balkfm.598.f: "\"由于您与这些边疆地区人民的领袖会面是非常必要的，以讨论对所有在这里被柏林大会再次置于土耳其暴政统治之下的保加利亚人都有利的一件非常重要的事宜。\"-奥里德的纳撒尼尔，给彼得科·沃伊沃达，1878年。"
 balkfm.598.a: "现在是重新关注[ROOT.GetCountry.GetName]的时候了。"
 balkfm.598.b: "我想知道他们将有什么样的故事……"
 balkfm.599.t: "金色雄狮苏醒"
 balkfm.599.d: "几乎一个世纪的民族觉醒的动力，加上[SCOPE.sCountry('ottoman_scope').GetName]的衰落，导致了[ROOT.GetCountry.GetName]的重生。在[SCOPE.sCountry('russia_scope').GetName]和[SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFirstName]的支持下，一位天主教的奥地利王子被选为这个新兴国家的统治者。"
 balkfm.599.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]年轻而缺乏经验，国家处于危险的位置。[ROOT.GetCountry.GetName]还没有完全摆脱温床的控制，它是个农村、贫困，严重依赖[SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting]国外交支持的国家。然而，人们对一个未来摆脱压迫，并与仍生活在奥斯曼领土内的保加利亚人民进行未来联合的希望感到兴奋。"
 balkfm.599.a: "[ROOT.GetCountry.GetName]将找到自己的道路。"

 # Romania (and co.) Events
 
balkfm.600.t: "史蒂芬大帝的土地"
balkfm.600.d: "在被[SCOPE.sCountry('ottoman_scope').GetName]统治数个世纪后，安德里亚诺波尔条约将摩尔达维亚公国和瓦拉几亚公国都确定为奥斯曼帝国的名义附属国。\n\n在[SCOPE.sCountry('russia_scope').GetName]的外交设计支持下，这些公国努力寻找自己的立足之地，受到封建过去的阻碍。"
balkfm.600.f: "[ROOT.GetCountry.GetNameNoFlag]在奥斯曼统治下饱受战乱和停滞之苦，数个世纪以来，围绕多瑙河和德涅斯特河口的所有权争夺一直在持续，然而许多人对未来摆脱完全服役的前景抱有希望。"
balkfm.600.a: "[ROOT.GetCountry.GetName]将找到自己的道路。"

balkfm.610.t: "雪山之外的土地"
balkfm.610.d: "在被[SCOPE.sCountry('ottoman_scope').GetName]统治数个世纪后，安德里亚诺波尔条约将摩尔达维亚公国和瓦拉几亚公国都确定为奥斯曼帝国的名义附属国。\n\n在[SCOPE.sCountry('russia_scope').GetName]的外交设计支持下，这些公国努力寻找自己的立足之地，受到封建过去的阻碍。"
balkfm.610.f: "[ROOT.GetCountry.GetNameNoFlag]在奥斯曼统治下饱受战乱和停滞之苦，数个世纪以来，围绕多瑙河和德涅斯特河口的所有权争夺一直在持续，然而许多人对未来摆脱完全服役的前景抱有希望。"
balkfm.610.a: "[ROOT.GetCountry.GetName]将找到自己的道路。"

balkfm.620.t: "有机法令"
balkfm.620.d: "在脱离[SCOPE.sCountry('ottoman_scope').GetName]的准独立后，摩尔达维亚公国和瓦拉几亚公国都经历了政治不稳定，最终导致了饥荒和瘟疫。为了恢复这些公国的秩序并建立现代国家的基础，[SCOPE.sCountry('russia_scope').GetName]强加了《有机法令》希望开始西化进程。"

balkfm.620.f: "#italic 有机法令# 是这些公国的第一部宪法文件。鉴于与西方相比的停滞威胁，俄罗斯国家提倡在[ROOT.GetCountry.GetNameNoFlag]实行渐进式现代化制度。"
balkfm.620.a: "这些是崇高的抱负。"
balkfm.621.t: "先进的法律标准"
balkfm.621.d: "根据#italic 有机法令#的规定，[ROOT.GetCountry.GetName]实施了一系列全面的改革，重塑了国家机构，以使其能够对国家施加政治控制，并打击腐败。"
balkfm.621.f: "通过推动司法和行政改革的混合，议会为国家的政治发展提供了框架。"
balkfm.621.a: "工作做得出色。"
balkfm.622.t: "现代化经济"
balkfm.622.d: "根据#italic 有机法令#的规定，[ROOT.GetCountry.GetName]推进了经济变革，已经开始将[ROOT.GetCountry.GetAdjectiveNoFormatting]国家重组为一个工业国家。"
balkfm.622.f: "虽然与西方相比仍然落后，但这些变化预示着[ROOT.GetCountry.GetAdjective]封建统治的结束。"
balkfm.622.a: "我们的未来充满希望。"
balkfm.623.t: "社会公平"
balkfm.623.d: "根据#italic 有机法令#的规定，[ROOT.GetCountry.GetName]通过法律赋予[ROOT.GetCountry.GetAdjectiveNoFormatting]公民土地所有权和人身不可侵犯权利。"
balkfm.623.f: "摆脱对大帝国的服役的唯一途径是确保[ROOT.GetCountry.GetAdjectiveNoFormatting]人民自己摆脱奴役。"
balkfm.623.a: "这才是公平的。"
balkfm.624.t: "选举酋长"
balkfm.624.d: "[ROOT.GetCountry.GetRuler.GetFullName]的摄政者任期已满。根据#italic 有机法令#和阿克曼公约的条款，开始了新的摄政者选举。"
balkfm.624.f: "在许多方面，摄政者选举是对贵族制度的演变，通常是领主们选举他们中的一员来“统治”[ROOT.GetCountry.GetAdjective]。"
balkfm.624.a: "[SCOPE.sCharacter('balkfm_hospodar_candidate_1').GetFullName]应该保留头衔。" 
balkfm.624.b: "[SCOPE.sCharacter('balkfm_hospodar_candidate_2').GetFullName]似乎很合适。"
 balkfm.624.c: "[SCOPE.sCharacter('balkfm_hospodar_candidate_3').GetFullName]可能是最佳选择。"
 balkfm.625.t: "选举酋长"
 balkfm.625.d: "[ROOT.GetCountry.GetRuler.GetFullName]作为[ROOT.GetCountry.GetName]的摄政者的任期已满。根据#italic 有机法令#和阿克曼公约的条款，开始了新的摄政者选举。"
 balkfm.625.f: "在许多方面，摄政者选举是对贵族制度的演变，通常是领主们选举他们中的一员来“统治”[ROOT.GetCountry.GetAdjective]。"
 balkfm.625.a: "[SCOPE.sCharacter('balkfm_hospodar_candidate_1').GetFullName]应该保留头衔。"
 balkfm.625.b: "[SCOPE.sCharacter('balkfm_hospodar_candidate_2').GetFullName]似乎很合适。"
 balkfm.625.c: "[SCOPE.sCharacter('balkfm_hospodar_candidate_3').GetFullName]可能是最佳选择。"
 balkfm.626.t: "封建制度的终结"
 balkfm.626.d: "尽管受益者和对手们都怀有偏见和疑虑，但[ROOT.GetCountry.GetName]成功地摆脱了我们封建统治者的古老制度。"
 balkfm.626.f: "尽管经历了世纪的奥斯曼国家的剥削，但今天[ROOT.GetCountry.GetAdjectiveNoFormatting]人民已经准备好开创自己的未来。"
 balkfm.626.a: "[ROOT.GetCountry.GetName]的辉煌成就。"

 balkfm.680.t: "我们的联合宣言"
 balkfm.680.d: "凭借我们的力量和智慧，我们已经迈出了统一罗马尼亚民族的第一步。未来在召唤！"
 balkfm.680.f: "记者开始记录当天的经历。“在整个首都，只能听到最热烈的欢乐表演。这是所有街道、所有人行道、所有城市公共场所都能看到的场景。我们的农民兄弟现在正用他们灵魂中所有的活力呐喊:‘#italic 天佑罗马尼亚民族！天佑罗马尼亚！#’”\n\n他的脸颊上滚落了一滴欢乐的泪水。“每个人都毫不犹豫地投入到彼此的怀抱中，不管他们的地位如何，好像所有人都摆脱了最压迫的枷锁。”"
 balkfm.680.a: "Toți în unu！"
 balkfm.680.a.tta: "[SCOPE.sCountry('romania_lesser_partner').GetName]将成为我们的次要成员，在[concept_personal_union]中与我们结合。"
 balkfm.680.a.ttb: "[SCOPE.sCountry('romania_lesser_partner').GetName]将成为我们的[concept_puppet]。"
 balkfm.681.t: "醒来，罗马尼亚！"
balkfm.681.d: "我们与[SCOPE.sCountry('romania_lesser_union_partner').GetName]的联合已完成。我们的联系牢不可破，我们的意志坚定不移——共同组成了#bold 罗马尼亚#!" 
 balkfm.681.d2: "我们与[SCOPE.sCountry('romania_lesser_union_partner').GetName]和[SCOPE.sCountry('transylvania_union_partner').GetName]的联合已完成。我们的联系牢不可破，我们的意志坚定不移——共同组成了#bold 罗马尼亚#!"
 balkfm.681.f: "“醒来，罗马尼亚，王国雄狮将在沉睡中苏醒！”人群咆哮道。\n\n“你们被暴君所压迫，陷入了永恒的沉睡。\n现在，开展新的命运吧！\n就连最残忍的敌人也将对你们俯首致敬！”\n\n三色旗迎风飘扬。孩子们被举到空中，将这一时刻铭刻在记忆中。人们一起唱着一首从未听过的歌曲，将歌词牢记心中。"
 balkfm.681.a: "团结一致，生死相依！"
 balkfm.682.t: "归还授权"
 balkfm.682.d: "在快速谈判后，[SCOPE.sCountry('romanian_bessarabia_owner').GetName]同意将一部分贝萨拉比亚割让给[ROOT.GetCountry.GetName]。"
 balkfm.682.f: "慢慢地，但肯定地，罗马尼亚联盟的梦想将实现。"
 balkfm.682.a: "这是[GetCulture('romanian').GetName]人民的重大进步！"
 balkfm.683.t: "归还被拒绝"
 balkfm.683.d: "将贝萨拉比亚土地归还给[ROOT.GetCountry.GetName]的谈判失败了。这意味着[GetCulture('romanian').GetName]人民仍被外国边境所隔离。"
 balkfm.683.f: "罗马尼亚人长期以来一直是巴尔干地区帝国主义者的猎物。这次失败是对他们压迫的又一延续。"
 balkfm.683.a: "他们不会停止[GetCulture('romanian').GetName]的事业。" # Bosnia Events
 
 

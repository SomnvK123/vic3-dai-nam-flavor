balkfm.529.t: "罗马尼亚科学院"
balkfm.529.d: "为了发展[ROOT.GetCountry.GetName]，国王[SCOPE.sCharacter('university_benefactor').GetFullName]提出了一项在[SCOPE.sState('university_state').GetCityHubName]建立本土高等学府的计划。该计划将为国家带来巨大开支。"
balkfm.529.f: ""
balkfm.529.a: "一个崇高的努力。"
balkfm.529.b: "成本太高。"

balkfm.590.t: "马其顿问题"
balkfm.590.d: "#yellow Macedonia#!，一个"
balkfm.590.f: ""
balkfm.590.a: "我们应该监控他们的活动。"

balkfm.591.t: "在[STATE.sState('balkfm_agitation_state_scope').GetName]的保加利亚骚动"
balkfm.591.d: ""
balkfm.591.f: ""
balkfm.591.a: "马其顿的自由！"
balkfm.591.b: "我们不能容忍这些暴徒。"

balkfm.592.t: "马其顿起义"
balkfm.592.d: "在我们的领导下，马其顿的保加利亚人已经拿起武器反对[SCOPE.sCountry('ottoman_scope').GetName]。"
balkfm.592.f: "“秘密马其顿-阿德里安堡组织的目标是团结马其顿和阿德里安堡地区所有不满的元素，不论其国籍，通过革命赢得这两个地区的完全政治自治。” - SMARO，1896年"
balkfm.592.a: "我们必须帮助我们的武装兄弟！"
balkfm.592.b: "他们应得自由。"

balkfm.630.t: "森林彼岸的土地"
balkfm.630.d: ""
balkfm.630.f: ""
balkfm.630.a: ""
balkfm.630.b: ""
 
balkfm.640.t: "当选的统治者"
balkfm.640.d: "在列强和制宪会议的批准下，[ROOT.GetCountry.GetRuler.GetFullName]被任命为[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。报纸报道称他已经抵达[ROOT.GetCountry.GetCapital.GetCityHubName]。"
balkfm.640.f: "尽管新任[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]对[ROOT.GetCountry.GetName]及其习俗不熟悉，但人民对未来的政治稳定持乐观态度。"
balkfm.640.a: "[ROOT.GetCountry.GetName]必须找到自己的道路。"

balkfm.641.t: "自由主义者的要求"
balkfm.641.d: "#italic Statutul Desvoltător#!的失败促使政治领导人提出了一部新的宪法计划，以应对[ROOT.GetCountry.GetName]的需要。受比利时自由主义的启发，罗马尼亚知识分子希望这将引领国家进入现代化时代。"
balkfm.641.f: "提议的变革在范围上比之前更为谦逊，这次尝试在从西方引进的自由主义与罗马尼亚国家的独特情况之间取得平衡。"
balkfm.641.a: "这是一个崇高的愿景，适合[ROOT.GetCountry.GetName]。"
balkfm.641.b: "这充满了资产阶级的特权气息。"

balkfm.642.t: "普洛耶什蒂的阴谋"
balkfm.642.d: "由于国王拒绝接受宪法限制，一群知识分子在[SCOPE.sCharacter('balkfm_candiano_scope').GetFullName]的领导下，举起旗帜并在#yellow 普洛耶什蒂#宣布起义。当地安全部队已经开始抓捕参与者，但许多人担心[ROOT.GetCountry.GetName]内会出现新一轮的激进主义传播。"
balkfm.642.f: "“我们将走到Cişmigiu另一边的火车站，然后在早上之前乘火车到普洛耶什蒂……在那里，我将不再害怕:我将在我的同类中！所有人都是共和党人，可怜的灵魂！” -选自剧本《Conu Leonida faţă cu reacţiunea》，1880年"
balkfm.642.a: "逮捕这些激进分子。"
balkfm.642.b: "我们不能抵制他们的要求。"
balkfm.642.c: "这个人或许可以更好地利用……"
balkfm.642.tt: "这将减少对国王的支持#bold 20#!。"

balkfm.643.t: "普洛耶什蒂起义被镇压"
balkfm.643.d: "如同其迅速开始，自称的#yellow 普洛耶什蒂共和国#!也迅速被解散，其组织者被逮捕。"
balkfm.643.f: "“在我们的世纪中，一个非常有趣的国家诞生并结束了，没有任何严谨的历史学家应该忽视。我想谈的是普洛耶什蒂共和国，这个国家虽然只存在了十五小时，但它无疑在当代历史上写下了光辉的一页。这个国家是为人民而生、通过人民而生、为人民而亡的。于1870年8月8日凌晨两点左右诞生，在同日下午四点左右被扼杀。没关系！国家的伟大和重要性不是由其面积和持续时间来判断的，而是由它们在普遍体系中所扮演的光辉角色来判断的。” -I. L. Caragiale"
balkfm.643.a: "好消息。"
balkfm.643.tt: "这将增加对国王的支持#bold 20#!。"

balkfm.644.t: "普洛耶什蒂激进主义传播"
balkfm.644.d: "如同其迅速开始，自称的#yellow 普洛耶什蒂共和国#!也迅速被解散，其组织者被逮捕。然而，当地部队的暴行激励了其他人加入共和事业。"
balkfm.644.f: "“……你忘了我是普洛耶什蒂人——是的，普洛耶什蒂人——伙计，我会发动一场革命，但不仅仅是任何一场革命……一场让人记住我的革命……” 选自《D-ale carnavalului》，1885年"
balkfm.644.a: "情况已经失控。"
balkfm.644.tt: "这将减少对国王的支持#bold 20#!。"

balkfm.645.t: "坎迪亚诺共和国"
balkfm.645.d: "激进主义已经压倒了[ROOT.GetCountry.GetAdjective]国家。在激进分子[SCOPE.sCharacter('balkfm_candiano_scope').GetFullName]的带领下，国家开始掌权，并承诺将为[ROOT.GetCountry.GetName]带来一个新的自由主义时代。"
balkfm.645.f: "面对人身威胁，[SCOPE.sCharacter('balkfm_ruler_scope').GetFullName]逃往西方。"
balkfm.645.a: "打倒王冠！"

balkfm.646.t: "君主制得到巩固"
balkfm.646.d: "在欢迎他进入[ROOT.GetCountry.GetName]的政权面前，国王[ROOT.GetCountry.GetRuler.GetFullName]将自己确立为专制统治者。"
balkfm.646.f: "随着公民们在新秩序下排队，阴谋者们被揭露并逮捕。"
balkfm.646.a: "[ROOT.GetCountry.GetName]将有秩序。"
balkfm.646.b: "驱逐这些激进分子。"

balkfm.647.t: "[ROOT.GetCountry.GetName]共和国"
balkfm.647.d: "激进主义已经压倒了[ROOT.GetCountry.GetAdjective]国家。在激进分子[SCOPE.sCharacter('balkfm_candiano_scope').GetFullName]的带领下，国家开始掌权，并承诺将为[ROOT.GetCountry.GetName]带来一个新的自由主义时代。"
balkfm.647.f: "面对人身威胁，[SCOPE.sCharacter('balkfm_ruler_scope').GetFullName]逃往西方。"
balkfm.647.a: "[ROOT.GetCountry.GetName]必须找到自己的道路。"

balkfm.650.t: ""
balkfm.650.d: ""
balkfm.650.f: ""
balkfm.650.a: ""
balkfm.650.b: ""

balkfm.660.t: "罗马尼亚学院"
balkfm.660.d: "为了发展[ROOT.GetCountry.GetName]，国王[SCOPE.sCharacter('university_benefactor').GetFullName]提出了一项在[SCOPE.sState('university_state').GetCityHubName]开办本土高等教育机构的计划。这个计划将代表国家的巨大开支。"
balkfm.660.f: "罗马尼亚学院于1866年在布加勒斯特成立。如今，它是罗马尼亚语言、历史和文化事务的权威机构。"
balkfm.660.a: "一个崇高的事业。"
balkfm.660.b: "费用太高了。"

balkfm.661.t: "皇家庄园"
balkfm.661.d: "经过巨大的努力，#yellow 佩莱什城堡#在[SCOPE.sState('wallachia_state_scope').GetName]完工。为了合法化他的统治，[ROOT.GetCountry.GetRuler.GetFullName]已经开始将他的宫廷搬入这座建筑群。"
balkfm.661.f: "“意大利人是石匠，罗马尼亚人是建筑工，吉普赛人是苦力。阿尔巴尼亚人和希腊人是石匠，德国人和[concept_magyar]是木匠。土耳其人在烧砖。工程师是波兰人，石雕匠是捷克人。法国人在绘图，英国人在测量，所以那时你可以看到数百种民族服饰和十四种语言，他们用所有方言和语调说话、唱歌、咒骂和争吵，形成了一个愉快的混合体，包括人、马、牛车和家牛。” -伊丽莎白女王"
balkfm.661.a: "太棒了。" 
balkfm.670.t: "形式而无实质"
balkfm.670.d: "关于罗马尼亚身份的辩论在文学界达到了白热化的程度。学者[SCOPE.sCharacter('balkfm_mairoescu_scope').GetFullName]抨击了所谓的罗马尼亚国家的'鲁莽'现代化，声称自由主义在[ROOT.GetCountry.GetName]没有基础，因为它是一个没有扎根的资产阶级阶层的农民和地主的国家。"
balkfm.670.f: "Mairoescu及其支持者聚集在一个名为'Junimea'的文学俱乐部周围。声称要捍卫真正的罗马尼亚身份，他们在立法倒退和拒绝理想化的罗马尼亚过去的要求之间，成为罗马尼亚保守主义的焦点。"
balkfm.670.a: "但我们一直是罗马尼亚人..."

balkfm.671.t: "罗马尼亚的大词典"
balkfm.671.d: "著名的罗马尼亚历史学家[SCOPE.sCharacter('balkfm_hasdeu_scope').GetFullName]在其最新的关于罗马尼亚语言的出版物之后，成为了#yellow Junimist#!运动的目标。尽管如此，他仍然坚持认为，罗马尼亚人民一直以来并将继续成为欧洲创新的主要力量。"
balkfm.671.f: "罗马尼亚的自由思想基于一种自我认定的罗马尼亚'开创精神'，他们声称这种精神推动了罗马尼亚在历史上的主导地位。这一学派被称为#yellow 达契亚主义#!，认为罗马尼亚人民自罗马达契亚时代以来一直在政治和科学领域处于前沿。尽管缺乏支持这一观点的确凿证据。"
balkfm.671.a: "确实是'开创精神'..."

balkfm.672.t: "罗马尼亚的身份"
balkfm.672.d1: "#yellow Junimist#!运动的胜利为统一的罗马尼亚身份奠定了基础。在地主和农民之间取得平衡后，罗马尼亚人开始将自己视为通过达契亚农业主义和罗马政治家的融合而进化的民族。"
balkfm.672.d2: "#yellow 达契亚#!运动的胜利为统一的罗马尼亚身份奠定了基础。放弃了想象中的'农业主义枷锁'，罗马尼亚人被他们是一个自罗马殖民者首次踏足未来的罗马达契亚以来的进步和创新的丰富传统的继承人的叙述所吸引。"
balkfm.672.f1: "“唯一真正的社会阶级是罗马尼亚农民，他的现实是痛苦的。他的叹息是由上层阶级的幻想引起的，因为正是他的日常汗水，提供了支持我们称之为罗马尼亚文化的虚构结构的物质手段。我们迫使他付出自己最后的一点力量来支付我们的画家和音乐家，学院和雅典娜成员，以及各地颁发的文学和科学奖项。而我们至少没有生产出一件能在片刻间提升他的精神并让他忘却日常苦难的艺术作品。” -T. Mairoescu"
balkfm.672.f2: "“...在我被迫孤独的残酷孤独中，只有这部罗马尼亚人民的巨大百科全书，只有与整个民族精神的每日接触，只有我独自完成甚至我的敌人也承认没有人能够做到的事，这才挽救了我免于毁灭的丑陋。用罗马皇帝的话来说，我感觉自己在成为神，感觉到这一点 - 我感觉像在笑。” -B. Hasdeu"
balkfm.672.a: "[ROOT.GetCountry.GetName]不会放弃她的根基。"
balkfm.672.b: "[ROOT.GetCountry.GetName]将开创新的未来。"

balkfm.673.t: "帝国的回声"
balkfm.673.d: "随着[GetCulture('romanian').GetName]人民开始理解自己作为一个单一民族，许多人开始质疑[ROOT.GetCountry.GetName]在东欧政治景观中的角色。随着民族主义在民众中扎根，复辟主义者宣称我们是唯一真正的#yellow 罗马帝国#!的继承者。"
balkfm.673.f: "我们已经摆脱了希腊人、俄罗斯人和奥斯曼帝国的压迫。现在我们必须决定我们在巴尔干共同体中的位置。"
balkfm.673.a: "我们将重新夺回帝国的王座！"
balkfm.673.b: "我们应该为我们的成就感到自豪。"

balkfm.674.t: "城市之王"
balkfm.674.d: "随着跨越博斯普鲁斯海峡和达达尼尔海峡的土地的征服，重建拜占庭帝国的目标已经实现。我们的公民现在期待国家带领他们进入一个新的时代。"
balkfm.674.f: "古代的帝国首都君士坦丁堡现在在我们控制之下。没有人可以质疑我们对拜占庭王座的合法性。"
balkfm.674.a: "我们的军队将再次举起帝国的旗帜！"

balkfm.675.t: "金鹰展翅"
balkfm.675.d: "教堂钟声响起，人们欢呼，当[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]宣布[ROOT.GetCountry.GetName]复兴时，#bold数千人#!涌上街头。在[SCOPE.sBuilding('hagia_sofia_scope').GetName]的宏伟存在下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]被赋予了东罗马皇帝的旧徽章和徽章。走向市民、贵宾和神职人员的队伍，[ROOT.GetCountry.GetRuler.GetFirstName]成为希腊人民未来的灯塔。"
balkfm.675.f: "自罗马和君士坦丁堡失落以来，数个世纪的无数尝试失败了，但今天帝国再次复兴。然而，还有许多工作要做:许多希腊人被异教徒和异教徒统治，前罗马的土地仍然被外国冒充者所掌握，数不清的拜占庭宝藏被扣押在国外。如果[ROOT.GetCountry.GetRuler.GetSheHe]要为[ROOT.GetCountry.GetName]带来荣耀，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须确保满足其臣民的期望。"
balkfm.675.a: "从灰烬中，我们崛起。"

balkfm.676.t: "帝国的后裔"
balkfm.676.d: "我们的努力结出了果实，[ROOT.GetCountry.GetName]复兴了。现在，几种声音呼吁恢复希腊人手中的前拜占庭土地以恢复[ROOT.GetCountry.GetAdjectiveNoFormatting]的权力和威望。决定[ROOT.GetCountry.GetAdjectiveNoFormatting]国家未来的重任落在了[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]肩上。"
balkfm.676.f: "“希腊王国不是希腊；它只是希腊的一部分:最小、最贫穷的部分。希腊不仅是王国的居民，也是约阿尼纳、塞萨洛尼基、塞雷斯、阿德里安堡、君士坦丁堡、特拉比松、克里特岛、萨摩斯岛或任何其他属于希腊历史或希腊种族的地区的居民...希腊有两个伟大的中心。雅典是王国的首都。君士坦丁堡是伟大的首都，是所有希腊人的梦想和希望。” -I. Kolettis, 1844"
balkfm.676.a: "我们将恢复[ROOT.GetCountry.GetName]的荣耀。"
balkfm.676.b: "我们将限制自己在安纳托利亚。"
balkfm.676.c: "我们将限制自己在巴尔干地区。"

balkfm.677.t: "新罗马君士坦丁堡"
balkfm.677.d: "随着安纳托利亚和巴尔干地区牢牢掌握在我们手中，帝国的旧心脏地带已经收复！"
balkfm.677.f: "几乎一千年前，皇帝伊萨克一世·科穆宁庄严地带领帝国进入一个新的强大和荣耀的时代。随着旧心脏地带的收复，东罗马帝国的核心已经恢复，东正教牧首的座位也已恢复。"
balkfm.677.a: "向皇帝致敬！荣耀归于拜占庭！"

balkfm.678.t: "东方的罗马"
balkfm.678.d: "希腊人民的古代心脏地带现在在我们的控制之下。[ROOT.GetCountry.GetAdjectiveNoFormatting]宫廷中的显要人物呼吁将曾经是基督教堡垒的埃及和黎凡特重新纳入帝国的教区。"
balkfm.678.f: "两千多年来，希腊文化在东地中海地区占据主导地位。今天，古老的希腊城市成了废墟，曾经的基督教堡垒在穆斯林统治者的手中凋零。"
balkfm.678.a: "我们将收复东部帝国。"
balkfm.678.b: "我们已经收复了希腊的心脏地带。这就够了。"

balkfm.679.t: "罗马尼亚帝国"
balkfm.679.d: "随着东部帝国在我们统治之下，我们的人民将目光投向了被冒充者和异教徒占据的边界之外的土地。政客和煽动者呼吁[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]领导[ROOT.GetCountry.GetName]进入这个新时代。"
balkfm.679.f: "“随着岁月流逝，随着时间的推移，它们终将再次属于我们。”\n-希腊民族主义诗歌"
balkfm.679.a: "我们将收复永恒之城。"
balkfm.679.b: "我们必须关注我们的公民。"

balkfm.900.f: "“伊利里亚只有一种真正的文学语言……它不仅存在于一个地方或一个国家，而是在整个伊利里亚……我们的语法和我们的词典是整个伊利里亚。在那片巨大的花园里到处都是美丽的花朵:让我们把最好的一切汇聚成一个永不凋谢的花环。” -L. Gaj, 1835"
balkfm.900.a: "[ROOT.GetCountry.GetName]将找到自己的道路。"

balkfm.910.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting]国家崛起"
balkfm.910.d: "经过无数代人对抗[SCOPE.sCountry('austria_scope').GetAdjective]和[SCOPE.sCountry('ottoman_scope').GetAdjective]统治的斗争，[ROOT.GetCountry.GetName]终于宣告独立。无论是接受南斯拉夫主义的事业还是开辟自己的道路，[ROOT.GetCountry.GetAdjectiveNoFormatting]人民终于可以期待一个属于他们自己的未来。"
balkfm.910.f: "“伊利里亚只有一种真正的文学语言……它不仅存在于一个地方或一个国家，而是在整个伊利里亚……我们的语法和我们的词典是整个伊利里亚。在那片巨大的花园里到处都是美丽的花朵:让我们把最好的一切汇聚成一个永不凋谢的花环。” -L. Gaj, 1835"
balkfm.910.a: "[ROOT.GetCountry.GetName]将找到自己的道路。"

balkfm.562.t: "教会敌对"
balkfm.562.d: ""
balkfm.562.f: ""
balkfm.562.a: "将这个骗子赶出宫廷。"
balkfm.562.b: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]对[GetReligion('orthodox').GetName]信仰知之甚少。
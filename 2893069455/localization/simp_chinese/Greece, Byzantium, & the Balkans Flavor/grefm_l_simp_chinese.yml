notification_grefm_greek_revolt_name: "希腊分离主义起义！"
notification_grefm_greek_revolt_desc: "巴尔干半岛的希腊分离主义者脱离了他们的统治者，现在寻求与希腊国家的联合。这提高了 #o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')] 分离主义紧张情况#! 的程度，增加了 #red #bold 25#!。"
notification_notitification_grefm_separatism_received_name: "希腊分离主义"
notification_notitification_grefm_separatism_received_desc: "[GetCulture('greek').GetName] 分离主义者正在我们一个州内活跃。如果我们不能控制激进主义，很快我们可能会面临起义。"
notification_notification_grefm_steady_progress_name: "挖掘进展顺利进行中"
notification_notification_grefm_steady_progress_desc: "主管工程师报告称，进行中的挖掘项目进展比预期快。监督人员表示，该项目现在预计将提前 #bold #green 2 个月#! 完成。"
notification_notification_grefm_minor_collapse_name: "挖掘现场泥石流"
notification_notification_grefm_minor_collapse_desc: "当地报纸报道了挖掘现场发生的轻微泥石流。工程师们指责异常高的降水量。挖掘项目被推迟了 #bold #red 4 个月#!。"
notification_notification_grefm_major_collapse_name: "挖掘现场灾难！"
notification_notification_grefm_major_collapse_desc: "多份报道称发生了大规模的泥石流和结构性崩塌，造成数十名工人丧生，并且大部分现场被埋在地下。挖掘项目被推迟了 #bold #red 12 个月#!。"
notification_notification_grefm_popular_interest_name: "挖掘项目受到民众关注"
notification_notification_grefm_popular_interest_desc: "周围地区出现了越来越多的人群，围观挖掘项目。无论是儿童还是成人都纷纷前来观看这一壮观景象。一些人甚至加入到我们的劳工中来帮助。"
notification_notification_grefm_palace_discovered_name: "挖掘现场发现宫殿遗址"
notification_notification_grefm_palace_discovered_desc: "挖掘现场的工程师们发现了一系列古老的基础，初步标识为一个古代贵族统治者的宫殿。预计会有大量古代文物被挖掘出来，并送至考古学会的办公室。"

# scripted buttons
grefm_dismiss_auxilliaries_button: "解散巴伐利亚辅助军"
grefm_dismiss_auxilliaries_button_desc: "巴伐利亚士兵和军官主导了希腊军队，引发了他们与当地新兵之间的不和。改革者呼吁将这些部队驱逐出希腊武装力量。"
grefm_release_nikitaras_button: "释放尼基塔拉斯"
grefm_release_nikitaras_button_desc: "尼基塔斯·斯塔马特洛普洛斯因其在希腊独立战争期间的英勇表现而成为民族英雄。然而，他因强烈反对巴伐利亚政府而在摄政议会期间被监禁。至今，他仍有忠实的支持者渴望他的释放。"
 grefm_authorize_palace_button: "资助皇宫建设"
grefm_authorize_palace_button_desc: "在许多方面，巴伐利亚宫廷试图合法化其在希腊国家的存在。国王议会中的几位成员建议建造一座适当的皇家住所，以承认他们对 [ROOT.GetCountry.GetName] 的持续统治。"

grefm_philhellenic_loan_button: "寻求爱希腊贷款"
grefm_philhellenic_loan_button_desc: "爱希腊人，即古希腊文化和艺术的崇拜者，曾资助希腊革命。欧洲西部的几个爱希腊组织已承诺向这个年轻国家提供资金支持。"

grefm_epirus_support_button: "支持爱琴海叛军"
grefm_epirus_support_button_desc: "爱琴海与塞萨利是、曼纳一样是希腊文化的核心地带。他们与希腊国家的接近只增加了他们对摆脱土耳其统治的渴望。"

grefm_epirus_cease_button: "停止对爱琴海的支持"
grefm_epirus_cease_button_desc: "停止对爱琴海的支持将释放我们的资源用于其他事务。"

grefm_epirus_provoke_button: "煽动爱琴海起义"
grefm_epirus_provoke_button_desc: "我们可以直接支持爱琴海的增长反抗。如果我们这样做，他们将能够反抗奥斯曼帝国。"

grefm_macedonia_support_button: "支持马其顿叛军"
grefm_macedonia_support_button_desc: "随着希腊影响力在巴尔干地区的扩展，生活在穆斯林统治下的希腊人开始梦想与希腊国家更大联合。马其顿曾是古希腊文化的核心，拥有大量希腊人口。这些希腊人不仅渴望自由，而且认为这是可以实现的。"

grefm_macedonia_cease_button: "停止对马其顿的支持"
grefm_macedonia_cease_button_desc: "停止对马其顿的支持将释放我们的资源用于其他事务。"

grefm_macedonia_provoke_button: "煽动马其顿起义"
grefm_macedonia_provoke_button_desc: "由于他们接近我们的边界，我们可以为沿海马其顿日益增长的反叛提供支持。"

grefm_skopia_support_button: "支持马其顿叛军"
grefm_skopia_support_button_desc: "随着希腊影响力在巴尔干地区的扩展，生活在穆斯林统治下的希腊人开始梦想与希腊国家更大联合。马其顿曾是古希腊文化的核心，拥有大量希腊人口。这些希腊人不仅渴望自由，而且认为这是可以实现的。"

grefm_skopia_cease_button: "停止对马其顿的支持"
grefm_skopia_cease_button_desc: "停止对马其顿的支持将释放我们的资源用于其他事务。"

grefm_skopia_provoke_button: "煽动北马其顿起义"
grefm_skopia_provoke_button_desc: "由于他们接近我们的边界，我们可以为北马其顿日益增长的反叛提供支持。"

grefm_smyrna_support_button: "支持伊兹密尔叛军"
grefm_smyrna_support_button_desc: "尽管与雅典和吕姆利分开，伊兹密尔的希腊人渴望与希腊国家联合。我们在爱琴海的深厚商业联系使得直接支持对我们来说是一个微不足道的事情。"

grefm_smyrna_cease_button: "停止对伊兹密尔的支持"
grefm_smyrna_cease_button_desc: "停止对伊兹密尔的支持将释放我们的资源用于其他事务。"

grefm_smyrna_provoke_button: "煽动伊兹密尔起义"
grefm_smyrna_provoke_button_desc: "伊兹密尔的激进主义正在成熟。如果国家批准，援助可以一夜之间涌入伊兹密尔的港口。"

grefm_cyprus_support_button: "支持塞浦路斯叛军"
grefm_cyprus_support_button_desc: "随着民族主义浪潮在世界各地蔓延，塞浦路斯的希腊人向 [ROOT.GetCountry.GetName] 请求援助。尽管距离希腊国家遥远，塞浦路斯在数千年来一直是希腊人的多数派。希腊塞浦路斯人希望摆脱穆斯林的迫害。"

grefm_cyprus_cease_button: "停止对塞浦路斯的支持"
grefm_cyprus_cease_button_desc: "停止对塞浦路斯的支持将释放我们的资源用于其他事务。"

grefm_cyprus_provoke_button: "煽动塞浦路斯起义"
grefm_cyprus_provoke_button_desc: "我们可以直接支持塞浦路斯日益增长的反叛。如果我们提供援助，他们将能够为独立而战斗。"

grefm_crete_support_button: "支持克里特叛军"
grefm_crete_support_button_desc: "克里特岛上的紧张局势正在加剧。由于克里特岛未能被纳入希腊国家，民族主义者一直在煽动克里特人中的不安。欧洲各地的爱希腊人已经承诺支持我们如果我们寻求推进克里特事业。"

grefm_crete_cease_button: "停止对克里特的支持"
grefm_crete_cease_button_desc: "停止对克里特的支持将释放我们的资源用于其他事务。"

 
grefm_crete_provoke_button: "煽动克里特起义"
grefm_crete_provoke_button_desc: "多年来，克里特岛的紧张局势不断加剧。克里特人恳求希腊国家即使只有最微小的支持迹象，也愿意持武器而起。"


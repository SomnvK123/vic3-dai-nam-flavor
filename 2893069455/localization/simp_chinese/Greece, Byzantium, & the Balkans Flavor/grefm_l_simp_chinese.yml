 grefm_epirus_agitate_button: "煽动伊庇鲁斯的叛乱分子"
 grefm_epirus_agitate_button_desc: "我们可以直接向伊庇鲁斯的义军提供物资。如果我们这样做，他们就能拿起武器反抗奥斯曼帝国。"
 grefm_cyprus_agitate_button: "煽动塞浦路斯的叛乱分子"
 grefm_cyprus_agitate_button_desc: "我们可以直接向塞浦路斯的义军提供物资。如果我们这样做，他们就能拿起武器反抗奥斯曼帝国。"
 grefm_macedonia_agitate_button: "煽动马其顿的叛乱分子"
 grefm_macedonia_agitate_button_desc: "由于马其顿靠近我国边境的缘故，我们可以为马其顿义军提供补给。"
 grefm_epirus_provoke_button: "煽动伊庇鲁斯起义"
 grefm_epirus_provoke_button_desc: "我们的间谍一直在伊庇鲁斯煽动动乱。我们目前的策略是是等到奥斯曼人被其他地方的冲突分心在发动起义。当然，如果您愿意的话，也可以立即发动起义，虽然这可能会面临朴特的全面干预"
 grefm_cyprus_provoke_button: "煽动塞浦路斯起义"
 grefm_cyprus_provoke_button_desc: "我们的特工已经准备好了在塞浦路斯发动起义。目前，他们正等着现任统治者被卷入另一场冲突，当然，我们也可以立即发动起义"
 grefm_macedonia_provoke_button: "煽动马其顿起义"
 grefm_macedonia_provoke_button_desc: "游击队已经占据了他们的阵地，义军们也经常越过边境进行袭击。目前，我们的特工正等待奥斯曼人因另一场冲突而分心。不过，如果对我们的计划有利，我们可以立即发动起义"
 grefm_crete_agitate_button: "煽动克里特岛骚乱"
 grefm_crete_agitate_button_desc: "欧洲赞同希腊起义的义士们的时候支持我们收复克里特岛，这会使得下一次克里特起义的气势将升高#red 20#!，你只能在气势低于130的时候使用。"
 grefm_crete_agitate_tt: "克里特起义的气势将升高#red 20#!。你只能在距离起义还有一年多的时间时才能使用"
 grefm_crete_provoke_tt: "多年来，克里特岛的紧张局势不断加剧。克里特人只要看到希腊国哪怕是一丁点的支持，他们就会拿起武器。"

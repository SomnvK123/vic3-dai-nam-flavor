 concept_eastern_question: "东方问题"
 concept_eastern_question_desc: "东方问题是奥斯曼帝国的衰落造成的政治动荡。随着帝国从内部慢慢崩溃，[Concept('concept_great_power','$concept_great_powers$')]努力寻找战略和政治解决方案，在不破坏[Concept('concept_concert_of_europe','$concept_concert_of_europe$')]的同时扩大自身影响力。"
 concept_concert_of_europe: "欧洲协调"
 concept_concert_of_europe_desc: "欧洲协调是一项非正式的政治结构与权力屏风，它赋予每个国家[Concept('concept_rank','$concept_rank$')]，并为[Concept('concept_great_power','$concept_great_power$')]划定势力范围，以避免导致法国大革命与拿破仑战争的情况再度产生。"
 grefm_objective: "希腊与拜占庭"
 grefm_objective_desc: "从动荡走向独立，发展新生的#o 希腊#!国家。希腊身处奥斯曼帝国与跋扈列强的夹缝之中，但克服这些挑战将使你有机会引领希腊走向世界舞台，甚至重建#o 拜占庭帝国#!！\n\n内容大多关于希腊与#bold 君主制#!的斗争以及#greece 伟大理想#!，但如果你选择成立#o 拜占庭#!，可以选择走上#purple 重建罗马帝国#!，#green 对希腊化地区发动十字军#!，或是#yellow 主宰正教徒#!的道路之一。"
 grefm_objective_name_GRE: "#v $GRE$#!"
 grefm_objective_desc_GRE: "#lore #bold 君士坦丁堡的陷落#!终结了希腊对近东长达3000多年的统治。当今的希腊初获独立，但动荡不安且贫瘠落后。奥斯曼帝国治下数百年的剥削和停滞给希腊留下了效率低下的政府，且大部分人口都是农民。你是要走上专制道路，还是要倾听人民的自由呼声？你会高举光复故土的旗帜，为爱琴海彼岸的希腊人民带来自由和繁荣吗？"
 grefm_objective_idle_header: ""
 grefm_objective_idle_hint: ""

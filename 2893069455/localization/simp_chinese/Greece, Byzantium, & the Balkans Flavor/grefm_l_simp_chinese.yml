l_simp_chinese:
 je_grefm_bavarocracy_main: "巴伐利亚统治"
 je_grefm_bavarocracy_main_reason: "维特尔斯巴赫家族企图以在希腊建立专制。与此同时，公民和政客都在抗议国家的停滞不前和猖獗腐败。"
 je_grefm_bavarocracy_main_status: "引领[ROOT.GetCountry.GetName]人民走向自由或专制。"
 je_grefm_greek_constitution: "颁布宪法"
 je_grefm_greek_constitution_reason: "摄政委员会以年轻的奥托国王之名义接管国家时，曾承诺制定一部限制国王权力并为人民提供良好治理的宪法。然而，自从国王登基以来，他一直在宫廷中保留权力，并拒绝召开任何形式的国民大会。无论是政治家还是普通公民，都在要求国王兑现他的承诺。"
 je_grefm_land_reform: "改革奥斯曼土地制度"
 je_grefm_land_reform_reason: "奥斯曼帝国统治时期的遗留问题之一是税收仍然以土地为基础，而田间劳作者的税赋最重。虽然法那尔贵族赞同这种制度，但它对希腊的未来是一种阻碍。"
 je_grefm_brigandage: "铲除强盗"
 je_grefm_brigandage_reason: "1834年，麦西尼亚发生了反对摄政委员会的叛乱，几位首领召集了希腊独立战争的老兵。他们突然被解职后，许多非正规武装未能得到许诺的军职，转而袭击希腊的农村地区。尽管得到了巴伐利亚的援助，强盗仍然是乡村地区长期存在的问题。"
 je_grefm_civic_tradition: "建立公务员制度"
 je_grefm_civic_tradition_reason: "自摄政委员会时代起，地主贵族就利用宪法结构的缺失让自己的亲信掌权。这导致希腊社会各阶层腐败猖獗。"
 je_grefm_the_tyranny_of_house_wittelsbach: "维特尔斯巴赫僭主"
 je_grefm_the_tyranny_of_house_wittelsbach_reason: "王室违背[ROOT.GetCountry.GetAdjectiveNoFormatting]的意愿加强权力，随着激进主义在街头兴起，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]亟需确保自己统治的合法性。"
 je_grefm_the_tyranny_of_house_wittelsbach_goal: "在没有内战的前提下将这些法律保持5年。"
 je_grefm_megali_idea: "伟大理想"
 je_grefm_megali_idea_reason: "希腊世界的版图曾从巴尔干半岛的海岸线延伸至地中海东部的黎凡特海岸。在地中海各地，希腊人民呼唤着与希腊国家的统一。我们即将见证希腊领土的重塑与复兴。"
 je_grefm_corinth_canal_survey: "科林斯运河勘测"
 je_grefm_corinth_canal_survey_reason: "对科林斯运河的勘测已经展开。工程师们对开凿一条横跨地峡的航道以实现千年以来的梦想持乐观态度。"
 je_grefm_corinth_canal_survey_goal: "等待勘测完成……"
 je_grefm_intro: "欢迎游玩希腊与拜占庭风味模组！"
 je_grefm_intro_reason: "这个日志条目会自行关闭，随它去吧。"
 grefm_corinth_canal_decision: "勘测科林斯地峡"
 grefm_corinth_canal_decision_desc: "科林斯地峡自古以来连接起了伯罗奔尼撒半岛与希腊的其余国土。随着现代工程技术和炸药技术的革新，我们或许能够联通爱奥尼亚海和爱琴海。"
 grefm_annex_epirus_decision: "吞并伊庇鲁斯"
 grefm_annex_epirus_decision_desc: "伊庇鲁斯人民从奥斯曼手中争得了自由并加入希腊国。我们应该欢迎他们的回归。"
 grefm_annex_cyprus_decision: "吞并塞浦路斯"
 grefm_annex_cyprus_decision_desc: "塞浦路斯人民推翻了土耳其压迫者，要求与希腊国家联合。"

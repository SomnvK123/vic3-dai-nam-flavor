je_grefm_regency_council: "摄政议会"
je_grefm_regency_council_reason: "当各大国认为年幼的国王[ROOT.GetCountry.GetRuler.GetFullName]适合统治重新建立的希腊国家时，他仍未成年。年轻的君主在完成教育并开始适应未来职位时，日常行政事务由一个由巴伐利亚贵族主导和资助的三人摄政议会代理。在巴伐利亚国王路德维希一世的建议下，摄政王们不愿在年幼的国家引入宪政治理。\n\n随着[ROOT.GetCountry.GetRuler.GetFirstName]准备在自己的权力下登基，显赫的摄政王[GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName]集中了国家权力，企图安排自己及其后代成为[ROOT.GetCountry.GetName]的统治者。自掌控摄政权以来，他狠毒地挑拨新兴政党和同事之间的关系，使国家所有职能陷入瘫痪。"
je_grefm_regency_council_tt: "奥托解散了摄政议会。"
je_grefm_regency_council_complete_tt: "触发事件 #white #bold 解散摄政议会#!#!"
je_grefm_bavarocracy_main_sources: "当前进展的变化原因如下：\n• [GetPlayer.MakeScope.Var('grefm_ruler_popularity_var').GetValue|+=] 自国王的声望。[Country.GetCustom('grefm_bavarocracy_constitution_type')] [Country.GetCustom('grefm_bavarocracy_land_reform_type')] [Country.GetCustom('grefm_bavarocracy_brigandage_type')] [Country.GetCustom('grefm_bavarocracy_civic_tradition_type')] [Country.GetCustom('grefm_bavarocracy_bavarian_auxiliaries_type')] [Country.GetCustom('grefm_bavarocracy_heir_faith_type')] [Country.GetCustom('grefm_bavarocracy_nikitas_released_type')] [Country.GetCustom('grefm_bavarocracy_royal_palace_type')]"
je_grefm_bavarocracy_main_complete_tt: "触发事件 #white #bold 十月革命#!#!"
je_grefm_the_tyranny_of_house_wittelsbach_status: "国王获得了 #bold #greece [GetPlayer.MakeScope.Var('grefm_tyranny_var').GetValue]/100#!#! 的支持。"
je_grefm_the_tyranny_of_house_wittelsbach_sources: "以下因素影响每月的进展：\n• [GetPlayer.MakeScope.Var('grefm_tyranny_support_var').GetValue|+=] [Concept('concept_interest_group', '$concept_interest_groups$')] 支持 #yellow 专制主义#!。\n• [GetPlayer.MakeScope.Var('grefm_tyranny_opposition_var').GetValue|+=] [Concept('concept_interest_group', '$concept_interest_groups$')] 反对 #yellow 专制主义#!。\n• [GetPlayer.MakeScope.Var('grefm_tyranny_laws_var').GetValue|+=] 实施了 #yellow 专制主义#!、#yellow 世袭制#! 或 #yellow 任命官僚#!，以及 #yellow 农奴制#! 或 #yellow 租户农民#!。\n• [GetPlayer.MakeScope.Var('grefm_tyranny_popularity_var').GetValue|+=] 来自国王的声望。"
je_grefm_bavarian_greece: "巴伐利亚式的希腊"
je_grefm_bavarian_greece_reason: "经过一代人的反对君主制，改革的精神在希腊广泛传播。改革者要求国王必须任命一个拥有多数政治权力的政府领导人，而不是由他们在国王面前的亲近度决定。与此同时，君主主义者宣称唯一的前进道路是由王室强力领导。"
je_grefm_bavarian_greece_goal: "维持这些条件五年。"
je_grefm_bavarian_greece_tt: "维持这些条件五年。"
je_grefm_grecoturkism: "希土主义"
je_grefm_grecoturkism_reason: "尽管我们在经历了几个世纪的帝国统治后互相侮辱，我们决定为[ROOT.GetCountry.GetName]铺平道路。尽管我们的文化彼此熟悉，但这个过程将需要时间。"
je_grefm_grecoturkism_goal: "这个过程将需要时间..."

je_grefm_greek_nationalism: "希腊民族主义"
je_grefm_greek_nationalism_reason: "希腊人民已存在几千年，但从古代希腊城邦到多民族的罗马、拜占庭和奥斯曼帝国，希腊民众从未拥有过一种真正重视自己家乡村庄和地区的国家。在启蒙思想的推动下，运动已经兴起，旨在将希腊人民团结起来，形成真正的共同身份认同。"
je_grefm_national_language: "民族语言"
je_grefm_national_language_reason: "由于时间、距离和帝国的分裂，更广泛的希腊人口已经从前奥斯曼时期讲的希腊语言中分化出来。今天的学者们一直在深入讨论，是否应该容忍土耳其语对希腊语言的侵入，或者任何与科因希腊语言偏离的情况。"
je_grefm_the_womens_journal: "女性杂志"
je_grefm_the_womens_journal_reason: "由卡里罗伊·帕伦主导，并得到更大的女权主义运动的支持，希腊全国的女性渴望得到更好的对待。历史上，她们被视为不过是家庭主妇，但女性们寻求在推动希腊民族主义事业中扮演自己的角色。《女性杂志》这一出版物充当了这一运动的先驱，提出了女性应该拥有自己的财产，孩子不应该被放在工厂的地板上的观点。"
je_grefm_greek_separatism_main: "希腊分裂主义"
je_grefm_greek_separatism_main_reason: "希腊人口从他们在阿提卡、色萨利和爱琴海岛屿的核心地区延伸到达到的边缘人口，达到地中海和黑海。随着民族主义的兴起和希腊国家的独立，这些人民已经开始渴望与新成立的希腊国家统一。在我们的支持下，他们可能能够起来反抗他们的压迫者。"
je_grefm_greek_separatism_crete_status: "希腊克里特岛起义！具有 #bold #tooltippable #tooltip:[GetRawTextTooltipTag('grefm_crete_progress_tt')] [GetGlobalVariable('grefm_crete_revolt_var').GetValue]/200#!#!#! 动力。"
je_grefm_greek_separatism_sub: "希腊分裂主义"
je_grefm_greek_separatism_sub_reason: "希腊人口从他们在阿提卡、塞萨利和爱琴海岛屿的核心地区延伸到达到的边缘人口，达到地中海和黑海。随着民族主义的兴起和希腊国家的独立，这些人民已经开始渴望与新成立的希腊国家统一。如果我们不能使他们安抚下来，他们可能会起来反抗我们。"

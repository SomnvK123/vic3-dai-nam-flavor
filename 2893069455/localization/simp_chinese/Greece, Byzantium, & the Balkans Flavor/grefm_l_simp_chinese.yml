 je_grefm_archaeology_mgr_reason: "巴尔干与安纳托利亚遍布史前和古典希腊文明的遗址。我们希腊人民有责任夺回这些遗产。#blue 使用#!#red 赤色晨曦#!#blue 界面进行发掘。#!\n\n现在，你拥有#variable [GetPlayer.MakeScope.Var('lepsius_local_artifact_minor').GetValue]#!件#o 本地文物#!与#variable [GetPlayer.MakeScope.Var('lepsius_aegean_artifact_minor').GetValue]#!件#o 爱琴海文物#!。"

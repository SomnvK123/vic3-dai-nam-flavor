custom_grefm_crete_momentum: "\n\n同时，自从1200年代拜占庭帝国被夺取该岛以来，克里特希腊人一直抵抗非正教统治。目前，起义已经积累了 #blue #bold [GetGlobalVariable('grefm_crete_revolt_var').GetValue]#!#! 动力。预计下个月将会有所变化。下一次起义将在动力达到 #bold 200#! 时发生。"


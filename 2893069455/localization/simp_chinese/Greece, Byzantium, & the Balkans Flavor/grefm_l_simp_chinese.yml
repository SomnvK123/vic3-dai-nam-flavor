 je_group_grefm_content: "希腊风味"
 je_group_grefm_monarchism: "希腊君主制"
 je_group_grefm_venizelos: "韦尼泽洛斯主义"
 je_group_grefm_megali_idea: "伟大理想"
 je_group_grefm_nationalism: "希腊民族主义"
 je_grefm_the_dedilomeni_principle: "德迪洛梅尼原则"
 je_grefm_the_dedilomeni_principle_reason: "在经历了两次反对君主制的起义之后，改革精神在希腊广泛传播。改革者要求授权国王任命一位拥有多数派系支持的政府领导人，而不是通过国王的青睐来选择领导人。"
 je_grefm_the_dedilomeni_principle_goal: "保持合法五年年。"
 je_grefm_the_dedilomeni_principle_tt: "将这些条件保持5年。"
 je_grefm_the_dedilomeni_principle_otto_alternate: "巴伐利亚人的希腊"
 je_grefm_the_dedilomeni_principle_otto_alternate_reason: "在经历了一代人对君主制的抵抗之后，改革的精神在希腊已经深入人心。改革派要求国王必须任命一个拥有政治多数权力的政府领袖，而不是根据国王的个人偏好来选择领导人。与此同时，君主主义者坚称，国家的发展唯有依靠国王的坚定领导才能实现。"
 je_grefm_the_dedilomeni_principle_otto_alternate_tt: "日志的成果将取决于哪一组法律的实施。"
 je_grefm_the_dedilomeni_principle_otto_alternate_goal: "专制还是民主"
 je_grefm_the_dedilomeni_principle_byzantium_alternate: "皇帝"
 je_grefm_the_dedilomeni_principle_byzantium_alternate_reason: "拜占庭王朝已重现辉煌，悠久的希腊行政传统历经四千年沧桑而延续至今。在希腊国家逐步围绕皇室法庭重塑其体制之际，无论是政治家还是普通市民，都对即将形成的帝国行政架构充满了期待与好奇。"
 je_grefm_the_military_league: "军事同盟"
 je_grefm_the_military_league_reason: "受克里特岛的合并运动和重新统一希腊民族的梦想驱使，我国的一群军国主义极端分子制定了一个推翻政府、让自己掌权的计划。如果他们成功了，他们打算重新组织希腊国，并推进“伟大理想"的事业。"
 je_grefm_the_military_league_goal: "军事同盟正在准备……"
 je_grefm_venizelism_main: "韦尼泽洛斯主义"
 je_grefm_venizelism_main_reason: "在埃莱夫塞里奥斯·韦尼泽洛斯的领导下，希腊国家迎来了一个剧烈变革的新纪元。民族主义的热潮席卷人心，韦尼泽洛斯及其追随者们立志将希腊推上世界舞台，对列强的善变和干涉置若罔闻。#italic 安卡拉！安卡拉！#!"
 je_grefm_venizelism_tt1: "完成希腊民族起源"
 je_grefm_venizelism_tt2: "完成公民复兴"
 je_grefm_venizelism_tt3: "完成军事复兴"
je_grefm_venizelism_tt4: "完成社会复兴"
je_grefm_venizelism_tt5: "完成学术复兴"
je_grefm_venizelism_civics: "韦尼泽洛斯主义：公民复兴"
je_grefm_venizelism_civics_reason: "希腊国家自从摆脱奥斯曼帝国的独立以来已经走过了漫长的道路。现在，得益于维尼泽洛斯的重新激励，修正主义者希望建立起一个能够与西欧相媲美的国家体系。"
je_grefm_venizelism_military: "韦尼泽洛斯主义：军事复兴"
je_grefm_venizelism_military_reason: "希腊革命期间匆忙组建的半正规的 Evzones 部队的记忆已经很少了。随着规划者们展望未来，希腊在巴尔干地区拥有一席之地，一个纪律严明、能力出众的军队将是确保这一结果的关键。"
je_grefm_venizelism_society: "韦尼泽洛斯主义：社会复兴"
je_grefm_venizelism_society_reason: "从许多方面来看，希腊的社会规范反映了来自奥斯曼国家和东正教会的数个世纪的保守压力。知识分子认为，希腊必须摆脱这些封建遗物，才能跃进现代。"
je_grefm_venizelism_education: "韦尼泽洛斯主义：学术复兴"
je_grefm_venizelism_education_reason: "尽管雄心勃勃，维尼泽洛主义者提出的教育改革旨在将希腊人民带到学术标准的前沿。"
je_grefm_venizelism_constitution: "韦尼泽洛斯主义：宪法改革"
je_grefm_venizelism_constitution_reason: "维尼泽洛斯到来后，国民大会中的宪政派推动完全废除君主制。"
je_grefm_venizelism_humanities: "韦尼泽洛斯主义：支持希腊人文学科"
je_grefm_venizelism_humanities_reason: ""
je_grefm_venizelism_tt1x: "实施大希腊理念"
je_grefm_venizelism_tt2x: "发展希腊民族主义"

 je_grefm_greater_greece: "大希腊"
 je_grefm_greater_greece_reason: "伟大理想已经部分实现，但这仅是其最初步的形态。还有众多希腊社群分布在我们国家的边界之外。我们肩负着开疆拓土的重任，直至所有希腊人都能在希腊国家的怀抱中找到其归属。"
 je_grefm_land_reclaimation: "科派斯湖围垦"
 je_grefm_land_reclaimation_reason: "科佩斯平原在古代是一片肥沃的土地。凭借我们的工业实力，我们可以恢复他的生产力。目前，我们估计水位已经下降了#blue [GetGlobalVariable('grefm_lake_kopais_var').GetValue]/3#!。"
 je_grefm_land_reclaimation_goal: "排干湖床需要数年时间。事件将会显示进展"
 je_grefm_land_reclaimation_status: "湖床围垦工作正在进行中……"
 je_grefm_greek_nationalism: "希腊民族主义"
 je_grefm_greek_nationalism_reason: "希腊文明已经存续了数千年，但从未有过一个真正的希腊国家。无论是古代的希腊城邦，还是后来的罗马、拜占庭和奥斯曼等多民族帝国，希腊人民从未把一个国家视为比他们自己的家乡更为重要的东西。在启蒙思想的推动下，力图为希腊人民建立一个真正共同的身份的运动如雨后春笋般涌现。"
 je_grefm_national_language: "民族语言"
 je_grefm_national_language_reason: "在时间、空间和帝国的隔阂下，各地的希腊语都与奥斯曼帝国之前的希腊语产生了差异。如今，学者们对于是否应该接受突厥语对希腊语的渗透，以及公共希腊语的各种变体，陷入了激烈的争论。"
 je_grefm_the_womens_journal: "妇女杂志"
 je_grefm_the_womens_journal_reason: "在卡里罗伊·帕伦的带领下，以及在更广泛的女权运动的支持下，希腊的妇女渴望得到更好的待遇。历史上，她们被视为仅仅是家庭主妇，她们试图在促进希腊民族的团结和独立中发挥自己的作用。一份出版物，#italic 《妇女杂志》#!，为这一运动发出了号召，主张妇女应该有自己的财产权，以及儿童应该远离工厂的剥削。"
 je_grefm_the_cretan_revolts: "克里特起义"
 je_grefm_the_cretan_revolts_reason: "克里特岛自从13世纪被拜占庭帝国夺走后，克里特希腊人就一直抵抗异教的统治。随着地中海地区民族主义的兴起，他们对我们发动叛乱的日子指日可待。\n\n目前，叛乱的气势已经高达#red [GetGlobalVariable('grefm_crete_revolt_var').GetValue]#!。一旦气势达到#bold 150#!，下一次叛乱就会发生。"
 je_grefm_the_cretan_revolts_fallback: "克里特起义"
 je_grefm_the_cretan_revolts_fallback_reason: "克里特岛自从13世纪被拜占庭帝国夺走后，克里特希腊人就一直抵抗异教的统治。随着地中海地区民族主义的兴起，他们对我们发动叛乱的日子指日可待。\n\n目前，叛乱的气势已经高达#red [GetGlobalVariable('grefm_crete_revolt_var').GetValue]#!。一旦气势达到#bold 150#!，下一次叛乱就会发生。"
 grefm_dismiss_bavarians_decision: "解散巴伐利亚协助军团"
 grefm_dismiss_bavarians_decision_desc: "巴伐利亚籍的士兵和军官操纵了希腊军队，激化了他们与当地新兵的矛盾。希腊的改革者们要求将这些部队清除出希腊武装力量。"


je_grefm_grecoturkism: "希土主义"
je_grefm_grecoturkism_reason: "尽管我们在几个世纪的帝国统治后互相侮辱，但我们已决定，[ROOT.GetCountry.GetName]前进的唯一方式是拥抱希腊和土耳其之间的共同传统。虽然我们的文化彼此熟悉，但这个过程需要时间。"
je_grefm_grecoturkism_goal: "这个过程需要时间..."

je_grefm_venizelism: "维尼泽洛主义" # 这是为了保存兼容性而存在的，将来会消失
je_grefm_venizelism_reason: "埃莱夫塞里奥斯·维尼泽洛斯站在船头，希腊国家已经进入了一个狂野变革的时代。在人民沉浸在民族主义狂热之中时，维尼泽洛斯及其支持者旨在将希腊带入世界舞台，几乎不考虑大国的干涉。#italic Ankyra！Ankyra！#!"
je_grefm_venizelism_tt1x: "执行大希腊思想"
je_grefm_venizelism_tt2x: "发展希腊民族主义"
   

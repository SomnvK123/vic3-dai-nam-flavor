 je_grefm_archaeology: "希腊文化根源"
 je_grefm_archaeology_reason: "古希腊文明的遗址正散落在巴尔干半岛和安纳托利亚地区。作为希腊民族，我们有责任夺回这些遗产。"
 grefm_archeaology_tt: "完成全部发掘"
 je_grefm_active_excavation: "主动挖掘"
 je_grefm_active_excavation_reason: "在考古专家的监督下，工人们正在进行最新的发掘，以揭开希腊过去的秘密。"
 je_grefm_active_excavation_goal: "等待发掘完成……"
 grefm_excavation_completed_tt: "我们完成的发掘数增加了#green 1#!"
 grefm_parthenon_button_1: "勘察雅典卫城"
 grefm_parthenon_button_1_desc: "古雅典卫城高耸入云，位于雅典城邦的中心，曾被称为#bold 高处的城市#!。然而，经过千年的荒废，如今的卫城已成为一片废墟。考古学家们正呼吁对遗址进合适的研究。"
 grefm_parthenon_button_2: "发掘帕特农神庙"
 grefm_parthenon_button_2_desc: "由于摩里亚战争的破坏和后来奥斯曼清真寺的修建，帕台农神庙只剩骨架。尽管如此，专家们认为利用现代工业技术进行部分修复是可行的。"
 grefm_mycenae_button_1: "探索克诺索斯"
 grefm_mycenae_button_1_desc: "长期以来，主流学术界一直认为克里特岛是古代米诺斯文明的核心。米诺斯‑卡洛凯里诺斯的业余发掘证明了青铜时代宫殿的存在，但土耳其政府的干预阻碍了对该岛的正式研究。"
 grefm_mycenae_button_2: "发掘米诺斯宫殿"
 grefm_mycenae_button_2_desc: "随着宫殿遗址的确定，学者们开始对这一庞大建筑群进行全面挖掘和修复。"
 grefm_gla_button: "调查格拉城堡"
 grefm_gla_button_desc: "随着科派斯湖水位的消退，位于湖心的一个小岛被确认为一座大型防御工事，其历史可追溯到希腊史前时期。随着水位的不断消退，一些希腊人推动成立一支探险队前往该遗址。"
 grefm_delos_button: "勘测狄洛斯岛"
 grefm_delos_button_desc: "德洛斯岛是古希腊神话的中心之一，自八世纪晚期以来一直被遗弃。岛上点缀着无数遗迹，几位学者认为，该遗址对于展示古希腊的影响力及其在地中海的地位至关重要。"
 grefm_larissa_button: "勘察拉里萨遗址"
 grefm_larissa_button_desc: "拉里萨是[ROOT.GetCountry.GetName]最大的城市之一，建在希腊近代以前的几处遗址之上，其中一些遗址仍在继续使用。当地学者和工程师报告说，随着城市开始扩张，他们发现了许多遗址。"
 grefm_parthenon_1_tt: "这将会开始发掘#bold 雅典卫城#!"
 grefm_parthenon_2_tt: "这将会开始发掘#bold 帕特农神庙#!"
 grefm_knossos_1_tt: "这将会开始发掘#bold 克诺索斯#!"
 grefm_knossos_2_tt: "这将会开始发掘#bold 克诺索斯宫殿#!"
 grefm_gla_tt: "这将会开始发掘#bold 格拉城堡#!"
 grefm_delos_tt: "这将会开始发掘#bold 狄洛斯岛#!"
 grefm_larissa_tt: "这将会开始发掘#bold 拉里萨遗址#!"
 grefm_gla_exposed_tt: "您必须先排干科派斯湖才能调查格拉城堡"
 grefm_parthenon_1_complete_tt: "您必须首先勘察雅典卫城顶部的废墟才能发掘帕台农神庙。"
 grefm_knossos_1_complete_tt: "您必须首先勘察迈锡尼遗址才能探索宫殿。"

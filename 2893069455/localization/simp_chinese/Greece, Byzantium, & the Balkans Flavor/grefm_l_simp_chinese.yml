 grefm_lake_kopais_decision_desc: "凭借我们的工业实力，科佩斯湖可以再次被排干。我们的工程师在等待命令"
 grefm_release_turkophagos_decision: "将尼基塔拉从监狱释放"
 grefm_release_turkophagos_decision_desc: "尼基塔斯·斯塔马特洛普洛斯是希腊革命中的一位民族英雄，以其英勇闻名。然而，他在摄政理事会的统治期间因为强烈反对巴伐利亚王朝的控制而被监禁。至今，他还有一些热情的支持者为他的释放而祈祷。"

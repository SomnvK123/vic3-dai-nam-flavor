balkfm.601.t: "请愿宣言"
balkfm.601.d: "对[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]职位的任意性质的不满情绪不断上升。随着自由主义和民族主义在欧洲蔓延，著名知识分子由[SCOPE.sCharacter('balkfm_alecsandri_scope').GetFullName]领导，要求对Hospodar的滥用行为设立明确的防护措施。"
balkfm.601.f: "由大贵族和受过西方教育的知识分子共同努力，革命者希望在[ROOT.GetCountry.GetAdjective]建立一个适度的自由主义基础，而不完全推翻#italic 规章#!体系。"
balkfm.601.a: "国家不会向煽动者低头。"
balkfm.601.b: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须听取人民的声音。"

balkfm.602.t: "摩尔达维亚革命委员会"
balkfm.602.d: "著名知识分子[SCOPE.sCharacter('balkfm_kogalniceanu_scope').GetFullName]聚集了激进分子，向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]提出要求。他们自称#italic 摩尔达维亚革命委员会#!，提出了一份将国家大部分职能转移给立法机构的宪法草案。"
balkfm.602.f: "尽管[ROOT.GetCountry.GetName]的激进主义担忧尚未得到证实，委员会仍未要求废除#italic 规章#!体系。俄罗斯和奥斯曼的代表担心这些改革可能会进一步激化多瑙河沿岸的激进化。"
balkfm.602.a: "我们必须找到一个妥协方案。"

balkfm.603.t: "米哈伊尔·科格尔尼恰的革命"
balkfm.603.d: "对[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]的支持已经崩溃。屈服于#italic 革命委员会#!的要求，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]同意了他们的自由化要求并退位。"
balkfm.603.f: "在失宠的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的职位上，自由政治家[SCOPE.sCharacter('balkfm_kogalniceanu_scope').GetName]接掌了政府，并承诺在[ROOT.GetCountry.GetName]进行改革。"
balkfm.603.a: "就这样吧。"
balkfm.604.t: "巴尔塔利曼公约"
balkfm.604.d: "随着革命威胁被镇压，[SCOPE.sCountry('russia_scope').GetAdjective]-[SCOPE.sCountry('ottoman_scope').GetAdjective]联合代表团确认了他们对罗马尼亚公国的联合监督现状。"
balkfm.604.f: "尽管他们都有希望看到公国现代化的共同愿望，但他们的统治者希望将公国的独立限制在严格的范围内。"
balkfm.604.a: "就这样吧。"

balkfm.605.t: "宪法僵局"
balkfm.605.d: "席卷[ROOT.GetCountry.GetName]的自由主义运动未能获得显著的牵引力。随着他们的目标未完成以及[SCOPE.sCountry('russia_scope').GetAdjective]-[SCOPE.sCountry('ottoman_scope').GetAdjective]联合干预的威胁，#italic 革命委员会#!已解散。"
balkfm.605.f: "尽管他们都有希望看到公国现代化的共同愿望，但他们的统治者希望将公国的独立限制在严格的范围内。"
balkfm.605.a: "就这样吧。"

balkfm.606.t: "俄军进入摩尔达维亚"
balkfm.606.d: "在[SCOPE.sCountry('moldavia_scope').GetRuler.GetFullName]的请求下，[SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('russia_scope').GetRuler.GetFullName]已派遣军队进入[SCOPE.sCountry('moldavia_scope').GetName]镇压#italic 革命委员会#!。"
balkfm.606.f: "越过[SCOPE.sCountry('ottoman_scope').GetName]的宗主权，俄罗斯外交部决定不冒失去公国的风险，并已在第聂斯特河沿岸部署了部队。"
balkfm.606.a: "我们要维持秩序！"
balkfm.606.b: "我们不能容忍这种冒犯！"
balkfm.606.tt: "这将大幅增加对王子的支持。"

balkfm.611.t: "伊斯拉兹宣言"
balkfm.611.d: "著名知识分子[SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName]集结了激进分子，向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]提出要求。他们自称#italic 兄弟会#!，提出了一系列要求，将显著增加投票权并将国家的大部分职能转移给立法机关。"
balkfm.611.f: "尽管[ROOT.GetCountry.GetName]的激进主义担忧尚未得到证实，兄弟会仍未公开要求废除#italic 规章#!体系。俄罗斯和奥斯曼的代表担心这些改革可能会进一步激化多瑙河沿岸的激进化。"
balkfm.611.a: "让这些无政府主义者闭嘴。"
balkfm.611.b: "[ROOT.GetCountry.GetName]必须遵循人民的意愿。"

balkfm.612.t: "瓦拉几亚兄弟会"
balkfm.612.d: "迎接席卷欧洲的激进浪潮，[SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName]向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]提出了一系列要求，这些要求将剥夺[ROOT.GetCountry.GetName]的任何传统权威。"
balkfm.612.f: "与他们在[SCOPE.sCountry('moldavia_scope').GetName]的同胞不同，#italic 兄弟会#!勇敢地提出了激进的要求，寻求罗马尼亚统一并废除#italic 规章#!体系。"
balkfm.612.a: "我们必须找到一个妥协方案。"

balkfm.613.t: "革命之剑"
balkfm.613.d: "对[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]的支持已经崩溃。屈服于#italic 革命委员会#!的要求，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]同意了他们的自由化要求并退位。"
balkfm.613.f: "在失宠的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的位置上，自由政治家[SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName]接掌了政府，并承诺在[ROOT.GetCountry.GetName]进行改革。"
balkfm.613.a: "就这样吧。"

balkfm.614.t: "巴尔塔利曼公约"
balkfm.614.d: "随着革命威胁被镇压，[SCOPE.sCountry('russia_scope').GetAdjective]-[SCOPE.sCountry('ottoman_scope').GetAdjective]联合代表团确认了他们对罗马尼亚公国的联合监督现状。"
balkfm.614.f: "尽管他们都有希望看到公国现代化的共同愿望，但他们的统治者希望将公国的独立限制在严格的范围内。"
balkfm.614.a: "就这样吧。"

balkfm.615.t: "宪法僵局"
balkfm.615.d: "席卷[ROOT.GetCountry.GetName]的自由主义运动未能获得显著的牵引力。随着他们的目标未完成以及[SCOPE.sCountry('russia_scope').GetAdjective]-[SCOPE.sCountry('ottoman_scope').GetAdjective]联合干预的威胁，#italic 革命委员会#!已解散。"
balkfm.615.f: "尽管他们都有希望看到公国现代化的共同愿望，但他们的统治者希望将公国的独立限制在严格的范围内。"
balkfm.615.a: "就这样吧。"

balkfm.616.t: "俄军进入瓦拉几亚"
balkfm.616.d: "在[SCOPE.sCountry('wallachia_scope').GetRuler.GetFullName]的请求下，[SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('russia_scope').GetRuler.GetFullName]已派遣军队进入[SCOPE.sCountry('wallachia_scope').GetName]镇压#italic 革命委员会#!。"
balkfm.616.f: "越过[SCOPE.sCountry('ottoman_scope').GetName]的宗主权，俄罗斯外交部决定不冒失去公国的风险，并已在第聂斯特河沿岸部署了部队。"
balkfm.616.a: "我们要维持秩序！"
balkfm.616.b: "我们不能容忍这种冒犯！"
balkfm.616.tt: "这将大力支持王子。"
balkfm.627.t: "绝对主义抱负"
balkfm.627.d: "[ROOT.GetCountry.GetRuler.GetFullName] 推动了一系列宪法改革，这些改革将极大地增加他对国家的控制。"
balkfm.627.f: "通过 [ROOT.GetCountry.GetRuler.GetFullName] 的努力，[ROOT.GetCountry.GetName] 已从土耳其的奴役中解放出来，实现了统一。然而，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 开始推进增加中央特权的改革，这将使国家转变为一个由强大的农民阶层合法化的绝对主义国家。"
balkfm.627.a: "我们应该支持他的努力。"
balkfm.627.b: "他是一个鲁莽的暴君。"
balkfm.628.t: "确立了授权"
balkfm.628.d: "作为罗马尼亚统一者的典范，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] 已确立了他对 [ROOT.GetCountry.GetName] 的威权统治。"
balkfm.628.f: "在农民的支持下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 准备带领 [ROOT.GetCountry.GetAdjectiveNoFormatting] 国家走向复兴的未来。欧洲列强和#bold 奥斯曼帝国#的默认接受，只能使他的反对者保持沉默。"
balkfm.628.a: "这是 [ROOT.GetCountry.GetName] 伟大的一天！"
balkfm.629.t: "一个可怕的联盟"
balkfm.629.d: "面对 [ROOT.GetCountry.GetRuler.GetFullName] 对绝对主义统治的疯狂计划，一群政治家联合起来反对他的统治。媒体称之为#bold 可怕的联盟#，他们已号召军队推翻 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。\n\n 该联盟已向列强请求批准选定新的 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。"
balkfm.629.f: "由于他的傲慢，[ROOT.GetCountry.GetRuler.GetFirstName] 成功地团结了保守的地主和自由的企业家，共同反对绝对主义。"
balkfm.629.a: "霍亨索伦王子是一个合适的选择。"
balkfm.629.a.tt: "#yellow 卡罗尔·霍亨索伦#! 成为统治者。"
balkfm.629.b: "高贵的王子，弗兰德的菲利普，是一个很好的选择。"
balkfm.629.b.tt: "#yellow 弗兰德的菲利普#! 成为统治者。"


balkfm.684.t: "与特兰西瓦尼亚的联合"
balkfm.684.d: "我们与 [SCOPE.sCountry('transylvania_scope').GetName] 的联合已经完成。我们的纽带牢固，我们的意志坚定——在一起，[ROOT.GetCountry.GetName] 将无可阻挡。"
balkfm.684.f: ""1918年11月18日阿尔巴尤利亚国民议会决议中提到的土地，永远与罗马尼亚王国联合。" - 费迪南德一世，1918年12月11日"
balkfm.684.a: "一切为了大家"
balkfm.685.t: "《[SCOPE.sState('transylvania_capital_scope').GetCityHubName] 条约》"
balkfm.685.d: "经过简短的谈判，[SCOPE.sCountry('transylvania_scope').GetName] 已同意加入希腊国家。"
balkfm.685.f: "特兰西瓦尼亚的罗马尼亚人为他们的自由而战。现在，他们重新回到 [ROOT.GetCountry.GetAdjective] 家庭是理所应当的。"
balkfm.685.a: "[ROOT.GetCountry.GetName] 将不可阻挡！"
balkfm.686.t: "罗马尼亚人在国外的激动！" #ROM
balkfm.686.d: "在我们的支持下，[GetCulture('romanian').GetName] 激进分子在 [SCOPE.sState('balkfm_agitation_state_scope').GetName] 开始组织民间示威活动，希望进一步推动罗马尼亚事业。"
balkfm.686.f: "啊！圣主，\n我们在天上的父，\n请伸出您的手\n保佑罗马尼亚国家！"
balkfm.686.a: "我们不会停止，直到 [ROOT.GetCountry.GetName] 完整为止。"
balkfm.687.t: "罗马尼亚人反对 [ROOT.GetCountry.GetAdjective] 统治的激动！" #AUS
balkfm.687.d: "[GetCulture('romanian').GetName] 激进分子在 [SCOPE.sState('balkfm_agitation_state_scope').GetName] 引发了全州的示威活动。他们要求 [ROOT.GetCountry.GetName] 内所有斯拉夫人享有平等权利。"
balkfm.687.f: "虽然街道上的局势混乱，但初步怀疑已经指向来自 [SCOPE.sCountry('balkfm_romanian_agitator_scope').GetName] 的煽动者。"
balkfm.687.a: "这不是文明行为。"
balkfm.688.t: "大罗马尼亚土地"
balkfm.688.d: "随着各公国在一个国家下的统一，一个更大的计划浮现：统一所有 [GetCulture('romanian').GetName] 土地，进入多瑙河。"
balkfm.688.f: ""[ROOT.GetCountry.GetName] 的唯一未来是一个自由和完整的国家。"
balkfm.688.a: "这些土地理应属于我们。"
balkfm.689.t: "罗马尼亚的重新统一"
balkfm.689.d: "从德涅斯特河到蒂萨河，一个完整独立的 [ROOT.GetCountry.GetName] 的梦想已经成为现实。"
balkfm.689.f: ""罗马尼亚人！\n\n在过去两年中，战争越来越紧密地包围着我们的边界，动摇了欧洲古老的基础。\n\n这带来了几个世纪以来民族意识、罗马尼亚国家创建者、在独立战争中统一公国者、国家复兴负责人的期盼之日。\n\n今天，我们能够完成祖先的任务，永远确立米哈伊大帝只能暂时建立的罗马尼亚联合……" \n- 费迪南国王，1916年8月28日宣言"
balkfm.689.a: "这是 [ROOT.GetCountry.GetName] 的一个美好日子！"
eqfm_fallback_decision: "清除东部问题修正案"
eqfm_fallback_decision_desc: "如果东部问题结束后还有残余修正案，这将清除它们。"
notification_notification_eqfm_overtaxed_name: "过度征税引发紧张局势"
notification_notification_eqfm_overtaxed_desc: "奥斯曼当局在巴尔干的过度征税增加了#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')]分离主义紧张局势#!#!，#red #bold 增加了25#!#!。"
notification_notification_eqfm_tax_break_name: "苏丹减免税收"
notification_notification_eqfm_tax_break_desc: "#bold 奥斯曼帝国#!在面对巴尔干的抗议时，屈服了拟议的税收。这降低了他在国内的地位。"
notification_notification_eqfm_plague_name: "瘟疫爆发加剧紧张局势"
notification_notification_eqfm_plague_desc: "巴尔干地区报告了瘟疫事件。批评者指责当地的奥斯曼驻军传播疾病，#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')]分离主义紧张局势#!#!#red #bold 增加了25#!#!。"
notification_notification_eqfm_quarantine_name: "#yellow 奥斯曼帝国#!实施隔离！"
notification_notification_eqfm_quarantine_desc: "巴尔干地区报告了瘟疫事件。#bold 奥斯曼帝国#!对受影响地区实施了隔离。"
notification_notification_eqfm_faketriarch_name: "牧首斥责加剧紧张局势！"
notification_notification_eqfm_faketriarch_desc: "#bold 奥斯曼帝国#对#yellow 东正教牧首#!提出的增加对东正教徒保护的要求反应不佳。这#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')]分离主义紧张局势#!#!#red #bold 增加了25#!#!。"
notification_notification_eqfm_firman_name: "#yellow 苏丹#授予宗教保护"
notification_notification_eqfm_firman_desc: "#bold 奥斯曼帝国#对#yellow 东正教牧首#!提出的增加对东正教徒保护的要求作出了回应，颁布了规定其与穆斯林平等的法律。这在帝国中的穆斯林中引起了不满。"
notification_notification_eqfm_burninator_name: "教堂焚烧加剧紧张局势！"
notification_notification_eqfm_burninator_desc: "骚乱导致多座东正教教堂被暴徒焚毁。#bold 奥斯曼帝国#!的默认批准#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')]分离主义紧张局势#!#!#red #bold 增加了25#!#!。"
notification_notification_eqfm_reparations_name: "#yellow 苏丹#!提供赔偿"
notification_notification_eqfm_reparations_desc: "在帝国内发生的教堂焚毁事件后，苏丹动用个人财产对受影响的社区进行赔偿。这将#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')]分离主义紧张局势#!#!限制在#red #bold 10#!#!。"
notification_notification_eqfm_lynching_name: "私刑加剧紧张局势！"
notification_notification_eqfm_lynching_desc: "一位当地社会领袖和著名演说家在巴尔干被暴徒私刑处死。#bold 奥斯曼帝国#!的无动于衷#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')]分离主义紧张局势#!#!#red #bold 增加了25#!#!。"
notification_notification_eqfm_arrests_name: "#yellow 奥斯曼帝国#!执行秩序"
notification_notification_eqfm_arrests_desc: "一位当地社会领袖和著名演说家在巴尔干被暴徒私刑处死。苏丹迅速作出回应，部署当地驻军逮捕肇事者。"
notification_notification_eqfm_brigandage_name: "盗贼活动加剧紧张局势！"
notification_notification_eqfm_brigandage_desc: "盗贼袭击了巴尔干的几个村庄。#bold 奥斯曼帝国#!的无动于衷#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')]分离主义紧张局势#!#!#red #bold 增加了25#!#!。"
notification_notification_eqfm_patrols_name: "#yellow 奥斯曼帝国#!执行秩序"
notification_notification_eqfm_patrols_desc: "盗贼袭击了巴尔干的几个村庄。苏丹迅速作出回应，部署当地驻军逮捕肇事者。这将#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')]分离主义紧张局势#!#!限制在#red #bold 10#!#!。"

notification_notification_eqfm_secession_start_name: "巴尔干起义！"
notification_notification_eqfm_secession_start_desc: "巴尔干的动乱导致叛军对#bold 奥斯曼帝国#!拿起武器！这将减少#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')]巴尔干紧张局势#!#!#variable 200#!。"
notification_notification_eqfm_deconfliction_name: "#yellow 巴尔干斗争#! 进入#blue 冲突缓和#!"
notification_notification_eqfm_deconfliction_desc: "最近的巴尔干起义使领导人尝试缓和敌对情绪。#o #tooltip:[GetRawTextTooltipTag('eqfm_tension_tt')]巴尔干紧张局势#!#!阶段已变为#blue #bold 冲突缓和#!#!。在#blue #bold 冲突缓和#!#!阶段，紧张局势将迅速减少。"

je_balkfm_rom_1848: "罗马尼亚自由主义"

je_balkfm_rom_1848_reason: "随着启蒙思想涌入[ROOT.GetCountry.GetName]，围绕王子的顽固贵族对#italic 有机法规#!的承诺感到失望。尽管他们不寻求#italic 调节#!的完全废除，自由派阵营提出了限制王子特权和保障公民权利的要求。\n\n目前王子有#variable [ROOT.GetVariable('balkfm_1848_rom_var').GetValue]/200#!的支持。这一预期将于下月改变#variable #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_1848_sources [ROOT.GetVariable('balkfm_1848_progress_var').GetValue|+=]#!#!。"

je_balkfm_rom_1848_status: "王子有#variable [ROOT.GetVariable('balkfm_1848_rom_var').GetValue]/200#!的支持。"

je_balkfm_rom_1848_sources: "预期变更的原因是：\n#variable [Country.MakeScope.Var('balkfm_1848_ruler_popularity_var').GetValue|+=]#! 来自王子的受欢迎程度。\n#variable [Country.MakeScope.Var('balkfm_1848_bourgeoisie_approval_var').GetValue|+=]#! 来自#yellow 小资产阶级#!的支持。\n#variable [Country.MakeScope.Var('balkfm_1848_intelligentsia_approval_var').GetValue|+=]#! 来自#yellow 知识分子#!的支持。\n#variable [Country.MakeScope.Var('balkfm_1848_landowners_approval_var').GetValue|+=]#! 来自#yellow 土地所有者#!的支持。\n#variable [Country.MakeScope.Var('balkfm_1848_occupation_var').GetValue|+=]#! 来自#bold 外国干涉#!。"

balkfm_1848_rom_success_tt: "王子获得#bold 200#!的支持。"

balkfm_1848_rom_fail_tt: "王子失去了所有支持。"

balkfm_intervention_tt: "王子的支持率低于#bold 50#!。"
 
je_balkfm_rom_statutul_dezvoltator: "开发者身份"
je_balkfm_rom_statutul_dezvoltator_reason: "[ROOT.GetCountry.GetRuler.GetFullName] 已经巩固了对罗马尼亚公国的权力，现在他寻求扩大对国家的直接控制。利用他作为[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的权力，他现在旨在恢复公国的专制统治，损害其反对派的利益。\n\n预计对[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的支持将于下月改变#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_statutul_dezvoltator_sources [ROOT.GetVariable('balkfm_dezvoltator_progress_var').GetValue|+=]#!。"

je_balkfm_rom_statutul_dezvoltator_goal: "进度条已满。"

je_balkfm_rom_statutul_dezvoltator_sources: "预期变更的原因是：\n#variable [Country.MakeScope.Var('balkfm_landowners_support_var').GetValue|+=]#! 来自#yellow 土地所有者#!的支持。\n#variable [Country.MakeScope.Var('balkfm_devout_support_var').GetValue|+=]#! 来自#yellow 虔诚者#!的支持。\n#variable [Country.MakeScope.Var('balkfm_armed_forces_support_var').GetValue|+=]#! 来自#yellow 武装部队#!的支持。\n#variable [Country.MakeScope.Var('balkfm_intelligentsia_support_var').GetValue|+=]#! 来自#yellow 知识分子#!的支持。\n#variable [Country.MakeScope.Var('balkfm_industrialists_support_var').GetValue|+=]#! 来自#yellow 工业家#!的支持。\n#variable [Country.MakeScope.Var('balkfm_bourgeoisie_support_var').GetValue|+=]#! 来自#yellow 小资产阶级#!的支持。\n#variable [Country.MakeScope.Var('balkfm_rural_folk_support_var').GetValue|+=]#! 来自#yellow 农村民众#!的支持。\n#variable [Country.MakeScope.Var('balkfm_trade_unions_support_var').GetValue|+=]#! 来自#yellow 工会#!的支持。\n•如果我们没有实行#yellow 专制#!，这将乘以#red #bold -50%#!#!。"


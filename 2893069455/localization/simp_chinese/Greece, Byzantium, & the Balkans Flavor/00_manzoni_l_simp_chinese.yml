je_balkfm_rom_greater_romania_reason: "[ROOT.GetCountry.GetName] 已经实现了统一。然而，无数罗马尼亚人仍被困在国外，受到帝国主义列强的操纵和虐待。只有当所有罗马尼亚人都能称这里为家时，罗马尼亚国家才能完整。"


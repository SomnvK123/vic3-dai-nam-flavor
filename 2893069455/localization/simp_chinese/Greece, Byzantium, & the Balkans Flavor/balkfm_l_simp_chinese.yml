 # montenegro content
je_balkfm_mon_prince_bishopric: "主教亲王"
je_balkfm_mon_prince_bishopric_reason: "对许多人来说，黑山国似乎是遥远过去的幽灵。在西边的国家和东边的帝国中，这个小国一直是欧洲封建时代的象征。佩塔尔二世登基终于预示着主教亲王国的变革。受到他父亲佩塔尔一世的理念和来自西方的自由主义的激励，年轻的主教希望将现代性之光带到黑山。"
je_balkfm_mon_societal_reform: "社会改革"
je_balkfm_mon_societal_reform_reason: "蒙特内哥罗被封建制度所支配。在黑山山脉的山麓，人们实行着自拜占庭时代以来就一直存在的农业。工业完全不存在，农民仍然受制于他们的领主和酋长。主教希望将国家从这种可悲的状态中解救出来。"
je_balkfm_mon_administration: "行政改革"
je_balkfm_mon_administration_reason: "亲王主教以绝对的权威统治着。然而，蒙特内哥罗政府几乎没有正式的结构。尽管主教选择他的部长，但没有法律体系来强制执行法律和税收标准，这在很大程度上是由酋长和法庭在地方层面处理的。如果国家不能首先控制自己的人民，彼得一世对蒙特内哥罗的宏伟愿景将永远无法实现。"
je_balkfm_mon_military_reform: "军事改革"
je_balkfm_mon_military_reform_reason: "蒙特内哥罗的军事几乎无法被描述为军队。由于国家被困在中世纪的状态中，该国没有正式的军事单位可以用于自卫。奥斯曼国家大臣袭击我们的边境城镇，国家的防御已经落到了部落酋长手中，他们对主教的忠诚度充其量可以描述为不和谐的。除非蒙特内哥罗能够找到保卫自己的力量，否则它的日子将不多了。"
je_balkfm_mon_benefactor: "寻找恩人"
je_balkfm_mon_benefactor_reason: "如果苏丹成功地对这个小国进行有组织的攻击，蒙特内哥罗将无法生存。在邻近的帕夏威胁我们边界城镇的情况下，一些领导建议我们寻求欧洲大国的保护。法庭建议我们恢复与俄罗斯的古老联盟，而其他人则建议我们与奥地利邻国建立更友好的关系。"
je_balkfm_mon_ali_pasha: "阿里帕夏之怒"
je_balkfm_mon_ali_pasha_reason: "#yellow 黑山#!被黑塞哥维那的维齐尔#yellow 阿里·帕夏·里兹万贝戈维奇#!袭击。为了在宫廷的眼中增加他们在苏丹府的影响力，阿里·帕夏和斯库台的维齐尔#yellow 奥斯曼·帕夏·斯科普利亚克#!都决心最终将黑山纳入#yellow 奥斯曼帝国#!的领土。每天都有新的边境暴行的报告传来。我们所能做的就是抵抗他们的侵略。"
je_balkfm_mon_black_mountain: "黑山"
je_balkfm_mon_black_mountain_reason: "黑山以洛芬山的景色而得名，险象环生。亲王主教控制着\"老黑山\"内的土地，但大多数黑山人生活在土耳其的压迫之下。遭受重税和虐待，黑山的塞族人梦想有一天能够摆脱苏丹的负担。"
je_balkfm_mon_philosopher_bishop: "哲学主教"
je_balkfm_mon_philosopher_bishop_reason: "#yellow 亲王主教尼哥什#!在蒙特内哥罗宫廷能够提供的最好教育下长大，尽管它很基础。然而，在他的年轻时期，他由塞尔维亚诗人#yellow 西马·米卢廷诺维奇·萨拉伊利亚#!辅导。正是通过他的指导，尼哥什发现了对文学的热爱以及他自己的写作能力。从那时起，年轻的亲王主教努力记录尽可能多的塞尔维亚民间传说。\n\n继承父亲#yellow 彼得一世·彼得罗维奇·尼哥什#!的脚步，他希望建立一个独立的蒙特内哥罗#o 文学传统#!。\n\n目前，我们有#blue [GetPlayer.MakeScope.Var('manzoni_literary_tradition_var').GetValue]#! #o 文学传统#!。"
je_balkfm_mon_epic: "创作文学史诗"
je_balkfm_mon_epic_reason: "亲王主教再次受到灵感的启发。每天晚上偷偷溜到书房，他笔下描绘了蒙特内哥罗口头传统与宗教意义和民族主义幻想相融合的奇幻故事。"
je_balkfm_mon_epic_goal: "亲王主教完成了他最新的#o 文学作品#!。"
je_balkfm_mon_philosopher_bishop_tt: "拥有#yellow  50#!或更多#o 文学传统#!。"
balkfm_mon_petar_dead_tt: "亲王主教彼得二世去世了。"
je_balkfm_mon_ali_pasha_tt: "黑山经受住了#yellow 阿里·帕夏#!的侵略。"
 
 # serbia content
je_balkfm_ser_monarchism: "王朝之争"
je_balkfm_ser_monarchism_reason: "与其巴尔干同行不同，#yellow  塞尔维亚#!保留了本土贵族，而不是引进欧洲的皇室家族。这有助于塞尔维亚过渡到自治。然而，该国发现自己在奥地利结盟的#yellow 奥布雷诺维奇#!王朝和俄罗斯结盟的#yellow 卡拉杰奥尔杰维奇#!王朝之间分裂。\n\n#yellow 奥布雷诺维奇#!家族将通过保守主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_pos 强化#!，通过自由主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_neg 削弱#!。同样，#yellow 卡拉杰奥尔杰维奇#!家族将通过自由主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_pos 强化#!，通过保守主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_neg 削弱#!。\n\n#yellow 奥布雷诺维奇#!家族目前有#bold [GetPlayer.MakeScope.Var('obrenovic_support_var').GetValue]#!  #o 参议院支持#!。预计他们的支持度改变#bold [GetPlayer.MakeScope.Var('obrenovic_progress_var').GetValue]#! 在下个月发生\n\n#yellow 卡拉杰奥尔杰维奇#!家族目前有#bold [GetPlayer.MakeScope.Var('karadordevic_support_var').GetValue]#!  #o 参议院支持#!。预计他们的支持度改变#bold  [GetPlayer.MakeScope.Var('karadordevic_progress_var').GetValue]#! 在下个月发生。"
je_balkfm_ser_obrenovic_pos: "以下条件将 #bold 强化#!奥布雷诺维奇家族：\n•执行#yellow 独裁制#!（#green +2#!）。\n•执行#yellow 寡头制#!或#yellow 技术治国#!（#green +1#!）。\n•执行#yellow 世袭官僚制#!（#green +1#!）。\n•执行#yellow 秘密警察#!（#green +2#!）。\n•执行#yellow 农奴制#!（#green +2#!）。\n•执行#yellow 佃农#!（#green +1#!）。\n•与#yellow 奥地利#!保持#green 友好#!或更好的关系（#green +2#!）。\n•与#yellow 奥地利#!保持#green 亲密#!关系（#green +1#!）。"
je_balkfm_ser_obrenovic_neg: "以下条件将 #bold 削弱#!奥布雷诺维奇家族：\n•执行任何#yellow 选举形式#!（#red  -3#!）。\n•执行#yellow 选举官僚制#!（#red  -1#!）。\n•没有执行#yellow 农奴制#!或#yellow 佃农#!（#red  -2#!）。\n•与#yellow 奥地利#!保持#red 冷漠#!或更差的关系（#red  -2#!）。\n•与#yellow 奥地利#!保持#red 糟糕#!关系（#red  -1#!）。"
je_balkfm_ser_karadordevic_pos: "以下条件将 #bold 强化#!卡拉杰奥尔杰维奇家族：\n•执行#yellow 资格性选举#!或#yellow 普选制#!（#green +2#!）。\n•执行#yellow 地产投票#!或#yellow 财产投票#!（#green +1#!）。\n•执行#yellow 选举官僚制#!（#green +2#!）。\n•执行#yellow 保障自由#!（#green +2#!）。\n•与#yellow 俄罗斯#!保持#green 友好#!或更好的关系（#green +2#!）。\n•与#yellow 俄罗斯#!保持#green 亲密#!关系（#green +1#!）。\n•#yellow 亚历山大·卡拉杰奥尔杰维奇#!解放了#yellow 南塞尔维亚#!（#green +2#!）。"

je_balkfm_ser_karadordevic_neg: "以下条件将 #bold 削弱#!卡拉杰奥尔杰维奇家族：\n•未执行任何#yellow 选举形式#!（#red  -2#!）。\n•执行#yellow 世袭官僚制#!（#red  -2#!）。\n•执行#yellow 农奴制#!（#red  -2#!）。\n•执行#yellow 佃农#!（#red  -1#!）。\n•与#yellow 俄罗斯#!保持#red 冷漠#!或更差的关系（#red  -2#!）。\n•与#yellow 俄罗斯#!保持#red 糟糕#!关系（#red  -1#!）。\n•#yellow 亚历山大·卡拉杰奥尔杰维奇#!是亲王，我们不能控制#yellow 南塞尔维亚#!（#red  -2#!）。

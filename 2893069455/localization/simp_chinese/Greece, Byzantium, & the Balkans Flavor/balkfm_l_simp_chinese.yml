 je_great_eastern_crisis_sub: "东方危机"
 je_great_eastern_crisis_sub_reason: "奥斯曼帝国处于危机之中。帝国内外问题重重，高门的统治岌岌可危。民族主义思潮席卷全国，非突厥裔臣民开始诉诸武装起义，以求建立不受奥斯曼帝国影响的政府。\n\n与此同时，欧洲列强也利用帝国军事与经济的滞止，将自己的意志强加给苏丹。此时此刻俄奥两国正在奥斯曼帝国的边境寻衅，对近东日益扩大的权力真空虎视眈眈。\n\n#red  战争即将来临，我们必须做好准备。#!"

je_balkfm_bul_russian_influence: "俄罗斯的影响力"
je_balkfm_bul_russian_influence_reason: "[ROOT.GetCountry.GetRuler.GetFullName]因沙皇将军的行为受到严重侮辱。为了寻求补偿并获得皇帝的支持，[ROOT.GetCountry.GetRuler.GetFullName]已经组建了一个随扈前往莫斯科的随行人员。亲王希望不仅皇帝将支持他在保加利亚的继续统治，而且沙皇将授予他惩罚这两个忘恩负义者的权力。"
je_balkfm_bul_royal_influence_status: "亲王已访问莫斯科"
je_balkfm_bul_railways: "保加利亚铁路"
je_balkfm_bul_railways_reason: "来自俄罗斯的支持取决于修建战略铁路以支持他们在巴尔干地区的影响力。同样，英国已将对保加利亚国家的支持条件设置为收购该地区若干英国运营的铁路线。"
je_balkfm_bul_brigandage: "强盗活动"
je_balkfm_bul_brigandage_reason: "希腊独立战争之后，土匪在巴尔干乡村地区肆虐，超出中央政府的控制范围。半岛各地的人们要求将其绳之以法。"
je_balkfm_bul_liberation_of_bulgaria: "保加利亚的解放"
je_balkfm_bul_liberation_of_bulgaria_reason: "保加利亚在近五个世纪屈服于兹林格勒苏丹的威权之后，终于实现了自由。然而，我们被不公平地拒绝与保加利亚社区的其余部分联合。我们在东罗梅利亚的同胞呼吁摆脱温室效应。"
je_balkfm_bul_greater_bulgaria: "大保加利亚"
je_balkfm_bul_greater_bulgaria_reason: "圣斯特凡诺条约规定，保加利亚国家将横跨莫西亚和色雷斯。然而，大国的干预导致这些保加利亚人占多数的土地被剥夺并归还给兹林格勒。"
 je_balkfm_bul_greater_bulgaria_alternate: "大保加利亚"
je_balkfm_bul_greater_bulgaria_alternate_reason: "圣斯特凡诺条约规定，保加利亚国家将横跨莫西亚和色雷斯。然而，大国的干预导致这些保加利亚人占多数的土地被剥夺并归还给兹林格勒。"
je_balkfm_bul_tsardom: "保加利亚沙皇国"
je_balkfm_bul_tsardom_reason: "在巴尔干地区的到来后，保加利亚人被斯拉夫化，并建立了一个横跨该地区北部的大领域。在拜占庭帝国灭亡后，保加利亚社区因兹林格勒的设计而疏远。我们应该重新将这些人民与保加利亚国家统一起来。"

 je_balkfm_bul_empire: "保加利亚帝国"
je_balkfm_bul_empire_reason: "充满民族主义精神，摆脱奥斯曼压迫的桎梏，[ROOT.GetCountry.GetName]渴望成为巴尔干半岛的新主宰。我们将确保我们对鲁梅利亚的统治。"
je_balkfm_bul_yugoslavia: "南斯拉夫之地"
je_balkfm_bul_yugoslavia_reason: "南斯拉夫人民在整个巴尔干半岛存在了千年之久。虽然在时代和方言上分裂，但我们的共同文化最好在我们的旗帜下统一。"
je_balkfm_bul_megali_idea: "东方宝座"
je_balkfm_bul_megali_idea_reason: "924年，当时是保加利亚帝国摄政的西蒙一世，被拜占庭皇帝罗马诺斯一世加冕为#italic保加利亚之皇#!。随着拜占庭帝国被奥斯曼帝国灭亡和保加利亚帝国复兴，民族主义者宣称帝国的权力已经被[ROOT.GetCountry.GetName]继承。"
je_balkfm_bul_old_bulgaria: "旧大保加利亚"
je_balkfm_bul_old_bulgaria_reason: ""
je_balkfm_bul_restoration: "重建拜占庭"
je_balkfm_bul_restoration_reason: "拜占庭的核心地区曾经横跨巴尔干半岛和安纳托利亚。我们将恢复对这些土地的统治。"
  

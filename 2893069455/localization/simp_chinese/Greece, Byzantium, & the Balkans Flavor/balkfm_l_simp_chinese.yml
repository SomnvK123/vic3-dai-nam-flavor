je_group_balkfm_romanian_nationalism: "罗马尼亚民族主义"
je_balkfm_rom_1866_1: "罗马尼亚宪政主义"
je_balkfm_rom_1866_1_reason: "国王 [ROOT.GetCountry.GetRuler.GetFullName] 被邀请统治 [ROOT.GetCountry.GetName]，以捍卫罗马尼亚人民的自由为借口。随着他对宪法的支持，人民希望他们的领导层将规定的改革实施为法律。"
je_balkfm_rom_1866_2: "罗马尼亚宪政主义"
je_balkfm_rom_1866_2_reason: "国王 [ROOT.GetCountry.GetRuler.GetFullName] 被邀请统治 [ROOT.GetCountry.GetName]，以捍卫罗马尼亚人民的自由为借口。相反，国王已经陷入了专制的诱惑，并试图将他的统治强加于罗马尼亚国家。\n\n国王目前指挥着 #variable [ROOT.GetVariable('balkfm_1866_var').GetValue] 的支持率。预计下个月这将从 #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_sources 各种来源#! 变化 #variable [ROOT.GetVariable('balkfm_1866_progress_var').GetValue|+=]#!。"
je_balkfm_rom_sources: "预期变化原因包括:\n#variable [Country.MakeScope.Var('balkfm_1866_ruler_var').GetValue|+=]#! 来自国王的人气。\n#variable [Country.MakeScope.Var('balkfm_1866_support_var').GetValue|+=]#! 来自支持 #yellow 专制#! 或 #yellow 寡头政治#! 的利益集团。\n#variable [Country.MakeScope.Var('balkfm_1866_radicals_var').GetValue|-=]#! 来自 #bold 罗马尼亚#! 的激进主义。"
je_balkfm_rom_1866_fail: "国王已失去所有支持。"
je_balkfm_rom_constitution_1: "国王拥有广泛的支持。"
je_balkfm_rom_constitution_2: "国王的支持者在动摇。"
je_balkfm_rom_constitution_3: "国王只剩下少数支持者。"
 
je_balkfm_rom_nationalism: "罗马尼亚民族主义"
je_balkfm_rom_nationalism_reason: "罗马尼亚人民至少自罗马达契亚时代以来存在，然而这些讲罗曼语的人群的起源一直笼罩在神秘之中。从最初被罗马征服，到后来被斯拉夫人和土耳其人入侵，罗马尼亚人民从未拥有过为他们自己人民建立的国家。在民族主义潮流的推动下，出现了两派竞争的历史学派，试图书写自己版本的罗马尼亚历史，并实现他们对 [ROOT.GetCountry.GetName] 的愿景。\n\n保守派 #yellow 朱尼米斯特#! 认为该国缺乏坚实的社会经济基础，并认为现代罗马尼亚人是纯粹的罗马血统是历史虚构。由 #yellow 提图·马约雷斯库#! 领导， #yellow 朱尼米斯特#! 阵营指挥 #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_nationalism_junimism [ROOT.GetVariable('balkfm_junimism_var').GetValue|+=]#! 的支持。\n\n自由派 #yellow 达西安人#! 认为罗马尼亚人拥有独特的民族精神，这是罗马和达契亚特征融合的产物，赋予他们一种假设的开拓精神，驱使他们成为欧洲事务的领导者。由 #yellow 博格丹·哈斯德乌#! 领导， #yellow 达西安人#! 阵营指挥 #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_nationalism_dacianism [ROOT.GetVariable('balkfm_dacianism_var').GetValue|+=]#! 的支持。\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('balkfm_romanian_nationalism_type')]"
je_balkfm_rom_nationalism_junimism: "#yellow 朱尼米斯特#! 对 #variable [Country.MakeScope.Var('balkfm_junimism_progress_var').GetValue|+=]#! 的支持来自:\n#variable [Country.MakeScope.Var('balkfm_junimism_popularity_var').GetValue|+=]#! 支持 #yellow 农民主义#! 或 #yellow 传统主义#! 的人物的普及。\n#variable [Country.MakeScope.Var('balkfm_junimism_landowners_var').GetValue|+=]#! 来自 #yellow 地主阶级#! 的政治影响力。\n#variable [Country.MakeScope.Var('balkfm_junimism_support_var').GetValue|+=]#! 来自 #bold 政府支持#!。"
je_balkfm_rom_nationalism_dacianism: "#yellow 达西安人#! 对 #variable [Country.MakeScope.Var('balkfm_dacianism_progress_var').GetValue|+=]#! 的支持来自:\n#variable [Country.MakeScope.Var('balkfm_dacianism_popularity_var').GetValue|+=]#! 反对 #yellow 农民主义#! 或 #yellow 传统主义#! 的人物的普及。\n#variable [Country.MakeScope.Var('balkfm_dacianism_intelligentsia_var').GetValue|+=]#! 来自 #yellow 知识分子阶层#! 的政治影响力。\n#variable [Country.MakeScope.Var('balkfm_dacianism_support_var').GetValue|+=]#! 来自 #bold 政府支持#!。"
 
je_balkfm_rom_nationalism_tt1: "无论是 #yellow 朱尼米斯特#! 还是 #yellow 达西安人#! 阵营都有至少 #bold 50#! 的支持。"
je_balkfm_rom_nationalism_tt2: "#yellow 朱尼米斯特#! 在社会中占主导地位。"
je_balkfm_rom_nationalism_tt3: "#yellow 达西安人#! 在社会中占主导地位。"
je_balkfm_rom_nationalism_tt4: "民族主义观点存在分歧。"
je_balkfm_rom_nationalism_tt5: ""

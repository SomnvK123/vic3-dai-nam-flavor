 # scripted buttons
balkfm_compose_epic: "谱写文学史诗"
balkfm_compose_epic_desc: "Prince-Bishop渴望花更多时间致力于他的著作。尽管对黑山日益增长的国家认同做出了无价的贡献，但一些人担心他在统治方面分心。"

 
balkfm_cement_monarchy: "王朝继承者"
 balkfm_cement_monarchy_desc: "我们的王朝已经牢牢掌握了塞尔维亚王位的控制权。唯一剩下的就是说服国民议会授予我们继承权。"
 balkfm_cement_monarchy_tt1: "统治王朝必须得到最大的支持。"
 balkfm_cement_monarchy_tt2: "国民议会已经制定了宪法"
 balkfm_cement_monarchy_tt3: "统治王朝将确保世袭君主制。"

balkfm_purchase_rail: "购买Rusé-Varna铁路"
balkfm_purchase_rail_desc: "根据条约，我们有义务向英国购买Rusé-Varna铁路。然而，政府内的亲俄派人士继续推动认为这是一种浪费资源，最好用于满足俄罗斯对铁路通道的需求。"
balkfm_annex_rumelia: "吞并鲁梅利亚"
balkfm_annex_rumelia_desc: "保加利亚仅以半数存在。民族觉醒的领导人继续在煽动人们对保加利亚和东鲁梅利亚联合的愿望方面发挥作用。"
balkfm_declare_tsardom: "宣布沙皇国"
balkfm_declare_tsardom_desc: "保加利亚是完整的。由王子来摆脱奥斯曼的宗主权，重新夺回旧保加利亚的王冠。"

 

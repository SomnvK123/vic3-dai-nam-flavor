 # bulgaria content
 je_balkfm_bul_battenburg_monarchy: "巴滕伯格君主制"
 je_balkfm_bul_battenburg_monarchy_reason: "在苏丹府承认之后，[SCOPE.sCharacter('balkfm_alex_scope').GetFirstName]在沙皇的明确支持下当选。然而，人民制定了一部与在巴尔干地区拥有俄罗斯傀儡的国际意图相抵触的自由宪法。亲王走了一条谨慎的路线，进一步的自由改革可能会危及他在俄罗斯的地位。\n\n亲王对王位的保持将由各种#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_battenburg_pos  积极#! 或者是 #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_battenburg_neg  消极#! 条件决定。强烈分裂的国民议会只会容忍亲王，只要他捍卫自由理念并保持与俄罗斯沙皇的支持。"
 je_balkfm_battenburg_pos: "以下条件将 #bold 推进#! #bold 进度条#!：\n•与#yellow 俄罗斯#!保持良好关系。\n•[GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]是[concept_powerful]和[concept_in_government]。\n•接受俄罗斯军事随员。\n•捍卫新闻自由。\n•履行对俄罗斯的战略义务。\n•支持与君士坦丁堡的分裂。\n•解决 #bold 强盗问题#!。"
 je_balkfm_battenburg_neg: "以下条件将 #bold 减少#! #bold 进度条#!：\n•未能与#yellow 俄罗斯#!保持良好关系。\n•[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant]是[concept_powerful]但不是[concept_in_government]。\n•中止新闻自由。\n•废除宪法。\n•实现与东罗梅利亚的联合\n•购买 #bold Rusé-Varna铁路#!。"

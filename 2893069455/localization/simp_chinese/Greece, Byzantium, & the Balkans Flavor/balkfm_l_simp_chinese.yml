je_balkfm_ser_monarchism_consolidation: "巩固君主制"
je_balkfm_ser_monarchism_consolidation_reason: "随着他们对王位的支配地位得到保障，政府已经启动了确立#yellow 塞尔维亚#!世袭君主制的最后步骤。在此过程完成之际，即将成为皇室家族的人应当小心，以免损害他们的地位。"
je_balkfm_ser_nacertanije: "Načertanije"
je_balkfm_ser_nacertanije_reason: "Načertanije或\"#yellow 草案#!\"代表了对塞尔维亚统一的宏伟理想。由民族主义者#yellow 伊利亚·加拉沙宁#!起草并呈交亲王，该计划呼吁解放所有居住在\"老塞尔维亚\"土地上的塞尔维亚人。该计划从#italic意大利复兴#!中汲取灵感，呼吁塞尔维亚在统一南斯拉夫人民时居于首位。"

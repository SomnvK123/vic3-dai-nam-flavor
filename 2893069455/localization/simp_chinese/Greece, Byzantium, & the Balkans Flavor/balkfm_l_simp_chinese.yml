je_balkfm_rom_megali_idea: "一个罗马尼亚帝国"
je_balkfm_rom_megali_idea_reason: "罗马帝国曾经横跨地中海，罗马定居者的到来造就了罗马尼亚人民。现在是 [ROOT.GetCountry.GetName] 重新夺回巴尔干半岛，并恢复罗马在巴尔干半岛的统治的时候了。"
je_balkfm_rom_restoration: "拜占庭帝国的恢复"
je_balkfm_rom_restoration_reason: "拜占庭帝国的核心地区曾经横跨巴尔干半岛和安纳托利亚。我们将恢复对这些土地的统治。"
je_balkfm_rome_of_the_east: "东方的罗马"
je_balkfm_rome_of_the_east_reason: "罗马帝国的东部包括埃及和黎凡特在帝国的鼎盛时期。我们将重新夺回这些土地。"
je_balkfm_rome_of_the_east_status: "重新确立 [ROOT.GetCountry.GetName] 对近东地区的控制。"

je_balkfm_peles_castle: "佩莱什城堡"
je_balkfm_peles_castle_reason: "在 [ROOT.GetCountry.GetName] 的承认之下， [ROOT.GetCountry.GetRuler.GetFullName] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 提出了一个建造皇家住所的计划，这将为年轻的罗马尼亚国家赋予合法性和威望。建造的进度将取决于我们的投资水平。\n\n当前预计每月建设进度为 #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_peles_castle_sources [ROOT.GetVariable('balkfm_construction_progress_var').GetValue|+=]#!。"
je_balkfm_peles_castle_goal: "进度条已满。"
je_balkfm_peles_castle_sources: "来自当前投资水平的 #variable [Country.MakeScope.Var('balkfm_construction_progress_var').GetValue|+=]#!。"

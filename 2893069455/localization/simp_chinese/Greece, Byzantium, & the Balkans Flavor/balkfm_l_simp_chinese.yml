je_balkfm_triune_restoration: "三一王国的统一"
je_balkfm_triune_restoration_reason: "随着奥地利帝国的衰落，#yellow 三一王国#!的概念，即克罗地亚、斯拉沃尼亚和达尔马提亚的联合，成为一种手段，为斯拉夫人在帝国内部争取正当发言权。然而，政治努力受到了匈牙利国家亲匈牙利政策的挫败。现在我们已经确保了独立，我们有责任支持克罗地亚人和斯洛文尼亚人的事业。"
je_balkfm_triune_restoration_tt: "我们成立了#yellow 三一王国#!。"

je_balkfm_rom_regulamentul_organic: "有机法令"
je_balkfm_rom_regulamentul_organic_reason: "[ROOT.GetCountry.GetName] 仅作为奥斯曼帝国的名义一部分存在。然而，无论是城市还是乡村，这个国家的新获得的自治权仍然非常落后。经过奥地利军事前线的数个世纪的冲突和永恒的俄土冲突的干扰，该国在其乡村社区行使的权威微乎其微，经济在名义上仍然是封建的。\n\n作为罗马尼亚人的保证人，俄罗斯帝国已经强加了 #italic 有机法令#，或有机法律，于[ROOT.GetCountry.GetAdjectiveNoFormatting]国家。它的各种规定要求[ROOT.GetCountry.GetAdjective]采取措施使自己和她的人民现代化。\n\n#blue 有机法令规定了我们的 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 任期为七年。#!"
je_rom_regulamentul_organic_tt1: "我们已正式确立了我们的法律制度。"
je_rom_regulamentul_organic_tt2: "我们已经使我们的经济现代化。"
je_rom_regulamentul_organic_tt3: "我们已经改革了我们的社会秩序。"
je_rom_regulamentul_organic_tt4: "我们已经建立了 #yellow 罗马尼亚#!。"
je_balkfm_rom_regulamentul_election_tt1: " #bold 求主#! 选举将在 #bold [GetPlayer.MakeScope.Var('balkfm_regulamentul_var').GetValue] #! 年后举行。"
je_balkfm_rom_regulamentul_election_tt2: " #bold 求主#! 选举将于明年举行。"
je_balkfm_rom_regulamentul_election_tt3: " #bold 求主#! 选举正在进行中。"
je_balkfm_rom_legal_modernization: "法律标准的现代化"
je_balkfm_rom_legal_modernization_reason: "罗马尼亚人民自罗马统治在达基亚崩溃以来就缺乏任何形式的国家治理。由一系列可汗和贵族统治，该国在政治格局上明显是封建的。 #italic 有机法令# 所强调的首要任务是建立一个适当的国家机构来管理公国。"
je_balkfm_rom_economic_modernization: "经济发展的现代化"
je_balkfm_rom_economic_modernization_reason: "由于历史上主要大国的竞争，公国在发展方面远远落后于其邻国。由于大部分国家被自给自足的农业和贵族庄园所主导， #italic 有机法令# 的规定旨在将工业引入公国。"
je_balkfm_rom_social_modernization: "社会改革的现代化"
je_balkfm_rom_social_modernization_reason: "罗马尼亚人长期以来与西方的意识形态隔绝，但随着脱离奥斯曼国家的自治，一股开明思想的浪潮已经涌现。罗马尼亚学者认为，公国要站稳脚跟的唯一途径就是接受现代法律和社会运动。"

je_balkfm_rom_united_principalities: "罗马尼亚公国"
je_balkfm_rom_united_principalities_reason: "多瑙河公国从长久的懒散中振作起来。祖国的权利和利益呼唤解放；罗马尼亚民族的幸福和美好需要行动！我们必须追求团结，帮助建立一个我们人民的单一国家。然而，必须谨慎行事——在这个过程中不能惹怒任何一个[Concept('concept_great_power', '$concept_great_powers$')]。"
je_balkfm_rom_united_principalities_reason_status_1: "统一公国。"
je_balkfm_rom_united_principalities_reason_status_2: "维持公国联盟达10年。"
balkfm_form_yugoslavia: "组建南斯拉夫"
balkfm_form_yugoslavia_desc: "我们已经在巴尔干地区确立了主导地位。现在唯一的任务就是宣布南斯拉夫人在我们的旗帜下联合起来！"
balkfm_austrian_agitation: "支持奥地利南斯拉夫"
balkfm_austrian_agitation_desc: "[ROOT.GetCountry.GetName] 已经获得了自己的行政管理，但我们的许多人民仍然受到北部德国统治者的压制。我们应该帮助他们为自由而战。"
balkfm_ottoman_agitation: "支持奥斯曼南斯拉夫"
balkfm_ottoman_agitation_desc: "[ROOT.GetCountry.GetName] 可能已经从 #bold 皇室#! 那里获得了一定程度的自由，但我们的同胞仍然生活在他们的压迫之下。我们应该支持他们的自由斗争。"

balkfm_compose_epic: "创作文学史诗"
balkfm_compose_epic_desc: "主教渴望有更多时间专注于自己的写作。虽然对黑山民族日益增长的国家认同做出了宝贵的贡献，但有些人担心他分心于统治。"

balkfm_cement_monarchy: "巩固王室继承权"
balkfm_cement_monarchy_desc: "我们的王朝已经确保了对塞尔维亚王位的控制。现在要做的就是说服国民议会授予我们继承权的权利。"
balkfm_cement_monarchy_tt1: "统治王朝必须得到最大的支持。"
balkfm_cement_monarchy_tt2: "国民议会已通过宪法。"
balkfm_cement_monarchy_tt3: "统治王朝将努力确立世袭君主制。"
balkfm_restore_serbia: "恢复塞尔维亚"
balkfm_restore_serbia_desc: "我们已经在巴尔干地区确立了主导地位。现在唯一的任务就是宣布塞尔维亚权威的至高无上，并恢复塞尔维亚帝国！"

balkfm_purchase_rail: "购买卢塞-瓦尔纳铁路"
balkfm_purchase_rail_desc: "根据条约，我们有义务向英国购买拥有的卢塞-瓦尔纳铁路。然而，政府内的亲俄派继续推动认为这是一种浪费资源的行为，最好将资源用于满足俄罗斯对铁路通道的需求。"
balkfm_annex_rumelia: "吞并鲁梅利亚"
balkfm_annex_rumelia_desc: "保加利亚只是她的一半。民族觉醒的领导人继续努力，煽动人们对保加利亚和东鲁梅利亚之间的联盟的渴望。"
balkfm_declare_tsardom: "宣布沙皇制"
balkfm_declare_tsardom_desc: "保加利亚是完整的。现在该由王子摆脱奥斯曼的[concept_overlord]地位，并恢复旧的保加利亚王冠。"

balkfm_unite_principalities: "统一公国"
balkfm_unite_principalities_desc: "统一罗马尼亚民族的第一步是在我们的人民中确立一个统治者。确保共同领导，即使我们的国家在文件上仍然是分开的，也对统一的事业有很大帮助。"
balkfm_all_for_one: "巩固罗马尼亚国家"
balkfm_all_for_one_desc: "我们团结一致。我们必须保护我们现有的联盟，从而打造一个伟大的罗马尼亚。"
balkfm_bessarabian_retrocession: "南比萨拉比亚归还"
balkfm_bessarabian_retrocession_desc: "摩尔达维亚曾经控制过让它接触到海洋的土地。重新获得这个前领土，将我们的国家连接到黑海的海上贸易，对我们是有利的。"
balkfm_marea_unire: "大联合"
balkfm_marea_unire_desc: "所有罗马尼亚人民的大联合不仅需要统一多瑙河公国，还需要统一所有的罗马尼亚领土，包括特兰西瓦尼亚。"

balkfm_proclaim_triune: "宣布三一王国"
balkfm_proclaim_triune_desc: "我们已经统一了克罗地亚、斯拉沃尼亚和达尔马提亚的王冠。现在唯一要做的就是宣布这些土地的联合，成为一个独立的国家。"

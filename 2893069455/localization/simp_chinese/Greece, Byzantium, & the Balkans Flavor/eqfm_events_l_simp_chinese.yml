eqfm.006.a: "打开"
eqfm.006.b: "打开"
eqfm.007.t: "失去鲁梅利亚"
eqfm.007.d: "随着我们的权威崩溃，鲁梅利亚各地的国家机器也开始分裂。巴尔干国家摆脱了我们的控制，每个国家都在黑暗中狂笑。"
eqfm.007.f: "没有了奥斯曼干预的压力，现在又有了奥地利和俄罗斯使节的无法无天的影响，巴尔干地区已经摆脱了东方，希望重新加入欧洲社区。"
eqfm.007.a: "我们的一切希望都托付给真主。"
eqfm.008.t: "鲁梅利亚的统治"
eqfm.008.d: "尽管#bold 高门#!面临着巨大的挑战，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]不仅遏制了分裂主义，而且还把#yellow 鲁梅利亚#!的 [ROOT.GetCountry.GetAdjective] #yellow 地区#!称为巴尔干至高无上的力量。"
eqfm.008.f: "随着分裂主义情绪的消解"
eqfm.008.a: "哈里发是永恒的。"
eqfm.009.t: "DUMMY"
eqfm.009.d: "DUMMY"
eqfm.009.f: "DUMMY"
eqfm.009.a: "DUMMY"

eqfm.010.t: "在[STATE.sState('eqfm_tension_target_scope').GetName]的苛刻税收"
eqfm.010.d: "在[STATE.sState('eqfm_tension_target_scope').GetName]，一位当地贝伊被指控对我们的非穆斯林臣民征收过高的税款。他辩称这只是国家征收吉兹亚税的权力的体现。"
eqfm.010.f: "吉兹亚税是穆斯林帝国对非穆斯林征收的一种税收，以换取保护和免除军事服务。东正教信徒广泛谴责这是一种不公平和不道德的行为。"
eqfm.010.a: "苏丹支持他的帕夏。"
eqfm.010.b: "帕夏越权了。"
eqfm.011.t: "在[STATE.sState('eqfm_tension_target_scope').GetName]的瘟疫爆发"
eqfm.011.d: "在[STATE.sState('eqfm_tension_target_scope').GetName]爆发了瘟疫。当地人指责最近驻扎在[STATE.sState('eqfm_tension_target_scope').GetCityHubName]的奥斯曼驻军。"
eqfm.011.f: "虽然瘟疫在西方迅速成为过去，但由于帝国境内缺乏发达的医疗保健和卫生设施，偶尔还是会出现瘟疫问题。"
eqfm.011.a: "这不是我们的问题。"
eqfm.011.b: "实施隔离。"
eqfm.012.t: "普世牧首要求保护"
eqfm.012.d: "在[STATE.sState('eqfm_tension_target_scope').GetName]，因针对[GetReligion('orthodox').GetName]信徒的暴力事件，普世牧首直接联系苏丹，要求加强对信徒的保护。"
eqfm.012.f: "在君士坦丁堡沦陷后，普世牧首被承认为东正教“米利特”的领袖。在随后的几个世纪里，这一权力逐渐被削弱，以至于对东正教人口的虐待在帝国中变得司空见惯。"
eqfm.012.a: "牧首高估了他的权力。"
eqfm.012.b: "提供象征性的驻军。"
eqfm.013.t: "在[STATE.sState('eqfm_tension_target_scope').GetName]的教堂被烧毁"
eqfm.013.d: "在[STATE.sState('eqfm_tension_target_scope').GetName]，几天前的一场争执升级为公开骚乱。当暴乱者被平息时，几座[GetReligion('orthodox').GetName]教堂已被烧毁。信仰领袖已向#bold Porte#!呼吁赔偿。"
eqfm.013.f: "随着民族主义在穆斯林和东正教徒中蔓延，街头的直接对抗变得更加频繁。顾问警告说，缺乏果断行动可能会危及苏丹的权威。"
eqfm.013.a: "他们可以自己处理。"
eqfm.013.b: "我们要纠正这种虐待行为。"
eqfm.014.t: "在[STATE.sState('eqfm_tension_target_scope').GetName]的知名演讲者被私刑处死"
eqfm.014.d: ""
eqfm.014.f: ""
eqfm.014.a: ""
eqfm.014.b: ""
eqfm.015.t: "在[STATE.sState('eqfm_tension_target_scope').GetName]的土匪活动"
eqfm.015.d: "在[STATE.sState('eqfm_tension_target_scope').GetName]，土匪袭击了乡村，引发了当局采取行动的呼声。"
eqfm.015.f: "失意的不正规军队利用政府控制薄弱和警察腐败的机会，抢劫和掠夺了工人和贵族。土匪来去如风，当地贝伊发现好几个村庄被袭击和焚毁。"
eqfm.015.a: "这不值得我们关心。"
eqfm.015.b: "部署当地驻军。"
 
eqfm.020.t: "在[STATE.sState('eqfm_riot_state_scope').GetName]的暴动"
eqfm.020.d: "在[STATE.sState('eqfm_riot_state_scope').GetCityHubName]爆发了暴动。与以往的动乱不同，市民开始在全城设立路障。"
 
eqfm.020.f: "自从圣同盟军击败土耳其后，反对奥斯曼统治的动荡局势一直存在，最近的抗议活动更加具有民族主义色彩。"
eqfm.020.a: "派遣常规军进驻。"
eqfm.020.a.tt: "如果我们迅速行动，有相当大的机会控制住叛乱。"
eqfm.020.b: "任由他们自生自灭。"
eqfm.020.b.tt: "这些叛乱者可能会利用任何被视为弱点的机会。"
eqfm.021.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName] 内的暴力事件恶化"
eqfm.021.d: "尽管当地驻军努力镇压[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]的动乱，暴力事件已经开始蔓延至整个[SCOPE.sState('eqfm_riot_state_scope').GetName]。"
eqfm.021.f: "随着暴力从城市蔓延至乡村，当地居民已经开始伏击和骚扰土耳其士兵和平民。"
eqfm.021.a: "必须制止这种情况！"
eqfm.021.a.tt: "我们的驻军可能仍然有能力遏制暴力事件。"
eqfm.021.b: "我们必须保持克制。"
eqfm.021.b.tt: "我们的权威已经岌岌可危……"
eqfm.022.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName] 的大屠杀！"
eqfm.022.d: "来自[SCOPE.sState('eqfm_riot_state_scope').GetName]的灾难性消息。在[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]持续数周的对峙后，当地驻军部队开火打击了数百名和平抗议者。虽然具体数字还在报告中，但死亡人数可能达到数百人。"
eqfm.022.f: ""连续三天，不幸的居民们被野蛮暴徒的欲望和残忍所折磨。无论性别还是年龄，都毫不幸免。妇女和儿童在被处死前都遭受了酷刑。屠杀之惨重，使得科洛科特龙尼斯本人表示，从城门到城堡，他的马蹄从未触及过地面。他胜利的道路上铺满了尸体。两天结束时，那些可怜的穆斯林残余被有意聚集起来，大约有两千个灵魂，各个年龄和性别都有，但主要是妇女和儿童，被带到附近山区的一条峡谷中，像牲畜一样被屠杀。""
eqfm.022.a: "情况已经失控。"
eqfm.023.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName] 的叛乱已被镇压"
eqfm.023.d: "来自[SCOPE.sState('eqfm_riot_state_scope').GetName]的消息称，驻军指挥官已经成功平定了[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]中的最后激进分子。"
eqfm.023.f: "随着叛乱组织者被我们拘押，他们的审判将成为宣扬我们对巴尔干权威的绝佳公开素材。"
eqfm.023.a: "做得好。"
eqfm.024.t: "虚拟"
eqfm.024.d: "虚拟"
eqfm.024.f: "虚拟"
eqfm.024.a: "虚拟"
eqfm.025.t: "[SCOPE.sCountry('eqfm_rebellion_scope').GetAdjective] Rebellion"
eqfm.025.d: "我们在[SCOPE.sCountry('eqfm_rebellion_scope').GetCapital.GetName]的驻军已经崩溃。[SCOPE.sCountry('eqfm_rebellion_scope').GetAdjectiveNoFlag] 人民已经在[SCOPE.sCountry('eqfm_rebellion_scope').GetCapital.GetCityHubName]上升起了他们的旗帜，并宣布脱离[ROOT.GetCountry.GetName]的独立。"
eqfm.025.f: "我们军队的被赶出，已经动摇了人们对[ROOT.GetCountry.GetAdjective]国家在巴尔干的统治权的信心。如果我们要确保对鲁梅利亚的持续领域，我们需要果断行动。"
eqfm.025.a: "我们将粉碎这些叛军！"
eqfm.025.b: "[SCOPE.sCountry('eqfm_rebellion_scope').GetName] 将拥有自治权。"
eqfm.100.t: "鲁梅利亚的危机" # 招募发起者并通知TUR
eqfm.100.d1: "几个世纪以来，[SCOPE.sCountry('ottoman_scope').GetName]一直站在[ROOT.GetCountry.GetName]和其设计之间。由于巴尔干地区的紧张局势达到了自希腊独立以来最糟糕的程度，[ROOT.GetCountry.GetAdjectiveNoFormatting]外交部门认为我们应该利用巴尔干地区正在酝酿的动荡来谋求自己的利益。"
eqfm.100.d2: "突然爆发的骚乱席卷了我们在巴尔干的领土。整个鲁梅利亚的民族主义运动抓住了这个机会，试图摆脱土耳其统治，并请求外国支持。我们的部长们担心会有[SCOPE.sCountry('eqfm_starter_scope').GetAdjectiveNoFormatting]外交官的介入。"
eqfm.100.f: "尽管缺乏集中的运动，巴尔干国家已经把目光投向了西方，希望帝国主义大国的进一步干预能够使他们摆脱苏丹的统治。"
eqfm.100.a: "我们必须抓住这个机会。"
eqfm.100.b: "我们不会采取这种卑鄙手段。"
eqfm.100.c: "苏丹将坚持下去。"
eqfm.101.t: "鲁梅利亚的危机" # 招募地方势力
eqfm.101.d: "突然爆发的骚乱席卷了土耳其在巴尔干的领土。整个鲁梅利亚的民族主义运动抓住了这个机会，试图摆脱土耳其统治，并请求外国支持。"
eqfm.101.f: "尽管缺乏集中的运动，巴尔干国家已经把目光投向了西方，希望帝国主义大国的进一步干预能够使他们摆脱苏丹的统治。"
eqfm.101.a: "自由或死亡！"
eqfm.101.b: "风险太大了。"
eqfm.102.t: "东方危机" # 招募中立/敌对大国
eqfm.102.d: "突然爆发的巴尔干骚乱正值[SCOPE.sCountry('eqfm_starter_scope').GetName]与[SCOPE.sCountry('ottoman_scope').GetName]之间的争端可能升级为公开战争之际。苏丹已经呼吁所有未涉及的国家保持中立。"
eqfm.102.f: "自从奥斯曼帝国征服拜占庭帝国以来，巴尔干对西方关闭了四个多世纪。随着奥斯曼帝国继续后退，大国已经抓住了获得外交利益的机会。然而，许多人担心帝国的崩溃可能引发经济动荡。"
eqfm.102.a: "让我们执行我们的设计。"
eqfm.102.b: "我们不能让苏丹崩溃。"
eqfm.102.c: "这不是我们的事务。"
eqfm.103.t: "东方危机" # 招募盟友国家
eqfm.103.d: "[SCOPE.sCountry('eqfm_starter_scope').GetName]与[SCOPE.sCountry('ottoman_scope').GetName]之间的争端可能升级为公开战争。苏丹已经呼吁其盟友来支持自己。根据条约，我们必须前来援助他们。"
eqfm.103.f: "欧洲大国，对东方问题执着不懈，显然打算分割奥斯曼帝国以谋取他们的利益。我们必须尽力阻止他们的设计得逞。"
eqfm.103.a: "我们会遵守诺言！"
eqfm.103.b: "让病人自生自灭吧。"
eqfm.104.t: "英国试图化解危机"
eqfm.104.d: "[SCOPE.sCountry('uk_scope').GetName]的大使赶到皇宫，要求与苏丹紧急会晤。他们带来了英国政府的一份奏章，提议以对塞浦路斯岛的宗主权换取他们在冲突中的中立立场。"
eqfm.104.f: "英国外交部长总是心怀叵测，机会主义，趁着我们弱小的时候利用我们，同时又把自己描绘成苏丹的慷慨朋友。这是侮辱。"
eqfm.104.a: "我们没有更好的选择。"
eqfm.104.b: "无能的家伙们！"
eqfm.104.tt: "#yellow 英国#!将保持中立。"
eqfm.105.t: "法国试图化解危机"
eqfm.105.d: "[SCOPE.sCountry('france_scope').GetName]的外交官迅速行动，试图摆脱危机。他们提议将[SCOPE.sCountry('tunis_scope').GetName]转交给法国宗主权，以换取他们在冲突中的中立立场。"
eqfm.105.f: "尽管法国对非欧洲大国采取了支配地位，但并不是每个欧洲国家都渴望对同等实力的对手进行战争，因为他们担心公众反对。"
eqfm.105.a: "这是唯一合理的行动。"
eqfm.105.b: "把这些机会主义者打发走吧。"
eqfm.105.tt: "#yellow 法国#!将保持中立。"
eqfm.106.t: "希腊试图化解危机"
eqfm.106.d: ""
eqfm.106.f: ""
eqfm.106.a: ""
eqfm.106.b: ""
eqfm.107.t: "[SCOPE.sCountry('bosnia_scope').GetName]举起武器！"
eqfm.107.d: "[SCOPE.sCountry('bosnia_scope').GetName]的游击队起义反抗[SCOPE.sCountry('ottoman_scope').GetAdjective]当局！各个帕夏发来密令警告我们，他们无法长时间抵挡无休止的基督徒和穆斯林战士的攻击。"
eqfm.107.f: "#yellow 波斯尼亚维拉耶特#!到处都爆发了非正式的叛乱，从与农村游击队的小规模冲突到与主要城市中组织混乱的民兵的激烈战斗。由于我们军队的注意力被引向其他地方，他们已经脱离了[SCOPE.sCountry('ottoman_scope').GetName]的统治，现在竟然胆敢要求从苏丹独立。"
eqfm.107.a: "他们将面对我们的审判。"
eqfm.107.b: "情况已经失控。"
eqfm.108.t: "[SCOPE.sCountry('bulgaria_scope').GetName]举起武器！"
eqfm.108.d: "[SCOPE.sCountry('bulgaria_scope').GetName]的游击队起义反抗[SCOPE.sCountry('ottoman_scope').GetAdjective]当局！这些叛乱分子由多瑙河对岸的俄国合作者武装并提供支持，他们迅速控制了保加利亚的核心地区，并宣布要“解放”我们统治下的所有保加利亚人。"
eqfm.108.f: "\"... 这里的地面上布满了骸骨，上面沾满了衣物和腐烂的肉块。空气中弥漫着一股沉重的，令人作呕的气味，随着我们的推进而变得更加浓烈。这开始变得可怕了。\"-J.A. MacGahan，关于1876年土耳其在保加利亚的暴行"
eqfm.108.a: "我们会粉碎他们。"
eqfm.108.b: "情况已经失控。"
eqfm.109.t: "东方危机"
eqfm.109.d: "[SCOPE.sCountry('eqfm_starter_scope').GetName]和[SCOPE.sCountry('eqfm_target_scope').GetName]之间的小规模冲突已经升级为武装冲突！\n\n#o 东方危机#!已经开始！"
eqfm.109.f: "\"如果巴黎有人被杀，那就是谋杀；东方五万人被割喉，那就是一个问题。\"-维克多·雨果"
eqfm.109.a: "出兵！"

eqfm.118.t: "苏丹的胜利"
eqfm.118.d: "在不可逾越的困境中，[SCOPE.sCountry('ottoman_scope').GetName]的军队不仅捍卫了帝国不受西方的愤怒，而且在战争艺术上成为了榜样。"
eqfm.118.f: "从高加索山脉的山麓到爱琴海的海岸，再到喀尔巴阡山脉，安纳托利亚和巴尔干地区现在都在帝国的掌控之中。随着苏丹国旗高高飘扬，没有人会怀疑哈里发国的声望和荣耀已经焕发新生！"
eqfm.118.a: "赞颂苏丹！"
eqfm.118.b: "我们已经尽了我们的职责。"
eqfm.118.c: "难以置信！"
eqfm.118.e: "令人难以置信。"
eqfm.119.t: "圣斯特凡诺条约"
eqfm.119.d: "[SCOPE.sCountry('ottoman_scope').GetName]的大军已经在巴尔干地区被击溃。为了避免完全失去君士坦丁堡，苏丹已经同意了一项激进的初步条约，将大部分巴尔干地区割让给[SCOPE.sCountry('bulgaria_scope').GetName]。"
eqfm.119.f: "保加利亚国家取得的不合理收益现在威胁到了土耳其帝国的完全瓦解。[SCOPE.sCountry('germany_scope').GetName]提议召开国际会议解决这个问题，以免引发更大的冲突。"
eqfm.119.a: "派遣我们的代表团。"

eqfm.120.t: "[SCOPE.sState('germany_capital_scope').GetCityHubName]会议"
eqfm.120.d: "随着尘埃落定，[SCOPE.sCountry('ottoman_scope').GetName]和大国之间的事务处理人员已经呼吁召开一次会议来解决彼此之间的事务。依靠[SCOPE.sCountry('germany_scope').GetName]作为“诚实调解人”的声誉，[SCOPE.sState('germany_capital_scope').GetCityHubName]被选为举办峰会的地点。"
eqfm.120.f: "国际会议是欧洲大陆上一种相对较新的化解冲突方式。在之前的几个世纪里，大多数战后解决方案都是通过直接在王室和外交团之间进行书面交流来完成的。尽管组织上仍然比较简陋，但政治家们认为这次会议是避免大国之间进一步升级的一个有希望的方法。"
eqfm.120.a: "我们的外交官将陈述我们的立场。"
eqfm.121.t: "保加利亚问题"
eqfm.121.d: "会议的首要议题是[SCOPE.sCountry('bulgaria_scope').GetName]在危机期间所取得的收益。[SCOPE.sCountry('russia_scope').GetName]和[SCOPE.sCountry('austria_scope').GetName]都发现自己受到了在巴尔干地区出现如此庞大独立国家的威胁。一些人担心承认“大保加利亚”的出现将是对[SCOPE.sCountry('ottoman_scope').GetName]的致命打击，并可能引发关于君士坦丁堡控制权的更大冲突。"
eqfm.121.f: "\"我恳求我的同胞，对他们来说，欧洲其他国家比其他国家更依赖我们，要求并坚持我们的政府，这个政府已经朝着一个方向努力，现在应该朝着另一个方向努力，并应该尽其全部力量与欧洲各国一起，以消灭保加利亚的土耳其行政权。现在让土耳其人用唯一可能的方式带走他们的滥用行为，那就是带着他们自己走......\"-W.Gladstone，1876"
eqfm.121.a: "这是不合理的！"
eqfm.121.b: "这些土地属于苏丹。"
eqfm.121.c: "我们必须限制他们的野心。"
eqfm.121.tt1: "#yellow 保加利亚#!的领土将缩小。"
eqfm.121.tt2: "#yellow 东鲁梅利#!将被创建。"

eqfm.122.t: "波斯尼亚问题"
eqfm.122.d1: "会议的注意力现在转向了[SCOPE.sCountry('austria_scope').GetName]对[SCOPE.sCountry('bosnia_scope').GetName]的设计问题。奥地利代表团要求控制该地区。"
eqfm.122.d2: "会议的注意力现在转向了[SCOPE.sCountry('austria_scope').GetName]对[SCOPE.sCountry('bosnia_scope').GetName]的设计问题。会议拒绝向奥地利提供该地区的任何收益，原因是奥地利迟迟没有支持波斯尼亚人的事业。"
eqfm.122.f: "波斯尼亚和黑塞哥维那的不稳定局势让奥斯曼人感到沉重的压力。即使在今天，该地区的人口也分为东正教的塞尔维亚人，天主教的克罗地亚人和穆斯林的波斯尼亚人。在没有奥斯曼统治的压迫力的情况下，许多人担心该地区将成为一个政治火药桶。"
eqfm.122.a1: "这对[ROOT.GetCountry.GetName]来说是一个重要时刻！"
eqfm.122.a2: "来吧，拿走吧！"
eqfm.122.b1: "这真是不幸。"
eqfm.122.b2: "太好了。"
eqfm.122.c1: "他们值得拥有。"
eqfm.122.c2: "我们应该谨慎行事。"
eqfm.1eqfm.122.d1: "会议的注意力现在转向了[SCOPE.sCountry('austria_scope').GetName]对[SCOPE.sCountry('bosnia_scope').GetName]的问题。奥地利代表团要求获得占领该地区的权力。"
eqfm.122.d2: "会议的注意力现在转向了[SCOPE.sCountry('austria_scope').GetName]对[SCOPE.sCountry('bosnia_scope').GetName]的问题。会议引用奥地利迟迟没有站出来支持波斯尼亚人事业的懈怠，拒绝向他们提供该地区的任何收益。"
eqfm.122.f: "波斯尼亚和黑塞哥维那的不稳定局势让奥斯曼人感到沉重的压力。即使在今天，该地区的人口也分为东正教的塞尔维亚人，天主教的克罗地亚人和穆斯林的波斯尼亚人。在没有奥斯曼统治的压迫力的情况下，许多人担心该地区将成为一个政治火药桶。"
eqfm.122.a1: "这对[ROOT.GetCountry.GetName]来说是一个重要时刻！"
eqfm.122.a2: "来吧，拿走吧！"
eqfm.122.b1: "这真是不幸。"
eqfm.122.b2: "太好了。"
eqfm.122.c1: "他们值得拥有。"
eqfm.122.c2: "我们应该谨慎行事。"
eqfm.122.tt: "#yellow 波斯尼亚#!将保持独立。"

eqfm.123.t: "黑山问题"
eqfm.123.d: "[SCOPE.sCountry('montenegro_scope').GetName]自中世纪以来一直坚称与[SCOPE.sCountry('ottoman_scope').GetName]的自由。会议通过承认黑山独立，国际上承认了黑山独立国家不受奥斯曼影响的地位。"
eqfm.123.f: "加上失去波斯尼亚和保加利亚，这一行动粉碎了奥斯曼人将黑山人置于苏丹统治之下的梦想。"
eqfm.123.a: "就这样吧。"
eqfm.123.b: "Онамо，'намо!"
eqfm.123.tt: "#yellow 黑山#!将继续摆脱奥斯曼影响。"

eqfm.124.t: "塞尔维亚问题"
eqfm.124.d: "紧随其后的是来自[SCOPE.sCountry('serbia_scope').GetName]的代表团，他们寻求脱离[SCOPE.sCountry('ottoman_scope').GetName]的独立，并控制巴尔干地区所有的塞尔维亚土地。会议对这一提议感到不满，谴了了塞尔维亚代表团，但确保了该国完全独立于苏丹。"
eqfm.124.f: "尽管[SCOPE.sCountry('russia_scope').GetName]希望能支持塞尔维亚的事业，但其外交官发现俄国代表团将注意力集中在保加利亚事业上，感到自己受到了背叛。"
eqfm.124.a: "南斯拉夫主义是有风险的。"
eqfm.124.b: "这是一场悲剧。"

eqfm.125.t: "公国问题"
eqfm.125.d: "带来的一个小问题是[SCOPE.sCountry('upmw_scope').GetName]独立问题。自危机开始以来，这个国家已经有效地独立于苏丹，并请求正式承认这一事实。会议支持他们的雄心，违背了苏丹的意愿。"
eqfm.125.f: ""
eqfm.125.a: ""

eqfm.126.t: "高加索问题"
eqfm.126.d: "最后来到桌旁的是最初的争端：[SCOPE.sCountry('russia_scope').GetName]对高加索的设计。随着奥斯曼军队的溃败，沙皇要求在[SCOPE.sCountry('ottoman_scope').GetName]的亚洲领土上取得广泛的收益。"
eqfm.126.f: "俄罗斯对英国在中亚获得更多立足点的担忧长期以来引起了俄国外交服务的关注。通过确保高加索山脉牢固地置于俄罗斯国界之内，沙皇希望阻止英国向黑海扩张。"
eqfm.126.a: "就这样吧。"
eqfm.126.b: "太好了。"

eqfm.127.t: "开放"
eqfm.127.d: "开放"
eqfm.127.f: "开放"
eqfm.127.a: "开放"

eqfm.128.t: "希腊代表团"
eqfm.128.d: "希腊代表团援引他们在战争中的贡献，要求与[SCOPE.sCountry('ottoman_scope').GetName]的同胞联合。"
eqfm.128.f: "希腊人要求收回他们在塞萨利和色雷斯的前领土的愿望没有被忽视。为了承诺和平，奥斯曼人把土地割让给了希腊国家。"
eqfm.128.a: "有趣。"
eqfm.128.b: "优秀。"

eqfm.129.t: "柏林条约"
eqfm.129.d: "柏林会议已经结束。每个参与者的全权代表已经带着柏林条约的副本回国进行批准。"
eqfm.129.f: "目前俄罗斯对巴尔干地区的扩张已经受到限制，但许多人认为奥斯曼帝国的解体现在几乎是一种必然。"
eqfm.129.a: "和平时代。"

eqfm.130.t: "塞浦路斯公约"
eqfm.130.d: "[SCOPE.sCountry('uk_scope').GetName]提出了一项与苏丹谈判的秘密协议，将[SCOPE.sState('cyprus_state_scope').GetName]岛转让给英国控制。尽管这引起了愤怒，但会议已经同意，以避免破坏谈判。"
eqfm.130.f: "作为对土耳其事业支持的回报，英国与土耳其达成了一项协议。他们将坚决反对任何划分[SCOPE.sCountry('ottoman_scope').GetName]的尝试，以交换塞浦路斯。"
eqfm.130.a: "奇怪的时代造就了奇怪的伙伴关系。"

eqfm.131.t: "突尼斯公约"
eqfm.131.d: "[SCOPE.sCountry('france_scope').GetName]提出了一项协议，其中他们与[SCOPE.sCountry('ottoman_scope').GetName]达成协议，奥斯曼人同意放弃对[SCOPE.sCountry('tunis_scope').GetName]的宗主权，以换取法国不参与冲突。"
eqfm.131.f: "虽然对奥斯曼人的行为并不特别满意，但法国表现出了更倾向于专注于国内事务和非洲殖民努力。"
eqfm.131.a: "这就是政治。"
eqfm.131.b: "这就是政治。"

eqfm.132.t: "君士坦丁堡公约"
eqfm.132.d: ""
eqfm.132.f: ""
eqfm.132.a: ""


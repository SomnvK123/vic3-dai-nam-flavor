l_simp_chinese:
eqfm.001.t: "东方问题"  # Ottoman
eqfm.001.d: "在整个欧洲，人们普遍认为[ROOT.GetCountry.GetName]正在衰落。随着异议在帝国中蔓延，宫廷发现自己在巴尔干地区与动荡和分裂作斗争。"
eqfm.001.f: "每年，欧洲的目光都更多地转向[Concept('concept_eastern_question','$concept_eastern_question$')]。就像秃鹫一样扑向尸体，大国已经开始努力推行他们对巴尔干的设计，而无视我们的意愿。崇高的门户依然挺拔，我们将不遗余力地抵制欧洲帝国的图谋。"
eqfm.001.a: "我们必须有秩序。"
eqfm.002.t: "欧洲病夫"  # Great Powers
eqfm.002.d: "在整个欧洲，人们普遍认为[SCOPE.sCountry('ottoman_scope').GetName]正在衰落。随着土耳其国家努力控制其臣民，[ROOT.GetCountry.GetAdjectiveNoFormatting]外交官员提出我们可能通过支持巴尔干地区蓬勃发展的民族主义运动来在该地区立足。"
eqfm.002.f: "每年，欧洲的目光都更多地转向[Concept('concept_eastern_question','$concept_eastern_question$')]。就像秃鹫一样扑向尸体，大国已经开始努力推行他们对巴尔干的设计，而不顾苏丹的意愿。"
eqfm.002.a: "这是一个机会。"
eqfm.003.t: "宫廷的衰落"  # Local Tags
eqfm.003.d: "在整个巴尔干地区，人们普遍认为[SCOPE.sCountry('ottoman_scope').GetName]正在衰落。随着苏丹努力控制他的臣民，情绪是在近五个世纪的奥斯曼统治后即将获得自由的情绪。"
eqfm.003.f: "每年，欧洲的目光都更多地转向[Concept('concept_eastern_question','$concept_eastern_question$')]。就像秃鹫一样，民族主义领袖们已经开始努力推动他们对巴尔干的设计，而不顾苏丹的意愿。"
eqfm.003.a: "这是我们的时代。"

je_eocfm_patriarch_authority: "东正教会"
je_eocfm_patriarch_authority_reason: "只要我们不背弃信仰，国家就能够对其主教施加影响，并将其努力引导到国家的利益上。在我们的帝国崩塌之前，#N 安条克#!、#N 耶路撒冷#!、#N 亚历山大#!、#N 莫斯科#!、#N 罗马#!和#N 君士坦丁堡#!的六位牧首得以享受相对和平与团结的环境，在需要时共商要务，也在必要时共商事务，为教会团体贡献力量。让我们重回黄金时代。你有#tooltippable;tooltip:[Country.GetTooltipTag],je_eocfm_patriarch_authority_sources 一系列#! 来自于 [Concept('concept_patriarch_authority','$concept_patriarch_authority$')]\n\n你的总生成量为 #blue [GetPlayer.MakeScope.Var('eocfm_patriarch_authority_var').GetValue]#! [Concept('concept_patriarch_authority','$concept_patriarch_authority$')]，归因于：[SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_theocracy_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_monarchy_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_schools_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_autocephaly_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_caesaropapism_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_subsidy_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_all_seats_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_rome_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_constantinople_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_antioch_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_alexandria_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_jerusalem_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_moscow_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_state_religion_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_free_religion_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_total_separation_type')]\n \n你的总使用量用于:[SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_council_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_intregrating_seat_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_schismatic_type')][SCOPE.GetRootScope.GetCountry.GetCustom('patriarch_authority_icon_type')]"
je_eocfm_patriarch_authority_sources: "以下是 [Concept('concept_patriarch_authority','$concept_patriarch_authority$')] 的来源：\n• #green +100#! 作为基础。\n• #green +200#! 从实行 #yellow 神权制#! 而来。\n• #green +100#! 从实行 #yellow 君主制#! 而来。\n• #green +100#! 从实行 #yellow 教会学校#! 而来。\n• #green +200#! 从拥有 #yellow 自主权#! 而来。\n• #green +100#! 从拥有 #yellow 皇教体制#! 而来。\n• #green +100#! 从#bold 给教会提供补贴#! 而来。\n• #green +100#! 每控制一个 #bold 牧首位置#! 而来。\n• #green +400#! 控制所有六个 #bold 牧首位置#! 而来。"

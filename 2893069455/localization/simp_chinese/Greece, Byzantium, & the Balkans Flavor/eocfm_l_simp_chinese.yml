concept_patriarch_authority: "牧首权威"
concept_patriarch_authority_desc: "虽然东正教会在名义上是一个统一的普世教会，但其结构比起西方的罗马教廷更为分散。每个国家都有显赫的主教，可以在其管辖范围内对崇拜产生影响，有时会偏离君士坦丁堡的普世牧首的意志。[Concept('concept_patriarch_authority','$concept_patriarch_authority$')]代表着国家影响其地方主教以“引导”信徒朝向国家意志的能力。"

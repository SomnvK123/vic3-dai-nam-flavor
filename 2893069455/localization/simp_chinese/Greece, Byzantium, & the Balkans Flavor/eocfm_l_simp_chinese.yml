notification_eocfm_patriarch_authority_restored_name: "[Concept('concept_patriarch_authority','$concept_patriarch_authority$')] 已恢复！"
eocfm_declare_autocephaly: "宣布自治"
eocfm_declare_autocephaly_desc: "君士坦丁堡的普世牧首曾是东方教会的统一象征，但越来越受到奥斯曼苏丹的影响。除非我们切断与君士坦丁堡的联系，否则奥斯曼人肯定会继续干涉我们的政治，并可能试图进一步压制我们的文化。"
eocfm_commission_icon: "委托圣像"
eocfm_commission_icon_desc: "我们可以利用对教会的一些影响力委托制作圣像，以激励信徒。这些圣像在使用 10 年后需要更换。"
eocfm_convoke_council: "召开普世大公会议"
eocfm_convoke_council_desc: "我们在东正教社区中的影响力是显而易见的。我们可以利用这种力量召集一个普世大公会议，解决东正教会内长期存在的问题。"
eocfm_integrate_seat: "整合牧首位置"
eocfm_integrate_seat_desc: "东正教会的一个古老牧首位置已经落入我们的控制之下。如果我们认为合适，我们可以用忠于[ROOT.GetCountry.GetName]的主教取代原来的主教。这可能会激怒他们的前赞助者。"
eocfm_enact_caesaropapism: "实施皇教体制"
eocfm_enact_caesaropapism_desc: "皇教体制，即将教会与国家合并的观念，已经成为保护和强化我们作为一个民族独立身份的手段。通过使教会屈从于国家机器，我们可以避免苏丹进一步干涉我们的事务。"
eocfm_revoke_caesaropapism: "撤销皇教体制"
eocfm_revoke_caesaropapism_desc: "将教会屈从于国家的行为产生了深远影响。教会在国家的压迫下苦苦挣扎，失去了以往的影响力。如果我们愿意，我们可以恢复神职人员的独立性。"
eocfm_subsidize_church: "给教会提供补贴"
eocfm_subsidize_church_desc: "[ROOT.GetCountry.GetName]可以以支持神职人员的需求为名向东正教会提供国家补贴...作为他们顺从的交换条件。"
eocfm_stop_subsidies: "停止教会补贴"
eocfm_stop_subsidies_desc: "市政领导人谴责使用世俗资金来支持精神事务。"
eocfm_establish_sunday_schools: "建立主日学校"
eocfm_establish_sunday_schools_desc: "传播神圣之言并让我们最贫困的孩子们获得读写能力的最佳途径是在礼拜仪式后为他们提供每周教育。"
eocfm_disband_sunday_schools: "解散主日学校"
eocfm_disband_sunday_schools_desc: ""
eocfm_dissolve_the_monasteries: "解散修道院"
eocfm_dissolve_the_monasteries_desc: "在我们的边远地区，有几个古老的修道院仅凭惯性存在。管理者建议通过关闭几个次要的修道院，可以显著改善教会和国家的职能。"

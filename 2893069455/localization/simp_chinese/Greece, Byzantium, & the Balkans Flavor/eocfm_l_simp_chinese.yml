je_eocfm_autocephaly: "宣布自治"
 je_eocfm_autocephaly_reason: "[ROOT.GetCountry.GetName]为了维护独立，尽管受到了土耳其控制的普世牧首和莫斯科牧首的设计，进行了艰苦斗争。我们的神职人员已经达成共识，抵御他们的干预唯一的方法是为我们的国家建立一个自治的管辖区。\n\n由于这一过程造成的分裂和行政混乱状态，我们的[Concept('concept_patriarch_authority','$concept_patriarch_authority$')]减少了 #red -800#!。"
je_eocfm_autocephaly_goal: "进度条已满。"
je_eocfm_integrating_seat: "整合牧首之位"
je_eocfm_integrating_seat_reason: "东正教会是由四个东方古代牧首席领导的，还有较年轻的莫斯科牧首。由于我们控制了其中一个位置，我们的政治家一直在努力安置对国家需求友好的神职人员。"
je_eocfm_integrating_seat_goal: "进度条已满。"
je_eocfm_the_metropolitan_lands: "大主教领地"
je_eocfm_the_metropolitan_lands_reason: "在基督升天和十二使徒传教之后的几十年里，安纳托利亚是早期基督教的摇篮。我们将把这些土地从萨拉森人手中解放出来。"
je_eocfm_church_of_the_east: "东方教会"
je_eocfm_church_of_the_east_reason: "黎凡特是基督教的发源地，也是我们信仰的圣地。牧首们已经授予并强加了一个命令，要求我们从穆斯林占领者手中夺回这些土地。"
je_eocfm_the_orthodox_realms: "东正教国家"
je_eocfm_the_orthodox_realms_reason: "在帝国时代，君士坦丁堡的牧首曾见证基督教在草原上的传播。自从女王城的沦陷以来，俄罗斯蛮族自称是普世牧首的继承人。现在我们控制了基督教的摇篮，我们应该扩大我们对斯拉夫东正教社区的监督。"
je_eocfm_the_orthodox_realms_status: "巩固东方牧首位置。"
je_eocfm_texas_left: "跨越友好的海洋"
je_eocfm_texas_left_reason: "黑海曾完全处于希腊的势力范围之内。我们将为仍然称其海岸为家的人民带来解脱。"
je_eocfm_the_third_rome: "俄罗斯，第三罗马"
je_eocfm_the_third_rome_reason: "俄罗斯帝国自封为东罗马和普世牧首的继承者。他们只是对 #bold 帝国#! 和 #bold 普雷斯韦亚#! 的权利的篡夺者。"
je_eocfm_the_third_rome_status: "让俄罗斯屈服。"
decree_eocfm_consecrate_metropolitan: "祝圣大主教"
decree_eocfm_consecrate_metropolitan_desc: "授权一位杰出的本地主教行使对其主教区的直接控制。#yellow 这将花费 100 [Concept('concept_patriarch_authority','$concept_patriarch_authority$')]#!。"
decree_eocfm_encourage_almsgiving: "鼓励施舍"
decree_eocfm_encourage_almsgiving_desc: "促进对东正教会的捐款（并从中捞一笔）。#yellow 这将花费 100 [Concept('concept_patriarch_authority','$concept_patriarch_authority$')]#!。"

grefm.800.t: "雅典考古学会"
grefm.800.d: "在政治家和学者的支持下，来自全希腊的考古学家已经开始定位、保护和修复古希腊的众多文物。希腊考古服务的埃弗尔斯已经为即将展开的研究制定了一份名单。"
grefm.800.f: "雅典考古学会成立于1837年，对从拜占庭时期到希腊青铜时代的无数废墟和文物进行了登记和修复，发挥了关键作用。"
grefm.800.a: "一个崇高的努力。"
grefm.800.tt: "#blue 使用#! #red Mörgenrote#! #blue 接口进行考古挖掘。#!"
grefm.801.t: "定义希腊的根"
grefm.801.d: "雅典考古学会取得的巨大进展让希腊人民感受到他们在巴尔干半岛的存在感一直延伸到史前时代。每个月，越来越多的人将希腊国家视为存在于各个时代的国家，甚至把现代国家与在奥斯曼人之前的拜占庭和罗马政府混为一谈。"
grefm.801.f: "由于我们的学者，我们可以毫不怀疑地说\"原始希腊人\"在记载历史之前就已经抵达巴尔干半岛，并一直存在至今。无论是在罗马城邦、拜占庭帝国还是威尼斯和奥斯曼压迫者手中，这片土地一直都是并且永远都将是希腊的。"
grefm.801.a: "我们一直在这里。"
grefm.910.d: "来自[SCOPE.sCountry('epirus_scope').GetName]的领导人已经开始兑现他们寻求与[SCOPE.sCountry('greece_scope').GetName]联盟的承诺，建立了两国之间的海关联盟。"
grefm.916.t: "科帕伊达的土地收复"
grefm.916.d: "科帕伊达湖项目的首席工程师宣布从湖中收复了几大片土地。"
grefm.916.f: "随着湖水水位的下降，附近村庄的一些农民已经开始准备土地进行农业。"
grefm.916.a: "太棒了。"

l_simp_chinese: 
 grefm.001.t: "巴伐利亚统治与希腊人之国"
 grefm.001.d: "独立战争结束后，自相残杀的希腊人未能在新近收复的领土上建立中央政府。数年的内战过后，[SCOPE.sCountry('france_scope').GetName]、[SCOPE.sCountry('russia_scope').GetName]与[SCOPE.sCountry('uk_scope').GetName]三大列强扶植了一位巴伐利亚天主教君主统治重建的[ROOT.GetCountry.GetAdjectiveNoFormatting]国家。"
 grefm.001.f: "[ROOT.GetCountry.GetName]是一个贫瘠的农业国，依附于列强存在。年轻的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]如履薄冰，在个人的专制欲望与列强反复无常的奇思妙想间寻求平衡。[ROOT.GetCountry.GetAdjectiveNoFormatting]人民热切地接受了[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的统治，但一天不进行改革、一天不实现繁荣，他的权威就一天天受到损害。如果希腊能够站稳脚跟，它甚至有可能面对迫在眉睫的[Concept('concept_eastern_question','$concept_eastern_question$')]。"
 grefm.001.f2: "“希腊国王啊！古希腊将学术的光辉遗赠给了德意志，而通过您，德意志将这份礼物连同利息一并偿还，并对您心怀感激，因为我们在您的身上看到了使地球的长子复苏的希望。” ——P·苏索斯，1837年"
 grefm.001.a: "希腊必须找到自己的道路。"
 grefm.002.t: "避免危机"
 grefm.002.d: "面对民众的不信任，尽管[SCOPE.gsInterestGroup('ig_landowners_scope').GetName]的阴谋诡计层出不穷，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]限制了王权并给予[ROOT.GetCountry.GetName]公民以自由。然而，许多人继续呼吁进一步削弱贵族的权力和地位，使希腊成为海外希腊人民的希望灯塔。"
 grefm.002.f: "我们为推翻土耳其压迫者而战，并不是为了用德国压迫者取而代之。"
 grefm.002.a: "仁慈的[SCOPE.sCharacter('king_otto_scope').GetFullName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]万岁！"
 grefm.003.t: "九月革命"
 grefm.003.d: "[SCOPE.sCharacter('ig_armed_forces_scope').GetFullName]对王室的改革步伐裹足不前感到恼火，于是召集军队，要求制定一部正式宪法，限制王室的权力，并赋予[ROOT.GetCountry.GetName]的公民以权利。"
 grefm.003.f: "当[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('king_otto_scope').GetFirstName]登上希腊王位时，许多人都希望他能给[ROOT.GetCountry.GetName]带来繁荣。但他反其道而行之，违背希腊人民的意愿，成为了一位专制君主。"
 grefm.003.a: "我们必须屈服于人民的意愿。"
 grefm.003.b: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('king_otto_scope').GetFullName]不会被乌合之众欺凌。"
 grefm.004.t: "宪法万岁！"
 grefm.004.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('king_otto_scope').GetFullName]违背了人民的意愿，开始在[ROOT.GetCountry.GetName]建立专制主义政权。"
 grefm.004.f: "随着权力集中于王室，人民对国家滥用权力感到焦虑不安。"
 grefm.004.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]将会取得君权。"
 grefm.005.t: "废除巴伐利亚统治"
 grefm.005.d: "面对支持希腊独立的列强，希腊人民废除了君主制。"
 grefm.005.f: "“希腊人的国王！他们为了推翻革命的成果，恢复腐败的旧制度，不惜损害人民对王室的崇敬和对您的忠诚。你最终成为了自己人性弱点的牺牲品。你们习惯于崇拜德意志的一切，被德国人在军事和其他各种事务上无与伦比的组织能力所迷惑，你们不仅期待着德意志的胜利，而且还渴望着德意志的胜利，希望它能使你们把政府的一切权力都集中到自己手中，并在实质上抛弃我们的自由宪法。”"
 grefm.005.a: "这是[ROOT.GetCountry.GetAdjectiveNoFormatting]人民的意愿！"
 grefm.006.t: "十月革命"
 grefm.006.d: "尽管出生在德意志的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('king_otto_scope').GetFullName]尝试保住王位，但事实证明，[ROOT.GetCountry.GetName]的人民和贵族都无法忍受他。由[SCOPE.sCharacter('ig_armed_forces_scope').GetFullName]领导的军队突然采取行动，占领了首都并废黜了国王。被废黜的[SCOPE.sCharacter('king_otto_scope').GetFirstName]在[SCOPE.sCountry('uk_scope').GetAdjectiveNoFormatting]海军的帮助下流亡到[SCOPE.sState('bavaria_state_scope').GetNameNoFormatting]。[SCOPE.sCharacter('voulgaris_scope').GetFullName]已经成立了一个看守政府，并将在今年晚些时候选出新君主。"
 grefm.006.f: "“希腊，我的希腊，我挚爱的希腊。”——废王奥托在在临终病榻之上"
 grefm.006.a: "[ROOT.GetCountry.GetName]将会找到自己的道路。" 
 grefm.006.b: "[ROOT.GetCountry.GetName]将会找到自己的道路。"
 grefm.007.t: "天命攸归"
 grefm.007.d: "凭借坚定果断的领导，[SCOPE.sCharacter('king_otto_scope').GetFirstName]确立了其统治的合法性。"
 grefm.007.f: "“今天，失落已久的祖国浴火重生。今天，政治、宗教和军事斗士们死而复生，因为我们的国王来了，我们用上帝的力量孕育了他。赞美您神圣的名，全能和最仁慈的主。”"
 grefm.007.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('king_otto_scope').GetFullName]万岁！"
 grefm.008.t: "推翻巴伐利亚统治"
 grefm.008.d: "面对曾经支持希腊独立的列强和企图统治[ROOT.GetCountry.GetName]的德意志僭主，希腊人民废除了君主制。"
 grefm.008.f: "“希腊人的国王！他们为了推翻革命的成果，恢复腐败的旧制度，不惜损害人民对王室的崇敬和对您的忠诚。你最终成为了自己人性弱点的牺牲品。你们习惯于崇拜德意志的一切，被德国人在军事和其他各种事务上无与伦比的组织能力所迷惑，你们不仅期待着德意志的胜利，而且还渴望着德意志的胜利，希望它能使你们把政府的一切权力都集中到自己手中，并在实质上抛弃我们的自由宪法。”"
 grefm.008.a: "这是[ROOT.GetCountry.GetAdjectiveNoFormatting]人民的意愿！"
 grefm.008.b: "这是[ROOT.GetCountry.GetAdjectiveNoFormatting]人民的意愿！"
 grefm.009.t: "选举君主"
 grefm.009.d: "随着巴伐利亚君主被推翻，看守政府要求举行公投，以确定王位的最佳候选人。然而，事实证明这很成问题，最受欢迎的候选人都不愿意或受到政治掣肘而无法继承王位。看守政府必须指定一位新统治者。"
 grefm.009.f: "希腊的统治者大大高估了希腊王冠在外国人眼中的价值。许多贵族不愿统治这个落后的国家。而最受欢迎的候选人因与英国、法国或俄罗斯王室有联系而被被剥夺了资格。"
 grefm.009.1: "年轻的贵族，丹麦的威廉，将登上王位。"
 grefm.009.2: "尊贵的王子，佛兰德的菲利普，是最佳选择。"
 grefm.009.3: "我们的恩人希腊之友艾纳尔配得上最崇高的地位。"
 grefm.009.4: "伊普斯兰提斯家族的成员将为我们服务。"
 grefm.009.5: "叛逆的加里波第，最坏又能怎么样呢？"
 grefm.009.6: "我们应当建立共和国。"
 grefm.009.7: "[ROOT.GetCountry.GetName]应当拥有一位希腊人君主。"
 grefm.010.t: "立宪承诺"
 grefm.010.d: "当摄政委员会为年轻的国王接管希腊时，曾承诺将制定一部正式宪法来限制。目前，国王实行绝对专制，却没有机构能够对滥用权力进行制衡。新近获得土地的贵族对限制其权力的尝试百般阻挠，国王本人对改革也毫无兴趣。"
 grefm.010.f: "......但时至今日，也即1835年，希腊国土狭小，人口稀少，外国摄政统治着一贫如洗又流离失所的国民，它怎么能指望迅速发展并在未来实现繁荣与进步呢？我们公共事务的领导者和管理者是一个外国人，无论他多么善良和忠诚，还是会把个人利益看得高于一切，还是会竭尽全力在他的国家建立一个超然的骄傲存在，以摆脱我们的血汗与不宽容，因为根据自然理性，在个人利益之外，他不可能有其他有利于他的领土——外国领土——的同情心。——L·康托里奥蒂斯，1835年"
 grefm.010.a: "必须做些什么。"
 grefm.011.t: "奥斯曼遗产"
 grefm.011.d: "尽管[ROOT.GetCountry.GetName]摆脱了奥斯曼帝国的统治，但不发达的政府机构仍保留了土耳其税收政策的遗存。加之缺少王室的干预，希腊政府的资金基几乎全部来自于一贫如洗的农民。"
 grefm.011.f: "“……这里的农业处于一种最不发达的状态。即使在雅典附近也随处可见2000年前使用的木犁和粗制垫子。土地一遍一遍地被犁过，作物一季又一季地被种植，直到耗尽肥力土地的不能承载为止。肥料并没有成规模的使用，农具也是最粗糙的形式。只有一些地区有灌溉的使用，并且据我所知这种方法可以很轻松地从古埃及人的实践中习得。希腊拥有大量的橄榄和葡萄，但质量不佳；并且橄榄油和葡萄酒不能承受运输。”——W·墨菲特，美国驻雅典领事于1889年"
 grefm.011.a: "不幸。"
 grefm.012.t: "土地大改革"
 grefm.012.d: "随着土地税的改革，希腊人民卸下了沉重的负担。"
 grefm.012.f: "希腊实现繁荣的唯一途径就是摆脱这些压迫者的残余。"
 grefm.012.a: "这才公平。"
 grefm.013.t: "司法公正"
 grefm.013.d: "[SCOPE.sState('brigandage_state').GetName]的地方领导人以[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的名义处决了几名因强盗罪被捕的强盗。非正式的法律程序与残酷的处决激起了人们对[ROOT.GetCountry.GetName]混乱局面的关注。"
 grefm.013.f: "自约翰尼斯·卡波迪斯特里阿斯执政以来，地方头领和非正规部队在农村肆虐。这些准军人源自奥斯曼时代的非正规步兵，在数次失败的反摄政起义中被征召入伍，但现在却拒绝从事寻常工作。\n\n由于得不到中央政府的支持，许多地方领导人和土地所有者转而求助于军事法庭来恢复秩序。迄今为止，国王的政府对此一直持宽容态度，因为它更关心各政治派别之间的相互博弈，以防止对王室权威的挑战。"
 grefm.013.a: "一定有更好的方法。"
 grefm.014.t: "强盗的终结"
 grefm.014.d: "在国家坚定果断的领导下，肆虐我国农村的土匪们放下了武器，走上了工作岗位，成为社会的有用之才。"
 grefm.014.f: "确保国内同胞的安全固然是最基本、最平凡的事情，但也是使国家合法化的重要一步。"
 grefm.014.a: "干得漂亮。"
 grefm.015.t: "腐败猖獗"
 grefm.015.d: "自独立以来，政府中的大多数高级职位都由几个贵族家庭的成员和国王本人的朋友担任。在摄政期间，希腊政治家一再遭到排挤并造成了分裂，这使得希腊政府缺乏凝聚力与驱动力。重要领导人呼吁改革政府的腐败和王朝性质，让更多希腊本土政治家加入政府。"
grefm.015.f: "\"......副总督转移到其临时居住地的国家并开始履行其政府职责，随之而来的是，尤其是来自巴伐利亚的一群无用之徒，他们没有普遍的美德和对我们共同事物的真正热情，就像那些支持我们独立的人一样，自封为希腊爱好者，在新权力的支持和保护下占据了公共职位，可以说，他们把面包从希腊战士的嘴巴中拿走了。\"-P. Papanaoum，1851"
grefm.015.a: "我们将拭目以待。"

 grefm.016.t: "光荣的政权"
 grefm.016.d: "为政府官僚机构的大部分人员提供选举机会，使政府摆脱了奥斯曼帝国的中世纪传统。"
 grefm.016.f: "[ROOT.GetCountry.GetRuler.GetFirstName]可能踌躇满志，但希腊唯一的出路就是摆脱专制主义的束缚。"
 grefm.016.a: "为了国家的利益。"
 grefm.030.t: "希腊人的国王"
 grefm.030.f: "\"希腊人民，欢呼吧！你们的困扰结束了，我们的祈祷得到了回应！希腊的危险过去了，大地停止了震颤，地震在国家的大厦动摇到基础之前就平息了。\" - #italic Evnomia，5月24日#!"
 grefm.030.1: "年轻的丹麦国王乔治将继承王位."
 grefm.030.2: "高贵的王子菲利普·德·弗兰德是个不错的选择."
 grefm.030.3: "这位恩人，费城人埃纳德，应该得到最高的职位." 
 grefm.030.4: "伊普西兰蒂斯家族的一位成员会为我们服务得很好."
 grefm.030.5: "叛徒加里波第，最糟糕的情况是什么？"
 grefm.030.6: "我们将建立一个共和国."
 grefm.030.7: "[ROOT.GetCountry.GetName] 将有一位希腊贵族."
 grefm.030.1.tt: "#yellow 丹麦乔治一世#! 成为统治者. #italic 这是历史选项#!."
 grefm.030.2.tt: "#yellow 菲利普·德·弗兰德#! 成为统治者."
 grefm.030.3.tt: "#yellow 费城人埃纳德#! 成为统治者."
 grefm.030.4.tt: "A #yellow 伊普西兰蒂斯家族领主#! 成为统治者."
 grefm.030.5.tt: "#yellow 加里波第#! 成为统治者."
 grefm.030.7.tt: "#purple 巴列奥略家族的后裔将登上王位#!."  
 grefm.030.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('king_of_the_hellenes_scope').GetFullName]万岁！"



 grefm.200.t: "希腊人之国"
 grefm.200.d: "民族主义的兴起使我国公民产生了一种不可分割的愿望，即把[SCOPE.sCulture('greek_culture_scope').GetName]民族的所有土地都纳入一个单一的希腊人国家治下。"
 grefm.200.f: "“我们拜托了奥斯曼帝国数百年的统治，建立了希腊国家。然而，这还不够。我们的许多同胞仍然生活在外国统治的压迫下，渴望拥有属于自己的国家。这个梦想只有通过合并所有希腊土地才能实现，无论占领者同意与否，我们都将实现这一目标。”"
 grefm.200.a: "我们对这片土地的要求无可辩驳。"
 grefm.200.b: "扩张暂时不是优先事项。"
 grefm.201.t: "伟大理想"
 grefm.201.d: "随着[ROOT.GetCountry.GetAdjectiveNoFormatting]国家的扩张，最狂热的民族主义者提出了一个更加雄心勃勃的计划：通过征服前[ROOT.GetCountry.GetAdjectiveNoFormatting]土地来恢复拜占庭帝国。"
 grefm.201.f: "“昨日看来荒诞不经的梦想，如今已在我们的掌握之中。紫凤凰将再次崛起！”"
 grefm.201.a: "我们将会解放希腊人的土地。"
 grefm.201.b: "我们应该庆祝已经取得的成就。"
 grefm.201.c: "让我们的人民回到[SCOPE.sState('grefm_capital_state').GetCityHubName]"
 grefm.202.t: "[ROOT.GetCountry.GetName]的未来"
 grefm.202.d: "随着博斯普鲁斯海峡和达达尼尔海峡两岸的土地被征服，伟大理想的目标已经实现。现在，我们的公民期待着国家带领他们进入一个新时代。"
 grefm.202.f: "“多年以后，仍将属我。”\n——希腊民族主义诗歌"
 grefm.203.t: "色萨利之地"
 grefm.203.d: "随着希腊国家的独立，要求从希腊民族聚居地驱逐奥斯曼势力并与之重新统一的呼声不绝于耳。而其中重新收回[SCOPE.sState('grefm_thessaly_scope').GetName]这片被《伦敦协定》剥夺的肥沃平原的呼声尤为高涨。"
 grefm.203.f: "“明媚的潭蓓谷！激起自然神力的吾爱之地，\n黄金年华的仙女和女神们，\n正在荫凉的河岸上嬉戏，\n歌声在四周回荡，去追寻那古老足迹。\n青春又和煦的风儿，不断地吹拂，\n撒下花朵、芬芳；又留下那神秘的露珠，\n和那春日里绽放着的极乐花儿。”\n——马克·阿肯赛德《想象力的乐趣》1744"
 grefm.203.a: "吾等希腊同胞终将解放"
 grefm.203.b: "我们已经取得了足以引以为傲的成就"
 grefm.204.t: "大希腊之地"
 grefm.204.d: "古拜占庭帝国的核心地带业已被我国囊括。然而，仍有无数希腊同胞在南欧和近东居住。从巴尔干崎岖的山丘到黎凡特海的海岸，复仇主义的呼声正要求将这些受压迫的希腊人带回家。"
 grefm.204.f: "在《洛桑条约》签订之前和奥斯曼帝国大屠杀之前，希腊人与安纳托利亚东部丘陵地区的其他古老居民一起，分布在黑海和黎凡特海沿岸。"
 grefm.204.a: "希腊人可在[ROOT.GetCountry.GetName]内找到庇护所"
 grefm.204.b: "我们已经取得了值得骄傲的成就。"
 grefm.205.t: "希腊人之国"
 grefm.205.d: "整个[ROOT.GetCountry.GetName]都爆发出欢呼声，人们全欧亚大陆的希腊人统一于希腊国而欢呼。"
 grefm.205.f: "从伯罗奔尼撒半岛到庞图斯，希腊人终于发现自己处于希腊国家的庇护之下。"
 grefm.205.a: "[ROOT.GetCountry.GetName]已被光复！"
 grefm.210.t: "伊庇鲁斯的希腊民族主义"
 grefm.210.d: "民族主义热情的高涨导致伊庇鲁斯的希腊人要求从土耳其压迫者手中独立。"
 grefm.210.f: "亲希腊情绪在奥斯曼帝国统治下的希腊民众中蔓延开来。[ROOT.GetCountry.GetName]国内外的煽动者和政治家都呼吁希腊国家支持希腊人民统一在一面共同的旗帜下。"
 grefm.210.a: "我们应该支持他们的事业。"
 grefm.210.b: "我们不能干涉外国内政。"
 grefm.211.t: "伊庇鲁斯起义"
 grefm.211.d: "希腊人在伊庇鲁斯掀起了反对土耳其统治的叛乱。"
 grefm.211.f: "在秘密支持下，我们的兄弟在海外为推进希腊事业而战。"
 grefm.211.a: "我们应该支持我们的希腊兄弟！"
 grefm.212.t: "塞浦路斯的希腊民族主义"
 grefm.212.d: "随着民族主义浪潮席卷全球，塞浦路斯的希腊人民向[ROOT.GetCountry.GetName]求助。"
 grefm.212.f: "尽管与希腊国家相隔甚远，但塞浦路斯自古以来就是希腊人的土地。塞浦路斯希腊人渴望摆脱穆斯林的压迫，开辟一条自由的道路。"
 grefm.212.a: "我们应该提供物质援助。"
 grefm.212.b: "我们不能干涉外国内政。"
 grefm.213.t: "塞浦路斯叛乱"
 grefm.213.d: "希腊人在塞浦路斯掀起了反对土耳其统治的叛乱。"
 grefm.213.a: "我们应该支持我们的[ROOT.GetCountry.GetAdjectiveNoFormatting]兄弟！"
 grefm.213.b: "我们应该提供援助。"
 grefm.214.t: "马其顿的希腊民族主义"
 grefm.214.d: "希腊的影响力在巴尔干地区不断扩张，处于穆斯林统治下的希腊人开始萌生与希腊国家统一的愿望。"
 grefm.214.f: "马其顿曾是古希腊文化的核心地带，至今仍有大量的希腊人居住在那里。这些希腊人不仅渴望自由，而且认为自由触手可及。"
 grefm.214.a: "我们应该支持他们的事业。"
 grefm.215.t: "马其顿起义"
 grefm.215.d: "受奥斯曼帝国残酷迫害了数百年，[SCOPE.sState('macedonia_state_scope').GetName]的反抗者举起了反抗的利刃。他们渴望摆脱穆斯林统治者强加在他们身上的枷锁，重新与新生的希腊国家统一。"
 grefm.215.f: "自从摆脱奥斯曼帝国的枷锁之后，[ROOT.GetCountry.GetName]的暴徒和土匪纷纷闯入马其顿，试图在异国他乡为希腊事业而战。"
 grefm.215.a: "我们一定要和我们的同胞站在一起！"
 grefm.215.b: "我们应该帮助他们。"
 grefm.216.t: "克里特的希腊民族主义"
 grefm.216.d: "在克里特岛，紧张气氛日益升温。在克里特未能成为希腊国家的一部分后，民族主义者在克里特人民中挑起了新的动荡。新的起义似乎即将到来，只是时间问题。"
 grefm.216.f: "在威尼斯人征服这片岛屿后，岛上的东正教希腊人一直强烈反抗其统治。现在，在奥斯曼土耳其人和埃及人的统治之下，局势正趋于紧张的顶点，希腊人的财产被剥夺，东正教牧师在街头被私刑处决。"
 grefm.216.a: "一定有更好的方法。"
 grefm.217.t: "克里特叛乱再起"
 grefm.217.d: "克里特岛的希腊人因遭受穆斯林统治者的虐待和歧视而愤怒，奋起反抗他们的统治者。他们再一次寻求与希腊国家统一。"
 grefm.217.a: "我们走。"
 grefm.220.t: "[SCOPE.sState('ionian_overlord_capital').GetCityHubName]条约"
 grefm.220.d: "经过慎重谈判，[SCOPE.sCountry('ionian_overlord').GetName]同意将[SCOPE.sCountry('ionian_country').GetName]让与[ROOT.GetCountry.GetName]。"
 grefm.220.f: "“为了促进我们两国间的友好关系，以及振奋[ROOT.GetCountry.GetAdjectiveNoFormatting]人民的精神，[SCOPE.sCountry('ionian_overlord').GetRuler.GetPrimaryRoleTitle]大度地割让了伊奥尼亚群岛。群岛在我国的友好保护国政权治下，受益于我们真诚而公正的帮助，并且我们相信，在我们值得信赖的朋友的悉心关爱下，群岛的人民将走向繁荣。”"
 grefm.220.a: "最令人满意的解决方案。"
 grefm.221.t: "[SCOPE.sState('epirus_capital').GetCityHubName]条约"
 grefm.221.d: "在迅速的磋商后，[SCOPE.sCountry('epirus_scope').GetName]同意加入希腊国。"
 grefm.221.f: "伊庇鲁斯希腊人为自由而战反抗奥斯曼帝国，重新加入希腊大家庭是理所当然的。"
 grefm.221.a: "最令人满意的解决方案。"
 grefm.222.t: "[SCOPE.sState('cyprus_capital').GetCityHubName]条约"
 grefm.222.d: "在迅速的磋商后，[SCOPE.sCountry('cyprus_scope').GetName]同意加入希腊国。"
 grefm.222.f: "塞浦路斯希腊人用自己的血汗赢得了自由。如果他们愿意，那么加入希腊兄弟姐妹的行列是正确的。"
 grefm.222.a: "最令人满意的解决方案。"
 grefm.009.1.tt: "#yellow 丹麦的威廉#!成为了统治者。#italic 这是历史选项#!"
 grefm.009.2.tt: "#yellow 菲利普·德·佛兰德#!成为了统治者"
 grefm.009.3.tt: "#yellow 希腊之友艾纳尔#!成为了统治者"
 grefm.009.4.tt: "一名#yellow 伊普斯兰提斯家族的成员#!成为了统治者"
 grefm.009.5.tt: "#yellow 加里波第#!成为统治者"
 grefm.009.7.tt: "#purple 巴列奥略家族的后裔将登上王位#!"
grefm.017.t: "皇家巴伐利亚辅助军"
grefm.017.d: "当奥托国王于1832年到来时，他带来了3500名巴伐利亚士兵，以巩固他的统治。从那时起，他们发现自己无法融入希腊的生活，既不说这种语言，也无法享受到广泛存在的希腊农村的舒适生活。随着开支不断增加以及它们在平息叛乱方面的使用，它们的存在使希腊人民感到疲惫不堪。"
grefm.017.f: "\"外国辅助部队需要花费，而没有多大作用\"，而\"在军队中坚持欧洲的服装和装备已经使最有用的人脱离了军队，使他们成为不满的人。\"-奥斯曼·冯·普罗凯什-奥斯滕，奥地利外交官"
grefm.017.a: "他们为国王效劳。"
grefm.018.t: "巴伐利亚军队离开[ROOT.GetCountry.GetName]"
grefm.018.d: "屈从于改革者的呼声，[SCOPE.sCharacter('king_otto_scope').GetFullName] 解散了皇家巴伐利亚辅助部队，让他们返回巴伐利亚。"
grefm.018.f: "虽然这对挽救国家财政是必要的，但我们的军队将需要一些时间来重新组织，以建立一个完全由希腊军官组成的军队。"
grefm.018.a: "必要之举。"
grefm.020.t: "强盗再次袭击"
grefm.020.d: "强盗在[SCOPE.sState('brigandage_state').GetName]的乡村进行了袭击，引起了对国家行动的呼声。"
grefm.020.f: "幻灭的不规则军队利用政府控制的薄弱和警察的腐败抢劫和掠夺劳工和绅士。他们来得快，走得也快，当地首领发现有几个村庄被洗劫一空。"
grefm.020.a: "无信仰的懦夫。"
grefm.031.t: "\"谁之过？\""
grefm.031.d: "与君主制持续的失望相一致，改革派[SCOPE.sCharacter('intelligentsia_leader_scope').GetFullName]发表了一篇煽动性的文章，谴责国王偏袒他的朋友而不是真正得到民众支持的政治家担任首相。这篇文章已经被支持者和反对者所抓住，既是对希腊国家的有效批评，也是对王室的严重侮辱。"
grefm.031.f: "\"如果人民没有过错，那么政治家有过错，其他人说，国家对他们的腐败负有责任，因为他们属于这个国家。我们回答说，如果希腊是自治的，那么政治家的行为将是国家的责任，但由于宪法的扭曲和议会的事实上的无效，希腊确实是作为绝对君主制治理的，接下来就是非法政权宣传的政治家也会变得有过错。\" -K. Trikoupis，1874"
grefm.031.a: "王室必须采取行动。"
grefm.040.t: "民族主义者热情"
grefm.040.d: "泛民族主义浪潮在[ROOT.GetCountry.GetName]席卷而来. 正如#希腊伟大理念#!的梦想仍未实现, 国内外活动人士都请愿 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] ，希望使国家走上 [GetCulture('greek').GetName] 统一."
grefm.040.f: ""价格优惠!" -E.韦尼泽洛斯, 1912"
grefm.040.a: "必须采取行动."
grefm.041.t: "军事同盟"
grefm.041.d: "在效仿历史民族主义革命的过程中，一小部分意气风发的年轻军官在国民议会内形成了一个激进的派别。这在军队中引起了不满，他们组成了\"军事同盟\"，要求在军队中消除所有王室的影响。许多人甚至走向了共和国的调子。"
grefm.041.f: "尽管在政治上属于各种各样的政治光谱，但军事同盟的参与者受到早期派别的启发，该派别被称为\"日本集团\"，以纪念明治维新者。虽然\"日本人\"采取了反寡头政治的立场，但军事同盟一直保持着强烈的精英主义立场。两者都最终助长了反君主主义的情绪。"
grefm.041.a: "也许他们有一些好的观点。"

 grefm.045.t: "克里特英雄"
 grefm.045.d: "在军事联盟不断积聚力量并直接威胁君主政体的同时，一位名不见经传的政治家[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName]来到了 [SCOPE.sState('grefm_capital_scope').GetCityHubName]并提出了一个大胆的计划：利用他作为克里特斗争领袖的声望，此人打算掌握权力，并通过让步和自由改革来安抚军事联盟。"
 grefm.045.f: "“在雅典完成学业后，我回到家，挂上了我的子弹带。在我不得不拿起武器反对土耳其政府之前，我在家乡的法庭上审理过的案件并不多。虽然我的父亲出生在希腊，但我被认为是一个奥斯曼帝国的臣民——一个叛国者——这只是因为我的母亲出生在土耳其国旗之下……我很快就陷入不得不做出选择的境地：我是应该做一名职业律师，偶尔兼职革命者，还是应该做一名职业革命者，偶尔兼职律师……而自然而然地，我成为了一名职业革命者。”——E.韦尼泽洛斯，1919"
 grefm.045.a: "[ROOT.GetCountry.GetName]最终会有强有力的领导。"
 grefm.045.b: "这人对政治了解多少？"
 grefm.046.t: "古迪政变"
 grefm.046.d: "由于厌倦了与君主制无尽的纷争，军事联盟已经夺取了[SCOPE.gsInterestGroup(‘ig_armed_forces_scope’).GetName]的控制权，并将皇室家族赶出了[ROOT.GetCountry.GetName]。他们成立了一个军政府统治的国家，其目标是强化希腊在海峡地区的优势地位。"
 grefm.046.f: ""
 grefm.046.a: "[ROOT.GetCountry.GetName]最终会有强有力的领导。"
 grefm.047.t: "克里特英雄"
grefm.047.d: "在一个不起眼的日子里，一位相对不知名的政治家，[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName]，带着一个大胆的计划来到[SCOPE.sState('grefm_capital_scope').GetCityHubName]：借助他作为克里特岛斗争领导人的知名度，顺应民族主义的浪潮，这个人打算握有权力，通过一系列自由和军事改革，将#greece Megali Idea#从梦想变为现实。"
grefm.047.f: "\"在雅典完成学业后，我回到家乡，挂上我的子弹带。在我回到家乡的法庭之前，我在那里并没有审过多少案件，就不得不对抗土耳其政府。尽管我的父亲在希腊出生，但我被视为奥斯曼的臣民，因为我的母亲是在土耳其旗帜下出生的...不久后，我达到了这样一个决定是否应该以专业律师和偶尔的革命者的身份还是以职业革命者和偶尔的律师的身份...我自然而然地成为了一个职业革命者。\" - E. Venizelos，1919"
grefm.047.a: "[ROOT.GetCountry.GetName] 将终于拥有强大的领导力。"

 grefm.050.t: "召集国民议会"
 grefm.050.d: "[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName]和他的支持者在韦尼泽洛斯的修正主义支持者和选民之间引发了激烈的辩论，前者鼓动对希腊国家进行彻底改革，后者主张彻底重写宪法."
 grefm.050.f: ""我对皇室惰性的批评被误解为反王朝。相反，我认为，表现出对统治王朝的忠诚符合国家的利益，因此，我认为议会应该保持修正主义，并根据现代要求，在所有涉及公共教育、劳工问题以及资本与劳工关系的事项上重新制定立法基础。因此，我将与那些旨在将希腊在道义和物质上提升到其他现代国家水平，并使其成为东方文明和进步的伟大因素的人合作." -E. 韦尼泽洛斯, 1910"
 grefm.050.a: "接受修正主义者的指控."
 grefm.050.b: "重组整个国家."
 grefm.100.t: "修复啤酒厂"
 grefm.100.d: "在新独立的希腊，一些巴伐利亚贵族跟随奥托国王定居在阿提卡，并带来了他们对啤酒的嗜好。为了与从巴伐利亚进口的啤酒竞争，约翰‑卡尔‑菲克斯在雅典建立了一家酿酒厂，以满足精英阶层的需求。"
 grefm.100.f: "历史注释：在奥托国王摄政时期，约翰·亚当·菲克斯开始了他的啤酒酿造事业，并很快发现这是一项极为赚钱的生意。在成为乔治一世国王的指定啤酒供应商后，他的儿子约翰·卡尔·菲克斯开创了菲克斯啤酒厂。这家啤酒厂随后在希腊啤酒市场上占据了主导地位，一直持续到20世纪60年代。"
 grefm.100.a: "让啤酒流动起来！"
 grefm.101.t: "希腊铁路"
 grefm.101.d: "阿提卡与塞萨利的连接清楚地表明了[ROOT.GetCountry.GetName]从农业社会中转变的迹象。"
 grefm.101.f: "历史注释：在19世纪80年代，希腊铁路建设的序幕在总理查里劳斯·特里库皮斯的监督下拉开。他负责监督雅典与新征服的塞萨利地区之间的首条铁路线的建设，随后又扩展至色雷斯地区。"
 grefm.101.a: "前进！"
 grefm.102.t: "希腊航空的诞生"
 grefm.102.d: "在[SCOPE.sState('attica_scope').GetCityHubName]一个晴朗的日子里，希腊飞行家埃马努埃尔‑阿吉罗普洛斯成为第一个飞越雅典上空的希腊人，给下面的市民带来了欢乐和好奇。"
 grefm.102.f: "历史注释：1912年2月8日，阿吉罗普洛斯成为第一个在希腊上空飞行的人。当天进行的第二次飞行中，搭载了当时的总理埃莱夫特里奥斯·韦尼泽洛斯，这一壮举深刻地影响了国家领导人，使他们认识到建立希腊空军的重要性。"
 grefm.102.a: "对[ROOT.GetCountry.GetName]多么有意义的一天。"
 grefm.103.t: "商业传统"
 grefm.103.d: "自新石器时代晚期希腊文明首次踏足巴尔干半岛起，他们就在爱琴海的海上贸易中扮演了举足轻重的角色。希腊航运巨头们积累的财富如此巨大，以至于他们的物质支持成为了#italic 希腊启蒙运动#!的催化剂，最终引领至希腊革命的爆发。"
 grefm.103.f: "在历史的长河中，希腊人一直在爱琴海上占据着海上霸权。在奥斯曼帝国的统治期间，希腊商人开始崭露头角，逐渐建立起自己的影响力。从16世纪到18世纪，随着大不列颠、法国和俄罗斯之间的政治博弈，东地中海的贸易被希腊人牢牢掌握，他们的商船穿梭于波光粼粼的海面，成为了地中海东部贸易的主宰者。"
 grefm.103.a: "爱琴海属于希腊人。"
 grefm.110.t: "赫普坦画派的衰落"
 grefm.110.d: "自希腊独立以来，爱奥尼亚群岛上的艺术名校随着艺术家们的海外探索而日渐衰落。一个皇家委员会建议国家建立一所皇家艺术学校，以吸引希腊艺术家。"
 grefm.110.f: "在君士坦丁堡陷落后的几个世纪里，爱奥尼亚群岛上的艺术家们继承了拜占庭艺术传统。随着希腊的独立以及意大利和法国艺术家的影响，许多艺术家开始转向浪漫主义，摆脱拜占庭艺术的束缚。"
 grefm.110.a: "一个崇高的尝试"
 grefm.110.b: "国家担负不起。"
 grefm.111.t: "科派斯平原"
 grefm.111.d: "随着希腊工程技术的进步，土地勘探人员建议，国家可以在阿提卡的科帕伊斯湖下开垦出肥沃的土地。"
 grefm.111.f: "历史简介：3000 多年前，迈锡尼人曾将科派斯湖的水抽干，这是史前工程的一项惊人壮举。千百年来，他们的石工工程逐渐失效，湖泊重新蓄水。沿湖两岸的村民经常抱怨洪水泛滥，在大量洪水流入湖中时，水位会升高。"
 grefm.111.a: "我们将拭目以待。"
 grefm.111.tt: "你现在将获得一个能够#bold 排干科派斯湖#!的决议。"
 grefm.112.t: "收复科派斯湖"
grefm.112.d: "经过多年的稳定工作，科庇斯湖已经变成了科庇斯平原。已经有无数的农民开始在湖底进行农业活动，希望这片平原将来会被耕种多代。"
grefm.112.f: "\"后来从我的德国朋友Ziegler那里得知，希腊的工程师官员们把希望寄托在排干科庇斯湖的计划上。首先，这个伟大的事业在进行过程中产生的公共开支对他们的利益来说不可忽视，其次，科庇达耕地的产量较慢将填满他们的腰包。\" -P. Papanaoum，1873"

 grefm.112.a: "伟大的成就"
 grefm.113.t: "城堡现身"
 grefm.113.d: "随着科派斯湖湖水的退去，研究人员注意到湖中有一处凸起。虽然人们已经知道这个地方有一个古代遗迹，但考古学会的专家们认为，这个遗迹可能在水位的不断消退的过程中发挥了更大的作用，并已请求对该区域进行挖掘。"
 grefm.113.f: "这座名为“格拉”的遗址俯瞰着科派斯平原。在湖水被排干之前，该遗址一直被忽视，很有可能是早期希腊遗址"
 grefm.113.a: "我们将拭目以待。"
 grefm.120.t: "奥运会的重生"
 grefm.120.d: "经过多年的政治和金融扯皮，奥运会在两千多年后首次举行。人们纷纷来到 [SCOPE.sState('attica_state').GetCityHubName]，体验仪式和活动。"
 grefm.120.f: "“我宣布雅典第一届国际奥林匹克运动会开幕。国家万岁，希腊人民万岁！”"
 grefm.120.a: "值得纪念的一天。"
 grefm.120.tt: "举办奥运会需要200行政力"
 grefm.121.t: "资助雅典皇家大学"
 grefm.121.d: "为了发展希腊国家，国王[SCOPE.sCharacter('university_benefactor').GetFullName] 已经提出了 [ROOT.GetCountry.GetName]与爱奥尼亚学院相同的第一所高等教育机构。这项计划对该州来说将是一笔巨大的开支。"
 grefm.121.f: "历史简介：1837 年，国王颁布敕令成立了雅典大学（当时名为奥托尼安大学）。虽然起初规模较小，但它代表了现代希腊在文化方面所迈出的一大步。如今，这所大学已成为巴尔干地区历史最悠久的高等学府。"
 grefm.121.a: "一个崇高的尝试"
 grefm.121.b: "国王知道他的诉求"
 grefm.122.t: "国立大学校"
 grefm.122.d: "随着[SCOPE.sState('university_state').GetCityHubName]的解放，[SCOPE.sCharacter('university_benefactor').GetFullName]建议重组法纳尔希腊东正教学院并向大众开放，以造福希腊人民。"
 grefm.122.f: "君士坦丁堡帝国大学于公元 425 年在狄奥多西二世皇帝的统治下成立，被称为#italic Universitas#!。它与欧洲式的大学不同，是一所高等学府，教授从法律、数学到哲学的各种学科。该学院设有 31 个教席，教授拉丁语和希腊语两种语言，旨在培养有能力的官僚来管理拜占庭国家。君士坦丁堡陷落后，该大学重组为现在的形式，为牧师和奥斯曼帝国的大臣服务。"
 grefm.122.a: "我们将恢复希腊文化的荣耀。"
 grefm.122.b: "我们将恢复希腊文化的荣耀。"
 grefm.122.c: "一个无畏的尝试"
 grefm.123.t: "妇女杂志"
 grefm.123.d: "一位年轻的克里特妇女[SCOPE.sCharacter('kalliroi_scope').GetFullName] 最近在 [SCOPE.sState('grefm_capital_scope').GetCityHubName] 创办了一份报纸。这份双周刊被命名为#italic 妇女杂志#!，帕伦甚至出席会议，谴责将妇女排除在生产劳动和政治舞台之外的做法。"
 grefm.123.f: "“原则无国界，真理无国界。妇女权利问题在任何地方都是一样的；在任何地方都可以用两个词来概括：平等、公正。”——莱昂里歇尔"
 grefm.123.a: "我们必须赋予妇女和儿童权利"
 grefm.123.b: "女人就该老老实实去做家务"
 grefm.123.tt: "历史简介：卡利罗伊‑帕伦被公认为希腊女权运动的创始人。她出生于克里特岛，在雅典接受教育，创办了完全由女性经营的#italic 妇女杂志#!，成为在希腊全国传播女权主义信息的跳板。她出席了多次国际会议，并成立了多个致力于推进妇女事业的福利组织。不过，她并不直接支持妇女选举权，因为她担心这对于世纪之交的希腊来说过于激进。"
 grefm.124.t: "希腊女权联盟"
 grefm.124.d: "卡利罗伊‑帕伦发起的运动取得了成果，妇女的地位得到了提升，不再只是家庭主妇。此外，对童工的限制使希腊国家有机会改善下层人民的生活。随着对妇女言论的限制逐渐消失，一些领导人呼吁进一步改革，包括婚姻平等和选举权。"
 grefm.124.f: "历史简介：在整个 19 世纪末的第一波女权改革浪潮之后，女权主义者阿夫拉‑西奥多罗普罗（Avra Theodoropoulou）成立了希腊女权联盟，明确提出要为妇女争取选举权。这一事业最终分两个阶段取得了成功：第一阶段是在 1930 年为识字妇女争取选举权，第二阶段是在 1952 年为所有妇女争取选举权。女权主义的努力使妇女逐渐从沉默的家庭主妇转变为希腊民族主义发展的积极参与者。"
 grefm.124.a: "我们会继续推动妇女平权"
 grefm.124.b: "我们应该为已经取得的成就而自豪。"
 grefm.130.t: "科林斯运河"
 grefm.130.d: "在[SCOPE.sState('corinth_canal_site').GetNameNoFormatting]详细调查结束后，[SCOPE.sCharacter('ig_intelligentsia_scope').GetFullName]宣布有可能完成已故政治家伊奥尼斯‑卡波迪斯特里阿斯设想的大胆计划：一条横跨科林斯的海上运河。"
 grefm.130.f: "自古希腊时代以来，科林斯地峡一直是连接伯罗奔尼撒半岛和大希腊的重要通道。凭借我们的现代创新技术，或许有可能将爱奥尼亚海和爱琴海连接起来，而历史上的尝试都失败了。"
 grefm.130.a: "开工"
 grefm.131.t: "科林斯运河建成"
 grefm.131.d: "经过多年的努力，我们成功开凿了一条横跨科林斯的运河，爱琴海和爱奥尼亚海的海水现在在地峡上交汇。"
 grefm.131.f: "这条运河拥有高耸的石灰石城墙，大大缩短了从色雷斯到西欧的航程。"
 grefm.131.a: "希腊工程的奇迹"
 grefm.132.t: "皇宫"
 grefm.132.d: "经过多年的辩论，在 [SCOPE.sState('palaia_anaktora_site').GetCityHubName]建造一座王室官邸的提案已被提出。"
 grefm.132.f: "这座皇宫由巴伐利亚建筑师弗里德里希‑冯‑盖特纳设计，并由巴伐利亚路德维希一世出资建造，旨在提高王室的声誉。"
 grefm.132.a: "很好的提议"
 grefm.132.b: "这是笔无用的开销"
 grefm.140.t: "雅典考古学会"
 grefm.140.d: "在政治家和学者的支持下，希腊各地的考古学家已经开始了对众多古希腊遗迹的定位、保护和修复工作。希腊考古学会的考古学家们已经编制了一份需要立即研究的遗址清单。"
 grefm.140.f: "雅典考古学会成立于 1837 年，在为从拜占庭时代到希腊青铜时代的无数遗址和文物进行编目和修复方面发挥了重要作用。"
 grefm.140.a: "崇高的努力"
 grefm.140.a.tt: "您现在可以通过日志启动考古研究。"
 grefm.141.t: "准备发掘"
 grefm.141.d1: "考古学会的考古学家们已经组织了一支队伍，在 [SCOPE.sState('grefm_excavation_site').GetName] 开始对遗址进行系统发掘。目前考古队已在 [SCOPE.sState('grefm_excavation_site').GetCityHubName] 驻扎，等待批准出发。"
 grefm.141.d2: "考古协会的专家们已经组建了一支队伍，开始对格拉城堡进行系统发掘。考古队目前正在等待批准出发。"
 grefm.141.f: "从伯罗奔尼撒半岛到遥远的兴都库什山脉，我们可以找到无数的希腊遗产宝藏。"
 grefm.141.a: "好的，祝他们好运。"
 grefm.141.b: "不行，现在不是一个好时机。"
 grefm.141.tt: "你可以在日志中追踪进度"
 grefm.142.t: "格拉城堡发掘完毕"
 grefm.142.d: "负责监督格拉遗址活动的埃弗拉报告说，已经完成了对遗址的全面详查。对遗址中几座建筑的发掘表明，迈锡尼建筑已经开始与古希腊建筑相似。此外、"
 grefm.142.f: "这座城堡横跨一个突出的山丘，远远地伸入前科派斯湖。该遗址的面积比古代雅典的占地面积还要大，主要有两个特点：北部有一个类似宫殿的建筑，南部有两个类似仓库的建筑。学者们推测，整个遗址可能是战争或困难时期的临时避难所。"
 grefm.142.a: "干得漂亮"
 grefm.143.t: "雅典卫城发掘完毕"
 grefm.143.d: "督政宣布，雅典卫城遗址的清理和编目工作已经完成。在成堆的废弃砖块和石块中，已经在整个山顶发现了十几处独特的遗址。其中最突出的是帕台农神庙，它是一座古代纪念碑——金库和后来的教堂，目前其中心是一座清真寺。"
 grefm.143.f: "雅典卫城的历史可以追溯到迈锡尼时期，几千年来，雅典卫城被无数次修建和改造。雅典卫城上分布着多座神庙、圣殿和城门，每座神庙、圣殿和城门在历代政权的统治下都有了新的用途，直至现代。"
 grefm.143.a: "干得漂亮"
 grefm.144.t: "帕特农神庙发掘完毕"
 grefm.144.d: "废弃的清真寺已经拆除，帕台农神庙的场地也已清理完毕。在建筑师尼古拉斯‑巴拉诺斯的监督下，帕台农神庙的残骸已被确认，并用铁和混凝土进行结构加固，重新组装。"
 grefm.144.f: "历史说明：首次修复帕台农神庙是考古服务处的一项不朽成就。然而，巴拉诺斯使用的技术却饱受批评。巴拉诺斯在大理石上钻孔并用混凝土代替铅封剂的技术最终在接下来的一个世纪里对遗址造成了严重的、不可逆转的破坏。"
 grefm.144.a: "伟大的成就"
 grefm.145.t: "克诺索斯发掘完毕"
 grefm.145.d: "在米诺斯‑卡洛凯里诺斯于 19 世纪 70 年代首次发现该遗址的基础上，一个考古队又在青铜时代宫殿的中心发现了一个巨大的王座厅。进一步的工作发现了庞大的宫殿建筑群遗迹和古代城市遗址。"
 grefm.145.f: "历史简介：在克诺索斯正式发掘之前，克里特岛在米诺斯文明中的地位并不明确。随着宫殿群的发现，这座城市在米诺斯文明中的核心地位得到了确认。发掘工作从 1900‑1931 年持续进行，并进行了几个阶段的修复。如今，该遗址距离伊拉克利翁很近。"
 grefm.145.a: "难以置信！"
 grefm.146.t: "重建米诺斯宫殿"
 grefm.146.d: "在英国人阿瑟‑埃文斯的帮助下，工人们完成了宫殿及其相关建筑的大规模重建工作。工匠们将现代修复工作与古代美学融为一体，煞费苦心地重建了几个房间和壁画。"
 grefm.146.f: "历史注解：虽然“重建”的宫殿给人留下了深刻印象，但也受到了批评，因为埃文斯在重建时使用了大量的创作许可，有时还添加了一些没有证据或后来被证明不正确的装饰。"
 grefm.146.a: "好消息！"
 grefm.147.t: "提洛发掘完毕"
 grefm.147.d: "由于该岛自拜占庭时代起就被遗弃，仅由少数看守人管理，德洛斯岛的“发掘”更多的是对遗址上各种建筑的清点。几座神庙和社会中心保存完好。"
 grefm.147.f: "德洛斯岛位于基克拉迪群岛之中，是爱琴海的神话核心。德洛斯一词本身的意思是“环绕”，这表明了古希腊人如何看待德洛斯与其周围岛屿之间的关系。"
 grefm.147.a: "太棒了"
 grefm.148.t: "拉里萨发掘完毕"
 grefm.148.d: "经过不懈的努力，考古处已经详细列出了遍布城市的几处遗址和建筑。并开始向地方官员分发清单，希望城市规划者能够避免破坏已知的古代遗址。"
 grefm.148.f: "多年来，一些希腊城市已被废弃，但也有一些城市（如拉里萨）一直在使用，中世纪和现代建筑与古建筑共存。"
 grefm.148.a: "干得漂亮！"
 grefm.150.t: "挖掘按计划进行"
 grefm.150.d: "首席工程师报告说，正在进行的挖掘项目比预期进展得更快。监理也表示，该项目现在回比预期更快完成。"
 grefm.150.f: "除非地基出现意外，我们的工作进展顺利，并将继续如此。"
 grefm.150.a: "好消息！"
 grefm.150.tt: "发掘将会向前#green 推进#!4个月"
 grefm.151.t: "请求工业设备"
 grefm.151.d: "堆积的粘土和突然出现的基岩混杂在一起，令挖掘现场的工程师们感到困惑。负责监理的工程师建议使用重型机械来破坏不规则的地形。"
 grefm.151.f: "一两个电钻应该就能解决这个问题。他们一到，我们甚至可以改变整个项目方法"
 grefm.151.a: "他们会得到他们需要的东西。"
 grefm.151.a.tt: "发掘将会向前#green 推进#!2个月"
 grefm.151.b: "去敲几块石头？我可不这么认为。"
 grefm.151.b.tt: "发掘将会向后#red 推迟#!6个月"
 grefm.152.t: "古墓重见天日"
 grefm.152.d: "督政宣布在挖掘现场发现了一个墓穴，并要求对墓葬物品进行更详细的编目。规划人员告诫说，这种做法可能会大大延误工程进度。"
 grefm.152.f: "虽然它们可能只是死者的小饰品，但这些墓葬物品却是那个时代保存最完好的一些遗物"
 grefm.152.a: "我们必须找出一切。"
 grefm.152.a.tt: "发掘将会向后#red 推迟#!6个月"
 grefm.152.b: "这是在浪费时间"
 grefm.153.t: "发掘现场发生泥石流"
 grefm.153.d: "当地报纸报道了挖掘现场发生的轻微泥石流。工程人员将此归咎于异常高的降水量。"
 grefm.153.f: "听着，我告诉他们我们可能需要加固整个南墙，但他们让我继续铲。"
 grefm.153.a: "这太糟糕了。"
 grefm.153.a.tt: "发掘将会向后#red 推迟#!4个月"
 grefm.154.t: "发掘现场的灾难！"
 grefm.154.d: "多份报告称，挖掘队遭遇了灾难。经过调查，督政报告说发生了大规模泥石流和结构坍塌，夺去了数十名工人的生命，并将大部分遗址再次掩埋在泥土之下。"
 grefm.154.f: "虽然这是一起悲剧性事件，但分析师们建议进行几项改革，以防止今后再发生此类事件……"
 grefm.154.a: "不幸"
 grefm.154.a.tt: "发掘将会向后#red 推迟#!12个月"
 grefm.155.t: "挖掘工作激起民众兴致"
 grefm.155.d: "发掘项目周围的人群越来越多。儿童和成年人都纷纷前来观看这一壮观场面。有些人甚至加入进来，帮助我们的工人。"
 grefm.155.f: "老实说，他们根本不碍事。我们的一些年轻学者甚至借此机会向大众宣传我们引以为豪的历史。"
 grefm.155.a: "有趣"
 grefm.156.t: "宫殿重见天日"
 grefm.156.d: "发掘现场的工程师发现了一系列古老的地基，这些地基被初步认定为古代贵族统治者的宫廷。预计大量古代文物中的第一批已经运抵考古学会办公室。"
 grefm.156.f: "这里珍宝荟萃！看来，足够在国家博物馆新建一个展厅了！"
 grefm.156.a: "太棒了"
 grefm.201.c.tt: "#italic 这是历史选项。根据 1923 年《洛桑条约》的条款，列强规定希腊人和土耳其人在两国之间进行交换#!"
 grefm.210.a.tt: "您现在可以通过日志支持伊庇鲁斯起义"
 grefm.210.b.tt: "希腊可能会选择在伊庇鲁斯挑起叛乱。"
 grefm.211.b: "我们应该考虑伸出援手"
  grefm.210.tt1: "您现在可以支持希腊分离主义事业。"
 grefm.210.tt2: "克里特岛的紧张局势将逐月加剧，直到民族主义者再次准备发动起义。"
 grefm.210.tt3: "[SCOPE.sCountry('grefm_greece_scope').GetAdjective]国家可能会在赞助我们自己的[GetCulture('greek').GetName]人群."
 grefm.212.a.tt: "您现在可以通过日志支持塞浦路斯起义"
 grefm.212.b.tt: "希腊可能会选择在塞浦路斯挑起叛乱。"
 grefm.213.f: "在秘密支持下，我们的兄弟在海外为推进希腊事业而战。"
 grefm.214.a.tt: "您现在可以通过日志支持马其顿起义"
 grefm.214.b: "我们不能干涉外国内政。"
 grefm.214.b.tt: "希腊可能会选择在马其顿挑起叛乱。"
 grefm.216.b: "这是穆斯林的土地"
 grefm.216.tt: "克里特岛的紧张局势将逐月加剧，直到民族主义者再次准备好发动起义。"
 grefm.217.b: "高尚的事业"
 grefm.218.t: "士麦那起义"
 grefm.218.d: "士麦那的分离主义者拿起武器反对我们的统治。他们要求从穆斯林统治中独立出来，并有权与希腊国家结盟."
 grefm.218.f: "希腊在巴尔干半岛的扩张引发了安纳托利亚各地希腊社区的异议。其中最主要的是斯迈尼人，他们长期以来一直渴望与爱琴海对岸的兄弟们结盟."
 grefm.218.a: "我们要粉碎这些忘恩负义的人."
 grefm.218.b: "他们现在已经超出了我们的控制范围."
 grefm.219.t: "虚拟"
 grefm.219.d: "虚拟"
 grefm.219.f: "虚拟"
 grefm.219.a: "虚拟"
 
 grefm.220.t: "[SCOPE.sState('ionian_overlord_capital').GetCityHubName]条约"
 grefm.220.d: "通过认真谈判, [SCOPE.sCountry('ionian_overlord').GetName] 已同意放弃 [SCOPE.sCountry('ionian_country').GetName] 给 [ROOT.GetCountry.GetName]."
 grefm.220.f: ""促进我们两国之间的善意，并加强 [ROOT.GetCountry.GetAdjectiveNoFormatting] 人民关系, [SCOPE.sCountry('ionian_overlord').GetRuler.GetPrimaryRoleTitle] 慷慨地割让了爱奥尼亚群岛。我们的法庭之友保护国已经结束，群岛在这种保护下受益于我们真正和公正的援助，我们相信这些岛屿的人民将在我们值得信赖的朋友的善意照顾下繁荣发展.""
 grefm.220.a: "最令人满意的解决方案." 
 grefm.221.t: "[SCOPE.sState('epirus_capital').GetCityHubName]条约"
 grefm.221.d: "经过快速谈判, [SCOPE.sCountry('epirus_scope').GetName] 已同意加入希腊国家."
 grefm.221.f: "埃波里斯希腊人为争取自由而反抗奥斯曼帝国，重新加入希腊大家庭是理所当然的。"
 grefm.221.a: "最令人满意的解决方案."
 grefm.222.t: "[SCOPE.sState('cyprus_capital').GetCityHubName]条约"
 grefm.222.d: "经过快速谈判, [SCOPE.sCountry('cyprus_scope').GetName] 已同意加入希腊国家."
 grefm.222.f: "塞浦路斯希腊人用自己的汗水和鲜血赢得了自由。如果他们选择这样做，那么他们加入希腊兄弟姐妹的行列是正确的."
 grefm.222.a: "最令人满意的解决方案."
 grefm.223.t: "[SCOPE.sState('crete_capital').GetCityHubName]条约"
 grefm.223.d: "Following quick negotiations, [SCOPE.sCountry('crete_scope').GetName] has agreed to join the Greek state."
 grefm.223.f: "克里特希腊人在经历了几代人的蓄意压迫之后，终于获得了自由。现在，他们与希腊兄弟姐妹团聚，这是一个重要时刻。"
 grefm.223.a: "最令人满意的解决方案。"
 grefm.224.t: "[SCOPE.sState('macedonia_capital').GetCityHubName]条约"
 grefm.224.d: "在迅速的谈判后，[SCOPE.sCountry('macedonia_scope').GetName]已同意加入希腊国家。"

 grefm.224.f: "马其顿希腊人终于获得了自由。当他们与回归希腊时，街上的人群欢呼雀跃。"
 grefm.224.a: "最令人满意的解决方案。"
grefm.230.t: "捍卫乔纳斯·金的权利"
grefm.230.d: "[SCOPE.sCharacter('grefm_jonas_scope').GetFullName]，一位来自[SCOPE.sCountry('usa_scope').GetName]的年轻热情的传教士，通过在[ROOT.GetCountry.GetName]传播加尔文主义教义引起了公愤。神职人员要求[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]立即采取行动。"
grefm.230.f: "至少在文件上，[ROOT.GetCountry.GetName]的公民享有宗教自由。然而，在实际操作中，希腊国家由[SCOPE.gsInterestGroup('devout_scope').GetName]主导。由于对[ROOT.GetCountry.GetStateReligion.GetName]肖像的不敬的指控，他发表了一本名为 #italic 《捍卫乔纳斯·金》# 的书，在其中他提出早期教父反对使用肖像的观点。这样做的结果是他被贴上了破坏偶像的辩护者的标签，并引起了公愤。"
grefm.230.a: "镇压这个异端！"
grefm.230.b: "他并无恶意。"

 grefm.240.t: "希腊是什么？"
 grefm.240.d: "在[ROOT.GetCountry.GetName]的知识分子中，关于希腊身份认同的争论在启蒙理想和希腊国家诞生的双重刺激下达到了白热化的程度。围绕“希腊人”的定义，知识分子强调希腊语和东正教会等共性，将其作为希腊国籍的划分标准，而非国家边界。"
 grefm.240.f: "在拜占庭时代，希腊人通常从两个方面来定义自己：首先，他们既称自己为“希腊人”，也称自己为“罗马人”；其次，他们强调自己的基督徒身份。在奥斯曼帝国时代，由于没有自己的国家，他们的文化通过共同的语言和宗教经历，经历了奥斯曼帝国统治者不同阶段的接受和迫害，这种身份变得更加重要。再加上斯拉夫人和阿拉伯人对前希腊土地的入侵，希腊革命前后，学者和政治家们对希腊民族自古以来持续存在的观点提出了质疑。"
 grefm.240.a: "但是我们一直都是希腊人"
 grefm.241.t: "语言问题"
grefm.241.d: "自独立以来，[SCOPE.gsInterestGroup('ig_intelligentsia_scope').GetName] 一直推动采用一种名为 \"Katharevousa\" 的希腊语变体。人们继续使用 \"Demotic\" 或俗体希腊语，每个地区都有其自己的希腊语方言变体。与此同时，[SCOPE.gsInterestGroup('ig_devout_scope').GetName] 仍然使用 \"Khoine\" 希腊语，这是一种具有连续性的礼仪方言，可以追溯到希腊化时期。"

 grefm.241.f: "历史说明：关于将哪种希腊语方言晋升为国家语言的问题，一直争论不休，直至 1976 年。数千年来，希腊语就像现代学校教育和民族国家出现之前的大多数语言一样，一直沿连续统一体存在。塞尔柱土耳其人的到来在希腊各族人民之间造成了有形的隔阂，使得许多方言彼此分化，几乎无法相互理解。"
 grefm.241.a: "语言将把我们团结在一起"
 grefm.242.t: "民族语言"
 grefm.242.d: "通过严谨的学术研究和国家意志，国家领导人已经准备好组织希腊语的全国课程。虽然这不能在一夜之间解决语言问题，但我们至少可以确保我们的孩子在希腊全国都能接受统一的语言教育。"
 grefm.242.f: "随着希腊文学的发展，纯正希腊语受到了作家和政治家们的过度青睐。许多人担心，进一步推动希腊语的时代倒退只会进一步疏远民众，阻碍大众接受教育。相反，许多人认为，净化语言中的斯拉夫语和土耳其语“污染”将使教育者能够锤炼原本粗俗的大众语言。"
 grefm.242.a: "通用希腊语是唯一的语言"
 grefm.242.b: "推行纯正希腊语将巩固希腊人的身份。"
 grefm.242.c: "通用希腊语是唯一的语言"
 grefm.243.t: "定义希腊文化根源"
 grefm.243.d: "考古学会取得的巨大进步让希腊人民了解到其巴尔干地区的存在可以追溯到史前时代。每个月都有更多的人在谈论希腊国家，仿佛它已经存在了很久，甚至将现代国家与奥斯曼帝国之前的拜占庭和罗马政府混为一谈。"
 grefm.243.f: "多亏了我们的学者，我们可以毫无疑问地说，“原希腊人”早在有文字记载的历史之前就来到了巴尔干半岛，并且从那时起就一直在这里。无论是前罗马时期的城邦、拜占庭帝国，还是威尼斯和奥斯曼帝国的压迫者，这片土地一直都是希腊的，而且永远都是希腊的。"
 grefm.243.a: "我们一直在这里"
 grefm.249.t: "希腊民族起源"
 grefm.249.d: "没有人能告诉你这是什么时候发生的，但每个人都知道它发生了：日复一日，人们为走在希腊街道上、从事希腊工作以及与希腊邻居共处而感到自豪。[ROOT.GetCountry.GetName]和她的人民从一个不团结、摇摇欲坠的后土耳其国家开始，已经崛起为一个真正的民族国家。"
 grefm.249.f: "勇敢的人们，还要在压迫中生活多久，\n像孤独的狮子，拘束在那群山中吗?\n蜷居在洞穴里，望着外面的枝头，\n离开这个世界，沦为痛苦的奴隶?\n我们抛弃了兄弟、家园和父母、\n我们的朋友、孩子，和所有的亲属吗？\n\n宁可自由地生活一小时，\n绝不做奴隶和囚徒苟且四十年！\n\n里加斯·维列斯迪利斯#italic 战歌#!，1797年"
 grefm.249.a: "不自由毋宁死！"
 grefm.250.t: "克里特岛的牧师殉教"
 grefm.250.d: "在东正教礼拜者和穆斯林抗议者之间发生争执后，当地一名牧师被暴徒拖到街上并处以私刑。"
 grefm.250.d1: "当地官员已要求 [SCOPE.sCountry('crete_owner_scope').GetRuler.GetPrimaryRoleTitle]做出正式答复。"
 grefm.250.d2: "尽管要求伸张正义，[SCOPE.sCountry('crete_owner_scope').GetAdjectiveNoFormatting] 国仍对此事保持沉默。"
 grefm.250.d3: "[SCOPE.sCountry('crete_owner_scope').GetName]已经逮捕了凶手，但损失已经造成。"
 grefm.250.f: "自从希腊独立以来，希腊人和土耳其人之间的冲突就变得越来越常见，因为两个民族都开始拥护民族主义认同。"
 grefm.250.a: "他们应该掂量掂量自己的处境。"
 grefm.250.b: "逮捕杀人犯，我们必须恢复秩序"
 grefm.250.c: "我们不会屈服于淫威之下"
 grefm.251.t: "克里特岛的行政官越权"
 grefm.251.d: "[SCOPE.sCountry('crete_owner_scope').GetAdjectiveNoFormatting]的[SCOPE.sState('crete_state_scope').GetName]官员被指控要求希腊公民缴纳不合理的税款，远远超出了[SCOPE.sCountry('crete_owner_scope').GetAdjectiveNoFormatting]州通常征收的数量。"
 grefm.251.d1: "在这种情况下，[SCOPE.sCountry('crete_owner_scope').GetName] 再一次以沉默支持了他的行动。"
 grefm.251.d2: "省长已被召回，但 [SCOPE.sCountry('crete_owner_scope').GetName] 并未保证今后不会发生滥用职权的情况。"
 grefm.251.f: "虽然希腊人在奥斯曼帝国统治下的大部分时间里生活条件尚可，但这一状况随着每个苏丹的政策而时好时坏。然而，希腊建国后情况恶化，大多数希腊人发现自己成为政治和社会报复的目标。"
 grefm.251.a: "他只是在行使权力"
 grefm.251.b: "把他召回宫"
 grefm.251.c: "这是不公正的待遇"
 grefm.251.tt: "克里特起义的气势将升高#red 10#!"
 grefm.252.t: "克里特岛的希腊人骚动"
 grefm.252.d: "由希腊政府资助的起义者已经抵达 [SCOPE.sState('agitation_scope').GetName]。警方已经报告抗议和停工事件有所增加。"
 grefm.252.f: "自独立以来，财政和政治支持者一直在帮助克里特分离主义分子实现摆脱奥斯曼帝国统治的目标。尽管列强发出了恳求，但这些支持者只是增加了对克里特斗争的支持。"
 grefm.252.a: "他们很快就会重新加入我们"
 grefm.252.b: "他们是国家的叛徒"
 grefm.911.t: "伊庇鲁斯起义"
 grefm.911.d: "希腊游击队在阿尔巴尼亚南部拿起武器反对我们。他们要求从[ROOT.GetCountry.GetAdjectiveNoFormatting]统治下独立，并与希腊国家联合。"
 grefm.911.f: "在希腊政府的帮助和怂恿下，叛乱分子建立了分离的伊庇鲁斯州，宣布他们打算加入希腊同行的行列。"
 grefm.911.a: "我们会粉碎这帮不自量力的家伙。"
 grefm.912.t: "塞浦路斯起义"
 grefm.912.d: "塞浦路斯的希腊游击队员拿起武器反对我们。他们要求从穆斯林统治下独立，并寻求与希腊国家联合。"
 grefm.912.f: "在希腊政府的资助和武装下，这些反叛分子不顾土耳其几个世纪法理统治，试图将该岛交还给希腊人。"
 grefm.912.a: "难以驾驭的异教徒"
 grefm.913.t: "马其顿起义"
 grefm.913.d: "随着希腊在巴尔干半岛的扩张，希腊马其顿人奋起反抗我们的统治。并要求允许他们与希腊国家统一。"
 grefm.913.f: "在西方武器的武装和希腊退伍军人的支持下，马其顿分离注意是对我们政府权威的最新挑战。"
 grefm.913.a: "我们会碾碎这些叛徒！"
 grefm.914.t: "克里特再起义"
 grefm.914.d: "克里特岛的希腊人再一次拿起武器反抗他们的统治者。政治领导人们纷纷呼吁希腊政府能够直接提供援助。"
 grefm.914.f: "…他们到达弗兰戈卡斯特洛，向帕夏投降，帕夏下令他们立即解除武装。他们都解除了武装，心里很不自在，因为现在，他们知道自己再也回不了家了。"
 grefm.914.a: "克里特是我们的！"
grefm.048.d: "在广泛的支持下，[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName] 掌握了政府的控制权并开始了一系列旨在彻底改变希腊国家的改革狂潮。在人民的意愿和 [ROOT.GetCountry.GetRuler.GetFirstName] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 的不安支持下，[ROOT.GetCountry.GetName] 将成为东方变革的先驱。"
grefm.048.f: "\"...我认为军队应该致力于紧急任务，重新组织国家的军队，并同时建议革命要求和强制召集一个修宪议会，该议会将对几乎半个世纪的经验证明需要改革的宪法条款进行修订....\" - E. Venizelos，1910"
grefm.048.a: "今天标志着[ROOT.GetCountry.GetName]的新未来。"
grefm.051.t: "组建庄重的军队"
grefm.265.t: "希土关系"
grefm.265.d: "我们整合前奥斯曼帝国的臣民的努力已经基本成功。尽管希腊各地的民族主义团体极力抵抗，但[GetCulture('turkish').GetName]人可以认为自己是我们希土联合国的全权公民。"
grefm.265.f: "尽管我们存在分歧和分歧，但我们不能否认我们的希腊文化与土耳其文化的影响是密不可分的，而土耳其文化与我们的影响也是如此。征服希腊，征服土耳其人。"
grefm.265.a: "希腊人和土耳其人将站在平等的地位。"

 grefm.051.d: "[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName]首次提出的改革迅速集中精力，重组了国家机器，并决心让[ROOT.GetCountry.GetName]摆脱了奥斯曼帝国历史的最后痕迹。韦尼泽洛斯派已经着手在准备土地政策、司法改革和官僚专业化等方面的改革."
 grefm.051.f: ""我不能保证政府会在一天内开启黄金时代；这种疾病很严重，治疗需要很长时间；但我可以保证的是，这种治疗将是严重而彻底的." -E.韦尼泽洛斯, 1910"
 grefm.051.a: "人民值得一个有能力的国家."
 grefm.149.t: "罗德岛发掘完毕"
 grefm.149.d: "罗得岛自迈锡尼人时代起就有人居住，先后被希腊人、拜占庭人、骑士团和奥斯曼人统治过。与此同时，岛上还出现了犹太人、异教徒、基督徒和穆斯林，使这座岛屿受到了多种文化的影响。然而，尽管有众多发现，主管埃弗却失望地宣布，没有发现传说中的罗得岛巨像的迹象。"
 grefm.149.f: "我们竖起你，赫利俄斯。直达奥林匹亚山巅。多利斯山区的罗德人敬仰太阳神，你使小岛免遭横蛮。世界如此瑰丽，自由不容涂炭。生于天空左眼的艾利奥斯。光辉万丈广庇大地。掀开夜幕的群星之母崇慕太阳神，你驱逐阴影与愚昧。当世界记起你，智慧重新盛放。——罗德岛巨像赞美诗"
 grefm.149.a: "如此壮观！"
 grefm.157.t: "阿伽门农黄金面具"
 grefm.157.d: "在[SCOPE.sState('peloponnese_scope').GetName]的一个小发掘现场工作的考古学家宣布了一项令人难以置信的发现：一系列精美绝伦、细节考究的纯金陪葬面具。这些面具被发现时仍盖在陪葬品上，初步断定这些人地位显赫。有些人甚至声称，这可能就是传说中的迈锡尼国王阿伽门农的坟墓。"
 grefm.157.f: "“……金发碧眼，高大威猛。他能言善辩，睿智高贵，天赋异禀。”——达雷斯·弗里吉乌斯，公元 5 世纪"
 grefm.157.a: "真是太美妙了！"
grefm.160.t: "一个保加利亚访客"
grefm.160.d: "今天下午，[ROOT.GetCountry.GetRuler.GetFirstName]国王欢迎[SCOPE.sCharacter('bulgaria_ruler_scope').GetLastName]王子访问[SCOPE.sState('greece_capital_scope').GetCityHubName]。介绍完毕后，[SCOPE.sCharacter('bulgaria_ruler_scope').GetLastName]王子激情地提出了一个关于巴尔干各国联合对抗苏丹的论点。王子几乎焦急地等待国王的回应。"
grefm.160.f: "许多希腊人既生活在保加利亚的土地上，又生活在他们更广泛的索赔地区，一直延伸到色雷斯。王子可能承诺在保加利亚统治下对他们公平对待，但这对于当前政权下的虐待报告几乎没有任何作用。尽管如此，一些法庭上的人认为，与港口的联盟可能是确保[ROOT.GetCountry.GetName]未来任何类型的唯一途径。"
grefm.160.a: "我们欢迎任何支持希腊事业的人。"
grefm.160.tt: "现在解决重叠索赔问题..."
grefm.160.b: "斯拉夫人在这里找不到朋友。"
grefm.161.t: "唐·帕西菲科事件"
grefm.161.d1: "今天早晨，来自我们海外公民的一封信件到达。 #yellow 大卫·帕西菲科# 报告说他的住所被希腊暴民洗劫了。作为我们的一名前驻希腊外交使团成员，他请求我们的干预。我们的外交官建议将请求通过[SCOPE.sCountry('uk_scope').GetName]，希腊国家的担保国之一。"
grefm.161.d2: "[SCOPE.sCountry('portugal_scope').GetName]已请求我们介入在[SCOPE.sCountry('greece_scope').GetName]的一起轻微的外交僵局。他们的一名前外交官 #yellow唐·帕西菲科# 在雅典的住所遭到了一群暴民的袭击。葡萄牙国家旨在为帕西菲科争取赔偿。"
grefm.161.d3: "一群恶棍焚烧了前葡萄牙外交官 #yellow 大卫·帕西菲科# 的住所。利用他在[SCOPE.sCountry('portugal_scope').GetName]和[SCOPE.sCountry('uk_scope').GetName]政府中的联系，他正式要求王室赔偿他的财产损失和对他的人身侮辱。"
grefm.161.f: "雅典的一个复活节传统是焚烧犹大的雕像。然而，由于罗斯柴尔德勋爵正在访问首都，王室今年禁止了这一做法，以避免对他的侮辱。令人困惑的是，城市居民错误地责怪了前外交官 #yellow唐·帕西菲科# 导致了这一事件并袭击了他的住所。"
grefm.161.por1: "我们将寻求赔偿。"
grefm.161.por2: "这不值得我们做。"
grefm.161.gbr1: "他们的要求是公正的。"
grefm.161.gbr2: "希腊国家不应受到责备。"
grefm.161.gre1: "我们会处理好这件事的。"
grefm.161.gre2: "他们有什么资格提出要求？"



 grefm.244.t: "希腊国的历史"
 grefm.244.d: "经过数十年严谨的学术研究，康斯坦丁‑帕帕里戈普洛斯出版了他的著作#italic 《希腊国家史》#!的最后一卷。他的著作生动而优雅地记述了希腊历史，是第一部将古希腊、中世纪希腊和现代希腊国家的历史串联起来的著作，讲述了希腊在巴尔干半岛和安纳托利亚地区存在的奇妙故事。"
 grefm.244.f: "历史注解：帕帕里戈普洛斯的著作从 1860 年到 1877 年共出版了六卷，是第一次真正从学术角度反驳主流观点的尝试，主流观点认为希腊“种族”在迁徙期间被各种斯拉夫民族所取代或同化，完全无视拜占庭统治赫勒斯滂地区近千年的历史，以及作为奥斯曼帝国不可分割的一部分的复杂存在。"
 grefm.244.a: "希腊人之火永远不会熄灭。"
 grefm.244.b: "真相是我们一直在这里"
 grefm.260.t: "突厥的命运"
 grefm.260.d: "随着安纳托利亚成为帝国不可分割的一部分，如何处理我国各地的残余突厥民族的问题再次浮出水面。"
 grefm.260.f: "尽管奥斯曼人占领和统治前拜占庭土地长达 400 多年，但他们仍容忍东正教崇拜者的存在。国家必须决定等待他们的是什么样的未来。"
 grefm.260.a: "正如我们与他们共存一样，土耳其人也将与我们共存。"
 grefm.260.b: "我们是希腊人的希腊帝国"
 grefm.261.t: "本土之问"
 grefm.261.d: "随着我们对以前土地的控制权的确立，如何处理 [SCOPE.sState('turkish_homeland_state').GetName] 内的土耳其人口的问题再次浮出水面。"
 grefm.261.f: "安纳托利亚的突厥人虽然来自草原，但他们与祖先的家园几乎没有任何联系。大多数人甚至认为，安纳托利亚#italic 是#!他们的家园。无论如何，鹰派领导人都宣称希腊人在这些土地上拥有至高无上的地位。"
 grefm.261.a: "这是希腊人的土地"
 grefm.261.b: "[SCOPE.sState('turkish_homeland_state').GetName]将作为保留地"
 grefm.262.t: "希腊在[SCOPE.sState('grefm_expansion_state').GetName]的扩张"
 grefm.262.d: "[SCOPE.sState('grefm_expansion_state').GetName]的安纳托利亚地区已并入希腊国，许多希腊人希望再次将其称作自己的家园。"
 grefm.262.f: "希腊世界曾经从喀尔巴阡山脉延伸到兴都库什山脉。安纳托利亚只是这个大整体中的一小部分。"
 grefm.262.a: "那些土地一直都是属于我们的！"
 grefm.263.t: "希腊首都"
 grefm.263.d: "被解放的[SCOPE.sState('eastern_thrace_scope').GetCityHubName]希腊人向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]请愿，要求恢复该城昔日作为希腊世界中心的地位。"
 grefm.263.f: "“希腊王国不是希腊；它只是希腊的一部分，而且是希腊最小且最贫困的一部分。希腊人不仅是居住在希腊王国的人们，约阿尼纳、色萨利、色雷斯、阿德里安堡、君士坦丁堡、特拉布宗、克里特、萨摩斯的人们，以及和希腊历史相关的人们所居住的所有地区的人们都是希腊人……希腊有两个伟大的中心，雅典是王国的首都，而君士坦丁堡是伟大的都城，是所有希腊人的梦想与希望。”"
 grefm.263.a: "君士坦丁堡将会成为[ROOT.GetCountry.GetName]之心！"
 grefm.263.b: "[SCOPE.sState('attica_scope').GetCityHubName]将为我们的目的服务"
 grefm.264.f: "在旧帝国中，拉丁语和希腊语并存，各自在各自的势力范围内使用。由于是意大利人创造了帝国，政客们声称意大利人民应该与希腊人站在平等的立场上。"
 
 grefm.019.t: "“吃土耳其人者”的回归"
grefm.019.d: "在一次至高的宽大之举中，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已经赦免了 #gold 尼基塔拉斯#! 从他的监禁中，并委托他协助国家的防御。在希腊独立战争期间，他是一位著名的战士，以对土耳其士兵的激进行动而闻名，赢得了“吃土耳其人者”或“吃土耳其人者”的绰号。凭借一把剑和此前发表反对摄政的言论的赦免令，我们的竞争对手最好害怕他。"
grefm.019.f: "“我只有我的剑，我很乐意为我的国家付出。” -N. Stamatelopoulos，1826"
grefm.019.a: "他将为 [ROOT.GetCountry.GetName] 服务得很好。"
 
grefm.021.t: "路德维希国王访问希腊"
grefm.021.d: "为了支持他儿子的继位，国王[SCOPE.sCharacter('ludwig_scope').GetFullName]已抵达[ROOT.GetCountry.GetName]，旨在为年轻君主提供建议和合法性。"
grefm.021.f: "外国国王的到来在[ROOT.GetCountry.GetCapital.GetCityHubName]引起了一阵活动和八卦，公众反应从好奇到忧虑不等。"
grefm.021.a: "有趣。"
grefm.022.t: "[ROOT.GetCountry.GetRuler.GetFirstName]前往[SCOPE.sState('bavaria_state_scope').GetName]"
grefm.022.d: "国王[ROOT.GetCountry.GetRuler.GetFirstName]作为年轻君主缺少的一点是王后和继承人。年轻国王陪同他父亲国王[SCOPE.sCharacter('ludwig_scope').GetFirstName]返回[SCOPE.sState('bavaria_state_scope').GetName]，旨在寻找一个合适的王后。"
grefm.022.f: "尽管与[GetInterestGroupVariant('ig_landowners', GetPlayer).GetLeader.GetFullName]的斗争大多未被人们注意到，但他们对缺乏王位继承人表示担忧。国王已将国家事务委托给他的顾问，但许多人担心摄政将会在君主离开后迅速扩展其权力基础。"
grefm.022.a: "国王万岁。"
grefm.023.t: "适合巴伐利亚的王后"
grefm.023.d: "[ROOT.GetCountry.GetRuler.GetFirstName]返回巴伐利亚时，盛大的庆典充斥着整个过程，他的父亲正在寻找年轻国王的合适配偶。在年轻的贵族[SCOPE.sCharacter('queen_amalia_scope').GetFirstName]of [SCOPE.sCountry('oldenburg_scope').GetName]中找到了一个强大的对手，尽管已经提出了替代候选人。"
grefm.023.f: "“王后身材娇小，美丽动人。她活泼，几乎太活泼了，谈论各种主题，对希腊持赞许态度，青睐于北欧国家，并确信我们很快会适应这个美丽的国家和它迷人的气候。” -C. Lüth，关于玛莉亚王后，1839年"
grefm.023.a: "[SCOPE.sCountry('oldenburg_scope').GetName]的[SCOPE.sCharacter('queen_amalia_scope').GetFirstName]是一个优秀的配偶。"
grefm.023.tt: "这是历史选项。"
grefm.024.t: "[ROOT.GetCountry.GetRuler.GetFirstName]的智慧受到挑战"
grefm.024.d: "国王[ROOT.GetCountry.GetRuler.GetFirstName]已被告知，阿曼斯伯格勋爵的阴谋令人不安。自从国王离开希腊以来，总理秘密写信给国王[SCOPE.sCharacter('ludwig_scope').GetFirstName]指责[ROOT.GetCountry.GetRuler.GetFirstName]既疯狂又愚蠢。"
grefm.024.f: "在国王不在的时候，阿曼斯伯格勋爵集中了政治权力，并开始了一个计划，希望自己能成为希腊国家的永久摄政。"
grefm.024.a: "这是暴政!"
grefm.025.t: "解除摄政"
grefm.025.d: "国王[ROOT.GetCountry.GetRuler.GetFullName]已经回到[ROOT.GetCountry.GetName]，发现摄政委员会和国民议会在阿曼斯伯格勋爵的干预下分裂且混乱不堪。[ROOT.GetCountry.GetRuler.GetFirstName]现在面临来自国外的压力，以为希腊国家带来秩序并合法化巴伐利亚统治。因此，政治领导人们要求解决这一政治危机。"
grefm.025.f: "[ROOT.GetCountry.GetName]贫穷，乡村化，依赖大国。 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]在[ROOT.GetCountry.GetAdjectiveNoFormatting]人民中急切地被接受，但每一天过去，没有改革和繁荣的情况下逐渐削弱了他的权威，并测试了大国的耐心。"
grefm.025.a: "解雇这个自私的虫子。"
grefm.025.b: "国王应与他和解。"
grefm.026.t: "菲洛尔多克斯阴谋"
grefm.026.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]爆出了一个令人不安的阴谋。由主教[SCOPE.sCharacter('devout_leader_scope').GetFullName]支持，并得到了#yellow菲洛尔多克斯协会#的帮助，阴谋者发动了一个阴谋，以武力拘禁国王并确保皇家家族改宗为[GetReligion('orthodox').GetName]信仰。"
grefm.026.f: "[GetCulture('greek').GetName]人民与[GetReligion('orthodox').GetName]基督教密不可分，这在排外情绪中表现出来。每天，无论是牧师还是农民的军队，都担心确保[GetReligion('orthodox').GetName]统治者可能是阻止教会影响力衰落的最好希望。"
grefm.026.a: "我们不能容忍任何叛乱。"
grefm.026.b: "[ROOT.GetCountry.GetName]必须保持[GetReligion('orthodox').GetName]。"
 
grefm.022.a: "向 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 致敬！"
grefm.030.d: "随着巴伐利亚君主制的推翻，托管政府呼吁举行公民投票，以确定王位的最佳候选人。然而，事实证明，这是有问题的，因为最受欢迎的候选人不愿意或在政治上无法加冕。任命新统治者的重任落在了看守政府身上."
grefm.030.d1: "国民议会紧急组建了一支代表团，并派遣他们将王冠献给 [ROOT.GetCountry.GetRuler.GetFullName]。现在，在他抵达 [SCOPE.sState('grefm_capital_scope').GetCityHubName]，新 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 受到了欢呼声，人们为 [ROOT.GetCountry.GetName] 的第二次机会而欢呼。"
grefm.030.d2: "随着对 [ROOT.GetCountry.GetName] 的巴伐利亚统治得到确保，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] 被国民议会赋予了绝对权力的合法性。"
grefm.032.t: "一个和谐的国家"
grefm.030.b: "我们创建了一个和谐的国家"
grefm.032.t: "一个和谐的国家"
grefm.032.d: "根据国民议会的意愿，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 同意了制宪和程序改革，削减了皇冠在没有在议会中获得多数的情况下任命部长的权利。"
grefm.032.f: "“作为邀请加入地方政府的人的必要资格，是国家代表大会多数人的信任，我接受议会使得这一资格存在，没有这一资格，国家的和谐运作是不可能的。” -乔治一世，1875"
grefm.032.a: "“Zito Vasilévs！Zito Vasilevka！—Zito, zito！”"
grefm.033.t: "“不幸的是，我们破产了”"
grefm.033.d: "在一场全国性的尴尬无能的表演中，[ROOT.GetCountry.GetName] 的领导人设法使国家破产。尽管如此，一些政治家已经制定了一系列计划，以恢复我们的财务信誉。"
grefm.033.f: "历史注：在一个充满野心的职业生涯之后，该国首相查里洛斯·特里库皮斯因过度支出和大量的腐败而宣布破产，并站在议会前，发表了他职业生涯中最著名的声明。或许他并没有。这句话实际上并未包含在相关议会会议的记录中。"
grefm.033.a: "我们必须重新组织我们的财务。"
grefm.033.b: "取消外债。"
grefm.034.a: "我们必须重新组织我们的财政。"
grefm.034.b: "取消外债。"
grefm.035.t: "长久存在的问题"
grefm.035.d: "尽管国家权力已经集中，土匪仍然在与奥斯曼帝国的山区边界上存在。在一次大胆的行动中，一群掠夺者在[ROOT.GetCountry.GetName]一群度假的贵族身上发动了袭击。尽管[ROOT.GetCountry.GetRuler.GetFirstName] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]努力进行了赎金谈判，但由于他们与[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的使节之间的误解，该群体在惨遭杀害。国际反应对国家和皇室都十分严厉。"
grefm.035.f: "“我们又要继续前进了……我们可以看到前面的埃夫佐尼斯……我们迷路了……” -英国格雷勋爵的侄子维纳先生。"
grefm.035.a: "这是对[ROOT.GetCountry.GetName]的一大耻辱。"
grefm.035.tt: "历史注记：1870年4月，土匪劫持了一群英国贵族旅行者。在谈判失误后，他们在希腊军队能够逮捕土匪之前被杀害。这严重损害了希腊的国际声誉和人民对皇室的信心。"
 grefm.036.t: ""
 grefm.036.d: ""
 grefm.036.f: ""
 grefm.036.a: ""
 grefm.037.t: ""
 grefm.037.d: ""
 grefm.037.f: ""
 grefm.037.a: ""
grefm.038.t: "勇气之王"
grefm.038.d: ""
grefm.038.f: ""
grefm.038.a: ""
grefm.039.t: "银禧年"
grefm.039.d: ""
grefm.039.f: ""
grefm.039.a: ""
grefm.041.b: "他们应该知道自己的位置。"
grefm.047.b: "这个人知道我们的政治是什么吗？"
grefm.048.t: "民族领袖的崛起"
grefm.049.t: "民族领袖的崛起"
grefm.049.d: "在民众的支持下，[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName] 掌握了政府的控制，并开始了一系列旨在彻底改变希腊国家的改革。在人民的意愿和[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] 不安的支持下，[ROOT.GetCountry.GetName] 将成为东方变革的先驱。"
grefm.049.f: "\"...我提出军队应该致力于重新组织国家的军队，并同时给予革命建议，要求并强制召开一个修宪议会，该议会将着手修宪，几乎半个世纪的经验证明有必要改革其中的某些条款....\" - 埃·韦尼泽洛斯，1910"
grefm.049.a: "今天标志着[ROOT.GetCountry.GetName]的新未来。"
grefm.052.t: "一个称职的官僚机构"
grefm.052.d: "通过积极的改革和招聘, [ROOT.GetCountry.GetName] 已经组建了一支由会计和铅笔推手组成的可交易军队，能够满足希腊国家未来的需求."
grefm.052.f: ""政治家的首要职责是为了国家的整体利益而牺牲个人利益和政党利益。政治家不应将权力视为目的，而应将其视为实现崇高爱国目标的手段." -E. 韦尼泽洛斯, 1910"
grefm.052.a: "国家必须为人民服务."
grefm.053.t: "重组军队"
grefm.053.d: "尽管军方的影响力很大, [SCOPE.sCharacter('grefm_venizelos_scope').GetLastName] 将军队视为希腊身份和安全的重要组成部分. 韦尼泽洛斯派已经提出了几项改进规模的建议, 装备, 以及 [SCOPE.gsInterestGroup('armed_forces_scope').GetName]的训练， 这将帮助 [ROOT.GetCountry.GetName] 在巴尔干半岛扩大其影响力."
grefm.053.f: ""希腊军队真的准备好了吗？希腊能派出多少人上场？""
grefm.053.a: "军队必须保卫希腊国家."
grefm.054.t: "强大的军队"
grefm.054.d: "希腊军队效仿西方军队的力量和纪律，从革命时代的部落民兵转变为现代而强大的战斗力量，这给予了 [ROOT.GetCountry.GetName] 超越国界投射力量的能力."
grefm.054.f: ""去伦敦有什么好处？英国首都的雾对我们没有帮助；我们最好在查塔尔贾会面，在枪支的保护下实现和平." -E. 韦尼泽洛斯, 1913"
grefm.054.a: "[ROOT.GetCountry.GetName] 无所畏惧."
grefm.055.t: "社会进步"
grefm.055.d: "根据他们对官僚改革的要求，韦尼泽洛斯派阵营已经开始推动针对妇女和儿童站的改革。他们认为妇女和儿童是国家未来的基础，他们认为儿童应该进入学校，妇女应该在工厂获得更多的权利."
grefm.055.f: "与前几届政府不同，韦尼泽洛斯派认为，虽然将儿童从工厂中移除会在短期内损害生产，但这些变化是对希腊国家未来的投资."
grefm.055.a: "我们不能沉湎于过去."
grefm.056.t: "现代社会"
 grefm.056.d: "凭借耐心和稳定的手，韦尼泽洛斯派成功地变革了[ROOT.GetCountry.GetName]对妇女和儿童的态度."
 grefm.056.f: "这些变化将使女性不再仅仅是温顺的管家，孩子也不再是可牺牲的孩子."
 grefm.056.a: "这些变化是公平的."
 grefm.057.t: "无知的大众"
 grefm.057.d: "[ROOT.GetCountry.GetName] 长期以来，一直遭受着文盲和农村贫困的双重疾病。而法纳尔人的英勇努力，让东正教使希腊语得以延续，韦尼泽洛斯派认为，现在是教育和文化传播到城市精英之外的时候了."
 grefm.057.f: "与法国人和美国人一样，韦尼泽洛斯派寻求为所有希腊人带来文明之光."
 grefm.057.a: "人民必须超越农村地位."
 grefm.058.t: "受过教育的民众"
 grefm.058.d: "韦尼泽洛斯派推动为希腊人民带来现代教育体系，最终建立了一个强大的公共教育体系."
 grefm.058.f: "通过教人们读写，我们将保护我们的文化遗产，并为我们的工业未来奠定基础."
 grefm.058.a: "做得很好!"
 grefm.059.t: "希腊国家复兴"
 grefm.059.d: "尽管存在两极分化和煽动性，但毫无疑问，韦尼泽洛斯派改革希腊国家的努力是成功的。从行政到公民权利，[ROOT.GetCountry.GetName]将再次成为东方文明的灯塔."
 grefm.059.f: ""我们的国家万岁!韦尼泽洛斯万岁!大希腊万岁!""
 grefm.059.a: "我们的未来依然光明!"

grefm.114.t: "商业竞争"
grefm.114.d: "随着我们的舰队开始现代化，#yellow 比雷埃夫斯#!、#yellow 帕特拉斯#! 和 #yellow 西拉#! 港口之间出现了激烈的竞争。每个港口都申请成为[ROOT.GetCountry.GetName]的主要海军中心。"
grefm.114.f: "在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的眼中，这些港口城市都有其优势。#yellow 比雷埃夫斯#! 最靠近雅典，几乎是一个郊区。#yellow Patras#! 位于伯罗奔尼撒半岛，易于防守，而且更容易接近欧洲。#yellow Syra#! 在基克拉泽斯群岛，曾在独立战争中发挥了重要作用。"
grefm.114.a: "比雷埃夫斯 已经很有实力。"
grefm.114.b: "帕特拉斯 可能更容易防守。"
grefm.114.c: "西拉 位置良好。"

grefm.119.t: "科帕伊达的土地复垦"
grefm.119.d: "科帕伊达湖项目的首席工程师宣布从湖中重新开垦了几大片土地。"
grefm.119.f: "随着湖水位的下降，附近村庄的几位农民已经开始准备这些土地进行农业开发。"
grefm.119.a: "太棒了。"
grefm.130.tt: "您现在可以开始建造科林斯运河了。"
grefm.158.t: "[SCOPE.gsInterestGroup('grefm_benefactor_scope').GetName] 提供资金支持"
grefm.158.d: "为支持我们在[SCOPE.sState('grefm_excavation_target').GetName]的努力，[SCOPE.gsInterestGroup('grefm_benefactor_scope').GetName]的成员提议私人资金支持这一项目。"
grefm.158.f: "接受这些资金将有助于加快挖掘进度，但我们必须注意他们可能将此用作宣传工具。"
grefm.158.a: "保护我们历史的任何支持都是受欢迎的。"
grefm.158.b: "我们不能允许对我们学术界的不当影响。"
grefm.158.tt: "这将使挖掘进度提前 #green 6个月#!."
grefm.159.t: "重建引发批评"
grefm.159.d: "[SCOPE.sState('grefm_excavation_target').GetName]的学者们就我们首席監事在挖掘工地的重建提出了一些严厉的投诉。"
grefm.159.f: "“看，你可以清楚地看到那根柱子应该在那里……那幅马赛克风格与这一地层的时代不一致……等等，这里谁在管理！？”"
grefm.159.a: "“好吧，但是他们有原始的计划吗？”"
grefm.159.b: "我们的首席監事应该退后一步。"
grefm.159.b.tt: "这将使挖掘进度 #red 延迟#! 6个月."
grefm.253.t: "克里特岛的语言禁令"
grefm.253.d: ""
grefm.253.f: ""
grefm.253.a: ""
grefm.253.b: ""
grefm.259.t: "克里特岛再次起义"
grefm.259.d: "自从威尼斯人征服该岛以来，岛上的东正教希腊人就对统治发动了激烈的抵抗。现在，在奥斯曼和埃及统治下，紧张局势接近沸点，希腊人的财产被征用，牧师在街上被私刑处死。克里特希腊人对他们的穆斯林统治者的虐待和歧视感到愤怒，他们起来反抗他们的统治者。"
grefm.259.f: "……他们到达弗兰戈卡斯泰洛并向帕夏投降，他立即下令解除他们的武装。他们所有人都被解除了武装，并感到不安，因为他们现在意识到他们再也回不了家了。"
grefm.259.a: "克里特岛是我们的！"
grefm.259.b: "我们不能维持这种幻想。"
grefm.160.t: "保加利亚访客"
grefm.160.d: "[ROOT.GetCountry.GetRuler.GetFirstName]国王在今天下午欢迎[SCOPE.sCharacter('bulgaria_ruler_scope').GetLastName]亲王到[SCOPE.sState('greece_capital_scope').GetCityHubName]的宫廷。在介绍之后，亲王[SCOPE.sCharacter('bulgaria_ruler_scope').GetLastName]热情地提出了在对抗苏丹方面进行泛巴尔干合作的论点。亲王焦急地等待着国王的回应。"
grefm.160.f: "许多希腊人在保加利亚土地上生活，甚至在他们南至色雷斯的更大主张中也是如此。亲王可能向他们承诺在保加利亚统治下公平对待他们，但这对于当前政权下的虐待的报道几乎没有起到什么作用。尽管如此，宫廷中的一些人认为，与土耳其的联盟可能是确保[ROOT.GetCountry.GetName]未来的唯一途径。"
grefm.160.a: "我们欢迎任何支持希腊事业的人。"
grefm.160.tt: "现在解决重叠索赔的问题..."
grefm.160.b: "斯拉夫人在这里找不到朋友。"
grefm.202.1: "我们的军队将再次升起帝国的旗帜！"
grefm.202.2: "撒拉森异教徒将感受到我们的复仇！"
grefm.202.3: "我们将收复东方的教堂！"
grefm.202.4: "帝国已经死了。我们将开辟新道路！"
grefm.202.5: "[ROOT.GetCountry.GetName] 将永存！"
grefm.217.f: "克里特希腊人越来越发现自己在自己的故土上成了二等公民。克里特人怀着民族主义的理念，要求在希腊国家中找到一席之地。"
grefm.231.t: "在亚瑞巴古斯之前的演讲"
grefm.231.d: "游方传教士[SCOPE.sCharacter('grefm_jonas_scope').GetFullName]已被带到[ROOT.GetCountry.GetName]的最高法院，回答异端和诽谤国家的指控。在迅速进行的审判之后，法院裁定将传教士流放出希腊国家。"
grefm.231.f: "\"我是一位福音传教士，也就是上帝的道士；我是一个最正统的基督徒....关于我的书中与玛丽有关、与物质变质有关以及与形象有关的事情，我并没有说过；但是东方教会最杰出的光辉之一，圣父爱比弗尼乌斯，圣乔斯特姆，伟大的圣巴西尔，圣爱琳尼，克莱门斯和尤西比乌斯都没有说过。\" -J. 金，1843年在阿里奥帕古斯法庭上作证。"
grefm.231.a: "好去处！"
grefm.232.t: "乔纳斯·金回归"
grefm.232.d: "在感觉到东正教与天主教之间关系缓和的迹象后，传教士[SCOPE.sCharacter('grefm_jonas_scope').GetFullName]再次来到[ROOT.GetCountry.GetName]。正如预期的那样，[SCOPE.gsInterestGroup('devout_scope').GetName]的领导对他的回归感到愤怒。"
grefm.232.f: "尽管采取了较为温和的宣讲方式，金牧师还是遭到了希腊教会的袭击，主教们谴责他在该国的存在是对国家的咒骂。"
grefm.232.a: "逮捕这个叛徒。"
grefm.232.b: "他不构成威胁。"
grefm.232.tt: "[GetReligion('protestant').GetName] 国家将会赞赏这一行动。"
grefm.233.t: "为乔纳斯·金寻求外国干预"
grefm.233.d: "为了为[SCOPE.sCharacter('grefm_jonas_scope').GetFullName]遭受的对异教徒的围攻寻求正义，来自[SCOPE.sCountry('usa_scope').GetName]的外交官已经代表金牧师干预，要求[ROOT.GetCountry.GetRuler.GetFullName]对传教士表现出仁慈。"
grefm.233.f: "被指控“亵渎唯一的宗徒教会”，乔纳斯面临着以异端和反叛罪名提起的草率指控。鉴于围绕审判而产生的微妙政治局势，政治家们已经求助于[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]，决定希腊国家的下一步行动。"
grefm.233.a: "我们将寻求和解。"
grefm.233.b: "国家无法容忍这种侮辱。"
grefm.264.t: "希腊-罗马关系"
 grefm.264.d: "随着罗马帝国的恢复，意大利人民开始公开质疑希腊人的特权地位。"
grefm.264.a: "我们将恢复罗马西部和希腊东部。"
grefm.264.b: "我们将融合东西方的传承。"
grefm.264.c: "希腊人重建了帝国。希腊人将统治它。"
grefm.264.tt: "土耳其人和意大利人共居一地？哦，人类的悲剧！"
grefm.300.t: "维尔吉纳太阳升起"
grefm.300.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]宣布[ROOT.GetCountry.GetName]的重生，教堂钟声齐鸣，人们欢呼。在[SCOPE.sBuilding('hagia_sofia_scope').GetName]的庄严氛围下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]身上装饰着古代希腊国王的旧标志和徽章的重建。走向一群市民、贵族和神职人员的面前，[ROOT.GetCountry.GetRuler.GetFirstName]成为希腊人民未来的灯塔。"
grefm.300.f: "自罗马和君士坦丁堡的失落以来，几个世纪以来无数次的尝试都以失败告终。然而，帝国今天却重新崛起。然而，还有很多工作要做：许多希腊人被异教徒和异教徒统治，以前的罗马土地仍然在外国假冒者的掌握之中，无数拜占庭宝藏被扣为人质。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须确保对[ROOT.GetCountry.GetName]的期望以带给国家荣耀。"
grefm.300.a: "这是一个新的黎明。"
grefm.301.t: "希腊人的复仇"
grefm.301.d: "我们的努力在[ROOT.GetCountry.GetName]的重生中取得了成果。现在，一些声音呼吁恢复[ROOT.GetCountry.GetAdjectiveNoFormatting]的力量和威望，将先前属于希腊的土地归还到希腊国家。由[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]决定[ROOT.GetCountry.GetAdjectiveNoFormatting]国家的未来。"
grefm.301.f: "\"希腊王国不是希腊；它只是希腊的一部分：希腊的最小、最贫穷的一部分。希腊人不仅是居住在王国的人，还是居住在约阿尼纳、塞萨洛尼基、瑟雷斯、亚得里亚诺波利、君士坦丁堡、特雷比松德、克里特、萨莫斯或希腊历史或希腊种族的任何其他地区的人... 希腊文化有两个伟大的中心。雅典是王国的首都。君士坦丁堡是伟大的首都，是所有希腊人的梦想和希望。\" - 伊·科莱蒂斯，1844"
grefm.301.a: "我们将恢复[ROOT.GetCountry.GetName]的荣耀。"
grefm.301.b: "我们将限制在巴尔干地区。"
grefm.301.c: "我们将限制在安纳托利亚地区。"
grefm.302.t: "新罗马君士坦丁堡"
grefm.302.d: "在安纳托利亚和巴尔干地区牢牢掌握在我们手中后，帝国的古老核心已经被夺回！"
grefm.302.f: "将近一千年前，巴西尔一世·科姆宁诺斯威严地领导帝国进入了一个充满崭新力量和荣耀的时代。随着古老核心地区的收复，东罗马帝国的中心得到了恢复，正教主教的位置得以恢复。"
grefm.302.a: "向巴西尔致敬！向拜占庭致敬！"
grefm.303.t: "腓尼基的海岸"
grefm.303.d: "希腊人的古老核心现在在我们的掌控之下。[ROOT.GetCountry.GetAdjectiveNoFormatting]法庭的突出声音呼吁将曾经基督教堡垒的埃及和黎凡特归还给帝国。"
grefm.303.f: "两千多年来，希腊文化一直在东地中海地区占主导地位。今天，古老的希腊城市已经荒废，基督教的古老堡垒在穆斯林统治者手中凋零。"
grefm.303.a: "我们将收复东方帝国。"
grefm.303.b: "我们已经收回了希腊的核心地区。这已经足够了。"
grefm.304.t: "亚历山大的遗产"
grefm.304.d: "随着我们东部边界的确立，学者和民族主义者纷纷呼吁扩大希腊在伊朗高原曾经的领土上的影响力。"
grefm.304.f: "在伊斯兰教在公元600年和700年迅猛崛起之前，从底格里斯到印度河的无数社区都认为自己属于基督教，包括东方古教会和尼斯教派异端。这些社区自从与古老基督教堡垒的隔离以来变得愈发分裂。甚至在此之前，希腊王国分散在伊朗高原、印度喀什山脉一直延伸到旁遮普地区的边缘。"
grefm.304.a: "波斯、非洲、阿拉伯...全部将屈服于希腊。"
grefm.304.b: "我们应该心存感激。"
grefm.305.t: "阿里亚农的土地"
grefm.305.d: "随着民族主义狂热与帝国主义理论融合，[ROOT.GetCountry.GetName]的人民迫切期待[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]收回这些失去的土地。"
grefm.305.f: "追溯到早期青铜时代，伊朗高原的高地一直是伟大王国和帝国的所在地。将近两千年前，这些土地由源源不断的希腊统治者统治，他们的血统可以追溯到与亚历山大大帝一起征战的征服者。"
grefm.305.a: "萨拉森人将屈膝。"
grefm.306.t: "帝国的坟墓"
grefm.306.d: "随着伊朗的征服，一个更大的设计显现出来：夺回亚历山大大帝所占领的土地。"
grefm.306.f: "在罗马帝国崛起期间塞琉古帝国崩溃之后，数个大型的希腊王国涌现在伊朗高原和喀什米尔地区的阿富汗土地，一直延续到公元一世纪。这一时期的提醒一直存在于如今的地名和山区点缀的微小但顽强的希腊村庄。"
grefm.306.a: "我们将实现它。"
grefm.307.t: "希腊帝国"
grefm.307.d: "亚历山大大帝在希腊影响力的巅峰时期曾经征服的土地再次受到希腊的控制。希腊帝国已经重铸！"
grefm.307.f: "尽管持续时间短暂，亚历山大的征服代表了有史以来由单一希腊统治者统治的土地面积最大。由于我们军队的勇气和[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]的稳健手段，我们已经收回了帝国的地位。"
grefm.307.a: "希腊帝国恢复了。"
grefm.307.b: "[ROOT.GetCountry.GetName]将永存。"

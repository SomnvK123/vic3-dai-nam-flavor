 je_byzfm_constantinople: "君士坦丁堡的十四个区域"
je_byzfm_constantinople_reason: "君士坦丁堡曾经是中世纪最伟大的城市，在整个欧洲都无与伦比地发展。虽然自土耳其征服以来女皇之城一直停滞不前，但希腊世界的中心再次落入希腊人手中。市政领导人从早期的拜占庭作家中汲取灵感，推动城市更新，将君士坦丁堡带到了曾经东罗马帝国伟大皇帝统治时期的高度。"
je_byzfm_constantinople_tt: "我们已完成 #bold 拜占庭复兴 #!"

je_byzfm_mega_palation: "重建大皇宫"
je_byzfm_mega_palation_reason: "大皇宫曾是第四次十字军东征前的东罗马帝国权力中心。虽然困难重重，但一群工程师和工匠已经接手恢复这座古老宫殿的残破遗迹。"
je_byzfm_hippodrome: "重建马场"
je_byzfm_hippodrome_reason: "马场的轮廓在君士坦丁堡中心的开放空间中隐约可见。我们的工程团队正在努力重建这座古老的赛马场。"

# Scripted Buttons
byzfm_mega_palation_survey_button: "调查帝国宫殿遗址"
byzfm_mega_palation_survey_button_desc: "随着君士坦丁堡重回拜占庭权力中心，一个调查遗址的运动已经展开，旨在探索曾经作为帝国权力中心的大皇宫遗址。仅存的几座废墟和其基础的残片留存至今。"
byzfm_mega_palation_construction_button: "恢复帝国宫殿"
byzfm_mega_palation_construction_button_desc: "帝国宫殿，即大皇宫，如今已是一片废墟。根据我们的调查结果，不仅可能，而且很合理，恢复其大部分用于公共和行政用途。"
byzfm_hippodrome_construction_button: "恢复马场"
byzfm_hippodrome_construction_button_desc: "帝国宫殿的建设已经清理了紧邻其和圣索菲亚大教堂的椭圆形场地。工程师们已经开始将剩余的供应品从帝国宫殿遗址转移到马场。随着大部分场地暴露出来，重建这座古老的赛马场是有可能的。"

# Tooltips
mega_palation_can_construct_tt: "只有在我们调查了大皇宫遗址之后才能建造这座建筑。"
hippodrome_can_construct_tt: "只有在我们清理了马场遗址之后才能建造这座建筑。"


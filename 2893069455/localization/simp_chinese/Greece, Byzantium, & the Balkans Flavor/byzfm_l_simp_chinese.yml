l_simp_chinese:
 je_byzfm_restoration: "重建拜占庭"
 je_byzfm_restoration_reason: "拜占庭的核心领土曾经横跨巴尔干和安纳托利亚半岛。我们将重建我们在这些地区的统治。"
 je_byzfm_rome_of_the_east: "东方的罗马"
 je_byzfm_rome_of_the_east_reason: "在罗马的鼎盛时期，帝国东部的疆土包括了整个埃及和黎凡特。我们将会夺回这些土地。"
 je_byzfm_rome_of_the_east_status: "重申[ROOT.GetCountry.GetName]对近东的控制。"
 je_byzfm_renovatio_imperii_romanorum: "罗马帝国的复兴"
 je_byzfm_renovatio_imperii_romanorum_reason: "我们会让所有拜占庭的领土重归帝国的控制之下。"
 je_byzfm_the_purple_phoenix: "紫凤凰"
 je_byzfm_the_purple_phoenix_reason: "随着东方已经落入我们的掌控之下，也是时候重新夺回罗马帝国的古老心脏了。"
 je_byzfm_the_purple_phoenix_status: "掌控意大利亚。" 
 je_byzfm_the_purple_phoenix_dalmatia: "收复达尔马提亚"
 je_byzfm_the_purple_phoenix_dalmatia_reason: "达尔马提亚海岸是罗马在意大利之外最早的扩张领土之一。在陆续经历了哥特人和斯拉夫人的征服后，如今哈布斯堡家族维持着对这片前罗马领土的统治。"
 je_byzfm_the_purple_phoenix_northern_italy: "收复伦巴第"
 je_byzfm_the_purple_phoenix_northern_italy_reason: "曾经被伦巴第人征服，现在又被法国人占据，可曾记得，北意大利也曾经是保护罗马免受日耳曼野蛮人侵害的堡垒。"
 je_byzfm_the_purple_phoenix_southern_italy: "收复大希腊"
 je_byzfm_the_purple_phoenix_southern_italy_reason: "南意大利曾经是希腊文化的腹心地带之一，它见证了整个古典时代中古希腊与古罗马文化的融合过程。"
 je_byzfm_the_purple_phoenix_central_italy: "收复拉文纳行省"
 je_byzfm_the_purple_phoenix_central_italy_reason: "曾经，通过对拉文纳旧都的统治，大主教能够在此处行使拜占庭对永恒之城的权力。"
 #je_byzfm_revenge_of_the_greeks: "拜占庭十字军"
 #je_byzfm_revenge_of_the_greeks_reason: "数个世纪以前，基督徒们也会把北非和中东的土地称为家园。我们将会纠正那些撒拉逊异教徒在我们的宗教兄弟身上施加的不公待遇。"
 #je_byzfm_revenge_of_the_greeks_status: "驱逐撒拉逊人"
 #je_byzfm_revenge_of_the_greeks_goal: "发动3次成功的十字军"
 #je_byzfm_the_church_of_the_east: "东方教会"
 #je_byzfm_the_church_of_the_east_reason: "随着基督教在美索不达米亚和波斯地区的传播，东方教会从大教会中分离了出来，以更好地将基督的话语传播到东方。在今天，这些土地上的基督徒们都生活在那些异教徒统治者的压迫和凌虐之下。他们虽然为异教徒所迷惑，但也仍是基督的儿女。我们的正教将让这片土地再次归于上帝的光辉之下。"
 #je_byzfm_the_graveyard_of_empires: "帝国坟场"
 #je_byzfm_the_graveyard_of_empires_reason: "两千年以前，亚历山大大帝的军队如雷霆般横扫了欧亚大陆，将兴都库什山脉以外的土地也纳入了希腊的版图以内。数个世纪后，聂斯托里派的追随者把他们的异端教义散播到了这片土地上。而现在，我们的帝国将见证这片土地在希腊东正教的统治下走向繁荣。"
 #je_byzfm_the_orthodox_realms: "东正教之国"
 #je_byzfm_the_orthodox_realms_reason: "帝国时期，是我们君士坦丁堡的教区见证了基督教在大草原上的传播。但在众城之女王陷落之后，那些罗斯野蛮人僭越行事，自认为能够取得牧首的宝座。"
 #je_byzfm_the_orthodox_realms_status: "把基督的信徒从俄国人的枷锁中解放出来。"
 #je_byzfm_the_third_rome: "第三罗马"
 #je_byzfm_the_third_rome_reason: "俄罗斯帝国自称为东罗马的继承者，但他们不过是意图篡夺我们 #italic 帝国#!的篡位者。"
 #je_byzfm_the_third_rome_status: "逼迫俄罗斯就范。"
 je_byzfm_mega_palation: "重建大皇宫"
 je_byzfm_mega_palation_reason: "在第四次十字军东征至少，大皇宫曾经是东罗马政府的所在地。虽然会相当艰难，但把这些古遗迹重建起来还是有可能的。"
 je_byzfm_mega_palation_survey: "勘察皇宫遗址"
 je_byzfm_mega_palation_survey_reason: "我们的专家们正在调查圣索菲亚大教堂附近的宫殿遗迹。"
 je_byzfm_mega_palation_survey_goal: "等待勘测完成……"
 #je_byzfm_hippodrome_reopening: "重新开放竞技场"
 #je_byzfm_hippodrome_reopening_reason: "竞技场的遗迹早已被废弃，但应该很容易就能让其重新恢复公用。"
 chariot_racing_decision: "复兴战车比赛"
 chariot_racing_decision_desc: "战车比赛是地中海地区最古老的传统之一。随着竞技场的修复，我们可以复兴这项罗马的运动。"
 expand_chariot_racing_decision: "扩大战车竞赛"
 expand_chariot_racing_decision_desc: "随着战车比赛在帝国风靡一时，人们呼吁扩大战车比赛队伍，将罗马帝国原有的六支队伍纳入其中。"
 byzfm_UKR_decision: "接纳乌克兰"
 byzfm_UKR_decision_desc: "这些土地上的东正教人民已经归于真正的东正教牧首的统治之下。"
 byzfm_BYE_decision: "接纳白俄罗斯"
 byzfm_BYE_decision_desc: "这些土地上的东正教人民已经归于真正的东正教牧首的统治之下。"
 byzfm_GEO_decision: "接纳格鲁吉亚"
 byzfm_GEO_decision_desc: "这些土地上的东正教人民已经归于真正的东正教牧首的统治之下。"
 byzfm_MOL_decision: "接纳摩尔多瓦"
 byzfm_MOL_decision_desc: "这些土地上的东正教人民已经归于真正的东正教牧首的统治之下。"
 byzfm_annex_theodoro_decision: "吞并狄奥多罗"
 byzfm_annex_theodoro_decision_desc: "西奥多罗曾是君士坦丁堡陷落后幸存下来的几个小城邦之一。今天，仍然有希腊人会仍然称呼这个海岸为家园，他们可能会与希腊协商重新团聚。"
 byzfm_annex_trabzon_decision: "吞并特拉比松"
 byzfm_annex_trabzon_decision_desc: "特拉比松在拜占庭陨落后仍坚持了数年。通过一些耐心的外交行动，他们可能会与希腊政府重新统一。"

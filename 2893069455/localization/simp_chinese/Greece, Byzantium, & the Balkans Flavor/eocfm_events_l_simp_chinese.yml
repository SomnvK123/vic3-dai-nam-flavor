eocfm.050.1: "罗马教皇将向[ROOT.GetCountry.GetName]俯首。"
 eocfm.050.2: "君士坦丁堡，东方的明珠，属于我们。"
 eocfm.050.3: "安提阿，老牧首之座，是我们的。"
 eocfm.050.4: "亚历山大将装点我们的行列。"
 eocfm.050.5: "圣地将被保护。"
 eocfm.050.6: "莫斯科将学会谦卑。"
 eocfm.050.6r: "莫斯科已归还给我们。"
 eocfm.051.t: "宗主教席位宣称"
 eocfm.051.d: "通过我们的政治努力，东正教会的一个主教席位已经落入我们的控制之下。"
 eocfm.051.f: "尽管名义上与政府分开，但各个主教席位自罗马帝国时代以来就受到严重的国家影响，延续到拜占庭、阿拉伯和奥斯曼时代。"
 eocfm.051.a: "理所当然。"

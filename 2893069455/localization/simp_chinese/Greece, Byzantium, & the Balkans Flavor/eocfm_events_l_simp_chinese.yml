eocfm.026.t: "格雷戈里·纳扎里斯的祝福"
 eocfm.027.t: "隐士的祝福"
 eocfm.028.t: "艾萨克·叙利亚的祝福"
 eocfm.029.t: "伟大的圣巴西略的祝福"
 eocfm.030.t: "召开普世公会议"
 eocfm.030.d: "[SCOPE.sCountry('eocfm_council_host_scope').GetName]的牧师们呼吁召开一次普世公会议，声称教会内部存在严重问题需要解决。"
 eocfm.030.f: "自与罗马的分裂以来，普世公会议一直是解决有关教义和教会管理问题的主要方式。自从与罗马的分裂以来，东方公会议主要在君士坦丁堡举行，远离教宗的过分影响。"
 eocfm.030.a: "我们将准备好我们的代表团。"
 eocfm.030.b: "我们的主教们将出席。"
 eocfm.030.c: "阻止我们的牧师们出席。"
 eocfm.031.t: "[ROOT.GetCountry.GetCapital.GetCityHubName]公会议"
 eocfm.031.d: "随着主教们开始组建代表团，东正教社区寄望于我们，引导下一次普世公会议的焦点。"
 eocfm.031.f: "虽然未被罗马主教承认，但公会议在整个东正教世界都拥有巨大的影响力。"
 eocfm.031.a: "重振伟大的圣战。"
 eocfm.031.b: "反驳教皇的傲慢态度。"
 eocfm.031.c: "面对菲勒蒂主义的异端。"
 eocfm.031.e: "使教会历法现代化"
 eocfm.032.t: "新十字军的诞生"
 eocfm.032.d: "在数周的神学和道德辩论之后，各个教派的首领们一致发出了统一的声音：即使用武力保护海外基督徒免受迫害不仅是正确的，而且是神圣的命令。"
 eocfm.032.f: "东正教会不再坐视忠实信徒遭受西方异端和东方异教徒的虐待。"
 eocfm.032.a: "Εν τούτω νίκα！"
 eocfm.032.b: "Εν τούτω νίκα！"
 eocfm.033.t: "致东方基督徒的书信"
 eocfm.033.d: "在向东方教会发出的一封信中，教皇[SCOPE.sCharacter('eocfm_pope_scope').GetFullName]敦促东正教寻求与西方的团结。然而，教会的大多数人反对与罗马的任何联盟，理由是我们之间存在严重的神学分歧。"
 eocfm.033.f: "\"怀着渴望看到您重返天主教的怀抱，并祝福您为我们的兄弟和子民，并等待这一天的到来，我们再次证明我们对所有东方各国天主教徒的感情和温柔，我们向所有东方各地的主教、首领、总主教、主教、神职人员和信徒赐予我们的宗徒祝福。\" -教皇庇护九世，《致东方基督徒的书信》，1848年"
 eocfm.033.a: "也许他应该先下台。"
 eocfm.033.b: "我们应该推动和解。"
 eocfm.034.t: "东方主教的通谕"
eocfm.034.d1: "经过激烈的讨论，普世公会议决定拒绝教皇的书信。在一份漫长的回应中，反驳了几个西方异端，众牧首们谴责这封信是虚假的。"
 eocfm.034.d2: "在一场酷似酒馆争吵而非神学辩论的争论风暴之后，普世公会议震惊了世界，不仅接受了，而且欣然接受了东西方关系更紧密的机会。"
 eocfm.034.f: "\"现在，平安的上帝，“那从死里复活的大羊群的牧人，“保护以色列的主”，“不打盹也不睡觉”，“保守你们的心思”，“指引你们行各样的善事”。\n\n愿主与你同在，带给你们平安和喜乐。\"\n- 东方主教的通谕，1848年"
 eocfm.034.a: "教皇应该学会谦卑。"
 eocfm.034.b: "我们将伸出橄榄枝。"
 eocfm.035.t: "菲勒蒂主义的问题"
 eocfm.035.d: "菲勒蒂主义有所抬头。传统上，每位主教都在确定的地区主持礼拜，用希腊语提供服务。然而，已有牧师被发现在他们被指定的地区之外为少数民族提供服务。"
 eocfm.035.f: "随着巴尔干半岛和近东地区民族主义的抬头，几个民族开始寻求用自己的语言由自己文化的牧师提供的宗教服务。这导致牧师管辖区的重叠，因为主教们试图在保持对其规定地区的控制的同时，继续接触自己文化的少数族群。牧首们谴责这是对教会结构的严重破坏。"
 eocfm.035.a: "教会必须有秩序。"
 eocfm.035.b: "让信徒按照他们的意愿敬拜。"
 eocfm.036.t: "菲勒蒂主义问题解决"
 eocfm.036.d1: "在古老的牧首指导和资历的影响下，普世公会议谴责了菲勒蒂主义问题，并宣布教会内任何形式的民族中心主义都是对普世教会的冒犯。"
 eocfm.036.d2: "在对传统和教会结构的叛逆中，普世公会议支持建立重叠的主教见，旨在为整个东正教世界的民族社区量身定制神圣的话语。"
 eocfm.036.f: "\"你们（希腊人）和保加利亚人一样都可以被指控实行菲勒蒂主义，即将种族利益引入教会问题，并将宗教用作政治工具；但不同之处在于保加利亚的菲勒蒂主义是防御性的，而你们的是进攻性的。他们的菲勒蒂主义仅仅是为了划定自己部落的界限；而你们的是试图跨越希腊化的界限\" -K. 列昂季耶夫, 1872年"
 eocfm.036.a: "我们是一个团结的教会。"
 eocfm.036.b: "每个社区都应该有自己的教会。"
 eocfm.037.t: "过时的历法"
 eocfm.037.d: "为了应对对西方的日益暴露，几个东正教国家已经开始采用格里高利历以简化其在贸易和外交中的互动。这引发了教会内部的分裂性辩论，而教会仍然使用儒略历。"
 eocfm.037.f: "由凯撒大约一千五百年前提出的儒略历取代了罗马阴阳历。在1582年，教皇格列高利十三世发布了一份更新的历法，以纠正由于日偏移而造成的差错。尽管在欧洲和北美广泛采用，但东正教会拒绝采纳这一变革。"
eocfm.037.a: "我们应该摆脱过去的束缚。"
 eocfm.037.b: "这有异端的味道。"
 eocfm.038.t: "儒略历"
 eocfm.038.d1: "在来自整个东正教世界学者的激烈辩论几周后，普世公会议同意实施修订后的儒略历。修订后的历法具有与格里高利历相竞争的精确性，成功解决了未来千年的昼夜平分日期漂移的问题。"
 eocfm.038.d2: "对来自西方的自由化压力的谴责，普世公会议拒绝了对儒略历进行任何变更的想法，认为这等同于采纳格里高利历，而格里高利历本身就是西方异端的象征。"
 eocfm.038.f: "\"新历法政治年份与格里高利历之间的差异如此之小，以至于只有经过了877年后才观察到日期的差异。 -M. 米兰科维奇, 1923年"
 eocfm.038.a: "这是正确的选择。"
 eocfm.038.b: "我们不会抛弃我们的根源。"
 eocfm.040.t: "国家教会的独立性"
 eocfm.040.d: "在牧首们的抵抗面前，[ROOT.GetCountry.GetName]教会成功地将其教会行政管理与君士坦丁堡分开。"
 eocfm.040.f: "作为塞尔维亚人，保护我们的文化和身份的唯一途径就是掌控我们的精神事务，而不管牧首们的抱怨如何。"
 eocfm.040.a: "我们将捍卫我们的信仰。"
 eocfm.041.t: "自治敕令"
 eocfm.041.d: "在国王奥托的摄政期间，一组平信徒和教士建议年轻的国王宣布正教会独立于普世牧首。经过多年的辩论，普世牧首裁定希腊东正教会将监督希腊国内的礼拜。"
 eocfm.041.f: "\"我们一起承认她，并宣称她是我们的灵性姐妹，并且对于这一点，对于独立希腊教会的一切最虔诚和最正统的子女，作为教会，我们祈祷您将被认可并记住为“希腊教会的圣公会”，在这个见证下，高牧首在他们自己的省份中，这是所有东正教教区都记得的，并授予了高牧首所需的规范版本。\" -1850年6月29日的自治敕令"
 eocfm.041.a: "国王将是我们的精神保护者。"
 eocfm.042.t: "公开"
 eocfm.042.d: "公开"
 eocfm.042.f: "公开"
 eocfm.042.a: "公开"
 eocfm.043.t: "谢蒂涅大都主教区"
 eocfm.043.d: "通过[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的努力，[ROOT.GetCountry.GetCapital.GetCityHubName]的主教已被任命为[ROOT.GetCountry.GetName]的最高教会权威。"
 eocfm.043.f: "对于非正教基督徒来说，这可能被视为技术上的细节，但这将帮助我们免受奥斯曼帝国进一步干预的影响。"
 eocfm.043.a: "我们将保护信徒。"
 eocfm.044.t: "贝尔格莱德大都主教区"
 eocfm.044.d: "经过[ROOT.GetCountry.GetName]与普世牧首的长时间谈判，[ROOT.GetCountry.GetCapital.GetName]的主教被任命为塞尔维亚教会的负责人。"
 eocfm.044.f: "作为塞尔维亚人，保护我们的文化和身份的唯一途径就是掌控我们的精神事务，而不管牧首们的抱怨如何。"
 eocfm.044.a: "我们将保护塞尔维亚的信徒。"
 eocfm.045.t: "全体[ROOT.GetCountry.GetName]牧首"
 eocfm.045.d: "在我们的牧首们的巨大努力下，原本是苏丹命令的保加利亚大主教区已被承认为保加利亚国家唯一真正的教会。"
 eocfm.045.f: "\"一个教区将成立，名为保加利亚大主教区，该主教区将包括大都会地区、主教区和一些其他地方，并将完全委托给大主教区管理此地区的教会事务。-1870年设立保加利亚大主教区的法令"
 eocfm.045.a: "我们将保护这一崇高的职位。"
 eocfm.050.t: "声称宗主教席位"
 eocfm.050.d: "在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的命令下，我们的牧师们已经开始为将外国宗主教管辖权与我们的政治结构整合做准备。"
 eocfm.050.f: "自从君士坦丁堡沦陷给奥斯曼人以来，东方教会的整体资历已经在君士坦丁堡和莫斯科之间来回摇摆，其他古老的主教管区也不时地声称独立。随着民族主义的兴起，这变得更加复杂，因为各国试图摆脱希腊对教会的主导地位。"
 eocfm.050.a: "也许现在不是合适的时候。"



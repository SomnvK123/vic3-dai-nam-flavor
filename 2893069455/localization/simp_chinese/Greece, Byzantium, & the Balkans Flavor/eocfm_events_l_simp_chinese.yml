eocfm.323.d: "在与[SCOPE.gsInterestGroup('ig_devout_scope').GetName]的谈判后，[SCOPE.sCountry('moldova_scope').GetName]已同意在宗主教的保护下。"
eocfm.323.f: "尽管我们存在分歧，我们的领导人认为我们的信仰纽带更加坚固。让基督引领我们的道路。"
eocfm.323.a: "这是希腊外交的又一次胜利。"
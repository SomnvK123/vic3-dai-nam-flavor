 eocfm.300.t: "宗主教权崛起"
 eocfm.300.d: "随着[ROOT.GetCountry.GetRuler.GetFullName] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]宣布[ROOT.GetCountry.GetName]的重生，教堂钟声齐鸣，人们欢呼雀跃。在[SCOPE.sBuilding('hagia_sofia_scope').GetName]的巍峨庇护下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]身上披挂着重建的君士坦丁堡牧首的旧标志和徽章。[ROOT.GetCountry.GetRuler.GetFirstName]向着一群公民、贵族和神职人员迈进，成为了希腊人民未来的指引。"
 eocfm.300.f: "自从罗马和君士坦丁堡的失落以来，几个世纪以来无数次的尝试都失败了，但今天帝国已经再次崛起。然而，还有很多工作要做：许多希腊人受到异端和异教徒的统治，曾经的罗马土地仍然被外国冒名顶替者控制，无数拜占庭宝藏被扣为人质。如果[ROOT.GetCountry.GetRuler.GetSheHe]要为[ROOT.GetCountry.GetName]带来荣耀，那么[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须确保能够满足[ROOT.GetCountry.GetRuler.GetHerHis]臣民的期望。"
 eocfm.300.a: "我们的教会是普世的。"
 eocfm.301.t: "都主教领地"
eocfm.301.t: "都主教领地"
 eocfm.301.d: "我们的努力已经取得了成果，[ROOT.GetCountry.GetName]的重生已经到来。现在，有几个声音呼吁恢复[ROOT.GetCountry.GetAdjectiveNoFormatting]的权力和声望，让曾经的拜占庭领土重新回到希腊人手中。决定[ROOT.GetCountry.GetAdjectiveNoFormatting]国家未来的责任落在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]肩上。"
 eocfm.301.f: "\"希腊王国不是希腊；它只是希腊的一部分：希腊最小、最贫穷的一部分。希腊人不仅是居住在王国的人，也是居住在约阿尼纳、萨洛尼卡、塞雷斯、阿德里安堡、君士坦丁堡、特雷比松、克里特岛、萨莫斯岛或任何其他属于希腊历史或希腊种族的地区的人…… 希腊有两个伟大的中心。雅典是王国的首都。君士坦丁堡是伟大的首都，是所有希腊人的梦想和希望。\" - I. Kolettis, 1844"
 eocfm.301.a: "我们将恢复[ROOT.GetCountry.GetName]的辉煌。"
 eocfm.301.b: "我们将限制在巴尔干地区。"
 eocfm.301.c: "我们将限制在安纳托利亚。"
 eocfm.302.t: "新君士坦丁堡"
 eocfm.302.d: "随着安纳托利亚和巴尔干地区牢牢掌握在我们手中，帝国的旧心脏已经重新夺回！"
 eocfm.302.f: "将近一千年前，以撒一世科姆尼诺斯皇帝庄严地领导帝国进入了一个重振雄风和荣耀的时代。随着旧的心脏地区重新夺回，东罗马帝国的心脏已经恢复，东正教牧首的所在地也已经恢复。"
 eocfm.302.a: "向巴西莱乌斯致敬！向拜占庭致荣耀！"
 eocfm.303.t: "进入圣地"
 eocfm.303.d: "希腊人的古老核心地区现在处于我们的控制之下。[ROOT.GetCountry.GetAdjectiveNoFormatting]法庭中的显要声音呼吁将埃及和黎凡特归还给我们，这两个地方曾经是基督教堡垒的中心。"
 eocfm.303.f: "两千多年来，希腊文化在东地中海地区占主导地位。如今，古希腊城市已经荒废，基督教堡垒也在穆斯林的统治下岌岌可危。"
 eocfm.303.a: "我们将收复东方帝国。"
 eocfm.303.b: "我们已经收复了希腊的核心地区。这已经足够了。"
 eocfm.304.t: "东方教会"
 eocfm.304.d: "我们的征服终于解救了基督教诞生地，在过去的一千多年中受到压迫。现在，牧首们正在努力恢复穆斯林统治期间关闭的教堂。经过辩论和商讨，君士坦丁堡的牧首与其他东方牧首呼吁对继续威胁我们边境的异教徒发动新的十字军东征，这一次不需要西方教皇的危险军队。"
 eocfm.304.f: "\"因为祖先们根据同样的考虑正确地授予了古罗马宝座特权，因为那是皇城。一百五十位最虔诚的主教，出于同样的考虑，将同样的特权授予了新罗马的至圣宝座，公正地认为，在政治上受到荣耀和参议院的尊敬，并且在教会事务上像她一样，应该被放大，并在古老的帝国罗马之后排名。\" -加尔基顿大公会议第28条，451年"
 eocfm.304.a: "所有信徒都将得到牧首的庇护。"
 eocfm.304.b: "东正教会是完整的，让我们感恩。"
 eocfm.305.t: "东正教国度"
 eocfm.305.d: "1453年，君士坦丁堡沦陷于奥斯曼帝国，人们曾希望莫斯科大公国能够拯救基督教的中心。然而，从未有过这样的援助。尽管如此，俄罗斯[SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFullName]宣称对巴尔干地区的基督徒拥有保护权，因此也对[ROOT.GetCountry.GetName]拥有保护权。"
 eocfm.305.f: "\"所以，请知道，虔诚的国王，所有的基督教王国都结束了，都聚集在您的单一王国中，两个罗马倒下了，第三个屹立着，不会有第四个。没有人能取代您的基督教沙皇王国，这是伟大的神学家的话。\""
 eocfm.305.a: "君士坦丁堡才是东方的真正中心。"
 eocfm.306.t: "横跨好客的海洋"
 eocfm.306.d: "我们已经在基督教的核心地区控制无人能敌。我们权威的最后障碍仍然是俄罗斯东正教，他们仍然宣称对东方教会拥有至高权威。"
 eocfm.306.f: "[ROOT.GetCountry.GetName]曾经统治黑海。即使在今天，许多东正教希腊人仍然居住在其沿岸。在把眼光投向北方的篡夺者之前，我们必须先将同胞从斯拉夫人的压迫中解放出来。"
eocfm.306.a: "准备舰队！"
eocfm.307.t: "莫斯科，第三罗马"
eocfm.307.d: "我们成功地将受剥削的东正教信徒带入我们的保护之下。随着东正教信徒转向普世牧首教宗，我们的目光现在转向伟大的冒名顶替者，[SCOPE.sCountry('russia_scope').GetName]。"
eocfm.307.f: "俄国冒名顶替者继续在三一修道院的虚假宝座上宣称对东正教信徒的主权无端索求。"
eocfm.307.a: "我们将让这些俄国冒名顶替者屈服。"
eocfm.308.t: "君士坦丁堡的至尊"
eocfm.308.d: "从尼罗河的重装骑兵到德涅普河的支流，正统教会的土地已经受到严密的保护监视。"
eocfm.308.f: "普世牧首赞颂了一个新的和平繁荣时代，他们自己站在基督教东方诸国的领导之首。"
eocfm.308.a: "正统教会将引领我们走向未来。"
eocfm.308.b: "君士坦丁堡将成为基督教的灯塔。"
eocfm.310.t: "古老的宗主教区"
eocfm.310.d: "经过几个世纪的分离，东方基督教的伟大宗主教席位已经回归君士坦丁堡的皇帝统治之下。"
eocfm.310.f: "拥有东方基督教的核心地区控制权后，宗教和社会领袖呼吁将皇权办公室与正统教会重新统一。"
eocfm.310.a: "国王将以上帝之名统治。"
 eocfm.310.b: "圣母玛利亚微笑着眷顾我们。"
eocfm.311.t: "五主教权的恢复"
eocfm.311.d: ""
eocfm.311.f: ""
eocfm.311.a: ""
eocfm.312.t: "夺取大清真寺"
eocfm.312.d: "我们对萨拉森人的正义圣战带来了他们的明珠，异教城市麦加，进入了我们的掌控之中。"
eocfm.312.f: "一排排拜占庭士兵一个接一个地进入了这座城市。在那里，我们看到了大清真寺，以及在其核心的异教遗物，即哈杰鲁阿斯瓦德... 黑色的黑石！"
eocfm.312.a: "我们不带来和平。烧毁一切。"
eocfm.312.b: "我们将其改建为博物馆。"
eocfm.312.c: "萨拉森人在耶路撒冷保持了和平。我们将在麦加保持和平。"
eocfm.320.t: "乌克兰领土"
eocfm.320.d: "在与[SCOPE.gsInterestGroup('ig_devout_scope').GetName]的谈判后，[SCOPE.sCountry('ukraine_scope').GetName]已同意在宗主教的保护下。"
eocfm.320.f: "尽管我们存在分歧，我们的领导人认为我们的信仰纽带更加坚固。让基督引领我们的道路。"
eocfm.320.a: "这是希腊外交的又一次胜利。"
eocfm.321.t: "白俄罗斯领土"
eocfm.321.d: "在与[SCOPE.gsInterestGroup('ig_devout_scope').GetName]的谈判后，[SCOPE.sCountry('belarus_scope').GetName]已同意在宗主教的保护下。"
eocfm.321.f: "尽管我们存在分歧，我们的领导人认为我们的信仰纽带更加坚固。让基督引领我们的道路。"
eocfm.321.a: "这是希腊外交的又一次胜利。"
eocfm.322.t: "格鲁吉亚领土"
eocfm.322.d: "在与[SCOPE.gsInterestGroup('ig_devout_scope').GetName]的谈判后，[SCOPE.sCountry('georgia_scope').GetName]已同意在宗主教的保护下。"
eocfm.322.f: "尽管我们存在分歧，我们的领导人认为我们的信仰纽带更加坚固。让基督引领我们的道路。"
eocfm.322.a: "这是希腊外交的又一次胜利。"

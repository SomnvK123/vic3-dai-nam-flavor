l_simp_chinese:
 eocfm.001.t: "东方的主教"
 eocfm.001.d: "随着新世纪的开始，学者和世俗领袖们也对[ROOT.GetCountry.GetStateReligion.GetName]境内的教会所应扮演何种角色而争论不休。一部分人认为我们应该像拜占庭和俄罗斯一样推进国家对教会的全面控制；而另一部分人则倡导对其不加干预，以防止对教会产生类似奥斯曼式的新型压迫。"
 eocfm.001.f: "东正教传统与西方罗马天主教传统大相径庭。东正教教会由五大牧首区领导，拒绝承认罗马教廷的最高权威，其中四个牧首区位于君士坦丁堡、安条克、亚历山大和耶路撒冷，第五牧首区位于莫斯科。如今随着民族主义的崛起，各国都在加强对教会事务的管控。"
 eocfm.001.a: "天意所在，战无不胜。"
 eocfm.002.t: "政教关系"
 eocfm.002.d: "[ROOT.GetCountry.GetName]的教会在我国的文化认同中占支柱地位。一些高级神职人员认为将国家指定的神职人员纳入教会将消解其神圣性。"
 eocfm.002.f: "历史说明：国家任命高级教职人员的举措最早可以追溯到拜占庭时代。在土耳其和俄罗斯治下这种情况更加常见。然而，这种做法往往有可能损害神职人员的信誉，并使教会受到政治干预。"
 eocfm.002.a: "让教会自己处理"
 eocfm.002.b: "国家至上"
 eocfm.003.t: "普世教会改革"
eocfm.003.d: "东正教会是耶稣基督所建立的大教会的唯一真正继承者。然而，由于其分散的结构，几个世纪以来各个教会之间出现了分歧。一些主教请求国家支持，以在更好地与东正教大家庭保持一致的兴趣下实施一些礼仪变革。"
eocfm.003.f: "历史注解：随着主教对整个教会影响的起伏，东正教内部出现了一些差异，这经常导致小的分裂。例如，1650年代俄罗斯爆发的旧信徒运动和1920年代希腊爆发的旧历运动。"
eocfm.003.a: "他们将得到国家支持。"
eocfm.003.b: "我们不会放弃我们的传统。"
eocfm.004.t: "《圣经翻译出版》"
eocfm.004.d: "在[SCOPE.sState('eocfm_event_state').GetName]，[SCOPE.gsInterestGroup('intelligentsia_scope').GetName]计划在共和国[ROOT.GetCountry.GetAdjectiveNoFormatting]的所有教堂内出版圣书的翻译，引起了教徒们的愤怒。"
eocfm.004.f: ""在农民、工人中，甚至在商人和文员中，那些尚未完成中等教育的人中，有谁能理解福音的语言呢？没有人。"-Akropolis，1901年9月9日发表"
eocfm.004.a: "让信徒们阅读！" 
eocfm.004.b: "这是对神圣之词的侮辱！"
eocfm.005.t: "神职人员的过度行为"
eocfm.005.d: "在[SCOPE.sState('eocfm_event_state').GetName]，公众对使用国家提供的资金建造新大教堂的做法表示强烈反对。当地主教抗议说，这是国家资助的合法用途。"
eocfm.005.f: "尽管人们普遍支持教会，但许多人对这种世俗的财富展示表示反感。批评者认为，这些钱最好用于改善贫困人口的生活条件或支持偏远修道院。"
eocfm.005.a: "主教的行为是合法的。"
eocfm.005.b: "他应该学点谦逊。"
eocfm.005.c: "仔细想想，把它做得更大些！"
eocfm.006.t: "异端统治者"
eocfm.006.d: "[ROOT.GetCountry.GetName]是一个[GetReligion('orthodox').GetName]国家，然而[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]奉行[ROOT.GetCountry.GetRuler.GetReligion.GetName]信仰。大声的教堂领导人表示，是时候让[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]将国家的利益置于个人事务之上，加入教会。"
eocfm.006.f: "自罗马时代以来，东正教会一直在巴尔干半岛和小亚细亚地区占主导地位。然而，在随后的几个世纪中，天主教和新教在西方崛起。这与当地国家发生冲突，这些国家发现自己由大国强加的非正统君主统治。"
eocfm.006.a: "皇室将加入教会。"
eocfm.006.b: "我们将与继承人[SCOPE.sCharacter('eocfm_heir_scope').GetFirstName]妥协。"
eocfm.006.c: "这是胡说八道！"
eocfm.010.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting]国家大主教会议"
eocfm.010.d: " [ROOT.GetCountry.GetName]教会召集了国内所有高级主教参加会议。他们请求国家支持，在信仰上独立于建立的主教会。"
eocfm.010.f: "历史注解：在奥斯曼帝国崩溃期间，新独立的国家经常试图通过宣称摆脱对于君士坦丁堡和俄罗斯大主教的宗教独立来确立国家身份认同。这经常以宣称国家教会具有自主权的国家大主教会议的形式出现，然后寻求其他主教的认可。"
eocfm.010.a: "国家离开不了教会。"
eocfm.010.b: "他们自己处理吧。"
eocfm.011.t: "至圣会议"
eocfm.011.d: " [ROOT.GetCountry.GetName]东正教会已经发展成为东正教会中最大和最有影响力的大主教会之一。现在其管辖范围已经从欧洲黑海沿岸扩展到北美尤康山脉，俄罗斯皇帝一直试图主导东正教会。"
eocfm.011.f: "历史注解：在君士坦丁堡陷落后的几个世纪里，几位政治和宗教领袖曾主张莫斯科是罗马帝国的继承者，因此是基督教世界的真正领袖。尽管其他主教和整个基督教界都未承认这一角色，但皇帝利用这一点来影响东正教徒。1774年，《小凯纳尔卡条约》将帝国对奥斯曼帝国中的希腊东正教社区的名义控制权交给了俄罗斯，尼古拉斯一世在他的统治中大部分时间都在维护俄罗斯在奥斯曼国家的东正教事务中的主导地位。"
eocfm.011.a: "\"东方事务首先是俄罗斯的事。\""
eocfm.012.t: "[ROOT.GetCountry.GetName]的圣主教会议"
eocfm.012.d: "尽管 [ROOT.GetCountry.GetName]是一个东正教国家，但却由天主教国王统治，并且被新教传教士渗透。信徒们本身受到希腊东正教会的监督，由希腊圣主教会主持。国王[ROOT.GetCountry.GetRuler.GetFirstName]保持着谨慎的平衡，让圣主教会处理他们的事务，但保留了对他们决定的最终否决权。"
eocfm.012.f: "历史注解：几乎在登基后不久，摄政议会单方面宣布希腊的教会具有自主权，认为君士坦丁堡的普世牧首不过是苏丹的一个棋子。这将成为国家教会单方面采取的许多行动中的第一步，这些行动旨在确立国家身份，并使自己摆脱奥斯曼帝国的干涉。"
eocfm.012.a: "我们是一个东正教国家。"
eocfm.020.t: "委托一幅圣像"
 eocfm.020.d: "在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的指示下，来自[SCOPE.gsInterestGroup('devout_scope').GetName]的主教们提出了几个选项，用于向[ROOT.GetCountry.GetName]各地的教堂传播国家赞助的圣像。每一幅圣像都承诺能激励信徒。"
 eocfm.020.f: "东方教会的圣像传统可以追溯到早期基督教会，当时它转变为罗马帝国的国教。这种传统在与西方传统相对孤立的情况下发展和保持，圣像的风格和主题是东正教的特色之一。"
 eocfm.020.1: "救世主会供养我们。"
 eocfm.020.2: "圣母玛利亚会滋养我们。"
 eocfm.020.3: "圣约翰·克利马科斯会激励我们。"
 eocfm.020.4: "大天使米迦勒会保护我们。"
 eocfm.020.5: "奇迹工作者圣尼古拉会帮助我们。"
 eocfm.020.6: "神学家圣格里高利会启迪我们。"
 eocfm.020.7: "首个隐士圣保罗会调教我们。"
 eocfm.020.8: "叙利亚圣依撒格会使我们谦卑。"
 eocfm.020.9: "伟大的圣巴西略会指挥我们。"
 eocfm.020.a: "我们还有什么其他选择..."
 eocfm.020.tt: "这将显示另一页选项。"
 eocfm.020.b: "也许现在不是时候。"

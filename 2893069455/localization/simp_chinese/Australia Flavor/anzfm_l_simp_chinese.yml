 modifier_anzfm_swan_river_settlement: "天鹅河土地秩序"
 modifier_anzfm_swan_river_settlement_desc: "西澳大利亚的土地授予与定居政策鼓励移民进入偏远殖民地，也扩大了边疆行政的压力。"
 modifier_anzfm_western_goldfields: "西部金矿带"
 modifier_anzfm_western_goldfields_desc: "金矿把西澳大利亚从海角边缘推入大陆政治，但矿区人口、运输和自治诉求也随之暴涨。"
 modifier_anzfm_westralian_autonomy: "西澳自治派"
 modifier_anzfm_westralian_autonomy_desc: "西澳大利亚的距离、港口利益和金矿财政使本地精英更倾向于保护自己的殖民地议程。"
 modifier_anzfm_wakefield_colony: "韦克菲尔德式规划殖民"
 modifier_anzfm_wakefield_colony_desc: "南澳大利亚以土地销售、移民基金和规划城镇来塑造殖民社会，行政色彩强于偶然扩张。"
 modifier_anzfm_overland_telegraph: "陆上电报线"
 modifier_anzfm_overland_telegraph_desc: "阿德莱德通向北方的电报线把澳大利亚接入帝国通信网络，也把内陆变成政治问题。"
 modifier_anzfm_south_australian_reformism: "南澳改革主义"
 modifier_anzfm_south_australian_reformism_desc: "无记名投票、议会改革和公共教育让南澳大利亚成为殖民地自由主义的实验场。"
 modifier_anzfm_sydney_responsible_government: "悉尼责任政府"
 modifier_anzfm_sydney_responsible_government_desc: "新南威尔士的责任政府把总督府权威转化为议会政治，也让自治经验向其他殖民地扩散。"
 modifier_anzfm_newcastle_coal: "纽卡斯尔煤港"
 modifier_anzfm_newcastle_coal_desc: "煤矿、港口和铁路把新南威尔士推向工业化，也制造出更集中的劳工政治。"
 modifier_anzfm_sydney_free_trade: "悉尼自由贸易派"
 modifier_anzfm_sydney_free_trade_desc: "悉尼商人和港口利益反对过高关税，但他们也需要一个更可预测的大陆市场。"
 modifier_anzfm_van_diemens_transportation: "范迪门地流放制度"
 modifier_anzfm_van_diemens_transportation_desc: "流放犯制度给塔斯马尼亚留下了秩序、耻辱和劳动力结构上的长期阴影。"
 modifier_anzfm_tasmanian_moral_reform: "塔斯马尼亚道德改革"
 modifier_anzfm_tasmanian_moral_reform_desc: "教会、慈善网络和改革者试图把流放殖民地改造成更体面的自治社会。"
 modifier_anzfm_tasmanian_island_autonomy: "岛屿自治"
 modifier_anzfm_tasmanian_island_autonomy_desc: "塔斯马尼亚的海峡位置让它既需要大陆市场，又担心在未来联邦中被大殖民地吞没。"

 anzfm.021.t: "天鹅河的土地秩序"
 anzfm.021.d: "西澳大利亚的定居者要求把土地、劳动力和港口补给组织成一种更稳定的殖民秩序。可在珀斯之外，所谓空地很快就会变成边疆争端。"
 anzfm.021.f: "一张土地授予书可以把遥远海岸变成财产，也可以把无人提及的边界变成冲突。"
 anzfm.021.a: "扩大土地授予和移民补助。"
 anzfm.021.b: "把土地政策纳入殖民地议会审查。"
 anzfm.022.t: "西部金矿带"
 anzfm.022.d: "金矿把西澳大利亚从帝国边缘猛地推向大陆政治。矿工、测量员、驼队、港口商人和自治派都开始围绕一条问题聚集：这片遥远土地应当听谁的？"
 anzfm.022.f: "沙尘中的金粒很小，但足够让整条海岸线改变方向。"
 anzfm.022.a: "让金矿热自己燃烧。"
 anzfm.022.b: "用铁路、电报和行政网驯服金矿。"
 anzfm.023.t: "西澳自治派"
 anzfm.023.d: "西澳大利亚的精英担心，联邦会让悉尼和墨尔本支配遥远西岸；金矿带和港口商人则希望保留本地财政与土地政策。"
 anzfm.023.f: "他们不是反对澳大利亚，只是怀疑澳大利亚会不会记得印度洋这一侧。"
 anzfm.023.a: "纵容西澳特殊立场。"
 anzfm.023.b: "把西澳安全感写进联邦谈判。"
 anzfm.024.t: "规划出来的殖民地"
 anzfm.024.d: "南澳大利亚的创建者宣称这里不是流放地，而是一个由土地销售、自由移民和规划城镇塑造的新社会。理想越清晰，现实越难被藏起来。"
 anzfm.024.f: "他们用尺规画城市，用价目表安排移民，然后发现荒野不读章程。"
 anzfm.024.a: "坚持韦克菲尔德式规划。"
 anzfm.024.b: "放松土地价格，让更多劳动者进入。"
 anzfm.025.t: "南澳选票"
 anzfm.025.d: "南澳大利亚的改革派把无记名投票、代表权和公共教育联系起来。他们认为殖民地不该只是帝国治理的分支，也可以成为自由主义制度的实验室。"
 anzfm.025.f: "选票折起来时，殖民地第一次学会用沉默表达政治。"
 anzfm.025.a: "把改革派推到台前。"
 anzfm.025.b: "提醒他们财产秩序同样重要。"
 anzfm.026.t: "穿过大陆的电线"
 anzfm.026.d: "陆上电报线把阿德莱德、北部海岸和帝国通信网连接起来。每一根杆子都在提醒议会：内陆不再只是地图的空白。"
 anzfm.026.f: "铜线越过干旱与盐湖，把距离压成一串滴答声。"
 anzfm.026.a: "把电报线变成殖民地间工程。"
 anzfm.026.b: "优先巩固沿线边疆行政。"
 anzfm.027.t: "悉尼责任政府"
 anzfm.027.d: "新南威尔士的议员要求总督府承认殖民地议会的政治责任。自治不是抽象原则，而是预算、土地、警察和移民政策归谁决定。"
 anzfm.027.f: "他们仍向王冠致敬，但已经开始计算王冠离这里有多远。"
 anzfm.027.a: "扩大议会责任。"
 anzfm.027.b: "维持总督府制衡。"
 anzfm.028.t: "纽卡斯尔煤港"
 anzfm.028.d: "煤矿、码头和铁路把新南威尔士的港口经济推向工业化。新的财富来自地下，也来自越来越有组织的矿工和装卸工。"
 anzfm.028.f: "煤尘落在账本上，也落在工会章程上。"
 anzfm.028.a: "扶持煤港与铁路。"
 anzfm.028.b: "把港口收益转向本地防务。"
 anzfm.029.t: "悉尼自由贸易派"
 anzfm.029.d: "悉尼港口商人反对殖民地间关税壁垒，也担心未来联邦会被保护主义者劫持。自由贸易成为新南威尔士表达大陆野心的语言。"
 anzfm.029.f: "有些边界不是用栅栏筑成的，而是用税率写成的。"
 anzfm.029.a: "让自由贸易派主导谈判。"
 anzfm.029.b: "保护本地工业与工人工资。"
 anzfm.031.t: "范迪门地的阴影"
 anzfm.031.d: "塔斯马尼亚仍被流放犯制度的记忆缠绕。秩序、劳动力和帝国服从曾经从同一条船上登陆，如今自治派必须决定如何处理这份遗产。"
 anzfm.031.f: "岛屿可以隔开海峡，却很难隔开过去。"
 anzfm.031.a: "利用旧制度维持秩序。"
 anzfm.031.b: "公开终结流放地遗产。"
 anzfm.032.t: "岛上的道德改革者"
 anzfm.032.d: "教会、慈善家和教育改革者要求塔斯马尼亚用学校、收容机构和公共道德来重写殖民地形象。批评者则说，这不过是把旧控制换成新名词。"
 anzfm.032.f: "有时候，改革是一盏灯；有时候，它只是换了灯罩的审判。"
 anzfm.032.a: "支持道德改革网络。"
 anzfm.032.b: "让世俗议会接管社会政策。"
 anzfm.033.t: "海峡另一边"
 anzfm.033.d: "塔斯马尼亚商人需要大陆市场，地方政治家却担心联邦会让岛屿沦为边注。自治与整合之间的争论在霍巴特和朗塞斯顿持续升温。"
 anzfm.033.f: "海峡不宽，但足够让每一项大陆政策显得像从远处吹来的风。"
 anzfm.033.a: "以岛屿自治换取联邦参与。"
 anzfm.033.b: "保持谨慎距离。"

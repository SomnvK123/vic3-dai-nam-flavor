 je_warlord_china_reason: "#bold 进度条#!的状况会因特定条件#tooltippable;tooltip:[Country.GetTooltipTag],je_warlord_china_special_tooltip_advance 推进#!或#tooltippable;tooltip:[Country.GetTooltipTag],je_warlord_china_special_tooltip_deplete 回退#!。#bold 进度条#!到达#variable 0%#!会导致中央政府彻底丧失控制力，专制的地方权威夺取权力。\n\n尽管在雍正和乾隆治下经历了一段短暂的稳定期，但在叛乱、管理不善和外部压力的影响下，中国已经开始持续走向崩溃。如果中央政府彻底丧失权威，在[SCOPE.GetRootScope.GetCountry.GetName]中，一场席卷全[concept_dsk_china]的[concept_revolution]将会爆发。"
 je_warlord_china_special_tooltip_deplete: "以下条件会#bold 减少#!#bold 进度条#!：\n•输掉#BOLD 鸦片战争#!\n•未能阻止#BOLD 太平天国#!出现\n•未能重新占领#BOLD 太平天国#!\n•#BOLD 义和团运动#!失败\n•负债并借取[concept_loans]\n•爆发[concept_civil_war]\n•成为另一国家的[concept_subject]国\n•废除[GetLawType('law_monarchy').GetName]\n•成为#n 东亚病夫#!"
 je_warlord_china_special_tooltip_advance: "以下条件会#bold 推进#!#bold 进度条#!：\n•赢得#BOLD 鸦片战争#!\n•不再是[concept_unrecognized_power]\n•完成#BOLD 消灭君主制#![concept_journal_entry]"


 conquest_of_algeria.1.t:0 "阿尔及利亚战役"
 conquest_of_algeria.1.d:0 "自征服伊始，阿尔及利亚各地即自发组织起武装抵抗我军。起初，封地内的贝伊们互相攀比资历、争夺领导权，致使当地贵族迟迟无法推举出一位真正的领袖。而后，最佳人选出现了，他便是阿尔及利亚阿拉伯统治者的后裔——埃米尔·阿卜杜卡德尔。奥斯曼的统治被推翻后，他从埃及的流放地回到了故土。我们必须严密监视阿卜杜卡德尔控制下各地区的局势。"
 conquest_of_algeria.1.f:0 "“永远不要问一个人来自哪里；要问他的生活、他的勇气、他的品质，你就会知道他是谁。” ‑埃米尔·阿卜杜勒卡德尔"
 conquest_of_algeria.1.a:0 "并非难比登天。"
 conquest_of_algeria.2.t:0 "康斯坦丁之围"
 conquest_of_algeria.2.d:0 "艾哈迈德·贝伊·本·穆罕默德·谢里夫（又名艾哈迈德·贝伊）于1826年被任命为康斯坦丁的贝伊。现在在侯赛因·帕夏的帮助下，领导阿尔及利亚人在阿尔及利亚东部抵抗法国占领军。为此，阿尔及利亚总督向我国政府提供了一个可能的攻击计划，用以夺取阿尔及利亚东部。这个计划将会严重削弱马斯卡拉埃米尔和康斯坦丁贝伊的力量，并稳定和巩固法国在阿尔及利亚的地位。"
 conquest_of_algeria.2.f:0 "“我经常听到一些我虽然尊敬但我不认同的人觉得我们烧毁庄稼，清空粮仓，最后抓走手无寸铁的那些男人、妇女和儿童是错误的。这些，在我看来，是很必要的不幸，并且也是任何想对阿拉伯人发动战争的人所必须服从的。” ‑亚历克西斯·德·托克维尔"
 conquest_of_algeria.2.a:0 "法兰西万岁！"
 conquest_of_algeria.3.t:0 "阿卜杜卡迪尔投降"
 conquest_of_algeria.3.d:0 "在冲突的前期，阿卜杜卡迪尔依然占据着优势地位。然而，随着法军机动性的增强，以及一并推行的焦土政策。阿卜杜卡迪尔的优势地位荡然无存，焦土政策导致阿尔及利亚人民不得不忍饥挨饿，游击队的士气也一落千丈。阿卜杜卡迪尔被迫向法军投降，但他提出想要被流放亚历山大或阿克里。他的请求得到了批准，两天后，他正式向法国总督投降，同时象征性地将他的战马交给了总督。"
 conquest_of_algeria.3.f:0 "“军队就是非洲的一切。唯其以毁四海，唯其将建八方。唯其广征土地，唯其耕耨之肥。并能够通过伟大的公共工程来建设土地，以接纳众多的平民。” ——托马斯·罗伯特·布戈"
 conquest_of_algeria.3.a:0 "在我的字典里没有不可能三个字。"
 from_adolphe_thiers:0 "阿道夫·梯也尔"
 from_rival_royalist:0 "支持另一个家族"

 je_fall_of_july_monarchy:0 "奥尔良派的迟疑"
 je_fall_of_july_monarchy_end:0 "政局动荡可能会导致意料之外的结果"
 je_fall_of_july_monarchy_goal.1:0 "$ig_variant_intelligentsia$在1847年至1849年间担任政府职务期间最有权势"
 je_fall_of_july_monarchy_reason:0 "奥尔良君主制，本应是共和国和皇室之间的中庸之道，却没有得到民众的广泛支持。右翼正统派分子要求复辟波旁王朝。左翼共和主义者仍然举足轻重。随着时间的推移，路易‑菲利普变得越来越刻板和教条，他的簇拥者失去了所有的人气。随着局势不断升级，可能会有意料之外的事情发生。"
 je_first_presidential_election:0 "准备大选"
 je_first_presidential_election_goal:0 "已经过去了10个月"
 je_first_presidential_election_reason:0 "总统选举预计将特别激烈，因为它是在严重的政治危机背景下进行的。如果他们顺利进行，我们将非常幸运。许多人希望改变，而这次选举是使国家不发生流血事件的最后机会。"
 je_future_of_the_republic:0 "解决政治危机"
 je_future_of_the_republic_goal.1:0 "[SCOPE.sCharacter('louis_napoleon_leader').GetFirstName]是国家元首，$ig_variant_armed_forces$利益集团很强大，在总统选举后的第二和第四年之间执政。"
 je_future_of_the_republic_goal.2:0 "[SCOPE.sCharacter('louis_napoleon_leader').GetFirstName]是国家元首，利益集团$ig_variant_intelligentsia$和$ig_variant_trade_unions$被边缘化。"
 je_future_of_the_republic_reason:0 "总统选举后，革命的热情消退，激进情绪开始加剧。一些政治家开始谈论用“强硬手段”来维持秩序的必要性。"
 je_creating_a_second_empire:0 "准备公投"
 je_creating_a_second_empire_goal:0 "已经12个月"
 je_creating_a_second_empire_reason:0 "现在路易·拿破仑掌握了所有的权力，他必须开始准备大选，使新帝国的建立合法化！"
 je_fall_of_french_empire:0 "第二帝国的陨落"
 je_fall_of_french_empire_reason:0 "现在，法兰西皇帝已经被他在巴黎的敌人废黜，剩下的唯一问题就是法国应采取何种政体"
 je_french_conquest_of_algeria:0 "征服阿尔及利亚"
 je_french_conquest_of_algeria_end:0 "对阿尔及利亚的征服即将完成。"
 je_french_conquest_of_algeria_reason:0 "法国于1830年前不久以打击海盗为借口征服阿尔及利亚，现在阿尔及利亚人必须被征服，伪总督也必须被逮捕。我军作战时间已经太长了，阿卜杜·卡迪尔和艾哈迈德贝伊的抵抗必将被粉碎。"
 orleaniste_buff:0 "提高对政府的支持度"
 orleaniste_buff_desc:0 "政治危机已经解决，政府的影响力得到加强。"
 laissez_faire:0 "挑战权威"
 laissez_faire_desc:0 "宴会活动正在增加共和党的影响力。"
 win_bonaparte:0 "波拿巴的胜利！"
 win_bonaparte_desc:0 "波拿巴赢得了第二共和国的第一次大选。"
 win_cavaignac:0 "卡韦尼亚克的胜利！"
 win_cavaignac_desc:0 "卡瓦尼亚克赢得了第二共和国第一次大选。"
 win_ledru:0 "勒德吕‑罗兰的胜利！"
 win_ledru_desc:0 "勒德吕‑罗兰赢得第二共和国的第一次大选。"
 fail_coup_etat:0 "反对政变"
 fail_coup_etat_desc:0 "路易‑拿破仑在一次未遂政变后被捕。"
 immortal:0 "不朽"
 immortal_desc:0 "他的时代尚未到来"
 orleanist_flavor.1.t:0 "宴会运动"
 orleanist_flavor.1.d:0 "为了在规避政府对工会和集会的严格禁令的同时宣传改革，改革运动的富有成员首先在巴黎，后来在大省级城市开始组织公共宴会。他们在演讲中大声谈论改革项目，有时甚至尖锐地批评政府。这场运动的主要目标是选举法的自由化。"
 orleanist_flavor.1.f:0 "“宴会程序。\n举办宴会的场地大门将在三点钟打开。\n宴会将由市政府第一副市长、医生布沙尔先生主持。\n下午四点，拉马丁先生将接替他的位置。\n从三点到四点，从四点到总统敬酒时间，艺术家和业余爱好者们将演奏和声曲目。\n除了总统和拉马丁先生的敬酒外，不得敬酒。\n不允许唱歌或大声喧哗。\n投诉和提议将向负责宴会警察的专员提出。\n必须保持最大限度的有序，为了让这次示威产生卓有成效的影响”。"
 orleanist_flavor.1.a:0 "他们以为他们是谁！"
 orleanist_flavor.2.t:0 "政治危机的终结"
 orleanist_flavor.2.d:0 "奥尔良君主制的建立标志着权力从波旁王朝过渡至年轻的奥尔良王朝分支。这是人民主权对王权神授的胜利，同时也建立了自由秩序；这是资产阶级的胜利，同时也是土地贵族的最终失败。尽管反对者众多，但奥尔良王朝的统治似乎越来越稳固，甚至对政权最激进的反对者来说也是如此。"
 orleanist_flavor.2.f:0 "“在敌人或盲目的激情所煽动的骚动中，有一个信念激励并支撑着我，那就是我们在君主立宪制。要想克服现在的困难，唯有强国之间的合作，这是保障我们祖国的道德和利益的最可靠手段。让我们根据《宪章》，坚定地维护社会秩序及其附属。让我们根据《宪章》，忠实地保障公共自由及其发展。我们将把委托给我们的“遗产”完好无损地移交给我们的后代，他们将祝福我们建立和捍卫了这座大厦，他们将在这座大厦的庇护下幸福而自由地生活。”——路易·菲利普一世"
 orleanist_flavor.2.a:0 "好极了！"
 french_flavor.2.t:0 "波拿巴的胜利"
 french_flavor.2.d:0 "一夜之间，反对党中的达官贵人纷纷被捕；军队占领了巴黎的大街小巷，将公告贴遍砖墙城垣，宣布议会解散、普选恢复，并号召人民积极参与，让国家元首真正治理国家。第二天，有些地方仍然设起路障，但这些反叛企图很快就被粉碎；很快，路易‑拿破仑的提议以七百五十万对六十五万的优势被批准，就此颁布了参照帝国宪法的新宪法。"
 french_flavor.2.f:0 "“相反，如果你仍信任我，就请让我有这番手段实现从你那得到的伟业！历史使命要我结束革命时代，满足人民的合法需求并护着他们、免受影响；更要建立让人安身立命的制度，奠定长治久安的基础。”——路易·拿破仑·波拿巴"
 french_flavor.2.a:0 "王子总统万岁！"
 french_flavor.4.t:0 "第二帝国宣言"
 french_flavor.4.d:0 "法国的命运第一次不是在首都而是由各省决定！在建立个人政权后恢复帝国的公民投票，为路易·拿破仑带来了预期的成功，76%的选民投票支持帝国，不久后路易·拿破仑·波拿巴以拿破仑三世的名义被宣布为 \"法国的皇帝\"。"
 french_flavor.4.f:0 "然而当下仍有种担忧在滋生，我自会平息它们！仍有种不信任的情绪，促使某些人认定帝国就意味着战争，可在我看来，帝国就意味着和平！法兰西是渴望和平的，若这愿景实现，世界也会更安宁。要知道战争不是寻找乐子，是出于必要。在这不断变化的时代，处处都祸福相依，我们尽可以坦诚地说：“谁要兴师动众在欧罗巴重燃战火，那么他就有祸了！”——路易·拿破仑·波拿巴"
 french_flavor.4.a:0 "皇帝万岁！"
 french_flavor.6.t:0 "逮捕路易‑拿破仑！" 
 french_flavor.6.d:0 "路易·拿破仑·波拿巴在竞选共和国总统失败后，试图发动政变。他企图引诱高级军官参与政变，但并没有成功。此外，一位忠于共和政府的将军设法给陆军部发了一份电报，警告可能发生叛变，随后路易·拿破仑和他的随从被逮捕。"
 french_flavor.6.f:0 "“路易·波拿巴只知道一件事，他的目标；他的政策都在那里，粉碎共和派，蔑视保皇派。” ‑维克多·雨果"
 french_flavor.6.a:0 "把他送进监狱！"
 french_flavor.7.t:0 "第二帝国的陨落"
 french_flavor.7.d:0 "1870年7月底，连骑马都已困难的拿破仑三世带领一批厨师、仆役、侍从以及14 岁的皇太子亲临莱茵前线，却无法挽救败局，除8月初取得一点微不足道的小胜之外，法军在接下来的战役中接连败北。1870年9月初在色当战役大败于普军。拿破仑三世与他剩余的军士在9月1日向普鲁士投降，9月2日，拿破仑在色当会战中被普鲁士军队俘虏。皇帝投降的消息在三天后传到巴黎，国民议会被人入侵。9月4日下午，共和派在巴黎市政厅成立临时国防政府。共和派代表莱昂·甘必大在巴黎大会堂宣布帝国灭亡，成立[concept_fra_republic_3]。欧仁妮皇后在一位美国牙医的帮助下逃离杜伊勒里宫，到达英国，正式结束了法兰西第二帝国，拿破仑三世则被软禁在卡塞尔。\n皇帝终于在百姓、知识界和资产阶级中失去了支持。在宣布建立第二帝国时产生的对光明的未来和法国走向伟大的所有期望都都烟消云散了。"
 french_flavor.7.f:0 "“同志们！人民已经阻止了正在犹豫不决的议院，为了拯救处于危险中的国家，他们为共和国提出了要求：它被宣布了，这场革命是以公正和公共安全的名义进行的。公民们守护好你们的城市；明天你们将与国家的复仇者在一起！”‑莱昂·甘必大"
 french_flavor.7.a:0 "打倒君主制！共和国万岁！"
 royalist_restauration.1.t1:0 "第三次复辟"
 royalist_restauration.1.t2:0 "波旁复辟"
 royalist_restauration.1.d2:0 "虽然目前的政权存在重重困难，但正统派和波旁王朝却能够从迅速失去民意的政界对手中夺取权力。波旁家族的族长[SCOPE.sCharacter('legitimist_ruler').GetFullName]接受了由正统派复辟支持者组成的临时政府的提议，结束流亡并回来接受法国王位。"
 royalist_restauration.1.f1:0 "法兰西君主制下，王室与国家紧密相连、不可分割。因此我维护我的权利，竭诚起誓，以主为证，向法兰西和全世界宣布，我将忠于王国法律和先祖传统，承蒙祂所托，虔诚守护君主制，死而后已；这是法兰西唯一的救赎港，在历经风暴后，我的至爱法兰西将最终得以休息、得以幸福。”——亨利，尚博伯爵"
 royalist_restauration.1.f2:0 "“我不幸的兄弟路易十六的第一次出逃是他悲惨命运的开始。他们告诉我他们只会责怪你，“把你的大臣们弄走，我们会和睦相处。”我不会把你送回去的，如果这次我屈服于他们，他们会像对待我可悲的兄弟一样对待我们。”——查尔斯十世"
 royalist_restauration.1.a:0 "国王万岁！"
 royalist_restauration.2.t:0 "波拿巴派政变"
 royalist_restauration.2.d:0 "波拿巴家族的支持者利用他们在军队中的代理人组织了一场政变。忠于波拿巴的军队和叛军包围了首都，迫使守军投降。政府被迫逃离动荡不安的巴黎，而波拿巴主义者已经在庆祝他们的胜利。他们的领袖，[SCOPE.sCharacter('fra_ruler_scope').GetFullName]，在忠诚的士兵的簇拥下向人民发布了一份公告，宣布在法国恢复波拿巴君主制。"
 royalist_restauration.2.f:0 "“我发誓维护共和国领土的完整；尊重并遵守和谐和信仰自由的法律、尊重并遵守权利平等、政治和公民自由、自由贸易、不额外征税，只通过法律的实施来征税；维护荣誉军团的制度；只为法国人民的利益、幸福和荣耀而治理。”‑拿破仑‑波拿巴"
 royalist_restauration.2.a:0 "皇帝万岁！"
 royalist_restauration.3.t:0 "奥尔良复辟"
 royalist_restauration.3.d:0 "如今政治不稳定已经升温到了极限，在巴黎街头，第一批反对君主制复辟的人与警察和宪兵发生了冲突，在几个领导人的推动下，示威者用鹅卵石、砖头或花盆砸向军队。尽管如此，骚乱只会加强了复辟的支持者的影响力，在波旁宫举行的会议上，[SCOPE.sCharacter('orleanist_ruler').GetFullName]接受了议员们的提议，以47票对3票决定将法国王位授予奥尔良公爵。"
 royalist_restauration.3.f:0 "“巴黎的公民们！此刻聚集在巴黎的法国代表们表示他们希望我去首都，在那里行使王国的职能。我毫不犹豫地来到这里，与你们同甘共苦，将自己置身于你们英勇的民众之中，并尽一切努力使你们免于内战和无政府状态。当我回到巴黎时，我自豪地穿上了那些被法兰西带走的光荣，而我自己也穿了很长时间。如今两院正在开会；他们将商讨确保法律制度和维护国家权利的方法。从今以后宪章将成为真理。”‑路易·菲利普·奥尔良"
 royalist_restauration.3.a:0 "重新自由地张开双臂！"


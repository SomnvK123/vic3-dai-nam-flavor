 republican_flavor.3.t:0 "国民议会选举"
 republican_flavor.3.d:0 "在政局不稳的情况下，临时政府举行了国民议会选举，有超过900万人参加。选举结果令左派震惊。在880个代表席位中，有大约500个属于资产阶级共和派，社会党却只有18个席位。由于对选举结果和临时政府的外交政策不满，共和主义者组织了一次示威，前往议会所在的波旁宫。人群冲进大厅，使国民议会陷入瘫痪，之后临时政府动员了国民警卫队秩序才得以恢复。"
 republican_flavor.3.f:0 "“公民们！我以被代表欺骗的人民的名义，宣布国民议会解散！” ‑阿洛伊西斯·胡伯"
 republican_flavor.3.a:0 "左派遭受了严重的失败。"


 republican_flavor.5.a.tt:0 "[SCOPE.sCharacter('cavaignac_leader').GetFullName]将领导新政府"
 republican_flavor.6.d:0 "巴黎的工人对解散国家工场的谣言不满，发动叛乱并占领了巴黎的大部分地区，击退了国民警卫队的分遣队。作为恢复秩序的最后一次尝试，国民议会投票决定解散行政委员会，并成立了一个由温和共和派和激进社会主义者组成的新政府。新政府首脑[SCOPE.sCharacter('union_leader').GetFullName]号召市民回家，新上任的战争部长Amable de Courtais着手恢复首都的秩序。"
 republican_flavor.6.f:0 "“共和国临时政府承诺努力确保工人的生存，承诺保障所有公民就业，也承认工人必须团结才能从工作中获得合法利益。”——Louis Blanc"
 republican_flavor.6.a.tt:0 "[SCOPE.sCharacter('union_leader').GetFullName]将领导新政府"
 republican_flavor.7.t:0 "秩序党候选人"
 republican_flavor.7.d:0 "在制宪议会的一次会议上，左翼代表安东尼·图雷提出一项建议，即不应允许曾经统治的法国家族的任何成员竞选总统。这一建议引起了大多数代表的共鸣，因为大部分人都明白它是针对谁的。"
 republican_flavor.7.d_2:0 "在国民议会的一次会议上，左翼代表安东尼·图雷提出了一项建议，即不应允许曾经统治的法国家族的任何成员竞选总统。这个建议引起了大多数代表的共鸣，因为每个人都明白它是针对谁的。许多左翼人士担心，在巴黎起义后保留了一些威望的路易·拿破仑可能最终成为反动势力的妥协候选人，因此，他们千方百计地使他参与选举。"
 republican_flavor.7.f:0 "当路易斯·拿破仑走上讲台时，整个会议厅都关注着他。他的演讲成了一场灾难。他发表了一个非常简短的声明，停顿了两次，说他来到讲台上既不是要宣布他是共和国的忠诚公民，也不是王位的觊觎者。然后，令他的支持者普遍感到惊讶和沮丧的是，他离开讲台并就座。Thouret随后站起来，宣布波拿巴不可能对共和国构成危险也不能赢得任何选举，屋子里充满了快活的空气。"
 republican_flavor.7.a:0 "不要害怕这个白痴。"
 republican_flavor.7.b:0 "我们必须认真考虑这个提议。路易·拿破仑太危险了。"
 republican_flavor.7.a.tt:0 "[SCOPE.sCharacter('forces_leader').GetFullName]将有资格参加选举。"
 republican_flavor.7.b.tt:0 "左派太强大了。[SCOPE.sCharacter('forces_leader').GetFullName]将不允许参加选举。"
 republican_flavor.8.t:0 "总统选举"
 republican_flavor.8.d:0 "尽管可以预见的是[SCOPE.sCharacter('forces_leader').GetFullName]将在法国总统选举中大展身手，但没有人会想到他竟能做到这种地步。虽然他有独裁倾向以及在巴黎缺乏盟友，他似乎正试图拉拢所有人，甚至是获取奥尔良派的支持。临时政府的候选人[SCOPE.sCharacter('industrialists_leader').GetFullName]由于曾经领导镇压市内的起义，在首都以外鲜为人知。"
 republican_flavor.8.f:0 "\"工人们，所有举起武器反对祖国和共和国的人们，我最后一次以人类所有光荣和神圣的名义呼吁你们放下武器。这是制宪会议，整个国家对你们的要求。有人告诉你们，你们将受到残酷的报复。你们的敌人和我们的敌人也是这么说的！有人告诉你们，你们将被冷酷地献祭！到我们这里来吧，作为悔过和服从法律的兄弟，共和国的双臂将向你们敞开。\" —— Louis‑Eugène Cavaignac"
 republican_flavor.8.d_2:0 "[SCOPE.sCharacter('forces_leader').GetFullName]本应参加总统选举，但被国民议会阻止并禁止他参选。坚定的正统主义者[SCOPE.sCharacter('landowners_leader').GetFullName]将军赢得了大多数保皇派和很大一部分温和派的支持，成为右翼的主要候选人。[SCOPE.sCharacter('union_leader').GetFullName]试图在平息巴黎骚乱失败后领导政府，但这将引起温和派和农民的不满。他们担心他激进的政治计划只会加剧政治危机，因此他们害怕看到他成为国家元首。"
 republican_flavor.8.f_2:0 "“只有在这个被称为国民议会的投票站里生活过的人才能想象出那些最不了解国情的人是如何代表国家的。\"——Pierre‑Joseph Proudhon"
 republican_flavor.8.a:0 "[SCOPE.sCharacter('forces_leader').GetFullName]会让法国变得伟大！"
 republican_flavor.8.b:0 "[SCOPE.sCharacter('industrialists_leader').GetFullName]将成为我们的总统！"
 republican_flavor.8.c:0 "[SCOPE.sCharacter('union_leader').GetFullName]将是一个公正的领导者！"
 republican_flavor.8.dd:0 "[SCOPE.sCharacter('landowners_leader').GetFullName]将恢复秩序和法律！"

 royalist_restauration.1.d1_louis_antoine:0 "虽然目前的政权存在重重困难，但正统派和波旁王朝却能够从迅速失去民意的政界对手中夺取权力。1830年革命中被废黜的查理十世之子[SCOPE.sCharacter('legitimist_ruler').GetFullName]，流亡归来并接受了法国王位。"
 royalist_restauration.1.d1_chambord:0 "虽然目前的政权存在重重困难，但正统派和波旁王朝却能够从迅速失去民意的政界对手中夺取权力。1830年革命中被废黜的查理十世的孙子[SCOPE.sCharacter('legitimist_ruler').GetFullName]，流亡归来并接受了法国王位。"


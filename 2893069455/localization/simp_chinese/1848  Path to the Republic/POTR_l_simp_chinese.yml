l_simp_chinese:
 POTR.1.t:0 "二月革命"
 POTR.1.d:0 "在基佐代议制政府禁止以宴会之名的政治会议之后，2月22日在巴黎，学生们开始了一场示威，然后与工人们在首都的街道上混战，\n示威者们高呼：“改革万岁！打倒基佐！打倒基佐！”\n政府未能找到妥协的办法，随后在嘉布遣大道上发生的一场枪击事件，使示威游行爆发成一场暴动，情况变得不可收拾。暴动者占领了巴黎，建立摄政，不过没多久就失败，国王路易·菲利普一世只得退位，随后阿方斯·德·拉马丁在市政厅宣布成立第二共和国。"
 POTR.1.f:0 "没有摄政，没有内阁，唯有共和！"
 POTR.1.a:0 "我们必须组织一个临时政府"
 POTR.2.t:0 "临时政府"
 POTR.2.d:0 "下午三时，共和国在巴黎市政厅宣布成立。一个临时政府成立了。所有伟大的共和派人物聚集在那里，如阿拉戈、马拉斯特、路易·安托万·加尼耶·帕热斯和亚历山大·奥古斯特·勒德吕·洛兰。对七月君主制不满的人如克雷米厄和拉马丁，以及渴望深入改革的激进分子如布朗、弗洛孔和马丁。"
 POTR.2.f:0 "\"这个临时政府的成员疲惫不堪，从早上开始就空着肚子，除了弹药、面包和士兵们留下的一点瑞士奶酪、一瓶酒和一桶水之外，他们没有东西可以吃和解渴。他们已经完成了第一次权力分配，并正在准备将某些部委分配给前反对派的其他成员。\" -伊娜丝·穆拉特"
 POTR.2.a:0 "共和国万岁！"
 POTR.3.t:0 "最初一步"
 POTR.3.d:0 "年轻的共和国必须挺身而出，横扫[concept_monarchie_de_Juillet]，通过推行男性普选权来取代基于税收的选举制度，全体法兰西人将投票选出一个新议会，它将反映出人民代表的形象。让我们放弃政治审查，颁布集会自由和新闻自由的法令，让改革之声得以解放吧！"
 POTR.3.f:0 "由于通过普选制，选民从25万跃升至900万，选民人口主要来自于农村地区。"
 POTR.3.a:0 "改革万岁！"
 POTR.3.b:0 "现在下令改革还为时过早……"
 POTR.4.t:0 "国家工场"
 POTR.4.d:0 "自[SCOPE.sCharacter('louis_blanc').GetFullName]被任命为临时政府的成员以来，就一直主张改善工人待遇。在他的指导下，卢森堡委员会提议设立国家工场，以此为首都的失业者提供工作。为了尊重这一普遍的劳动权，国家必须负责提供、组织并支付这项工作的费用。"
 POTR.4.f:0 "“只有人人各尽所能，各取所需，平等才会存在。” - 路易·勃朗"
 POTR.4.a:0 "人人有工作！"
 POTR.4.b:0 "我们承受不起这么高的开支。"
 POTR.5.t:0 "新制宪议会"
 POTR.5.d:0 "这是我国第一次普选，也将为我国制定一部新的共和宪法，赌注高昂！但这新一波农村选民态度尚且不定，不知他们是会相信共和，还是会被当地名流蛊惑？"
 POTR.5.f:0 "“当时每个人都想保住共和国，但有些人想用它进攻，有些人想用它自卫。” - 亚历克斯·德·托克维尔"
 POTR.5.a:0 "共和主义者占上风！"
 POTR.5.b:0 "君主主义者占上风！"
 POTR.5.c:0 "激进派占上风！"
 POTR.6.t:0 "行政委员会"
 POTR.6.d:0 "制宪会议中的多数温和派共和党刚刚重组了一个新政府，由五名成员组成，他们将共同地担任元首职务，不过最激进的成员如路易·布朗和阿尔贝则被赶下了台。"
 POTR.6.f:0 "阿方斯·德·拉马丁、亚历山大·奥古斯特·勒德吕-罗兰和路易-安托万·加尼耶-帕热斯仍然担任国家元首，但学者弗朗索瓦·阿拉戈脱颖而出成为新任总理。"
 POTR.6.a:0 "共和国万岁！"
 POTR.7.t:0 "5·15示威游行"
 POTR.7.d:0 "共和党人士在上次选举中的失败以及布兰克和阿尔伯特被驱逐出政府一事再次引发了民众示威。 示威者以法国不干预普鲁士人镇压波兰人为借口，闯入议会和市政厅，他们愤怒且情绪激动……"
 POTR.7.f:0 "共和联盟主义已经崩溃，国民警卫队成员与示威者剑拔弩张，人民代表受到威胁，委员会该怎么做？"
 POTR.7.a:0 "镇压示威活动，逮捕社会主义领导人。"
 POTR.7.b:0 "谨慎支持示威。"
 POTR.7.c:0 "国民议会必须解散，我们需要一个新政府!"
 POTR.8.t:0 "驱逐奥尔良派法令"
 POTR.8.d:0 "有了这个新共和议会，我们有权禁止奥尔良家族踏足共和国的领土。"
 POTR.8.f:0 "没有皇室成员，君主制支持者的呼声将在新共和议会中越来越弱。"
 POTR.8.a:0 "立法禁止奥尔良派踏入法国！"
 POTR.8.b:0 "禁止前摄政家族进入法国领土是不合理的。"
 POTR.9.t:0 "国家工场的未来"
 POTR.9.d:0 "国家工厂的成功恰恰也是其失败的根源。为了保证就业而设立的国家工厂掏空了国库，不得不为蜂拥而至的失业者安排工作"
 POTR.9.f:0 "店主，商人，甚至包括路人，巴黎的资产阶级对涌入首都的工人感到恐惧。"
 POTR.9.a:0 "就这样吧。"
 POTR.10.t:0 "巴黎工人六月起义 "
 POTR.10.d:0 "由于国家工场的关闭，首都各区爆发了示威游行，而且将马上演变为一场真正的起义！"
 POTR.10.f:0 "“这座城市被分割成了两大阵营，其分界线自城市的东北端起，从蒙马特一直延伸到圣丹尼门…这条线以东由工人占领和守卫；资产阶级则带着增援从西边进攻。” - 弗里德里希·恩格斯"
 POTR.10.a:0 "派出军队，我们必须消灭这些最后的社会主义者！"
 POTR.10.b:0 "叛军胜利了……"
 POTR.11.t:0 "共和国的救世主"
 POTR.11.d:0 "尽管路易-欧仁·卡芬雅克将军有些犹豫，但议会还是赋予了他结束六月叛乱的全部权力，议会希望把行政权力也交给他。"
 POTR.11.f:0 "“共和国是幸运的，她可以随意处置人民！” - 路易-菲利普一世"
 POTR.11.a:0 "卡芬雅克万岁！共和国万岁！"
 POTR.12.t:0 "选战开始！" 
 POTR.12.d:0 "选民被要求参加12月10日的选举，届时将决定年轻的共和国的新国家元首。"
 POTR.12.f:0 "“600万票选出的代表遵循人民的意愿，他没有背叛人民。” ——路易-拿破仑·波拿巴"
 POTR.12.a:0 "候选人们开始为自己造势。"
 POTR.13.t:0 "共和主义者走向何方？"
 POTR.13.d:0 "共和主义者们在6月的事件之后决裂了，温和派、激进派、\"明日\"派和\"余波\"派共和主义者对未来的道路犹豫不决。"
 POTR.13.f:0 "“从现在开始，选票必须取代步枪。”——路易斯·玛丽·博斯勒东"
 POTR.13.a:0 "共和主义者们分为温和派和激进派。"
 POTR.13.b:0 "建立一个共和同盟以对抗保守主义者。"
 POTR.14.t:0 "普瓦捷街委员会"
 POTR.14.d:0 "包括奥尔良主义者和正统主义者在内的保守派集合体想知道议会的保守派要遵循什么目标。"
 POTR.14.f:0 "“最重要的是，不要害怕人民，他们比你更保守。\" - 路易-拿破仑-波拿巴"
 POTR.14.a:0 "保守政策，但是共和国。"
 POTR.14.b:0 "君主制复辟从结束选举开始。"
 POTR.15.t:0 "哪个候选人适合温和派共和主义者？"
 POTR.15.d:0 "Cavaignac的名字被每个人传颂，这个位置对他来说“当之无愧”，但由于他在六月起义期间的暴力行为，他仍然不受欢迎。"
 POTR.15.f:0 "将军的支持者声称没有其他候选人可以拥有Cavaignanc的优点，不信你问问其他人“Le ministe Dufaure？Lamoricière？”"
 POTR.15.a:0 "卡芬雅克将军"
 POTR.15.b:0 "朱尔·杜弗尔"
 POTR.15.c:0 "拉莫里西埃将军"
 POTR.16.t:0 "共和同盟需要哪位候选人？”"
 POTR.16.f:0 "“世界与我们同在，我们希望生活在在兄弟情谊与和平之中。”- Alphonse de Lamartine"
 POTR.16.a:0 "阿方斯·德·拉马丁"
 POTR.16.b:0 "亚历山大·勒德吕-洛兰"
 POTR.16.c:0 "路易-安托万·加尼耶-帕热斯"
 POTR.16.d:0 "阿尔曼德·马拉斯特"
 POTR.16.e:0 "弗朗索瓦·阿拉戈"
 POTR.17.t:0 "民主社会主义运动"
 POTR.17.d:0 "我们欠勒德吕-洛兰普选权，他提出了有前途的社会改革！他必然代表真正的共和主义潮流！"
 POTR.17.f:0 "“我必须紧跟他们，因为我是他们的领袖。” - 亚历山大·勒德吕-洛兰"
 POTR.17.a:0 "勒德吕-洛兰正在路上"
 POTR.18.t:0 "哪位候选人是波拿巴派的？"
 POTR.18.d:0 "前法国皇帝的侄子路易斯-拿破仑王子非常引人注目，特别是在农村中他很受欢迎。但我们是否应该冒另一次雾月政变的险？"
 POTR.18.f:0 "“所以让我们建立共和国，一个诚实、明智、保守的共和国。” ——阿道夫·梯也尔"
 POTR.18.a:0 "路易-拿破仑·波拿巴亲王"
 POTR.18.b:0 "阿道夫·梯也尔"
 POTR.18.c:0 "夏尔·德·雷米萨"
 POTR.19.t:0 "哪位候选人是正统派的?"
 POTR.19.d:0 "保守主义者背弃了奥尔良家族，宁愿利用共和国达到自己的目的。 我们需要为我们的运动找到一个新领袖！"
 POTR.19.f:0 "已经有很多人被提名，比如比若元帅，甚至还有路易-菲利普之子德·茹安维尔亲王，但我们仍在犹豫要不要找到一个更能在选举时产生影响的名字。"
 POTR.19.a:0 "尚加尔涅将军"
 POTR.19.b:0 "费利克斯·杜潘卢，奥尔良大主教"
 POTR.19.c:0 "法鲁伯爵"
 POTR.20.t:0 "哪位候选人是保守派的?"
 POTR.20.d:0 "多亏了我们的保守同盟，我们可以宣布一个统一的候选人，这个人让大多数君主主义者满意。"
 POTR.20.f:0 "“你不关心政治，政治就来关心你。”——查尔斯·德·蒙塔朗贝尔"
 POTR.20.a:0 "茹安维尔亲王，弗朗索瓦·奥尔良"
 POTR.20.b:0 "查尔斯·德·蒙塔朗贝尔"
 POTR.20.c:0 "尚加尔涅将军"
 POTR.21.t:0 "拉马丁的错觉？"
 POTR.21.d:0 "尽管这位诗人自1848年的六月起义以来已经失去了很多声望，但他希望为自己的政治计划获取支持。"
 POTR.21.f:0 "“我建立了共和国的狂热和双倍热忱并拯救了秩序。” - 阿方斯·德·拉马丁"
 POTR.21.a:0 "这是个人的牺牲，为了共和国。"
 POTR.22.t:0 "哪位候选人是社会主义者？"
 POTR.22.d:0 "革命的激进派已经奄奄一息，其领导人在1848 年5月和6月接连被捕，使得该运动日薄西山。"
 POTR.22.f:0 "“我投票反对宪法，因为这就是宪法。”——皮埃尔-约瑟夫·蒲鲁东"
 POTR.22.a:0 "弗朗索瓦-樊尚·拉斯帕伊"
 POTR.22.b:0 "奥古斯特·布朗基"
 POTR.22.c:0 "皮埃尔-约瑟夫·蒲鲁东"
 POTR.23.t:0 "法兰西应该选择哪种共和国？"
 POTR.23.d:0 "应该由一个人独裁吗？ 还是议会制？"
 POTR.23.f:0 "人们依然记得革命政府的过度行为。"
 POTR.23.a:0 "一个总统制共和国，美国那种。"
 POTR.23.b:0 "一个一院制的议会共和国，将行政权委托给由议会任命的政府。\""
 POTR.24.t:0 "45生丁附加税"
 POTR.24.d:0 "更多税收"
 POTR.24.f:0 "但是，再见加尼耶-帕热斯"
 POTR.24.a:0 "好"
 POTR.24.b:0 "不"
 POTR.25.t:0 "君主制革命"
 POTR.25.d:0 "普选的结果对它的发起者严重不利，仍然倾向于君主制的农村刚刚在恢复君主制方面占据了多数！"
 POTR.25.f:0 "新的临时政府宣布恢复君主制，复辟奥尔良王朝！"
 POTR.25.a:0 "国王万岁！"
 POTR.26.t:0 "法兰西应该选择哪谁做国王？"
 POTR.26.d:0 "巴黎伯爵是合法继承人，但国王路易·菲利普一世的三个儿子的王位宣称使这位年轻的王子黯然失色。"
 POTR.26.f:0 "我们需要一位能够将法兰西人民团结起来并终结这场痛苦革命的国王。"
 POTR.26.a:0 "巴黎伯爵，菲利普·奥尔良"
 POTR.26.b:0 "茹安维尔亲王，弗朗索瓦·德·奥尔良"
 POTR.26.c:0 "奥马勒公爵，亨利·德·奥尔良"
 POTR.26.e:0 "内穆尔公爵，路易·德·奥尔良"
 POTR.27.t:0 "第三次复辟"
 POTR.27.d:0 "法兰西刚刚经历了一段动荡时期，但共和运动的党派分歧从内部摧毁了这个年轻的共和国。"
 POTR.27.f:0 "[SCOPE.sCharacter('french_king').GetFullName] 向前来庆祝他从流放地归来的人群致意，随行的还有前来复职的政治家们。\"君主制是唯一持久的权力形式\"，他们向媒体这样高呼。"
 POTR.27.a:0 "国王万岁！法兰西万岁！"
 POTR.28.t:0 "激进浪潮"
 POTR.28.d:0 "议会变红了，所有激进的革命政治家都被选举出来了，保皇派被扫地出门了！"
 POTR.28.f:0 "路易斯·白朗、亚历山大·马丁、巴尔贝斯、路易·奥古斯特·布朗基以及拉法思l现在组建并担任由制宪会议任命的新执行委员会。"
 POTR.28.a:0 "改革万岁！法兰西万岁！"
 POTR.29.t:0 "红旗"
 POTR.29.d:0 "这是临时政府激进分子的首要要求之一，但被拉马丁拒绝了。"
 POTR.29.f:0 "这红旗我是永远不会采用的。因为三色旗已载着帝国漂洋过海，载着共和周游列国，一路带着你们的自由、你们的荣耀。而红旗呢？它只在战神广场巡游过，一路拖着人民的鲜血。”——阿方斯·德·拉马丁 "
 POTR.29.a:0 "法兰西将成为欧洲工人运动的灯塔！"
 POTR.29.b:0 "三色旗是大革命的象征！ 来自拉斐特！ 联邦日！ 我们必须保留三色旗！"
 POTR.30.t:0 "新生的共和国"
 POTR.30.d:0 "现在行政委员会已经为法兰西草拟了一部新宪法，我们已经准备好让共和国永存于世！"
 POTR.30.f:0 "新共和国将以一个单一议会为基础，这个议会将从其成员中选出一个由总统领导的内阁，总统可由议会自由罢免，但总统被授予行政权。"
 POTR.30.a:0 "共和国万岁！"
 POTR.31.t:0 "总理"
 POTR.31.d:0 "议会中的紧张局势显而易见，任命新委员会主席的第一轮投票已经开始。 数位候选人脱颖而出。"
 POTR.31.f:0 "他们是大革命中社会改革的发起者，是催生法国激进共和运动的伟人。"
 POTR.31.a:0 "路易·勃朗"
 POTR.31.b:0 "阿尔曼德·巴尔贝"
 POTR.31.c:0 "奥古斯特·布朗基"
 POTR.31.e:0 "拉斯帕伊"
 POTR.31.g:0 "蒲鲁东"
 POTR.31.h:0 "亚历山大·马丁"
 POTR.32.t:0 "共和国万岁！"
 POTR.32.d:0 "第二共和国庆祝其正式立法成立，新总理 [SCOPE.sCharacter('sec_ruler').GetFullName] 现在对法兰西负责。"
 POTR.32.f:0 "欧洲列强以消极的眼光看待第二共和国诞生，担心这个年轻的共和国会传播其革命思想，就像第一共和国在1789年之后那样。"
 POTR.32.a:0 "法兰西万岁！[SCOPE.sCharacter('sec_ruler').GetFullName]万岁！"
 POTR.33.t:0 "叛军政府"
 POTR.33.d:0 "激进分子已经掌权以拯救共和国于水火之中，现在是清洗反共和分子的时候了。"
 POTR.33.f:0 "我们不能相信共和主义温和派，“明天”的共和主义者，伪装的君主主义者，我们需要一个真正的社会共和国，由国内最热情的演说家领导！"
 POTR.33.a:0 "打倒叛徒！ 改革万岁！"
 POTR.100.t:0 "总统大选"

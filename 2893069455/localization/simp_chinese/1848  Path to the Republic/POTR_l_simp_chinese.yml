 ending.1.t:0 "路易·拿破仑·波拿巴当选"
 ending.1.d:0 "[SCOPE.sCharacter('napoleon').GetFullName]由全体男性公民普选当选法兰西共和国的新总统。"
 ending.1.f:0 "选一个波拿巴家族的人合理吗？"
 ending.1.a:0 "共和国万岁！波拿巴万岁！"
 ending.2.t:0 "胜利秩序党"
 ending.2.d:0 "[SCOPE.sCharacter('order_ruller').GetFullName]由全体男性公民普选当选法兰西共和国的新总统。"
 ending.2.f:0 "保守的风暴席卷法兰西"
 ending.2.a:0 "法兰西万岁！[SCOPE.sCharacter('order_ruller').GetFullName]万岁！"
 ending.3.t:0 "温和共和主义者的胜利"
 ending.3.d:0 "[SCOPE.sCharacter('republican_mod_ruler').GetFullName]由全体男性公民普选为法兰西共和国的新总统。"
 ending.3.f:0 "共和主义者终于能够在这个新共和国内延续他们的影响力。"
 ending.3.a:0 "共和国万岁！[SCOPE.sCharacter('republican_mod_ruler').GetFullName]万岁！"
 ending.4.t:0 "民主社会主义者胜利"
 ending.4.d:0 "[SCOPE.sCharacter('demo_soc_ruler').GetFullName]由全体男性公民普选当选法兰西共和国的新总统。"
 ending.4.f:0 "是时候进行新的社会改革了！"
 ending.4.a:0 "共和国万岁！[SCOPE.sCharacter('demo_soc_ruler').GetFullName]万岁！"
 ending.5.t:0 "拉马丁的胜利"
 ending.5.d:0 "[SCOPE.sCharacter('lamartine_ruler').GetFullName]由全体男性公民普选当选法兰西共和国的新总统。"
 ending.5.f:0 "九个月前成立共和国的人被选出了。"
 ending.5.a:0 "共和国万岁！拉马丁万岁！"
 ending.6.t:0 "社会主义者的胜利"
 ending.6.d:0 "[SCOPE.sCharacter('soc_ruler').GetFullName]由全体男性公民普选当选法兰西共和国的新总统。"
 ending.6.f:0 "即使被捕入狱，我们也能如闪电般归来！"
 ending.6.a:0 "共和国万岁！[SCOPE.sCharacter('soc_ruler').GetFullName]万岁！"
 ending.7.t:0 "正统派的胜利"
 ending.7.d:0 "[SCOPE.sCharacter('monarchist_ruler').GetFullName]由全体男性公民普选当选法兰西共和国的新总统。"
 ending.7.f:0 "君主主义保守派的这一巨大胜利可能会导致奥尔良家族迅速复辟，但是新君主的人选仍然不确定..."
 ending.7.a:0 "国王万岁！[SCOPE.sCharacter('monarchist_ruler').GetFullName]万岁！"
 ending.8.t:0 "共和同盟胜利"
 ending.8.d:0 "[SCOPE.sCharacter('republican_ruler').GetFullName]由全体男性公民普选当选法兰西共和国的新总统。"
 ending.8.f:0 "共和国安全了，人民团结在三色旗下!"
 ending.8.a:0 "共和国万岁！[SCOPE.sCharacter('republican_ruler').GetFullName]万岁！"
je_motin_la_granja_esp: "军士兵变"
je_motin_la_granja_esp_reason: "塞哥维亚王宫的动荡不过是外界骚乱的映射。#bold 皇家卫队#! 内部的紧张情绪日益增长，充满不安的氛围使得局势变得愈发难以预测，任何微小的动摇都可能引发难以估量的连锁反应。\n\n#bold 皇家卫队#! 的 [GetPopType('officers').GetName] 处于一个微妙的位置，他们必须在对君主的忠诚和对民众诉求的同情之间找到平衡。这一责任落在他们肩上，他们深知国家的未来或许取决于他们的决定。"
je_motin_la_granja_esp_tt: "‘$junta_provincial$’ 的数量将决定 #bold 皇家卫队#! 中 [GetPopType('officers').GetName] 可能发生兵变的几率 #!\n\n@warning! 如果 [concept_turmoil|l] 在 [SCOPE.sState('palacio_real').GetName] 达到 #bold 5.00%#!，则兵变的可能性将进一步提高。"
je_motin_la_granja_esp_tt1: "#bold 制宪法院#! 将被宣布，以改革加的斯宪法文本，直至 $forced_regime_change$ 结束。"

je_independencia_rep_dominicana_hai: "多米尼加问题"
je_independencia_rep_dominicana_hai_reason: "在再次失去独立并被西班牙占领后，[SCOPE.sState('santo_domingo_scope').GetName] 仍然有许多人梦想建立一个 #bold 西班牙裔#! 的国家。在阴影之中，秘密组织 #bold '三位一体社'#! 的领导人一直在密谋反抗 [ROOT.GetCountry.GetAdjective] 政府。"
je_independencia_rep_dominicana_hai_tt: "#bold 圣多明各#! 已从 [ROOT.GetCountry.GetName] [Concept('concept_secession','脱离')]"
je_independencia_rep_dominicana_hai_tt1: "它属于 [concept_culture|l] [GetCulture('caribeno').GetName]"
je_independencia_rep_dominicana_hai_tt1_NOT: "#bold 否#!，它不属于 [concept_culture|l] [GetCulture('caribeno').GetName]"
tiene_igual_o_mas_apoyo_cultura: "[concept_culture|l] [GetCulture('caribeno').GetName] 内的 [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')|l] 大于或等于 #variable 25%#!"

je_independencia_puerto_rico_hai: "波多黎各独立运动"
je_independencia_puerto_rico_hai_reason: "几个世纪以来，[SCOPE.sState('puerto_rico_scope').GetName] 从未有过独立运动。然而，由于我们对 [SCOPE.sState('puerto_rico_scope').GetName] 岛屿的管理不善，许多声音如今呼吁 [ROOT.GetCountry.GetName] 的 [concept_secession|l]。"
je_independencia_puerto_rico_hai_tt: "#bold 波多黎各#! 已从 [ROOT.GetCountry.GetName] [Concept('concept_secession','脱离')]"

je_reconquista_rep_dominicana_esp: "伊斯帕尼奥拉岛的再征服"
je_reconquista_rep_dominicana_esp_reason: "收复伊斯帕尼奥拉岛的机会终于到来了。#bold 北美#! 的近期不稳定局势使其国家无法作出强有力的回应，因此我们应该能够顺利从 [SCOPE.sCountry('ocupador_santo_domingo').GetName] 手中夺回 [SCOPE.sState('santo_domingo_scope').GetName]。\n\n@information! 如果 [Concept('concept_country','圣多明各')] 存在，我们可以和平地将其整合。"
je_reconquista_rep_dominicana_esp_tt: "它位于 #bold 北美#!"

je_regencia_esp: "[ROOT.GetCountry.GetRuler.GetFirstName] 摄政"
je_regencia_esp_reason: "在#bold 费尔南多七世#!于1833年去世之前，他在[ROOT.GetCountry.GetName]恢复了#bold 《王位继承法》#!，允许他年仅2岁的女儿[ROOT.GetCountry.GetHeir.GetFirstName]继承王位，而不是他的兄弟#bold 卡洛斯·玛丽亚·伊西德罗#!。\n\n年轻的[ROOT.GetCountry.GetHeir.GetFirstName]目前只有#variable [ROOT.GetCountry.GetHeir.GetAge]#! 岁，因此[ROOT.GetCountry.GetRuler.GetFullName]作为[Concept('concept_ruler', ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle)|l]承担起摄政的责任，直到[ROOT.GetCountry.GetHeir.GetFirstName]被认为具备统治国家的能力。"

je_regencia_esp_indicacion1: "[ROOT.GetCountry.GetHeir.GetFirstName]年满 #bold 16#! 岁"
je_regencia_esp_indicacion2: "[ROOT.GetCountry.GetHeir.GetFirstName]将通过法令加冕为 [Concept('concept_ruler','女王')]"

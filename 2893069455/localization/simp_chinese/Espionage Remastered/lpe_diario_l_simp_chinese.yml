je_caristras_latentes_esp: "潜在的卡洛斯主义运动"
je_caristras_latentes_esp_reason: "#italic '被打倒，但未被毁灭' - 哥林多后书 4:8-9#!\n\n尽管卡洛斯派在第一次冲突中失败，他们的追随者仍然坚持卡洛斯派候选人的王位合法性。卡洛斯主义的影响力经久不衰，并不断寻找新的表达方式和组织形态。迟早，卡洛斯派可能会再次成为[ROOT.GetCountry.GetAdjective]政治舞台上的重要势力。\n\n如果#tooltippable #tooltip:[GetPlayer.GetTooltipTag],situacion_calmada_norte_tooltip 平息北方局势#!#!，[concept_journal_entry|l]（日志条目）将被取消。\n卡洛斯派重新组织的风险取决于[concept_government|l]（政府）的[concept_legitimacy|l]（合法性）水平。"
situacion_calmada_norte_tooltip: "当没有任何条件导致#bold 失败#![concept_journal_entry|l]（日志条目）时，将被视为局势平息"

je_caristras_latentes_esp_tt6: "[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName|l]（地主阶级）、[GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName|l]（农村民众）或[GetInterestGroupVariant('ig_devout',GetPlayer).GetName|l]（虔诚信徒）的[concept_clout|l]（影响力）在[concept_state|l]（州）内大于或等于 #v 15.00%#!"


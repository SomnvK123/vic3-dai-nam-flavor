je_incorporacion_republica_dominicana_esp: "圣多明各的重新并入"
je_incorporacion_republica_dominicana_esp_reason: "在拿破仑战争期间，法国曾占领该岛，[SCOPE.sCountry('ocupador_santo_domingo').GetName]最终于1821年从[ROOT.GetCountry.GetName]独立，但次年又被海地占领。\n\n经过漫长斗争，[SCOPE.sCountry('ocupador_santo_domingo').GetAdjective]人民终于赢得了期待已久的独立。然而，他们仍是一个年轻的国家，因刚获得独立而孱弱，我们可以利用[SCOPE.sCountry('provincia_caribe_scope').GetName]的影响力，将他们重新纳入我们的势力范围。\n\n@information! 如果满足以下条件，[SCOPE.sCountry('ocupador_santo_domingo').GetName]可能会提出重新并入的建议：\n  $EFFECT_LIST_BULLET$[SCOPE.sCountry('ocupador_santo_domingo').GetName]的[Concept('concept_ruler', '$RULER_TITLE_PRESIDENT$')|l]（总统）属于[concept_interest_group|l]（利益集团）并在[concept_government|l]（政府）中担任成员，同时作为亲[ROOT.GetCountry.GetName]的@lobby_pro_country!（政治游说）的一员，其[concept_political_lobby_appeasement|l]（游说安抚度）大于等于 #bold #green +5#!#!\n  $EFFECT_LIST_BULLET$[SCOPE.sCountry('ocupador_santo_domingo').GetName]已经通过[concept_law|l]（法律）[GetLawType('law_presidential_republic').GetName] \n  $EFFECT_LIST_BULLET$$anexion_rep_dominicana_tt$\n\n 提高提议通过率的方法：\n   $EFFECT_LIST_BULLET$[SCOPE.sCountry('ocupador_santo_domingo').GetName]对我们的[concept_attitude|l]（态度）为$ai_attitude_genial$（亲密）或$ai_attitude_cooperative$（合作）。如果敌对，则几率降低。\n  $EFFECT_LIST_BULLET$[SCOPE.sCountry('ocupador_santo_domingo').GetName]对其他[concept_country|l]（国家）的[concept_attitude|l]（态度）为$ai_attitude_wary$（警惕）或$ai_attitude_antagonistic$（敌对）。"
je_incorporacion_republica_dominicana_esp_tt: "[SCOPE.sCountry('ocupador_santo_domingo').GetName]不再是一个[concept_country|l]（独立国家）"

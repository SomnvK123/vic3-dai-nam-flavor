je_desamortizacion_iglesia_esp_reason: "[ROOT.GetCountry.GetName] 许多土地被 [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] 闲置未用。\n\n国务委员会主席 #bold 门迪萨瓦尔（Mendizábal）#! 提出了一项大规模征用这些资产并在公开拍卖会上转售的计划。这不仅可以让这些土地投入生产，还能为应对卡洛斯派（Carlist）势力提供额外的财政收入。\n\n[concept_law|l] 目前正处于 [Concept('concept_enactment_of_laws','法律制定')] 过程中。如果我们想避免 [Concept('concept_credit', '$concept_credit_debt$')|l] 过度增加，就必须尽快推进这项法律。"

je_republicanismo_esp_reason: "过去，[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]甚至不会考虑在[ROOT.GetCountry.GetName]建立共和国。他们曾认为君主制与『[ROOT.GetCountry.GetAdjective]传统价值观』密不可分——直到铁路网撕裂了封建庄园的边界，工厂烟囱遮蔽了教堂尖顶，而《[GetEventWindowTitle('journal_entry_liberal_pamphlets')]》的油墨染红了整个知识界。如今，[ROOT.GetCountry.GetName] 的咖啡厅里充斥着对美利坚第十三修正案的解读，巴黎公社的旗帜被绣在大学生外套内衬，甚至[ROOT.GetCountry.GetCapital.GetCapitalName]的煤气灯下都能听到这样的耳语：『如果连[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]都能接受谷物法改革，为何不能把王冠也扔进熔炉？』这场即将引爆的辩论，实质是电报线路与血统谱系的对决。"

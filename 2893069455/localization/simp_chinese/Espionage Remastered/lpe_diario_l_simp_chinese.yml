je_trinitaria_hai: "三位一体社"
je_trinitaria_hai_reason: "#bold 三位一体社#! 由胡安·巴勃罗·杜阿尔特及其他 [concept_culture|l] [SCOPE.sCulture('caribenno_scope').GetName] 思想家创建，目的是采取行动，使 [SCOPE.sState('santo_domingo_scope').GetName] 脱离 [ROOT.GetCountry.GetAdjective] 统治，实现独立。\n\n#bold 三位一体社#! 这一名称是为了向圣三一（圣父、圣子和圣灵）致敬。\n\n@information! 若 #bold 三位一体社#! 需要吸引或激进化更多成员，他们至少需要获得 #variable 5%#! 的 [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')|l]。此外，如果其 [Concept('concept_activism', '$concept_activism_short$')|l] 超过 #variable 50%#!，他们将开始进行破坏活动。\n\n@information! 根据 [concept_culture|l] [SCOPE.sCulture('caribenno_scope').GetName] 的 [Concept('concept_radical', '$concept_radicalism$')|l] 水平，可能会有更多 [Concept('concept_agitator', '$concept_agitators$')|l] 出现以支持该运动。"


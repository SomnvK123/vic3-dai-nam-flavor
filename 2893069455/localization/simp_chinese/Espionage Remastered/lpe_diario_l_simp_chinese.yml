je_rearme_naval_esp_reason: "[ROOT.GetCountry.GetName] 在 #bold 特拉法加海战#! 中惨败于 [concept_admiral|l] #bold 霍雷肖·纳尔逊#! 之后，彻底失去了海上霸权，随后又在西属美洲独立战争中遭受沉重打击。西班牙独立战争，以及接下来的四十年间持续的政治动荡，阻碍了海军重建的任何尝试。\n\n随着新海上强国 [SCOPE.sCountry('enemigo_naval').GetName] 的崛起，我们的海军部长要求 [concept_government|l] 启动海军扩张计划，以保护海外领土免受外国势力的侵害。"

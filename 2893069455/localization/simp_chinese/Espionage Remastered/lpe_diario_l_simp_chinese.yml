l_simp_chinese:
je_deuda_esp: "债务状况"
je_deuda_esp_reason: "19世纪30年代，[ROOT.GetCountry.GetName] 面临复杂的经济和财政困境，政治动荡、机构薄弱以及债务累积成为突出问题。\n\n在此期间，西班牙的公共 [Concept('concept_credit', '$concept_credit_debt$')|l] 成为一大难题，影响了国家经济发展，并损害了其国际信用声誉。\n\n财政管理混乱，而政治局势的不稳定使得制定连贯的财政政策变得困难，进一步推动了公共 [Concept('concept_credit', '$concept_credit_debt$')|l] 的增长。\n\n债务规模往往超出政府偿付利息和减少本金的能力，导致政府不得不通过不断借新债来偿还旧债，形成恶性循环，使 [Concept('concept_credit', '$concept_credit_debt$')|l] 问题进一步恶化。"
je_deuda_esp_tt: "进度条 #variable $je_deuda_esp_bar$#! 已达到 #variable 100%#!！"

pago_deuda_but_name: "按期偿还债务"
pago_deuda_but_desc: "我们需要推行良好的财政政策，加快债务偿还进程。"
pago_deuda_but_tt: "每次按期支付债务，我们将在 #variable $je_deuda_esp_bar$#! 的进度条上增加 #bold 2 点#!"
stop_pago_deuda_but_name: "暂停偿还债务"
stop_pago_deuda_but_tt: "我们将在 #variable $je_deuda_esp_bar$#! 的进度条上减少 #bold 16 点#!"
stop_pago_deuda_but_desc: "国家再次需要现金流。"

je_infraestructura_esp: "陆上交通网络"
je_infraestructura_esp_reason: "19世纪，[ROOT.GetCountry.GetName] 由于缺乏完善的基础设施网络，严重影响了国家工业化进程和经济发展。基础设施的缺失限制了人员与货物的流通，阻碍了贸易和工业化，进而对当时的经济增长和国家发展造成了负面影响。"
je_infraestructura_esp_tt: "没有 [Concept('concept_state', '$concept_state$')|l] 存在基础设施赤字。"
je_infraestructura_esp_tt_1: "[GetGoods('transportation').GetName] 的 #bold 当地#! [concept_market_price|l] 不高于其 [concept_base_price|l] #bold #red +20.00%#!"

je_falta_capital_esp: "资本短缺"
je_falta_capital_esp_reason: "资本短缺是阻碍经济发展和投资的重要因素。金融资源的匮乏限制了国家进行基础设施建设和工业发展项目的能力。这种情况由多种因素造成，包括因战争累积的公共债务、依赖农业经济的结构性问题，以及国内外投资者对西班牙经济缺乏信心。\n\n资本短缺对关键行业的投资造成不利影响，阻碍了工业现代化和经济增长的推进。"
je_falta_capital_esp_goal: "在接下来的 #v 1 年#! 内"

leyes_anticapitalismo_tooltip: "#tooltip_header 放弃资本主义的 [Concept('concept_law', '$concept_laws$')|l] 法律包括：#!\n$TOOLTIP_DELIMITER$\n[GetLawType('law_command_economy').GetName]、[GetLawType('law_cooperative_ownership').GetName] 或 [GetLawType('law_industry_banned').GetName]。"

je_medizabal_esp: "门迪萨瓦尔的任命"
je_medizabal_esp_reason: "[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetLeader.GetFullName] 于1835年9月1日从流亡地返回 [ROOT.GetCountry.GetName]，当时的新首相 #bold 何塞·玛丽亚·奎波·德·利亚诺#! 任命他为‘财政部长’，因为 [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetLeader.GetLastName] 承诺为卡洛斯战争筹集资金。\n\n然而，当他回到 [ROOT.GetCountry.GetName] 时，正值“委员会革命”——一场自由主义和反教权主义的风暴席卷全国。为了利用这一局势，[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetLeader.GetLastName] 发表了一份宣言，质疑托雷诺伯爵 #bold 何塞·玛丽亚·奎波·德·利亚诺#! 的权威，最终迫使他屈服。9月14日，[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetLeader.GetLastName] 正式出任政府首脑。"
je_medizabal_esp_tt: "移除 [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] 出 [concept_government|l] 将不再有负面影响。"
je_medizabal_esp_tt1: "#bold 何塞·玛丽亚·卡拉特拉瓦#!，一名 [GetIdeology('ideology_progresista').GetName|l]，将成为 [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l] 的新 [concept_leader|l]。"
je_medizabal_esp_tt2: "#bold 弗朗西斯科·马丁内斯·德·拉·罗萨#! 将成为 [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] 的 [concept_leader|l]。"
je_medizabal_esp_tt3: "如果 #bold 胡安·门迪萨瓦尔#! 已被其他 [concept_character|l] 取代，他将重新以 [concept_agitator|l] 的身份出现。"
je_medizabal_esp_tt4: "#bold 何塞·玛丽亚·卡拉特拉瓦#!，一名 [GetIdeology('ideology_progresista').GetName|l]，将作为 [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l] 的 [concept_agitator|l] 出现。"
je_medizabal_esp_tt5: "[concept_ruler|l] #bold 不再#! 属于 [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l]。"

je_la_granja_esp: "拉格兰哈起义"
je_la_granja_esp_reason: "在门迪萨瓦尔被罢免后，我国的自由主义者群体走上街头，要求进行紧急改革，并恢复 #bold 1812年宪法#!。\n\n与此同时，#bold 门迪萨瓦尔#! 并未放弃政治斗争，而是加强了在新闻界的影响，并支持秘密社团策划一场类似去年夏天的革命运动。\n\n#bold @warning! 如果我们 [Concept('concept_exile', '流放')] 任何具有‘来自其联系人支持’ [concept_modifier|l] 的 [concept_agitator|l]，他们很可能会再度归来。"
je_la_granja_esp_tt: "在接下来的 #bold 20 年#! 内，[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l] 产生 [Concept('concept_leader', '$concept_leaders$')|l] [GetIdeology('ideology_progresista').GetName|l] 的可能性将提高。"
je_la_granja_esp_tt1: "[Concept('concept_modifier', '$concept_modifiers$')|l] ‘$junta_provincial$’ 修正将被移除。"
je_la_granja_esp_tt2: "玛丽亚·克里斯蒂娜不再担任摄政女王。"
je_la_granja_esp_tt3: "自由派报刊将被解散。"
je_la_granja_esp_tt4: "#bold 埃瓦里斯托·佩雷斯·德·卡斯特罗#!，一名 [GetIdeology('ideology_moderado').GetName|l]，将成为 [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l] 的新 [concept_leader|l]。"

je_la_granja_esp_tooltip: "[GetIdeology('ideology_progresista').GetName]、[GetIdeology('ideology_republican_leader').GetName] 或 [GetIdeology('ideology_radical').GetName]"
je_la_granja_esp_tt5: "如果 [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName|l] 的 [concept_leader|l] #tooltippable #tooltip:[GetPlayer.GetTooltipTag],je_la_granja_esp_tooltip radical#!#!，则 $je_la_granja_esp_tt4$。"
caza_liberales_but_name: "审查自由派新闻"
caza_liberales_but_desc: "我们不能再以这种速度前进了。国家的权威正在被削弱。"

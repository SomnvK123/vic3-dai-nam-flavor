l_simp_chinese:
desamoritzacion_medizabal: "门迪萨瓦尔的去圣化改革"
desamoritzacion_medizabal_desc: "国库的状况并不理想，但如果我们征用教会财产并将其拍卖给小资产阶级，就能获得一笔额外的收入。"
desamoritzacion_medizabal_tt: "#bold 门迪萨瓦尔#! 是他们的 [concept_leader|l]"
desamoritzacion_medizabal_tt1: "#bold 埃斯帕特罗#! 是他们的 [concept_leader|l]"
desamoritzacion_medizabal_tt2: "如果 [GetInterestGroupVariant('ig_devout',GetPlayer).GetName|l] 依然保持 [concept_powerful|l]，他们将利用自身影响力操纵拍卖，避免失去过多势力，而 [GetPopType('aristocrats').GetName]、[GetPopType('shopkeepers').GetName] 和 [GetPopType('farmers').GetName] 将无法投资购买这些财产。"

acabar_descontento_dominicano: "平息多米尼加的不满"
acabar_descontento_dominicano_desc: "通过与当地一些小型合作者合作，我们可以增加多米尼加人民对我们的接受度。"

quitar_bandoleros_andalucia: "铲除安达卢西亚的匪患"
quitar_bandoleros_andalucia_desc: "我们必须清除盘踞在西班牙古老土地上的匪徒和亡命之徒。"

ambiciones_en_guinea: "在几内亚确立主权"
ambiciones_en_guinea_desc: "随着我们对费尔南多波岛的牢固掌控，我们已经敞开了踏足几内亚大陆的门户。我们必须要求其他国家承认我们的主权。"
ambiciones_en_guinea_info: "一场会议即将召开，#tooltippable #tooltip:[GetPlayer.GetTooltipTag],participating_powers_some#!#! [Concept('concept_great_power', '$concept_great_powers$')|l] 将决定 [ROOT.GetCountry.GetName] 是否有资格拥有 #bold 西属几内亚#!。如果会议认可，你将能向占据该地的 [Concept('concept_country', '$concept_countries$')|l] 发出最后通牒。如果 [ROOT.GetCountry.GetName] 是 [concept_great_power|l]，它会支持自身的主张。如果几内亚被 [Concept('concept_decentralized_nation', '$concept_decentralized_nations$')|l] 占据，你可以直接将其收归国有。"
ambiciones_en_guinea_info2: "确保 #tooltippable #tooltip:[GetPlayer.GetTooltipTag],participating_powers_some#!#! 的 [Concept('concept_great_power', '$concept_great_powers$')|l] 对你持有良好的 [concept_attitude|l] 并且与你保持良好的 [concept_relations|l]。此外，[Concept('concept_political_lobby', '$concept_political_lobbies_short$')|l] 也会对决策产生影响，特别是当它们身处 [concept_government|l] 时。你必须在 #bold 10年#! 内占领 #bold 西属几内亚#!。"

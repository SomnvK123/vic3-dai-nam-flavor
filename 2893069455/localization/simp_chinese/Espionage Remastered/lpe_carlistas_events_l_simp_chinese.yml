l_simp_chinese:
car.1.t: "南方远征"
car.1.d: "[SCOPE.sCharacter('gomez_damas').GetFullName] 发起了一场穿越半岛的行军，旨在转移克里斯蒂诺部队的注意力，并集结兵力支持大义。他目前在 [SCOPE.sState('estado_expedicion_gomez').GetName]"
car.1.f: "这次远征发生在国家北部，目的是向南推进，支援 [SCOPE.sCountry('spa_car').GetAdjective|l] 部队。\n远征于1836年8月开始，取得了一些初步成功，推进了拉里奥哈和纳瓦拉地区，并成功招募了新支持者加入 [SCOPE.sCountry('spa_car').GetAdjective|l] 大义。阿兰苏埃克的失败对 [SCOPE.sCountry('spa_car').GetAdjective|l] 大义以及 [SCOPE.sCharacter('gomez_damas').GetLastName] 向南推进的希望是一次重大打击。败北后，远征队解散， [SCOPE.sCharacter('gomez_damas').GetLastName] 被迫撤退到半岛北部。"
car.1.a: "祝好运"
car.1.tt: "[SCOPE.sCharacter('gomez_damas').GetFullName] 在整个远征期间将无法参与其他事务"

car.2.t: "[SCOPE.sCharacter('lider_carlista_exiliado').GetFullName] 的逃亡"
car.2.d: "在听到 [SCOPE.sCountry('spa_scope').GetName] 爆发新的卡洛斯起义的消息后， [SCOPE.sCharacter('lider_carlista_exiliado').GetFullName] 迅速返回 [SCOPE.sCountry('car_scope').GetName]，以恢复他作为合法国王的身份。"
car.2.f: "卡洛斯七世于1873年7月16日再次越过边境，并将 [SCOPE.sCountry('car_scope').GetName] 的首都设立在埃斯特拉。该市建立了一个稳定的政府，并设立了政府、司法、教育、省议会、新闻和战争等部门。"
car.2.a: "高飞吧，王子"

car.3.t: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 的逃亡"
car.3.d: "面对即将失败的 [concept_war|l] ——[SCOPE.sWar('guerra_carlista_scope').GetName]，许多高级军官建议 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 离开国家，流亡到 [concept_exile|l]。"
car.3.d_infante_huido: "面对即将失败的 [concept_war|l] ——[SCOPE.sWar('guerra_carlista_scope').GetName]，许多高级军官建议 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 离开国家，流亡到 [concept_exile|l]，追随 [concept_heir|l] [SCOPE.sCharacter('heredero_scope').GetFullName] 的脚步。"
car.3.f: "许多高级军官开始逃亡流亡，害怕自由派的报复。\n\n由于缺乏兵力以及 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 宫廷内部的动荡，他们被迫在1839年签署和平条约，尽管一些卡洛斯派别和唐卡洛斯本人没有接受《维尔加拉条约》，不得不流亡，等待新的机会。"
car.3.a: "一个国王在人民需要时绝不会抛弃他们。"
car.3.b: "我们会更强大地归来。"

car.4.t: "卡洛斯起义"
car.4.d: "经过一系列 [SCOPE.sCountry('car_scope').GetAdjective] 的胜利后，我们可以影响一些伊莎贝尔派驻军加入我们的事业。"
car.4.f: "在马斯特拉佐山脉，费尔南多七世于1833年9月去世后，随着自由主义国家逐渐成型，许多卡洛斯领导人开始躲避主要城市和战略交通路线。这些领导人包括卡尔尼塞尔、基列斯、卡布雷拉、塞拉多尔和雅戈斯特拉等，他们分别在阿拉贡、加泰罗尼亚或瓦伦西亚活动。"
car.4.a: "我们需要对马斯特拉佐山脉施加压力"
car.4.a_tt: "这将为未来的起义铺平道路，围攻 #bold 巴塞罗那#!"
car.4.b: "我们将在阿拉贡巩固阵地"
car.4.c: "是时候围攻巴塞罗那了"

car.5.t: "$car.4.t$"
car.5.d: "经过一系列 [SCOPE.sCountry('car_scope').GetAdjective] 的胜利，他们已经成功地影响了部分伊莎贝尔派驻军，加入了他们的事业。"
car.5.d_maestrazgo: "[SCOPE.sCountry('car_scope').GetAdjective] 的支持者已将他们的追随者集结在马斯特拉佐山脉，开始对 [ROOT.GetCountry.GetAdjective] 政权进行武装起义。"
car.5.d_aragon: "[SCOPE.sCountry('car_scope').GetAdjective] 的支持者已在 [SCOPE.sState('aragon_espa').GetStateRegion.GetName] 激起孤立的忠诚驻军加入他们的事业。"
car.5.d_cataluna: "在巩固了 [SCOPE.sState('aragon_espa').GetStateRegion.GetName] 的阵地后，加泰罗尼亚地区的农村驻军纷纷加入了 [SCOPE.sCountry('car_scope').GetRuler.GetPrimaryRoleTitle] 的事业，除了巴塞罗那市。"

car.5.f: "$car.4.f$"
car.5.a: "渗透他们的领土将更加困难"
car.5.b: "我们相信巴塞罗那的驻军"
car.5.c: "这危及到了首都"

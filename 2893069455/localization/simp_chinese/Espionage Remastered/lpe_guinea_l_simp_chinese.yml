no_ha_presentado_ninguna_exigencia: "没有任何 [concept_country|l] 正在审议 [ROOT.GetCountry.GetName] 的主张"

gui.1.t: "[SCOPE.sCountry('scope_reclamador').GetAdjectiveNoFormatting] 对几内亚的主张"
gui.1.d: "[SCOPE.sCountry('scope_reclamador').GetName] 请求确认其在几内亚湾主张的合法性，并寻求其他 [Concept('concept_great_power', '$concept_great_powers$')|l] 的批准，以向占领者发出若干最后通牒。"
gui.1.f: "在热闹的会议室中，四周悬挂着华丽的挂毯，茶杯碰撞作响，[SCOPE.sCountry('scope_reclamador').GetName] 的外交官们戴着礼帽和引人注目的胡须，努力争取确认他们在几内亚湾的主张。\n\n- '我们的历史权利是不可否认的，'那位 [SCOPE.sCountry('scope_reclamador').GetAdjectiveNoFormatting] 大使以戏剧性的手势宣布。\n\n在他面前，其他 [Concept('concept_great_power', '$concept_great_powers$')|l] 的代表交换着怀疑的目光。一位英国外交官整理着领带，巧妙地回应道：\n\n- '历史，亲爱的朋友，有时会在现实面前黯然失色。'"
gui.1.a: "他们得到了我们的批准"
gui.1.b: "我们绝不会容忍任何 [SCOPE.sCountry('scope_reclamador').GetAdjectiveNoFormatting] 出现在几内亚"

gui.2.t: "要求 [SCOPE.sCountry('spa_scope').GetName] 遵守协议"
gui.2.d: "[SCOPE.sCountry('spa_scope').GetName] 基于其在 [SCOPE.sState('scope_camerun').GetStateRegion.GetName] 拥有费尔南多·波的合法性，请求确认其在 [SCOPE.sState('scope_gabon').GetStateRegion.GetName] 海岸建立基地的权利，此决定得到了 [Concept('concept_great_power', '$concept_great_powers$')|l] 的支持。"
gui.2.f: "几内亚湾的西班牙领地是一系列岛屿和大陆领土，从1778年开始由西班牙在几内亚湾和比亚法拉湾（中非地区）控制。\n\n经过数年相对忽视，其中甚至曾有短暂的英国占领，1843年胡安·何塞·勒雷纳与巴里率领的远征使西班牙的占有得以巩固。"
gui.2.a: "我们必须遵守协议"
gui.2.b: "他们将从我们冰冷的手中抢夺而去"

gui.3.t: "占领 [SCOPE.sState('camerun_scope').GetName]"
gui.3.d: "在 [SCOPE.sCountry('spa_scope').GetName] 对 [SCOPE.sState('camerun_scope').GetName] 的统治完全崩溃以及权力真空出现后，我们的几位探险家占领了该岛，并声称其归 [ROOT.GetCountry.GetName] 所有。"
gui.3.f: "由于大都市支持不足、疾病横行以及当地居民的敌意，殖民地爆发了叛乱。叛军夺取了西班牙最高权威。新领导者撤离了殖民地，将幸存者引导至圣多美。得知首都被当地居民摧毁后，并在英国对圣多美发动攻击后，西班牙人决定返回 [ROOT.GetCountry.GetName] 大陆，放弃这些岛屿。"
gui.3.a: "不要挑剔白送的礼物"

gui.4.t: "[SCOPE.sState('camerun_scope').GetName] 请求支援"
gui.4.d: "[SCOPE.sState('camerun_scope').GetName] 的许多定居者抱怨恶劣的工作条件，并要求 [ROOT.GetCountry.GetName] 提供援助以改善他们的处境。"
gui.4.f: "在19世纪的大部分时间里，费尔南多·波岛的殖民对西班牙来说是一大负担。岛上恶劣的气候与缺乏可开发的自然资源相结合，使得定居者一再向大都市求援，通常这些援助来自分配给古巴的资金。"
gui.4.a: "我们绝不能允许这种耻辱发生"
gui.4.b: "就好像我们国内的开销还不够一样"
gui.4.c: "应该由殖民部负责支付"

gui.5.t: "支付费尔南多·波岛占领费用"
gui.5.d: "[SCOPE.sState('camerun_scope').GetName] 的许多定居者抱怨恶劣的工作条件，并要求 [SCOPE.sCountry('spa_scope').GetName] 提供援助以改善他们的处境，而 [SCOPE.sCountry('spa_scope').GetName] 已决定由 [ROOT.GetCountry.GetName] 承担这笔费用。"
gui.5.f: "$gui.4.f$"
gui.5.a: "我们必须为别人的冒险买单"

gui.6.t: "几内亚问题"
gui.6.d: "[SCOPE.sState('camerun_scope').GetOwner.GetName] 多年来一直控制着 [SCOPE.sState('camerun_scope').GetName]，如今要求进入非洲大陆。"
gui.6.f: "第一条：费尔南多·波岛、安诺本岛、科里斯科岛、埃洛贝大岛和埃洛贝小岛，以及几内亚大陆领土，其主权已于1900年6月27日通过与法国签订的条约由 [SCOPE.sState('camerun_scope').GetOwner.GetName] 确认，均构成一个统一的法律实体，官方名称为 '几内亚湾西班牙领地' —— 1904年7月12日的皇家法令。"
gui.6.a: "我们将在那里采取行动"
gui.6.b: "我对此事毫不关心"

je_ambiciones_guinea: "几内亚问题"
je_ambiciones_guinea_reason: "我们的 [concept_country|l] 拥有对几内亚海岸的历史性主张，这源于长期拥有 #bold 费尔南多·波#! 岛屿，该岛位于 [SCOPE.sState('scope_camerun').GetStateRegion.GetName]。现在是时候向其他 [Concept('concept_great_power', '$concept_great_powers$')|l] 要求，我们有权在大陆上获得一条领土带。\n\n#tooltippable #tooltip:[GetPlayer.GetTooltipTag],potencias_que_participan 参与中#!#! #variable [GetGlobalVariable('numero_paises_participando').GetValue]#! [Concept('concept_great_power', '$concept_great_powers$')|l]:\n#variable [GetGlobalVariable('votos_positivos_espana').GetValue]#! 已经 #bold 支持#! [SCOPE.sCountry('spa_scope').GetName] 的主张\n#variable [GetGlobalVariable('votos_negativos_espana').GetValue]#! 已经 #bold 否决#! [SCOPE.sCountry('spa_scope').GetName] 的主张\n\n如若平局，[SCOPE.sCountry('spa_scope').GetName] 的主张将获得支持。\n如果 [SCOPE.sCountry('spa_scope').GetName] 同时满足 #tooltippable #tooltip:[GetPlayer.GetTooltipTag],potencias_que_participan 要求#!#!，它将始终自我支持。"
  

l_simp_chinese:
 cub.1.t: "十月十日宣言"
cub.1.d: "独立政治家 [SCOPE.sCharacter('cespedes_scope').GetFullName] 已经成为 [SCOPE.gsInterestGroup('grupo_indepe').GetName] 领导人，呼吁岛屿独立。"
cub.1.f: "«...没有人能忽视 [SCOPE.sCountry('overlord_scope').GetName] 以铁腕、血腥的方式统治着 [SCOPE.sCountry('cuba_scope').GetName]...剥夺了岛屿所有的政治、民事和宗教自由，它的不幸子民要么被流放到遥远的地方，要么在和平时期被军法审判执行死刑...它无法进行集会，除非是在军队领导人的主持下，无法寻求解决问题的途径，只能被视为叛乱分子，唯一的选择就是保持沉默并服从...»"
cub.1.a: "我们看看局势如何发展"

cub.2.t: "独立激进分子"
cub.2.d: "在 [SCOPE.sCountry('cuba_scope').GetName] 出现了一个激进分子，呼吁岛屿独立。 [SCOPE.sCharacter('maximo_gomez_scope').GetFullName] 开始推动岛上的武装起义。"
cub.2.f: "在独立战争期间，他提到了“命运与屈辱的制度”——奴隶制度的影响：\n\n «随着逐渐了解，我感到震惊，并感觉一种情感在我内心升起，使我开始痛恨西班牙人»。\n多年后，他补充道：\n\n «很快，我发现自己与在古巴受苦最多的人——黑人奴隶紧密相连。那时我才真正意识到我能够爱人»。—— [SCOPE.sCharacter('maximo_gomez_scope').GetFullName]，1876年3月28日"
cub.2.a: "独立力量增强"
cub.2_tt: "只要 [SCOPE.sCharacter('maximo_gomez_scope').GetFullName] 仍然在 [SCOPE.sCountry('cuba_scope').GetName]，他的 [concept_liberty_desire|l] 将不断增加。"

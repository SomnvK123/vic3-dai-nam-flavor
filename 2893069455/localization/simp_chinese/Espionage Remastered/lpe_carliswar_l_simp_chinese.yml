l_simp_chinese:
caw.1.t: "伊比利亚烽烟"
caw.1.d: "值此岁首，内阁廷议是否续派王师驰援[SCOPE.sCountry('spa_scope').GetName]保王党，助其剿灭[SCOPE.sCountry('car_scope').GetName]叛军。"
caw.1.f: "卡洛斯之乱初起时，[SCOPE.sCountry('spa_scope').GetName]正统王室得英法两国勤王。英吉利遣'义勇军'跨海来援，法兰西调'外籍军团'越山而至。虽非主力，然此等客军与[SCOPE.sCountry('spa_scope').GetAdjective]王师互为犄角，共御叛逆。"
caw.1.a: "续保勤王义旅"
caw.1_tt: "待[SCOPE.sCountry('car_scope').GetName]逆党授首，此策自消"
caw.1.b: "罢西征之议"

caw.2.t: "法兰西援军"
caw.2.d: "经凡尔赛宫廷密议，[SCOPE.sCountry('fra_scope').GetName]决意续遣'法援师'协防，直至荡平寇乱。"
caw.2.f: "昔年[SCOPE.sCountry('spa_scope').GetName]正统蒙尘，法兰西以'外籍军团'示天下勤王之义。此部善筑壕堑，尤精火炮，每逢战阵必列于王师侧翼。"
caw.2.a: "友邦高义可钦"
caw.2.tt: "与[SCOPE.sCountry('fra_scope').GetName]之[concept_relations|l]当增进"
caw.2.tt.1: "[SCOPE.sBuilding('aux_scope').GetName|l]驻防[SCOPE.sState('sta_scope').GetStateRegion.GetName]要塞，其[concept_offense|l]稍长"

caw.3.t: "英吉利义勇军"
caw.3.d: "白金汉宫廷报至，[SCOPE.sCountry('gbr_scope').GetName]允诺'英援旅'不日拔营，誓与逆党周旋到底。"
caw.3.f: "英伦客军善火器，每逢野战必执燧发枪列线而进。更有苏格兰高地旅持阔刃大剑冲锋陷阵，叛军见之胆寒。"
caw.3.a: "天兵助阵甚善"
caw.3.tt: "与[SCOPE.sCountry('gbr_scope').GetName]之[concept_relations|l]当厚结"
caw.3.tt.1: "[SCOPE.sBuilding('aux_scope').GetName|l]驻[SCOPE.sState('sta_scope').GetStateRegion.GetName]大营，伤敌[concept_morale|l]]尤甚"

caw.4.t: "法援师撤防"
caw.4.d: "巴黎忽传撤军令，[SCOPE.sCountry('fra_scope').GetName]'法援师'即日卷旗西归，弃[SCOPE.sCountry('spa_scope').GetAdjectiveNoFormatting]疆场于不顾。"
caw.4.f: "昔年法兰西外籍军团列阵如林，今观其仓皇退兵，辎重遗弃无数。王师侧翼顿显空虚，叛军攻势愈急。"
caw.4.a: "背盟之徒可诛"

caw.5.t: "英援旅罢征"
caw.5.d: "伦敦枢密院决议，[SCOPE.sCountry('gbr_scope').GetName]'英援旅'鸣金收兵，王师独力难支。"
caw.5.f: "英吉利火枪阵本为战场砥柱，今骤然后撤，叛军骑兵遂纵横驰骋。燧发枪声渐稀，唯闻逆党马嘶震天。"
caw.5.a: "狡英反复无常"

caw.6.t: "伊比利亚靖难"
caw.6.d: "[SCOPE.sCountry('spa_scope').GetName]烽烟终散，我朝远征将士奏凯还朝。"
caw.6.f: "王师会同英法客军血战经年，终将卡洛斯逆党敉平。残寇遁入庇里牛斯山，伊莎贝拉女王銮驾重归马德里。"
caw.6.a: "府库再充"

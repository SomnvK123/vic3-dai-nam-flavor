l_simp_chinese: 
phi.1.t: "附庸国的整合"
phi.1.d: "经过巨大的官僚努力，[SCOPE.sCountry('phi_scope').GetName] 的许多人希望将属于我们的附庸国 [SCOPE.sCountry('owner_scope').GetName] 统治的 [SCOPE.sState('estado_scope').GetName] 领土整合到中央政府。"
phi.1.f: "许多人认为 [ROOT.GetCountry.GetAdjective] 政府应当投资于菲律宾群岛所有邦的政治统一，以确保 [SCOPE.sCountry('phi_scope').GetName] 的延续。"
phi.1.a: "[ROOT.GetCountry.GetCapital.GetCityHubName] 的官僚们不会喜欢这一决定。"

phi.2.t: "边界调整"
phi.2.d: "关于如何管理 [SCOPE.sState('estado_scope').GetName] 领土的问题引发了激烈讨论，而 [SCOPE.sCountry('phi_scope').GetRuler.GetFullNameWithTitle] 已经请求将其并入 [SCOPE.sCountry('phi_scope').GetName]。"
phi.2.f: "在与 [SCOPE.sCountry('owner_scope').GetRuler.GetFullNameWithTitle] 进行了一次简短会议后，双方达成协议，将菲律宾群岛的一部分领土割让给 [SCOPE.sCountry('phi_scope').GetCapital.GetCityHubName] 以便更好地进行行政管理。\n毫无疑问，这是迈向控制整个群岛的一小步。如果我们拒绝这一提议，可能会向其他列强展示我们的软弱。"
phi.2.a: "新的附庸国"

phi.3.t: "菲律宾群岛的全面统治"
phi.3.d: "最终，经过几个世纪的斗争，我们首次成功地将整个菲律宾群岛置于 [ROOT.GetCountry.GetName] 的影响之下。"
phi.3.f: "菲律宾总督辖区（Captaincy General of the Philippines），也被称为菲律宾王国，是西班牙的一个领土实体，最初作为新西班牙总督辖区的一个自治实体，直至1830年。\n该领土由西班牙王室在所谓的东印度群岛（亚洲和大洋洲地区）设立，首府位于马尼拉。"
phi.3.a: "值得庆祝的伟大日子"
bufo_filipina: "菲律宾的 [concept_government|l] 将暂时获得 [concept_legitimacy] 提升。"

phi.4.t: "海盗袭击"
phi.4.d: "一群海盗闯入了 [SCOPE.sState('estado_raideado_scope').GetName]，在掠夺了船只能够承载的一切后，逃往 [SCOPE.sCountry('destino_piratas').GetName] 进行分赃。"
phi.4.f: "尽管 [SCOPE.sCountry('destino_piratas').GetName] 的 [concept_government|l] 与此事无关，但他们在遏制海盗方面的无能已经显而易见——[ROOT.GetCountry.GetRuler.GetFullNameWithTitle] 在与内阁讨论此事时如是说道。"
phi.4.a: "可恶的海盗"
esclavos_nuevos_destino: "一群 [GetPopType('slaves').GetName] 将被带往 [SCOPE.sCountry('destino_piratas').GetName]。"

phi.5.t: "海盗活动"
phi.5.d: "一群在这片海域活动的海盗刚刚完成了一次成功的掠夺行动。"
phi.5.f: "19世纪，苏禄群岛的霍洛（Jolo）摩洛海盗是东南亚最令人畏惧的势力之一。这些海盗主要由苏禄苏丹国的苏禄族人领导，以劫掠菲律宾沿海地区及其周边地带而闻名。"
phi.5.a: "我们看看能做些什么"
phi.5_tt: "可能有一群 [GetPopType('slaves').GetName] 随他们一同返回。"

phi.6.t: "印尼海域的海盗活动"
phi.6.d: "一群海盗袭击了 [SCOPE.sState('estado_atacado').GetName]，该领土属于 [SCOPE.sCountry('sujeto_atacado').GetName]。\n海盗们洗劫了所有他们的船只能够承载的物资后逃逸，这无疑将对贸易造成冲击。"
phi.6.f: "霍洛（Jolo）摩洛海盗是19世纪东南亚最令人畏惧的势力之一。这些海盗主要由苏禄群岛的苏禄族人领导，以劫掠菲律宾沿海地区及其周边地带而闻名。"
phi.6.a: "更多的麻烦"

phi.7.t: "印尼地区的海盗猖獗"
phi.7.d: "多年的忽视导致印尼水域的海盗活动再次抬头。其他 [Concept('concept_country', '$concept_countries$')|l] 也将遭受海盗的掠夺。"
phi.7.f: "霍洛（Jolo）摩洛海盗是19世纪东南亚最令人畏惧的势力之一。\n\n这些海盗主要来自苏禄群岛，并由苏禄苏丹国的苏禄族人领导，以劫掠菲律宾沿海地区及其周边地带而闻名。"
phi.7.a: "我更喜欢加勒比的海盗。"

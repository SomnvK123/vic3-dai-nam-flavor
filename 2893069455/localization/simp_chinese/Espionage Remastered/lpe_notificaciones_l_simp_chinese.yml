l_simp_chinese:
 notification_la_gloriosa_notification_name: "光荣革命"
notification_la_gloriosa_notification_desc: "在 [SCOPE.sState('estado_desembarco').GetStateRegion.GetPortHubName] 市成功发动初步政变后，随之而来的大规模起义得到了 [SCOPE.sCharacter('militar_golpista_uno').GetLastName] 和 [SCOPE.sCharacter('militar_golpista_dos').GetLastName] 领导的军队支持，波旁王朝政权已被推翻。[SCOPE.sCountry('spa_scope').GetName] 面临权力斗争。"
notification_la_gloriosa_notification_tooltip: "#header $la_gloriosa_notification_name$#!\n$TOOLTIP_DELIMITER$\n$la_gloriosa_notification_desc$"

notification_ascenso_de_isabel_notification_name: "[SCOPE.sCountry('spa_scope').GetRuler.GetFirstName] 二世的加冕典礼"
notification_ascenso_de_isabel_notification_desc: "[SCOPE.sCountry('spa_scope').GetName] 的政治阶层决定 [SCOPE.sCountry('spa_scope').GetRuler.GetFullName] 已具备加冕为 [SCOPE.sCountry('spa_scope').GetName] 君主的资格。本周，他们将在 [SCOPE.sCountry('spa_scope').GetCapital.GetCityHubName] 向法院宣誓宪法。"
ascenso_de_isabel_notification_tooltip: "#header $ascenso_de_isabel_notification_name$#!\n$TOOLTIP_DELIMITER$\n$ascenso_de_isabel_notification_desc$"

notification_fin_guerra_carlista_isabelinos_name: "[SCOPE.sCountry('spa_scope').GetName] 的伊莎贝尔派胜利"
notification_fin_guerra_carlista_isabelinos_desc: "经过四年多的战斗，忠于 [SCOPE.sCountry('spa_scope').GetHeir.GetFirstName] 的军队成功击败了卡洛斯派。[SCOPE.sCountry('spa_scope').GetAdjectiveNoFormatting] 的将军 [SCOPE.sCharacter('general_esp').GetLastName] 与卡洛斯派将军马罗托会面，达成停战协议并商讨卡洛斯派的投降事宜。"
fin_guerra_carlista_isabelinos_tooltip: "#header $notification_fin_guerra_carlista_isabelinos_name$#!\n$TOOLTIP_DELIMITER$\n$notification_fin_guerra_carlista_isabelinos_desc$"

notification_exilio_familia_real_carlista_name: "卡洛斯派王室流亡"
notification_exilio_familia_real_carlista_desc: "面对卡洛斯派即将到来的失败，王室成员已逃往 [concept_exile|l]，以便在海外继续斗争。"
exilio_familia_real_carlista_tooltip: "#header $notification_exilio_familia_real_carlista_name$#!\n$TOOLTIP_DELIMITER$\n$notification_exilio_familia_real_carlista_desc$"

notification_exilio_heredero_real_carlista_name: "[SCOPE.sCharacter('heredero_scope').GetFullName] 流亡"
notification_exilio_heredero_real_carlista_desc: "面对卡洛斯派的失败，[SCOPE.sCharacter('heredero_scope').GetFullName] 独自逃亡至 [concept_exile|l] 以继续海外斗争。然而，他们的父亲决定继续在 [SCOPE.sCountry('spa_scope').GetName] 进行武装抵抗，这一举动略微提升了卡洛斯派的士气。"
exilio_heredero_real_carlista_tooltip: "#header $notification_exilio_heredero_real_carlista_name$#!\n$TOOLTIP_DELIMITER$\n$notification_exilio_heredero_real_carlista_desc$"

notification_fin_guerra_carlista_carlsitas_name: "[SCOPE.sCountry('car_scope').GetName] 的卡洛斯派胜利"
notification_fin_guerra_carlista_carlsitas_desc: "经历四年多的战斗后，卡洛斯派军队终于击败了伊莎贝尔派，[SCOPE.sCountry('car_scope').GetRuler.GetFullName] 成功夺取了西班牙王位。[SCOPE.sCountry('car_scope').GetName] 即将迎来重大变革。"
fin_guerra_carlista_carlsitas_tooltip: "#header $notification_fin_guerra_carlista_carlsitas_name$#!\n$TOOLTIP_DELIMITER$\n$notification_fin_guerra_carlista_carlsitas_desc$"

notification_motin_de_la_granja_name: "圣伊尔德丰索宫兵变"
notification_motin_de_la_granja_desc: "[SCOPE.sCountry('spa_scope').GetName] 皇家卫队中的 [GetPopType('officers').GetName] 在位于塞戈维亚的圣伊尔德丰索宫发动兵变，正值 [SCOPE.sCountry('spa_scope').GetRuler.GetFullName] 在此度假。[GetPopType('officers').GetName] 要求恢复 #bold 1812年西班牙宪法#!。"
motin_de_la_granja_tooltip: "#header $notification_motin_de_la_granja_name$#!\n$TOOLTIP_DELIMITER$\n$notification_motin_de_la_granja_desc$"

notification_voto_positivo_name: "[SCOPE.sCountry('scope_yo').GetName] 的支持"
notification_voto_positivo_desc: "[SCOPE.sCountry('scope_yo').GetName] 已批准我们对 #bold 几内亚#! 的主张。"
voto_positivo_tooltip: "#header $notification_voto_positivo_name$#!\n$TOOLTIP_DELIMITER$\n$notification_voto_positivo_desc$"

notification_voto_abstencion_name: "[SCOPE.sCountry('scope_yo').GetName] 的弃权"
notification_voto_abstencion_desc: "[SCOPE.sCountry('scope_yo').GetName] 决定不干涉我们对 #bold 几内亚#! 的主张。"
voto_abstencion_tooltip: "#header $notification_voto_abstencion_name$#!\n$TOOLTIP_DELIMITER$\n$notification_voto_abstencion_desc$"

notification_voto_negativo_name: "[SCOPE.sCountry('scope_yo').GetName] 的反对"
notification_voto_negativo_desc: "[SCOPE.sCountry('scope_yo').GetName] 拒绝了我们对 #bold 几内亚#! 的主张。"
voto_negativo_tooltip: "#header $notification_voto_negativo_name$#!\n$TOOLTIP_DELIMITER$\n$notification_voto_negativo_desc$"

notification_pais_se_niega_a_entregar_guinea_name: "[SCOPE.sCountry('scope_yo').GetName] 拒绝交出几内亚"
notification_pais_se_niega_a_entregar_guinea_desc: "[SCOPE.sCountry('scope_yo').GetName] 无视国际要求，拒绝交出其在几内亚的领土。如果我们想获得它，唯一的途径是通过 [concept_diplomatic_demand|l]。"
notification_pais_se_niega_a_entregar_guinea_tooltip: "#header $notification_pais_se_niega_a_entregar_guinea_name$#!\n$TOOLTIP_DELIMITER$\n$notification_pais_se_niega_a_entregar_guinea_desc$"

notification_segunda_guerra_carlista_name: "[SCOPE.sCountry('spa_scope').GetName] 的第二次卡洛斯战争"
notification_segunda_guerra_carlista_desc: "[SCOPE.sCountry('spa_scope').GetName] 长期的政治动荡助长了卡洛斯派的势力。[SCOPE.sCountry('car_scope').GetAdjective] 由 [SCOPE.sCountry('car_scope').GetRuler.GetFullName] 领导，再次向 [SCOPE.sCountry('spa_scope').GetRuler.GetFullName] 的政权发起挑战。"
segunda_guerra_carlista_tooltip: "#header $segunda_guerra_carlista_name$#!\n$TOOLTIP_DELIMITER$\n$notification_segunda_guerra_carlista_desc$"

notification_renuncia_reclamos_hiberoamerica_name: "[SCOPE.sCountry('spa_scope').GetName] 放弃 #bold 西属美洲#! 领土要求"
notification_renuncia_reclamos_hiberoamerica_desc: "[SCOPE.sCountry('spa_scope').GetName] 终于决定结束自1809年以来的西班牙美洲独立战争，正式宣布放弃对 #bold 西属美洲#! 领土的所有主权要求。"
renuncia_reclamos_hiberoamerica_tooltip: "#header $notification_renuncia_reclamos_hiberoamerica_name$#!\n$TOOLTIP_DELIMITER$\n$notification_renuncia_reclamos_hiberoamerica_desc$"

notification_lider_carlista_regresa_name: "[SCOPE.sCountry('car_scope').GetRuler.GetFullName] 回归 [SCOPE.sCountry('car_scope').GetName]"
notification_lider_carlista_regresa_desc: "得知 [SCOPE.sCountry('spa_scope').GetName] 再次爆发卡洛斯派起义后，[SCOPE.sCountry('car_scope').GetRuler.GetFullName] 迅速返回 [SCOPE.sCountry('car_scope').GetName]，誓言夺回王位。"
lider_carlista_regresa_tooltip: "#header $notification_lider_carlista_regresa_name$#!\n$TOOLTIP_DELIMITER$\n$notification_lider_carlista_regresa_desc$"

l_simp_chinese:
provincia_espannola: "海外领地"
provincia_espannola_desc: "此[concept_subject|l]将被视为具有特殊立法的领地。"

provincia_espannola_action_notification_name: "[INITIATOR_COUNTRY.GetName] 将我们视为海外领地"
provincia_espannola_action_notification_desc: "[INITIATOR_COUNTRY.GetName] 现在将我们视为一个具有特殊立法的领地，永远不会被剥削。因此，我们的[concept_liberty_desire|l]将大幅降低。"

provincia_espannola_action_propose_name: "$provincia_espannola$"
provincia_espannola_action_break_name: "撤销 $provincia_espannola$ 的地位"

provincia_espannola_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] 视 [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] 为具有特殊立法的海外领地。"

provincia_espannola_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] 将我们降级为殖民地"
provincia_espannola_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] 已将我们降级为殖民地。从现在开始，我们必须向宗主国支付每月贡品。因此，我们的[concept_liberty_desire|l]将增加。"

provincia_espannola_trigger_desc_global: "他们视我们为 $provincia_espannola$"
provincia_espannola_trigger_false_desc_global: "#b 否#! 他们不视我们为 $provincia_espannola$"

provincia_espannola_trigger_desc_first: "[AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] 视其附属国为具有特殊立法的海外领地。"

provincia_espannola_trigger_false_desc_first: "[AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] #b 并不#! 视其附属国为具有特殊立法的海外领地。"

provincia_espannola_trigger_desc_third: "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] 视 [COUNTRY.GetName] 为海外领地"
provincia_espannola_trigger_false_desc_third: "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] #bold 并不#! 视 [COUNTRY.GetName] 为海外领地"

provincia_espannola_action_notification_third_party_name: "[TARGET_COUNTRY.GetName] 被视为海外领地"
provincia_espannola_action_notification_third_party_desc: "[INITIATOR_COUNTRY.GetName] 已开始视 [TARGET_COUNTRY.GetName] 为海外领地。"

provincia_espannola_action_notification_third_party_break_name: "[TARGET_COUNTRY.GetName] 被视为殖民地"
provincia_espannola_action_notification_third_party_break_desc: "[INITIATOR_COUNTRY.GetName] 已不再视 [TARGET_COUNTRY.GetName] 为海外领地。"

provincia_espannola_effect_desc_first: "[AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] 将被视为 $provincia_espannola$"
provincia_espannola_effect_desc_global: "他们将视我们为 $provincia_espannola$"

##############################
# 议会代表权 #
##############################

representacion_en_cortes: "议会代表权"
representacion_en_cortes_desc: "允许我们的[concept_subject|l]在每次[Concept('concept_election', '$concept_elections$')|l]时，向其[concept_overlord|l]的议会派遣代表。"

representacion_en_cortes_action_notification_name: "[INITIATOR_COUNTRY.GetName] 授予了议会代表权"
representacion_en_cortes_action_notification_desc: "[INITIATOR_COUNTRY.GetName] 允许我们在每次[Concept('concept_election', '$concept_elections$')|l]时选举代表进入他们的议会。因此，我们的[concept_liberty_desire|l]将降低。"

representacion_en_cortes_action_propose_name: "$representacion_en_cortes$"
representacion_en_cortes_action_break_name: "撤销 $representacion_en_cortes$"

representacion_en_cortes_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] 已授予 [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] 代表席位，使其代表能够加入国会。"

representacion_en_cortes_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] 撤销了我们的议会代表权"
representacion_en_cortes_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] 单方面撤销了我们的代表席位。因此，我们的[concept_liberty_desire|l]将增加。"

representacion_en_cortes_trigger_desc_global: "已授予议会代表权"
representacion_en_cortes_trigger_false_desc_global: "#b 否#! 他们没有授予议会代表权"

representacion_en_cortes_trigger_desc_first: "[COUNTRY.GetNameNoFlag] 已授予其附属国 [TARGET_COUNTRY.GetName] 议会代表权"
representacion_en_cortes_trigger_false_desc_first: "[COUNTRY.GetNameNoFlag] #b 并未#! 授予其附属国 [TARGET_COUNTRY.GetName] 议会代表权"

representacion_en_cortes_trigger_desc_third: "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] 已授予 [COUNTRY.GetName] 议会代表权"

representacion_en_cortes_trigger_false_desc_third: "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] #b 并未#! 授予 [COUNTRY.GetName] 议会代表权"

representacion_en_cortes_effect_desc_first: "[AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] 将在 [COUNTRY.GetNameNoFlag] 的议会中获得代表权"

representacion_en_cortes_action_notification_third_party_name: "[TARGET_COUNTRY.GetName] 获得议会代表权"
representacion_en_cortes_action_notification_third_party_desc: "[INITIATOR_COUNTRY.GetName] 允许 [TARGET_COUNTRY.GetName] 在其[Concept('concept_election', '$concept_elections$')|l]后向议会派遣[TARGET_COUNTRY.GetAdjectiveNoFormatting]代表。"

representacion_en_cortes_action_notification_third_party_break_name: "[TARGET_COUNTRY.GetName] 失去议会代表权"
representacion_en_cortes_action_notification_third_party_break_desc: "[INITIATOR_COUNTRY.GetName] 取消了 [TARGET_COUNTRY.GetName] 进入其议会的权利。"

catalyst_revocada_provincia: "降为殖民地"
catalyst_revocada_provincia_desc: "将他们降级为殖民地。"

catalyst_revocada_representacion: "撤销代表权"
catalyst_revocada_representacion_desc: "撤销了他们在议会的代表权。"

catalyst_oposicion_a_la_anexion: "反对重新整合"
catalyst_oposicion_a_la_anexion_desc: "反对再次并入西班牙。"


representacion_en_cortes_tt_cub: "有选举"
representacion_en_cortes_tt: "有选举"
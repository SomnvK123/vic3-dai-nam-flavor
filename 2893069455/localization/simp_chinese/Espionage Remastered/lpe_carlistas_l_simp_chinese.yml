je_cristininos_victory_desc_3: "来自 [SCOPE.sCountry('car_scope').GetAdjective] 的远征队正在被追击。"

je_cristinos_victory_fuera: "四国同盟"
je_cristinos_victory_fuera_reason: "第一次卡洛斯战争（[SCOPE.sWar('guerra_carlista').GetName]）是在两大派别之间为争夺王位继承权和西班牙君主制性质而展开的：支持已故国王兄弟卡洛斯·玛丽亚·伊西德罗·博尔邦的保守派和反动派被称为卡洛斯，而支持摄政王玛丽亚·克里斯蒂娜代表西班牙女王伊莎贝尔二世的进步派和中央集权派则被称为伊莎贝尔派或克里斯蒂诺派。\n\n[SCOPE.sCountry('gbr_scope').GetName]、[SCOPE.sCountry('fra_scope').GetName]、[SCOPE.sCountry('por_scope').GetName] 和 [SCOPE.sCountry('spa_scope').GetName] 自1834年起一直是四国同盟的成员，最初旨在支持 [SCOPE.sCountry('por_scope').GetRuler.GetFullName] 争取葡萄牙王位，但其当前目标是支持 [SCOPE.sCountry('spa_scope').GetName] 在与 [SCOPE.sCountry('car_scope').GetName] 的斗争中。"
je_cristinos_victory_fuera_status: "$je_cristininos_victory_status$"
je_cristinos_victory_fuera_tt: "[SCOPE.sCountry('spa_scope').GetName] #bold 克里斯蒂娜#! 获胜"
je_cristinos_victory_fuera_tt1: "[SCOPE.sCountry('car_scope').GetName] 获胜"


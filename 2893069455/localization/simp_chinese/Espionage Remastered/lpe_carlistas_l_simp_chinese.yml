l_simp_chinese:

RULER_TITLE_INFANTE: "王子"
Carlos_M_I: "卡洛斯·玛丽亚·伊西德罗"

SPC_FLAVOR_TEXT: "经历了三年的冲突和祖马拉卡尔雷吉的去世，卡洛斯军中的疲劳已变得愈加明显，而在南方，伊莎贝尔派已经成功巩固了自己的力量，准备彻底结束这场起义。是时候让卡洛斯撤出北方，并寻求支持了。"

gov_carlistas: "卡洛斯君主制"
gov_carlistas_desc: "这是一个革命派别，正在争取将博尔邦家族的一支分支安置在西班牙的王位上。"

je_carlist_victory: "卡洛斯战争"
je_carlist_victory_reason: "第一次卡洛斯战争是在两大派别之间为争夺王位继承权和西班牙君主制性质而展开的：支持已故国王兄弟卡洛斯·玛丽亚·伊西德罗·博尔邦的保守派和反动派被称为卡洛斯，而支持摄政王玛丽亚·克里斯蒂娜代表西班牙女王伊莎贝尔二世的进步派和中央集权派则被称为伊莎贝尔派或克里斯蒂诺派。"
je_carlist_victory_status: "推翻西班牙政府。"
win_civil_war: "已推翻篡位者"
je_carlist_victory_1: "西班牙的问题将转嫁到我们身上。"

expedicion_gomez_name: "发起远征"
expedicion_gomez_desc: "我们可以通过派遣远征队进入国内，扰乱伊莎贝尔派的力量。"

expedicion_real_name: "皇家远征"
expedicion_real_desc: "由卡洛斯·玛丽亚·伊西德罗领导军队，我们可以为大义争取更多支持者，并大大提升军队士气。"
expedicion_real_tt: "伊莎贝尔派可能为了避免与远征部队对抗，撤退北方，或者正面迎接远征的后果。"

alzamiento_carlista_name: "策划起义"
alzamiento_carlista_desc: "在战场上展示卡洛斯的优势后，我们可以影响一些同情的驻军加入我们的事业。"
alzamiento_carlista_tt: "起义进度条 #variable $alzamientos_carlistas_bar$#! 已完成"
alzamiento_carlista_tt1: "起义进度条 #variable $alzamientos_carlistas_bar$#! 将失去所有进展"
alzamiento_carlista_tt2: "仍有地区待起义"

je_cristininos_victory: "卡洛斯战争"
je_cristininos_victory_reason: "第一次卡洛斯战争是在两大派别之间为争夺王位继承权和西班牙君主制性质而展开的：支持已故国王兄弟卡洛斯·玛丽亚·伊西德罗·博尔邦的保守派和反动派被称为卡洛斯，而支持摄政王玛丽亚·克里斯蒂娜代表西班牙女王伊莎贝尔二世的进步派和中央集权派则被称为伊莎贝尔派或克里斯蒂诺派。"
je_cristininos_victory_status: "彻底击溃卡洛斯叛乱。"
derrota_carlistas: "已击败叛乱"
derrota_carlistas_tt1: "卡洛斯已胜利"
je_cristininos_victory_tt: "所有与[Concept('concept_modifier', '$concept_modifiers$')|l] 相关的 [concept_war|l] 修正将消失。"

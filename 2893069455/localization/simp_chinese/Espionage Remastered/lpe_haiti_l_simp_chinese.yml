l_simp_chinese:
hai.1.t: "多米尼加共和国独立宣言"
hai.1.d: "新成立的[SCOPE.sCountry('rep_dom_scope').GetName]的领导人发布了一份宣言，说明多米尼加人民为何不能再与[ROOT.GetCountry.GetAdjective]保持统一。"
hai.1.f: "由[SCOPE.sCountry('rep_dom_scope').GetRuler.GetFullName]领导的叛军占领了首都[SCOPE.sCountry('rep_dom_scope').GetCapital.GetCityHubName]的奥萨马堡（Fortaleza Ozama）。[ROOT.GetCountry.GetAdjective]驻军措手不及，显然是被其中一名哨兵背叛。另一队起义军在马蒂亚斯·拉蒙·梅利亚（Matías Ramón Mella）的带领下到达了慈悲之门（Puerta de la Misericordia），梅利亚鸣枪发出了传奇性的独立号角——“Trabucazo de Independencia”，桑切斯（Sánchez）随即高举新生的多米尼加国旗，高喊：“上帝，祖国，自由！”"
hai.1.a: "他们将为这次背叛付出代价"

hai.3.t: "[SCOPE.sState('santo_domingo_scope').GetStateRegion.GetName]的未来"
hai.3.d: "随着[ROOT.GetCountry.GetAdjective]和多米尼加人民之间的新关系，我们的政治阶层开始思考[SCOPE.sState('santo_domingo_scope').GetStateRegion.GetName]的未来。"
hai.3.f: "“[ROOT.GetCountry.GetAdjective]军队的重返并未让岛上的[SCOPE.sCulture('caribenno_scope').GetName]和[SCOPE.sCulture('afro_caribenno_scope').GetName]人民感到高兴。”刚刚抵达的一名[ROOT.GetCountry.GetAdjective]军官如此评论道。"
hai.3.a: "我们应该设立一个总督辖区"
hai.3_tt1: "我们必须通过[concept_diplomatic_demand|l]降低[SCOPE.sCountry('ocupador_santo_domingo').GetName]的自治权，使其成为[concept_puppet|l]。"
hai.3.b: "试图缓和紧张局势"
hai.3.c: "完全吞并是唯一的答案"
hai.3_tt: "此决定将在不久的将来产生影响，如果你尚未体验过的话。"

# hai.4 另一个事件的母事件

hai.5.t: "[SCOPE.sState('estado_rebelde_scope').GetStateRegion.GetName]的起义结束"
hai.5.d: "最终，不论是通过消灭[SCOPE.sCulture('caribenno_scope').GetName]人口，还是终结他们的[concept_discrimination]，我们已经让当地人民与[ROOT.GetCountry.GetAdjective]政权达成和解。"
hai.5.f: "空气中弥漫着既安心又紧张的气氛。没有多米尼加人知道未来会怎样，但许多人对此持怀疑态度。"
hai.5.a: "终于结束了"

hai.6.t: "[SCOPE.sState('estado_trabajadores').GetStateRegion.GetName]的起义"
hai.6.d: "今天，一名不满的[SCOPE.sCulture('caribenno_scope').GetName]地主号召[SCOPE.sPop('insurgentes_scope').GetName]从[SCOPE.sBuilding('edificio_trabajores').GetName]起义，对抗[ROOT.GetCountry.GetName]。"
hai.6.f: "在马蒂亚斯·拉蒙·梅利亚于慈悲之门（Puerta de la Misericordia）鸣枪之后，圣多明各爆发了起义，标志着多米尼加独立战争的开始。"
hai.6.a: "小问题而已"

hai.10.t: "三位一体社的成立"
hai.10.d: "今天，在[SCOPE.sState('santo_domingo_scope').GetName]，几名[SCOPE.sCulture('caribenno_scope').GetName]领导人创立了“三位一体社”（La Trinitaria），这是一个致力于多米尼加共和国独立的组织。"
hai.10.f: "#bold 三位一体社#! 由胡安·巴勃罗·杜阿尔特（Juan Pablo Duarte）和其他[SCOPE.sCulture('caribenno_scope').GetName]人士创立，旨在采取行动，将[SCOPE.sState('santo_domingo_scope').GetName]从[ROOT.GetCountry.GetAdjective]的统治下解放出来，并建立一个独立的[concept_country|l]。"
hai.10.a: "他们逃不掉的"
hai.10_tt: "可以激活[concept_journal_entry|l] #bold 三位一体社#! 任务。"


 hai.11.t: "圣多明各的游击战"
hai.11.d: "趁着最近的[concept_civil_war|l]，[SCOPE.sCulture('caribenno_scope').GetName]人民在[SCOPE.sState('santo_domingo_scope').GetName]对抗[ROOT.GetCountry.GetAdjective]政府发动了起义。"
hai.11.f: "1844年2月27日，在杜阿尔特（Duarte）缺席的情况下，桑切斯（Sánchez）领导的叛军占领了[SCOPE.sState('santo_domingo_scope').GetName]首都的奥萨马堡（Fortaleza Ozama）。[ROOT.GetCountry.GetAdjective]驻军猝不及防，显然是被其中一名哨兵背叛。\n\n另一支由马蒂亚斯·拉蒙·梅利亚（Matías Ramón Mella）领导的起义军抵达了慈悲之门（Puerta de la Misericordia），梅利亚鸣枪发出了传奇性的独立号角——“Trabucazo de Independencia”，随后桑切斯立即高举新生的多米尼加国旗，高喊：“上帝，祖国，自由！”"
hai.11.a: "仿佛[concept_war|l]还不够似的"

hai.12.t: "[ROOT.GetCountry.GetName]的[concept_secession|l]可能性"
hai.12.d: "随着[SCOPE.sState('santo_domingo_scope').GetName]的[Concept('concept_pop', '$concept_population$')|l] [concept_radical|l]势力崛起，许多人开始呼吁[SCOPE.sState('santo_domingo_scope').GetName]独立。"
hai.12.f: "- “这样下去不行！我们已经在[ROOT.GetCountry.GetName]的枷锁下受够了！”——哈科博（Jacobo）愤怒地说道。\n\n- “是时候采取行动了！我们不能让他们继续践踏我们！”——米格尔（Miguel）回应道。\n\n- “听我说，兄弟姐妹们！现在就是我们争取自由的时刻！”\n\n- “我们必须团结一致，奋起反抗。不能让他们继续强加不公正的税收，把我们当成低等人对待。”——一个刚刚进入房间的人说道。"
hai.12.a: "除非从我尸体上踏过去"

hai.13.t: "波多黎各独立宣言"
hai.13.d: "新成立的[SCOPE.sCountry('por_rico_scope').GetName]领导人发布了一份宣言，说明多米尼加人民为何不能再与[ROOT.GetCountry.GetAdjective]保持统一。"
hai.13.f: "叛军在[SCOPE.sCountry('por_rico_scope').GetRuler.GetFullName]的领导下，占领了[SCOPE.sCountry('por_rico_scope').GetCapital.GetCityHubName]的要塞。[ROOT.GetCountry.GetAdjective]驻军措手不及，显然是被其中一名哨兵背叛。"
hai.13.a: "他们将为这次背叛付出代价"

hai.14.t: "$hai.12.t$"
hai.14.d: "随着[SCOPE.sState('puerto_rico_scope').GetName]的[Concept('concept_pop', '$concept_population$')|l] [concept_radical|l]势力崛起，许多人开始呼吁[SCOPE.sState('puerto_rico_scope').GetName]独立。"
hai.14.f: "$hai.12.f$"
hai.14.a: "除非从我尸体上踏过去"

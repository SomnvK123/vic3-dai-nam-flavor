esp.1.t: "[SCOPE.sCharacter('prim_scope').GetFullName]的崛起"
esp.1.d: "一位著名的上校，第一次卡洛斯战争的英雄，成功在西班牙政坛占据了一席之地，并要求国家进行自由改革。"
esp.1.f: "[SCOPE.sCharacter('prim_scope').GetFullName]，雷乌斯伯爵、洛斯卡斯蒂列霍斯侯爵和布鲁克子爵，是一位19世纪的自由派军事家和政治家，曾担任部长会议主席。他在军旅生涯中参与了第一次卡洛斯战争和第一次摩洛哥战争，展现出非凡的领导力、勇气和果断。\n\n1868年革命后，他成为[ROOT.GetCountry.GetAdjective]西班牙最具影响力的人物之一，支持萨伏依王朝的阿马迪奥一世登上王位。不久后，他遭遇暗杀。"
esp.1.a: "毫无疑问，这正是国家所需要的。"
esp.1.b: "我们不需要另一场革命。"

esp.2.t: "卡洛斯派起义"
esp.2.d: "多年的政治动荡被[SCOPE.sCountry('car_scope').GetAdjective]势力所利用，他们试图恢复[SCOPE.sCountry('car_scope').GetRuler.GetFullName]，卡洛斯·玛丽亚·伊西德罗的孙子，登上[ROOT.GetCountry.GetAdjective]王位，并罢黜[ROOT.GetCountry.GetRuler.GetFirstName]作为[concept_ruler|l]。"
esp.2.f: "[SCOPE.sCountry('car_scope').GetRuler.GetFirstName]，马德里公爵，卡洛斯派王位觊觎者，已经在流亡中筹备起义数月。卡洛斯的支持者迅速占领了半岛北部的大部分地区。\n\n按照唐·卡洛斯的命令，起义爆发时高喊：「打倒外国人！西班牙万岁！」"
esp.2.a: "我们将为了[ROOT.GetCountry.GetName]而战。"
esp.2.b: "上帝、祖国、特权与国王！"

esp.3.t: "[ROOT.GetCountry.GetRuler.GetFirstName]的加冕"
esp.3.d: "由于形势紧迫，[ROOT.GetCountry.GetRuler.GetFirstName]在年仅#variable [ROOT.GetCountry.GetHeir.GetAge]#!岁时被决定继位，成为[ROOT.GetCountry.GetName]的君主。"
esp.3.f: "[ROOT.GetCountry.GetRuler.GetFirstName]二世，亦被称为「不幸的女王」或「真正的女王」，在1833年至1868年间统治[ROOT.GetCountry.GetName]。她之所以能够继位，是因为1830年的《王位继承法》废除了1713年的《萨利克法》，引发了她的叔叔卡洛斯·玛丽亚·伊西德罗领导的卡洛斯派叛乱。"
esp.3.a: "希望她比她的父亲更优秀。"

esp.4.t: "毕尔巴鄂围城战"
esp.4.d: "[SCOPE.sCountry('car_scope').GetAdjective]军队围攻了重要城市毕尔巴鄂，若失去该城，将对军队士气造成沉重打击。"
esp.4.f: "1836年初，卡洛斯派面临严重的经济困难，威胁到他们的生存。胡安·包蒂斯塔·埃罗决定向伦敦贷款一百万雷亚尔，由伊格纳西奥·拉迪萨瓦尔负责谈判。但由于缺乏担保，他未能成功。\n\n「在这种情况下，占领毕尔巴鄂可以成为获取外国贷款和投资的必要抵押品。」"
esp.4.a: "我们绝不能放弃这座城市。"
esp.4.b: "我们信任驻军。"
esp.4.a_tt: "围城战陷入僵局。"
bilbao_perdido_barra: "#variable $alzamientos_carlistas_bar$#!的进度条将增加#bold #red 10#!#!点。"

esp.5.t: "自由派报刊审查的终结"
esp.5.d: "由于缺乏[concept_authority|l]，我们不得不停止对自由派报刊的审查。[SCOPE.sCharacter('leader_ig').GetLastName]从中受益匪浅。"
esp.5.f: "「笔锋如今与剑锋一样令人恐惧」——马丁感叹道。\n\n一位勇敢的编辑马丁·塞拉诺，领导了一家公开挑战专制政府的自由派报纸。\n\n他的煽动性言论激励了民众，同时也引起了当局的愤怒。审查制度压制了他的出版物，涂黑了所有反对现状的字句。尽管受到镇压，塞拉诺和他的团队仍然坚持不懈，秘密分发报纸，让沉默的社会继续燃烧抗争的火焰。"
esp.5.a: "可恶。"



 esp.6.t: "摄政权的变动"
esp.6.d: "[ROOT.GetCountry.GetName] 的巨大不稳定性导致 [ROOT.GetCountry.GetRuler.GetLastName] 挑战摄政王玛丽亚·克里斯蒂娜的权威，并担任王国的 [Concept('concept_ruler', '摄政者')|l] 以确保政权的延续。"
esp.6.f: "温和派政府提出了一项削减地方政府权力的市政法草案，激进派对此强烈反对。这导致了一场运动，要求 [Concept('concept_ruler', '摄政者')|l] 不批准该法案，并希望埃斯帕特罗将军阻止其颁布。激进派的起义席卷 [ROOT.GetCountry.GetName]，各地成立了革命委员会以挑战政府的权威。最终，女王 [Concept('concept_ruler', '摄政者')|l] 放弃了摄政权，埃斯帕特罗接替了她的职位。"
esp.6.a: "看看 [ROOT.GetCountry.GetRuler.GetLastName] 能否控制局势。"
esp.6.b: "议会投票决定加冕 [ROOT.GetCountry.GetRuler.GetFirstName]。"
esp.6_tt1: "[ROOT.GetCountry.GetRuler.GetFirstName] 将通过法令加冕。"

esp.7.t: "光荣革命"
esp.7.d: "一群流亡者在 [SCOPE.sState('estado_desembarco').GetStateRegion.GetPortHubName] 迅速登陆，并得到了 [SCOPE.sCharacter('militar_golpista_uno').GetLastName] 和 [SCOPE.sCharacter('militar_golpista_dos').GetLastName] 的支持，成功向 [SCOPE.sState('capital').GetStateRegion.GetCityHubName] 进军并掌控了局势。[ROOT.GetCountry.GetRuler.GetFirstName] 别无选择，只能逃离国家。"
esp.7.f: "西班牙人：[SCOPE.sState('estado_desembarco').GetStateRegion.GetPortHubName] 及其所属省份已经起义 (...) 拒绝服从 [SCOPE.sState('capital').GetStateRegion.GetCityHubName] 的政府，确信自己忠实地代表了人民 (...) 并决心在国家恢复主权、表达其意志并实现其目标之前，绝不放下武器。这就是今日的 [ROOT.GetCountry.GetName]。西班牙人，谁能如此厌恶它，以至于不敢高呼：‘这才是应有的样子’？ ——加的斯，1868 年。"
esp.7.a: "[ROOT.GetCountry.GetRuler.GetFirstName] 必须确保未来。"
esp.7.b: "打倒波旁王朝，共和国万岁！"
esp.7.c: "奥斯塔公爵被选为西班牙人的 [Concept('concept_ruler', '国王')|l]。"
esp.7_tt: "#bold 阿马迪奥·萨伏依-奥斯塔#!，一位 [GetIdeology('ideology_humanitarian_royalist').GetName]，将成为 [ROOT.GetCountry.GetName] 的新 [Concept('concept_ruler', '国王')|l]。"
esp.7.razon: "[concept_heir|l] [ROOT.GetCountry.GetRuler.GetFirstName] 将成为新的 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。"

esp.8.t: "政变时代"
esp.8.d: "随着 [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] 的加冕，许多人对其统治寄予厚望。如果我们希望政权存续，就必须维持 [ROOT.GetCountry.GetName] 的稳定。"
esp.8.f: "[ROOT.GetCountry.GetName] 的‘政变’（Pronunciamentos）是指 19 世纪至 20 世纪初一系列军事起义。这些起义是军方影响国家政治的一种方式，往往是为了维护自身集团或派系的利益。政变反映了 [ROOT.GetCountry.GetName] 在 19 世纪和 20 世纪初的政治不稳定和权力斗争。尽管在某些情况下，它们成功地实现了政治变革，但也表明该国过度依赖武力来维持政治稳定。"
esp.8.a: "未来的几十年将十分有趣。"

esp.9.t: "王室远征"
esp.9.d: "[SCOPE.sCountry('car_scope').GetRuler.GetFullName] 发起了一系列北方战役，以争取 [ROOT.GetCountry.GetName] 各地的支持。"
esp.9.f: "‘王室远征’是 [SCOPE.sCountry('car_scope').GetRuler.GetFullName] 为夺取马德里并推翻其侄女 [ROOT.GetCountry.GetHeir.GetFullName] 而发起的军事行动。远征军从 [Concept('concept_state', '纳瓦罗')] 领地出发，该地区由 [SCOPE.sCountry('car_scope').GetAdjective|l] 控制。\n\n战术上，他们计划穿越 [Concept('concept_state', '阿拉贡')] 至 [Concept('concept_state', '加泰罗尼亚')]，在那里集结更多 [SCOPE.sCountry('car_scope').GetAdjective|l] 军队，然后渡过埃布罗河，与马埃斯特拉斯戈的卡布雷拉军队会合。这将使军队实力足以对抗任何克里斯蒂诺军队，并确保占领 [Concept('concept_state', '马德里')] 的道路，为觊觎王位者加冕。"
esp.9.a: "[SCOPE.sCountry('car_scope').GetAdjective|l] 不能再占领一寸土地。"
esp.9.b: "我们不能分散注意力。"
esp.9.b_tt3: "[SCOPE.sCountry('car_scope').GetAdjective|l] 叛军将占领 [SCOPE.sState('aragon_español').GetStateRegion.GetName] 南部地区。"
esp.9.b_tt: "[SCOPE.sCountry('car_scope').GetAdjective|l] 将围攻 #bold 巴塞罗那#!。"
esp.9.b_tt1: "[SCOPE.sCountry('car_scope').GetAdjective|l] 叛军将在 [SCOPE.sState('valencia_español').GetStateRegion.GetName] 北部起义。"

esp.10.t: "奥斯坦德密约"
esp.10.d: "在被[SCOPE.sCountry('ocupador_flanders').GetAdjective]占领的佛兰德地区港口奥斯坦德，[SCOPE.sCharacter('agitador_esp_scope').GetFullName]已签署宣言，反对当前[ROOT.GetCountry.GetAdjective]政权。"
esp.10.f: "1866年8月16日，进步党与民主党在比利时奥斯坦德市签署密约，由胡安·普里姆将军发起，旨在推翻[ROOT.GetCountry.GetName]的伊莎贝尔二世王朝。该密约得到自由联盟支持，最终引发1868年'光荣革命'，成功罢黜女王。"
esp.10.a: "是时候推翻那个暴君了。"
conspirando1: "#variable $establidad_reinado_isabel$#! 进度条将增加#bold #red 100#!#! 点。"

esp.11.t: "共和思潮的崛起"
esp.11.d: "[GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetName]温和派在光荣革命后坚持保留[GetLawType('law_monarchy').GetName]，引发[GetIdeology('ideology_republican_leader').GetName]派系强烈不满。政治新星[SCOPE.sCharacter('ig_lider').GetFullName]已崛起为该派系领袖。"
esp.11.f: "[SCOPE.sCharacter('ig_lider').GetFullName]主张联邦制，融合蒲鲁东思想与民主社会主义。革命后出任国会议员，在应对第三次卡洛斯战争期间推行《1873联邦宪法草案》，但因政局动荡最终被迫辞职。"
esp.11.a: "刚出狼窝又入虎穴。"

esp.12.t: "[SCOPE.sState('estado_rebelde').GetStateRegion.GetCityHubName]起义"
esp.12.d: "自由派人士联合国民警卫队在[SCOPE.sState('estado_rebelde').GetStateRegion.GetName]的[SCOPE.sState('estado_rebelde').GetStateRegion.GetCityHubName]发动起义，要求恢复#bold 1812年宪法#!。"
esp.12.f: "马加拉、萨拉戈萨和巴塞罗那等地相继爆发起义，国民警卫队倒戈支持，部分军队也加入反叛行列。"
esp.12.a: "必须恢复秩序。"

esp.13.t: "[ROOT.GetCountry.MakeScope.Var('anno').GetValue|0]年宪法"
esp.13.d: "新宪法将废除#bold 1834年皇家法令#!，终结旧制度，开启[ROOT.GetCountry.GetName]新时代。"
esp.13.f: "[ROOT.GetCountry.MakeScope.Var('anno').GetValue|0]年宪法确立君主立宪制，实行财产限制选举制。虽然保留君主行政权，但确立议会制度和三权分立原则，为公民权利提供基本保障。"
esp.13.a: "我们终于完成了里戈未竟的事业。"

esp.14.t: "东部沿海叛乱"
esp.14.d: "多个驻军要塞倒戈，众多城镇开始支持卡洛斯派。"
esp.14.f: "1872年卡洛斯派宣布恢复费利佩五世废除的《新基本法令》，极大鼓舞加泰罗尼亚地区反抗势力，巴伦西亚和阿拉贡地区也出现响应。"
esp.14.a: "卡洛斯派正在壮大。"

esp.15.t: "圣伊尔德丰索宫兵变"
esp.15.d: "皇家卫队[GetPopType('officers').GetName]在塞哥维亚的圣伊尔德丰索宫发动兵变，当时[ROOT.GetCountry.GetRuler.GetFirstName]正在此处驻跸。"
esp.15.f: "在卫队军官要求下，摄政王被迫签署恢复1812年宪法的法令，并承诺召开制宪会议。"
esp.15.a: "但愿不要重蹈1823年覆辙。"
esp.15_tt: "待[Concept('concept_interest_group', '$concept_interest_groups$')|l]稳定后，新宪法将正式颁布。"

esp.16.t: "[SCOPE.sState('estado_junta').GetStateRegion.GetCityHubName]地方议会"
esp.16.d: "[GetPopType('officers').GetName]与[SCOPE.gsInterestGroup('intel_ig').GetName]派系的[GetPopType('bureaucrats').GetName]在[SCOPE.sState('estado_junta').GetStateRegion.GetName]成立地方议会，要求恢复#bold 1812年宪法#!。"
esp.16.f: "国民警卫队配合民众迅速控制[SCOPE.sState('estado_junta').GetStateRegion.GetCityHubName]政府机构，中央政令已无法在此执行。"
esp.16.a: "我们正在失去这个国家"
esp.16.tooltip: "[concept_legitimacy|l]将根据'地方议会'[concept_modifier|l]的[Concept('concept_state', '$concept_state$')|l]数量受到影响"
esp.16_tooltip2: "[SCOPE.sPoliticalMovement('movimiento_scope').GetName]施压的[concept_interest_group|l]中，#bold #red +100.0%#!#!的[Concept('concept_pop', '$concept_pops$')|l]将在[SCOPE.sState('estado_junta').GetName]转为[Concept('concept_radical', '$concept_radicals$')|l]"

esp.17.t: "军队哗变"
esp.17.d: "[SCOPE.sState('estado_isubordinacion').GetStateRegion.GetName]的[SCOPE.sBuilding('cuartel_malo').GetName]驻军发生抗命事件。"
esp.17.f: "士兵代表表示：'我们在非人条件下作战却长期欠饷'。第一次卡洛斯战争期间，政府军因军饷拖欠导致士气低落，严重影响作战效能。"
esp.17.a: "必须改善士兵待遇"
esp.17.b: "国库无力承担额外开支"
esp.17.b_tt: "[SCOPE.sState('estado_isubordinacion').GetStateRegion.GetName]的[SCOPE.sBuilding('cuartel_malo').GetName|l]驻军[concept_morale|l]将下降"

esp.18.t: "[SCOPE.sCharacter('gomez_damas').GetLastName]远征"
esp.18.d: "卡洛斯派将领[SCOPE.sCharacter('gomez_damas').GetFullName]开始战略机动，目前位于[SCOPE.sState('estado_expedicion_gomez').GetName]。"
esp.18.f: "1836年8月，该部穿越拉里奥哈地区向南推进，一度扩充至6000人。虽在阿拉塞圭战役惨败，但成功牵制政府军主力。"
esp.18.a: "必须全力追剿"
esp.18_tt: "可通过[concept_journal_entry|l]派遣[Concept('concept_general', '$concept_generals$')|l]进行围剿。"

esp.19.t: "将领人选"
esp.19.d: "政府需选定追击[SCOPE.sCharacter('gomez_damas').GetFullName]部队的指挥官。"
esp.19.f: "政府军先后投入罗迪尔、纳瓦埃斯等名将围追堵截，最多时动用2.5万兵力进行围剿。"
esp.19.a: "[SCOPE.sCharacter('expedition_leader_1').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader_1').GetFullName]"
esp.19.b: "[SCOPE.sCharacter('expedition_leader_2').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader_2').GetFullName]"
esp.19.c: "[SCOPE.sCharacter('expedition_leader_3').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader_3').GetFullName]"

esp.20.t: "民怨沸腾"
esp.20.d: "[SCOPE.sCharacter('gomez_damas').GetFullName]部队在[SCOPE.sState('estado_paseo').GetStateRegion.GetName]的劫掠行为加剧民怨，同时削弱我军在该地区战力。"
esp.20.f: "卡洛斯派持续向南渗透，所经之地冲突不断。政府公信力持续下降，君主制根基动摇。"
esp.20.a: "必须尽快解决"
esp.20.tooltip: "[concept_legitimacy|l]将受到影响。"
esp.20.tooltip_1: "[SCOPE.sCharacter('gomez_damas').GetLastName]将向其他[concept_state|l]转移。"
esp.20.tooltip2: "需在[concept_state|l]启用[GetDecreeType('decree_enlistment_efforts').GetName][concept_decree|l]增强募兵能力。"

esp.21.t: "[SCOPE.sCharacter('gomez_damas').GetFullName]伏诛"
esp.21.d: "[SCOPE.sCharacter('perseguidor').GetPrimaryRoleTitle|l] [SCOPE.sCharacter('perseguidor').GetFullName]在[SCOPE.sState('estado_captura').GetStateRegion.GetName]成功围剿卡洛斯残部。"
esp.21.f: "1836年11月阿拉塞圭战役，政府军以优势火力击溃疲惫之师，卡洛斯派南进计划彻底破产。"
esp.21.a: "终于结束了"

esp.22.t: "[SCOPE.sCharacter('mendizabal_scope').GetLastName]归国"
esp.22.d: "[SCOPE.sCharacter('mendizabal_scope').GetFullName]在[SCOPE.gsInterestGroup('intelectuales_scope').GetName]协助下秘密返回[ROOT.GetCountry.GetName]。"
esp.22.f: "这位流亡政治家通过地下网络成功潜回国内。"
esp.22.a: "真是百足之虫死而不僵"

esp.23.t: "贝加拉协定"
esp.23.d: "政府军将领[SCOPE.sCharacter('general_esp').GetFullName]与卡洛斯派将领拉斐尔·马罗托在奥尼亚特镇达成停火协议。"
esp.23.f: "双方将士放下武器自由交流，用兄弟般的拥抱为这场内战画上句号——如此充满西班牙风格的和平！"
esp.23.a: "最好的结局"

esp.24.t: "卡洛斯派死灰复燃"
esp.24.d: "流亡的卡洛斯派代表虽遭挫败却未消亡，正密谋在[ROOT.GetCountry.GetName]再度起事。"
esp.24.f: "1869年6月30日，卡洛斯派领袖发布《致阿方索王弟书》，宣称其志在君临天下而非偏安一隅。这份由安东尼奥·阿帕里西起草的檄文经地下印刷网络传播，数十万份传单如雪片般洒遍伊比利亚半岛。"
esp.24.a: "老家伙，要教你几次才学得会？"

esp.25.t: "[Concept('concept_credit', '$concept_credit_debt$')|l]债务重组"
esp.25.d: "[SCOPE.gsInterestGroup('ig_interesado').GetName]财团提出国家债务重组方案，愿就[Concept('concept_credit', '$concept_credit_debt$')|l]问题重新磋商。"
esp.25.f: "『条件很简单：贵国债务重组，我们稍作让步...』\n\n财政大臣审视着协议草案：\n『债务重组可以谈，但具体让利条款必须明晰。』\n\n对方代表扶了扶金丝眼镜：\n『涉及商业机密，还望海涵...』"
esp.25.a: "这笔买卖不亏"
esp.25.a_tt: "将获得相当于8个月的[Concept('concept_credit', '$concept_credit_debt$')|l]偿付缓冲期"
esp.25.b: "我们不需要施舍"
esp.26.t: "哈瓦那-贝胡卡尔铁路通车"
esp.26.d: "经过紧张施工，古巴第一条铁路线正式投入运营。"
esp.26.f: "1837年11月13日，首列试运行列车从哈瓦那的谢纳加车间出发，于上午10时18分抵达贝胡卡尔。这段27.5公里的铁路使古巴成为全球第七个、美洲第二个拥有铁路的国家（仅次于美国），西班牙本土直到1848年才拥有铁路。"
esp.26.a: "我们获得了宝贵经验"
esp.27.a: "火车轰鸣"

esp.28.b: "我们无能为力"
esp.28.a: "以叛国罪论处并派兵镇压"

esp.29.t: "多米尼加起义"
esp.29.d: "[SCOPE.sCountry('ocupador_santo_domingo').GetName]部队进入[SCOPE.sState('santo_domingo_scope').GetName]引发强烈反弹，北部山区已出现游击队。"
esp.29.f: "1863-1865年复国战争期间，多米尼加反抗军与西班牙殖民当局展开激烈斗争。"
esp.29.a: "必须恢复秩序"
esp.29_tt: "海地精英阶层可能加入多米尼加独立阵营"

esp.31.t: "[SCOPE.sState('estado_junta').GetStateRegion.GetCityHubName]地方议会"
esp.31.d: "[SCOPE.sPoliticalMovement('movimiento_scope').GetName]发动新革命后，驻[SCOPE.sState('estado_junta').GetName]总督已宣誓效忠革命阵营。"
esp.31.f: "国民警卫队配合起义民众迅速控制[SCOPE.sState('estado_junta').GetStateRegion.GetCityHubName]政府机构，首都[ROOT.GetCountry.GetCapital.GetCityHubName]失去对该地区的控制。"
esp.31.a: "叛徒当诛"

esp.32.t: "卡洛斯派请愿"
esp.32.d: "卡洛斯党[SCOPE.sParty('partido_carlista_scope').GetName]通过其领袖[SCOPE.gsInterestGroup('grupo_interes_pedidor').GetLeader.GetFullName]，正式提交关于[concept_law|l][SCOPE.sLaw('peticion_de_ley').GetName]的立法请愿书。"
government_petition_tt_esp: "[SCOPE.sParty('partido_carlista_scope').GetName]要求政府在五年内通过[SCOPE.sLaw('peticion_de_ley').GetName]法案"

esp.33.t: "卡洛斯派死灰复燃？"
esp.33.d: "[SCOPE.sState('estado_carlista').GetStateRegion.GetName]等北部[Concept('concept_state', '$concept_states$')|l]的不满情绪，可能引发卡洛斯派[concept_political_movement|l]重组。"
esp.33.d_ya_hay_movimiento: "尽管在上次内战中失败，卡洛斯思想仍在[ROOT.GetCountry.GetName]北部活跃，[SCOPE.sPoliticalMovement('movimiento_carlista').GetName]正秘密重组势力。"
esp.33.f: "《贝加拉协定》签署后，卡洛斯派通过《希望报》等渠道持续扩大影响力，该报曾一度成为全西班牙发行量最大的报纸。"
esp.33.a: "痴人说梦"

esp.34.t: "[SCOPE.sCountry('territorio_ultramar').GetName]议员选举"
esp.34.d: "[ROOT.GetCountry.GetName]大选结果揭晓，海外省[SCOPE.sCountry('territorio_ultramar').GetName]由[SCOPE.gsInterestGroup('grupo_seleccionado').GetName]获得多数席位，[SCOPE.gsInterestGroup('grupo_segundo_seleccionado').GetName]紧随其后。"
esp.34.f: "首府[SCOPE.sCountry('territorio_ultramar').GetCapital.GetCityHubName]城区由[SCOPE.gsInterestGroup('grupo_seleccionado').GetName]主导，农村地区则成为[SCOPE.gsInterestGroup('grupo_segundo_seleccionado').GetName]的重要票仓。"
esp.34.a: "[SCOPE.sCountry('territorio_ultramar').GetAdjective]人民已发声"

esp.35.t: "国会代表选举"
esp.35.d: "[SCOPE.sCountry('capital_central').GetName]大选结果出炉，[SCOPE.gsInterestGroup('ig_uno_scope').GetName]与[SCOPE.gsInterestGroup('ig_dos_scope').GetName]获得议会席位。"
esp.35.f: "首都[ROOT.GetCountry.GetCapital.GetCityHubName]民众热烈庆祝[SCOPE.gsInterestGroup('ig_uno_scope').GetName]代表当选，[ROOT.GetCountry.GetAdjective]人民将在国会获得话语权。"
esp.35.a: "[ROOT.GetCountry.GetAdjective]人民的选择"

esp.36.t: "邦交抉择"
esp.36.d: "我国需选择首个建交对象国，良好开端将大幅提升[concept_relations|l]。"
esp.36.f: "费尔南多七世驾崩后，西班牙国会授权与美洲新独立国家签订《和平友好条约》，正式承认其独立地位。"
esp.36.a: "[SCOPE.sCountry('pais_rebelde_1').GetAdjective]人民优先"
esp.36.b: "[SCOPE.sCountry('pais_rebelde_2').GetName]始终是兄弟之邦"
esp.36.c: "必须保障在[SCOPE.sCountry('pais_rebelde_3').GetName]的利益"
esp.36.e: "将与[SCOPE.sCountry('pais_rebelde_4').GetName]重修旧好"
esp.36.g: "[SCOPE.sCountry('pais_rebelde_5').GetName]势在必行"

esp.37.t: "马德里使团来访"
esp.37.d: "[SCOPE.sCountry('espanna_scope').GetAdjective]使团今晨抵达[ROOT.GetCountry.GetCapital.GetCityHubName]，拟签署承认我国独立的友好条约。"
esp.37.f: "根据西班牙国会决议，旧宗主国将放弃所有美洲领土主权要求，基于'不损害国家荣誉与利益'原则建立新型邦交关系。"
esp.37.a: "我们终于获得自由"
esp.37.b: "[SCOPE.sCountry('espanna_scope').GetAdjective]与[ROOT.GetCountry.GetAdjective]永为兄弟之邦"
 esp.38.t: "共和派势力抬头"
esp.38.d: "尽管[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]传统上支持王室，但主张[GetIdeology('ideology_republican').GetName]的势力正在[ROOT.GetCountry.GetName]扩大影响力。"
esp.38.f: "19世纪西班牙共和主义运动主张废除君主制，建立基于人民主权、政教分离的共和政体。该思潮在1873年第一共和国时期达到高峰，但因内部分裂未能持久。"
esp.38.a: "真是祸不单行，连共和派都冒出来了"

esp.39.t: "王室添丁"
esp.39.d: "今晨，女王[ROOT.GetCountry.GetRuler.GetFirstName]诞下王储[ROOT.GetCountry.GetHeir.GetFirstName]，未来将继承王位成为阿方索十二世。"
esp.39.f: "阿方索十二世1874-1885年在位，终结第一共和国并开启复辟时期。这位'和平缔造者'因肺结核27岁早逝，由其遗腹子阿方索十三世继位。"
esp.39.a: "愿新王储福泽绵长"

esp.40.t: "战略决策失误"
esp.40.d: "[concept_general|l][SCOPE.sCharacter('general_cagada_scope').GetFullName]在追击敌军过程中犯下重大战术错误，将导致严重后果。"
esp.40.f: "埃斯帕特罗将军部队因情报失误错失战机，其麾下'饥寒交迫、纪律涣散'的军队虽兵临马德里城下，却未能把握破城良机。"
esp.40.a: "[SCOPE.sCharacter('general_cagada_scope').GetFullName]必须为此付出代价"

esp.41.t: "圣多明各回归提案"
esp.41.d: "[Concept('concept_ruler', '$RULER_TITLE_PRESIDENT$')|l][SCOPE.sCountry('ocupador_santo_domingo').GetRuler.GetFullName]正式请求将[SCOPE.sCountry('ocupador_santo_domingo').GetName]并入[ROOT.GetCountry.GetName]，[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]对此欢欣鼓舞。"
esp.41.f: "提案要点包括：禁止奴隶制、宗教自由、贸易开放、预算审议权等七项条款，承诺给予行省地位。"
esp.41.a: "是时候纠正历史错误了"
esp.41.b: "我们对[SCOPE.sCountry('ocupador_santo_domingo').GetName]另有规划"

esp.42.t: "[SCOPE.sCountry('spa_scope').GetName]接纳决议"
esp.42.d: "[SCOPE.sCountry('spa_scope').GetRuler.GetFullNameWithTitle]发表热情演讲，同意将[ROOT.GetCountry.GetName]作为海外省并入。"
esp.42.f: "'多米尼加人民在危难中呼唤文明母邦，西班牙岂能袖手旁观？'——伊莎贝尔二世在国会开幕式上的兼并演说"
esp.42.a: "在[SCOPE.sCountry('spa_scope').GetName]支持下我们必将振兴"

esp.43.t: "[SCOPE.sCountry('spa_scope').GetName]拒绝提案"
esp.43.d: "[SCOPE.sCountry('spa_scope').GetRuler.GetFullNameWithTitle]否决了兼并提案，[ROOT.GetCountry.GetName]陷入孤立无援境地。"
esp.43.f: "'在未充分研究政府行为之前，我们无法对此事作出评判'——庞顿子爵在众议院的质疑发言"
esp.43.a: "至少我们尽力而为了"

esp.44.t: "[ROOT.GetCountry.GetRuler.GetFirstName]大婚争议"
esp.44.d: "内阁提议女王下嫁性格懦弱的#yellow 弗朗西斯科·德·阿西斯亲王#!，另有派系主张与卡洛斯派继承人联姻。"
esp.44.f: "'宫廷最大谜题：亲王如厕时究竟站着还是坐着？'——《马德里公报》讽刺诗\n'新婚夜他穿的蕾丝比我还多！'——女王私下抱怨"
esp.44.a: "不能得罪[concept_government|l]"
esp.44.b: "绝不下嫁此人"
esp.44_tt: "[ROOT.GetCountry.GetRuler.GetFirstName]或将另寻新欢，可能诞生历史性的[concept_heir|l]"
esp.44.c: "选择与卡洛斯派联姻"

esp.45.t: "财税改革——废除封建税制"
esp.45.d: "[ROOT.GetCountry.GetAdjective]仍沿用阿拉贡王国时期的封建税法，严重阻碍经济发展。"
esp.45.f: "新税法遵循统一、充足、普遍原则，旨在打破地区壁垒建立全国统一市场。"
esp.45.a: "旧制度必须改革"
esp.45.b: "不能放弃传统税法"

esp.46.t: "财税改革——清理重复征税"
esp.46.d: "[ROOT.GetCountry.GetAdjective]税制混乱，存在国内关税、教会什一税等多重盘剥。"
esp.46.f: "财政大臣强调：'新税制必须提高直接税比重，消除阻碍内部贸易的陈旧税目'"
esp.46.a: "必须统一税制"
esp.46.b: "与[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]和[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]协商"
esp.46.c: "工程浩大需从长计议"

esp.47.t: "财税改革——消费税争议"
esp.47.d: "[SCOPE.gsInterestGroup('ministro_ig_scope').GetName]派系财相强推[concept_budget_consumption_taxes|l]，[concept_lower_strata|l]民生将受重创。"
esp.47.f: "新税涵盖烟草、食盐、酒类、橄榄油等生活必需品，被讽'连空气都要征税'。"
esp.47.a: "必须通过法案"
esp.47.b: "取消基本商品消费税"
esp.47.c: "谨防重蹈法国大革命覆辙"

esp.48.t: "海军现代化改革"
esp.48.d: "海军大臣[SCOPE.sCharacter('admirante_de_fuerzas_armadas').GetFullName]要求全面改革海军，应对[SCOPE.sCountry('enemigo_naval').GetName]对海外领的威胁。"
esp.48.f: "1858-1863年海军复兴运动中，商业资产阶级与自由派精英推动西班牙皇家海军现代化，试图重塑国际强国地位。"
esp.48.a: "需统筹考虑可行性"
 esp.49.t: "革命派归顺"
esp.49.d: "经与反对派快速谈判，革命势力已同意加入反政府阵营。"
esp.49.f: "[SCOPE.gsInterestGroup('ig_revolucionario').GetName]接受参与新宪政进程，承诺遵循国家主权唯一原则与普选制度。"
esp.49.a: "至少避免了内战"
esp.49_tt: "#variable $establidad_reinado_isabel$#! 进度条将增加#bold #red 200#!#! 点"

esp.50.t: "放弃拉美主权主张"
esp.50.d: "[concept_government|l]经审议决定，不再主张恢复西班牙在拉丁美洲的殖民统治。"
esp.50.f: "1836年12月17日，西班牙政府正式发布敕令，承认拉美诸国独立地位，为后续签署双边条约扫清障碍。"
esp.50.a: "必须告别殖民旧梦"
esp.50_tt: "可开始与[Concept('concept_country', '$concept_countries$')|l]拉美国家签署友好条约"

esp.51.t: "卡洛斯派死灰复燃"
esp.51.d: "[ROOT.GetCountry.GetName]境内宣布成立新的[SCOPE.sPoliticalMovement('movimiento_carlista_scope').GetName]，虽暂未成气候但需警惕。"
esp.51.f: "1868年革命后，卡洛斯七世借势吸纳保守派势力，主张恢复天主教传统价值观，1871年议会选举中跃居第三大政治力量。"
esp.51.a: "必须加强监控"

esp.52.t: "新任内阁总理大臣"
esp.52.d_default: "[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]解除[SCOPE.sCharacter('mendizabal_scope').GetLastName]职务，任命[SCOPE.sCharacter('nuevo_presidente_consejo').GetLastName]接任。"
esp.52.d: "$esp.52.d_default$"
esp.52.d.rey_hombre: "$esp.52.d_default$"
esp.52.f: "1836年9月，激进派门迪萨瓦尔因军事失利遭解职，温和派伊斯特里兹接任总理大臣开启政策回调。"
esp.52.a: "望不负所托"

esp.53.t: "[ROOT.GetCountry.GetRuler.GetFullName]转向温和"
esp.53.d: "经历1835年革命动荡，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]政治立场向[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]倾斜。"
esp.53.f: "为抗衡卡洛斯派，王室不得不向[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]妥协，开启西班牙旧制度终结进程。"
esp.53.a: "且看进步派如何应对"
esp.53_tt: "当[concept_ruler|l]具备[GetIdeology('ideology_moderado').GetName]属性时，[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]更倾向选择温和派[Concept('concept_leader', '$concept_leaders$')|l]"

esp.54.t: "教会土地国有化"
esp.54.d: "历经激烈辩论，[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]土地没收法案终获通过，但拍卖过程被[GetPopType('aristocrats').GetName]垄断。"
esp.54.f: "市政委员会操纵土地分割程序，制造中小农户难以竞购的大地块，最终九成土地落入贵族与城市资产阶级之手。"
esp.54.a: "国库急需资金注入"
esp.54.b: "限制[GetPopType('aristocrats').GetName]购地资格"

esp.55.t: "土地改革法案流产"
esp.55.d: "[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]土地国有化提案遭议会否决。"
esp.55.f: "- 真不敢相信，阿尔瓦罗！他们之前对门迪萨瓦尔的没收计划寄予厚望，现在全完了。\n- 早就料到会这样，佩德罗。这个提案从一开始就四面树敌。"
esp.55.a: "[SCOPE.sCharacter('lider_intelectual_scope').GetLastName]大臣引咎辞职"
esp.55.b: "[ROOT.GetCountry.GetRuler.GetCustom('getMsMr')][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]试图挽救危局"
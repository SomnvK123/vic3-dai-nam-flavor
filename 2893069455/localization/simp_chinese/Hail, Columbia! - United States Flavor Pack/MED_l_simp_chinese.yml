 Mexican_American_war:0 "美墨战争"
 america_flavor.1.t:0 "德克萨斯申请加入联邦"
 america_flavor.1.d:0 "德克萨斯加入联邦"
 america_flavor.1.f:0 "圣哈辛托战役以墨西哥惨败而告终。德克萨斯总统休斯顿已经迫不及待地向联邦政府递交了申请，现在只需要华盛顿的一笔签名就可以正式确立德克萨斯州的合法地位"
 america_flavor.1.a:0 "联邦欢迎你"
 Texas_join:0 "德克萨斯加入联邦"
 landowners_against_2:0 "南方地主反对"
 je_MED_acw_countdown:0 "奴隶制存废之争论"
 je_MED_acw_countdown_status:0 "试着解决废奴派与蓄奴派之间的争论。\n#N 除非有强硬的反蓄奴者上台，否则南方地主不会在废奴上做出任何让步#!"
 je_MED_acw_countdown_reason:1 "拥有奴隶的人和废奴主义者目前正在全国范围内`进行一场愈发激烈的争论。迟早有一天，双方会开始用子弹表达意见。"
 je_MED_acw_countdown_complete:0 "美国内战爆发。"
 je_MED_acw_countdown_goal:0 "以下条件必须满足10年："
 ncw_mde.2.t:0 "《汤姆叔叔的小屋》出版"
 ncw_mde.2.d:0 "斯托夫人是哈特福德女子学院的一名教师，也是一名积极的废奴主义者。\n美国政府通过的第二部《逃亡奴隶法》，将协助奴隶逃亡定为非法行为并且予以惩处，为了回应这部法律，斯托夫人写成了这部小说。"
 ncw_mde.2.f:0 "“朋友们，我在他的坟墓前向上帝保证：我不会再让家里有一个黑奴，我会想尽办法使奴隶们获得自由，没有人会由于我的意图而离妻别子，飘零异地，像汤姆那样客死他乡。所以当你们激情欢悦的时候，不要忘了汤姆，因为这一切都归功于他那善良的心埃请照顾他的妻儿来报答他的深情厚谊吧。当你们看到汤姆叔叔的小屋时，要把它看成一块纪念碑，纪念他诚信、忠厚、笃信基督的精神。希望他的精神指引你们去努力、沿循着他的步伐前进。”\n——斯托夫人《汤姆叔叔的小屋》"
 ncw_mde.2.a:0 "每一个共和国公民都应该看看这本书！"
 ncw_mde.2.b:0 "这位斯托夫人根本就没有去过南方！"
 ig_slavers_angry:0 "南方奴隶主愤怒"
 ncw_mde.3.t:0 "林肯参选总统"
 ncw_mde.3.d:0 "自“废奴运动”以来，南方和北方的矛盾已经日益尖锐。新兴共和党代表亚伯拉罕·林肯是一个坚决的废奴主义者并有着很高的支持率。如果成功当选总统可能会推动废奴的彻底进行，但势必会进一步激起南方人不满"
 ncw_mde.3.f:0 "“人人生而平等”"
 ncw_mde.3.a:0 "废奴势在必行！"
 ncw_mde.3.b:0 "这个男人只会加剧分裂！"
 ncw_mde.4.t:0 "南卡罗莱纳脱离联邦"
 ncw_mde.4.d:0 "南卡罗来纳州通过法令，宣称“以美利坚合众国的名义存在于南卡和其他州之间的联盟”就此解散。"
 ncw_mde.4.f:0 "战争迫在眉睫"
 ncw_mde.4.a:0 "他们这是非法行为！"
 ncw_mde.5.t:0 "蓄奴州加入联盟国"
 ncw_mde.5.d:0 "其他南方州纷纷退出联邦，并开始夺取位于各州界内的联邦资产。绝大部分是前支持蓄奴的州，他们声称联邦政府已经失去公信并开始动员武装"
 ncw_mde.5.f:0 "战争迫在眉睫"
 ncw_mde.5.a:0 "他们这是非法行为！"
 ncw_mde.6.t:0 "解放奴隶宣言"
 ncw_mde.6.d:0 "由于奴隶制的支持者已经掀起叛乱，我们可以签发宣言，解放叛乱领土上的所有奴隶。这是完全废奴的第一步，也是最重要的一步。"
 ncw_mde.6.f:0 "“依宪法授予的权力，在现今武装反叛政府时期，我命令并宣布，所有被视作奴隶的人立获自由并于以后永保自由。这一个行动，我请求人类对之详加审鉴，上帝为之赐福。”"
 ncw_mde.6.a:0 "此笔落下，我们便能拯救联邦！"
 ncw_mde.7.t:0 "更多蓄奴州倒向联盟国"
 ncw_mde.7.d:0 "林肯亲自书写并发表声明，宣布南方7州发生了违反美国法律的叛乱。总统令使仍留在联邦的8个蓄奴州被激怒，迫使弗吉尼亚、北卡、田纳西和阿肯色州加入了南方。"
 ncw_mde.7.f:0 "战争迫在眉睫"
 ncw_mde.7.a:0 "背叛！"
 ncw_mde.8.t:0 "内战爆发！"
 ncw_mde.8.d:0 "战争已然无法避免，我们只能武力解决这群谋求独立的南方势力。"
 ncw_mde.8.f:0 "南方武装反叛的政府只有一个结局——那就是被消灭！"
 ncw_mde.8.a:0 "拿起武器！"
 dp_america_civil_war:0 "美国内战"
 america_civil_war:0 "南北战争"
 Emancipation_Proclamation:0 "签署《解放奴隶宣言》"
 Emancipation_Proclamation_desc:0 "南北战争爆发后，相当多的黑奴自愿为自身自由而协助联邦作战，但对如何处理占领地黑奴观点上仍有所冲突。林肯一开始收回某些将军自行发布的解放黑奴命令，而此政策严厉执行则造成逃亡黑奴必须回到他们南方主子那儿，但1862年3月13日邦联政府禁止所有联邦军指挥官遣返逃亡黑奴，如此影响了《1850年逃亡奴隶法》的废除。"
 ned_acw_push:0 "这将会#P 推动#!废奴进程"
 ned_acw_pull:0 "这将会#N 减少#!废奴进程"
 incorporated_new_states:0 "整合所有新加入的州"
 incorporated_new_states_south:0 "仅会整合南方州"
 ncw_mde.9.t:0 "自由州？蓄奴州？"
 ncw_mde.9.d:0 "随着联邦的扩张，更多的州加入了美利坚合众国，但是关于奴隶制的存废却引发了不小的争论，北方州希望有更多的自由州出现而南方则想要保留蓄奴州"
 ncw_mde.9.f:0 "被大段南北走向的山脉所分割的大西洋延岸的低地和密西西比平原是美国奴隶制的家园。插在两平原中的山区，适于多种产业的发展，是自由民的地区。奴隶制在这里没有根基。在边境州内，生活在这些高地上的自由民构成了边境州人口的大多数。"
 ncw_mde.9.a:0 "允许所有新州保留蓄奴制"
 ncw_mde.9.b:0 "36°30’为分界线,南部州保留奴隶制，北部州成为自由州"
 ncw_mde.9.c:0 "所有新加入的州都将成为自由州"
 ned_acw_push_huge:0 "这将会#P 大幅推动#!废奴进程"
 ned_acw_pull_huge:0 "这将会#N 大幅减少#!废奴进程"
 ncw_mde.10.t:0 "《逃奴法案》"
 ncw_mde.10.d:0 "1850年联邦政府通过了《逃奴法案》，该法案将允许抓捕者可以进入自由州境内，去带回那些从蓄奴州逃出的奴隶。"
 ncw_mde.10.f:0 "“他们被迫离开他们的家庭，从各个方向奔赴加拿大，在英王的旗帜下，寻求被‘自由共和国’抛弃的自由。”\n——多伦多报纸的评论"
 ncw_mde.10.a:0 "人道主义的灾难！"
 ncw_mde.10.b:0 "英明的举措！"
 ncw_mde.11.t:0 "参议院的袭击案"
 ncw_mde.11.d:0 "共和党参议员查尔斯·索姆奈在参议院发表废奴演讲时，被民主党众议员普雷斯顿·布鲁克斯被袭击并受重伤，这段事迹迅速引起了全国性的舆论关注。"
 ncw_mde.11.f:0 "“听说索姆奈的头部伤的很重，他可能需要许多年才能恢复，甚至...恢复不了”\n“那布鲁克斯被惩罚了吗？”\n“布鲁克斯？南方人把他奉为英雄，还给他送来了几十根新手杖”"
 ncw_mde.11.a:0 "真该死，必须谴责这般暴力的袭击行为！"
 ncw_mde.11.b:0 "布鲁克斯只不过是在捍卫他的权利罢了！"
 ncw_mde.12.t:0 "斯科特案"
 ncw_mde.12.d:0 "来自蓄奴州密苏里的黑奴斯科特，曾跟随主人前往自由州伊利诺伊与威斯康辛居住过四年，后随主人回到密苏里。当主人去世后，斯科特上诉要求获得自由身，但先后被密苏里法院与联邦法院驳回，最终在1857年由最高法院宣布维持原判并驳回上诉。"
 ncw_mde.12.f:0 "即便自由的黑人也不是《美国宪法》中所指的公民，所以斯科特无权在联邦法院提起诉讼。\n——罗杰·坦尼，联邦首席大法官"
 ncw_mde.12.a:0 "法院没有保护公民，而是在践踏公民的平等权与人权！"
 ncw_mde.12.b:0 "这一判决是对南方各州权的肯定！"
 ncw_mde.13.t:0 "约翰·布朗之死"
 ncw_mde.13.d:0 "一位狂热的废奴主义者，约翰·布朗在弗吉尼亚州的哈铂斯费里发动了起义，但海军陆战队迅速的瓦解了这次叛乱并抓获了约翰，而在2个月后，约翰被宣判执行死刑。"
 ncw_mde.13.f:0 "在联邦内的一个州，竟有必要让五千名士兵围住一个将被处死之人的绞刑架。而为了纪念他，其他州的教堂钟声与教会信徒的祈祷声，也在他去世的同一时刻响起。可以肯定的是，这真是件让人感到奇怪而可悲的事情。\n——“约翰布朗的死刑”《纽约时报》"
 ncw_mde.13.a:0 "我们应当继承布朗的遗志！"
 ncw_mde.13.b:0 "一位乱臣贼子被正义的处决了！"
 ncw_mde.14.t:0 "重建国家"
 ncw_mde.14.d:0 "军事的战斗虽已结束，为了国家精神的斗争却没有终结。美利坚合众国必须在裂为两半之后自我重建。"
 ncw_mde.14.f:0 "“我不愿意见到这个国家分崩离析。不论是受到欢迎还是被人厌恶，不论是彻底成为了一个事物还是全部成为了另一个事物，这个国家一定要终止其身体与灵魂上的分裂。”"
 ncw_mde.14.a:0 "我们再次合众为一"



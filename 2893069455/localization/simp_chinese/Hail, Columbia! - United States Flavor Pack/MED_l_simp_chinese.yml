ncw_event.7.t:0 "南北内战"
ncw_event.7.d:0 "[SCOPE.sCountry('usa_scope').GetName]内战愈演愈烈"
ncw_event.7.f:0 "来自我们在美国的外交使节的消息：因奴隶制的废存问题而导致[SCOPE.sCountry('usa_scope').GetName]南北各州之间爆发了激烈的冲突，美国林肯总统宣布南方各州的独立都违反了美国联邦宪法"
ncw_event.7.a:0 "这是美国人内部的事。"
ncw_event.7.b:0 "我们会保护南方联盟的自由事业。"
#夏威夷JE和事件

je_hawaii_usa: "夏威夷的吞并"
je_hawaii_usa_status: "获得夏威夷群岛。"
je_hawaii_usa_reason: "几十年来，我们一直对夏威夷群岛充满兴趣。自世纪之交以来，夏威夷在捕鲸和甘蔗生产方面展现了巨大的潜力。在内战期间，夏威夷是我们最大的糖类贸易伙伴。如今，许多美国殖民者已在夏威夷建立了大规模的种植园，种植着大量现金作物和等待进入我们市场的异国水果。\n\n现在，是时候做出选择了：夏威夷群岛是应该由其他国家控制，还是由我们来掌控？"
je_hawaii_usa_annexed.tt: "要么我们已经征服了夏威夷群岛，要么君主制已经被推翻。"
hawaii_reconstruction_over: "重建时代已经过去。"

usa_hawaii.1.t: "纽兰决议"
usa_hawaii.1.d: "来自[SCOPE.sState('newlands_state').GetName]的国会议员草拟了一项决议，提交国会审议，关于[SCOPE.sState('hawaiian_islands').GetName]的事情。该决议宣布将[SCOPE.sCountry('hawaii').GetNameNoFlag]吞并入[SCOPE.sCountry('united_states').GetNameNoFlag]，并将其组织为一个未合并的领土。"
usa_hawaii.1.f: "“鉴于[SCOPE.sCountry('hawaii').GetNameNoFlag]政府已根据其宪法规定，以正式形式表示同意，完全无保留地将所有主权权利转让给[SCOPE.sCountry('united_states').GetNameNoFlag]...”"
usa_hawaii.1.a: "夏威夷群岛是我们的！"

usa_hawaii.2.t: "夏威夷群岛上的紧张局势"
usa_hawaii.2.d: "我们收到了报告，描述了[SCOPE.sState('hawaiian_islands').GetName]上的紧张局势。一个所谓的“安全委员会”已在这个小国成立，由[SCOPE.sCharacter('sanford_dole').GetFullName]领导，并且据称该委员会正在策划一场针对[SCOPE.sCountry('hawaii').GetNameNoFlag]的革命，企图获得[SCOPE.sCountry('united_states').GetAdjectiveNoFlag]的支持。"
usa_hawaii.2.f: "“我们需要密切关注这一局势。夏威夷代表了一个未开发的黄金机会，位于太平洋。”"
usa_hawaii.2.a: "一个有趣的发展。"
usa_hawaii_tensions.tt: "夏威夷的紧张局势将继续升级。"
Sanford_B: "桑福德·B"

usa_hawaii.3.t: "[SCOPE.sCulture('yankee').GetName]定居者在[SCOPE.sState('hawaiian_islands').GetName]"
usa_hawaii.3.d: "大量的[SCOPE.sCulture('yankee').GetName]定居者开始在[SCOPE.sState('hawaiian_islands').GetName]上建立农场和种植园。他们引入了先进的农业技术，并开始种植大量的经济作物，尤其是甘蔗和菠萝，推动了夏威夷的经济增长。然而，随着越来越多的定居者到来，原住民和新移民之间的紧张关系也在加剧。"
usa_hawaii.3.f: "“夏威夷的未来将充满挑战，但也充满机遇。我们将如何管理这些新移民与原住民之间的关系，决定了未来岛屿的命运。”"
usa_hawaii.3.a: "这将是我们面临的最大考验：如何平衡发展和人道主义问题，确保夏威夷的长期稳定和繁荣。"

usa_hawaii.4.t: "夏威夷的叛乱"
usa_hawaii.4.d: "随着不满情绪的积累，一些夏威夷本土居民与部分反对现状的定居者联合起来，发起了针对夏威夷政府的暴力抗议。抗议者要求恢复夏威夷独立，抵制美方的殖民统治。局势逐渐升温，夏威夷的治安形势严峻。部分叛乱分子甚至宣称如果美国继续控制，夏威夷将不再是一个自由的土地。"
usa_hawaii.4.f: "“我们必须行动起来，确保岛屿的稳定，维护我们的利益和发展。”"
usa_hawaii.4.a: "我们应该关注这一点，确保夏威夷的局势不进一步恶化，并保护岛屿的经济和政治稳定。"

if_hawaii.tt: "如果安全委员会宣布成立共和国，我们将采取行动确保掌控这些岛屿。"
acw_war_fail_ttt_complete: "分离主义者存在，且我们与他们有停战协议（没有停战协议可言，联邦必须统一！）"






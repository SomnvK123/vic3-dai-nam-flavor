l_simp_chinese:
 COM:0 "科曼奇利亚"
 je_acw_countdown:0 "兄弟阋墙"
 je_acw_countdown_reason:0 "拥有奴隶的人和废奴主义者目前正在全国范围内进行一场愈发激烈的争论。迟早有一天，双方会开始用子弹表达意见。"
 acw_events.3.t:0 "[SCOPE.sCharacter('wilmot_proviso_ig_leader').GetLastName]但书"
 acw_events.3.d:0 "[SCOPE.sCharacter('wilmot_proviso_ig_leader').GetFullName]，[SCOPE.gsInterestGroup('wilmot_proviso_ig').GetName]的领袖，提出法案在我们所有新的西部领土上完全禁止奴隶制。某些反对者仅要求妥协，但其他人要求在所有新领土上合法化奴隶制。"
 acw_events.3.f:0 "“这种不可容忍的制度决不能再进一步散播其影响范围！自由的国家必须要有自由的土壤才能繁荣！”"
 acw_events.3.a:0 "驳回但书"
 acw_events.3.b:0 "接受但书，在西部废除奴隶制。"
 acw_events.3.c:0 "驳回但书，在西部扩张奴隶制。"
 acw_je_events.2.t:0 "重建国家"
 acw_je_events.2.d:0 "军事的战斗虽已结束，为了国家精神的斗争却没有终结。[ROOT.GetCountry.GetName]必须在裂为两半之后自我重建。"
 acw_je_events.2.f:0 "“我不愿意见到这个国家分崩离析。不论是受到欢迎还是被人厌恶，不论是彻底成为了一个事物还是全部成为了另一个事物，这个国家一定要终止其身体与灵魂上的分裂。”"
 unreconstructed_state:0 "未重建地区"
 acw_je_events.2.a: "南方必须重新成为我国的一部分。"
 acw_je_events.2.b: "我们需要向北方作出补偿。"
 acw_je_events.2.c: "南方必须接受奴隶制的终结。"
 acw_je_events.2.g: "我们从未打算干涉南方人的生活方式。"
 acw_je_events.3.t:0 "国家重建"
 acw_je_events.3.d:0 "我国已重建，焕然一新，合众为一。"
 acw_je_events.3.f:0 "“正因为我们所有的过错，我们已重塑我国，为我们创建了一个不会从这片土地上消亡的政府。”"
 acw_je_events.3.a:0 "我们再次合众为一。"
 je_indian_removal:1 "印第安人迁移"
 je_indian_removal_reason:2 "定居者希望切罗基人搬出他们觊觎已久的土地。总统无视了最高法院，命令切罗基人迁移到西部的印第安领地。"
 native_resettlement.2.t:1 "约翰·罗斯的抗议请愿"
 native_resettlement.2.d:1 "[SCOPE.sCountry('cherokee_scope').GetRuler.GetFullName][SCOPE.sCountry('cherokee_scope').GetRuler.GetPrimaryRoleTitle]向[concept_usfp_congress]提交了一份请愿书，要求他们废除该条约，该条约将迫使[SCOPE.sCulture('cherokee_culture').GetName]族迁往[SCOPE.sCountry('indian_territory_scope').GetName]。他请愿书上的签名几乎和整个东部切罗基人一样多。"
 native_resettlement.2.f:0 "“根据该条约的规定，我们被剥夺了自由的一切属性。我们的财产可能在我们眼前被掠夺；我们的人民可能遭受暴力，甚至我们的生命可能被剥夺，且没有人理会我们的抱怨。我们被剥夺了国籍；我们被剥夺了选举权。我们被剥夺了人类大家庭的成员资格！”"
 native_resettlement.2.a:0 "条约就是条约。我们不能撤销已经签署的条约。"
 native_resettlement.2.b:0 "我们的良知驱使我们废除迁移条约。"
 native_resettlement.3.t: "切罗基人迁移"
 native_resettlement.3.d:1 "根据迁移条约，是时候让[SCOPE.sState('indian_removal_state').GetName]的[SCOPE.sCulture('cherokee_culture').GetName]人迁移到[SCOPE.sCountry('indian_territory_scope').GetName]了。一些钉子户拒绝离开家乡，还有许多人旅行装备不足。"
 native_resettlement.4.t:0 "血泪之路"
 native_resettlement.4.d:1 "我们从东部土地驱逐[SCOPE.sCulture('cherokee_culture').GetName]人的行动导致许多人在向西方行进的过程中死亡。"
 native_resettlement.4.f:0 "“麻疹、霍乱、饥饿——这次迁移给我们的人民建立了一条血泪与死亡之路。”"
 native_resettlement.4.a:2 "我们已经尽力了。"
 native_resettlement.4.b:2 "我们手上有他们的血。"
 native_resettlement.5.t:0 "清理东部"
 native_resettlement.5.d:1 "文明化五部族已迁移到了[SCOPE.sCountry('indian_territory_scope').GetName]。无论是好是坏，这件事已经了解了。"
 native_resettlement.5.f:0 "“谁在我们来之前住在这里？他们给这个地方起了什么名字？我们中有人知道吗？还有人记得吗？”"
 native_resettlement.5.a:0 "让我们祈祷这种事永远不要再发生了。"
 native_resettlement.6.t:0 "文明化部族"
 native_resettlement.6.d:1 "随着[SCOPE.sLawType('pronativelaw').GetName]法律的通过，《印第安人迁移法》被废除，五大文明的遗民可以自由地生活在祖先的土地上。"
 native_resettlement.6.f:0 "诗人必将高声赞颂你，\n在变动的民数中告诉世界人们曾怎样\n癫狂地嘲弄你，驱赶你！\n克服了嘲笑、匮乏与困窘，\n你民族的精神最终将梦想实现，\n他们怎样尊敬都不会过分。"
 native_resettlement.6.a:0 "我们避免了惨剧的发生。"
 indian_removal_end: "如果我们不中止迁移，切罗基人将被强制驱赶，死伤无数。"
 acw_followup_events.5.t:0 "[SCOPE.sState('supremacist_violence_state').GetName]的种族至上主义暴力"
 acw_followup_events.5.d:0 "白人暴徒和黑人释奴间的暴力导致了[SCOPE.sState('supremacist_violence_state').GetName]中的严重紧张局势。"
 acw_followup_events.5.f:0 "“暴徒们无情地重踏、踢击和棒打他人。街道因为无辜者的血而变得滑溜溜的。射空的左轮手枪当啷砸在地上，因为攻击已经变得如此狂乱，人们都不再费心去装弹。直到戒严令宣告、军队开进之后，秩序的假象才得到恢复。”"
 acw_followup_events.5.a:0 "使用政府的全部实力去保护释奴。"
 acw_followup_events.5.b:0 "我们不能派遣部队去疏远当地领袖。"
 acw_followup_events.6.t:0 "《黑人法典》"
 acw_followup_events.6.d:0 "由前联盟国分子和联盟国同情者组成的临时政治联盟通过光彩或不光彩的手段赢得了[SCOPE.sState('redeemer_state').GetName]州政府的控制权，威胁到了正在进行的南方重建进程。"
 acw_followup_events.6.f:0 "“画出一条线，线的一边是智慧、美德、自尊和民主；而线的另一边是残暴和恐怖之下的绝对无约束政治霸权，你在这里看不到任何自由政府的特征，只有老南方最可悲的暴政，绝望地想要扒回那一度毒害大地的权力。”"
 acw_followup_events.6.a:0 "我们必须尊重选举结果。"
 acw_followup_events.6.b:0 "逮捕这些人，扶植新的州政府。"
 je_acw_reconstruction:0 "重建"
 je_acw_reconstruction_status:1 "在内战分裂后重建国家。"
 je_acw_reconstruction_goal:0 "重建先前参与叛乱的州（填满进度条）。"
 je_acw_reconstruction_reason:0 "既然内战已经结束了，是时候让那些脱离联邦的州重新加入联邦了。\n\n重建进度条会通过事件和按钮进行波动。除此之外，如果政府执政集团里有任意#yellow 废奴主义者#!、#yellow 激进废奴主义者#!、#yellow 进步主义者#!、#yellow 人道主义者#!的领袖，该进度每月增加1点；如果政府执政集团里有#yellow 蓄奴主义者#!，或者#yellow 南方种植园主#!处在政府执政集团里，该进度每月减1点\n\n如果重建结束前，已制定了#yellow 文化排斥#!或者#yellow 文化多元#!法律，我们有机会接纳#yellow 非裔美利坚#!文化公民（获得其主流）"
 je_acw_reconstruction_status_radical: "#bold 自由民#!正在维护他们在社会中的新权利和地位。"
 je_acw_reconstruction_status_mixed: "南部州的重建工作仍然存在激烈争议"
 je_acw_reconstruction_status_failure: "白人至上主义者加强对南方的控制。"
 acw_war_tt_complete:0 "分离主义者被击败，领土随之收回。"
 acw_war_support_tooltip: "[SCOPE.sCountry('csa_scope').GetName]认为他们的战斗意志可以超越我们。在战斗中击败他们将#italic 增加#!他们的[concept_war_support]，直到他们完全[Concept('concept_occupation', '$concept_occupied$')]"

 dlc_usfp_desc: "欢呼吧，哥伦比亚，幸福的土地！1836年的美国实验犹如自由民主的灯塔，然而奴隶制与公民权问题引发的内部分歧正愈演愈烈。当这个国家开启大陆开拓之路，迈向工业繁荣之际，美利坚合众国正孕育着成为史无前例的世界强权的潜力。您将引领共和国穿越内战的血火、重建时期的阵痛、镀金时代的浮华与进步时代的革新。从东岸到西陲贯彻领土主张，亲手铸就属于您的昭昭天命。"

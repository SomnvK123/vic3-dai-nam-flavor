je_usfp_american_constitution: "美利坚合众国宪法"
je_usfp_american_constitution_reason: "宪法是[ROOT.GetCountry.GetName]的最高和根本法律. 除了确定州和联邦政府的结构外, 它还规定了公民的各种不可剥夺的权利，名义上限制了国家政府的权力.\n\n#bold 以下规则生效:#!\n• 尝试 [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact$')] #tooltippable;tooltip:[Country.GetTooltipTag],usfp_unconstitutional_laws 违宪法律#! [Concept('concept_law', '$concept_laws$')] 将引发愤怒和法律挑战.\n• 只有 #tooltippable;tooltip:[Country.GetTooltipTag],usfp_natural_born_citizens 本国出生的公民#! 有资格当选 [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')].\n• 政府不能征收 [Concept('concept_trade', '$concept_exports$')] [concept_tariffs] ." 
usfp_unconstitutional_laws: "违宪的 [Concept('concept_law', '$concept_laws$')]:\n• [GetLawType('law_censorship').GetName]\n• [GetLawType('law_peasant_levies').GetName]\n• [GetLawType('law_parliamentary_republic').GetName]\n• [GetLawType('law_militarized_police').GetName]\n• [GetLawType('law_appointed_bureaucrats').GetName]\n• [GetLawType('law_industry_banned').GetName]\n• [GetLawType('law_command_economy').GetName]\n• [GetLawType('law_industry_banned').GetName]\n• [GetLawType('law_cooperative_ownership').GetName]\n• [GetLawType('law_religious_schools').GetName]\n• [GetLawType('law_single_party_state').GetName]\n• [GetLawType('law_isolationism').GetName]\n• [GetLawType('law_land_based_taxation').GetName]\n\n#italic 严重#! 违宪的 [Concept('concept_law', '$concept_laws$')]:\n• [GetLawType('law_outlawed_dissent').GetName]\n• [GetLawType('law_state_religion').GetName]\n• [GetLawType('law_state_atheism').GetName]\n• [GetLawType('law_monarchy').GetName]\n• [GetLawType('law_theocracy').GetName]\n• [GetLawType('law_council_republic').GetName]\n• [GetLawType('law_autocracy').GetName]\n• [GetLawType('law_oligarchy').GetName]\n• [GetLawType('law_anarchy').GetName]\n• [GetLawType('law_technocracy').GetName]\n• [GetLawType('law_hereditary_bureaucrats').GetName]"
usfp_natural_born_citizens: "一个 [concept_character] 如果他的 [concept_culture] 是我们的 [concept_primary_cultures] 之一, 或者属于我们任意一个 [Concept('concept_incorporated_state', '$concept_incorporated_states$')] 的 [concept_homeland] 文化，并且接纳水平至少为 @acceptance_status_3! $open_prejudice$.\n\n 美洲原住民文化 [concept_cultural_heritage_trait] 要求基本接纳水平至少为 @acceptance_status_4! $second_rate_citizen$ #italic (也许需要 [GetLawType('law_multicultural').GetName] 实现美洲原住民竞选总统)#!"
 usfp_emancipation_proclamation_button: "解放奴隶"
 usfp_emancipation_proclamation_button_desc: "战时的紧急情况为我们提供了解放叛乱地区奴隶的机会，为废除奴隶制铺平了道路。"
 usfp_indian_removal_seminole_button: "塞米诺尔迁移开始"
 usfp_indian_removal_seminole_button_desc: "塞米诺尔人公然反抗《印第安人迁移法案》，掀起了一场声势浩大的起义。我们别无选择，必须镇压这场叛乱，坚决执行迁移政策。然而，恶劣的地形环境加上塞米诺尔人的顽强抵抗，势必使这一过程旷日持久且代价高昂。"
 usfp_indian_removal_cherokee_button: "切罗基迁移开始"
 usfp_indian_removal_cherokee_button_desc: "长期以来，白人开拓者一直觊觎并窃取切罗基人的土地。为了我们共同的和平与繁荣，我们必须将把他们从东部赶走。"
 usfp_indian_removal_chickasaw_button: "奇克索迁移开始"
 usfp_indian_removal_chickasaw_button_desc: "开拓者在我们的放任下不断蚕食奇克索人的土地。面对无法克服的困境，奇克索族最终不得不勉强同意出售土地，举族西迁。"
 usfp_indian_removal_creek_button: "克里克迁移开始"
 usfp_indian_removal_creek_button_desc: "克里克人接受了迁移条约，但他们中的大部分人进行了激烈抵抗，我们已经出动军队进行强制搬迁。"
 usfp_cherokee_treaty_ratified_tooltip: "《新埃可塔条约》已获批准"

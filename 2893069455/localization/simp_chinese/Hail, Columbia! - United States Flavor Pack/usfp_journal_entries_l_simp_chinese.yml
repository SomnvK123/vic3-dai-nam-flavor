 usfp_je_western_border: "印第安保留地"
 usfp_je_western_border_reason: "如同乔治国王在革命前所做的那样，我们在西部边境划定了一条界线，禁止白人开拓者越界。我们承诺与平原国家维持和平边界，这让许多有意西迁的开拓者大失所望。"
 usfp_indian_appropiations_button: "结束条约体系"
 usfp_indian_appropiations_button_desc: "事实证明，我们以前与印第安部落签订条约过于繁琐，不符合我们的目的。有了《印第安人批准法》，我们就可以通过与印第安个体打交道从而简化收购土地的程序。"

 je_usfp_a_house_divided_main_complete:0 "美国内战爆发。"
 je_usfp_a_house_divided_missouri_compromise:0 "兄弟阋墙：《密苏里妥协案》"
 je_usfp_a_house_divided_missouri_compromise_reason:0 "[concept_usfp_congress]在自由州和蓄奴州之间谨慎地维持着微妙的平衡，以防止一方压倒另一方。1820年的妥协案在[concept_usfp_louisiana_purchase]的北纬36°处划定了一条界线，恰好是[SCOPE.sState('missouri_scope').GetName]的南部边界。密苏里州获准保留奴隶制，但该线以北的所有领土都将成为自由地区。而默认情况下，妥协线以南的领土在并入联邦后将成为蓄奴州。\n\n然而，这条分界线的西部边界尚未明确确定。如果[SCOPE.GetRootScope.GetCountry.GetName]继续扩张其疆域，妥协案的地位很可能将受到质疑。"
 usfp_missouri_compromise_broken: "密苏里妥协案被一项新政策取代"
 je_usfp_a_house_divided_gag_rule: "兄弟阋墙：《言论箝制令》"
 je_usfp_a_house_divided_gag_rule_reason: "为了落实《密苏里妥协案》并防止在该问题上的争端进一步升级，[concept_usfp_house_of_representatives]颁布禁令，禁止考虑或讨论与奴隶制有关的请愿或法律。"
 je_usfp_a_house_divided_gag_rule_status: "有了言论限制法以后，[GetLawType('law_slave_trade').GetGroup.GetName]的若干法令#r 不能#!被[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enacted$')]"
 usfp_end_gag_rule_button: "撤销《言论箝制令》"
 usfp_end_gag_rule_button_desc: "废奴运动的反对者已被有效遏制，如今看来，继续执行《言论箝制令》已不再契合我们的利益诉求。"
 usfp_end_gag_rule: "#Bold 兄弟阋墙：《言论箝制令》#![concept_journal_entry]将会结束"
 usfp_end_gag_rule_button_no_abolitionists: "我们并未形成一个以废除奴隶制为目标的[concept_political_movement]。"
 usfp_end_gag_rule_button_slave_trade: "我们拥有一个以奴隶制扩张为目标的[concept_political_movement]"
 je_usfp_a_house_divided_bleeding_kansas:0 "兄弟阋墙：堪萨斯内战"
 je_usfp_a_house_divided_bleeding_kansas_reason:0 "[SCOPE.sState('kansas_scope').GetName]已成为奴隶制问题的角力场。#bold 进度条#!追踪各方在该州的影响力。右侧进度代表#bold 自由州派#!的影响力，而左侧进度则表示亲奴隶制的#bold 边境暴徒#!的推进度。如果进度条达到0或100，[SCOPE.sState('kansas_scope').GetName]的命运将朝有利于该派系的方向决定。\n\n预计下个月权力平衡将发生#tooltippable;tooltip:[Country.GetTooltipTag],je_usfp_a_house_divided_bleeding_kansas_special_tooltip [Country.MakeScope.Var('bleeding_kansas_var_next').GetValue|+=]#!的变化。"
 je_usfp_a_house_divided_bleeding_kansas_special_tooltip: "该数值由以下因素决定：\n#variable [Country.MakeScope.Var('bleeding_kansas_yankee_percent').GetValue|+=]#!来自扬基[Concept('concept_pop', '$concept_population$')]\n#variable [Country.MakeScope.Var('bleeding_kansas_yankee_radicals').GetValue|+=]#!来自扬基[Concept('concept_radical', '$concept_radicals$')]\n#variable [Country.MakeScope.Var('bleeding_kansas_freedmen').GetValue|+=]#!来自非裔美利坚[Concept('concept_pop', '$concept_pops$')]\n#variable [Country.MakeScope.Var('bleeding_kansas_dixie_percent').GetValue|+=]#!来自迪克西[Concept('concept_pop', '$concept_population$')]\n#variable [Country.MakeScope.Var('bleeding_kansas_dixie_radicals').GetValue|+=]#!来自迪克西[Concept('concept_radical', '$concept_radicals$')]\n#variable [Country.MakeScope.Var('bleeding_kansas_aristocrats').GetValue|+=]#!来自迪克西$aristocrats$"

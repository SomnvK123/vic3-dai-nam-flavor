 usfp_demand_bc_button: "索要英属哥伦比亚"
 usfp_demand_bc_button_desc: "那些可恶的英国人必须滚出整个俄勒冈领地！要么滚出北纬54度40分，要么开战！"
 usfp_liberia_declare_independence: "宣布独立"
 usfp_liberia_declare_independence_desc: "是时候仿照美国制度，建立一个真正的利比里亚共和国了。"
 usfp_je_indian_wars: "印第安战争"
 usfp_je_indian_wars_reason: "过去，我们将[GetStrategicRegion('region_great_plains').GetName]视为一片荒芜的沙漠，留给印第安人。如今，随着白人开拓者源源不断地西迁，我们有义务平定这片土地，并在必要时以武力迫使印第安人臣服。"
 usfp_provoke_lakota_war_button: "挑起拉科塔战争"
 usfp_provoke_lakota_war_button_desc: "苏族是我们西进扩张的最大阻碍。若能激怒他们袭击我们的开拓者，我们便有理由将其彻底击溃。"
 usfp_break_treaties_button: "撕毁协议"
 usfp_break_treaties_button_desc: "印度人缺乏力量来执行我们签署的条约，所以我们没有必要遵守这些条约。"
 usfp_acw_support_button: "谴责邦联"
 usfp_acw_support_button_desc: "这场战争关乎美利坚合众国的灵魂，我们绝不接受与南方叛徒进行任何谈判！"

 low_manifest_destiny: "#bold 昭昭天命#!具有足够低的影响力。"
 usfp_homestead_act_button: "鼓励人们定居西部"
 usfp_homestead_act_button_desc: "我们广袤的西部地区蕴含着巨大的开发潜力。政府将在西部地区实行宽松的移民政策，为有意愿前往西部定居的人们分配免费的土地，鼓励他们自给自足、勤劳致富。"
 usfp_reconstruction_swing_freedmen: "重建将朝着有利于#bold 自由民#!的方向发展。"
 usfp_reconstruction_swing_south: "重建将倒退，#bold 救赎者#!的影响进一步加强。"
 usfp_reconstruction_enforce_rights_button: "强制落实投票权"
 usfp_reconstruction_enforce_rights_button_desc: "在南方各州，自由民的合法权益依然受到侵犯和破坏。部署更多的联邦军队，让我们所有的公民都能享受到真正的自由。"
 usfp_reconstruction_confederate_amnesty_button: "赦免南方各州"
 usfp_reconstruction_confederate_amnesty_button_desc: "北方和南方的绅士们将达成共识，签署和解协议。赦免之前的叛乱者并允许他们重返政府，南方的动乱很快就会平息下去。"
 usfp_reconstruction_long: "漫长的重建"
 usfp_reconstruction_long_reason: "对于自由民来说，重建在某种程度上而言已经取得了卓越的成效，但种族偏见仍存在于[ROOT.GetCountry.GetName]的方方面面，根深蒂固。至少需要一代人的时间和努力，[SCOPE.sCulture('afro_american_culture').GetName]公民才能真正被社会接纳，成为[ROOT.GetCountry.GetAdjectiveNoFormatting]不可分割的一部分。\n\n#yellow 非裔美利坚#!人群的普遍接纳程度越高、任意#yellow 非裔美利坚#!角色人气越高、#yellow 迪克西#!人群激进比例越高、#yellow 文化多数派运动#!支持度越高都有利于每年进度条增长"
 usfp_break_gag_rule_button: "终止《言论箝制令》"

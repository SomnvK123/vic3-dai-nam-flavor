 usfp_western_purchase_button: "报价墨西哥"
 usfp_western_purchase_button_desc: "墨西哥对其北部领土的控制十分脆弱，如果我们希望向西扩张，或许可以通过外交手段购买这些土地。"
 mexican_payment_cost: "如果墨西哥接受，我们将在4年内向他们支付#yellow 3M#!@money!。"
 usa_western_purchase_var: "我们每30年可以准备一次出价。"
 treaty_of_guadalupe: "$concept_occupying$墨西哥的[concept_capital_state]将允许我们按照合适的方式来决定条件。只要有足够强大的昭昭天命概念，我们就能夺取更多领土。"
 usfp_cuban_purchase_button: "报价古巴"
 usfp_cuban_purchase_button_desc: "控制古巴对我们在大西洋的国家利益至关重要。我们将出价#yellow 13M#!@money!，分30年支付，以换取对古巴的控制权。"
 usfp_claim_canada_button: "宣称加拿大"
 usfp_claim_canada_button_desc: "这个伟大的美利坚国度将整个#italic 整个#!大陆揽入怀中，是天经地义的！而我们的北方表亲会感谢我们将他们带入美利坚大家庭。"
 usfp_promote_manifest_destiny_button: "提倡大陆主义"
 usfp_promote_manifest_destiny_button_desc: "扩张是我们总体政治战略的关键所在，我们将在政府中提高大陆主义者的占比。"
 usfp_suppress_manifest_destiny_button: "压制大陆主义"
 usfp_suppress_manifest_destiny_button_desc: "大陆主义的目的与联邦的稳定背道而驰，必须予以反对。"
 enough_manifest_destiny: "#bold 昭昭天命#!具有足够高的影响力。"

 usfp_gilded_age: "镀金时代"
 usfp_gilded_age_reason: "富裕和腐败已成为新[ROOT.GetCountry.GetAdjectiveNoFormatting][SCOPE.gsInterestGroup('industrialists_scope').GetName]阶层的特征。大型[concept_usfp_trusts]越来越多地主宰着经济，[concept_usfp_political_machines]控制着地方政治，而腐败丑闻则不断降低公众对政府的信任。\n\n除非政府全面改革，否则在可预见的未来，[ROOT.GetCountry.GetName]仍将任由资本强盗们摆布。"
 usfp_take_bribes_button: "收受贿赂"
 usfp_take_bribes_button_desc: "我们都是朋友和同事，朋友之间送点礼物算什么？"
 usfp_consolidate_trust_button: "合并托拉斯"
 usfp_consolidate_trust_button_desc: "一体化有利于企业，有利于经济，有利于国家！"
 gilded_age_ended: "#b 镀金时代#!已完成"
 usfp_progressive_era: "进步事业"
 usfp_progressive_era_reason: "[concept_usfp_trusts]和[concept_usfp_political_machines]的长期统治让[ROOT.GetCountry.GetName]的社会活动和劳工运动日益高涨，而[Concept('concept_usfp_muckrakers', '$concept_usfp_muckraker$')]记者则详细揭露了社会和政府的黑暗面。\n\n为了解决这些问题，[SCOPE.sIdeology('progressive_ideology').GetName]运动承诺通过引入新的专业模式、采用科学方法和践行直接民主来改良国家。"
 usfp_bust_trust_button: "拆分托拉斯"
 usfp_bust_trust_button_desc: "大型企业集团扼住了经济的咽喉。 是时候把这些庞然大物拆分成更小的企业了。"
 usfp_remove_machine_button: "打击腐败"
 usfp_remove_machine_button_desc: "长期以来，公开贿选让商人们控制了地方政治。我们需要杜绝这些贿选，恢复民主。"
 usfp_progressive_era_eugenics: "优生学运动"
 usfp_progressive_era_eugenics_reason: "为了确保自己在社会中的地位，各种团体开始推行优生学，希望解决各种社会弊端。通过计划生育和强制绝育，他们试图消灭人口中的“基因劣等”群体，建立一个完全由“高素质”个体组成的国家。\n\n只有时间会证明是否会有[Concept('concept_interest_group', '$concept_interest_groups$')]接受这些伪科学观点……"
 usfp_je_westward_expansion_complete: "新的[Concept('concept_homeland','$concept_homelands$')]将在游戏剩余时间内继续添加到你的[Concept('concept_state', '$concept_states$')]中。"
 texan_statehood_tex: "申请成为美国的一个州"
 texan_statehood_tex_desc: "我们的共和国是由来自美国的移民建立的。如果他们愿意，我们可以加入联邦，并让其更加强大。"
 texan_csa: "加入南方邦联"
 texan_csa_desc: "我们十分认同南方邦联的奴隶主同盟和州权捍卫者的身份。我们可以在保持主权的同时，选择加入他们的事业。"
 je_usfp_a_house_divided_voting_rights: "兄弟阋墙：黑人选举权"
 je_usfp_a_house_divided_voting_rights_reason: "即使在非蓄奴州，[SCOPE.sCulture('afro_american_culture').GetName]公民也几乎完全被剥夺了接近投票箱的权利。要推翻限制他们选举权的种种障碍，亟需在国家层面展开一场系统而有力的行动。"

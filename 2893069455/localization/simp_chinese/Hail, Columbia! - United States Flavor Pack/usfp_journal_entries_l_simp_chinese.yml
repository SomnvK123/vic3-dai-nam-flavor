 usfp_chickasaw_removal_payment: "支付奇克索迁移费用"
 usfp_manifest_destiny_main: "昭昭天命"
 usfp_manifest_destiny_main_reason: "昭昭天命——即我国的扩张是一项神圣使命，正在[SCOPE.GetRootScope.GetCountry.GetName]逐渐盛行。北美大陆广袤的土地正以无限机遇向我们招手，然而我们究竟应将疆域扩展到何种程度，仍是一个未知数。\n\n#bold 进度条#!的状态反映了昭昭天命在我国的影响力，这将由各种#tooltippable;tooltip:[Country.GetTooltipTag],usfp_manifest_destiny_special_tooltip_advance 支持扩张#!或#tooltippable;tooltip:[Country.GetTooltipTag],usfp_manifest_destiny_special_tooltip_deplete 反对扩张#!的条件决定。我们的#yellow 昭昭天命#!修正值将根据进度条的变化而改变其效果，随着昭昭天命理念影响力的增强，新的扩张机会也将随之出现。"
 usfp_manifest_destiny_special_tooltip_advance: "如果我们拥护军事扩张和种族至上，昭昭天命就会在我们的社会中获得影响力。\n满足以下重复条件即可#bold 推动#!#bold 进度条#!：\n\n※一位#tooltippable;tooltip:[Country.GetTooltipTag],usfp_manifest_destiny_special_tooltip_pro_expansion 扩张主义者#!当选总统(每位总统一次)\n※[concept_powerful][concept_interest_group]的领袖有#tooltippable;tooltip:[Country.GetTooltipTag],usfp_manifest_destiny_special_tooltip_pro_expansion 扩张主义者#!特质#italic （每个利益集团有20年冷却）#!\n\n多个[Concept('concept_journal_entry', '$concept_journal_entries$')]的结果可以#bold 推动#!#bold 进度条#!：\n※完成#Bold 印第安人驱逐#![concept_journal_entry]\n※#bold 俄勒冈边界争端#![concept_journal_entry]以失败为结局\n※开启#bold 与印第安人战争#![concept_journal_entry]以失败为结局\n\n我们政府采取的某些行动#bold 推动#!#bold 进度条#!（每个行动一次）：\n※我们[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact$')]通过[GetLawType('law_colonial_exploitation').GetName][concept_law]\n※我们[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact$')]通过[GetLawType('law_professional_army').GetName][concept_law]\n※我们[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact$')]通过[GetLawType('law_national_supremacy').GetName]或[GetLawType('law_ethnostate').GetName][concept_law]\n※我们征服海外[concept_state]\n\n各种特殊事件和情况也会#bold 推动#!#bold 进度条#!：\n※德克萨斯叛乱失败\n※我们遭到墨西哥的攻击\n※我们根据《瓜达卢佩-伊达尔戈条约》占领了整个墨西哥\n※欧洲强国违反了[concept_usfp_monroe_doctrine]\n※我们支持威廉·沃克的索诺拉探险\n※我们追随奥斯坦德通函中关于古巴的[concept_claim]"
 usfp_manifest_destiny_special_tooltip_deplete: "如果我们拒绝扩张主义并提倡种族多元，那么昭昭天命将在我们的社会中失去影响力。\n\n满足以下条件则会#bold 减少#!#bold 进度条#!：\n※一位#tooltippable;tooltip:[Country.GetTooltipTag],usfp_manifest_destiny_special_tooltip_anti_expansion 反扩张主义者#!当选[Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]\n※[concept_powerful][concept_interest_group]利益集团的领袖有#tooltippable;tooltip:[Country.GetTooltipTag],usfp_manifest_destiny_special_tooltip_anti_expansion 反扩张主义者#!特质#italic （每个利益集团有20年冷却）#!\n\n多个[Concept('concept_journal_entry', '$concept_journal_entries$')]的结果会#bold 减少#!#bold 进度条#!：\n※#Bold 印第安迁徙#![concept_journal_entry]以失败为结局\n※完成#bold 俄勒冈边界争端#![concept_journal_entry]\n※#bold 美国内战#!爆发\n※#bold 美国内战#!联邦方失败\n\n我们政府采取的某些行动#bold 推动#!#bold 进度条#!（每个行动一次）：\n※我们[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact$')]通过[GetLawType('law_no_colonial_affairs').GetName][concept_law]\n※我们[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact$')]通过[GetLawType('law_council_republic').GetName][concept_law]\n※我们[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact$')]通过[GetLawType('law_multicultural').GetName][concept_law]\n※我们[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact$')]通过[GetLawType('law_monarchy').GetName][concept_law]\n\n各种特殊事件和情况也会#bold 推动#!#bold 进度条#!：\n※我们在[concept_war]被墨西哥击败\n※我们仅在《瓜达卢佩-伊达尔戈条约》占领墨西哥割让地\n※墨西哥同意和平卖出割让地\n※美国反帝国主义联盟成立\n※不再是[concept_great_power]\n※我们处于[concept_default]或已声明[concept_bankruptcy]"
 usfp_manifest_destiny_special_tooltip_pro_expansion: "※拥有#bold 杰克逊民主党#!意识形态\n※拥有#bold 沙文主义者#!意识形态\n※拥有#bold 蓄奴主义者#!意识形态\n※拥有#bold 威权主义者#!意识形态\n※拥有#bold 法西斯主义者#!意识形态\n※拥有#bold 社会达尔文主义者#!意识形态\n※拥有#bold 扩张主义者#!特质"
 usfp_manifest_destiny_special_tooltip_anti_expansion: "※拥有#bold 和平主义者#!意识形态\n※拥有#bold 无政府主义者#!意识形态\n※拥有#bold 人道主义者#!意识形态\n※拥有#bold 开明保皇主义者#!意识形态\n※拥有#bold 反扩张主义者#!特质"

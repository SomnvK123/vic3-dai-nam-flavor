l_simp_chinese:
 ideology_usfp_progressive: "进步主义者"
 ideology_usfp_progressive_desc: "#lore 这位领袖主张进行广泛的改革，以打击垄断、腐败和社会衰退。#!"
 ideology_usfp_social_gospel_leader: "社会福音主义者"
 ideology_usfp_social_gospel_leader_desc: "#lore 这位领袖试图运用新教伦理来消除社会不平等并提升公民素质。#!"
 ideology_usfp_strongman_populist: "强人民粹主义者"
 ideology_usfp_strongman_populist_desc: "#lore 该角色认为自己是坚定的领导者，将推动颁布经济改革措施以造福大众。#!"
 ideology_american_school_leader: "美国系统论者"
 ideology_american_school_leader_desc: "#lore 该角色主张保护主义和干预主义相结合。#!"
 ideology_usfp_abolitionist_radical: "激进废奴主义者"
 ideology_usfp_abolitionist_radical_desc: "#lore 这位领袖寻求彻底废除奴隶制，并为自由人争取平等的社会地位。#!"
 ideology_usfp_georgist_leader: "乔治主义者"
 ideology_usfp_georgist_leader_desc: "#lore 这位领袖提倡自由贸易、政府干预垄断、并对地主积极征税。#!"
 ideology_usfp_social_darwinist_leader: "社会达尔文主义者"
 ideology_usfp_social_darwinist_leader_desc: "#lore 这个领袖认为所有生命都在一场竞争中，强者应该自由地支配弱者，并坚持从基因库中清除“劣等人”以确保社会进步和凝聚力。#!"
 ideology_usfp_evangelical_moralist: "福音道德主义者"
 ideology_usfp_evangelical_moralist_desc: "这个集团相信他们有权表达自己的新教分支，认为这是一个道德高尚的合众国的基石。"
 ideology_usfp_eugenicist: "优生主义者"
 ideology_usfp_eugenicist_desc: "这个集团接受了优生学的概念——对人类进行选择性繁殖。他们主张通过家庭生育计划、移民控制和强制绝育等手段来谨慎控制人口基因库。"
 ideology_usfp_localist: "地方主义者"
 ideology_usfp_localist_desc: "该个集团认为国家权力应该将权力下放给地方市政当局，反感国家政府的强加行为。"
 ideology_usfp_universalist: "普世主义者"
 ideology_usfp_universalist_desc: "#lore 这位领袖提倡和平、宽容与普世兄弟情谊，主张通过开放对话来促进不同信仰与文化之间的相互理解。#!"
 ideology_usfp_accomodationist: "调和主义者"
 ideology_usfp_accomodationist_desc: "这个集团倾向于政教分离，但仍然提倡主流宗教的道德正义。"
 ideology_usfp_pan_indianist: "泛印第安主义者"
 ideology_usfp_pan_indianist_desc: "#lore 这个领袖呼吁北美原住民团结一致，反对欧洲殖民者的侵占及其生活方式。#!"
 ideology_usfp_pan_indianist_group: "泛印第安主义者"
 ideology_usfp_pan_indianist_group_desc: "这个集团呼吁北美原住民团结一致，反对欧洲殖民者的侵占及其生活方式。"
 ideology_usfp_gender_complementarian: "性别互补主义者"
 ideology_usfp_gender_complementarian_desc: "这个集团支持传统的性别角色观念，认为男性和女性在社会中应当扮演不同但互补的角色。"
 ideology_usfp_native_american_agrarian: "原住民农本主义者"
 ideology_usfp_native_american_agrarian_desc: "这个集团支持传统的土地管理模式，拒绝个人对土地的所有权。"
 ideology_usfp_tribal_government: "分权主义者"
 ideology_usfp_tribal_government_desc: "这个集团更倾向于不会破坏他们的传统生活方式的去中心化政治结构。"
 ideology_anti_tariff:0 "反关税主义者"
 ideology_anti_tariff_desc:0 "#lore 这个集团主张取消所有进出口关税。#!"
 ideology_pro_tariff:0 "关税主义者"
 ideology_pro_tariff_desc:0 "#lore 该集团认为应保护国内产业不受外国进口产品的影响。#!"
 ideology_american_school:0 "美国学派主义者"
 ideology_american_school_desc:0 "#lore 这个集团支持贸易保护与经济干预相结合。#!"
 ideology_empire_of_liberty:0 "自由帝国主义者"
 ideology_empire_of_liberty_desc:0 "#lore 1776年的精神与这个集团同在。他们支持大陆扩张政策，并希望将民兵妥善管理。#!"
 ideology_usfp_progressive_movement:0 "进步主义者"
 ideology_usfp_progressive_movement_desc: "#lore 这场运动主张进行广泛的改革，旨在打击垄断、腐败和社会衰败.#!"
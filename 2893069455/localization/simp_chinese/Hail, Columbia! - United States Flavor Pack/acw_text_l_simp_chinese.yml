 acw_slaver_president:0 "1860年一位支持奴隶制总统当选"
 acw_will_happen_tt:0 "国家可能开始分裂"
 csa_revolt_name:0 "美利坚联盟国"
 csa_revolt_name_adj:0 "邦联"
 fsa_revolt_name:0 "美利坚自由邦"
 fsa_revolt_name_adj:0 "美利坚自由邦"
 acw_je_events.4.t:0 "解放奴隶宣言"
 acw_je_events.4.d:0 "由于奴隶制的支持者已经掀起叛乱，我们可以签发宣言，解放叛乱领土上的所有奴隶。这是完全废奴的第一步，也是最重要的一步。"
 acw_je_events.4.f:0 "“依宪法授予的权力，在现今武装反叛政府时期，我命令并宣布，所有被视作奴隶的人立获自由并于以后永保自由。这一个行动，我请求人类对之详加审鉴，上帝为之赐福。”"
 acw_je_events.4.a:0 "此笔落下，我们便能拯救联邦！"
 acw_je_events.4.b:0 "我们拒绝超出传统方式解放奴隶。"
 acw_emancipation.tt:0 "如果联盟赢得内战，那么所有邦联州的奴隶都将被解放 "
 acw_special_events_union.tt:0 "这将增加联盟的战争支持。"
 acw_special_events_confederacy.tt:0 "这将增加南方联盟的战争支持。"
 acw_special_events_undecided.tt:0 "对这一省份的控制权还没有归属；因此双方都将获得战争支持。"
 acw_special_events.1.t:0 "葛底斯堡演说"
 acw_special_events.1.d:0 "今天总统[SCOPE.sCharacter('president').GetFullName]在葛底斯堡[SCOPE.sState('gettysburg').GetName]的一个墓地献礼仪式上发表了简短而谦逊的讲话。在短短的271个字中，[SCOPE.sCharacter('president').GetLastName]描述了[SCOPE.sCountry('united_states').GetNameNoFlag]的国家宗旨：“这个国家是以自由为理念,并致力于人生而平等的主张”"
 acw_special_events.1.f:0 "如今，我们正在进行一场伟大的内战，考验著那个国家，或任何有此信仰和主张的国家，能否长久地存续下去……\n\n……从那些为此投入了全部热忱的逝者那里，我们将获得更多的热忱；我们将不会，绝不会使那些为此献出生命的人白白献出生命；我们将使这个国家，在上帝的庇佑下，从自由里获得新生；而那一为民所有、为民所治、为民所享的政府，也绝不会从这片土地上消亡。"
 acw_special_events.1.a:0 "他们不会白白死去。"
 acw_special_events.1.tt:0 "联邦将获得战争支持"
 acw_special_events.2.t:0 "向大海进军"
 acw_special_events.2.d:0 "将军[SCOPE.sCharacter('sherman').GetFullName]在[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]的乡战斗扯，烧毁城镇，拆毁铁路，破坏基础设施，以显示对南方联盟的统治和武力。虽然一些人谴责他的行为野蛮，但政府中的许多人，包括总统[SCOPE.sCharacter('president').GetFullName]，都全力支持将军，鼓励他继续战斗。 "
 acw_special_events.2.f:0 "\"只有指挥官才有权力摧毁工厂、房屋、农田等，并为他们规定了这一一般原则。在军队没有受到骚扰的地区和街区，不应允许破坏这些财产，但如果游击队或原住民骚扰我们的行军、居民烧毁桥梁阻碍道路或以其他方式表现出敌意，那么指挥官应根据这种敌意的程度，下令并实施破坏，让敌人感到恐惧才是指挥官应该做的事情。\""
 acw_special_events.2.a:0 "这是他们应得的"
 acw_special_events.3.t:0 "[SCOPE.sCountry('america').GetAdjectiveNoFlag]历史上最血腥的一天["
 acw_special_events.3.d:0 "在与[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]军队大规模交战后，联邦军队在[SCOPE.sState('maryland').GetName]取得了一场大胜。数以万计的人在战斗中死伤，不过该镇屹立不倒，叛军被赶了出去，联邦军队继续向南向进军；但[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]军队尽管损失惨重，还是依然坚挺作战，这一天将作为[SCOPE.sCountry('america').GetAdjectiveNoFlag]历史上最血腥的一天。"
 acw_special_events.3.f:0 "\"......北部和大部分地区的每根玉米茎都被割得光秃秃，而被杀的南军躺在一排排的玉米地里，正好是像是收割季的玉米一样。\""
 acw_special_events.3.a:0 "我们赢了，但代价是什么？"
 acw_special_events.4.t:0 "第一次马纳萨斯战役"
 acw_special_events.4.d:0 "联邦军和叛军在北部[SCOPE.sState('virginia').GetName]的布尔润河支流一带发生冲突。我们的部队，对战争的恐怖毫无准备，被叛军炮火无情的屠杀了。不过叛军和我们一样缺乏经验，他们的损失也很大。双方最终都被迫从水路撤退，逃到了各自的阵地。这场战斗让我们的部队士气损失很大，而且政府中的许多人都把这场战斗看作是叛军的胜利。"
 acw_special_events.4.f:0 "\"保持你的怒火，直到50码内！然后开火！给他们上刺刀！冲锋的时候，要愤怒大喊！\""
 acw_special_events.4.a:0 "该死的叛军！"
 acw_special_events.5.t:0 "[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]在钱斯勒斯维尔的胜利"
 acw_special_events.5.d:0 "[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]军队在[SCOPE.sState('virginia').GetName]的钱瑟勒斯维尔城外粉碎了联邦军！！[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]的将军们把军队分成多个小部队，包围并剿灭了联邦军！不过这次失利有一个值得注意的事情：其中一位将军[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]在完成侦察任务返回时被自己的手下意外射杀。"
 acw_special_events.5.f:0 "“我的计划是完美的，望主垂怜邦联，因为我不会。”——联邦将军"
 acw_special_events.5.a:0 "该死的叛军！太糟了。"
 acw_special_events.6.t:0 "维克斯堡战役"
 acw_special_events.6.d:0 "联邦军在围攻[SCOPE.sState('vicksburg').GetName]数月后终于攻占了维克斯堡。[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]据点的沦陷，使密西西比河完全落入联邦的手中，巩固了我们对南方的统治地位，现在胜利就在眼前！！"
 acw_special_events.6.f:0 "\"战线开始时，我们的吆喝声还没有消失在空气中时，前面的南方军工事里面全是敌人，他们带着蔑视的回应声，向我们的队伍倾泻着子弹，而我们前面和两边的堡垒，也向我们的战线倾泻着不间断的子弹..\""
 acw_special_events.6.a:0 "振奋人心的胜利！"
 acw_special_events.7.t:0 "解放奴隶宣言"
 acw_special_events.7.d:0 "总统[SCOPE.sCharacter('president').GetFullName]发布了一项行政命令，宣布所有在[SCOPE.sCountry('confederacy').GetNameNoFlag]内持有的奴隶将被联邦承认为自由人。这激励北方的废奴主义者和黑人自由人，他们爆发了巨大的庆祝活动。然而南方的人对这项行政命令的反应是厌恶的，许多人质疑该命令的合宪性。"
 acw_special_events.7.f:0 "“ 阿肯色、得克萨斯、路易西安那（除去圣伯尔拿、普拉奎明、哲斐孙、圣约翰、圣查理、圣詹姆士、亚森湘、亚森普欣、得里保恩、拉伐什、圣马利、圣马丁以及奥尔良等郡，包括新奥尔良城在内）、密西西比、亚拉巴马、佛罗里达、乔治亚、南卡罗来纳、北卡罗来纳和弗吉尼亚（除去西弗吉尼亚四十八个郡以及柏克立、阿康玛克、诺珊普顿、依利萨伯、约克、安公主、诺福克等郡包括诺福克和朴茨茅斯两城在内），这些除开的地区现在仍暂时维持本公告发出之前的原有状况。\n为着上述的目的，我利用我的职权，正式命令并宣告在上述诸州以及某些州的上述地区以内所有作为黑奴的人现在和今后永远获得自由；合众国政府，包括海陆军当局在内，将承认并保持上述人们的自由。”"
 acw_special_events.7.a:0 "斗争已经从团结转变为奴役。"
 acw_special_events.7.tt:0 "如果合众国赢得了美国内战，那么邦联中的所有奴隶都将获得自由。"
 acw_special_events.8.t:0 "为[SCOPE.sState('kentucky').GetName]而战"
 acw_special_events.8.d:0 "随着叛军的进军，联邦军和叛军在[SCOPE.sState('kentucky').GetName]南部进行了小规模的冲突。尽管我们竭尽全力，但我们的许多部队在小规模的战斗中被击溃，使[SCOPE.sState('kentucky').GetName]的一部分落入[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]军队的手中。"
 acw_special_events.8.f:0 "\"我认为失去肯塔基州几乎等同于失去一半胜机。丢了肯塔基州，我们就无法控制密苏里，也无法控制马里兰。这些都对我们不利，而我们手上的工作对我们来说太大。我们还不如立即同意分离，包括交出这座国会大厦。\""
 acw_special_events.8.a:0 "我们不能失去 [SCOPE.sState('kentucky').GetName]，无论付出什么代价！"
 acw_special_events.9.t:0 "[SCOPE.sState('arkansas').GetName]战役"
 acw_special_events.9.d:0 "尽管我们向[SCOPE.sState('arkansas').GetName]州挺进，但[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]军队继续在战斗中战胜我们的部队。我们唯一的救命稻草是大片的、大部分无人居住的[SCOPE.sState('arkansas').GetName]乡村，这使得我们的部队可以不受限制地深入该州。无论如何[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]仍然继续打击我们的军队。"
 acw_special_events.9.f:0 "\"根据州当局掌握的最佳数据，估计[SCOPE.sState('arkansas').GetName]现在有22000人在[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]军队，这相当于适合或需要服兵役的人口的37%，是全部军事力量的一半。\""
 acw_special_events.9.a:0 "这将大大减慢我军前进速度。"
 acw_special_events.10.t:0 "为[SCOPE.sState('missouri').GetName]而战"
 acw_special_events.10.d:0 "联邦和叛军继续在[SCOPE.sState('missouri').GetName]的田野和丘陵上发生冲突。尽管双方都损失惨重，但对该州的控制权仍然未知归谁，但是战争对整个州造成的破坏是巨大的。[SCOPE.sState('missouri').GetName]政府筹集了许多军队，试图将叛军赶出他们的土地，但叛军似乎不太可能这么容易被赶走。"
 acw_special_events.10.f:0 "\"[SCOPE.sState('missouri').GetName]州内所有拿起武器反抗并直接证明在战场上与敌人积极合作的人的财产，无论是不动产还是个人财产，都宣布没收归公！！而且如果他们有奴隶，在此宣布为自由！\""
 acw_special_events.10.a:0 "[SCOPE.sState('missouri').GetName]绝不能落入叛军之手！"
 acw_special_events.11.t:0 "[SCOPE.sState('oklahoma').GetName]的小规模冲突"
 acw_special_events.11.d:0 "据报道，在[SCOPE.sState('oklahoma').GetName]，联邦和叛军之间发生了许多小规模冲突。这些战斗引起了多年前被强行迁移到那里的各个印第安部落的注意。该地区的战争使部落与部落之间产生了矛盾，一些部落甚至选择加入叛军的行列。有些人已经与我们联系，希望为我们而战，以换取土地和独立的承诺。然而这些问题都没有得到联邦政府的答复。"
 acw_special_events.11.f:0 "\"总统先生，[SCOPE.sState('oklahoma').GetName]地区内的许多印第安部落已经宣誓效忠于叛军，希望能赢得土地和和平...... 然而叛军不太可能同意这些条款。尽管如此，印第安人还是继续突袭我们的部队和供应线......\""
 acw_special_events.11.a:0 "必须阻止印第安人！"
 acw_special_events.12.t:0 "葛底斯堡战役"
 acw_special_events.12.d:0 "[SCOPE.sCountry('america').GetAdjectiveNoFlag]历史上最血腥的战斗今天结束。就在[SCOPE.sState('pennsylvania').GetName]盖茨堡这个简陋的地方外，成千上万的联邦和叛军为了控制这里，进行了残酷的白刃战。在短短三天的时间里，数万人死亡，但我们的部队取得了胜利，迫使叛军大规模撤退。屠杀导致军队中的许多人悲伤，有些战斗为了找回死者。这场战斗让许多美国人看到了内战的真实，但战争还在继续。"
 acw_special_events.12.f:0 "\"现在一切都结束了，战斗失败了，我们中的许多人成了俘虏，许多人受伤、流血、死亡。你的士兵活着也在哀悼，但为了你，我亲爱的，他宁愿和他的死人一起回到那里，在一个不知名的坟墓里永远沉睡。\""
 acw_special_events.12.a:0 "这真的是胜利吗？"
 acw_special_events.13.t:0 "夏洛战役"
 acw_special_events.13.d:0 "今天联邦军队越过[SCOPE.sState('tennessee').GetName]边界，在一个名为夏洛的小教堂外与多支叛军部队交战。虽然战斗很血腥，但最终联邦军队取得了胜利，迫使叛军深入到[SCOPE.sState('tennessee').GetName]的乡村。那里抵抗仍然很激烈，但附近的一些城镇和村庄欢迎联邦军队进入他们的家园。尽管在内战开始前同意脱离联邦，[SCOPE.sState('tennessee').GetName]仍然是我们的部队进入的最友好的州之一。然而随着向孟菲斯和密西西比河的推进速度减慢，叛军继续骚扰我们的军队。 "
 acw_special_events.13.f:0 "\"......认为南方军可以在一个多小时的零星夜袭中永久地攻破或粉碎联邦防线的想法，根本缺乏可信性......\""
 acw_special_events.13.a:0 "[SCOPE.sState('tennessee').GetName]将是我们的。"
 acw_special_events.14.t:0 "[SCOPE.sState('skirmish_state').GetName]的冲突"
 acw_special_events.14.d:0 "合众国和[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]部队在整个[SCOPE.sState('skirmish_state').GetName]州交战，导致双方都有损失。交战持续发生在[SCOPE.sState('skirmish_state').GetName]，从深山老林到小村镇再到最大的城市。大多数战斗都是无疾而终，但仍有报告传来。这些战斗继续支持[SCOPE.sCountry('confederacy').GetNameNoFlag]，他们利用任何胜利来加强[SCOPE.sCountry('confederacy').GetAdjectiveNoFlag]人民的战斗决心。"
 acw_special_events.14.f:0 "\"我们的家园被野蛮的战斗所摧毁。我们不希望与这场战争有任何关系。我们只想在和平中生活。为什么？为什么我们必须像这样被诅咒？我们美丽的国家就这样四分五裂......\""
 acw_special_events.14.a:0 "我们将密切关注 [SCOPE.sState('skirmish_state').GetName]"
 acw_special_events_skirmish_state.tt:0 "战斗将在整个 [SCOPE.sState('skirmish_state').GetName] 持续进行"
 acw_sectionalism_startup.1.t:0 "日益增长的地方主义"
 acw_sectionalism_startup.1.d:0 "奴隶制辩论开始变得越来越激烈，反对和支持奴隶制的派别已经在北方和南方形成，而夹在中间的奴隶制地方似乎不确定他们对奴隶制问题的立场。"
 acw_sectionalism_startup.1.f:0 "\"我相信国家不可能永远忍受一半的奴隶和一半的自由。\" - 亚伯拉罕·林肯"
 acw_sectionalism_startup.1.a:0 "这可能会撕裂美国"
 acw_sectionalism_startup.1.tt:0 "北方知识分子和南方种植园主将控制北方和南方。"
 acw_sectionalism_startup.2.t:0 "德雷德·斯科特案"
 acw_sectionalism_startup.2.d:0 "最高法院已经受理了一个名叫德瑞德·斯科特奴隶的案件。斯科特先生对他的主人约翰·桑德福提起诉讼，认为他在[SCOPE.sState('free_state').GetName]州的居住权意味着，根据法律他是一个自由人。他的主人桑德福先生对此提出异议。这场诉讼在法院系统中一直攀升到最高法院，目前审判正在进行。北方的许多废奴主义者担心斯科特可能会被认定没有资格举行诉讼，而南方的许多持奴者则担心法院会做出有利于斯科特的裁决。"
 acw_sectionalism_startup.2.f:0 "\"奴隶制之所以在这个国家存在，不是因为有什么纸质宪法，而是因为美国人民的道德盲目性，他们说服自己，认为自己是安全的，尽管其他人的权利可能被打倒。\" - 弗雷德里克·道格拉斯"
 acw_sectionalism_startup.2.a:0 "法院裁定斯科特胜诉。"
 acw_sectionalism_startup.2.b:0 "法院裁定桑福德胜诉。"
 acw_sectionalism_startup.3.t:0 "德雷德·斯科特胜诉！"
 acw_sectionalism_startup.3.d:0 "最高法院裁定，德瑞德·斯科特是一个自由人。这一决定在全国引起了涟漪效应，北方的废奴主义者在庆祝，而南方的地主则谴责这一决定，德瑞德·斯科特和他的家人已经正式从原主人桑德福那里获得了自由。"
 acw_sectionalism_startup.3.f:0 "\"在本法庭看来，在德瑞德·斯科特先生诉桑德福先生一案中，斯科特先生在宪法的眼中是一个自由人。\""
 acw_sectionalism_startup.3.a:0 "法院很清楚。斯科特是自由的"
 acw_sectionalism_startup.4.t:0 "德雷德·斯科特败诉！"
 acw_sectionalism_startup.4.d:0 "最高法院裁定，德瑞德·斯科特实际上是一名奴隶。这一决定在全国引起了连锁反应，南方地主们欢欣鼓舞，而北方的废奴主义者则谴责这一决定。德瑞德·斯科特和他的家人已被送回原主人约翰·桑德福。法院进一步裁定，所有黑人，无论是自由人还是被奴役者，都不应该成为美国公民，因此宪法不适用于他们。"
 acw_sectionalism_startup.4.f:0 "\"我们认为......黑人并不包括在宪法中的 \"公民 \"一词之下，而且也没有打算将其包括在内，因此他们不能要求享有该文书为美国公民规定和保证的任何权利和特权。相反在美国建国之初，他们被认为是被主流种族征服的从属和下等人，无论解放与否，仍然受制于他们的权力，除了那些掌握权力的人和政府可能选择给予他们的权利或特权，他们没有任何权利或特权。”"
 acw_sectionalism_startup.4.a:0 "法院很清楚，斯科特还是个奴隶。"
 acw_je_events.1.t1:0 "[SCOPE.sState('south_carolina').GetName] 分离条例"
 acw_je_events.1.t2:0 "纽约州分离条例"
 acw_je_events.1.d1:1 "今天国会收到了[SCOPE.sState('south_carolina').GetName]州的参议员和众议员的辞职信。该州抗议联邦试图取缔奴隶制的做法，单方面宣布从[SCOPE.sCountry('united_states').GetNameNoFlag]分离。他们要求联邦军队撤离其领土，并要求[SCOPE.sCountry('united_states').GetAdjectiveNoFlag]承认其主权。"
 acw_je_events.1.d2:1 "今天国会收到了来自纽约州参议员和众议员的辞职信。该州对联邦在取缔奴隶制方面的不作为感到厌倦，单方面宣布脱离[SCOPE.sCountry('united_states').GetNameNoFlag]。他们要求联邦军队从纽约地区撤离，并要求美国承认他们的主权。"
 acw_je_events.1.f1:1 "\"[SCOPE.sState('south_carolina').GetName]和其他国家之间现在存在的以'The [SCOPE.sCountry('united_states').GetNameNoFlag]'为名的联盟，特此解散。- [SCOPE.sState('south_carolina').GetName]分离条例"
 acw_je_events.1.f2:0 "“在这我们采取重大步骤，与那长久来我们所归属的政府解除联系的时刻，我们正应宣告那导致我们走上这条道路的重要原因。\n\n我们的立场站在奴隶制度的对立面——这是一个无比邪恶的制度，必须被废除。”"
 acw_je_events.1.a:0 "他们能做到吗？"
 je_acw_secession_crisis:0 "南方分离危机"
 je_acw_secession_crisis_reason:0 "美国正处于宪政危机之中。南方多个州宣布脱离联邦。国会已经收到多份辞职信，反叛州和忠诚州之间的政治关系已经被切断。"
 je_acw_secession_crisis_ongoing_tt:0 "联邦军和邦联军发生小规模冲突"
 je_acw_secession_crisis_over_tt:0 "南北战争即将爆发"
 acw_secession_crisis.1.t:0 "蒙哥马利公约"
 acw_secession_crisis.1.d:0 "多个南方州已加入[SCOPE.sState('south_carolina').GetName]，单方面宣布从[SCOPE.sCountry('united_states').GetNameNoFlag]独立。在蒙哥马利[SCOPE.sState('alabama').GetName]召开会议后，各州都明确了他们分离的理由：奴隶制"
 acw_secession_crisis.1.f:0 "“在这我们采取重大步骤，与那长久来我们所归属的政府解除联系的时刻，我们正应宣告那导致我们走上这条道路的重要原因。\n\n我们的立场完全与奴隶制度一致——这是世界上一项重大的物质利益。”   - [SCOPE.sState('mississippi').GetName]分离条例"
 acw_secession_crisis.1.a:0 "这是宪政危机！"
 acw_secession_crisis.1.tt:0 "这可能会导致驻扎在深南州的联邦军和邦联军之间发生冲突。"
 acw_secession_crisis.2.t:0 "兄弟阋墙"
 acw_secession_crisis.2.d:0 "几十年来关于奴隶制问题的公共讨论的努力，都失败了。南方的分裂危机已经到了顶峰。又有四个州宣布脱离联邦，并加入了已经独立叛乱州，成为[SCOPE.sCountry('confederate_states').GetNameNoFlag]。总统[SCOPE.sCharacter('president').GetFullName]已经宣布美国进入战时状态，并发出了征召七万多人的命令，内战已经开始。"
 acw_secession_crisis.2.f:0 "“...联邦政府滥用上述权力，不仅伤害了弗吉尼亚人民，还压迫南方蓄奴州。”——[SCOPE.sState('virginia').GetName]分离条例"
 acw_secession_crisis.2.a:0 "我们将不再容忍南方这种叛国行为！为了联邦！"
 acw_secession_crisis.2.b:0 "我们将不再容忍北方的侵略！为了邦联！"
 acw_secession_crisis.2.tt:0 "这将立即引发美国内战！"
 acw_secession_crisis.3.t:0 "[SCOPE.sCharacter('fort_sumter').GetLastName]堡垒的枪声"
 acw_secession_crisis.3.d:0 "今天早上，[SCOPE.sCharacter('president').GetFullName]总统收到来自[SCOPE.sState('south_carolina').GetName]的联邦军队的报告：位于查尔斯顿港的[SCOPE.sCharacter('fort_sumter').GetLastName]要塞在拒绝投降后遭到[SCOPE.sState('south_carolina').GetName]民兵的轰炸。总统和国会，以及普通美国民众都对这一消息感到愤怒。紧张局势似乎已达到沸点。"
 acw_secession_crisis.3.f:0 "“一阵微弱的口哨声划破了死寂的夜。这哨声变得越来越响亮，直到我周围的墙突然直接炸裂开来。天花板塌陷了部分，不幸困在下面的人被压死。营房中传来了许多喊叫声，接着更多的是炮弹的呼啸声。这感觉就像世界末日一样。”"
 acw_secession_crisis.3.a:0 "是可忍孰不可忍！动员军队！"
 acw_secession_crisis.3.tt:0 "联邦政府对此的反应可能会导致更多的州脱离联邦……"
 acw_secession_crisis.4.t:0 "惠灵公约"
 acw_secession_crisis.4.d:0 "在弗吉尼亚州惠灵举行的亲联邦代表大会宣布脱离 [SCOPE.sCountry('confederacy').GetNameNoFlag]。他们已与总统 [SCOPE.sCharacter('president').GetFullName]先生和国会接洽，希望被接纳为 [SCOPE.sState('west_virginia').GetName] 州。他们在 [SCOPE.sCountry('confederacy').GetAdjectiveNoFlag] 首都里士满附近的地理位置对我们的战略来说是无价的。"
 acw_secession_crisis.4.f:0 "“我们不希望成为联邦的敌人。我们的声音被联邦政府忽略了，我们的信念被里士满抛弃了。我们效忠于[SCOPE.sCountry('america').GetNameNoFlag]。”"
 acw_secession_crisis.4.a.tt:0 "西弗吉尼亚州将加入联邦并被承认为弗吉尼亚州的合法政府。"
 acw_secession_crisis.4.b.tt:0 "西弗吉尼亚州仍将是弗吉尼亚州和联邦的一部分。"
 acw_secession_crisis.4.a:0 "我们接受西弗吉尼亚州的独立宣言。"
 acw_secession_crisis.4.b:0 "他们都是叛徒，也应被当作叛徒对待。"
 je_acw_northern_secession_crisis:0 "北方分离危机"
 je_acw_northern_secession_crisis_reason:0 "美国正处于宪政危机之中。北方的多个州已就奴隶制问题宣布脱离联邦。国会已经收到多份辞职信，反叛州和忠诚州之间的政治联系已经被切断。"
 je_acw_northern_secession_crisis_ongoing_tt:0 "联邦军与自由邦军发生小规模冲突"
 je_acw_northern_secession_crisis_over_tt:0 "南北战争即将爆发"
 acw_secession_crisis.5.t:0 "波士顿公约"
 acw_secession_crisis.5.d:0 "新英格兰各州加入纽约的行列，单方面宣布脱离美利坚合众国独立。在马萨诸塞州波士顿召开的一次会议之后，新英格兰各州明确了他们脱离联邦的理由：他们拒绝取缔奴隶制度。"
 acw_secession_crisis.5.f:0 "“一纸法令解除了马萨诸塞州与其他州根据《美利坚合众国宪法》契约而联合起来的联邦。”——马萨诸塞州分离法令"
 acw_secession_crisis.5.a:0 "这是宪政危机！"
 acw_secession_crisis.5.tt:0 "这可能会导致驻扎在新英格兰的联邦军和自由邦军之间发生冲突。"
 acw_je_events.1.tt:0 "这可能会导致其他北方州考虑脱离……"
 acw_secession_crisis.6.t:0 "芝加哥宣言"
 acw_secession_crisis.6.d:0 "这可能会导致其他西北和中西部各州加入他们东北同胞的行列，单方面宣布脱离美利坚合众国独立。由于最近联邦和自由美国军队之间的小规模冲突，这些州已被接纳为所谓的美国自由州，成为正式的州。"
 acw_secession_crisis.6.f:0 "“……联邦政府没有听取北方的请求，这不仅伤害了密歇根人民，而且压迫了北方主张废奴的州。”——密歇根州分离条例"
 acw_secession_crisis.6.a:0 "我们将不再容忍北方这种叛国行为！战争！"
 acw_secession_crisis.6.tt:0 "南北战争正式爆发。"
 acw_secession_crisis.7.tt:0 "联邦政府对此的反应可能会导致更多的州脱离联邦……"
 acw_secession_crisis.7.t:0 "惠灵公约"
 acw_secession_crisis.7.d:0 "一场由支持自由美国的代表们所举行的大会在弗吉尼亚州惠灵市召开，会议宣布脱离美利坚合众国。代表们已经与[SCOPE.sCharacter('president').GetFullName]总统和自由美国国会接洽，希望被承认为西弗吉尼亚州。他们在离联邦首都华府如此近的地方起事，对我们的战事努力而言是无价的。"
 acw_secession_crisis.7.f:0 "我们不想成为北方的敌人。我们的声音被忽视了，我们的信念被华盛顿抛弃了。我们效忠于美利坚自由邦。"
 acw_secession_crisis.7.a.tt:0 "西弗吉尼亚将被允许加入联邦并被承认为弗吉尼亚的合法政府。"
 acw_secession_crisis.7.b.tt:0 "西弗吉尼亚州仍将是美国的一部分。"
 acw_secession_crisis.7.a:0 "我们接受西弗吉尼亚州的独立宣言。"
 acw_secession_crisis.7.b:0 "他们都是叛徒，也应被当作叛徒对待。" 
 acw_peace_treaty.1.t:0 "阿波马托克斯法院条约"
 acw_peace_treaty.1.d:0 "[SCOPE.sCountry('confederacy').GetNameNoFlag] 已彻底向我们投降了。南部邦联的首都被包围，大部分军队也被关入了我们的战俘营，[SCOPE.sCharacter('president').GetFullName]总统和邦联总统[SCOPE.sCharacter('confederate_president').GetFullName]于吉尼亚州阿波马托克斯的一所法院会面，讨论投降的问题。南方起义军同意立即停止敌对行动并接受联邦的吞并。"
 acw_peace_treaty.1.f:0 "“我不愿意见到这个国家分崩离析。不论是受到欢迎还是被人厌恶，不论是彻底成为了一个事物还是全部成为了另一个事物，这个国家一定要终止其身体与灵魂上的分裂。”"
 acw_peace_treaty.1.a:0 "在所有杀戮之后，美国内战结束了。"
 acw_peace_treaty.1.tt:0 "美国内战即将结束，南方将被联邦占领。"
 acw_peace_treaty.2.t:0 "华盛顿条约"
 acw_peace_treaty.2.d:0 "[SCOPE.sCountry('confederacy').GetNameNoFlag]彻底打败了我们。 随着我们的首都被围困，我们的大部分军队被囚禁在战俘营中，[SCOPE.sCharacter('president').GetFullName]总统和邦联总统[SCOPE.sCharacter('confederate_president').GetFullName]在纽约市会面以协商投降。南方向我们施压要求独立，我们别无选择，只能接受他们的要求。"
 acw_peace_treaty.2.f:0 "“请知悉——美利坚合众国的政府从今以后将承认美利坚联盟国的存在和独立，并永远尊重其领土完整……\n\n邦联政府已同意协助美国政府从所有邦联领土撤离所有美国人员。\n\n美利坚合众国和南方邦联不得有任何形式欠款，包括战争物资、工业物资或经济赔偿……”"
 acw_peace_treaty.2.a:0 "羞愧而耻辱的失败"
 acw_peace_treaty.2.tt:0 "邦联将保持目前的边界，但将会获得所有迪克西家乡的宣称。"
 acw_peace_treaty.3.t:0 "纽约条约"
 acw_peace_treaty.4.t:0 "华盛顿条约"
 je_acw_war:0 "美国南北战争"
 je_acw_war_reason:0 "南北战争即将打响。几十年来分裂这个国家的地方主义已经达到了沸点。美利坚合众国已与反叛国开战。成千上万的人正在为他们的家园浴血奋战。为了联邦！"
 acw_war_tt_complete:0 "合众国在南北战争中胜利"
 acw_rebel_victory:0 "合众国在南北战争中失败"
 acw_reconstruction.1.t:0 "重建国家"
 acw_reconstruction.1.d:0 "南北战争可能已经结束，但对民族之魂的战斗还未结束。联邦受到激进分离主义者的挑战，但还没彻底失败。随着宪政危机的结束和叛军势力的完全失败，是时候带给世界一个崭新的[SCOPE.sCountry('united_states').GetNameNoFlag]了。"
 acw_reconstruction.1.f:0 "“我不愿意见到这个国家分崩离析。不论是受到欢迎还是被人厌恶，不论是彻底成为了一个事物还是全部成为了另一个事物，这个国家一定要终止其身体与灵魂上的分裂。”"
 acw_reconstruction.1.a:0 "我们的伤口将会愈合。"
 acw_reconstruction.1.b:0 "必须为所有人重建联邦"
 acw_reconstruction_emancipation.tt:0 "所有邦联州的奴隶都将被解放"

 je_acw_reincorporate:0 "重新接纳脱离州"
 je_acw_reincorporate_status:0 "让之前脱离联邦的州再次回归祖国怀抱，成为完完全全的已整合州。"
 je_acw_reincorporate_reason:0 "再度接纳这些叛乱州回归联邦对于修复受动摇的国家精神不可或缺，并有助于为政府建立新的执政基础。"
 je_acw_equality:0 "内战修正案"
 je_acw_equality_status:0 "建立一个让所有人，无论是北方人还是南方人，是黑人还是白人，在我们这个国家都真正平等的体系，我们将修正合众国的宪法以追求真正意义上的人人平等。"
 je_acw_equality_reason:0 "美国因为深层问题而打了一场残酷的战争，这些问题在数代人的长期掩盖下而变得无法忽视。我们必须避免重蹈覆辙，直面问题，以免它们在另一个世纪里恶化。为了实现这一目标，我们必须在宪法上禁止奴隶制，并确保以前的奴隶人口不再受到我国的歧视。"
 acw_african_american_culture_complete_tt:0 "奴隶制已被宪法禁止，非裔美利坚文化不再受歧视。"
 acw_african_american_culture:0 "非裔美利坚文化成为我国的一个主流文化。"
 je_acw_wild_wild_west:0 "狂野无序的西部"
 je_acw_wild_wild_west_reason:0 "在内战期间，联邦政府全力致力于打败叛乱的各州，因此我们的西部领土成为了几乎没有合适执法,无法无天的地方。东部的战争使西部边疆陷入了绝对的混乱之中；是时候恢复秩序了。"
 unreconstructed_state:0 "未重建地区"
 acw_reconstruction.2.t:0 "国家重建"
 acw_reconstruction.2.d:0 "我们的国家已经重建了自己，创造了一些独特的、新的、最重要的统一的东西。美国已经准备好走上一条新的道路，永远统一在星条旗下。[SCOPE.sCountry('united_states').GetNameNoFlag]已经从混乱的内战中走出来，成为一个更加统一、集中的国家。现在是时候重新拾起我们霸权的残骸，重新夺回我们在全球舞台上的地位了。"
 acw_reconstruction.2.f:0 "“正因为我们所有的过错，我们已重塑我国，为我们创建了一个不会从这片土地上消亡的政府。”"
 acw_reconstruction.2.a:0 "我们再次合众为一。"
 usa_reconstruction_sectionalism_gone.tt:0 "主导美国政治的区域和政治地方主义将逐渐消失。"
 acw_buildup.1.t:0 "众议院言论限制法"
 acw_buildup.1.d:0 "由众议员[SCOPE.sCharacter('gag_representative').GetFullName]领导的众议院成员联盟，提出了在众议院实行禁言规则的想法。这一规则将禁止众议院讨论或审议有关全国任何地方的奴隶制的任何类型的决议。北方的许多人鄙视这一想法，但南方的人认为这可能会平息支持和反对奴隶制的人之间的紧张关系。"
 acw_buildup.1.f:0 "“所有涉及奴隶制或奴隶制废除的请愿书、纪念书、决议、提案或文件，无论在如何或任何程度上涉及奴隶制或奴隶制废除的，都应放在桌子上，不予印刷或参考，并且…在此之后不应采取任何进一步行动。”"
 acw_buildup.1.a:0 "我们现在只得如此。"
 usa_house_gag_rule:0 "众议院言论限制法"
 acw_buildup.2.t:0 "[SCOPE.sState('texas').GetName]问题"
 acw_buildup.2.d:0 "[SCOPE.sState('texas').GetName]已经被[SCOPE.sCountry('united_states').GetNameNoFlag]吞并，它被接纳为一个州，这引起了人们对它在联邦中地位的质疑。北方的废奴主义者希望在该州禁止奴隶制，防止奴隶制蔓延到前共和国。然而，南方的人则以民众的意愿为由，推动奴隶制向德克萨斯州的土地延伸。这个问题已经放到了总统[SCOPE.sCharacter('president').GetFullName]的桌上。"
 acw_buildup.2.f:0 "“[SCOPE.sState('texas').GetName]的公民应被纳入美国联邦，维持并保护其自由与财产的任意享受，并在符合联邦宪法原则的情况下，尽快被允许享受美国公民的所有权利、特权和豁免权。”"
 acw_buildup.2.a:0 "[SCOPE.sState('texas').GetName]肯定是蓄奴州"
 acw_buildup.2.b:0 "[SCOPE.sState('texas').GetName]肯定是自由领地"
 texas_slave_state.tt:0 "德克萨斯将被承认为蓄奴州"
 texas_free_state.tt:0 "德克萨斯将被承认为自由州"
 acw_buildup.3.t:0 "[SCOPE.sCharacter('wilmot_proviso_ig_leader').GetLastName]但书"
 acw_buildup.3.d:0 "国会议员[SCOPE.sCharacter('wilmot_proviso_ig_leader').GetFullName]，[SCOPE.gsInterestGroup('wilmot_proviso_ig').GetName]的领导人，已经提议在我们所有的西部新领土上直接禁止奴隶制。北方的许多人都非常支持这一提议，但南方的人谴责这一计划是对持有奴隶的人的侮辱。一位南方议员，[SCOPE.sCharacter('anti_wilmot_proviso_ig_leader').GetFullName]，提出了人民主权的想法，允许这些地区的人民投票决定是否在其境内建立奴隶制。"
 acw_buildup.3.f:0 "“美国根据任何条约从墨西哥共和国收购的任何领土，都有一个最基础条件，即上述领土内不得存在奴役或非自愿劳役，但已定罪的罪犯除外。”"
 acw_buildup.3.a:0 "驳回但书，让各州自决是否实行奴隶制。"
 acw_buildup.3.b:0 "接受但书，在西部废除奴隶制。"
 acw_buildup.3.c:0 "驳回但书，在西部扩张奴隶制。"
 acw_popular_sovereignty.tt:0 "这将导致后来北方和南方之间的妥协。"
 acw_abolish.tt:0 "这将废除西部的奴隶制，却将大大激怒南方的奴隶主！"
 acw_dont_abolish.tt:0 "这将在西部传播奴隶制，却将大大激怒北方废奴主义者！"
 acw_buildup.4.t:0 "1850年妥协案"
 acw_buildup.4.d:0 "参议员 [SCOPE.sCharacter('north_leader').GetFullName] 和 [SCOPE.sCharacter('south_leader').GetFullName] 向国会提出了一系列法案，旨在缓和正在进行的有关从[SCOPE.sCountry('mexico').GetNameNoFlag]获得的新领土的奴隶制辩论中的紧张局势。在许多条款中，该方案将允许 [SCOPE.sState('california').GetName] 作为自由州加入联邦，实施逃奴法案，禁止在[SCOPE.sState('district_columbia').GetName] 的奴隶贸易，并将西部新土地组织成能够自由投票支持奴隶制的领土。该妥协方案相当不受欢迎，但人们相信，制定该方案将至少在几年内缓解北方和南方之间的大部分政治紧张。"
 acw_buildup.4.f:0 "为了联邦合众国的和平、和睦与和谐，有必要在公平、平等和公正的基础上友好地解决和调整它们之间因奴隶制而产生的所有现有争议问题：因此......"
 acw_buildup.4.a:0 "这次妥协似乎不会持续太久……"
 acw_buildup_slave_law.tt:0 "1850年的《逃奴法案》可能会被再次被提起……"
 acw_buildup_california.tt:0 "加州将被接纳为一个自由州。"
 acw_buildup_kansas_nebraska.tt:0 "这将解锁关于中西部领土的决议!"
 acw_buildup.6.t:0 "逃奴法案"
 acw_buildup.6.d:0 "按照1850年的妥协协议，国会终于同意通过一项限制性更强的《逃亡奴隶法案》。该法案现在完全要求所有逃出主人的奴隶必须被送回主人身边，无论他们是否逃到了自由州。这一法案激怒了北方的广大民众，他们觉得自己现在必须在反对奴隶制方面发挥积极作用；然而，南方人却很高兴，觉得这一法案将保护他们的利益。"
 acw_buildup.6.f:0 "“这太离谱了！我无意维系这个肮脏机构的存在。我保证，凡到我这里来的奴隶都将获得自由！”"
 acw_buildup.6.a:0 "这会使国家进一步两极分化吗？"
 acw_fugitive_slave_act.tt:0 "这将触发逃奴事件。"
 fugitive_slave_act_pleaser.tt:0 "这将取悦南方，却会激怒北方。"
 kansas_nebraska:0 "堪萨斯-内布拉斯加法案"
 kansas_nebraska_desc:0 "国会议员要求将1803年从法国获得的路易斯安那州划分为堪萨斯州和内布拉斯加州。尽管他们的论点是围绕着横贯大陆的铁路的建设，但不可避免的涉及了奴隶制问题。"
 je_usa_western_territories:0 "西部日益严重的暴力现象"
 je_usa_western_territories_status:0 "西部领地将决定是否实行奴隶制。"
 je_usa_western_territories_reason:0 "奴隶制的辩论导致了我们在大平原和其他地区的各种未合并领土上的问题。支持和反对奴隶制的人纷纷涌入西部新的土地，希望将选票摇向他们各自的意识形态。不足为奇的是，由于他们的思想对立，他们已经开始发生冲突，准军事团体相互之间进行了全面的暴乱斗争。"
 je_usa_western_territories_organized.tt:0 "关于我们所有未合并领土上存在奴隶制的事件将定期发生。"
 je_usa_western_territories_complete.tt:0 "此日志条目已超时。"
 bleeding_state_end.tt:0 "西部政治暴力将结束。"
 acw_buildup.7.t:0 "堪萨斯-内布拉斯加法案"
 acw_buildup.7.d:0 "南方参议员 [SCOPE.sCharacter('south_leader').GetFullName] 已向国会提出一项新法案：[SCOPE.sState('kansas').GetName]-[SCOPE.sState('nebraska').GetName] 法案。该法案将开放 [SCOPE.sState('kansas').GetName] 和 [SCOPE.sState('nebraska').GetName] 两个州，并允许民众自行选择是否蓄奴，尽管此法案的真正意图是修建一条横跨新大陆的铁路。更重要的是，该法案将废除密苏里妥协案，该妥协案阻止奴隶制在 北纬36°30' 以北扩张。"
 acw_buildup.7.f:0 "“现在是时候把目光从墨西哥的土地上移到当下了。这些领土已经做好了为美国利益而发光发热的准备。议长先生，这项法案将允许大陆上的人口自由流动，并且人们将自主决定是否扩大奴隶制”"
 acw_buildup.7.a:0 "主权在民行得通吗？"
 acw_kansas_nebraska_violence.tt:0 "这可能会导致该地区的暴动……"
 acw_buildup.8.t:0 "流血的[SCOPE.sState('bleeding_kansas').GetName]"
 acw_buildup.8.d:0 "奴隶制的反对者和支持者都已涌入[SCOPE.sState('bleeding_kansas').GetName]，他们希望按照自己的意愿构建政府。两者的准军事团体开始对彼此和平民实施暴力行为。国会尚不能确定该如何应对，因此除了少数参议员和众议员外，其余人一直保持沉默。但不管他们说了什么，[SCOPE.sState('bleeding_kansas').GetName]仍然血流漂杵。"
 acw_buildup.8.f:0 "“在上帝面前，并有诸位见证者在场，从此刻起，我将自己的生命敬献给消灭奴隶制的事业。这片罪恶土地的罪行唯有鲜血方能洗净。”"
 acw_buildup.8.a:0 "[SCOPE.sState('bleeding_kansas').GetName]不能听命于歹徒!"
 acw_buildup.8.b:0 "奴隶制必须蔓延至[SCOPE.sState('bleeding_kansas').GetName]！"
 acw_bleeding_kansas_free.tt:0 "[SCOPE.sState('bleeding_kansas').GetName]会保持自由领地的地位。"
 acw_bleeding_kansas_slave.tt:0 "[SCOPE.sState('bleeding_kansas').GetName]会保持蓄奴州的地位。"
 bleeding_state:0 "流血州"
 acw_buildup.10.t:0 "[SCOPE.sCharacter('charles_sumner_leader').GetFullName]受杖击事件"
 acw_buildup.10.d:0 "国会议员就西部地区持续的政治暴力在国会发表演讲后，[SCOPE.sCharacter('charles_sumner_leader').GetFullName]，一位直言不讳的北方废奴主义议员，被南方奴隶主义议员[SCOPE.sCharacter('preston_brooks_leader').GetFullName]用手杖痛殴。[SCOPE.sCharacter('charles_sumner_leader').GetLastName]在参议院大厅中央他的席位前遇袭。其他几名南方代表为施暴者[SCOPE.sCharacter('preston_brooks_leader').GetLastName]欢呼，并且阻止了目击者上前帮忙。殴打持续了几分钟后，北方代表们才设法阻止了[SCOPE.sCharacter('preston_brooks_leader').GetLastName]。而[SCOPE.sCharacter('charles_sumner_leader').GetLastName]在自己的血泊中陷入了昏迷。"
 acw_buildup.10.f:0 "“[SCOPE.sCharacter('charles_sumner_leader').GetLastName]先生，我读了你的演讲稿两遍，这完全是对我们州的诽谤。”\n\n当[SCOPE.sCharacter('charles_sumner_leader').GetLastName]先生从座位上站起来的时候，[SCOPE.sCharacter('preston_brooks_leader').GetLastName]先生突然用手杖狠狠地敲击了他的脑袋。他并没有停下，接着殴打[SCOPE.sCharacter('charles_sumner_leader').GetLastName]，接着他的南方同僚抄起武器，对着向他们走过来的人们大喊：\n\n“让他们打！该死，让他们打！”"
 acw_buildup.10.a:0 "[SCOPE.sCharacter('preston_brooks_leader').GetFullName]是个英雄！我们不会有任何举动。"
 acw_buildup.10.a.tt:0 "[SCOPE.sCharacter('charles_sumner_leader').GetFullName]辞去公职。"
 acw_buildup.10.b:0 "[SCOPE.sCharacter('preston_brooks_leader').GetFullName]袭击了一位公民！他必须免去公职并被逮捕。"
 acw_buildup.10.b.tt:0 "[SCOPE.sCharacter('preston_brooks_leader').GetFullName]被免去公职。"
 acw_buildup.11.t:0 "约翰·布朗的最后一击"
 acw_buildup.11.d:0 "一位名叫约翰·布朗的激进废奴主义者在对联邦军械库的袭击失败后于[SCOPE.sState('john_brown_raid').GetName]被捕。这次袭击的目的是希望在[SCOPE.sState('john_brown_raid').GetName]煽动奴隶起义，并用军械库内的武器来武装起义者。然而突袭失败了，约翰·布朗被美国海军陆战队的一支连队俘虏。他在[SCOPE.sState('john_brown_raid').GetName]受审，并被判处死刑。北方很多人把他当作烈士，而南方人则谴责他的行为是叛乱。"
 acw_buildup.11.f:0 "“如果我是为了那些有钱人、政客、投机者、还是所谓的伟人卖命，哪怕只是为他们的亲友朋党卖命，为特权阶级卖命。那么我所做的一切都不会被称为犯罪，甚至还会得到奖赏。”——约翰·布朗"
 acw_buildup.11.a:0 "这是西部所有暴力事件的顶峰。"
 ostend_manifesto:0 "奥斯坦德宣言"
 ostend_manifesto_desc:0 "许多南方国会议员向国会提出一项议案，即购买古巴岛为蓄奴州，以平衡我们西部新领土上的自由州。如果古巴岛为非卖品的话，那我们得到它的方式或许…可以更直接一点。\n\n这一决议已经展开行动！奥斯坦德宣言事件链目前尚未完成。"
 ostend.1.t:0 "奥斯坦德宣言"
 ostend.1.d:0 "[SCOPE.sState('cuba').GetName]岛一直是[SCOPE.sCountry('united_states').GetNameNoFlag]所渴求的领土。该领土目前处于[SCOPE.sCountry('cuba_owner').GetAdjective]的控制之下，但许多南方国会议员寻谋改变这一现状。他们鼓动[SCOPE.sCharacter('president').GetFullName]总统去和[SCOPE.sCountry('cuba_owner').GetAdjective]磋商交易[SCOPE.sState('cuba').GetName]。许多北方国会议员认为，这不过是是南方人为增加一个蓄奴州而采取的把戏，但南方议员们否认了这一点，并说[SCOPE.sState('cuba').GetName]和从[SCOPE.sCountry('mexico').GetNameNoFlag]获得的领土一样合法。"
 ostend.1.f:0 "“如果让[SCOPE.sState('cuba').GetName]变成像圣多明戈那样的黑人聚集地，那随之而来的会是对白人种族的恐怖主义，并且动乱会蔓延到我们的临近海岸，这是对我们联邦的公正结构的一种威胁与消耗，这无疑是我们的失责，也有愧于我们的先祖，更是对我们子孙后代的背叛。”"
 ostend.1.a:0 "让我们用一份报价靠近[SCOPE.sCountry('cuba_owner').GetAdjective]。"
 ostend.1.b:0 "我们现在不能为此事烦恼。"
 ostend_approach.tt:0 "我们将与 [SCOPE.sCountry('cuba_owner').GetAdjective] 政府接洽，提出以 100 万英镑购买 [SCOPE.sState('cuba').GetName] 。"
 ostend_later.tt:0 "什么都不会发生，奥斯坦德宣言决议可能会再次可用。"
 je_acw_wild_wild_west_status:0 "驯服西部边境"

acw_reconstruction.6.t: "第十五修正案"
acw_reconstruction.6.d: "奴隶制已被废除，自由民获得了法律面前的平等保护。最后一步是赋予自由民投票权。这项修正案将确保黑人的声音在共和国的选举过程中被听见，并确保任何人——无论种族——永远不会再被剥夺选举权。"
acw_reconstruction.6.f: "“合众国或任何一州不得以种族、肤色或曾经的奴役状态为由，剥夺或限制合众国公民的投票权。” ——《美利坚合众国宪法》第十五修正案"
acw_reconstruction.6.a: "最后一块拼图已就位。"
acw_reconstruction.6.tt: "非裔美国文化将成为美国的主要文化之一。"

#END 重建修正案-----------------------------------------------

acw_reconstruction.7.t: "总统妥协案"
acw_reconstruction.7.d: "总统[SCOPE.sCharacter('president').GetFullName]的近期当选引发了南北双方关于选举舞弊的指控。南方声称北方为[SCOPE.sCharacter('president').GetLastName]操纵了选票，而北方则宣称南方无法举行公正选举。南北双方重要政客达成妥协，南方提出条件：联邦军队撤出南方，允许南方自行制定关于[SCOPE.sCulture('afro_american').GetName]群体地位的法律。只要满足这些条件，南方将承认[SCOPE.sCharacter('president').GetLastName]的当选合法性。这些要求将终结北方对南方的控制，并实质上终止重建时期。"
acw_reconstruction.7.f: "“我们的要求很简单。南方与北方一样是联邦不可分割的一部分。我们绝不能——也绝不会——接受联邦对我们主权的侵犯。将立法权交还给南方各州的真正代表，我们便会承认你们的代表。”"
acw_reconstruction.7.a: "好吧。我们只能接受妥协。"
acw_reconstruction.7.tt: "国会将宣布重建结束，联邦军队撤离南方。"
usa_compromise_1877.tt: "国会宣布重建时期结束。"
usa_compromise_1877: "1877年妥协案"
for_the_union_modifier:0 "为了联邦" 
acw_reconstruction.3.t: "重建修正案"
acw_reconstruction.3.d: "内战已结束，南方处于我们的掌控之中。奴隶制度、平等的宪法保护以及黑人选举权是国会大厅中最重要的问题。南方在军事占领下，国会没有任何障碍可以在宪法中确立对白人和黑人种族的平等权利。这个过程将需要时间，但一定会完成。"
acw_reconstruction.3.f: "“如果没有斗争，就没有进步。那些声称支持自由，却贬低激进主义的人，正是那些想要收获而不耕耘的人。他们想要雨水，却不愿接受雷电的轰鸣。他们想要海洋，却不愿面对它那可怕的浪涛。这场斗争可能是道德的，也可能是身体上的，或者两者兼有；但它必须是一次斗争。” — 弗雷德里克·道格拉斯"
acw_reconstruction.3.a: "自由的旅程由此开始。"
acw_reconstruction.3.tt: "重建修正案的决定将会可用。"

#第十三修正案
thirteenth_amendment: "第十三修正案"
thirteenth_amendment_desc: "第十三（XIII）修正案已被提议给国会。它将在美国管辖的任何土地上禁止奴隶制度，并进一步禁止任何形式的强迫劳动，除非是被判定为犯罪的人。"
thirteenth_amendment_congress.tt: "国会将开始修改宪法的过程。"

acw_reconstruction.4.t: "第十三修正案"
acw_reconstruction.4.d: "现在是时候让国会通过第十三修正案了。所有形式的奴隶制度，无论名称为何，无论出于何种原因，都将从[SCOPE.sCountry('united_states').GetNameNoFlag]彻底和永久地废除。数百万男女儿童，无论黑白，都在全国范围内爆发庆祝活动。经过几个世纪的存在，奴隶制度终于将被彻底废除。"
acw_reconstruction.4.f: "“除非作为犯罪处罚且当事人已被正式定罪，否则奴隶制或强迫劳动在美国及其管辖的任何地方均不得存在。” — 美国宪法第十三修正案"
acw_reconstruction.4.a: "经过如此长时间，辩论终于结束了。"
acw_reconstruction.4.tt: "奴隶制度将在全国范围内废除。"
usa_thirteenth_amendment.tt: "美国不能在没有宪法修正案的情况下改变奴隶制法律。"
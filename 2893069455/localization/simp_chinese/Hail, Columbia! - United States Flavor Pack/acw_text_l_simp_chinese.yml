l_simp_chinese:
 acw_events.1.t:0 "废奴主义者的殉道"
 acw_events.1.d:0 "一名狂热的废奴主义作家在与聚集到他家门口的支持奴隶制的暴徒的枪战中死去。这段事迹获得了全国关注，这让之前对此漠不关心的上层与下层人民都变得激进了起来。"
 acw_events.1.f:0 "他的朋友叹了一口气。葬礼规模很小，以免暴徒群起出现。墓碑也很简朴，不引人注意。唯一允许的修饰是一段简短的铭文：\n\n“此处长眠着一位勇敢的男人：放过他的坟墓吧。”"
 acw_events.1.a:0 "可怕！必须抵制这些蓄奴主义者的暴行。"
 acw_events.1.b:0 "必须制止废奴主义者的这种煽动行为！"
 acw_events.2.t:0 "逃奴"
 acw_events.2.d:0 "[SCOPE.sCharacter('slaver_ig_leader').GetFullName]的一名奴隶从[SCOPE.sCharacter('slaver_ig_leader').GetHerHis]的庄园逃往了北方的自由州。[SCOPE.sCharacter('slaver_ig_leader').GetLastName]要求将那名奴隶遣返，而废奴主义者则呼吁对[SCOPE.sCharacter('slaver_ig_leader').GetHerHis]的要求不予理睬。"
 acw_events.2.f:1 "“没有什么东西比公平更令我关注的了。如果某人弄丢了他的夹克，那么把失物归还给他再正常不过了，对吗？我只不过是请求把我的东西还给我。怎么就引起了这么大的骚动？”"
 acw_events.2.a:0 "我们应当找到[SCOPE.sCharacter('slaver_ig_leader').GetFullName]的逃奴并将其遣返。"
 acw_events.2.b:0 "自由的土地上人人皆自由，政府不会为[SCOPE.sCharacter('slaver_ig_leader').GetFullName]提供帮助。"
 acw_events.4.t:0 "被遗忘的事件"
 acw_events.7.t:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('random_free_state_of_place')]自由州"
 acw_events.7.d:0 "[SCOPE.sState('free_state_of_county').GetName]的反分离主义煽动者召集了其支持势力，并宣布成立统一派政府。"
 acw_events.7.f:0 "“作为对于分离主义者的反抗，我们，依照人民的决议，脱离那些叛国者，并宣布我们的纲领为自由与独立，保持对[SCOPE.sCountry('unionist_usa').GetName]效忠。”"
 acw_events.7.a:0 "展示一下力量就能让他们顺从。"
 acw_events.7.b:0 "我们现在没法对付他们。"
 acw_events.8.t:0 "火车头大追逐"
 acw_events.8.d:0 "敌军劫掠者成功偷走了一辆火车头，在被停下之前破坏了[SCOPE.sState('great_locomotive_chase_state').GetName]几英里的铁路和电报线。"
 acw_events.8.f:0 "他们那疲惫的火车头[SCOPE.GetRootScope.GetCountry.GetCustom('random_csa_acw_locomotive')]，每次喘气所喷出的缕缕黑烟都越来越虚弱。这些劫掠者几英里之前就耗光了燃料，而他们所破坏的铁路也不足以拯救他们。远处，追击者的滚滚浓烟越来越近。这场追击即将结束。"
 acw_events.8.a:0 "这一切都他妈的见鬼了，现在就把所有轨道和电线都修好！"
 acw_events.8.b:0 "让我方部队留在火车上，这会减慢速度，但更加安全。"
 acw_events.8.c:0 "下一次，我们要在劫掠者行动前就抓住他们。"
 acw_events_low_tt:0 "内战紧张度轻微上升。"
 acw_events_med_tt:0 "内战紧张度中度上升。"
 acw_events_high_tt:0 "内战紧张度显著上升。"
 acw_followup_events.1.t:0 "密谋刺杀[SCOPE.sCharacter('lincoln_proxy').GetLastName]"
 acw_followup_events.1.d:0 "近来叛军的同情者夺去了[SCOPE.sCharacter('lincoln_proxy').GetFullName]的性命。尽管此人在行凶之后被当场抓住，其同谋也都暴露，[SCOPE.sCharacter('lincoln_proxy').GetLastName]之死是美国历史这段悲剧时期的灰暗终结。"
 acw_followup_events.1.f:0 "“[SCOPE.sCharacter('lincoln_proxy').GetFullNameNoFormatting]响应职责的呼召，接过这一危险的职位，[SCOPE.sCharacter('lincoln_proxy').GetHerHis]的生命尽管被摧毁，却绝没有丧亡。我国的巨大污点，我国格的巨大玷污，我们人民之间倾轧与争吵的巨大源头，都因为[SCOPE.sCharacter('lincoln_proxy').GetHerHis]的勇气和坚忍而被抹消和去除。[SCOPE.sCharacter('lincoln_proxy').GetFullNameNoFormatting]从此将青史留名。”"
 acw_followup_events.1.a:0 "今日举国哀悼。"
 acw_followup_events.2.t:0 "密谋刺杀[SCOPE.sCharacter('lincoln_proxy').GetLastName]"
 acw_followup_events.2.d:0 "近来叛军的同情者企图刺杀[SCOPE.sCharacter('lincoln_proxy').GetFullName]。此人在企图闯入时被抓，他的意图和同谋也都暴露，[SCOPE.sCharacter('lincoln_proxy').GetLastName]利用这个机会，再次动员人民支持[SCOPE.sCharacter('lincoln_proxy').GetHerHis]的事业。"
 acw_followup_events.2.f:0 "“这些蠢货连枪都不会开，怎会认为他们能东山再起？”"
 acw_followup_events.2.a:0 "避免了一场悲剧！"
 acw_followup_events.3.t:0 "密谋刺杀[SCOPE.sCharacter('lincoln_proxy').GetLastName]"
 acw_followup_events.3.d:0 "近来叛军的同情者企图刺杀[SCOPE.sCharacter('lincoln_proxy').GetFullName]。事情不如刺客计划那般发展。"
 acw_followup_events.3.f:0 "[SCOPE.sCharacter('lincoln_proxy').GetFullName]听到了[SCOPE.sCharacter('lincoln_proxy').GetHerHim]身后地板的嘎吱声。在[SCOPE.sCharacter('lincoln_proxy').GetHerHis]的攻击者扣下德林加枪的板机之前，[SCOPE.sCharacter('lincoln_proxy').GetLastName]已经制服了他。“魔鬼！野狗！你不懂得道德准则吗？”[SCOPE.sCharacter('lincoln_proxy').GetSheHe]喊叫道，吐出的每一个字之间都用[SCOPE.sCharacter('lincoln_proxy').GetHerHis]的徒手对[SCOPE.sCharacter('lincoln_proxy').GetLastName]的“刺客”打出一拳。"
 acw_followup_events.3.a:0 "这就是刺客的下场！"
 acw_followup_events.4.t:0 "四十英亩地和一头骡子"
 acw_followup_events.4.d:0 "在对抗分离主义者的战争中，许多被奴役的人民相信只要他们被释放，他们都将获得权利，拥有他们一直被迫在其上劳作的土地。[SCOPE.sState('land_redistribution_state').GetName]的人民向当地政府提出这一要求，当地政府又来向我们寻求指导。"
 acw_followup_events.4.f:0 "“土地！土地才是我们需要的！我无法用投票箱喂饱自己——给我那片我一直在其上劳作的土地，这样我就能喂饱我的家人。”"
 acw_followup_events.4.a:0 "授权有限的土地再分配。"
 acw_followup_events.4.b:0 "经济措施会导致骚乱。"
 



 acw_followup_events.5.t:0 "[SCOPE.sState('supremacist_violence_state').GetName]的种族至上主义暴力"
 acw_followup_events.5.d:0 "白人暴徒和黑人释奴间的暴力导致了[SCOPE.sState('supremacist_violence_state').GetName]中的严重紧张局势。"
 acw_followup_events.5.f:0 "“暴徒们无情地重踏、踢击和棒打他人。街道因为无辜者的血而变得滑溜溜的。射空的左轮手枪当啷砸在地上，因为攻击已经变得如此狂乱，人们都不再费心去装弹。直到戒严令宣告、军队开进之后，秩序的假象才得到恢复。”"
 acw_followup_events.5.a:0 "使用政府的全部实力去保护释奴。"
 acw_followup_events.5.b:0 "我们不能派遣部队去疏远当地领袖。"
 acw_followup_events.6.t:0 "救赎者"
 acw_followup_events.6.d:0 "由前联盟国分子和联盟国同情者组成的临时政治联盟通过光彩或不光彩的手段赢得了[SCOPE.sState('redeemer_state').GetName]州政府的控制权，威胁到了正在进行的南方重建进程。"
 acw_followup_events.6.f:0 "“画出一条线，线的一边是智慧、美德、自尊和民主；而线的另一边是残暴和恐怖之下的绝对无约束政治霸权，你在这里看不到任何自由政府的特征，只有老南方最可悲的暴政，绝望地想要扒回那一度毒害大地的权力。”"
 acw_followup_events.6.a:0 "和解需要与这些人达成一致。"
 acw_followup_events.6.b:0 "逮捕这些人，扶植新的州政府。"
 acw_followup_events.7.t:0 "民兵组织恐吓选民"
 acw_followup_events.7.d:0 "反对南方重建的政治团体组织了武斗部队去恐吓[SCOPE.sState('paramilitary_intimidation_state').GetName]的投票者，意图让自己重返权位。"
 acw_followup_events.7.f:0 "“尽管我理解我们的组织在某些人群中造成了惊骇，我可以向你们保证，我们的刺刀与步枪仅作展示之用。”"
 acw_followup_events.7.a:0 "只要州政府忠诚就行了。"
 acw_followup_events.7.b:0 "骇人听闻！立刻解散这些部队！"
 acw_followup_events.8.t:0 "提包来客"
 acw_followup_events.8.d:0 "身处[SCOPE.sState('carpetbagger_state').GetName]州的北方人被本地人污蔑为麻烦制造者和剥削者。另一方面，位于[SCOPE.sState('carpetbagger_home').GetName]的作家和演说家则要求政府保护这些北方人。"
 acw_followup_events.8.f:0 "“我来到此地是为了在颠覆奴隶制度之后于这里建设些更加美好的事物，同时我肯定不会介意在这个过程中给我自己弄来些东西，但我得到了什么呢？我两手空空，除了冲着我名字来的连串诽谤和威胁外什么都没有。”"
 acw_followup_events.8.a:0 "让[SCOPE.sState('carpetbagger_state').GetName]人做他们想做的事。"
 acw_followup_events.8.b:0 "我们必须保护所有美国人，即使这会激怒某些人。"
 wild_west.1.t:0 "[SCOPE.sState('bank_robbery_state').GetName]的亡命之徒！"
 wild_west.1.d:0 "一群臭名昭著的亡命匪帮一直在[SCOPE.sState('bank_robbery_state').GetName]各个体面的定居点制造恐惧。"
 wild_west.1.f:0 "那硬汉将左轮手枪插回皮套，把警官的尸体踢到一边。“我说过了，”他粗声大笑道，“我说过如果我能得到自由，[SCOPE.GetRootScope.GetCountry.GetCustom('american_outlaw_gang')]会让他们所有人知道邪恶透顶#S 究竟#!是什么意思。”"
 wild_west.1.a:0 "让当地警长处理。"
 wild_west.1.b:0 "雇佣平克顿侦探——他们知道要怎么表示强硬。"
 wild_west.1.c:0 "国民警卫队的枪会阻止这些亡命之徒。"
 wild_west.2.t:0 "铁马之劫"
 wild_west.2.d:0 "土著劫掠越来越频繁，铁路成了尤其常见的目标。[SCOPE.sState('raided_railroad').GetName]的公民要求政府行动。"
 wild_west.2.f:0 "“我们建造了横跨荒芜大地的铁路线，可是他们不管怎样都要来袭击我们！火车不断遇袭，铁轨不停被破坏，这我们还能做得成什么事？”"
 wild_west.2.a:0 "出动军队！"
 wild_west.2.b:0 "我们爱莫能助。"
 wild_west.2.c:1 "让我们与[SCOPE.sCulture('native_people_infringed').GetName]人领袖进行会谈，达成协定吧。"
 wild_west.3.t:0 "牧场枪战"
 wild_west.3.d:1 "[SCOPE.sState('OK_corral_state').GetName]的执法官与数个牛仔发生交火。随后的调查显示，冲突是由美国法警和当地涉案公民的私人恩怨引发的，并非是在执法。现在人们要求执行正义——针对这些执法官。"
 wild_west.3.f:1 "“不是吧，不是吧，有人想要试试自己的运气？看见这个徽章了吗？它的意思是在这里我说了算！老子就是正义！现在滚吧，这里没什么好看的。”"
 wild_west.3.a:0 "执法人员就是法律的化身，我们可不能打压法律。"
 wild_west.3.b:0 "暂时从[SCOPE.sState('OK_corral_state').GetName]召回法警。"


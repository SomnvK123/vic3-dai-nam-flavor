l_simp_chinese:
 gov_usfp_federal_republic_presidential:0 "联邦共和国"
 gov_usfp_federal_republic_presidential_desc:2 "这是一种[concept_government_type]，[concept_head_of_state]是[Concept('concept_election','$concept_elected$')][Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]，其相当大的权力下放给[Concept('concept_election','$concept_elected$')]国会和各个州政府。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_principal_chiefdom:0 "酋邦"
 gov_usfp_principal_chiefdom_desc:3 "这种[concept_government_type]下，[concept_country]由[Concept('concept_ruler','$RULER_TITLE_PRINCIPAL_CHIEF$')]的领袖统治。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_tribal_confederation: "部落联盟"
 gov_usfp_tribal_confederation_desc: "这种[concept_government_type]下，政权由多个结盟国家共同组成。每个成员国基本上都享有自治权，但当决策影响整个联盟时，各国领导人会召开部落议会。在必要时，一位[Concept('concept_ruler','$RULER_CHIEFTAIN$')]可以充当#italic 事实上的#![concept_head_of_state]。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_theodemocracy: "神权民主国"
 gov_usfp_theodemocracy_desc: "这是一种将民主传统与耶稣基督后期圣徒教会的等级制度相结合的[concept_government_type]。教会主席团由一位担任[concept_head_of_state]的[Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]领导。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_federal_territory: "联邦直辖区"
 gov_usfp_federal_territory_desc: "这是一个由美国联邦政府控制的领地，由指定的[Concept('concept_ruler','$RULER_TITLE_GOVERNOR$')]管理。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_congressional_republic: "议会共和国"
 gov_usfp_congressional_republic_desc: "这种[concept_government_type]下，国家由[Concept('concept_election','$concept_elected$')]产生的议会统治，议会由[Concept('concept_ruler','$RULER_TITLE_SPEAKER_OF_THE_HOUSE$')]领导。尽管名义上存在一位[Concept('concept_election','$concept_elected$')]的[Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]，但他们在政府中并无实权。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 RULER_TITLE_SPEAKER_OF_THE_HOUSE: "国会议长"
 gov_usfp_syndicalist_federation: "工团联邦"
 gov_usfp_syndicalist_federation_desc: "这种[concept_government_type]下，[concept_country]由工团联邦的[Concept('concept_election','$concept_elected$')]委员会管辖\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_syndicalist_federation_anarchist: "工团联邦"
 gov_usfp_syndicalist_federation_anarchist_desc: "这是一种[concept_government_type]，[concept_country]由去中心化的联合工团所统治。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 RULER_TITLE_DELEGATE: "代表"
 gov_usfp_private_colony: "私人殖民地"
 gov_usfp_private_colony_desc: "这是美国殖民协会建立的一个私人[concept_government_type]，目的是在非洲建立一个自由人共和国。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_tribal_confederation_centralized: "联盟"
 gov_usfp_tribal_confederation_centralized_desc: "这是一个[concept_government_type]，由多个国家组成，并在一个[Concept('concept_ruler','$RULER_TITLE_PRINCIPAL_CHIEF$')]的领导下结成联盟。\n\n$TRANSFER_OF_POWER_NAME_DESC$"

  gov_usfp_indian_territory:0 "印第安领地"
  gov_usfp_indian_territory_desc:0 "这是由[concept_government_type]构成的行政实体，包含被强制迁移至此的不同原住民部落。[Concept('concept_ruler','$RULER_TITLE_PRINCIPAL_CHIEF$')]担任#italic 事实上的#! [concept_head_of_state]。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
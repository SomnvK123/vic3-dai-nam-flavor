l_simp_chinese:
 concept_usfp_westward_expansion: "西进运动"
 concept_usfp_westward_expansion_desc: "随着美国控制北美洲西部的[Concept('concept_state', '$concept_states$')]，其[concept_primary_cultures][Concept('concept_homeland', '$concept_homelands$')]将逐渐加入新地区，要获得本土地位，省份必须满足以下条件：\n\n※不是[concept_split_state]\n※[Concept('concept_pop', '$concept_population$')]大于60000\n※70%的[Concept('concept_pop', '$concept_population$')]不是泛灵论者\n※至少有一个[concept_pop]与任何美国[concept_primary_cultures]共享[concept_cultural_trait]"
 concept_usfp_washington_precedent: "华盛顿的先例"
 concept_usfp_washington_precedent_desc: "沿袭乔治·华盛顿的传统，美国[Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]在连任两届之后，[Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]将不会追求第三次任期，而是从[concept_interest_group]的[concept_leader]岗位上退下来，为新的总统候选人腾出竞选空间。"
 concept_usfp_house_of_representatives: "众议院"
 concept_usfp_house_of_representatives_desc: "众议院是[concept_usfp_congress]的下议院。在维多利亚时代，为了按人口比例代表这个不断发展的国家，众议院的投票代表人数随着时间推移而增加。\n\n众议院的专属权力包括发起所有收入法案、弹劾联邦官员以及在选举人团中没有候选人获得多数票的情况下选举总统。"
 concept_usfp_senate: "参议院"
 concept_usfp_senate_desc: "参议院是[concept_usfp_congress]的上议院。参议院的席位固定为每个州两席，旨在放大较小州在联邦中的权力，这与按人口比例分配席位的[concept_usfp_house_of_representatives]形成对比。由于奴隶制问题在国家层面日益凸显，在自由州和蓄奴州之间分配新增参议院席位成为一个关键问题，因为双方都不希望看到对方占据多数席位。\n\n参议院拥有专属权力，包括确认美国总统对高级官员的任命、批准或否决条约以及审判众议院提出的弹劾案。"
 concept_usfp_congress: "国会"
 concept_usfp_congress_desc: "美国国会是联邦政府的立法机构，采用两院制结构，由下议院[concept_usfp_house_of_representatives]和上议院[concept_usfp_senate]组成。两院在立法程序中具有同等地位，任何法案都需经两院共同批准方能生效。"
 concept_usfp_nullification_crisis: "联邦法令废止权危机"
 concept_usfp_nullification_crisis_desc: "废止权危机是美国一场地区性政治危机，它使南卡罗来纳州政府与联邦政府针锋相对。危机缘起于南卡罗来纳州宣布1828年和1832年的联邦关税法违宪，因此在该州主权管辖范围内无效。在华盛顿，杰克逊总统和副总统约翰·C·卡尔霍恩（一位南卡罗来纳州本土人士，也是州废止宪法理论最有效的倡导者）之间，在这个问题上公开决裂。\n\n南卡罗来纳州启动军事准备，以抵抗预期的联邦政府强制执行关税，但在1833年3月，国会通过了《武力法案》（授权总统对南卡罗来纳州使用武力）和一项新的经协商的关税法，后者令南卡罗来纳州感到满意。南卡罗来纳州议会复会并废除了其《废止法令》，但在三天后，又宣布《武力法案》无效，以此作为一种象征性的原则性姿态。\n\n危机结束了，双方都找到了理由宣称胜利。关税率降低并保持在低水平，南方对此感到满意。但州权至上的废止原则仍然备受争议，并且随着奴隶制成为美国政治中的主导议题，这一原则将变得越来越重要。"
 concept_usfp_louisiana_purchase: "路易斯安那购地"
 concept_usfp_louisiana_purchase_desc: "路易斯安那购地案是指美国于1803年从法兰西第一共和国手中购买路易斯安那领土的事件。这片领土囊括了密西西比河以西流域的大部分土地。美国为此支付了一千五百万美元，约合每平方英里十八美元，名义上获得了总面积达82.8万平方英里的土地，这片土地后来成为了美国的中心区域。从账面上看，美国的国土面积翻了一番。\n\n然而，实际上，法国仅控制着这片区域的一小部分，大部分地区都居住着美洲原住民。更准确地说，对于这片土地的大部分区域，美国购买的是通过条约或征服印第安土地的优先权，并排除了其他殖民强权染指此地的可能性。为真正掌控这片领土而进行的斗争，一直持续到20世纪。"
 concept_usfp_trusts: "托拉斯"
 concept_usfp_trusts_desc: "托拉斯是指一种具有显著市场支配力的大型商业利益联合体，其组织形式可以是单一法人实体，也可以是多个相互协作的法人联合体。尽管这类企业托拉斯最初是为优化大型企业组织结构而设立，但很快就因滥用市场支配地位实施垄断行为而广受诟病——这些垄断行为既包括为建立市场垄断地位采取的手段，也包含为维持垄断状态采取的措施。此类指控使\"托拉斯\"一词在美国公众认知中与垄断行为形成强关联，并直接推动了美国首部联邦竞争法——1890年《谢尔曼反托拉斯法》的出台。\n\n历史上著名的托拉斯企业包括标准石油公司、美国钢铁公司以及美国烟草公司。"
 concept_usfp_political_machines: "政治机器"
 concept_usfp_political_machine: "政治机器"
 concept_usfp_political_machines_desc: "政治机器是一种政党组织，它通过物质激励（如金钱或政治职位）来招募成员，并以领导层对成员活动的高度控制为特征。 虽然这些要素在大多数政党和组织中都很常见，但它们对于政治机器而言至关重要。政治机器依靠层级结构和奖励来获取政治权力，这种权力往往通过强大的政党鞭笞结构来强化。  政治机器有时会有一位政治老板，并且通常依赖恩庇制、分赃制度、“幕后”控制以及在代议制民主框架内长期存在的政治关系。\n\n政治机器通过层级系统来掌控地方政治，该系统的顶端是“老板”，他掌控着当地商业领袖、民选官员及其任命者的忠诚，并且深谙“如何按动按钮”来达成目的。 这种政治控制体系在镀金时代尤为突出。  一个强大的中心人物（老板）与由地位较低的人物（政治机器）组成的复杂组织紧密结合，他们通过互惠互利来促进经济和社会方面的私利。\n\n坦慕尼协会是这些政治机器中最臭名昭著的例子之一，它是民主党的政治机器，在控制纽约市和纽约州政治以及帮助移民（最著名的是爱尔兰移民）在美国政治中崛起（从1790年代到1960年代）方面发挥了重要作用。 从1872年起，坦慕尼协会就有一位爱尔兰裔“老板”。 然而，坦慕尼协会也成为了贪污和政治腐败的引擎，其中最臭名昭著的时期可能是在19世纪中叶威廉·M·“老爹”·特威德的领导下。"
 concept_usfp_muckrakers: "耙粪记者"
 concept_usfp_muckraker: "耙粪记者"
 concept_usfp_muckrakers_desc: "耙粪记者是进步时代中一群具有改革思想的记者、作家和摄影师，他们声称要揭露既有体制中的腐败和不当行为，并且常常通过耸人听闻的出版物来实现这一目的。  耙粪运动杂志——尤其是出版商S.S.麦克卢尔的《麦克卢尔杂志》——向企业垄断和[concept_usfp_political_machines]发难，同时努力提高公众对城市贫困、不安全的工作环境、卖淫和童工问题的认识和愤怒。  大多数耙粪记者创作的是非虚构作品，但虚构的揭露性作品也常常产生重大影响，例如厄普顿·辛克莱的作品。\n\n与客观报道形成对比的是，耙粪记者主要将自己视为改革者，并积极投身政治。  虽然耙粪记者延续了早期“黄色新闻”风格的调查性揭露和煽情传统，但他们的写作目的是为了改变社会。  由于其作品的可见度和公众关注度不断提高，杂志的发行量也随之上升，他们的作品因而触及了大众受众。\n\n著名的历史耙粪记者包括艾达·M·塔贝尔、厄普顿·辛克莱和林肯·斯蒂芬斯。"
 concept_usfp_popular_sovereignty: "主权在民"
 concept_usfp_popular_sovereignty_desc: "在19世纪50年代，即美国内战爆发前夕，以密歇根州参议员刘易斯·卡斯和伊利诺伊州斯蒂芬·A·道格拉斯为首的北方民主党人，提出了“人民主权”原则，作为在奴隶制问题上的中间立场。该原则主张，各领地的实际居民应有权通过投票决定是否允许在该领地实行奴隶制。 联邦政府不必就此做出决定，卡斯和道格拉斯希望通过诉诸民主，能够巧妙地避开支持或反对奴隶制这个问题。1854年，道格拉斯在《堪萨斯-内布拉斯加法案》中将“人民主权”原则应用于堪萨斯地区，该法案在国会通过。\n\n该法案产生了两个意想不到的结果。由于它废除了1820年的《密苏里妥协案》（该妥协案规定奴隶制永远不得在堪萨斯地区存在），这无疑大大助长了奴隶制的扩张。一夜之间，义愤将北方各地的反奴隶制力量团结起来，形成了“反内布拉斯加”运动，该运动制度化为共和党，共和党坚定地致力于阻止奴隶制的扩张。"
 concept_usfp_supreme_court: "最高法院"
 concept_usfp_supreme_court_desc: "美国联邦最高法院（SCOTUS）是美国联邦司法系统的最高级别法院。它对所有美国联邦法院案件以及涉及美国宪法或联邦法律问题的州法院案件拥有最终管辖权。1803年，最高法院确立了自身的司法审查权，即宣告某项法令因违反宪法条款而无效的权力。最高法院能够推翻总统指令，如果该指令违反了宪法或成文法。\n\n大法官实行终身任期制，这意味着他们将一直在法院任职，直至去世、退休、辞职或被弹劾免职。当出现职位空缺时，总统将在参议院的建议和同意下任命新的大法官，这使得历届总统政府对未来的裁决拥有相当程度的影响力。"
 concept_usfp_jim_crow: "吉姆·克劳法"
 concept_usfp_jim_crow_desc: "吉姆·克劳法是19世纪末和20世纪初在美国南部各州及地方推行的法律，旨在强制实行种族隔离。“吉姆·克劳”是当时对非裔美国人带有贬义的称呼。在实践中，吉姆·克劳法强制要求在前美利坚联盟国各州以及其他一些州的所有公共场所实行种族隔离，这种状况从1870年代开始出现。\n\n尽管理论上声称“隔离但平等”，但为非裔美国人提供的设施与白人享有的设施相比，不仅持续落后，而且经费也严重不足；有时，黑人社区甚至根本没有任何设施可用。吉姆·克劳法远非平等，它作为一套法律体系，将经济、教育、政治和社会等方面的不利条件以及二等公民身份制度化，强加给居住在美国的大多数非裔美国人。"
 concept_usfp_thirteen_colonies: "十三殖民地"
 concept_usfp_thirteen_colonies_desc: "十三殖民地指的是位于北美洲大西洋沿岸的一组英国殖民地。这些殖民地在美国独立战争期间脱离英国统治，并联合建立美利坚合众国。\n\n十三殖民地享有一定程度的自治权和活跃的地方选举，并且抵制伦敦要求对其加强控制。针对法国及其印第安盟友的法印战争，导致英国与十三殖民地之间的紧张关系日益加剧。  在18世纪50年代，殖民地之间开始彼此合作，而不是直接与英国打交道。在殖民地印刷商和报纸的帮助下，这些殖民地之间的活动和关切得以分享，并最终促使人们呼吁保护殖民者作为“英国臣民的权利”，特别是“无代表不纳税”的原则。\n\n18世纪晚期，由于税收和权利问题与英国政府产生的冲突，最终引发了美国革命。在这场革命中，十三殖民地首次联合起来组建了大陆会议并建立了大陆军，并于1776年宣布独立。"
 concept_usfp_monroe_doctrine: "门罗主义"
 concept_usfp_monroe_doctrine_desc: "门罗主义是美国的一项外交政策立场，它反对欧洲在西半球的殖民主义。该主义认为，外国势力干预美洲的政治事务，都可能被视为是对美国的敌对行为。詹姆斯·门罗总统在其第七次年度国情咨文对国会的演讲中，首次阐述了这一原则。\n\n在当时，几乎所有西班牙在美洲的殖民地都已经获得独立或接近独立。门罗宣称，新世界和旧世界应保持明显的、相互独立的势力范围。因此，欧洲列强进一步控制或影响该地区主权国家的任何举动，都将被视为是对美国安全的威胁。反过来，美国将承认现有的欧洲殖民地，并且不干涉这些殖民地，也不会插手欧洲国家的内政。\n\n如果一个来自美洲以外的[concept_country]使用[concept_diplomatic_play]针对美洲（美国以外）的[concept_country]，除非目标已经是发起者的附属国，否则将违背对门罗主义。"
l_simp_chinese:
 usfp_ig_trait_king_cotton: "棉花国王"
 usfp_ig_trait_king_cotton_desc: "北方依靠我们的棉花维持他们纺织厂的运转。如果他们胆敢威胁我们的生活方式，我们就会切断他们的供应，让他们一贫如洗。"
 usfp_ig_trait_postmillennialism: "千禧年后论"
 usfp_ig_trait_postmillennialism_desc: "我们必须净化我们的社会，创造一个公义的黄金时代，以迎接基督降生。"
 usfp_ig_trait_peculiar_institution: "我们的特殊制度"
 usfp_ig_trait_peculiar_institution_desc: "南方独特的种植园制度需要严谨的监工，只要北方不插手，我们就能保证棉花源源不断。"
 usfp_ig_trait_go_west: "去西部吧，年轻人"
 usfp_ig_trait_go_west_desc: "欧洲和东方的城市拥挤且破败，对于那些寻求更好生活的人们来说，还有什么比一望无际的美洲大陆更有吸引力的呢？"
 usfp_ig_trait_american_exceptionalism: "美国例外论"
 usfp_ig_trait_american_exceptionalism_desc: "美国在世界舞台上占据着独特的中心位置，我们的文化和政治自然会塑造历史本身。"
 usfp_ig_trait_democratic_experiment: "民主实验"
 usfp_ig_trait_democratic_experiment_desc: "美国民主是现代政治的灯塔，我们每天都在努力实现一个更加完美的合众国，实现我们的开国元勋的崇高目标：生存、自由和追求幸福的权利。"
 usfp_ig_trait_revivalism: "信仰复兴运动"
 usfp_ig_trait_revivalism_desc: "在全国各地会议上，人们正在唤醒自我，在充满活力的信仰指引下，我们将携手前进。"
 usfp_ig_trait_republican_virtue: "共和美德"
 usfp_ig_trait_republican_virtue_desc: "自耕农是美利坚共和的基石。民众积极参与地方政治，杰斐逊的民主梦想才得以实现。"
 usfp_ig_trait_caricature: "讽刺画"
 usfp_ig_trait_caricature_desc: "一张图片胜过千言万语。如今掌权的尽是些蠢材，揭露他们每一项愚行正是我们的责任所在。"
 usfp_ig_trait_direct_action: "直接行动"
 usfp_ig_trait_direct_action_desc: "政治程序不过是工人阶级事业的绊脚石。统治阶级早已忘记——是我们让经济运转，而我们更懂得如何让它停摆！"
 usfp_ig_trait_rail_tycoons: "铁路大亨"
 usfp_ig_trait_rail_tycoons_desc: "广袤的美洲大陆亟待拓荒与开发。凭借政府的利好政策，我们将铁路铺遍整个大陆，财富自会滚滚而来。"
 usfp_ig_trait_scientific_management: "科学管理"
 usfp_ig_trait_scientific_management_desc: "科学管理使全国的工厂保持最高的生产效率，当然也离不开我们一丝不苟的监督。"
 usfp_ig_trait_gunboat_diplomacy: "炮舰外交"
 usfp_ig_trait_gunboat_diplomacy_desc: "温言在口，大棒在手。我们令人敬畏的军队不需要发射一发炮弹，就能发出强有力的外交声明！"
 usfp_ig_trait_free_silver: "自由铸银"
 usfp_ig_trait_free_silver_desc: "大都市的金融寡头正操纵国策令平民陷于赤贫。我们岂能甘当乞食之徒？定要让我们的怒吼响彻权力殿堂！"
 usfp_ig_trait_lawmen: "执法人员"
 usfp_ig_trait_lawmen_desc: "辽阔的乡野是执法的天然阻碍。唯有深谙本土民情的忠诚警长，方能为正义事业保驾护航。"
 usfp_ig_trait_lost_cause: "失败的事业"
 usfp_ig_trait_lost_cause_desc: "我们自豪地继承了邦联的传统，并为各州的权利、正义和自由的正义事业而奋斗。南方将再次崛起！"
 usfp_ig_trait_native_defenders: "父辈遗骸"
 usfp_ig_trait_native_defenders_desc: "我们团结一致，共同对抗任何企图夺走我们土地的敌人。"
 usfp_ig_trait_feuding_warriors: "战士内斗"
 usfp_ig_trait_feuding_warriors_desc: "由于缺乏适当的领导，战士们将精力浪费在琐碎的争端上，而不是集中精力对付我们真正的敌人。"
 usfp_ig_trait_village_life: "乡村看护者"
 usfp_ig_trait_village_life_desc: "母亲和孩子可以依赖乡村，从中可以获得一切支持。"
 usfp_ig_trait_european_science: "交流学习"
 usfp_ig_trait_european_science_desc: "白人已经积累了大量的知识，我们可以学习并采纳这些知识，以造福我们自己的社会。"
 usfp_ig_trait_spiritual_visions: "预兆"
 usfp_ig_trait_spiritual_visions_desc: "我们的人民正处于危机之中。神灵已经向我们发出了预兆，让我们改正自己。"
 usfp_ig_trait_strong_medicine: "强力药物"
 usfp_ig_trait_strong_medicine_desc: "我们领导人的智慧证明其具有强大的精神力量，值得带领我们的人民渡过难关。"
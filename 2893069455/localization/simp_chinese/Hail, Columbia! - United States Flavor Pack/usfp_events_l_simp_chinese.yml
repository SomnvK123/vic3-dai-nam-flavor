l_simp_chinese:
 acw_events.1.a.t: "一名[SCOPE.sIdeology('abolitionist_scope').GetName][concept_agitator]将出现在[SCOPE.sCountry('usa_scope').GetName]。"
 acw_events.1.b.t: "一名[SCOPE.sIdeology('slaver_scope').GetName][concept_agitator]将出现在[SCOPE.sCountry('usa_scope').GetName]。"
 acw_events.3.a.t: "密苏里妥协案的未来仍无法确定。"
 acw_events.3.c.t: "密苏里妥协案可能无法在西部扩张的现状下留存下来。"
 usfp_a_house_divided.1.t: "皮克尼革命"
 usfp_a_house_divided.1.d: "近几个月来，[concept_usfp_house_of_representatives]被大量废奴主义者的请愿淹没。作为回应，[SCOPE.sParty('democratic_party').GetName]通过了禁止考虑或讨论任何与奴隶制有关的事务的决议。"
 usfp_a_house_divided.1.f: "“兹议决——任何与奴隶制度或废除奴隶制有关的请愿书、备忘录、决议案、提案或文件，无论涉及该议题的方式或程度如何，均不予印刷或提交审议，而应直接搁置，且不得就此事项采取任何进一步行动。”"
 usfp_a_house_divided.1.a: "这是公然违宪！"
 usfp_a_house_divided.1.b: "最后，让我们一切照旧。"
 usfp_a_house_divided.3.t: "分离主义大会"
 usfp_a_house_divided.3.d: "为了回应[ROOT.GetCountry.GetRuler.GetLastName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]公开的反奴隶制政纲，南方的几个州立即召开了考虑脱离[ROOT.GetCountry.GetName]的会议。"
 usfp_a_house_divided.3.f: "“我们的新政府建基于完全相反的理念之上；我们新政府的基础，即其基石，就是建立在黑人与白人不平等这个伟大真理之上；奴隶制中对于优越种族的服从是其自然和正常的状态。”"
 usfp_a_house_divided.3.a: "如果你们不成为侵略者就不会有冲突。"
 missouri_compromise_break: "这将#red 打破#!密苏里妥协案！"
 usfp_a_house_divided.4.t: "《为奴十二年》"
 usfp_a_house_divided.4.d: "[SCOPE.sCharacter('northup_scope').GetFullName]，一个自由的北方黑人，被绑架并卖到了南方做奴隶。忍受了十几年的压迫，他最终重返自由，出版了他的故事《为奴十二年》，这本书一经发布立即成为畅销书。[SCOPE.sCharacter('northup_scope').GetLastName]对奴隶制恶劣情况的详尽描述印证了北方废奴主义者最深重的的担忧，而南方批评者却谴责这些记录纯属虚构。"
 usfp_a_house_divided.4.f: "“让他们聆听贫苦奴隶的心声——了解那些奴隶不敢在白人面前吐露的秘密想法；让他们在夜晚寂静的守望中与奴隶并肩而坐，以充满信任的口吻，畅聊‘生命、自由和对幸福的向往’，他们就会发现，每一百个奴隶中就有九十九个心智健全，足以理解自己的处境，并在内心深处怀揣着对自由的渴望，其炽烈程度丝毫不逊于他们自己。”"
 usfp_a_house_divided.4.a: "一个关于南方罪恶的悲惨故事。"
 usfp_a_house_divided.4.b: "这个故事只不过是谎言和诽谤。"
 usfp_a_house_divided.5.t: "《汤姆叔叔的小屋》"
 usfp_a_house_divided.5.d: "哈里特·斯托著作的反奴隶制小说《汤姆叔叔的小屋》风靡全国，在短短几个月内售出了数十万册。这部小说以动人的笔触描绘了奴隶制下的生活惨状，感召了成千上万的读者支持[SCOPE.sIdeology('abolitionist_scope').GetName]的事业，同时也引发了南方的强烈抗议。"
 usfp_a_house_divided.5.f: "“我不要你们国家的任何东西，只求让我安然无恙地离开。一旦我踏上加拿大的土地，那里的法律会认可我的身份，保护我的权益，那里就是我的祖国，我将恪守那里的法律。但倘若有人胆敢阻拦我，让他悠着点，我已走投无路，誓与阻我者抗争到底。我将为捍卫自由而战，直到生命的最后一刻。你说你们的祖辈也这样做了；如果他们的所作所为是正确的，那我这样做也理所应当！”"
 usfp_a_house_divided.5.a: "每个人都应该知道奴隶制的非正义性。"
 usfp_a_house_divided.5.b: "这本书是一部荒诞的小说。"
 usfp_a_house_divided.6.t: "迫在眉睫的南方危机"
 usfp_a_house_divided.6.d: "一部激进的经济论著在[SCOPE.sState('maryland_scope').GetName]出版，系统阐述了奴隶制如何抑制南方经济发展，并将导致其长远衰败的观点。此书观点之激进，引发轩然大波，多个南方州已将持有此书定为极其严重的罪行，[concept_usfp_house_of_representatives]也围绕这一议题陷入持续而激烈的争论之中。"
 usfp_a_house_divided.6.f: "“自由土地党人和废奴主义者是南方唯一真正的挚友；奴隶主和蓄奴主是他们自己地区不共戴天的死敌。反奴隶制的斗士正在为联邦的团结和全人类的福祉而不懈奋斗；而支持奴隶制的人却在为各州的分裂而孜孜不倦，除了满足自己的私利，他们的所作所为对任何事物都毫无裨益。”"
 usfp_a_house_divided.6.a: "奴隶制不利于南方！"
 usfp_a_house_divided.6.b: "奴隶制是南方文明的基石！"
 usfp_a_house_divided.7.t: "[SCOPE.sState('california_scope').GetName]申请建州"
 usfp_a_house_divided.7.d: "随着[SCOPE.sState('california_scope').GetName]人口的爆炸式增长，新移民们召开了制宪会议，并向联邦提出了申请，希望成为联邦的一个州。然而，他们的宪法禁止奴隶制，并要求一块跨越密苏里妥协案划定的界线的领土。这在[concept_usfp_congress]引起了极大的恐慌和混乱，人们担心这会打破原有的自由州和奴隶州之间已维系多年的微妙平衡。"
 usfp_a_house_divided.7.f: "“经美利坚合众国国会参众两院议决，宣布加利福尼亚州为美利坚合众国的一个州，并以与原有各州在所有方面完全平等的地位加入联邦。”"
 usfp_a_house_divided.7.a: "欢迎加入合众国！"
 usfp_a_house_divided.7.b: "我们无法单方面增加一个新的自由邦。"
 compromise_of_1850_soon: "我们的西进运动使得密苏里妥协案难以维持，因此迫切需要一个新的协定。"
 usfp_a_house_divided.8.t: "新的妥协"
 usfp_a_house_divided.8.d_california: "[SCOPE.sState('california_scope').GetName]获准加入联邦一事激怒了[SCOPE.gsInterestGroup('planters_scope').GetName]，他们已经开始私下谋议脱离联邦。为了化解这一危机，[SCOPE.sCharacter('compromise_leader').GetFullName]拟定了一套妥协方案：[concept_usfp_popular_sovereignty]原则将允许每个西部领地的人民自行决定奴隶制度的去留，而新的《逃亡奴隶法》则要求自由州的公民协助抓捕在逃奴隶，将其送还奴隶州。"
 usfp_a_house_divided.8.d: "我们西部领土的地位问题持续地加剧南北之间的分歧。[SCOPE.sCharacter('compromise_leader').GetFullName]草草拼凑出一份协定来缓和紧张的气氛。[SCOPE.sState('california_scope').GetName]将会作为一个自由州加入联盟。相应地，人民主权学说将会允许每片西部领土上的人民自己决定奴隶制在此的地位，并且逃奴法案将迫使自由州的公民协助捉拿逃走的奴隶。"
 usfp_a_house_divided.8.f: "“藉由这些法案，我们将在各州之间达成最终的和解，从此维系联邦的统一。”"
 usfp_a_house_divided.8.a: "联邦得救了！"
 usfp_a_house_divided.8.b: "《逃奴法案》逾越了底线。"
 usfp_a_house_divided.8.c: "驳回人民主权，代以《逃奴法案》为补偿。"
 usfp_a_house_divided.8.e: "我们关于[SCOPE.gsInterestGroup('planters_scope').GetName]的协定完成了。"
 popular_sovereignty_enabled: "我们堪萨斯州以西的领土现在可能在当地定居者投票支持的情况下成为奴隶州。"
 usfp_a_house_divided.10.t: "《堪萨斯‑内布拉斯加法案》"
 usfp_a_house_divided.10.d: "出于西部领土对政务管理的需要，[SCOPE.sParty('democratic_party').GetName]拨款建设[SCOPE.sState('kansas_scope').GetName]和[SCOPE.sState('nebraska_scope').GetName]的政府。这一举措将允许这些土地上的人们投票决定奴隶制的地位，同时也将打破密苏里妥协案。"
 usfp_a_house_divided.10.f: "“所有这些动荡和祸端的借口究竟是什么？他们告诉我们，这一切都是为了将奴隶制问题挡在国会大门之外！然而，上帝在上，奴隶制问题原本已经完全、彻底、永远地远离了国会，直到国会打破了解决这一问题的神圣法律，生生将其拖了回来！”"
 usfp_a_house_divided.10.a: "人民主权将解决这个问题。"
 usfp_a_house_divided.10.b: "该法案将使国家四分五裂。"
 usfp_a_house_divided.11.t: "流血[SCOPE.sState('kansas_scope').GetName]"
 usfp_a_house_divided.11.d: "随着[SCOPE.sState('kansas_scope').GetName]奴隶制问题的公开，废奴主义者和奴隶制的支持者都开始涌入该州，意图影响地方选举的结果。"
 usfp_a_house_divided.11.f: "“遥远的西方，雷声滚滚——\n战斗的喧嚣正在肆虐\n堪萨斯州正在流血\n反对奴隶制的战争！”"
 usfp_a_house_divided.11.a: "[SCOPE.sState('kansas_scope').GetName]将会是自由州！"
 usfp_a_house_divided.11.b: "洋基佬们该管好他们自己的事。"
 usfp_a_house_divided.11.c: "这将通过投票来决定。"
 usfp_a_house_divided.14.t: "破坏妥协"
 usfp_a_house_divided.14.d: "不同地区的代表均对[SCOPE.sLaw('current_law_scope').GetName]表示反对，认为这违反了南北之间的协议，并谴责其对国家统一构成威胁。"
 usfp_a_house_divided.14.f: "“坚持妥协！不要煽动骚乱！给我们和平！”"
 usfp_a_house_divided.14.a: "必须不惜一切代价维护联邦。"
 usfp_a_house_divided.14.c: "与奴隶贩子们妥协是不道德的！"
 usfp_a_house_divided.14.b: "与废奴主义者的妥协是不能接受的！"
 usfp_a_house_divided.15.t: "辉格党倒台"
 usfp_a_house_divided.15.d: "奴隶制冲突的加深导致[SCOPE.sParty('whig_scope').GetName]的分裂，使其作为一个政治组织完全失效，一个新的共和党已经成立并取而代之。"
 usfp_a_house_divided.15.f: "“这个新兴的政党将恰如其分地代表那些团结起来、旨在使联邦回归初心的人：成为自由的捍卫者和先驱，而非奴隶制的传声筒和帮凶。”"
 usfp_a_house_divided.15.a: "政治新纪元来临了。"
 usfp_a_house_divided.15.a.tt: "[SCOPE.sParty('whig_scope').GetName]现在将被称作共和党"
 usfp_a_house_divided.16.t: "得福德·史考特诉桑福德案"
 usfp_a_house_divided.16.d: "[concept_usfp_supreme_court]就一位[SCOPE.sCulture('afro_american_scope').GetName]男子争取自由的案件做出了一项具有里程碑意义的裁决。法院裁定，美国宪法没有赋予任何[SCOPE.sCulture('afro_american_scope').GetName]以公民权利，无论他们是自由民还是奴隶。此外，法院进一步宣布，[concept_usfp_congress]无权限制各领地内奴隶制的存在。"
 usfp_a_house_divided.16.f: "“他们并非宪法中‘公民’一词所指的对象，因此不能要求宪法为合众国公民提供和保障的任何权利和特权。相反，国父们认为他们是一个从属的、低等的群体，已被占统治地位的种族所征服。无论是否被解放，他们仍然臣服于白人的权威，除了那些掌权者和政府可能选择赋予他们的权利或特权外，别无其他权利和特权。”"
 usfp_a_house_divided.16.a: "这是有史以来最为无耻下流的裁决！"
 usfp_a_house_divided.16.b: "房产就是房产，没有什么好讨论的。"
 usfp_a_house_divided.17.t: "铁路候选者"
 usfp_a_house_divided.17.d: "在[SCOPE.sParty('republican_party_scope').GetName]内部的派系分歧中，[SCOPE.sCharacter('real_abraham_lincoln_scope').GetFullName]出人意料地成为党内提名的有力竞争者。"
 usfp_a_house_divided.17.f: "“我们必须推举这样一位领袖：他深刻认识到奴隶制问题是当今最为紧迫和关键的议题；他敢于直言不讳地宣告奴隶制的罪恶，并以此为指导原则果断行动；他坚信国会肩负着遏制奴隶制蔓延的神圣职责，必须行使权力予以阻止。”"
 usfp_a_house_divided.17.a: "诚实的亚伯会取得胜利！"
 usfp_a_house_divided.17.b: "我们宁愿选[SCOPE.sCharacter('current_pb_leader').GetFullName]"
 usfp_bleeding_kansas.1.t: "新英格兰移民援助公司"
 usfp_bleeding_kansas.1.d: "一位来自[SCOPE.sState('massachusetts_scope').GetCityHubName]的[SCOPE.sIdeology('abolitionist_scope').GetName]企业家成立了一家运输公司，目标是将反奴隶制的移民送往[SCOPE.sState('kansas_scope').GetName]。数百名移民已经签约，渴望将 [SCOPE.sState('kansas_scope').GetName]变成一个自由州。"
 usfp_bleeding_kansas.1.f: "“急寻：渴望在堪萨斯领地履行爱国义务的拓荒者。为那些希望看到堪萨斯成为名副其实的自由白人州的人士提供资金支持、路途安排和相关讯息。”"
 usfp_bleeding_kansas.1.a: "漂亮！"
 usfp_bleeding_kansas.1.a.tt: "一千扬基人将移至[SCOPE.sState('kansas_scope').GetName]"
 usfp_bleeding_kansas.1.b: "调查这家公司的欺诈行为。"
 usfp_bleeding_kansas.1.b.tt: "五百扬基将移至[SCOPE.sState('kansas_scope').GetName]"
 usfp_bleeding_kansas_swing_free: "#bold 废奴制拥护者#!将在堪萨斯州获得影响力"
 usfp_bleeding_kansas_swing_slave: "#bold 边境匪徒#!将在堪萨斯州获得影响力。"
 usfp_bleeding_kansas.2.t: "边境匪徒"
 usfp_bleeding_kansas.2.d: "来自[SCOPE.sState('missouri_scope').GetName]的支持奴隶制的煽动者越过[SCOPE.sState('kansas_scope').GetName]进入 其中并袭击城镇、洗劫房屋和偷盗马匹。许多人还在[SCOPE.sState('kansas_scope').GetName]居住，可以影响当地政治，使其对自己有利。"
 usfp_bleeding_kansas.2.f: "“先生们，军官们和士兵们！这是我一生中最光荣的一天！在这一天，我成为了一名边境恶棍！像你们在家乡的猎犬一样，猛扑向那个该死的、被诅咒的废奴主义者的老巢；以坚不可摧的勇气冲破阻挡我们的一切障碍！是的，恶棍们，掏出你们的左轮手枪和猎刀，让它们沐浴在那些胆敢捍卫那个十恶不赦的地狱之穴的走狗们的鲜血之中。”"
 usfp_bleeding_kansas.2.a: "这是犯罪行为！"
 usfp_bleeding_kansas.2.a.tt: "五百迪克西将移至[SCOPE.sState('kansas_scope').GetName]"
 usfp_bleeding_kansas.2.b: "我们换个角度看"
 usfp_bleeding_kansas.2.b.tt: "一千迪克西将移至[SCOPE.sState('kansas_scope').GetName]"
 usfp_bleeding_kansas.3.t: "投票站内的暴力事件"
 usfp_bleeding_kansas.3.d: "[SCOPE.sState('kansas_scope').GetName]的地方选举被支持奴隶制的暴徒搅得一团糟，他们在各投票站大肆施暴，恐吓选民。受此影响，数千张非法选票被投放，导致地方选举结果被歪曲，让暴徒们得以夺取许多职位，并将其合法权力转而对付废奴主义者。"
 usfp_bleeding_kansas.3.f: "十几个男子围住了正在计票的小办公室。\n\n“喂！马上把那个破选票箱扔一边，给老子滚出来！再不听话，老子就让兄弟们把这破房子砸个稀巴烂，把你们这群王八蛋统统崩了！”"
 usfp_bleeding_kansas.3.a: "我们的选举神圣不可侵犯！"
 usfp_bleeding_kansas.3.b: "选举受到干预？我可没看到。"
 usfp_bleeding_kansas.4.t: "洗劫劳伦斯"
 usfp_bleeding_kansas.4.d: "[SCOPE.sState('kansas_scope').GetName]境内的小镇劳伦斯遭到了一群亲奴隶制暴徒的洗劫。这里是新英格兰移民援助公司的重要中转站，恶匪们不仅劫掠了整座镇子，还放火烧毁了公司的办公楼，并砸毁了一家主张废奴的报社的印刷机。"
 usfp_bleeding_kansas.4.f: "\"暴徒们一获得大炮和其他武器，就立即着手实施他们摧毁自由州酒店的计划。他们给居民五小时时间搬出个人物品。一切就绪后，他们将治安队的大炮对准酒店开火。经过一番猛烈轰炸后，他们将整栋建筑付之一炬。\""
 usfp_bleeding_kansas.4.a: "这简直骇人听闻！"
 usfp_bleeding_kansas.4.b: "这是废奴主义者自找的。"
 usfp_bleeding_kansas.5.t: "[SCOPE.sState('kansas_scope').GetName]大屠杀"
 usfp_bleeding_kansas.5.d: "骇人听闻的屠杀故事从[SCOPE.sState('kansas_scope').GetName]的乡村地区传出。一群激进的废奴主义者突袭了多位支持奴隶制者的家园，当着他们家人的面用剑将其砍死，随后逃入夜色中。这一事件随即引发了一系列报复性袭击，使暴力循环愈演愈烈。"
 usfp_bleeding_kansas.5.f: "“这些杀戮的事件犹如平地一声惊雷，引发了极大的恐慌。支持奴隶制的人们目瞪口呆，惊恐万状。官员们被废奴主义者的这一出人意料的新举动吓坏了。显然，他们没有做好准备应对这样一场敌我力量悬殊的战斗，因为在该州的合法定居者中，反对奴隶制的人数是支持奴隶制的四倍。”"
 usfp_bleeding_kansas.5.a: "太野蛮了！"
 usfp_bleeding_kansas.5.b: "这群匪徒是咎由自取。"
 usfp_bleeding_kansas.6.t: "哈珀渡口的暴动"
 usfp_bleeding_kansas.6.d: "为了引发一场全面的奴隶起义，[SCOPE.sCharacter('john_brown_scope').GetFullName]袭击并占领了位于弗吉尼亚州哈珀斯费里的联邦军械库。不幸的是，布朗期待的叛乱并未出现。在军械库被短暂围困后，他最终落入法网。法院已宣判他犯有谋杀罪和叛乱罪，并判处死刑。"
 usfp_bleeding_kansas.6.f: "“如果人们认为，为了正义事业的进一步发展，我有必要献出自己的生命，让我的鲜血与我孩子们的血，与这个奴隶国家数百万人民的血融合——他们的权利正遭到那些邪恶、残暴和不公法令的无情践踏——我毫无怨言；就让一切随它去吧。”"
 usfp_bleeding_kansas.6.a: "他选择了自己的命运。"
 usfp_bleeding_kansas.6.b: "我们必须确保[SCOPE.sCharacter('john_brown_scope').GetFullName]活下来。"
 usfp_bleeding_kansas.7.t: "弗吉尼亚州奴隶起义"
 usfp_bleeding_kansas.7.d: "激进的废奴主义者[SCOPE.sCharacter('john_brown_scope').GetFullName]袭击了位于弗吉尼亚州哈珀斯费里的联邦军械库！一群逃亡奴隶夺取了库内武器，如今他们已在[SCOPE.sState('virginia_scope').GetName]各地散开，在种植园间煽动恐慌和奴隶起义。"
 usfp_bleeding_kansas.7.f: "“余生无几，唯有一死，我愿战斗到底，为这一事业献出生命。只要奴隶制尚未彻底废除，这片土地就永无宁日。”"
 usfp_bleeding_kansas.7.a: "上帝啊，那个疯子成功了！"
 usfp_bleeding_kansas.7.b: "我们必须立刻粉碎这些自视甚高的奴隶！"
 usfp_bleeding_kansas.8.t: "相互竞争的宪法"
 usfp_bleeding_kansas.8.d: "两支独立的代表团抵达[SCOPE.sState('kansas_scope').GetName]，各自携带一份待[concept_usfp_congress]批准的州宪法：一份禁止奴隶制，另一份则允许奴隶制存在。两支代表团都声称自己是[SCOPE.sState('kansas_scope').GetName]人民的合法代表，而今决定权落在我们手中，由我们来裁定究竟应该接受哪一方。"
 usfp_bleeding_kansas.8.f: "\"我们的宪法已经由自由堪萨斯州合法选举的代表正式批准。我们刚从托皮卡的宪法大厅赶来，尽管那些边境暴徒百般阻挠！\"\n\n\"哼！我们的宪法才是由堪萨斯人民真正的代表正式批准的。而且，我们是在利康普顿的#italic 真正#!宪法大厅起草的！\""
 usfp_bleeding_kansas.8.a: "废除奴隶制显然是合法的选择。"
 usfp_bleeding_kansas.8.b: "支持奴隶制显然是选民的意愿。"
 usfp_bleeding_kansas.8.c: "堪萨斯若要拥有宪法，必须先就#italic 同一部#!宪法达成一致！"
 usfp_bleeding_kansas_enforce_constitution: "颁布一项$decree_violent_suppression$[concept_decree]将使我们能够强制执行我们选定的宪法。"
 usfp_bleeding_kansas.9.t: "自由州的胜利"
 usfp_bleeding_kansas.9.d_acw: "内战爆发后，[SCOPE.sState('kansas_scope').GetName]中占主导地位的自由州居民迅速集结。成功守住了这个州。使其留在联邦之中。"
 usfp_bleeding_kansas.9.d: "在经历了长期的流血冲突后，废奴派一方终于从这场血洗[SCOPE.sState('kansas_scope').GetName]的内斗中崛起，成功阻遏了奴隶制在该州的扩张蔓延。"
 usfp_bleeding_kansas.9.f: "“四敌环伺火烧眉，看啊！\n危难之际求援助！\n君将背弃任其沦？\n振奋！立誓永不离弃她；\n堪萨斯终获自由！”"
 usfp_bleeding_kansas.9.a: "终于，这悲惨的篇章要划上句号了。"
 usfp_bleeding_kansas.10.t: "边境匪徒占领[SCOPE.sState('kansas_scope').GetName]"
 usfp_bleeding_kansas.10.d_acw: "随着内战的爆发，边境匪徒攻占了[SCOPE.sState('kansas_scope').GetName]，并宣布加入[SCOPE.sCountry('csa_scope').GetName]。"
 usfp_bleeding_kansas.10.d: "在经历了长期的流血冲突后，边境匪徒从这场血洗[SCOPE.sState('kansas_scope').GetName]的内斗中崛起，使奴隶制在该州正式确立。"
 usfp_bleeding_kansas.10.f: "听啊！\n难道你们听不见，自由女神垂死的叹息？\n她倒在堪萨斯的原野上，在血泊里挣扎。\n难道你们听不见她悲痛的哀求？\n难道你们看不见她信徒在流血？\n瞧啊！\n他们的灵魂正离开尘世，呼唤着痛苦的复仇之声。"
 usfp_bleeding_kansas.10.a: "终于，这悲惨的篇章要划上句号了。"
 usfp_acw.1.t: "叛徒的和平"
 usfp_acw.1.d: "[SCOPE.sCharacter('nast_scope').GetFullName]发表了一篇严厉批评[SCOPE.sCountry('csa_scope').GetAdjective]和平要求的文章，将其描述为对联邦玷污和对北方的摧毁。[SCOPE.sParty('republican_party_scope').GetName]利用这一点来支持继续战争，谴责他们所谓的“和平背叛”。"
 usfp_acw.1.f: "“合众国子民！你们会同意这种对我们事业的背叛吗？ 倘若不会，那就与那些紧跟联邦的人一起，与那些在战场上支持我们勇敢士兵的人一起！ 为自由和联邦而战！从今往后，合而为一，永不分离！”"
 usfp_acw.1.a: "联邦万岁！"
 usfp_acw.2.t: "[SCOPE.sCountry('csa_scope').GetAdjective]被俘的使节"
 usfp_acw.2.d: "[ROOT.GetCountry.GetAdjective]海军陆战队截停了一艘[SCOPE.sCountry('britain_scope').GetAdjective]皇家邮船，并俘虏了一群正出国旅行的[SCOPE.sCountry('csa_scope').GetAdjective]外交官。作为中立方，[SCOPE.sCountry('britain_scope').GetName]已对这一行动表示抗议，并要求释放这些使节。"
 usfp_acw.2.f: "“此举违法且不符合国际法。我方船只的行为绝不能被视为违反国际法。事实上是有人从一艘中立国的商船上被强行带走，而该船只正在进行合法且无害的航行。因此，依我方之见，女王陛下政府完全有理由就此次事件造成的国际不法行为要求赔偿。”"
 usfp_acw.2.a: "我们不想与[SCOPE.sCountry('britain_scope').GetName]开战，立即释放使节。"
 usfp_acw.2.b: "无论情况如何，使节们都将继续由我们监护。"
 usfp_acw.3.t: "[SCOPE.sState('west_virginia_scope').GetName]脱离"
 usfp_acw.3.d: "[SCOPE.sState('virginia_scope').GetName]的地方代表对[SCOPE.sState('west_virginia_scope').GetName]的分离感到愤怒，他们组织了自己的州政府，并宣布加入联邦。"
 usfp_acw.3.f: "“议会毫无道理的决定是叛国的违宪行为！ 我们西弗吉尼亚人将不会追随军队，让他们一头栽进毁灭和自相残杀之中！”"
 usfp_acw.3.a: "欢迎加入联邦！[SCOPE.sState('west_virginia_scope').GetName]！"
 usfp_acw.4.t: "铁甲舰概念"
 usfp_acw.4.d: "一位富有进取的发明家提出了一项确保我们在内战中获得海上优势的计划——铁甲舰。通过迅速将现有的一些舰船改装成装甲舰，我们就能摧毁叛军的船只，并控制大西洋航运，不过据传叛乱分子已经在着手购买属于他们自己的铁甲舰了。如果不加以反击，这将威胁到我们整个海军的沉没。"
 usfp_acw.4.f: "现在是铁的时代！先生们，如果联邦在这件事上行动迟缓，叛军将在今年年底抵达纽约港！"
 usfp_acw.4.a: "资助它！"
 usfp_acw.4.b: "这是一项代价太高的赌博。"
 usfp_acw.4.a.tt: "将在[SCOPE.sState('new_york_scope').GetName]建造一艘铁甲舰。"
 usfp_acw.5.t: "印第安人宣称[SCOPE.sCountry('csa_scope').GetName]"
 usfp_acw.5.d: "留在南方的印第安民族与[SCOPE.sCountry('csa_scope').GetName]签订了条约，并加入了他们的阵营。"
 usfp_acw.5.f: "会上印第安人和邦联之间的关系紧张，虽然双方都知道这份协议很可能无法在战争中存续下去，但现在他们因为一个共同的事业而团结在一起。"
 usfp_acw.5.a: "诅咒他们！"
 usfp_acw.6.t: "向大海进军"
 usfp_acw.6.d: "穿过[SCOPE.sState('georgia_scope').GetName]的联邦军队对叛军腹地展开了焦土政策，所过之处，一片狼藉，伤亡无数。"
 usfp_acw.6.f: "“在我们身后，亚特兰大在熊熊燃烧，成了一片废墟，黑烟笼罩着这座废城。偶然间，某个乐队奏响了约翰·布朗之躯的歌曲，士兵们也跟着唱了起来，在这之前或之后，我从未听过如此有气势的合唱……”"
 usfp_acw.6.a: "叛乱的代价"
 usfp_acw.6.b: "我们需要限制我们的力量"
 usfp_acw.7.t: "起草周"
 usfp_acw.7.d: "[SCOPE.sState('new_york_scope').GetCityHubName]已经陷入了反对新草案的骚乱之中，主要推手是该市的[SCOPE.sCulture('irish_culture').GetName]社区。暴乱者砸毁公共设施，烧毁房屋，并把怒火施加给当地[SCOPE.sCulture('afro_american_culture').GetName]市民。"
 usfp_acw.7.f: "\"毫无疑问，明早你们会严厉惩处我们这些暴动分子。但那条300美元的法律已经把我们变成了无名小卒、流浪者和社会的弃儿。当我们被迫上战场、被射杀时，没有人会在乎我们。我们是贫苦百姓，而这条法律使富人成为了我们的敌人。因此，我们将在此地与敌人一战，绝不求饶。\""
 usfp_acw.7.a: "严厉打击这种乱象！"
 usfp_acw.7.b: "提供豁免，为紧张局势降温。"
 usfp_reconstruction.1.t: "自由民局"
 usfp_reconstruction.1.d: "南方状况委员会提议成立新的政府机构：自由民局。该机构将向难民及新近摆脱奴役的人们提供直接援助，以帮助他们向自由社会过渡。"
 usfp_reconstruction.1.f: "\"为自由民提供临时援助和指导，直到他们适应新的生活环境；通过法律保障他们应有的人身和财产权利；通过公正平等的司法管理，使他们摆脱令人沮丧的偏见影响。最重要的是，防止奴隶制以任何形式、任何借口实质上得到恢复，然后让他们自力更生。如果我们能做到这一点，非裔在这个国家的未来将有助于国家的繁荣，并与其福祉息息相关。\""
 usfp_reconstruction.1.a: "该局将成为推进重建工作的部门。"
 usfp_reconstruction.1.b: "这笔开销是不必要的。"
 usfp_reconstruction.2.t: "三K党"
 usfp_reconstruction.2.d: "一个自称为三K党的白人至上主义组织在[SCOPE.sState('tennessee_scope').GetName]崛起，并开始对重建政策发动恐怖袭击。关于三K党实施的私刑、纵火和肢体残害的骇人听闻的故事已经恶名远扬。"
 usfp_reconstruction.2.f: "\"你在全能上帝面前，在在场诸位见证人面前庄严宣誓：你将遵从三K党指挥官的命令，不受民法约束，压制黑人，将他们置于应有之地；你将确保民主党掌控这个国家。愿上帝助你。\""
 usfp_reconstruction.2.a: "打垮这些恐怖分子！"
 usfp_reconstruction.2.b: "睁一只眼闭一只眼。"
 usfp_reconstruction.3.t: "[SCOPE.sCulture('afro_american_culture').GetName]立法委员"
 usfp_reconstruction.3.d: "随着自由民获得投票权，他们迅速选出了一批[SCOPE.sCulture('afro_american_culture').GetName]代表进入[SCOPE.sState('original_33_state').GetName]州议会。尽管在议会中属于少数派，但种族主义反对派已经对任何[SCOPE.sCulture('afro_american_culture').GetName]在该州担任公职的权利发起了挑战。"
 usfp_reconstruction.3.f: "新代表入场时，议事厅内一片骚动。守旧派不断地嘲笑与谩骂，当他们心满意足之后大会才恢复秩序。"
 usfp_reconstruction.3.a: "确保他们不被赶下台。"
 usfp_reconstruction.3.b: "他们选择参与竞选，现在他们能照顾好自己了。"
 usfp_reconstruction.4.t: "失败的事业"
 usfp_reconstruction.4.d: "战败后，南方转而开始否认历史，为自己的行为进行辩解。这种新的“失败的事业”观点支持者声称，奴隶制和内战的关系微乎其微，邦联的事业是正义且纯粹的。"
 usfp_reconstruction.4.f: "“自战争结束以来，战败的叛乱分子尽全力在宣扬这样一种思想：即自由、正义、人道、平等以及自由人所拥有的一切美德之事业，因南方独立失败而遭到破坏。”"
 usfp_reconstruction.4.a: "这种历史观将加快和解的进程。"
 usfp_reconstruction.4.b: "我们不会忘记南方的罪行。"
 usfp_reconstruction.6.t: "邦联流亡者"
 usfp_reconstruction.6.d: "[SCOPE.sCountry('usa_scope').GetAdjective]内战结束后，许多昔日的奴隶主认定[ROOT.GetCountry.GetName]对他们的生活方式更为包容，并宣布有意迁移至此。数个代表团已就此事向政府请求援助，不少部长也认同这些前邦联分子能带来宝贵的农业经验。"
 usfp_reconstruction.6.f: "\"洋基佬在美国对我们赶尽杀绝,以至于我们不得不离开故土。我们这些南方人对巴西怀有最崇高的敬意,并且已经感受到了这片土地的热情。\""
 usfp_reconstruction.6.a: "这些邦联人将对我们的经济产生巨大的价值。"
 usfp_reconstruction.6.b: "我们不需要美国叛徒出现在我们中间。"
 usfp_reconstruction.7.t: "邦联分子"
 usfp_reconstruction.7.d: "应[SCOPE.sCountry('brazil_scope').GetAdjective]政府的邀请，数千名前邦联分子开始启程前往[SCOPE.sState('confederados_state_scope').GetName]。尽管奴隶制在[ROOT.GetCountry.GetName]已经败落，但[SCOPE.sCountry('brazil_scope').GetNameNoFormatting]为他们提供了一个机会，将其独特的制度移植到赤道另一侧。"
 usfp_reconstruction.7.f: "\"官方表现出了极大的热忱，愿意善意接纳我们的所有同胞。他们承诺为所有需要帮助的人提供支持，助其携家带口移居帝国。各地民众同样对我们迁移至他们国土表现出最诚挚的欢迎。\""
 usfp_reconstruction.7.a: "他们可以自由离开，祝他们好运。"
 usfp_reconstruction.8.t: "二次建国"
 usfp_reconstruction.8.d: "重建终于接近尾声，南方正全面重新融入[ROOT.GetCountry.GetName]。我们为维护[SCOPE.sCulture('afro_american_culture').GetName]自由的承诺所做的努力已结出硕果，使他们得以彻底改变自身。曾经备受压迫的奴隶，如今已成为自由公民、房产所有者，甚至官员。[SCOPE.sCulture('dixie_culture').GetName]的怒火仍将持续，但他们企图回到内战前时期的尝试已被挫败，希望这一胜利能够长久持续。"
 usfp_reconstruction.8.f: "“我们需要的不是光，而是火；不是细雨，而是雷鸣。我们需要的是风暴、旋风和地震\"。"
 usfp_reconstruction.8.a: "没有斗争就没有进步。"
 usfp_reconstruction.8.b: "我们的承诺只实现了一半。"
 usfp_reconstruction.9.t: "分裂的迪克西"
 usfp_reconstruction.9.d: "重建终于接近尾声，南方正全面重新融入[ROOT.GetCountry.GetName]。[SCOPE.sCulture('afro_american_culture').GetName]人口占比较大的州已能确保重建成果，而[SCOPE.sCulture('dixie_culture').GetName]占多数的州则屈从于\"救赎派\"的控制。战争的创伤已经愈合，但南方已被分割成自由州和“[concept_usfp_jim_crow]”州。"
 usfp_reconstruction.9.f: "\"我只有一个请求：给黑人真正自主的机会！别去干涉他们！如果你看到他们在上学的路上，别去打扰，——让他们安静地走自己的路！如果你看到他们在酒店用餐，别去阻拦！如果你看到他们去投票，别去干涉，——让他们自由行使自己的权利！\""
 usfp_reconstruction.9.a: "时间会治愈一切。"
 usfp_reconstruction.10.t: "南方的救赎"
 usfp_reconstruction.10.d: "随着南方重新完全并入[ROOT.GetCountry.GetName]，重建工作终于接近尾声。面对激烈的反对和微弱的政府支持，重建毫无例外地失败了，重建者完全控制了前合众国。虽然这在全国范围内实现了与叛军的和解，但它意味着在南方各地实施的种族主义“[concept_usfp_jim_crow]”法律的铁腕下，[SCOPE.sCulture('afro_american_culture').GetName]权利遭到破坏。"
 usfp_reconstruction.10.f: "“哪里有正义被剥夺，哪里有贫困，哪里有无知盛行，哪里有任何一个阶级感到社会是一个有组织的阴谋来压迫、抢劫和贬低他们，那么人身和财产都不会安全。”"
 usfp_reconstruction.10.a: "这将困扰我国几个世纪之久"
 usfp_reconstruction.10.b: "与南方和解才是最重要的。"
 usfp_reconstruction_full_jim_crow: "南方所有州都将颁布《[concept_usfp_jim_crow]》。"
 usfp_reconstruction_partial_jim_crow: "南方各州中非裔美国人数不算多的州将颁布[concept_usfp_jim_crow]。"
 usfp_manifest_destiny.1.t: "从此岸到光辉的彼岸？"
 usfp_manifest_destiny.1.d: "自[concept_usfp_thirteen_colonies]时代以来，[ROOT.GetCountry.GetName]的拓荒者们就对西部土地垂涎已久，完全无视那里原有的居民。如今，一个为扩张正名的理念开始在我们的民族意识中萌芽——昭昭天命。这一理念的支持者宣称，掌控并开拓整个大陆不仅是我们的权利，更是我们的神圣使命。"
 usfp_manifest_destiny.1.f: "“上帝赋予我等天命，整个大陆发展、自由、联邦自治皆由我等实现。”"
 usfp_manifest_destiny.1.a: "新世界的诞生即将到来！"
 usfp_manifest_destiny.1.b: "征服毫无神圣可言。"
 usfp_manifest_destiny.2.t: "[SCOPE.sStateRegion('texas_scope').GetName]请求援助！"
 usfp_manifest_destiny.2.d: "一支前[SCOPE.sStateRegion('texas_scope').GetName]共和国的代表团已经抵达华盛顿，他们表示，在德克萨斯州起义失败之后，[SCOPE.sCulture('dixie_culture').GetName]定居者遭到了[SCOPE.sCountry('mexico_scope').GetAdjectiveNoFormatting]当局的残酷打压。代表团恳请我国介入，将德克萨斯人从[SCOPE.sCountry('mexico_scope').GetName]的暴政中解救出来。"
 usfp_manifest_destiny.2.f: "在墨西哥人民的默许下，安东尼奥·洛佩斯·德·圣安纳将军已经推翻了墨西哥宪法。现在他给了我们一个残酷的选择，要么放弃我们用千辛万苦换来的家园，要么屈服于所有暴政中最残酷的暴政——刀剑与教条的联合专制。"
 usfp_manifest_destiny.2.a: "德克萨斯寻求帮助，[ROOT.GetCountry.GetName]将回应他们的请求！"
 usfp_manifest_destiny.2.b: "我们无意对抗[SCOPE.sCountry('mexico_scope').GetName]"
 usfp_manifest_destiny.3.t: "给北方一个提议"
 usfp_manifest_destiny.3.d: "[SCOPE.sCountry('usa_scope').GetName]政府想要以@money!#yellow 300万#!购买我国北部领土，他们准备在四年内分期支付。美国人似乎是执着于开疆拓土，接受这一提议也许就能避免冲突。"
 usfp_manifest_destiny.3.f: "“上加利福利亚#italic 和#!新墨西哥？他们在开玩笑吧，真的认为我们会卖国求荣吗？”\n\n“话虽如此，但我们的国库现在实在空虚，而且美国人再向我们提出要求的时候可能就不是外交斡旋了。”\n\n“荒谬至极！如果他们这么想偷走我们的土地，那就让他们在战场上见真章吧。”"
 usfp_manifest_destiny.3.a: "我们接受。"
 usfp_manifest_destiny.3.b: "要求[SCOPE.sCountry('usa_scope').GetAdjective]外交官立即离开。"
 usfp_manifest_destiny.4.t: "墨西哥拒绝"
 usfp_manifest_destiny.4.d: "[SCOPE.sCountry('mexico_scope').GetName]拒绝了我们购买其领土的提议。我国政府内的沙文主义者们叫嚣着宣战，提议将整个墨西哥变成[ROOT.GetCountry.GetAdjective]的一部分。"
 usfp_manifest_destiny.4.f: "“他们甚至拒绝见我，在门口就把我拒之门外。”\n\n“我明白了。给报社发个消息，今天晚些时候我将与将军们会面\"”"
 usfp_manifest_destiny.4.a: "再说吧。"
 usfp_manifest_destiny.4.b: "无论如何，我们都将拥有这片土地。"
 usfp_manifest_destiny.5.t: "墨西哥接受"
 usfp_manifest_destiny.5.d: "[SCOPE.sCountry('mexico_scope').GetName]接受了我们购买其北部省份的提议。条约签署后，我们的南部边界固定在格兰德河上，[ROOT.GetCountry.GetName]一直延伸至太平洋！"
 usfp_manifest_destiny.5.f: "“他们管这叫'收购墨西哥'，就像当年的路易斯安那一样。我们国家的领土将扩大一倍！”\n\n“切，依我看，总统是个傻瓜。大陆另一边的破沙漠，去一趟甚至不值我的路费，能有什么价值？我缴的税金就是这样被白白浪费的。”"
 usfp_manifest_destiny.5.a: "漂亮"
 texan_war_of_independence.2.d: "我们无意对抗[SCOPE.sCountry('mexico_scope').GetName]"
 texan_war_of_independence.2.d.t: "要是再放任[SCOPE.sCountry('texas_scope').GetName]的独立地位，他们很快就会要求独立建国。"
 usfp_manifest_destiny.6.t: "《瓜达卢佩‑伊达尔戈条约》"
 usfp_manifest_destiny.6.d: "随着敌军的溃败，[SCOPE.sCountry('mexico_scope').GetName]已被迫接受条件。现在我“昭昭天命”要带我们去多远？"
 usfp_manifest_destiny.6.f: "“美利坚合众国和墨西哥合众国真诚地希望结束两个共和国之间不幸存在的战争灾难，并在坚实的基础上建立和平友好的关系……”"
 usfp_manifest_destiny.6.a: "我们的原报价仍然有效。我们将强制[SCOPE.sCountry('mexico_scope').GetName]出售。"
 usfp_manifest_destiny.6.b: "我们对[SCOPE.sCountry('mexico_scope').GetName]有更好的方案。"
 usfp_manifest_destiny.6.c: "凭借征服权，我们将占领加利福尼亚、新墨西哥，甚至更多！"
 usfp_manifest_destiny.6.e: "为了确保和平，[SCOPE.sCountry('mexico_scope').GetName]必须屈服。"
 usfp_manifest_destiny.6.g: "#r 既然如此，我们为什么不能占领整个[SCOPE.sCountry('mexico_scope').GetName]？#!"
 usfp_manifest_destiny.7.t: "[SCOPE.gsInterestGroup('pb_ig').GetName]接纳大陆主义"
 usfp_manifest_destiny.7.d: "迄今为止，[SCOPE.gsInterestGroup('pb_ig').GetName]主要倾向于发展[ROOT.GetCountry.GetName]的城市中心，而不是扩张领土。随着“天命昭昭”的影响越来越大，许多中产阶级开始支持适度扩张，以确保太平洋港口的安全。"
 usfp_manifest_destiny.7.f: "“美国在亚洲和欧洲之间的中间地理位置，这赋予了她两大洲之间仲裁者的权力和职责。随着大西洋和太平洋的联合，美国可以采取行动融合和协调世界各大洲。”"
 usfp_manifest_destiny.7.a: "扩张将促进经济发展。"
 usfp_manifest_destiny.7.b: "我们不能让这些帝国主义生根发芽。"
 usfp_manifest_destiny.8.t: "炮舰外交"
 usfp_manifest_destiny.8.d: "[SCOPE.gsInterestGroup('armed_forces_scope').GetName]提高[ROOT.GetCountry.GetName]在世界舞台上的地位方面发挥了作用，我们海军将有助于加强我们的外交努力。"
 usfp_manifest_destiny.8.f: "“蒸汽船那晦蒙地船身，在地平线上若隐若现，美国外交官带着礼物和谈判条件，以及少量警卫陪伴上岸，我们并没有忽视拒绝的含义。”"
 usfp_manifest_destiny.8.a: "有海军做后盾，我们一定能走得更远！"
 usfp_manifest_destiny.8.b: "军队应将重点放在国内。"
 usfp_manifest_destiny.9.t: "铁路大亨"
 usfp_manifest_destiny.9.d: "随着[ROOT.GetCountry.GetName]经济和领土的发展，[SCOPE.sBuilding('railway_scope').GetName]的重要性也在稳步增长。[SCOPE.gsInterestGroup('industrialists_scope').GetName]看到了前所未有的盈利机会，开始大量投资于铁路扩张，并向政府寻求有利的土地补偿。"
 usfp_manifest_destiny.9.f: "“人们普遍认为，驿站运输的旧时代正在迅速逝去，而机械动车很快就会渗透到全国的各个地方，把木材运到码头；把小麦运到磨坊；把矿石运到矿山；填补通航溪流的不足，开辟数百万英亩的世界上最好的水果和谷物种植地，并使成千上万的富矿开采和利用。”"
 usfp_manifest_destiny.9.a: "铁路将改变这个国家！"
 usfp_manifest_destiny.9.b: "这些铁路是一颗金融定时炸弹。"
 usfp_manifest_destiny.10.t: "金山的传说"
 usfp_manifest_destiny.10.d: "在[SCOPE.sState('california_scope').GetName]发现了$gold$的消息很快传到了大洋彼端的[SCOPE.sCountry('china_scope').GetName]。数千[SCOPE.sCulture('han_scope').GetName]被'金山'到处流淌着财富的传说吸引迁徙至此。"
 usfp_manifest_destiny.10.f: "“啊，把所有的女儿都嫁给金山上的男人吧\n所有那些金山上的箱子\n你想要多少就有多少！\n啊，千万别把女儿嫁给金山上的男人\n孤独和悲伤还有锅灶是她唯一的伴侣！\"”"
 usfp_manifest_destiny.10.a: "淘金热不可阻挡！"
 usfp_manifest_destiny.10.b: "外国劳工是混乱之源。"
 usfp_manifest_destiny.10.a.t: "无视[SCOPE.sCountry('china_scope').GetAdjective]政策，未来几年内将有超过三万名[SCOPE.sCulture('han_scope').GetName]$laborers$来到[SCOPE.sState('california_scope').GetName]。"
 usfp_manifest_destiny.12.t: "加利福尼亚种族灭绝"
 usfp_manifest_destiny.12.d: "随着[ROOT.GetCountry.GetAdjective]定居者不断向[SCOPE.sState('california_scope').GetName]腹地推进，州政府认为有必要对原住民展开官方灭绝行动。该州实质上赦免了所有针对印第安人的罪行，甚至还悬赏印第安人的头皮，这种政策导致针对[SCOPE.sCulture('hokan_scope').GetName]人的暴行激增。"
 usfp_manifest_destiny.12.f: "“灭绝不是以后，而是现在！工作已经开始，让第一个签署和平条约的白人被视为叛徒和懦夫吧。”"
 usfp_manifest_destiny.12.a: "我们的人民才是第一位的。"
 usfp_manifest_destiny.12.b: "这些政策不能再继续下去了。"
 usfp_manifest_destiny.14.t: "《奥斯坦德通告》"
 usfp_manifest_destiny.14.d: "[ROOT.GetCountry.GetAdjective]数名与[SCOPE.gsInterestGroup('landowners_ig').GetName]关系密切的外交官，近日向[ROOT.GetCountry.GetRuler.GetLastName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]发送了一份通函，阐述了收购[SCOPE.sStateRegion('cuba_scope').GetName]的理由。该通告提议从[SCOPE.sCountry('cuba_owner_scope').GetAdjective]政府手中购买该岛，但同时也为必要时武力夺取的正当性进行辩护。文件内容旋即遭媒体曝光，引发废奴派人士与欧洲多国政府的强烈抗议。"
 usfp_manifest_destiny.14.f: "“只要古巴不在合众国之中，合众国就永远不会安宁，我国政府获得古巴是至关重要的，我们也相信这是古巴人民期盼的结果。”"
 usfp_manifest_destiny.14.a: "我们不是在搞粗俗的帝国主义。"
 usfp_manifest_destiny.14.b: "[SCOPE.sStateRegion('cuba_scope').GetName]对我们的国家安全来说至关重要。"
 usfp_manifest_destiny.14.c: "我们不会从[SCOPE.sCountry('cuba_owner_scope').GetName]#italic 购买#!任何东西。"
 cuba_offer_available: "我们可以向[SCOPE.sCountry('cuba_owner_scope').GetName]提出购买[SCOPE.sStateRegion('cuba_scope').GetName]。"
 usfp_manifest_destiny.14.e: "立即召回并追责这些外交官。"
 usfp_manifest_destiny.15.t: "购买古巴"
 usfp_manifest_destiny.15.d: "[SCOPE.sCountry('usa_scope').GetName]提出向我们购买[SCOPE.sStateRegion('cuba_scope').GetName]岛，还声称控制该岛对他们的国家安全至关重要。他们开出的价码是分30年支付@money!#yellow 13M#!。"
 usfp_manifest_destiny.15.f: "“一旦实现这一目标，[ROOT.GetCountry.GetNameNoFormatting]将成为世界旅游的中心，为其多样化的产品赢得一个长期而有利可图的市场。在有利价格对产业的刺激下,她的田野将遍布谷物,葡萄园也将产出大量精选佳酿。[ROOT.GetCountry.GetNameNoFormatting]将迅速成为上天眷顾之地本该成为的模样——富饶、强盛而安泰。”"
 usfp_manifest_destiny.15.b: "简直荒谬！"
 usfp_manifest_destiny.15.a: "让我们摆脱[SCOPE.sStateRegion('cuba_scope').GetName]。"
 usfp_manifest_destiny.16.t: "[SCOPE.sCountry('cuba_owner_scope').GetName]拒绝"
 usfp_manifest_destiny.16.d: "[SCOPE.sCountry('cuba_owner_scope').GetName]断然拒绝了我们购买[SCOPE.sStateRegion('cuba_scope').GetName]的提案，如果我们想要控制该岛，就必须采取军事行动。"
 usfp_manifest_destiny.16.f: "“我们为古巴开出[SCOPE.sCountry('cuba_owner_scope').GetNameNoFormatting]一个远远超出其目前价值的价格而遭到拒绝之后，我们就应该考虑这样一个问题，西班牙拥有古巴是否会严重危及合众国存在？”"
 usfp_manifest_destiny.16.a: "如果他们拒绝出售，我们也不会强迫他们。"
 usfp_manifest_destiny.16.b: "我们必须坚持对海湾地区的控制。"
 usfp_manifest_destiny.17.t: "[SCOPE.sCountry('cuba_owner_scope').GetName]出售[SCOPE.sStateRegion('cuba_scope').GetName]"
 usfp_manifest_destiny.17.d: "[SCOPE.sCountry('cuba_owner_scope').GetName]已同意我国购买[SCOPE.sStateRegion('cuba_scope').GetName]。"
 usfp_manifest_destiny.17.f: "“美国和所有商业国家都将从这一转让中受益，西班牙的利益也将得到极大促进。西班牙知道我们愿意为该岛支付如此巨额的资金，将对开发其丰富的自然资源产生多么大的影响。”"
 usfp_manifest_destiny.17.a: "到处都可以种雪茄！"
 usfp_manifest_destiny.18.t: "违反门罗主义！"
 usfp_manifest_destiny.18.d: "依据 [concept_usfp_monroe_doctrine]，[ROOT.GetCountry.GetName]在名义上反对任何外国势力进一步染指西半球。  [SCOPE.sCountry('initiator_scope').GetName]针对[SCOPE.sCountry('target_scope').GetName]所展现出的侵略意图，显然是对这一原则的公然践踏，理应有所回应。"
 usfp_manifest_destiny.18.f: "“为了美国与大国之间的坦诚和友好关系，我们必须宣布，我们的体系扩展到本半球任何地区，任何企图都会危及我们的和平与安全的行为。”"
 usfp_manifest_destiny.18.a: "美国不会袖手旁观！"
 usfp_manifest_destiny.18.b: "[SCOPE.sCountry('target_scope').GetName]与我们无关。"
 usfp_manifest_destiny.18.c: "如果没有海军来配合，我们就无法执行这一原则。"
 usfp_manifest_destiny.18.e: "我们眼下有些忙！"
 usfp_manifest_destiny.19.t: "[SCOPE.sCulture('american_culture').GetName]文化超然概念"
 usfp_manifest_destiny.19.d: "“昭昭天命”的理念如今已然渗透到祖国的每一寸土地。从东海岸到西海岸，我们的人民都在谈论着[ROOT.GetCountry.GetName]所肩负的伟大而神圣的使命。这种狂热对[ROOT.GetCountry.GetAdjectiveNoFormatting]的文化结构产生了深远影响，其效应将持续数代人。"
 usfp_manifest_destiny.19.f: "“神圣的使命！不朽的天命！让我们以欢欣鼓舞的心情，快速而坚定地踏上摆在我们面前的光明大道！让每一颗美国人的心灵都对爱国之情敞开怀抱，让炽热的爱国热情永不磨灭，让我们以虔诚的信仰去信赖我们深爱的祖国所承载的崇高而伟大的命运！”"
 usfp_manifest_destiny.19.a: "我们必须捍卫我们民族神圣不可侵犯的身份认同，严防境外势力的渗透与影响。"
 usfp_manifest_destiny.19.b: "美国人的美国！"
 usfp_manifest_destiny.19.c: "我们所有人都是[SCOPE.sCulture('american_culture').GetName]！"
 usfp_manifest_destiny.19.g: "让所有人都来这里找到属于自己的位置！"
 usfp_manifest_destiny.19.h: "不是一个大熔炉，而是一个巨大的马赛克！"
 american_superculture_emerges: "25%的[SCOPE.sCulture('yankee_culture').GetName]、[SCOPE.sCulture('dixie_culture').GetName]和[SCOPE.sCulture('anglo_canadian_culture').GetName][Concept('concept_pop', '$concept_pops$')]将采用[SCOPE.sCulture('american_culture').GetName]文化"
 american_superculture_homelands: "[SCOPE.sCulture('yankee_culture').GetName]、[SCOPE.sCulture('dixie_culture').GetName]和[SCOPE.sCulture('anglo_canadian_culture').GetName][Concept('concept_homeland', '$concept_homelands$')]成为[SCOPE.sCulture('american_culture').GetName][Concept('concept_homeland', '$concept_homelands$')]"
 usfp_native_removal.1.t: "塞米诺尔迁移"
 usfp_native_removal.1.d: "随着旷日持久的第二次塞米诺尔战争终于进入尾声，我军可以着手将残余的[SCOPE.sCulture('muskogean_scope').GetName]族群迁徙至密西西比河对岸的保留地。"
 usfp_native_removal.1.f: "“我是黑人吗，是白人的奴隶吗？不！我是印第安人。白人休想将我变为黑奴。我要以鲜血将白人染红，再将他们晒黑在烈日和暴雨之中，把他们抛尸荒野，任凭饿狼啃噬他们的白骨，秃鹫撕裂他们的血肉！”"
 usfp_native_removal.1.a: "拒绝搬迁的人将被强行带走。"
 usfp_native_removal.1.a.t: "我们将开始从[SCOPE.sStateRegion('florida_scope').GetName]开始驱逐塞米诺尔人，不过可能需要一段时间。"
 usfp_native_removal.2.t: "《新埃可塔条约》"
 usfp_native_removal.2.d: "一小群[SCOPE.sCountry('cherokee_scope').GetAdjective]谈判代表签署了一项条约，同意放弃他们祖传的土地。[SCOPE.sCountry('cherokee_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('cherokee_scope').GetRuler.GetFullName]提出抗议，因为该条约并未得到大多数切罗基人的同意，但条约为我们开始迁移行动提供了法律依据。"
 usfp_native_removal.2.f: "“鉴于，密西西比河东岸切诺基印第安族众多族人中的数位代表，迄今已到访华盛顿城，作为族中支持迁移的一方代表团，怀揣促成与美利坚合众国政府及切诺基民族全体皆可接纳之安排的希冀与渴盼，籍此终结他们居于美利坚已开发区域期间所遭受的诸多艰难困苦……”"
 usfp_native_removal.2.a: "他们可以在密西西比河之外享有和平。"
 usfp_native_removal.2.a.t: "我们现在可以开始让切诺基人迁移了！"
 usfp_native_removal.4.t: "切罗基人的土地"
 usfp_native_removal.4.d: "绝大部分[SCOPE.sCulture('cherokee_culture').GetName]族原住民已被强制迁移至[SCOPE.sCountry('indian_territory_scope').GetName]，他们的祖居地如今全境被我们吞并。尽管仍有零星小股散居者侥幸逃脱迁移，藏身荒野，但白人定居者已开始向这片清理出的土地更深处拓殖。"
 usfp_native_removal.4.f: "“父辈故居恋难舍，\n坟前高树荫蔽深。\n贪欲金钱引横祸，\n切诺基人踏征程。\n异地他乡路迢迢，\n岁月难抚创伤侵。\n血泪之路永难忘，\n苦难记忆无法泯。”"
 usfp_native_removal.4.a: "我们将更好地利用他们的土地。"
 usfp_native_removal.5.t: "《庞托托克河条约》"
 usfp_native_removal.5.d: "我们与[SCOPE.sCountry('chickasaw_scope').GetName]人签订的条约要求我们为其西迁提供资助，并补偿其土地价值。"
 usfp_native_removal.5.f: "“奇克索族发现，在当前的处境中，他们饱受压迫，因为他们被迫遵守所居住州的法律。他们宁愿去西部寻找一个新的家园，也不愿屈服于这个罪恶的枷锁。在新的家园，他们可以自由生活，并按照自己的法律进行管理。他们相信，如果有足够的资金来签订合同并支付相关费用，就能在一个适合自己需求和条件的地方为自己找到一个家园。因此，他们已下定决心要出售自己的土地，去寻找一个新的家园。”"
 usfp_native_removal.5.a: "我们将遵守条约。"
 usfp_native_removal.5.b: "他们不能强迫我们付钱。"
 usfp_native_removal.6.t: "血泪之路"
 usfp_native_removal.6.d: "最后几支奇克索族部落已经历尽艰辛，穿越密西西比河，一路上饱受严酷条件和贫困之苦，有些人未能在旅途中幸存。"
 usfp_native_removal.6.f: "“ ……我们的村庄已是满目萧条，印第安人全都离去。眼看这些可怜的人们背井离乡，远离祖先长眠之地，不禁令人悲从中来。他们的脸上刻印着深沉的哀愁。”"
 usfp_native_removal.6.a: "我们做了我们能做的"
 usfp_native_removal.6.b: "我们手上有他们的血。"
 usfp_native_removal.7.t: "佛罗里达的和解"
 usfp_native_removal.7.d: "在经历了大量的武力冲突和顽强抵抗后，绝大多数幸存的塞米诺尔人如今已被迫迁往[SCOPE.sCountry('indian_territory_scope').GetName]。然而，仍有若干残余部族盘踞在大沼泽地深处，拒不服从管辖，且事实证明他们几乎无法被驱离。"
 usfp_native_removal.7.f: "“塞米诺尔印第安人愿意放弃其目前在佛罗里达境内所占土地的一切主张，并同意迁徙至密西西比河以西划拨给克里克人的区域；依据协议，将按照塞米诺尔人的人口数量向克里克人的领地追加相应面积的土地，而塞米诺尔人将作为克里克人的一个组成部分被接纳，并恢复享有作为其成员所应拥有的全部权利……”"
 usfp_native_removal.7.a: "这件事拖得太久了。"
 usfp_native_removal.8.t: "[SCOPE.sState('massacre_state_scope').GetName]的印第安人大屠杀"
 usfp_native_removal.8.d: "为了霸占更多的土地，来自[SCOPE.sCulture('massacrer_culture').GetName]的定居者在[SCOPE.sState('massacre_state_scope').GetName]精心策划并实施了一场针对印第安人的大屠杀。令人发指的强奸和抢劫暴行的详细描述已经开始在全国各地的新闻报导中广泛流传，引发了人们的震惊和愤慨。"
 usfp_native_removal.8.f: "“去他妈的那些同情印第安人的家伙！老子来这儿就是奔着杀印第安人来的，老子坚信用上帝赋予的任何手段去干掉印第安人都是他妈的正确而光荣的！”"
 usfp_native_removal.8.a: "迁移将拯救印第安人"
 usfp_native_removal.8.b: "必须严惩那些对这起暴行负有责任的人！"
 usfp_native_removal.9.t: "[SCOPE.sCulture('settler_culture_scope').GetName]的定居者强烈要求迁移印第安人"
 usfp_native_removal.9.d: "[SCOPE.sCulture('settler_culture_scope').GetName]殖民者正对[SCOPE.sState('settler_state_scope').GetName]的原住民领地虎视眈眈，他们公开要求彻底驱逐该地区的所有原住民。这些意图拓殖的群体已向政府递交请愿书，抗议我们在此事上的迟缓作为。"
 usfp_native_removal.9.f: "“让[SCOPE.sState('settler_state_scope').GetNameNoFormatting]从印第安人口的包袱中解脱出来，这对该州的利益而言至关重要。为了印第安人和我们本族人民的福祉，恳请联邦政府切实执行其自行颁布的法案。”"
 usfp_native_removal.9.a: "我们只是需要更多时间来妥善处理此事。"
 usfp_native_removal.9.b: "诅咒这些夺走土地的强盗！"
 usfp_native_removal.10.t: "克里克人的迁移"
 usfp_native_removal.10.d: "尽管克里克民族中有许多人接受了我们的迁徙条款，但仍有数支大型部落拒绝搬迁。在对 [SCOPE.sState('alabama_scope').GetName]进行了一次短暂的军事远征后，最后一批剩余的克里克人已被强制护送至[SCOPE.sState('oklahoma_scope').GetName]。"
 usfp_native_removal.10.f: "“男人们被两两戴上手铐，一条长长的锁链穿过双排人列，将他们牢牢束缚在一起。这些林中哲人展现出了极度坚忍的品格，无论肉体还是精神上的苦难都不能让他们流露出哪怕一丝痛苦的迹象。妇女们泪流满面地跟在后面，发出撕心裂肺的哀嚎；年幼的孩子们虽然尚不能理解父母那不堪回首的遭遇，却也出于同情而啼哭不止。”"
 usfp_native_removal.10.a: "他们早该接受我们提出的条约。"
 usfp_native_removal.10.b: "多么悲惨的处境啊。"
 usfp_native_removal.11.t: "塞米诺尔人的突袭"
 usfp_native_removal.11.d: "负隅顽抗的塞米诺尔人从大沼泽地隐秘的营地发起进攻，突袭了[SCOPE.sState('florida_scope').GetName]的一个民兵要塞。尽管造成的伤亡人数不多，守军还是被迫从要塞中撤离。在塞米诺尔人消失在荒野之前，周围地区的几个白人定居点遭到了洗劫和焚烧。"
 usfp_native_removal.11.f: "“你们有枪，我们也有枪；你们有火药和子弹，我们也有；你们有人，我们也有人。你们的人会战斗，我们的人也会战斗，我们会战斗到最后一滴塞米诺尔人的鲜血浸润了他赖以为生的狩猎场的尘土。”"
 usfp_native_removal.11.a: "民兵应该加强巡逻。"
 usfp_native_removal.11.b: "把那些强盗赶出去！"
 usfp_native_removal.12.t: "印第安人掉队者"
 usfp_native_removal.12.d: "迁入[SCOPE.sState('indian_stragglers_state').GetName]农村地区的定居者与逃避驱逐的小股印第安人发生冲突。零星的袭击和对抗仍在继续，留下一片片破败的家园。定居者们步步紧逼，将残余的印第安人推入荒野深处。"
 usfp_native_removal.12.f: "“我们仍然时不时会见到他们的身影，那些印第安人。有些人特别执拗，在他们祖先的旧居周围徘徊不去，即使我们在旧居周围竖起了新的篱笆。”"
 usfp_native_removal.12.a: "他们就该接受迁移，避免惹上麻烦。"
 usfp_native_removal.12.b: "他们有离开或者留下的自由。"
 usfp_native_removal.13.t: "致[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]的信"
 usfp_native_removal.13.d: "诗人[SCOPE.sCharacter('emerson_scope').GetFullName]公开发表了一封信，对我们驱逐印第安人的政策提出了严厉批评。这封信从道德角度阐明了终止该政策的必要性，并指出我们强加给印第安人的困境已经让许多普通美国民众感到震惊和心寒。"
 usfp_native_removal.13.f: "“自这片土地形成之日起，甚至是在一个和平年代，一个国家与自己的盟友和受庇护者打交道时，竟然如此背信弃义，如此蔑视正义，如此对哀求怜悯的呼声置若罔闻。先生，莫非这个政府真的认为，美利坚合众国的人民已经堕落成了野蛮和疯狂的状态？莫非博爱与善良的情操已经从他们心中被彻底剥离？从缅因到佐治亚，存在于所有人内心深处的人性本质、正义和怜悯，无不对这种行径感到深恶痛绝。”"
 usfp_native_removal.13.a: "他的话句句属实。"
 usfp_native_removal.13.b: "他的话言之无物。"
 usfp_native_removal.14.t: "刺客刺杀了[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastNameNoFormatting]！"
 usfp_native_removal.14.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]在[ROOT.GetCountry.GetCapital.GetCityHubName]街头被枪杀！在随后的混战中，刺客自己也中弹身亡。虽然刺客动机尚不清楚，但已确定刺客是一名[SCOPE.sCulture('assassin_culture_scope').GetName]男子，这让大多数人立即认为他与印第安人迁移有关。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已被送往医院，情况危急。"
 usfp_native_removal.14.f: "“让开！让开！总统被枪杀！天啊！”"
 usfp_native_removal.14.a: "这简直骇人听闻！"
 usfp_native_removal.15.t: "刺客刺杀了[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastNameNoFormatting]！"
 usfp_native_removal.15.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]在[ROOT.GetCountry.GetCapital.GetCityHubName]街头遭到枪击！有人目睹一名白人男子向总统大喊大叫，称他为“印第安走狗”，随后开枪射击。在随后的混战中，刺客本人中弹身亡，而[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]则被紧急送往医院，情况危急。"
 usfp_native_removal.15.f: "“让开！让开！总统被枪杀！天啊！”"
 usfp_native_removal.15.a: "这简直骇人听闻！"
 usfp_native_removal.16.t: "搬迁北方"
 usfp_native_removal.16.d: "随着定居者涌入旧西北的每一个角落，剩下的大多数印第安民族被迫同意搬迁条约。许多人在当地民兵的带领下被迫向西行进，他们几乎不在乎印第安人是否幸存下来."
 usfp_native_removal.16.f: ""在战线两侧，龙骑兵和志愿兵彼此相距相等的距离，他们经常用严厉的手势和尖刻的言语催促落后者。在这支骑兵之后，来了一队四十辆行李车，里面装满了行李和印第安人。病人躺在里面，被猛烈地摇晃着，躺在一块帆布下，帆布非但不能保护他们免受灰尘和高温的侵袭，反而剥夺了他们的空气，因为他们就像被埋在这个燃烧的雨棚下——有几个人就这样死了."" #Father Benjamin Marie Petit
 usfp_native_removal.16.a: "愿他们远离定居者，找到安宁."

 usfp_usa.1.t: "《感伤宣言》"
 usfp_usa.1.d: "美国历史上首次女性权利大会在[SCOPE.sState('new_york_scope').GetName]的塞内卡瀑布镇召开。与会者从最初的独立宣言中汲取灵感，发表了一份《感伤宣言》，系统阐述了对男性压迫的控诉。"
 usfp_usa.1.f: "“长期以来，女性在这个政府的统治下饱受折磨，如今她们被迫站出来，要求获得自己应有的平等地位。纵观人类历史，男性反复伤害和剥夺女性权利，其真正目的就是要对女性建立起绝对的暴政统治。”"
 usfp_usa.1.a: "这是通往平等之路的第一步。"
 usfp_usa.1.b: "这些女人不知天高地厚。"
 usfp_usa.2.t:0 "飓风来袭[SCOPE.sState('hurricane_state').GetName]"
 usfp_usa.2.d:0 "一场飓风袭击了[SCOPE.sState('hurricane_state').GetName]，当地一片狼藉。洪水退去后，许多幸存者只能收拾残局。"
 usfp_usa.2.f:0 "“[SCOPE.sState('hurricane_state').GetCityHubName]的报告说道树木被连根拔起。轨道车倾覆，街道被碎石堵塞。大部分建筑受损，甚至屋顶也被掀起。”"
 usfp_usa.2.a:0 "[SCOPE.sState('hurricane_state').GetNameNoFormatting]必须振作起来。"
 usfp_usa.2.b:0 "我们将向灾区提供紧急援助。"
 usfp_usa.3.t:0 "龙卷风席卷[SCOPE.sState('tornado_state').GetName]"
 usfp_usa.3.d:0 "一场威力空前的龙卷风席卷了[SCOPE.sState('tornado_state').GetName]的乡村地区，所经之处满目疮痍。多个小镇被夷为平地，灾区道路遍布瓦砾，通行严重受阻。"
 usfp_usa.3.f:0 "“我们在地窖里蜷缩了一个多小时。外面狂风呼啸，宛如地狱一般。当安静下来的时候，我们探出头去，发现我们的房子……不见了，整个房子都被掀起来吹走了！”"
 usfp_usa.3.a:0 "[SCOPE.sState('tornado_state').GetNameNoFormatting]将一如既往的重建！"
 usfp_usa.3.b:0 "拨些紧急资金来帮助该地区恢复正常。"
 usfp_usa.4.t: "埃利斯岛的开放"
 usfp_usa.4.d: "[SCOPE.sState('new_york_scope').GetName]港口的埃利斯岛已经作为专门的移民检查站正式启用，以便更好地应对涌入[ROOT.GetCountry.GetName]的移民潮。开放短短数日，该岛已经处理了逾千名移民，而在未来数年，必将有更多移民络绎不绝地到来。对于这些移民而言，埃利斯岛将成为他们对[ROOT.GetCountry.GetName]的第一印象。"
 usfp_usa.4.f: "怀揣希冀的移民们在长队中等待，每个人的包袱和箱子里，装载着他们的整个人生。检查人员在队列间来回巡视，逐一检查每个人是否携带疾病。那些疑似染病的人会被粉笔做上记号，随后被分离开来。其余的人则在进一步的盘查中，缓缓向前挪动脚步。"
 usfp_usa.4.a: "新一代美国人在自由女神的火炬照耀下，踏上这片自由的土地！"
 usfp_usa.4.b: "[SCOPE.sState('new_york_scope').GetNameNoFormatting]已经够挤的了！"
 usfp_usa.5.t: "野火肆虐[SCOPE.sState('wildfire_state').GetName]"
 usfp_usa.5.d: "一场大规模的山火席卷了[SCOPE.sState('wildfire_state').GetName]的广袤土地，烧毁了逾十万公顷的土地。据报道，数十名当地居民死亡或失踪，另有数千人流离失所——他们正逃离被大火吞噬的家园。"
 usfp_usa.5.f: "“大火像一个恶魔，戏弄着我们，刻意制造痛苦与恐惧。我以为我们注定要死去。我曾相信，在这片由烈焰、热风、浓烟和灰烬组成的地狱中，我们根本无法生还。我目睹陌生人接连倒下，躺在路上。在火海的怒吼中，我听不见他们是否发出了尖叫。除了继续前行或被活活烧死，我们别无选择。”"
 usfp_usa.5.a: "火早晚会灭的。"
 usfp_usa.5.b: "我们将为恢复工作提供资金支持。"
 usfp_usa.6.t: "[SCOPE.sState('illinois_scope').GetCityHubName]大火"
 usfp_usa.6.d: "一场滔天大火已在[SCOPE.sState('illinois_scope').GetName]的[SCOPE.sState('illinois_scope').GetCityHubName]肆虐两天。超过一万五千座建筑付之一炬，近十万市民无家可归。全国各地的捐赠和物资如潮水般涌向这座饱受蹂躏的城市。\n\n同样在强劲风力的助长下，[SCOPE.sStateRegion('michigan_scope').GetName]和[SCOPE.sStateRegion('wisconsin_scope').GetName]的湖岸线上也燃起了大规模的野火。"
 usfp_usa.6.f: "”我聆听了片刻，以为快到黎明时分，便准备再次入眠。然而，我辗转反侧，内心逐渐被一种莫名的恐惧所笼罩。最终，为了安抚自己，我起身走到窗前，拉开百叶窗。眼前的景象令我震惊：一片火舌冲天而起，高度远超酒店楼顶百余英尺；无数火星如暴雨般倾泻而下，密集得宛如雷暴中的雨滴。“"
 usfp_usa.6.a: "真是一场可怕的灾难。"
 usfp_usa.6.b: "将联邦资金用于重建工作。"
 usfp_usa.7.t: "《哈珀周刊》"
 usfp_usa.7.d: "[SCOPE.sCharacter('nast_scope').GetFullName]凭借其尖锐辛辣的政治漫画声名鹊起。他的作品在全美广受欢迎的#italic 《哈珀周刊》#!上发表，深刻影响着公众对时政议题的讨论风向，其中大部分漫画都对其选定的政治对手进行了无情的嘲讽。"
 usfp_usa.7.f: "“你无法忽视纳斯特先生的画作，一旦看过，你便无法不理解其中的含义。当他讽刺某位政治家时，这位政治家的名字将永远让人联想到纳斯特赋予他的那副面容。这种极少的艺术家对公众舆论的影响力，远胜于十几位作家的合力。”"
 usfp_usa.7.a: "希望他不会成为我们的眼中钉。"
 usfp_usa.7.b: "漫画是给狭隘之人看的。"
 usfp_usa.8.t: "[SCOPE.sCharacter('nast_scope').GetLastName]效果"
 usfp_usa.8.d: "最新一期《哈珀周刊》刊登了[SCOPE.sCharacter('nast_scope').GetFullName]为[SCOPE.sCharacter('nast_support_scope').GetFullName]竞选造势的精致图画，同时对[SCOPE.sCharacter('nast_target_scope').GetFullName]及其推行的政策展开辛辣嘲讽。"
 usfp_usa.8.f: "“阻止这些该死的漫画！ 我本来不在乎报纸上写什么！因那些选民不识字，但该死的是他们能看懂漫画！”"
 usfp_usa.8.a: "好样的，纳斯特！"
 usfp_usa.8.b: "《哈珀周刊》应被钉在耻辱柱上。"
 usfp_usa.8.c: "关停报社！"
 usfp_usa.9.t: "合宪性异议"
 usfp_usa.9.d: "[SCOPE.sLaw('current_law_scope').GetName]的反对者以违反[ROOT.GetCountry.GetAdjective]宪法为由对该提案提出质疑。除非[concept_usfp_supreme_court]被说服以对我方有利的方式解读宪法，否则即便该法案由[concept_usfp_congress]通过，也将即刻被宣告无效。"
 usfp_usa.9.f: "\"立法机关的权力被精确地定义并严格限制，为了避免这些界限被误解或遗忘，那些制定成文宪法的人深知其根本意义——宪法是国家的基石与至高法律。因此，每一个这样的政府都必须接受这样的理论：任何违背宪法的立法行为，都是无效的。\""
 usfp_usa.9.a: "法律不能继续执行……"
 usfp_usa.9.b: "根据我们的解释，该法律完全符合宪法！"
 usfp_usa.9.c: "法官会自行判断解读宪法。"
 usfp_usa.9.e: "我们需要一部新的宪法！"
 usfp_usa.10.t: "《进步与贫困》"
 usfp_usa.10.d: "[SCOPE.sCharacter('george_scope').GetFullName]发表了一篇论文，该文解释了为什么经济的不断发展却无法消除贫困。他提出了一个激进的建议——对土地征收单一税，以消除土地所有者对经济的有害影响。该书一经出版，立即成为全国乃至全球的畅销书，许多读者认为其论点无可辩驳。"
 usfp_usa.10.f: "“造成财富分配不均的主要原因是土地所有权的不平等。土地所有权是一个基本事实，它最终决定了一个民族的社会、政治，进而决定了一个民族的思想和道德状况。”"
 usfp_usa.10.a: "这无疑是篇伟大的文章。"
 usfp_usa.10.b: "乔治的想法纯属幻想。"
 usfp_usa.10.c: "单一财产税是大势所趋！"
 usfp_usa.12.t: "[ROOT.GetCountry.GetAdjective]河马计划"
 usfp_usa.12.d: "一项解决$meat$成本上涨的新颖提案已提交[concept_usfp_congress]，该提案计划将非洲河马引入[SCOPE.sState('louisiana_scope').GetName]，让它们在那里捕食入侵植物，然后民众宰杀河马取肉。"
 usfp_usa.12.f: "“大不列颠已经尝遍了澳大利亚的袋鼠肉，并为之倾倒；欧洲大陆的人们将马肉视为主食；中美洲则以蜥蜴为佳肴。那么，美国人为什么不能尝试一下河马肉呢？”"
 usfp_usa.12.a: "谁让这家伙进来的？"
 usfp_usa.12.b: "我们将尽情享用湖牛培根！"
 usfp_usa.13.t: "野生河马"
 usfp_usa.13.d: "\"事实证明，我们进口的河马极难驯服，它们经常伤害驯兽员，还时不时逃入沼泽地带。野生河马已开始出现在几个邻近州的水道中，惊吓到了毫无防备的居民，并对当地植物和农作物造成了严重破坏。\""
 usfp_usa.13.f: "“河马其实非常容易驯化。在动物园里，它们温顺得如同羔羊，甚至可以用缰绳牵引。一只小河马竟然会用婴儿奶瓶喝奶！”"
 usfp_usa.13.a: "嗯，河马肯定会给当地的生态系统带来福音！"
 usfp_usa.13.b: "悬赏捉拿这些肆虐的野兽。"
 usfp_usa_labor.1.t: "世界产业工人联盟"
 usfp_usa_labor.1.d: "一场激进工会主义者大会在[SCOPE.sState('illinois_scope').GetCityHubName]召开，并成立了名为“世界产业工人联盟”（IWW）的组织，旨在将各行各业的工人联合成“一个大工会”。相较于传统劳工组织，IWW采取了更为激进的立场，其公开宣称的目标是彻底废除工资制度，纲领主张通过直接行动、总罢工及破坏性斗争实现这一目标。"
 usfp_usa_labor.1.f: "“工人阶级肩负着消灭资本主义的历史使命。生产军队不仅要为日常与资本家的斗争做好准备，还要为资本主义覆灭后继续进行生产做好组织。通过工业化的组织，我们在旧社会的外壳中孕育着新社会的结构。”"
 usfp_usa_labor.1.a: "对一个人的伤害就是对所有人的伤害！"
 usfp_usa_labor.1.b: "这些激进分子对社会秩序构成威胁。"
 usfp_usa_labor.2.t: "干草市场爆炸案"
 usfp_usa_labor.2.d: "在[SCOPE.sState('illinois_scope').GetCityHubName]举行的劳工集会升级了为流血事件——一枚炸弹被投向正在推进的警察队伍，导致警方盲目向示威人群无差别开火。事后，地方当局将事件归咎于无政府主义者团体，并试图通过判处死刑来以儆效尤。"
 usfp_usa_labor.2.f: "“炸弹爆炸后，枪声四起。人群和我朝同一个方向跑去。我不得不跳过一个躺着的人，我看到另一个人倒在我前面，距离德普兰斯街以西大约100到200英尺。我抓住他的胳膊，想去扶他，但身后的枪声太激烈了，我只好松开手，跑了起来。”"
 usfp_usa_labor.2.a: "吊死他们！"
 usfp_usa_labor.2.b: "警察已经越界了。"
 usfp_test.1.t: "调试事件"
 usfp_test.1.d: "启用角色生成"
 usfp_test.1.f: "咕咕咕"
 usfp_test.1.a: "太神奇了！！"
 usfp_acw.8.t: "自由之土"
 usfp_acw.8.d: "现在，我们与南方奴隶主割席断交已广为人知，我们必须决定即将到来冲突中的目标。"
 usfp_acw.8.f: "“我所主张的废奴主义就像上帝的法律一样绝对，就像上帝权威一样不容妥协。每个奴隶都是被压迫者，每个奴隶主压迫者。没有任何先例、没有任何法律、没有任何契约、没有任何购买、没有任何遗赠、没有任何继承、没有任何情况的组合，奴隶制是不对的，只要奴隶还在枷锁中，合众国就不得安宁。”"
 usfp_acw.8.a: "让南方人自生自灭吧"
 usfp_acw.8.b: "我们必须击溃南方，解放奴隶！"
 usfp_acw.9.t: "联邦永存？"
 usfp_acw.9.d: "随着[SCOPE.sCountry('acw_secession_country').GetName]的胜利，开国先贤缔造的伟大联邦似乎已彻底分崩离析。尽管合众国仍在战败的余震中挣扎，激进分子却已开始公开质疑联邦政府的法统根基"
 usfp_acw.9.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastNameNoFormatting]庄严地看着星条旗降下。有些星星现在必须摘掉了，[ROOT.GetCountry.GetRuler.GetLastNameNoFormatting]想道，也许明年会摘掉另一颗星星，然后是另一颗。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]眼中，这个国家的未来已乌云密布。"
 usfp_acw.9.a: "[SCOPE.sCountry('acw_secession_country').GetName]不允许存在"
 usfp_acw.9.b: "联邦需要一只坚定的手来引导它渡过这场灾难。"
 usfp_acw.10.t: "共和国的英雄"
 usfp_acw.10.d: "内战结束后，我军凯旋，举国欢庆。胜利之后，我们许多英勇的军官和指挥官在政治上崭露头角。"
 usfp_acw.10.f: "“在这些军队中，你可以看到共和国的基石，未来的铁路经理、国会议员、银行行长、参议员、制造商、法官、州长和外交官，还有不少于半打的总统。”"
 usfp_acw.10.a: "向勇士致敬！"
 usfp_acw.10.b: "[SCOPE.sCharacter('civil_war_general').GetFullName]的政治前景明朗！"
 usfp_acw.10.c: "[SCOPE.sCharacter('general_grant_scope').GetFullName]将确保和平！"
 usfp_manifest_destiny.20.t: "奔向俄勒冈"
 usfp_manifest_destiny.20.d: "随着俄勒冈小径的开通，浩浩荡荡的马车车队开始西进，向往[SCOPE.sState('oregon_scope').GetName]的全新生活。穿越大平原与落基山脉的路线险峻异常，但沿途商人已迅速建立起补给站，向疲惫的拓荒者出售物资。"
 usfp_manifest_destiny.20.f: "“去遥远的太平洋彼岸，\n你可愿与我同行，亲爱的姑娘？\n在宁静的溪畔，在秀丽的景致，\n我们将跳下马车，建起小木屋！\n为草原逍遥欢呼雀跃！\n为山间搏斗振奋欢呼！\n若需举枪射击，若需拔剑出鞘，\n为祖国永远战斗，万岁，万岁！”"
 usfp_manifest_destiny.20.a: "西部的军事要塞将为拓荒者提供帮助。"
 usfp_manifest_destiny.20.b: "我们卖给饥肠辘辘的拓荒者补给品，可以大发一笔横财！"
 usfp_manifest_destiny.21.t: "《马溪条约》"
 usfp_manifest_destiny.21.d: "我们派驻边境的特使已与俄勒冈小径沿线的平原诸部族谈判达成条约。根据条约，我方获准在小径全线修筑防御工事与道路，并保障拓荒者免受印第安部族袭击。作为交换条件，我们将向参与条约的各印第安部族支付年金，同时承认并保障其领土主权。"
 usfp_manifest_destiny.21.f: "超过一万印度人聚集在一起签署条约，不久前，许多印第安人还一直是敌人，但源源不断的定居者已经成为一个不容忽视的大问题。相比之下，美国代表团显得更和蔼，也许有了这次武力展示和合同的签署，平原上就能实现和平了。"
 usfp_manifest_destiny.21.a: "这项条约太重要了，我们不能违反。"
 usfp_manifest_destiny.21.b: "有了堡垒，他们就不能强迫我们离开，也不能强迫我们付钱！"
 usfp_manifest_destiny.22.t: "不想破产就来派克峰！"
 usfp_manifest_destiny.22.d: "[SCOPE.sState('colorado_scope').GetName]黄金的发现引发了一股淘金热，大批淘金者涌入该地区寻求财富，这违背了我们与当地印第安部落签订的条约。越来越多的拓荒者深入山脉，并遭到了捍卫家园的土著勇士的凶猛反击。"
 usfp_manifest_destiny.22.f: "新的黄金国！！！\n堪萨斯领地发现黄金！！！\n派克峰探险队招募强壮男子！\n保证人人都能发大财！"
 usfp_manifest_destiny.22.a: "我们必须管控这些淘金者。"
 usfp_manifest_destiny.22.b: "条约算什么，有黄金为何不捞！"
 usfp_manifest_destiny.23.t: "联邦的现状"
 usfp_manifest_destiny.23.d: "如今，[ROOT.GetCountry.GetName]在国际舞台上的地位一落千丈，昭昭天命的梦想已然破灭。愤怒的煽动者开始将矛头指向外国人、天主教徒和政府——任何他们能为国家的困境找到的替罪羊，都成为了他们的出气筒。"
 usfp_manifest_destiny.23.f: "“就是这些该死的势力，把大量外国出生的人带到了投票站，他们根本不懂美国的利益，没有美国人的情怀，脑子里只有外国佬的想法，却来决定美国的事务；说白了，就是这些选票害惨了我们，造成了现在这个局面。”"
 usfp_manifest_destiny.23.a: "罢了，只要贸易保持流通就行。"
 usfp_manifest_destiny.23.b: "境外势力从内部摧毁了我们！"
 usfp_manifest_destiny.23.c: "真是一场灾难……"
 usfp_usa.9.g: "《宪法》需要一个守护者！"
 usfp_usa.18.t: "疯狂枪手射击[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastNameNoFormatting]！"
 usfp_usa.18.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]在[ROOT.GetCountry.GetCapital.GetCityHubName]街头遭到枪击！这名疯狂的枪手在被逮捕后声称他在总统选举中起到了重要作用，并要求在政府中担任要职。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已被送往医院，情况危急。"
 usfp_usa.18.f: "“让开！让开！总统被枪杀！天啊！”"
 usfp_usa.18.a: "真是个悲剧！"
 usfp_mormon.1.t: "[SCOPE.sState('missouri_scope').GetName][SCOPE.sReligion('mormonism_scope').GetName]战争"
 usfp_mormon.1.d: "在[SCOPE.sState('missouri_scope').GetName]，主流新教徒与自称“后期圣徒”的异端教派之间的紧张关系已经演变为公开的暴力冲突。新教义警组织实施了多起屠杀，并与[SCOPE.sReligion('mormonism_scope').GetName]民兵发生了激烈交火。在与州政府军警发生对抗后，该教派全体信徒现已被地方政府逐出家园，不得不北逃至[SCOPE.sState('illinois_scope').GetName]。"
 usfp_mormon.1.f: "“摩门教徒公然藐视法律，如今更是向本州人民宣战。为维护公众安宁，我们必须视他们为敌，若有必要，驱逐出境，甚至赶尽杀绝。他们的暴行罄竹难书，令人发指。如果您有能力增强兵力，兹授权您可根据实际需要，不受限制地扩充军队。”"
 usfp_mormon.1.a: "这种暴力不符合基督教。"
 usfp_mormon.1.b: "这个邪教不过是一群麻烦精。"
 usfp_mormon.2.t: "约瑟夫·史密斯被杀"
 usfp_mormon.2.d: "即使在搬迁到[SCOPE.sState('illinois_scope').GetName]并建立了诺伍镇后，摩门教徒和新教徒之间的摩擦仍在不断升级。市长兼摩门教先知约瑟夫·史密斯下令销毁一份反摩门教的报纸后，他被传唤到州法院接受审判。在狱中候审期间，史密斯和其他摩门教徒遭到暴徒袭击并被枪杀。"
 usfp_mormon.2.f: "“天启时刻不可避免！公民们起来，所有人起来！！你们岂能袖手旁观？任由这些地狱魔鬼！掠夺人们的财产？我们没有时间思考，每个人都将做出自己的选择！！”"
 usfp_mormon.2.b: "这是严重的司法不公！"
 usfp_mormon.2.a: "很明显，史密斯和他的走狗们自作自受。"
 usfp_mormon.3.t: "[SCOPE.sReligion('mormonism_scope').GetName]外逃"
 usfp_mormon.3.d: "由于和平共处似乎已不可能，摩门教徒选择向西迁移，为他们的信仰寻找新的家园。他们推选的新领袖杨百翰召集了所有信徒，组成庞大的马车队，已经开始穿越俄勒冈小径出发。他们的最终目的地尚未确定。"
 usfp_mormon.3.f: "“我们将前往遥远的西部地区，在那里开启新的应许之地”"
 usfp_mormon.3.a: "永别了，摩门教徒"
 usfp_mormon.3.a.t: "所有[SCOPE.sState('illinois_scope').GetName]中的[SCOPE.sReligion('mormonism_scope').GetName][Concept('concept_pop', '$concept_pops$')]将启程前往未知之地"
 usfp_mormon.4.t: "新锡安"
 usfp_mormon.4.d: "我们获悉，摩门教已在[SCOPE.sState('utah_scope').GetStateRegion.GetName]建立殖民地，并组建了名为[SCOPE.sCountry('deseret_scope').GetName]的宗教政府。这些定居者似乎无意创建独立国家，而是打算继续留在[ROOT.GetCountry.GetName]的政治体系内。另有传言称，定居者已开始公开实行一夫多妻制，并将之作为其信仰的教义。"
 usfp_mormon.4.f: "“主说，'去那个山谷，你能找到的最好的地方就是那个地方。'”"
 usfp_mormon.4.a: "摩门教徒将确保[ROOT.GetCountry.GetName]对[SCOPE.sState('utah_scope').GetStateRegion.GetName]的控制。"
 usfp_mormon.4.b: "这些邪教徒选择了自我流放。"
 usfp_mormon.5.t: "德撒律州？"
 usfp_mormon.5.d: "[SCOPE.sCountry('deseret_scope').GetName]的摩门教徒已经起草了一部州宪法，并正在申请加入合众国。然而，其拟定的宪法对奴隶制问题未置一词，且[concept_usfp_congress]的部分议员对后期圣徒教会对地方政府的强势影响深表担忧。"
 usfp_mormon.5.d_noslavery: "[SCOPE.sCountry('deseret_scope').GetName]的摩门教徒已经起草了一部州宪法，并正在申请加入合众国。[concept_usfp_congress]的部分议员对后期圣徒教会对地方政府的强势影响深表担忧，讥讽摩门教徒虽无其名却行神权统治之实。"
 usfp_mormon.5.f: "\"因此，我们恳请贵方高瞻远瞩，慷慨考虑我们的利益。若符合联邦政府的宪法和惯例，我们祈盼您能批准我们的宪法，并准许德撒律州以平等地位加入联邦。倘若不能，我们也恳请您以您的智慧和宽宏之心，为德撒律人民授予其他适当形式的公民政府。\""
 usfp_mormon.5.a: "摩门教徒赢得了他们的州。"
 usfp_mormon.5.b: "不必操之过急，德撒律将重组为犹他领地。"
 usfp_mormon.5.c: "摩门教徒必须放弃一夫多妻制，这样我们才会与他们合作。"
 usfp_mormon.6.t: "一夫多妻制最后通牒"
 usfp_mormon.6.d: "[SCOPE.sCountry('usa_scope').GetName]要求我们停止一夫多妻制，然后他们才会考虑与我们进行正式谈判。"
 usfp_mormon.6.f: "“一夫多妻制不符合美国革命所开创的纯洁、自由、公正和安全的原则”"
 usfp_mormon.6.a: "我们必须接受妥协，别无选择。"
 usfp_mormon.6.b: "我们不能放弃神的旨意！"
 usfp_mormon.7.t: "摩门教徒拒绝"
 usfp_mormon.7.d: "[SCOPE.sCountry('deseret_scope').GetName]拒绝结束一夫多妻制，声称[ROOT.GetCountry.GetAdjective]的宗教自由原则应延伸至他们的宗教实践。"
 usfp_mormon.7.f: "“没有一夫多妻制，我们就不会升华，这是我们在天国中占据一席之地的关键所在。”"
 usfp_mormon.7.a: "这完全不可接受！"
 usfp_mormon.8.t: "摩门教徒接受"
 usfp_mormon.8.d: "[SCOPE.sCountry('deseret_scope').GetName]的摩门教徒已经正式终止了他们教会中的一夫多妻制，作为回应。"
 usfp_mormon.8.f: "“在所述期间，无论是我本人还是我的同仁对教会的教导中，都绝无任何可被合理解读为鼓励或倡导多妻制的内容。若有教会长老使用似乎传达此类教义的言辞，均已受到即时严厉的训诫。此刻，我郑重向公众宣告：我对末世圣徒的忠告是，务必恪守国法，切勿缔结任何触犯法律的婚姻。”"
 usfp_mormon.8.a: "这件事解决后，德撒律便将获准加入联邦。"
 usfp_mormon.8.b: "德撒律州将重组为犹他州"
 usfp_mormon.9.t: "野蛮主义遗毒的双胞胎"
 usfp_mormon.9.d: "[SCOPE.sReligion('mormonism_scope').GetName]的一夫多妻制习俗仍是[ROOT.GetCountry.GetAdjective]政治中的争议性问题。[SCOPE.sParty('republican_party_scope').GetName]公开将一夫多妻制与奴隶制相提并论，称其为“野蛮主义遗毒的双胞胎”，唯有道德低下者才会践行。"
 usfp_mormon.9.f: "“国会有权利也有义务在各领土上禁止一夫多妻制和奴隶制这两个野蛮残余。犹他州和南卡罗来纳州的这两种制度有许多相似之处，它们将成为自卫的共同事业。”"
 usfp_mormon.9.a: "这两种卑鄙的行径都属于垃圾堆！"
 usfp_mormon.9.b: "一个与另一个毫无关系！"
 usfp_mormon.10.t: "多配偶制的终结"
 usfp_mormon.10.d: "面对[ROOT.GetCountry.GetAdjective]社会和地方政府的无情反对，摩门教正式放弃了复数婚姻的做法，禁止在其成员中再发生这种结合。"
 usfp_mormon.10.f: "“在所述期间，无论是我本人还是我的同仁对教会的教导中，都绝无任何可被合理解读为鼓励或倡导多妻制的内容。若有教会长老使用似乎传达此类教义的言辞，均已受到即时严厉的训诫。此刻，我郑重向公众宣告：我对末世圣徒的忠告是，务必恪守国法，切勿缔结任何触犯法律的婚姻。”"
 usfp_mormon.10.a: "也许我们终于可以平息这个问题了。"
 usfp_mormon.11.t: "摩门教叛乱？"
 usfp_mormon.11.d: "几位被派往[SCOPE.sCountry('deseret_scope').GetName]的联邦官员已经返回，并带着针对[SCOPE.sCharacter('deseret_ruler_scope').GetFullName]在那里的严厉报告。这些官员声称摩门教徒一直藐视联邦法律，而只承认教会的权威。他们警告政府必须立即替换[SCOPE.sCharacter('deseret_ruler_scope').GetFullName]以防止出现全面的[SCOPE.sReligion('mormonism_scope').GetName]叛乱。"
 usfp_mormon.11.f: "这堆报告详细列出了许多官员对摩门教徒的指控。在这堆报道中谋杀、偷窃、欺诈，甚至叛国罪比比皆是，以至于还有异端指控。我们从华盛顿而来，很难区分真实问题和诽谤流言。"
 usfp_mormon.11.a: "联邦军队将控制领土并取代[SCOPE.sCharacter('deseret_ruler_scope').GetFullName]"
 usfp_mormon.11.b: "我们不会无礼到侵犯自己的领土。"
 usfp_mormon.12.t: "犹他州和平委员会"
 usfp_mormon.12.d: "[SCOPE.sCharacter('deseret_ruler_scope').GetFullName]将我们的行动视为摧毁摩门教会，打算在[SCOPE.sState('utah_scope').GetName]采取焦土政策。为了避免流血冲突，我们在该地区的专员促成了一项交易——以赦免所有涉案的摩门教徒，来换取[SCOPE.sCharacter('deseret_ruler_scope').GetFullName]的撤离和联邦军队的和平进入。"
 usfp_mormon.12.f: "“对于愿意恪守法律的犹他州居民，我们将宽宏大量，赦免其此前所犯的煽动叛乱和叛国罪行。然而，本公告发布后，仍执意反抗合众国者，须知：宽容已至极限，后果自负。”"
 usfp_mormon.12.a: "可接受的妥协方案。"
 usfp_mormon.12.b: "必须用武力镇压这些叛军。"
 usfp_mormon.13.t: "圣徒的命运"
 usfp_mormon.13.d: "随着[SCOPE.sState('utah_scope').GetName]已被我们牢牢掌控，[SCOPE.gsInterestGroup('ig_devout').GetName]内部掀起愤怒声浪，强烈要求将后期圣徒教会列为非法并彻底铲除。"
 usfp_mormon.13.f: "“美国没有能力摧毁这个民族，因为他们在上帝掌心，我们亦是，上帝会按照祂的意愿处置我们，上帝会保佑我们。”"
 usfp_mormon.13.a: "我们将尊重他们信奉宗教的权利。"
 usfp_mormon.13.b: "他们的“教会”不过是个蛊惑人心的邪教！"
 usfp_mormon.13.b.t: "圣徒们将转入地下，所有[SCOPE.sReligion('mormonism_scope').GetName][Concept('concept_pop', '$concept_pops$')]都将“皈依”[SCOPE.sReligion('protestantism_scope').GetName] 。"
 usfp_mormon.14.t: "[SCOPE.sReligion('mormonism_scope').GetName]射伤[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastNameNoFormatting]！"
 usfp_mormon.14.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]在[ROOT.GetCountry.GetCapital.GetCityHubName]街头遭到枪击！枪手在被逮捕后被确认为激进的[SCOPE.sReligion('mormonism_scope').GetName]教徒，目的是报复政府针对其教会的行动，目前[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已被送往医院，情况危急。"
 usfp_mormon.14.f: "“让开！让开！总统被枪杀！天啊！”"
 usfp_mormon.14.a: "这简直骇人听闻！"
 usfp_acw.11.t: "[SCOPE.sCountry('rio_grande_scope').GetAdjective]分离"
 usfp_acw.11.d: "利用内战的混乱局面，[SCOPE.sCountry('rio_grande_scope').GetName]的[SCOPE.sCulture('afro_american_culture').GetName]分离主义者成立了一个共和国，宣布在冲突中保持中立。"
 usfp_acw.11.f: "“这不是我们的战争！北方佬想把他们的法律强加给我们，现在他们却不能决定这些法律应该是什么了！”"
 usfp_acw.11.a: "我们必须接受现状"
 usfp_acw.11.b: "[SCOPE.sCountry('rio_grande_scope').GetName]非法。"
 usfp_acw.11.c: "他们是交战方，将受到相应的对待。"
 usfp_acw.13.t: "[SCOPE.sCountry('mexico_scope').GetName]叛乱"
 usfp_acw.13.d: "随着[ROOT.GetCountry.GetName]陷入混乱，[SCOPE.sCountry('mexico_scope').GetAdjective]民族主义者抓住机会，推翻了我们的统治，再次宣布独立。"
 usfp_acw.13.f: "“墨西哥民族曾遭意志扼杀、发声禁绝，今终将挣脱强加之压迫。”"
 usfp_acw.13.a: "我们不能阻止他们。"
 usfp_acw.13.b: "阻止他们！"
 usfp_manifest_destiny.24.t: "昭昭革命"
 usfp_manifest_destiny.24.d: "随着[ROOT.GetCountry.GetName]的政权已掌握在工人阶级手中，“昭昭天命”在这个国家的未来定位仍存在争议。我们必须直面深植于我们历史与文化中的殖民主义冲动——这究竟始终是资本主义的阴谋，抑或“昭昭天命”可以成为全世界无产者的战斗口号？"
 usfp_manifest_destiny.24.f: "“资本主义首先将工薪阶层打入赤贫的深渊，剥夺他们拥有家庭的权力；继而又迫使他们拿起武器谋生，入侵异国他乡，以完成所谓的'天命昭昭'。”"
 usfp_manifest_destiny.24.a: "我们的天命是世界革命！"
 usfp_manifest_destiny.24.b: "工人们不支持进一步征服。"
 usfp_manifest_destiny.24.c: "必须摒弃令人发指的“昭昭天命”帝国主义！"
 usfp_manifest_destiny.25.t: "皇家命运"
 usfp_manifest_destiny.25.d: "随着[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]的加冕，“天命之国”理论现在受到了质疑。如果没有一个伟大的共和国，扩张又有什么理由呢？"
 usfp_manifest_destiny.25.f: "“我们抛弃了上天赋予我们的天命，只为给自己的凯撒加冕。难道我们如此堕落，竟效仿旧世界那些摇摇欲坠的君主国，屈服于卑鄙的帝国主义？无顾先贤革命？”"
 usfp_manifest_destiny.25.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]将高举文明的火炬！"
 usfp_manifest_destiny.25.b: "昭昭天命不能与君主制共存。"
 usfp_manifest_destiny.26.t: "美利坚帝国？"
 usfp_manifest_destiny.26.d: "我国对[SCOPE.sState('usa_overseas_territory_scope').GetName]的兼并行为，引发了关于海外征服合法性的激烈论战。支持者声称，[ROOT.GetCountry.GetName]有义务向世界贫困民族传播文明，而反帝国主义者则讥讽现任政府与旧欧洲的暴君无异。"
 usfp_manifest_destiny.26.f: "“好一个文明强国，一手举着和平旗帜，一手拎着屠刀。难道被征服的民族除了接受征服者的文明，就没有其他救赎了吗？”"
 usfp_manifest_destiny.26.a: "我们有责任传播文明之光。"
usfp_manifest_destiny.27.t: "雨不会跟着犁"
usfp_manifest_destiny.27.d: "[SCOPE.sState('drought_state').GetStateRegion.GetStrategicRegion.GetName]长期以来一直被认为是“美国大沙漠”，不适合集约化农业。越来越多的定居者开始在草原上耕种，希望他们的活动能够真正改变当地的气候，使其对他们有利。随着[GetHarvestConditionType('drought').GetName]在[SCOPE.sState('drought_state').GetName]广泛使用，这让人很难相信"雨跟着犁走"."
usfp_manifest_destiny.27.f: ""上帝创造了犁。通过这一奇妙的规定，这是人类对自然的掌握，云层正在散发大量的雨水。犁是区分文明与野蛮的工具；把沙漠变成农场或花园."" #Charles Dana Wilber
usfp_manifest_destiny.27.a: "大自然是反复无常的."
usfp_manifest_destiny.27.b: "确保每个人都知道[SCOPE.sState('drought_state').GetStateRegion.GetStrategicRegion.GetName]还是一片沙漠."

usfp_manifest_destiny.28.t: "疯狂草原"
usfp_manifest_destiny.28.d: "许多定居者收到自由土地和新生活的承诺，被引诱到[SCOPE.sState('praire_state_1').GetStateRegion.GetStrategicRegion.GetName]。拓荒者发现了一个广阔而充满敌意的环境，在那里，他们摇摇欲坠的农舍独自抵御着草原的狂风，他们遭受着疾病、抑郁和精神错乱的折磨。"
usfp_manifest_destiny.28.f: ""在任何一个文明国家，耕种土地的人都没有像我们西北大草原的人们那样，如此糟糕地适应自然条件。这位欧洲农民住在一个村庄里，在那里可以享受到相当多的社会乐趣。草原上，没有树木的平原一直延伸到地平线，每个家庭都必须主要靠自己生活，而生活，被关在小木屋里，不可能很快乐. "" #E. V. Smalley, The Atlantic
usfp_manifest_destiny.28.a: "边境不适合胆小的人."
usfp_manifest_destiny.28.b: "现代疗法可以帮助他们应对." 
 usfp_usa.19.t: "打破先例"
 usfp_usa.19.f: "“没有国王，没有皇帝，没有第三个任期，这些醒目的大写字母在耸人听闻的杂志上映入眼帘。然而，无论是宪法、法律还是先贤们的教诲，都无法阻止人民按照自己的意愿实现第三个乃至第十个任期！”"
 usfp_usa.19.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]将不再寻求连任。"
 usfp_usa.19.b: "再来四年！"
 usfp_usa.19.c: "我敢打赌，任何混蛋都不可能在四年任期内把我弄出去！"
 usfp_usa.19.d: "[ROOT.GetCountry.GetRuler.GetLastName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]尚未确认或否认[ROOT.GetCountry.GetRuler.GetSheHe]是否会寻求第三个任期虽然没有禁止连任的规定，但乔治·华盛顿开创的先例已使第三次连任成为[ROOT.GetCountry.GetAdjective]政治禁忌。随着竞选活动的开始，[ROOT.GetCountry.GetRuler.GetFullName]必须做出决定。"
 usfp_usa.20.t: "权力分立"
 usfp_usa.20.d: "由于[ROOT.GetCountry.GetAdjective]行政部门的混乱，[concept_usfp_congress]被迫违反宪法，现在没有明显的机制来恢复正常，决定共和国未来结构的责任就落在了国会身上。"
 usfp_usa.20.f: "“《宪法》的原则是立法、行政和司法三权分立，具体情况除外。即使这一原则没有直接表述，但它显然是《宪法》的精神所在，联邦政府的每一位朋友都应如此评论并付诸行动”"
 usfp_usa.20.a: "我们必须恢复合法的联邦。"
 usfp_usa.20.b: "修宪让国会至高无上。"
 usfp_filibuster.1.t: "[SCOPE.sCharacter('william_walker_scope').GetLastName]远征"
 usfp_filibuster.1.d: "一队[ROOT.GetCountry.GetAdjective]冒险者在[SCOPE.sCharacter('william_walker_scope').GetFullName]的率领下已悍然入侵[SCOPE.sState('baja_scope').GetName]。他们宣布成立[SCOPE.sCountry('sonora_scope').GetName] 共和国，并寻求我们的承认。"
 usfp_filibuster.1.f: "\"在墨西哥统治下的领土注定永远蛮荒未开，寸草不生。其上居住的族群懒惰怠工，半开化的样貌令人唏嘘。当一方土地上的居民几乎完全无力开发上天赐予他们的自然资源时，文明就要求其他人挺身而出，接管这片土地。\""
 usfp_filibuster.1.a: "这些冒险家是我国的奇耻大辱。"
 usfp_filibuster.1.b: "让我们拭目以待。"
 usfp_filibuster.1.c: "我们将捍卫独立的[SCOPE.sCountry('sonora_scope').GetName]共和国！"
 usfp_filibuster.2.t: "美国冒险家入侵[SCOPE.sState('baja_scope').GetName]"
 usfp_filibuster.2.d: "一队[SCOPE.sCountry('usa_scope').GetAdjective]冒险者在[SCOPE.sCharacter('william_walker_scope').GetFullName]指挥下占领了[SCOPE.sState('baja_scope').GetName]，并非法宣布成立[SCOPE.sCountry('sonora_scope').GetName]共和国。"
 usfp_filibuster.2.f: "\"在墨西哥统治下的领土注定永远蛮荒未开，寸草不生。其上居住的族群懒惰怠工，半开化的样貌令人唏嘘。当一方土地上的居民几乎完全无力开发上天赐予他们的自然资源时，文明就要求其他人挺身而出，接管这片土地。\""
 usfp_filibuster.2.a: "拿起武器！"
 usfp_filibuster.3.t: "沃克受审"
 usfp_filibuster.3.d: "威廉·沃克未经政府批准的冒险远征彻底失败，他和同伙因发动非法战争而被提起公诉。鉴于他在[SCOPE.sCountry('california_scope').GetName]的行动得到了民众的广泛支持，陪审团很有可能做出无罪判决，让沃克逃脱法律制裁。"
 usfp_filibuster.3.f: "“请注意，起诉书援引的法律条文，正是依据宪法中授予国会权力的条款而制定，而该条款旨在赋予国会界定违反国际法罪行的权力。因此，我们可以得出如下推论：倘若我并未触犯任何违反国际法的罪名，那么，此刻站在你们面前，乃是无罪之身，正直而无辜。”"
 usfp_filibuster.3.a: "象征性的处罚就足够了。"
 usfp_filibuster.3.a.t: "威廉·沃克可能会继续他的冒险活动……"
 usfp_filibuster.3.b: "必须把这些劫掠者关起来。"
 usfp_filibuster.4.t: "[SCOPE.sCountry('sonora_scope').GetName]共和国"
 usfp_filibuster.4.d: "随着[SCOPE.sCharacter('william_walker_scope').GetFullName]的成功远征，[SCOPE.sCountry('sonora_scope').GetName]共和国正在申请加入[ROOT.GetCountry.GetName]。"
 usfp_filibuster.4.f: "“文明属于白人？——敢问何等‘文明’，又堪存几时？”"
 usfp_filibuster.4.a: "我们将吞并这片领土"
 usfp_filibuster.4.b: "[SCOPE.sCharacter('william_walker_scope').GetFullName]将被授予该领地的总督职位。"
 usfp_filibuster.4.c: "我们不会与这些冒险家为伍。"
 usfp_reconstruction.11.t: "魔鬼交易"
 usfp_reconstruction.11.d: "南方各州策划了一项计划，要对即将到来的选举结果提出质疑，阻止合法当选的总统上台。通过幕后渠道，南方正试图要挟联邦政府，要么现在结束重建，要么选举将陷入困境。"
 usfp_reconstruction.11.f: "这个计划既简单又完全合法。南方几个重要州的州议会将被阻止为本州的总统选举人颁发证书。没有他们的存在，联邦政府将不得不另辟蹊径，继续进行选举，否则整个选举制度将陷入停顿，除非南方的要求得到满足。"
 usfp_reconstruction.11.a: "必须确保选举安全。"
 usfp_reconstruction.11.b: "我们不会被奴隶主的威胁所动摇。"
 usfp_reconstruction.12.t: "[SCOPE.gsInterestGroup('pb_ig').GetName]坚决反对重建！"
 usfp_reconstruction.12.d: "虽然[SCOPE.gsInterestGroup('pb_ig').GetName]在很大程度上一直是[SCOPE.sParty('republican_party_scope').GetName]坚实的支持基础，但许多[SCOPE.gsInterestGroup('pb_ig').GetName]成员却对政府激进的重建政策感到十分不安。中产阶级并不欢迎彻底的种族融合，他们开始强烈反对政府对待南方自由民的处理方式，认为这是不当之举。"
 usfp_reconstruction.12.f: "“步子太大，节奏太快。”这就是议员们听到的民意。诚然，奴隶制是一个亟需根除的深重道德罪恶，但如今战争已经结束，我们难道不应与南方高贵的白人携手和解吗？反重建派描绘出了一幅令人不寒而栗的图景：北方将一个有色人种当政的政权强加于南方，以此惩罚他们。这是许多白人温和派无法容忍的局面。"
 usfp_reconstruction.12.a: "重建工作务必全面而彻底。"
 usfp_reconstruction.12.b: "我们不能疏远自己的基本盘。"
 usfp_reconstruction.13.t: "白人政纲"
 usfp_reconstruction.13.d: "重建的反对派针对[SCOPE.sParty('republican_party_scope').GetName]，在白人选民中煽动种族敌意，发动了一场声势浩大的宣传攻势。如果这些宣传单可信的话，那么[SCOPE.sParty('republican_party_scope').GetName]就是一个完全由[SCOPE.sCulture('afro_american_culture').GetName]把持，并且只为他们谋利益的政府。不幸的是，这一论调在选民中引发了强烈共鸣。"
 usfp_reconstruction.13.f: "我们的格言：\n\n白人的国家；由白人统治！"
 usfp_reconstruction.13.a: "几张传单不会改变我们的基调。"
 usfp_reconstruction.13.b: "我们需要一些新的宣传。"
 usfp_reconstruction.14.t: "[SCOPE.sCharacter('assassination_target').GetFullName]中枪！"
 usfp_reconstruction.14.d: "[SCOPE.sCharacter('assassination_target').GetFullName]和[SCOPE.sCharacter('assassination_target').GetHerHis]的几名随员遭到了一名[SCOPE.sCulture('dixie_culture').GetName]激进分子的枪击！袭击者在逃跑前公然宣称反对重建，但很快就被逮捕。[SCOPE.sCharacter('assassination_target').GetFullName]已被紧急送医，情况危急。"
 usfp_reconstruction.14.f: "“一个身穿大衣的男人猛然从门外闯入。我只听见他吼了一声‘混蛋！’，随即枪声响起，一切都乱了套。空气中弥漫着血腥味和火药味。有人惊恐地寻找掩护，有人下意识扑向枪手。那几位大人物倒在地上呻吟着，他们的外套已被鲜血浸透。”"
 usfp_reconstruction.14.a: "暴力无法阻止正义！"
 usfp_reconstruction.14.b: "也许我们应该自求多福。"
 georgists_can_spawn: "[SCOPE.sIdeology('georgism_scope').GetName]角色不再出现"
 georgists_can_spawn_double: "[SCOPE.sIdeology('georgism_scope').GetName]角色更有可能出现在我国"
 usfp_usa.19.e: "我们不应中途放弃！"
 usfp_usa.21.t: "第一[SCOPE.sCulture('afro_american_scope').GetName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]"
 usfp_usa.21.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]的就职是[ROOT.GetCountry.GetName]的历史性时刻。不到一个世纪前，[SCOPE.sCulture('afro_american_scope').GetName]人民还在遭受奴役，而现在，他们中的一员已经当选为国家最高职位！ 全国各地的[SCOPE.sCulture('afro_american_scope').GetName]公民都在庆祝这一重大时刻，而而美国白人群体仍震惊不已。"
 usfp_usa.21.f: "“今天是公认的好时机，而不是明天，只有今天，我们才能完成最好的工作，而不是未来的某一天或未来的某一年。只有今天，我们才能为明天的更大作为做好准备。今天是播种的时间，现在是工作的时间，明天是收获的时间”"
 usfp_usa.21.a: "自由的代价低于镇压的代价。"
 usfp_usa.22.t: "百年世博会"
 usfp_usa.22.d: "今年是《独立宣言》签署100周年，是[ROOT.GetCountry.GetName]诞生之年。为庆祝这一时刻，[SCOPE.sState('pennsylvania_scope').GetCityHubName]举办了盛大的博览会，有数十个景点和[ROOT.GetCountry.GetAdjective]文化与发明展示。"
 usfp_usa.22.f: "人群熙熙攘攘地穿行在为世博会的街道上，经过各种奇迹的展馆。夕阳西下，家家户户聚集在草地上观看盛大的烟花表演，红、白、蓝三色的烟花将整个城市照耀得璀璨夺目。"
 usfp_usa.22.a: "为下个百年干杯"
 usfp_usa_labor.3.t: "劳工骑士团"
 usfp_usa_labor.3.d: "一个自称“劳工骑士团”的劳工社团在[ROOT.GetCountry.GetName]各地大受欢迎，吸引了大批工人。虽然缺乏组织和资金，但骑士团的地方分会已经开始为其成员争取更好的工作条件和工资。"
 usfp_usa_labor.3.f: "“工人们所具备的一个成功因素就是人数众多；但是只有当群众组织起来并为知识所指导时，人数众多才能起决定胜负的作用。过去的经验证明：忽视在各国工人间应当存在的兄弟团结，忽视那应该鼓励他们在解放斗争中坚定地并肩作战的兄弟团结，就会使他们受到惩罚，——使他们分散的努力遭到共同的失败。”"
 usfp_usa_labor.3.a: "劳动者理应得到应有的报酬。"
 usfp_usa_labor.3.b: "我们不会与这些煽动者合作。"
 usfp_usa_labor.3.c: "我们欢迎他们为[ROOT.GetCountry.GetAdjective]工人所做的努力。"
 usfp_usa_labor.4.t: "铁路大罢工"
 usfp_usa_labor.4.d: "为抗议减薪，[SCOPE.sState('strike_start_scope').GetName]的[SCOPE.sBuilding('railway_scope').GetName]工人举行了罢工，导致沿线车站全部关闭。自发的效仿性罢工迅速蔓延至邻近数州，使整个区域的铁路交通陷入瘫痪。地方民兵和私人保安与工人爆发激烈枪战，但终究无济于事。"
 usfp_usa_labor.4.f: "“据说有几名中弹严重的罢工者被送回家，直到晚上也无法得知他们的下落。10点钟，调解室遭到枪击，车库也被严重烧毁，一直烧到巴雷街。”"
 usfp_usa_labor.4.a: "我们需要尝试与罢工者进行谈判。"
 usfp_usa_labor.4.b: "这应由铁路部门自行处理。"
 usfp_usa_labor.4.c: "派兵镇压！"
 usfp_usa_labor.4.e: "成立一个委员会，听取罢工者的要求。"
 usfp_usa_labor.5.t: "美国劳工联合会"
 usfp_usa_labor.5.d: "一个新的劳工组织脱离了劳动骑士团，在[ROOT.GetCountry.GetName]中崭露头角——美国劳工联合会。美国劳工联合会采取“商业工会主义”战略，试图与管理层合作协调工会活动，蔑视更激进的劳工运动。"
 usfp_usa_labor.5.f: "“工人要自由，就必须有选择权。拥有选择权，他们就可以掌握决定在何种条件下工作。”"
 usfp_usa_labor.5.a: "我们可以与美国劳工联盟合作。"
 usfp_usa_labor.5.b: "所有工会都是对经济的威胁。"
 usfp_usa_labor.5.c: "美国劳工联盟试图出卖工人！"
 usfp_usa_labor.6.t: "《回顾》"
 usfp_usa_labor.6.d: "爱德华·贝拉米新近出版的一本乌托邦小说描绘了一个未来的[ROOT.GetCountry.GetName]，在那里，经济已经国有化，所有的社会弊病都已治愈。在这一愿景的鼓舞下，全国各地涌现出一百多个所谓的“民族主义俱乐部”，倡导经济社会化。"
 usfp_usa_labor.6.f: "“他们的悲惨遭遇和你们其他所有的悲惨遭遇一样，都源于社会制度所建立的个人主义所导致的合作无能，源于你们无法认识到，与同胞团结起来比与他们争斗所能获得的利益要多十倍。”"
 usfp_usa_labor.6.a: "一个令人振奋的乌托邦愿景"
 usfp_usa_labor.6.b: "真是一个疯狂的社会主义幻想……"
 usfp_gilded_age.1.t: "今天的故事"
 usfp_gilded_age.1.d: "新铁路、新工业和新公司在[ROOT.GetCountry.GetName]各地蓬勃发展，使[SCOPE.gsInterestGroup('industrialists_scope').GetName]的地位如日中天。[concept_upper_strata]日益膨胀的财富不仅催生了奢侈无度的生活方式，更在各个层级的政府机构中掀起了系统性政治腐败的浪潮。"
 usfp_gilded_age.1.f: "“对于年轻的美国人来说，无论是在这里还是在其他地方，通往财富的道路数不胜数，空气中弥漫着财富气息，成功就前放！”"
 usfp_gilded_age.1.a: "为我们的繁荣干杯。"
 usfp_gilded_age.2.t: "贪腐行径"
 usfp_gilded_age.2.d: "媒体曝光了一起围绕政府铁路合同的重大腐败丑闻，少数特权参与者通过暗箱操作，大肆侵吞国家财政资金。据调查，[SCOPE.sParty('scandal_party').GetName]内十余名要员涉案，在为欺诈行为提供便利的同时暗中分赃。反对党要求启动全面调查并对所有涉案人员予以公开谴责。"
 usfp_gilded_age.2.f: "“巨额贿赂！\n\n抢劫人民的国会议员，现在又支持国家强盗！\n\n国会各委员会主席收受了巨额财物！”"
 usfp_gilded_age.2.a: "进行象征性调查。"
 usfp_gilded_age.2.b: "我们需要谨慎地采取行动"
 usfp_gilded_age.2.c: "否认一切！"
 usfp_gilded_age.2.e: "停止这种错误信息的传播。"
 usfp_gilded_age.3.t: "邮件欺诈"
 usfp_gilded_age.3.d: "一起腐败集团案被曝光，该团伙利用虚假的美国邮政合同，将国库资金非法转移数百万至勾结的参议员及官员手中。全国各大报纸已经开始在头版头条刊登这一丑闻，[concept_usfp_congress]也要求对此事进行彻查。"
 usfp_gilded_age.3.f: "“所有报纸都在报道邮件欺诈漫画。在无能的国会袖手旁观的情况下，参与其中的人偷走了国库资金。漫画绘声绘色，让嘲讽效果拉满了。”"
 usfp_gilded_age.3.a: "这不能再继续下去了。"
 usfp_gilded_age.3.b: "淡化此问题。"
 usfp_gilded_age.4.t: "社会达尔文主义"
 usfp_gilded_age.4.d: "达尔文的进化论描述了一个物种必须不断为生存而斗争的世界。现在，一些理论家开始将这些思想从生物学引入政治学，将“适者生存”作为自然和正确的社会模式加以推广。"
 usfp_gilded_age.4.f: "“在自然法则面前，人并不比响尾蛇有更多的生命权，人并不比任何野兽有更多的自由权，人追求幸福的权利不过是维持生存斗争的许可而已！”"
 usfp_gilded_age.4.a: "达尔文不是这个意思……"
 usfp_gilded_age.4.b: "生命就是一场角逐。"
 social_darwinism_unlocked: "[SCOPE.sIdeology('social_darwinism_scope').GetName]角色不再出现"
 social_darwinism_promoted: "[SCOPE.sIdeology('social_darwinism_scope').GetName]角色更有可能出现在我国"
 social_darwinist_appears: "[SCOPE.sIdeology('social_darwinism_scope').GetName][concept_agitator]将会出现在[SCOPE.sCountry('usa_scope').GetName]"
 usfp_gilded_age.5.t: "特威德政权"
 usfp_gilded_age.5.d: "随着[concept_usfp_political_machines]在全国范围扎根蔓延，[SCOPE.sState('new_york_scope').GetName]已彻底沦为“老板”威廉·特威德及其坦慕尼协会的私产。通过在办公室安插亲信、购买选票和贿赂法官，州政府的整个机构现在都听命于他。特威德贪腐黑幕的细节已开始向媒体泄露，激起公众要求其下台的强烈呼声。"
 usfp_gilded_age.5.f: "媒体称特威德的手下为“四十大盗”，他们从国家预算中尽可能多地窃取资金。价值五倍、十倍、数百倍的虚假合同被派发出去，以换取支持。这项行动并不是特别隐蔽，但坦慕尼协会控制着所有政府机器，因此可以简单地阻止任何投诉或调查。"
 usfp_gilded_age.5.a: "特威德必须滚蛋"
 usfp_gilded_age.5.b: "[SCOPE.sState('new_york_scope').GetName]在特威德手下似乎运行正常。"
 usfp_gilded_age.6.t: "《财富的福音》"
 usfp_gilded_age.6.d: "富裕的实业家[SCOPE.sCharacter('carnegie_scope').GetFullName]撰写了一篇颇具争议的文章，声称新富阶层有责任为社会其他人提供慈善服务。[SCOPE.sCharacter('carnegie_scope').GetLastName]认为，富人应该摒弃奢侈和自我放纵的消费方式，而做好慈善，利用财富为穷人提供自我提升的机会。"
 usfp_gilded_age.6.f: "“这就是富人的责任！首先，富人要以身作则，谦虚谨慎地生活， 然后将所有剩余的收入视为信托基金，并严格履行职责，以最有利于社会的方式进行管理。让富人成为穷人的唯一代理人和受托人，以智慧、经验和管理能力为他们服务，为他们做的比他们自己会做或能做的还要好！”"
 usfp_gilded_age.6.a: "建图书馆胜过开派对。"
 usfp_gilded_age.6.b: "他只是想为他的商业行为忏悔！"
 usfp_gilded_age.6.c: "为什么穷人值得拥有什么东西？"
 usfp_gilded_age.7.t: "阳光普照之州"
 usfp_gilded_age.7.d: "“华盛顿脐橙”的引入让[SCOPE.sState('california_scope').GetName]南部的柑橘产业蓬勃发展。宽广的橘园沿着专为此修建的崭新铁路而种，一望无际。当地的推广者和铁路公司在全国范围内发起了一场广告宣传，鼓动人们移居这片乐土，许诺他们健康、富足和无尽的阳光。"
 usfp_gilded_age.7.f: "“这里就是我们自己的地中海！这里就是我们自己的意大利！这是一个没有沼泽、没有疟疾的地中海……这是一个气候更加宜人的地中海，冬日暖阳轻抚，夏日清风怡人……\n\n不远的将来，美利坚的这处角落定能年年丰收，源源不断地盛产各种水果和坚果。而在过去的千年里，欧洲的文明世界只能指望地中海地区供应这些果品。”"
 usfp_gilded_age.7.a: "味美利润高！"
 usfp_gilded_age.7.b: "它们既然叫“华盛顿”脐橙，那也理应在[SCOPE.sStateRegion('washington_region_scope').GetName]种植啊！"
 usfp_gilded_age.8.t: "格兰杰的礼物"
 usfp_gilded_age.8.d: "一个名为“格兰杰”的农民权益团体遍布[ROOT.GetCountry.GetName]的广大农村地区。虽然大多数分会都专注于地方立法和建立消费者合作社，但该组织也在全国范围内推动[SCOPE.gsInterestGroup('rural_folk_ig').GetName]的事业。"
 usfp_gilded_age.8.f: "“格兰杰是自私自利的组织！农民的习惯是只考虑自己，而不关心他人。而格兰杰组织教会他们，他们的利益与组织利益是一致的，他必须像考虑自己一样考虑他人。”"
 usfp_gilded_age.8.a: "农民富则国家富。"
 usfp_gilded_age.8.b: "这是一个激进煽动者网络！"
 usfp_gilded_age.8.c: "也许可以唤醒农民的阶级利益。"
 usfp_gilded_age.9.t: "青年詹姆斯帮来袭！"
 usfp_gilded_age.9.d: "臭名昭著的青年詹姆斯帮再次抢劫了银行，这次是在[SCOPE.sState('minnesota_scope').GetName]。面对当地民兵的围追堵截，青年詹姆斯帮被迫展开枪战，然后逃往郊外。官方对该帮派的头目、传奇逃犯杰西·詹姆斯进行了重金悬赏，试图一劳永逸解决他们。"
 usfp_gilded_age.9.f: "一声“拿起枪，伙计们，他们在抢银行！” 之后一切都乱套了，子弹到处乱飞，骑手们拿着左轮手枪疯狂扫射，但很快，这些亡命之徒就飞奔而去了。"
 usfp_gilded_age.9.a: "但愿这是最后一次。"
 usfp_gilded_age.9.b: "杰西·詹姆斯该滚去监狱！"
 usfp_gilded_age.10.t: "杰西·詹姆斯被关押"
 usfp_gilded_age.10.d: "得益于一位与杰西·詹姆斯熟识的亲密伙伴的密切配合，我们的警察终于成功地将这位臭名昭著的匪徒逮捕归案。杰西·詹姆斯被警卫严密押送至监狱，等待他的将是正义的审判。他和他的帮派因一系列公然的罪行而面临多项指控。"
 usfp_gilded_age.10.f: "“两侧各有八名警官将詹姆斯与人群隔开。数百人涌来目睹这位亡命之徒的命运,有人高呼支持,有人则发出嘘声。很难分辨他们是在嘘警察还是囚犯。大多数围观者只是为了一睹这场盛况,亲眼见证声名狼藉的歹徒杰西·詹姆斯最终落网的一刻。”"
 usfp_gilded_age.10.a: "大快人心！"
 jesse_james_bounty: "#italic 我们支付赏金：#!"
 usfp_gilded_age.11.t: "杰西·詹姆斯被枪杀！"
 usfp_gilded_age.11.d: "杰西·詹姆斯，这位臭名昭著的法外狂徒，被他的一名同伙枪杀了！这则令人震惊的消息迅速在全国范围内引起巨大轰动，许多人称赞他是现代罗宾汉和美国白人的守护者，而更多的人为这位凶手终于“尘埃落定”而庆祝。"
 usfp_gilded_age.11.f: "“今晨，一则震撼消息在本市引发轩然大波：臭名昭著的匪徒、火车劫匪杰西·詹姆斯在此被枪杀身亡。这一消息如野火般迅速蔓延，但多数人起初将信将疑，直到调查确认了这一无可争议的事实。随后，人群蜂拥而至，涌向城市中枪击事件发生的区域，迫切想一睹这位亡命之徒的遗体。”"
 usfp_gilded_age.11.a: "以枪而生，因枪而死。"
 usfp_gilded_age.12.t: "[SCOPE.sState('corruption_state').GetName]中的腐败交易"
 usfp_gilded_age.12.d: "为[SCOPE.gsInterestGroup('industrialists_scope').GetName]利益服务的[Concept('concept_usfp_political_machines', '$concept_usfp_political_machine$')]已经控制了[SCOPE.sState('corruption_state').GetName]。法院、立法和官僚机构中的所有反对派都被排挤出局，任由腐败横行。"
 usfp_gilded_age.12.f: "“有人说我是大老板，但我告诉你，你所要做的就是交朋友，然后为别人做事，这样别人也会为你做事……记住你不能强迫别人为你做事，你不能让他们投给你，而我这辈子从没胁迫过任何人，老话说得好，蛮人命不长。”"
 usfp_gilded_age.12.a: "[SCOPE.sState('corruption_state').GetName]需要自行解决。"
 usfp_gilded_age.12.b: "我们需要停止这种事！"
 usfp_gilded_age.12.c: "只要我们能分到钱……"
 usfp_gilded_age.13.t: "铁龙翔天，铁龙沉渊"
 usfp_gilded_age.13.d: "在[SCOPE.sState('railway_bust_state').GetName]，地产投机和经营不善已经导致当地几家铁路公司破产倒闭，线路也随之被遗弃闲置。而与此同时，[SCOPE.sState('railway_boom_state').GetName]的铁路行业蒸蒸日上，已经进入高速增长期和高投资回报期。"
 usfp_gilded_age.13.f: "该段铁轨已完成一半，施工现场到处散落着工具和材料。甚至还有几辆轨道车停在铁轨上，只因为公司倒闭了，没有人有兴趣收购，于是这些工业的残渣就这样被遗弃了。"
 usfp_gilded_age.13.a: "这是自然的商业周期。"
 usfp_gilded_age.13.b: "我们应该更进一步地发展那些已经取得成功的铁路产业。"
 usfp_gilded_age.14.t: "新贵"
 usfp_gilded_age.14.d: "工业在全国范围内的扩张，造就了一批新的富豪，这些[SCOPE.gsInterestGroup('industrialists_scope').GetName]的财富超过了老牌家族。许多人涌入[SCOPE.sState('new_york_scope').GetName]，建造精致的豪宅，试图融入上流社会，这让老钱贵族十分懊恼。"
 usfp_gilded_age.14.f: "“她的嗓音轻浮，”我说道。“它充满了——”我犹豫了。\n\n“她的声音里充满了金钱，”他突然开口。\n\n的确如此。我以前从来不明白。它充满了金钱——那是它起伏不定的无穷魅力，它的叮当声，它的铙钹之歌。"
 usfp_gilded_age.14.a: "老钱终将让位于新贵。"
 usfp_gilded_age.14.b: "为我们冉冉升起的工业领袖干杯！"
 usfp_gilded_age.15.t: "[SCOPE.sState('monopoly_state').GetName][SCOPE.sBuilding('monopoly_building_scope').GetName]垄断"
 usfp_gilded_age.15.d: "[SCOPE.sState('monopoly_state').GetName]的[SCOPE.sBuilding('monopoly_building_scope').GetName]行业已被某企业集团垄断，该集团通过排挤所有竞争对手掌控了市场。凭借其支配地位，他们开始推行抬高价格、压低工资、恶化劳动条件等举措，对当地经济造成了全方位的负面影响。"
 usfp_gilded_age.15.f: "在这座城市里，走过两个街区就能看到该公司的广告或商标。昨天，一大批工人被解雇了，现在许多人正在收拾行李，准备搬到另一个州去，公司是城里唯一标准。"
 usfp_gilded_age.15.a: "市场永远是对的。"
 usfp_gilded_age.15.b: "我们应该在[SCOPE.sState('monopoly_state').GetName]中促进竞争。"
 usfp_progressive_era.1.t: "进步派崛起"
 usfp_progressive_era.1.d: "[ROOT.GetCountry.GetName]的社会和经济状况引发了社会各阶层的改革呼声，甚至这些阶层组成了[SCOPE.sIdeology('progressive_ideology').GetName]，地方州甚至联邦官员都在以改革和提高公众福利为纲领赢得选举。"
 usfp_progressive_era.1.f: "“我们的工业组织控制着政治、政府和国家资源；它们管理会议、制定纲领、支配立法；他们通过傀儡进行统治。战斗才刚刚开始！这将是有史以来最漫长、最艰苦的斗争！在其他国家，人民输了！而在这里，我们必将获胜！”"
 usfp_progressive_era.1.a: "为了公平！"
 usfp_progressive_era.1.b: "这些共产主义者会把国家搞得四分五裂！"
 progressives_can_spawn: "[SCOPE.sIdeology('progressive_ideology').GetName]角色不再出现"
 usfp_progressive_era.2.t: "科学管理"
 usfp_progressive_era.2.d: "一种新的工业管理理论在[SCOPE.gsInterestGroup('industrialists_scope').GetName]和[SCOPE.gsInterestGroup('intelligentsia_scope').GetName]中崭露头角。这一科学管理的新兴学科旨在为任何特定任务确定客观最优方法，并通过管理层对工人的严格监督加以实施。"
 usfp_progressive_era.2.f: "“在合格的教师指导下训练工人养成新的工作习惯，直到他不断且有习惯地按照科学规律工作，这种想法与每个工人都能最好地调节自己的工作方式的旧思想直接对立。旧的管理哲学将全部责任推给工人，而新的管理哲学则将很大一部分责任推给管理者。”"
 usfp_progressive_era.2.a: "[SCOPE.gsInterestGroup('industrialists_scope').GetName]将确保最高效率！"
 usfp_progressive_era.2.b: "我们尊敬的[SCOPE.gsInterestGroup('intelligentsia_scope').GetName]将引领前沿！"
 usfp_progressive_era.2.c: "老板们的微观管理已经太多了。"
 usfp_progressive_era.3.t: "美利坚反帝国主义联盟"
 usfp_progressive_era.3.d: "一个名为\"反帝联盟\"的政治组织已经成立，旨在反对[ROOT.GetCountry.GetAdjective]的军事扩张主义。虽然该组织规模不大，但许多著名作家和政治家都表示支持，他们呼吁在对外政策上保持克制。"
 usfp_progressive_era.3.f: "“这些政策将为创建和维持庞大的军队提供借口，而且对许多人来说，这也是一个合理的理由，无论这个国家被称为合众国还是帝国。专制主义是陆军和海军的必要条件，而在这样的学校里，从这样的训练中，我们还能指望保留合众国体制的思想和做法吗？”"
 usfp_progressive_era.3.a: "我们必须维护和平，以维护合众国。"
 usfp_progressive_era.3.b: "懦夫！"
 usfp_progressive_era.3.c: "[SCOPE.gsInterestGroup('pacifist_ig').GetName]站在联盟一边。"
 usfp_progressive_era.4.t: "世界宗教大会"
 usfp_progressive_era.4.d: "近日，在[SCOPE.sState('illinois_scope').GetCityHubName]举办的一场创新性跨宗教集会中，来自不同信仰的宗教领袖齐聚一堂，其中不乏[ROOT.GetCountry.GetAdjective]普通民众鲜少接触的外国信仰团体的代表。印度教僧侣[SCOPE.sCharacter('vivekananda_scope').GetFullName]发表了关于“各宗教间普世兄弟情谊”的激情演说，其主张迅速引发轰动，不仅使其成为媒体焦点，更收到来自全美各地的演讲邀约。"
 usfp_progressive_era.4.f: "“我将向各位弟兄引述一首赞美诗中的诗句，我记得我从孩提时代起就一直在重复这首赞美诗，千百万人每天都在重复这首赞美诗：正如不同的溪流在不同的地方发源，它们的水都汇入大海，主啊，人们通过不同的方式所走的不同的道路，尽管它们看起来各不相同，或弯曲或笔直，但都通向你。”"
 usfp_progressive_era.4.a: "一位真正的虔诚演讲者。"
 usfp_progressive_era.4.a.t: "[SCOPE.sCharacter('vivekananda_scope').GetFullName]将在几年后前往印度。"
 usfp_progressive_era.4.b: "异教会玷污我们高尚的品德。"
 usfp_progressive_era.5.t: "优生学的兴起"
 usfp_progressive_era.5.d: "在部分[ROOT.GetCountry.GetAdjective]知识分子和专业人士中兴起了一种解决社会问题的奇特方案——优生学，即对人类进行选择性培育。支持者声称犯罪与违法行为的根源在于缺乏生育计划，而显而易见的解决方案，就是限制社会中那些所谓\"有缺陷\"成员的生育权利"
 usfp_progressive_era.5.f: "“那些身负重担的人不应繁衍后代。如果我们仅仅让身心残疾者繁衍，而健康的群体却因为需要照顾他人而不得不限制生育；如果自然选择被普遍抑制，那么除非采取新的措施，否则我们的种族将迅速走向衰败。”"
 usfp_progressive_era.5.a: "这不过是歧视他人的借口罢了。"
 usfp_progressive_era.5.b: "这样做，真的可以改善人口质量吗？"
 usfp_progressive_era.5.c: "是的，[SCOPE.gsInterestGroup('eugenicist_ig').GetName]是优质健康家庭的代表！"
 usfp_progressive_era.6.t: "城市美化运动"
 usfp_progressive_era.6.d: "新一代的[ROOT.GetCountry.GetAdjective]建筑师和城市规划者采纳了一种名为“城市美化”的理念，旨在通过宏伟的地标建筑和开放式绿地项目提升城市品质。这些新设计不仅将美化我们的[SCOPE.sBuilding('urban_center_scope').GetName]，据称还能培育公民道德并提升生活质量。目前已提出按照这一模式翻新[SCOPE.sState('dc_scope').GetCityHubName]的宏伟计划，旨在为全国树立典范模板。"
 usfp_progressive_era.6.f: "该计划旨在将华盛顿重塑为一个宏伟都市，这也是它一直以来的目标。一个两旁种满榆树的开放大广场将成为城市的新核心，两侧是政府大楼和博物馆。华盛顿纪念耸立在这一切的中心，成为首都的象征。"
 usfp_progressive_era.6.a: "如果能进行一些改造，我们受到赞赏。"
 usfp_progressive_era.6.b: "这一切听起来都相当浪费。"
 usfp_progressive_era.7.t: "公共卫生运动"
 usfp_progressive_era.7.d: "情色交易、性病等，这些有悖健康生活的不良事物，已经逐渐成为[ROOT.GetCountry.GetName]的代名词，而这些问题往往却被社会的“体面”所掩盖和忽视。现在，一场新的“社会公共卫生”改革运动正在如火如荼地展开。他们试图通过禁止情色交易、科普卫生健康教育、培养青少年形成良好的道德观等措施，为病入膏肓的[ROOT.GetCountry.GetName]提供除灶良方。"
 usfp_progressive_era.7.f: "“设想一下，如果我们正目睹一条毒蛇正悄然接近一位毫无戒备的路人，难道我们会因为不愿让受害者知晓其存在而选择沉默不语吗？当然不可能！然而，现实却充满讽刺，我们默许了这种悲剧的发生——无辜的女孩由于无知而付出了生命的代价。这一切仅仅是因为虚伪的文明道德教育她们，性病是禁忌，不得知晓、不得宣读、不得直视。”"
 usfp_progressive_era.7.a: "健康是一种美德。"
 usfp_progressive_era.7.b: "多么不合时宜。"
 usfp_progressive_era.8.t: "妇女俱乐部"
 usfp_progressive_era.8.d: "整个[ROOT.GetCountry.GetName]的中产阶级妇女都开始支持[SCOPE.sLaw('womens_suffrage_law').GetName]事业，成立各种俱乐部和社交团体来倡导自身权利。[SCOPE.sCharacter('jane_addams_scope').GetFullName]为代表的社会活动家们提出，女性权利应是其家庭职责的延伸——她们不仅要照顾自己的家庭，还要以“社会大家长”的身份关心全社会的福祉。"
 usfp_progressive_era.8.f: "\"在社会工作中不得不停下来，意识到在获得选票之前无法通过重要的措施，这令人沮丧。我们不得不发起游行、举行集会，甚至采取极端行动才能争取选票。当人们明白，只有通过男女共同参与政府，才能确保和维护国家的最高利益时，我相信选举权会以令我们惊讶于其速度迅速来到我们手中。\""
 usfp_progressive_era.8.a: "妇女理应获得投票权。"
 usfp_progressive_era.8.b: "投票会玷污女性纯洁的双手。"
 usfp_progressive_era.9.t: "[SCOPE.sState('initiative_state_scope').GetName]采用提议"
 usfp_progressive_era.9.d: "为了将民主权力直接赋予公民，[SCOPE.sState('initiative_state_scope').GetName]州政府采用了直接投票倡议制度。如今，获得地方广泛支持的政策可绕过政党和政治机器，从而对根深蒂固的利益集团形成制衡。"
 usfp_progressive_era.9.f: "“民众对立法者的不信任是时代最明显的标志之一。公民们正在逐步收回权力，不再授予那些机构的制定法律和花钱。”"
 usfp_progressive_era.9.a: "直接民主将加强合众国。"
 usfp_progressive_era.9.b: "他们不知道什么对他们最有利。"
 usfp_progressive_era.10.t: "死亡实验室"
 usfp_progressive_era.10.d: "“全国各地的报纸和广告牌上充斥着专利药品的宣传，这些号称能包治百病的药物既不标注成分，也未经任何验证。一篇由[Concept('concept_usfp_muckrakers', '$concept_usfp_muckraker$')]撰写的震撼调查揭露——许多药物不仅毫无疗效，反而会导致身体损伤、药物成瘾甚至死亡！愤怒的公众已经开始敦促对药品制定新的法规，以确保其质量和疗效。”"
 usfp_progressive_era.10.f: "“容易受骗的美国民众今年将花费大约七千五百万美元购买药品。这笔钱将会是大量的酒精、鸦片、麻醉剂、以及种类繁多的各种药物，从心脏抑制剂到阴肝脏兴奋剂不一，里面还有远远超过所有其他成分的东西，这是不折不扣的欺诈行为！”"
 usfp_progressive_era.10.a: "我们不能让这种欺诈行为继续下去。"
 usfp_progressive_era.10.b: "消费者可以自己做出决定。"
 usfp_progressive_era_censor_muckraker: "必须告诉这些耙粪者什么时候该收手。"
 usfp_progressive_era.11.t: "《屠场》"
 usfp_progressive_era.11.d: "[Concept('concept_usfp_muckrakers', '$concept_usfp_muckraker$')]厄普顿-辛克莱出版了一本小说，他通过此书披露了[ROOT.GetCountry.GetAdjective]肉类加工行业的恐怖。书中充斥着残害工人、虐待动物和不卫生条件等令人发指的细节。虽然作者强调的是工厂工人的困境，但关于工厂故意在加工过程中加入病肉和烂肉的说法引起了全国公众的强烈不满。"
 usfp_progressive_era.11.f: "“那巨大的屠宰机器无情地运转着，它一点也不想念那绿色的原野。隶属于这部机器的男女与幼童从来没见过一件绿色的东西——连一枝花也没见过。在他们东边四五英里就是蓝色的密歇根湖——说到湖水对他们的好处，那湖却又跟太平洋一般遥远。工人们只有星期天可以休息，可那时候他们又太疲劳而不愿走动了。他们被捆绑在这部庞大的屠宰机器上——终身地被捆绑在上面。"
 usfp_progressive_era.11.a: "他们的工作条件太过恶劣，不可忍受！"
 usfp_progressive_era.11.b: "#italic 什么#!？他们都往香肠里面放了什么？！"
 usfp_progressive_era.12.t: "《儿童的悲鸣》"
 usfp_progressive_era.12.d: "[Concept('concept_usfp_muckrakers', '$concept_usfp_muckraker$')]公布了他们对[ROOT.GetCountry.GetName]的童工状况的调查报告，其中触目惊心的证据无不表明让未成年儿童进入工厂会导致一系列不良影响，尤其是在教育、智力和情感健康等方面上。这一令人心碎的报告唤醒了大众的良知，越来越多的人们开始支持[SCOPE.sLaw('compulsory_school_scope').GetName]。"
 usfp_progressive_era.12.f: "\"我无法在那样的工作中生存，但十岁和十二岁的男孩们却在那种岗位上工作，报酬只有可怜的每天50到60美分。他们中的一些人从未进过学校；他们中很少有人能读懂一本儿童读物。确实，有些孩子会去上夜校，但在碎煤机里工作了十小时后，夜校几乎无法带来任何教育效果。\""
 usfp_progressive_era.12.a: "我们不能继续把孩子喂给机器了。"
 usfp_progressive_era.12.b: "你无权代表他们！孩子们渴望参与工厂的劳作！"
 usfp_progressive_era.13.t: "《城市的耻辱》"
 usfp_progressive_era.13.d: "一系列[Concept('concept_usfp_muckrakers', '$concept_usfp_muckraker$')]的报道揭露了[ROOT.GetCountry.GetName]各地[concept_usfp_political_machines]的非法行径。文中详尽披露了数十个城市的腐败交易，但作者也着重强调了当地市民对抗政治机器的努力，以此呼吁全国公民采取行动。"
 usfp_progressive_era.13.f: "\"这些事件向圣路易斯揭示了它的银行家、经纪人、公司高管及商人是罪恶的根源，从一开始就让人们了解了市政问题的真相。凭借公共精神的传统，它或许可以消除数百名隐藏在法规背后的蓝皮书、红皮书和教会名册中的人的顾虑，恢复良好的市政管理。否则，这些罪行的曝光只会使腐败系统更加完善。因为腐败之徒能从中吸取教训，而好市民却不能。\""
 usfp_progressive_era.13.a: "我们必须振兴公共机构，使其更有效地监督政府。"
 usfp_progressive_era.13.b: "这是必要的牺牲，他们使财源滚滚而来。"
 usfp_progressive_era.14.t: "[SCOPE.sCompany('standard_oil_scope').GetName]的发展史"
 usfp_progressive_era.14.d: "“[Concept('concept_usfp_muckrakers', '$concept_usfp_muckraker$')]艾达·塔贝尔发表了一系列文章，揭露[SCOPE.sCompany('standard_oil_scope').GetName]的不正当商业行为，详细描述了他们意图垄断市场的手段。全国各地的报纸纷纷赞扬塔贝尔的工作，并谴责公司的非法和贪婪行为。[concept_usfp_congress]中的进步派声音已经制定了加强反垄断法并拆分[SCOPE.sCompany('standard_oil_scope').GetName]的计划。”"
 usfp_progressive_era.14.f: "\"如果这家公司是全国唯一一个因垄断行为而获得权力的企业，这个故事可能永远不会被揭露。然而，它只是这些行为所能达到的最显著的例证。公司所运用的敏锐、坚持和隐秘的方法，实际上被各种商人所采纳，从街角的杂货店老板到银行家皆是如此。如果这些手段被曝光，他们总会以'这就是商业'为借口予以辩解。\""
 usfp_progressive_era.14.a: "打破垄断！"
 usfp_progressive_era.14.b: "凭什么[SCOPE.sCompany('standard_oil_scope').GetName]会因商业的成功而受到惩罚？"
 usfp_progressive_era.14.c: "看不见的手会自行调节。"
 usfp_progressive_era.15.t: "黄金十字架"
 usfp_progressive_era.15.d: "[SCOPE.sCharacter('bryan_scope').GetFullName]从[SCOPE.sParty('bryan_party').GetName]的高度出发，在党的代表大会上发表了激动人心的《黄金十字架》演讲。在这次演讲中，[SCOPE.sCharacter('bryan_scope').GetLastName]高度称赞银币是抗衡大城市金融界的坚实堡垒，并提出了一个可以使老百姓致富的民生纲领。"
 usfp_progressive_era.15.f: "“整个国家乃至世界的生产者是我们最为坚实的后盾，商人、工人以及各地的劳动者都在支持我们。因此，我们不能辜负人民的期盼，必须对他们提出的金本位制度的要求作出回应：你们不能把这沉重的荆棘冠冕压在劳动人民的头上；你们不可将人类钉在黄金的十字架上！”"
 usfp_progressive_era.15.a: "[SCOPE.sCharacter('bryan_scope').GetLastName]不久后将会赢得全国的选票！"
 usfp_progressive_era.15.b: "自由铸银也太荒谬了，我们需要健全的货币政策！"
 usfp_progressive_era.16.t: "公道政治"
 usfp_progressive_era.16.d: "[SCOPE.sIdeology('progressive_ideology').GetName]运动已成功在全社会各层面推行全面改革。托拉斯垄断已被打破，选举权与公民提案权的强化巩固了民主制度，美国梦如今人人可及——无论身份高低、贫富，人人都能享有公平待遇。"
 usfp_progressive_era.16.f: "“本届政府致力于推行全方位的公道政治，坚持人与人之间平等包容的交往准则，不因信仰、出身或社会地位差异区别对待，凡在生活与工作中彰显高尚道德者，皆应享有平等的人格尊严与同胞的由衷敬重。”"
 usfp_progressive_era.16.a: "进步兴国，善政为民！"
 usfp_progressive_era.16.b: "不要被资本主义的小恩小惠蒙蔽。"
 usfp_progressive_era.17.t: "[SCOPE.gsInterestGroup('eugenicist_ig').GetName]支持优生"
 usfp_progressive_era.17.d: "[SCOPE.sCharacter('eugenicist_character').GetFullName]对优生学的宣传已经在[SCOPE.gsInterestGroup('eugenicist_ig').GetName]的成员中传播开来，其支持群体开始迅速壮大。"
 usfp_progressive_era.17.f: "“如果我们的政府不能为他们提供医生和诊所，就必须为他们提供教士和忏悔箱，直到他们厌倦为止。我们不能像某些空想家所希望的那样，回到到处都是大家庭的老路上去，即使聪明人同意也不行。”"
 usfp_progressive_era.17.a: "[SCOPE.gsInterestGroup('eugenicist_ig').GetName]只是素质较高的人。"
 usfp_progressive_era.17.b: "当然，[SCOPE.gsInterestGroup('eugenicist_ig').GetName]比这更清楚。"
 usfp_progressive_era.18.t: "[SCOPE.sCharacter('eugenicist_character').GetFullName]提倡优生学"
 usfp_progressive_era.18.d: "知名[SCOPE.sIdeology('feminist_ideology').GetName][SCOPE.sCharacter('eugenicist_character').GetFullName]支持优生政策，并声称：当妇女们的遗传性疾病被消灭后，她们能更容易地参与社会工作，能更彻底地投入到社会中来。"
 usfp_progressive_era.18.f: "“当这门新科学让公众清楚地认识到，社会罪恶是人种退化的罪魁祸首时，人们的义愤终于可能被激发起来，他们既要反对由这些疾病造成的婴儿死亡，又要反对儿童中的带有罪恶基因幸存者会传染给他们的同代人，并把传给下一代人。”"
 usfp_progressive_era.18.a: "优生主义不是女权主义。"
 usfp_progressive_era.18.b: "基因纯净则家庭洁净。"
 usfp_a_house_divided.18.t: "分离主义者的倒台"
 usfp_a_house_divided.18.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]的成立暂时平息了南方各州的独立呼声。"
 usfp_a_house_divided.18.f: "在议厅上，双方的态度较为缓和。新总统否认了前任总统的危险言论；种植园主现在可以随时与政府合作，而不是选择独立。"
 usfp_a_house_divided.18.a: "也许我们可以在没有内战的情况下解决这个问题？"
 usfp_a_house_divided.3.b: "等着吧！我们将把奴隶制写入宪法！"
 usfp_a_house_divided.3.b.tt: "奴隶制法律将不再能够[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enacted$')]"
 usfp_a_house_divided.19.t: "北方之星"
 usfp_a_house_divided.19.d: "废奴主义煽动家[SCOPE.sCharacter('douglass_scope').GetFullName]在国外巡回演讲之后回到[ROOT.GetCountry.GetName]，由于他本人曾是奴隶，但因为积极倡导反对奴隶制和支持[SCOPE.sCulture('afro_american_culture').GetName]权利，他很快在全国内声名鹊起。"
 usfp_a_house_divided.19.f: "“每当我想到美国时，我时常会欣赏她那明净的蓝天——她那古老宏伟的森林——她那肥沃的田野——她那美丽的河流——她那巍峨的湖泊与星光点缀的山脉。然而，我的陶醉很快被制止，我的喜悦很快转化为哀痛。因为当我想到一切都被奴隶制、掠夺与不义的行为所诅咒——当我想到她最崇高的河流中，流向大海的不是清澈的水，而是我兄弟们的眼泪，毫不被重视、被遗忘；想到她最肥沃的土地，每日饮用的竟是我受辱姐妹们的鲜血，我的内心便充满了难以言喻的厌恶。”"
 usfp_a_house_divided.19.a: "他的鼓动是自由的指引之光。"
 usfp_a_house_divided.19.b: "他的煽动是对联邦的威胁！"
 usfp_usa.23.t: "[ROOT.GetCountry.GetRuler.GetLastName]总统"
 usfp_usa.23.d: "[ROOT.GetCountry.GetRuler.GetFullName]在其第二任期即将结束之际，其早已在历史上留下了不可磨灭的印记。在[concept_usfp_nullification_crisis]后，他积极采取行动夺取南部的美洲印第安人的土地，引发了[SCOPE.sStateRegion('florida_region_scope').GetName]战争，尽管[concept_usfp_supreme_court]裁定他的行为是错误的，但他的[SCOPE.sIdeology('jacksonian_ideology').GetName]议程正在推进，不过奴隶制问题仍在[ROOT.GetCountry.GetAdjective]中发酵。"
 usfp_usa.23.f: "“我的同胞们，你们必须记住，自由是有代价的，如果你们希望获得祝福，就必须付出代价。”"
 usfp_usa.23.a: "这是天赐良机。"
 usfp_usa.24.t: "栗疫病"
 usfp_usa.24.d: "一场枯萎病已经蔓延到美国大栗树林，摧毁了东海岸上下数十亿棵树。不久之后，除了试图对抗疫情的研究人员保存的一些标本外，这些树木将被完全消灭."
 usfp_usa.24.f: ""用劈柴烧栗子会成为一种失传的艺术吗？只有在诗歌和浪漫中，一个虔诚的人才能保留这种艺术吗？"" #LA Times
 usfp_usa.24.a: "我们将哀悼这些完美树木的损失."
 usfp_liberia.1.t: "《[SCOPE.sCountry('liberia_scope').GetAdjective]独立宣言》"
 usfp_liberia.1.d: "美国殖民协会认为应该在[SCOPE.sCountry('liberia_scope').GetName]为殖民事业建立一个合适的政府。新共和国已经批准了一部以美国模式为基础的宪法，并寻求得到我国政府的承认。"
 usfp_liberia.1.f: "“鉴于这些事实，本美国殖民协会，以一贯的诚意与我们打交道，通过一系列决议，解除与本共和国人民的所有政治联系，归还其被授予的权力，并让利比里亚共和国人民自行管理，他们理所当然地是一个自由、主权和独立的国家，拥有政府的所有权利、权力和职能。”"
 usfp_liberia.1.a: "暂时礼貌地搁置他们的请求。"
 usfp_liberia.1.b: "他们想独立？那就自食其力！"
 usfp_liberia.1.c: "扩大对新[SCOPE.sCountry('liberia_scope').GetAdjective]政府的正式承认。"
 usfp_indian_wars.1.t: "[SCOPE.sCharacter('red_cloud_scope').GetFullName]的战争"
 usfp_indian_wars.1.d: "为了回应我方对[SCOPE.sState('montana_scope').GetStateRegion.GetName]的侵占，[SCOPE.sCharacter('red_cloud_scope').GetFullName]酋长发动了一场猛烈的突袭行动，切断了通往我方要塞的补给线，令边境驻军陷入难堪境地。他要求我军撤出[SCOPE.sCountry('sioux_scope').GetAdjective]的狩猎地，并正式承认该族的领土主权。"
 usfp_indian_wars.1.f: "“与印第安人达成和平的唯一途径就是放弃这个国家。这是他们最好的狩猎地，我认为至少在十年或二十年内我们不需要它。所以为了经济，最好撤军，即使要牺牲我们的尊严。”"
 usfp_indian_wars.1.a: "目前的条约符合我们利益。"
 usfp_indian_wars.1.b: "我们不会被任何印度人吓倒。"
 usfp_indian_wars.2.t: "点亮博兹曼小径"
 usfp_indian_wars.2.d: "$gold$的传言让俄勒冈小径主路的探矿者源源不断地向北深入[SCOPE.sState('montana_scope').GetStateRegion.GetName]。随着交通量的增加，印第安袭击者的骚扰也随之增加。为了确保黄金之路的安全，陆军提出了一项计划，要在沿线修建一系列堡垒，以抵御将来的袭击。"
 usfp_indian_wars.2.f: "淘金者走过的小路成了平原上的死亡地带。随着水牛和羚羊的逐年减少，印第安人对白人的愤怒与日俱增，他们不会坐视饥饿。"
 usfp_indian_wars.2.a: "我们将保护探矿者。"
 usfp_indian_wars.2.b: "修建堡垒将被视为挑衅行为。"
 usfp_indian_wars.3.t: "黑山藏金"
 usfp_indian_wars.3.d: "有报道称[SCOPE.sState('south_dakota_scope').GetStateRegion.GetName]的黑山地区有黄金，这引起了白人的兴趣。然而我们之前与[SCOPE.sCountry('sioux_scope').GetName]签订的条约确认了他们对该地区的控制，他们认为这是神圣的土地。"
 usfp_indian_wars.3.f: "\"毫无疑问，整个山区埋藏着数不清的各种金属。在随后多地的勘探也证实了黑山存在黄金的事实。”"
 usfp_indian_wars.3.a: "[SCOPE.sCountry('sioux_scope').GetAdjective]除了顺从，别无选择。"
 usfp_indian_wars.3.b: "我们不会如此厚颜无耻地违背条约。"
 usfp_indian_wars.4.t: "[SCOPE.sCharacter('custer_scope').GetLastName]的背水一战"
 usfp_indian_wars.4.d: "[SCOPE.sCharacter('custer_scope').GetFullName][SCOPE.sCharacter('custer_scope').GetRankName]及其麾下全体士兵，在针对[SCOPE.sCountry('sioux_scope').GetAdjective]的鲁莽远征中全军覆没。虽然伤亡人数不多，但这场惨败还是在[ROOT.GetCountry.GetAdjective]舆论界引发强烈震动。"
 usfp_indian_wars.4.f: "“印第安人从四面八方发起猛烈的射击，大部分人骑马作战。没有一个人逃脱。印第安人离开战场时，战场看起来就像一个屠宰场，因为它位于一个狭窄的峡谷中，死者全部被肢解。”"
 usfp_indian_wars.4.a: "[SCOPE.sCharacter('custer_scope').GetLastName]会血债血偿！"
 usfp_indian_wars.5.t: "苏族-克罗战争"
 usfp_indian_wars.5.d: "由于白人殖民者从东部不断侵入[SCOPE.sCountry('sioux_scope').GetName]的领地，[SCOPE.sCountry('sioux_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('sioux_scope').GetRuler.GetFullName]对西部的老对手[SCOPE.sCountry('crow_scope').GetAdjective]发起了进攻。战败的[SCOPE.sCountry('crow_scope').GetAdjectiveNoFormatting]战士向我们寻求庇护，并提出愿意在平原上担任侦察兵。"
 usfp_indian_wars.5.f: "“我们夺取了克罗族的猎场，因为那里是最优质的。我们渴望拥有更广阔的土地。”"
 usfp_indian_wars.5.a: "我们非常荣幸与克罗族缔结盟约。"
 usfp_indian_wars.5.b: "部落间的冲突与我们无关"
 usfp_indian_wars.6.t: "[SCOPE.sState('settler_state_scope').GetStateRegion.GetName]的印第安人大屠杀"
 usfp_indian_wars.6.d: "位于[SCOPE.sState('settler_state_scope').GetStateRegion.GetName]边境的白人治安队组织了一场针对非敌对[SCOPE.sCulture('massacre_victims').GetName]印第安人的大屠杀。"
 usfp_indian_wars.6.f: "“对于基督徒和文明社会而言，从未有过如此骇人听闻、令人作呕的场景。年迈的老妇人，满脸皱纹、虚弱不堪，倒在血泊中，脑浆四溅，与她们灰白的长发混在一起。尚不足一臂长的婴儿，脸被斧头劈开，身体遍布触目惊心的伤痕。”"
 usfp_indian_wars.6.a: "开拓者是在为我们做事。"
 usfp_indian_wars.6.b: "找到并起诉责任人。"
 usfp_indian_wars.7.t: "杰克船长的堡垒"
 usfp_indian_wars.7.d: "为了确保我们对[SCOPE.sState('modoc_state_scope').GetStateRegion.GetName]的控制，[SCOPE.sCharacter('dead_general_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('dead_general_scope').GetLastName]已与[SCOPE.sCountry('modoc_scope').GetName]进行谈判。由于担心将军打算将他们赶出他们的土地，[SCOPE.sCharacter('captain_jack_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('captain_jack_scope').GetFirstName]在和平帐篷中暗杀了[SCOPE.sCharacter('dead_general_scope').GetLastNameNoFormatting]！现在莫多克人现已撤退回据点，这让我们的军队处于严重的劣势。"
 usfp_indian_wars.7.f: "“你剥夺了我作为白人的权利。我的皮肤虽然是红色的；但我的心属于白人的心；但我是莫多克人。我不怕死。”"
 usfp_indian_wars.7.a: "我们只能把他们冲出来。"
 usfp_indian_wars.8.t: "[SCOPE.sCulture('nez_perce_culture').GetName]的逃亡"
 usfp_indian_wars.8.d: "几支[SCOPE.sCulture('nez_perce_culture').GetName]部落拒绝接受将他们的祖传土地割让给我们的条约。他们以出色的战斗能力，在平原上与军队周旋了1000英里，最终在[SCOPE.sStateRegion('montana_region_scope').GetName]东部被包围并被迫投降。"
 usfp_indian_wars.8.f: "“我已厌倦了战斗。我们的酋长们已阵亡，老人们也都离世。如今是年轻人在决定‘是’或‘否’。而带领他们的那位也已牺牲。\n\n天寒地冻，我们没有毯子；孩子们正在被冻死。我的一些族人逃到了山里，没有毯子，也没有食物。无人知晓他们的下落——或许他们正在冻死。我希望有时间去寻找我的孩子们，看看能找回多少。也许我会在死人中找到他们。\n\n听我说，我的酋长们！我累了；我的心充满痛苦与悲伤。从此刻起，我将永远不再战斗。”"
 usfp_indian_wars.8.a: "把这些叛军运到印第安领地。"
 usfp_indian_wars.8.a.tt: "大约400名[SCOPE.sCulture('nez_perce_culture').GetName]人将被送往[SCOPE.sState('indian_territory_scope').GetName]"
 usfp_indian_wars.8.b: "他们表现出了伟大的精神。让他们回到[SCOPE.sState('idaho_scope').GetName]。"
 usfp_indian_wars.9.t: "[SCOPE.sCulture('navajo_culture').GetName]人的长途跋涉"
 usfp_indian_wars.9.d: "为了确保我们对[SCOPE.sCulture('navajo_culture').GetName]土地的控制，军队迫使他们穿越沙漠前往东部[SCOPE.sState('new_mexico_scope').GetName]然后囚禁他们。"
 usfp_indian_wars.9.f: "“当我们渡过格兰德河时，许多人溺水身亡。一些婴儿、儿童和年长老人被河水冲走。我们永远不会忘记他们的尖叫声和最后见到他们时的情景——他们的手、头发或漂浮在水面上的几缕头发。”"
 usfp_indian_wars.9.a: "这是必要的措施。"
 usfp_indian_wars.9.b: "我们至少应该确保[SCOPE.sCulture('navajo_culture').GetName]人得到照顾。"
 usfp_indian_wars.10.t: "铁路狩猎"
 usfp_indian_wars.10.d: "穿越[SCOPE.sState('railway_hunting_state').GetName]的[SCOPE.sBuilding('railway_scope').GetName]为路过的平民大规模屠杀水牛群提供了方便。铁路沿线现在布满了成千上万头野牛的尸骨和腐烂的尸体。"
 usfp_indian_wars.10.f: "“几乎每一列进出要塞的火车都会与成群的野牛展开一场速度的较量，场面既刺激又引人入胜。火车会减速至与牛群并行的速度，乘客们纷纷取出为防备印第安人而配备的枪支，从车窗和车厢平台上开火，仿佛在进行一场激烈的战斗。有时，一头年轻的公牛会短暂地停下脚步，试图反击。然而，这种勇敢的表现往往成了它的催命符，因为整列火车的火力会瞬间集中到它身上，要么直接击毙它，要么误伤它附近的同伴。”"
 usfp_indian_wars.10.a: "对所有人来说都是一项伟大的运动！"
 usfp_indian_wars.10.b: "立刻停止这场无谓的屠杀！"
 usfp_indian_wars.11.t: "水牛曾经驰骋的地方"
 usfp_indian_wars.11.d: "多年以来，士兵和偷猎者的无情猎杀使野牛濒临灭绝。随着赖以生存的根本资源被剥夺，平原印第安人抵抗力量也彻底瓦解。"
 usfp_indian_wars.11.f: "“在过去两年里，猎人们为解决棘手的印第安问题所做的贡献，已经超过了整个正规军在过去四十年的努力，而他们明年还将做得更多。他们正在摧毁印第安人的生存命脉。众所周知，一支失去补给来源的军队将陷入极大的困境。为了长久的和平，就让他们猎杀、剥皮并贩卖，直到野牛彻底灭绝。到那时，你们的草原上将遍布斑点牛。”"
 usfp_indian_wars.11.a: "水牛消失了，平原就属于我们了"
 usfp_indian_wars.12.t: "分配"
 usfp_indian_wars.12.d: "西部边疆已被彻底封锁。如今，平原地区已完全处于[ROOT.GetCountry.GetAdjective]的控制之下，将印第安狩猎采集者转变为虔诚的基督教农民的计划可以正式启动。原部落土地被分割成独立的宅地，分配给每个印第安家庭，多余的土地则出售给白人开拓者。通过寄宿学校体系，我们可以强制印第安人融入美国的主流文化。"
 usfp_indian_wars.12.f: "“白人向我们许下了许多承诺，多到我都记不清了，但他们只兑现了一个。他们承诺要夺走我们的土地，这一点他们倒是说到做到了。”"
 usfp_indian_wars.12.a: "杀死这些印第安人，然后拯救我们。"
 usfp_indian_wars.12.b: "拯救印第安人"
 usfp_indian_wars.13.t: "文明的进军"
 usfp_indian_wars.13.d: "黄金、土地和“昭昭天命”继续推动我们的移民向西进入大平原。随着抵抗不断升级，我们需要确定政府在处理印第安人问题上的政策。"
 usfp_indian_wars.13.f: "“我的心像一块石头，为我的人民感到悲伤；因为知道没有任何条约可以阻止白人进入土地，只要我还活着，我就会下定决心抵抗。”"
 usfp_indian_wars.13.a: "定居和谈判将把这些土地带入文明。"
 usfp_indian_wars.13.b: "好印第安人就是死印第安人。"
 usfp_indian_wars.13.btt: "[Concept('concept_tension', '$concept_tensions$')]所有平原国家增加#r 50#!"

 usfp_indian_wars.14.t: "空头支票"
 usfp_indian_wars.14.d: "居住在[SCOPE.sState('reservation_state').GetName]保留地的[SCOPE.sCulture('reservation_culture').GetName]印第安人，对我们强迫其进入保留地的条件而提出了抗议，理由是缺乏承诺的口粮、医疗和其他服务。"
 usfp_indian_wars.14.f: "“人们显得沉重而阴郁，沉重得仿佛无法被托起，阴郁得仿佛再也看不见希望。饥饿如今在我们中间肆虐。谎言充斥四周，但我们无法用谎言填饱肚子。”"
 usfp_indian_wars.14.a: "我们要遵守协议。"
 usfp_indian_wars.14.b: "这些印第安代理人必须处理好自己。"
 usfp_indian_wars.14.c: "饥饿会印第安人迫使他们成为虔诚的基督徒农民。"
 usfp_indian_wars.15.t: "[SCOPE.sCountry('comanche_scope').GetAdjective]突袭[SCOPE.sState('raid_state').GetName]!"
 usfp_indian_wars.15.d: "[SCOPE.sCountry('comanche_scope').GetAdjective]战士们如闪电般迅速袭击了偏远的定居点[SCOPE.sState('raid_state').GetName],烧毁几十个农场. 尽管当地民兵试图击退他们，但袭击者能够迅速带着许多俘虏逃回[SCOPE.sCountry('comanche_scope').GetCapital.GetName]."
 usfp_indian_wars.15.f: ""六百名骑马的科曼奇人突然出现在村子的近郊，我们被眼前的幻影吓了一跳。我们躲在里面，朝窗外看到的任何东西开枪。战士们掠夺并焚烧了一整天，随后撤退."" #expanded from Reminiscences of Fifty Years in Texas
 usfp_indian_wars.15.a: "尽可能多地索回俘虏."
 usfp_indian_wars.15.b: "惩罚性的远征是必要的."
 usfp_indian_postremoval.1.t: "鬼舞"
 usfp_indian_postremoval.1.d: "一场名为“鬼舞”的千禧年精神运动在西部印第安部落中迅速传播，预言野牛将重返大地，白人开拓者将被彻底清除。尽管这场运动倡导信徒保持和平，但其时而狂野、时而狂热的舞蹈仪式却令白人开拓者深感恐惧，他们坚称印第安人正在为一场针对他们家园的末日之战做准备。"
 usfp_indian_postremoval.1.f: "“他们告诉人们，可以通过舞蹈创造一个新世界。届时，山崩地裂、狂风肆虐，山丘将层层堆叠。大地会像地毯般卷起，带走所有白人的丑陋痕迹——那些散发恶臭的新动物，如绵羊和猪，还有篱笆、电线杆、矿井和工厂。而下面将重现一个美好的古老新世界，就像白人掠夺者到来之前那样。白人将被卷走，消失无踪，回到他们自己的大陆。”"
 usfp_indian_postremoval.1.a: "派兵驱散舞者。"
 usfp_indian_postremoval.1.b: "舞者没有任何威胁。"
 usfp_indian_postremoval.2.t: "伤膝河大屠杀"
 usfp_indian_postremoval.2.d: "我们派遣到[SCOPE.sState('south_dakota_scope').GetName]解散鬼舞的部队，残忍地屠杀了一整群毫无敌意的[SCOPE.sCulture('dakota_culture').GetName]印第安人。少数试图抵抗的战士被无情射杀，而我们的士兵甚至向手无寸铁的妇女和儿童的帐篷发射炮弹。那些试图逃离的人也被骑兵追上，惨遭屠戮。"
 usfp_indian_postremoval.2.f: "“我至今仍能清晰地看见那些被屠杀的妇女和儿童，她们堆积并散落在蜿蜒的沟壑中，仿佛我年轻时亲眼目睹的场景重现眼前。我还能感受到，在那片血腥的泥泞中，某种东西永远消逝了，被埋葬在暴风雪中。一个民族的梦想在那里破灭了。那曾是一个美好的梦想。如今，民族的圆环已支离破碎，再也找不到中心，而那棵神圣之树也已枯萎。”"
 usfp_indian_postremoval.2.a: "我们的战士们英勇无畏，是时候颁发荣誉勋章了！"
 usfp_indian_postremoval.2.b: "埋葬死者，继续前进。"
 usfp_indian_postremoval.2.c: "这场乱局必须通过一场严肃的军事法庭审判来解决。"
 usfp_indian_postremoval.3.t: "风中幽灵"
 usfp_indian_postremoval.3.d: "“风中幽灵”的预言并未实现，这让运动的热情已经消退，但它的影响力已经在印第安各民族间建立起跨文化的联系，一种泛印第安人的身份认同感已经建立，与我们的同化计划形成了对立。"
 usfp_indian_postremoval.3.f: "“当太阳落下时，我升上天堂，看到了上帝和古人。上帝让我回来告诉我的人民，他们必须善良、相亲相爱，不能打架、偷窃或撒谎。他教我跳这种舞蹈，让我传授给我的人民。”"
 usfp_indian_postremoval.3.a: "就像烈日下的雪花。"
 usfp_indian_postremoval.4.t: "塞阔雅宪法"
 usfp_indian_postremoval.4.d: "为了争取一定程度的主权，来自[SCOPE.sState('oklahoma_scope').GetName]的美洲印第安人代表团起草了一部宪法，成立了一个名为“塞阔雅”的州。在得到当地民众的广泛支持后，代表们正式提交提案，申请以新州身份加入联邦。"
 usfp_indian_postremoval.4.f: "“本代表大会谨代表印第安领地的人民声明，本宪法已制定完成并提交给领地人民，供其决定采纳或拒绝。其目的并非立即建立或组织州政府，而是要等待美国国会通过一项法律，正式接纳印第安领地作为一个州加入联邦。”"
 usfp_indian_postremoval.4.a: "将他们接纳为一个正式的州是理所应当的。"
 usfp_indian_postremoval.4.b: "印第安领地将与新设的俄克拉荷马州合并。"
 usfp_indian_postremoval.4.c: "维持领土分裂是最好的状态。"
 usfp_indian_postremoval.5.t: "俄克拉荷马州土地争夺战"
 usfp_indian_postremoval.5.d: "随着[SCOPE.sState('oklahoma_scope').GetName]开放定居，一场疯狂的土地争夺战爆发了。在一系列的土地争夺战中，前印第安人的领地被拱手相让，谁先到谁就能获得土地。"
 usfp_indian_postremoval.5.f: "骑兵和马车挤到赛场上，准备开始比赛。最激动人心的时刻是在中午时分发出起跑信号时——随着枪炮的轰鸣响起，马车和马匹在尘土飞扬中蜂拥而出。留在赛场上的家人为他们的丈夫和父亲欢呼，他们疯狂地冲向160英亩外的土地"
 usfp_indian_postremoval.5.a: "要不了多久，整个领地就能平定了。"
 usfp_indian_postremoval.5.b: "我们需要确保给部落留出足够的空间。"
usfp_indian_postremoval.6.t: "暗处密议"
usfp_indian_postremoval.6.d: "从[SCOPE.sState('oklahoma_scope').GetName]搬迁后, 奥塞奇族就其分配土地上的矿产权进行了充分的部落所有权谈判。在他们的领土下发现了丰富的油田，为奥塞奇人带来了巨大的财富，他们从收益中直接获得了红利。奇装异服、豪华轿车和新建豪宅的耸人听闻的故事激起了当地白人的不满."
usfp_indian_postremoval.6.f: ""奥塞奇人已经成为地球上任何种族中最富有的国家、氏族或社会群体，包括白人。奥塞奇县现在比美国任何其他县都拥有更多的皮尔斯箭."" #Killers of the Flower Moon
usfp_indian_postremoval.6.a: "他们是偶然选中的人."
usfp_indian_postremoval.6.b: "显然，他们要求白人监护人信任他们的财富！"
usfp_indian_postremoval.7.t: "恐怖统治"
usfp_indian_postremoval.7.d: "奥塞奇族的石油财富带来了阴谋的黑暗幽灵。在过去的5年里，100多名富有的奥塞奇人被发现在可疑的情况下死亡，他们的石油权利经常被移交给白人监护人。奥塞奇社区的领导人确信，他们的人民正因财富而被谋杀，并恳求联邦干预."
usfp_indian_postremoval.7.f: ""在我看来，这个陪审团是否在考虑谋杀案是一个问题。他们要决定的问题是，一名白人杀害奥塞奇族人是谋杀，还是仅仅是虐待动物."" #Killers of the Flower Moon
usfp_indian_postremoval.7.a: "派当局过来，阻止任何白人继承奥塞奇族的权利."
usfp_indian_postremoval.7.b: "这是地方当局要处理的地方事务."
 usfp_indian_althist.1.t: "[SCOPE.sCountry('sioux_scope').GetAdjective]大议会"
 usfp_indian_althist.1.d: "数十年来，[SCOPE.sCountry('sioux_scope').GetName]在北部平原占据的主导地位为其带来了繁荣。随着他们与[ROOT.GetCountry.GetAdjective]边境城镇的贸易联系日益兴盛，新的思想也如潮水般涌入了这片平原。如今，所有[SCOPE.sCountry('sioux_scope').GetAdjectiveNoFormatting]部落的议事会似乎达成了一致——将在[SCOPE.sCountry('sioux_scope').GetRuler.GetFullName]的领导下，建立起正式的政府架构。"
 usfp_indian_althist.1.f: "七议会之火已经举行了几代人，但这次会议不同。[SCOPE.sCountry('sioux_scope').GetRuler.GetFullNameNoFormatting]的话语已经具有很大的影响力，以至于任命一个常设议会只是一种形式。现在[SCOPE.sCountry('sioux_scope').GetNameNoFormatting]团结一致，共同制定[SCOPE.sCountry('sioux_scope').GetRuler.GetHerHis]的未来。"
 usfp_indian_althist.1.a: "这将是他们自己创造的文明。"
 usfp_indian_althist.1.b: "这个国家是我们的，我们打算留在这里。"
 usfp_indian_althist.2.t: "印第安人在[SCOPE.sState('raid_state').GetName]发动袭击"
 usfp_indian_althist.2.d: "一群机印第安人袭击并掠夺了[SCOPE.sState('raid_state').GetName]，然后迅速返回[SCOPE.sCountry('raiding_country').GetAdjective]领。"
 usfp_indian_althist.2.f: "“印第安人的出现起初并没有引起我们的惊讶，因为在平原上经常可以看到印第安人。然而，我们很快发现他们不是来帮忙的，牧民们说他们是来袭击的。他们涂着战漆，一看到我们就大叫一声，然后向我们冲来。”"
 usfp_indian_althist.2.a: "这就需要采取惩罚措施。"
 usfp_indian_althist.2.b: "为我们的堡垒提供补给，并加强巡逻。"
 usfp_indian_althist.2.c: "边疆应当自力更生。"
 usfp_indian_althist.3.t: "黄金的诱惑"
 usfp_indian_althist.3.d: "[SCOPE.sCountry('gold_rumors_country').GetAdjective]境内发现黄金的传言，引来大批淘金者越境寻宝，导致与当地印第安人爆发冲突。"
 usfp_indian_althist.3.f: "“当他从口袋里掏出那些金灿灿的金块，递给周围急切的人群时，一直挥之不去的疑虑顿时烟消云散。现场的气氛瞬间沸腾，许多人立刻开始匆忙收拾行装，迫不及待地奔向矿区。”"
 usfp_indian_althist.3.a: "我们不会介入。"
 usfp_indian_althist.3.b: "必须加强边界管控。"
 usfp_indian_althist.4.t: "摩门教徒迁入"
 usfp_indian_althist.4.d: "[SCOPE.sCountry('deseret_scope').GetName]的摩门教徒声称西部广袤的土地是他们神圣殖民地的合法属地。不满的开拓者纷纷涌入他们的“新锡安”，以躲避我们的反殖民政策。"
 usfp_indian_althist.4.f: "“身为上帝的圣徒，理应竭尽所能获取世间的影响力，并将每一分力量用于行善。”"
 usfp_indian_althist.4.a: "这只会带来麻烦。"
 usfp_indian_althist.4.b: "谴责这些罪犯！"
 usfp_indian_althist.5.t: "[SCOPE.sCountry('comanche_scope').GetAdjective]帝国"
 usfp_indian_althist.5.d: "随着所有边界通过条约得以固定，向来灵活的[SCOPE.sCountry('comanche_scope').GetName]内部政治局势已倾向于巩固统一。"
 usfp_indian_althist.5.f: "大议会的群众中汇聚了各色人等：基奥瓦人、阿帕奇人、威奇塔人，甚至一些被接纳的西班牙人和特哈诺人。显赫的酋长们向民众阐述了他们的主张，科曼奇利亚的各个部落一致表示支持。"
 usfp_indian_althist.5.a: "边境战争一触即发？"
 usfp_indian_althist.5.b: "我们将再次成为南部平原的统治者！"
 controls_mexico_city: "[SCOPE.sCountry('mexico_scope').GetCapital.GetName]被[ROOT.GetCountry.GetName]占领"
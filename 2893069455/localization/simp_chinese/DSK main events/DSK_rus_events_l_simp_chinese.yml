concept_russian_desc:0 "1547年，莫斯科公国大公#yellow 伊凡四世#!加冕为[Concept('concept_ruler','$RULER_TITLE_TSAR$')]。1721年#v 彼得一世#!在与瑞典王国进行大北方战争胜利后，10月22日被[concept_russian]元老院授予#v “全俄罗斯[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]”#!的头衔，[concept_russian]正式成为真正意义上的#yellow 帝国#!。"

DSK_russia.1.t:0 "一个落后的[ROOT.GetCountry.GetName]"
DSK_russia.1.f:0 "1836年[ROOT.GetCountry.GetName]还没有废除封建[SCOPE.sLaw('law_isolationism_scope').GetName]，[Concept('concept_ruler','$RULER_TITLE_TSAR$')]俄国被称为帝国主义链条上的薄弱环节。在英法资本主义高速发展，已经进入工业化社会的同时，沙俄仍然保留着[SCOPE.sLaw('law_isolationism_scope').GetName]政策！\n\n落后的社会制度严重制约了社会经济发展。如果不进行改革，那么[ROOT.GetCountry.GetName]将会永远跌出[concept_great_power]之列，被英法踩在脚底下"
DSK_russia.1.d:0 "我们急需改革"
DSK_russia.1.a:0 "我们该怎么做？"
 

je_autocracy_of_the_tsar:0 "[concept_russian]的命运"
je_autocracy_of_the_tsar_tt:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName]一家独大！[concept_russian]的改革举步维艰！"
je_autocracy_of_the_tsar_reason:0 "[ROOT.GetCountry.GetRuler.GetFirstName]因1825年长兄#yellow 亚历山大一世#!死后无男嗣，次兄#yellow 康斯坦丁#!大公放弃皇位继承权，而被立为[concept_russian][Concept('concept_ruler','$RULER_TITLE_TSAR$')]。\n\n1825年继位时镇压具有自由主义思想的贵族军官发动#bold 十二月党人起义#!，此后他加强对自由思想和革命运动的镇压，设立宪兵团，加强警察宪兵的作用；设立专司政治调查的“第三厅”。又实行严格的书刊检查制度。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]不愿与[SCOPE.gsInterestGroup('shougun_ig').GetName]利益发生冲突，改革[SCOPE.sLaw('law_serfdom_scope').GetName]，仅实施了币制改革、法典编纂事业和国有农奴管理方式的改革，同时禁止农奴子弟进入中学和大学学习。在对外政策上，继续推行神圣同盟的宗旨，充当欧洲宪兵，相继镇压#v 波兰1830年起义#!。"
nicholas_died:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]退位"
nicholas_died2:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]死亡"

nicholas_died3:0 "[ROOT.GetCountry.GetRuler.GetFirstName]死亡这有利于我们尽早改革。如果失去了[SCOPE.sLaw('law_isolationism_scope').GetName]，改革日志将消失."

DSK_russia.200.t:0 "新[Concept('concept_ruler','$RULER_TITLE_TSAR$')]登基"
DSK_russia.200.d:0 "天佑吾皇！[SCOPE.sCharacter('gaixin').GetFirstName]"
DSK_russia.200.f:0 "无上荣耀，我们[concept_russian]的[SCOPE.sCharacter('gaixin').GetFirstName]！\n\n神器归有德乃天数之应！\n\n愿皇室不朽，#yellow 帝国#!苍穹保！\n\n为[concept_russian]民众带来富裕安康！\n\n无上荣耀，神圣的[concept_russian]！\n\n庆祝[Concept('concept_ruler','$RULER_TITLE_TSAR$')]庄严的节日！\n\n庆贺欢呼陛下驾到！\n\n陛下也向人们回礼！\n\n天命所归乃吾皇！\n\n万岁万岁万岁！"
DSK_russia.200.a:0 "愿上帝保佑我们全[concept_russian]的[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][SCOPE.sCharacter('gaixin').GetFirstName]！他将会带领[ROOT.GetCountry.GetName]走向光明！"

je_russia_expand_1:0 "[concept_russian]的扩张"
je_russia_expand_1_tt:0 "[concept_russian]应当扩张，以打通四大洋的出海口。\n目前，[ROOT.GetCountry.GetRuler.GetFirstName]是全[concept_russian]的[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]！"
je_russia_expand_1_reason:0 "朕，[ROOT.GetCountry.GetRuler.GetFirstName]，全体[SCOPE.sCulture('russian_culture').GetName]人的[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]和君主，以最神圣和不可分割的三位一体的名义，向[concept_russian]王位和政府的所有继承者宣告：\n\n赐予朕生命的全能上帝使朕相信：[concept_russian]人民负有在将来成为欧洲的统治民族的使命，永受神的光辉的指引，并得到神的支持。\n\n朕生此信念，是由于考虑到欧洲大多数民族已达到衰朽的老年，或无论如何正在迅速接近这一状态。由此得出的结论是，一个年轻的人民，在达到它们那样强盛时，应该很容易和必须能征服他们。\n\n愿上帝保佑[ROOT.GetCountry.GetName]与全体[SCOPE.sCulture('russian_culture').GetName]人！"
no_kaz_countries:0 "我们已经吞并#v 大玉兹#!、#v 中玉兹#!、#v 小玉兹#!或者#v 哈萨克汗国#!！"
je_russia_expand_4:0 "向南方进军"
je_russia_expand_4_reason:0 "南方的土地属于我们！"
russian_land_people:0 "[concept_russian]的疆域"
russian_land_people_tt:0 "[concept_russian]的国徽是#bold 双头鹰#!，一个头注视着东方的[SCOPE.sState('east_state').GetName]，另一个头注视着西方的[SCOPE.sState('capital_state').GetName]"
russian_land_people_reason:0 "伊凡三世时期，#yellow 莫斯科公国#!兼并了#bold 雅罗斯拉夫尔#!、#bold 罗斯托夫#!、#bold 诺夫哥罗德#!等三大罗斯国家，使得#yellow 莫斯科公国#!的面积超过了100万平方公里。#yellow 莫斯科公国#!强大起来之时，#yellow 金帐汗国#!却分裂为了#bold 大帐#!、#bold 克里木#!、#bold 喀山#!、#bold 阿斯特拉罕#!几个汗国。随后，#yellow 莫斯科公国#!又征服了#bold 托博尔河#!、#bold 额尔齐斯河#!、#bold 鄂毕河#!的公国。\n\n为了适应新的局势，#yellow 伊凡三世#!迎娶了东罗马末代[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]的公主索菲娅，开始全面继承东罗马的遗产，开始建立中央集权体制，其称号也从#v “罗斯大公”#!变成为了#v “全罗斯君主”#!。\n\n#yellow 瓦西里三世#!继位后，又兼并了#bold 普罗科夫#!、#bold 梁赞#!，并从#bold 立陶宛#!手中夺回了斯摩棱斯克。就这样，除了#bold 基辅#!之外，#yellow 莫斯科公国#!已经统一了所有的罗斯国家，而#yellow 莫斯科公国#!的面积已经扩张的到了280万平方公里，成为了欧洲面积最大的国家。\n\n到了#yellow 伊凡四世#!时代，#yellow 莫斯科公国#!发展到了顶峰。#yellow 伊凡四世#!在国内大规模清剿贵族，建立中央集权统治，将#yellow 莫斯科公国#!变成了[concept_russian]帝国。对外方面，他不断向分裂的#bold 金帐汗国#!进攻，扩张土地。1552年，[concept_russian]灭#bold 喀山汗国#!；1556年，灭#bold 阿斯特拉罕汗国#!；1584年到1598年，征服了#bold 西伯利亚汗国#!。除了被[SCOPE.sCountry('tur_scope').GetName]控制的#bold 克里米亚汗国#!之外，#bold 金帐汗国#!的分裂出的几大汗国基本被[concept_russian]征服。到1598年，[concept_russian]的面积达到了398万平方公里。\n\n1613年，罗曼诺夫王朝建立，在和#bold 波兰#!战争的同时，[concept_russian]一直没有停止向西伯利亚扩张。1598年，俄国完全吞并了#bold 西伯利亚汗国#!，随后大规模向东方挺进，逐渐占领了叶尼塞河和勒拿河流域。到1639年，俄国的殖民者已经到达了鄂霍次克海。[concept_russian]东扩的过程中，还不断向蒙古渗透，占领了许多蒙古人的土地。在17世纪末，与[SCOPE.sCountry('chi_scope').GetName]签订了《尼布楚条约》。此时，[concept_russian]的面积已经扩张到了1600万平方公里。\n\n而#yellow 叶卡捷琳娜二世#!时期，又不断和[SCOPE.sCountry('tur_scope').GetName]爆发战争，最终兼并了#bold 克里米亚汗国#!，打通了黑海的出海口。#yellow 叶卡捷琳娜#!还和[SCOPE.sCountry('ger_scope').GetName][SCOPE.sCountry('pru_scope').GetName]、[SCOPE.sCountry('aus_scope').GetName]三次瓜分#bold 波兰#!，获得了#bold 立陶宛#!、#bold 库尔兰#!、#bold 白俄罗斯#!等地区，面积一共为46万平方公里。在其末期，[concept_russian]渡过了白令海峡，占领了#bold 阿拉斯加#!，成为了一个地跨亚欧美三大洲的大#yellow 帝国#!。"

 russia_expand.3.t:0 "俄罗斯帝国"
 russia_expand.3.d:0 "200年前，在#yellow 彼得大帝#!和#yellow 叶卡捷琳娜大帝#!两位君主的经营下，波罗的海、黑海相继被打通，[concept_russian]通往大西洋的梦想得以实现，但南下印度洋的夙愿却似乎被束之高阁。"
 russia_expand.3.f:0 "200年后的今天，[ROOT.GetCountry.GetName]虽然已经拥有波罗的海、黑海和太平洋的出海口，却很难相互联通！\n\n黑海有博斯普鲁斯海峡，而由俄远东进入中国东海进而直达东南亚，有对马海峡的束缚。\n\n当我们拉高镜头，放眼整个亚欧大陆，一张由印度洋港口和原有的巴伦支海、波罗的海、黑海、太平洋港口组成的点串联起来的航线，像一张巨大的网，将牢牢网罗住这块大陆，进而影响世界！"
 russia_expand.3.a:0 "为了[Concept('concept_ruler','$RULER_TITLE_TSAR$')]！印度洋出海口近在咫尺！"

 india_is_ours_tt:0 "#red 南下印度洋，控制出海口！"


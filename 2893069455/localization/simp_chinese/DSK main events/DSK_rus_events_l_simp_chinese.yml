concept_soviet_union:0 "苏维埃"
concept_soviet_union_desc:0 "即“代表会议”或“委员会”，是[concept_russian]无产阶级于1905年[concept_revolution]时期创造的领导群众进行革命斗争的组织形式，它起源于1905年[concept_russian][concept_revolution]，是一种工人和农民的民主形式，其代表可以随时选举并随时更换，暗含着巴黎公社式的政权形式。"

concept_comintern:0 "共产国际"
concept_comintern_desc:0 "1919年3月2日至6日，来自21个国家、35个政党和团体的52名代表聚首莫斯科，召开了国际共产主义代表会议，通过了《告国际无产阶级宣言》《共产国际行动纲领》《关于资产阶级民主和无产阶级专政的提纲》等重要文件。这次大会宣告第三国际正式成立，并将其命名为“共产国际”。"
 gw5:0 "暴风前夜"
 gw5_reason:0 "欧洲局势正处于暴风前夜，我们希望不要有过多的外交行动打破这一暴风前的宁静！"

 je_soviet_union_1:0 "二月革命"
 je_soviet_union_1_tt:0 "[concept_revolution]起势，势在必行！"
 je_soviet_union_1_reason:0 "我看见，我们的祖国[ROOT.GetCountry.GetName]是一个经济上落后、政治上反动的军事封建帝国主义国家，国内充满尖锐复杂的矛盾。\n\n处于饥寒交迫之中的人民们，起来反抗[Concept('concept_ruler','$RULER_TITLE_TSAR$')]的统治，再也无法忍受沉重的压迫的人民们，起来斗争！攻占军火库，夺取枪支弹药，筑起街垒！\n\n#red 长受国民之优礼，亲见郅治之告成。为了必争的世界！#!"

DSK_russia.16.t:0 "二月革命"
DSK_russia.16.d:0 "打倒战争！面包与和平！
DSK_russia.16.f:0 "在布尔什维克党领导下，首都各大工厂举行了有30万人参加的联合总罢工。[concept_revolution]风暴吓坏了沙皇[ROOT.GetCountry.GetRuler.GetFirstName]，他下令不惜采取任何措施，迅速恢复首都秩序。\n\n布尔什维克彼得格勒委员会的各领导人和其他一百多名[concept_revolution]积极分子被逮捕，这激起了群众的极大愤怒。他们上街游行，抗议政府暴行，但遭到更野蛮的镇压。于是领导罢工的维堡区党委决定将总罢工转变为武装起义，推翻沙皇政府。\n\n工人们立即行动起来，攻占军火库，夺取枪支弹药，筑起街垒，与反动军警展开战斗。同时工人们还积极开展争取军队的工作，在工人们的宣传、感召下，有数万名士兵公开站到革命的一边。他们同起义工人一起，占领了沙皇的巢穴冬宫和政府各部，逮捕了沙皇的大臣和将军。首都起义获得完全胜利。\n\n这样，统治俄国长达304年的罗曼诺夫王朝被二月[concept_revolution]冲垮了。俄国民主[concept_revolution]获得了胜利！"
DSK_russia.16.a:0 "我们要建立一个总统制共和国！"
DSK_russia.16.b:0 "我们要建立一个议会制共和国！"

 je_soviet_union_2:0 "十月革命"
 je_soviet_union_2_reason:0 "我们的敌人是什么？在我们国家，阶级矛盾已经激化到不可调和的地步，资产阶级、小资产阶级、旧贵族都是工人阶级的死敌。\n\n同志们，当[concept_revolution]还正在进行的时候，就是说当整个阶级在灭亡，它和一个人的死亡是完全不相同的。\n\n人死后尸体可以抬出去，但是旧社会在灭亡了的时候，很可惜，资产阶级的这个尸体那就不可能把它一下子订在棺材里，埋葬在坟墓里。\n\n资产阶级的尸体在我们的心里头腐烂着，他把毒气传染给我们大家，他在散发着臭气！\n布列斯基同志的被暗杀说明了反革命对我们的白色恐怖。被人民意志所判决的叛徒们，一定要无情地消灭他们！\n我们让资产阶级们去发疯吧！让那些无价值的灵魂去哭泣吧。工人同志们，我们的回答就是这样的。\n加上三倍的警惕，小心和忍耐，大家应当守住自已的岗位。同志们，你们必须要记住：我们只有一条出路，那就是胜利！还有另外一条出路，死亡。\n\n#N 死亡不属于工人阶级！#!"
 je_soviet_union_2_goal:0 "[SCOPE.gsInterestGroup('trade_unions_ig').GetName]已经决定好发动革命！"
 je_soviet_union_2_tt:0 "这个[concept_country]的[concept_revolution]绝不止于此！"

 DSK_russia.17.t:0 "[concept_soviet_union]内战！"
 DSK_russia.17.d:0 "十月革命！[concept_soviet_union]内战！"
 DSK_russia.17.f:0 "[ROOT.GetCountry.GetName]的临时政府已经被推翻。临时政府的大多数成员已被逮捕！\n\n[concept_soviet_union]政权将向各国人民提议立即缔结民主和约，立即在各条战线上停战。[concept_soviet_union]政权将保证把地主、皇族和寺院的土地无偿地交给农民委员会处置；将使军队彻底民主化，以维护士兵的权利；将规定工人监督生产；将保证按时召开立宪会议；将设法把粮食运往城市，把生活必需品运往农村；将保证[SCOPE.sCountry('rus_scope').GetAdjective]境内各民族都享有真正的自决权。代表大会决定：全部地方政权一律转归当地的工兵农代表[concept_soviet_union]，各地[concept_soviet_union]应负责保证真正的革命秩序。代表大会号召前线士兵要警惕沉着。[concept_soviet_union]代表大会深信，在新政府向各国人民直接提出的民主和约尚未缔结以前，革命军队定能捍卫革命，使其不受帝国主义的任何侵犯。新政府将采取一切措施，实行向有产阶级征收和课税的果断政策，以保证供给革命军队一切必需品，并改善士兵家属的生活。\n\n士兵们，积极反抗科尔尼洛夫分子克伦斯基！提高警惕！\n\n铁路员工们，使克伦斯基派到彼得格勒来的所有军车都停下来！\n\n士兵们，工人们，职员们，革命的命运和民主和约的命运完全操在你们手里！\n\n#red 革命万岁！#!"
 DSK_russia.17.a:0 "#v 为了祖国母亲！！#!"

 je_soviet_union_3:0 "终结内战"
 je_soviet_union_3_tt:0 "粉碎叛党，恢复秩序，一切权力归于[concept_soviet_union]！"
 je_soviet_union_3_reason:0 "内战爆发时的形势对于苏维埃政府和红军而言是极为不利的：各种各样的叛乱白军和外国干涉军相互勾结、遍及全国，反对[concept_soviet_union]的叛乱和干涉不仅数量多、范围广，占据了全俄大部分领土，并且从各个方向包围了[concept_soviet_union]政权控制的核心地区。\n\n大部分的军官和尚有组织和战斗力的部队都投向了新政权的对立面，而由于缺少受过专门教育和训练的军官指挥和组织的红军部队组织涣散、纪律败坏、战斗力低下，无力镇压由军官、军校士官生、哥萨克军人这样的职业军人为骨干组成的白军。"

 DSK_russia.18.t:0 "《告全党、全军、全[concept_russian]人民书》"
 DSK_russia.18.d:0 "今天，[concept_soviet_union]内战结束了！"
 DSK_russia.18.f:0 "如果政权由[concept_soviet_union]掌握，那么立刻就会宣布地主的土地是全体人民的财产。\n\n你们看，克伦斯基及其依靠富农、资本家和地主的政府反对的是什么！\n\n你们看，他们号召你们“容忍”是为了谁，是为了谁的利益！\n\n你们同意“容忍”，听任克伦斯基用武力镇压为了土地而举行起义的农民吗？\n\n你们同意“容忍”，听任他们把战争再长久地拖延下去，迟迟不提出和约，迟迟不废除过去沙皇同俄英法资本家缔结的秘密条约吗？\n\n同志们！要记住，克伦斯基答应过召开立宪会议，他已经欺骗过人民一次了！7月8日他郑重其事地答应在9月17日以前召开立宪会议，而结果是欺骗了人民。同志们！谁信任克伦斯基政府，谁就是出卖自己的弟兄——农民和士兵的叛徒！\n\n不，人民连一天也不肯再容忍拖延了！连一天也不能容忍用武力镇压农民，连一天也不能容忍在可以并且应当立刻提出公正和约的时候，让成千上万的人在战争中丧命。\n\n打倒同科尔尼洛夫的地主将军们策划镇压农民、屠杀农民和拖延战争的克伦斯基政府！\n\n全部政权归工兵代表[concept_soviet_union]！"
 DSK_russia.18.a:0 "立刻建设我们的国家！"


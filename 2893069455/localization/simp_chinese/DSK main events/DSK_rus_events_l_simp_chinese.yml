je_comintern: "[concept_comintern]"
je_comintern_tt: "我们成功建立了一个#yellow 无产阶级#!领导的国家！"

je_comintern_reason: "在内部，很多同志对于如何建设一个苏维埃国家有着不同的想法，有人认为应该优先#yellow 一国建成社会主义#!，也有人认为需要优先#yellow 向世界输出革命#!；在外部，资本主义国家都不看好我们的未来，甚至敌视我们的存在。或许我们可以先从建立国际党支部开始，以第三[concept_comintern]作为统一的世界共产党，让各国共产党直接受它领导。它是高度集中的领导中心，统一领导各国革命运动，各国党必须执行它的决定。它有权决定各国党的路线、策略和各国党的领导人，可以否定或修改各国党的决定，开除和解散任何一个支部，向各国党派出常驻代表。\n\n#red 自由的祖国，我们的荣耀，各民族的幸福筑成坚固堡垒！苏维埃红旗，人民的红旗，把我们从胜利引向胜利!#!。"


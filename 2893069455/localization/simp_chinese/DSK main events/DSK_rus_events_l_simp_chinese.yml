je_crimea:0 "克里米亚战争"
je_crimea_reason:0 "[SCOPE.sCountry('fra_scope').GetName]#yellow 路易·波拿巴#!派拉瓦莱蒂侯爵去#yellow 君士坦丁堡#!，要求[SCOPE.sCountry('tur_scope').GetAdjective]宫廷明确的承认[SCOPE.sCountry('fra_scope').GetAdjective]对大部分圣地教堂拥有保护权。在圣地问题上，[SCOPE.sCountry('tur_scope').GetAdjective]依然犹豫，它谁也不敢得罪。\n\n拉瓦莱蒂侯爵重申[SCOPE.sCountry('fra_scope').GetAdjective]几百年来获得的特权，并以武力相威胁。\n\n苏丹最终屈服了，1852年12月正式发布敕令将圣地保护权再还给[SCOPE.sCountry('fra_scope').GetAdjective]。\n\n反应迟钝的[SCOPE.sCountry('rus_scope').GetAdjective]此时发现自己十分被动，我们重申1774年的俄土《库楚克—开纳吉条约》，条约中规定东正教教会有高于天主教会的豁免和特权，并且此外还有模糊的条款俄土解释各异。双方根本无法达成一致，危机一日胜过一日。\n\n#red 如果我们决定发动对土耳其的战争，需要速战速决！否则那些与我们关系不好，且未与我们交战的西方敌人，很有可能在1853年12月加入对我们的战争！"


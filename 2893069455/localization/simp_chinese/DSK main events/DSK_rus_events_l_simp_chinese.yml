 rus_will_protect_us_tt:0 "#v 作为回应！#![SCOPE.sCountry('rus_scope').GetName]将会保护我们以对抗[SCOPE.sCountry('gbr_scope').GetName]的入侵！"

 je_russian_india:0 "印度洋出海口"
 je_russian_india_reason:0 "从#yellow 瑞典王国#!和#yellow 波兰、立陶宛王国#!，再到[SCOPE.sCountry('tur_scope').GetName]和[SCOPE.sCountry('chi_scope').GetName]，谁能阻止我们领土的扩张？\n\n[SCOPE.sCountry('gbr_scope').GetName]想要阻止我们南下？那就让他们好好瞧瞧！"

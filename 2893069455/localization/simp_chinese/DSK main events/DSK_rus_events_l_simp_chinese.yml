 indian_king:0 "印度洋出海口"

 DSK_russia.9.t:0 "完成彼得大帝的遗嘱"
 DSK_russia.9.d:0 "尽可能迫近#yellow 君士坦丁堡#!和[SCOPE.sCountry('bic_scope').GetAdjective]，谁统治那里，谁就将是世界真正的主宰。因此要挑起边疆的战争，不仅在土耳其，而且在[SCOPE.sCountry('per_scope').GetAdjective]。在黑海边上建立船坞，在黑海附近和波罗的海沿岸攫取小块土地，这对实现我们的计划是加倍必要的。在[SCOPE.sCountry('per_scope').GetAdjective]衰败之际，突进到波斯湾，如可能应重振古代与黎凡特的贸易，推进到[SCOPE.sCountry('bic_scope').GetAdjective]，它是世界的仓库。达到这一点，我们就不再需要[SCOPE.sCountry('gbr_scope').GetAdjective]的[SCOPE.sGoods('gold_scope').GetName]了。"
 DSK_russia.9.f:0 "无论谁抢了我的皇位，都要把领土推进到#yellow 君士坦丁堡#!和[SCOPE.sCountry('bic_scope').GetAdjective]。当[concept_russian]可以自由的进入印度洋的时候，那我们就可以统治全世界了——彼得一世"
 DSK_russia.9.a:0 "拿下[SCOPE.sCountry('bic_scope').GetName]也是顺手的事！"
 DSK_russia.9.b:0 "扩张到此为止！移驾[SCOPE.sState('capital_state').GetName]！"
 high_infamy_will_die:0 "请注意[concept_infamy]！#v 转让[SCOPE.sCountry('bic_scope').GetName]#!会给我们带来至少#red 80#![concept_infamy]！"

  russia_expand.6.t:0 "大博弈"
 russia_expand.6.d:0 "我们不断扩张的帝国与[SCOPE.sCountry('gbr_scope').GetName]发生了冲突，他们妄想挑战我们在亚洲的地位？我们必须击退他们，让他们好好瞧瞧！"
 russia_expand.6.f:0 "随着第二次工业革命的成果，尤其是铁路在欧亚大陆内部的扩散和兴盛，过去被海洋国家围困在冻土地带，资源动员能力贫弱的大陆强国[ROOT.GetCountry.GetName]，已经具备了成熟的条件去改善其物力、财力状况和武装部队的质量。\n\n假以时日，[concept_russian]将发起一场宏大的“西进运动”，首先向南、继而向西拓展势力范围，把中亚和东欧囊括进一个巨大的“枢纽地带”之中。在这块封闭的版图内，俄国将建立独占性市场，开发其间数量惊人的矿产和人力资源，以继续向大陆边缘扩张。\n\n待到它能占据理想的出海口、并建立起一支远洋舰队，就可以阻断[SCOPE.sCountry('gbr_scope').GetName]的全球海上贸易，并迫使后者的盟友改换阵营，届时[concept_russian]的“世界帝国”也就在望了——麦金德爵士"
 russia_expand.6.a:0 "为了[Concept('concept_ruler','$RULER_TITLE_TSAR$')]！"

  russia_expand.7.t:0 "大博弈"
 russia_expand.7.d:0 "[SCOPE.sCountry('rus_scope').GetName]是一个不能再被忽视的威胁。他们期冀统治亚洲，而我们是目前唯一能够与他们抗衡的国家。通过阻止他们向关键地区扩张，可以为我们的国家赢得更多的威望。"
 russia_expand.7.f:0 "随着第二次工业革命的成果，尤其是铁路在欧亚大陆内部的扩散和兴盛，过去被海洋国家围困在冻土地带，资源动员能力贫弱的大陆强国[SCOPE.sCountry('rus_scope').GetName]，已经具备了成熟的条件去改善其物力、财力状况和武装部队的质量。\n\n假以时日，[concept_russian]将发起一场宏大的“西进运动”，首先向南、继而向西拓展势力范围，把中亚和东欧囊括进一个巨大的“枢纽地带”之中。在这块封闭的版图内，俄国将建立独占性市场，开发其间数量惊人的矿产和人力资源，以继续向大陆边缘扩张。\n\n待到它能占据理想的出海口、并建立起一支远洋舰队，就可以阻断[SCOPE.sCountry('gbr_scope').GetName]的全球海上贸易，并迫使后者的盟友改换阵营，届时[concept_russian]的“世界帝国”也就在望了——麦金德爵士"
 russia_expand.7.a:0 "让他们认清自己的位置！"
  russia_expand.18.t:0 "[SCOPE.sCountry('gbr_scope').GetName]与[SCOPE.sCountry('rus_scope').GetName]大博弈任务开启"
 russia_expand.18.d:0 "沙俄帝国的不断扩张触及到了英国人的利益"
 russia_expand.18.f:0 "从19世纪初到20世纪初的大约100年间，英俄这两个帝国主义大国为了争夺在#bold 中亚#!、#bold 南亚#!以及周边地区的势力范围，在政治、外交、军事等领域展开的激烈对抗。\n 当时，正值欧洲帝国主义的扩张浪潮走向最高峰，英国为了确保它在东方的主要殖民地印度的安全，开始把触角伸向[SCOPE.sCountry('per_scope').GetName]、#yellow 阿富汗#!以及#yellow 中亚#!的广袤腹地。\n 沙皇俄国同样垂涎中亚的经济利益和交通价值，因此对英国的扩张态势做出了针锋相对的回应。"
 russia_expand.18.a:0 "我会和[SCOPE.sCountry('rus_scope').GetName]一起对抗[SCOPE.sCountry('gbr_scope').GetName]"
 russia_expand.18.b:0 "我会和[SCOPE.sCountry('gbr_scope').GetName]一起对抗[SCOPE.sCountry('rus_scope').GetName]"
russia_expand.18.c:0 "很显然，我并不感兴趣"
gbr_will_be_empire:0 "如果[SCOPE.sCountry('gbr_scope').GetName]在英俄大博弈的某一战略区域胜出，那么它将更名为#red 大英帝国#!"
rus_will_be_empire:0 "如果[SCOPE.sCountry('rus_scope').GetName]在英俄大博弈的某一战略区域胜出并完全拥有#yellow 东色雷斯#!，那么它将更名为#yellow 神圣俄罗斯帝国#!，国旗更改为三色双头鹰"




je_thired_rome:0 "第三罗马"
je_thired_rome_reason:0 "#yellow 东罗马帝国#!灭亡后，最后一个朝代#v 巴列奥略王朝#!末代[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]#yellow 君士坦丁十一世#!的侄女#yellow 索菲娅#!公主辗转逃亡到#yellow 莫斯科公国#!，#yellow 莫斯科公国#!是[concept_russian]历史上的一个国家。\n\n在教皇的支持下，#yellow 莫斯科公国#!大公#yellow 伊凡三世#!与#yellow 索菲娅#!公主结婚，因此[ROOT.GetCountry.GetName]声称继承了#yellow 罗马帝国#!的一切政治、经济、军事、文化等理念。\n\n[ROOT.GetCountry.GetName]便是#yellow 第三罗马#!。"
DSK_russia.6.t:0 "第三罗马"
DSK_russia.6.d:0 "如今君士坦丁堡已在我们手中，我再也不用骗自己是罗马的继承者，我就是罗马！"
DSK_russia.6.f:0 "帝国的首都不在因格里亚。\n\n东罗马末代[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]的侄女嫁给了[ROOT.GetCountry.GetName]，我接下了他们的职责，我是东正教的守护者，当我拿下#yellow 君士坦丁堡#!后，我不再是罗马的继承者，我就是罗马，我要让突厥人知道，我是他们的达摩克利斯之剑，总有最锋利的矛会贯穿他们的心脏.\n\n这一次迟来400年的正义，流离失所与亡国之恨也让你尝尝。\n\n我的回来是为了那些回不来的人，我就是罗马，我就是这个世界永远的双头鹰"
DSK_russia.6.a:0 "伟大的第三罗马终于到达了他最忠诚的#yellow 君士坦丁堡#!~"
modifier_rome_empire:0 "东正教的守护者"
DSK_russia.7.t:0 "第三罗马"
DSK_russia.7.d:0 "[SCOPE.sCountry('rus_scope').GetName]正式昭告天下"
DSK_russia.7.f:0 "[SCOPE.sCountry('rus_scope').GetName]已成功光复罗马旧都#yellow 君士坦丁堡#!，自400年前东罗马覆灭来，罗马的桂冠首次转移到[concept_russian]的手上，[SCOPE.sCharacter('crisis_scope_1').GetFirstName]加冕为罗马[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]！"
DSK_russia.7.a:0 "就这样吧"
DSK_russia.7.b:0 "不！克里米亚战争还没结束！必须迫使其吐出#yellow 君士坦丁堡#!！"

je_tur_Constantinople:0 "君士坦丁堡问题"
je_tur_Constantinople_reason:0 "[SCOPE.sCountry('rus_scope').GetName]已经从[SCOPE.sCountry('tur_scope').GetName]手中拿下了#yellow 君士坦丁堡#!，并彻底掌控了#v 黑海#!，我们难道放任其舰队主宰黑海甚至在地中海中横行霸道？在#v 苏伊士运河#!开通之前，[concept_russian]制霸黑海的结局这是我们万万不能接受的！我们必须扶持[SCOPE.sCountry('tur_scope').GetName]以对抗[SCOPE.sCountry('rus_scope').GetName]的进一步扩张！"
some_countries_will_do_this:0 "如果#yellow 君士坦丁堡#!在十年内没有归还给[SCOPE.sCountry('tur_scope').GetName]，会有其他[concept_great_power]插手此事！"




modifier_reforms_of_alexander_legacy:0 "[concept_russian]新政"

DSK_russia.3.t:0 "[ROOT.GetCountry.GetRuler.GetFirstName]改革成功"
DSK_russia.3.d:0 "[Concept('concept_ruler','$RULER_TITLE_TSAR$')]颂！"
DSK_russia.3.f:0 "在英明神武的全[concept_russian]的[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFirstName]指引下，我们先后进行了司法制度的修订，初等教育的充实，军制的改革！\n\n上帝显灵！[ROOT.GetCountry.GetRuler.GetFirstName]乃是继#yellow 彼得大帝#!后的又一位明君！\n\n天佑[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFirstName]！强大而崇高，你的统治带来光荣，我们的光荣！"
DSK_russia.3.a:0 "[Concept('concept_ruler','$RULER_TITLE_TSAR$')]万岁！新[ROOT.GetCountry.GetName]万岁！"
DSK_russia.4.t:0 "[ROOT.GetCountry.GetRuler.GetFirstName]改革失败"
DSK_russia.4.d:0 "激进派的行动！"
DSK_russia.4.f:0 "[ROOT.GetCountry.GetRuler.GetFirstName]的马车通过格里博耶多夫运河河堤，行进在回冬宫的路上，一位年轻女人挥舞了几下白丝巾。很快，一个刺客忽然来到了[ROOT.GetCountry.GetRuler.GetFirstName]的马车面前向马车扔自制炸弹。\n\n巨大的爆炸声传来，随后是[ROOT.GetCountry.GetRuler.GetFirstName]微弱的呼叫：“救救我。”刺客是一名叫伊格纳基的25岁年轻人，他在刺杀沙皇的同时，也将自己炸死。\n\n当日下午3点30分，沙皇[ROOT.GetCountry.GetRuler.GetFirstName]因流血过多去世。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]死后，国内的保守派将改革的争议部分进行了修正！"
DSK_russia.4.a:0 "这就是[concept_russian]的命运吗？"

je_reforms_of_alexander:0 "[ROOT.GetCountry.GetRuler.GetFirstName]改革"
je_reforms_of_alexander_goal:0 "三大改革日志条目全部完成"
je_tge_peasants_reform:0 "农奴改革"
je_tge_peasants_reform_reason:0 "十九世纪中叶，[ROOT.GetCountry.GetName]还顽固保存着野蛮落后的农奴制。农民的人格和自尊心被无情的摧残，他们整天无偿地为地主劳动，甚至被作为物品抵押债务。大量劳动力被束缚在庄园里，资本主义工业发展的必需劳动力由此缺乏来源。俄国经济发展和社会发展也因此大大落后于西欧国家"
je_tge_melikovs_constitution:0 "宪法改革"
je_tge_melikovs_constitution_reason:0 "建立地方自治机构（地方自治局），废除旧的等级审判制度，建立陪审制度和律师制度。实行公开审判。"
modifier_tge_melikovs_constitution:0 "宪法改革"
modifier_tge_russian_military_reform:0 "军队改革"

je_tge_military_reform:0 "军队改革"
je_tge_military_reform_reason:0 "克里米亚战争使得国家已经满目疮痍，军队的改革只能一缓再缓，世人皆嘲笑我[concept_russian]军队为“灰色牲口”我该证明他们是对的吗？\n\n我们必须进行军队改革以形成可以抗衡英法的[concept_russian][concept_great_power]的军事能力"
je_reforms_of_alexander_reason:0 "我们长期处于落后的封建农奴制度的统治之下，农民长期受着农奴制的压迫和封建思想的束缚，有关浓厚的皇权主义思想在全国各地蔓延。\n\n尽管他们经常掀起反抗贵族地主和地方官吏的斗争，但是，他们不反对[Concept('concept_ruler','$RULER_TITLE_TSAR$')]，甚至拥护和崇拜“好[Concept('concept_ruler','$RULER_TITLE_TSAR$')]”，“[Concept('concept_ruler','$RULER_TITLE_TSAR$')]被农民看成人间的上帝”。\n\n然而，随着资本主义的发展，农业危机的加深和农村阶级的分化，阶级斗争越来越尖锐。\n\n为了缓和阶级矛盾，增强国家实力；巩固统治，维护统治阶级利益，重振[ROOT.GetCountry.GetName]大国国威！改革势在必行！"

je_reforms_of_alexander_tt:0 "伟大的[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFirstName]将亲自着手改革计划以挽救落后的[concept_russian]！"


DSK_russia.10.t:0 "征服东方"
DSK_russia.10.d:0 "我们通过《瑷珲条约》和《天津条约》获得了大量的土地，有必要进行[concept_russian]式开发！"
DSK_russia.10.f:0 "我们的大臣建议我们吸引欧洲移民来到远东，以彻底改变这些地方的主流[concept_culture]！"
DSK_russia.10.a:0 "就这样做吧"

annex_sweden_button:0 "征服瑞典"
annex_sweden_button_desc:0 "通过征服瑞典拿到波罗的海的出海口乃是#yellow 彼得大帝#!的遗愿！"

DSK_russia.11.t:0 "斯堪的纳维亚之主"
DSK_russia.11.d:0 "尽量多地占领瑞典国土，并诱其进攻我们，以便我们有借口征服瑞典。为此我们必须把丹麦和瑞典隔离，并助长它们之间的争斗！"
DSK_russia.11.f:0 "“肢解瑞典，灭亡波斯，粉碎波兰，征服土耳其，我军业已会师，黑海和波罗的海由我们的舰只护卫之后，我们必须分别地并极为秘密地首先向凡尔塞宫，然后向维也纳朝廷提出建议，与它们分享全球帝国。如果其中之一接受，而且只要煽动其野心和民族虚荣心，几乎可以肯定它会接受，就可以利用它来制服那另一个。最后，再消灭那个仅存者。由于俄国已经占有整个东欧或者大部分欧洲，发动一场冲突是没有危险的。”——#yellow 彼得大帝#!"
DSK_russia.11.a:0 "天命所在，有求必应！"
DSK_russia.11.b:0 "扩张到此为止！"

je_manchulia_build:0 "进军满洲"
je_manchulia_build_reason:0 "在夺取[SCOPE.sCountry('chi_scope').GetName]的外东北后，关于如何开发这片地区仍处于摸索阶段。这里不仅距离[SCOPE.sCountry('rus_scope').GetName]核心区域非常远，人烟稀少，气候条件也较为恶劣，如何发展成了一个难题。\n\n如果不发展就等于没有真正占领，那么占领的意义何在？此外，原住民的数量远远大于我们主流民族的数量，我们担心这块风水宝地出现独立叛乱脱离我们的掌控！\n\n为了解决这一问题，必须在俄国境内实施吸引移民远东的优惠政策，例如每户家庭发放100俄亩土地，20年内免税。此外，我们应该鼓励犯罪人员到远东定居以免除罪责。"
hailanpao_button:0 "制造海兰泡大屠杀"
hailanpao_button_desc:0 "必须抹除原住民的优势地位"
DSK_russia.12.t:0 "[concept_russian]的移民"
DSK_russia.12.d:0 "移民们来到[concept_russian]新的边疆"
DSK_russia.12.f:0 "为了鼓励移民定居，政府推出了慷慨的土地分配政策。他们公开宣布，将一批肥沃的土地开放给新来的移民，每人可获得100俄亩土地。这些土地对于渴望拥有自己土地的农民来说，无疑是一个巨大的诱惑。\n\n最初，[concept_russian]规定这些土地在接下来的20年里无需缴纳税款。后来，为了进一步吸引移民，[concept_russian]在1861年还将免税期限延长到了24年。这样的政策无疑大大降低了移民的经济负担，使他们更愿意前往外东北定居"
DSK_russia.12.a:0 "签署于吾皇[ROOT.GetCountry.GetRuler.GetFirstName]！"
je_manchulia_build_1:0 "符拉迪沃斯托克的建设"
je_manchulia_build_1_reason:0 "符拉迪沃斯托克乃是我国在远东的重要城市和港口，必须竭尽全力发展以威慑东亚和太平洋！"
DSK_russia.13.t:0 "太平洋舰队"
DSK_russia.13.d:0 "以绝对实力威慑日本海"
DSK_russia.13.f:0 "在符拉迪沃斯托克数十年如一日的苦心经营让我们终于在这立足！尔等向我们全[concept_russian]的[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFirstName]俯首称臣！"
DSK_russia.13.a:0 "有钱，有人，才能建设符拉迪沃斯托克！"

DSK_russia.14.t:0 "海兰泡惨案"
DSK_russia.14.d:0 "将海兰泡强行占领，并改名为布拉戈维申斯克"
DSK_russia.14.f:0 "“到达#yellow 布拉戈维申斯克#!时，东方天空一片赤红，照得[SCOPE.sState('beautiful_state').GetName]水宛若血流。手持刺刀的俄军将人群团团围住，把河岸那边空开，不断地压缩包围圈。军官们手挥战刀，疯狂喊叫：‘不听命令者，立即枪毙!’ 人群开始像雪崩一样被压落入黑龙江的浊流中去。人群发狂一样喊叫，声震蓝天，有的想拼命拨开人流，钻出罗网；有的践踏着被挤倒的妇女和婴儿，企图逃走。这些人或者被骑兵的马蹄蹶到半空，或者被骑兵的刺刀捅翻在地。随即，俄国兵一齐开枪射击。喊声、哭声、枪声、怒骂声混成一片，凄惨之情无法形容，简直是一幅地狱的景象”—一位参与屠杀的俄兵"
DSK_russia.14.a:0 "所有中国居民的村庄必须“全部捣毁干净”"

DSK_russia.15.t:0 "[SCOPE.sCountry('rus_scope').GetName]制造海兰泡惨案"
DSK_russia.15.a:0 "野蛮的[SCOPE.sCountry('rus_scope').GetName]自绝于文明世界！"


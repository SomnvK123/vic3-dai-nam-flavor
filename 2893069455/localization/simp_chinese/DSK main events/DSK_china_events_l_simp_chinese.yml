je_china_korean_releation_reason:0 "辽东别有一乾坤，斗与中朝区以分。洪涛万顷围三面，于北有陵连如线。中方千里是[SCOPE.sCulture('korean_culture').GetName]，江山形胜名敷天。耕田凿井礼义家，华人题作小[concept_dsk_china]。\n\n昔在明朝之世，我[SCOPE.sCountry('kor_scope').GetAdjective]与[concept_dsk_china]唇齿相依，共御外侮，情深谊厚。然世事沧桑，天命有归，大清崛起于东北，一统华夏，威加海内。我[SCOPE.sCountry('kor_scope').GetAdjective]虽怀故明之恩，亦感大清之德，如枯木逢春，再生之喜。\n\n设使以外国言之，[SCOPE.sCountry('chi_scope').GetAdjective]父母也。我国与[SCOPE.sCountry('jap_scope').GetAdjective]同是外国也，如子也。以言其父母之于子，则我国孝子也，[SCOPE.sCountry('jap_scope').GetAdjective]贼子也。父母之于子，虽止于慈，岂有爱其贼子同于孝子之理乎？"


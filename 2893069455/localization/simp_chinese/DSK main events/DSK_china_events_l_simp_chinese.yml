je_Qing_Imperial_Parliament: "[concept_dsk_china]大清国资政院会议"
je_Qing_Imperial_Parliament_reason: "根据我们现行的体制，#yellow 资政院#!的#v 议会改革进度#!会#tooltippable;tooltip:[Country.GetTooltipTag],je_Parlamento_Italian_pos #o 积攒#!#!和#tooltippable;tooltip:[Country.GetTooltipTag],je_Parlamento_Italian_neg #n 回退#!#! #v 我们可以消耗进度条来颁布一个政策#!\n$TOOLTIP_DELIMITER$\n资政院会谨奏：为陈时艰、筹国是，仰祈圣鉴事。​\n\n窃惟我大清抚有中夏二百六十余载，列祖列宗以仁孝治天下，以威德柔远人，四海之内，咸沐圣恩。然近世以来，欧风东渐，海疆多故，民生凋敝，国势阽危。臣等忝列院议，目睹时艰，寝食难安，谨陈管见，愿效涓埃。​\n\n伏查祖宗成法，兼采西学新规，此乃立宪之本意也。今宪政初启，纲纪未张，官常多弊，吏治不修。州县之官，有朘削民脂以肥私橐者；部院之吏，有因循推诿以误公伤者。民怨积于下而不上闻，国帑虚于内而外患逼。臣等以为，当速整官制，明定职守，严核功过，使贤者进，不肖者退，则庶政可举矣。​\n\n夫民为邦本，本固邦宁。近年水旱频仍，灾黎遍野，饥民流徙，饿殍相望。而捐税苛繁，徭役繁重，农不得耕，商不得市。臣等请饬各省督抚，急赈灾民，减免赋税，兴修水利，劝课农桑。更应广设工艺学堂，教民技艺，使无业者有业，有业者乐业，则民生可安矣。"




je_china_japan_vic_reason: "大业三年(607)，[SCOPE.sCountry('jap_scope').GetAdjective]的第二次遣隋使向隋帝国递交了“日出处天子致书日没处天子无恙”的国书。这篇国书引起了隋王极大的不满，古典的汉字书面语是中世纪东亚共享的文化遗产，然而，它的引入与使用，却引起了文字背后的文化价值上的纷争。\n\n如今，[SCOPE.sCountry('jap_scope').GetName]已经崛起，开始学习西方先进技艺。\n\n[SCOPE.GetRootScope.GetCountry.GetName]一直以来作为东亚大国，必须要遏制他们统治东亚大陆的野心。"


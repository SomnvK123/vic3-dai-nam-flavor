je_china_nine_power_initiation_reason: "[SCOPE.sCountry('chi_scope').GetName]拥有对山东地区的历史主权，[SCOPE.sCountry('western_country').GetName]在巴黎和会上非法获取的权益必须归还。应召集主要强国召开国际会议，确立远东地区新秩序。\n\n#v 《九国公约》#!名义上“尊重中国之主权与独立及领土与行政之完整,”但实际是一句空话。公约又规定:要切实“维持各国在中国全境之商务实业机会均等之原则”。\n为此,任何一国“不得因中国状况,乘机营谋特别权利。”\n\n#tooltippable #tooltip:[GetPlayer.GetTooltipTag],china_nine_power 参与国#!#! #variable [GetGlobalVariable('je_participating_countries').GetValue]#! [Concept('concept_great_power', '$concept_great_powers$')|l]:\n#variable [GetGlobalVariable('je_pro_treaty_votes').GetValue]#! 已 #bold 支持#! 中国主权主张\n#variable [GetGlobalVariable('je_anti_treaty_votes').GetValue]#! 已 #bold 否决#! 中国主权主张\n$TOOLTIP_DELIMITER$\n#v 会议主办国#!为[ROOT.GetCountry.GetName]，主办国无法选择支持任何主张\n$TOOLTIP_DELIMITER$\n作为#v 会议议题方#!，[SCOPE.sCountry('chi_scope').GetName]将自动支持自身主张\n$TOOLTIP_DELIMITER$\n#bold 平局情况下，中国自身主张将获得通过。#!"


 je_rus_relationship: "中俄关系"
 je_rus_relationship_reason: "[SCOPE.sCountry('rus_scope').GetName]本来是一个传统的欧洲国家，最早是大约从公元9世纪开始兴起的基辅，后来在13世纪中期曾经被[SCOPE.sCulture('mongol_culture').GetName]人占据和统治，大约从14世纪开始又在莫斯科附近形成了#yellow 莫斯科公国#!并逐渐向四面八方扩张，大规模向东方扩张之后，终于在17世纪中期碰到了[SCOPE.sCountry('chi_scope').GetName]，于是两国边界开始接壤并发生关系。\n\n“大亚细亚各地专制独裁君主，由博格德贤臣辅佐的执法者、#bold 中国#!黎民社会和光荣的维护者、博格德的和#bold 中国#!的当今博格德汗殿下、#bold 中国#!大圣至高[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下与[concept_russian]国统治大俄、小俄、白俄诸地及东、西、北各方国土封地世袭独裁天佑君主为秉两国永久和平与幸福，在尼布楚附近会聚，共同议定各条款...\n\n从前两国沿边人民一切争端概作罢论，不得报复。和好既定之后，如有两国渔猎人等私自越界劫盗、杀人，应即捕送该管边界督军，严加惩处。”—#v 《尼布楚条约》#!"

je_Westernization_shopping:0 "洋务运动：求富"
je_Westernization_shopping_tt:0 "#v 发展手工业和民族资本主义#!"
je_Westernization_shopping_reason:0 "以“求富” 为旗号，兴办轮船、铁路、电报、邮政、采矿、纺织等各种新式民用工业。如在上海创办的最大的民用企业是“轮船招商局”，打破外国轮船公司对中国沿海航运的垄断，使长江航运渐复华商之手；开平矿务局开采的煤炭，不仅供给北洋水师，更缓解了天津等地的燃料短缺。这些民用工业多采用官督商办、官商合办模式，吸纳民间资本，既为军事工业提供资金与原料，又催生了一批近代工商业者，推动近代中国民族工业从无到有，在夹缝中生根发芽。"
je_Westernization_weapon:0 "洋务运动：自强"
je_Westernization_weapon_tt:0 "#v 发展军工业，建设新式军队#!"
je_Westernization_weapon_reason:0 "以“自强” 为旗号，引进西方先进生产技术，创办新式军事工业，如江南制造总局可造枪炮、轮船，福州船政局专造兵舰，天津机器局能制火药，一改往昔冷兵器主导的格局。同时训练新式海陆军，聘用洋教官传授西式战术，北洋水师成军时，拥有定远、镇远等铁甲巨舰，一度号称“亚洲第一”，试图以器物之变扭转清军积弱之势，抵御外侮，稳固海疆。"
je_Westernization_skool:0 "洋务运动：教育"
je_Westernization_skool_tt:0 "#v 发展教育，开办学校#!"
je_Westernization_skool_reason:0 "创办新式学校，如京师同文馆培养翻译人才，福州船政学堂传授造船与航海技艺，天津武备学堂专习军事，打破科举取士的桎梏，课程增设算学、格致、外文等实用学科。选送幼童赴美、青年赴欧深造，詹天佑、严复等辈皆出于此，他们带回西方科技与思想，成为近代中国翻译、军事、科技领域的先驱，为古老帝国注入新知的涓流。"
je_Westernization_company:0 "洋务运动：企业"
je_Westernization_company_tt:0 "#v 开办民族企业#!"
je_Westernization_company_reason:0 "推动全国的近代化进程，并抵制外国资本主义的经济输入。从上海机器织布局抵制洋布倾销，到汉阳铁厂打破洋铁垄断，这些企业以“实业救国” 为初心，将机器生产引入传统产业，改变手工作坊的落后面貌。它们不仅在航运、矿业、纺织等领域与洋商争利，更带动了铁路、电报等基础设施建设，使近代工业文明的火种在中华大地上渐成燎原之势。"







foreign_student_button:0 "派遣留洋学生"
foreign_student_button_desc:0 "学习西方先进的科技来改变清政府落后面貌是洋务派发起留学运动的最初目的。洋务时期的留学教育较有影响的主要有两次：留美幼童和福建船政学堂学生留欧。"


je_rki:0 "[concept_battle_of_east_asia]：琉球复国"
je_rki_reason:0 "自1609年萨摩入侵后，出于朝贡贸易与缓和局势的需求，#yellow #b 琉球#!#!的宗主权始终处在一种暧昧不明的默契下，其独立性质也随时间流逝而逐渐崩解。然而，在我国与[SCOPE.sCountry('jap_scope').GetName]冲突加剧之当下，曾悬而未决的#yellow #b 琉球#!#!问题也再次浮上台面。作为重要的海上贸易中枢和舰队泊地，一个被重建的#yellow #b 琉球#!#!国家将是对#yellow #b [SCOPE.sCountry('jap_scope').GetAdjective]#!#!日益彰显的东亚野心的扼控，同时，这一举措也宣示着我国对保护朝贡体系下诸藩的决心。传统主义者视其为[concept_dsk_china]秩序的重新巩固和收复运动，而激进的现代化派则看作一次值得尝试的势力扩张。但无论如何，为了[SCOPE.sCulture('chinese_culture').GetName]与[SCOPE.sCulture('Ryukyu_culture').GetName]民族的共同未来，#yellow #b [SCOPE.sCountry('jap_scope').GetAdjective]#!#!的野心必须在此断绝……"


je_Protectorate_War_reason:0 "今袁（世凯）背弃前盟，暴行帝制，解散自治会，而闾阎无安民矣；解散国会，而国家无正论矣；滥用公款，谋杀人才，而陷国家于危险之地位矣；假民党狱，而良懦多为无辜矣。有此四者，国无不亡！国亡则民奴，独袁与二三附从之奸，尚可执挺衔璧以保富贵耳。呜呼！吾民何不幸，而委此国家生命于袁氏哉！\n\n自袁为[Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]，野有饿莩，而都下之笙歌不彻；国多忧患，而效[郊]祀之典礼未忘。万户涕泪，一人冠冕，其心尚有“共和”二字存耶？既妄[忘]共和，即称民贼。\n\n吾侪昔以大仁大义铸此巨错，又焉敢不犯难，誓死戮此民贼，以拯吾民。"


je_china_imperial_palace: "中华瑰宝"
je_china_imperial_palace_reason: "#bold 太和殿#!的鎏金铜鹤总望着正南方向。翅尖的金箔被三百年的风雨磨出细痕，却仍在晴日里泛着冷光，像极了它脚下基座上雕刻的海浪那些浪纹里藏着永乐年间工匠的凿痕，每道凹槽都浸过#n 紫禁城#!第一捧奠基的黄土。​\n\n#bold 养心殿#!的紫檀木柜里，躺着只霁蓝釉笔洗。珍宝馆的展柜里，那枚"皇后之宝"玉玺的玉钮上，有个几不可见的缺口。是#yellow 道光帝#!在鸦片战争时摔的，玉屑溅在龙纹的眼睛上，像给神兽蒙了层雾。后来这玉玺被#yellow 慈禧太后#!用了三十七年，她盖印时总在缺口处停顿片刻，指甲划过玉质的冰凉，像划过#n 南京条约#!上那些刺眼的条文。​\n\n这些器物都不会说话。但当暮色漫过角楼，你若贴在#bold 太和殿#!的金砖上听，能听见#bold 宣德炉#!里残留的沉香在呼吸；你若对着#bold 乾清宫#!的铜鹤耳语，它翅尖的金箔会轻轻震颤，把三百年前的月光，抖落在你摊开的掌心。\n$TOOLTIP_DELIMITER$\n#v 它们见过最盛大的庆典，也见过最仓皇的逃亡；见过新帝登基时的礼乐，也见过宫女自缢时的白绫。如今都静立在时光里，像群沉默的守夜人，守着那些被风雨冲淡的年号，守着那些刻在木纹、釉色、铜锈里的，未曾远去的晨昏。#!"


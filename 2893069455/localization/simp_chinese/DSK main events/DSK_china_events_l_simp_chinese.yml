je_Pentecostal_Variation: "维新变法"
je_Pentecostal_Variation_tt: "变法之策，以报圣主，并慰苍生"
je_Pentecostal_Variation_reason: "臣本布衣，忝列朝班，沐皇恩于累世，感圣德之巍巍。今临危受命，心怀忧惧，爰陈鄙见，以颂吾皇，并述变法之亟。\n\n昔我先帝#yellow 皇太极#!，开国立基，武功赫赫，文治彬彬。至圣上御极，承平已久，海内晏安，百姓乐业。然世事如棋，局局新变，内则吏治腐败，民怨沸腾；外则强敌环伺，虎视眈眈。此诚危急存亡之秋也，臣不胜惶恐之至！\n\n[SCOPE.sCountry('chi_scope').GetAdjective]大圣至高[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下，天之骄子，万民之父母。圣明烛照，洞察秋毫，岂不知国事日非，危如累卵？然圣心仁慈，不忍轻启战端，伤我黎庶。故忍辱负重，图谋变法，以求自强之道。此诚大智大勇，非常人所及也！\n\n臣闻“穷则变，变则通，通则久”。今我朝内忧外患，非变法不足以图存。故圣上决意维新，整顿吏治，刷新庶政，以安百姓之心；兴学育才，励精图治，以强国家之本。此皆圣上深谋远虑，为天下计也。\n\n臣虽不才，愿以身许国，誓死追随圣上，共赴国难。愿吾皇圣体康健，万寿无疆；愿我朝变法成功，国运昌隆。臣不胜感激涕零之至！\n\n今当临表涕零，不知所言。惟愿吾皇鉴之，察臣愚忠。臣顿首再拜，谨以此表，上达天听。"
je_Pentecostal_Variation_goal: "完成四次变法"
je_Pentecostal_Variation_vote: "变法：改革政府"
je_Pentecostal_Variation_vote_reason: "中国之政府，积弊日深，国势日衰，民不聊生，实乃国家之大患。吾辈维新变法，意在救亡图存，振兴中华，非改革政府，无以图新。"
je_Pentecostal_Variation_democracy: "变法：开放言论"
je_Pentecostal_Variation_democracy_reason:"开放言论，非为私欲，实为公心。吾辈欲借此机会，使百姓得以自由表达，畅所欲言，以抒其志，泄其愤，达其情。如此，则民情可得而知，民意可得而达，国家之治乱兴衰，亦可由此而察。"
je_Pentecostal_Variation_resource: "变法：兴办工矿"
je_Pentecostal_Variation_resource_reason: "吾生于斯，长于斯，目睹大清之艰难，国势日衰，百业凋零，皆因工业不振，矿产未兴。故于维新变法之时，吾辈主张大兴工矿，以图国富民强。"
je_Pentecostal_Variation_army: "变法：新式军队"
je_Pentecostal_Variation_army_reason: "吾辈欲借此机会，更新装备，提升士气，使军队之战斗力得以增强，国家之安全得以保障。如此，则外敌不敢轻侮，国家得以安宁，百姓得以安居乐业。"



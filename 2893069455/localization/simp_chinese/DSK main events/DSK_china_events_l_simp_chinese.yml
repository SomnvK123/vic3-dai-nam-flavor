je_gugong_shiyi: "《逃离大英博物馆》"
je_gugong_shiyi_goal: "六批次的宝物被归还"
je_gugong_shiyi_reason: "紫禁城宫殿重重，辉煌壮丽。然而，在漫长的明清两朝，这壮丽的宫室中，多少年来却不断地发生着盗窃勾当。远的难以追溯，清朝最后的皇帝对此有明确的记叙。　\n皇帝说，就他所知，宫内太监们的盗窃几乎从没间断。他大婚的时候，刚刚行过大婚礼，皇后凤冠上镶嵌的珍珠、宝石、玉翠竟然整个换成了赝品。前朝皇帝从师傅们那里知道，清宫中的财宝早已在世界上闻名。他认为应该整肃内宫，清点库房，查禁偷盗。然而，计划还未实施，藏有无数珍宝的建福宫就突然起火。大火燃烧了一夜，建福宫院内的亭台馆阁全都化为灰烬，无数珍宝秘籍也都灰飞烟灭。\n据故宫博物院宫廷历史专家向斯统计，自第鸦片战争以来，流失的故宫国宝约为30万件。"






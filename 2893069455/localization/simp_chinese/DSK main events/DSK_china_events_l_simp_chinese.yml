je_china_and_japan: "中日关系"
je_china_and_japan_reason: "该[concept_journal_entry]有特殊的#v #v [concept_mechanism_chi_jap]#!#!（点击阅读）\n\n在海的对面，一个在数千年以来完全独立的亚洲国家的面貌也开始悄然改变。或许应该称之为一次意外，总之，在那以后，西方的技术与思想也开始逐渐泊入那个国家，而[SCOPE.sCountry('jap_scope').GetName]的社会变革以及技术的进步正在逐步开展，可预见的是，在不远的将来，[SCOPE.sCountry('jap_scope').GetName]也将会成为亚洲地区一支不小的力量。\n\n与他们的关系以及未来的规划将要提上日程，他们会将成为与我们一同捍卫亚洲的力量，抑或是欧美人再次回到亚洲的桥头堡？"
concept_mechanism_chi_jap: "机制"
concept_mechanism_chi_jap_desc: "以下条件将会深刻影响#v 外交局势#!：\n$TOOLTIP_DELIMITER$\n#bold 1·当与#red 日本#!的谈判尚未破裂且[concept_battle_of_east_asia]尚未开始时，将会有一个无限期的[concept_truce]始终作用于两国\n$TOOLTIP_DELIMITER$\n2·选择#yellow 中日断交#!将丢失所有后续#yellow 中日关系#!的[concept_journal_entry]\n$TOOLTIP_DELIMITER$\n3·[concept_battle_of_east_asia]将会在#red 日本#!完成御一新，触发#v 征韩论#!且大于[concept_minor_power]，不是#yellow 独裁制#!，两国低于$relations_amicable$[concept_relations]触发\n$TOOLTIP_DELIMITER$\n4·该[concept_journal_entry]会以一方的胜出触发不同的结局，中日亲善结局会移除#red 日本#!所有关于中国事务的日志#! "

je_gaozhikai_line: "国策：划定“高志凯”线"
je_gaozhikai_line_reason: "大唐贞观二十一年（公元647年），#yellow 王玄策#!第二次出使中天竺摩揭陀国。不料此时摩揭陀国国君已死，国中权臣#yellow 阿罗那顺#!自立为国君，众诸侯都不服。此时大唐使臣到来，#yellow 阿罗那顺#!担心自己得国不正，大唐会给予惩罚，索性一不做二不休，派兵半道劫杀大唐使团。大唐使团猝不及防，除#yellow 王玄策#!和副使#yellow 蒋师仁#!外，其余全部遇难。逃出牢笼的#yellow 王玄策#!对#yellow 蒋师仁#!说：\n\n#v 有仇不报非君子，大丈夫当效仿班超，堂堂大唐岂能受域外番邦歁侮。#!\n\n二人商议已定，决定先不回#yellow 长安#!复命，而是穿越甘地斯河，直奔#yellow 喜马拉雅山#!而去。\n\n事后，#yellow 王玄策#!策只三天就攻破茶搏和罗城，#yellow 阿罗那顺#!仓皇出逃，准备东渡恒河前往东天竺。#yellow 王玄策#!乘胜追击，一举占领了整个中天竺，并在恒河边生擒#yellow 阿罗那顺#!。#yellow 王玄策#!将#yellow 阿罗那顺#!留下准备带回长安献俘，余众3000余人尽皆斩首，以报大唐使团之仇。\n$TOOLTIP_DELIMITER$\n[COUNTRY.GetAdjectiveNoFlag]和[SCOPE.sCountry('bic_scope').GetAdjective]应该以恒河为界！恒河以北归[COUNTRY.GetAdjectiveNoFlag]！"


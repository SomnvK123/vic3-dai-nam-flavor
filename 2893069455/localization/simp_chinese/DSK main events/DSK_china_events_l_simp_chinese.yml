2ndyapian:0 "第二次鸦片战争"
2ndyapian_reason:0 "[SCOPE.sCountry('bic_scope').GetName]是[SCOPE.sCountry('gbr_scope').GetName]的垄断公司，在17世纪独享着在东方进行贸易的权利。\n\n在18世纪，[SCOPE.sCountry('bic_scope').GetName]在孟加拉建立了生产[SCOPE.sGoods('opium_scope').GetName]的垄断公司，这成为了支付[SCOPE.sGoods('tea_scope').GetName]费用的解决方法。[SCOPE.sGoods('opium_scope').GetName]在加尔各答被拍卖、装船，由商人们运到广东销售换成白银，[SCOPE.sGoods('opium_scope').GetName]由[SCOPE.sCountry('chi_scope').GetAdjective]的走私者带往沿海和内地；而白银随后被用来购买[SCOPE.sGoods('tea_scope').GetName]。\n\n[SCOPE.sGoods('opium_scope').GetName]贸易在19世纪早期迅速繁荣起来。[SCOPE.sGoods('opium_scope').GetName]在[SCOPE.sCountry('chi_scope').GetAdjective]被定为非法不过是一个很小的阻碍，武力强大的英军和[SCOPE.sCountry('chi_scope').GetAdjective]的走私者，以及大量的行贿受贿，使法律成为一纸空文。令人震惊的是，据估计，[SCOPE.sGoods('opium_scope').GetName]贸易的交易额超过了世界上所有商品贸易的交易额。从中赚取的巨额财富使得那些大毒枭能够广置田宅，在[SCOPE.sCountry('gbr_scope').GetAdjective]国会购买席位。\n而[SCOPE.sGoods('opium_scope').GetName]贸易的另一端则是上百万中国人吸食成瘾，这毒瘾能破坏人的健康甚至直接导致死亡。代价还远不只这些，瘾君子和他们的家人会因此陷入贫穷。这才是在全球推广致瘾物的真正代价―――过去是这样，现在也是。\n\n随着毒瘾的传播和造成的社会后果日益严重，越来越多的人因此丧命，后来甚至祸及皇子。北京的禁烟派在与那些倾向于鸦片贸易合法化的人的较量中占据了强势，湖广总督林则徐被任命为钦差大臣查禁鸦片贸易。他在广东查没了大量鸦片并焚毁，还给远在英格兰的维多利亚女王写了一封信：\n\n查该国距内地七六万里，而夷船争来贸易者，以获利之厚故耳。以[SCOPE.sCountry('chi_scope').GetAdjective]之利利外夷，是夷人所获之厚利，皆从[concept_dsk_china]分去。岂有反以毒物害华民之理。即夷民未必有心为害，而贪利之极，不顾害人。试问天良安在？中国所行于外国者，无一非利人之物：利于食，利于用，并利于转卖，皆利也。[SCOPE.sCountry('chi_scope').GetAdjective]曾有一物为害外国否？况如[SCOPE.sGoods('tea_scope').GetName]大黄，外国所不可一日无也。[SCOPE.sCountry('chi_scope').GetAdjective]若勒其利而不恤其害，则夷人何以为生？"






zhongfazz:0 "中法战争" 
zhongfazz_reason:0 "[SCOPE.sCountry('chi_scope').GetAdjective]与[SCOPE.sCountry('dai_scope').GetAdjective]山川相连，唇齿相依，自古以来关系密切。\n\n如今，[SCOPE.sCountry('fra_scope').GetAdjective]天主教势力已侵入[SCOPE.sCountry('dai_scope').GetAdjective]。第二次鸦片战争期间，[SCOPE.sCountry('fra_scope').GetAdjective]开始武力侵占[SCOPE.sCountry('dai_scope').GetAdjective]南部（南圻，西方人称为交址支那），使[SCOPE.sCountry('dai_scope').GetAdjective]南部六省沦为[SCOPE.sCountry('fra_scope').GetAdjective]殖民地。\n\n接着就由西贡出发探测沿湄公河通往[SCOPE.sCountry('chi_scope').GetAdjective]的航路，在发现湄公河的上游澜沧江不适于航行后，即转向[SCOPE.sCountry('dai_scope').GetAdjective]北部（北圻，西方人称为东京），企图利用红河作为入侵[SCOPE.sCountry('chi_scope').GetAdjective]云南的通道。\n\n#v 我们必须提高警惕！#!"




je_kor_rus_relationship:0 "朝俄关系"
je_kor_rus_relationship_reason:0 "昔我[SCOPE.sCountry('kor_scope').GetAdjective]，与俄接壤，边境之事，时有纠葛。若两国修好，情谊笃厚，则利国利民，福祉无穷。俄若援手，吾邦可借其力，以御外侮，边陲得以安宁，百姓安居乐业，商贾往来频繁，经济繁荣可期。且俄之技艺、学术，皆为世所重，得其传授，吾邦文化亦可日新。此乃和俄之利也。\n\n然国交亦难测。万一与俄交恶，边境烽火连天，生灵涂炭。俄之铁骑，势不可挡，吾邦军力难支，恐有亡国之虞。且俄若以武力相逼，勒索财物，割地求和，则国家尊严扫地，百姓苦不堪言。更兼俄之文化侵略，思想渗透，吾邦传统恐将不保，文化之根，或将断矣。此乃与俄交恶之害也。\n\n故我朝鲜，当审时度势，权衡利弊，以定国交。若能与俄修好，共谋发展，则两国百姓皆可享太平之福。若俄有不轨之心，吾邦亦当未雨绸缪，加强国防，以备不虞。如此，则吾邦可安，百姓可宁，国家可长保无虞矣。"



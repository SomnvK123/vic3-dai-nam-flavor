je_china_Treaty_Port: "在中国的租界与条约港"
je_china_Treaty_Port_reason: "这些[GetBuildingType('building_port').GetName]与租界，实乃我等在远东利益之基石。自#v 《南京条约》#!以来，我等以坚船利炮打开通商之门，非为掠夺，实为将现代文明之光照进这片古老土地。\n\n#bold 上海、天津、汉口#!诸港，码头林立，洋行密布，我等商人在此将纺织机、蒸汽机运入，换取丝绸、茶叶与瓷器，实乃互利之举。租界之内，法度井然，街道整洁，电灯电话一应俱全，恰是向本地人展示何为现代治理。彼等若能效法，何至于民生凋敝？\n\n更重要者，此处为我等侨民之庇护所。当地方骚乱四起，官吏昏聩无能时，唯有租界能保我等生命财产无虞。且条约既定，墨迹未干，此乃我等应享之权益，中国政府自当恪守承诺，不得有违。\n\n说到底，这些[GetBuildingType('building_port').GetName]与[GetBuildingType('building_railway').GetName]，是连接东西方的桥梁，是进步的灯塔。待彼等看清文明与野蛮之别，自会明白我等用心良苦。"


je_Westernization_railway:0 "洋务运动:铁路"
je_Westernization_railway_reason:0 "洋务派代表#yellow 刘铭传#!等上奏请求修建铁路，并提出了具体的铁路建设方案。\n\n#yellow 刘铭传#!认为，铁路“快捷、安全、制敌、弥内乱、节俭军费”。因此开通铁路有利于增强国家的军事实力和经济实力"

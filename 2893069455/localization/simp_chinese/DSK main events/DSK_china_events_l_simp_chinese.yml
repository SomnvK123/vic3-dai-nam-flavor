je_dsk_jiawu_war:0 "甲午战争"
je_dsk_jiawu_war_reason:0 "乃自尔邦明治维新，狼子野心渐露。废藩置县，扩军备战，不事农桑而专习杀伐，不重诗书而唯尚坚船。初窥琉球，窃据其地，我朝以息事宁人，未加深究；再染朝鲜，阳托 "保商" 之名，阴行蚕食之实。光绪二十年，朝鲜东学党起，尔国遽遣大兵，逾万艘舰，直抵仁川，名为 "助剿"，实则据汉城，胁王室，毁我宗藩旧制，破东亚和平之局。\n\n当是时，我朝以朝鲜为藩属，遣兵护商，本属分内之责。乃尔国竟悍然炮击我运兵之舰，突袭牙山之营，杀我将士，毁我粮械，是可忍孰不可忍！我朝总理衙门三度照会，责尔撤兵，尔却诡言 "改革朝鲜内政"，实则欲将朝鲜变为尔国之附庸，继而觊觎我辽东、山东之沃土。\n\n今我军已整戈待发，威海之炮已鸣，旅顺之舰已列，关内外之将士，莫不摩拳擦掌，愿效死力。尔国虽有铁甲之舰，然失道寡助；我朝虽暂处困厄，然得道多助。试看今日之域中，竟是谁家之天下！"


je_lan:0 "保护兰芳"
je_lan_reason:0 "[SCOPE.sCountry('lan_scope').GetName]是十八世纪七十年代到十九世纪八十年代之间存在于南洋婆罗洲（现称加里曼丹岛）上的海外华人所创立的第一个共和国。\n\n明清时期，每当新旧政权交替之时，不堪战乱的百姓与没落的权贵都会纷纷移居海外。由于地缘上的毗邻关系，东南亚成为中国移民的迁徙地和避难所。这种漂洋过海到南洋谋生的移民浪潮史称“下南洋”。“下南洋”在福建、广东、台湾一带也称“过番”，意指到南洋一带谋生。中国人一次又一次大规模迁徙南洋的背后，大抵上有三大原因：一是为战乱和天灾所迫；二是因为政治、经济的原因；三是由于人们对美好生活的向往与追求。\n\n我们知道[SCOPE.sCountry('net_scope').GetName]和[SCOPE.sCountry('dei_scope').GetName]正在整合印尼地区可能随时对这个海外华人小国发动袭击，我们该怎么看待他们的命运？"

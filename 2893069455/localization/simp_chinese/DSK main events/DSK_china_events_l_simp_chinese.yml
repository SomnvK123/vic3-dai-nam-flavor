je_china_japan_tao: "[concept_battle_of_east_asia]：中国制造"
je_china_japan_tao_reason: "唐刀者，中华刃之极也。观其形，若流霞绕玉，似寒月凝霜，纹饰如星河错落，柄首若骊珠璀璨，美则美矣，锋锷更藏裂甲摧锋之威。即寻常士卒执之，亦能斩将夺旗，破阵摧坚，盖其锐可透三重铠，利能断九环刀，非徒饰观瞻，实乃卫社稷之利器也。\n\n当是时，大唐声威播于四海，制刀之术集寰宇之精。西域之匠叹其巧，波斯之工服其坚，而东瀛诸岛尤甚。彼国贵族以得一柄唐刀为荣，奉若神器，佩之则面有得色，藏之则密室焚香。天皇见之，抚刀而叹：“华夏之巧，竟至于斯！观此刃，方知中华之盛，非虚言也。”遂命使者跨海求之，贡物堆积如山，只为换一刀，归途遇风浪，船将覆，使者抱刀而泣：“宁失身葬身鱼腹，不忍此刀沉沦！” 其重若此。\n\n嗟乎！一刃之微，载华夏之智，承汉唐之魂。观其百炼而成，知“精”非一日之功；见其万国钦慕，晓“威”自实力而来。至今东瀛古冢，偶出唐刀，虽锈迹斑斑，犹带千年前的凛然正气，仿佛仍能听见长安城头的号角，与刀光共映日月，照彻千古。"

je_china_japan_tea: "[concept_battle_of_east_asia]：远洋贸易"
je_china_japan_tea_reason: "华夏之茶，肇自神农，兴于唐，盛于宋，绵延千载，与山河同寿。其类之繁，若星汉垂地：绿者如碧岫含烟，红者似丹霞映水，白者若霜雪凝枝，乌者犹墨玉藏光。\n\n外邦见之，莫不倾心。扶桑遣唐使携茶籽归，植于宇治，遂有“和敬清寂” “东方神叶”，下午茶之俗由此而生。更有波斯商人，冒风沙，涉惊涛，只为换一篓新茶，归则设宴夸示：“此乃天宫玉露，饮之可忘尘俗。”其珍若此，盖因茶中藏着中华的山水魂魄，裹着东方的温润风骨。\n\n使天下人知：中华不仅有金戈铁马的壮阔，更有清茶一盏的温柔，二者同存，方是完整的九州气象。"

je_china_japan_kor: "[concept_battle_of_east_asia]：半岛博弈"

je_china_japan_kor_reason: "此为#v [concept_china_japan_tt]#![concept_journal_entry]\n$TOOLTIP_DELIMITER$\n大明洪基初奠，声教讫于四海。太祖定礼，以朝鲜为东藩，位同亲王。天子垂裳，服十二章冕服，日月星辰昭其明；朝鲜国王则袭九章之制，山龙华虫寓其恭。礼器所及，玉帛所通，皆示“内外相维，华夷一体”之意。\n\n然朝鲜虽臣服于清，心犹向明。私藏《崇祯历》者，比比皆是；暗祭明廷先帝者，代有其人。有儒士著《皇明遗民传》，藏于密室，谓“衣冠虽改，心不可移”。乾隆年间，使者入燕，见明十三陵，伏地恸哭，为守陵者所执，清帝闻之，叹曰：“其忠亦可敬也。” 释而不问。三百年间，东藩离合，如棋局之变幻，而礼义之弦，始终未断。今观朝鲜故籍，载明清典章者，汗牛充栋；存华夏天道者，昭如日星。此非独藩邦之念，实乃中华礼义之盛，足以感召四海。盖“天下”之谓，不在疆域之广狭，而在文化之向心力，朝鲜之故事，其明证也。\n\n#v 我朝与朝鲜同心同德，同文同种。#!"


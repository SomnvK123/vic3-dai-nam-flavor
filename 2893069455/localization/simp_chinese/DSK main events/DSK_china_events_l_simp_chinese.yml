je_conquer_japan:0 "国策：先发逐日"
je_conquer_japan_reason:0 "倭奴窥我疆场久矣，其狼子野心，昭如日月。今海疆浪恶，烽烟欲起，非待其獠牙及颈，方挥剑自卫，当乘其羽翼未丰，先发制人，以靖海波。\n吾观史册，汉唐之盛，非仅恃甲兵之利，更在防患于未萌。张骞凿空，非为穷兵，乃绝匈奴右臂；卫霍出塞，非好杀伐，实护丝路长安。今东夷跳梁，若纵其长驱，必蹈靖康之覆辙，陷兆民于水火。故 “先发” 者，非逞一时之勇，乃保万世之安。\n国家兴亡，匹夫有责。文不能提戈，当以笔为剑，唤醒国人\n\n或曰：“兵者不祥之器。” 然豺狼在门，弃戈则束手待毙；毒蛇窥室，怀仁则身膏其吻。故今日之举，非好战也，乃以战止战；非贪功也，实以功安民\n\n功成之日，收兵还朝，必于海滨立碑，碑曰：“某年某月，先发逐日，非为拓土，实护吾民。” 使后世观之，知今日之 “先发”，皆为明日之 “无战”；今日之 “逐日”，皆为后世之 “永昼”。\n\n噫！国难当头，匹夫岂容袖手？愿携三尺剑，随长风，破巨浪，取倭酋之首，悬于国门，以告慰九泉之下甲午忠魂。此志不渝，海枯石烂。"


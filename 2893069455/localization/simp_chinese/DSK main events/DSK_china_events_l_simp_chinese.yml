je_china_19th_century:0 "他日波涛如海时"
je_china_19th_century_reason:0 "大丈夫七尺躯，既以身许国，难复许卿。此去若得生还，实属万幸。倘有不测，毋悲毋戚。可拾吾骨归故里，瘗于春芳灼灼之地。今山河板荡，望诸君勠力共济，使后世子孙得离斯厄。#bold 外兴安岭#!之巉岩，#bold 海参崴#!之天风，#bold 乌兰巴托#!寒夜，#bold 巴尔喀什#!烟波，皆欲与卿秉烛夜话，此情此景，尽在魂梦间矣。\n$TOOLTIP_DELIMITER$\n\n朋友，当你拆开这封穿越时空的信时，但请一定要听听来自五千年前的心跳,那是#bold 黄河#!冲刷鹅卵石的声音，是#bold 青铜鼎#!上饕餮纹的呼吸，是我们留给你的、尚未冷却的体温。\n\n当你在未来的某一天，对着星空辨认#bold 北斗七星#!时，记得那颗最亮的旁边，有我们仰过的同一片夜色。我没能陪你走到最后。五千年的烟雨都飘向了你，那是无数双手在战火纷飞的时光里，为你升起的黎明。\n\n#bold 他日若你乘舟渡过吴淞口，若有波涛如海时，便是我来见你了#!"


lia_event_rtc.1.t:0 "[SCOPE.sCountry('gbr_scope').GetName] - [SCOPE.sCountry('chi_scope').GetName] 鸦片战争"
lia_event_rtc.1.d:0 "[SCOPE.sCountry('gbr_scope').GetName] - [SCOPE.sCountry('chi_scope').GetName]签订《南京条约》!"
lia_event_rtc.1.f:6 "速报! 有关鸦片战争的消息正在迅速传播。与当初欧洲各国的担忧截然相反，据说英国在对阵大清的战争中取得了压倒性的胜利，得到了条约港和战争赔款。英国正式宣布，这场战争是合法的开战理由导致的自我防御行为，在英国国内也有不少人批评这场战争没有道德。以下是该条约的详细内容...\n<第1条>  [SCOPE.sCountry('chi_scope').GetName]嗣后大清大皇帝、大英国君主永存平和，所属华英人民彼此友睦，各住他国者必受该国保佑身家全安……\n<第2条> [SCOPE.sCountry('chi_scope').GetName]许以英吉利国一条约港用于中英来往贸易..."
lia_event_rtc.1.a:0 "我们应该速速在大清扩大我们的利益!"
lia_event_rtc.1.b:0 "东方的苹果是否等着我们去采摘？"
lia_event_rtc.1.c:0 "大清虽败但仍是东方强国，我们不应该落井下石。"

lia_event_rtc.2.t:0 "从西边传来的消息"
lia_event_rtc.2.d:0 "[SCOPE.sCountry('chi_scope').GetName]-[SCOPE.sCountry('gbr_scope').GetName]鸦片战争"
lia_event_rtc.2.f:2 "我们的使节团从大清回来带来了重要的消息，大清在与大洋彼岸的英吉利国之战中签订《南京条约》，册封了朝贡，并给予了恩惠。"
lia_event_rtc.2.a:0 "[concept_great_power]的下一个目标可能是我们？"
lia_event_rtc.2.b:0 "我们是否需要重新评估与大清的关系？"


lia_event_rtc.4.t:0 "[SCOPE.sCountry('gbr_scope').GetName]-[SCOPE.sCountry('chi_scope').GetName] 鸦片战争"
lia_event_rtc.4.d:0 "[SCOPE.sCountry('gbr_scope').GetName]-[SCOPE.sCountry('chi_scope').GetName]东方巨龙昔日辉煌烟消云散!"
lia_event_rtc.4.f:6 "速报! 有关远东地区发生战争的消息正在迅速传播与当初欧洲各国的担忧截然相反，据说英国在对阵大清的战争中取得了压倒性的胜利，得到了条约港和战争赔款。英国正式宣布，这场战争是合法的开战理由导致的自我防御行为，在英国国内也有不少人批评这场战争没有道德。以下是该条约的详细内容...\n<第1条>  [SCOPE.sCountry('chi_scope').GetName]嗣后大清大皇帝、大英国君主永存平和，所属华英人民彼此友睦，各住他国者必受该国保佑身家全安……\n<第2条> [SCOPE.sCountry('chi_scope').GetName]许以英吉利国一条约港用于中英来往贸易..."
lia_event_rtc.4.a:0 "天朝上国的时代已经过去了！"
lia_event_rtc.5.t:0 "太平天国之乱"
lia_event_rtc.5.d:0 "逆贼啸聚，祸乱四起！"
lia_event_rtc.5.f:0 "[SCOPE.sCountry('heavenly_kingdom_scope').GetName]这帮贼寇，所过之处生灵涂炭，见我旗人便挥刀屠戮，实为心腹大患。若任其蔓延，国祚将危！我大清子民当同心协力，速速荡平此乱，以安社稷！"
lia_event_rtc.5.a:0 "天命所归，大清万不可倒！"
lia_event_rtc.6.t:0 "太平天国运动"
lia_event_rtc.6.d:0 "开天辟地，再造华夏！"
lia_event_rtc.6.f:0 "当今之世，清廷昏聩，外不能抵洋夷，内不能安黎民，致使中华大地沦为列强俎上之肉。此非天亡华夏，实乃清室失德、气数已尽！我等愤而起兵，誓要推倒鞑虏朝廷，建立有田同耕、有饭同食之天国！"
lia_event_rtc.6.a:0 "驱除鞑虏，恢复中华，立纲陈纪，救济斯民！"
lia_event_rtc.7.t:0 "[SCOPE.sCountry('heavenly_kingdom_scope').GetName]-[SCOPE.sCountry('chi_scope').GetName] 内战"
lia_event_rtc.7.d:0 "太平天国起，天下大乱"
lia_event_rtc.7.f:2 "[SCOPE.sCountry('chi_scope').GetName] 疆域之内，叛乱燎原。那[SCOPE.sCountry('heavenly_kingdom_scope').GetName]的首领竟妄称上帝之子、耶稣之弟，所传教义怪诞不经，实乃借教乱国。此乱结局难料，然我等断不可坐视 —— 是插手还是旁观，当早作定夺。"
lia_event_rtc.7.a:0 "此等异端竟敢冒渎神明，自称上帝之子？我等当与 [SCOPE.sCountry('chi_scope').GetName] 联手，共剿此獠！"
lia_event_rtc.7.b:0 "[SCOPE.sCountry('chi_scope').GetName]气数已尽，唯有上帝之子能救中华！此乃天意，当助天国取而代之！"
lia_event_rtc.7.c:0 "这是 [SCOPE.sCountry('chi_scope').GetName]内政，我等何必卷入？且作壁上观，再待时机。"
lia_event_rtc.8.t:0 "[SCOPE.sCountry('heavenly_kingdom_scope').GetName]-[SCOPE.sCountry('chi_scope').GetName]内战"
lia_event_rtc.8.d:0 "太平天国之乱，牵动天下"
lia_event_rtc.8.f:2 "[SCOPE.sCountry('chi_scope').GetName] 各地叛乱已成燎原之势，那[SCOPE.sCountry('heavenly_kingdom_scope').GetName]首领自命上帝之子、耶稣之弟，所传之教不伦不类。清廷究竟能否平定此乱？列国又将如何抉择？这乱世棋局，正待落子。"
lia_event_rtc.8.a:0 "莫非，大清的气数真要尽了？"
lia_event_rtc.9.t:0 "西方助我平定内乱！"
lia_event_rtc.9.d:0 "西洋诸国，援兵至矣！"
lia_event_rtc.9.f:1 "国内乱象早已传至西洋，列强竟愿出兵助饷，共剿叛军。他们此举，或为名目上的‘人道主义’，或为保住其在华利权，缘由虽难深究，但眼下这支援，于荡平贼寇确是雪中送炭。"
lia_event_rtc.9.a:0 "这些西洋人虽非善类，甚至是乱源之一，然当务之急，是先复秩序、再图后计！"
lia_event_rtc.10.t:0 "天国裂变"
lia_event_rtc.10.d:0 "东王殒命，天京喋血！"
lia_event_rtc.10.f:4 "自金田举义，东王与天王相佐，权柄日重，深得倚信。然功高震主，渐生骄奢，广纳财货，私蓄姬妾，对翼王、北王诸将颐指气使，竟至朝堂之上逼天王封其‘万岁’，僭越之心昭然。天王隐忍日久，知其必成祸乱，密令北王清君侧。岂料北王嗜杀成性，血洗东王府时，连妇孺仆从亦不放过，株连者竟达数万，长江水面浮尸连绵，天京城内腥气冲天。昔日同生共死的弟兄，转瞬成不共戴天之仇，这场内讧之火，烧得天王也难控燎原之势。"
lia_event_rtc.10.a:0 "一江碧水，尽染赤红，天国的根基，已在血泊中朽烂。"


lia_event_rtc.11.t:0 "太平天国北伐"
lia_event_rtc.11.d:0 "直捣燕京，犁庭扫穴！"
lia_event_rtc.11.f:1 "自永安建制，已历数载，定都天京后，南方半壁渐归掌握。今派林、李二将率精锐北伐，誓要攻破那满清巢穴，将咸丰小儿赶下龙椅。大军过淮河、越黄河，所过州县，百姓箪食壶浆，皆盼天国天兵早解倒悬。中原震动，燕京恐慌，此去若成，便是汉家天下重光之日！"
lia_event_rtc.11.a:0 "北伐旌旗指幽燕，天下风云为之变！"


lia_event_rtc.12.t:0 "清军大反攻"
lia_event_rtc.12.d:0 "荡平妖氛，复我乾坤！"
lia_event_rtc.12.f:1 "东北马贼未平，江南妖氛又起，长毛贼子竟僭称‘天国’，毁孔庙、焚典籍，逆天悖伦，动摇国本。幸有曾公湘军、李公淮军渐成气候，湘勇悍不畏死，淮军器械精良，更得西洋火器相助。今奉天子诏，自湖北、江西、安徽三路出兵，水陆并进，直逼天京。此非为一家一姓，乃为守护纲常、重整河山——凡我大清臣民，皆当同心勠力，共剿此獠！"
lia_event_rtc.12.a:0 "王师北伐，妖氛必散，天道昭彰，乱贼当诛！"


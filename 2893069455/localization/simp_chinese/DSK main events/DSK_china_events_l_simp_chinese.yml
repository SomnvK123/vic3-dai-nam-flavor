je_white_sun_rise:0 "青天白日"
je_white_sun_rise_reason:0 "该[concept_journal_entry]包含以上#tooltippable #tooltip:[GetPlayer.GetTooltipTag],dsk_white_sun_blue_sky #blue 历史向事件#!#!#!\n$TOOLTIP_DELIMITER$\n[SCOPE.GetRootScope.GetCountry.GetName]已覆两千载帝制，然眼前沉疴，尤深于往昔。内则流寇蜂起，千里烟墟；旧族顽抗，负隅以扰。外则外夷环伺，眈眈虎视，条约如锁，勒我咽喉，疆土被割，如剜心腹。\n\n当此国运飘摇，四野疮痍之际，每念及此，肝肠寸断。愿诸君执干戈以卫社稷，沥肝胆而赴时艰——纵血沃青史，骨埋荒野，亦要为这破碎山河，挣一线生机。\n\n惟盼后来者，终得脱此水火，居有定所，食有馀粮，不见刀兵，不闻哭嚎。那时风清日朗，小儿拍手歌于途，老者击壤乐于野，再无人记此际之苦。则我等今日之踣踣，皆非虚掷矣！"


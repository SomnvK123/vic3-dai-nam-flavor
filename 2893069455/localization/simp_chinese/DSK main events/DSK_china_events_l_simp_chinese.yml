je_culture_and_nationality_1: "民族政策"
 je_culture_and_nationality_1_reason: "作为一个多民族国家，主体民族与少数民族和睦共处是维护国家领土完整的重要前提"

 culture_and_nationality.1.t: "民族政策"
 culture_and_nationality.1.d: "作为一个多民族国家，主体民族与少数民族和睦共处是维护国家领土完整的重要前提，而在处理少数民族问题上，众人产生了分歧。"
 culture_and_nationality.1.f: "一些人认为，我国的划分并不需要如同外国民族那样按照血统划分民族，而是需要合并成一个中华文化，如果按照血统划分，按照五千年的民族大融合程度早已是你中有我我中有你。而之所以还能成为一个国家是因为都认同同一个文化——即中华文化。\n而另一些人认为，民族是一个刻在骨子里的事实。其他少数民族可能认可汉族的文化，但是他们自身本身也有自身的文化传承，将汉族文化强行压在少民身上是不合理的。我们应该尊重少民其自身的文化，而做到其自身的文化就需要民族平等民族团结民族自治。"
 culture_and_nationality.1.a: "入则华夏出则蛮夷，凡是认可中华文化的都是华夏人"
 culture_and_nationality.1.b: "少数民族和汉族都是中华民族的一部分，需要遵循平等团结自治原则"

 tranform_han_into_chinese_culture: "按照入则华夏出则蛮夷的原则，让认同华夏文化的民族（如汉族以及部分南方少数民族）先停止以民族血统分辨自身及他人，而是以文化区分自身和外国人。而剩下对华夏文化部分认可的民族，我们可以保留其自身独有的文化，而强化其对其华夏文化的认可。当然会有一些少民觉得难以接受，但是这正是我们要做的工作。"
 approver_is_sage: "入则华夏"
 disapprover_is_barbarian: "出则蛮夷"
 national_autonomy_will_begin: "我们要高举民族平等民族团结民族自治的大旗，让广大少数民族同胞与汉族一同真正成为国家的主人"
 national_autonomy: "民族自治"
 ethnic_minority: "少数民族政策"
 nation_expects_liberation: "少数民族的命运发生了根本的变化。他们再也不用以低人一等的姿态和别人说话，再也不会成为侮辱词语的代表，再也不用忍受惨无天日的生活，在民族政策的原则之下，少数民族群体终于获得了解放和自由。"

 je_culture_and_nationality_2: "中华文化归一统"
 je_culture_and_nationality_2_goal: "想要打到好结局，你需要的是#yellow 15年#!内没有文化分离内战进度达到15%。"
 je_culture_and_nationality_2_reason: "清朝的民族隔离政策，导致边疆民族离心离德，我们必须吸取过往的教训。大部分的少数民族同胞也是普通人，他们想的是过上现代化生活，想要的是融入华夏文明，而不是当蛮夷。如果我们想要让别人认可我们的文化，成就文化统一，就必须让少民一起加入国家建设，建造一座座美丽繁华的#yellow 城市#!，让大家一起生活在#yellow 平等和谐#!的社会之下。"

 culture_and_nationality.2.t: "都是中华儿女" 
 culture_and_nationality.2.d: "经过我们的不懈努力，我们终于摆脱了“民族”这一个血统论词语。认同“中华文化”的我们都是一家人。这是社会主义革命的一次伟大的胜利。"
 culture_and_nationality.2.f: "对待少数民族，我们可以教化认可，可以让其一起参加社会主义建设，我们也可以让其划分成一个民族，给予其自治权，让他们固步自封拒绝中华文化。后者是西方的固步自封式的血统民族价值观，对于他们来说没有中华那么宏大的文化，只能以血统地域划分民族，试图以血统地域等激发人们的认同感，对于我们五千年文化来说实在不需要如此。所以我们进行了伟大的文化认同运动，历史说明我们走对了。这是中华文化的胜利。"
 culture_and_nationality.2.a: "至此，中华再无民族之分，我们便是中华儿女"
 complete_national_reunification: "不分男女，不管老少，不分地域，只要你认同中华文化，我们都是中华文化的好儿女"

 culture_and_nationality.3.t: "反对民族分裂" 
 culture_and_nationality.3.d: "随着时间推移，有一部分少数民族秘密的勾结在了一起组成了一个秘密结社，准备自立门户，这是明显的分裂国家的行为"
 culture_and_nationality.3.f: "少数民族地区一直不安定，而中央的政策迟迟没有落实，没有落实就会让人生出异心，甚至产生了一个极其庞大的结社，以“反对独裁统治，谋求民族自治”为旗号，准备脱离中央的控制自立门户。当然，由于军队集中管控的原因，他们没有自己的军队，对付他们甚至只需要成立特别小组前往就好了。对于深谙此道的中央特科出身的康生来说，这不就是送到嘴边的肉嘛。我们只要希望不要有太多的人加入这个结社就好了。"
 culture_and_nationality.3.a: "必须要狠挖，大挖，特挖，把分裂国家的毒给肃清。"
 oppose_ethnic_division: "放心，康生会把事情办好的。"

 je_culture_and_nationality_3: "中华文化的传播"
 je_culture_and_nationality_4: "中华文化的传播"
 je_culture_and_nationality_3_reason: "至此，中国在文化系统中脱离了西方的民族叙事，建立起自己的文化叙事理论系统，强化了新民主主义革命的理论基础。也因此越来越多苦于寻找自身国家出路的人对中国的文化叙事理论产生了兴趣。"
 je_culture_and_nationality_4_reason: "至此，中国在文化系统中脱离了西方的民族叙事，建立起自己的文化叙事理论系统，强化了新民主主义革命的理论基础。也因此越来越多苦于寻找自身国家出路的人对中国的文化叙事理论产生了兴趣。"
 spread_chinese_culture: "每当中国获得一篇新的领土，它将会成为中华文化的本土，并且上面的民众会逐渐同化成中华文化。"


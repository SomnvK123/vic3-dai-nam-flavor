je_Peoples_Heroes_Monument_reason:0 "自鸦片战争以来，为了反对内外敌人，争取民族独立和人民自由幸福，多少英雄抛头颅、洒热血——三元里的刀矛映着落日，甲午海战的舰旗沉于深海，武昌城头的枪声划破长夜，长征路上的草鞋踏碎冰雪，渡江战役的船桨劈开浪涛\n\n他们无名无姓，却共同托举起这个民族的新生。如今，广场中央，这尊由千万块青石砌成的丰碑，正要为他们刻下永恒的名字。\n\n#yellow $je_Peoples_Heroes_Monument$#!会根据#v #tooltippable;tooltip:[Country.GetTooltipTag],je_french_community_house_pos 现行国内状况#!#!积攒#N 进度条#!，消耗#N 进度条#!就可以颁布一个政策"


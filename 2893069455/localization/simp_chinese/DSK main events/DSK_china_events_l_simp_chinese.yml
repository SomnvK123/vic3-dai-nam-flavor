je_Regain_Xinjiang: "收复新疆"
je_Regain_Xinjiang_reason: "夜观舆图，西域如孤悬之臂，北连蒙古，南接青藏，西控葱岭，东扼关陇。此臂若断，则中原腹地裸露于沙俄锋刃之下，如人失一臂，护心不得，何谈安寝？​\n\n或曰：“新疆荒寒，沙砾千里，得之不足富，失之不足惜。” 余抚图而叹：昔张骞凿空，非为求玉帛，乃为断匈奴右臂；班超投笔，非为逐水草，实欲固汉室西陲。自汉置西域都护，唐设安西都护府，此土便为中华肌体，\n\n偶有疥癣，终是血脉相连。今若弃之，如割股以啖狼，狼得肉而欲不止，明日必噬心腹。​\n\n闻英俄私议，欲分新疆为势力范围，俄占北疆以控蒙古，英据南疆以胁印度。彼辈眈眈，非贪戈壁之贫，实欲以新疆为跳板，东窥秦晋，南扰川滇。试思：若乌鲁木齐为俄营，喀什噶尔插英旗，则长安夜警，蜀道烽烟，何来 “河清海晏”？\n\n#v 夜阑人静，挑灯看剑，思及此，拍案而起：新疆必复！纵万里流沙，千重雪山，亦当挥师西向，犁庭扫穴，还我河山！#!"

 je_five_races_china_reason:0 "夫中国者，古今论之者众，其义非一。在我观之，非囿于族类之囿，实系于文化之脉。故曰：入诸夏者，即为诸夏；入夷狄者，即为夷狄。诸夏与夷狄，流转相生，而非判然两途，然其根皆环伺于华夏文明为宗之儒脉，如星拱北辰，如川归东海。\n\n[SCOPE.GetRootScope.GetCountry.GetName]之民咸以为：满汉蒙回藏，五族者，实[concept_dsk_china]之基，合为一族，则国族认同生焉。当使五族和乐共生，如手足相援，如筋骸相系，凝为一体。更当扬我文泽，使光华外溢，引万族向化 —— 非强之从，乃感其心。如此，则族类日融，如泰山积壤而愈高，如江河汇流而愈广。\n\n终至我[SCOPE.GetRootScope.GetCountry.GetName]之疆埸，非有涯际，非有尽处。盖文化所及，即为吾土；民心所归，即为吾疆。"







je_japan_korean_releation:0 "朝日关系"
je_japan_korean_releation_reason:0 "我朝于东亚之隅，与[SCOPE.sCountry('jap_scope').GetAdjective]为邻。两国之交，或亲或疏，其影响深远，不可不察。\n\n昔时，我朝与[SCOPE.sCountry('jap_scope').GetAdjective]，海道相通，文化互鉴，友谊绵长。若两国关系和睦，则百姓安居乐业，商贸繁荣，文化昌盛。吾等可借日本之技艺，以强我朝之实力；亦可传我朝之文明，以广我朝之声名。两国携手，共御外侮，东亚和平有望，百姓福祉可期。\n\n然世事无常，若与[SCOPE.sCountry('jap_scope').GetAdjective]关系不和，则兵戎相见，生灵涂炭。[SCOPE.sCountry('jap_scope').GetAdjective]狼子野心，窥伺我朝已久。一旦战事起，则山河破碎，百姓流离失所，哀鸿遍野。吾等虽欲安居乐业，然战火无情，生灵何辜？此乃我朝之大不幸也。\n\n且[SCOPE.sCountry('jap_scope').GetAdjective]若得势，必侵我朝之领土，掠我朝之财富，使我朝成为其附庸。我朝千年文明，将毁于一旦；百姓世代基业，将化为乌有。此乃我朝之奇耻大辱也。\n\n故我朝当审时度势，与[SCOPE.sCountry('jap_scope').GetAdjective]之交，宜和不宜战。然和战之道，在于实力。我朝当自强不息，富国强兵，以御外侮。若我朝强盛，则[SCOPE.sCountry('jap_scope').GetAdjective]不敢轻举妄动；若我朝衰微，则[SCOPE.sCountry('jap_scope').GetAdjective]必趁机而入。"



je_china_natural_borders_reason:0 "夫华夏之族，肇自炎黄，绵历五千载。诸夏之所以为诸夏，非独血脉相承，实赖疆土为基。昔三代经营，秦汉开拓，隋唐混一，宋元继轨，明清底定，凡此皆我先民胼手胝足，以血汗沃壤，以骨血固防。​\n\n观夫朔漠长风，犹带卫霍旌旗之色；岭南瘴雨，尚留伏波楼船之痕。昆仑积雪，映汉唐使者西行之辙；东海沧波，载郑和宝船扬帆之影。此非天授之土，乃百代英魂沥肝胆而铸就，亿兆黔首付身家以捍卫者也。​\n\n昔楚庄问鼎，王孙满对曰：“在德不在鼎。” 然德之所被，必以疆为域。若无尺寸之土，何以聚生民、兴礼乐？若无四至之界，何以别华夷、正纲常？前朝之疆，非一人一姓之私产，乃诸夏生民共托之命根。其版籍所及，皆历代中枢宣化之所，编户耕桑之地，文庙弦歌之乡。​\n\n今我族承绪，若弃前朝寸土，是忘大禹疏川之劳，轻蒙恬筑塞之苦，负郑成功复台之志，愧左宗棠收疆之忠。彼山川有灵，当泣血而问：何以弃吾于异类？彼先灵有知，必扼腕而叹：何以碎吾辈经营之业？​\n\n盖疆土者，非仅舆图之墨痕，实乃民族精神之图腾。江河为带，系吾族之魂；山岳为屏，铸吾族之骨。承其土，非贪广斥之利，乃守祖宗之信，护生民之安，续文明之脉。此非独法理所系，实乃天命人心之所归也。"

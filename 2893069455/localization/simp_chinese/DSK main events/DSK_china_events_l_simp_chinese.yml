notification_Human_experiments_desc: "将中国平民、战俘视作没有生命的“实验材料”，冠以“马路大”的侮辱性称谓，在冰冷的实验室里，他们无视人类基本的良知与道德，强行向实验者体内注射鼠疫、霍乱、炭疽等烈性病菌，观察其发病过程，记录痛苦的挣扎与死亡的轨迹，只为收集所谓的 “实验数据”。更令人发指的是，他们会在不施麻醉的情况下，对活人体内的器官进行活体解剖，看着实验者在剧痛中死去，脸上竟毫无愧色。"​

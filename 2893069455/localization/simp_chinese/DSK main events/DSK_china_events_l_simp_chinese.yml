je_xinwenhua: "新文化运动"
je_xinwenhua_reason: "当辛亥革命的硝烟在城头渐渐散入晨雾，那面撕碎帝制的旗帜还在风中猎猎作响时，一群长衫与西装混着的身影，已在故纸堆与新思潮的交界线上，点燃了另一簇火。这火叫新文化运动，是辛亥革命没烧透的思想荒原上，重新燃起的光——它要烧尽两千年来盘根错节的礼教藤蔓，要在君为臣纲的残垣上，种出科学与民主的新苗。\n那时的中国，像个刚挣脱枷锁的巨人，却发现筋骨里还缠着数不清的旧绳。孔家店的匾额在街市上晃得人眼晕，"三从四德" 的训诫还堵在少女的喉头，而西洋的坚船利炮早撞开了国门，却没人教国人如何在"自由"与"平等"的词眼里站稳脚跟。于是陈独秀提笔如剑，在《新青年》的版面上劈开一道缝："要拥护那德先生，便不得不反对孔教、礼法、旧伦理、旧政治。" 鲁迅的笔尖蘸着血与泪，让阿Q的影子在未庄的月光里晃，照见每个麻木灵魂里的病。\n\n#N 完成该[concept_journal_entry]后，我们可以建立C9联盟了#!"


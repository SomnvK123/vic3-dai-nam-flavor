objective_ra:0 "RA 历史时间线 DLC"
objective_ra_desc:0 "战争带来的苦难结束后，欧洲各国在维也纳会议上达成一致，为多灾多难的欧洲大陆重新建立起暂时的和平。然而，尽管革命之火已被扑灭，人权、民族主义和自由主义的理念仍然生机勃勃。在这个科技空前发展的时代，人们将怀疑先祖们世世代代所坚信不疑的事物，崭新的信条随之涌现。在大洋彼岸的远方，富饶的亚洲和非洲，黑暗世界的中心，竭尽全力地使他们的歌声能在欧洲列强的音乐会上占有一席之地。请选择你的乐器，开始演奏时代的旋律吧!"
objective_ra_name_JAP:0 "#v 日本幕府#!"
objective_ra_desc_JAP:0 "#v 日本在德川幕府的带领下已经享受了两百年的和平与繁荣，然而长期的闭关锁国也使其失去了与外部世界交流的机会，并逐渐落后于西洋各国。这个国家能否从即将到来的外部危机中幸存下来，成为东亚的新兴强权？#!"
objective_ra_name_CHI:0 "#v 中国#!"
objective_ra_desc_CHI:0 "#v 大丈夫七尺之身已许国，再难许卿。此去倘能生还，实属万幸，如遇不测，亦勿悲戚，将我的骨灰带回家乡，葬在春花浪漫的地方。此刻国运艰难，愿诸君奋勇向前，愿来日我等后辈远离这般苦难。#!"
objective_ra_name_SAR:0 "#v 撒丁-皮埃蒙特王国#!"
objective_ra_desc_SAR:0 "#v 自查士丁尼发动了对意大利的血腥远征以来，意大利已经在外族统治和分裂中度过了上千年，而意大利本身也早已成为了一个地理名词。\n雄心勃勃的撒丁国王卡洛·阿尔贝托正试图通过武力和改革来改变这一切，然而他的犹豫寡断和保守的统治成为了他野心的绊脚石。意大利统一运动已经兴起，在时代浪潮冲击下的撒丁将会走向何方？#!"
objective_ra_name_PRU:0 "#v 普鲁士王国#!"
objective_ra_desc_PRU:0 "#v 维也纳会议获得的资源和土地使普鲁⼠⾸次成为了⼀个欧洲⼤国，1834年成立的德意志关税同盟更是让它有了和奥地利叫板的资本。然而，在腓特烈·威廉三世治下，普鲁士日益走向了政治反动，秘密警察压制着每一个异议的声音。在保守与进步，现代化与传统之间的冲突中，普鲁士的未来将会何方，是成功夺得德意志的霸权，还是沦为历史的尘埃？#!"
objective_ra_name_SPA:0 "#v 西班牙王国#!"
objective_ra_desc_SPA:0 "#v 继承权之争将西班牙拖入到了一场血腥的内战之中，而执政的改革派内阁也是摇摇欲坠，宫廷阴谋和政变革命不断摧残着政府的运作能力。西班牙能否从内乱的伤痕走出，恢复日不落帝国的荣耀？#!"
objective_ra_name_TUR:0 "#v 奥斯曼帝国#!"
objective_ra_desc_TUR:0 "#v 奥斯曼帝国在马哈茂德二世的治下进行了一系列大刀阔斧的改革，但内外的局势仍然严峻，帝俄不断侵占帝国的土地，而埃及总督也对帝国剩余的领土虎视眈眈。奥斯曼能否挣脱内忧外患，重拾自己的列强地位？#!"
objective_ra_name_GRE:0 "#v 希腊王国#!"
objective_ra_desc_GRE:0 "#v 希腊在伦敦条约之后正式从奥斯曼手中取得了独立，然而希腊的前途仍笼罩在乌云中。来自巴伐利亚的奥托一世试图将来自巴伐利亚的行政体制和天主教传统强加于希腊人民之上，这引发了民众的普遍不满。外交形势也对希腊不利，失去了领土的奥斯曼帝国渴望着复仇，英俄为了争夺此地各自扶持起了亲己方的势力，这同时也激起了希腊政局的动荡。这个风雨飘摇的国家是否能摆脱外部干涉和内部的混乱，在国际舞台上占有一席之地？#!"
objective_ra_name_RUS:0 "#v 俄罗斯帝国#!"
objective_ra_desc_RUS:0 "#v 尼古拉一世统治下的俄国以东正教、独裁制和民族性三大治国原则为指导，对内实行集权和有限农奴制改革，对外则大力扩张，并干预西欧各国的革命运动。俄罗斯帝国已经达到了地理上的顶峰，然而，专制保守的统治和传统的经济模式拖延了帝国的现代化进程，贵族和教会死守着传统和信仰不放，而文学家和革命者们的低语则时刻提醒着这个帝国急需做出改变。俄国将会维持它作为欧洲宪兵的地位么？#!"
objective_ra_name_AUS:0 "#v 奥地利帝国#!"
objective_ra_desc_AUS:0 "#v 维也纳会议与梅特涅最后一次将这个国度推向欧洲舞台的中央，但普鲁士与俄罗斯的野心使哈布斯堡帝国的妥协政策岌岌可危。随着弗兰茨一世于1835年死去，奧地利国家的运转变得更加没有目的感和方向感。起初，梅特涅试图从新继位的费迪南皇帝手里获取独掌政局的权力，但约翰大公的介人挫败了他的企图。如今的奥地利已经陷入了权利斗争和政治僵化的泥潭中，奥地利将挣脱历史的迷雾，还是被革命的怒火所吞噬？#!"
objective_ra_name_FRA:0 "#v 法兰西王国#!"
objective_ra_desc_FRA:0 "#v 奥尔良王朝建立在一场革命之上，但新政权的妥协政策和国王折中的性格却使得各个派别都不满意。法兰西的社会已经陷入分裂，革命的话语正在街头中酝酿，保王党已经在思考着下一位国王的人选。国王路易·菲利普能否重新弥合法兰西，使它不被新的革命所摧毁？#!"
objective_ra_name_PER:0 "#v 波斯王国#!"
objective_ra_desc_PER:0 "#v 波斯正在埃米尔·卡比尔的领导下进行着一系列集权改革措施，但19世纪的中亚已沦为英俄两大列强的棋盘，光是夹缝求生就已经用尽全力了。\n波斯能否在列强手中夺回失去的边疆重返帝国时代，亦或是一个崭新的伊朗伊斯兰共和国出现在世人面前？#!"
objective_ra_name_USA:0 "#v 美利坚合众国#!"
objective_ra_desc_USA:0 "#v 美利坚合众国从欧洲列强手里维护了美洲的独立。然而，黑奴问题正日益撕裂着美利坚社会，废奴主义者和蓄奴主义者之间的妥协十分脆弱，而新加入的联邦州则成为了两派争端的前线。在这个冲突和机遇并行的世界，美利坚将走向何方？#!"
objective_ra_name_GBR:0 "#v 大英帝国#!"
objective_ra_desc_GBR:0 "#v 通过工业革命和一系列成功的内外政策，英国如今已经成为了当今世界上最强大的国家。然而工业革命带来的民权和卫生等问题仍在困扰着这个帝国，它的潜在竞争者也在伺机而动，在背后向帝国的敌人提供支持，这个新兴的霸权能否克服阻碍，将不列颠的荣耀带到世界的每一个角落？#!"
objective_ra_name_WAL:0 "#v 瓦拉几亚公国#!"
objective_ra_desc_WAL:0 "#v 瓦拉几亚在奥斯曼与俄国的争霸中被多次易手，而罗马尼亚领土统一和政治独立的呼声也导致其政局的动荡，瓦拉几亚能否从列强的枷锁中挣脱出来，实现罗马尼亚人的统一？#!"
objective_ra_name_EGY:0 "#v 埃及赫迪夫国#!"
objective_ra_desc_EGY:0 "#v 在穆罕默德·阿里的带领下，埃及正大踏步走向近代化，并通过一系列战争和扩张从摇摇欲坠的奥斯曼帝国手里夺取了大片的土地。然而，列强不愿看到一个强权在此崛起，并开始支持他的敌人。阿里能否克服阻碍，实现他建立阿拉伯帝国的野望？#!"
objective_ra_name_SER:0 "#v 塞尔维亚公国#!
objective_ra_desc_SER:0 "#v 塞尔维亚通过一场起义从奥斯曼手里获取了有限的独立，它能否更进一步，将自己的影响力扩展至整个巴尔干？#!"
objective_ra_name_MON:0 "#v 黑山公国#!"
objective_ra_desc_MON:0 "#v 黑山在列强争霸的夹缝中艰难维持着独立，它将走向什么样的未来？#!"
objective_ra_name_BIC:0 "#v 东印度公司#!"
objective_ra_desc_BIC:0 "#v 曾经辉煌的东印度公司如今已经债台高筑，它治下的人民已经充满了怨言，逐年走低的利润让伦敦也产生了解散其的想法。如果它无法阻止形势的进一步恶化，它的命运也将走向终结。#!"
objective_ra_name_BRZ:0 "#v 巴西帝国#!"
objective_ra_desc_BRZ:0 "#v 年轻的佩德罗二世刚登上皇位，他能否在摄政会议的辅佐下弥合巴西内部的分歧，带领巴西走向进步和强盛？#!"
objective_ra_name_SWE:0 "#v 瑞典王国#!"
objective_ra_desc_SWE:0 "#v 失去芬兰并通过共主联邦获得挪威之后，瑞典开始了缓慢的工业化进程，同时也在某些方面变得更自由。瑞典的未来会如何？#!"
objective_ra_name_NET:0 "#v 尼德兰王国#!"
objective_ra_desc_NET:0 "#v 尼德兰的南部行省已经脱离他们管辖6年，列强们纷纷保障它的独立。尼德兰是承认比利时独立，把目光转向东印度，还是拒绝《伦敦条约》，消灭南边这个“人造国家”？#!"
objective_ra_name_KAB:0 "#v 喀布尔#!"
objective_ra_desc_KAB:0 "#v 杜兰尼帝国的崩溃使其领土陷入了王位宣称者之间无休止的内战。雄心勃勃的埃米尔，多斯特·穆罕默德能否重新统一阿富汗，并在大国的博弈中生存？#!"
objective_ra_name_KOR:0 "#v 朝鲜王国#!"
objective_ra_desc_KOR:0 "#v 朝鲜的原宗主国正饱受鸦片困扰，对朝鲜庇护已显力不从心，北方的俄罗斯毛熊正拼尽全力想把影响力施加于朝鲜半岛，东方之日本，亦不甘寂寞，征韩论甚嚣尘上，对朝鲜半岛虎视眈眈。朝鲜能否在危险的三方博弈中幸存？还是在棋盘中沦为大国的牺牲品？#!"
objective_ra_name_QUE:0 "#v 下加拿大省#!"
objective_ra_desc_QUE:0 "#v 在圣劳伦斯河畔的暴风雪中，法裔加拿大人正用《#v 九十二条决议#!》的墨迹对抗伦敦的殖民敕令。英国总督的议会席位被英裔商人垄断，而法语学校的钟声正在《#v 1791年宪法法案#!》的夹缝中消逝。\n帕皮诺的羽毛笔已刺破蒙特利尔银行的地契账簿，塞纳河与泰晤士河的文化裂痕正撕裂下加拿大的冻土——当#v 圣让巴蒂斯特协会#!的民兵在枫糖浆桶里藏匿燧发枪时，魁北克城圣母圣殿的管风琴正为两种命运奏鸣：#bold 是成为大英帝国忠诚的冰封边疆？还是在北美大陆缔造第二个法兰西祖国？#!#!"
objective_ra_name_DAI:0 "#v 越南王国#!"
objective_ra_desc_DAI:0 "#v 明命帝治下的越南，正以“南天小中华”之姿臻于鼎盛：南并真腊、西拓哀牢，儒学教化遍推疆域，汉字礼制成为国本。然盛极之下，内有新附诸邦夷俗未化、叛乱隐现，外有暹罗虎视眈眈、西洋列强觊觎湄公河利益，北方清廷亦对其扩张心存戒备。越南能否延续“圣化万方”的霸业，在东亚变局与殖民浪潮中守住华夏文脉，成就中南半岛的长久一统？#!#!"
objective_ra_name_BEL:0 "#v 比利时王国#!"
objective_ra_desc_BEL:0 "#v 工业革命在比利时开展得如火如荼。荷兰人压迫的枷锁六年前才刚刚被取下，这个国家已经领先于前主人，开始了欧陆的第一条铁路的修建。他们的未来将会如何？#!#!"


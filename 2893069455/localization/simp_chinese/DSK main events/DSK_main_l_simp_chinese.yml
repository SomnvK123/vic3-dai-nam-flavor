 je_dsk_common_greatpower_reason:0 "十九世纪[SCOPE.sCountry('gbr_scope').GetName]地界上冒出一股黑烟，自此天地换了颜色。[SCOPE.sGoods('engines_scope').GetName]轰隆作响如同铁牛喘气，#o 曼彻斯特#!的纺织厂里棉絮飞舞，手摇纺车渐次沉寂，蒸汽轰鸣响彻云霄。泰晤士河上铁壳船犁开浊浪，#o 伦敦#!桥下煤灰染黑了白鸽翅膀，日不落帝国的版图被铁路钢钉一寸寸钉牢。\n\n工厂主叼着雪茄清点银币叮当响，童工蜷在织布机下啃硬面包。议会老爷们争论济贫法该松该紧时，利物浦码头正堆满[SCOPE.sCountry('bic_scope').GetName]的棉花与美洲蔗糖。机器转动卷走田园牧歌，雾都阴云里藏着千万根烟囱，把传统社会烧成满地炉渣。这场由[SCOPE.sGoods('coal_scope').GetName]和[SCOPE.sGoods('iron_scope').GetName]推动的变革，既造出新世界的齿轮，也碾碎了旧时代的纺锤——直到东方睡狮被炮舰惊醒，方知这工业的滔天巨浪早已漫过浩瀚的大西洋。"

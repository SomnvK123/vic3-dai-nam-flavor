 concept_super_power_desc:3 "超级大国是指拥有全球主导地位的[Concept('concept_country', '$concept_countries$')]，其特征是有能力在全球范围内通过经济、军事、技术、政治、文化、外交和软实力的综合手段来施加影响或投射力量。传统上，[Concept('concept_super_power','$concept_super_power$')]是[Concept('concept_great_power','$concept_great_power$')]中的佼佼者。虽然[Concept('concept_great_power','$concept_great_power$')]有能力在全球范围内发挥影响力，但[Concept('concept_super_power','$concept_super_power$')]的影响力如此之大，以至于国际社会在不首先考虑[Concept('concept_super_power','$concept_super_power$')]在问题上的立场的情况下无法采取任何重大行动。[AddLocalizationIf(GetPlayer.IsValid,'concept_super_power_desc_added')]"

RA_geng_xin:0 "6月21日RA更新内容"
RA_geng_xin_reason:0 "#v 新增内容#!#blue 比利时风味包#!包含140个事件和14个日志\n1.太平天国不能在共和制的中国生成\n2.大日本帝国ai成立的条件降低。\n3.山海意难平等一些老旧代码写法导致的时间丢失更新\n4.普鲁士回归1.13版本前的倾向，即不再倾向于索取奥地利地区\n5.一些法律文本更新，内容由@龙井殿提供。"
world_war_0:0 "世界大战"
world_war_0_reason:0 "第一次世界大战（1914年8月至1918年11月）是一场主要发生在欧洲但波及到全世界的世界大战。\n当时世界上大多数国家都卷入了这场战争。战争过程主要是同盟国和协约国之间的战斗。 德意志帝国、奥匈帝国和意大利是同盟国，英国、法国、俄罗斯帝国和塞尔维亚是协约国。\n在1914年至1918年期间，很多在亚洲、欧洲和美洲的国家都加入了协约国。战场主要在欧洲。\n值得注意的是意大利虽是同盟国，但是后来英国、法国及俄国与意大利签订密约，承诺给予意大利某些土地，结果意大利加入了协约国对抗同盟国。\n这场战争是欧洲历史上破坏性最强的战争之一。大约有65,000,000人参战，10,000,000左右的人失去了生命，20,000,000左右的人受伤。\n战争的导火索是1914年6月的萨拉热窝事件，战线主要分为东线（俄国对德奥作战），西线（英法对德作战）和南线（又称巴尔干战线）（塞尔维亚对奥匈帝国作战）。其中西线最惨烈，著名的战役有马恩河战役，凡尔登战役和索姆河战役。"


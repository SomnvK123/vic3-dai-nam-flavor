 hwangok_decision_1:0 "解决还谷的弊端（第一步）"
 hwangok_decision_1_desc:0 "想方设法解决还谷的弊端。"
 hwangok_decision_2:0 "解决还谷的弊端（第二步）"
 hwangok_decision_2_desc:0 "想方设法解决还谷的弊端。"

# 外交方针决定（这个有的）

korean_empire_dip: "外交方针决定"
korean_empire_dip_desc: "是时候决定走向哪里了。"
je_korean_restoration_yangjeon_a:0 "全国性大规模土地调查实施"
je_korean_restoration_yangjeon_a_reason:3 "朝鲜曾经历过多次关于税收制度的改革，税收标准也曾多样，但由于多种原因，长期以来一直以最低税率统一征收税款。\n然而，与古代圣贤时代不同，今天随着多个社会国家体系的崩溃，这种体制已经不再可持续，税款应征的地方未能征收，许多难以缴税的人承受了其他人的负担，形成了弊病。\n因此，通过被称为土地调查（양전）的土地调查项目，决定重新整顿混乱的税收制度。由于项目的规模庞大，预计需要很长时间（最少7年）。\n然而，既得利益者不会轻易放弃他们的利益，在税制正常化的过渡时期，现有的百姓们很可能会无意中遭受额外的税负压力。"
je_korean_restoration_yangjeon_a_goal:0 "等待新土地调查项目完成，或通过决策缩短时间。"

je_korean_restoration_yangjeon_b:0 "按地区逐步实施土地调查"
je_korean_restoration_yangjeon_b_reason:3 "朝鲜曾经历过多次关于税收制度的改革，税收标准也曾多样，但由于多种原因，长期以来一直以最低税率统一征收税款。\n然而，与古代圣贤时代不同，今天随着多个社会国家体系的崩溃，这种体制已经不再可持续，税款应征的地方未能征收，许多难以缴税的人承受了其他人的负担，形成了弊病。\n因此，通过被称为土地调查（양전）的土地调查项目，决定重新整顿混乱的税收制度。由于项目的规模庞大，预计需要很长时间（最少4年）。\n然而，既得利益者不会轻易放弃他们的利益，在税制正常化的过渡时期，现有的百姓们很可能会无意中遭受额外的税负压力。"
je_korean_restoration_yangjeon_b_goal:0 "等待新土地调查项目完成，或通过决策缩短时间。"

lia_jfp_deci_yangjeon:0 "增加土地调查预算"
lia_jfp_deci_yangjeon_desc:1 "每个季度可以向进行中的土地调查项目投入额外资金，以加速工作进度。\n所需金额根据国家经济实力而定，费用不容小觑，因此请在进度和国库之间找到平衡点。"

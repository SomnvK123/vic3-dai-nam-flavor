 #大韩帝国（已修复）

 je_korean_empire:0 "称帝建元"
 je_korean_empire_reason:0 "朝鲜不再是清的藩属国。我们将登基称帝，向世界昭告朝鲜民族的宏伟历史，以及优秀的文化传统。"
 korea_military_reward:0 "军制改革"
 korea_diplomatic_reward:0 "朝鲜外交"
 korea_production_reward:0 "近代式铁路"
 korean_empire.1.t:0 "宣布大韩民国成立"
 korean_empire.1.d:0 "我邦如今自主独立。今当立足于世界，令天下皆知大韓之号。"
 korean_empire.1.f:0 ""我邦乃三韩之地, 而国初受命, 统合爲一。 今定有天下之号曰‘大韩’, 未爲不可。无待声明于天下, 而天下皆知大韩之号矣。有天下之号旣定, 圜丘坛告由祭文及颁诏文。 竝以大韩, 书之可也。""
 korean_empire.1.a:0 "陛下将登基圜丘坛宣布大韩帝国成立。"
 korean_empire.1.b:0 "我们不能惹怒清国。"
 korean_empire.2.t:0 "树立外交战略"
 korean_empire.2.d:0 "新韩清晨到了。我们要树立外交战略。"
 korean_empire.2.f:0 ""我邦长时受他国侵凌。君子报仇十年不晚。我们终于等到了报复的时机。""
 korean_empire.2.a:0 "倭寇曾经做的坏事，必将受到回报。"
 korean_empire.2.b:0 "与日本进行外交协商。"
 korean_empire.2.c:0 "我们找回了大韩之名，该找回大韩之域了。"
 korean_empire.2.e:0 "放眼世界时期尚早。攘外必先安内。"
 korean_empire_journal:0 "放弃称帝建元"
 korean_empire_journal_desc:0 "我们要维持我们的本质。"
 korean_empire.3.t:0 "正式国旗的必要"
 korean_empire.3.d:0 "本来我国如东亚诸国没有象征国家的国旗。但随着国际环境的变化，我们逐渐觉得要制定国旗。"
 korean_empire.3.f:0 ""...又每船必立国旗，国旗是至贵至重之物, 若有甲国船假冒乙国旗号, 则视与海贼同, 乙国兵舰缉拏惩罚。""
 korean_empire.3.a:0 "我朝鲜已有御旗，当以御旗为国旗。"
 korean_empire.3.b:0 "卿所言极是。诸臣即刻制定我国国旗！"
 joseon_yuji:0 "维持朝鲜的国体。"


 #满洲



 #联合帝国（韩日联合没问题）

 je_Ilseontongjo_ron:0 "韩日同祖论"
 je_Ilseontongjo_ron_reason:0 "朝鲜民族与倭自古息息相关，有很多共同点。我们要集结极东的国力以抵抗洋溢的赤裸裸的威胁。"
 kju.2.t:0 "大韩与日本的联合帝国"
 je_jku_unity:0 "一个帝室，一个国家"
 je_jku_unity_reason:0 "两国宣布让位给共同的后继人，现在要准备将两国并在一起。"
 je_jku_unity_goal:0 "准备树立二元帝国"
 je_jku_ausgleich:0 "准备国婚"
 je_jku_ausgleich_reason:0 "国婚以确定，但两国之间还有很多间隔。我们要从小事一个一个整理，首先要决定谁与谁以什么形式结婚。"
 je_jku_ausgleich_goal:0 "寻找找候选人"
 je_jku_wait:0 "准备未来"
 je_jku_wait_reason:0 "国婚成事，两皇室合二为一。我们要从小事一个一个融合。"
 je_jku_wait_goal:0 "准备改变"
 jku_ausgleich_complete_tt:0 "等待时机"
 jku_wait_complete_tt:0 "等待时机"
 jku_unity_complete_tt:0 "等待时机"
 kju_tenwin_tt:0 "戊辰战争中尊王派胜利"
 jku.1.t:0 "接近日本皇室"
 jku.1.d:0 "尽管我们国家大力宣扬[SCOPE.sCulture('korean_culture').GetName]民族和[SCOPE.sCulture('japanese_culture').GetName]民族拥有共同的祖先，但并不代表日本人也同意这种说法，也许是时候该听取[SCOPE.sCountry('jap_restoration_161_ruler_scope').GetName]皇室的意见了。"
 jku.1.f:0 ""自三国时代以来[SCOPE.sCulture('korean_culture').GetName]与日本是血盟，两国之间来往频繁，亲如兄弟。如今面临巨大的威胁，我们要恢复以前的血盟关系。""
 jku.1.a:0 "等待答复"
 jku.2.t:0 "虚设事件"
 jku.2.d:0 "虚设事件"
 jku.2.f:0 "虚设事件"
 jku.2.a:0 "虚设事件"
 jku.3.t:0 "[SCOPE.sCountry('jap_restoration_162_ruler_scope').GetName]使臣到达"
 jku.3.d:0 "[SCOPE.sCountry('jap_restoration_162_ruler_scope').GetName]皇家派使臣来说愿在两皇家之间树立密切的关系。"
 jku.3.f:0 ""两国的国婚是为了东方的和平，国婚将奠定两国良好关系与美好未来的基础。""
 jku.3.a:0 "没有理由拒绝。"
 jku.4.t:0 "宣布禅让"
 jku.4.d:0 "为了[SCOPE.sCountry('jap_restoration_165_ruler_scope').GetName]与[SCOPE.sCountry('jap_restoration_166_ruler_scope').GetName]的无限发展与永远的合一，两国皇帝将让位给两国共同的嫡子。"
 jku.4.f:0 ""静观两国的深交、百姓的往来、皇室的联手，将两国皇室合二为一必定为美事。虽两国的帝国议会办事妥善，吾国皇帝与天皇健在，为了两国和平共存，我等于此宣布让位。念及皇孙尚幼需要大人帮助，吾国皇帝与天皇将在三年后让位，成为新皇帝的上皇。""
 jku.4.a:0 "宣布让位。"
 jku.5.t:0 "决定国婚"
 jku.5.d:0 "[SCOPE.sCountry('jap_restoration_163_ruler_scope').GetName]皇室与[SCOPE.sCountry('jap_restoration_164_ruler_scope').GetName]天皇家合二为一的道路上有许多坎坷。"
 jku.5.f:0 ""日本即在旭日东升一方的国家，朝鲜即晨光净土，二者无异。两国皇室的联合将升华成为大东方联合。""
 jku.5.a:0 "任重道远。"
 jku.6.t:0 "货币合并"
 jku.6.d:0 "为了纪念两皇室的统一，有些人提议自国婚日开放两国之间的货币市场。将[SCOPE.sCountry('jap_restoration_301_ruler_scope').GetName]的通宝与[SCOPE.sCountry('jap_restoration_302_ruler_scope').GetName]的货币先混合使用，之后再统一标准。"
 jku.6.f:0 ""合并两国的货币经济一定利大于弊，而中间许多坎坷是不可免的。首先从规定明确的换率，允许货币的交叉使用开始吧。""
 jku.6.a:0 "许可货币交叉使用"
 jku.7.t:0 "议会两岸制"
 jku.7.d:0 "为了日后政局的稳定，我们要加强[SCOPE.sCountry('jap_restoration_303_ruler_scope').GetName]议会与[SCOPE.sCountry('jap_restoration_304_ruler_scope').GetName]议会间的交流。"
 jku.7.f:0 "[SCOPE.sCountry('jap_restoration_303_ruler_scope').GetName]议会与[SCOPE.sCountry('jap_restoration_304_ruler_scope').GetName]有明显的不同，比如在选举机制、投票人数、表决权等地方。但通过充分友好地交流，终会消除我们之间的差异。"
 jku.7.a:0 "依为。"
 jku.8.t:0 "统合外务部"
 jku.8.d:0 "一些人提议统合两国外务部，将各自的外交官集结在一起，这样可以避免职责不清的问题。"
 jku.8.f:0 ""两国以皇室之名组建二元帝国需要在外交上统一意见。愿设立共同外交部管理外务，以两国共同人士均衡管理外务以免日后的非议。""
 jku.8.a:0 "设立统合外务部"
 jku.9.t:0 "设立韩日统合军"
 jku.9.d:0 "有人提议除管理治安的必须兵力以外建立两国统合军，否则军队之间互不隶属容易造成战场上无法配合的毛病。有经验的军官请求我们能尽快统合两国军队，避免像奥匈军队那样语言不通，互相离心离德。"
 jku.9.f:0 ""将使用不同军制、语言的两国军统合起来一定很困难，但以充分的资源安排充分的口译人力，公正平等地整备[SCOPE.sCountry('jap_restoration_305_ruler_scope').GetName]和[SCOPE.sCountry('jap_restoration_306_ruler_scope').GetName]的干部与士兵翻译肯定有所必要。""
 jku.9.a:0 "设立统合军"
 jku.10.t:0 "统一司法部"
 jku.10.d:0 "有人提议合并两国的司法体系建立统合司法部，避免出现类似治外法权的情况，加剧[SCOPE.sCountry('jap_restoration_307_ruler_scope').GetName]与[SCOPE.sCountry('jap_restoration_308_ruler_scope').GetName]社会之间的矛盾。"
 jku.10.f:0 ""两国之间来往频繁，皇室为一，对两国人民适用不同的司法体系会加深两国人民之间的沟壑。我们要整顿法律体系，合并两国的司法制度。""
 jku.10.a:0 "批准两国司法部合二为一"
 jku.11.t:0 "统合议会"
 jku.11.d:0 "我们不能对议会的分裂坐以待毙。我们要统合[SCOPE.sCountry('jap_restoration_309_ruler_scope').GetName]与[SCOPE.sCountry('jap_restoration_310_ruler_scope').GetName]的上下两院。"
 jku.11.f:0 ""依吾之见，不如先后合并两国的上下两院，选出共同的议长吧！之后再规定两国的共同选举日，按人口比平均分配两国各省各道的议席。""
 jku.11.a:0 "可以，快确定好日子吧。"
 jku.12.t:0 "国婚"
 jku.12.d:0 "今日两国帝室相见，共分御酒，举办宴席，决定日后[SCOPE.sCulture('korean_culture').GetName]民族与[SCOPE.sCulture('japanese_culture').GetName]民族成为一家。朝鲜半岛与日本列岛许多城市的居民，也共同参与了这次盛大的庆典。"
 jku.12.f:0 "甚好！甚好！今后，无论是[SCOPE.sCulture('korean_culture').GetName]人，还是[SCOPE.sCulture('japanese_culture').GetName]人，大家都是一家人，为我们共同的祖先干杯！为我们东亚文明干杯！"
 jku.12.a:0 "万岁万岁万万岁!"
 jku.13.t:0 "皇家的喜事"
 jku.13.d:0 "帝室传来了好消息，是男孩子！当娃娃啼哭的声音响起，周边的帝室亲属纷纷鼓起掌，庆祝这一激动的时刻。"
 jku.13.f:0 ""[SCOPE.sCountry('jap_restoration_321_ruler_scope').GetName]曰姓李名堈，[SCOPE.sCountry('jap_restoration_322_ruler_scope').GetName]曰强仁，此乃[SCOPE.sCountry('jap_restoration_321_ruler_scope').GetName]皇帝的皇世孙,[SCOPE.sCountry('jap_restoration_322_ruler_scope').GetName]天皇嫡系内亲王之长子，堪称万世一系的皇室正统。""
 jku.13.a:0 "恭喜恭喜！这个孩子代表了我们两国皇室共同的爱情结晶，也是我们两国友好的象征，希望他未来能带领东亚人民在世界占据一席之地。"
 jku.14.t:0 "制定统一货币"
 jku.14.d:0 "一国不能有两种货币。我们要通过充分的时间将货币体系合并在一起。"
 jku.14.f:0 ""自初一起称货币为环。一环为百钱，一钱为十厘。两年后禁止以下货币与债务的往来。\n\n 1. 圆单位的韩国银行券与朝鲜银行券 \n 2.  円单位的朝鲜银行券，朝鮮銀行仕拂手形，日本政府钞票，日本政府铸货 ""
 jku.14.a:0 "依为之"
 jku.15.t:0 "真正的统一：万世一系帝国皇室"
 jku.15.d:0 "自今天，[SCOPE.sCountry('jap_restoration_167_ruler_scope').GetName]与[SCOPE.sCountry('jap_restoration_168_ruler_scope').GetName]都已不再。合而为一的韩日二元帝国将成为东方新明珠。"
 jku.15.f:0 ""代表万世一系皇帝陛下的[SCOPE.sCountry('jap_restoration_167_ruler_scope').GetName]与[SCOPE.sCountry('jap_restoration_168_ruler_scope').GetName]的统合议会的联合共同领地-韩日二元帝国。""
 jku.15.a:0 "万岁万岁万万岁！"
 jku.16.t:0 "统一刑法"
 jku.16.d:0 "先于司法体制的革新，我们要首先将两国各自的刑法与司法体系一元化，不能让本应死刑之人设法逃往另一国，以获得减刑。"
 jku.16.f:0 ""未经审判证明有罪确定前，在刑法不变的大原则上推定被控告者无罪。日后统一刑法，再按标准给被控告者定罪。""
 jku.16.a:0 "按时进行吧"
 jku.17.t:0 "首都与国教事宜"
 jku.17.d:0 "随着韩日二元帝国的成功建立，许多议员向[SCOPE.sCharacter('korean_restoration_400_ruler').GetFullName]提出申请草案，希望尽快确定[SCOPE.sCountry('jap_restoration_401_ruler_scope').GetName]的首都和国教。"
 jku.17.f:0 "[SCOPE.sCharacter('korean_restoration_400_ruler').GetFullName]陛下，您是我们东亚的明君，更是天照大神的后裔，诸臣建议撤走这些大儒，把确立陛下您权威的工作交给祠官。\n臣还以为，新朝新气象，陛下移驾新都，方能彰显皇族体恤人民、爱护百姓一面，臣有如下方案，请陛下您查阅。"
 jku.17.a:0 "定都历代天皇故居——京都"
 jku.17.b:0 "定都原幕府江户城——东京"
 jku.17.c:0 "定都原韩日两国交界处——九州"
 jku.17.e:0 "确立神道教为国本可以，但迁都就不用麻烦了"
 jku.17.i:0 "还是安抚本土派吧"

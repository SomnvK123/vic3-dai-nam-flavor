 #内在完整性（已修复）

 republic_of_korea.10.t:0 "发达的半岛国家"
 republic_of_korea.10.d:0 "随着我们工业化的迅速发展，平民百姓人人都有衣服穿，可以轻松购买到美味的加工食品。朝鲜半岛的富裕，已然让别的国家居民纷纷用脚投票，收拾行李奔向我们的国家。"
 republic_of_korea.10.f:0 "只依靠朝鲜半岛，我们可以与列强比肩了。这在过去简直是不可想象的，尤其是回忆起几十年前的朝鲜半岛，还是那个官僚人人盘剥百姓，遍地都是饿殍的封建社会。"
 republic_of_korea.10.a:0 "[SCOPE.sCulture('korean_culture').GetName]民族万岁！"
 je_hikikomori:0 "内治优先"
 je_hikikomori_reason:0 "三千里江山足矣，何需再战？不如提高我等朝鲜人民的生活水平，让外国人尽情羡慕我们发达的城市，以及舒适的生活吧。"
 je_hikikomori_goal:0 "达成小康社会"


 #清朝改革（全部没有，当然RA有洋务运动了）

 je_reformation_of_qing:0 "帝国改革"
 je_reformation_of_qing_reason:0 "康乾盛世以后，大清国日益颓败。为了日后的生存，我们需要大规模改革帝国。"
 je_reformation_of_qing_goal:0 "完成改革吧。"
 reformation_of_qing.1.t:0 "大清使节访问"
 reformation_of_qing.1.d:0 "朝鲜改革的消息传到了北京，大清的使节团访问了朝鲜。"
 reformation_of_qing.1.f:0 ""听说朝鲜经历了很大的变化，如今亲自目睹令我等刮目相看。皇上也愿知改革的秘方。""
 reformation_of_qing.1.a:0 "天下还在中华秩序下。帮助大国的改革吧。"
 reformation_of_qing.1.b:0 "何必帮助鞑虏？"
 reformation_of_qing.2.t:0 "朝鲜表示愿意帮助改革"
 reformation_of_qing.2.d:0 "朝鲜的学者访问了北京，他们对清朝的开化派传达了知识。"
 reformation_of_qing.2.f:0 "清朝学者们热烈欢迎朝鲜学者的来访。"
 reformation_of_qing.2.a:0 "与他们合作"
 reformation_of_qing.2.b:0 "没有改革的必要。"
 reformation_of_qing.3.t:0 "改革成功"
 reformation_of_qing.3.d:0 "改革终于成功了。"
 reformation_of_qing.3.f:0 "旧势力都被驱除，清朝向改革开放的道路迈了第一步。"
 reformation_of_qing.3.a:0 "大清万岁!"
 reformation_of_qing.4.t:0 "清朝的改革成功"
 reformation_of_qing.4.d:0 "清朝改革成功了。"
 reformation_of_qing.4.f:0 "清的旧势力都被驱除，清朝向改革开放的道路迈了第一步。"
 reformation_of_qing.4.a:0 "可喜可喜！"
 reformation_of_qing.5.t:0 "中华帝国的崛起，军阀混战"
 reformation_of_qing.5.d:0 "北京汉族造反，在屠杀皇族与贵族。"
 reformation_of_qing.5.f:0 "清朝即将破灭。"
 reformation_of_qing.6.t:0 "中华帝国的崛起，军阀混战"
 reformation_of_qing.6.d:0 "北京汉族造反，在屠杀皇族与贵族。"
 reformation_of_qing.6.f:0 "自中国传来了噩耗。北京发生了叛变，皇族被大肆屠杀，中原鹿死谁手占地称王。朝廷束手无策。存活的皇帝与百官愿流亡至朝鲜。"
 reformation_of_qing.6.a:0 "将他们安置在国境附近。"
 reformation_of_qing.6.b:0 "将他们安排在宫内最好的位置"
 reformation_of_qing.7.t:0 "清帝入宫"
 reformation_of_qing.7.d:0 "自北京避难至汉城的清帝入宫了。"
 reformation_of_qing.7.f:0 "在变乱之中皇族除皇帝尽数遭难，皇帝也身负重伤。需要立即治疗。"
 reformation_of_qing.7.a:0 "我们要尽力治疗皇帝"
 reformation_of_qing.8.t:0 "皇帝崩殂"
 reformation_of_qing.8.d:0 "尽管所有医官尽力治疗皇帝，皇帝还是死了，留了一句遗言。"
 reformation_of_qing.8.f:0 ""天朝颓败，皇统断绝，社稷不再。朕愿忠实的朝贡国朝鲜继承中华帝国。" 皇帝将传国玉玺递给了殿下。现在该殿下判断了。"
 reformation_of_qing.8.a:0 "遵照遗言。(中原军阀会表示强烈的不满。)"
 reformation_of_qing.8.b:0 "任中华帝国破灭."
 reformation_of_qing.9.t:0 "中国军阀的攒动"
 reformation_of_qing.9.d:0 "朝鲜王声称继承清皇位，汉族军阀表示不会坐视不理。"
 reformation_of_qing.9.f:0 "军阀联合军将进攻朝鲜。"
 reformation_of_qing.9.a:0 "要明确告诉他们谁是中原的主人。"
 reformation_of_qing.10.t:0 "朝鲜天子诞生"
 reformation_of_qing.10.d:0 "朝贡国朝鲜已不再。统治中原是朝鲜明确的命运。"
 reformation_of_qing.10.f:0 ""朕将登基天子，统治中原万民""
 reformation_of_qing.10.a:0 "天子陛下万岁！"

 #东征日本（已特色化完成）

 je_japan_invasion:0 "征日论"
 je_japan_invasion_reason:0 "当今世界各国纷争，弱肉强食。欧美列强纷争不断无法留心东亚。我们应当趁此机会吞并日本作为大韩的领土。"
 je_japan_invasion_goal:0 "准备吞并日本。"
 je_japan_invasion_second:0 "测量日本列岛"
 je_japan_invasion_second_reason:0 "知彼知己百战不殆。我们要先做好日本的地图。"
 je_japan_invasion_second_goal:0 "测量日本列岛"
 je_japan_invasion_third:0 "日本列岛中的利害关系"
 je_japan_invasion_third_reason:0 "我们要在日本列岛持有利害关系。"
 je_japan_invasion_third_goal:0 "赶走觊觎日本列岛的其他列强吧。"
 ji_global_4_tt:0 "
 dp_japan_invasion:0 "显示在日本列岛的绝对地位。"
 heart_of_iron:0 "钢铁之心"
 heart_of_iron_desc:0 "这位领袖有一颗如钢铁般顽强的心，其意志坚强令人生心敬畏。"
 brave_fox:0 "绝境之狐"
 brave_fox_desc:0 "这位领袖即使身处绝境，也能带领队伍寻得战局的转机。"
 shizuoka_treaty_tt:0 "与日本签订条约"


 japan_invasion.1.t:0 "完成关于征日论的论议"
 japan_invasion.1.d:0 "自古以来我倭瓜葛不断，现在是时候给他们点颜色看了。"
 japan_invasion.1.f:0 "当今我国之强足以征服东亚他国。愿陛下允许征日，宣扬我国国威。"
 japan_invasion.1.a:0 "报复倭寇的时候到了。"
 japan_invasion.2.t:0 "扬武号事件"
 japan_invasion.2.d:0 "正在测量日本列岛的扬武号进入骏河湾时遭到了伊豆半岛日本军的威胁性炮击。"
 japan_invasion.2.f:0 "扬武号带着测量日本的和平任务来到了骏河湾，日本军以炮弹相待。"
 japan_invasion.2.a:0 "对射!"
 japan_invasion.2.b:0 "先撤退吧。"
 japan_invasion.3.t:0 "扬武号事件"
 japan_invasion.3.d:0 "大韩帝国的舰船到达了伊豆半岛，我军发出了警告性射击，大韩帝国军以炮弹相对。"
 japan_invasion.3.f:0 ""...于此，朝鲜国朝廷声称带着和平目的的船只忽然受到攻击而被迫反击。他们也许计划以此为凭与皇国签订不平等条约。""
 japan_invasion.3.a:0 "没辙，答应他们。"
 japan_invasion.3.b:0 "我们不会与他们谈判的。"
 japan_invasion.4.t:0 "日本拒绝签署条约"
 japan_invasion.4.d:0 "日本拒绝了与我们签订条约。"
 japan_invasion.4.f:0 ""大君主陛下。关于此事，倭国朝廷声称这不是他们的过错，反而要求我们赔款。愿陛下令我等出兵惩罚倭寇！""
 japan_invasion.4.a:0 "命帝国军元首府准备动员令。出兵！"
 japan_invasion.5.t:0 "静冈条约"
 japan_invasion.5.d:0 "日本屈服于我们的要求，签订了通商建交条约。"
 japan_invasion.5.f:0 "[SCOPE.sCountry('korean_restoration_121_ruler_scope').GetName]与[SCOPE.sCountry('korean_restoration_122_ruler_scope').GetName]素敦友谊，历有二百余年所，今因视两国情意未洽，欲重修旧好，以固亲睦。\n \n 第一款 [SCOPE.sCountry('korean_restoration_121_ruler_scope').GetName]自主之邦，保有与[SCOPE.sCountry('korean_restoration_122_ruler_scope').GetName]平等之权。"
 japan_invasion.5.a:0 "准备下一阶段"
 japan_invasion.6.t:0 "静冈条约"
 japan_invasion.6.d:0 "通过签署条约，我们解决了燃眉之急。"
 japan_invasion.6.f:0 "我们被迫与胆敢私称皇帝国的朝鲜签订了条约。名目上看似平等，但实质上明显对我日本国不利..."
 japan_invasion.6.a:0 "是么……"
 japan_invasion.7.t:0 "日本列岛争夺战"
 japan_invasion.7.d:0 "我们为了加大在日本列岛的影响力，应当赶走其他列强。"
 japan_invasion.7.f:0 "益闻社奏曰[SCOPE.sCountry('country_123').GetName]的洋夷最近开始攒动，在倭地加大了影响力。帝国军元首府主张要立即赶走他们，加强对倭地的控制。"
 japan_invasion.7.a:0 "敢动我们的地盘，直接攻击这群洋夷!"
 japan_invasion.7.b:0 "让他们一步吧。"
 japan_invasion.8.t:0 "第二次韩日协定"
 japan_invasion.8.d:0 "日本列岛中我们的影响力不容忽视。日本已经成为了我们的傀儡。"
 japan_invasion.8.f:0 "日本政府今后非由韩国政府仲介，则不得缔结有国际的性质之任何条约或约束。"
 japan_invasion.8.a:0 "事必归正。"
 jap_not_existnow_ttt:0 "日本国已不复存在"

 # 东学农民运动（已补齐）
 cheondoism:0 "天道教"
 je_donghak_countdown:0 "农民的不满"
 je_donghak_countdown_reason:0 "农民要求朝廷改革。"
 je_donghak_war:0 "东学农民起义"
 je_donghak_war_reason:0 "农民忍无可忍，纷纷起义。我们要以刀枪说话了。"
 je_donghak_war_2:0 "东学农民起义"
 je_donghak_war_2_reason:0 "与朝廷的谈判决裂，我们要以刀枪说话了。"
 je_donghak_reconstruction:0 "重建事业"
 je_donghak_reconstruction_reason:0 "内战使全国荒废，让我们农民从废墟中站起来，开始重建我们的家园吧。"
 je_donghak_equality:0 "内战后的处理"
 je_donghak_equality_reason:0 "这次叛乱很大程度上，是由于官员贪污腐败造成的。要想解决这个问题，防止再次出现农民起义，我们至少要让一步，还农奴们一片自由。"
 donghak_complete_law:0 "制定农民法"
 donghak_reconstruction_progress:0 "重建事业"
 je_donghak_gun:0 "农民国家的未来方针"
 je_donghak_gun_reason:0 "起义获得了成功，我们要讨论朝鲜民族未来前进的方向。有人提出，我们可以找一位李氏宗室出任我们的国君，以起到笼络人心和团结朝鲜的作用。也有人表示，要建立一个农民领导的共和国，不愿让任何王公贵族重新回来压迫...这场关于国家未来的宪法与政体辩论注定持久。"
 je_donghak_gun_goal:0 "耐心等待。"
 je_donghak_find_king:0 "寻找新的王"
 donghak_civil_war:0 "东学农民起义爆发"
 donghak_war_tt_complete:0 "击溃农民军"
 donghak_will_happen_tt:0 "东学农民起义爆发"
 donghak_je_events.1.t1:0 "东学农民起义爆发"
 donghak_je_events.1.t2:0 "对朝廷的反弹"
 donghak_je_events.1.d1:1 "南方农民发生起义，宣布成立一个所有人都能分到耕地、拥有选举资格的邪恶政权。"
 donghak_je_events.1.d2:1 "朝廷决定讨伐我们，我们不会束手就范的。"
 donghak_je_events.1.f1:1 ""我们不能将国家大事让给无知的农民，他们必将为自己所作所为付出血的代价。""
 donghak_je_events.1.f2:0 ""农为天下之本，疏忽根本的国家迟早会灭亡的。""
 donghak_je_events.1.a:0 "镇压这群农民反贼。"
 donghak_je_events.1.b:0 "对抗压迫我们的腐朽政府。"
 je_donghak_countdown_goal:0 "在4个月内满足以下条件 :"
 donghak_rebels:0 "东学农民军"
 donghak_political_power:0 "农民集结"
 donghak_political_power2:0 "更多农民集结"
 donghak_boeun_assembly_bad:0 "事态恶化"
 donghak_boeun_assembly_good:0 "事态转好"
 donghak_complete:0 "解决纠纷"
 donghak_sangso_acceptance:0 "受理上疏"
 donghak_revolts:0 "叛乱的预兆"
 donghak_revolts_landowners:0 "两半的抗拒"
 donghak_events.1.t:0 "异教的传播"
 donghak_events.1.d:0 "越来越多的农民在几个煽动分子的带领下，相信所谓东学的奇怪宗教。据传，这种教派认为“儒之伦理、佛之觉性、仙之养气，乃人性之自然品赋”，很明显，这是在抢夺我们对儒家的定义权。"
 donghak_events.1.f:0 ""人乃天，侍人如侍天。人若修行成果，则可将肉体与神合而为一。""
 donghak_events.1.a:0 "继续观望。"
 donghak_events.2.t:0 "报恩集会"
 donghak_events.2.d:0 "一些东学教徒集结在报恩市场，展开了东学集会。"
 donghak_events.2.f:0 ""神与人之间无须中介，可以直接交往。诸位体内皆有神灵，如愿侍奉天主，即可达人乃天境地。此非外夷所信基督之神可达也。""
 donghak_events.2.a:0 "捉拿领导，罚他十下棍子"
 donghak_events.2.b:0 "解散他们。"
 donghak_events.3.t:0 "异教的扩散"
 donghak_events.3.d:0 "东学教徒中出现了新的势力，我们要留神他们，不能再让这群邪恶的教徒蛊惑我们[SCOPE.sCountry('korean_restoration_200_ruler_scope').GetName]善良的农民。"
 donghak_events.3.f:0 "若想达到人神合一境界，需达成三大纲领：性身换信、规模一致和至人公爱；践行四大诫命：不作有反复之心的逆理者，有物欲弊端的鄙陋者，用空话诱人的惑世者，两面三刀的欺天者。"
 donghak_events.3.a:0 "我们静观其变。"
 donghak_events.5.t:0 "和平解决"
 donghak_events.5.d:0 "我们成功废除了传承百年的农奴制度，朝廷和[SCOPE.sCulture('korean_culture').GetName]农民的纠纷已不再。是时候创造更好的未来了。"
 donghak_events.5.f:0 "天主并不能解救你们于苦难之中，而朝廷可以。挣脱地主的束缚吧，我亲爱的[SCOPE.sCulture('korean_culture').GetName]子民，从今以后，官后民先，[SCOPE.sCharacter('korean_restoration_201_ruler').GetFirstName]会带领大家实现富国强兵！"
 donghak_events.5.a:0 "[SCOPE.sCountry('korean_restoration_201_ruler_scope').GetName]的意识形态将不再分裂"
 donghak_events.6.t:0 "全彰爀的上疏"
 donghak_events.6.d:0 "农民对腐败官僚的不满逐渐上升，纷纷抗拒两湖的古阜郡守赵秉甲，以全彰爀为代表提交了请愿书。"
 donghak_events.6.f:0 "赵老爷曾许诺我们免收田税，谁知秋天他又反悔，要我们缴纳根本还不起的田税。他还强迫我们去修那个贮水池，好几个不服从的弟兄都给他打死了...请[SCOPE.sCharacter('korean_restoration_202_ruler').GetFullName]大人做主啊，小民的钱已经全被赵老爷敲诈走了，眼下已经没有活路了。"
 donghak_events.6.a:0 "你竟敢诽谤赵郡守，对得起自己的父母官吗？来人，罚他十大板。"
 donghak_events.6.b:0 "受理他的请愿书。"
 donghak_events.7.t:0 "古阜民乱"
 donghak_events.7.d:0 "古阜郡守赵秉甲贪得无厌，而我们对赵秉甲的办事不妥，直接导致农民忍无可忍，纷纷起义表示不满。"
 donghak_events.7.f:0 "上疏的全彰爀被赵秉甲以”乱民“为由直接乱棍打死了，许多农民伏尸痛哭。他的乡亲们将他的遗体埋葬在后院，除了悲伤，更多能感受到有一股危险的气氛在农民之间蔓延。"
 donghak_events.7.a:0 "快去镇压。"
 donghak_events.7.b:0 "让他们一步。"
 donghak_events.8.t:0 "白山起义"
 donghak_events.8.d:0 "愤怒的[SCOPE.sCulture('korean_culture').GetName]农民打出了“惩办贪官污吏和斥倭斥洋”的口号，各道均发生袭击官厅，盗窃武库的叛乱，其中以茂長县最为严重。"
 donghak_events.8.f:0 "茂長县4000个[SCOPE.sCulture('korean_culture').GetName]农民与流浪民集结，发表了包含提倡人们为了肃清贪官，辅国安民而起义内容的倡议文。高敞、井邑、泰仁等地的农民纷纷呼应，举着辅国安民的旗帜集结在白山..."
 donghak_events.8.a:0 "准备好军队，将这群叛乱分子统统消灭！"
 donghak_je_events.2.t:0 "重建国家"
 donghak_je_events.11.t:0 "重建国家"
 donghak_je_events.2.d:0 "[SCOPE.sCulture('korean_culture').GetName]政府军被击溃了。建立农民之国度的时候到了。"
 donghak_je_events.11.d:0 "农民军被击溃了，我们要尽快重建[SCOPE.sCulture('korean_culture').GetName]国家，弥合官民之间的分裂。"
 donghak_je_events.2.f:0 "惊异的事件发生了。农民军击溃了政府军，[SCOPE.sCulture('korean_culture').GetName]政局一片混乱。让我们尽快建立农民国家，弥合分裂，使政局安定下来吧……"
 donghak_je_events.11.f:0 "政府军出色的击溃了农民军，让农民清楚认识到[SCOPE.sCharacter('korean_restoration_210_ruler').GetFullName]的权威不容挑战。尽管我们取得了胜利，但监狱里塞满了太多造反分子，警示我们要尽快完成重建[SCOPE.sCulture('korean_culture').GetName]国家的任务。"
 donghak_je_events.2.a:0 "开始重建吧。"
 donghak_je_events.3.t:0 "新[SCOPE.sCulture('korean_culture').GetName]"
 donghak_je_events.3.d:0 "[SCOPE.sCountry('korean_restoration_220_ruler_scope').GetName]的混乱时代成功画上了句号，我们成功结束了内战给彼此之间带来的伤痕。"
 donghak_je_events.3.f:0 "农民大乱终于成了过去，[SCOPE.sCountry('korean_restoration_220_ruler_scope').GetName]恢复了新的秩序。三千里的江山上，重新恢复了秋日清风，晴空万里的景色。 "
 donghak_rebirth_of_korea:0 "新朝鲜"
 donghak_je_events.3.a:0 "我们[SCOPE.sCulture('korean_culture').GetName]民族是一个整体，无论时过境迁，爱国的心永存。"
 donghak_je_events.4.t:0 "农民的要求"
 donghak_je_events.4.d:0 "为了避免[SCOPE.sCountry('korean_restoration_221_ruler_scope').GetName]再度分裂，我们不能欺压作为国家根本的农民，应该倾听他们的意见。"
 donghak_je_events.4.f:0 "国以民为本，农民为民之大数。如若不从之，则东学之祸恐怕再度掀起，届时[SCOPE.sCharacter('korean_restoration_222_ruler').GetFirstName]大人，您我的脑袋可能不保啊..."
 donghak_je_events.4.a:0 "听取农民的意见。"
 donghak_je_events.4.b:0 "如果他们再敢叛乱，我会让这些农民的子孙一起掉脑袋。"
 donghak_je_events.5.t:0 "战后处理"
 donghak_je_events.5.d:0 "我们成功废除了长久的农奴制，给予了农民一定的自由。但这群农民们又提出了更进一步的要求，希望[SCOPE.sCharacter('korean_restoration_223_ruler').GetFullName]能通过宅地法。"
 donghak_je_events.5.f:0 "政府军出色的击溃了农民起义，但不能保证永远能打败占我们国家人口多数的[SCOPE.sCulture('korean_culture').GetName]农民。这次东学异端引起的叛乱规模已经足够大了，也许是时候颁布新的土地法律，收拢农民们的民心。"
 donghak_je_events.5.a:0 "制定新法。"
 donghak_je_events.5.b:0 "我们不会改革的。"
 donghak_je_events.6.t:0 "制宪会议的讨论结果"
 donghak_je_events.6.d:0 "我们取得了革命成功，但胜利从来不只是在军事方面，内政同样重要。这次制宪会议多方提出了不同的国家未来方针，我们必须做出决定，守护住我们[SCOPE.sCulture('korean_culture').GetName]农民来之不易的胜利果实。"
 donghak_je_events.6.f:0 "清理完革命的废墟，今当尽快安国抚民。首先我们要决定将谁作为国家之首，其次我们要决定国家为何种政体，最后我们要制定完成一本代表所有[SCOPE.sCulture('korean_culture').GetName]人利益的宪法。"
 donghak_je_events.6.a:0 "将李家宗室的近亲选为新的国王。"
 donghak_je_events.6.b:0 "将李家宗室的远亲选为新的国王。"
 donghak_je_events.6.c:0 "带领我们革命的现任领袖，担任第一任总统"
 donghak_je_events.6.e:0 "建立人人平等的农民共和国。"
 donghak_je_events.6.g:0 "维持现状。"
 find_king:0 "拥戴新王"
 enacted_serfdom_banned:0 "支持农民改革"
 delayed_serfdom_banned:0 "拖延农民改革"
 donghak_je_events.7.t:0 "新王即位" #哲宗
 donghak_je_events.7.d:0 "我们拥戴了李家宗室的近亲作为新王。"
 donghak_je_events.7.f:0 "思悼世子与良娣林氏的儿子，也就是恩彦君李䄄，他的孙子李昪将作为我们的新王。李昪自幼在江华岛与一般百姓一同生活，不仅是王室教育，连一般学问素养也没有。"
 donghak_je_events.7.a:0 "新朝鲜，新气象。"
 donghak_je_events.8.t:0 "新王即位" #高宗
 donghak_je_events.8.d:0 "我们拥戴了李家宗室的远亲作为新王。"
 donghak_je_events.8.f:0 "新王是英祖的玄孙，也就是兴宣君李昰应的次子李熙，儿名“命福”.李熙虽然只是旁支，但自幼聪慧、喜欢钻研西方科技的他，肯定能带领我们[SCOPE.sCulture('korean_culture').GetName]民族实现复兴。"
 donghak_je_events.8.a:0 "新[SCOPE.sCulture('korean_culture').GetName]，新气象。"

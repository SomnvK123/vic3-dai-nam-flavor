 #干预戊辰战争（缺失事件文件！！）

 bosin_intervention.1.t:0 "日本内战"
 bosin_intervention.1.d:0 "据说日本发生了内战。"
 bosin_intervention.1.f:0 ""日本传来了噩耗。萨摩藩国与长州藩国的首领占领了日王所在的京都欲挟天子，江户城中幕府军为了救天皇举兵了。双方都急需我国的救援，朝廷应分明是非做出决定。""
 bosin_intervention.1.a:0 "与我邦何干？"
 bosin_intervention.1.b:0 "帮助幕府"
 bosin_intervention.1.c:0 "帮助尊王派"
 bosin_intervention.2.t:0 "出兵准备完毕" #幕府篇
 bosin_intervention.2.d:0 "自幕府而来的使臣曰，站在日王一方的就是叛军。"
 bosin_intervention.2.f:0 "萨摩与长州本是反幕府的逆贼藩国，如今进军京都挟天子号称皇军反指幕府为逆贼，切勿听信他们的谎言。但怕他们实力强大危害我天皇。原朝鲜国王怜悯我们，出兵救我。"
 bosin_intervention.2.a:0 "取消出兵"
 bosin_intervention.2.b:0 "攻击萨摩。"
 bosin_intervention.3.t:0 "出兵准备完毕" #天皇篇
 bosin_intervention.3.d:0 "自京都而来的使臣曰，幕府是期满天皇逼迫百姓的逆贼。"
 bosin_intervention.3.f:0 "听说至今以日王之名送来国信的不是日王，而是所谓将军。今日一些忠贞死士举兵抗战，虽是邻邦之事，不可袖手旁观。我们当尽可能提供帮助，支援他们的义举。"
 bosin_intervention.3.a:0 "取消支援。"
 bosin_intervention.3.b:0 "支援。"
 bosin_intervention.4.t:0 "自朝鲜的支援到达了。" #天皇
 bosin_intervention.4.d:0 "朝鲜送来了武器与支援金。"
 bosin_intervention.4.f:0 ""听说至今以日王之名送来国信的不是日王，而是所谓将军。今日一些忠贞死士举兵抗战，虽是邻邦之事，不可袖手旁观。我们当尽可能提供帮助，支援你们的义举。""
 bosin_intervention.4.a:0 "美哉!"

 #朝鲜民主化（已特色化补齐完成）

 je_republic_of_korea_first:0 "关于引进立宪君主制的议论"
 je_republic_of_korea_first_reason:0 "改革逐渐走向完结，该引进西方的民主制度了，既能满足民众的需要，也能提高我们王室的合法性。"
 je_republic_of_korea_first_goal:0 "开始议论引进立宪君主制吧。"
 je_republic_of_korea_second:0 "引进立宪君主制"
 je_republic_of_korea_second_reason:0 "讨论结果很多人同意引进立宪君主制。分配权力的时间到了。"
 je_republic_of_korea_second_goal:0 "废除专制"
 je_daehan_war:0 "大韩内战"
 je_daehan_war_reason:0 "我们要赶走专制势力，为朝鲜民族建立崭新的、民主的、强大的韩国。"
 je_daehan_war_goal:0 "统一朝鲜半岛。"
 je_spearhead_of_democracy_jp:0 "民主主义的尖兵 : 向日本进军 "
 je_spearhead_of_democracy_jp_reason:0 "日本幕府与大名数千年来欺压可怜的日本人民。即使成功倒幕，维新政府依然在压迫他们的人民，工人没有安全保障，农民要承受极高的地租，底层平民十有八九面露饥色。作为东亚的民主灯塔，是时候派出我们朝鲜的军队，将自由与民主之风扩散到日本的百姓。"
 je_spearhead_of_democracy_cn:0 "民主主义的尖兵 : 向中国进军 "
 je_spearhead_of_democracy_cn_reason:0 "中国尽管有着几千年辉煌的历史，但他们几乎从来没有实现过民主，大皇帝一句话，就可以让远方的百姓为他奴役，敢反抗就要掉脑袋。尤其是当前的大清皇帝，更是昏庸无德，引得百姓四处逃荒，食不果腹。是时候派出我们朝鲜的军队，将自由和民主传播到中国吧。"
 republic_of_korea.1.t:0 "关于引进共和制的议论的结果"
 republic_of_korea.1.d:0 "无数的讨论后，我们得出了结论。"
 republic_of_korea.1.f:0 "夏桀商纣不听忠言，沉迷于女色而成了亡国之君。今上虽是圣君，但殊不知后来会不会出现燕山君或光海君之类的暴君、暗君呢？于此，应当设立宰相制度以辅佐君王，防止孟子所说的恶毒匹夫出现。"
 republic_of_korea.1.a:0 "引进立宪君主制。"
 republic_of_korea.1.b:0 "立宪君主制不符于性理学。"
 republic_of_korea.2.t:0 "揭穿共和派"
 republic_of_korea.2.d:0 "一群邪恶的共和派分子，密谋推翻国家建立共和国，还好我们的警察把他们全部逮捕了。"
 republic_of_korea.2.f:0 ""殿下！一些胆敢加害于圣上的玉体，将周代混乱的共和期引进朝鲜的逆贼一派被捕了！观看他们的言行，肯定有残余势力。愿陛下通过严刑拷打惩罚他们！""
 republic_of_korea.2.a:0 "处死，要用最痛苦的方式"
 republic_of_korea.2.b:0 "通过拷问，捉拿其余残党"
 republic_of_korea.3.t:0 "民主主义的幻想"
 republic_of_korea.3.d:0 "许多百姓在民主主义的旗帜下团结在一起，希望[SCOPE.sCountry('korean_restoration_108_ruler_scope').GetName]能成为一个民主的国家。"
 republic_of_korea.3.f:0 "《尚书》云，天视自我民视，天听自我民听。朝廷重臣怎能忽视民意私论政治！朝廷大臣为非作歹的现在万民也在高呼民主，立即承天命实施民主！"
 republic_of_korea.3.a:0 "立即解散他们"
 republic_of_korea.3.b:0 "处死主谋者，并将其以异议朝政的罪名斩首示众"
 republic_of_korea.4.t:0 "关于引进立宪君主制的议论失败了"
 republic_of_korea.4.d:0 "我们需要的不是权力的分配，而是强有力的国家。"
 republic_of_korea.4.f:0 "[SCOPE.sCulture('korean_culture').GetName]在君弱臣强的环境下饱受折磨，尔等焉敢再度陷于怪力乱神欲将本邦置于水深火热之中？我们现在需要的是相信圣上维新朝鲜！"
 republic_of_korea.4.a:0 "增强王权吧"
 republic_of_korea.4.b:0 "王族余孽还敢在共和国口出狂言？"
 republic_of_korea.4.c:0 "这些李朝余孽不足为惧，我们应该重点去帮助中国人和日本人实现民主，构建一个民主的东亚文化圈。"
 republic_of_korea.5.t:0 "引进立宪君主制"
 republic_of_korea.5.d:0 "我们[SCOPE.sCountry('korean_restoration_109_ruler_scope').GetName]成为了更先进的国家，拥有不逊色于西方各国的民主宪法。现在，[SCOPE.sCulture('korean_culture').GetName]民族是该立足于世界舞台上了。"
 republic_of_korea.5.f:0 "朕的祖先中也有许多先皇犯了过错。于此，朕宣布听取臣民的谏言实施立宪君主制，防止昏君误国。"
 republic_of_korea.5.a:0 "让我们[SCOPE.sCulture('korean_culture').GetName]同胞团结一起，走向崭新的世界吧"
 republic_of_korea.5.b:0 "也许不只是[SCOPE.sCulture('korean_culture').GetName]同胞，我们还要让中国人和日本人也拥抱民主"
 republic_of_korea.6.t:0 "爆发内战"
 republic_of_korea.6.d:0 "没能成功和平导入共和制，激进改革派竖起大韩民国的旗帜举兵了。"
 republic_of_korea.6.f:0 ""大韩民国的主权属于国民，一切权力来源于国民。""
 republic_of_korea.6.a:0 "拿下反动分子，斩首示众！"
 republic_of_korea.6.b:0 "为民主主义而战斗。"
 republic_of_korea.7.t:0 "大韩民国的胜利"
 republic_of_korea.7.d:0 "大韩民国终于统一了朝鲜半岛。反动势力都逃外了。现在要呼应人民的喊声了。"
 republic_of_korea.7.f:0 "全大韩的人民们！我们赶走了欺压我们的李家王朝与反动派。我们摆脱了封建体制的束缚。我们不再是朝鲜的百姓，我们是大韩民国的人民！愿我们能永享自由。"
 republic_of_korea.7.a:0 "我们要解放其它国家的人民。"
 republic_of_korea.7.b:0 "我们要举办一场盛大的凯旋仪式，纪念我们新生的民主共和国。"
 republic_of_korea.8.t:0 "解放日本"
 republic_of_korea.8.d:0 "我们成功从封建势力的手中解放[SCOPE.sCountry('jap_restoration_109_ruler_scope').GetName]的贫苦民众，将民主与自由的浪潮传向[SCOPE.sCountry('jap_restoration_109_ruler_scope').GetName]各地。"
 republic_of_korea.8.f:0 "日本幕府与大名数千年来欺压可怜的人民。在我们军队的帮助下，[SCOPE.sCountry('jap_restoration_109_ruler_scope').GetName]封建势力一扫而空，并召开了第一届民主议会制定宪法。这不仅是[SCOPE.sCulture('korean_culture').GetName]军队的胜利，更是民主的胜利，我们成功将自己享受到的自由，传播给日本的百姓。作为自由人，我们给予了他们获得自由的机会，如愿赶走了当地的封建势力，夺回了属于他们的自由！"
 republic_of_korea.8.a:0 "祝我们两国友谊万岁！"
 republic_of_korea.8.b:0 "让我们[SCOPE.sCulture('korean_culture').GetName]百姓和[SCOPE.sCulture('japanese_culture').GetName]百姓一起欢呼吧。"
 republic_of_korea.9.t:0 "解放中国"
 republic_of_korea.9.d:0 "我们成功从封建势力的手中解放中国，为他们带来先进的自由与民主思想。"
 republic_of_korea.9.f:0 "中国人三千年来饱受封建君主的残暴统治，即使有幸出几位明君，也如大海中一滴水，十分少见。频繁的改朝换代，并没能改善中国百姓的生活。就比如过去，自称大清国的官僚与所谓的天子也在榨取民脂民膏果腹，我们却曾拜这样的国家为上国。我们要扫清惭愧的过去，为了将自由与民主扩散至中国人民，不惧任何战争。现在，我们自由的大韩人，成功履行了义务，给中国人民带来了自由！"
 republic_of_korea.9.a:0 "民主的中国永远是我们[SCOPE.sCulture('korean_culture').GetName]民族的好朋友！"
 republic_of_korea.9.b:0 "让我们[SCOPE.sCulture('korean_culture').GetName]民众和[SCOPE.sCulture('han_culture').GetName]族民众一起欢呼吧！"
 republic_of_korea.11.t:0 "平安道的英雄"
 republic_of_korea.11.d:0 "一位出生在平安南道大同郡的金氏男子，在几次与洋夷和倭寇的交锋中，取得不小的胜利。他灵活出色的游击战术，和魅力四射的品质，吸引了不少[SCOPE.sCulture('korean_culture').GetName]年轻人从军，加入了他的队伍。"
 republic_of_korea.11.f:0 "这名男子还曾加入过共产青年同盟，声称[SCOPE.sCulture('korean_culture').GetName]之所以能够可靠的捍卫祖国的安全和人民的幸福，都是因为[SCOPE.sCulture('korean_culture').GetName]军民以“以一当百”的精神武装了起来。此外，他还主张用马列主义思想来打倒敌人，建设国家。"
 republic_of_korea.11.a:0 "这样的男人未来肯定能成为[SCOPE.sCulture('korean_culture').GetName]族的领袖"
 republic_of_korea.11.b:0 "先让他在政局磨练下能力吧。"
 republic_of_korea.11.c:0 "优秀的将领就该呆在自己的军营里。"
 republic_of_korea.12.t:0 "虚弱的国王"
 republic_of_korea.12.d:0 "国王李昪平时经常纵酒狂欢，这直接导致他身体快速恶化，倒在床上不起。雪上加霜的是，国王竟没有一个儿子活到成年，[SCOPE.sCulture('korean_culture').GetName]王位恐怕又将陷入一场争夺。"
 republic_of_korea.12.f:0 "国王在安东金氏的控制下，毫无实权，这严重打击了他积极进取的从政信念，转而沉湎酒色，以至于今日身体虚弱，奄奄一息。御医认为国王回天乏术，朝堂外开始有大臣讨论起继承人的事，出乎意料的是，赵大妃竟然没有听从金氏家族拥立王孙的建议。"
 republic_of_korea.12.a:0 "幸运的是，大妃支持拥立兴宣君之子李命福继承王位"

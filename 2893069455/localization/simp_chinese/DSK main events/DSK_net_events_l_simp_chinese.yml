dsk_net.1.f:0 "摆在我们面前的有两条路。\n一种是接受列强的调和，承认[SCOPE.sCountry('bel_scope').GetName]的独立地位，发展属于[SCOPE.GetRootScope.GetCountry.GetName]的新道路。\n一种是拒绝签署《伦敦条约》，不顾列强的阻挠回到我们过去的帝国荣光时代。"

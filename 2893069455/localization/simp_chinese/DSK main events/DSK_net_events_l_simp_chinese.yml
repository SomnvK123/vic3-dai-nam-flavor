twin_empires_action_break_name::0 "打破[concept_twin_empires]"
je_Nederland_Make_Great_Again:0 "三位一体"
je_Nederland_Make_Great_Again_reason:0 "六年前，我们南部的行省在列强的支持下脱离了我们而独立建国成为了现在的[SCOPE.sCountry('bel_scope').GetName]。南部的领土是我们最为富饶且工业化程度最高的领地，失去这些是我们万万不能接受的。\n我们需要统一低地国家。[SCOPE.GetRootScope.GetCountry.GetName]，[SCOPE.sCountry('lux_scope').GetName]，[SCOPE.sCountry('bel_scope').GetName]三国人民将再次与我们一同崛起！让我们重建荷兰之“联合王国”"
decision_Nederland_true_colony:0 "荷兰殖民地优化"
decision_Nederland_true_colony_desc:0 "做出这个决定将使荷属安的列斯群岛等事物处于正确的位置"
decision_Treaty_of_London_of_1839:0 "伦敦条约"
decision_Treaty_of_London_of_1839_desc:0 "签署一项正式承认比利时独立和中立的条约将改善世界对我们的看法。"
Make_Nederland_Great_Again_events.1.t:0 "荷兰殖民地优化"
Make_Nederland_Great_Again_events.1.d:0 "Victoria3没有充分呈现1836年时荷兰控制的殖民地。具体而言，没有阿鲁巴等荷属安的列斯群岛。做出这个决定，荷属安的列斯群岛等地将被放置在适当的状态中。"
Make_Nederland_Great_Again_events.1.f:0 "正如应有的那样！"
Make_Nederland_Great_Again_events.1.a:0 "将加勒比海带回荷兰！"
Make_Nederland_Great_Again_events.1.b:0 "不再显示这个决定"
Make_Nederland_Great_Again_events.1.c:0 "容我三思"
Make_Nederland_Great_Again_events.2.t:0 "伦敦条约"
Make_Nederland_Great_Again_events.2.d:0 "比利时在1831年比利时革命期间以武力夺取了事实上的独立。前殖民统治者荷兰不情愿地承认比利时的独立。然而，在1839年，荷兰勉强与欧洲各大强国签署了一项承认比利时独立的条约，正式承认比利时的独立和中立。我国将失去对比利时的主权，作为交换，世界对我们的看法将得到改善。"
Make_Nederland_Great_Again_events.2.f:0 "英国和德国为一纸文件而战吗？- 德国总理泽博尔特·冯·贝特曼·霍尔韦格"
Make_Nederland_Great_Again_events.2.a:0 "签署条约"
Make_Nederland_Great_Again_events.2.b:0 "容我三思"
Make_Nederland_Great_Again_events.3.t:0 "荷兰联合王国"
Make_Nederland_Great_Again_events.3.d:0 "我们正在统一低地国家。低地国家的人民将再次与我们一同崛起！"
Make_Nederland_Great_Again_events.3.f:0 "'我会继续前行' - [SCOPE.GetRootScope.GetCountry.GetName]的座右铭"
Make_Nederland_Great_Again_events.3.a:0 "这是我们的使命！"
Make_Nederland_Great_Again_events.3.b:0 "容我三思"
je_Nederland_Amsterdam:0 "闪耀的阿姆斯特丹"
je_Nederland_Amsterdam_reason:0 "从18世纪开始，阿姆斯特丹的繁荣开始褪色。[SCOPE.GetRootScope.GetCountry.GetName]连年爆发与[SCOPE.sCountry('gbr_scope').GetName]和[SCOPE.sCountry('fra_scope').GetName]之间的战争，打击了处于巅峰的[SCOPE.sState('great_state_scope').GetName]。直到1815年，摆脱[SCOPE.sCountry('fra_scope').GetName]统治的[SCOPE.GetRootScope.GetCountry.GetName]与[SCOPE.sCountry('bel_scope').GetName]和[SCOPE.sCountry('lux_scope').GetName]组成荷兰王国，这座城市才迎来了发展的第二次春天。\n随着工业革命在欧洲大陆的开展以及海运时代的到来，我们有必要乘上时代的快车，将我们的[SCOPE.sState('great_state_scope').GetName]打造成欧洲繁华的港口城市"
je_Nederland_Amsterdam_tt:0 "加快建设[SCOPE.sState('great_state_scope').GetName]"
je_Nederland_Coachman:0 "东印度群岛的主人"
je_Nederland_Coachman_reason:0 "1596年，我们的霍特曼船上率领的一支船队到达爪哇岛的万丹，此后几十年，我们不断在这片土地建立商站。直到1799年，东印度公司解散后殖民地被[SCOPE.GetRootScope.GetCountry.GetName]政府接管，史称[SCOPE.sCountry('dei_scope').GetName]，简称荷印。\n殖民当局长期奉行商业垄断和殖民扩张的双重政策。[SCOPE.sCountry('dei_scope').GetName]为我们提供了数不胜数的宝藏和珠宝。我们也会确保对其领土的统治领先其他欧洲列强。"
je_Nederland_Coachman_tt:0 "我们统治着东印度群岛"
je_Nederland_Make_Great_Again_tt:0 "重建荷兰之联合王国"
lca_german_italy.15.t:0 "普奥战争已经爆发"
lca_german_italy.15.d:0 "普奥战争已经爆发"
lca_german_italy.15.f:0 "我们成功履行了承诺没有参与到他们的战争"
lca_german_italy.15.a:0 "现在我们可以移除对他们的义务"

support_dei_button_desc:0 "我们把大量的人口和东印度群岛的土地划给我们的殖民政府管辖，他们理应对我们保持忠诚"
not_already_supporting_our_DEI_button:0 "每五年可以降低一次独立倾向"
modifier_support_from_net:0 "[concept_overlord]的影响"
dsk_net_time:0 "荷兰宪法"
je_Nederland_and_dutch_east_indies:0 "奥伦治-拿骚王朝"
je_Nederland_and_dutch_east_indies_reason:0 "我，拿骚的[ROOT.GetCountry.GetRuler.GetFirstName]，#yellow 奥兰治#!亲王，[SCOPE.GetRootScope.GetCountry.GetName]的国王，[SCOPE.sCountry('lux_scope').GetName]大公，[SCOPE.sCountry('dei_scope').GetName]的拥有者，流着日耳曼的血液，忠于祖国，坚守这信念，直到死亡。\n\n我敬畏上帝，我的主，我所皈依。我亲爱的人民、土地，是我的动力；上帝引领，如良器帮助着我。我必定会回来，回到我的祖国。\n\n我多灾难的人民，我纯朴的人民；尽管眼前的苦难，上帝不会抛下你。虔诚祈祷，不论白天或是黑夜：让主赐予我力量；我就能帮助你。"

je_Nederland_and_dutch_east_indies_tt:0 "上帝保佑我们伟大的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]"
je_Nederland_Alliance:0 "低地国家联盟"
je_Nederland_Alliance_reason:0 "让低地国家[SCOPE.sCountry('bel_scope').GetName]团结到我们的旗帜下。"
je_Nederland_Shipbuilding:0 "造船业的发展"
je_Nederland_Shipbuilding_reason:0 "发展造船业，提高我们的[SCOPE.sGoods('clippers_scope').GetName]产量以支持我们的航道"
je_Nederland_Shipbuilding_2:0 "工业造船业的发展"
je_Nederland_Shipbuilding_2_reason:0 "世界各国正在迈入工业化，将我们的传统优势行业造船业产业转型，提高我们的[SCOPE.sGoods('steamers_scope').GetName]产量"
je_Nederland_king_of_Coachman_tt:0 "过去的荣光不会消逝"
je_Nederland_king_of_Coachman:0 "海上马车夫"
je_Nederland_king_of_Coachman_reason:0 "当时的世界贸易通道主要在海上，船在当时就像陆路运输的马车一样，船就是海上的马车，哪个国家掌握了海上的马车，就意味着掌握了海上贸易。\n[SCOPE.GetRootScope.GetCountry.GetName]在海洋贸易中扮演主要角色，我就是海上的马车夫，现在，我们有必要发挥我们的传统优势，控制商道，并将[SCOPE.sGoods('glass_scope').GetName]和[SCOPE.sGoods('porcelain_scope').GetName]销往世界各地。"
je_Nederland_Japan:0 "荷兰日本通商条约"
je_Nederland_Japan_reason:0 "在[SCOPE.sCountry('jap_scope').GetName]的闭关锁国时期，所有的外国船只严禁进入国土境内，同样的，日本本土的所有船只没有国家的批准也严禁出国，所有胆敢违反这个法律的人都要被处以极刑。\n但是唯独我们可以在日本的长崎进行贸易往来，1641年以后，[SCOPE.sCountry('jap_scope').GetName]只是允许在长崎这一个城市和荷兰与中国通商，长达两个世纪左右的时间里，日本对西洋文化的了解都仅限于荷兰商人带来的文献。在其他西方列强到来之前，垄断在长崎的贸易可以让我们收获颇丰！"
je_Nederland_Empire:0 "荷兰帝国"
je_Nederland_Empire_reason:0 ""荷兰人到了亚洲，占领台湾，控制了日本的对外贸易，印尼变成他们的殖民地；在非洲，他们从葡萄牙手里抢下了好望角；在大洋洲，他们用荷兰的一个省命名了一个国家——新西兰；南美洲他们一直占领到巴西；在北美的哈得逊河河口，荷兰人建立了一个新的城市，新约克，也就是大家熟知的纽约。"——在我们过去100年的历史中，我们如此伟大且疯狂。现在，我们终于有实力重建这一切，回到世界的巅峰，唱着历历在目的辉煌。"
je_Nederland_Kingdom:0 "尼德兰王国"
je_Nederland_Kingdom_tt:0 "我们的王国，自由而无畏"
je_Nederland_Kingdom_goal:0 "完成三项王国改革"
je_Nederland_Kingdom_reason:0 "从15世纪开始，尼德兰（Netherlands）这个名字就开始被使用作为国名。但是与英国或法国不同，这个名称并不是起源于民族名称，而是由地名转化而来。严格来说，荷兰是指尼德兰（Netherlands）中一个地区的名称，也就是北荷兰省与南荷兰省两地的合称。在七省联合共和国时代，荷兰被用来转喻代指尼德兰（Netherlands）整体。另一个常见的俗称，称他们为Dutch，用于称呼荷兰的主要族群，也就是荷兰人（Nederlanders）。这个单字源自英语，由德意志（Deutsch）这个单字分化出来，最早来自拉丁语：Theodiscus，本义为部落的，或人民的。\n1581年，从[SCOPE.sCountry('spa_scope').GetName]获得独立之后，[SCOPE.GetRootScope.GetCountry.GetName]发展成为17世纪航海和贸易强国，经济、文化、艺术、科技等各方面均非常发达。[SCOPE.GetRootScope.GetCountry.GetName]的商船数目超过欧洲所有国家商船数目总和，被誉为“海上马车夫”。我们在世界各地建立殖民地和贸易据点。这段时期在荷兰被称为“黄金年代”。1810年，荷兰并入[SCOPE.sCountry('fra_scope').GetName]。1814年，荷兰脱离[SCOPE.sCountry('fra_scope').GetName]，1815年，我们成立#yellow 荷兰王国#!。\n虽是低地小国，但我们自由而无畏！"
je_Nederland_navy:0 "王国海军"
je_Nederland_navy_reason:0 "发展王国海军让我们重回黄金时代！"
je_Nederland_develop:0 "王国民生"
je_Nederland_develop_reason:0 "让我们的人民生活变得更加富足！"
je_Nederland_government:0 "王国政府"
je_Nederland_government_reason:0 "改革我们的政府让我们成为君主立宪之国！"
je_Nederland_Kingdom_house:0 "荷兰议会"
je_Nederland_Kingdom_house_tt:0 "议会正在行使职能"
je_Nederland_Kingdom_house_reason:0 "1848年宪法规定荷兰实行世袭君主立宪制。立法权属国王和议会，行政权由内阁执行。\n一院议员每四年全体改选一次，选举在省议会选举后的三个月内进行。\n二院议员任期最长为四年。凡有选举权者均有权组建政党参议会选举。在政府失去议会信任时、执政联盟解体时、议员任期届满时或者无法形成执政联盟时均将进行议会选举。参加选举的政党必须在选举前的43天注册，并提供一份涵盖全国范围的候选人名单。名单上的第一候选人一般负责领导该政党的竞选活动。而获得二院最多席位的政党的第一候选人往往会出任首相。荷18岁以上公民均有投票权，但刑期超过一年的囚犯除外。选票可投给任何一位候选人。\n\n#yellow 荷兰议会#!会根据#v #tooltippable;tooltip:[Country.GetTooltipTag],je_Nederland_Kingdom_house_pos 现行法律#!#!积攒议会的#N 行政点#!，消耗#N 行政点#!可以让国会颁布政策"
je_Nederland_Kingdom_house_pos: "以下条件将每个月#bold 积攒#!#N 行政点#!：\n•执行任何#yellow 选举形式#!（#green +3#!）。\n•执行任何#yellow 内务机构#!（#green +2#!）。\n•执行任何#yellow 卫生机构#!（#green +1#!）。\n•执行任何#yellow 福利机构#!（#green +1#!）。\n•执行任何#yellow 商品化农业#!或#yellow 宅地法#!（#green +1#!）。"
net_kingdom_navy_button:0 "发展王国海军"
enough_Nederland_Kingdom_house_var:0 "#N 行政点数大于50#!"
net_kingdom_navy_button_desc:0 "王国海军代表着我们远洋作战能力"

dsk_net.9.d:0 "在我们收复完丢失的旧领土之后，我们可以决定我们最大殖民地的命运！\n[SCOPE.sCountry('dei_scope').GetName]对于东印度群岛的经营问题由来已久，殖民政府一直处于亏损状态，我们可以让地方总督交出权力，由王国政府直接管辖！"
dsk_net.9.f:0 "次日，[SCOPE.sCountry('dei_scope').GetName]的总督提出辞呈，宣布向[SCOPE.GetRootScope.GetCountry.GetName]的[ROOT.GetCountry.GetRuler.GetFirstName]移交权利，这意味着我们可以亲自经营这片广袤的领土"
dsk_net.9.a:0 "从此以后，这里就是王室直辖领土"

 notification_Treaty_of_Saigon_name:0 "缔约《西贡条约》只是权宜之计，事后，#yellow 嗣德帝#!派#yellow 潘清简#!出使[SCOPE.sCountry('fra_scope').GetName]与[SCOPE.sCountry('spa_scope').GetName]，试图赎回南方失地。但是，交涉迁延不决，法军仍四出略地，并借口镇压永隆、安江、河仙三省的抵抗运动占领了三省"
 notification_Treaty_of_Saigon_desc:0 "至此阮朝威信扫地，主持和议的#yellow 潘清简#!更为千夫所指，他终于明白对法委曲求全无异于与虎谋皮。绝望之余，这位年逾74的华裔大臣羞愤难当，回国后交待三省守将停止抵抗，并嘱咐子女绝不能服务于[SCOPE.sCountry('fra_scope').GetName]殖民地当局，绝食十七日后仰药自尽。"

 dsk_dai_events.16.t:0 "拉格雷使团勘测报告"​
 dsk_dai_events.16.d:0 "[SCOPE.sCountry('fra_scope').GetName]的[SCOPE.sCharacter('fra_person_scope').GetFirstName]跟随#v 拉格雷使团#!溯湄公河勘测归，递勘测报告求通商，其心难测"​
 dsk_dai_events.16.f:0 "自同治五年夏，[SCOPE.sCountry('fra_scope').GetName]遣#yellow 拉格雷#!率使团二十余人，以“探河考俗” 为名，自#yellow 西贡#!溯湄公河而上，经我#yellow 南圻#!、#yellow 中圻#!诸地，历时两载方归。今使团携勘测报告抵顺化，言已绘就河道图、录得风物志，求见朕陈报“通商利国之策”。\n\n览其报告，详载湄公河险滩分布、沿岸圩田沃野，甚至#yellow 北圻#!矿产、红河航道深浅亦历历在册——名为 “科学考察”，实则山川形胜、资源虚实尽被窥探。使团副使#yellow 加尼埃#!更在报告中直言，欲以湄公河为“通滇商路”，使#yellow 西贡#!堪比#yellow 英属香港#!。\n\n群臣密议：昔年法夷以传教为名入我#yellow 南圻#!，今借探河测绘地形，恐为日后北侵铺路。彼辈虽携吴哥遗迹绘图、风土素描为礼，然其行如《左传》所云 “貌恭而心不服”，礼遇之外更需戒备。\n\n更可虑者，使团竟私入北圻采集矿产样本，在报告中明列金、锡矿脉所在，美其名曰“助我兴利”，实则与豺狼窥室何异？朕虽许其在#yellow 南圻#!商埠暂驻，却严拒其勘测红河之请——河防要塞、矿藏分布乃国之秘要，岂容外夷轻易觊觎。"​
 dsk_dai_events.16.a:0 "应对潜在殖民渗透"

 dsk_dai_events.17.t:0 "[SCOPE.sCountry('gbr_scope').GetName]-[SCOPE.sCountry('fra_scope').GetName]-[SCOPE.sCountry('chi_scope').GetName]#v 《北京条约》#!的签订"​
 dsk_dai_events.17.d:0 "[SCOPE.sCountry('chi_scope').GetName]再败于英法，签#v 《北京条约》#!割地赔款，[ROOT.GetCountry.GetAdjective]宗藩屏障动摇"​
 dsk_dai_events.17.f:0 "自粤省商队传回急报：数年前英法联军再犯北朝，直抵京师，焚毁离宫，胁迫清廷签下#v 《北京条约》#!，割#yellow 九龙#!、赔巨款，更许夷人深入内地通商。消息传至#yellow 顺化#!，朝堂震动如惊雷——昔年北朝以一旅取天下，兵力何其雄也，今竟两度败于西洋蛮夷，连都城都遭蹂躏，怎不令人扼腕！\n\n 群臣聚议，皆言《左传》“唇亡齿寒” 之训今成谶语。北朝虽为“北邻”，然数百年来实为我大南宗藩屏障，昔#yellow 明命帝#!曾言#v “清强则蛮夷不敢窥我南疆”#!。今北朝疲弊至此，连自身疆土都难保全，更遑论庇护属国？前番法夷#v 拉格雷使团#!刚勘完湄公河，详录我山川形胜，今见北朝失势，必更增觊觎之心\n\n更可虑者，粤省密报称法夷在#v 《北京条约》#!后，竟将越南与滇桂边境地图附于和约附件，暗谋以越南为跳板通商#yellow 云南#!。\n\n朕忆及绍治帝曾言“夷狄猖狂，天下之公愤”，昔时犹觉遥远，今方知亡国之危已在眼前。虽北朝遣使来告，仍称“可共御外侮”，然其自身难保，此语不过空言。"​
 dsk_dai_events.17.a:0 "急调边军加固谅山、高平防线"

 dsk_dai_events.18.t:0 "#v 《马德里同盟条约》#!签订"​
 dsk_dai_events.18.d:0 "[SCOPE.sCountry('fra_scope').GetName]同[SCOPE.sCountry('spa_scope').GetName]签订#v 《马德里同盟条约》#!，划分势力范围"​
 dsk_dai_events.18.f:0 "自马尼拉商栈传回密报：[SCOPE.sCountry('fra_scope').GetName]与[SCOPE.sCountry('spa_scope').GetName]已于#yellow 马德里#!缔约结盟，明面上共商#yellow 摩洛哥#!事务，实则暗藏密款——[SCOPE.sCountry('spa_scope').GetName]允法独占我大南，法则承认[SCOPE.sCountry('phi_scope').GetName]之统治，两国相约‘互不干涉殖民拓土’。消息传至顺化，朝堂如临大敌，群臣皆言‘豺狼结党，亡国之兆’！\n\n前番北朝败于英法，宗藩屏障已溃，今法西结盟更无掣肘，必加速北侵。有大臣泣奏：‘昔年#yellow 拉格雷使团#!绘我河道，今法西合谋定我疆界，彼辈先以盟约固势，再以兵力夺地，如《孙子》所言“上兵伐谋，其次伐交”，我大南已陷其谋网！"​
 dsk_dai_events.18.a:0 "急筑顺安、岘港炮台"

 dsk_dai_events.19.t:0 "#v 进军印度支那！#!"​
 dsk_dai_events.19.d:0 "[SCOPE.sCountry('fra_scope').GetName]颁诏进军#v 印度支那#!，重兵压境，第一次法越战争一触即发"​
 dsk_dai_events.19.f:0 "#yellow 西贡#!急报传至#yellow 顺化#!：[SCOPE.sCountry('fra_scope').GetName]的[SCOPE.sCharacter('fra_person_scope_scope').GetFirstName]已正式颁诏，宣称‘为保护商民、平定南圻乱局’，命远东舰队司令#yellow 德热努伊#!率八千远征军、七十余艘战舰大举进军#v 印度支那#!。此前法军借‘休整西贡守备’之名，暗中增兵至万人，如今炮口已对准#yellow 嘉定#!、#yellow 边和#!二省，宣战文书同日送达皇城。\n\n文书措辞狂妄，竟称我#yellow 南圻#!‘治理无方，危及法商安全’，要求即刻割让#yellow 嘉定#!、#yellow 定祥#!、#yellow 边和#!三省，开放湄公河全域通航，否则‘三日之内，西贡炮舰将直捣顺安’。朝堂之上，主战派拍案怒斥：‘咸丰八年法西联军陷岘港之仇未报，今又得寸进尺！#yellow 南圻#!乃我阮朝龙兴之地，割之则国本动摇，唯有死战！’然主和派持#yellow 西贡#!密报泣诉：法军新添十余艘铁甲舰，火炮射程远超我岸防炮，#yellow 嘉定#!守军不足五千，军械多为土枪，恐难抵挡一日。"​
 dsk_dai_events.19.a:0 "彼辈早已算准我防线薄弱处，此番进军绝非临时起意。西贡传来的最后消息：法军已炮击嘉定城郊，民房燃起的浓烟数十里外可见，南圻百姓扶老携幼逃难，哭声震野"
 dsk_dai_events.20.t:0 "异教来朝"​
 dsk_dai_events.20.d:0 "[SCOPE.sCountry('xuezhe_xixue').GetName]传教士借朝贡之名求入国布道，朝堂争议礼仪与国本之衡"
 dsk_dai_events.20.f:0 "[SCOPE.sCountry('xuezhe_xixue').GetName]遣使携传教士三人，以“恭贺圣寿”为名求见朕，实则恳请允准天主教传教士入#yellow 北圻#!、#yellow 中圻#!诸省建堂布道，称“愿以福音化民，助我邦长治久安”。使臣更携西洋钟表、玻璃器皿为礼，言辞恳切，然其身后深意，难逃朝堂众目。\n\n群臣热议：礼官奏称“夷使远来，当以宾礼相待，不可失华夏之仪”；御史则疾呼“西教异于儒道，弃祖先之祀、乱人伦之序，昔年#yellow 南圻#!因信教者聚众滋事，前车之鉴不远！”\n\n朕思之再三：我大南以儒为宗，礼乐教化绵延千年，百姓尊孔孟、敬祖先，方有家国安宁。西教既违祖制，更可能为法军内应，断不可允其布道。然彼辈借朝贡之名而来，若径直逐之，恐授人以柄，为法军再添侵伐借口。"
 dsk_dai_events.20.a:0 "厚赏使臣与传教士，致谢其“远来盛情”，同时明言“国之根本，在于礼教相承”"​
 dsk_dai_events.20.b:0 "异教恐乱民心，暂难允准布道之请”，限三日内离境，不得滞留腹地。"​

 dsk_dai_events.21.t:0 "南圻炮响，国难当头"​
 dsk_dai_events.21.d:0 "法西联军重兵再犯，#yellow 嘉定#!城破，第一次法越战争全面爆发"​
 dsk_dai_events.21.f:0 "咸丰十一年（1861年）正月，#yellow 南圻#!急报一日三至：法西联军八万之众、七十余艘战舰突犯西贡，继去年冬宣示进军印度支那后，此番竟举全师而来，炮轰#yellow 嘉定#!城头！\n\n嘉定守将#yellow 黎文忠#!血书告急：法军铁甲舰炮火如雷，城墙塌毁十余处，我军两万将士多持土枪竹矛，连番冲锋皆成徒劳，[SCOPE.sCountry('fra_scope').GetName]舰队更从侧后登陆，截断粮草通道。城破前夜，黎将军率残部死战，身中三弹仍呼“宁死不降”，最终力竭殉国。消息传至顺化，朝堂哭声一片：主战派披甲请战，愿率#yellow 中圻#!禁军驰援；主和派却持粤省密报瘫坐于地——北朝正围困#yellow 天京#!，自顾不暇，遣使求援的文书已石沉大海，连 “口头声援” 都成奢望。\n\n#yellow 西贡#!传来通牒：限十日割让#yellow 嘉定#!、#yellow 边和#!、#yellow 定祥#!三省，赔偿两千万法郎，否则直捣#yellow 顺化#!。朕登城北望，念及#yellow 明命帝#!当年“南圻沃土，国之粮仓”之训，再观今日烽火，心如刀绞。然#yellow 中圻#!水师仅有十余艘旧船，难敌联军铁甲巨舰。"​
 dsk_dai_events.21.a:0 "北圻守军尚需防备盗匪，无兵可调。南圻已陷孤立无援之境！"

 je_fra_chi_war_go:0 "越法战争"​
 je_fra_chi_war_go_reason:0 "法夷铁蹄踏破南疆，嘉定城头炮火连天，南圻沃土遭焚掠，边和百姓陷涂炭:自1861年烽烟燃起，[ROOT.GetCountry.GetAdjective]便无半分屈膝之念！#yellow 嗣德帝#!颁诏抗敌，#yellow 黎文忠#!死守嘉定以身殉国，#yellow 潘清简#!殉国于西贡之辱；北圻黑旗军挥戈南下，纸桥之战斩敌将、破贼胆，红河两岸义民蜂起，以土枪竹矛对抗铁甲巨舰。城可破，地可失，国玺可熔，然民心不可夺、气节不可辱！\n$TOOLTIP_DELIMITER$\n[SCOPE.sCountry('fra_scope').GetName]的入侵最多有#v 四次#!，每当我们挫败其一次入侵时，敌人有50%的概率彻底向我们投降，我们从此一劳永逸完成这个[concept_journal_entry]"​
 fra_lose_prestige_in_europe:0 "欧洲懦夫"​


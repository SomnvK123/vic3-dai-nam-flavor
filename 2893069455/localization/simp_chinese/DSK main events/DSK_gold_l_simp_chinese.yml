 dsk_dai_main_advance:0 "1.当[concept_legitimacy]大于95，为#v 中国#!附属国时，研究了#red 民族主义#!时将触发#v 华夷之辩#!\n2.当财政有借贷的时候将触发#v 中国输援#!\n3.当法国#yellow 拿破仑三世#!上台后将触发#v 法兰西来使#!\n4.当#v 反华派#!势力大于2点，且时间大于1839年将触发#v 改元#yellow 大南#!#!\n5.当成功独立后将增加2点#v 反华派#!势力\n6.当#v 亲华派#!与#v 反华派#!势力保持一致且都大于等于2点时，将触发#v 朝堂辩论#!\n7.当#yellow 中国#!失败于#v 第一次鸦片战争#!后将触发#v 强越运动#!\n8.当完成四次改革后将触发#v 革新底定#!\n9.当#v 反华派#!势力大于2点时，将触发#v 正统之争#!\n10.当#v 新王#!登基时，将触发#v 登基大典#!\n11.当#v 反华派#!势力大于3点且没有选择#v 西进暹罗#!时，将触发#v 联暹制华#!"

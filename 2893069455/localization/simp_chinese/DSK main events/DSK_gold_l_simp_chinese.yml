 dsk_dai_events.22.t:0 "第一次《西贡条约》"​
 dsk_dai_events.22.d:0 "嘉定失守、兵竭粮尽，为保余土暂签条约，抗争之志未灭"​
 dsk_dai_events.22.f:0 "咸丰十一年（1861年）冬，#yellow 南圻#!战事已逾十月，#yellow 嘉定#!、#yellow 边和#!、#yellow 定祥#!三城相继力竭失守\n\n#yellow 黎文忠#!殉国后，守军残部退守永隆，与义民合兵游击，然法军铁甲舰封锁湄公河，粮草军械断绝，中圻援军遭西班牙舰队截击，寸步难行。顺化皇城虽仍在我手，然#yellow 南圻#!军民已血战至弹尽粮绝，法军扬言 “再拒则屠尽永隆、焚掠中圻”，为保数十万生民性命，为留复国之根基，朕强忍锥心之痛，遣大臣赴#yellow 西贡#!缔约，此非投降，实乃 “忍一时之辱，待他日之兴”！\n\n条约所列条款，字字皆染血泪：暂将三城交由法军驻守（非割让），开放土伦、巴叻、广安三港通商，赔偿军费四百万法郎，允传教士在通商口岸有限驻留——然朕已密谕缔约大臣：所有条款皆标“战时临时约定”，待国力复振、驱敌出境，即刻废约！！"
 dsk_dai_events.22.a:0 "传谕全国：减膳省用，充盈府库；整饬军备，编练新军；嘉奖义民，厚恤阵亡将士家属"​
 dsk_dai_events.23.t:0 "红河告急"​
 dsk_dai_events.23.d:0 "1873年，[SCOPE.sCountry('fra_scope').GetAdjective]西贡总督#yellow 杜白蕾#!遣军官安邺率部北侵，以‘保护商路’为名攻占#yellow 河内#!，连陷#yellow 海阳#!、#yellow 宁平#!数城，直逼红河上游——此处既是中越贸易命脉，更是通往[SCOPE.sCountry('fra_scope').GetAdjective]云南的门户，法国觊觎已久。"​
 dsk_dai_events.23.f:0 "昔年为保生民暂签条约，已让三城暂驻，然法夷得寸进尺，竟挥师北犯，毁我家园、杀我百姓，此等背信弃义之徒，唯有以战止战！南圻游击将士早已厉兵秣马，闻听北侵急报，即刻袭扰法军后方补给；北圻守军严阵以待，加固河内、海防城防；朕更下旨急召黑旗军刘永福，许以粮饷军械，共御法夷。"​
 dsk_dai_events.23.a:0 "联军黑旗军，死守河内、海防，正面阻击法军北进。"
 dsk_dai_events.23.b:0 "法国太强，不如尽早纳降以保吾之地位。"

 dsk_dai_events.24.t:0 "《顺化条约》"​
 dsk_dai_events.24.d:0 "[SCOPE.sCountry('fra_scope').GetAdjective]长驱直入：一路沿红河牵制黑旗军，一路以舰队强攻顺安要塞——这座守护顺化的门户沦陷后，法军炮口直指阮朝皇城，4000精兵围城，扬言‘旦夕可夷平顺化’。"
 dsk_dai_events.24.f:0 "此时朝堂深陷绝境：越王阮福时骤然病逝，皇子争位内乱频发，主战派呼吁‘调北圻援军回防’，却不知黑旗军已被法军缠住难以抽身；求和派痛哭陈词‘城破则宗社覆灭’，而[concept_overlord][SCOPE.sCountry('chi_scope').GetAdjective]仅派使者口头谴责，未发一兵一卒驰援。\n\n法军特使何罗恾（Harmand）携条约草案登岸，态度强硬：要么签字接受[SCOPE.sCountry('fra_scope').GetAdjective]‘保护’，要么玉石俱焚。更屈辱的是，条约要求当场销毁[SCOPE.sCountry('fra_scope').GetAdjective]册封的#o ‘越南国王’#!国玺，彻底断绝宗藩关系。"
 dsk_dai_events.24.a:0 "为保阮朝一线血脉，只能忍辱签下这份城下之盟"
 dsk_dai_events.24.b:0 "宁为玉碎不为瓦全，臣等愿与陛下死战到底"

 dsk_dai_events.25.t:0 "最后的关头"​
 dsk_dai_events.25.d:0 "[SCOPE.sCountry('fra_scope').GetAdjective]北侵日烈，北朝清军应邀入越，中法战争爆发，[ROOT.GetCountry.GetAdjective]军民终得强援"​
 dsk_dai_events.25.f:0 "法夷撕毁西贡临时约定后，北侵之势愈烈：河内、海防相继告急，宣光、兴化遭法军围困，南圻游击根据地屡遭围剿，[ROOT.GetCountry.GetAdjective]军民血战数年，虽寸土未让，却已兵疲粮竭。正当三圻山河岌岌可危之际，北朝清廷终颁诏援越 —— 数万清军自谅山、镇南关分路入越，与我北圻守军、黑旗军会师，共同抗击法夷！消息传至顺化，全城百姓焚香跪拜，朝堂上下欢声雷动，朕登城远眺清军旗帜，泪湿龙袍：“天不亡我[ROOT.GetCountry.GetAdjective]，[SCOPE.sCountry('chi_scope').GetAdjective]伸以援手，此乃复国之良机！"​
 dsk_dai_events.25.a:0 "国难当头，不灭法夷，绝不收兵。"​
 dsk_dai_events.25.b:0 "继续向法兰西主人磕头。"​
 fra_chi_war_start_go_tt:0 "[SCOPE.sCountry('fra_scope').GetAdjective]已经成功勘探红河沿岸，并找到了[concept_war]借口#!

 dsk_dai_events.26.t:0 "《嘉定条约》"​
 dsk_dai_events.26.d:0 "军民死战破夷围，[SCOPE.sCountry('fra_scope').GetAdjective]在#yellow 嘉定#!惨败求和，[ROOT.GetCountry.GetAdjective]收复全部失地，重订平等盟约"​
 dsk_dai_events.26.f:0 "同治二年春，第一次越法之战已历两载——自嘉定血战始，我大南军民同仇敌忾，南圻义民游击袭扰不绝，北圻黑旗军锐不可当，中圻新军星夜驰援，更得天朝清军侧翼策应，终将法西联军困于西贡孤城！法军铁甲舰遭红河险滩伏击，粮草断绝；陆战部队屡遭夹击，伤亡过半，[SCOPE.sCountry('spa_scope').GetAdjective]舰队见势不妙仓皇撤逃，法夷主帅#yellow 德热努伊#!被迫遣使求和，愿签下城下之盟，归还所有侵占之地！\n\n消息传至#yellow 顺化#!，举国欢腾：百姓张灯结彩，焚香告慰阵亡将士英灵；朝堂之上，群臣齐呼 “天子圣明，军民同心，方破夷寇”"​
 dsk_dai_events.26.a:0 "万岁，万岁，万万岁！"

 dsk_black_flag_army_button:0 "黑旗军驰援"​
 dsk_black_flag_army_button_desc:0 "黑旗军#yellow 刘永福#!率精锐星夜驰援，剑指西贡！与大南军民同心破夷，誓驱法寇复河山，共护三圻疆土！"​
 alliance_china_2_tt:0 "#v 反华派势力#!小于#v 2点#!"
 alliance_china_3_tt:0 "#v 反华派势力#!小于#v 3点#!"
 dsk_fra_chi_war_win_tt:0 "[SCOPE.sCountry('fra_scope').GetAdjective]已投降，中法越三方在#yellow 南宁#!签订#v 《南宁条约》#!。[concept_war]彻底结束"​
 dsk_dai_events.27.t:0 "黑旗军出击"​
 dsk_dai_events.27.d:0 "黑旗军履约驰援，[SCOPE.sCharacter('chi_hero_scope').GetFullName]再助[ROOT.GetCountry.GetAdjective]"​
 dsk_dai_events.27.f:0 "同治七年（1868年）夏，法夷遣使求订新约之际，北圻边境忽传异动——[SCOPE.sCountry('fra_scope').GetAdjective]残部勾结蛮匪滋扰，欲趁缔约之机施压。危急时刻，黑旗军[SCOPE.sCharacter('chi_hero_scope').GetFirstName]遵“抗夷同盟” 之约，率三万精锐星夜驰援，沿红河疾进，数日便荡平匪患，生擒法籍头目！\n\n永福公率黑旗军纸桥斩敌、西贡解围，立下复国首功；今番盟约在身，又闻我邦有警，即刻起兵相助，其忠义肝胆，感佩天地！朕遣特使携御酒、绸缎赴北圻劳军，见黑旗将士军容整肃、士气高昂，特使归报：“永福公言‘大南安危，即黑旗之责’，愿与我邦共存亡！"​
 dsk_dai_events.27.a:0 "厚赏黑旗军，划定北圻部分商埠供其互市，深化同盟羁绊"
 black_flag_army_modifier:0 "黑旗军出击"​

 je_black_flag_army:0 "第二次越法战争"​
 je_black_flag_army_reason:0 "[SCOPE.sCountry('fra_scope').GetAdjective]此前派#v 拉格雷使团#!溯湄公河勘探，发现河道不适宜通航，遂将目标转向北圻红河——红河直达[SCOPE.sCountry('chi_scope').GetAdjective]#yellow 云南#!，是掠夺西南资源的关键通道。1873年，[SCOPE.sCountry('fra_scope').GetAdjective]商人#yellow 迪皮伊#!以“通商云南”为名走私武器、食盐，蓄意制造事端，为军事介入找借口。\n\n[SCOPE.sCountry('fra_scope').GetAdjective]驻西贡总督#yellow 杜白蕾#!以“处理迪皮伊事件”为由，派军官安邺率170名士兵北上，仅用数日便攻陷河内，连破宁平、海阳等城，甚至俘虏[ROOT.GetCountry.GetAdjective]协办大学士阮知方（后绝食而死），用武力证明[ROOT.GetCountry.GetAdjective]正规军的脆弱。" 


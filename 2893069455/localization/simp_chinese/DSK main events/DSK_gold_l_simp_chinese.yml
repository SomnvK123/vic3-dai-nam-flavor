 je_annex_cam:0 "南进教化真腊"​
 je_annex_cam_reason:0 "[ROOT.GetCountry.GetAdjective]承华夏正朔，以教化蛮夷为己任。真腊（[SCOPE.sCountry('cam_scope').GetAdjective]）久处蛮荒，未沐圣化。今我朝国力日盛，当南进设官置县，传播诗书礼教，以固南疆藩篱，兼复扶南故地之疆，使真腊生民同沐王化，共享太平。"

 no_cam_tt:0 "#v 真腊#!（柬埔寨)已不存在"​
 dai_qwf_sia_now_tt:0 "与#yellow 暹罗#!不存在#yellow 利益同盟#!"​

 je_dsk_dai_main:0 "百越之南"
 je_dsk_dai_main_reason:0 "我[SCOPE.sCharacter('ruler_scope').GetFullName]，[ROOT.GetCountry.GetAdjective][Concept('concept_ruler', '$RULER_TITLE_KING$')]承天命，抚有百越之南，为阮朝君主。\n\n国疆北接[SCOPE.sCountry('chi_scope').GetAdjective]，南抵[SCOPE.sCountry('sia_scope').GetAdjective]，东滨#yellow 沧海#!，西控#yellow 澜沧#!，分北圻、中圻、南圻三域，以顺化为都，#yellow 河内#!、#yellow 西贡#!为藩屏。此时朝政循儒家之治，行科举取士，设六部总理庶务，地方置省府县三级，赖以维系纲纪。\n\n农为邦本，湄公河、红河三角洲膏腴千里，稻作丰饶，兼植胡椒、槟榔之属，为民生之基；工商虽有起色，然多为官府管控，海外贸易仅限#yellow 广州#!、[SCOPE.sCountry('sia_scope').GetAdjective]等数处口岸，未及西洋之盛。军制仍沿旧例，以八旗、绿营为骨干，火器未兴，武备尚待革新。朕虽忝居王位，深知己身之责，当振衰起弊，变法图强，以保我[ROOT.GetCountry.GetAdjective]社稷绵延，黎民安堵，不愧百越先民之托也！\n$TOOLTIP_DELIMITER$\n这个[concept_journal_entry]将在特定条件下触发以下不同的#tooltippable;tooltip:[Country.GetTooltipTag],dsk_dai_main_advance #o 历史事件#!#!"

 je_fra_chi_war_start:0 "风暴前夜"
 je_fra_chi_war_start_reason:0 "19世纪中后期，[SCOPE.sCountry('fra_scope').GetName]在远东的殖民扩张野心日益膨胀，[ROOT.GetCountry.GetAdjective]因其独特的地缘战略价值与丰富资源，成为其重点觊觎目标。\n\n此前，[SCOPE.sCountry('fra_scope').GetName]曾以传教通商为名多次向[ROOT.GetCountry.GetName]施压，遭拒绝后，便借机制造外交摩擦，暗中扶持[ROOT.GetCountry.GetAdjective]境内反政府势力，不断试探[ROOT.GetCountry.GetAdjective]防务底线。随着[SCOPE.sCountry('fra_scope').GetName]在东南亚殖民据点的巩固，[SCOPE.sState('capital_scope').GetCityHubName]作为连接[SCOPE.sCountry('chi_scope').GetAdjective]西南与中南半岛的关键商路枢纽，其控制权成为其打通远东贸易通道的核心诉求。\n\n同时，[ROOT.GetCountry.GetAdjective]与[SCOPE.sCountry('chi_scope').GetName]的传统宗藩关系，也成为[SCOPE.sCountry('fra_scope').GetName]进一步渗透的阻碍，意图通过控制#v 印度支那#!，间接影响[SCOPE.sCountry('chi_scope').GetAdjective]西南边疆。[SCOPE.sCountry('chi_scope').GetAdjective]为维护宗藩体系与西南边疆安全，亦开始向中越边境调兵布防，法、中、越三方军事对峙态势持续升级，外交斡旋陷入僵局，战争阴云笼罩南疆，中法战争爆发的前兆已日益明显。\n$TOOLTIP_DELIMITER$\n当进度条被填满后，[SCOPE.sCountry('fra_scope').GetName]将会频繁向我们发起侵略\n$TOOLTIP_DELIMITER$\n这个[concept_journal_entry]将在特定条件下触发以下不同的#tooltippable;tooltip:[Country.GetTooltipTag],je_fra_chi_war_start_advance #o 历史事件#!#!"
 je_fra_chi_war_start_advance:0 "1.#v 拉格雷使团勘测报告#!\n2.#v 《北京条约》#!的签订\n3.#v 《马德里同盟条约》#!\n4.#v 法国进军印度支那！#!\n5.#v 异教传教士来朝#!"
 je_hua_yi_advance:0 "1.#v 南进教化真腊#!\n2.#v 汉字与喃语#!"

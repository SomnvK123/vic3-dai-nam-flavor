 je_dsk_dai_a:0 "治理内政"
 je_dsk_dai_a_reason:0 "往昔官制涣散，南北总镇权重难制，吏胥舞弊、政令壅塞，中枢威权不逮郡县。我大南欲固邦本，必先整饬吏治、厘定官阶，设机密院总揽军国，使三十行省令行禁止，方能革除积弊、凝聚国力，为革新大业立根基。"
 je_dsk_dai_b:0 "治理军政"
 je_dsk_dai_b_reason:0 "西洋寇舰游弋南疆，沱㶞、西贡屡遭窥伺，旧制镇兵装备窳劣、操练废弛，边隘无险可守。我大南地处要冲，外患环伺，唯有编练新军、仿造西洋枪炮，拓建红河水师、加固关隘炮台，方能振军威、御外侮，保南疆疆域之完。"
 je_dsk_dai_c:0 "治理教育"
 je_dsk_dai_c_reason:0 "旧日学制拘守章句，科举唯重经义，士子不通实务、不晓世变，国家乏经世致用之才。我大南欲图革新，需启民智、育贤才，故当崇儒为本、兼纳西学，广设蒙塾、增置实用学科，使俊秀辈出，为军政、农工诸般革新输送栋梁。"
 je_dsk_dai_d:0 "治理经济"
 je_dsk_dai_d_reason:0 "往昔农桑废弛，南圻荒田未辟，商埠通商无序，官办工场技艺落后，府库空虚、民生凋敝。我大南地沃物阜，当借湄公河、红河之利劝农垦荒，规范商埠关税、兴办官办工场，通商贸、兴百工，方能充盈府库、裕国足民，为各项革新提供财用支撑。"
 je_dsk_dai_e:0 "治理田政"
 je_dsk_dai_e_reason:0 "旧田籍混乱，豪强隐田逃税，贫户无地可耕，赋役不均致民怨沸腾，邦本动摇。民以食为天，国以农为本，我大南必当丈量田土、编订地簿，厘定三等均税之法，鼓励垦荒、兴修水利，使田制井然、赋税公允，民心安定则邦本自固。"


 dsk_dai_events.1.t:0 "华越宗藩关系"
 dsk_dai_events.1.d:0 "[SCOPE.sCountry('chi_scope').GetAdjective][Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')]遣使到访顺化，带来愿助安南革新自强，共御西洋寇的善意。消息传开，朝堂上下争议不休：以辅政大臣为首的一派力主借宗藩之谊，引大清援助以推改革，认为此乃解燃眉之急的上策；而以地方士绅代表为首的一派则坚决反对，直言大清自身亦面临变局，其援助恐夹带私货，过度依附必失国本，改革当凭自身之力"
 dsk_dai_events.1.f:0 "朕常抚卷沉思，我越南与华夏之渊源，实乃千年交织，休戚与共。自上古百越先民迁徙交融，至秦汉设郡管辖，再到阮朝立国受大清册封，两国情谊早已深植于山川水土之间。华夏文明如师长，我朝典章制度、科举礼乐、农工技艺，多仿中原之制；汉字曾为朝堂官方文字，儒家思想乃治国根基，就连顺化皇城的规制，亦可见长安、北京宫殿的影子。每逢灾年，大清常遣官赈灾、调拨粮米；而我越南亦恪守宗藩之礼，岁岁朝贡"
 dsk_dai_events.1.a:0 "以宗藩礼仪遣使赴京，上表清廷，尊奉宗藩旧制，承诺岁岁朝贡。"
 dsk_dai_events.1.b:0 "万万不可，大清虽为宗藩，然其自身难保，西洋列强已在其沿海寻衅，其援助恐难以为继。"
  

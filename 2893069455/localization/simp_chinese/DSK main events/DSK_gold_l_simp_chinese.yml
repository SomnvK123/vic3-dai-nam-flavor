 je_yunnan_valley_expedition: "远征云南虫谷"
 je_yunnan_valley_expedition_reason: "在云南的群山之中，隐藏着一处神秘的谷地——虫谷。据传那里栖息着奇异的生物和珍稀的草药，但道路险峻，当地部族对这片区域讳莫如深。此地也是古滇献王墓所在地，传说中的解厄神珠雮尘珠便随葬其中，却也遍布痋蛊毒虫、瘴气迷阵与致命机关"
 je_yunnan_valley_expedition_goal: "寻找到了传说中的献王墓与解厄神珠雮尘珠"
 je_yunnan_valley_expedition_success_tt: "[SCOPE.sCharacter('yunnan_expedition_leader').GetFullName]成功探索了虫谷，找到了解厄神珠雮尘珠。"
 je_yunnan_valley_expedition_success_event_tt: "献王地宫夺得雮尘珠，破解了诅咒，并与守陵彝寨建立同盟。"
 je_yunnan_valley_expedition_failure_tt: "远征可能失败，如果：\n•领队[SCOPE.sCharacter('yunnan_expedition_leader').GetFullName]死亡。\n•我们失去对探险队的控制。\n•[SCOPE.sCharacter('yunnan_expedition_leader').GetFullName]未能与当地部族建立友好关系。"
 expedition_costs_tt: "远征将消耗大量资源。"
 je_yunnan_valley_expedition_advance: "远征进度会#bold 推进#!。"
 je_yunnan_valley_expedition_sub: "远征进度会#bold 后退#!。"
 yunnan_expedition_delayed: "虫谷远征队耽搁了#bold 3#!个月。"

 # Event 1: Expedition Begins
 dsk_yunnan_valley.1.t: "探索云南虫谷！"
 dsk_yunnan_valley.1.d: "我们决意深入云南遮龙山腹地——虫谷。此地古为滇国秘境，相传是献王墓所在地，藏有解厄神珠雮尘珠，却也遍布痋蛊毒虫、瘴气迷阵。当地彝人视之为绝地，世代禁入。"
 dsk_yunnan_valley.1.f: "“在地图上，这里只是一个标记——'未探索区域'。但我们知道，这片区域蕴藏着无尽的可能。草药、矿物、未知物种……甚至传说中的宝藏！”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]放下手中的烟斗，用手指在地图上划了一条线。“让我们派一支探险队去。我正好知道谁适合干这活！“"
 dsk_yunnan_valley.1.a: "我正好知道谁适合干这活！"

 # Event 2: Choose Commander
 dsk_yunnan_valley.2.t: "选择探险队指挥官"
 dsk_yunnan_valley.2.d: "寻宝队需一位通晓风水秘术、熟稔南疆诡事的领队。各有专长的能人异士愿共赴险地，却各有顾虑。"
 dsk_yunnan_valley.2.f: "将军们围坐在会议室里，互相推让着这个危险却诱人的任务。\n\n“献王痋术狠辣，机关遍布，若无寻龙点穴之术，便是有去无回。”一位将军说道，眼睛盯着桌面。\n\n“当然，当然需要。”另一位附和道，目光飘向窗外。\n\n沉默。没人愿意主动请缨。"
 dsk_yunnan_valley.2.a: "任命[SCOPE.sCharacter('yunnan_expedition_leader_1').GetFullName]为指挥官"
 dsk_yunnan_valley.2.b: "让[SCOPE.sCharacter('yunnan_expedition_leader_2').GetFullName]来领导这次探险"
 dsk_yunnan_valley.2.c: "派[SCOPE.sCharacter('yunnan_expedition_leader_3').GetFullName]去完成这个任务"
 dsk_yunnan_valley.2.cc: "派[SCOPE.sCharacter('yunnan_expedition_leader_4').GetFullName]去进行探险"

 # Event 3: Expedition Launches
 dsk_yunnan_valley.3.t: "远征队出发"
 dsk_yunnan_valley.3.d: "在[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetFullName]的领导下，我们的云南虫谷远征队正式出发了。\n\n#N 由于[SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe]全面负责这次探险，如果[SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe]死亡，远征将以失败告终。#!"
 dsk_yunnan_valley.3.f: "[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]站在队列前，目光坚定。“士兵们，我们将前往一片从未被外人踏足的土地。那里有机遇，也有危险。但我相信，只要我们团结一致，就没有什么能够阻挡我们！”\n\n他转向后勤军官。“补给准备好了吗？”\n\n“万事俱备，随时可以出发。”"
 dsk_yunnan_valley.3.a: "前进，到虫谷去！"

 # Event 4: Yak Herders Incident
 dsk_yunnan_valley.4.t: "彝寨冲突"
 dsk_yunnan_valley.4.d: "队伍途经遮龙寨，因误踩寨中禁地，与彝人发生冲突。彝人世代守护虫谷，视外来者为亵渎神灵之人，族长放出狠话，若不立刻退去，便要以祖上传下的蛊术相待。[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]认为这是彝人的挑衅，欲以武力开路。"
 dsk_yunnan_valley.4.f: "“他们竟将我们的向导绑在祭柱上，扬言要祭谷神！”队员怒目圆睁。\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting] 握紧腰间武器：“这群蛮夷冥顽不灵！我们带足了火铳，不如趁夜突袭，救回向导，强行闯关！”\n\n一旁的老苗医却摇头：“彝人蛊术诡异，不可硬拼，或许可寻寨中长老求和。”"
 dsk_yunnan_valley.4.a: "武力突袭，强行闯关。"
 dsk_yunnan_valley.4.b: "寻求和解，恳请通行！"

 # Event 5: Mountain Survey
 dsk_yunnan_valley.5.t: "山区测绘"
 dsk_yunnan_valley.5.d: "测绘人员已经开始研究环绕虫谷的山脉和山口。深入未知领域，攀登未曾探索过的山峰，这是危险的工作，但[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]仍然希望参与其中。"
 dsk_yunnan_valley.5.f: "“你看见那座山峰了吗？我们#italic 必须#!翻越它！”\n\n“但是为什么？”\n\n“因为……山就在#italic 那里#!！”"
 dsk_yunnan_valley.5.a: "我们不能以身涉险，派别人去。"
 dsk_yunnan_valley.5.b: "[SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]应该接管这里的事务。"

 # Event 6: Leeches!
 dsk_yunnan_valley.6.t: "水蛭！"
 dsk_yunnan_valley.6.d: "队伍误入一片沼泽，沼泽中布满了通体血红的巨型水蛭，更有会钻进人皮肤的'蛭蛊'。此路是前往暗河的捷径，若绕行需多耗三日，且可能错过关键时辰。领队必须决定是否强行穿越。[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]将不得不亲自探查。"
 dsk_yunnan_valley.6.f: "“不要。”\n\n“不要。不要，不要，不要。”\n\n斥候最后一次看了看沼泽里的水。一丝笑声在他唇边响起。“哈哈哈哈哈，#italic 不要！#!”\n\n这些不是普通水蛭，是献王养的蛭蛊，一旦附着便会钻进血脉，吸食精气而死！但这将会是别人的问题，不是他的。"
 dsk_yunnan_valley.6.a: "[SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]能做到，而且必须做到。"
 dsk_yunnan_valley.6.b: "也许休息一下会更好。"

 # Event 7: Selecting the Expeditionary Force
 dsk_yunnan_valley.7.t: "增补队员"
 dsk_yunnan_valley.7.d: "队伍已有折损，急需增补人手，[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]宣布[SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe]知道附近村落有几位身怀绝技之人：一位擅长制造陷阱的猎户，一位懂彝语的货郎，一位能治蛊毒的苗婆。。"
 dsk_yunnan_valley.7.f: "这本不应该这么困难。这只是一项工作，和其他任何工作一样，但不知为何，仅仅是找到合适的人来完成这项工作，就比任何人预期的都要困难。我们需要的不仅是技艺，更是敢闯鬼门关的勇气。"
 dsk_yunnan_valley.7.a: "这次远征绝不能，也不会缺乏人手。"
 dsk_yunnan_valley.7.b: "只有最顽强的士兵才能应对接下来的困难。"

 # Event 8: Entering the Valley
 dsk_yunnan_valley.8.t: "深入虫谷"
 dsk_yunnan_valley.8.d: "历经艰险，队伍终于穿过遮龙山隘口，[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]终于可以踏入虫谷了。此地风水紊乱，是献王布下的'迷魂阵'，寻常罗盘难以定位。"
 dsk_yunnan_valley.8.f: "“我们来此既不是为了寻找荣耀，也不是为了寻找黄金。”军官沿着集合的队伍慢慢走过。“至少不是为了我们自己。没有人会记得我们。”\n\n他伸指指向远处的群山。“#italic 那些#!会被铭记。我们是想站在这里，还是站在#italic 那里#!，站在那些将超越所有记忆的岩石之上？“"
 dsk_yunnan_valley.8.a: "前往神秘之地！"

 # Event 9: Blizzard
 dsk_yunnan_valley.9.t: "暴风雨"
 dsk_yunnan_valley.9.d: "[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]的远征队在虫谷的一条较危险的路线上遭遇了预料之外的恶劣天气。耽搁下去或许代价高昂，但在恶劣天气中艰难前行的代价有可能更高。"
 dsk_yunnan_valley.9.f: "寒风在[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]脚下吹过。冰霜冻结了地面。温度远低于零度，[SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe]几乎看不到[SCOPE.sCharacter('yunnan_expedition_leader').GetHerHis]鼻尖以外的世界。"
 dsk_yunnan_valley.9.a: "我们必须不畏风雨，继续前进！"
 dsk_yunnan_valley.9.b: "最好谨慎行事，挺过这场暴风雨。"

 # Event 10: Unsanctioned Plundering
 dsk_yunnan_valley.10.t: "未经批准的私盗古物"
 dsk_yunnan_valley.10.d: "随着[SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]的士兵接近虫谷深处，一些士兵变得不守规矩。有报道称，我们的一群士兵闯进洞穴和遗迹，见财起意，趁领队不备，偷偷藏起了几件古物。"
 dsk_yunnan_valley.10.f: "“我们冒死前来，难道不能拿点东西补贴家用？反正雮尘珠才是目标，这些小东西能有什么妨碍？”\n\n“我向您保证，先生，这完全在可接受的范围内。我们遭到了反对，这毕竟也是预料之中的事情。当然，那些关于献王的祭器上面刻着痋咒一定是夸大其词了。”"
 dsk_yunnan_valley.10.a: "所以呢？军队不就是这个样吗。"
 dsk_yunnan_valley.10.b: "处罚不守规矩的士兵。"

 # Event 11: Negotiations
 dsk_yunnan_valley.11.t: "求见彝人长老"
 dsk_yunnan_valley.11.d: "随着我们的远征队深入虫谷，是时候处理棘手的外交问题了。据向导所言，附近有一处隐秘的彝人部落，部落长老知晓虫谷的部分秘密，或许能提供帮助。但彝人对闯入者极为警惕，想要获得信任并非易事。"
 dsk_yunnan_valley.11.f: "他看到那名军官瘫倒在桌子旁，捂着脑袋。\n\n“你和一名长老谈话，然而他带你找了另一名长老。你和#italic 另一名#!长老谈话，#italic 他#!说你找错人了，并为你指了第三个人。然后那个家伙——那个家伙说你全都搞错了，#italic 第一个#!人才是拥有所有权力的人。”\n\n“哦，哪里是个头？谁是管事的？”"
 dsk_yunnan_valley.11.a: "直接与长老们对话。"
 dsk_yunnan_valley.11.b: "我们没有更多时间了。"

 # Event 12: Treaty of the Valley
 dsk_yunnan_valley.12.t: "献王墓得珠"
 dsk_yunnan_valley.12.d: "[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetFullName]带领队伍历经九死一生，终于闯入献王地宫，在三世桥后的主墓室中，找到了与献王头颅融为一体的雮尘珠！这个传说中的宝物现在掌握在我们手中。[SCOPE.sCharacter('yunnan_expedition_leader').GetLastName]在[ROOT.GetCountry.GetCapital.GetCityHubName]受到了热烈欢迎，还有一个光明的未来在等着[SCOPE.sCharacter('yunnan_expedition_leader').GetHerHim]。"
 dsk_yunnan_valley.12.f: "“这很简单，真的。”\n\n那个男人用一支烟头指着墙上的地图。“#italic 那#!就是我们的弱点。我们必须投入一切所需的人力和金钱来确保安全，呃……”他停下来，试图穿透烟雾看清，“云南虫谷！我们必须占领并控制这片土地，才能拯救自己！”\n\n他转向俱乐部里的其他人。“现在！谁准备好庆祝了？”"
 dsk_yunnan_valley.12.a: "为[SCOPE.sCharacter('yunnan_expedition_leader').GetFullName]欢呼！"

 # Event 13: Expedition Failed
 dsk_yunnan_valley.13.t: "在虫谷的惨败"
 dsk_yunnan_valley.13.d: "我们的远征队遭遇了灾难性的失败。[SCOPE.sCharacter('yunnan_expedition_leader').GetPrimaryRoleTitle][SCOPE.sCharacter('yunnan_expedition_leader').GetFullName]的队伍在献王地宫遭遇致命机关。痋人潮与霍氏不死虫的夹击，队员死伤殆尽。剩余之人被迫放弃任务，仓皇逃离虫谷。"
 dsk_yunnan_valley.13.f: "“这……这完全是预料之外的。“军官结结巴巴地说。“那些虫子，那些#italic 虫子#!到处都是！我们的指南针失灵了，地图也毫无用处……”\n\n他摘下帽子，抹了一把脸。“我建议……我们重新评估这个任务”"
 dsk_yunnan_valley.13.a: "这是一个惨痛的教训。"

 # Event 14: Strange Flora Discovery
 dsk_yunnan_valley.14.t: "奇异的植物"
 dsk_yunnan_valley.14.d: "队伍在暗河岸边发现一片奇异的荧光菌群落，菌盖发出幽幽蓝光，照亮了周围的黑暗。老苗医辨认出这是#yellow '引路菌'#!，不仅无毒，其汁液还能驱散低浓度瘴气，更能作为天然光源。"
 dsk_yunnan_valley.14.f: "科学家们围在这些发光的菌类周围，眼睛里闪烁着兴奋的光芒。\n\n“不可思议！这些生物的发光机制与已知的任何物种都不同！”\n\n“如果我们能带回样本……不，如果我们能在这里建立研究站……”"
 dsk_yunnan_valley.14.a: "研究这些发光的菌类，它们可能是科学突破的关键。"
 dsk_yunnan_valley.14.b: "采集样本，这些草药可能有药用价值。"

 # Event 15: Local Tribe Encounter
 dsk_yunnan_valley.15.t: "与长老的谈判"
 dsk_yunnan_valley.15.d: "部落村口，几位手持长矛的彝人战士拦住了队伍。“外来者，这里不是你们该来的地方！”为首的战士怒目而视。\n\n领队上前拱手：“我们并非来掠夺，只是为破解诅咒寻找雮尘珠，如今粮草断绝，恳请面见长老，愿以重金换取草药与指引。”"
 dsk_yunnan_valley.15.f: "部族长老用审视的目光打量着这群外来者。\n\n“你们来这里做什么？”他用生硬的语气问道。\n\n“我们……我们来探索这片土地，为了科学的进步……”\n\n“科学？”长老皱起眉头。“你们想要什么？我们有的是草药、故事，还有……秘密。但若想得到我的指引，需帮我们毁掉献王墓外的'痋俑阵'，那些俑中藏着的痋蛊，已开始侵蚀我们的土地。”"
 dsk_yunnan_valley.15.a: "答应长老。"
 dsk_yunnan_valley.15.b: "拒绝合作，到此为止。"

 # Event 16: Hostile Confrontation
 dsk_yunnan_valley.16.t: "痋俑阵的尸蛾突袭"
 dsk_yunnan_valley.16.d: "这些通体漆黑的飞虫以腐肉为食，口器锋利，且不畏火光，一旦被包围，必死无疑。领队必须立刻做出应对。"
 dsk_yunnan_valley.16.f: "[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]盯着眼前的景象皱起了眉头。无数尸蛾如同黑云般涌来，发出刺耳的嗡嗡声，但[SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe]知道，[SCOPE.sCharacter('yunnan_expedition_leader').GetSheHe]的远征队带来了什么样的武器。"
 dsk_yunnan_valley.16.a: "用硫磺与火把构筑防线，死守阵地！"
 dsk_yunnan_valley.16.b: "放弃营地，向开阔地带突围。"

 # Event 17: Bioluminescence Discovery
 dsk_yunnan_valley.17.t: "生物发光研究"
 dsk_yunnan_valley.17.d: "老苗医对采集的荧光菌进行了深入研究，发现其不仅能驱瘴，其汁液与糯米混合后，还能破解低级痋蛊，甚至能在黑暗中持续发光十二个时辰，是探索地宫的绝佳工具。"
 dsk_yunnan_valley.17.f: "老苗医将荧光菌汁液滴在糯米上，糯米立刻发出蓝光，散发出一股清香。“我试过了，这种混合物能逼出体内的蛭蛊，还能照亮地宫，且不会引来毒虫。”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]领队拿起一把混合了菌液的糯米：“这简直是上天赐予的宝物！有了它，地宫探险便多了几分把握。”"
 dsk_yunnan_valley.17.a: "大量制作荧光糯米。"
 dsk_yunnan_valley.17.b: "留存部分菌种，日后研究其奥秘。"

 # Event 18: Trade Relations Established
 dsk_yunnan_valley.18.t: "彝寨通商"
 dsk_yunnan_valley.18.d: "队伍和彝寨人民共沐风雨之后，终于与守陵彝寨建立了临时贸易关系。彝人提供解毒草药、特制驱虫粉与地宫的部分机关图纸，队伍则用带来的盐巴、布匹与铁器作为交换。"
 dsk_yunnan_valley.18.f: "交易帐篷里堆满了来自两个世界的物品。香料、矿石、未知的植物标本……还有来自工业化世界的枪支、工具和布料。\n\n“这是新时代的开始。”一名商人在本子上记下交易清单。“从今天起，虫谷与世界连接在一起了。”"
 dsk_yunnan_valley.18.a: "建立永久贸易路线。"
 dsk_yunnan_valley.18.b: "促进文化交流。"

 # Event 19: Colony Established
 dsk_yunnan_valley.19.t: "凌云天宫扎营"
 dsk_yunnan_valley.19.d: "队伍抵达献王墓的地上建筑——凌云天宫，此处虽已残破，但地势险要，易守难攻，且能避开谷中的瘴气与毒虫。领队决定在此建立临时营地，休整补给后再闯入地宫。"
 dsk_yunnan_valley.19.f: "凌云天宫的大殿中，队员们正在清理废墟，搭建帐篷。殿内的壁画依稀可见，描绘着献王登基、祭祀以及炼制痋蛊的场景。\n\n[SCOPE.sCharacter ('yunnan_expedition_leader').GetLastNameNoFormatting]站在壁画前，仔细研究着：“这些壁画可能藏着地宫的线索。大家休整时，多留意殿内的石刻与图案，切勿遗漏任何细节。”"
 dsk_yunnan_valley.19.a: "修整片刻。"

 # Event 20: Hidden Path Discovered
 dsk_yunnan_valley.20.t: "隐秘通道"
 dsk_yunnan_valley.20.d: "探险队突围了出来，终于在山区中发现了一条隐蔽的小径，沿着这条路径似乎可以直达虫谷的核心区域。"
 dsk_yunnan_valley.20.f: "“看这里！”向导兴奋地指着岩壁上的标记。“这是古代商队留下的痕迹……这条路通向更深的地方！”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]仔细研究着这些古老的符号。“这可能是通往传说中的'虫谷之心'的路径。”"
 dsk_yunnan_valley.20.a: "通过隐秘通道深入探索。"
 dsk_yunnan_valley.20.b: "先研究这些古老的标记。"

 # Event 21: Heart of the Valley
 dsk_yunnan_valley.21.t: "虫谷之心"
 dsk_yunnan_valley.21.d: "队伍通过暗河进入虫谷核心区域，这里的生态系统极为独特：荧光菌遍布岩壁，巨型藤蔓交错纵横，各种从未见过的毒虫与奇异生物在此共生。这里既是死亡禁地，也是一个完整的原始生态系统。"
 dsk_yunnan_valley.21.f: "“不可思议……”老苗医跪在地上，双手颤抖地触碰着发光的苔藓。“献王利用痋术与风水，打造了这个封闭的生态系统，既守护了陵墓，也孕育了无数毒物。真是令人匪夷所思！”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]静静地看着这一切。"
 dsk_yunnan_valley.21.a: "避开危险区域，直奔地宫入口！。"

 # Event 22: Scientific Breakthrough
 dsk_yunnan_valley.22.t: "科学突破"
 dsk_yunnan_valley.22.d: "对虫谷生物多样性的深入研究取得了重大突破，这将为基础科学带来革命性的影响。"
 dsk_yunnan_valley.22.f: "实验室里，科学家们兴奋地交流着发现。\n\n“这些化合物的结构前所未见！”\n\n“如果我们能合成它们……医学将进入一个全新的时代！”\n\n“我建议立即向[ROOT.GetCountry.GetCapital.GetCityHubName]汇报这个发现！”"
 dsk_yunnan_valley.22.a: "立即公布这一重大发现。"
 dsk_yunnan_valley.22.b: "保守秘密，优先开发商业价值。"

 # Event 23: Medical Revolution
 dsk_yunnan_valley.23.t: "医学突破"
 dsk_yunnan_valley.23.d: "从虫谷草药中提取的有效成分在实验中显示出惊人的医疗效果，可能用于治疗多种疾病。"
 dsk_yunnan_valley.23.f: "“这是本世纪最重要的医学发现！”医学主管激动地说。\n\n“我们的实验表明，这些化合物对感染、炎症甚至某些癌症都有显著效果。”\n\n“如果投入生产……人类的健康事业将迎来革命！”"
 dsk_yunnan_valley.23.a: "立即开始临床试验。"

 # Event 24: Treasure Trove
 dsk_yunnan_valley.24.t: "连环翻板绝杀"
 dsk_yunnan_valley.24.d: "队伍进入甬道，地面铺设的青石板看似稳固，实则暗藏连环翻板机关。一旦触发，木板翻转便会坠入布满刀锥的深坑，而甬道顶端还会落下铁索吊石，前后夹击之下绝无生机。领队需快速判断通行之法。"
 dsk_yunnan_valley.24.f: "甬道内阴风阵阵，墙壁上的壁画早已褪色，唯有地面的青石板泛着冷光。\n\n" 不对劲，这些石板的缝隙里没有积灰，定是机关！"曾挖过古墓的老者蹲下身，指尖轻敲石板，发出空洞的回响。\n\n话音未落，一名心急的队员不慎踏中边缘石板，"咔嚓"一声，石板瞬间翻转，队员惊呼着坠入黑暗，紧接着传来利刃穿透肉体的惨叫。\n\n顶端的巨石轰然松动，铁索摩擦声刺耳难听。" 快找承重石！连环翻板必有固定支点！"领队[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]大喊着扫视四周，发现墙角立着三块刻有滇文的石桩。"
 dsk_yunnan_valley.24.a: "按滇文顺序撬动石桩，破解机关。"
 dsk_yunnan_valley.24.b: "用苗刀支撑石板，强行快速通过。"
 dsk_yunnan_valley.24.c: "点燃火铳轰击吊石，开辟生路"

 # Event 25: Cultural Assimilation
 dsk_yunnan_valley.25.t: "跳舞草迷魂阵"
 dsk_yunnan_valley.25.d: "队伍在谷中密林遭遇成片跳舞草，这种植物对声音和温度极度敏感，叶片会随动静舞动，其释放的花粉能让人陷入幻觉，误将同伴视作毒虫猛兽。[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]发现花粉需强光才能驱散，但点火可能引来更危险的生物"
 dsk_yunnan_valley.25.f: "密林深处，成片的跳舞草随风摇曳，紫色叶片如同无数只小手挥舞，空气中弥漫着淡淡的甜香。\n\n"不对劲，我怎么看到前面全是水彘蜂！"一名队员突然举起火铳，对准身旁的同伴。\n\n" 是幻觉！这草的花粉能迷人心智！"[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]捂住口鼻，从药囊掏出晒干的艾草，"艾草燃烧的浓烟能破幻觉，但火光会引来尸蛾和雕鸮！"\n\n此时，被幻觉控制的队员已经扣动了扳机，火铳子弹擦着领队的肩头飞过，击中了旁边的古树，惊起一群飞鸟"
 dsk_yunnan_valley.25.a: "点燃艾草浓烟，驱散花粉幻觉！"​
 dsk_yunnan_valley.25.b: "用湿布捂住口鼻，快速冲出草丛！"​
 dsk_yunnan_valley.25.c: "打晕幻觉队员，携带撤离！"

 # Event 26: Alliance Formed
 dsk_yunnan_valley.26.t: "雕鸮夜袭"
 dsk_yunnan_valley.26.d: "队伍在山谷露营时，遭遇巨型雕鸮袭击。这种滇南猛禽体型庞大，喙坚爪利，昼伏夜出，尤其对火光敏感，常群体捕猎。此时营地的火把吸引了数只雕鸮，队员们需在守住营地和熄灭光源之间做出选择。"
 dsk_yunnan_valley.26.f: "夜色如墨，营地的火把照亮了周围的空地，队员们正在修补破损的帐篷。突然，几声尖锐的啼叫划破夜空，三只翼展近丈的巨型雕鸮俯冲而下，利爪直扑火把旁的队员。\n\n" 是雕鸮！这东西能叼走小牛犊！"猎户出身的队员挥起苗刀，斩断了一只雕鸮的翅膀，却被另一只抓伤了臂膀，鲜血瞬间涌出。\n\n 雕鸮的羽毛如同铁甲，火铳近距离射击才能奏效，但黑暗中根本无法瞄准。" 熄灭火把！它们怕黑！"老苗医大喊着想要吹灭火把，却被[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]领队拦住："没了光，我们会成为蛭蛊和尸蛾的猎物！""
 dsk_yunnan_valley.26.a: "保留火把，集中火力反击雕鸮！"​
 dsk_yunnan_valley.26.b: "熄灭所有光源，潜伏躲避袭击！"​
 dsk_yunnan_valley.26.c: "丢弃部分行囊，引开雕鸮注意力！"

 # Event 27: Ancient Prophecy
 dsk_yunnan_valley.27.t: "献王预言"
 dsk_yunnan_valley.27.d: "当鬼洞之印重现人间，红斑之诅咒蔓延，远方之人将携天石而来，解厄救民，虫谷重归安宁。"
 dsk_yunnan_valley.27.f: "长老的声音在篝火旁回荡：\n\n“当银色的鸟儿带来远方的人，当夜晚的星星开始歌唱，虫谷的大门将再次打开……”\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]静静地听着，心中涌起一种奇异的感觉。也许，他们的到来并非偶然。"
 dsk_yunnan_valley.27.a: "倾听这个古老的预言。"

 # Event 28: Legend of the Valley
dsk_yunnan_valley.28.t: "玉棺怨魂缠"​
dsk_yunnan_valley.28.d: "队伍抵达献王主墓室，中央摆放着一具通体翠绿的玉棺，棺身刻满缠枝痋纹，棺盖缝隙中渗出墨绿色液体，散发着摄人心魄的寒意。触碰玉棺会触发怨气反噬，让队员陷入献王生前的杀戮幻境，而打开玉棺可能获得雮尘珠线索，但也会释放棺内封印的痋毒怨魂。"​
dsk_yunnan_valley.28.f: "主墓室穹顶镶嵌着夜明珠，照亮了中央的玉棺，翠绿的棺身在珠光下泛着幽冷的光泽，棺沿滴落的墨绿色液体落在地面，腐蚀出一个个小坑。\n\n" 这是献王的玉椁，用千年墨玉打造，里面封印着他的怨魂和痋毒！"老苗医掏出罗盘，指针疯狂旋转，" 幻境会让人重现被献王虐杀的惨状，意志不坚者会直接吓死！"\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]领队盯着棺盖上的痋纹，发现纹路末端隐约指向棺底的一个凹槽：" 雮尘珠的线索一定在里面！但打开棺盖，怨魂就会出来缠上我们！"话音刚落，一名被财宝冲昏头脑的队员已经伸手去推棺盖，指尖刚触碰到玉棺，就发出一声惨叫，双目圆睁，仿佛看到了极其恐怖的景象，整个人瘫倒在地，口吐白沫。\n\n 玉棺开始轻微震动，棺盖缝隙中的墨绿色液体渗出速度加快，周围的温度骤降，墙壁上浮现出无数扭曲的黑影，像是有东西要从阴影中钻出来。"​
dsk_yunnan_valley.28.a: "强行打开玉棺，寻找雮尘珠线索！"​
dsk_yunnan_valley.28.b: "用黑狗血泼洒玉棺，压制怨气！"​
dsk_yunnan_valley.28.c: "放弃玉棺，寻找主墓室其他出口撤离！"

 # Event 29: Mutual Respect
dsk_yunnan_valley.29.t: "青铜咒铃抉择"​
dsk_yunnan_valley.29.d: "队伍在一座陪葬坑中发现一尊青铜铃，铃身刻满痋咒符文，摇动时会发出能驱散低级毒虫的声波，但同时也会唤醒沉睡的痋人。陪葬坑中还散落着不少金银器物，部分队员再次动了贪念，想要连同铜铃一并带走。"​
dsk_yunnan_valley.29.f: "陪葬坑内堆满了腐朽的棺木，中央的石台上摆放着一尊拳头大的青铜铃，符文在荧光菌的映照下泛着绿光。\n\n"这是献王的镇蛊铃，铃声能驱毒，但痋咒会唤醒附近的痋人。"风水先生抚摸着铃身的纹路，面色凝重。\n\n一名队员趁众人不注意，偷偷将一把金饰塞进怀里，又伸手去拿青铜铃："这铃铛既是宝物，又能驱毒，不带白不带！"\n\n[SCOPE.sCharacter('yunnan_expedition_leader').GetLastNameNoFormatting]领队一把抓住他的手腕：" 贪念会害死我们！这铃铛一旦离开石台，陪葬坑的痋人就会苏醒！"话音刚落，石台下传来轻微的敲击声，仿佛有东西正在破土而出。"​
dsk_yunnan_valley.29.a: "放弃铜铃与财宝，迅速撤离陪葬坑！"​
dsk_yunnan_valley.29.b: "带走青铜铃，用铃声开路闯出去！"​
dsk_yunnan_valley.29.c: "拿走部分财宝，丢弃火把阻挡痋人！"

 # Event 30: Economic Boom
dsk_yunnan_valley.30.t: "血池尸蛾劫"​
dsk_yunnan_valley.30.d: "队伍进入献王墓主墓室前的耳室，地面布满暗红色血池，池水中浸泡着数百具孩童骸骨，池底暗藏痋卵。一旦有人失血滴入池中，痋卵会瞬间孵化成尸蛾，这种飞虫以腐血为食，翅膀带毒粉，被叮咬后会引发溃烂，且尸蛾惧火却喜油脂，队员携带的火油可能成为催命符。"​
dsk_yunnan_valley.30.f: "耳室阴暗潮湿，空气中弥漫着浓烈的血腥味与腐臭，地面的血池泛着诡异的红光，骸骨在水中若隐若现，水面漂浮着一层薄薄的白色虫卵。\n\n"这是献王的‘养蛾池’，用童男童女炼制痋卵，遇血即活！"风水先生面色惨白，后退时不慎踩碎一块骸骨，脚踝被尖锐的骨茬划破，鲜血滴入池中。\n\n 刹那间，血池沸腾起来，无数黑色尸蛾破卵而出，翅膀震动发出"嗡嗡"声，毒粉如同黑雾般弥漫。"快用火油烧！它们怕火！"猎户队员掏出腰间的火油壶，却被老苗医喝止："火油会引火烧身！而且尸蛾最喜欢油脂，我们身上的油脂会让它们疯抢！"\n\n尸蛾已经形成包围圈，最前面的几只已经扑向受伤的风水先生，翅膀划过他的脸颊，留下几道发黑的血痕。"​
dsk_yunnan_valley.30.a: "泼洒火油点燃血池，焚烧尸蛾！"​
dsk_yunnan_valley.30.b: "用湿布包裹身体，快速跃过血池！"​
dsk_yunnan_valley.30.c: "割破牲畜行囊，用牲畜血引开尸蛾！"



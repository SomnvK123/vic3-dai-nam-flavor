 dsk_dai_events.2.t:0 "《内政革新告成诏》"
 dsk_dai_events.2.d:0 "全国30省地簿修订毕，机密院拟定的新税则颁行天下，象军演训渐入佳境，内政改革诸项事宜皆已落地。"
 dsk_dai_events.2.f:0 "自朕承明命先帝之绪，痛国基未固、吏治渐弛，乃循 “中夏之制” 举革新大业，历五载经营，今诸务告成。\n\n朕集群臣之智，遵《皇越律例》宽猛相济之旨，定三十行省之制，罢南北总镇以收中枢之权，设机密院总揽军国，立九品官阶以明职守，使政令直达村社。又遣官丈量田土，厘订三等税则，禁公田私鬻，罢灯油、俗簿诸苛捐，府库岁入较前增三成，农桑渐兴。更整饬科举，增设算学、农学之科，取“经世致用”之才；编练象军，修缮沱㶞、顺安诸港城防，边备稍振。"
 dsk_dai_events.2.a:0 "夫我[ROOT.GetCountry.GetAdjective]为“中夏之邦”，当以礼义固国本，以武备御夷狄。今纲纪昭彰，吏治清明，村社协和，士民归心。"
 dsk_dai_events.2.b:0 "继续加强我们的集权改革。"

 dsk_dai_events.3.t:0 "《军政革新振国诏》"
 dsk_dai_events.3.d:0 "新军六镇编练竣事，红河水师成军列阵，新式枪炮局铸械不绝，军政革新诸务悉皆落地。"
 dsk_dai_events.3.f:0 "自西洋寇窥伺南疆，边烽屡警，朕深念“兵者国之干”，承明命先帝整军遗训，举军政革新之策，历三载淬砺，今武功初成。\n\n朕采“西法参汉制”之略，废旧制镇兵，编练六镇新军，设讲武堂培育将才，定“募兵三策”（择壮丁、明赏罚、严操练），军容肃然。又于顺化设枪炮局，仿西洋铸炮之术，造开花炮、后膛枪；拓建红河水师，置炮舰十艘，巡防红河、湄公河要害，断寇贼窥伺之路。更整饬边镇，加固谅山、高平关隘，增筑沱㶞港炮台，使南疆壁垒森严。"
 dsk_dai_events.3.a:0 "夫我[ROOT.GetCountry.GetAdjective]拥山河之固，得甲兵之利，当以干戈卫邦土，以武德安黎元。今军威远振，边备无虞，内外归心。"

 dsk_dai_events.4.t:0 "《教化革新兴邦诏》"
 dsk_dai_events.4.d:0 "国子监增置西学馆，府州县学广设蒙塾，译书局刊印经世书籍，教育革新诸务次第告成。"
 dsk_dai_events.4.f:0 "自三代以降，教化为本，邦国之兴，系于人才。朕承宗庙之灵，念明命先帝“崇儒兴学”之遗训，痛旧日学制拘守章句、不切时务之弊，乃举教化革新之策，历四载经营，今文风渐盛。\n\n朕循“儒为本、西为用” 之旨，重修国子监，增置西学馆，设算学、格致、舆地、海防四科，聘中夏宿儒与西洋通才共授课业；令府州县各设蒙塾，免贫家子弟学费，广开民智；立译书局，译印西洋兵书、农工之术与华夏经世典籍，颁行各学；更整饬科举，于乡试、会试中增设“经世策论”，拔擢通晓实务之才。"
 dsk_dai_events.4.a:0 "夫我[ROOT.GetCountry.GetAdjective]崇礼重教，育贤才以辅国，启民智以固邦。今学风鼎盛，俊秀辈出，中兴之基可立。"
 dsk_dai_events.4.b:0 "教育人民是最重要的。"

 dsk_dai_events.5.t:0 "《劝农兴商富国诏》"
 dsk_dai_events.5.d:0 "南圻屯田广获丰收，商埠通商规制既定，官办工场技艺日精，经济革新诸务成效昭然。"
 dsk_dai_events.5.f:0 "夫国之富，在劝农以足食，兴商以通财，工巧以济用。朕承明命先帝 “重农务本” 之遗训，鉴西洋通商之利、工场之巧，乃举经济革新之策，历五载擘画，今府库充盈，民生渐裕。\n\n朕令南圻开屯垦之策，遣官督导修堤浚河，引湄公河之水灌溉荒田，推广占城稻、番薯等高产作物，垦荒百万亩，岁入粮米较前增四成，足供军民之需；又定商埠通商之制，规范沱㶞、西贡等港关税，设市舶司管理中外贸易，许华商、西洋商设栈通商，岁入关税倍于往昔；立官办工场，仿西洋之法铸钱、织布、制糖，聘华侨巧匠传授技艺，器物精良，行销内外；更整饬盐铁、矿产之政，设官署专管海盐煮制、煤炭开采，既利民生，又增国赋。"
 dsk_dai_events.5.a:0 "夫我[ROOT.GetCountry.GetAdjective]地沃物阜，通商利工以兴邦，劝农垦荒以固本。"
 dsk_dai_events.5.b:0 "利用改革成果，趁机充裕国库！"

 dsk_dai_events.6.t:0 "《革新底定中兴诏》"
 dsk_dai_events.6.d:0 "军政修明，教化昌隆，农工商阜，四境晏然，革新大业全域告成"
 dsk_dai_events.6.f:0 "《大南实录》载：“国之兴也，在革弊图新，在顺时合道。” 朕承列圣之绪，践阼以来，深念《尚书》“苟日新，日日新，又日新” 之训，鉴《皇越通志》“治道无恒，利民为本” 之旨，举内政、军政、教化、农工商诸般革新，历十载经营，今底定功成，国貌焕章。\n\n 观今日之大南：中枢则机密院总揽庶政，三十行省令行禁止，《皇越律例》宽严得宜，吏治澄明如镜，此乃内政革新之效也；边圉则六镇新军戈甲鲜明，红河水师帆樯林立，谅山、沱㶞炮台雄峙，“犯我南疆者虽远必诛”，此乃军政革新之功也；庠序则国子监西学并兴，府县蒙塾弦歌不辍，译书局典籍盈架，经世之才彬彬辈出，此乃教化革新之盛也；田野则南圻屯田稻浪千里，湄公河渠网纵横，占城稻、番薯遍野丰收，民无饥馑之虞；市井则商埠舟楫辐辏，官办工场器物精良，关税岁入倍于往昔，府库充盈有余，此乃农工商革新之福也。\n\n 昔李圣宗 “偃武修文，与民休息” 而有太平之治，黎利大帝 “驱夷复土，整饬国政” 而奠中兴之基。今朕承先贤之志，合万民之力，革故鼎新，方得此 “政通人和，百废俱兴” 之局。"
 dsk_dai_events.6.a:0 "《诗经》有云：“周虽旧邦，其命维新。” 我[ROOT.GetCountry.GetAdjective]承中夏之脉，启革新之运，自此国祚绵长，威加四海"

 dsk_dai_events.7.t:0 "[SCOPE.sCountry('chi_scope').GetAdjective]输援，纾解国困"
 dsk_dai_events.7.d:0 "府库亏空难支革新军需，[SCOPE.sCharacter('ruler_scope').GetFullName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]遣使携银赴顺化，愿援财帛以固宗藩"
 dsk_dai_events.7.f:0 "今大南革新方兴，军政、田政诸务耗银甚巨，南圻垦荒、新军编练未及见利，府库空虚已逾百万两，官吏俸禄、军饷筹措维艰。幸蒙[SCOPE.sCountry('chi_scope').GetAdjective][concept_overlord]念及千年宗藩之谊，闻我邦困厄，特遣礼部侍郎携内帑银五十万两、粮米十万石赴顺化，言 “唇齿相依，藩篱固则华夏安”，愿助我邦渡过难关。\n\n所援银粮，一半充作新军军饷、枪炮局铸械之费，一半用于南圻水利修缮、垦荒农具购置；粮米则分拨边镇军民，缓解饥馑之虞。[SCOPE.sCharacter('ruler_scope').GetFullName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]更允诺，若后续仍有匮乏，可再遣使奏请，将从粤海关关税中另拨补助。"
 dsk_dai_events.7.a:0 "感[concept_overlord]厚恩，谨守宗藩之礼"
 dsk_dai_events.7.b:0 "厚谊心领，然革新当凭己力，不敢劳烦[concept_overlord]"

 dsk_dai_events.8.t:0 "[SCOPE.sCountry('fra_scope').GetAdjective]来使"
 dsk_dai_events.8.d:0 "[SCOPE.sCountry('fra_scope').GetName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName]遣使至[SCOPE.sState('xili_sheng').GetName]，以通商为礼，求允传教士入国布道"
 dsk_dai_events.8.f:0 "大使抵[SCOPE.sState('xili_sheng').GetName]，携自鸣钟、望远镜等西洋奇器为礼，言愿与我[ROOT.GetCountry.GetAdjective]通商互市，更请准其传教士入国，于诸省建教堂、传福音。\n\n使臣称，[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName]信奉天主，以劝人为善为本，传教士入国只布教义、不涉政务，且愿助我邦修铁路、办学校。然朝堂议论纷纭：或言西教异俗，恐乱民心；或言允其传教可换通商之利，暂缓外患。"
 dsk_dai_events.8.a:0 "允其传教，以礼相待，通商之事可再议"
 dsk_dai_events.8.b:0 "陛下，异教乱俗，断不可允，逐使出境"

 dsk_dai_events.9.t:0 "改元#yellow 大南#!，帝统昭彰"
 dsk_dai_events.9.d:0 "[SCOPE.sCharacter('turkfm_tanzimat_character_1').GetFullName]、[SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName]、[SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName]等群臣奏[SCOPE.sCharacter('ruler_scope').GetFullName]请改国号为#yellow 大南#!，以彰显国威，统御中夏"
 dsk_dai_events.9.f:0 "朕承列圣之绪，奄有中夏，抚绥南邦，威加四海。然国号仍沿旧称，不足以彰一统之盛，昭万世之基。今群臣咸奏，宜改国号为#yellow 大南#!，定年号嗣德，以承天景命，光昭帝业。\n\n夫#yellow 大南#!者，言其疆域之广，涵盖中夏与南邦；言其德化之远，被于万方。改国号则正名定分，统御中外；定年号则更新庶政，与民更始。此举上合天心，下顺舆情，实乃万世不易之典。"
 dsk_dai_events.9.a:0 "准奏！改国号为#yellow 大南#!，定年号嗣德，布告天下"
 dsk_dai_events.9.b:0 "国号乃祖宗所定，不可轻改，宜守成法以固邦本"
 we_are_dai_tt:0 "[ROOT.GetCountry.GetName]将被称为#yellow 大南帝国#!"
 nantian_china_tt:0 "[ROOT.GetCountry.GetName]将被称为#yellow 南天中华#!"
 dsk_dai_events.10.t:0 "六星拱极"
 dsk_dai_events.10.d:0 "[SCOPE.sCountry('chi_scope').GetAdjective][SCOPE.sCharacter('chi_ruler_scope').GetFullName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]遣使赴[SCOPE.sState('capital_scope').GetCityHubName]，愿结攻守[concept_alliance]，共御西洋[concept_great_power]"
 dsk_dai_events.10.f:0 "十九世纪西洋寇势日炽，[SCOPE.sCountry('gbr_scope').GetAdjective]、[SCOPE.sCountry('fra_scope').GetAdjective]诸邦窥伺南疆、觊觎滇越，[SCOPE.sCountry('chi_scope').GetAdjective]与[ROOT.GetCountry.GetAdjective]唇齿相依，情谊历千年而弥坚。今[SCOPE.sCharacter('chi_ruler_scope').GetFullName]特遣钦差大臣携国书至[SCOPE.sState('capital_scope').GetCityHubName]，言 “六星拱极，同气连枝；外侮当前，唯有[concept_alliance]可固疆圉”，愿与我[ROOT.GetCountry.GetAdjective]缔结攻守盟约。\n\n盟约约定：[SCOPE.sCountry('chi_scope').GetAdjective]助[ROOT.GetCountry.GetAdjective]编练新军、仿制枪炮，每年拨银三十万两充作军饷；[ROOT.GetCountry.GetAdjective]则许[SCOPE.sCountry('chi_scope').GetAdjective]军队驻屯谅山、高平，遇外敌入侵时，两国水陆并进、相互驰援，通商互市免征关税。朝堂上下皆言，此举合则两利，分则两伤，乃保境安民之上策。"
 dsk_dai_events.10.a:0 "谨奉盟约，西洋外夷环伺，中越为固疆圉缔结攻守同盟，共抗外患"
 dsk_dai_events.10.b:0 "千百年以来，[ROOT.GetCountry.GetAdjective]都奉[SCOPE.sCountry('chi_scope').GetAdjective]为宗主国，亿万年后也皆如此"
 
 dsk_dai_events.11.t:0 "屠龙之勇"
 dsk_dai_events.11.d:0 "[SCOPE.sCharacter('turkfm_tanzimat_character_1').GetFullName]、[SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName]、[SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName]激愤请战，天命归南，复我交趾"
 dsk_dai_events.11.f:0 "朕承天命，抚有[ROOT.GetCountry.GetAdjective]，疆土万里，士民亿兆，本当自主沉浮，岂容他人掣肘！然[SCOPE.sCountry('chi_scope').GetName][concept_overlord]自居，屡以朝贡索求无度，干涉内政，视我邦与#v 中南半岛#!诸国为藩篱附庸。近年更借援助之名，遣官驻跸#yellow 顺化#!，把持关税，甚至欲夺我红河水师之权，此等行径，是可忍孰不可忍！\n\n清夷起于满洲，窃据中原、盗我交趾，剃发易服、毁我衣冠，实为华夏之贼、南天之患！今清夷内忧外患交织，洋务虚有其表，疆防废弛，而我大南兵强马壮：仿清廷火器造红衣大炮，练儒学教化之劲旅，真腊、老挝仆从军愿效死力！天命已归南天，此时北上，正是复我故地、逐鹿中原之机！\n\n今群臣叩阙，陈词激昂：“昔黎利大帝驱明复越，仗三尺剑定南疆；今我[ROOT.GetCountry.GetAdjective]革新有成，兵甲充足，何惧一战！”三军将士亦血书请战，愿效死力。朕意已决，颁诏天下：即日起，断绝与[SCOPE.sCountry('chi_scope').GetAdjective]宗藩关系，罢黜朝贡，驱逐其驻跸官员！传檄谅山、高平诸军，严阵以待，敢犯我[ROOT.GetCountry.GetAdjective]疆界者，虽强必诛！"
 dsk_dai_events.11.a:0 "兴义师，伐强清！何难具有哉？"
 
 dsk_dai_events.12.t:0 "《田政厘定固本诏》"
 dsk_dai_events.12.d:0 "天下田土丈量毕备，均税之法颁行全域，荒田垦辟成效昭然，田政革新诸务圆满告竣。"
 dsk_dai_events.12.f:0 "《周礼》有云：“以土均之法，辨五物九等，制天下之地征。” 朕承明命先帝“重农固本”之遗训，鉴往昔田籍混乱、赋役不均之弊，深念 “民以食为天，国以农为本”，乃举田政革新之策，历三载精勤，今田制井然，民得其所。\n\n 朕遣钦命丈量使分赴三十行省，遍历山川村社，勘定田界，登记地类，编订《大南地簿》，使“寸土有籍，亩田可查”，杜绝豪强隐田、吏胥舞弊之弊；又遵《皇越律例・田赋篇》定制，厘定“上中下”三等田税，按亩输纳，蠲免贫户、新垦荒田三年赋税，使“力役均平，赋税公允”，民无重负之叹；更颁《垦荒劝农令》，鼓励流民、边民开垦南圻、西原荒田，遣官督导修治陂塘沟渠，引湄公河、红河之水灌溉，推广深耕、育秧新法，新增垦田八十万亩，岁入粮米较前增五成，足以裕国足民。"
 dsk_dai_events.12.a:0 "夫田制正则民心安，民心安则邦本固"

 dsk_dai_events.13.t:0 "法兰西越南战团"
 dsk_dai_events.13.d:0 "内忧外患交困无援，为保国祚暂附[SCOPE.sCountry('fra_scope').GetName]，结受保护之约"
 dsk_dai_events.13.f:0 "今大南遭逢千古未有之危局：北境[SCOPE.sCountry('chi_scope').GetName]陈兵边境，逼我重归宗藩；南圻乱匪蜂起，割据州县；府库空虚，新军难支，西洋诸邦坐观成败，唯有[SCOPE.sCountry('fra_scope').GetName]愿伸援手。\n\n[SCOPE.sCountry('fra_scope').GetName]遣使言：“愿以兵甲助尔平乱御敌，保[ROOT.GetCountry.GetAdjective]疆土无虞，但需结受保护之约，外交、军政暂归法方节制。” 朝堂之上，群臣垂泪争议：或言“宁为玉碎，不为瓦全”，或言“留得青山在，不怕没柴烧”。朕痛定思痛，念及列圣披荆斩棘创下之基业，不忍见社稷倾覆、黎民涂炭。此非屈膝投降，实乃权宜之计、忍辱负重之举——借法人之兵解燃眉之急，待内乱平定、国力复振，再图自主之权。"
 dsk_dai_events.13.a:0 "暂附[SCOPE.sCountry('fra_scope').GetAdjective]以保国祚，徐图日后自强"

 dsk_dai_events.15.t:0 "[SCOPE.sCountry('fra_scope').GetAdjective]炮舰临城"
 dsk_dai_events.15.d:0 "拒法传教引兵祸，[SCOPE.sCountry('fra_scope').GetAdjective]舰陈兵[SCOPE.sState('xili_sheng').GetName]港外，逼我开关通商"
 dsk_dai_events.15.f:0 "前番法兰西遣使求传教，朕以 “异教乱俗” 严词拒绝，料其怀恨在心。今接边报：[SCOPE.sCountry('fra_scope').GetName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName]已遣远东舰队驶抵[SCOPE.sState('xili_sheng').GetName]港外，三艘铁甲舰列阵示威，扬言若不允其通商、弛传教之禁，便炮轰[SCOPE.sState('xili_sheng').GetName]！\n\n[SCOPE.sState('xili_sheng').GetName]乃我国重镇，港内商船云集，城外炮台年久失修，新军水师难敌铁甲巨舰。法军更遣使登岸，递最后通牒：限三日内答复，否则 “轰城为墟，玉石俱焚”。消息传至顺化，朝堂震动：或言 “暂允通商以避兵锋，留得一城生灵”，或言 “法夷欺人太甚，若退让一步，必得寸进尺，唯有死战！”"
 dsk_dai_events.15.a:0 "暂允通商，以缓兵祸，徐图后计"
 dsk_dai_events.15.b:0 "法夷猖獗，誓与[SCOPE.sState('xili_sheng').GetName]共存亡，宁为玉碎不为瓦全！"


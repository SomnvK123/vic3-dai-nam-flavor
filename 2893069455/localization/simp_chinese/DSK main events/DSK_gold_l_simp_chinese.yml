 no_dai_tt:0 "[ROOT.GetCountry.GetAdjective]已亡国"​
 no_fic_stroy_tt:0 "暂无法属印度支那剧情"
 we_are_vie_winner:0 "[SCOPE.sCountry('fra_scope').GetAdjective]投降！"​
 dsk_protect_our_vie_button:0 "请求[SCOPE.sCountry('chi_scope').GetAdjective]出兵"
 dsk_protect_our_vie_button_desc:0 "唇亡齿寒，请求[SCOPE.sCountry('chi_scope').GetAdjective]出兵"
 je_protect_our_vie:0 "国祚危噫！"​
 je_protect_our_vie_reason:0 "法夷铁蹄踏破顺安要塞，顺化皇城已见敌营炊烟！自北圻失守、河内沦陷，中圻防线节节败退，南圻殖民据点尽数反扑，法军分三路合围，所到之处屠城焚寨，三圻山河已破碎大半。#yellow 嗣德帝#!忧愤而崩，新君临危受命，朝堂上下唯有“死战”二字\n\n然新军溃散、粮草断绝，黑旗军孤守宣光已成绝境，百姓扶老携幼逃难，哭声震彻红河两岸！传檄全国：凡我[ROOT.GetCountry.GetAdjective]儿女，无论老幼，皆持戈抗敌；再遣八百里加急赴镇南关，泣请天朝速发援兵！纵使[SCOPE.sCountry('fra_scope').GetAdjective]船坚炮利，纵使前路唯有死战，我大南绝不屈膝！皇城之上，龙旗不倒；抗争之火，永不熄灭\n\n愿以亿万生民之血，换山河重光之日；愿以王朝存亡之危，唤天朝援师之至！"

 je_protect_our_vie_go:0 "顺化围城"​
 je_protect_our_vie_go_reason:0 "[SCOPE.sCountry('fra_scope').GetAdjective]遣使入城，掷出“保护条约”草案，字字诛心：废我宗主权、割我疆土、掌我外交，逼朕认贼作父，沦为殖民附庸！使臣狞笑威胁：“三日内签约则保宗庙，否则踏平顺化、鸡犬不留！”朕将条约掷于阶下，怒喝：“[ROOT.GetCountry.GetAdjective]江山乃列祖列宗百战所创，宁为玉碎，不为瓦全！朕愿与皇城共存亡，绝不签此辱国之约！”朝堂诸臣免冠泣血，或请战守城，或愿出使求援，无一人言降！"
 liuyongfu_here_tt:0 "#yellow 刘永福#!已经出现"​

 dsk_dai_events.28.t:0 "第二次顺化大捷"​
 dsk_dai_events.28.d:0 "顺化死战破重围，联军合击驱法寇"​
 dsk_dai_events.28.f:0 "光绪十年春，顺化围城之战已逾半载——自法军兵临皇城，我[ROOT.GetCountry.GetAdjective]军民以血肉为城，宫娥执钗、少年持戈，守军残部与百姓同心死守，硬生生拖住法军攻势！正当弹尽粮绝之际，北朝清军自镇南关疾驰来援，黑旗军突破宣光重围直捣法军后路，三路大军形成合击之势，顺化城外欢声雷动！顺化围城一解，中圻、北圻军民纷纷响应，南圻义民趁机起事，收复沦陷圩镇，法军首尾不能相顾，节节败退，最终被逼至南圻西贡孤城，遣使乞降！\n\n数月激战，法军尸横遍野，殖民据点尽数拔除，三圻山河终得光复！百姓焚香告慰阵亡英灵，朝堂之上齐呼“山河重光”，朕亲赴顺安要塞，祭告天地：“昔年夷寇犯境，宗庙危殆；今日军民同心，逐夷出境——大南儿女守土有责，虽万死而不辞！"​
 dsk_dai_events.28.a:0 "签订《顺化光复条约》"

 dsk_dai_events.29.t:0 "《第二次西贡条约》"​
 dsk_dai_events.29.d:0 "安邺之乱虽平，法夷逼签新约"​
 dsk_dai_events.29.f:0 "同治十三年（1874年）冬，北圻安邺之乱甫定，法夷却以“平乱有功”为名，遣特使赴#yellow 西贡#!逼宫！此前法军借通商纠纷挥师北上，陷河内、掳大臣，虽为黑旗军击溃、安邺授首，然法舰仍游弋于湄公河，南圻六省早已被其吞并，今番又以“永久和平”为幌子，强推条约草案，字字皆为削权之谋！\n\n草案所列，触目惊心：认[SCOPE.sCountry('fra_scope').GetAdjective]为“保护国”，外交需经法国核准；开放红河全域通航，法军可自由出入北圻；允传教士深入内地布道，赋予治外法权；割让南圻西部三省永久归法\n\n这纸条约，割我疆土、丧我主权、辱我邦国，让列祖列宗百战创下的基业，沦为夷寇鱼肉!"
 dsk_dai_events.29.a:0 "必雪此耻、复河山"​
 dsk_dai_events.30.t:0 "《南宁条约》"​
 dsk_dai_events.30.d:0 "[SCOPE.sCountry('chi_scope').GetAdjective]与[ROOT.GetCountry.GetAdjective]联军大破法夷，南宁共签平等盟约，大南重光主权"​
 dsk_dai_events.30.f:0 "自《西贡再辱条约》被逼签半载，我大南军民忍辱蓄力，北朝清廷终应泣请，遣大军入越，与黑旗军、越军组成联军，三路合击法寇！红河沿岸，联军炮火轰毁法军据点；南圻旷野，义民四起袭扰敌营，法军首尾不能相顾，节节败退，最终被逐出越南全境，残部遁入南洋！\n\n缔约之日，中越两国代表并肩而立，[SCOPE.sCountry('fra_scope').GetAdjective]被迫签下《南宁条约》：归还所有侵占领土、支付巨额赔偿、放弃一切殖民特权，正式承认越南独立自主！使臣归朝献约，朕展卷细读，泪湿龙袍\n\n1.法国即刻退出越南全境及中南半岛所有殖民据点，永久放弃对越南的一切领土主张，确认南圻六省为越南固有领土；\n2.法国向越南支付军费及民损赔偿1500万法郎，3年内缴清；另向清廷支付援军军费500万法郎；\n3.法国正式承认越南独立自主，放弃所有殖民特权（治外法权、传教特权、内河航运权等），法籍人士在越需遵守越南法律；\n4.法国承诺永不入侵越南及中越同盟势力范围，违约需支付五倍赔偿，中越有权联合反击；\n5.越南享有完全外交自主权，法国需在欧洲各国公示条约，承认侵略罪行并书面道歉；"
 dsk_dai_events.30.a:0 "家祭无忘告乃翁..."​

 dsk_dai_events.31.t:0 "法军受降仪式"​
 dsk_dai_events.31.d:0 "[SCOPE.sCountry('fra_scope').GetAdjective]军残部献械请降，顺安要塞举行受降大典，大南扬眉吐气"
 dsk_dai_events.31.f:0 "《南宁条约》缔约逾月，法军残部按约集结于顺安要塞——这片曾被夷寇攻破的国门之地，今日成为其低头认罪的受降场！朕命镇国大将军率越军主力、黑旗军精锐与[SCOPE.sCountry('chi_scope').GetAdjective]代表团共赴受降大典，顺安城头遍插大南龙旗与清军帅旗，红河之上战船列阵，旌旗蔽日，军威赫赫！"
 dsk_dai_events.31.a:0 "法军指挥官躬身领罪，承诺遵守《南宁条约》所有条款，永不侵犯​"
 dsk_dai_events.31.b:0 "按《南宁条约》处置法军战俘，遣返安分者，严惩战争罪犯。"​
 new_dai_tt:0 "完成全部改革"​
 anti_china_with_sia:0 "越暹制清联盟"
 anti_china_with_sia_tt:0 "#v 越暹制清联盟#!成立"
 
 dsk_dai_events.33.t:0 "朝堂辩论"
 dsk_dai_events.33.d:0 "亲华反华势均力敌，[SCOPE.gsInterestGroup('is_intelligentsia_ig').GetName]的[SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName]与[SCOPE.gsInterestGroup('is_army_ig').GetName]的[SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName]为代表的两派在朝堂激辩"
 dsk_dai_events.33.f:0 "[SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName]免冠泣血：“天朝乃华夏正统，宗藩之盟是我大南百年屏障！昔年法夷犯境，若非清廷驰援，南圻早已沦陷！今若背华，西方列强必乘虚而入，暹罗亦会蠢蠢欲动，内无民心归附，外无强援可依，大南危矣！”言罢，群臣纷纷附和，恳请[SCOPE.sCharacter('turkfm_tanzimat_character_1').GetFullName] “恪守旧盟，遣使朝贡，借天朝之威安邦”。\n\n[SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName]将军按剑怒斥：“清夷早已不复当年之勇，内忧外患缠身，何以护我？朝贡岁岁耗费府库，疆土扩张处处受制，所谓‘屏障’不过是束缚手脚的枷锁！今我朝新军已成，西学技艺渐通，联暹制华、自主争霸中南，方是求生之道！若再依附，终将沦为天朝附庸，永无出头之日！” "
 dsk_dai_events.33.a:0 "支持#g 亲华派#!：遣使赴京，加固宗藩之盟"
 dsk_dai_events.33.b:0 "支持#V 反华派#!：推行自主之策"
 dsk_rtc_revival_modifier:0 "小洋务运动"

 dsk_dai_events.34.t:0 "强越运动"​
 dsk_dai_events.34.d:0 "[SCOPE.sCountry('chi_scope').GetAdjective]内忧外患启洋务，[ROOT.GetCountry.GetAdjective]朝野呼效仿，革新与守成之争再起"
 dsk_dai_events.34.f:0 "北境传来消息：[SCOPE.sCountry('chi_scope').GetAdjective]遭[SCOPE.sCountry('gbr_scope').GetAdjective]叩关、内乱频仍，却于危难之际推行#v ‘洋务运动’#!，设工厂、练新军、兴学堂，欲师夷长技以自强！消息传至#yellow 顺化#!，朝野震动，效仿之呼声日益高涨！\n\n[SCOPE.sCharacter('character_2_scope').GetFullName]大臣联袂上书：“天朝虽衰，仍知变通！昔年我朝奉华夏正朔，今日天朝兴洋务以自救，我等当紧随其后！仿清设军械局、开西式学堂，译西书、练新军，方能抵御列强、稳固南疆！” 士大夫与民间学子纷纷响应，递上《效仿洋务十策》，恳请“顺时势、兴革新”。"
 dsk_dai_events.34.a:0 "遣使赴京求章程，照搬清廷洋务模式"
 dsk_dai_events.34.b:0 "清廷已式微，我们应该学习西洋技艺！"
 zhengtong_modifier:0 "册封正统"​
 
 dsk_dai_events.35.t:0 "登基大典"​
 dsk_dai_events.35.d:0 "#v 绍治帝#!登基，[SCOPE.sCountry('chi_scope').GetAdjective][Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')]遣使携册封诏至"
 dsk_dai_events.35.f:0 "承先帝遗诏登基，改元绍治，朝野恭贺。然登基大典未毕，北境驿马急驰而至：清廷闻朕继位，遣礼部尚书携册封诏与御赐宝物南下，欲循宗藩旧制，册封朕为#v “越南国王”#!，以固华越盟好！\n\n#v 亲华派#!大臣齐聚太和殿，叩请接诏：“天朝册封乃正统之基！昔年列祖列宗皆受清廷册封，方得内外安宁。今接诏谢恩，既显我大南恪守礼制，又能获天朝军械、粮草之援，北境无虞，方可专心南进！”言罢，捧出前朝册封金印，恳请朕“顺天应人，维系宗藩”。\n\n#v 反华派#!将军则极力反对：“陛下乃南天[concept_dsk_china]之主，何必受清夷册封？今清廷内忧未平，洋务成效未显，不足以当‘天朝’之尊！拒受册封，自颁国号，方能彰显[ROOT.GetCountry.GetAdjective]自主之权，令四方蛮夷臣服！若再接诏，不仅耗费府库朝贡，更会束缚扩张之步，永为天朝附庸！” "
 dsk_dai_events.35.a:0 "接受册封：恭迎清使，举行册封大典"
 dsk_dai_events.35.b:0 "拒受册封：遣返清使，自颁国号"
 
 dsk_dai_events.36.t:0 "正统之争"​
 dsk_dai_events.36.d:0 "朝堂激辩华夷正统，支持清廷为华夏正朔者与斥其为蛮夷者针锋相对"​
 dsk_dai_events.36.f:0 "#v 亲华派#![SCOPE.sCharacter('character_2_scope').GetFullName]老臣手持《春秋》，高声陈词：“天地有常，华夷有别！清廷虽起于满洲，然入主中原后承汉制、尊孔孟、开科举，早已教化归一，为华夏正统！我[ROOT.GetCountry.GetAdjective]奉华夏正朔，当认天朝为宗，方能接续文明脉络！昔年#yellow 蒙古#!、#yellow 女真#!皆曾入主，终融于华夏，今日清庭亦是如此，岂能以族属斥为蛮夷？” [SCOPE.gsInterestGroup('is_landowners_ig').GetName]阶层纷纷附和，援引经史子集佐证“正统在清”。\n\n[SCOPE.gsInterestGroup('is_army_ig').GetName]大臣[SCOPE.sCharacter('character_1_scope').GetFullName]拍案而起，怒而反驳：“荒谬！华夷之辨，在礼不在族！清夷剃发易服，毁华夏衣冠；圈地占田，害中原百姓；闭关锁国，致文明停滞，实为蛮夷行径！我[ROOT.GetCountry.GetAdjective]坚守汉俗，传承儒学，衣冠未改、礼教未废，才是南天真正的[concept_dsk_china]！清夷不过是窃据中原的夷狄，何谈正统？我等当以‘恢复华夏’为己任，而非屈膝臣服！”"​
 dsk_dai_events.36.a:0 "清廷乃蛮夷！我乃南天小[concept_dsk_china]！"
 dsk_dai_events.36.b:0 "尔等争辩可以休矣！是蛮夷还是正统，隔日再论！"
 
 dsk_dai_events.37.t:0 "故国在南明"​
 dsk_dai_events.37.d:0 "朝堂激辩中华正统归属，一方力证南明为汉统延续，一方主张大清承华夏正脉"
 dsk_dai_events.37.f:0 "[SCOPE.sCharacter('character_1_scope').GetFullName]手持《春秋繁露》，高声陈词：“中华正统，在汉不在夷，在礼不在力！南明承朱明三百年基业，衣冠未改、儒学未弃，虽偏安一隅，仍是华夏汉统的延续！清夷起于满洲，剃发易服，毁华夏衣冠礼仪，圈地屠城，其行径与蛮夷无异，不过是窃据中原的盗统者！我大南奉华夏正朔，行汉家制度，当认南明为中华正统，斥清为夷狄，方不负‘南天小[concept_dsk_china]’之名！” 言罢，援引《大越史记全书》“我越与汉同源，明亡则华夏正统在南” 的论断，士子与军方纷纷附和。\n\n#v 亲华派#![SCOPE.sCharacter('character_2_scope').GetFullName]老臣手持《大清会典》反驳：“正统之辨，在顺天应人，在承制兴业！南明自弘光至永历，内乱频仍，偏安而亡，实乃天命所弃！大清入主中原二百余载，承汉制、开科举、修典籍、兴教化，康熙字典、四库全书传世，儒学之盛不亚于明！今日清庭虽有外患，却能兴洋务以自救，足见其正统之基已固！我朝列祖列宗受清册封，岁岁朝贡，若贸然斥清为夷，便是否定祖制、自绝外援，三圻安危将岌岌可危！” [SCOPE.gsInterestGroup('is_landowners_ig').GetName]阶层纷纷颔首，恳请陛下“明辨正统，维系宗藩”。"
 dsk_dai_events.37.a:0 "尊南明为中华正统，斥清为夷狄"
 dsk_dai_events.37.b:0 "尔等争辩可以休矣！是蛮夷还是正统，隔日再论！"

 dsk_dai_events.38.t:0 "联暹制华之盟"​
 dsk_dai_events.38.d:0 "#v 反华派#!势压朝堂，力主联合[SCOPE.sCountry('sia_scope').GetAdjective]缔结反华盟约，共抗清廷威慑"​
 dsk_dai_events.38.f:0 "#v 反华派#!借“华统之争”的胜势，已然占据朝堂主导，今日更是联袂上书，恳请陛下与[SCOPE.sCountry('sia_scope').GetAdjective]缔结盟约，共抗大清！\n\n[SCOPE.sCharacter('character_1_scope').GetFullName]手持暹罗国书，慷慨陈词：“陛下！清夷虽表面强盛，实则内忧外患缠身，洋务不过是强撑门面！暹罗与我大南同处南天，皆受清廷潜在威慑，近年清庭频频遣使中南，其扩张之心昭然若揭！今我朝反华之势已成，暹罗亦愿遣王子入越，缔结‘南天攻守同盟’，约定‘一方遭清攻击，另一方倾国相助’！联暹则唇齿相依，可断清廷南进之路，更能借暹罗之力稳固中南霸权，此乃天赐我大南自立之机！”军方将领纷纷附和，当庭请战，愿为盟约保驾护航。\n\n#v 亲华派#![SCOPE.sCharacter('character_3_scope').GetFullName]老臣伏地劝谏“：陛下三思！暹罗素以利益为先，与我朝素有边境争端，昔年还曾助清夹击我朝！此盟约不过是暹罗借我牵制清廷的权宜之计，一旦形势有变，必背盟弃约！且与暹罗结盟反华，无异于公然挑衅清廷，北境兵戈立起不说，西方列强亦可能趁虚而入，坐收渔利！我朝虽反华势盛，然国力尚未足以抗衡大清，当徐徐图之，而非急于结盟树敌！”"
 dsk_dai_events.38.a:0 "朕意已决，缔结盟约，遣使赴暹"
 dsk_dai_events.38.b:0 "时机未到，暂缓结盟，维持中立"

 dsk_dai_events.39.t:0 "南进教化真腊"​
 dsk_dai_events.39.d:0 "南进议题起势，力主以教化之名收复真腊故地"​
 dsk_dai_events.39.f:0 "“先王曾设镇西城于真腊，行改土归流之策，令腊人易服蓄发、习汉字、遵汉礼，《实录》明载‘蛮俗渐改革，汉风日兴’！今真腊复陷夷俗，僧侣乱政，礼制荡然，实乃圣化中断之憾！我大南既为南天中华，当续此教化大业：遣儒臣往真腊边境设学堂，授《论语》《孝经》；遣官吏颁华夏冠服，令其男子蓄发绾髻、女子着交领布衣；更当复设‘真腊布政使司’，以嘉定为根基渐次推进，使真腊重沐圣化，复归我文明版图！”"
 dsk_dai_events.39.a:0 "臣等愿尽死力，助陛下成中兴之业！"​
 dsk_dai_events.39.b:0 "陛下不可！我朝兴师教化，恐被指为‘越界扩张’。昔年广南阮主借明乡人蚕食真腊，耗时百年方得嘉定，今岂能急于求成？"​

 dsk_dai_events.40.t:0 "西拓哀牢故地，疆接暹罗"​
 dsk_dai_events.40.d:0 "顺化皇城太和殿内捷报频传:真腊([SCOPE.sCountry('lua_scope').GetAdjective])国王献城归降"​
 dsk_dai_events.40.f:0 "“昔年#yellow 嘉隆帝#!肇建大南，便以收复哀牢故地为志！今真腊归心、老挝附顺，朕设#v 真腊布政使司#!！定当乘胜西进，事半功倍，此乃天予不取反受其咎！\n\n西南诸小土邦孤悬无依，正是续成先帝遗愿之机！这些土邦虽为哀牢分支，却礼制粗疏、教化未开，久陷纷争，我大南既为南天中华，当举圣化之旗，西拓哀牢故疆，吞并诸小土邦，设府置县、推行儒学、颁行华夏礼制！如此一来，不仅能完成文明疆界的完整，更能与[SCOPE.sCountry('sia_scope').GetAdjective]全面接壤，以圣化之师震慑暹夷，彻底稳固中南霸权！”"
 dsk_dai_events.40.a:0 "吾皇万岁，万岁，万万岁！"​
 zhenla_buzhengsi_modifier:0 "真腊布政使司"​
 dsk_no_sia_tt:0 "#V 暹罗#!不存在"​
 dsk_dai_events.41.t:0 "华夷之辩"​
 dsk_dai_events.41.d:0 "华夷之辩初兴，主战派力主以东亚文明之姿，传华夏教化于南天诸邦"
 dsk_dai_events.41.f:0 "我[ROOT.GetCountry.GetAdjective]身为东亚文明一脉、南天唯一中华，当承华夏教化之责，布圣道于南天！\n\n“我大南自立国以来，袭华夏衣冠、行孔孟之道、用汉字典籍，礼乐教化与中原同源同流，实为东亚文明在南天的正统延续！反观南天诸邦，或未沐圣化、礼制粗疏，或杂糅夷俗、文脉不彰，非为蛮夷，实乃待教之邦！昔年周公制礼作乐，华夏圣王怀柔远人，皆以教化播文明、以礼乐安四夷！今我朝国力日隆，当承此东亚文明之任，遣使赴真腊、暹罗诸地，设儒学学堂、颁华夏典章，令南天诸邦同沐圣化、共循礼道！既显我南天中华之尊，又能凝聚东亚文明向心力，稳固南天秩序，此乃千秋盛业！”"
 dsk_dai_events.41.a:0 "我乃南天小[concept_dsk_china]！臣等力助陛下南进之策，传业布道于南天诸邦！"
 
 dsk_dai_events.42.t:0 "喃语与汉字"​
 dsk_dai_events.42.d:0 "南进西拓圣化日盛，朕力主确立“汉字为主、喃语为辅”，规范文教体系"
 dsk_dai_events.42.f:0 "“文字者，文明之载体、圣道之阶梯！我大南承华夏文脉，历来以汉字为正朔：科举取士考经史子集，官府文书用楷隶篆书，儒学教化凭汉字典籍，此乃南天中华与夷狄的根本区别！然喃语（字喃）源于汉字、贴合土音，百姓日用便捷，昔年黎朝#yellow 阮廌#!编《国音诗集》、#yellow 明命帝#!敕修《字学大成》，皆以喃语辅翼汉字，方便圣化普及！今当明定国策：官方文书、科举考试、儒学教材悉用汉字，以正文明源流；民间教化、乡约告示、启蒙读物可掺用喃语，以利圣道传播！如此“汉字为主、喃语为辅”，既固华夏文统，又便南天教化，使新附诸邦百姓识汉字、明礼义，早日融入中华！”"
 dsk_dai_events.42.a:0 "官方全用汉字，喃语仅许民间启蒙使用，严禁用于公文科举"
 dsk_dai_events.42.b:0 "设“汉字译喃局”，官方用汉字，民间教化允用喃语译著"
 kanji_modifier:0 "汉字正统性"​
 samll_kanji_modifier:0 "游离的喃字"​
 dyn_c_jzz_NANTIAN:0 "南天中华"​
 no_chaogong_modifier:0 "中华朝贡国"​
 NAN_ADJ:0 "南天"​
 je_dai_kill_yellow_dragon:0 "南天小中华"
 je_dai_kill_yellow_dragon_reason:0 "自秦汉至五代，我交趾故地为华夏直辖疆土，今已被清夷窃据四百余载！如今我[ROOT.GetCountry.GetAdjective]南收真腊、西并哀牢、老挝归附，南天一统，兵甲盈仓,借“华夷之辩”胜势，高举“天命在我”大旗，力主北上打击清朝，恢复交趾故地，承接华夏正统！\n\n“交趾者，我[ROOT.GetCountry.GetAdjective]先民祖地也！秦设象郡、汉置交州，华夏文明自此南播，我朝承续汉统，实为交趾故地的正统继承者！清夷起于满洲，窃据中原、盗我交趾，剃发易服、毁我衣冠，实为华夏之贼、南天之患！今清夷内忧外患交织，洋务虚有其表，疆防废弛，而我大南兵强马壮：仿清廷火器造红衣大炮，练儒学教化之劲旅，真腊、老挝仆从军愿效死力！天命已归南天，此时北上，正是复我故地、逐鹿中原之机！当分三路北伐：东路出谅山，取钦州、廉州，直逼广州；中路渡红河，收南宁、桂林，扼守岭南咽喉；西路经高平，攻柳州、贵阳，牵制清军西援！待收复交趾故地，便是华夏复兴之时！"

 dsk_dai_events.43.t:0 "复我交趾，天命在我"
 dsk_dai_events.43.d:0 "南进西拓，北上恢复交趾故地，大业已成！"​
 dsk_dai_events.43.f:0 "奉天承运，[Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')]诏曰：\n[SCOPE.sCharacter('ruler_scope').GetFullName]:盖闻天下正统，在德不在力，在礼不在域；邦国疆土，祖业所传，寸土不可失。我大南肇基南天，承华夏文脉三千年：秦设象郡，汉置交趾刺史部，我先民沐圣化、习汉礼，与中原同文同种、同根同源；五代以降，虽独立建国，然衣冠礼乐、儒学教化未尝稍改，自诩“南天小中华”，以续华夏正统为己任。\n\n昔清夷窃据中原，膻腥满室，剃发易服，毁我文脉；更窃我交趾故地，拆为桂滇边鄙，奴役华裔遗民，禁绝华夏衣冠，百年之间，故地百姓苦夷久矣！朕承天命，继大南鸿业，南收真腊、西复哀牢、北抚老挝，国力日隆，民心思汉。当此之时，清夷内忧外患，边军腐败，天命已移，朕顺天应人，举 “复我交趾、驱逐清夷” 之旗，遣王师两路北上：东路渡红河取谅山、下南宁，西路出老街克蒙自、逼昆明。\n\n王师所至，如雷如霆，华裔遗民望风归附，清夷边军望尘披靡！数月之间，红河以北、岭南诸州尽复旧疆，交趾故地重归华夏版图！朕以薄德，承天命复故疆、续正统，非为一己之私，实乃为华夏存文脉、为百姓解倒悬！自今而后，南天中华与中原同轨，礼乐教化遍于四海，凡我华裔，皆当同心同德，共护华夏圣道，永绝夷狄之患！"
 dsk_dai_events.43.a:0 "布告天下，咸使闻知！"
 dsk_dai_events.43.b:0 "钦此！"
 im_manyi_modifier:0 "我成蛮夷了"
 danam_empire__modifier:0 "大南帝国"
 xianluo_king:0 "中南半岛之主"
 je_annex_sic:0 "征讨暹夷"​
 je_annex_sic_reason:0 "自西拓哀牢故地后，我朝已与[SCOPE.sCountry('sia_scope').GetAdjective]全面接壤，边境摩擦渐起，反华派借 “暹夷屡犯边境、阻碍圣化” 为由，力主西进征讨，欲将暹罗纳入南天中华圣化版图！\n\n暹夷虽号南天强国，实则杂糅夷俗、礼制混乱，男子剪发露顶、女子跣足而行，不习儒学、不尊礼教，实为蛮夷之属！近年其屡犯我边境，劫掠教化学堂、驱逐儒臣，更暗中资助西南土邦叛乱，此乃对华夏文明的公然挑衅！今我大南兵强马壮，真腊、老挝为藩属，哀牢故地为屏障，正是降服暹夷之机！当举 “圣化西渐” 大旗，兵分三路西进：北路攻清迈，收复兰那故地；中路取呵叻，直逼暹罗腹地；南路顺湄公河而下，攻略曼谷外围！待破其都城，便设“暹罗都护府”"​
 je_annex_xianluo_button:0 "举兵西进"​
 je_annex_xianluo_button_desc:0 "北路攻清迈，收复兰那故地；中路取呵叻，直逼暹罗腹地；南路顺湄公河而下，攻略曼谷外围"​

 je_hua_yi_xianluo_button:0 "西进暹罗"​
 je_hua_yi_xianluo_button_desc:0 "暹夷屡犯边境、阻碍圣化！力主西进征讨，以圣化之名降服暹夷！"​
 dsk_dai_events.44.t:0 "中南半岛之主"
 dsk_dai_events.44.d:0 "昭告四海书"
 dsk_dai_events.44.f:0 "昔年南天诸邦，或礼制粗疏、或纷争不休，蛮夷之俗未化，圣化之泽未及。朕承天命，举“圣化四海”之旗，王师所至，不以兵戈为威，而以礼乐为怀：真腊感圣化而归附，老挝慕汉风而称臣，暹罗惧天命而纳土。今日之中南半岛，自红河以北至湄公河南岸，自占婆故地至兰那旧疆，皆入我[ROOT.GetCountry.GetAdjective]版图，四海归一，万方来朝！"
 dsk_dai_events.44.a:0 "吾皇万岁，万岁，万万岁！"

 dsk_dai_events.45.t:0 "圣化暹夷，南天一统"​
 dsk_dai_events.45.d:0 "顺化皇城太和殿内捷报震彻：暹罗国王献玺归降，全境纳入版图"​
 dsk_dai_events.45.f:0 "“昔年#yellow 明命帝#!征暹未竟，遗志昭昭！今暹夷归心、哀牢底定，朕设#v 暹罗布政使司#!！定当乘胜绥靖，以竟全功，此乃天命所归，不可违也！\n\n暹罗故地诸部虽已臣服，然夷俗未改、圣化未敷，久染跣足剪发之习，不通儒学礼义之道！我[ROOT.GetCountry.GetAdjective]既为南天中华，当举圣化之旗，遍设儒学学堂、颁行华夏衣冠，令暹夷弃蛮俗、习汉礼，设州置县、统归王化！如此一来，不仅能完中南半岛文明一统之大业，更能震慑西洋蛮夷、稳固南天疆土，以华夏正朔光耀四海！”"​
 dsk_dai_events.45.a:0 "吾皇万岁，万岁，万万岁！"

 dsk_dai_events.46.t:0 "病危的皇帝"​
 dsk_dai_events.46.d:0 "心力交瘁的[SCOPE.sCharacter('dai_jiao_dead_benefactor').GetFullName]一病不起，御医用尽各种手段也不能减轻他的痛苦，我们只能听到顺化宫殿一阵阵撕心裂肺的哭声。"​
 dsk_dai_events.46.f:0 "今红毛入侵清国，清国连战连败，清人懦弱，我知之矣...然红毛之势，必为海疆之一大祸患。愿尔等继续遣使法兰西诸国，以制红毛，保我大南之疆土，辅佐朕之子..."​
 dsk_dai_events.46.a:0 "臣等必肝脑涂地，辅佐太子！"
 dsk_dai_events.46.b:0 "愿陛下再坚持数日，保重龙体！"
 dsk_dai_events.47.t:0 "病倒的皇帝"​
 dsk_dai_events.47.d:0 "[SCOPE.sCharacter('dai_xuan_dead_benefactor').GetFullName]突然得了重病，倒在床上。周边的重臣和皇子跪在他面前，等待[SCOPE.sCharacter('dai_xuan_dead_benefactor').GetFullName]的后事安排。"​
 dsk_dai_events.47.f:0 "朕诸子中，洪保虽长，庶出也，愚钝寡学，徒事嬉游，不可以承大统。皇二子福绥公洪任，聪明嗜学，克肖朕躬，可嗣皇帝位。昨已手批遗诏，纳之龙筒，今交卿等敬谨缄藏，万一有不讳，即宣之，使中外臣民咸知朕所以慎择元良、忧深思远之意..."​

 dsk_dai_events.48.t:0 "勇敢的地方乡绅"​
 dsk_dai_events.48.d:0 "地方乡绅[SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName]得知法国入侵的消息，自发组织一支农民军、地方民兵为主的义兵，前往嘉定、边和一带和我们军队并肩作战。但这种私自募兵的行为，引起了[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]的猜忌。"​
 dsk_dai_events.48.f:0 "只要我们还有一寸土地，还有一个愿意战斗的#yellow 越南人#!，就要抵抗到底！——[SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName]"​
 dsk_dai_events.48.a:0 "嘉奖[SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName]，给予他统领南圻三省的军事权。"
 dsk_dai_events.48.b:0 "让他滚蛋，谁允许他私自募兵的？"

 dsk_dai_events.49.t:0 "[SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName]战死"​
 dsk_dai_events.49.d:0 "《西贡条约》的签署并没有让[SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName]的军队停止抵抗，尽管[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]已经下令让他解散军队，服从法国统治，但他仍然抗旨救国。在失去朝廷的支持后，在定祥省打游击战的他，终于在法军多次围剿下，身受多处创伤，拔剑自刎。"​
 dsk_dai_events.49.f:0 "当朝廷不能代表国家和人民的意志时，人民有权自卫。#red 呵，法夷们，你们永远征服不了我们，只要还有战斗的越南人，我们就会抵抗到底！！#!——[SCOPE.sCharacter('dai_zhangding_benefactor').GetFullName]"​
 dsk_dai_events.49.a:0 "宁可光荣地死，也不愿耻辱地生（Thà chết vinh còn hơn sống nhục）。"

 dsk_dai_events.50.t:0 "[SCOPE.sCharacter('dai_ruanzhongzhi_benefactor').GetFullName]就义"​
 dsk_dai_events.50.d:0 "不愿承认《西贡条约》的南圻义士[SCOPE.sCharacter('dai_ruanzhongzhi_benefactor').GetFullName]依然在坚江、金瓯等地的树林和沼泽里与法军打游击战，甚至成功烧毁了法国的一艘战舰，这引起了法军的大力围剿。遗憾的是，软弱的[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]无法提供给他任何帮助，寡不敌众的[SCOPE.sCharacter('dai_ruanzhongzhi_benefactor').GetFullName]最终被法军所俘获，并拒绝劝降。"​
 dsk_dai_events.50.f:0 "你将为自己烧毁我国战舰、袭扰秩序的罪行被判处绞刑...\n\n#red 哈哈，除非你们这些西人拔尽南国草，否则吾等南人抗西永不息！！#!——[SCOPE.sCharacter('dai_ruanzhongzhi_benefactor').GetFullName]"​
 dsk_dai_events.50.a:0 "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，西贡失去了一名勇敢的英雄..."
 dsk_dai_events.51.t:0 "登基大典"
 dsk_dai_events.51.d:0 "#v 嗣德帝#!登基，[SCOPE.sCountry('chi_scope').GetAdjective][Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')]遣使携册封诏至"
 dsk_dai_events.51.f:0 "承先帝#v 绍治#!遗诏登基，改元嗣德，举国同庆。然太和殿登基礼刚毕，北境驿骑星夜而至：清廷闻朕继统，遣内阁学士携册封诏、御赐龙袍南下，欲循宗藩旧例，册封朕为#v “越南国王”#!，重申华越宗藩之盟！\n\n#v 亲华派#!大臣联袂叩请接诏：“列祖列宗受清廷册封百余年，方保北境无虞！今接诏谢恩，一则可获天朝漕运粮草、洋务器械之援，二则能借天朝威名震慑真腊、暹罗诸邦，南进西拓无后顾之忧！若拒之，恐陷我朝于孤立，北境清军压境、南境蛮夷异动，悔之晚矣！”言罢，陈列前朝册封诏敕与金印，恳请朕“恪守祖制，维系盟好”。\n\n#v 反华派#!将军按剑力谏：“陛下乃南天中华之主，统御交趾、真腊故地，岂能再受清夷册封之束缚？今清廷鸦片之祸未除，内乱初平，国力衰微，早已不配‘天朝’之名！拒受册封，自号‘大南皇帝’，方能彰显我邦自主之权、华夏正统之尊！若屈膝接诏，不仅岁贡耗损府库，更会令新附诸邦轻我，南进圣化之业将受掣肘，永为清夷附庸！” "
 dsk_dai_events.52.t:0 "登基大典"
 dsk_dai_events.52.d:0 "#v 咸宜帝#!登基，[SCOPE.sCountry('chi_scope').GetAdjective][Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')]遣使秘送诏谕，西洋法军兵临顺化城外"
 dsk_dai_events.52.f:0 "国难当头，承宗室公推登基，改元咸宜，欲挽社稷于将倾。然太和殿登基礼草草收场，两重急报接踵而至：北境清廷闻我朝遭法军入侵，遣密使携诏谕潜行南下，虽无正式册封，却许以“若奉宗藩之礼，即遣滇桂援军北上”；而城南十里之外，法军舰船列阵、炮口直指皇城，逼朕签订《顺化条约》，认法国为“保护国”，放弃外交自主！\n\n#v 亲华派#!老臣伏地泣请：“今法军兵临城下，亡国之危就在旦夕！清廷虽弱，然滇桂驻军尚可牵制法军后路！愿陛下奉宗藩旧制，复称‘越南国王’，遣使向清廷告急请援，借天朝兵力共抗西洋蛮夷！若拒之，我朝孤立无援，必为法军所灭，华夏文脉亦将断绝！”言罢，捧出藏匿的前朝册封金印，恳请朕“忍辱负重，借援存国”。\n\n#v 反华派#!将军拔剑怒喝：“清夷自身难保，岂能指望其援军？昔年坐视我朝被法军攻伐，今所谓‘援救’不过是虚言！法军虽强，然我朝军民同心，真腊、老挝藩属亦愿效死！拒签条约、拒奉清诏，朕亲率王师抗法，号召南天中华儿女共赴国难！若屈膝于清夷或西洋，大南社稷、华夏正统皆毁于一旦，何颜面对列祖列宗！” "
 je_hua_yi:0 "华夷之辩"​
 je_hua_yi_reason:0 "968年丁朝独立建国后，[ROOT.GetCountry.GetAdjective]面临"既脱中原辖制，又需确立自身文明合法性" 的难题。前黎朝设"御蛮王"征讨#v 占婆#!时，以"对方不遵朝贡礼仪"为由彰显"上国姿态"；李朝在史书中称#v 大理国#!为"蛮"，将#v 真腊#!、#v 占婆#!的交往定义为 "入贡"，首次将中原华夷观本土化。以自身为"南天礼义之邦"，将周边未受儒学教化的政权归入"待化之域"。随着#red "小中华"#!思想成熟，华夷之辩形成完整理论体系。阮朝儒者#yellow 阮思僴#!在《辨夷说》中明确提出核心主张：夷夏之辨在礼不在地，强调[ROOT.GetCountry.GetAdjective]浸沐华夏教化二千年，与中原道义同、风俗同"，不应被中原视为"夷"；同时主张[ROOT.GetCountry.GetAdjective]应承接华夏教化使命，在南天践行"以礼乐安四夷"的文明责任。这一论述既回应了中原的"夷狄定位"，又确立了[ROOT.GetCountry.GetAdjective]在南天的文明主导权，成为19世纪朝堂辩论的思想根基。\n$TOOLTIP_DELIMITER$\n这个[concept_journal_entry]将在特定条件下触发以下不同的#tooltippable;tooltip:[Country.GetTooltipTag],je_hua_yi_advance #o 历史事件#!#!"​


 
 xianluo_duhufu_modifier:0 "王化之域"​

 je_Tales_of_the_Strange: "奇闻异录"
 je_Tales_of_the_Strange_reason: "百年之间，寰宇大通，舟楫四达，新旧文明交汇于途，奇闻异录遍载于野。西洋有巴黎午夜钟停之异，万钟同寂，头晕者众，至今无解；东土有紫禁夜半鹤鸣、珍妃井畔湿痕之诡，皆传为王朝更迭之兆；英伦欧沃顿桥，犬类屡自投于河，疑为灵异所惑；南美密林之中，航海者误闯未知部族，闻所未闻之俗迭出。更有巨蛇现身江海、古柏渗血、孤岛精灵显影之说，或载于报章，或传于市井，真伪莫辨，引人探赜。\n\n该日志正在此后的更新中不断添加不同的冒险事件，如果你的某次探险失败了，您可以在10年后再次开启它。"


je_italia_our_sea:0 "唯有浴血意大利亚"
je_italia_our_sea_reason:0 "#v 地中海的波涛正在重写历史#!——\n\n在#yellow 塔兰托军港#!，海军工程师用#bold 迦太基遗址的大理石#!建造新型战列舰的舾装码头。的里雅斯特海军学院的学员正在学习用#bold 古罗马海图#!导航，他们将#italic 『维苏威火山爆发轨迹』#!标注为潜艇最佳隐蔽航线。\n\n考古队在#yellow 潘泰莱里亚岛#!发现#bold 屋大维舰队#!的青铜撞角，法西斯青年团立即将其复制品安装在#italic 摩托鱼雷艇#!船首。墨索里尼亲自批准：用#bold 利比亚殖民地的石油收入#!铸造#yellow 100尊青铜海神像#!，每尊神像的瞳孔都是微型#italic 亚得里亚海沙盘#!\n\n当#bold 圣保罗号#!巡洋舰将西西里黑手党流放者运往突尼斯时，水手们在甲板上用柏油书写：『每滴海水都将成为第三个罗马的混凝土』。"


dsk_ita.58.t:0 "#yellow 墨索里尼#!鼓动参战情绪"
dsk_ita.58.d:0 "1914年的#yellow 米兰人民报#!编辑部，墨索里尼将#bold 普鲁士钢盔#!砸向排字机，铅字迸溅成『战争即革命』的标题。他指挥青年党员将#bold 奥地利啤酒桶#!滚进广场引爆，硝烟中传出『用鲜血清洗三国同盟耻辱』的嘶吼。"
dsk_ita.58.f:0 "#yellow 墨索里尼#!早年为新闻记者、社会党党员。第一次世界大战爆发后，因鼓动意大利参战被意大利社会党开除"
dsk_ita.58.a:0 "默许这些“爱国者”的热情"
dsk_ita.58.b:0 "简直是无法无天！"

dsk_ita.59.t:0 "黑衫军骚乱"
dsk_ita.59.d:0 "1920年#yellow 博洛尼亚#!市政厅前，黑衫军用#bold 蓖麻油罐#!给社会主义议员『洗礼』。他们拆卸#bold 有轨电车#!轨道铸成铁棍，在但丁墓前宣誓。"
dsk_ita.59.f:0 "黑衫军的名称是从加里波第的红衫军中受到启发，它是由墨索里尼组织的一个为他的政治活动服务的军事工具。黑衫军的主要创建成员是一些民族主义的知识分子、反对农民及工会组织的青年地主、退伍军官和一些Arditi（意大利一战时的精锐部队）的成员。随着墨索里尼权力的增长，他们的行为变得越发粗暴，并且使用暴力和威胁的方法对抗墨索里尼的反对者。"
dsk_ita.59.a:0 "承认他们是秩序维护者"
dsk_ita.59.b:0 "必须对这些匪徒出重拳！"

# 法西斯战斗团
dsk_ita.60.t:0 "法西斯战斗团"
dsk_ita.60.d:0 "因战后所出现的罢工、社会骚乱和国会瓦解等问题而困扰，[SCOPE.sCharacter('fascist_character_scope').GetLastName]组织了一个新的运动。他的“战斗的法西斯”想通过侵略性的民族主义和严格的军事训练来同自由主义和共产主义势力进行战斗。"
dsk_ita.60.f:0 "墨索里尼为实现自己的政治野心，于1919年3月在米兰建立半军事性组织——法西斯战斗团。1921年11月正式建立国家法西斯党，纲领是法西斯国家至上，执行国家的决定是每个人的天职。"
dsk_ita.60.a:0 "全意大利将听从法西斯蒂的召唤！"
dsk_ita.60.b:0 "简直无法无天！"

# 黑衫军报复
dsk_ita.61.t:0 "黑衫军的报复"
dsk_ita.61.d:0 "1922年#yellow 安科纳港#!，黑衫军用#bold 渔雷推进器#!改装纵火车，在[SCOPE.sState('south_italian_state').GetName]绑架市长后宣称控制了该座城市。"
dsk_ita.61.f:0 "海军陆战队用舰炮轰击了正在劫持火车的暴徒"


# 向罗马进军 
dsk_ita.62.t:0 "向罗马进军"
dsk_ita.62.d:0 "1922年10月28日，[SCOPE.sCharacter('fascist_character_scope').GetLastName]命令法西斯总部下令全国总动员，最高司令部也发表了对全国国民的檄文，宣布进军罗马，劝告军警不要和他们作战，说明他们的目标仅在于推翻腐朽的统治阶级，劝慰有产阶级不要害怕，并且声明保护工农的正当权利。他们扬言法西斯党尽忠皇室，意在拉拢意大利的保皇党，图谋减少夺权的阻力。"
dsk_ita.62.f:0 "“法西斯蒂！全意大利：\n\n我们决战的时候到了！在四年前的这个时候，我们国家的军队取得了欧战的最后胜利。今日黑衫党要进军罗马，将这一胜利再献给这座历史名城。自今日起，法西斯宣布临时戒严，所有军事的、政治的、行政的职务，都由四军团负责人以独裁的形式指挥。”-[SCOPE.sCharacter('fascist_character_scope').GetLastName]"
dsk_ita.62.a:0 "“[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]召您速来罗马，因彼拟将组阁重任交付于阁下。即此问候。”"


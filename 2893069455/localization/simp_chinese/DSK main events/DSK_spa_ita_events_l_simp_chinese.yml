dsk_ita.12.t:0 "​卡门·克罗科"
dsk_ita.12.d:0 "千人远征时期，#yellow 加里波第#!承诺原谅逃兵以换取兵役，早年通过抢劫谋生的[SCOPE.sCharacter('gaixin').GetFirstName]因此加入了#yellow 加里波第#!的军队，希望得到赦免和其他奖励。与意大利政府承诺的不同，[SCOPE.sCharacter('gaixin').GetFirstName]并没有获得任何奖章或其他荣誉，也因为涉嫌参与非法活动被逮捕了"
dsk_ita.12.f:0 "在南方以为贵族家族的帮助下，[SCOPE.sCharacter('gaixin').GetFirstName]得以逃脱。因对意大利新政府的谎言感到失望，与波旁王朝有联系的贵族和当地神职人员说服了[SCOPE.sCharacter('gaixin').GetFirstName]加入南方叛乱主义事业。在战争和非法主义者的金钱支持下，他招募了一支2000人的军队，在旧两西西里王国的旗帜下开始了抵抗运动"
dsk_ita.12.a:0 "土匪并不能因为参与国家统一而赦免罪行"

dyn_c_republic_1_SIC:0 "两西西里自由军团"


je_dsk_italy_reform:0 "南北国家改革"

je_dsk_italy_reform_reason:0 "#bold 《阿尔贝托宪法》#!的墨迹尚未干透，[ROOT.GetCountry.GetRuler.GetFullName]的刺刀已插进卡拉布里亚的火山灰里。\n\n[SCOPE.sCharacter('ig_armed_forces_leader_scope').GetFullName]将军的镇压报告写道：#italic 「每绞死一个土匪，就多十个举着火把的农民」#!——此时#variable 波旁流亡者#!正通过马耳他银行向#yellow 卡门·克罗科#!输送英国造恩菲尔德步枪。\n\n在都灵议会，[SCOPE.sCharacter('ig_landowners_leader_scope').GetLastName]伯爵挥舞着南方土地税册：#bold 「这些野蛮人连拉丁字母都拼不全，怎能实行皮埃蒙特法典？」#!\n\n[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]最终签署的《特别治安法》创造了两套规则：\n北方行省实施#variable 「加富尔改革」#!，用铁路连接北方工业联合体与[concept_market]\n南方战区启用#variable 「拉马尔莫拉条款」#!，授权军队可#bold 无需审判处决嫌疑者#!\n\n#yellow 加里波第#!在议会咆哮：#italic 「这不是统一，是征服！」#! 但皇家兵工厂的军械库存证明了他的无力——新式卡宾枪产量已是叛军武器的#green 20倍#!。\n\n当#yellow 庇护九世#!从梵蒂冈放出信鸽诅咒都灵时，[SCOPE.sCharacter('ig_intelligentsia_leader_scope').GetLastName]在《复兴报》写道：#bold 「阿尔卑斯的雪水终将浇灭维苏威的怒火，哪怕要用一代人的血作代价。」#!"


je_Parlamento_Italiano_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]参议院位于罗马市的夫人宫。年满40岁的公民才有资格参选参议员。\n意大利的议会是一个民主制度下的重要机构，通过代表民意制定法律、监督政府和处理国家事务，为意大利的政治运作和民主发展提供了重要的保障。\n\n#yellow 自由派#!会#tooltippable;tooltip:[Country.GetTooltipTag],je_Parlamento_Italian_pos #v 积攒#!#!参议会#v 大会会议值#!，而#yellow 保守派#!会#tooltippable;tooltip:[Country.GetTooltipTag],je_Parlamento_Italian_neg #v 回退#!#!参议会#v 大会会议值#!。"
je_Parlamento_Italian_neg: "以下条件将 #bold 回退#!参议院进程：\n•执行#yellow [GetLawType('law_oligarchy').GetName]#!，#yellow [GetLawType('law_one_party_state').GetName]#!或#yellow [GetLawType('law_single_party_state').GetName]#!（#green -1#!）。\n•执行#yellow [GetLawType('law_no_social_security').GetName]#!（#green -1#!）。\n•执行#yellow [GetLawType('law_secret_police').GetName]#!（#green -1#!）。\n•执行#yellow [GetLawType('law_no_home_affairs').GetName]#!（#green -1#!）。\n•执行#yellow [GetLawType('law_child_labor_allowed').GetName]#!或#yellow [GetLawType('law_tenant_farmers').GetName]#!（#green -1#!）。"
je_Parlamento_Italian_pos: "以下条件将 #bold 推进#!参议院进程：\n•执行任何#yellow 选举形式#!（#green +1#!）。\n•执行任何#yellow 内务机构#!（#green +1#!）。\n•执行任何#yellow 卫生机构#!（#green +1#!）。\n•执行任何#yellow 福利机构#!（#green +1#!）。\n•执行#yellow [GetLawType('law_peasant_proprietorship').GetName]#!或#yellow [GetLawType('law_commercialized_agriculture').GetName]#!（#green +1#!）。"

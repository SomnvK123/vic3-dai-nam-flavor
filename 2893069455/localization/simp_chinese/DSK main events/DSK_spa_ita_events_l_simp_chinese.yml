gov_roman_empire_desc: "这种[concept_government_type]宣称继承古罗马的法统，通过[Concept('concept_ruler','$RULER_TITLE_DUCE_IMPERATORE$')]实现极权统治。在「重建奥古斯都荣光」的名义下，[Concept('concept_ruler','$RULER_TITLE_DUCE_IMPERATORE$')]兼任法西斯大委员会主席与帝国最高统帅，而虚位的[Concept('concept_ruler','$RULER_TITLE_RE_D_ITALIA$')]仅作为象征性君主存在。\n\n$TRANSFER_OF_POWER_NAME_DESC$"


dsk_ita.57.t:0 "签署《拉特兰条约》"
dsk_ita.57.d:0 "1929年2月11日，墨索里尼在拉特兰宫签署条约时，枢机主教加斯帕里将#bold 圣彼得大教堂#!的钥匙抛向空中——这把象征性的钥匙最终落入档案馆员手中，而非交还教廷。"
dsk_ita.57.f:0 "所谓“梵蒂冈囚徒”时期从1870年一直延续至1929年。此时[ROOT.GetCountry.GetAdjective]统一已有69年，教皇国灭亡也有59年，教廷对意大利的长期敌视和抵制已经显得不合时宜。1929年2月11日，教皇庇护十一世的代表与[ROOT.GetCountry.GetAdjective]代表在罗马的拉特兰宫签署了解决双方悬案的最终协议，即拉特兰条约。\n根据拉特兰条约的规定，教廷最终承认意大利的统一，以及罗马成为意大利首都。意大利王国承认教皇在梵蒂冈城堡内至高无上的权威和世俗统治权力，梵蒂冈城堡成为独立的[SCOPE.sCountry('pap_scope').GetName]。此外，条约还规定了天主教及教会在意大利的政治地位，意大利王国对意大利统一战争期间没收的教会财产进行了最终赔偿。从法理上说，延续了11个世纪的教皇国在1929年2月11日这一天正式灭亡，由梵蒂冈城国取而代之。"
dsk_ita.57.a:0 "让我们在国际社会中保持更友善的形象！"


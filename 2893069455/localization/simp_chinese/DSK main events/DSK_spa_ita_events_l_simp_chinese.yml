# 共和派宪法修正案通过
dsk_spa.25.t:0 "«新宪法诞生»"
dsk_spa.25.d:0 "#bold [concept_1933_constitution]#!以#v 245票赞成#!通过议会表决，#yellow [concept_manuel_azana]#!宣布：「这是#v 工农的胜利#!」。新法案包含：\n• #v [concept_secularism]#!\n• #v 加泰罗尼亚自治#!\n• #v 农业加速#!\n\n但#v 西班牙右翼自治联盟#!领袖发文：「这将引发#bold [concept_crusade]#!」#v 首都#!民兵已开始在#v [concept_navarra]#!山区集结..."
dsk_spa.25.f:0 "共和派是指在1936年－1939年的西班牙内战中支持西班牙第二共和国政府、反对国民军叛乱的派系。“共和派”一词主要由其成员和支持者使用，其反对者则用“赤色分子”（Rojos）一词来称呼他们。该派系政治立场偏左，包含极左翼的共产主义者和无政府主义者。该派系得到苏联和墨西哥的支持"
dsk_spa.25.a:0 "«继续推进社会革命»\n「我们必须趁热打铁！」#v 全国劳工联合会#!代表在广场高呼"

# 国民派宪法修正案通过  
dsk_spa.26.t:0 "«血腥独裁»"
dsk_spa.26.d:0 "#bold 1934年宪法#!在#v 军队命令下#!下强行通过，#yellow 何塞·卡尔沃·索特洛#!宣布：「#v 赤匪#!已被清除」。新法案包含：\n• #v 教会特权#!\n• #v 自主权废除#!\n• #v 土地改革终止#!\n\n#v 总工会#!号召#v 总罢工#!响应，#v 阿斯图里亚斯#!矿工用#v 炸药#!筑起街垒，#yellow 佛朗哥#!将军的#v 嫡系部队#!正从#v 摩洛哥#!启程..."

dsk_spa.26.f:0 "国民军组成者主要有：民族主义者、长枪党党员、法西斯主义者、保王派人士（包括支持阿方索十三世派和卡洛斯派）、西班牙军事联盟、地主阶级、反共产主义者、天主教教权派与信众"

dsk_spa.26.a:0 "«用刺刀恢复秩序»只有子弹能治疗意识形态癌症"
dsk_spa.26.b:0 "我们还没有输！今天#yellow 马德里#!才是我们共同的家乡！"

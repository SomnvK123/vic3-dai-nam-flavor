cuba_button: "援助#yellow 古巴#!"
cuba_button_desc: "古巴作为我们加勒比海上明珠，拥有丰富的种植园资源。作为[concept_overlord]，我们有必要加大对它们种植业的开发。"
phi_button: "援助#yellow 菲律宾#!"
phi_button_desc: "菲律宾是我们太平洋重要的支点，拥有巨大的贸易潜力与价值。作为[concept_overlord]，我们有必要加强在太平洋地区的影响力。"
clm_button: "援助#yellow 格拉纳达#!"
clm_button_desc: "新格拉纳达是我们在南美洲重要的总督区，这里的地峡和森林资源极为丰富。作为[concept_overlord]，我们有必要加大对该地区的扶持力度。"

gov_ita_kingdom: "意大利王国"
gov_ita_kingdom_desc: "这种[concept_government_type]以萨伏依王朝为核心，依据1848年《阿尔贝托宪法》运作。[Concept('concept_ruler','$RULER_TITLE_RE_D_ITALIA$')]既是国家元首也是军队统帅，通过任命首相和批准法律行使权力。王储享有「$RULER_TITLE_PRINCIPE_DI_PIEMONTE$」头衔，继承遵循萨利克法。\n\n$TRANSFER_OF_POWER_NAME_DESC$"

gov_ita_empire: "法西斯意大利帝国"
gov_ita_empire_desc: "这种畸变的[concept_government_type]表面保留[GetLawType('law_monarchy').GetName]，实权却掌握在[Concept('concept_ruler','$RULER_TITLE_MAGYARORSZÁG_MINISZTERELNÖKE$')]手中。尽管[Concept('concept_ruler','$RULER_TITLE_RE_D_ITALIA$')]仍是法律上的国家象征，但所有决策必须符合法西斯大委员会意志。继承制度虽存但已无实质意义。\n\n$TRANSFER_OF_POWER_NAME_DESC$"





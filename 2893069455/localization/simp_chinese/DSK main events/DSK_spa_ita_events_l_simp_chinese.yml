je_Gibraltar: "控制直布罗陀"
je_Gibraltar_reason:0 "控制直布罗陀海峡对于使我们成为贸易强国至关重要"
je_spr_Dynastic: "王位继承问题"
je_spr_Dynastic_reason: "卡洛斯派正在暴动，他们支持老唐·卡洛斯的孙子拥戴为[SCOPE.GetRootScope.GetCountry.GetName]国王，第三个觊觎西班牙王位的小唐·卡洛斯为了继承王位打算组织一场革命。\n如果我们无法阻止反动派对于国家的干涉，我们的国家就会陷入内忧外患的境地，最终四分五裂！"
je_Dynastic_inheritance: "第二次卡洛斯战争"
je_Dynastic_inheritance_reason: "[SCOPE.GetRootScope.GetCountry.GetName]经历了多次王位继承的纷争。费迪南七世死后，其年幼的女儿依莎贝拉二世继承王位，但其叔叔卡洛斯宣称有继承权,30年前，我们已经粉碎了第一次卡洛斯内战，但第三个觊觎西班牙王位的小唐·卡洛斯正秘密回国，我们有信心处理好这次王位继承战争吗？"
je_Dynastic_inheritance_goal: "我们应该阻止卡洛斯派对王位的窃取！"
je_republic_spa: "西班牙第一共和国"
je_republic_spa_reason: "在经历了内战之后，我们选择推倒王位，建立一个民主共和国！但数年的国内动荡的局势以及反对派对我们的袭击，导致我们的革命果实不够牢固，我们需要在尽快的时间内完成对国家的改革以及阻止国家再次爆发革命"
je_republic_spa_goal: "我们已经稳固了共和国政权"
je_catalonia_spa: "加泰罗尼亚问题"
je_catalonia_spa_reason: "加泰罗尼亚自1714年于西班牙王位继承战争大败后，菲利普五世废除了从十五世纪以来享有的自治权，也禁止了当地的加泰罗尼亚语，加泰罗尼亚人跟西班牙其他地区的人的恩怨情仇自此开始。\n在经过数年的纷争与动荡后，他们的独立运动也渐渐高涨，我们不能允许他们分裂国家！"
je_catalonia_spa_goal: "缓和与加泰罗尼亚关系"
je_wudi_jiandui: "无敌舰队"
je_wudi_jiandui_reason: "我们的舰队曾经是我们最为骄傲的象征，自我们与英国的战争失败后，我们就彻底丢掉了海洋霸权。西班牙通过无敌舰队殖民世界，保护我们的商道，如今我们要重回世界列强之巅，就少不了强大的海军。重建无敌舰队既是对过去屈辱的洗刷，又能在未来成为保卫祖国的中坚力量"
je_Spanish_global_empire: "帝国荣光"
je_Spanish_global_empire_reason: "[SCOPE.sCountry('mex_scope').GetName]、[SCOPE.sCountry('cub_scope').GetName]、[SCOPE.sCountry('phi_scope').GetName]、[SCOPE.sCountry('clm_scope').GetName]已经宣布效忠于我们伟大的[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][SCOPE.sCharacter('spa_ruler_scope').GetFirstName]！\n\n大英帝国是如今的“日不落帝国”，[SCOPE.GetRootScope.GetCountry.GetName]把梦带回了现实。时隔200年。帝国再次回到世界之巅，我们重新拥有广袤的殖民地和众多的附属国。如今，我们以全新的姿态重新站在了世界的舞台上，展现出我们的实力。我们可以把西班牙的影响力带给他们，也可以吞并他们重新成为#yellow #b 西班牙帝国#!#!\n\n #N ¡Viva España! ¡Viva el Imperio Español!#!"
no_mex: "我们已经吞并墨西哥"
no_cub: "我们已经吞并古巴"
no_phi: "我们已经吞并菲律宾"
no_clm: "我们已经吞并格拉纳达"
je_Iberia_empire: "伊比利亚联合王国提案"
je_Iberia_empire_reason: "当我们成功解决了国内的烂摊子后，有关于联合伊比利亚的事宜被提上日程。我们可以联合半岛上的所有国家组成一个联合王国，也可以放下曾经的虚妄和幻想成为民主共和国迎接新的未来。"
je_Iberia_empire_goal: "等待提案通过或否决提案"
je_peace_iberia: "和平提案"
je_peace_iberia_reason: "为了让葡萄牙加入我们，我们应该采取一系列的措施，以促进两国之间的合作和友谊，同时尊重葡萄牙的独特文化和利益。我们可以采取怀柔政策，通过改善关系和资助来让#green #b 葡萄牙#!#!加入到我们联合王国的伟大事业中。\n\n#yellow 和平提案#!将通过以下条件而#tooltippable;tooltip:[Country.GetTooltipTag],je_peace_iberia_pos 回退#!。通过以下条件#tooltippable;tooltip:[Country.GetTooltipTag],je_peace_iberia1_pos 推进#!。"
je_peace_iberia1_pos: "以下条件将 #bold 推进#!和平提案：\n•与葡萄牙保持#green 友善#!（#green +1#!）。\n•与葡萄牙保持#green 亲密#!（#green +2#!）。"
je_peace_iberia_pos: "以下条件将 #bold 回退#!和平提案：\n•与葡萄牙保持#yellow 漠不关心#!（#red  -1#!）。\n•与葡萄牙保持#yellow 冷漠#!（#red  -2#!）。
je_peace_iberia_goal: "我们已经填满进度条"
je_war_iberia: "战争提案"
je_war_iberia_reason: "采用和平统一的方式已经失去了希望，唯有通过武力才能联合整个伊比利亚半岛"
je_iberia_empire_ruler: "大伊比利亚联合帝国"
je_iberia_empire_ruler_reason: "在伊比利亚的黄昏下，帝国再度崛起，日不落的光芒照耀，历史荣耀永不沉寂。\n远方的大海呼唤着我们，征服新世界的梦想再次点燃，帆船驶向未知的远方，征程中有希望和团圆。\n从南美的热带到北方的高原，我们的旗帜飘扬在风中，财富和文化的交流，让世界为之倾倒欢欣。\n无数英雄为帝国战斗，留下了永恒的传奇，我们的心怀充满荣耀，因为我们是伊比利亚的传人。\n让我们高唱颂歌，赞颂这伟大的国度，[SCOPE.GetRootScope.GetCountry.GetName]永不衰落，上帝保佑我们。"
#####events
dsk_spa.1.t: "终结第一次卡洛斯内战"
dsk_spa.1.d: "内战结束"
dsk_spa.1.f: "内战期间，国内经济、政治和社会生活受到了严重破坏，人民生活困苦，战火波及各地，造成了巨大的人员伤亡和财产损失。最终，1839年，内战以伊莎贝尔二世的胜利结束。这场内战不仅决定了西班牙的王位继承问题，还奠定了西班牙近代政治的基础，标志着西班牙的[GetLawType('law_monarchy').GetName]度的结束，代替的是资本主义制度的逐渐确立。"
dsk_spa.1.a: "伊莎贝尔万岁！"

dsk_spa.2.t: "士兵叛变"
dsk_spa.2.d: "士兵倒戈向卡洛斯派"
dsk_spa.2.f: "我们在前线的士兵接受了卡洛斯派的好处，选择加入到卡洛斯派的王位复仇中去。卡洛斯派通过宣传和鼓动，强调王位复仇的正义性和历史使命感。他们成功地将内战描绘为一场对传统、对祖国、对[GetLawType('law_monarchy').GetName]的捍卫战，使士兵们产生了参与其中的决心和动力。卡洛斯派得到了一些地方贵族和地方政治势力的支持，这些势力在军队中也有一定影响力，他们的支持使得更多的士兵倾向于加入卡洛斯派。"
dsk_spa.2.a: "别这样！"

dsk_spa.3.t: "卡洛斯派的向马德里进军"
dsk_spa.3.d: "越来越多的人加入到卡洛斯派"
dsk_spa.3.f: "伊莎贝尔二世及其支持者倾向于实行自由主义改革，这在一些保守派和传统势力中引起了反感。他们担心自由主义改革可能破坏传统社会秩序和他们的特权地位，因此更愿意支持卡洛斯王子，希望他能够维护他们的利益和传统价值观。一些外部势力的干预也促使更多的人支持卡洛斯派。例如，法国和葡萄牙等国家支持卡洛斯王子，这为他的势力扩大提供了支持和资源。"
dsk_spa.3.a: "我还能说什么！"

dsk_spa.4.t: "人民回到了忠诚派"
dsk_spa.4.d: "更多的人回到了伊莎贝尔派"
dsk_spa.4.f: "伊莎贝尔派承诺进行自由主义改革，包括废除贵族特权、推进民主和社会改革等。这一政纲吸引了许多受压迫和受剥削的人民，他们希望通过支持伊莎贝尔派来改变现状，追求更公正的社会。伊莎贝尔派倡导社会改革和提供教育机会，尤其是对于普通民众和农民。他们承诺改善贫困地区的生活条件，并提供更多的教育和就业机会，这一政策得到了广大民众的支持。"
dsk_spa.4.a: "感动西班牙"

dsk_spa.5.t: "密谋叛乱"
dsk_spa.5.d: "随着内战的发展，[SCOPE.sState('new_york_scope').GetName]地区的独立运动大幅上升"
dsk_spa.5.f: "[SCOPE.sState('new_york_scope').GetName]地区有着悠久的历史和独特的文化传统，人民对自己的文化和身份感到自豪。在内战期间，一些地方领导人和民众开始呼吁独立，认为只有独立才能更好地保护[SCOPE.sState('new_york_scope').GetName]地区的利益和文化。西班牙政治的动荡和不稳定加剧了人们对中央政府的不满情绪。一些人认为中央政府无法解决地方问题，希望通过独立来摆脱中央政府的控制。"
dsk_spa.5.a: "很明显，让他们吃太饱了，竟想抛下穷兄弟不管"
dsk_spa.5.b: "自己发展不好，还不从自身找找原因？"
dsk_spa.5.c: "想独立，问问我们的警棍同不同意?"
dsk_spa.5.e: "向[SCOPE.sState('new_york_scope').GetName]人妥协，给他们提供更多的财政拨款"
establish_catalan_modifier: "向地方省份拨款"
establish_catalan_standard_of_living_modifier: "得到更多中央拨款"

dsk_spa.6.t: "[SCOPE.sState('new_york_scope').GetName]暴动"
dsk_spa.6.d: "随着内战的发展，[SCOPE.sState('new_york_scope').GetName]地区的独立运动大幅上升"
dsk_spa.6.f: "[SCOPE.sState('new_york_scope').GetName]地区长期以来一直在追求更大的自治权，但是在内战期间，中央政府对加[SCOPE.sState('new_york_scope').GetName]的控制加剧，引发了人民的不满情绪。一些政治团体和民众开始要求加泰罗尼亚的完全独立，并且对中央政府采取了抗议和反抗的行动。些外部势力也支持独立运动，通过资金、武器和政治支持加剧了局势。"

dsk_spa.7.t: "王权归位"  
dsk_spa.7.d: "随着伊莎贝拉之子继承[SCOPE.GetRootScope.GetCountry.GetName]王位，持续经年的内战终告落幕"  
dsk_spa.7.f: "当战火余烬尚未散尽，新君加冕钟声已响彻马德里皇宫。这位流淌着波旁血脉的君主，手持《1837年宪法》与卡洛斯派《巴斯克特权宪章》走上祭坛，宣布将'以铁路缝合破碎山河，用电报串联离心行省'。巴塞罗那纺织行会连夜赶制缀满银丝茉莉的加冕礼袍，塞维利亚铸币厂正将缴获的卡洛斯军火炮熔铸为铁路道钉"  
dsk_spa.7.a: "天佑吾王！[SCOPE.GetRootScope.GetCountry.GetName]永昌！"   

Alfsonso: "阿方索"
modifier_Modern_Spain: "现代西班牙"

dsk_spa.8.t: "西班牙第一共和国"
dsk_spa.8.d: "推翻[GetLawType('law_monarchy').GetName]！共和万岁！"
dsk_spa.8.f: "在这个充满挑战的时刻，我们呼吁建立一个真正的共和国，让人民成为国家的主人，实现民主、平等和自由。[GetLawType('law_monarchy').GetName]带来了无数的苦难和不公，它象征着旧时代的专制和压迫。现在是时候结束这种制度，让人民的声音真正被听见，让国家的命运掌握在人民手中。共和制度将为我们带来新的希望和机遇。在共和国里，每个人都将享有平等的权利和机会，不受贵族或王室的剥削和压迫。我们将建立一个民主的政府，由人民选举产生，为人民服务。波旁王朝在西班牙的统治已经结束了！让我们团结起来，共同努力，推翻[GetLawType('law_monarchy').GetName]，迎接共和国的诞生！让我们以自由、平等、和公正为口号，迈向一个更加光明的未来！共和万岁！"
dsk_spa.8.a: "共和万岁！我们需要依靠[SCOPE.gsInterestGroup('ig_intelligentsia_scope').GetName]！"
dsk_spa.8.b: "共和万岁！我们需要依靠[SCOPE.gsInterestGroup('ig_industrialists_scope').GetName]！"
modifier_spa_republic: "利益集团得宠"
dsk_spa.8.c: "共和不是正义！"

dsk_spa.9.t: "西班牙政变，流放伊莎贝尔"
dsk_spa.9.d: "意大利皇室成员[SCOPE.sCharacter('gaixin').GetFullName]就职西班牙国王"
dsk_spa.9.f: "新国王面临着重重挑战，需要处理内外交困的局面。他必须努力实现国家的和解和团结，推动政治、经济和社会的重建，以及维护国家的权威和地位。同时，外部势力的干预和影响也给西班牙带来了额外的压力和挑战。国际上的局势动荡不安，可能影响到西班牙的发展和稳定。"
dsk_spa.9.a: "希望他能改变西班牙糟糕的局势"

dsk_spa.10.t: "[SCOPE.sCharacter('gaixin').GetFullName]的起势"
dsk_spa.10.d: "[SCOPE.sCharacter('gaixin').GetFirstName]声称自己是合法的国王继承人"
dsk_spa.10.f: "内战期间，许多地方政府和民族主义组织利用局势加强了对自己地区的控制。加泰罗尼亚、巴斯克等地的民族主义者纷纷表态，试图在混乱中寻求独立或更大的自治权。内战吸引了外部势力的干预，一些国家和国际组织支持小唐·卡洛斯，而另一些则支持伊莎贝尔派。这使得内战变得更加复杂和残酷，加剧了各方之间的对立和冲突。"
dsk_spa.10.a: "这是把国家往战火上推"
modifier_carlos: "保守势力占上风"

dsk_spa.11.t: "新西班牙共和国"
dsk_spa.11.d: "历史上的一个重要转折点"
dsk_spa.11.f: "共和国的建立带来了一系列民主改革和社会变革。政治上，实行了普选制度、言论自由和宪政原则等民主制度；社会上，推动了劳工权益保护、教育改革和妇女权利的进步等重要改革。共和国的建立标志着西班牙迈向现代化和民主化的重要一步。然而，它面临着来自各方面的挑战，包括来自国内外的反对势力、经济问题和地方主义情绪。如何应对这些挑战，将决定共和国的命运和西班牙未来的发展方向。"
dsk_spa.11.a: "对贵族们给予优待"
dsk_spa.11.b: "贵族们的时代已经过去了！现在是共和时代！"
modifier_Modern_Spain: "新生的共和国"

dsk_spa.12.t: "君主复辟"
dsk_spa.12.d: "在内忧外患的情况下，[GetLawType('law_monarchy').GetName]在西班牙重新建立了起来"
dsk_spa.12.f: "最终，西班牙第一共和国在1874年被终结。渴望恢复[GetLawType('law_monarchy').GetName]的军官们推翻了共和国，拥立伊莎贝尔二世的儿子阿方索十二世为国王。阿方索十二世继承王位后，宣布支持宪法，西班牙进入了解新的政治阶段。[GetLawType('law_monarchy').GetName]的复辟意味着西班牙政治体制再次回到了王室的掌控之下。这一变化带来了政治上的重大调整，国家将由君主领导。尽管[GetLawType('law_monarchy').GetName]的复辟得到了一部分人的支持，但也引发了一些人民的不满和抗议。一些民主派和共和派抵制这一变化。"
dsk_spa.12.a: "在解决完了国内事务后，我们的未来该走向何方"
modifier_finish_carlos: "终结卡洛斯派"

dsk_spa.13.t: "加泰罗尼亚回到了西班牙"
dsk_spa.13.d: "西班牙国家的统一"
dsk_spa.13.f: "[SCOPE.sState('new_york_scope').GetName]地区重新纳入西班牙的统一体系，恢复了西班牙宪法规定的地区自治制度。[SCOPE.sState('new_york_scope').GetName]地区将依法享有自治权，并参与西班牙国家事务的决策和管理。"
dsk_spa.13.a: "明智之举"

dsk_spa.14.t: "加泰罗尼亚脱离了西班牙"
dsk_spa.14.d: "这是分裂！"
dsk_spa.14.f: "[SCOPE.sState('new_york_scope').GetName]地区的暴动和脱离行动使西班牙陷入了一场严重的危机之中。我们必须马上采取一系列行动！"
dsk_spa.14.a: "我会碾碎他们！"

dsk_spa.15.t: "[SCOPE.sCountry('pap_scope').GetName]反对[SCOPE.GetRootScope.GetCountry.GetName]"
dsk_spa.15.d: "教皇[SCOPE.sCharacter('crisis_scope_1').GetFirstName]派人来西班牙辩经"
dsk_spa.15.f: "罗马教会长期以来在西班牙拥有巨大的影响力，它与[GetLawType('law_monarchy').GetName]度紧密相连，认为[GetLawType('law_monarchy').GetName]是天主的旨意，是保护信仰和社会秩序的重要手段。因此，共和制度的建立被视为对教会权威和传统价值观的挑战。教会担心共和制会导致对宗教自由和教会权威的侵犯，同时也担心共和制下可能实行的宗教改革和世俗化倾向。"
dsk_spa.15.a: "教皇是对的！我们必须马上恢复[GetLawType('law_monarchy').GetName]"
dsk_spa.15.b: "教皇他有几个师？敢对我们的内政如此指手画脚"

dsk_spa.16.t: "第一国际反对[SCOPE.GetRootScope.GetCountry.GetName]"
dsk_spa.16.d: "第一国际派人来西班牙辩经"
dsk_spa.16.f: "第一国际认为资产阶级民主的本质是维护资产阶级的利益，共和制度虽然表面上是民主政体，但在实际操作中可能会受到资产阶级的控制和影响，对工人阶级的权益并没有真正保障。有些资产阶级可能会利用共和制来维护自己的利益和地位，包括对工人阶级的剥削和压迫。这种情况下，第一国际认为支持共和制可能会变相支持资产阶级的统治。"
dsk_spa.16.a: "第一国际他有几个师？"
dsk_spa.16.b: "镇压赤色运动是我们的内政"

dsk_spa.17.t: "西班牙殖民帝国"
dsk_spa.17.d: "我们曾经拥有广阔的殖民地，遍布世界各地。"
dsk_spa.17.f: "从墨西哥到秘鲁，从哥伦比亚到智利，我们占领了大片土地，开发了丰富的资源，包括黄金、银矿和农产品。这些殖民地不仅为西班牙帝国带来了财富，也促进了欧洲与美洲之间的文化和商业交流。\n在亚洲，我们也建立了重要的殖民地，特别是在菲律宾和印度。这些地区成为了我们的贸易中心，为我们带来了香料、丝绸和其他珍贵商品。我们在亚洲的殖民地也成为了西班牙文化与东方文明交流的桥梁。\n此外，我们还有非洲的殖民地，尤其是在摩洛哥和西非地区。这些殖民地为我们提供了劳动力和原材料，支持了我们的经济和军事实力。"
dsk_spa.17.a: "是时候重建我们的旧帝国了"

dsk_spa.18.t: "La Armada Invencible"
dsk_spa.18.d: "不可战胜的舰队"
dsk_spa.18.f: "铁甲鲸群裂海雾，翡翠王冠锁烟涛\n\n黄金铸就的傲慢，撞碎在北海的冷笑\n\n火船撕裂夜幕的绸缎，炮火在圣经扉页燃烧\n\n圣旗卷走三万个亡魂，残桅刺穿上帝的袍角\n\n风帆残片写满傲慢的代价，沉入大西洋的祷告"
dsk_spa.18.a: "无敌舰队主宰着海洋"


dsk_spa.19.t: "西班牙第二共和国"
dsk_spa.19.d: "当[SCOPE.sCharacter('crisis_scope_1').GetFirstName]在巴黎举杯时，马德里的#v [concept_country]#!广场正被共和旗帜淹没。这场#v 75%选民支持#!的政权更迭，究竟是#bold 民主的曙光#!还是#bold 混乱的序章#!？\n\n新政府面临：[GetLawType('law_tenant_farmers').GetName]土地制度引发的#v $farmer$#!暴动、#v 卡利斯塔#!保皇党在纳瓦拉的秘密集会、以及#v $SPA$#!黄金储备的持续外流……"
dsk_spa.19.f: "安达卢西亚地区无地农民，日均工资#v 2比塞塔#!，1932年参与#v 1342次#!土地占领事件\n\n1931年宪法确立#v 政教分离#!和#v 区域自治权#!，但#v 引发争议的第26条#!关于解散耶稣会的条款引发教会激烈反对\n\n1933年1月的#v 全国性暴动#!，导致#v 87名平民死亡#!，迫使政府暂停#v 公民保障法令#!"
dsk_spa.19.a: "我们真的胜利了吗？"

dsk_spa.20.t: "西班牙帝国"
dsk_spa.20.d: "《日不落的光荣》"
dsk_spa.20.f: "从哈瓦那的雪茄烟雾到马六甲的珍珠港潮，每粒烟草都裹着卡斯蒂利亚语的火星，每滴树脂都凝固着安达卢西亚吉他般的黏稠。秘鲁的银矿是帝国的神经，菲律宾的椰林是王室的睫毛，就连撒哈拉的沙粒都在驮着双头鹰纹章向地中海岸迁徙。当[SCOPE.sCountry('net_scope').GetName]的商船还在丈量北海的方寸，[SCOPE.GetRootScope.GetCountry.GetName]的大帆船早已在太平洋的褶皱里绣满圣母像的经纬。\n\n[SCOPE.sCountry('mex_scope').GetName]城大教堂的玫瑰石上，至今镌刻着腓力二世的箴言："我的国土没有黄昏。"的确，当加勒比的夕阳沉入海平线，马尼拉的晨光正为圣奥古斯丁教堂的巴洛克穹顶镀金。从复活节岛的石像瞳孔到直布罗陀的灯塔瞳孔，所有晨昏线的裂缝都被西班牙的旗帜缝合。\n\n那些说帝国不过是吸血鬼的人不曾见过，马尼拉大帆船运回的不仅是东方的丝绸，更是将地球编织成一张祷告毯的野心；那些嘲笑殖民者贪婪的耳朵永远听不到，波托西银矿深处传来的，是旧大陆与新大陆的骨质在历史熔炉中清脆的共鸣"
dsk_spa.20.a: "[SCOPE.GetRootScope.GetCountry.GetName]仍能触摸到那个永不日落的黄昏！"

dsk_spa.21.t: "伊比利亚联合王国提案"
dsk_spa.21.d: "加冕伊比利亚联合王冠"
dsk_spa.21.f: "我们可以与[SCOPE.sCountry('por_scope').GetName]建立坦诚和互信的关系。通过高层会谈和政治对话，我们可以表达我们的诚意和愿望，与[SCOPE.sCountry('por_scope').GetName]政府建立起稳固的合作关系。我们要向葡萄牙人民展示，我们愿意成为他们的朋友和盟友，与他们共同前行。\n亦或是用暴力手段迫使他们屈服"
dsk_spa.21.a: "我赞成和平方案"
dsk_spa.21.b: "我赞成战争方案"
dsk_spa.21.c: "选择历史路线，并体验后续西班牙剧情"

dsk_spa.22.t: "西班牙-葡萄牙《辛特拉协定》"
dsk_spa.22.d: "通过[SCOPE.GetRootScope.GetCountry.GetName]的[SCOPE.sCharacter('spa_ruler_scope').GetFirstName]与[SCOPE.sCountry('por_scope').GetName]的[SCOPE.sCharacter('por_ruler_scope').GetFirstName]的表亲联姻，确立"伊比利亚联合[GetLawType('law_monarchy').GetName]"。两国保留独立议会与法律体系，但共享外交、殖民事务部与总参谋部。"
dsk_spa.22.f: "成立"跨大西洋理事会"：将西班牙的古巴、菲律宾与葡萄牙的安哥拉、莫桑比克合并管理，设立横跨太平洋与大西洋的联合补给链。\n\n推出"伊比利亚比塞塔-埃斯库多金本位挂钩体系"，1比塞塔=2.5埃斯库多，殖民地税收统一用黄金雷亚尔结算。\n\n里斯本造船厂建造"无畏舰级"铁甲舰"发现者号"，配备德国克虏伯280mm主炮，巡航范围覆盖从澳门到佛得角的殖民据点。"
dsk_spa.22.a: "万岁！[SCOPE.GetRootScope.GetCountry.GetName]万岁！[SCOPE.sCountry('por_scope').GetName]"

dsk_spa.23.t: "大伊比利亚联合帝国"
dsk_spa.23.d: "[ROOT.GetCountry.GetRuler.GetFirstName]陛下的远见与毅力为伊比利亚世界谱写了新的篇章。当王权的旗帜再度飘扬于南美的山川与原野，这不仅是西班牙王冠的荣光重绽，更是一曲关于血脉、信仰与共同命运的深沉颂歌。"
dsk_spa.23.f: "当卡斯蒂利亚的严谨、加泰罗尼亚的勤勉、安达卢西亚的热情与美洲的辽阔及坚韧结合，将创造出无可比拟的活力与繁荣。这团结是盾牌，抵御外部的觊觎；是灯塔，指引共同的未来；更是对世界的庄严宣告：伊比利亚的太阳，终将再次照耀东西两个半球，在[ROOT.GetCountry.GetRuler.GetFirstName]的权杖下，一个跨越大陆的、真正意义上的西班牙共同体已然苏醒，并将迈向属于它的、永恒的辉煌。"
dsk_spa.23.a: "[SCOPE.GetRootScope.GetCountry.GetName]将永远、永远团结在一起！"
dsk_spa.23.b: "伊比利亚兄弟们将一起走向新时代。"
dsk_spa.24.t: "控制直布罗陀"
dsk_spa.24.d: "控制直布罗陀对我们成为贸易强国至关重要"
dsk_spa.24.f: "它是连接地中海和大西洋的重要门户。早年它就被大西洋航海家们所利用，地中海沿岸国家的探险船队曾频繁地通过这里而到达大西洋。今日的直布罗陀海峡仍是大西洋通往南欧、北非和西亚的重要航道。"
dsk_spa.24.a: "如今我们是该地区的主导力量！"
south_amercia_annex: "统一南美洲"
south_amercia_annex_desc: "把我们在南美洲的附属小国移交给我们最大的附庸管辖！"

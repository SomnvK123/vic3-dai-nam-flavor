italy_mafia.1.t:0 "看到就当没看到，听到就当没听到"
italy_mafia.1.d:0 "巴勒莫的柠檬园主们收到镶金子弹的警告信：『每箱柑橘必须支付2里拉「运输保险费」，否则就让你们的果实烂在树上！』\n\n税务官发现，运往利物浦的柑橘箱底部藏着#bold 海洛因#!和#bold 走私枪支#!..."



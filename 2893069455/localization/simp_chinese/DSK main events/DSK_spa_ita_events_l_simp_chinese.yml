law_Camicie_Nere:0 "黑衫军"
law_Camicie_Nere_desc:0 "黑衫军的名称是从加里波第的红衫军中受到启发，它是由墨索里尼组织的一个为他的政治活动服务的军事工具。黑衫军的主要创建成员是一些民族主义的知识分子、反对农民及工会组织的青年地主、退伍军官和一些Arditi（意大利一战时的精锐部队）的成员。随着墨索里尼权力的增长，他们的行为变得越发粗暴，并且使用暴力和威胁的方法对抗墨索里尼的反对者。"
law_Divisione_Celere:0 "闪电师"
law_Divisione_Celere_desc:0 "意大利第一支机械化实验部队，配备菲亚特3000坦克和蓝旗亚装甲车，以12小时内推进80公里的闪电战术著称。1940年法国战役中突破阿尔卑斯防线。"
law_Brigate_Nere:0 "黑箭旅"
law_Brigate_Nere_desc:0 "由狂热法西斯分子组成的惩戒部队，使用德军STG44突击步枪与火焰喷射器，专精城市清剿作战。因其黑色制服袖口绣有银色箭头得名，在镇压希腊起义时制造多起屠杀事件。"

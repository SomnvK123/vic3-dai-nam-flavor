je_italian_union:0 "意大利的联合"
je_italian_union_reason:0 "#bold [concept_unification]#!是#yellow 朱塞佩·马志尼#!等革命党人毕生追求的梦想，如今通过#yellow 加里波第#!将军的#variable 千人远征#!显露出曙光。\n\n#variable 民主派#!以#yellow 马志尼#!为首的#yellow 青年意大利党#!为核心，主张通过#variable 全民起义#!建立#bold 意大利共和国#!，他们高呼「#italic 自由、平等、博爱#!」的口号席卷半岛。\n而#variable 君主派#!则围绕#yellow 维托里奥·埃马努埃莱二世#![Concept('concept_ruler','$RULER_TITLE_KING$')]展开，试图通过#variable 王朝战争#!在#yellow 萨伏伊#!旗帜下实现#bold 君主立宪制#!统一。\n\n两派在#variable 统一路径#!上的根本分歧，导致#variable 民族力量的分裂#!——民主派指责君主派#italic 「用冠冕窃取革命果实」#!，君主派则抨击民主派#italic 「用暴民摧毁秩序根基」#!。\n#bold 阿尔卑斯山的风暴正在聚集，[concept_revanchism]的阴影笼罩着亚得里亚海，若不能凝聚全民族的意志，复兴罗马的伟业终将沦为[concept_decadence]的祭品！#!"
concept_revanchism:0 "收复失地运动"
concept_revanchism_desc:0 "指在$nationalism$驱动下，通过军事或外交手段收复历史所属领土的意识形态。 对意大利而言，这特指：#bold 伦巴第威尼西亚#!地区从奥地利帝国的解放诉求、法国对$PAP$的占领现状，以及[concept_unification]运动对达尔马提亚的声索。"
concept_decadence:0 "帝国衰朽症候"
concept_decadence_desc:0 "一个腐朽的末年帝国所触发的恶性循环状态，表现为：#bold 地方政府自治权流失#!、[concept_investment_pool]的持续枯竭，以及$post_revolutionary_fervor$的指数增长。"
je_risorgimento_repubblicano_reason:0 "#bold 「从热那亚到巴勒莫」#!，[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]的辩论声已穿透#yellow 亚平宁山脉#!。他们曾认为城邦自治与『[ROOT.GetCountry.GetAdjective]传统』浑然一体——直到#yellow 加富尔#!的钢铁动脉连结了都灵与热那亚港，#yellow 加里波第#!的[concept_redshirts]染透了西西里晚霞，而#yellow 马志尼#!在秘密集会上被传阅得卷了边的[concept_manifesto]。\n\n如今[ROOT.GetCountry.GetCapital.GetCityHubName]的咖啡馆里，托斯卡纳口音与威尼斯方言争论着[GetLawType('law_parliamentary_republic').GetName]的可行性。\n\n撒丁水手在甲板上传唱神曲的诗篇，连[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]的庄园账本里都夹着[concept_tricolore]的草图。\n\n#bold 这场席卷半岛的浪潮#!，实则是民族融合进程与[concept_habsburg_order]的#red 最终对决#!——当民族主义的觉醒时，[concept_revolution]将不可逆转！"

  concept_redshirts:0 "千人远征军"
  concept_redshirts_desc:0 "加里波第领导的志愿军团，又称“红衫军”。" 
  
  concept_manifesto:0 "青年意大利党"
  concept_manifesto_desc:0 "[concept_carbonari]人马志尼于1831年被放逐到法国马赛时，重建了一个秘密团体——[concept_manifesto]。党的宗旨是发动革命起义，推翻奥地利封建主的统治，把意大利联合成为一个自由、独立、统一的资产阶级民主共和国。（类似于同盟会）。“上帝和人民”——青年意大利党给自己选择了这样的信条。"
  concept_carbonari:0 "烧炭党"
  concept_carbonari_desc:0 "烧炭党（意大利文：Carbonari）是19世纪前期活跃在意大利各国的秘密民族主义政党，追求成立一个统一、自由的意大利，在意大利统一的过程中发挥了至关重要的作用。"
  
  concept_tricolore:0 "绿白红三色旗"
  concept_tricolore_desc:0 "源自1796年拿破仑意大利军团的标志。"
  
  concept_habsburg_order:0 "维也纳体系"
  concept_habsburg_order_desc:0 "梅特涅构建的保守主义秩序，维也纳体系是19世纪初拿破仑帝国崩溃后，以英、俄、奥、普为首的战胜国通过维也纳会议在欧洲大陆上建立的新均势体系。"



je_Italian_Youth_Party:0 "青年意大利党"
je_Italian_Youth_Party_reason:0 "[concept_manifesto]是[ROOT.GetCountry.GetAdjective]统一时期的政治运动，它于1831年由#yellow 朱塞佩·马志尼#!发起。离开意大利几个月后，#yellow 朱塞佩·马志尼#!在1831年6月写信给时任[ROOT.GetCountry.GetAdjective][Concept('concept_ruler','$RULER_TITLE_KING$')]#yellow 查尔斯·阿尔伯特#!，要求他团结意大利各邦国并领导这个国家走向统一。一个月后，他确信自己的提议没有被[Concept('concept_ruler','$RULER_TITLE_KING$')]接纳，于是在马赛发起了青年意大利运动。这一运动随即传播到欧洲的其他国家 。\n\n#v 该运动的目标是通过在意大利的林立的落后小国和[SCOPE.sCountry('aus_scope').GetName]占领的意大利土地上发动全面起义，以建立一个统一的意大利国家。#!\n\n进度条将通过以下方式增长：\n1.每达到#green 10%识字率#!，每月#green +0.2(max = 2)#!\n2.被[SCOPE.sCountry('aus_scope').GetName]统治的省份，若#red [concept_turmoil]超过35%#!，每月#green +2#!\n3.每存在一位[SCOPE.sCulture('hungarian').GetName]或[SCOPE.sCulture('polish').GetName][concept_revolution][concept_agitator]，每月#green +1#!\n4.实施#green [GetLawType('law_total_separation').GetName]/[GetLawType('law_state_atheism').GetName]/[GetLawType('law_IJ_secularization').GetName]#!法律时，每月#green +2#!\n5.当某州#red [concept_unemployed]率突破20%#!且#red 平均[concept_sol]低于12#!时，每月#green +1#!"

je_sar_reform0_tt:0 "万军之耶和华，请聆听我的祈求！"
je_sar_reform0_1_tt:0 "荣耀属于全体意大利人民！"

je_sar_reform0:0 "复兴的火种"
je_sar_reform0_reason:0 "#bold 从[ROOT.GetCountry.GetCapital.GetCityHubName]的[concept_carbonari]密谋#!到#yellow 热那亚港#!的[concept_manifesto]油印，[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]正用[concept_tricolore]的剪影重绘亚平宁地图。\n\n当#yellow 梅特涅#!的[concept_habsburg_order]仍在抽走伦巴第的赋税，[ROOT.GetCountry.GetAdjective]的[concept_redshirts]已带着[concept_revanchism]的誓言跨越第勒尼安海——他们知道，只有在[concept_decadence]彻底腐化帝国官僚前点燃#italic 「统一之火」#!，才能让[concept_manifesto]中「#bold 上帝与人民#!」的呐喊响彻阿尔卑斯山麓。\n\n此刻，[ROOT.GetCountry.GetCapital.GetName]军械库的锻锤正为[concept_tricolore]铸造旗杆，而维也纳的宫廷舞会还在讨论如何拆分托斯卡纳的关税同盟。"
je_sar_reform0_goal:0 "完成三项意大利复兴日志"
dsk_ita.38.t:0 "亚平宁的黎明"
dsk_ita.38.d:0 "1836年的亚平宁半岛笼罩在[SCOPE.sCountry('aus_scope').GetName]阴影之下：#bold 梅特涅#!通过[concept_habsburg_order]牢牢控制着#yellow 伦巴第-威尼西亚#!，其附庸国网络囊括#yellow 托斯卡纳#!、#yellow 帕尔马#!和#yellow 摩德纳#!\n\n作为唯一保持独立的意大利邦国，[ROOT.GetCountry.GetAdjective]王国正面临抉择：10年前，#yellow 查理·阿尔伯特#!国王的军事改革已经将常备军扩充至#bold 4.2万人#!，但奥地利在#yellow 佩斯基耶拉#!和#yellow 曼托瓦#!的要塞群如同绞索扼守着波河平原。\n\n[concept_manifesto]的地下印刷点每月增加#bold 3处#!，[concept_carbonari]残余势力在#yellow 热那亚#!港策划暴动，而[SCOPE.sCountry('aus_scope').GetName]审查官正在焚烧载有「#italic 统一#!」字样的报刊。\n\n当[ROOT.GetCountry.GetAdjective]工程师开始测绘#yellow 都灵-热那亚#!铁路线时，维也纳的驻军已开始向#yellow 亚历山德里亚#!增派炮兵——[concept_decadence]正在侵蚀旧秩序，但[ROOT.GetCountry.GetAdjective]能在奥地利动员北意大利的镇压力量前，完成这场#bold 民族豪赌#!吗？"
dsk_ita.38.f:0 "「要么我们创造意大利，要么我们成为历史的尘埃。」\n——朱塞佩·马志尼，1831年于马赛秘密集会"
dsk_ita.38.a:0 "宁可站着死，绝不跪着生"

je_ita_army:0 "意大利复兴：军队改革"


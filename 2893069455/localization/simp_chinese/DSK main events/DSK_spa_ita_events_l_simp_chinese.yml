je_sar_reform2_goal:0 "将我们的[concept_gdp]提高到原来的三倍"

je_ita_army_reason:0 "面对[SCOPE.sCountry('aus_scope').GetName]在#yellow 伦巴第#!驻扎的12万大军，[ROOT.GetCountry.GetAdjective]参谋部正以每月#bold 3000支#!的速度换装新式击发枪。加富尔伯爵亲自监督#yellow 亚历山德里亚#!炮兵学院的扩建，要求每个炮组能在#italic 三分钟内#!完成山地拆解运输——因为阿尔卑斯山口的控制权，将决定[concept_revanchism]能否突破维也纳的「四角要塞」链。当英国《泰晤士报》嘲讽我们「用歌剧嗓门指挥火炮」时，蒙多维军营的士兵正在暴雨中演练散兵线战术。"

je_sar_reform_reason:0 "为打破帕尔马与摩德纳的关税壁垒，[ROOT.GetCountry.GetAdjective]内阁强制推行#yellow 皮埃蒙特度量衡#!，并规定热那亚港所有货物必须用托斯卡纳意大利语标注。当奥地利通过#yellow 的里雅斯特#!抽取半岛15%的贸易税时，我们在#yellow 诺瓦拉#!新建的纺织厂正以英国三分之一的价格倾销棉布——每摧毁一个地方行会，就为[concept_manifesto]的传播扫清一片土壤。"

je_sar_reform2_reason:0 "连接#yellow 都灵#!与#yellow 热那亚#!的铁路每日运输#bold 200吨#!生铁，这些钢材正变成亚历山德里亚兵工厂的线膛炮。在波河平原，强制推广的美国收割机使小麦产量翻倍，足够供养8个新建步兵师。当奥地利嘲笑我们「用通心粉建造战舰」时，撒丁商船队已控制西地中海35%的煤炭运输——#italic 每根铁轨都是射向[concept_habsburg_order]的炮弹，每袋军粮都是埋葬分裂主义的铁锹！#"


dsk_ita.1.t:0 "[ROOT.GetCountry.GetRuler.GetFirstName]的新政"
dsk_ita.1.d:0 "[ROOT.GetCountry.GetAdjective]内阁正以#yellow 都灵#!为中心推行「#bold 阿尔贝特宪法#!」：建立三级选举制度削减[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]，同时在#yellow 热那亚#!设立国家印刷局统一内容。当奥地利间谍仍在焚烧[concept_manifesto]传单时，我们的邮差已通过新建的#yellow 苏萨山口#!驿道，将改革法令送至每个北意大利城邦的市长办公室。"
dsk_ita.1.f:0 "「用托斯卡纳语书写的法典，比奥地利的大炮更能穿透亚平宁山脉」——[ROOT.GetCountry.GetRuler.GetFirstName]在1847年国务会议"
dsk_ita.1.a:0 "以[concept_unification]之名前进！"

dsk_ita.6.t:0 "阿尔卑斯利剑"
dsk_ita.6.d:0 "[ROOT.GetCountry.GetAdjective]总参谋部正在#yellow 蒙多维#!军营实施普鲁士式改革：每月训练#bold 800名#!使用M1841击发枪的士兵，其射击精度比奥地利前装滑膛枪提升#green 60%#!。当维也纳还在依赖#yellow 曼托瓦#!的18世纪棱堡时，我们的工兵已设计出可24小时内架设的#italic 「卡尔·阿尔贝托浮桥」#!——这正是突破波河防线，收复#yellow 米兰#!的关键。"
dsk_ita.6.f:0 "军械库数据显示：新式山地炮射程达1200米，足以覆盖奥地利在#yellow 佩斯基耶拉#!的前哨阵地"
dsk_ita.6.a:0 "铸造胜利之刃！"

dsk_ita.3.t:0 "钢铁动脉计划"
dsk_ita.3.d:0 "[ROOT.GetCountry.GetAdjective]财政部宣布：连接#yellow 都灵#!至#yellow 热那亚#!的铁路每延伸#bold 1公里#!，就能将生铁运输成本降低#green 12%#!。当#yellow 亚历山德里亚#!兵工厂开始批量生产线膛炮管时，我们在#yellow 诺瓦拉#!新建的纺织厂正以英国三分之一的价格倾销棉布——这些利润正变成#yellow 库内奥#!铁矿场的蒸汽锤和#yellow 萨沃纳#!港的起重机。"
dsk_ita.3.f:0 "1848年数据显示：[ROOT.GetCountry.GetAdjective]钢产量已超过[SCOPE.sCountry('bel_scope').GetName]，成为欧洲第五大工业国"
dsk_ita.3.a:0 "要么统一，要么灭亡！"


# 意大利共和国事件链
dsk_ita.4.t:0 "三色旗迎风飘扬"
dsk_ita.4.d:0 "当#yellow 加里波第#!的红衫军将[concept_tricolore]插上#yellow 那不勒斯#!王宫时，[SCOPE.GetRootScope.GetCountry.GetName]制宪会议以#bold 387票对12票#!通过[concept_manifesto]核心条款：\n\n• 废除所有封建特权与教会审判权\n• 实施[GetLawType('law_universal_suffrage').GetName] \n• 将#yellow 罗马#!定为永久首都\n\n此刻，[SCOPE.sCountry('aus_scope').GetName]驻军正从#yellow 安科纳#!港撤离，而[ROOT.GetCountry.GetRuler.GetFirstName]在#yellow 米兰#!大教堂宣誓「#italic 从此只有意大利公民，没有萨伏伊臣民！#!」"
dsk_ita.4.f:0 "「要么我们在罗马建立共和国，要么就让台伯河倒流！」——朱塞佩·加里波第，1860年"
dsk_ita.4.a:0 "共和国万岁！"

# 意大利王国事件链  
dsk_ita.5.t:0 "王朝派的胜利"
dsk_ita.5.d:0 "在#yellow 普拉塔尼亚诺#!战役的炮声中，[ROOT.GetCountry.GetRuler.GetFirstName]于#yellow 佛罗伦萨#!签署《#bold 君主立宪诏书#!》：\n\n•保留萨伏伊王朝的[GetLawType('law_monarchy').GetName]\n•实施[GetLawType('law_census_voting').GetName]\n•定都#yellow 都灵#!直至收复罗马\n\n当奥地利大使质问「#italic 这个拼凑王国能维持几个月？#!」时，[ROOT.GetCountry.GetAdjective]炮兵正在#yellow 库斯托扎#!测试射程达#bold 2800米#!的线膛攻城炮。"
dsk_ita.5.f:0 "都灵军械库记录：新式火炮可击穿#yellow 佩斯基耶拉#!要塞的4米厚城墙"
dsk_ita.5.a:0 "以[concept_unification]之名加冕！"




dsk_ita.2.t:0 "民族觉醒"
dsk_ita.2.d:0 "当新任教皇#yellow 庇护九世#!在罗马宣布#bold 特赦政治犯#!时，[ROOT.GetCountry.GetAdjective]边境的#yellow 亚历山德里亚#!要塞正进行夜间演习——查理·阿尔伯特国王的#bold 8万新军#!已配备普鲁士制式后膛炮，其射程覆盖奥地利在#yellow 诺瓦拉#!的前哨阵地。\n\n[concept_manifesto]的印刷品正通过#yellow 热那亚#!港的英国货轮走私入境，马志尼从伦敦寄来的密信要求「#italic 趁梅特涅病重之机发动总攻#!」。而维也纳的回应是将#yellow 伦巴第#!驻军增加至#bold 15个旅#!，并在#yellow 佩斯基耶拉#!要塞架设可旋转的#yellow 科利西#!重型攻城炮。\n\n此刻，[ROOT.GetCountry.GetRuler.GetFirstName]的顾问团正激烈辩论：是响应#yellow 佛罗伦萨#!自由派的请愿实施[GetLawType('law_wealth_voting')]，还是以「维持秩序」为名镇压[concept_carbonari]的暴动？"
dsk_ita.2.f:0 "「每个意大利村庄的钟楼都是民族觉醒的烽火台」——卡米洛·加富尔，1846年私人信件"

dsk_ita.2.a:0 "点燃[concept_revolution]之火！"  # 自由派路线：获得教皇国支持但激怒奥地利
dsk_ita.2.b:0 "巩固[GetLawType('law_monarchy').GetName]之基！"  # 保守派路线：加快军事改革但失去知识分子支持

 
dsk_ita.13.t:0 "这世间伟大的意大利亚"
dsk_ita.13.d:0 "1866年#yellow 柯尼希格雷茨#!的硝烟尚未散去，[ROOT.GetCountry.GetAdjective]与普鲁士的#bold 魔鬼契约#!已结出果实：当#yellow 加里波第#!的志愿军用#bold 夏塞波步枪#!突破#yellow 贝泽卡#!山口时，普鲁士的#yellow 克虏伯#!攻城炮正在#yellow 萨多瓦#!碾碎奥地利方阵。\n\n根据《#bold 四月协定#!》，[SCOPE.GetRootScope.GetCountry.GetName]以#bold 放弃南蒂罗尔#!为代价，换取#yellow 威尼斯#!从奥地利版图剥离——此刻，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]正骑着缴获的#yellow 拉德茨基#!元帅坐骑，踏过#yellow 明乔河#!浮桥检阅部队。\n\n#yellow 都灵#!兵工厂的蒸汽锤昼夜轰鸣，将[concept_great_power]提供的#bold 2000吨优质钢#!锻造成#yellow 布雷西亚#!前线的铁路枕木——这些铁轨既是[concept_unification]的血管，也是刺向[concept_habsburg_order]的标枪。"

dsk_ita.13.f:0 "从阿尔卑斯的雪峰到地中海的波涛，\n我们走过了征服和抵抗的道路，\n用汗水和热血浇灌着我们的希望。\n在这片土地上，我们团结一心，\n肩并肩，同舟共济，永不退缩。\n让我们的国旗在风中飘扬，\n让我们的声音响彻天际，\n意大利，你是我们的骄傲和荣耀，\n在你的光芒下，我们无所畏惧。"
dsk_ita.13.a:0 "待我从阿尔卑斯山上而来..." 

dsk_ita.101.t:0 "三色旗迎风飘扬"
dsk_ita.101.d:0 "1870年9月20日清晨，#yellow 卡多纳#!将军的#bold 6万大军#!用#yellow 克虏伯#!攻城炮轰开#yellow 庇亚门#!。[ROOT.GetCountry.GetAdjective]工兵用#bold 硝化甘油炸药#!爆破#yellow 奥勒良城墙#!的千年壁垒。\n\n#yellow 庇护九世#!通过#yellow 圣天使堡#!密道逃亡梵蒂冈前，签署了《#bold 保障法#!》——永久放弃世俗权力，仅保留#bold 0.44平方公里#!的宗教飞地。此刻，#yellow 加里波第#!旧部正用红衫军旗包裹#yellow 奎里纳莱宫#!的教皇纹章，而#yellow 马志尼#!的传单已印好#bold 50万份#!，通过新建的#yellow 佛罗伦萨-罗马#!铁路送往半岛每个村庄。"

dsk_ita.101.f:0 "从阿尔卑斯的雪峰到地中海的波涛，\n我们走过了征服和抵抗的道路，\n用汗水和热血浇灌着我们的希望。\n在这片土地上，我们团结一心，\n肩并肩，同舟共济，永不退缩。\n让我们的国旗在风中飘扬，\n让我们的声音响彻天际，\n意大利，你是我们的骄傲和荣耀，\n在你的光芒下，我们无所畏惧。"
dsk_ita.101.a:0 "[concept_revolution]派与[GetLawType('law_monarchy').GetName]在此和解！"

every_italy_land_add_wine_modifier_tt:0 "所有拥有$building_vineyard$的省份会获得产出修正"

dsk_ita.7.t:0 "意大利葡萄酒"
dsk_ita.7.d:0 "意大利是世界上最重要的葡萄酒产区之一，其葡萄酒因其品质和多样性而闻名于世。意大利的葡萄酒种类繁多，拥有众多的著名产区，每个产区都有其独特的风土和特色葡萄品"
dsk_ita.7.f:0 "海关报告：1865年葡萄酒出口量达#bold 2.7亿升#!，占财政收入#green 18%#!，伦敦交易所首次出现「#italic 意大利葡萄酒指数#!」"
dsk_ita.7.a:0 "让欧洲宫廷沉醉于三色旗的芬芳！"


je_dsk_italy_centralization:0 "中央集权改革"
je_dsk_italy_centralization_reason:0 "#bold 阿尔贝蒂娜法规#!的羊皮卷展开时，#v 皮埃蒙特#!的丈量尺与#v 西西里#!的坎塔罗单位仍在厮杀。\n\n#yellow 加富尔#!的秘书发现：#v 热那亚#!海关需同时处理#red 7种货币#!和#red 14种计量单位#!——威尼斯商人用拜占庭金索利多缴税，而那不勒斯渔船以阿拉伯迪拉姆结算。\n\n当#v 卡拉布里亚#!土匪王唐·奇乔用#bold 波旁双尾人鱼徽章#!征收『爱国税』时，奥地利大使在#v 威尼斯凤凰剧院#!讥笑：『你们的国家就像被#bold 托斯卡纳石膏#!粘合的#red 破碎马赛克#!，阿尔卑斯山的风都能将它吹散。』"

je_dsk_italy_suffrage:0 "选举权改革"
je_dsk_italy_suffrage_reason:0 "#v 米兰#!的纺织女工用#bold 罢工的梭子#!编织#yellow 选票纱布#!——每匹布暗藏[concept_manifesto]的章节。\n\n#v 都灵#!冶金工会将《青年意大利报》浇铸进炮弹外壳，飞溅的#red 钢水#!在议会大厅地板烙下『#bold 普选#!或#bold 革命#!』的焦痕。\n\n流亡的#yellow 马志尼#!通过#v 科西嘉#!走私船送来加密信件：『当识字率突破#green 25%#!，刺刀将化作投票箱的铰链。』\n\n#v 卡普雷拉岛#!的岩石上，加里波第用军刀刻下：#italic 『街垒的石块#!终将铺就议会台阶』"



je_dsk_italy_land:0 "土地改革"
je_dsk_italy_land_reason:0 "#v 西西里#!的硫磺矿工在#bold 黑圣母像#!前供奉#yellow 土地神像#!，他们的地契被[concept_mafia]锁在#v 巴勒莫#!银行的#red 第六号金库#!。\n\n#v 那不勒斯#!农民用祖传的#bold 诺曼式犁具#!耕作，却要向#yellow 西班牙裔贵族#!缴纳#red 阿拉伯式十一税#!。\n\n当#v 托斯卡纳#!的羊毛利润被#bold 蒸汽纺纱机#!吞噬时，英国领事在报告中写道：『这里的#red 土地制度#!比但丁描写的#bold 炼狱层级#!更复杂——83%耕地属于#yellow 1.2%的贵族#!，而税吏的算盘珠是用[concept_redshirts]战死者的牙齿制成。』"


je_dsk_italy_papacy:0 "政教分离改革"
je_dsk_italy_papacy_reason:0 "当#yellow 庇护九世#!的#bold 《何等可悲》#!通谕在#v 圣彼得大教堂#!宣读时，加里波第的炮弹正将#red 教皇国徽章#!熔铸成共和国徽章。\n\n#v 佛罗伦萨#!的#bold 伽利略学院#!里，大学生用#yellow 但丁十四行诗#!的韵律破译[concept_manifesto]密码，解剖室的#red 福尔马林#!气味中漂浮着#italic 『上帝已死』#!的拉丁语涂鸦。\n\n#v 亚平宁山脉#!的走私者背负着#bold 达尔文标本箱#!穿越边境，箱底暗格里的#yellow 无神论手册#!正用《神曲》的格律重写——#red 凯撒与上帝#!的千年婚约，终被#bold 进化论手术刀#!解剖成标本。"
je_dsk_italy_judicial:0 "司法改革"
je_dsk_italy_judicial_reason:0 "当#yellow 加富尔#!的使者带着#bold 阿尔贝蒂娜法规#!抵达#v 巴勒莫#!时，发现这里的法庭同时悬挂着#red 波旁王朝#!的鳄鱼徽章和#yellow 阿拉伯式天平#!。\n\n在#v 摩德纳#!，法官用#bold 《拿破仑法典》#!审判偷面包的孤儿，而三十公里外的#v 帕尔马#!，盗马贼正按#yellow 拜占庭习惯法#!缴纳九倍赔偿金。\n\n#v 卡拉布里亚#!山区，当#yellow 宪兵队#!持#bold 萨伏伊逮捕令#!搜捕『[concept_mafia]荣誉男人』时，整个村庄敲响#red 诺曼城堡#!的警钟——农夫们用#yellow 中世纪弩箭#!对抗后膛枪，石墙上用羊血写着：『我们的法律从#bold 罗杰二世#!时代就没变过！』\n\n#v 热那亚#!的检察官在日记里控诉：『这个国家同时施行#red 12种刑法典#!，热那亚商人因#bold 犹太教高利贷法#!入狱，而托斯卡纳的凶手用#yellow 教会忏悔特权#!逃脱绞刑——我们建造监狱的速度，赶不上法律自相矛盾的速度！』"

italy_reform_progress_bar_desc:0 "改革进度条：#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!#v （[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/5）#!"

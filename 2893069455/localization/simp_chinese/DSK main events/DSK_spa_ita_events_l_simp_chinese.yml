dsk_ita.44.t:0 "中央集权改革"
dsk_ita.44.d:0 "当#bold 阿尔贝蒂娜法规#!的丈量尺碾过#v 那不勒斯#!市场时，商人们用#red 拜占庭金磅#!嘲弄新标准。土匪王在焦土中竖起[concept_tricolore]，税票上盖着截获的#yellow 萨伏伊印章#!"
dsk_ita.44.f:0 "#v 热那亚#!爆发度量衡暴动\n[concept_habsburg_order]向伦巴第增兵"
dsk_ita.44.a:0 "在遭到土匪焚毁的村庄中建立模范村"
dsk_ita.45.t:0 "选举权改革"
dsk_ita.45.d:0 "#v 米兰#!纺织女工将[concept_manifesto]织入罢工横幅，都灵兵工厂的炮弹壳刻着『普选或革命』。钢水在议会烙下[concept_tricolore]焦痕。"
dsk_ita.45.f:0 "教会宣布选举是#red 『魔鬼契约』#!\n#v 巴勒莫#!投票站遭炸弹袭击"
dsk_ita.45.a:0 "用军乐队护送选民登记官"
dsk_ita.46.t:0 "土地改革"
dsk_ita.46.d:0 "#v 西西里#!矿工焚烧地契的灰烬中，浮现[concept_redshirts]残破的鹰徽。英国领事记载：『83%耕地属于1.2%贵族，税吏算盘珠用加里波第老兵牙齿制成』"
dsk_ita.46.f:0 "[concept_mafia]暗杀土地测量员\n#v 巴勒莫#!地契档案馆焚毁"
dsk_ita.46.a:0 "派遣武装公证人下乡"
dsk_ita.47.t:0 "政教分离改革"
dsk_ita.47.d:0 "当[concept_papacy]诅咒改革时，加里波第旧部将教廷徽章熔铸成[concept_tricolore]路牌。佛罗伦萨解剖室陈列着达尔文标本与圣徒遗骨。"
dsk_ita.47.f:0 "教会发动#red 『新十字军』#!\n#v 罗马#!教士暴动"  
dsk_ita.47.a:0 "将修道院改建为学校"
dsk_ita.48.t:0 "司法统一改革"
dsk_ita.48.d:0 "#v 摩德纳#!法庭同时悬挂#bold 阿尔贝蒂娜法规#!和#red 阿拉伯法典#!。当宪兵持新法令进入#v 卡拉布里亚#!，村民用弩箭在石墙书写：『罗杰二世法典万岁！』"
dsk_ita.48.f:0 "#v 巴勒莫#!律师公会罢审\n[concept_habsburg_order]资助分离诉讼"
dsk_ita.48.a:0 "在焦土建立模范监狱"
dsk_ita.49.t:0 "改革引起南方不满"
dsk_ita.49.d:0 "#v 西西里#!柑橘箱里藏着[concept_mafia]的复仇宣言，每颗血橙刻着『以荣誉之名』。英国记者记载：『北方的改革种子，在焦土收获燃烧瓶』"  
dsk_ita.49.f:0 "#v 马耳他#!走私奥援武器\n加里波第雕像被泼硫磺"
dsk_ita.49.a:0 "南北割裂加剧"

l_simp_chinese:
je_Carlistas_civil_war:0 "第一次卡洛斯内战"
je_Carlistas_civil_war_reason:0 "在技术上是一场王位继承战争，但也是一场关于西班牙新时代建立的战争。"
je_Carlistas_civil_war_goal:0 "在5年内将分离主义控制在30%以下"
je_Spanish_Empire:0 "永不落的日不落帝国"
je_Spanish_Empire_reason:0 "曾经我们的领土遍布世界，太阳总是照耀着我们王国的一部分。我们必须重建我们的永不落的日不落帝国。\n\n菲律宾群岛的椰风仍在吟唱马尼拉大帆船的传奇，墨西哥高原的银矿深处回响着征服者的马蹄，安第斯山脉的印加石壁上还镌刻着托莱多钢剑的纹章。从哈布斯堡王朝的维也纳宫廷到菲律宾海沸腾的浪尖，从佛罗里达半岛的橙花香到直布罗陀海峡永不熄灭的灯塔，三百个太阳年轮的辉煌早已证明——上帝将日不落的权柄独授西班牙！"
Make_Spain_Great_Again_events.1.t:0 "卡利斯塔"
Make_Spain_Great_Again_events.1.d:0 "卡利斯塔是一群不承认费迪南多七世继承者伊莎贝拉为合法西班牙国王的人，他们支持国王的弟弟卡洛斯作为合法的西班牙国王。以巴斯克地区为支持基地，他们捍卫君主专制、教堂和地方特权等封建社会制度，并在经济结构上主张反工业化。另一方面，由伊莎贝拉女王领导的马德里政府是自由主义、市民革命主义的，他们通过提倡自上而下的集中现代化获得了自由主义者的支持。尽管正式上是一场王位继承战争，但实际上这是西班牙的一个新时代，也是一个关于体制的战争。"
Make_Spain_Great_Again_events.1.f:0 "对于那些相信过去更好的人来说，现实是无法忍受的。" - 西班牙国王胡安·卡洛斯一世
Make_Spain_Great_Again_events.1.a:0 "女王万岁！"
Make_Spain_Great_Again_events.1.b:0 "卡洛斯万岁！"
Make_Spain_Great_Again_events.1.c:0 "取消"
Make_Spain_Great_Again_events.2.t:0 "[SCOPE.sState('revolt_Spain_target_state_1').GetName]的起义"
Make_Spain_Great_Again_events.2.d:0 "[SCOPE.sState('revolt_Spain_target_state_1').GetName]的叛乱之火日益燃烧！"
Make_Spain_Great_Again_events.2.f:0 "“谁能认为我是反动势力的支持者，死亡？” - 巴勃罗·毕加索"
Make_Spain_Great_Again_events.2.a:0 "该死！"
Make_Spain_Great_Again_events.2.b:0 "取消"
Make_Spain_Great_Again_events.3.t:0 "[SCOPE.sState('loyalists_Spain_target_state_1').GetName]回到了忠诚派！"
Make_Spain_Great_Again_events.3.d:0 "[SCOPE.sState('loyalists_Spain_target_state_1').GetName]有一次大规模集会来支持忠诚派，并且他们的支持正在扩散到[SCOPE.sState('loyalists_Spain_target_state_1').GetName]！"
Make_Spain_Great_Again_events.3.f:0 "“你可以成为你自己。” - 特蕾莎修女"
Make_Spain_Great_Again_events.3.a:0 "太棒了！"
Make_Spain_Great_Again_events.3.b:0 "取消"
Make_Spain_Great_Again_events.4.t:0 "卡洛斯五世"
Make_Spain_Great_Again_events.4.d:0 "女王伊莎贝拉的弟弟，不服从女王的命令，宣布自己流亡葡萄牙的西班牙国王，自称卡洛斯五世。当时西班牙内部，自由主义由资产阶级支持，而反动派则以教会和贵族地主为中心继续进行政治对抗，而卡洛斯与后者勾结。卡洛斯在巴斯克地区和纳瓦拉建立了叛军，而卡利斯塔的军队则是马德里的政府军。一度他们差点围攻马德里。"
Make_Spain_Great_Again_events.4.f:0 "“一旦你决定战斗，你必须坚定不移。” - 法国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]拿破仑·波拿巴"
 Make_Spain_Great_Again_events.4.a:0 "尴尬"
Make_Spain_Great_Again_events.4.b:0 "卡洛斯五世，西班牙万岁！"
Make_Spain_Great_Again_events.5.t:0 "农村困扰"
Make_Spain_Great_Again_events.5.d:0 "卡利斯塔内战演变成了关于西班牙新政权的战争，但对于许多西班牙农村村庄来说，这完全无关紧要。然而，由于派系冲突，农村村庄遭受了严重破坏，农民的怨声渐渐增加。"
Make_Spain_Great_Again_events.5.f:0 "“我们要好农民。他们使我们的军队强大。” - 法国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]拿破仑·波拿巴"
Make_Spain_Great_Again_events.5.a:0 "太可悲了"
Make_Spain_Great_Again_events.6.t:0 "士兵的叛乱"
Make_Spain_Great_Again_events.6.d:0 "将西班牙分裂为两个的内战在军队中引起了巨大的动荡。我们应该加入马德里政府军还是卡洛斯派别？士兵和军官之间的分歧越来越明显。"
Make_Spain_Great_Again_events.6.f:0 "“爱情中的每个男人都是一名士兵。” - 诗人奥维德"
Make_Spain_Great_Again_events.6.a:0 "嘿，听着！"
Make_Spain_Great_Again_events.10.t:0 "殖民政策"
Make_Spain_Great_Again_events.10.d:0 "西班牙的殖民政策曾经遭受重大挫折，但现在拿破仑的威胁已经过去，有广泛的呼声要推动殖民主义。第一个目的地是尚未触及的西撒哈拉！"
Make_Spain_Great_Again_events.10.f:0 "“行动是一切成功的根本关键。” - 画家巴勃罗·毕加索"
Make_Spain_Great_Again_events.10.a:0 "西班牙永不灭亡，它将一次又一次崛起！"
Make_Spain_Great_Again_events.10.b:0 "我们应该专注于国内事务"


je_spain_second_republic_reason:0 "#bold 第二共和国#!是1931年建立的#yellow 民主实验#!，此刻正深陷#yellow 曼努埃尔·阿萨尼亚#!总统领导的#variable 左翼联盟#!与#yellow 何塞·圣胡尔霍#!将军为首的#variable 右翼势力#!的生死博弈。\n\n#variable 左翼改革派#!以#bold 土地重新分配#!和#bold 政教分离#!为纲领，获得#v $SPA$#!工会的街头支持。\n#variable 右翼保守派#!则联合#v $卡利斯塔$#!地方强权与保皇民兵，秘密获得#v $ITA$#!的武器输送。\n\n双方在#bold 加泰罗尼亚自治#!和#bold 军事改革#!上的不可调和，已导致#variable 国家机能瘫痪#!——议会的每项法案都演变成#v $general$#!与#v $military$#!的恶性循环。\n#bold 当总工会与伊比利亚无政府主义联盟的[concept_alliance]濒临破裂时，[concept_civil_war]的丧钟将为[SCOPE.GetRootScope.GetCountry.GetName]敲响！#!"


# 意埃条约事件链
dsk_ita.8.t:0 "意大利-埃塞协定"
dsk_ita.8.d:0 "1889年的瓦尔瓦尔绿洲，意大利语与阿姆哈拉语版本的条约在月光下展开。我们的外交官指着第17条款解释：『这只是技术性表述』，却悄悄将[SCOPE.sCountry('eth_scope').GetName]的外交权收入囊中。[SCOPE.sCharacter('crisis_scope_1').GetFirstName]的使者抚摸着镶金圣经的封面，浑然不知墨迹未干的文字将成为套住雄狮的绞索。"
dsk_ita.8.f:0 "阿斯马拉的棱堡升起三色旗时，当地铁匠正将缴获的格拉茨步枪熔铸成耕犁——这些农具将在十年后变成反抗军的标枪。"
dsk_ita.8.a:0 "语言是最高明的武器"  # 触发埃塞俄比亚外交危机
dsk_ita.8.b:0 "我们需要更直接的掌控"  # 立即引发武装冲突

# 殖民统治事件
dsk_ita.9.t:0 "红海畔的新罗马"
dsk_ita.9.d:0 "1905年的摩加迪沙港，乳香树脂在铁皮仓库堆积如山，米兰香水商人的怀表链上晃动着索马里儿童的牙齿。殖民军官发明『铁路里程换军功』制度：每铺设一公里铁轨可减少三个月服役期，而倒下苦力的尸骨正成为路基最好的加固材料。"
dsk_ita.9.f:0 "当第一列火车驶入亚的斯亚贝巴时，当地长老发现时刻表用罗马数字书写——这是但丁都想象不到的文明远征。"
dsk_ita.9.a:0 "让铁轨碾碎原始与愚昧"  # 强化殖民控制

# 反抗升级事件
dsk_ita.10.t:0 "示巴女王的复仇"
dsk_ita.10.d:0 "1911年的旱季，[SCOPE.sCountry('eth_scope').GetName]游击队在废弃的意大利教堂发现惊人秘密：乌查利条约原件被制成忏悔室的隔板。他们用枪托砸碎圣像，将条约残片分发给每个战士——沾满烛油的字句比任何宣言都能鼓舞士气。"
dsk_ita.10.f:0 "提格雷高原的农民用格拉茨步枪改造的播种机，正在殖民者眼皮底下收获反抗的火种。"
dsk_ita.10.a:0 "用机枪播撒文明的种子"  # 升级镇压措施
protect_eth_button:0 "宣称埃塞是我们的受保护国"
protect_eth_button_desc:0 "这会导致进度条推进十点，但我们一年只能进行一次"

dsk_ita.11.t:0 "洛桑条约"
dsk_ita.11.d:0 "1923年#yellow 洛桑#!的谈判桌上，意大利代表用#bold 班加西#!的沙粒填满玻璃沙漏，向世界宣告：『每粒沙子坠落的速度，就是文明战胜野蛮的速度。』当土耳其外交官颤抖着签署条约时，的黎波里港的#yellow 圣乔治号巡洋舰#!正用探照灯将三色旗投射到#bold 古莱阿内斯神庙#!的断壁上。\n\n在#yellow 费赞沙漠#!深处，赛努西教团的信使骑着单峰骆驼传递密语：『奥斯曼的弯刀已锈，罗马的枷锁未铸』。我们的殖民工程师却在这片『无用荒漠』下发现了#bold 深层含水层#!——足够灌溉整个西西里岛十年的水量。"
dsk_ita.11.f:0 "的黎波里塔尼亚和昔兰尼加是土耳其在北非的一片荒漠，经济价值有限，但战略地位重要。它与西西里岛对峙，可控制地中海中部较狭窄的海面，拥有了这块地，我们可以在广袤的北非站稳脚跟"
dsk_ita.11.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁！"

king_of_alb:0 "阿尔巴尼亚国王"
je_italia_our_sea_greece:0 "征服希腊"
je_italia_our_sea_greece_reason:0 "1940年深秋，第#bold 茱莉亚山地师#!的士兵用#italic 古罗马银币#!贿赂伊庇鲁斯的牧羊人带路，却在#yellow 品都斯山脉#!遭遇暴雪。墨索里尼在电台宣称：『我们的坦克正沿着#bold 埃格纳蒂亚大道#!的轨迹前进』——实际上，菲亚特卡车正将#bold 庞贝古城#!的火山灰运往前线，用来填平希腊游击队的反坦克壕。"
je_dsk_italy_conquer_alb:0 "征服阿尔巴尼亚"
je_dsk_italy_conquer_alb_reason:0 "1917年#yellow 斯库台湖#!的浓雾里，意大利工兵将#bold 带刺铁丝网#!编织成现代文明的经纬线。阿尔巴尼亚游击队员用#yellow 奥斯曼遗留的克虏伯火炮#!轰击我们的通讯站，却发现炮弹里塞满#italic 土耳其烟草#!——这是当地走私贩的黑色幽默。\n\n在#yellow 地拉那#!，我们扶持的傀儡政府用#bold 意大利语教材#!替换《古兰经》课程，印刷机的油墨掺着#yellow 普里兹伦#!银矿的粉尘。当法国大使抗议时，外长展示了#bold 1915年伦敦密约#!的影印件：『巴尔干的棋盘容得下所有棋手』。"
dsk_ita.15.t:0 "签订《乌查利条约》"
dsk_ita.15.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]承认埃塞比亚君主#v 孟尼利克二世#!为[SCOPE.sCountry('eth_scope').GetName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]，而埃塞俄比亚承认意大利大红海沿海有主权"
dsk_ita.15.f:0 "埃塞俄比亚[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]约翰尼斯四世统治时期，绍阿地区统治者#v 孟尼利克二世#!和意大利保持友好关系。约翰尼斯四世死后不久，#v 孟尼利克二世#!即与意大利签订此约。主要内容有：#v 孟尼利克二世#!承认意大利对厄立特里亚高原的大部分地区拥有主权；意大利承认#v 孟尼利克二世#!为埃塞俄比亚[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]，允其通过意大利领土输入武器和军火。但因第17款文本不同引起争议。阿姆哈拉文本规定：#v 孟尼利克二世#!可利用意大利政府的服务，按照自己的意愿同别的国家进行交往；意大利文本却称#v 孟尼利克二世#!的对外交往需通过意大利政府。"
dsk_ita.15.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]和[SCOPE.sCountry('eth_scope').GetName]的关系牢不可破"

dsk_ita.16.t:0 "意大利-埃塞决裂"
dsk_ita.16.d:0 "[SCOPE.sCountry('eth_scope').GetName]政府拒绝接受意大利的保护。埃塞俄比亚[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]曼涅里克二世知会意大利政府，自次年起将不再履行《乌查利条约》的一切权利及义务"
dsk_ita.16.f:0 "让埃塞俄比亚脱离我们的控制重新回归主权国家是万万不可接受的"
dsk_ita.16.a:0 "小小埃塞俄比亚居然敢拒绝我大[SCOPE.GetRootScope.GetCountry.GetName]的要求！"
africa_attack:0 "非洲独立战争热情"

# 殖民统治事件链
dsk_ita.17.t:0 "红海王冠上的毒刺"
dsk_ita.17.d:0 "1890年#yellow 马萨瓦港#!的烈日下，殖民总督用#bold 格拉茨步枪#!枪管搅拌着咖啡，向罗马发电报：『只需在亚的斯亚贝巴皇宫升起#italic 半旗尺寸的三色旗#!，就能让孟尼利克二世成为提线木偶。』\n\n秘密警察在#yellow 哈勒尔#!市场散布谣言：『埃塞皇帝的加冕油膏掺了猪油』——这足以让#bold 科普特教士#!倒戈。当英国领事抗议时，我们展示了#yellow 乌查利条约#!阿姆哈拉语版本的第17条空白处，用隐形墨水写着『意大利即上帝旨意』。"
dsk_ita.17.f:0 "米兰报纸头条：『从#bold 古罗马军团#!到#bold 非洲之角#!，文明的火炬永不熄灭！』\n但#red 提格雷高原#!的牧羊人正将条约羊皮纸改造成弹弓。"
dsk_ita.17.a:0 "让雄狮戴上天鹅绒项圈"  # 触发傀儡政权机制
dsk_ita.17.b:0 "真正的征服需要剑与火"  # 直接军事占领

# 殖民军困境事件
dsk_ita.18.t:0 "铁皮罐头里的蛆虫"
dsk_ita.18.d:0 "1897年#yellow 厄立特里亚#!军营，军需官账簿显示：每月#bold 1200罐#!过期牛肉罐头被标注为『特供战备』。士兵发现蛆虫在#bold 卡尔卡诺步枪#!枪管筑巢，痢疾让#yellow 阿斯马拉#!驻军失去战斗力的速度比土著弓箭更快。\n\n随军神父在布道时呕吐——他刚吃下的圣饼是用#bold 发霉面粉#!制作。殖民部调查报告：『每公里铁路运输消耗#red 43%#!的补给品，剩余食物只够维持#italic 蝗虫的生存需求#!』"
dsk_ita.18.f:0 "那不勒斯团第三营集体在#yellow 克伦#!要塞墙上涂鸦：『我们为意大利而战，却像鬣狗般死去』"
dsk_ita.18.a:0 "命令士兵学习骆驼反刍"  # 士气-30%，哗变风险
dsk_ita.18.b:0 "用殖民地的乳香换取新鲜面包"  # 财政-15%，补给效率+40%

# 殖民地起义事件
dsk_ita.19.t:0 "燃烧的乳香树"
dsk_ita.19.d:0 "1906年雨季，#yellow 哈勒尔#!的乳香采集工将树脂涂在箭矢上，点燃了#bold 意大利总督府#!。起义者使用#yellow 瑞士造测距仪#!和#bold 前装土炮#!，在#yellow 达洛尔洼地#!构筑防线。\n\n英国《泰晤士报》记者拍摄到：游击队员佩戴的护身符，竟是#italic 乌查利条约#!的羊皮纸碎片。他们在被焚毁的铁路枕木上刻字：『每道铁轨都是抽打先祖亡魂的鞭痕』"
dsk_ita.19.f:0 "米兰证券交易所的乳香期货暴跌#red 220%#!，香水商人要求派兵保护种植园"
dsk_ita.19.a:0 "用维特利机枪谱写安魂曲"  # 触发焦土政策

# 镇压反馈事件
dsk_ita.20.t:0 "血浸的殖民勋章"
dsk_ita.20.d:0 "1911年#yellow 锡达莫#!的战场遗迹，殖民军将#bold 3000具#!起义者遗体浇筑进新建水坝。随军记者报道：『混凝土中伸出的手臂，成为测量水位的天然标尺』。\n\n在#yellow 亚的斯亚贝巴#!皇宫，总督用#bold 孟尼利克二世的头盖骨#!制作烟灰缸，边缘镌刻着『文明开化的最终证明』。教会秘密档案显示：每镇压#bold 1个村庄#!，就产生#red 3名#!携带格拉茨步枪的复仇者。"
dsk_ita.20.f:0 "巴黎人类学博物馆正在拍卖#yellow 起义领袖的头骨#!，标价相当于#bold 50公里铁路#!的造价"
dsk_ita.20.a:0 "让下一批反抗者成为混凝土添加剂"  # 国际谴责+25%
large_death_modifier:0 "镇压革命"

dsk_ita.21.t:0 "我们在非洲的总督压榨[SCOPE.sState('east_africa_state').GetName]当地劳工"
dsk_ita.21.d:0 "[SCOPE.sState('east_africa_state').GetName]的劳工被从事严苛的体力活动"
dsk_ita.21.f:0 "这是对他们不听劝的惩罚"
dsk_ita.21.a:0 "他们的死活与我无关。毕竟他们的工作由我提供"
large_coin_modifier:0 "残酷剥削"

dsk_ita.22.t:0 "米兰起义"
dsk_ita.22.d:0 "米兰五日是1848年革命和第一次意大利独立战争的重要事件。1848年3月18日，在米兰城爆发了起义，进行了五天的街头战斗，将约瑟夫·拉德茨基·冯·拉德茨和他的奥地利帝国军队赶出了米兰。"
dsk_ita.22.f:0 "荣耀属于意大利！"
dsk_ita.22.a:0 "我学习到了更多"

dsk_ita.23.t:0 "[SCOPE.sCharacter('gaixi').GetLastName]改变了意识形态"
dsk_ita.23.d:0 "1858年冬，[SCOPE.sCharacter('gaixi').GetLastName]在#yellow 都灵#!军械库的硝烟中完成政治演算：\n\n与#yellow 拿破仑三世#!签订《#bold 普隆比耶尔密约#!》换取#bold 12万法军#!支援\n• 将铁路延伸至#bold 2200公里#!以快速投送#yellow 阿尔卑斯山地旅#!\n• 在#yellow 热那亚#!建立#bold 国家贴现银行#!为军工复合体输血\n\n当马志尼派指责这是「#italic 用冠冕背叛革命#!」时，加富尔在议会举起奥地利#yellow 拉德茨基#!元帅的佩剑：「#bold 这柄缴获于诺瓦拉的钢刃，比任何宣言都能说明[GetLawType('law_monarchy').GetName]的价值#!」"
dsk_ita.23.f:0 "荣耀属于萨伏伊王朝！"
dsk_ita.23.a:0 "他说得对"

dsk_ita.24.t:0 "我要带你去见一个人"
dsk_ita.24.d:0 "[SCOPE.sCharacter('gaixin').GetFullName]的到来"
dsk_ita.24.f:0 "[SCOPE.sCharacter('gaixin').GetLastName]十岁时入都灵军官学校学习。1826年毕业后被任命为工兵少尉，并充任卡里乃诺亲王近侍。1831年在亲王承袭王位称阿尔伯特国王后辞去军职，周游法、英、瑞士和比利时，研究西方世界的政治、社会和经济问题，以及皮蒙特的农业和商业问题。一度经营农业、商业和银行。\n现在，他学成归来，致力于投身意大利民族解放事业，有他在，意大利的统一问题就可以迎刃而解"
dsk_ita.24.a:0 "我会让他出任首相职位。"

dsk_ita.25.t:0 "[SCOPE.sCharacter('gaixin').GetLastName]的创刊"
dsk_ita.25.d:0 "1847年创刊的《#bold 光复报#!》正以#yellow 都灵#!为枢纽，每月向半岛输送#bold 12万份#!印刷品。当奥地利审查官在#yellow 曼托瓦#!焚毁第37期社论时，这份报纸已通过#yellow 苏萨山口#!的走私网络，将[concept_manifesto]的核心条款译成伦巴第方言传播——其头版头条「#italic 每根铁轨都是射向维也纳体系的炮弹#!」正成为北意大利工厂主的座右铭。\n\n#bold 每发行1万份报纸#!，[ROOT.GetCountry.GetAdjective]的工业化进度提升#green +0.5%#!，同时使奥地利在#yellow 威尼西亚#!的激进分子生成率增加#red +0.2%#!。"

dsk_ita.25.f:0 "加富尔内阁的经济闪电战：\n• #yellow 1853年《票据法》#!使热那亚港贸易结算效率#green +40%#!\n• #yellow 工业垄断法#!授权建立#bold 15家国营兵工厂#!\n• 与英国签订#yellow 《都灵商约》#!，将生铁关税从#red 35%#!降至#green 12%#!\n当奥地利驻军还在#yellow 佩斯基耶拉#!要塞操练滑膛枪时，[ROOT.GetCountry.GetAdjective]的铁路网正以#bold 每日1.2公里#!速度向罗马延伸。"

dsk_ita.25.a:0 "用印刷机和铁轨重塑意大利！"
modifier_rise_italia:0 "《光复报》"

dsk_ita.26.t:0 "意大利民族统一"
dsk_ita.26.d:0 "现在，[SCOPE.GetRootScope.GetCountry.GetName]已经是亚平宁半岛上最伟大的国家了"
dsk_ita.26.f:0 "意大利啊，你是我们的家园，\n你的土地充满了传奇和荣耀。\n我们的血脉流淌着你的热情，\n我们的心灵共鸣着你的理想。"
dsk_ita.26.a:0 "我们现在可以采取联合亚平宁的小国的行动"

dsk_ita.27.t:0 "[concept_unification]的民族协会"
dsk_ita.27.d:0 "从#yellow 佛罗伦萨#!的羊毛行会到#yellow 米兰#!的工程师协会，[SCOPE.GetRootScope.GetCountry.GetName]境内已建立#bold 237个#!地方民族委员会。这些组织正执行精密分工：\n\n• #yellow 热那亚#!分会通过走私英国焦炭，使铁路建设速度提升#green +18%#!\n• #yellow 帕尔马#!支部渗透奥地利海关，每月截获#bold 2000支#!前装步枪\n• #yellow 都灵#!总部用暗语编写的《#italic 统一进度报告#!》，正通过教会告解室传递至每个村庄"

dsk_ita.27.f:0 "「每个行业协会都是刺向奥地利帝国的解剖刀」——加富尔在1856年秘密备忘录中写道。此刻：#yellow 博洛尼亚#!的学生用但丁诗篇加密军事情报；#yellow 那不勒斯#!的黑市商人以三色旗为凭供应硝石；而#yellow 威尼斯#!的玻璃工匠正为[concept_redshirts]制作光学瞄准镜。"

dsk_ita.27.a:0 "建立中央指导委员会！" 

modifier_rise_italia1:0 "意大利民族协会"
dsk_ita.28.t:0 "罗马的火种"
dsk_ita.28.d:0 "当#yellow 庇护九世#!在#yellow 圣彼得大教堂#!谴责[concept_unification]为「#italic 撒旦的工程#!」时，[ROOT.GetCountry.GetAdjective]间谍正通过#yellow 亚壁古道#!向#yellow 罗马#!走私#bold 400箱#!李-恩菲尔德步枪。这些武器被藏在运送圣餐酒的橡木桶中，由#yellow 加里波第#!旧部组成的#bold 红衫别动队#!负责分发——他们伪装成朝圣者，在#yellow 万神殿#!柱廊下教授农民使用#bold 硝化甘油炸药#!破坏奥军补给线。\n\n此刻，法国驻军正将#yellow 圣天使堡#!的#bold 24磅青铜炮#!替换为#yellow 克虏伯#!后膛炮，而我们的密探已策反#yellow 教皇瑞士卫队#!的三名下士——他们的口令「#italic 但丁永生#!」将成为总攻信号。"
dsk_ita.28.f:0 "截获的教皇通谕：『任何阅读[concept_manifesto]杂志者将被处以绝罚』——这反而使走私报纸的价格暴涨#green 300%#!。\n\n军械库记录：通过#yellow 奇维塔韦基亚#!港输入的#bold 夏塞波步枪#!已达800支/月"

dsk_ita.28.a:0 "罗马城众奴隶，即刻随我起义！"  
dsk_ita.28.b:0 "也许等待上帝之鞭来制裁教皇？"  

modifier_rise_italia1:0 "意大利民族协会"

dsk_ita.29.t:0 "普隆比耶尔密约"
dsk_ita.29.d:0 "1858年7月，因#yellow 加富尔#!与#yellow 拿破仑三世#!在#yellow 孚日山脉#!达成秘密协议：法国将出动#bold 20万军队#!协助对抗奥地利，作为交换，[ROOT.GetCountry.GetAdjective]需割让#yellow 萨伏伊#!和#yellow 尼斯#!。当英国大使质问这是否违反#yellow 维也纳条约#!时，我们的外交官正在#yellow 多佛尔#!港用#bold 500吨生铁#!换取英国默许——这些钢材正变成#yellow 亚历山德里亚#!兵工厂的线膛炮管。"
dsk_ita.29.f:0 "秘密电报显示：法国要求撒丁在战后实施[GetLawType('law_wealth_voting')]以确保投资安全"
dsk_ita.29.a:0 "签署魔鬼的契约" 
dsk_ita.29.b:0 "保持外交自主"  


dsk_ita.30.t:0 "火星西进"
dsk_ita.30.d:0 "1860年5月，#yellow 加里波第#!率领#bold 1089名#!红衫军乘两艘破旧货轮从#yellow 热那亚#!启航。当奥地利海军在#yellow 墨西拿海峡#!巡逻时，我们通过#yellow 马耳他#!走私网输送了：#bold 4000支恩菲尔德步枪#!、#bold 20门山地榴弹炮#!和#bold 3吨硝石#!。此刻，#yellow 巴勒莫#!的面包师正用酵母菌培养瓶隐藏[concept_manifesto]，而#yellow 那不勒斯#!的监狱里关押着237名高唱《马梅利之歌》的学生。"
dsk_ita.30.f:0 "加里波第日记：『这些用托斯卡纳语印刷的西西里地图，比任何罗盘都精准』"
dsk_ita.30.a:0 "点燃第勒尼安的火炬！"  
dsk_ita.30.b:0 "时机尚未成熟"  


dsk_ita.31.t:0 "文化熔炉"
dsk_ita.31.d:0 "1861年，#yellow 卡米洛·加富尔#!在#yellow 佛罗伦萨#!建立#bold 国家教育委员会#!，强制推行：#yellow 托斯卡纳意大利语#!标准化教材、统一历史叙事和#yellow 但丁#!纪念日。当#yellow 威尼斯#!方言报纸被查禁时，[ROOT.GetCountry.GetAdjective]的#bold 487所新小学#!正以每月#bold 3000人#!的速度将文盲率从78%压至61%——这些识字者很快成为铁路的司炉工和兵工厂的质检员。"
dsk_ita.31.f:0 "教育部报告：使用统一教材后，伦巴第地区的国家认同度提升#green 42%#!"
dsk_ita.31.a:0 "铸剑为犁，化语为刃！"  

dsk_ita.32.t:0 "[SCOPE.sCharacter('gaixi').GetLastName]改变了意识形态"
dsk_ita.32.d:0 "1859年#yellow 索尔费里诺战役#!后，面对法国背弃#yellow 普隆比耶尔密约#!的行径，[SCOPE.sCharacter('gaixi').GetLastName]在#yellow 都灵#!秘密会晤普鲁士军事顾问团。三天后颁布《#bold 王权至上法令#!》：\n\n• 废除与法国签订的所有改革条款\n• 实施[GetLawType('law_professional_army')]\n• 将#yellow 热那亚#!海军基地升级为#bold 一级战备港口#!\n\n此刻，[concept_redshirts]正被改编为#yellow 阿尔卑斯山地旅#!，其新式灰色军服上再也找不到三色旗徽章。"
dsk_ita.32.f:0 "军械库记录：新列装的Dreyse针发枪射速达奥地利前装枪#green 300%#!"
dsk_ita.32.a:0 "铁与血的时代来临！"  



dsk_ita.33.t:0 "千人远征"
dsk_ita.33.d:0 "1860年5月5日，#yellow 加里波第#!率领#bold 1089名#!志愿者乘「#italic 皮埃蒙特#!」与「#italic 伦巴第#!」号蒸汽船从#yellow 热那亚#!启航。这支装备#bold 恩菲尔德1853#!线膛枪的部队，携带着[ROOT.GetCountry.GetAdjective]秘密提供的#bold 20门#!山地榴弹炮，在#yellow 马耳他#!走私网的掩护下突破奥地利海军封锁。当他们在#yellow 马尔萨拉#!登陆时，西西里农民用驴车运来#bold 3000桶硫磺#!作为炸药原料——三个月内，这支「千人军」已发展为#bold 2.4万#!人的[concept_redshirts]主力兵团。"
dsk_ita.33.f:0 "加里波第致都灵的电报：『我已将两西西里献给维托里奥·埃马努埃莱二世，但共和制的火种永不熄灭！』"
dsk_ita.33.a:0 "让红衫染透半岛！" 


dsk_ita.34.t:0 "最后的城墙"
dsk_ita.34.d:0 "1870年9月20日，#yellow 拉法埃莱·卡多纳#!将军的#bold 6万大军#!用#yellow 克虏伯#!攻城炮轰开#yellow 庇亚门#!。当教皇卫队还在使用#bold 前装燧发枪#!时，[ROOT.GetCountry.GetAdjective]工兵已用#bold 硝化甘油炸药#!爆破#yellow 奥勒良城墙#!。此刻，#yellow 拿破仑三世#!刚从色当战俘营发来电报：「#italic 法国再也无力保护教廷#!」——而#yellow 庇护九世#!正通过#yellow 圣天使堡#!的密道逃往梵蒂冈。"
dsk_ita.34.f:0 "军医报告：此战伤亡仅#bold 49人#!，因守军半数早已投诚"
dsk_ita.34.a:0 "以意大利之名解放永恒之城！"  


dsk_ita.35.t:0 "共和国的晨曦"
dsk_ita.35.d:0 "当#yellow 朱塞佩·马志尼#!的追随者在#yellow 西班牙广场#!升起#bold 三色鹰旗#!时，[ROOT.GetCountry.GetAdjective]议会正被#bold 327名#!携带左轮手枪的市民包围。这些#yellow 共和派#!通过[concept_manifesto]组织网络，已控制#yellow 台伯河#!沿岸所有电报局——他们要求立即实施[GetLawType('law_universal_suffrage')]并废除#yellow 君主年金#!。"
dsk_ita.35.f:0 "截获的密信显示：法国雅各宾派已运送#bold 8000支夏塞波步枪#!至#yellow 奇维塔韦基亚#!港"
dsk_ita.35.a:0 "顺应[concept_revolution]浪潮！"  #
dsk_ita.35.b:0 "祖宗之法不可变！"  


dsk_ita.36.t:0 "意大利议会"
dsk_ita.36.d:0 "当#yellow 加富尔#!的骨灰安葬在都灵纪念碑下时，他设计的#bold 阿尔贝蒂尼宪法#!正在亚平宁半岛掀起风暴。从1861年都灵王宫改建的临时议会厅，到1871年迁都罗马后占据#yellow 蒙特奇托里奥宫#!的正式议院，这个#bold 两院制#!的政治角斗场见证了：\n\n• 1882年右派总理#yellow 德普雷蒂斯#!用#bold 多数选举法#!操纵选区划分\n• 1898年左翼议员#yellow 图拉蒂#!在议会挥舞#bold 米兰大屠杀#!的血衣抗议\n• 1913年#yellow 乔利蒂#!推动#bold 全民普选#!时与教廷的隐秘交易"

dsk_ita.36.f:0 "意大利议会是意大利的立法机构，负责制定和修改法律、审查政府提出的法律草案以及监督政府的行政活动。意大利议会是意大利的最高权力机关之一，其组成和职权在意大利宪法中得到规定。"
dsk_ita.36.a:0 "议会顺利召开！"
dsk_ita.36.b:0 "第二届议会顺利召开！"
dsk_ita.36.c:0 "第三届议会顺利召开！"
dsk_ita.36.z:0 "第四届议会顺利召开！"
dsk_ita.36.e:0 "第五届议会顺利召开！"

dsk_ita.37.t:0 "教皇势力反扑"
dsk_ita.37.d:0 "危机解除了，现在，我们又可以变回到教皇国了"
dsk_ita.37.f:0 "我们该怎么做？"
dsk_ita.37.a:0 "移驾罗马城！"
dsk_ita.37.b:0 "变来变去成何体统！"

je_dsk_italy_mafia:0 "黑手党活动"
je_dsk_italy_mafia_reason:0 "19世纪初，[concept_mafia]已发展成一个等级森严、派系众多的秘密组织。[concept_mafia]的基本组织是有血缘和联姻关系的家族，其首脑拥有很大权威，几个家族又聚合成集团，势力最大的几个家族的首脑组成一个起最高裁决作用的委员会。[concept_mafia]接收成员的条件十分严格：成员不得与政府部门和警方有任何联系，并具有“献身”的勇气。"

dsk_italy_mafia_progress_bar_citrus:0 "来自于[SCOPE.sCulture('south_italian_culture').GetName]地区的$building_wheat_farm$中的$pm_citrus_orchards_enr$或$pm_citrus_orchards$"
dsk_italy_mafia_progress_bar_police:0 "来自于$lawgroup_policing$"

concept_mafia:0 "黑手党"
concept_mafia_desc:0 "Mafia（黑手党）一词起源于1282年3月30日情人节前一天的西西里起义。当一个巴勒莫的少女索菲娅在结婚当天被法国士兵强奸后，西西里开始了疯狂的报复，他们袭击见到的每一个法国人，并提出“Morto Alla Francia, Italia Anela”（意大利文“消灭法国是意大利的渴求”），而Mafia就是这个口号的字母缩写。"
Mafia_modifier:0 "黑手党活动"

mafia_economy_modifer:0 "柑橘大王"

modifier_reforms_of_sar6:0 "控制的黎波里塔尼亚"
modifier_reforms_of_sar7:0 "掌控意大利亚"
modifier_reforms_of_sar8:0 "意大利柑橘"

dsk_ita.14.t:0 "柑橘的救赎"
dsk_ita.14.d:0 "伦敦海军部的订单像地中海季风般席卷西西里——每年50万加仑柠檬汁供应合同，用于防治皇家海军的坏血病[4](@ref)。巴勒莫港建立了『柑橘出口联合会』，通过掺入未成熟果实将实际供应量压缩至合同量的60%，差额部分用石灰水增稠[9](@ref)。讽刺的是，这批劣质柠檬汁反而加速了维生素C提取技术的突破[4](@ref)"
dsk_ita.14.f:0 "1862年，从[ROOT.GetCountry.GetAdjective]进口的#yellow 柑橘#!占据了[SCOPE.sCountry('gbr_scope').GetName]去年62%的#yellow 柑橘#!订单。\n\n当伦敦贵妇用西西里柠檬汁美白肌肤时，巴勒莫的『柠檬新娘』们正用残缺的手指在圣母像前祈祷——她们的嫁妆是父亲被黑手党公证过的债务契约。"
dsk_ita.14.a:0 "让伦敦交易所充满三色旗的味道"

je_italia_citrus:0 "富饶的柑橘业"
je_italia_citrus_reason:0 "19世纪意大利柑橘业既是“绿色黄金”的财富神话，也是殖民式剥削的典型案例。其兴衰折射了全球化贸易的机遇与脆弱性，以及意大利统一后南方在现代化浪潮中的挣扎。这一产业的遗产至今可见——西西里血橙仍在欧盟享有原产地保护（PDO），而黑手党对农业的控制阴影仍未完全消散"
every_italy_land_add_fruit_modifier_tt:0 "所有启用$pm_citrus_orchards_enr$的[SCOPE.sCulture('south_italian_culture').GetName]省份会获得产出修正"

 dsk_spa.30.d:0 "[concept_condor_legion]的He-111机群进驻萨拉戈萨机场，88毫米高射炮伪装成「农业机械」运抵托莱多。容克运输机首次实现跨海兵力投送，将摩洛哥军团直接空运至塞维利亚，创造现代战争史奇迹"
dsk_spa.30.f:0 "「这是新式战争的实验室」——空军上校沃尔夫拉姆·冯·里希特霍芬"
dsk_spa.30.a:0 "该死"  

dsk_spa.31.t:0 "西班牙内战"
dsk_spa.31.d:0 "马德里大学城的书架成为机枪掩体，托莱多城堡的文物被熔铸成子弹，格尔尼卡的毕加索壁画在轰炸中化为灰烬。佛朗哥的非洲军团用摩尔弯刀处决战俘，共和军的妇女联盟用缝纫机制作军装"
dsk_spa.31.f:0 "「这里没有前线，整个国家都是战壕」——欧内斯特·海明威战地报道"
dsk_spa.31.a:0 "我们将宣布支持#v 国民军#!"
dsk_spa.31.b:0 "我们将宣布支持#v 共和军#!"
dsk_spa.31.c:0 "为什么西班牙的事总是那么糟糕"
dsk_spa.32.t:0 "[SCOPE.sCountry('western_country').GetName]公开宣布支持共和军"
dsk_spa.32.d:0 "[SCOPE.sCountry('western_country').GetName]边防军「疏忽」放任军火过境，油轮悬挂巴拿马旗输送燃料，美国作家海明威组织救护车队。伦敦的共产主义书店成为募捐站，巴黎美术学院学生伪造海关文件"
dsk_spa.32.f:0 "「不干涉政策就是用丝绸手套遮掩的血手」——共和军外长阿尔瓦雷斯·德尔·瓦约"  
dsk_spa.32.a:0 "«建立比利牛斯走私通道»"
dsk_spa.32.b:0 "这是赤裸裸的对我国内政的干涉！"


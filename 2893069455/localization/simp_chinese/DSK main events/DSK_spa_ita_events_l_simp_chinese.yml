dsk_spa.28.t:0 "[concept_international_brigades]支援"
dsk_spa.28.d:0 "来自35国的志愿者穿越比利牛斯山抵达巴塞罗那，巴黎大学生带着《资本论》，柏林流亡者携着防空警报记忆，甚至包括参加过埃塞俄比亚抗战的黑人战士。他们用十种语言高唱《国际歌》，在阿尔巴塞特建立起「欧洲反法西斯大学」"
dsk_spa.28.f:0 "「我们不是来观光，而是来改写历史」——国际纵队第11旅宣言"
dsk_spa.28.a:0 "«将国际旅部署在哈拉马前线»"
dsk_spa.29.t:0 "[SCOPE.sCountry('ita_scope').GetName]支援国民军"
dsk_spa.29.d:0 "墨索里尼的CTV军团带着菲亚特L3坦克登陆马拉加，黑衫军军官在塞维利亚斗牛场训练长枪党民兵。意大利飞行员驾驶SM.79轰炸机对瓦伦西亚实施「人道主义空袭」，每枚炸弹都刻着「来自罗马的祝福」"
dsk_spa.29.f:0 "「西班牙是法西斯主义的练兵场」——加莱亚佐·齐亚诺日记"
dsk_spa.29.a:0 "该死"


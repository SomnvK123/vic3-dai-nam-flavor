je_spanish_second_empire:0 "第二共和国的抉择"
je_spanish_second_empire_reason:0 "#bold 西班牙第二共和国#!是1931年建立的#yellow 民主政体#!，但正深陷#yellow 曼努埃尔·阿萨尼亚#!领导的#variable 共和派#!与#yellow 弗朗西斯科·佛朗哥#!将军支持的#variable 国民派#!的全面对抗。\n\n#variable 共和派#!以#bold 土地改革#!和#bold 工人权利#!为纲领，获得#v $SOV$#!的军事援助。\n#variable 国民派#!则联合#v $ig_landowners$#!和#v $卡利斯塔$#!保皇党，得到#v $GER$#!的空中支援。\n\n双方在#bold 政教关系#!和#bold 区域自治#!上的根本对立，已导致#variable 国家分裂#!——马德里的每项政令都遭到#v 国民军#!的公开抵制。\n#bold 国际纵队的到来加剧了危机，若不能尽快结束这场[concept_civil_war]，伊比利亚将沦为[concept_civil_war]的战场#!


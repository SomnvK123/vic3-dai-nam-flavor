je_italia_annex_east_africa:0 "第一次意大利埃塞俄比亚战争"
je_italia_annex_east_africa_reason:0 "[SCOPE.sCountry('eth_scope').GetName]是非洲唯一未被殖民的独立国家，我们认为其是一个可供自己扩张的目标。我们希望通过占领埃塞俄比亚，控制红海沿岸的战略要地，以进一步扩大其在地中海和非洲东部的地缘政治影响力，同时打通从地中海到印度洋的贸易路线。"
je_italia_annex_east_africa_goal:0 "我们已经稳固在东非的利益"
je_italia_turkey_war:0 "意土战争"
je_italia_turkey_war_reason:0 "[SCOPE.sCountry('tur_scope').GetName]就如日薄西山的老人一样，我们只需要轻轻踹上一脚，它就会轰然倒塌。\n\n1911年10月，#yellow 的黎波里塔尼亚#!的沙丘上，意大利飞行员驾驶#bold Curtiss推进式飞机#!向土耳其阵地投掷#yellow 奇维塔韦基亚#!兵工厂特制的4公斤手榴弹——这是人类历史上首次空袭作战。\n\n当#yellow 班加西#!的阿拉伯部落民看着三色旗在清真寺尖塔升起时，柏林大使馆截获的电报显示：『德皇认为土耳其是#bold 用古兰经纸糊的巨人#!，只需撒丁的军靴就能踢碎』。我们的海军将领在#yellow 罗德岛#!海域演练新战术：用#bold 无畏舰主炮#!轰击[SCOPE.sCountry('tur_scope').GetName]的尊严。""

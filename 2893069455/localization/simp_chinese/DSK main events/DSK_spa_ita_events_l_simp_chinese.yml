# 东非殖民事件链
je_italia_east_africa_reason:0 "1885年#yellow 柏林会议#!的余烬中，[ROOT.GetCountry.GetAdjective]外交官将红海沿岸的#bold 阿萨布港#!地图铺在谈判桌上。\n\n#yellow 索马里兰#!的乳香树脂年产量达#bold 800吨#!，其战略位置可监控#yellow 曼德海峡#!——这是连接地中海的咽喉。当英国在#yellow 柏培拉#!建立煤炭站时，我们的探险队在#yellow 朱巴河#!流域发现了#bold 金矿脉#!的踪迹。\n\n沙文主义者在议会高喊：『用#bold 托斯卡纳葡萄#!换黑非洲的象牙，这是但丁也想象不到的远征！』"

# 乌查利条约事件链  
je_italia_annex_east_africa_beg_reason:0 "1889年，[SCOPE.sCountry('eth_scope').GetName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][SCOPE.sCharacter('crisis_scope_1').GetFirstName]的使者在#yellow 瓦尔瓦尔绿洲#!被我们扣押，其携带的#bold 镶金圣经#!透露了埃塞俄比亚的虚弱。\n\n条约第17条用#yellow 阿姆哈拉语#!写着『可借助意大利政府处理对外事务』——这模糊条款将让亚的斯亚贝巴成为#bold 事实上的保护国#!。我们的工兵已在#yellow 厄立特里亚#!修建#bold 12座碉堡#!，每座都配备#yellow 维特利机枪#!。\n\n米兰《晚邮报》头条：『从#bold 阿尔巴门廊#!到#bold 示巴女王宫殿#!，古罗马的鹰旗将再次飘扬！』"


dsk_ita.50.t:0 "建立出版社"
dsk_ita.50.d:0 "在热那亚圣西罗教堂的地窖里，[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]用烧炭党遗留的印刷机，将但丁的诗篇与马志尼的宣言交织印刷。每份《青年意大利》报的页脚都藏着用柠檬汁书写的密信，唯有靠近烛光才能显现[concept_redshirts]的集结坐标。"
dsk_ita.50.f:0 "宪兵队突袭了印刷厂，在铅字盘里发现沾满硫磺粉的[concept_tricolore]图样"
dsk_ita.50.a:0 "来自[concept_tricolore]的墨香"


dsk_ita.51.t:0 "阿尔卑斯山两侧的火种"
dsk_ita.51.d:0 "[SCOPE.sCountry('western_country').GetName]流亡军官将起义战术编码成弥撒曲谱，通过[ROOT.GetCountry.GetAdjective]驻维也纳使馆的管风琴师传递。匈牙利革命者科苏特则把梅特涅的镇压计划藏在托斯卡纳葡萄酒桶的夹层里，由黑手党的骡马队运过勃伦纳山口。"
dsk_ita.51.f:0 "奥地利密探截获了伪装成歌剧乐谱的武器图纸"
dsk_ita.51.a:0 "用《茶花女》的五线谱跨国革命通信"


dsk_ita.52.t:0 "但丁匕首上的国语"  
dsk_ita.52.d:0 "[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]的语言学家将《神曲》改编为识字课本，在[SCOPE.sCountry('western_country').GetName]贫民窟用匕首尖端雕刻托斯卡纳语字母。任何说出西西里方言的儿童都会被罚背诵加里波第的檄文——用[concept_tricolore]绸缎包裹的教鞭正重塑着半岛的舌头"
dsk_ita.52.f:0 "巴勒莫爆发方言暴动，焚毁托斯卡纳语词典"
dsk_ita.52.a:0 "在[SCOPE.sCountry('western_country').GetName]推广托斯卡纳意大利语"


dsk_ita.53.t:0 "柑橘与来复枪的海路"  
dsk_ita.53.d:0 "[SCOPE.sCountry('western_country').GetName]的'圣约翰号'货船装载着撒丁岛小麦启航，底舱200支恩菲尔德步枪的枪管里塞满柑橘防止锈蚀。巴勒莫的'荣誉男人'在柠檬箱夹层运输黄金，每枚金币都刻着[concept_redshirts]的鹰徽。"
dsk_ita.53.f:0 "奥地利海军在墨西拿海峡截获藏有武器的酒桶"  
dsk_ita.53.a:0 "组织地中海贸易网络"
spend_ship_modifier:0 "组织地中海贸易网络"


# 土匪战争（1861-1870南方叛乱）
dsk_ita.40.t:0 "土匪战争"
dsk_ita.40.d:0 "当#yellow 加里波第#!的红衫军还在庆祝统一时，#v 卡拉布里亚#!的农民用猎枪和镰刀撕毁了地契。\n\n#red 波旁王朝#!的余党通过马耳他银行送来英国造恩菲尔德步枪，[concept_mafia]的『#bold 荣誉男人#!』在月黑之夜将子弹和圣经一起分发给暴动者。\n\n撒丁王国的军队用#yellow 焦土政策#!回应——焚毁的橄榄园里，焦黑的柑橘树上钉着被绞死的#v 土匪王#!头颅，乌鸦啄食着刻有[concept_tricolore]的木制假眼。"
dsk_ita.40.f:0 "来自#red 西西里#!旧王室的间谍成功策反了暴动领袖\n罗马教会宣布土匪为#bold 『殉道者』#!"
dsk_ita.40.a:0 "派遣#yellow 阿尔卑斯山地旅#!"

# 意大利黑手党
dsk_ita.41.t:0 "柑橘箱里的帝国"
dsk_ita.41.d:0 "在#v 巴勒莫#!港的咸腥海风中，[concept_mafia]的『#yellow Boss#!』们用柠檬汁书写密令。\n\n每个装满血橙的木箱夹层都藏着：#red 科西嘉#!走私的雷管、#yellow 英国#!银行的黄金汇票、刻满伪证印章的#bold 地契#!。\n\n当[ROOT.GetCountry.GetAdjective]税吏试图开箱检查时，『#bold 荣誉男人#!』会微笑着递上浸透柑橘汁的匕首——刀柄镶嵌的圣母像眼睛，是用告密者的牙齿打磨而成。"
dsk_ita.41.f:0 "#red 英国海关#!查获藏有炸药的柑橘船\n#yellow 唐·维托#!被引渡至纽约"
dsk_ita.41.a:0 "默许[concept_mafia]控制地方税收"

fruit_modifier:0 "柑橘贸易"


# 圣杯兄弟会（1860年代南方教士抵抗组织）
dsk_ita.42.t:0 "圣杯兄弟会"
dsk_ita.42.d:0 "在#v 巴勒莫#!的地下墓穴里，[concept_mafia]的『#yellow Boss#!』与#red 耶稣会#!修士共饮混入圣血的葡萄酒。\n\n他们用#bold 被褫夺圣职#!主教的肋骨制成十字架，将[ROOT.GetCountry.GetAdjective]税吏的名字刻在#yellow 锡拉库萨银币#!背面，投入埃特纳火山的硫磺喷孔。\n\n当#v 卡拉布里亚#!农民在告解时说出『#bold 统一#!』一词，神父会递上浸透#red 颠茄毒液#!的圣饼——祭坛下的密道直通藏着[concept_redshirts]残破军旗的墓室。"
dsk_ita.42.f:0 "#yellow 庇护九世#!发布《#bold 至可怖#!》通谕\n将兄弟会斥为#red 『撒旦的倒十字』#!"
dsk_ita.42.a:0 "马上追拿归案"
dsk_ita.42.b:0 "不足挂齿"
# 焦土政策（1861-1870南方平叛）
dsk_ita.43.t:0 "灰烬中的三色旗"
dsk_ita.43.d:0 "#yellow 拉马尔莫拉#!将军的工兵连用#red 希腊火#!改良配方焚烧#v 巴西利卡塔#!的橄榄园，焦黑的柑橘树上钉着#yellow 土匪王#!的颅骨——眼眶里塞着刻有[concept_tricolore]纹章的铅弹。\n\n#v 那不勒斯#!湾的渔村被强制迁移，母亲们被迫将#bold 新生儿#!浸入混入石灰的水井——这是预防『#red 土匪基因#!』传播的『#bold 科学防疫#!』。\n\n英国《泰晤士报》记者写道：『每平方英里焦土能生产#yellow 3吨骨灰肥#!，撒丁王国正用它滋养[concept_unification]的幼苗。』"
dsk_ita.43.f:0 "#v 日内瓦#!召开国际红十字会紧急会议谴责『#red 阿尔卑斯野蛮主义#!』"
dsk_ita.43.a:0 "将这些叛军全部杀光！"
dsk_ita.43.b:0 "应当优先保障老弱妇孺"


conquer_modifier:0 "焦土政策"


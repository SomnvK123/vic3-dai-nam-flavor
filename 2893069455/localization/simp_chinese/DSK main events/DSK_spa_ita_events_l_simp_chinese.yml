concept_international_brigades:0 "国际纵队"
concept_international_brigades_desc:0 "国际纵队，是指1936-1939年西班牙内战时期，各国工人阶级和进步人士为协助西班牙共和政府，反击德、意干涉军和西班牙叛军而组织的志愿军。"

je_spa_union:0 "终结内战" 
je_spa_union_tt:0 "粉碎叛党，恢复秩序！" 
je_spa_union_reason:0 "1936年7月18日，君主派、大地主、高级僧侣、长枪党徒等反动势力在法西斯支持下，发动阴谋颠覆共和政府的武装叛乱。1936年7月30日叛军在布尔戈斯成立政府，[SCOPE.sCharacter('crisis_scope_1').GetFirstName]被推举为“国家元首”和叛军最高统帅，内战开始。1936年9月至1937年3月，佛朗哥叛军和德、意法西斯干涉军一起，先后向共和国首都马德里发动4次大规模进攻。在后方，还有隐藏的间谍、叛徒等内奸活动。1936年10月，叛军将领摩拉扬言：有4个纵队正在进攻，另有一个“第五纵队”在马德里等待。西班牙共和国军队、广大劳动群众在国际纵队支援下，英勇投入马德里保卫战。" 

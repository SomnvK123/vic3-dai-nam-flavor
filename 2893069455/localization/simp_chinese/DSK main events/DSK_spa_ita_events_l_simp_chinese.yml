dsk_spa.33.d:0 "[SCOPE.sCountry('western_country').GetName]银行接收西班牙黄金储备，葡萄牙开放里斯本港转运意大利军火，德州石油公司用标准油轮为佛朗哥供油。华尔街银行家购买国民军债券，罗马教廷宣布「[concept_crusade]免税」"
dsk_spa.33.f:0 "「做生意不必区分子弹的意识形态」——英国外交大臣哈利法克斯"
dsk_spa.33.a:0 "与[SCOPE.sCountry('western_country').GetName]秘密«签署协议»"
dsk_spa.33.b:0 "这是赤裸裸的对我国内政的干涉！"


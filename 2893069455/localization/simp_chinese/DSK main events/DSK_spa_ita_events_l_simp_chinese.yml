dsk_spa.27.t:0 "西班牙内战"
dsk_spa.27.d:0 "1936年，#v 梅利利亚驻军#!的叛变枪声揭开#bold [concept_civil_war]#!序幕。#yellow 佛朗哥#!通过#v 德意志电台#!宣称：「我们将拯救西班牙于#v [concept_atheists]#!之手」，而#yellow 长枪党#!在#v 马德里#!回应:#v 人民阵线#!永不屈服\n摆在我们面前的有几条路\n• 死守#v 马德里要塞#!等待#v [concept_soviet_union]#!\n• 放弃#v [concept_basque_country]#!以保全#v [concept_andalusia]#!农业区\n• 发动#v [concept_guerrilla_warfare]#!拖垮国民军"

dsk_spa.27.f:0 "驻摩洛哥和加那利群岛的西班牙殖民军在#yellow 佛朗哥#!、#yellow 埃米利奥·莫拉#!等将领策动下发动叛乱。叛乱迅速蔓延到本土加的斯、塞维利亚、萨拉戈萨、布尔戈斯等大中城市。陆军和空军的大部分部队以及摩洛哥人组成的"外籍军团"参加了叛乱"

dsk_spa.27.a:0 "人民必将胜利！宁可站着死，绝不跪着生"


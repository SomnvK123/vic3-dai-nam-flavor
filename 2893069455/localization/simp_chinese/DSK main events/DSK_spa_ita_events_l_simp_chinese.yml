dsk_ita.63.t:0 "我们的海"
dsk_ita.63.d:0 "元老院与罗马人民"
dsk_ita.63.f:0 "维苏威之巅，地火熔金，硫华凝而为鹫徽，天工铸鼎，以彰军团之魂。卡拉拉之石，混火山之灰，再起朱庇特神庙。柱藏阿比西尼亚铜炮，其铭曰：“弹丸所至，皆我鹰旗之影。”\n\n普利亚沃野，锄犁之下，图拉真古道重光。以古玄武为基，铺菲亚特之衢，嵌十字军所掠拜占庭琉璃。墨氏令曰：“凡新途，必以古瓷饰之，使轮蹄皆踏史尘。”\n\n塔兰托军港，投石机焕新姿，抛火弹如流星。水师录曰：“今以维吉尔诗韵，重定地中海之疆。”昔奥古斯都之海，今复闻划桨之声。\n\n西西里谷仓，撒丁铜山，科西嘉戍台，缺一则国脉断。纳尔榜之高卢，塔拉科之伊比，雅典学宫，尼西亚圣所，弗取则大统亏。亚历山大港之灯塔不燃，则埃及之粮绝。\n\n嗟乎！三洲之辐辏，五海之要冲，非铁血不可聚。考古铲与机枪共舞，大理石共血水凝碑。元老院之名虽复，实为军靴踏古砖之回响。台伯河浊浪滔天，载帝国残梦与新尸俱下，奔涌向第勒尼安之狂涛。"
dsk_ita.63.a:0 "荣耀属于全体[ROOT.GetCountry.GetAdjective]人民"


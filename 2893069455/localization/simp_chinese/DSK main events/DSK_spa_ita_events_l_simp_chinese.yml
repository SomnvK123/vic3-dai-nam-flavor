je_two_italia:0 "割裂的意大利"
je_two_italia_reason:0 "当#yellow 都灵#!的银行家计算铁路债券收益时，#red 卡拉布里亚#!的农民正用猎枪抵着税吏的太阳穴——这是#bold 1861年意大利统一#!后最尖锐的讽刺画。\n\n南方山区游荡着#bold 3.2万#!名『土匪』，他们中既有前波旁王朝士兵，也有被#yellow 皮埃蒙特土地法#!夺走份地的农民。英国《泰晤士报》记者记载：『每公里铁路延伸就伴随着#bold 17起武装袭击#!，加里波第的红衫在这里褪色成褴褛的破布。』\n\n北方议员在议会咆哮：『这些南方人连#bold 托斯卡纳意大利语#!都不会说，算什么同胞！』而#yellow 卡莫拉#!黑帮正用缴获的#bold M1841击发枪#!，在烧焦的橄榄园重新划定势力范围。"

dsk_ita.54.t:0 "[concept_mafia]的报复"

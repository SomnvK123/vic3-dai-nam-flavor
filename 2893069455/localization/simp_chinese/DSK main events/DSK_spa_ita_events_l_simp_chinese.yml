je_italia_annex_east_africa_over:0 "埃塞俄比亚与意大利友好条约"
je_italia_annex_east_africa_over_reason:0 "条约的主要内容有：[ROOT.GetCountry.GetAdjective]再次承认#v 孟尼利克二世#!为[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]，#v 孟尼利克二世#!承认意大利对实际边界为基础的红海殖民地拥有主权；意大利银行向埃塞俄比亚提供400万里拉的贷款，以哈拉尔的关税作为抵押。10月11日，意大利外交大臣F.克里斯皮宣布，根据意大利和埃塞俄比亚永久性条约：埃塞俄比亚[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]处理其同他国的一切事务都需通过意大利。[ROOT.GetCountry.GetAdjective]对条约的解释被欧洲国家认可。"
je_italia_annex_east_africa_over_goal:0 "等待时局进一步变化"


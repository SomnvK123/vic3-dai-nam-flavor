je_fascist_italy:0 "意大利法西斯主义"
je_fascist_italy_reason:0 "卡波雷托的耻辱必须用火焰洗净！那些在议会里喋喋不休的蛀虫，把[ROOT.GetCountry.GetAdjective]变成了欧洲的笑柄！现在，新罗马军团将用这三把利剑——服从！秩序！征服！——斩断民主的软弱枷锁！从今天起，每个意大利人都将成为活着的武器！母亲们要把摇篮变成弹药箱，少年们要用拉丁语课本练习刺杀术！要么让整个世界在法西斯铁蹄下颤抖——要么就让亚平宁半岛沉入地中海！领袖万岁！意大利万岁！"


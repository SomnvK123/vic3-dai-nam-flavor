je_shintoism_development:0 "神道教"
je_shintoism_development_reason:0 "朕惟：神道教者，我邦之根本也。自神祖开创，皇统绵延，此道实乃维系万邦之纲纪，贯通天人之枢纽。\n\n往昔神佛相混，礼失其真。朕承天受命，当复神教之本：神社专司祭祀，以敬天神、崇祖灵；兆民咸沐神恩，以明忠孝、固邦基。盖神道教非他，乃我#yellow 大和#!民族之所以立，[concept_jap_empire]之所以昌也。今整饬祀典，厘定神职，使神道教复归纯正，上以承神祖之遗训，下以统万民之心志。庶几神佑[concept_jap_empire]，永固无穷之基。\n$TOOLTIP_DELIMITER$\n这个[concept_journal_entry]将在以下#tooltippable;tooltip:[Country.GetTooltipTag],dsk_je_shintoism_development_advanced #o 条件#!#!增长，并在#v 进度条大于150#!和特定条件下触发以下带有更强效果的#tooltippable;tooltip:[Country.GetTooltipTag],dsk_je_shintoism_development_advance #o 历史事件#!#!"

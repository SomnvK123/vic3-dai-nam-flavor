je_japan_invade_china_reason:0 "吾邦军部之势，日盛一日，统制诸派渐掌中枢权柄，威加海内。\n\n皇道精神昭昭，与拓土开疆之志相融相济，国中士民，莫不振奋。军国之潮，如怒涛澎湃，席卷列岛；对外征伐之心，似烈火燎原，日炽一日。盖因时运际会，天授我邦以经略亚细亚之任，故我[SCOPE.GetRootScope.GetCountry.GetName]，应势而起，雄视东方，将以铁与火，布皇恩于万邦，立霸权于当世。​\n#yellow 法西斯日本的崛起#!具有以下#v #tooltippable;tooltip:[Country.GetTooltipTag],je_japan_invade_china_pos 历史事件#!#!，其势或影响国政走向，不可不察也。"

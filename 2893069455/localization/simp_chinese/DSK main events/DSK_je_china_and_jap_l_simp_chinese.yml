je_jap_empire:0 "帝国国会"
je_jap_empire_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]宪法既定，帝国议会应时而立。其权分设立法、财政、一般国务及议会内务数端，然审议之权，皆受[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]主权、[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]大权与皇室自律权所囿，不得逾越。盖[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]至尊，威柄在握，议会行事，莫敢不从其纲纪。\n​然则，议会之内，纷争亦在所难免。诸派议员，或执保守之见，固守传统；或怀革新之志，欲图更张，议事之间，唇枪舌剑，各不相让，时有僵局之态。​\n#yellow 帝国国会#!当于特定之际，触发如下#v #tooltippable;tooltip:[Country.GetTooltipTag],je_jap_pos 历史事件#!#!，其势或影响国政走向，不可不察也。"

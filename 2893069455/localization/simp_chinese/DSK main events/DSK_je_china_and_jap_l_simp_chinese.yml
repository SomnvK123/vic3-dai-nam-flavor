je_dsk_jap_kamikaze: "[ROOT.GetCountry.GetAdjectiveNoFlag]国策"
je_dsk_jap_kamikaze_reason: "1.#v 1836至1853闭关锁国期#!该事件因为自动和中国有停战协议，且#yellow 闭关锁国#!该日志存在期间会大幅度增加恶名，所以只做一些基础的改革，如可以先把#yellow 独裁#!改掉，#yellow 自由贸易#!可以不用改，因为改了就不会触发黑船事件，黑船事件会带来地主的势力减少。\n\n2.#v 1853至1870内战倒幕期#!开国会带来#yellow 尊王攘夷#!，只需要推动日志往倒幕的方向发展，日志的结局都是推动大政奉还，不需要担心选错事件选项，如果能和其他列强搞好关系就搞好，搞不好就别惹俄罗斯，不要吃#yellow 库页岛#!，吃了俄罗斯就会来找你要，不给就会增加征服倾向。#yellow 士族矛盾#!是解锁#yellow 征韩论#!的前提日志，无论是西南战争还是士族的效忠完成后都能触发#yellow 征韩论#!，当你触发征韩论和完成御一新后就进入下一个阶段。\n\n3.#v 1870至1894旭日之争期#!天皇上来后，先完成改革，有改革则改，建造几个舰队留着触发江华条约，触发后，每两年都是让朝鲜半岛推动下一个阶段，然后开始扩军备战，等到三个阶段完全触发，#yellow 甲申政变#!后，就可以直接打#yellow 甲午战争#!，所以前期不要吃台湾，否则影响该剧情发展，打完甲午就是触发旭日之争胜利，因此#yellow 侵华论#!产生。\n\n4.#v 1894至1910列强称霸期#!有了#yellow 朝鲜事务#!的日志后可以立刻打俄罗斯，打赢后朝鲜的日志会立刻完成，直接吞并，变成列强，#yellow 帝国国会#!触发后优先改国号，会有个#yellow 大日本帝国#!的任务，完成后就可以触发大东亚共荣圈，然后送一个#yellow 法西斯之路#!，等待#yellow 法西斯之路#!完成\n\n5.#v 1910至1936侵华战争期#!有了#yellow 中国事务#!后，在战争期间有概率触发#yellow 太平洋战争#!，该日志可以给大量宣称和200博弈点数，同时所有在华南华北有利益的国家会得到一个#yellow 伟大的抗日战争#!，该日志会带来多个战争事件，如果中国把进度条填满就会导致战败投降，每个事件会增加双方的战争支持度，若进度条低于#v 1000#!，则直接触发#yellow 太平洋战争#!事件。该日志下方还有第二个进度条显示#yellow 世界反法西斯#!的进度，如果进度满足十点，就会导致所有在华北有利益的国家向日本宣战。大屠杀的事件会导致军国主义者或法西斯主义者挂战犯buff，共有甲乙丙三级，从丙级开始叠加。触发#yellow 日本投降#!或#yellow 吞并中国#!意味着所有日志线就完成了。同盟国有后续剧情可以触发#yellow 东京审判#!\n\n无共和或委员会特殊日志。"

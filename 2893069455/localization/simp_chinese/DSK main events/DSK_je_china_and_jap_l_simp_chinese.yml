 kamikaze: "神风"
 kamikaze_desc: "摧毁蒙古人的神风，将要成为日本精神的象征。"
 kamikaze_back: "神风再临"
 kamikaze_back_desc: "日本已经崛起，神风再临东亚。"
 inheritance_kamikaze_2: "神风再临" 
 inheritance_kamikaze_2_desc: "神风已在[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]的指引之下再临日本，日本已经崛起，神风再临东亚，为抗击欧洲殖民者，我们有必要领导东亚团结一致，哪怕诉诸武力."
 inheritance_kamikaze_modifiers_1: "重铸神风精神"
 inheritance_kamikaze_modifiers_2: "神风再临"
 kamikaze_t: "神风再临，[concept_east_asia_empire]"
 kamikaze_d: "神风再临，[concept_east_asia_empire]"
 kamikaze_f: "[SCOPE.GetRootScope.GetCountry.GetName]在伟大的[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]的领导下已经崛起，神风精神的重铸使得帝国得以迅速富强，可欧洲殖民者仍然觊觎亚洲殖民地，作为亚洲第一个摆脱欧洲殖民者桎梏的国家，日本有必要领导东亚团结一致，而现阶段摆在眼前的最大问题无疑是整个亚洲最为糜烂的政权——中国，在此前夺取朝鲜以及台湾的战争之中，中国军队的腐朽与不堪一击已经揭露给了全世界，而东南亚与大洋洲的资源又至关重要，刚崛起的帝国也需要时间处理各种内政外交事务。\n\n在此时我们必须做出抉择，为了整个东亚的联合，我们或许必须诉诸武力，为了帝国的长久发展，巩固帝国基石也未尝不是一个可行之路."
 KAMIKAZE_CHI: "[SCOPE.GetRootScope.GetCountry.GetName]陆军将征服中国解除隐患，这将会是建立[concept_east_asia_empire]的第一步"
 KAMIKAZE_SASIA: "[SCOPE.GetRootScope.GetCountry.GetName]海军将夺取南洋，无尽的资源将为[concept_east_asia_empire]提供充足的动力"

je_annex_amercia_tt:0 "八纮一宇，布武天下" 
je_annex_amercia_reason:0 "米英鬼畜，不过尔尔。以此[concept_shenzhou]之雄威征彼蠢尔蛮夷，混同世界，统一万国，何难之有哉！\n皇大御国乃天地间最初成立之国，为世界万国之根本，故若能经纬其根本，则全世界悉为其郡县，万国君长，皆为臣仆。\n由天皇渡海亲征，先锋直扑,先灭中国，再吞米英，太平海乃我神国之内海。" 

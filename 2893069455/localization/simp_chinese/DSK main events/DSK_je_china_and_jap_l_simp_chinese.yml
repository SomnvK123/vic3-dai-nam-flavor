 IJdcr_eve.1.t: "异族臣服"
 IJdcr_eve.1.d: "异族向天皇宣誓效忠"
 IJdcr_eve.1.f: "这篇新征服土地上的民族已经宣誓向天皇效忠，他们已经完全成为了大日本帝国的一部分，[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]决定赐予他们民族新的称谓以彰显皇恩浩荡。"
 IJdcr_eve.1.a: "大日本帝国的土地和人民都臣服于天皇！"

 IJdcr_eve.2.t: "占领皇居"
 IJdcr_eve.2.d: "帝国大学生占领皇居"
 IJdcr_eve.2.f: "由十几名东京帝国大学学生发起，近千名关东地区各大学学生参与并在东京皇居附近举行了大型示威运动，学生表达了对帝国民族融合政策的严重不满与抗议，其中部分激进分子提议占领皇居、要求与[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]直接对话并得到了一部分学生的认可，其恶劣行径严重危害了[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]的人身安全以及帝国政府的威信力。\n经帝国陆军总司令授意，东京宣布戒严并决定以军队武力解决示威问题，并将示威学生宣传为受到外国反大和势力的渗透，当日帝国陆军进入东京并动用实弹驱逐了大部分示威学生，此次事件最终造成数十名军人和数百名平民死亡，上千名学生被逮捕。"
 IJdcr_eve.2.a: "帝国军人从反维新分子手中夺回了帝国的稳定"
 IJdcr_eve.2.b: "做出口头让步也许可以防止下一次事件的发生"

 IJdcr_eve.3.t: "总督去世"
 IJdcr_eve.3.d: "负责管理帝国新土地的前任总督因病去世"
 IJdcr_eve.3.f: "上一任总督因癌症不治去世，许多当地群众自发悼念，其任职期间取消了其上一代总督的高压政策转而采用了宽纵的法律，不仅减弱了许多当地民族的抵抗还让不少当地群众转而拥护，但是也让各个殖民地依旧保持着文化独立，而且当地的群众似乎也只是对这位总督略有好感，对帝国仍然抱有敌意。这位总督的政策显然和帝国的民族融合政策是相悖的，某种意义上还是一种威胁。"
 IJdcr_eve.3.a: "阻碍帝国民族政策的家伙终于消失了"
 IJdcr_eve.3.b: "延续他的政策有助于安抚当地群众"

 IJdcr_eve.4.t: "公园游行"
 IJdcr_eve.4.d: "东京上野公园爆发了未经许可的群众游行"
 IJdcr_eve.4.f: "大批群众聚集在上野公园以悼念前任总督的去世，而其中大多为[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName]民族，是前任总督的拥护者。\n但不久他们就转而表达对帝国和天皇的不满情绪，悼念活动也转变为群众游行并造成了附近地区的拥堵，因此帝国警察对其进行了清场并逮捕了部分坚持悼念的群众。"
 IJdcr_eve.4.a: "他们是伪装成悼念的反维新运动，我们要清查幕后黑手"
 IJdcr_eve.4.b: "看来我们新政策的施行阻力不小"

 IJdcr_eve.5.t: "端正历史"
 IJdcr_eve.5.d: "向住民传授正确的历史"
 IJdcr_eve.5.f: "[SCOPE.sState('IJdcr_state_scope').GetName][SCOPE.sBuilding('IJdcr_state_scope').GetName]和帝国大学的历史研究小组联合发表了多篇历史研究文献，文献表明，无论从历史、法律还是实际管辖方面看[ROOT.GetCountry.GetName]都享有对[SCOPE.sState('IJdcr_state_scope').GetName]的绝对主权。"
 IJdcr_eve.5.a: "[SCOPE.sState('IJdcr_state_scope').GetName]是[ROOT.GetCountry.GetName]自古以来的固有领土，神圣不可分割！"
 IJdcr_eve.5.b: "我们应该等到这代住民死后再宣扬这一论点"

 IJdcr_eve.6.t: "异族表示抗议"
 IJdcr_eve.6.d: "异族对我们的研究结果表示抗议"
 IJdcr_eve.6.f: "在我们发表帝国大学的历史研究文献后，[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName]民族的人民对当地政府发表了激烈抗议！部分人由攻击学校转向攻击[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]，因此当地警察逮捕了部分为首的激进分子。"
 IJdcr_eve.6.a: "这些都是历史虚无主义分子，[ROOT.GetCountry.GetName]的研究成果不可被证伪，堵住他们的嘴！"
 IJdcr_eve.6.b: "他们似乎理解不了历史的必然性"

 IJdcr_eve.7.t: "语言教育"
 IJdcr_eve.7.d: "异族的语言教育是否应该保留成为了新话题"
 IJdcr_eve.7.f: "是否应该保留[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName]的语言教育在帝国大学内成为了一个新话题，少部分学者认为保留这些语言可以文化的多元性，而绝大部分学者认为只有统一官方语言为日语才能促进各民族的融合。"
 IJdcr_eve.7.a: "这些民族和大和民族同根同源同文同种，加强国家通用语言文字教育是地区民族更好融入帝国的客观需要！"
 IJdcr_eve.7.b: "或许我们没有权力去否认和消灭其他民族语言和文化"

 IJdcr_eve.8.t: "工厂罢工"
 IJdcr_eve.8.d: "[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName]工人爆发罢工"
 IJdcr_eve.8.f: "[SCOPE.sState('IJdcr_state_scope').GetName]工厂的[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName]工人爆发了罢工，他们期望获得和其他人一样的工薪待遇。"
 IJdcr_eve.8.a: "如果你们愿意融入[ROOT.GetCountry.GetName]的话，我们一定会平等的对待你们"
 IJdcr_eve.8.b: "我们会考虑尊重[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName]的工人，只希望你们能尽快恢复生产"

 IJdcr_eve.9.t: "移民潮"
 IJdcr_eve.9.d: "大和民族中掀起了一股移民潮"
 IJdcr_eve.9.f: "帝国人民逐渐把[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName] 文化视为了我们文化的一部分，近期不少人选择移民，但是当地人民似乎对这些友好的帝国百姓抱有敌意。"
 IJdcr_eve.9.a: "让不友好的原住民闭嘴，任何出格行为都将严惩！"
 IJdcr_eve.9.b: "安抚原住民的情绪才更有利于让他们融入新国家"

 IJdcr_eve.10.t: "混血儿"
 IJdcr_eve.10.d: "混血儿第一次成为了[ROOT.GetCountry.GetName] 的社会性问题"
 IJdcr_eve.10.f: "大和民族和 [SCOPE.sCulture('IJdcr_pop_scope.culture').GetName]文化的融合过程中也诞生了许多混血儿，即使他们体内流有一半的大和血液，也招致了来自双方民族的歧视。"
 IJdcr_eve.10.a: "他们未来都是帝国的子民，怎么能容许受到歧视！"
 IJdcr_eve.10.b: "也许应该稍微顾及大众的感受？"

 IJdcr_eve.11.t: "流血冲突"
 IJdcr_eve.11.d: "文化碰撞演变为流血冲突"
 IJdcr_eve.11.f: "[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName]和大和民族之间的文化冲突越来越激烈，部分地区已经频繁爆发具有伤亡的冲突事件，军队领袖自荐去领导镇压行动并保证不辱使命。"
 IJdcr_eve.11.a: "宁可设置隔离带，对人民发动军队镇压的国家迟早会被人民推翻！"
 IJdcr_eve.11.b: "他们越过了那条红线，帝国军队应该出动！"

 IJdcr_eve.12.t: "娱乐活动"
 IJdcr_eve.12.d: "城镇中心的娱乐活动成为了文化交流的桥梁"
 IJdcr_eve.12.f: "[SCOPE.sCulture('IJdcr_pop_scope.culture').GetName]的住民和大和移民之间交往越发密切，城镇中心成为了每座城市文化交流的中心，不少娱乐活动都有双方文化的住民参加，有人建议帝国官方组织更多大型活动以促进民族之间的融合。"
 IJdcr_eve.12.a: "我们可以以官方的名义组织更多的活动以促进民族融合"
 IJdcr_eve.12.b: "让他们自行组织就行，官方参与不一定会起到促进作用"

 IJdcr_eve.13.t: "法案推行失败"
 IJdcr_eve.13.d: "法案推行失败"
 IJdcr_eve.13.f: "法案的推行受到了极大的阻力被迫终止，政府在帝国稳定和一意孤行之间选择了前者"
 IJdcr_eve.13.a: "法案推行失败"

 IJdcr_eve.14.t: "法案推行中止"
 IJdcr_eve.14.d: "法案推行中止"
 IJdcr_eve.14.f: "帝国政府主动停止了法案推行，可能是遇到了什么行政问题"
 IJdcr_eve.14.a: "法案推行中止"


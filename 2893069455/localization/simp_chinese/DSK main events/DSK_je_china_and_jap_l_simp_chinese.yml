concept_battle_of_east_asia: "旭日之争"
concept_battle_of_east_asia_desc: "大业三年(607)，日本的第二次遣隋使向隋帝国递交了“日出处天子致书日没处天子无恙”的国书，自此掀起了东方关于谁是“日出之地”的辩论"
je_chaoxian_jap: "[concept_battle_of_east_asia]：朝鲜事宜"
je_chaoxian_jap_reason: "[SCOPE.sCountry('kor_scope').GetName]离我们太近了，但是他们显然被原[concept_overlord][SCOPE.sCountry('chi_scope').GetName]保护的太好。\n[SCOPE.GetRootScope.GetCountry.GetName]若要追求更广袤的生存空间，必定绕不开[SCOPE.sCountry('kor_scope').GetName]这个跳板。我们可以强迫其废止与中国的宗藩关系，使其彻底脱离原[concept_overlord]的影响，然后再趁机进行渗透和干涉。\n与其同时，我们可以夺取台湾，对其东海形成日本-朝鲜-台湾包夹之势。\n明朝万历年间我们已经失败过一次，这一次乃[SCOPE.sCountry('chi_scope').GetName]内外交困之际，千年历史中再也没有什么比今天有更好的机会了！"

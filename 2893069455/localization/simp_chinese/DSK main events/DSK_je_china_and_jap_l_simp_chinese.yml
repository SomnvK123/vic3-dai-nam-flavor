je_wuchen_war:0 "终结内战"
je_wuchen_war_reason:0 "窃以天下者，[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]之天下也；兆民者，[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]之兆民也。自德川氏窃据大位，三百年于兹，上则壅蔽圣听，下则鱼肉苍生，外则辱国丧权，内则毒流四海，罪迹昭彰，罄竹难书。今朕奉天承运，举义兵以清君侧，布大义于寰宇，敢昭告于外邦诸友：\n一曰僭越神器。德川氏以陪臣执国命，废[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]之权，专生杀之柄，宫殿荒芜而私邸巍峨，圣谕不行而家法遍立，此谓盗国，罪一也。\n二曰误国辱邦。黑船叩关，束手无策，私订城下之盟，割地赔款，蹙国万里，使外夷耀武于东京，列祖之灵，蒙羞地下，此谓辱国，罪二也。\n三曰虐杀忠良。安政以来，凡言尊王、议攘夷者，非囚即戮，吉田松阴之血未干，樱田门之魂犹泣，钳天下之口，绝忠义之路，此谓残贤，罪三也。\n四曰暴敛无度。苛税遍于诸藩，米价腾踊，饿殍盈路，而幕府私库充盈，歌舞不休，民怨彻天，盗匪蜂起，此谓虐民，罪四也。\n五曰分裂邦土。挑唆诸藩相攻，长州、萨摩之兵戈，皆由其构祸，以邻为壑，致国势如累卵，此谓祸乱，罪五也。\n六曰废弛武备。内则压制诸藩练兵，外则纵容夷狄驻兵，舰不如人，炮不如人，而犹自诩 “武家栋梁”，此谓误军，罪六也。\n七曰矫诏欺世。假[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]之名行私意，凡与外夷签约、屠戮志士，皆托 “圣断”，使天下误认[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]昏聩，此谓欺天，罪七也。\n\n夫七罪之中，任一可诛，况兼而有之！今朕已下#o 《王政复古大号令》#!，收还政权，复我纪纲。萨摩、长州诸藩忠义之士，已举义旗，西指江户，誓诛元恶，以清妖氛。\n\n朕闻外邦皆尚公理，重信义。德川氏之与诸邦所订盟约，多非[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]本意，皆其私约也。待乱平之后，朕将择贤与诸邦重议邦交，凡属平等互利者，必当恪守；若有违我主权、辱我国体者，一概更张。\n\n#v 顺天者昌，逆天者亡。德川氏之亡，可立而待。愿诸邦共观厥成，待我中兴，再修旧好，共享太平。#!"
concept_shenzhou:0 "神州"
concept_shenzhou_desc:0 "中国方：“[concept_shenzhou]”一词是中国古代对中原地区的称呼，蕴含着“神圣之地”“中心之国”的文化意涵。\n日本方：在平安时代（794到1185年）以后，随着日本本土文化意识的逐渐增强，部分文人、学者开始借鉴中国的 “[concept_shenzhou]” 概念，将日本称为 “[concept_shenzhou]”，以此强调日本作为“神国”。"

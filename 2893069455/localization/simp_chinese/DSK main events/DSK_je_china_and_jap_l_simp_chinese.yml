je_protect_china:0 "伟大的抗日战争"
je_protect_china_reason:0 "[concept_shenzhou]陆沉，倭寇犯境，烽烟四起，日月无光。自辽沈至淞沪，千里沃野尽成焦土；从市井到乡野，亿兆生民沦于涂炭。然中华儿女，骨血中自有刚毅，危难时更显赤诚。\n\n田间农夫，辍耕荷锄而起，虽无甲胄，亦以血肉当锋刃；市井商贾，倾囊散财相助，纵家徒四壁，仍将余粮济三军。三尺童子，诵“还我河山”；白发老妪，缝衣送寒枪。匹夫有责，岂独军人之事？\n\n观夫前线将士，雪夜卧冰，霜晨饮露，枪林弹雨中，未尝退半步。一封家书写尽离情，却道#v “国若不存，何以为家”#!；数行血字寄与亲人，只言#v “待驱胡虏，再扫坟茔”#!。其志如磐石，其情似烈火。\n\n天道循环，邪不胜正。纵敌焰嚣张于一时，终有烟消云散之日。愿我同胞，抱必死之心，行救国之举，待河山光复，告慰忠魂，再话升平。\n\n#red 只要我等能本此决心，则我们国家及我五千年历史之民族，决不至亡于区区三岛倭奴之手。#!"

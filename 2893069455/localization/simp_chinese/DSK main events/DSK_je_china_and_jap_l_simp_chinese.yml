je_annex_smf_reason:0 "[ROOT.GetCountry.GetRuler.GetFirstName]十年元月，#yellow 鹿儿岛#!夜惊。军校生袭火药库，火起连城，乱事遂发。时[SCOPE.sCharacter('ruler_scope').GetFullName]方猎于大隈半岛，闻变返，见诸生就捕，知事不可解——虽非举兵之时，然旧部环请，士心沸然，遂决意起兵。\n\n[SCOPE.sCountry('smf_scope').GetAdjective]旧士应者云集，#yellow 九州#!不满之徒辐辏，众至四万余。昔日讨幕之锐旅，今成抗命之师；曾辅维新之元勋，竟为逆乱之魁。兵锋所向，直指中枢，[concept_jap_empire]新政，危在旦夕。\n\n朕闻之，深为痛惜。[SCOPE.sCharacter('ruler_scope').GetLastName]氏本为社稷功臣，奈何惑于旧习，罔顾国法？今乱兵已起，非朕所愿，然邦纪不可坠，国法不可违，唯有整军讨逆，以安兆民。"

je_respect_king_reason:0 "江户时代末期，[SCOPE.GetRootScope.GetCountry.GetName]国内的社会矛盾积累到了一定程度。各大名之间的战争频繁，导致大量人员伤亡和土地被占，进一步加剧了社会矛盾。同时，[SCOPE.gsInterestGroup('shougun_ig').GetName]对朝廷的压制也引发了民众的不满。\n西方资本主义国家的经济侵略给日本带来了严重的经济危机。\n一场反对[SCOPE.gsInterestGroup('shougun_ig').GetName]统治的危机在所难免！\n$TOOLTIP_DELIMITER$\n这个[concept_journal_entry]将在特定条件下触发以下不同的#tooltippable;tooltip:[Country.GetTooltipTag],dsk_japan_sonnou_joui_tooltip_advance #o 历史事件#!#!"

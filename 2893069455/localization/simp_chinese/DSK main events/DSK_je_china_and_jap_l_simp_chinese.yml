je_japan_korean:0 "朝鲜事务"
je_fei_fan_zhi_xian:0 "废藩置县"
je_fei_fan_zhi_xian_reason:0 "明治政府推翻了幕府统治，但各地藩国依然存在，并且拥有很大势力，这威胁着中央集权，不利于新政权的稳固和资本主义的发展。\n倒幕运动的主力军为中下级武士、高利贷商人、资本家、新兴地主和西南诸藩的大民。他们在打倒幕府后，并没有形成共同利益，但却渴望各自享受胜利果实，这进一步加剧了中央集权的必要性。\n明治政府为巩固天皇为首的新政权，需要通过废藩置县来消除地方割据，加强中央集权。这是新政改革顺利推行的首要任务。"
add_Annex_kor_complete_var_tt:0 "#yellow 朝鲜事务#!进度条立即完成!"
je_japan_korean_reason:0 "如今，[SCOPE.sCountry('kor_scope').GetName]已经彻底脱离原[concept_overlord][SCOPE.sCountry('chi_scope').GetName]的影响。[concept_jap_empire]渴望现在就处置朝鲜叛匪的命运，但是，依然有个国家对我们虎视眈眈。\n如果[concept_jap_empire]想制霸亚洲，必定免不了和[SCOPE.sCountry('rus_scope').GetName]一战。"

je_japan_china_tao:0 "[concept_battle_of_east_asia]：武士刀"
je_japan_china_tao_reason:0 "回溯千年，汉风东渐，彼邦以锻兵之术相授，我邦得之而精研，遂有武士刀之锐。然岁月流转，强弱易势，昔日师徒，今日当于疆场见真章。此刀既承古法，更融我邦之魂，劈波斩浪，无坚不摧。今举刀相向，非忘旧恩，实乃欲以胜绩昭示天下：技艺虽传于师，而精进超越，我邦已为东亚之雄。破彼壁垒，立我威权，此一战，正当以刀为证，显我最强之名于寰宇。"


je_jap_rus:0 "朝鲜事务"
je_jap_rus_reason:0 "阻止日本获取朝鲜，这对我们很重要"

je_japan_china_tea:0 "[concept_battle_of_east_asia]：茶叶、丝绸之争" 
je_japan_china_tea_reason:0 "当西洋诸国啜饮[SCOPE.GetRootScope.GetCountry.GetName]之茶，必深味其醇，而后牢牢记取：我乃茶叶之邦也。\n当西洋诸国身著[SCOPE.GetRootScope.GetCountry.GetName]丝绸所织之绫罗锦缎，必细感其柔，而后牢牢记取：我乃丝绸之邦也。​"
je_japan_china_win:0 "[concept_battle_of_east_asia]" 
je_japan_china_win_goal:0 "赢得3项[concept_battle_of_east_asia]" 
china_has_the_WON:0 "中国打赢了甲午战争"
je_japan_china_win_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]非唯欲于武力上破[SCOPE.sCountry('chi_scope').GetName]，更欲于文化、经济诸端超之。回溯千年，汉风东渐，彼邦以锻兵之术相授，我邦得之而精研，遂有武士刀之锐。然岁月流转，强弱易势，昔日师徒，今日当于疆场见真章。此刀既承古法，更融我邦之魂，劈波斩浪，无坚不摧。\n\n神国日本之国体，系于[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]万世一系之统帅，其志在使日本天赋之泽，遍洒八纮一宇，令普天下生民，皆享生活之福祉。今举刀相向，实乃欲以胜绩昭示天下：技艺虽传于师，而精进超越，我邦已为东亚之雄。破彼壁垒，立我威权，此一战，正当以刀为证，显我最强之名于寰宇。"
je_japan_china_win_tt:0 "大丈夫七生报国、大日本武运长久"  
je_great_japan_tt:0 "开拓万里之波涛，宣布国威于四方" 
je_manchuliya:0 "满洲事务" 
je_manchuliya_reason:0 "征服[SCOPE.sCountry('chi_scope').GetName]的第一步，就是征服满洲\n把满洲从中国本土分裂出来，自成一区，置日本势力之下" 
je_manchuliya_tt:0 "传八纮之一宇，普天下之万人" 
NO_china_tt:0 "中国不存在" 
je_annex_entire_china:0 "中国事务" 
je_annex_entire_china_tt:0 "上则答乾霊授国之徳，下则弘皇孙养正之心。然后，兼六合以开都，掩八纮而为宇，不亦可乎?" 
je_annex_entire_china_reason:0 "欲征服[SCOPE.sCountry('chi_scope').GetName]，必先征服满蒙，欲征服世界，必先征服[SCOPE.sCountry('chi_scope').GetName]。[SCOPE.sCountry('chi_scope').GetName]完全被我国征服，其它为小亚细亚及印度南洋等异服之民族，必畏我而降于我，使世界知东亚为日本之东亚，永不敢向我侵犯，此乃明治大帝之遗策，是亦我帝国存亡上必要之事也。\n\n[GetIdeology('ideology_meiji').GetName]或[GetIdeology('ideology_fascist').GetName]在政府中，将随机触发以下#v #tooltippable;tooltip:[Country.GetTooltipTag],je_annex_entire_china_pos 历史事件#!#!"
je_annex_entire_china_pos:0 "1.大屠杀\n2.人体实验\n3.毒气战（必须有营队装备化学武器）\n4.太平洋战争（不与美国交战，与美国关系低于20，且不拥有夏威夷）\n5.日志存续期间，将会一直移除与中国、美国、英国的停战，直到一方完全胜利"


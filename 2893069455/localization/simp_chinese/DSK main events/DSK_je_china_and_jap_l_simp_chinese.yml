kor_be_empire_button_desc: "在脱离中国朝贡体系后，马上怂恿朝鲜王称帝"
je_jap_shougun_tt: "[SCOPE.gsInterestGroup('shougun_ig').GetName][Concept('concept_ruler','$RULER_TITLE_SHOGUN$')][ROOT.GetCountry.GetRuler.GetFirstName]已经采取[SCOPE.sLaw('law_isolationism_scope').GetName]政策！"
land_japan_desc: "为了[concept_east_asia_empire]！[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_MIKADO$')]八紘一宇！"
sea_japan_desc: "[concept_jap_empire]已经采取了海洋政策！[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_MIKADO$')]八紘一宇！"
jap_japan_desc: "[concept_jap_empire]已经采取了内务政策！[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_MIKADO$')]万岁！"

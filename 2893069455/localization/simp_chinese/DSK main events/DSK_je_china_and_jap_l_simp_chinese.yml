 Ise_eve_1_t: "式年迁宫"
 Ise_eve_1_d: "式年迁宫是每20年进行一次，将社殿和神宝都重新建造以向大御神祈祷的神宫最大的神道仪式"
 Ise_eve_1_f: "东西方两块完全相同的土地上建造有从内到外完全一致的两座神宫，式年迁宫是每20年就将包括社殿和御装束神宝在内的一切都按照古法更新修缮一次，以将大御神请到新神宫的神宫最大的仪式，\n自天武天皇14年以来，该仪式已经重复了一千余年，每20年一次重建使得神宫得以永远保持崭新，式年迁宫仪式尊千年不变的古法进行具有重大意义。"

torii_rebuild_button_desc:0 "鸟居者，神域之表门也。今风雨剥蚀，或有颓圮，当重葺新构，以肃神明之境。朱漆映日，木骨凌云，使凡俗知神域之庄严，兆民沐神恩之庇佑。"
shrine_rebuild_button:0 "肇建新社"
shrine_rebuild_button_desc:0 "神社者，敬奉天照大神、皇祖灵位之所也。今疆域日广，生民益蕃，当择吉地肇建新社，以展神恩之广被。立殿宇以承祭祀，聚兆民以固信仰，使神道教化遍于海内，[concept_jap_empire]根基永固于亿代。"
has_enough_shintoism_var:0 "花费50进度条"
shinto_war_breakout_button:0 "亿兆玉碎"
shinto_war_breakout_button_desc:0 "外夷犯我神土，侵我皇居，此乃神人共愤之举。我大和子民，当以血肉为盾，以魂魄为火，誓与国土共存亡。纵化为玉碎，亦要让贼寇知我[concept_jap_empire]不可辱"
je_fei_dao_ling:0 "废刀令"
je_fei_dao_ling_reason:0 "1870年，明治政府首禁庶民佩刀；次年再颁令，武士阶级专属带刀权亦被废止。1873年《征兵令》推行，义务兵役制取代武士垄断军事之旧制，‘全民皆兵’使武士失去世代相传的职业根基。随之而来的‘秩禄处分’，以公债赎买武士俸禄，彻底终结其经济特权——此数策连环，实为瓦解旧士族制度之关键。"
je_hu_ji_fa:0 "户籍法"
je_hu_ji_fa_reason:0 "1871年《户籍法》打破往昔《宗门人别改帐》的身份隔离登记制，无论华族、士族、平民，皆以实际家庭为单位入册。虽仅为形式性记录，却首次以法律形式否定‘士农工商’的等级壁垒，标志着‘四民平等’原则的制度化起步，为后续民法改革埋下伏笔。"
je_zhi_chan_xing_ye:0 "殖产兴业"
je_zhi_chan_xing_ye_reason:0 "面对西方资本主义列强的外部压力，明治政府以‘殖产兴业’为核心国策：由国家主导移植近代产业技术，通过设立工部省、扶持官营工厂、改革土地与金融制度等手段，推动传统经济向资本制生产模式转型。此政策与‘富国强兵’‘文明开化’三位一体，共同构成日本近代化的支柱，旨在短期内实现产业振兴以抵御外侮、跻身强国之列。"

Je_Russo_Japanese_War_reason: "#red 重要提醒#!：在未打赢#v 日俄战争#!之前，任意在#yellow 满洲#!区域的征服行动都可能招致[SCOPE.sCountry('rus_scope').GetName]的警告和攻击！\n$TOOLTIP_DELIMITER$\n1739年：[SCOPE.sCountry('rus_scope').GetName]船队从勘察加半岛出发，突破千岛群岛，在日本仙台藩、[SCOPE.gsInterestGroup('shougun_ig').GetName]直辖地登陆，打通了西伯利亚至日本本土的航线，史称“元文黑船骚动”。这一事件标志着日俄两国间正式的海上联系开始建立。\n1781年：日本经世家工藤平助撰写《赤虾夷风说考》，书中涉及对俄国的描述和分析。这为[SCOPE.gsInterestGroup('shougun_ig').GetName]了解俄国提供了重要参考。\n1792年：俄国使节亚当·拉克斯曼率领一支军队乘船抵达日本[SCOPE.sState('great_state_scope').GetName]东北角的根室，奉叶卡捷琳娜二世之命前来谋求与日本建立通商关系。这是俄国首次正式尝试与日本幕府建立官方联系。\n面对俄国的建交请求，[SCOPE.gsInterestGroup('shougun_ig').GetName]掌权者松平定信采取了拖延政策。他一边要求各藩强化海防，一边对俄国使团使用缓兵之计。最终，松平定信以日本对从未建交国家的船只实行严格限制为由，拒绝了俄国的通商请求。\n\n如今，[SCOPE.sCountry('rus_scope').GetName]正式成为了我们的邻居，他们对于[SCOPE.sCountry('chi_scope').GetName]的领土垂涎若渴，企图把#N 满洲#!和#N 朝鲜半岛#!纳入后花园。如果我们与其发生争议领土冲突，他们会对我们发起危险的外交博弈，必须当心！"
Je_Russo_Japanese_War_tt: "目前与[concept_russian]没有利益冲突"
Je_Russo_Japanese_War_1_tt: "我们拿走了[concept_russian]的核心利益地区！除非我们已经做好与他们战争的准备"
Je_Russo_Japanese_War_2_tt: "日俄战争已经爆发！"
jap_rus_war_break_out_tt: "我们已经赢得日俄战争！"
jap_rus_war_break_out_button: "挑起日俄战争"
jap_rus_war_break_out_button_desc: "[concept_russian]欺压我们太甚，必须动用武力迫使他们滚出满洲和朝鲜\n#red 这会终结这个日志并让[concept_russian]不再强制干涉我们在满洲和朝鲜的事务#!"
je_rus_japan_war: "日俄战争"
jap_rus_relationship_button: "对俄绥靖"
jap_rus_relationship_button_desc: "由于[concept_russian]是强大且充满威胁的北方邻国，我们不得不与其改善良好的关系，以谋求他们不对我们使用武力。"
je_jap_xinan_war: "士族问题"
je_jap_xinan_war_goal: "[ROOT.GetCountry.GetRuler.GetFirstName]政府的现代化改革与旧士族的利益冲突终于爆发了"
je_jap_xinan_war_reason: "[ROOT.GetCountry.GetRuler.GetFirstName]初年，日本虽然成立了以[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]为最高权力中心的政府，但尚未完成中央集权体制。从旧代延续下来的274个藩仍然保持着独立的军队、财政和领国内的统治权，[ROOT.GetCountry.GetRuler.GetFirstName]政府对国内的控制力极为薄弱。\n\n[concept_country]本身并无直辖武装力量，主要依赖#yellow 萨摩藩#!、#yellow 长州藩#!等倒幕各藩藩兵。这种依赖关系使得政府在面对与藩利益不合时，容易陷入无兵可依的困境。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]政府在财政上仅能征收和调配全国资源的30-40%，却要负担作为中央政府的全部支出，支付能力十分脆弱。\n在倒幕运动时期，维新派以“尊王攘夷”为纲领。然而，[ROOT.GetCountry.GetRuler.GetFirstName]政府提出的维新政策中包括“求知识于世界，大振皇基”的开国政策，这引起了攘夷派的不满。他们认为开国政策背叛了以往道路，并采取暗杀等手段来清除政府内的开国派。同时，开国与对外贸易造成的贵金属短缺和物价上涨，使得民众生活水平下降，整个社会弥漫着仇视外国人和开国政策的不满情绪。\n\n如果我们无法正确处理好#yellow 士族#!与政府的问题，那么双方#v #tooltippable;tooltip:[Country.GetTooltipTag],je_xinan_pos 矛盾#!#!会日益加深，最终演变成内战！"
je_xinan_pos: "以下条件将 #bold 加深#!矛盾：\n•在#yellow 武士的落幕#!中选择“武士的时代结束了”（#red +1#!）。\n•在#yellow 武刃的学生#!中选择“是时候废除这项权利了”（#red +1#!）。\n•执行了[GetLawType('law_free_trade').GetName]（#red +1#!）\n•[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]不是边缘集团且[concept_approval]<-8（#red +1#!）\n•[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]不是边缘集团且[concept_approval]<-8（#red +2#!）\n以下条件将#bold 缓和#!矛盾:\n•全国#yellow [Concept('concept_sol', '$SOL_SHORT_TEXT$')]>=15#!"
SMF: "萨摩藩"
SMF_ADJ: "萨摩藩"
je_rus_japan_war_reason: "[SCOPE.GetRootScope.GetCountry.GetName]和[SCOPE.sCountry('rus_scope').GetName]为了争夺中国满洲和朝鲜半岛的控制权，产生了深刻的矛盾。我们在明治维新后国力强盛，积极推行对外侵略扩张政策，将朝鲜半岛和中国东北视为其“大陆政策”的重要组成部分。而[SCOPE.sCountry('rus_scope').GetName]则视中国东北为其远东地区的势力范围，企图通过控制这一地区来巩固其在远东的地位。\n他们马上就会知道[concept_jap_empire]军队真正的势力。"

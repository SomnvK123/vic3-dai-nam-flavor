je_italian_unification:0 "意大利统一" 
je_italian_status:0 "统一意大利是我们的毕生追求的理念"  
je_italian_unification_reason:0 "我来自于萨伏伊，那饱受压迫的威尼斯和伦巴第，我渴望解放你。\n这千年的分裂之地，我渴望统一你。\n待我从阿尔卑斯山上而来，高举着这世间最伟大的三色旗。\n告诉我上帝，如果我不曾见过你。求求你上帝，让我葬于小牛之地。Godhelpme，就让我化身为你。\n罗马城众奴隶，即刻随我起义。亚平宁众兄弟，我们团结一起。今日天时地利，统一1861。" 

orleanist_flavor.10.t:0 "我们的三色旗" 
orleanist_flavor.10.d:0 "意大利众兄弟，看祖国正奋起。已戴好西庇阿头盔，英雄帽。问胜利在那里，罗马城众奴隶。把光荣带给你，创造者是上帝。" 
orleanist_flavor.10.f:0 "从阿尔卑斯的雪峰到地中海的波涛，\n我们走过了征服和抵抗的道路，\n用汗水和热血浇灌着我们的希望。\n在这片土地上，我们团结一心，\n肩并肩，同舟共济，永不退缩。\n让我们的国旗在风中飘扬，\n让我们的声音响彻天际，\n意大利，你是我们的骄傲和荣耀，\n在你的光芒下，我们无所畏惧。" 
orleanist_flavor.10.a:0 "让我们联合起，天下谁能敌？" 
Italian_buff:0 "马梅利之歌"  

orleanist_flavor.11.t:0 "速报！来自我们驻北意大利的大使馆消息！" 
orleanist_flavor.11.d:0 "[SCOPE.sCountry('ita_scope').GetName]于今日大赦天下" 
orleanist_flavor.11.f:0 "我来自于萨伏伊，那饱受压迫的威尼斯和伦巴第，我渴望解放你。\n这千年的分裂之地，我渴望统一你。\n待我从阿尔卑斯山上而来，高举着这世间最伟大的三色旗。\n罗马城众奴隶，即刻随我起义。亚平宁众兄弟，我们团结一起。" 
orleanist_flavor.11.a:0 "绿色=民族的希望。白色=国家的信念。红色=耶稣的仁慈" 

request_autonomy_proposal_thrid_party_declined:0 "三次请求自治提案被拒绝" 
conference_algeria:0 "征服阿尔及利亚地区" 
conference_algeria_desc:0 "如果我们愿意等待这些时间，那么我底下的军队就会制定一份详细的征服阿尔及利亚的作战计划！" 
conquest_of_algeria.4.t:0 "速报！"
conquest_of_algeria.4.d:0 "[SCOPE.sCountry('fra_scope').GetName]宣布阿尔及利亚地区为法兰西合法领地并于今日对其发动突袭战争！"
conquest_of_algeria.4.f:0 "如果可以，[SCOPE.sCountry('fra_scope').GetName]可以在三个月内拿下整个阿尔及利亚"
conquest_of_algeria.4.a:0 "那是他们内政。"
 france_wa:0 "如果我们成功征服了北非地区，我们的非洲总督会向我们提议建立#v $法属北非$# "
conquest_of_algeria.5.t:0 "法属西非"
conquest_of_algeria.5.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]已经征服了北非，我们要把手伸向西非去！"
conquest_of_algeria.5.f:0 "西非是[SCOPE.GetRootScope.GetCountry.GetName]在非洲的明珠，我们不能放任其流入其他国家手中，在别的西方国家到来之前，我们有必要召开巴黎会议并要求与会国承认我们在非洲西部的主权"
conquest_of_algeria.5.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁"

conquest_of_algeria.6.t:0 "法国要求召开西非会议"
conquest_of_algeria.6.d:0 "法国向西方各国发送与会请求，要求承认其在西非的合法地位"
conquest_of_algeria.6.f:0 "自从征服阿尔及利亚后，法国对西非显得越来越渴望，不过在此之前，他们希望我们国家承认其在非洲西部的主权"
conquest_of_algeria.6.a:0 "不准！西非是非洲人的西非，不是法兰西的西非"
conquest_of_algeria.6.a.b:0 "[SCOPE.GetRootScope.GetCountry.GetName]和法国是永远的朋友，西非是法国的西非"

conquest_of_algeria.7.t:0 "与会国同意建立法属西非"
conquest_of_algeria.7.d:0 "巴黎会议确认了我们在西非的主权，这是我们历史性的外交胜利。"
conquest_of_algeria.7.f:0 "沙漠下埋藏着黄金等宝藏，现在它们都属于法兰西人的一部分，没有人敢质疑[SCOPE.GetRootScope.GetCountry.GetName]在西非的统治地位，这简直太棒了！"
conquest_of_algeria.7.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁！"
annex_west_Africa:0 "法属西非"
annex_west_Africa_desc:0 "巴黎会议的最新消息"
shijiedaxue:0 "中国大学"
shijiedaxue_desc:0 "美国有常春藤联盟，英国有罗素集团，而我们必须建立C9联盟！"


objective_ra_idle_header:1 "继续前行"
objective_ra_idle_hint:0 "接下来会有更多挑战"

serb_events.1.t:0 "发现盟友"
serb_events.1.d:0 "在奥斯曼和奥地利帝国之间，塞尔维亚人找到了他们所需的盟友。"
serb_events.1.f:0 "在两个强大邻居面前，我们需要援手。幸运的是，我们做到了！"
serb_events.1.a:0 "为塞尔维亚人的荣耀！"

serb_events.2.t:0 "归还塞尔维亚家园"
serb_events.2.d:0 "在远方圣彼得堡的#yellow 沙皇#!的支持下，是时候归还塞尔维亚人的历史家园了。"
serb_events.2.f:0 "遥远的故土，我们民族的摇篮——科索沃已经重回怀抱，但还有更多境外的塞尔维亚人等待我们去解救。"
serb_events.2.a:0 "让我们加快统一的步伐。"

serb_events.3.t:0 "大塞尔维亚"
serb_events.3.d:0 "通过确保塞尔维亚的核心省份，我们已经不再是一个简单的公国，可以称自己为塞尔维亚王国了。"
serb_events.3.f:0 "公国只是一个简短的过渡期，世界将会看到一个崭新的塞尔维亚王国屹立在舞台上！"
serb_events.3.a:0 "为塞尔维亚王国的荣耀！"

serb_events.4.t:0 "塞尔维亚，克罗地亚和斯洛文尼亚王国"
serb_events.4.d:0 "在我们的斯拉夫兄弟仍然生活在附近帝国的压迫之下，我们需要解救他们并形成第一个真正的泛斯拉夫国家。"
serb_events.4.f:0 "周边强大的邻居被迫让我们兄弟之间分离...但是如今，我们携手共进，终于团结在同一面旗帜下击退了外敌。哦，一起来喝杯酒吧，我的克罗地亚兄弟！"
serb_events.4.a:0 "为塞尔维亚，克罗地亚和斯洛文尼亚王国的荣耀！"

je_seeking_allies:0 "寻找盟友"
je_seeking_allies_goal:0 "在奥斯曼和奥地利帝国之间，塞尔维亚人需要向东寻找盟友。"
je_seeking_allies_reason:0 "如果我们想要获得独立并形成一个为所有塞尔维亚人服务的国家，寻找盟友至关重要。"
je_serb_homelands:0 "塞尔维亚家园"
je_serb_homelands_reason:0 "在[concept_russian]的支持下，是时候统一塞尔维亚人的所有家园了。"
je_greater_serbia:0 "大塞尔维亚"
je_greater_serbia_reason:0 "通过确保塞尔维亚的核心省份，仍然有塞尔维亚人在我们国家之外居住。我们应该寻求与他们的统一。"
je_kingdom_of_serbs_croats_slovenes:0 "塞尔维亚，克罗地亚和斯洛文尼亚王国"
je_kingdom_of_serbs_croats_slovenes_reason:0 "在我们的斯拉夫兄弟仍然生活在附近帝国的压迫之下，我们需要解救他们并形成第一个真正的泛斯拉夫国家。"

 je_egy_ismail_modernization:0 "伊斯梅尔的现代化"
 je_egy_ismail_modernization_reason:0 "穆罕默德·阿里的改革为埃及奠定了基础，但到了伊斯梅尔时代，宫廷希望以更昂贵也更激进的方式把埃及推向现代国家。铁路、港口、运河、官僚体制与军队改革都需要巨额资金，而这笔资金往往来自未来。"
 je_egy_cotton_boom:0 "棉花繁荣"
 je_egy_cotton_boom_reason:0 "国际市场对棉花的胃口前所未有。只要抓住这一波行情，埃及就能在短期内大幅扩张财政与工业能力，但繁荣本身也会诱发更高的支出冲动。"
 je_egy_suez_finance:0 "苏伊士融资"
 je_egy_suez_finance_reason:0 "横贯地峡的工程将重塑世界航路，也将把埃及绑在欧洲金融市场的账本上。"
 je_egy_centralization:0 "整顿总督国"
 je_egy_centralization_reason:0 "如果没有更集中的官僚体系，再多的工程和贷款也只会沉入地方关系网。"
 je_egy_debt_crisis:0 "债务危机"
 je_egy_debt_crisis_reason:0 "改革的账单终于找上门来。欧洲债权人、宫廷官僚与本地军官都要求优先保障自己的利益，而埃及已经不可能同时满足所有人。"
 otf_egyptian_question_je:0 "埃及问题"
 otf_egyptian_question_je_reason:0 "埃及仍然在名义上属于帝国，但当地的财政危机和列强干预正在削弱我们的宗主权。我们必须决定，是借势重申权威，还是在现实面前退让。"

 egypt_finance_chain.1.t:0 "伊斯梅尔的雄心"
 egypt_finance_chain.1.d:0 "宫廷围绕一个问题争论不休：埃及究竟应该一步跨入现代世界，还是谨慎地维持财政稳健？"
 egypt_finance_chain.1.f:0 "伊斯梅尔与其顾问相信，只要修筑铁路、改造港口、扩充行政机关并吸引欧洲资本，埃及就能摆脱传统总督国的边界，成为地中海与红海之间最耀眼的国家。反对者则提醒他们，借来的荣耀同样会带来借来的主权。"
 egypt_finance_chain.1.a:0 "大举建设，未来会偿还一切"
 egypt_finance_chain.1.b:0 "谨慎推进，先保住国库"

 egypt_finance_chain.2.t:0 "棉花黄金时代"
 egypt_finance_chain.2.d:0 "棉花出口带来的收入让宫廷相信，埃及可以承担更宏大的计划。"
 egypt_finance_chain.2.f:0 "来自海外的订单源源不断，商人、地主和官员都把这视为新时代的预兆。繁荣确实存在，但也容易让人忘记它可能稍纵即逝。"
 egypt_finance_chain.2.a:0 "让这场繁荣支撑改革"

 egypt_finance_chain.3.t:0 "苏伊士的账本"
 egypt_finance_chain.3.d:0 "运河与相关工程的推进速度超出了旧有财政体系的承受能力。"
 egypt_finance_chain.3.f:0 "法国金融家、工程承包商与本地官僚都围绕苏伊士展开了新的利益网络。有人把它视为埃及通往世界舞台的门票，也有人把它视为欧洲债券市场的锁链。"
 egypt_finance_chain.3.a:0 "接受这份代价，换取世界航路"
 egypt_finance_chain.3.b:0 "继续借债，绝不能中断工程"

 egypt_finance_chain.4.t:0 "宫廷与省份"
 egypt_finance_chain.4.d:0 "中央政府终于开始把改革的命令真正推到地方。"
 egypt_finance_chain.4.f:0 "地方长官、税收承包人与军队网络长期主导着埃及的行政生活。要让现代化落地，开罗就必须把这些权力重新收回到政府和预算中。"
 egypt_finance_chain.4.a:0 "让国家真正像国家那样运转"

 egypt_finance_chain.5.t:0 "现代埃及的代价"
 egypt_finance_chain.5.d:0 "改革取得了阶段性成功，但繁荣背后已经埋下了财政失衡的种子。"
 egypt_finance_chain.5.f:0 "铁路、港口、学校与宫廷建筑让埃及看起来比以往任何时候都更接近欧洲列强。可在账本上，每一项荣耀都写着利息和期限。"
 egypt_finance_chain.5.a:0 "我们已经没有回头路了"

 egypt_finance_chain.6.t:0 "未竟的现代化"
 egypt_finance_chain.6.d:0 "改革并未完全失败，但它既没有彻底完成，也没能阻止财政压力不断扩大。"
 egypt_finance_chain.6.f:0 "旧制度没有被彻底打破，新制度又需要更多资源才能站稳脚跟。宫廷很快会发现，不完整的现代化往往比停滞更昂贵。"
 egypt_finance_chain.6.a:0 "至少火种还没有熄灭"

 egypt_finance_chain.7.t:0 "债权人的条件"
 egypt_finance_chain.7.d:0 "欧洲债权人要求对埃及财政实施更直接的监督。"
 egypt_finance_chain.7.f:0 "英国人和法国人都声称，他们只是为了保障贷款的偿付和地中海通往印度航路的稳定。可在开罗看来，这种“监督”几乎就是把国家预算摆到外国人的桌上。"
 egypt_finance_chain.7.a:0 "接受英法双重控制"
 egypt_finance_chain.7.b:0 "勒紧裤腰带，也不能让他们管账"

 egypt_finance_chain.8.t:0 "阿拉比军官团"
 egypt_finance_chain.8.d:0 "军官与城市中产开始把债务危机视为宫廷出卖国家的证明。"
 egypt_finance_chain.8.f:0 "随着削减、外债与外国监督一道压向社会，越来越多的军官公开要求“埃及是埃及人的埃及”。他们并不都想推翻总督，但他们都不愿再看着国家被外国资本与宫廷浪费撕碎。"
 egypt_finance_chain.8.a:0 "风暴已经来了"
 egypt_finance_chain.8.b:0 "先下手，压制军官团"

 egypt_finance_chain.9.t:0 "英国的抉择"
 egypt_finance_chain.9.d:0 "埃及局势恶化后，伦敦必须决定是否直接出手。"
 egypt_finance_chain.9.f:0 "苏伊士运河、债务偿付与帝国航线都在提醒英国内阁，埃及不是一个可以随意放手的地方。可直接军事介入也意味着公开挑战奥斯曼的名义宗主权。"
 egypt_finance_chain.9.a:0 "占领埃及，先保住运河"
 egypt_finance_chain.9.b:0 "暂时旁观，让奥斯曼自己处理"

 egypt_finance_chain.10.t:0 "重申宗主权"
 egypt_finance_chain.10.d:0 "开罗的危机让伊斯坦布尔再次看见了“埃及问题”的窗口。"
 egypt_finance_chain.10.f:0 "埃及仍然是帝国秩序中的一块关键拼图。如今列强干预与军官政治相互交织，帝国可以尝试以协商的方式恢复影响力，也可以选择保持距离，避免卷入新的泥潭。"
 egypt_finance_chain.10.a:0 "用协商重申宗主权"

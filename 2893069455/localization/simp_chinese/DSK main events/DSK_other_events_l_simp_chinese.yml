kelimiya20_reason:0 "在我死之前，我想回去那个令我无数个日夜魂牵梦萦的地方"
TGE_russia.6.t:0 "第三罗马"
TGE_russia.6.d:0 "如今君士坦丁堡已在我们手中，我再也不用骗自己是罗马的继承者，我就是罗马！"
TGE_russia.6.f:0 "帝国的首都不在因格里亚。\n东罗马末代皇帝的侄女嫁给了[concept_russian]，我接下了他们的职责，我是东正教的守护者，当我拿下东色雷斯后，我不再是罗马的继承者，我就是罗马，我要让突厥人知道，我是他们的达摩克利斯之剑，总有最锋利的矛会贯穿他们的心脏.\n这一次迟来400年的正义，流离失所与亡国之恨也让你尝尝。\n我的回来是为了那些回不来的人，我就是罗马，我就是这个世界永远的双头鹰"
TGE_russia.6.a:0 "伟大的第三罗马[concept_russian]终于到达了他最忠诚的君士坦丁堡"
modifier_rome_empire:0 "东正教的守护者"
TGE_russia.7.t:0 "第三罗马"
TGE_russia.7.d:0 "[concept_russian]帝国正式昭告天下"
TGE_russia.7.f:0 "[concept_russian]已成功光复罗马旧都君士坦丁堡，自400年前东罗马覆灭来，罗马的桂冠首次转移到[concept_russian]人的手上，[concept_russian]正式成为第三罗马帝国，[concept_russian]沙皇加冕为罗马皇帝"
TGE_russia.7.a:0 "就这样吧"



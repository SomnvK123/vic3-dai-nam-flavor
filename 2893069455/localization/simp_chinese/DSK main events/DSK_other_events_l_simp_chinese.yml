 russia_expand.18.d:0 "沙俄帝国的不断扩张触及到了英国人的利益"
 russia_expand.18.f:0 "从19世纪初到20世纪初的大约100年间，英俄这两个帝国主义大国为了争夺在中亚、南亚以及周边地区的势力范围，在政治、外交、军事等领域展开的激烈对抗。\n 当时，正值欧洲帝国主义的扩张浪潮走向最高峰，英国为了确保它在东方的主要殖民地印度的安全，开始把触角伸向波斯、阿富汗以及中亚的广袤腹地。\n 沙皇俄国同样垂涎中亚的经济利益和交通价值，因此对英国的扩张态势做出了针锋相对的回应。"
 russia_expand.18.a:0 "我会和[SCOPE.sCountry('rus_scope').GetName]一起对抗[SCOPE.sCountry('gbr_scope').GetName]"

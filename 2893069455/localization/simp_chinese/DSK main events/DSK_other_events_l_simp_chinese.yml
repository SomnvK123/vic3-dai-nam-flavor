portugal_brazil_union:0 "巴西领土并入葡萄牙统一"
portugal_brazil_union_desc:0 "现在正式是将巴西领土重新纳入我们控制的时候了。"
portugal_brazil_union_tt:0 "统一"
pt_br_union.1.t:0 "巴西与葡萄牙的统一"
pt_br_union.1.d:0 "巴西已经作为我们的傀儡控制了一段时间，现在我们终于可以吞并他们，由葡萄牙再次统治这片土地。"
pt_br_union.1.f:0 "土地不是自由或送给的，不！土地是被夺取的，那些夺取它的人也必须为保住它而进行防御。"
pt_br_union.1.a:0 "伟大的等待已经结束了"
pt_br_union.1.b:0 "我们更愿意选择金钱而不是问题"

god_protects_america:0 "天佑美国"
god_protects_america_desc:0 "上帝庇护美国"

motw_meta_events.1.t:0 "世界之母"
motw_meta_events.1.d:0 "世界之母"
motw_meta_events.1.f:0 "一个神秘的身影掀开你办公室的窗帘。你找不到措辞。你想命令这个恶魔揭示他的身份，或者他是如何找到你的，但你不能。你的嘴巴保持着闭合。"
motw_meta_events.1.f:0 ""放松，帕夏。不用担心。这是你在一百年内唯一看到我的时候。"
motw_meta_events.1.f:0 "这个身影继续说道：“整个[ROOT.GetCountry.GetAdjectiveNoFlag]国家的意志在你的脚下。这是怎么发生的，我并不关心。我只需要你决定这个国家的未来。只要你在这个宇宙中，你的选择就是永久的。所以，明智地选择吧。”"
motw_intro_tooltip:0 "您已启用Mother of the World模组。该扩展模组主要专注于埃及及其朋友和敌人。此外，该模组还包含与英国帝国、法国以及奥斯曼帝国有关的埃及内容。"
motw_meta_events.1.a:0 "严格历史 - #P 推荐#!"
strictly_historical_tooltip:0 "此路径严格强制埃及与外国势力之间的历史性结果。弯曲命运之路需要极大的意志。此选项适用于偏好沉浸和历史准确性，且不介意输掉一两场战争的玩家。"
motw_meta_events.1.b:0 "历史性"
historical_tooltip:0 "此路径偏向于历史性结果，同时允许玩家进行一些更改和替代情节。此选项适用于想要了解模组并在其中享受一些乐趣的玩家。"
motw_meta_events.1.c:0 "宽松历史"
loosely_historical_tooltip:0 "此路径为您提供三者中最大的自由度，但可能伴随着无法预测的命运转折。此选项适用于那些白日梦想象替代情节并享受不可预测的游戏过程的玩家。"

motw_intro_events.1.t:0 "马木留克之魂"
motw_intro_events.1.d:0 "25年前的今天，受奴役士兵的马木留克统治阶层统治了太久。在[GetPlayer.GetRuler.GetFullName]在其血腥崛起期间，他们遭到了惨痛的结局。有人称之为狡猾的伏击，有人称之为对好客的残忍背叛，但有一点是肯定的，这一壮举将被世界记住一千年！"
motw_intro_events.1.f:0 ""即使在我的噩梦中，他们仍然被奴役。""
motw_intro_events.1.a:0 "世界现在知道[GetPlayer.GetRuler.GetPrimaryRoleTitle]是一股不可忽视的力量！"
motw_intro_events.1.b:0 "愿安拉怜悯他们的灵魂...也怜悯我的。"

motw_intro_events.2.t:0 "对于崇高港口的凝视"
motw_intro_events.2.d:0 "自从[GetPlayer.GetRuler.GetFullName]着手在垂死的[SCOPE.sCountry('ottoman_empire').GetName]中开辟自己的王国以来，他内心的一种声音告诉他，他应该得到更多，即阿拉维特帝国。或者是他的儿子[GetPlayer.GetHeir.GetFirstName]？"
motw_intro_events.2.f:0 ""通往城市的道路是开放的。说出这些话，父亲，我将为你夺取王位，为我们所有人。" 1832年科尼亚的胜利后，易卜拉欣·帕夏说。"
motw_intro_events.2.a:0 "我本应该听他的。"
motw_intro_events.2.a.tt:0 "你获得对君士坦丁堡的临时[concept_claim]"
motw_intro_events.2.b:0 "我们的时间最好花在关注改革和研究上。"

motw_intro_events.4.t:0 "至高的力量"
motw_intro_events.4.d:0 "如果我们真的想将[SCOPE.sCountry('ottoman_empire').GetName]摆脱苦难，我们需要确保获得[concept_great_power]的支持。至于选择哪一个，实际上只有两个选项。将是哪一个，法国还是#N 大不列颠#!？"
motw_intro_events.4.f:0 "你必须仔细考虑，帕夏。有一天，我们可能会寻求他们的帮助。"
motw_intro_events.4.a:0 "法国统治这片土地。"
motw_intro_events.4.b:0 "不列颠统治海洋。"
motw_intro_events.4.c:0 "埃及不需要“伟大”的力量。"

muhammad_alis_reform_events.1.t:0 "改革时代"
muhammad_alis_reform_events.1.d:0 "外国人凝视着[ROOT.GetCountry.GetNameNoFlag]丰富的历史，并对她过去的优越性感到惊叹，然而毫不犹豫地践踏她的人民。金字塔的建造者看到他们心爱的国家在文明的尾巴处，被野蛮人超越，一定会感到羞愧。也许无法改变历史，但可以改变命运。"
muhammad_alis_reform_events.1.f:1 ""如果土地干旱，我们用我们的鲜血滋润它！""
muhammad_alis_reform_events.1.a:0 "登上文明的列车吧！"
je_1839war:0 "1839埃及奥斯曼危机"

muhammad_alis_reform_events.2.t:0 "常走之路"
muhammad_alis_reform_events.2.d:0 "[ROOT.GetCountry.GetName]独特的地理位置使她处于东西相交的地方。谁掌握这片土地，谁就掌握了世界贸易的缰绳。加强我们对这些缰绳的控制将确保获得更多的利益。"
muhammad_alis_reform_events.2.f:0 "通往印度的唯一站点。"
muhammad_alis_reform_events.2.a:0 "实施垄断！"

muhammad_alis_reform_events.3.t:0 "给予穷人"
muhammad_alis_reform_events.3.d:0 "[GetPlayer.GetRuler.GetFirstName]结束了[ROOT.GetCountry.GetName]的辅助势力，即马木留克。但仍然有另一种形式的权力分散在土地所有者手中。与此同时，[ROOT.GetCountry.GetAdjectiveNoFlag]的金库明显空虚..."
muhammad_alis_reform_events.3.f:0 ""[GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]不再存在。""
muhammad_alis_reform_events.3.a:0 "土地所有者再也没有了。"
muhammad_alis_reform_events.4.t:0 "通过一切手段"
muhammad_alis_reform_events.4.d:0 "[ROOT.GetCountry.GetName]必须以一种或另一种方式建设起来。尽管我们不以迫使我们的人们离开农场进入建筑工地为荣，但这已经帮助并将继续帮助这个国家走向伟大之路。"
muhammad_alis_reform_events.4.f:0 "谁会对鞭子说不呢？"
muhammad_alis_reform_events.4.a:0 "邪恶但必要。"

muhammad_alis_reform_events.5.t:0 "医者啊，医者"
muhammad_alis_reform_events.5.d:0 "如果所有人都是士兵和建筑工，那么还有谁治疗病人和照顾老人呢？[GetPlayer.GetRuler.GetFirstName]派遣了一支英国医生和医疗官的使节团，教育妇女团体基础医学。"
muhammad_alis_reform_events.5.f:0 "哈基玛（Hakima），字面上是'聪明的女人'，是一位在医学和外科学方面受过良好教育的女性。"
muhammad_alis_reform_events.5.a:0 "受祝福的慈悲天使们。"

muhammad_alis_reform_events.6.t:0 "用羊皮纸和笔"
muhammad_alis_reform_events.6.d:0 "这几十年来，文盲率显著上升，阿拉伯文学迎来了黄金时代。当然，如果没有我们出色的政策和法律，这场文艺复兴是不可能发生的。"
muhammad_alis_reform_events.6.f:0 ""
muhammad_alis_reform_events.6.a:0 "开明者在我们中间行走。"

muhammad_alis_reform_events.7.t:0 "现代埃及"
muhammad_alis_reform_events.7.d:0 "齿轮正在转动，头也在抬起。虽然[ROOT.GetCountry.GetName]可能不再是她曾经的先驱国家，但毫无疑问，现在，她走在精英之间。"
muhammad_alis_reform_events.7.f:0 "“如果我不是埃及人，我会想成为埃及人。” - 穆斯塔法·卡梅尔"
muhammad_alis_reform_events.7.a:0 "前进，向前！"

muhammad_alis_reform_events.8.t:0 "倒退的埃及"
muhammad_alis_reform_events.8.d:0 "齿轮在棚子里生锈。我们开始的事情，我们无法完成。[ROOT.GetCountry.GetNameNoFlag]再次发现自己处于文明的尾巴。"
muhammad_alis_reform_events.8.f:0 ""
muhammad_alis_reform_events.8.a:0 "诅咒！"

########################################### ORIENTAL CRISIS OF 1840 ##############################################################

oriental_crisis.1.t:0 "屈塔希亚的记忆"
oriental_crisis.1.d:0 "沮丧标记着那个被诅咒的日子的记忆。在战场上取得决定性的胜利后，[GetPlayer.GetRuler.GetFirstName]未能确保他的王国正当的独立。现在，空气中弥漫着烟雾和火药味。危险正在酝酿，战争肯定会很快爆发。"
oriental_crisis.1.f:0 "我看见，见证了一匹白马，驾着坐在上面的人手持弓，戴着王冠，他出去征服，去征服。"
oriental_crisis.1.a:0 "尘土还没有完全落定。"
oriental_crisis_egy_tt:0 "几个月后，奥斯曼人将为叙利亚引发[concept_diplomatic_incident]。"

oriental_crisis.2.t:0 "图瓜尔"
oriental_crisis.2.d:0 "[SCOPE.sCountry('ottoman_empire').GetAdjectiveNoFlag]已经采取主动，在[SCOPE.sState('STATE_ADANA').GetName]附近开始动员。我们必须行动！"
oriental_crisis.2.f:0 "又出来了一匹红马，坐在上面的人有权给他拿着大剑夺去地球上的和平，叫他们彼此杀戮，并给了他一把大剑。"
oriental_crisis.2.a:0 "胜利会眷顾勇敢之人。"
oriental_crisis.3.t:0 "东方危机"
oriental_crisis.3.d:0 "在生病的男人和他雄心勃勃的瓦里之间的上一次冲突六年后，号角再次响起。这一次，我们的干预更加必要，如果我们想在欧洲和近东的力量平衡中发表意见的话。"
oriental_crisis.3.f:0 "“欧洲的病夫，”尼古拉斯说。“一个非常生病的人。”"
oriental_crisis.3.a:0 "这个雄心勃勃的瓦里相当令人印象深刻。"
oriental_crisis.3.b:0 "维持奥斯曼帝国的影响对欧洲的维和至关重要。"
oriental_crisis.3.c:0 "[ROOT.GetCountry.GetName]毫不在乎。"

oriental_crisis.4.t:0 "东方危机"
oriental_crisis.4.d:0 "在生病的男人和他雄心勃勃的瓦里之间的上一次冲突六年后，号角再次响起。这一次，我们的干预更加必要，如果我们想在欧洲和近东的力量平衡中发表意见的话。"
oriental_crisis.4.f:0 "“欧洲的病夫，”尼古拉斯说。“一个非常生病的人。”"
oriental_crisis.4.a:0 "这个雄心勃勃的瓦里相当令人印象深刻。"
oriental_crisis.4.b:0 "维持奥斯曼帝国的影响对欧洲的维和至关重要。"
oriental_crisis.4.c:0 "[ROOT.GetCountry.GetName]毫不在乎。"

oriental_crisis.5.t:0 "东方危机"
oriental_crisis.5.d:0 "在生病的男人和他雄心勃勃的瓦里之间的上一次冲突六年后，号角再次响起。这一次，我们的干预更加必要，如果我们想在欧洲和近东的力量平衡中发表意见的话。"
oriental_crisis.5.f:0 "“欧洲的病夫，”尼古拉斯说。“一个非常生病的人。”"
oriental_crisis.5.a:0 "这个雄心勃勃的瓦里相当令人印象深刻。"
oriental_crisis.5.b:0 "维持奥斯曼帝国的影响对欧洲的维和至关重要。"
oriental_crisis.5.c:0 "[ROOT.GetCountry.GetName]毫不在乎。"

oriental_crisis.6.t:0 "大国干预"
oriental_crisis.6.d1:0 "外交家们进行了外交，现在命运已经锁定。消息如下：\n"
oriental_crisis.6.d2:0 "法国站在[ROOT.GetCountry.GetName]一边。\n"
oriental_crisis.6.d3:0 "法国站在[SCOPE.sCountry('ottoman_empire').GetName]一边。\n"
oriental_crisis.6.d4:0 "#N 大不列颠#!站在[ROOT.GetCountry.GetName]一边。\n"
oriental_crisis.6.d5:0 "#N 大不列颠#!站在[SCOPE.sCountry('ottoman_empire').GetName]一边。\n"
oriental_crisis.6.d6:0 "[SCOPE.sCountry('first_great_power').GetName]站在[ROOT.GetCountry.GetName]一边。\n"
oriental_crisis.6.d7:0 "[SCOPE.sCountry('first_great_power').GetName]站在[SCOPE.sCountry('ottoman_empire').GetName]一边。\n"
oriental_crisis.6.d8:0 "[SCOPE.sCountry('other_great_power').GetName]站在

[ROOT.GetCountry.GetName]一边。\n"
oriental_crisis.6.d9:0 "[SCOPE.sCountry('other_great_power').GetName]站在[SCOPE.sCountry('ottoman_empire').GetName]一边。\n"
oriental_crisis.6.f:0 "我看见，哦，一匹黑马；坐在上面的人手里拿着天平。我听见在四活物中间有声音说，一升小麦要一块银子，三升大麦也要一块银子；你可别伤害油和酒。"
oriental_crisis.6.a:0 "战争的鼓声越来越响亮。"

oriental_crisis.7.t:0 "奥斯曼舰队叛变！"
oriental_crisis.7.d:0 "我们在陆地上的胜利导致了海上的新奇事。[SCOPE.sCharacter('defecting_admiral').GetFullName]提督，[SCOPE.sCountry('ottoman_empire').GetAdjective]舰队的指挥官，带着全部力量抵达我们的海岸，宣布叛变，并表示效忠于我们。"
oriental_crisis.7.f:0 "等等，这不是特洛伊吗？！"
oriental_crisis.7.a:0 "狡猾的一招。"
oriental_crisis.7.b:0 "这是特洛伊的舰队！"
oriental_crisis.7.c:0 "我们不能在我们中间容忍一个叛徒。但保留船只。"
ntal_crisis.2.a:0 "[GetPlayer.GetHeir.GetFirstName]，立即到前线！"
oriental_crisis.8.t1:0 "伦敦公约"
oriental_crisis.8.t2:0 "巴黎公约"
oriental_crisis.8.d1:0 "#N 大不列颠#!的外交大臣帕尔默斯顿勋爵在伦敦召集了其他[Concept('concept_great_power','$concept_great_powers$')]的官员和外交官，包括[SCOPE.sCountry('austria').GetName]、[SCOPE.sCountry('prussia').GetName]和[SCOPE.sCountry('russia').GetName]，起草了一份令人愤怒的最后通牒！我们唯一的希望现在是法国。他们没有被那个可笑的大会邀请。"
oriental_crisis.8.d2:0 "法国的外交大臣阿道夫·蒂埃里召集了其他[Concept('concept_great_power','$concept_great_powers$')]的官员和外交官，包括[SCOPE.sCountry('austria').GetName]、[SCOPE.sCountry('prussia').GetName]和[SCOPE.sCountry('russia').GetName]，在巴黎起草了一份令人愤怒的最后通牒！我们唯一的希望现在是#N 大不列颠#!。他们没有被那个可笑的大会邀请。"
oriental_crisis.8.f:0 "“殿下承诺授予阿里先生及其直系后代埃及帕夏和阿克尔帕夏的管理权以及南部叙利亚的头衔。然而，在提出这些提议时，苏丹附加了一个条件，即阿里先生在这些提议在亚历山大由他的高级代理人传达给他后的十天内接受它们，并且阿里先生同时向这样的代理人交付必要的指示，以使他的陆地和海军部队立即从阿拉伯、坎迪亚岛、阿达纳地区以及奥斯曼帝国的除埃及和阿克尔帕夏辖区之外的所有其他地区撤回。”"
oriental_crisis.8.a:0 "我们坚决拒绝！！"
convention_of_london_tt1:0 "我们拖延接受，协议就会变得越来越不利。\n接受这个最后通牒后，我们将："
convention_of_london_tt2:0 "将[SCOPE.sState('adana').GetName]、[SCOPE.sState('aleppo').GetName]、[SCOPE.sState('syria').GetName]、[SCOPE.sState('lebanon').GetName]、[SCOPE.sState('transjordan').GetName]和[SCOPE.sState('crete').GetName]的领土归还给[SCOPE.sCountry('ottoman_empire').GetName]。"
convention_of_london_tt3:0 "将[SCOPE.sCountry('hedjaz').GetName]的[concept_tributary]转交给[SCOPE.sCountry('ottoman_empire').GetName]。"
convention_of_london_tt4:0 "保留我们在直接控制下的所有其他土地的自治属国地位，以及年度贡品。"
oriental_crisis.8.b:0 "这并不是那么不合理。"
agree_to_convention_tt:0 "我们将接受这些条件。"

oriental_crisis.10.t:0 "尼科西亚公约"
oriental_crisis.10.d:0 "在一场又一场决定性的战斗之后，我们作为胜利者的地位得到了坚实的巩固，而我们的敌人#yellow 奥斯曼帝国#!苏丹#yellow 马哈茂德#!，也传来遭遇战败急火攻心即将死去的消息，愿真主洗涤他罪恶的灵魂......现在我们有责任决定和平的条件。这将是什么？"
oriental_crisis.10.f:0 "来看看。我看见，哦，有一匹灰马，坐在上面的人名叫死亡，地狱随之而来。给了他们地上四分之一的权柄，用刀剑、饥荒、死亡和地上的野兽来杀戮。"
oriental_crisis.10.a:0 "我们的独立足够了。"
oriental_crisis.10.b:0 "处死#yellow 奥斯曼帝国#!的狗！"
oriental_crisis.10.c:0 "按照我们最初的意愿，继续打到敌人投降为止！"

oriental_crisis.11.t1:0 "1840年东方危机"
oriental_crisis.11.t2:0 "1841年东方危机"
oriental_crisis.11.t3:0 "1842年东方危机"
oriental_crisis.11.t4:0 "1843年东方危机"


oriental_crisis.11.t5:0 "1844年东方危机"
oriental_crisis.11.t6:0 "1845年东方危机"
oriental_crisis.11.t7:0 "东方危机"
oriental_crisis.11.d1:0 "我们的拒绝产生了后果。"
oriental_crisis.11.d2:0 "[SCOPE.sCountry('great_britain').GetAdjectiveNoFlag]的舰队"
oriental_crisis.11.d2a:0 "[SCOPE.sCountry('france').GetAdjectiveNoFlag]的舰队"
oriental_crisis.11.d3:0 "正在轰炸阿克尔！我们需要迅速决定。足够快，他们将夺取沿海城市并切断我们的供应线。"
oriental_crisis.11.f:0 "如果在上述的十天的限期内，阿里先生不接受上述安排，苏丹将撤回他终身管理阿克尔帕夏的提议，但他的高度仍同意为阿里先生及其直系后代授予埃及帕夏的管理权，前提是该提议在随后的十天内被接受，也就是说，从向他传达的那一天起，到期限为二十天，前提是他同样向苏丹的代理人交付必要的指示，要求他的海陆军指挥官立即撤回到埃及帕夏的范围和港口之内。"
oriental_crisis.11.a:0 "这已经拖得太久了。"
convention_of_london_tt2b:0 "将[SCOPE.sState('adana').GetName]、[SCOPE.sState('aleppo').GetName]、[SCOPE.sState('syria').GetName]、[SCOPE.sState('lebanon').GetName]、[SCOPE.sState('transjordan').GetName]、[SCOPE.sState('crete').GetName]和[SCOPE.sState('palestine').GetName]的领土归还给[SCOPE.sCountry('ottoman_empire').GetName]。"
oriental_crisis.11.b:0 "永不！"
convention_of_london_2_tt:0 "战争将继续到最后。然后，没有什么是有保障的。"

oriental_crisis.12.t:0 "失败者"
oriental_crisis.12.d:0 "我们的士兵埋葬了，我们的船沉了，统治的梦想被打败了。条约的所有条款将得到执行。我们将失去一切。"
oriental_crisis.12.f:0 ""如果我们没有赢得战争的能力我们为什么要加入这场旷日持久的大战？""
oriental_crisis.12.a:0 "我们无能为力。"
convention_of_london_tt5:0 "[GetPlayer.GetRuler.GetFirstName]和他的王朝将被废黜并流亡。#bold Isset pasha#!将成为埃及和苏丹的新[GetPlayer.GetRuler.GetPrimaryRoleTitle]，只忠于苏丹。"

1848_reckoning.11.t1:0 "1840年东方危机"
1848_reckoning.11.t2:0 "1841年东方危机"
1848_reckoning.11.t3:0 "1842年东方危机"
1848_reckoning.11.t4:0 "1843年东方危机"
1848_reckoning.11.t5:0 "1844年东方危机"
1848_reckoning.11.t6:0 "1845年东方危机"
1848_reckoning.11.t7:0 "东方危机"
1848_reckoning.1.t:0 "我的患病儿子"
1848_reckoning.1.d:0 "我的长子，[GetPlayer.GetHeir.GetFirstName]，几乎不能进食。他的健康和幸福为疾病和衰老所取代。我唯一的希望是他不会在他的时光之前离去。"
1848_reckoning.1.f:0 "愿上帝留他给我。"
1848_reckoning.1.a:0 "在我之后，谁将统治[ROOT.GetCountry.GetName]？"
1848_reckoning.2.t:0 "消耗"
1848_reckoning.2.d:0 "[GetPlayer.GetHeir.GetFirstName]正在咳血！他的时日肯定不多了。"
1848_reckoning.2.f:0 ""
1848_reckoning.2.a:0 "是时候求助于我们名义上的君主了吗？"
1848_reckoning.2.b:0 "我们必须坚持下去。"
1848_reckoning.3.t:0 "名存实亡"
1848_reckoning.3.d:0 "几十年前，[GetPlayer.GetRuler.GetFirstName]掌控了帝国最大的省份，并使其成为他名义上的王国。几十年后，他为[ROOT.GetCountry.GetName]确立了世袭继任制。现在，随着对开罗的不确定性逐渐浮现，我们再次将目光投向港口。"
1848_reckoning.3.f:0 "“易卜拉欣老了，病了，阿巴斯懒惰，接下来将是孩子们统治埃及。他们将如何保持住埃及？” - 穆罕默德·阿里·帕夏对阿卜杜勒迈吉德苏丹说。"
1848_reckoning.3.a:0 "[ROOT.GetCountry.GetName]是#bold独立的#!"
no_appeal_tt:0 "我们不会给苏丹任何合法性。"
1848_reckoning.3.b:0 "我的苏丹，..."
appeal_tt:0 "我们将向苏丹上诉，请求#bold House Seniority#!继任制，即王朝的长者是主要继承人。"
1848_reckoning.4.t:0 "接受上诉"
1848_reckoning.4.d:0 "好消息。苏丹已经接受了我们的上诉。我们现在采用#bold House Seniority#!继任制，即王朝的长者是主要继承人。"
1848_reckoning.4.f:0 ""
1848_reckoning.4.a:0 "[ROOT.GetCountry.GetName]现在是安全的... 目前是这样的。"
yes_hereditary_tt:0 "当前继任顺序：\n1. #high;bold Ibrahim pasha#!（儿子）\n2. #high;bold Abbas Helmy pasha#!（孙子）\n3. #high;bold Said pasha#!（儿子）"
1848_reckoning.5.t:0 "上诉被拒"
1848_reckoning.5.d:0 "坏消息。苏丹拒绝了我们的上诉。等等...这不应该发生！你不应该看到这个！你是怎么得到的-"
1848_reckoning.5.f:0 "此事件已禁用。如果你仍然能看到它，请将其报告为错误。"
1848_reckoning.5.a:0 "假装你没看到这个..."
no_hereditary_tt:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle]的总督职位将在[GetPlayer.GetRuler.GetFirstName]去世后恢复由法令任命。"
divergence_bad_tt:0 "这条路已经创建了一个#bold分歧#! #N不计算#!。倒回到一个较早的时间点，或者继续在这条未知的道路上前行。"
1848_reckoning.6.t:0 "老年痴呆"
1848_reckoning.6.d:0 "年老的岁月已经夺走了曾经强大的[GetPlayer.GetRuler.GetFirstName]。逐渐失去理智，他肯定不会久于人世。"
1848_reckoning.6.f:0 ""
1848_reckoning.6.a:0 "噢，强者是如何堕落的"
1848_reckoning.7.t:0 "年老不能统治"
1848_reckoning.7.d:0 "[GetPlayer.GetRuler.GetFirstName]已正式被宣布#N无能力#!。他的儿子和继承人[GetPlayer.GetHeir.GetFirstName]已启程前往君士坦丁堡，请求代替他的父亲成为[GetPlayer.GetRuler.GetPrimaryRoleTitle]。"
1848_reckoning.7.f:0 ""
1848_reckoning.7.a:0 "时钟滴答滴..."
ruler_abdicate_tt:0 "[GetPlayer.GetRuler.GetFirstName]将#bold退位#!，由[GetPlayer.GetHeir.GetFirstName]接替。[SCOPE.sCharacter('abbas_helmy').GetFirstName]将成为新的继承人。"
1848_reckoning.8.t:0 "时光流转"
1848_reckoning.8.d:0 "在与疾病的长时间搏斗后，[GetPlayer.GetRuler.GetFirstName]去世，使[ROOT.GetCountry.GetAdjectiveNoFlag]的统治者位置在几个月内第二次空缺。[GetPlayer.GetHeir.GetFirstName]帕夏将取代他，成为[ROOT.GetCountry.GetName]的[GetPlayer.GetRuler.GetPrimaryRoleTitle]。"
1848_reckoning.8.f:0 ""
1848_reckoning.8.a:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle]已去世。愿[GetPlayer.GetRuler.GetPrimaryRoleTitle]长存！"
1848_reckoning.9.t:0 "阿巴斯·赫尔米的就职"
1848_reckoning.9.d:0 "这确实是一个多事之年。让我们希望[GetPlayer.GetRuler.GetFirstName]帕夏及其继任者能像穆罕默德·阿里那样多产而狡猾。"
1848_reckoning.9.f:0 "至少他们中没有一个被暗杀..."
1848_reckoning.9.a:0 "为更美好的未来！"
foreign_influence_incomplete_tt:0 "在穆罕默德·阿里去世后，外国势力开始渗透埃及。#high;bold外国影响#!机制仍在开发中。敬请关注！"

je_muhammad_alis_reforms:0 "穆罕默德·阿里的改革"
 je_muhammad_alis_reforms_status:0 "在穆罕默德·阿里的有生之年改革埃及"
 je_muhammad_alis_reforms_reason:0 "在马木留克人和奥斯曼人之间，埃及受到掠夺和忽视，一直滞后。在穆罕默德·阿里的有生之年内尽可能改革埃及，因为谁知道...他的继任者可能没有那么聪明。"
 je_muhammad_alis_reforms_goal:0 "在接下来的时间内完成至少五项改革中的四项，并以任何必要的手段使埃及走上文明之路。"
 je_muhammad_alis_advance:0 "推进《穆罕默德·阿里的改革》日志条目"
 je_muhammad_alis_trade:0 "穆罕默德·阿里的改革：贸易"
 je_muhammad_alis_trade_status:0 "不惜一切代价保护埃及的贸易"
 je_muhammad_alis_trade_reason:0 "穆罕默德·阿里有效地垄断了埃及的贸易。他要求所有生产者将他们的商品卖给国家。国家则在埃及国内和对外市场上转售埃及商品，并保留盈余。"
 je_muhammad_alis_tax_farms:0 "穆罕默德·阿里的改革：赋税领地"
 je_muhammad_alis_tax_farms_status:0 "国有化埃及丰富的收成"
 je_muhammad_alis_tax_farms_reason:0 "穆罕默德·阿里通过直接掌控农田权力，将土地所有者的权力降至最低，并将土地租给农民。"
 je_muhammad_alis_corvee:0 "穆罕默德·阿里的改革：义务劳役"
 je_muhammad_alis_corvee_status:0 "在建设项目中雇用乡村农民"
 je_muhammad_alis_corvee_reason:0 "农民，是该国的核心人口，用手中的铲和另一只手中的砖更有用。"
 je_muhammad_alis_medics:0 "穆罕默德·阿里的改革：医疗"
 je_muhammad_alis_medics_status:0 "通过利用女性劳动力解决医疗问题"
 je_muhammad_alis_medics_reason:0 "穆罕默德·阿里派遣由克洛特·贝伊领导的外国外科医生和医者，教授和培训一群女性医务工作者，在开罗建立了埃及的第一所医学院。"
 je_muhammad_alis_nahda:0 "穆罕默德·阿里的改革：文艺复兴"
 je_muhammad_alis_nahda_status:0 "策划文学和文化复兴"
 je_muhammad_alis_nahda_reason:0 "由于他在教育获取方面的慷慨政策，阿拉伯文学在穆罕默德·阿里的统治期间经历了必要的复兴。"
 finished_egypt_reforms_tt: "穆罕默德·阿里的改革已经完成"


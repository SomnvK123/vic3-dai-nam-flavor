  01_afghanistan_events.99.t:0 "英国的通牒"
  01_afghanistan_events.99.d:0 "英国外交大使要求我们必须接受他们的保护，并让投靠俄国的埃米尔多斯特立马滚蛋。"
  01_afghanistan_events.99.f:0 "英国人扶持着前任国王舒贾，试图颠覆我们的统治。他们扬言如果埃米尔多斯特不离开喀布尔，那只好派遣军队将他“送”到印度养老。"
  01_afghanistan_events.99.a:0 "欢迎老国王舒贾·沙。"
  01_afghanistan_events.99.b:0 "阿富汗的弟兄们，让我们并肩和入侵的异教徒作战。"
  01_afghanistan_events.98.t:0 "逃亡的多斯特"
  01_afghanistan_events.98.d:0 "据英国大使的消息，多斯特撤出喀布尔后，逃到了北方乌兹别克人的领地，结果不幸被当地酋长抢劫了精光，人也被丢到地牢。"
  01_afghanistan_events.98.f:0 "虽然多斯特被关押在地牢，但仍有部分他的支持者在北方割据，试图收复我们的首都喀布尔。"
  01_afghanistan_events.98.a:0 "真主会庇佑多斯特·穆罕默德逃出监狱，拯救阿富汗子民。"
  01_afghanistan_events.98.b:0 "让我们把注意力集中在喀布尔的豪宅上。"

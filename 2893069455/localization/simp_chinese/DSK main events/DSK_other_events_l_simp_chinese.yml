l_simp_chinese:
 france_flavor.1.t:0 "不满情绪在人民中蔓延"
 france_flavor.1.d:0 "不满情绪在人民中蔓延"
 france_flavor.1.f:0 "七月革命后，法兰西迎来了一段黄金时期。工人农民和小资产阶级迅速壮大，然而国家政权却依旧牢牢控制正在由银行家和大地主组成[concept_monarchie_de_Juillet]手中。为争取更多政治诉求的人们慢慢形成一场风暴，并即将带来一场新的革命。"
 france_flavor.1.a:0 "真糟糕"
 france_flavor.2.t:0 "路易·波拿巴参与总统竞选"
 france_flavor.2.d:0 "路易·波拿巴参与总统竞选"
 france_flavor.2.f:0 "路易·波拿巴正式宣布参加总统职位的竞选，在竞选期间，向民众许诺“我以荣誉担保，四年后交给我继任者的是稳固了的政权和完好无损的自由”，在选举中，路易·波拿巴以重建秩序，创建强力政府，建立社会保障，整理整个社会，重建国家荣誉为宣传口号，赢得了多方面的支持，波旁王朝遗老、奥尔良王朝成员和旧贵族等君主主义者都支持路易·波拿巴，因为他是一个“比较不差的”候选人。"
 france_flavor.2.a:0 "希望他能重振法兰西荣光"
 france_flavor.2.b:0 "不，我们不想要第二个拿破仑"
 france_flavor.3.t:0 "宪法修正案"
 france_flavor.3.d:0 "拿破仑试图复辟帝制"
 france_flavor.3.f:0 "新宪法将总统任期延长至10年，还授予总统指定下任继承人的权力。路易·波拿巴准备恢复帝制，一方面路易通过各种方式制造出一种全国人民渴望总统称帝的世纪热潮，另一方面，他又努力割除建立帝国与对外战争之间的关系。作为帝国象征的鹰徽鹰旗开始到处颁发到处悬挂，总统的头像也开始出现在邮票上和货币上。"
 france_flavor.3.a:0 "通过恢复帝制的宪法！"
 france_flavor.3.b:0 "没有人可以在共和国里当皇帝！"
 france_flavor.4.t:0 "[concept_fra_empire]成立"
 france_flavor.4.d:0 "[concept_fra_empire]成立"
 france_flavor.4.f:0 "“出于怀疑心，某些人觉得帝国就是战争。而我要说，帝国就是和平。我承认，我和皇帝（拿破仑·波拿巴）一样有许多征服工作要做，我要像他一样协助分裂的党派和解，我们有广阔的荒地需要开发，道路需要开辟，港口需要疏浚，河流需要通航，运河需要竣工，我们的铁路需要完整，以上就是我要进行的征服。”——路易·波拿巴"
 france_flavor.4.a:0 "[concept_fra_empire]万岁！"
 dyn_c_French_Second_republic:0 "法兰西共和国"
 dyn_c_French_Second_republic_adj:0 "法兰西"
 dyn_c_French_Second_Impire:0 "法兰西帝国"
 dyn_c_French_Second_Impire_adj:0 "法兰西"
 je_FRA_February_revolution:0 "二月革命"
 je_FRA_February_revolution_reason:0 "七月革命以来，资本主义在法国的发展使广大工人农民和小资产阶级更加贫困。资本家腰缠万贯，但成千上万的手工业者和小业主却由于大工业的竞争而纷纷破产。农民中绝大多数是小土地所有者，他们担负着国家税收的各种苛捐杂税。\n社会危机的加深，对基佐反动政府的不满，使得全国上下反对[concept_monarchie_de_Juillet]的斗争更加激烈，要求改革选举制度，实行社会变革的呼声越来越高。"
 Form_French_Impire:0 "恢复君主制"
 Form_French_Impire_desc:0 "路易·波拿巴通过一些列经济改革，已经渐渐建立起了属于法兰西的新时代。他在很多人心中有较高的地位，政府中许多保皇党也对他颇为青睐，或许这是一个恢复帝制的不错时机？"








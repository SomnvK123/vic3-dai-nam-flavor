angelsn_union_desc:0 "从波罗的海边的什切青到亚得里亚海边的里雅斯特，已经拉下了横贯欧洲大陆的铁幕。这张铁幕后面坐落着所有中欧、东欧古老国家的首都——华沙、柏林、布拉格、维也纳、布达佩斯、贝尔格莱德、布加勒斯特和索非亚。这些著名的都市和周围的人口全都位于苏联势力范围之内，全都以这种或那种方式，不仅落入苏联影响之下，而且越来越强烈地为莫斯科所控制。”“几乎在每一处都是警察政府占了上风。到目前为止，除了捷克斯洛伐克以外，根本没有真正的民主。"

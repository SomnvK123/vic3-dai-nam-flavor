Soviet_union_end: "我们已经成立苏联"
Soviet_union1: "十月革命"
Soviet_union1_reason: "我们的敌人是什么？在我们国家，阶级矛盾已经激化到不可调和的地步，资产阶级、小资产阶级、旧贵族都是工人阶级的死敌。\n\n同志们，当革命还正在进行的时候，就是说当整个阶级在灭亡，它和一个人的死亡是完全不相同的。\n人死后尸体可以抬出去，但是旧社会在灭亡了的时候，很可惜，资产阶级的这个尸体那就不可能把它一下子订在棺材里，埋葬在坟墓里。\n资产阶级的尸体在我们的心里头腐烂着，他把毒气传染给我们大家，他在散发着臭气！\n布列斯基同志的被暗杀说明了反革命对我们的白色恐怖。被人民意志所判决的叛徒们，一定要无情地消灭他们！\n我们让资产阶级们去发疯吧！让那些无价值的灵魂去哭泣吧。工人同志们，我们的回答就是这样的。\n加上三倍的警惕，小心和忍耐，大家应当守住自已的岗位。同志们，你们必须要记住：我们只有一条出路，那就是胜利！还有另外一条出路，死亡。\n\n#N 死亡不属于工人阶级！#!"

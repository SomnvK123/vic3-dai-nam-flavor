 ideology_polk_jingoist_leader_desc:0 "该角色不仅是杰克逊民主派的忠诚信徒，支持低关税和限制联邦权力，而且坚信美利坚受到上帝感召，有着从大西洋扩张到太平洋的神圣使命。"
 government_leader_james_polk:0 "昭昭天命的承诺"
 government_leader_james_polk_reason:0 "在竞选总统的演讲中，一位杰出的候选人许诺将实现#B 美利坚的昭昭天命#!，作为#yellow 民主党#! 的重要人物，[SCOPE.sCharacter('polk_scope').GetFullName]，29岁便当选为联邦众议员，并且自#yellow 安德鲁·杰克逊#!执政以来，先后担任[ROOT.GetCountry.GetName]的众议院议长、田纳西州长，被#yellow 民主党#!视为杰克逊总统最忠实的支持者，是能够贯彻民主党精神，将民主制度传播到整个北美大陆的执行者。#B 昭昭天命观念#!主导着美利坚政府。\n\n他的执政纲领旨在实现#B 昭昭天命的扩张理念#!和#B 杰克逊民主的精神#!，以[GetLawType('law_free_trade').GetName]实现美利坚的贸易繁荣，并通过削减[concept_tariffs]、将[concept_government_expenses]纳入独立国库系统，在实现稳定财政的情况下对外扩张，将民主理念传播至整个#B 北美大陆#!。\n\n#B [SCOPE.sCharacter('polk_scope').GetFullName]#yellow 竞选承诺：#!#!\n实现[SCOPE.sCharacter('polk_scope').GetLastName]总统纲领中的各项事务，将提升此项[concept_journal_entry]的成效，相关成就将在#B 完成#!时计入。\n•[SCOPE.GetRootScope.GetCountry.GetCustom('government_leader_polk_1_checkbox')]降低关税：[SCOPE.GetRootScope.GetCountry.GetName]拥有[GetLawType('law_free_trade').GetName][concept_law]，且我国[concept_market]与[concept_world_market]的进出口总[concept_traded_quantity]#B 至少为#!#V 8k#!\n•[SCOPE.GetRootScope.GetCountry.GetCustom('government_leader_polk_2_checkbox')]解决俄勒冈边界：[SCOPE.GetRootScope.GetCountry.GetName]或其附庸取得了俄勒冈州、爱达荷州、华盛顿州\n•[SCOPE.GetRootScope.GetCountry.GetCustom('government_leader_polk_3_checkbox')]取得加利福尼亚：除松散政权以外，[SCOPE.GetRootScope.GetCountry.GetName]或其附庸完全取得了加利福尼亚州、亚利桑那州、犹他州、新墨西哥州、科罗拉多州、内华达州。\n•[SCOPE.GetRootScope.GetCountry.GetCustom('government_leader_polk_4_checkbox')]恢复独立财政制度：通过设立独立国库制，实现联邦政府自行管理政府资金，而非私有银行。需要[SCOPE.GetRootScope.GetCountry.GetName]所有已整合地区拥有[GetBuildingType('building_government_administration').GetName]，且国库资金大于0.\n•[SCOPE.GetRootScope.GetCountry.GetCustom('government_leader_polk_5_checkbox')]整合德克萨斯州：[SCOPE.GetRootScope.GetCountry.GetName]完全取得德克萨斯州，且将其纳入已整合地区"

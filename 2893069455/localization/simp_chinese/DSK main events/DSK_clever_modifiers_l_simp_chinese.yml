 usfp_gilded_age_lobby: "富裕和腐败已成为#yellow 美利坚合众国#!#v $capitalists$#!阶层的特征。大型公司越来越多地主宰着经济和地方政治，而腐败丑闻则不断降低公众对政府的信任。除非政府全面改革，否则在可预见的未来，#yellow 美利坚合众国#!仍将任由#v $capitalists$#!强盗们摆布。"

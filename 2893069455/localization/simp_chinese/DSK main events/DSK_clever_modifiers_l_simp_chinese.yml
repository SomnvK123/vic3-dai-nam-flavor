 je_the_iranian_people_lobby: "出身卑微的厨师#yellow 埃米尔·卡比尔#!厌倦了世袭官僚的社会，他希望将伊朗打造成一个#yellow 人人平等#!的共和国。"
 je_iranian_chefs_lobby: "#yellow 埃米尔·卡比尔#!的父亲是一位厨师，他尊重美味的饭菜。他希望使#yellow 波斯美食#!成为世界上口味好的代名词。"
 je_babism_lobby: "一个名叫#yellow 巴布#!的教士开始以他的神示来使人皈依。他承诺建立一个新的社会秩序，其中包括许多促进穷人生活、教育和妇女权利的进步思想。尽管他告诉他的追随者要保持和平，但对#green 什叶派#!伊斯兰教的威胁却无法忽视。"
 je_tobacco_protests_lobby: "伊朗巴扎商人和许多贫苦百姓为了反抗外国的#yellow 烟草特权#!，纷纷上街抗议，强大的人民力量将对伊朗产生怎样的冲击？"
 je_anglo_persian_oil_company_lobby: "大不列颠许诺帮助伊朗开采石油并给予分成，象征两国合作的标志——#yellow 盎格鲁-波斯石油公司#!究竟能维持多久？"
 je_empire_reborn_lobby: "#green 阿契美尼德王朝#!的法拉瓦哈，#green 萨珊王朝#!的塞矛戈，#green 萨法维王朝#!的佐勒菲卡尔圣剑都已成为历史...#green 波斯帝国#!能再次复活吗？"
 je_stand_free_stand_together_lobby: "欧洲势力的入侵加剧了#yellow 新月#!思潮在伊朗大地的传播，#green 伊朗地区#!的诸国能否摒弃统治彼此的想法，作为独立的国家团结一致？"
 je_meat_export_lobby: "为了平衡政治势力和国家发展，#yellow 巴西#!决心专注于扩大#yellow 畜牧业#!经营者的影响力。"
 je_la_plata_crysis_1_lobby: "#yellow 乌拉圭#!的不稳定政治局势，以及大国幕后操纵，引起了同为小国的#yellow 巴拉圭#!担忧，拉普拉塔盆地危机将会朝何种方向发展？"
 je_dsk_canada_Fur_Frontier_lobby: "#yellow 加拿大地区#!的毛皮资源非常丰富，加拿大人会如何继续提高#yellow 毛皮#!出口，并开拓更多生产毛皮的疆域？"
 je_Canadian_Confederation_lobby: "一个统一的#yellow 加拿大联邦#!成功诞生，在寒冷的北方边疆，联邦会怎样发展成一个各民族的乐园？"
 je_muhammad_alis_reforms_lobby: "#yellow 穆罕默德·阿里#!不止步于眼前的改革成果，他想继续改革，建立起一个强大的阿拉伯国家。"
 je_fra_monarch_lobby: "七月革命诞生的#yellow 奥尔良#!王朝能否坚持对民众开放选举的承诺，在暗流涌动的局势下保住不稳的王位？"
 je_fra_empire_lobby: "#yellow 波拿巴#!王朝在拿破仑三世的政变下再次出现在世界舞台上，作为拿破仑一世的侄子，他能再次带领#yellow 法兰西帝国#!走向辉煌吗？"
 je_fra_republic_3_lobby: "战场上的失利，人民的不满情绪，最终在引发的内战中，诞生了第三共和国。在甘必大等人主导下的#yellow 法兰西共和国#!能否对得起牺牲的将士、流血的工人同胞？"
 je_french_africa_lobby: "#yellow 法兰西#!希望将文明传播到尚未开化的非洲。未来的法兰西会走向与#yellow 黑人#!的文化冲突还是融合道路？"
 otf_born_of_jon_turks_lobby: "一批有理想的青年#yellow 土耳其人#!不满祖国的落后腐朽，决心改造自己的国家。他们将如何处理#yellow 奥斯曼#!民族冲突、君主独裁、宗教矛盾等问题？"
 dsk_je_gbr_and_Ireland_lobby: "随着工业化的推进，原本不列颠人与#yellow 爱尔兰人#!的民族冲突逐步加剧。伦敦当局能在文化、宗教等问题上解决与爱尔兰人之间的矛盾吗？"
 dsk_je_gbr_empire_lobby: "日不落帝国的四颗明珠——加拿大、澳大利亚、南非、印度，他们能逐步在#yellow 大英帝国#!的统治下，实现统一并变得更加繁荣吗？"
 dsk_gbr_Imperial_Parliament_lobby: "凭借强大的金融、军事、科技等实力，世界进入了以#yellow 不列颠#!主导的伟大时代，#yellow 大英帝国#!的全球地位还能维持多久？"
 dsk_je_gbr_global_trade_lobby: "全球四大贸易利润丰厚的海峡，其中#yellow 直布罗陀、马六甲、霍尔木兹#!已经几乎为#yellow 大不列颠#!所掌控。如果再成功控制#yellow 亚丁湾#!，#yellow 大不列颠#!将成为全球贸易的主导者。"
 je_donghak_countdown_lobby: "东学运动的兴起，让许多贫苦的朝鲜农民追求#yellow 天道教#!的信仰。朝鲜能解决即将爆发的农民起义吗？"
 je_korean_restoration_first_lobby: "承平日久的朝鲜王国，腐败丛生，以还谷、军政、田政的紊乱最为严重。国势日衰的#yellow 朝鲜王国#!能从三政紊乱的局面中脱离出来吗？"
 je_korean_restoration_second_lobby: "朝鲜成功解决了三政紊乱的问题，但要在复杂的国际局势中维持生存，走向#yellow 富国强兵#!之路至关重要。"
 je_korean_restoration_third_lobby: "新兴的科技冲击了朝鲜旧秩序，平民逐步适应铁路、蒸汽船等科技带来的生活变化。这是朝鲜新一轮的#yellow 改革时代#!。"

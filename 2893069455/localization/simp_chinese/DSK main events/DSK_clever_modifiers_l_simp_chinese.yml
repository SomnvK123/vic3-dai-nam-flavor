 notification_headlines_gbr_albert_edward_coronation_tooltip:0 "#header $notification_headlines_gbr_albert_edward_coronation_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_gbr_albert_edward_coronation_desc$"
 notification_headlines_gbr_albert_edward_coronation_name:0 "#b 爱德华国王加冕典礼 #!"
 notification_headlines_gbr_albert_edward_coronation_desc:1 "[SCOPE.sCharacter('gbr_albert_edward').GetFirstName] 于[SCOPE.sCharacter('gbr_albert_edward').GetAge]岁时在[SCOPE.sCountry('britain_scope').GetName]加冕成为[SCOPE.sCharacter('gbr_albert_edward').GetPrimaryRoleTitle]。#lore 仪式期间发生了几起小插曲，其中包括国王生病推迟加冕仪式，以及大主教带反了主教冠...尽管现场频发失误，但幽默的[SCOPE.sCharacter('gbr_albert_edward').GetFirstName]直言：我知道加冕需要排练，但没想到要排练这么多次...#!"
 notification_headlines_gbr_albert_edward_funeral_tooltip:0 "#header $notification_headlines_gbr_albert_edward_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_gbr_albert_edward_funeral_desc$"
 notification_headlines_gbr_albert_edward_funeral_name:0 "#b 爱德华国王的葬礼 #!"
 notification_headlines_gbr_albert_edward_funeral_desc:1 "[SCOPE.sCountry('britain_scope').GetName]的国王爱德华驾崩，由[SCOPE.sCharacter('new_british_monarch').GetFirstName][SCOPE.sCharacter('new_british_monarch').GetPrimaryRoleTitle]继承大统。#lore 来自全欧洲的君主和贵族纷纷前来参加国王的葬礼。全国各地都举行了特别纪念仪式以缅怀……#!"
 notification_headlines_david_livingstone_funeral_tooltip:0 "#header $notification_headlines_david_livingstone_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_david_livingstone_funeral_desc$"
 notification_headlines_david_livingstone_funeral_name:0 "#b 大卫·利文斯通的葬礼 #!"
 notification_headlines_david_livingstone_funeral_desc:1 "[SCOPE.sCountry('britain_scope').GetName]的传奇探险家#yellow 大卫·利文斯通#!遗体从非洲内陆运回祖国。#lore [SCOPE.sCountry('britain_scope').GetName]的各界精英人士纷纷前来威斯敏斯特教堂，为这位“基督教英雄、反奴隶制的斗士、科学探险的先锋”悼唁。在他的苏格兰故乡，许多居民自发举行了特别纪念仪式以缅怀……#!"
 notification_headlines_ger_bismarck_funeral_tooltip:0 "#header $notification_headlines_ger_bismarck_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_ger_bismarck_funeral_desc$"
 notification_headlines_ger_bismarck_funeral_name:0 "#b 奥托·俾斯麦的葬礼 #!"
 notification_headlines_ger_bismarck_funeral_desc:1 "铁血宰相#yellow 奥托·俾斯麦#!在他的庄园里离世，尽管[SCOPE.sCountry('german_scope').GetName]官方试图低调处理他的葬礼，但数以万计的#yellow 德意志#!人从全国各地涌入弗里德里希斯鲁，为宰相送上鲜花以及致以哀悼。#lore 全国的[SCOPE.sCountry('german_scope').GetName]国旗缓缓下降，所有剧院和公共场所关闭，只为他们的民族英雄和德意志民族情感的象征，给予最真挚的缅怀...#!"
 notification_headlines_ger_roon_funeral_tooltip:0 "#header $notification_headlines_ger_roon_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_ger_roon_funeral_desc$"
 notification_headlines_ger_roon_funeral_name:0 "#b 阿尔布雷希特·冯·罗恩的葬礼 #!"
 notification_headlines_ger_roon_funeral_desc:1 "战争部长#yellow 阿尔布雷希特·冯·罗恩#!的葬礼在柏林驻军教堂举行，作为[SCOPE.sCountry('german_scope').GetName]杰出的元帅和军队组织者，他的离世让时任宰相竟失声痛哭。[SCOPE.sCountry('german_scope').GetName]全国国旗缓缓降下为其致哀，柏林的街道上皆是前来送别的市民和军人。#lore 勃兰登堡的军乐随风而唱，随军而行的牧师为其祈祷...灵柩经过的街道，氛围庄严肃穆，军人们纷纷列队致敬...#!"
 notification_headlines_ger_helmuth_moltke_older_funeral_tooltip:0 "#header $notification_headlines_ger_helmuth_moltke_older_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_ger_helmuth_moltke_older_funeral_desc$"
 notification_headlines_ger_helmuth_moltke_older_funeral_name:0 "#b 赫尔穆特·冯·毛奇的葬礼 #!"
 notification_headlines_ger_helmuth_moltke_older_funeral_desc:1 "帝国元帅#yellow 赫尔穆特·冯·毛奇#!的葬礼在柏林举行，这位帝国军神为[SCOPE.sCountry('german_scope').GetName]统一作出巨大贡献，[SCOPE.sCharacter('new_german_monarch').GetPrimaryRoleTitle] [SCOPE.sCharacter('new_german_monarch').GetFirstName]亲自在柏林大教堂为他举行追悼会，称其为"德意志民族最纯粹、最伟大的化身之一"。在前往教堂的路上，最高陆军将帅亲自抬送他的灵柩。#lore 柏林街道两侧，两个集团军士兵列队致敬，数十万市民自发涌上街头，为他们的民族英雄和军事天才，送上最后一程..."
 notification_headlines_ger_wilhelm_1_coronation_tooltip:0 "#header $notification_headlines_ger_wilhelm_1_coronation_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_ger_wilhelm_1_coronation_desc$"
 notification_headlines_ger_wilhelm_1_coronation_name:0 "#b 威廉一世加冕典礼 #!"
 notification_headlines_ger_wilhelm_1_coronation_desc:1 "在兄长威廉四世患病离世后，[SCOPE.sCharacter('new_german_monarch').GetFirstName] 于[SCOPE.sCharacter('new_german_monarch').GetAge]岁时在[SCOPE.sCountry('german_scope').GetName]加冕成为[SCOPE.sCharacter('new_german_monarch').GetPrimaryRoleTitle]。#lore 国王本人实际上厌恶君权神授的表演，不愿举行加冕礼，但在顾问和家族的压力下，妥协放弃涂油礼，而是向宪法宣誓自己成为国王。据传言，[SCOPE.sCharacter('new_german_monarch').GetFirstName]事后直说：这复杂的典礼，就像坟墓的气息吹拂着我...#!"
 notification_headlines_ger_wilhelm_1_funeral_tooltip:0 "#header $notification_headlines_ger_wilhelm_1_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_ger_wilhelm_1_funeral_desc$"
 notification_headlines_ger_wilhelm_1_funeral_name:0 "#b 威廉一世的葬礼 #!"
 notification_headlines_ger_wilhelm_1_funeral_desc:1 "[SCOPE.sCountry('german_scope').GetName][SCOPE.sCharacter('new_german_monarch').GetPrimaryRoleTitle]威廉一世驾崩，由[SCOPE.sCharacter('new_german_monarch').GetFirstName][SCOPE.sCharacter('new_german_monarch').GetPrimaryRoleTitle]继承大统。#lore 在柏林皇宫的大教堂，所有#black 德#!#white 意#!#red 志#!邦国的君主和亲王前来参加葬礼。望向柏林的街头，成千上万的市民前来吊唁，数万名士兵持枪致敬，整个城市回荡着庄严的军乐声，宣告着#black 德#!#white 意#!#red 志#!统一的伟大时代正式落幕……#!"
 notification_headlines_aus_eduard_taaffe_funeral_tooltip:0 "#header $notification_headlines_aus_eduard_taaffe_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_aus_eduard_taaffe_funeral_desc$"
 notification_headlines_aus_eduard_taaffe_funeral_name:0 "#b 爱德华·塔菲的葬礼 #!"
 notification_headlines_aus_eduard_taaffe_funeral_desc:1 "帝国首相#yellow 爱德华·塔菲#!的葬礼在#yellow 维也纳#!的圣斯蒂芬大教堂举行，作为[SCOPE.sCountry('austria_scope').GetName]的首相，他一生都在各民族之间妥协以维持帝国的稳定。#lore 遗憾的是，没有哪个民族和派系对他满意，只有[SCOPE.sCharacter('new_austria_monarch').GetPrimaryRoleTitle] [SCOPE.sCharacter('new_austria_monarch').GetFirstName]派人组织参与他隆重的葬礼。美泉宫窗外，一位老人默默摘下礼帽:塔菲伯爵，我唯一的朋友，我无法再保护你了...#!"
 notification_headlines_aus_franz_josef_I_coronation_tooltip:0 "#header $notification_headlines_aus_franz_josef_I_coronation_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_aus_franz_josef_I_coronation_desc$"
 notification_headlines_aus_franz_josef_I_coronation_name:0 "#b 弗朗茨·约瑟夫继位 #!"
 notification_headlines_aus_franz_josef_I_coronation_desc:1 "维也纳的革命动乱迫使疯子#yellow 斐迪南一世#!退位，其侄子[SCOPE.sCharacter('new_austria_monarch').GetFirstName] 于[SCOPE.sCharacter('new_austria_monarch').GetAge]岁时在[SCOPE.sCountry('austria_scope').GetName]宣布成为[SCOPE.sCharacter('new_austria_monarch').GetPrimaryRoleTitle]。#lore 身着军装的皇帝意图展示武力与秩序，但这位年轻的先生能否掌控[SCOPE.sCountry('austria_scope').GetName]混乱的局面？#!"
 notification_headlines_aus_franz_josef_I_funeral_tooltip:0 "#header $notification_headlines_aus_franz_josef_I_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_aus_franz_josef_I_funeral_desc$"
 notification_headlines_aus_franz_josef_I_funeral_name:0 "#b 弗朗茨·约瑟夫的葬礼 #!"
 notification_headlines_aus_franz_josef_I_funeral_desc:1 "[SCOPE.sCountry('austria_scope').GetName][SCOPE.sCharacter('new_austria_monarch').GetPrimaryRoleTitle]弗朗茨·约瑟夫一世驾崩，由[SCOPE.sCharacter('new_austria_monarch').GetFirstName][SCOPE.sCharacter('new_austria_monarch').GetPrimaryRoleTitle]继承大统。#lore 灵柩缓缓经过霍夫堡宫，所有帝国皇室成员和政要前往参加葬礼。维也纳体系的旧秩序和老[SCOPE.sCharacter('new_austria_monarch').GetPrimaryRoleTitle]一起随风而逝，#yellow 哈布斯堡#!王朝的未来将走向何方…#!"
 notification_headlines_usa_lincoln_funeral_tooltip:0 "#header $notification_headlines_usa_lincoln_funeral_name$#!\n$TOOLTIP_DELIMITER$\n$notification_headlines_usa_lincoln_funeral_desc$"
 notification_headlines_usa_lincoln_funeral_name:0 "#b 亚伯拉罕·林肯的葬礼 #!"
 notification_headlines_usa_lincoln_funeral_desc:1 "[SCOPE.sCountry('america_scope').GetName][SCOPE.sCharacter('new_america_president').GetPrimaryRoleTitle]亚伯拉罕·林肯伤重去世，由[SCOPE.sCharacter('new_america_president').GetFirstName][SCOPE.sCharacter('new_america_president').GetPrimaryRoleTitle]接任职位。#lore 林肯的灵柩装在特别列车，沿着铁路线驶向他的家乡斯普林菲尔德，途径城市的居民纷纷守候在铁路边，向他们的英雄致敬。超过四分之一的民众，为了瞻仰总统的遗容，排成长队步行前往城市。殉道者终究实现了#yellow 美利坚#!民族的团结…#!"

 je_the_islands:0 "收复马尔维纳斯群岛"
 je_the_islands_reason:0 "1833年，无耻的英国人夺走了马尔维纳斯群岛。尽管英国战争机器的力量是毋庸置疑的，但我们必须把这群海盗从群岛赶出去。"
 je_the_wayward_province:0 "叛逃的省份"
 je_the_wayward_province_reason:0 "自从何塞·阿蒂加斯在我们革命开始时拒绝向布宜诺斯艾利斯低头以来，乌拉圭的命运就由外国势力掌控。首先是巴西人，他们无耻地入侵了该地区，而我们的军队当时在帮助智利和秘鲁实现独立。然后是欧洲大国，当时乌拉圭人民的意愿是与联合省统一，他们却在1828年迫使乌拉圭人民达成妥协，承认乌拉圭独立。阿根廷人的意志是最强大的力量，通过它，我们将与兄弟们团聚。"
 je_what_belgrano_could_not:0 "未竟的事业"
 je_what_belgrano_could_not_reason:0 "5月革命发生时，曼努埃尔·贝尔格拉诺将军率领一支军队北上对抗西班牙保皇派。尽管军事行动以失败告终，但巴拉圭很快摆脱了西班牙的枷锁。巴拉圭革命取得了胜利，却没有加入他们在南部的阿根廷兄弟，而是被精神病患者何塞·德·弗朗西亚·伊·贝拉斯科劫持。这个疯狂的暴君本想建立一个乌托邦社会，但最终却建立了一个由他领导的独裁政权。我们必须恢复巴拉圭的秩序，完成贝尔格拉诺未竟的事业。"
 je_the_tarija_question:0 "塔里哈问题"
 je_the_tarija_question_reason:0 "塔里哈是合法的阿根廷领土，玻利维亚人侵占了这里，焚毁了我们的家园。我们的意志必须强加在该地区。"

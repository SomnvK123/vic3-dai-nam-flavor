 je_habsburg_monarchy_lobby:0 "#yellow 弗朗茨一世#!于遗嘱里要求创建的一个权力机构，其地位高于国务院。国务会议必须审议凯撒交办的重大事项或者国务院有不同意见的事项，然而这个部门自成立初期就陷入了由#yellow 克莱门斯·梅特涅#!领导的#yellow 梅特涅派#!和由#yellow 弗朗茨·安东·冯·科洛夫拉特·利布施泰因茨基伯爵#!领导的#yellow 波西米亚派#!的激烈政治斗争。任何改革都必将遭到另一派的全力阻挠。"
 je_aus_absolutism_main_lobby:0 "哈布斯堡的权威恢复之后，凯撒将开始按首相的建议治理国家。他对那些传统权威中心不予理睬，废除了各省的贵族等级会议，完全依靠其#yellow 官僚机构、警察和军队#!的权威去推行自己的意志，这也是向极端绝对主义的演变，将不带有任何巴洛克时代的优雅，但这也是一种带有现代化之紧迫使命的现代形式的绝对主义。"
 je_aus_liberal_reform_main_lobby:0 "#yellow 凯撒#!很不情愿地接受了立宪主义的咒语。由于立宪派所迫，他没有别的选择。#yellow 1849帝国宪法（Reichsverfassung—von—1849）#!在帝国内建立了一个两院制的议会，这标志着帝国#yellow 宪政改革#!的开始。"
 je_Austrian_Empire_revolution_lobby:0 "人民摧毁了梅特涅亲王的政权，使他可耻地逃亡国外后。由#yellow 凯撒#!任命人选的新#yellow 自由派政府#!已经被组建，他们将承担改革国家的重任。然而，革命者内部并不团结， 他们的胜利不过是只归功于各对现状感到不满阶层组成的#yellow 政治联盟#!。这种联盟一旦无法维系，出现分裂，那么问题就会发生。#yellow 宪政派#!和#red 激进派#!都想决定新政权的发展方向。"
 je_aus_dual_monarchy_reform_lobby:0 "#yellow 凯撒#!决心自行统治内莱塔尼亚，而#yellow 爱德华·塔菲#!看来十分适合于履行他的意志。最初，#yellow 爱德华·塔菲#!在自己的政府中保留了温和自由派，但他也劝说捷克人重返内莱塔尼亚的政治生活，同时争取到波兰人的支持。但由于#yellow 匈牙利#!地位的不断提升，现在这个新的内阁将带领君主国走向尚不明晰的未来。"
 je_Westernization_movement_lobby:0 "#yellow 中国#!无可避免地被卷入了列强的争端，加入了世界舞台。经历过工业革命的西方各国科技显然领先我们，如果不能师夷长技以制夷，中体西用，#yellow 中国#!将在世界舞台上将变得难以为继。"
 je_Pentecostal_Variation_lobby:0 "以#yellow 康有为#!和#yellow 梁启超#!为首的知识分子，希望借助皇帝的力量实施变法，从制度上学习西方实现现代化。"
 je_china_19th_century_lobby:0 "大丈夫七尺躯，既以身许国，难复许卿。此去若得生还，实属万幸。倘有不测，毋悲毋戚。可拾吾骨归故里，瘗于春芳灼灼之地。今山河板荡，望诸君勠力共济，使后世子孙得离斯厄。"

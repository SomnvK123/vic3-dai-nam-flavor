 notification_headlines_mosque_of_djenne_desc:1 "曾经有过几十年的年久失修，现在[SCOPE.sState('djenne_scope').GetName]的[SCOPE.sBuilding('mosque_of_djenne_scope').GetName]已经重建。#lore 这座至少可以追溯到 1300 年代的巨大泥砖结构已在原址上完全重建。清真寺的重新开放日举办了一个伟大的节日，吸引了……#!"
 notification_headlines_eiffel_tower_tooltip:0 ""
 notification_headlines_eiffel_tower_name:0 "#b 巴黎铁塔世界第一 #!"
 notification_headlines_eiffel_tower_desc:1 "[SCOPE.sBuilding('eiffel_tower_scope').GetName]现在主导[SCOPE.sState('eiffel_state').GetCityHubName]的天际线。#lore 该塔采用开创性的金属加工和工程技术建造，高1000多英尺。争议继续围绕着塔楼的设计，其中……#!"
 notification_headlines_first_skyscraper_tooltip:0 ""
 notification_headlines_first_skyscraper_name:0 "#b 摩天大楼真的触碰天空 #!"
 notification_headlines_first_skyscraper_desc:1 "[SCOPE.sCountry('first_skyscraper_country').GetName]在[SCOPE.sState('first_skyscraper_state').GetCityHubName]建造了世界上第一座“摩天大楼”。#lore 这座令人惊叹的新建筑采用最新的建筑材料和技术建造，完全由结构钢框架支撑。新设计引起了政府检查员的一些担忧，他们……#!"

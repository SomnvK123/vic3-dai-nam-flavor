 notification_headlines_victoria_coronation_desc:1 "[SCOPE.sCharacter('queen_victoria').GetFirstName] 于[SCOPE.sCharacter('queen_victoria').GetAge]岁时在[SCOPE.sCountry('britain_scope').GetName]加冕成为[SCOPE.sCharacter('queen_victoria').GetPrimaryRoleTitle]。#lore 仪式期间发生了几起小插曲，其中包括一位年迈的贵族在女王宝座台阶上意外跌倒。值得赞扬的是，新女王亲自上前帮助那位贵族……#!"

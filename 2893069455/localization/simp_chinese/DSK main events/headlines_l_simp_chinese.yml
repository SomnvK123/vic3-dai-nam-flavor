 notification_headlines_scandinavia_formed_desc:1 "[SCOPE.sCountry('scandinavia_scope').GetName]的各个北方国家组成了联合政府。#lore 统一的斯堪的纳维亚新国旗已经公布，并与每个成员国的国旗一起升起。新首相用多种语言干杯，以致敬……#!"

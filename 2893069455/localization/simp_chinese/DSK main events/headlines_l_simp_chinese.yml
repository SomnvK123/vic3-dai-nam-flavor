 notification_headlines_french_commune_desc:1 "法国公社控制了政府，并宣布[SCOPE.sCountry('france_scope').GetName]成立。#lore 巴黎街头红旗招展，庆祝新政权的诞生。一无所有的贵族们逃往欧洲大陆各地，在外国入境口岸出现......  #!"

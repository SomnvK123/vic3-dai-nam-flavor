 notification_headlines_roman_republic_tooltip:0 ""
 notification_headlines_roman_republic_name:0 "#b 教皇被赶出罗马 #!"
 notification_headlines_roman_republic_desc:1 "共和主义激进分子占领了永恒之城，并宣布成立[SCOPE.sCountry('rome_scope').GetName]。#lore 据称，教宗圣座在梵蒂冈被接管之前就伪装出逃了。新的选举遭到了虔诚的抵制……#!"
 notification_headlines_cristo_redentor_tooltip:0 ""
 notification_headlines_cristo_redentor_name:0 "#b 世界最高耶稣像 #!"
 notification_headlines_cristo_redentor_desc:1 "[SCOPE.sBuilding('cristo_redentor_scope').GetName]已经完工，俯瞰整个[SCOPE.sState('rio_scope').GetCityHubName]。#lore 这座雕像高100英尺，是基督教在世界范围内的一栋奇观。开幕式当晚，宏伟的身像被照亮……#!"
 notification_headlines_statue_of_liberty_tooltip:0 ""
 notification_headlines_statue_of_liberty_name:0 "#b 纽约上空的自由之光 #!"
 notification_headlines_statue_of_liberty_desc:1 "[SCOPE.sBuilding('statue_of_liberty_scope').GetName]座落于[SCOPE.sState('new_york_scope').GetCityHubName]之上，欢迎新大陆的每一位到访者。#lore 这尊自由的伟大雕像是在法国设计和组装的，作为送给美国人民的礼物。为雕像筹集资金的努力是由……#!"
 notification_headlines_big_ben_tooltip:0 ""
 notification_headlines_big_ben_name:0 "#b 伦敦桥要倒了，要倒了，要倒了 #!"
 notification_headlines_big_ben_desc:1 "[SCOPE.sBuilding('big_ben_scope').GetName]已在[SCOPE.sState('home_counties_scope').GetCityHubName]中竣工。#lore 大钟被十六匹马拉着穿过街道，花了一整天的时间才抬进塔楼。它的四个大钟面已经过精确校准……#!"
 notification_headlines_mosque_of_djenne_tooltip:0 ""

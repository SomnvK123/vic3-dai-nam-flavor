je_laristan_payment_reason: "尽管阿曼是趁我们内乱，抢占了拉里斯坦的部分领土。但崇尚和平的我们，决定向#yellow 赛义德#!苏丹支付一笔不菲的费用，以赎回霍尔木兹的领土。一旦我们向#yellow 阿曼#!付款完毕，就可以收回拉里斯坦的海岸线。"

afghan_union_tt: "注意：我们至少与任何一个阿富汗军阀保持友好关系并与其接壤,若其威望低于我们，将同意被我们吞并（符合条件的将显示在下方）。"
peaceful_afghan_union_button: "邀请自由的阿富汗州"
peaceful_afghan_union_button_desc: "剑的道路没有把阿富汗团结起来。是时候我们放下分歧，成为一个国家了。"


cede_herat_button:0 "割让赫拉特"
cede_herat_button_desc:0 "将赫拉特让给波斯。"

cede_balkh_button:0 "割让巴尔赫"
cede_balkh_button_desc:0 "将巴尔赫让给布哈拉。"

cede_pashtunistan_claim_button:0 "撤销您的索赔"
cede_pashtunistan_claim_button_desc:0 "放弃对普什图尼斯坦的索赔。"

cede_kalat_claim_button:0 "撤销您的索赔"
cede_kalat_claim_button_desc:0 "放弃对卡拉特的索赔。"

remove_persias_claim_button:0 "撤销波斯的索赔"
remove_persias_claim_button_desc:0 "如果我们能够取悦波斯或让他们欠我们一个人情，那么我们可以和平地撤销他们对赫拉特的索赔。"

remove_bukharas_claim_button:0 "撤销布哈拉的索赔"
remove_bukharas_claim_button_desc:0 "如果我们能够取悦布哈拉或让他们欠我们一个人情，那么我们可以和平地撤销他们对巴尔赫的索赔。"
guerrilla_war_button:0 "游击战争"
guerrilla_war_button_desc:0 "我们应该继续骚扰英国人并分散他们的兵力。如果他们不得不为每一场小冲突派遣部队，他们就无法适当地保卫首都。"

encourage_revolt_button:0 "鼓励叛乱"
encourage_revolt_button_desc:0 "我们得到的报告显示，喀布尔市的英国驻军在人民中极不受欢迎。我们应该鼓励他们“解决这个问题”。"
je_afghanistan_fractured:0 "破碎的帝国"
je_afghanistan_fractured_reason:0 "杜拉尼帝国已经破碎成几个州。如果我们能征服每一个州，我们就能统一成一个国家。只有这样，我们才有机会对抗眼睛盯着我们土地的俄罗斯和英国。"

je_afghanistan_fractured_durrani:0 "破碎的帝国"
je_afghanistan_fractured_durrani_reason:0 "杜拉尼帝国已经破碎成几个州。如果我们能让其他州屈服于我们，那么我们的帝国将再次完整。只有这样，我们才有机会对抗眼睛盯着我们土地的俄罗斯和英国。"

je_afghanistan_fractured_kabul:0 "唯一的人"
je_afghanistan_fractured_kabul_reason:0 "俄罗斯和英国贪婪地注视着这个地区。只有一个人拥有铁的意志、军事才能和人民的尊重，才能将这些破碎的酋长国团结起来，以对抗伟大的强国：多斯特·穆罕默德·汗。"
je_herat:0 "赫拉特"
je_herat_reason:0 "马哈茂德·沙阿·杜拉尼在将多斯特·穆罕默德的兄弟处决后逃到了赫拉特，而他的兄弟唯一的罪过就是帮助他重登宝座。现在，他的残忍儿子统治着这片土地。不可信任的杜拉尼氏族再也不能在这片土地上掌权。"

je_kandahar:0 "坎大哈"
je_kandahar_reason:0 "迪尔兄弟是没有权力统治坎大哈的机会主义者。他们为继承这个酋长国而争斗将导致坎大哈的毁灭。"

je_balkh:0 "巴尔赫"
je_balkh_reason:0 "占据巴尔赫大部分地区的汗国甚至不能统治整个地区。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]将统一他们，让他们统一在一面旗帜下。"

je_maimana_unified_khanate:0 "统一的汗国"
je_maimana_unified_khanate_reason:0 "与该地区其他的酋长国和沙阿国相比，我们的文化更加多元，没有统治地位的普什图人。我们可以为我们重新塑造这个地区，最终取代普什图人。尽管如此，我们并没有完全统治巴尔赫。我们只是在这片土地上最大的汗国。如果我们想把我们的人民统一成一个合适的战斗力量，那么我们需要酋长获得足够的支持召开库鲁泰会选举他为所有人的汗国。"

je_the_great_game_afghanistan:0 "大博弈"
je_the_great_game_afghanistan_reason:0 "英国和俄罗斯都在争夺该地区的控制权。如果我们继续被大国视为劣等民族，那么他们将对他们认为“落后”的民族的事务干预毫无顾忌。历史路线：如果你失败了。"

je_the_absolute_worst:0 "最坏的时刻"
je_the_absolute_worst_reason:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]大部分时间都在流亡中以折磨仆人为乐。现在英国人帮助他从多斯特·穆罕默德那里夺回了王位，他继续对待人民残忍。他的臣民渴望多斯特·穆罕默德的回归，这使得[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]成为刺杀的主要目标。#italic 在你拥有这个日志条目时，你将会收到刺杀事件。"
je_british_garrison:0 "英国驻军"
je_british_garrison_reason:0 "进度条将增加1，每当以下利益集团中的一个人的支持度低于-5或更差：地主、武装部队、虔诚者和乡村民众。\n\n#italic 人们对英国驻军占领我们的城市并用包容的聚会和奢侈品炫耀他们的财富感到不满。我们可能不得不摆脱[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]，尽管我们需要他和他的驻军来防御军事威胁。我们要冒叛乱的风险，还是被阿克巴尔·汗入侵？按照这种进展速度，两者都会发生。"
je_british_garrison_goal:0 "不满情绪达到临界点，人民起来反抗英国。"

je_overthrow_shuja:0 "推翻舒贾"
je_overthrow_shuja_reason:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 的父亲，多斯特·穆罕默德，在英国将其傀儡扶正前统治着整个喀布尔。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 继续对仍驻守在城市的英国军队进行游击战，但让人民起来反抗英国并去除他们麻烦的驻军或等待他们暗杀他们残忍的新沙阿可能更简单。为什么不两者都做？"
je_vizier_vs_shah:0 "大臣VS沙阿"
je_vizier_vs_shah_reason:0 "每个月，只要地主强大，进度条就会增加1，如果他们在政府中，还会增加1。\n\n#italic [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 正在与他的首相，亚尔·穆罕默德，进行一场权力斗争。如果不是因为穆罕默德·哈扎拉的忠诚，他早就推翻了残酷而不受欢迎的沙阿。谁将会胜出？"
je_vizier_vs_shah_goal:0 "亚尔·穆罕默德在国家内部占据主导地位足够长的时间，以至于他有信心推翻沙阿。"

je_vizier_coup:0 "大臣政变"
je_vizier_coup_reason:0 "[SCOPE.sCharacter('yazer_scope').GetFullName] 正处于他的皇家政变中。"
je_vizier_coup_goal:0 "[SCOPE.sCharacter('yazer_scope').GetFullName] 准备执行政变。"

je_impending_civil_war:0 "即将爆发内战"
je_impending_civil_war_reason:0 "[SCOPE.sCharacter('yazer_scope').GetFullName] 选择战争，而不是在成为沙阿的斗争中后退。"

je_graveyard_of_empires:0 "帝国坟墓"
je_graveyard_of_empires_reason:0 "每个时代最强大的帝国都犯了入侵我们土地的错误。他们从未停留太久，最终都成为我们墓地中的一块石碑。是时候我们开始挖另一个坑了。"

je_russia_flood_of_opium:0 "向俄罗斯洪水般输送鸦片"
je_russia_flood_of_opium_reason:0 "俄罗斯人喜欢酒精，但喝醉了还不够。让他们沉迷于鸦片，真正毁掉他们的人口。"

je_britain_flood_of_opium:0 "向英国洪水般输送鸦片"
je_britain_flood_of_opium_reason:0 "英国人通过让清朝人沉迷于鸦片来削弱他们的人口。是时候我们效仿他们的做法了。"

je_a_new_game_russia:0 "全新的游戏"
je_a_new_game_russia_reason:0 "我们已经成功地建立了足够强大的力量来保持独立。为什么要坐等俄罗斯最终回来，而不是向他们发起进攻呢？让我们看看他们被征服的滋味如何。"

je_a_new_game_britain:0 "全新的游戏"
je_a_new_game_britain_reason:0 "我们已经成功地建立了足够强大的力量来保持独立。为什么要坐等英国最终回来，而不是向他们发起进攻呢？让我们看看他们被征服的滋味如何。"

je_hostile_takeover:0 "敌意接管"
je_hostile_takeover_reason:0 "东印度贸易公司是一个邪恶的公司，只要该公司存在，该地区的人民永远不会安全。"

je_pharmaceutical_giant:0 "制药巨头"
je_pharmaceutical_giant_reason:0 "当鸦片在使用中负责时，它对医疗目的非常有效。我们应该建立自己的医疗设施和研究实验室，而不是专注于向他人出售。"
 
je_the_great_northern_players:0 "伟大的北方玩家"
je_the_great_northern_players_reason:0 "俄罗斯每天都在侵占我们的北部边境。我们必须迅速与北部的汗国结盟，防止这种情况发生。"

je_the_great_western_player:0 "伟大的西方玩家"
je_the_great_western_player_reason:0 "波斯是一个强大的独立中东国家，但更重要的是不像其他国家那样具有侵略性，如奥斯曼帝国或埃及。如果我们能解决他们对赫拉特的主张，那么我们将拥有一个强大的盟友。"

je_the_great_eastern_player:0 "伟大的东方玩家"
je_the_great_eastern_player_reason:0 "与锡克帝国结盟可能非常危险，因为我们可能会被卷入他们与东印度贸易公司的战争中。另一方面，如果我们合作，我们可以阻止该公司向西扩张。"

je_the_great_southern_players:0 "伟大的南方玩家"
je_the_great_southern_players_reason:0 "如果南方国家倒下，我们的敌人就会有一个地方可以解除他们所有士兵，并到达我们的边界。"

je_the_great_players:0 "反大博弈者"
je_the_great_players_reason:0 "如果越多的国家在伟大国家的控制下倒下，对于征服我们余下的国家来说就越容易。如果中东和中亚要保持独立，我们必须团结一致。"

je_khorasan_ascendant:0 "呼罗珊的崛起"
je_khorasan_ascendant_reason:0 "尽管大多数人仍将[COUNTRY.GetName]称为呼罗珊。重建真正的呼罗珊将为我们提供扩张的正当理由，以至于我们不再担心生存。"

je_the_impenetrable_coast:0 "不可逾越的海岸"
je_the_impenetrable_coast_reason:0 "如果我们能阻止敌人毫无阻碍地航行到我们的国家，他们就会三思而后行，不轻易入侵。"

je_whats_ours_is_ours:0 "我们的就是我们的"
je_whats_ours_is_ours_reason:0 "我们必须解决所有的领土争端，这样我们就不必担心我们的邻居了。"

je_the_northern_wall:0 "北墙"
je_the_northern_wall_reason:0 "我们需要控制一个缓冲区域来保卫我们祖国的内陆部分。这也会让我们获得该地区游牧民族的接触，以在需要时壮大我们的军队。"




 je_khiva_great_game: "大博弈"
je_khiva_great_game_reason:1 "英国和俄罗斯都在争夺该地区的控制权。如果我们希望在这场游戏中活下来，就必须在两者之间保持微妙的平衡。"
russia_khiva_button:1 "俄罗斯进展 - 喀什: #variable [GetGlobalVariable('russian_progress_khiva').GetValue|0]#! (#tooltippable;tooltip:[ROOT.GetCountry.GetTooltipTag],je_khiva_great_game_russian_var_tooltip [GetGlobalVariable('russian_progress_khiva_next').GetValue|1+=]#!)"
russia_khiva_button_desc: "俄罗斯熊日渐对更多土地感到饥渴。"

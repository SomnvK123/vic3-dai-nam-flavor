uf_general_events.2.t: "平等主义蔓延"
uf_general_events.2.d: "有关平等的书籍和思想开始在我们的边界内出现。"
uf_general_events.2.f: "“人人都在谈论这个新概念：人人平等。很确定上帝早就宣布过这一点，而我们大多数人都忽视了，但是嘿，也许我们会听书本上的人。”"
uf_general_events.2.a: "禁止这些书籍，并逮捕传播它们的人。"
uf_general_events.2.b: "让知识分子们在咖啡馆里浪费时间争论这些无聊的事情。"
uf_general_events.2.c: "他们提出了很多很好的观点。也许我们应该鼓励这种思维。"

uf_general_events.3.t: "人权蔓延"
uf_general_events.3.d: "有关完全平等的书籍和思想开始在我们的边界内出现。"
uf_general_events.3.f: "“人权和平等主义之间究竟有什么区别？我们现在只是更加相信平等主义吗？”"
uf_general_events.3.a: "禁止这些书籍，并逮捕传播它们的人。"
uf_general_events.3.b: "让知识分子们在咖啡馆里浪费时间争论这些无聊的事情。"
uf_general_events.3.c: "他们提出了很多很好的观点。也许我们应该鼓励这种思维。"

uf_general_events.4.t: "破坏规则者"
uf_general_events.4.d: "这个游戏一直在考验我们的耐心。我们终于拿到了我们想要的。"
uf_general_events.4.f: "“大博弈？更像是等待的游戏，对吧？”"
uf_general_events.4.a: "英国对我们不按照他们制定的规则感到愤怒。"

uf_general_events.5.t: "破坏规则者"
uf_general_events.5.d: "这个游戏一直在考验我们的耐心。我们终于正在拿我们想要的。"
uf_general_events.5.f: "“大博弈？更像是等待的游戏，对吧？”"
uf_general_events.5.a: "俄罗斯对我们不按照规则行事感到愤怒。我们制定了规则。我们可以做任何我们想做的事情。"
 
uf_general_events.6.t: "破坏规则者"
uf_general_events.6.d: "这个游戏一直在考验我们的耐心。我们终于正在拿我们想要的。"
uf_general_events.6.f: "“大博弈？更像是等待的游戏，对吧？”"
uf_general_events.6.a: "俄罗斯对我们不按照规则行事感到愤怒。我们制定了规则。我们可以做任何我们想做的事情。"
 
 #Persia
01_persia_events.1.t:0 "波斯皇宫"
01_persia_events.1.d:0 "我们的新首都#yellow 设拉子#!已建成，但尚未完工。这些神圣的大厅将再次成为我们辉煌的象征，并将永存至世界末日。让我们只希望另一个“亚历山大大帝”不会再次焚毁图书馆。"
01_persia_events.1.f:0 "我忠诚的子民们！今日，我们共同见证波斯伟大血脉的又一次搏动——正如星辰循天命指引方向，我们的王座将迁往#yellow 设拉子#!这片流淌着永恒诗意的土地。这座用玫瑰与夜莺筑就的城池，是萨迪智慧凝成的琥珀，是哈菲兹诗行浇灌的圣殿。我们将在此铸造新时代的《列王纪》——商队将从布什尔港带来法兰克的火器与学识，灌溉水渠将如密特拉神的血脉滋养农田。\n\n当设拉子的#yellow 石榴花#!再次染红城墙时，整个世界都将跪拜在波斯文明重生的光芒之下！"
01_persia_events.1.a:0 "它需要更加奢华！我们正在努力留下深刻印象！"
01_persia_events.1.b:0 "它不能仅仅依靠威望，必须充满最现代和实用的技术。"

01_persia_events.2.t:0 "万王之王"
01_persia_events.2.d:0 "现在，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]已成为当之无愧的万王之王，他必须选择如何设置他的宫廷。"
01_persia_events.2.f:0 "居鲁士大帝是第一位万王之王。您正在踏入帝国创始人的鞋子...不过，我的国王，请不要有压力。"
01_persia_events.2.a:0 "我们的帝国将是多元文化的，我们的宫廷必须反映出这一点。"
01_persia_events.2.b:0 "它将充满将军和战争专家，以扩张我们日益壮大的帝国。"
01_persia_events.2.c:0 "像大流士大帝一样，我们将专注于创建一个广阔的集权帝国。"

01_persia_events.3.t:0 "回归琐罗亚斯德教"
01_persia_events.3.d:0 "如果我们希望迈向伟大的伊朗帝国的步伐，我们必须#yellow 摆脱伊斯兰的枷锁#!，回到遵循先知扎拉图斯特拉的教导的生活方式。"
01_persia_events.3.f:0 "良好的思想，良好的言语，良好的行为。还需要什么来过上美好的生活呢？"
01_persia_events.3.a:0 "只有出生于两个#yellow 琐罗亚斯德教#!父母的孩子才能信仰我们的信仰，许多人正在从隐藏中走出来。父母有责任重新使国家繁衍。"
01_persia_events.3.b:0 "如果要使其蓬勃发展，我们必须允许任何人成为琐罗亚斯德教徒。"
01_persia_events.3.c:0 "我们仍将尊重穆斯林的传统。"

01_persia_events.4.t:0 "中亚病夫"
01_persia_events.4.d:0 "我们必须决定一条通向生存的道路，在这个新时代。古老的帝国如果不能接纳崭新的工业机器，那它将被命运的齿轮无情地碾碎，湮没在历史的尘埃。"
01_persia_events.4.f:0 "尽管被世界上一些最伟大的帝国征服，但#yellow 伊朗#!在过去40年里一直自由完整。现在他的主权受到强权的威胁，#yellow 俄国#!在23年前的《古利斯坦条约》夺走了我们#yellow 高加索#!许多省份，并且似乎不满足于此；#yellow 英国#!也控制了海湾的几个阿拉伯酋长国，尝试夺走我们在#yellow 波斯湾#!的势力范围。#yellow 伊朗#!的命运究竟何去何从，我们的#yellow 恺加国王#!能带领我们摆脱外来者的统治吗？"
01_persia_events.4.a:0 "只有通过回顾我们的过去，我们才能不仅生存，而且再次变得伟大。"
01_persia_events.4.b:0 "我们不能独自做到这一点。我们必须向中东邻国伸出援手。"
01_persia_events.4.c:0 "我们只需要资助我们的军队。皇储的首席大臣强烈推荐他的...厨师的儿子？"

01_persia_events.5.t:0 "第四次尝试"
01_persia_events.5.d:0 "我们做到了！我们无畏的万王之王创建了#yellow 第四个#!伟大的#yellow 伊朗帝国#!。从现在开始，我们将以我们伟大的王朝而闻名。"
01_persia_events.5.f:0 "我们不能停止。我们必须更努力地成为不仅是最伟大的伊朗帝国，而且是我们时代最伟大的帝国。"
01_persia_events.5.a:0 "#yellow 英国人#!和#yellow 俄罗斯人#!长期以来一直在争夺我们的土地。是时候我们向他们发起进攻了。"
01_persia_events.5.b:0 "没有目的的权力是毫无价值的。我们与印度之间一直存在着纽带，我们也将解放他们，就像#yellow 纳迪尔沙#!那样。"
01_persia_events.5.c:0 "如果我们不参与对#yellow 非洲#!的争夺，欧洲列强将使我们落后。"

01_persia_events.6.t:0 "商讨亚美尼亚的地位"
01_persia_events.6.d:0 "我们再次将#yellow 亚美尼亚#!纳入伟大的#yellow 伊朗帝国#!的摇篮中。现在是时候讨论如何处理亚美尼亚人在我们国家的地位了。"
01_persia_events.6.f:0 "马兹达克高呼平分财富时，#yellow 卡瓦德一世#!看到的不是光明，而是#v $aristocrats$#!的獠牙——正如今日某些人要将亚美尼亚人的#yellow 教堂改作祆祠#!！\n\n遥想#yellow 科斯罗埃斯#!的铁骑能踏碎白匈奴，却踏不碎亚美尼亚人刻在十字架上的尊严。当年，#yellow 霍斯劳二世#!若懂得用亚美尼亚骑士的长矛而非波斯总督的税吏，何至于被阿拉伯弯刀斩断命脉？这浸透鲜血的高加索土地，本应是波斯战车最坚韧的辐条，而非插进心脏的匕首。"
01_persia_events.6.a:0 "像萨珊王朝一样，我们必须欢迎他们，否则我们将面临毁灭性的基督徒起义。"
01_persia_events.6.b:0 "萨珊王朝接纳#yellow 亚美尼亚人#!进入帝国，最终导致局势失控，从此一蹶不振。"
01_persia_events.6.c:0 "他们将成为一个服从我们的大总督，帮助我们驻守北方边境。"
01_persia_events.6.e:0 "我们满足于将他们从我们的敌人手中夺回，让他们塑造自己的命运吧。"
01_persia_events.7.t:0 "复活巴比伦"
01_persia_events.7.d:0 "巴比伦再次崛起，许多西方异教徒好奇地打量我们会如何处置这个古老的国度，迫切希望我们能提供给他们探险和挖掘文物的机会。"
01_persia_events.7.f:0 "#yellow 巴比伦人#!是古代最伟大和最富有的文明之一，巴比伦空中花园是他们永恒不朽的证明。我们应该考虑让他们重建那些花园，当然作为回报，他们脚底下宝贵的#yellow 黑色金子#!应当归属于我们。"
01_persia_events.7.a:0 "通过接受他们的人民，我们将赢得新国家的忠诚。"
01_persia_events.7.b:0 "我们是带回巴比伦的人，我们可以随心所欲地处理他们。"
01_persia_events.7.c:0 "他们将成为一个服从我们的大总督，这就是他们需要的。"
01_persia_events.7.e:0 "我们满足于将他们从我们的敌人手中夺回，让他们塑造自己的命运吧。"
bab_hick_tt:0 "我们将以#yellow 巴格达#!、#yellow 巴士拉#!的土地，构建一个举世闻名的#yellow 巴比伦#!国。"
01_persia_events.8.t:0 "驯服亚述"
01_persia_events.8.d:0 "#yellow 亚述#!再次获得了自由，尽管已经消失了上千年，但当我们讨论是否建立一个亚述帝国的时候，周边居民和西方异教徒，都畏惧这只残暴的野兽再次出现在世界上。"
01_persia_events.8.f:0 "第一个真正的帝国是亚述帝国。他们通过恐惧和残暴统治着，也许复活他们不是一个好主意......"
01_persia_events.8.a:0 "亚述人以残酷闻名。我们将驯服他们，以免他们将来反对他们的新主人。"
01_persia_events.8.b:0 "我们将以铁腕统治他们。如果给了机会，他们会对我们做得更糟。"
01_persia_events.8.c:0 "他们将成为一个服从我们的大总督，没有比驯养一只野兽更刺激的了。"
01_persia_events.8.e:0 "我们满足于将他们从我们的敌人手中夺回，让他们塑造自己的命运吧。"
ass_hick_tt:0 "我们将以#yellow 摩苏尔#!、#yellow 代尔祖尔#!的土地，构建一个作战勇猛的#yellow 亚述#!国。"
01_persia_events.9.t:0 "复兴以色列"
01_persia_events.9.d:0 "一个#yellow 犹太王国#!再次成为现实，流亡在外的犹太人听说我们打算帮助他们回归曾经的家园，纷纷给我们捐款表示支持。有的犹太信徒更是承诺一旦我们重建#yellow 犹太王国#!，便会号召周边同胞回归这块#yellow 神应许的土地#!。"
01_persia_events.9.f:0 "没有人认为这是可能的，但我们即将在世界上重新建立#yellow 以色列#!。正如我们的祖先#yellow 居鲁士大帝#!那样，帮助犹太人从巴比伦的奴役中解脱，并允许他们回归故土，重建耶路撒冷的圣殿。如果可以，我们会再次化身为犹太人的#yellow 弥赛亚#!，向世界展示我们的宽容开放。"
01_persia_events.9.a:0 "没有人比犹太人更具韧性。我们将利用并尊重他们的坚韧不拔。"
01_persia_events.9.b:0 "他们一直被征服，却从来不想想自己的原因。我们不会给#yellow 犹太人#!任何特殊的地位，这是为了我们自己的利益！"
01_persia_events.9.c:0 "他们将成为一个服从我们的大总督，在#yellow 耶和华所赐予的土地#!上建设自己的家园。"
01_persia_events.9.e:0 "我们将遵守居鲁士大帝的意愿，让他们塑造自己的命运。"
isr_hick_tt:0 "我们将以#yellow 巴勒斯坦#!的土地，构建一个商业传统的#yellow 犹太王国#!。"

01_persia_events.10.t:0 "希腊征服者"
01_persia_events.10.d:0 "我们做到了，其他波斯帝国都做不到的事情......#yellow 大流士大帝#!曾经想报复希腊，现在完成了......当然，是两千多年后。"
01_persia_events.10.f:0 "2300年前，#yellow 薛西斯一世#!的烈焰未能熔化的希腊傲慢，今夜正在恺加火枪的硝烟里重铸成臣服之链。\n\n当年记载"野蛮波斯"的羊皮卷，如今正被希腊工程师改写为《波斯海权论》。让这些载着居鲁士敕令的纸鸢飞向#yellow 伦敦#!唐宁街、#yellow 圣彼得堡#!冬宫——每片阴影掠过之处，都是波斯湾到地中海的帝国航迹。"
01_persia_events.10.a:0 "发出通告！世界必须知道。"

01_persia_events.11.t:0 "与希腊结盟"
01_persia_events.11.d:0 "一项历史性的联盟。"
01_persia_events.11.f:0 "我们的民族长久以来的敌意已经过去。现在，我们必须团结起来，对抗不断扩张的欧洲强权。"
01_persia_events.11.a:0 "如果我们互相帮助，没有人可以阻止我们。"

01_persia_events.12.t:0 "重建腓尼基"
01_persia_events.12.d:0 "古代世界最伟大的#yellow 造船者#!和#yellow 航海者#!非常适合这个以海军力量和贸易为重点的时代，而#yellow 腓尼基#!的船只将再次航行海上。"
01_persia_events.12.f:0 "#yellow 大流士#!当年用腓尼基人的桨帆船征服爱琴海时，可曾想到他们的后裔会用#yellow 蒸汽轮机#!为波斯锻造锁海铁链？\n\n当青铜撞角化作鱼雷发射管，当紫色风帆化作煤烟旗帜——拜火祭坛的圣火正在轮机舱永恒的燃烧！\n\n今夜潮汐里流淌着西顿人的星图，塔尔苏斯的歌谣，迦太基的怨灵。当我们的水手用波斯语与腓尼基方言共唱航行祷词时——这横贯三千年的浪涛，终将把大不里士的月光，洒向赫拉克勒斯之柱外的汪洋。"
01_persia_events.12.a:0 "技艺精湛的腓尼基人将成为我们日益壮大的帝国的伟大补充。"
01_persia_events.12.b:0 "我们需要他们建造我们的海军。他们的幸福并不重要。"
01_persia_events.12.c:0 "他们将成为一个服从我们的大总督，保护我们在地中海的航线。"
01_persia_events.12.e:0 "我们满足于将他们从我们的敌人手中夺回，让他们塑造自己的命运吧。"
pho_hick_tt:0 "我们将以#yellow 黎巴嫩#!、#yellow 阿勒颇#!的土地，构建一个海军优良传统的#yellow 腓尼基#!国。"
01_persia_events.13.t:0 "吕底亚的召唤"
01_persia_events.13.d:0 "#yellow 吕底亚#!曾经如此富有，以至于他们#yellow 发明了硬币#!来更好地追踪他们的财富。他们实际上发明了货币，但被时间遗忘了太久。这可能是我们的错，毕竟我们征服了他们等等......不过，我们会确保吕底亚再次展现其影响力。"
01_persia_events.13.f:0 "两千五百年前#yellow 吕底亚#!人用琥珀金铸造世界第一枚钱币时，米底人还在用羊毛交换青铜。#yellow 居鲁士#!当年用吕底亚人的财富征服巴比伦，#yellow 大流士#!用达里克金币编织丝路，而今这熔炉，要为我们#yellow 伊朗帝国#!浇筑出畅通六大洲的黄金货币。\n\n当伦敦银行家用复式记账法吮吸东方血肉时，我们却用吕底亚人的后裔建立起一套新的复本位制，在泰西封废墟上建起让罗斯柴尔德家族战栗的#yellow 金融卫城#!。"
01_persia_events.13.a:0 "如今没有人会自称为#yellow 吕底亚#!人，但我们可以允许居住在这些土地上的吕底亚人后裔，在我们的帝国中找到一个合适的位置。"
01_persia_events.13.b:0 "我们将榨取他们的财富，在这一点上，我们的官员能保证尽力而为。"
01_persia_events.13.c:0 "他们将成为一个服从我们的大总督，为我们更好地征收帝国臣民的财富。"
01_persia_events.13.e:0 "我们满足于将他们从我们的敌人手中夺回，让他们塑造自己的命运吧。"
lyd_hick_tt:0 "我们将以#yellow 艾登#!、#yellow 科尼亚#!、#yellow 安卡拉#!、#yellow 胡达文迪加尔#!、#yellow 卡斯塔莫努#!的土地，构建一个擅长货币交易的#yellow 吕底亚#!国。"
01_persia_events.14.t:0 "总督行政"
01_persia_events.14.d:0 "既然我们已经组建了总督，我们应该决定哪个团体应该负责与每个总督进行沟通。"
01_persia_events.14.f:0 "总督有点像州长。曾经向波斯帝国屈服的前国王可以成为其旧领土的总督。吕底亚的统治者就是这样做的，他对此感到非常高兴...尽管你无法询问他。"
01_persia_events.14.a:0 "为什么这是个问题？当然是#v $aristocrats$#!。"
01_persia_events.14.b:0 "我们需要我们的才华横溢的人来做这样重要的工作。"
01_persia_events.14.c:0 "信徒们将确保他们遵守适当的道德规范。"
01_persia_events.15.t:0 "新月理念的觉醒"
01_persia_events.15.d:0 "一些我们尊敬的教授来到皇宫，向#yellow 万王之王#!建议将我们的地区改名为“新月”。这是伊斯兰教的新月和美索不达米亚河流域的新月的象征，也是我们宗教和世俗遗产的融合。同时，这些教授们也提倡构造一种追求人人平等、不分宗教差异和民族差异的#yellow 新月价值观#!，向我们治下的臣民传播，并宣称这有利于创造我们与周边国家#yellow 和平合作#!的机会。"
01_persia_events.15.f:0 "尊如太阳的#yellow 万王之王#!啊，请允许您卑微的仆人点燃智慧之灯——当英国人的鸦片腐蚀印度，沙皇的铁蹄踏碎高加索，为何唯有波斯湾的新月仍未被殖民者的十字架吞噬？\n\n四百年前伊斯法罕的#yellow 亚美尼亚商队#!曾助#yellow 阿巴斯大帝#!充盈国库，#yellow 居鲁士大帝#!释放的#yellow 犹太人#!至今仍在耶路撒冷传颂波斯之名。正是这种以#yellow 人人平等#!为核心的理念，塑造了#yellow 新月地区#!的和谐与安宁。当欧洲传教士在孟买挑拨印度教徒与穆斯林时，我们的#yellow 清真寺#!与#yellow 琐罗亚斯德神庙#!共享着同一片月光。\n\n我们敬爱的#yellow 万王之王#!，希望您能传递#yellow 新月价值观#!给治下的子民，这样无须刀剑的征服，周边国家也会逐步接受我们的和平理念，最终自愿成为我们的卫戍屏障。"
01_persia_events.15.a:0 "以帝国之名，将新月价值观作为官方理念。"
01_persia_events.15.b:0 "强大的武力，足够让周边国家明白什么是和平。"

02_persia_events.1.t:0 "新月谴责"
02_persia_events.1.d:0 "我们让#yellow 新月#!的其他国家失望了，乌里玛们指责我们言而无信——既然许诺给#yellow 库尔德#!人带来自由，却最终根本不愿兑现承诺，虚伪的骗子必将遭受到#green 真主#!的惩罚。"
02_persia_events.1.f:0 "#yellow 新月#!各地的人们都走上街头，高呼我们的虚伪。我不会重复他们的任何话，因为那会让我们看起来很糟糕。"
02_persia_events.1.a:0 "赶紧改善我们的形象。"
02_persia_events.1.b:0 "镇压#yellow 库尔德#!叛乱分子。"
02_persia_events.1.c:0 "继续默不作声，因为我们只会让情况变得更糟。"

02_persia_events.2.t:0 "新关系"
02_persia_events.2.d:0 "我们已经安抚了#yellow 野兽#!，现在进入了新的三大强权之间的外交关系时期，就像曾经奥斯曼、萨法维、马穆鲁克的三角平衡那样。只不过，如今的我们不再拥有独裁的暴君，战争的风险会牢牢被锁进#yellow 民主的囚笼#!。"
02_persia_events.2.f:0 "#yellow 土耳其人#!和#yellow 埃及人#!长期以来一直在互相争斗，把美丽的叙利亚、阿达纳、开罗等地破坏地一团糟...就是这样，我只是想指出这一点，正是#yellow 民主#!的力量，让穆斯林之间不再发生互相屠杀的惨剧。"
02_persia_events.2.a:0 "关注#yellow 土耳其#!的新政府。"
02_persia_events.2.b:0 "关注#yellow 埃及#!的新政府。"
02_persia_events.2.c:0 "试着通过著名的#yellow 伊玛目#!，改善我们三者之间的关系。"

02_persia_events.3.t:0 "新月联盟"
02_persia_events.3.d:0 "我们成功地建立了一个#yellow 新月国家联盟#!，所有新月卫士的国家代表齐聚#yellow 德黑兰#!，共同商量未来联盟的方针。现在，作为东道主，我们必须决定联盟的重点。"
02_persia_events.3.f:0 ""#green 真主#!赐予的疆土不容异教徒染指！与其让英国工程师在圣城架设电报线，不如让#yellow 圣战者的弯刀#!在里海之滨闪耀。\n\n诸位，我们现在更需要关心#yellow 贸易#!！孟买的棉纱比伊斯法罕的便宜三成。若再不开放布什尔港，我们的商队连喀布尔的集市都要被英国人夺走了！\n\n难道诸位不知印度古烈干尼衰亡故事？我们应该注重#yellow 外交#!，维也纳是我们要好的朋友，用加兹温的石油开采权换取奥地利的兵工厂再合适不过了。"
02_persia_events.3.a:0 "良好的外交将保持我们的整体。"
02_persia_events.3.b:0 "我们的贸易实力将是这个联盟的支柱。"
02_persia_events.3.c:0 "没有什么比保卫我们的边界更重要的了。"
02_persia_events.4.t:0 "新月扎根"
02_persia_events.4.d:0 "我们的人民开始接受新月的理念，但许多人质疑为什么其中一些人被更差地对待甚至被奴役。现在我们必须努力将#yellow 新月#!的所有人民的#yellow 平等权利#!确立为法律。"
02_persia_events.4.f:0 "新的思想对一些人来说可能看起来很危险，但对我来说，它带来了更好社会的机会。谁不想要一个更好的社会呢？显然有很多人，并且主要是富人。嗯，我突然想到了一个巨大的改进。"
02_persia_events.4.a:0 "#yellow 教士#!是我们的道德权威，将帮助结束将我们的兄弟姐妹绑在锁链中的做法。"
02_persia_events.4.b:0 "新兴的#yellow 工业阶级#!是我们确保价值观法律化的最大希望。"
02_persia_events.4.c:0 "我们#yellow 最进步的人#!将帮助确保所有新月的人民在波斯受到欢迎。"

02_persia_events.400.t:0 "新月的捍卫者"
02_persia_events.400.d:0 "从今天开始，我们将不再被称为#yellow 中东#!，而是#yellow 新月#!！现在我们必须形成一个#yellow 新月联盟#!来保卫伊朗地区的和平。"
02_persia_events.400.f:0 "被称为中东是一种假设，即欧洲是世界的中心。我们不能再容忍被贴上低人一等的标签。我建议我们将我们的地区改名为“新月”。这是伊斯兰教的新月和美索不达米亚河流域的新月的象征。我们宗教和世俗遗产的融合。无论如何，这就是我的论文结束了。你觉得怎么样，教授？"
02_persia_events.400.a:0 "#yellow 俄罗斯#!和#yellow 大不列颠#!正紧盯着我们的东方邻国。在为时已晚之前，我们必须集中所有的力量与他们改善关系，亦或者将它们纳入我们的#yellow 新月联盟#!中。"
02_persia_events.400.b:0 "我们应该致力于将新月的理念融入#yellow 我们的人民#!中。"

02_persia_events.5.t:0 "归还#yellow 霍尔木兹#!"
02_persia_events.5.d:0 "我们成功通过金钱的手段，从#yellow 阿曼#!手中购回[SCOPE.sState('oman_scope').GetName]的土地。[SCOPE.sCountry('persia_scope').GetName]的海岸线变得更加稳固，距离恢复自然边界也更进了一步。"
02_persia_events.5.f:0 "这是#yellow 波斯湾#!地区一个新时代的开始：一个我们可以通过外交解决问题而不是战争野蛮的时代，阿拉伯人和波斯人可以坐下来和平解决彼此的争端，而不是违背#green 安拉#!的意愿互相屠杀。"
02_persia_events.5.a:0 "让我们与#yellow 阿曼#!继续保持良好的关系。"

02_persia_events.6.t:0 "[SCOPE.sCountry('persia_scope').GetName]交换"
02_persia_events.6.d:0 "我们已经获得了足够多的[SCOPE.sCountry('persia_scope').GetName]支付给我们的资金，现在是时候兑现承诺，将[SCOPE.sState('oman_sell_scope').GetName]这些不重要的土地归还给[SCOPE.sCountry('persia_scope').GetName]。"
02_persia_events.6.f:0 "这是#yellow 波斯湾#!地区一个新时代的开始：一个我们可以通过外交解决问题而不是战争野蛮的时代，阿拉伯人和波斯人可以坐下来和平解决彼此的争端，而不是违背#green 安拉#!的意愿互相屠杀。"
02_persia_events.6.a:0 "是时候拿这笔资金用来改善我们的国家。"
02_persia_events.6.b:0 "虽然给了我们不少钱，但我们可没承诺过归还[SCOPE.sState('oman_sell_scope').GetName]。"

02_persia_events.7.t:0 "自由的新月"
02_persia_events.7.d:0 "我们已经解放了#yellow 新月地区#!的其余国家，当地教徒热切欢迎我们的到来，以#yellow 解放者#!的名誉称呼我们的军队。现在，我们必须保持这种紧密的联盟状态，并尽快确认#yellow 未来军事的方向#!。"
02_persia_events.7.f:0 "我们现在可能是自由的，但一切都可能在一瞬间改变。如果我们希望保持现状，我们必须时刻保持警惕。自由是不会白白得来的，我们土地下的#yellow 黑金#!已经引起许多异教徒的觊觎，只有强化手中的武器，才能保卫#green 真主#!赐予我们的土地。"
02_persia_events.7.a:0 "我们的新盟友应该专注于#yellow 保卫#!他们的土地。"
02_persia_events.7.b:0 "最好的防御是#yellow 攻击#!。"
02_persia_events.8.t:0 "新月庆祝"
02_persia_events.8.d:0 "我们坚持了我们的理想，并帮助#yellow 库尔德#!人建立了一个和谐平等的美好家园。曾经因为我们和#yellow 奥斯曼#!反复拉锯战争，而贫困潦倒的#yellow 库尔德#!边境居民，再也不用担心战乱和两头臣属的问题。如今他们过上了舒适温馨的生活，随着我们工业化的迅猛发展，不少#yellow 库尔德#!人放弃了传统的游牧生活，前往大城市工作。"
02_persia_events.8.f:0 "他们做到了！我从未想过他们会这样做。我是说，谁会把自己的土地让给一个没有能力夺取它的人呢？又或者，谁会关心自己边缘山区臣民的死活呢？我肯定不会。"
02_persia_events.8.a:0 "甚至新月之外的人也不得不钦佩我们所做的事情。"
02_persia_events.8.b:0 "整个新月都因这一行动而受到提升。"
02_persia_events.8.c:0 "我们的#yellow 库尔德#!人民全心全意地支持我们的决定。"

02_persia_events.9.t:0 "#yellow 德黑兰#!议会"
02_persia_events.9.d:0 "经过数日的讨论，我们决定前进的唯一道路是#yellow 代议制政府#!。只有我们自己先遵守民主的法则，才能将人人平等的新月价值观深入人心。"
02_persia_events.9.f:0 "国王、苏丹和酋长可能是伟大的，但他们也可能给他们的人民和周围的人带来灾难。我们需要稳定。人民必须对自己的命运有发言权，而不是一个人决定一切。"
02_persia_events.9.a:0 "我们必须迅速#yellow 削弱贵族#!中的反动势力。"
02_persia_events.9.b:0 "我们需要将#yellow 改革者#!提拔到最高的政府层面。"
02_persia_events.9.c:0 "变革得太快，就会很快再次改变。"

02_persia_events.10.t:0 "民主堡垒"
02_persia_events.10.d:0 "从今天开始，#yellow 新月#!将成为民主的伟大中心，我们可以自豪地告诉仍然生活在独裁统治下的异教徒，#yellow 新月同盟#!是一个比欧洲还重视人人平等的自由圣地。"
02_persia_events.10.f:0 ""尊贵的欧洲弟兄们啊！在#green 真主#!赐予的智慧与公正指引下，我们伊朗大地已升起第一缕#yellow 民主的晨光#!。当你们的民众还在为宪章权利浴血时，我们已让每个伊朗子民在星期五聚礼后投下神圣的选票。十二伊玛目的平等精神已化作可触摸的治国之道，我们的异教徒也在缴纳吉兹亚后享有同等的申诉之途......希望你们也能早日获得像我们这样的民主自由！""
02_persia_events.10.a:0 "没有我们#yellow 伊朗人#!的努力，这是不可能实现的。"
02_persia_events.10.b:0 "这是#yellow 新月同盟#!共同努力取得的成就。"

02_persia_events.11.t:0 "全面认可"
02_persia_events.11.d:0 "凭借我们的国际新地位，我们利用我们的影响力确保新月的任何人都不会再被轻视。"
02_persia_events.11.f:0 "种族优越论的崛起是欧洲大国用来为他们在全球范围内不人道的对待和压迫辩护的工具。现在，我们将在他们眼中#yellow 平等#!，就像所有人类应该一样。"
02_persia_events.11.a:0 "我们将更进一步。伊朗欢迎所有人！"
02_persia_events.11.b:0 "我们不会允许非#yellow 新月#!的人进入我们的国境。"

02_persia_events.12.t:0 "阿拉伯联合"
02_persia_events.12.d:0 "通过确保他们的自由，我们也确保了他们的信任，并说服了#yellow 阿拉伯#!的交战国家放下分歧，牢记#green 真主#!“不要分裂”的教诲。"
02_persia_events.12.f:0 "阿拉伯将不再被视为新月的后花园，不再仅仅是无尽的沙漠。他们将再次向世界展示，不要低估他们的力量。团结的阿拉伯，犹如一把锋利的#yellow 安拉之剑#!，从哈里发手中斩下所有觊觎我们领土的异教徒。"
02_persia_events.12.a:0 "全体#yellow 阿拉伯人#!都为我们的外交成就而欢欣鼓舞。"
02_persia_events.12.b:0 "我们将向世界炫耀我们的成就。"
02_persia_events.12.c:0 "我们只能想象他们将会取得什么成就。"
02_persia_events.12.e:0 "我们会归还智慧之城#yellow 巴格达#!给#yellow 阿拉伯人#!，愿我们的友谊能长久。"

02_persia_events.13.t:0 "自由团结的新月！"
02_persia_events.13.d:0 "我们实现了#yellow 新月地区#!从所未有的繁荣与和平。无论宗教还是民族，大家共同遵循自由、平等的新月价值观。曾经教派四分五裂的我们，如今凝聚成一条绳，听从#green 真主#!的指示，驱逐出了所有侵略我们的西方异教徒。这只是开始，现在我们可以内部关注我们各自国家的事务，但在这个过程中仍然相互帮助。"
02_persia_events.13.f:0 "难道我们忘了侯赛因的鲜血如何浸透卡尔巴拉沙地？#green 真主#!在《黄牛章》明示'你们当为他们准备所能准备的武力'——是时候让新月旗插上#yellow 安达卢斯#!的钟楼！\n\n"但先知也说过'求知从摇篮到坟墓'，当异教徒的战舰用蒸汽机横渡波斯湾时，我们在库姆的神学家还在争论地球是不是鲸鱼背上的圆盘，没有什么比#yellow 技术#!更重要，#green 真主#!赐予我们石油与商路，难道不该先让麦加朝圣者的驼队变成钢铁车厢？\n\n笨蛋，问题是#yellow 经济#!！没有足够的钱财，我们怎么指挥军队，还是指望免费拿到异教徒的技术？"
02_persia_events.13.a:0 "#yellow 技术#!是未来的发展方向。"
02_persia_events.13.b:0 "强大的#yellow 经济#!将使新月保持强大。"
02_persia_events.13.c:0 "新月将在每一个转折点上与#yellow 欧洲#!站在一起。"
02_persia_events.14.t:0 "#yellow 奥斯曼#!民族动荡"
02_persia_events.14.d:0 "许多人都希望摆脱奥斯曼帝国的残暴统治，但真正准备好的是谁？是#yellow 伊拉克人#!？#yellow 叙利亚人#!？还是#yellow 亚美尼亚人#!？"
02_persia_events.14.f:0 "一旦人们看清#yellow 奥斯曼#!内部腐朽不堪的状况，各民族对自由的呼声就无法被压抑。让我们打破束缚吧，曾经嚣张一时的#yellow 奥斯曼#!，该躺在我们为这位#yellow 病夫#!准备的棺材里了。"
02_persia_events.14.a:0 "伊拉克将得到独立！"
02_persia_events.14.b:0 "叙利亚人忍受压迫太久了！"
02_persia_events.14.c:0 "亚美尼亚人不想再被屠杀！"
02_persia_events.14.e:0 "自由不等人，他们都将获得自由！"
02_persia_events.14.g:0 "我们还没有准备好！我们随时可以再试一次。"

02_persia_events.15.t:0 "俄罗斯动荡"
02_persia_events.15.d:0 "许多人都希望摆脱俄罗斯的统治，但真正准备好的是谁？"
02_persia_events.15.f:0 "一旦人们看清内部状况，对自由的呼声就无法被压抑。让我们打破束缚吧。"
02_persia_events.15.a:0 "亚美尼亚不想再当鹰犬！"
02_persia_events.15.b:0 "格鲁吉亚不再是缓冲区！"
02_persia_events.15.c:0 "阿塞拜疆将重新挣脱锁链！"
02_persia_events.15.e:0 "自由不等人，他们都将获得自由！"
02_persia_events.15.g:0 "我们还没有准备好！我们随时可以再试一次。"

02_persia_events.16.t:0 "#yellow 埃及#!民族动荡"
02_persia_events.16.d:0 "#yellow 叙利亚人#!受够了埃及赫迪夫的残酷剥削，希望摆脱埃及的统治，但他们真的准备好了吗？"
02_persia_events.16.f:0 "一旦人们看清#yellow 埃及赫迪夫#!以臣民财富乃至生命为代价，去实现他所谓的宏图大业，对自由的呼声就无法被压抑。谁会将自己的一生绑定在开罗的纺织机上呢？让我们打破束缚吧。"
02_persia_events.16.a:0 "他们已经被宣传准备好#yellow 起义#!了。"
02_persia_events.16.b:0 "我们还没有准备好！我们随时可以再试一次。"

02_persia_events.17.t:0 "共同的遗产"
02_persia_events.17.d:0 "我们消除了分裂我们#yellow 什叶派#!的微小差异，让各学派的教徒都接受了我们进步的新月价值观。同时，境内少数的#yellow 逊尼派#!乌理玛也愿意放弃老旧的传统，接受我们追求人人平等的新月价值观。"
02_persia_events.17.f:0 "什叶派、逊尼派、马什里克人、库尔德人、波斯人，以及许多其他人。我们可能在自己的方式上都不同，但现在我们将以共同的目标行动，像一个民族一样推进我们所有人的进步。这是唯一的前进道路。"
02_persia_events.17.a:0 "我们将在所有主要城市举办庆祝活动，庆祝人民。"
02_persia_events.17.b:0 "是的，我们现在是一个整体，但显然波斯人是该地区的领导者。"
#02_persia_events.17.c:0 "我们现在不能庆祝。像犹太人、亚美尼亚基督徒和琐罗亚斯德教徒等其他人仍然被排除在外。"

02_persia_events.18.t:0 "新月先锋"
02_persia_events.18.d:0 "#yellow 花剌子模#!拥有许多凶猛的游牧战士，将对我们的战斗力产生巨大帮助。"
02_persia_events.18.f:0 "尽管被夹在波斯和俄罗斯之间，#yellow 花剌子模#!仍然保持着独立。嘿，如果你无法打败他们，就加入他们……尽管他们是加入我们，所以我猜这就像是如果你无法打败他们，那就让他们加入你？"
02_persia_events.18.a:0 "俄罗斯就在新月的门口，花剌子模必须专注于保护这扇门。"
02_persia_events.18.b:0 "没有人靠防守赢得战争。我们应该把他们释放到我们的敌人身上。"
02_persia_events.18.c:0 "安抚#yellow 花剌子模#!的臣民更重要。"
02_persia_events.18.e:0 "我们会召唤一只更#yellow 凶猛的野兽#!。"

02_persia_events.19.t:0 "新月的养育者"
02_persia_events.19.d:0 "#yellow 阿富汗#!拥有易于防守的肥沃土地，得益于其山地地形。他们可以安全地为新月内所有人提供供应。"
02_persia_events.19.f:0 "许多人试图征服#yellow 阿富汗#!，但结果并不如意。这就是为什么我们放弃并与他们成为朋友的原因。"
02_persia_events.19.a:0 "他们需要专注于为我们的人口提供食物。"
02_persia_events.19.b:0 "我们可以用金钱购买更多食物。经济作物才是出路！"
02_persia_events.19.c:0 "医学界表示，鸦片是医学的未来。我们应该尽早投资。"
02_persia_events.19.e:0 "我们会放弃过往与#yellow 普什图人#!的仇恨，平等地对待他们。"
02_persia_events.19.h:0 "不如打造一个农业、种植园、鸦片贸易都发达的#yellow 阿富汗#!。"

02_persia_events.20.t:0 "新月的海蛇"
02_persia_events.20.d:0 "多亏了我们的努力，#yellow 俾路支斯坦#!现在已经统一！那里拥有一个大海岸线，并且可以停靠一支规模庞大的舰队，培养许多训练有素的海军军官。"
02_persia_events.20.f:0 "海军不仅仅是建造一些船。您需要训练有素的军官和可靠的船员来操纵它们。如果没有这些，你最终会拥有大量沉没的船只，而它们并不属于你的敌人。"
02_persia_events.20.a:0 "#yellow 俾路支斯坦#!需要建立海军来保卫我们的水域。"
02_persia_events.20.b:0 "#yellow 俾路支斯坦#!的海军应该在高海上令人畏惧，而我们更需要的是通往#yellow 阿拉伯海#!的港口。"
02_persia_events.20.c:0 "将#yellow 俾路支斯坦#! 打造成军民通用的海港更符合我们的利益。"

02_persia_events.21.t:0 "新月的商人"
02_persia_events.21.d:0 "多亏了我们的努力，横贯#yellow 高加索#! 地区现在已经统一。无论是在第比利斯，还是在帝国曾经丢掉的埃里温，都可以看到#yellow 波斯雄狮#! 的旗帜在高加索凌冽的寒风自豪地飘扬。在山脚下，来高加索做贸易的#yellow 英格兰人#!和#yellow 俄国人#! ，都必须遵从我们的指挥，一改之前蛮横无理的态度。"
02_persia_events.21.f:0 "我们实际上并没有历史上的证据来证明统一亚美尼亚、格鲁吉亚和阿塞拜疆的正当性。如果他们不喜欢的话，他们能做什么？入侵……糟糕。"
02_persia_events.21.a:0 "让他们全力以赴地进行贸易，以获得或销售新月需要的任何东西。"
02_persia_events.21.b:0 "我们必须保卫这些关键的贸易路线，尤其需要建设一支强大的本地海军。"
02_persia_events.21.c:0 "先安抚境内的亚美尼亚、格鲁吉亚和阿塞拜疆人。"
02_persia_events.21.h:0 "将高加索地区建设成一个民族和谐、贸易繁荣、治安良好的天堂。"
building_navy_transcaucasia_modifier:0 "建设高加索海军"
02_persia_events.22.t:0 "新月的学者"
02_persia_events.22.d:0 "#yellow 伊拉克#! 终于实现了自由！他们曾经是穆斯林世界的学习中心，但是现在亦将如此。"
02_persia_events.22.f:0 "#yellow 巴格达#! 曾经是世界的明珠，是举世闻名的学术中心。直到成吉思汗的孙子忽剌谷来了，把这个地方搞得一塌糊涂，#yellow 智慧宫#! 被毁，大量学者遇害，我们的文明遭到重创。过去的历史终究掩埋在尘土里，如今只要我们尽力帮助#yellow 伊拉克人#! 建设，往日繁华的#yellow 巴格达#! 还会回到这个世界。"
02_persia_events.22.a:0 "他们的大学将教授各种学科。"
02_persia_events.22.b:0 "他们将专注于教授发现关键资源的方法。"
02_persia_events.23.t:0 "新月的狂热者"
02_persia_events.23.d:0 "#yellow 叙利亚#!终于自由了！他们掌握着耶路撒冷这个关键城市，并对虔诚者产生了重大影响力。"
02_persia_events.23.f:0 "“我当时正在过着平常的一天，然后镇上唯一的报纸说我们现在有了自己的国家。我很想庆祝，但我必须先弄清楚新政府是否会提高税收。”"
02_persia_events.23.a:0 "他们将提供安全的朝圣之旅，作为交换，被指定为安全区域。"
02_persia_events.23.b:0 "他们应该帮助将我们的各个人口皈依为我们国家的信仰。"

02_persia_events.24.t:0 "库尔德人抗议"
02_persia_events.24.d:0 "#yellow 库尔德人#!走上街头，要求建立一个独立的库尔德斯坦。在他们聚居的地方，随处可见中间纹有太阳的红白绿三色旗。"
02_persia_events.24.f:0 "“我们对他们的待遇完全是很好的，他们却用我们坚持的整个新月必须遵守的要求来回报我们？荒谬！”"
02_persia_events.24.a:0 "允许他们宣泄他们的挫折。"
02_persia_events.24.b:0 "我们无法在我们自己的国家中解放新月，因为存在不满。镇压他们！"
build_democratic_institutions_modifier:0 "建立民主机构"
02_persia_events.25.t:0 "库尔德斯坦的大请求"
02_persia_events.25.d:0 "#yellow 库尔德斯坦#!政府再次声称#yellow 奥鲁米耶#!、#yellow 辛内赫#!等地是他们祖国的一部分，并#yellow 友好#!地要求我们将这些库尔德人占多数的土地转让给他们。"
02_persia_events.25.f:0 "“我们是第一批解放他们的人，他们却厚着脸皮基于我们所有的理念提出了一个完全合理的请求！？”"
02_persia_events.25.a:0 "他们只是要求我们信守我们的信条。"
02_persia_events.25.b:0 "我们才是开发那片土地的人！更不用说生活在#yellow 奥鲁米耶#!的库尔德人是我们劳动力的重要组成部分。"
02_persia_events.26.t:0 "复兴#yellow 波斯帝国#!的梦想"
02_persia_events.26.d:0 "随着#yellow 新月联盟#!在伊朗地区的稳固，一些雄心勃勃的#yellow 波斯#!教授和学者，希望我们能够创造古典波斯帝国的辉煌，建立一个强大的#yellow 泛雅利安#!国家，犹如#green 阿契美尼德王朝#!那般强大包容，#green 萨珊王朝#!那般文化繁荣，#green 萨法维王朝#!那般虔诚开放。"
02_persia_events.26.f:0 "今日，臣等冒昧以血泪铸就的史鉴与未来之蓝图进言，绝非妄图以刀剑惊扰#yellow 新月盟友#!的安宁，而是恳请陛下以波斯千年文明为舟，以#green 真主#!赐予的工业伟力为帆，引领这片土地驶向应许的荣耀。\n\n#green 萨珊#!的铁骑曾令罗马战栗，#green 萨法维#!的穹顶曾汇聚什叶世界的仰望——但今日的复兴，无须重现血染黄沙的旧梦，一个雅利安人全部团结在一起的国家，已是势在必得。"
02_persia_events.26.a:0 "作为古老文明的继承者，我有义务将#yellow 伊朗#!变得更加强盛。"
02_persia_events.26.b:0 "既然各位如此劝谏，我只好带上这顶王冠，宣告#yellow 万王之王#!的归来。"
02_persia_events.26.c:0 "帝国已经死了，泛雅利安的梦想不切实际，当下团结的#yellow 新月联盟#!才是我们的未来。"
02_persia_events.27.t:0 "民主的召唤"
02_persia_events.27.d:0 "作为#yellow 新月联盟#!的领袖，#yellow 伊朗#!率先做出民主选举投票的行为。他们在#yellow 新月联盟#!的会议上以自己为榜样，提出了#yellow 新月联盟#!集体民主的方案，鼓励我们成员学习他们的民主制度。"
02_persia_events.27.f:0 "《古兰经》里有记载，#green 真主#!命令所有信徒把一切受信托的事物交给应受的人，万物主权皆归#green 真主#!，但代治者可以协商行使其主权。民主机构“择优治理”的理念可以被诠释为“履行#green 真主#!信托”的工具，同样能发挥巩固联盟的作用。"
02_persia_events.27.a:0 "我们会接受#yellow 新月联盟#!民主的提案。"
02_persia_events.27.b:0 "#yellow 民主#!不适合我们国家。"
persia_events_28_advance_tt:0 "如果我们在12个月内将#green 波斯#!收为附属国，或者成功将其羞辱（波斯有被羞辱debuff），便能巩固我们在南高加索的统治。否则，南高加索地区很有可能发生叛乱，脱离我们的掌控！"
02_persia_events.28.t:0 "高加索动荡"
02_persia_events.28.d:0 "#yellow 南高加索#!的臣民最近在一群境外的教士煽动下，意图反抗我们的统治。当地警察抓捕了部分煽动匪徒后，从他们的口供得知，是#yellow 伊朗#!提供资金让他们在#yellow 高加索#!地区宣传#yellow 俄罗斯人#!是邪恶与残暴的异教徒。"
02_persia_events.28.f:0 "同胞们！三十年前，我们最英勇的王子们用#yellow 鲜血#!染红了阿拉格维河岸，却没能阻止沙皇的税吏夺走祖先留下的最后一块土地！\n\n他们用#yellow 《格鲁吉亚省管理条例》#!撕毁了我们千年的法典，用俄语文书践踏着鲁斯塔维里的诗篇！但我们血管里流淌着#yellow 大卫王#!的勇气，我们的语言中沉淀着#yellow 肖塔·鲁斯塔维#!里的智慧。今夜，让每个家庭的火塘都燃起#yellow 自由的星火#!：在库塔伊西的作坊里传递秘密报纸，在姆茨赫塔的修道院抄写民族史诗，在拉恰的山谷磨利祖传的短刀！\n\n记住：#yellow 暴君惧怕的不是刀剑，而是觉醒者的歌声！#!当我们齐声高唱《苏利科》，当我们的孩童重新书写格鲁吉亚字母，当每个村庄都讲述塔玛尔女王的传奇——这就是最锋利的武器！"
02_persia_events.28.a:0 "#yellow 恺加阉人#!的后代，你们会遭到上帝的惩罚！"
02_persia_events.28.b:0 "我们对此无能为力。"
persia_events_29_advance_tt:0 "如果我们在12个月内将#green 波斯#!收为附属国，或者成功将其羞辱（波斯有被羞辱debuff），便能巩固我们在#yellow 叙利亚地区#!的统治。否则，叙利亚地区很有可能发生叛乱，脱离我们的掌控！"
02_persia_events.29.t:0 "叙利亚动荡"
02_persia_events.29.d:0 "#yellow 叙利亚#!的臣民最近在一群境外的#yellow 什叶派教士#!煽动下，意图反抗我们的统治。当地警察抓捕了部分煽动匪徒后，从他们的口供得知，是#yellow 伊朗#!提供资金让他们在#yellow 叙利亚#!地区宣传#yellow 埃及教胞#!忘了#green 真主#!的教诲，不仅送叙利亚人去工厂里当奴隶，而且还把他们派往埃塞俄比亚高原当炮灰。"
02_persia_events.29.f:0 "看看#yellow 阿勒颇#!的街头吧！#yellow 埃及总督#!的税吏像蝗虫般啃食我们的麦田，去年冬天阿勒颇的母亲们抱着#yellow 饿死的婴儿#!在冰封的奥伦特河畔哭泣，可开罗的粮仓却堆满了从我们土地上#yellow 掠夺的小麦#!...\n\n他们强迫我们的青年穿上军装，告诉我们，把新月旗插上#yellow 科斯坦丁尼耶#!的城头，让叙利亚人的血为埃及的野心浇灌战场...\n\n那些开罗来的老爷们说这是"#yellow 现代化#!"——可他们的蒸汽机碾碎的是我们的脊梁！在黎巴嫩山区的丝织作坊里，我们的女儿们每天劳作十八个小时，手指被沸水烫得溃烂，换来的却是监工蘸盐水的皮鞭。他们夺走我们的羊毛去织埃及军队的制服，抽干我们的橄榄油去润滑帕夏的战舰，连大马士革钢刀的秘技都要献给那个贪婪的暴君！\n\n今天，我们要让那些躺在开罗后宫里的暴君知道：#yellow 被他们当作炮灰的农民能摧毁最坚固的棱堡，被他们视为蝼蚁的织工能编织自由的旗帜，被他们榨干的土地终将生长出复仇的荆棘！#!"
02_persia_events.29.a:0 "#yellow 波斯#!人，你们诬告的行为，才会遭到#green 真主#!的惩罚！"
02_persia_events.29.b:0 "我们对此无能为力。"
persia_events_30_advance_tt:0 "如果我们在12个月内将#green 波斯#!收为附属国，或者成功将其羞辱（波斯有被羞辱debuff），便能巩固我们在#yellow 阿拉伯地区#!的统治。否则，阿拉伯地区很有可能发生叛乱，脱离我们的掌控！"
02_persia_events.30.t:0 "阿拉伯动荡"
02_persia_events.30.d:0 "#yellow 阿拉伯#!地区的臣民最近在一群境外的#yellow 什叶派教士#!煽动下，意图反抗我们的统治。当地警察抓捕了部分煽动匪徒后，从他们的口供得知，是#yellow 伊朗#!提供资金让他们在#yellow 阿拉伯#!地区宣传#yellow 土耳其人#!老早忘记了#green 真主#!的教诲，不仅阻断了许多#yellow 阿拉伯人#!晋升官员的渠道，还将他们当牛羊一样奴役驱使。"
02_persia_events.30.f:0 "#yellow 波斯王国#!的统治者，历来是暴政与堕落的化身、恶毒与恶意之首——篡位者大流士、罪恶之源扎哈克、弑亲者该隐、食人者阿巴斯、阉人阿迦·穆罕默德·汗......\n\n我们不断听闻，你们竟然让穆罕默德的正直教派，屈服于你们的邪恶意志之下；你们破坏了信仰的根基，高举侵略的旗帜，压迫无辜者，不再遵循神圣律法的诫命与禁令；你们甚至煽动可恶的什叶派，进行不道德的性行为和无辜的杀戮，如同那些"听信谎言、实行非法之事的人"一般，被虚妄的话语所迷惑，参与被禁止的行为...\n\n在#green 真主#!的支持和帮助下，我将在每一棵绞刑架的头上戴上头戴王冠的苏菲派的头颅，并将所有罪恶的#yellow 波斯人#!从世界上清除出去。"
02_persia_events.30.a:0 "该给#yellow 波斯人#!一点教训了！"
02_persia_events.30.b:0 "我们对此无能为力。"
per_mohammad_shah_qajar_died_tt:0 "#yellow 穆罕默德·沙阿#!已经去世，或者离开了我们国家"

03_persia_events.1.t:0 "未见好转"
03_persia_events.1.d:0 "他的病情一点都没有改善！"
03_persia_events.1.f:0 "“医生并不总能治愈疾病，但采用正确的方法可以防止病情恶化。至少我的医生一直这么告诉我。”"
03_persia_events.1.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 坚持要赶走英国和俄罗斯的医生。传统医生是最好的选择。"
03_persia_events.1.b:0 "事实上[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 的病情没有恶化，只是一群庸医蒙骗我们而已。"

03_persia_events.2.t:0 "临死之门"
03_persia_events.2.d:0 "新医生已经截去了[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]的腿！"
03_persia_events.2.f:0 ""[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 坚持使用他。我们该怎么办？""
03_persia_events.2.a:0 "伤势已经不可逆转，但一位法国医生已经同意帮助挽救他的生命。"
03_persia_events.2.b:0 "让他的痛苦结束。"

03_persia_events.3.t:0 "准备王储"
03_persia_events.3.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]希望[SCOPE.GetRootScope.GetCountry.GetHeir.GetFullName]在他去世后能够即刻统治，并正在为他寻找私人导师。"
03_persia_events.3.f:0 "“政府中最重要的职位之一是王储的导师。因为他能够塑造未来国王的思想。”"
03_persia_events.3.a:0 "#v $aristocrats$#!将会指导他。"
03_persia_events.3.b:0 "[SCOPE.sCharacter('intelligentsia_ig_leader_scope').GetFullName]头脑敏锐，已经证明自己完全有能力。"
03_persia_events.3.c:0 "乌玛会确保他能够倒背如流地背诵整本古兰经。"

03_persia_events.4.t:0 "国王之死"
03_persia_events.4.d:0 "穆罕默德终于去世了"
03_persia_events.4.f:0 ""疾病将贫民和王子带入死亡的最后怀抱。挺不错的，对吧？很快我的诗将比鲁米的更有名。""
03_persia_events.4.a:0 "地主们想要利用经验不足的#yellow 纳西尔丁#!年轻沙阿。"
03_persia_events.4.b:0 "#yellow 纳西尔丁#!不希望任何人影响他的决策。"

03_persia_events.5.t:0 "财政充裕"
03_persia_events.5.d:0 "通过埃米尔·卡比尔节省的资金，我们正在取得进展，以便更多人在战争爆发时有武器。我们应该派他前往处理奥斯曼边境。"
03_persia_events.5.f:0 ""埃米尔·卡比尔学习迅速，并且擅长应用新思想。按照这个速度，我们可能不得不提拔他负责整个军队了。""
03_persia_events.5.a:0 "他不需要升职来配合他的新职责。他像所有优秀的臣民一样为国王服务。"
03_persia_events.5.b:0 "让他负责军队的物资和组织，并晋升为瓦齐尔内扎姆。"

03_persia_events.6.t:0 "简单而迅速"
03_persia_events.6.d:0 "埃米尔·卡比尔正在大力推进废除这个古老的传统。"
03_persia_events.6.f:0 "“这太荒谬了！就算我花一整天写一页也没关系吗？我的字体里面有诗意！”"
03_persia_events.6.a:0 "缓慢而稳健。我们不应该太快地彻底改变一切。"
03_persia_events.6.b:0 "顽固分子正在阻止进展。任何不改变方法的人都将被解雇。"

03_persia_events.7.t:0 "宫廷的开销"
03_persia_events.7.d:0 "削减预算不应该花这么长时间，但#v $aristocrats$#!们在他们的玩具被拿走时表现得像孩子一样。"
03_persia_events.7.f:0 "“你们这些人就是白拿钱。如果你们想要更多的资金，那就出去找一份真正的工作。”"
03_persia_events.7.a:0 "王太后在抗议。也许我们应该任由她自由支配她的开支，而不是把她视为敌人。"
03_persia_events.7.b:0 "如果埃米尔·卡比尔做出例外，那么每个人都会要求同样的待遇。为了波斯的利益，他们都必须做出牺牲。"

03_persia_events.8.t:0 "天花疫苗"
03_persia_events.8.d:0 "埃米尔·卡比尔通过他的疫苗计划拯救了数千、甚至数百万人的生命。"
03_persia_events.8.f:0 "“当你身边的人没有接种疫苗而死亡时，对疫苗持怀疑态度就很难了。拜托，求你了，为了上帝的爱。接受吧。这是免费的——而且你已经感染了天花。哎，现在我们也没什么办法了。”"
03_persia_events.8.a:0 "救了目前危急情况下的生命是件好事，但我们不应该依赖西方医学。"
03_persia_events.8.b:0 "这非常有效。我们需要将这种类型的药物作为标准引入我国。"

03_persia_events.9.t:0 "达拉弗农理工学校"
03_persia_events.9.d:0 "基础工作已经完成，我们随时可以开始建设。"
03_persia_events.9.f:0 "“这所大学的目的是用西方技术培养一批新的行政人员。它将建在城市的边缘，以便根据需要进行扩展。”"
03_persia_events.9.a:0 "埃米尔·卡比尔聘请了捷克、意大利、瑞士、波兰和尤其是奥地利的教师。"
03_persia_events.9.b:0 "如果我们要建造这所学校，那么至少应该由伊朗人来独家教学。"
03_persia_events.9.c:0 "地主们愤怒了。管理政府的工作应该留给他们，而不是教给农民。"

03_persia_events.10.t:0 "合适的医生"
03_persia_events.10.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 的情况越来越糟。我们需要给他找一个好医生。"
03_persia_events.10.f:0 "“曾经是穆斯林医生备受追捧，而欧洲医生则要避免。一些人坚持认为情况仍然如此，但他们的医生的结果却讲述了不同的故事。”"
03_persia_events.10.a:0 "我们需要现代医生，但只有我们的敌人英国和俄罗斯提供。"
03_persia_events.10.b:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 想要一位使用传统方法的来自该地区的医生。"
03_persia_events.10.c:0 "啊！他不需要医生。#green 真主#!会照顾他的。"

03_persia_events.11.t:0 "彻底终结"
03_persia_events.11.d:0 "神职人员再也不会拥有他们曾经拥有的权力。"
03_persia_events.11.f:0 "“我们不会消灭你们所有人。我们只希望你们专注于信仰而不是国家事务。”"
03_persia_events.11.a:0 "他们可能会再次获得权力。我们必须永远粉碎他们。"
03_persia_events.11.b:0 "他们当地社区里有许多受人尊敬的阿亚图拉，我们应该放过他们。"

03_persia_events.111.t:0 "影响力减弱"
03_persia_events.111.d:0 "对英国和俄罗斯的让步已经被撤销。"
03_persia_events.111.f:0 "“有人说惹恼这两个国家会导致他们对我们采取进攻性行动。不要天真。他们一看到我们有他们想要的东西就变得咄咄逼人。”"
03_persia_events.111.a:0 "这还远远不够。我们应该在世界舞台上谴责他们。"
03_persia_events.111.b:0 "埃米尔·卡比尔想要在他们的大使馆设立反间谍特工。"
03_persia_events.112.t:0 "新朋友"
03_persia_events.112.d:0 "埃米尔·卡比尔为我们赢得了强大的盟友，但我们必须决定要与哪些人建立更紧密的关系。"
03_persia_events.112.f:0 "“像我们一样，#yellow 美利坚合众国#!是一个潜力巨大的新兴大国。尽管#yellow 奥地利#!是一个更加成熟的大国，位于欧洲政治的中心，维也纳更是世界顶级的外交场所。”"
03_persia_events.112.a:0 "与奥地利不同，#yellow 美利坚#!代表着进步。"
03_persia_events.112.b:0 "我们可能不喜欢#yellow 奥地利#!的政策，但我们不能否认他们的实力。"
03_persia_events.112.c:0 "#yellow 奥地利#!和#yellow 美利坚#!都是我们最要好的朋友。"
03_persia_events.112.e:0 "强者从来不需要盟友。"

03_persia_events.12.t:0 "#v $aristocrats$#!阴谋"
03_persia_events.12.d:0 "#v $aristocrats$#!们对埃米尔·卡比尔已经受够了，并坚持要求[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]采取行动。"
03_persia_events.12.f:0 "“当然，国王会听我的。他是我第二大叔的堂兄。还是我第三大叔的堂兄？”"
03_persia_events.12.a:0 "王太后已经说服[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]，认为埃米尔·卡比尔想篡夺他的王位。"
03_persia_events.12.b:0 "斩了他的头，或者斩了你的头！"
03_persia_events.12.c:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]逮捕了冲进他的法庭并胆敢向他，即国王，提出要求的#v $aristocrats$#!们。"

03_persia_events.13.t:0 "达拉弗农理工学校完工"
03_persia_events.13.d:0 "这所最先进的大学已经完工了。"
03_persia_events.13.f:0 "“这将成为埃米尔·卡比尔最伟大的成就。一个伊朗人可以在这里学习，为他们所爱的国家准备未来。”"
03_persia_events.13.a:0 "#v $aristocrats$#!们很生气。也许我们应该通过免费学费来安抚他们。"
03_persia_events.13.b:0 "这是一部杰作。我们必须以此为榜样建设我们所有的大学。"

03_persia_events.14.t:0 "完全的信任"
03_persia_events.14.d:0 "在君臣二人的配合下，#yellow 埃米尔·卡比尔#!已经实现所有的可能改革，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]在所有事情上都完全站在他的首相这边。"
03_persia_events.14.f:0 "“#yellow 埃米尔·卡比尔#!已经证明自己是一位优秀的行政官员和顾问。我对他的看法比朝廷上那些马屁精要高。有这样杰出的人才治理国家，或许我也可以去#yellow 后宫养老#!了。“"
03_persia_events.14.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]开始意识到传统价值的谬误，对埃米尔·卡比尔的新思想更愿意接受，尤其打算实施他那套先进的#yellow 共和理念#!。"
03_persia_events.14.b:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]在处理政务上，还只是个孩子。如果#yellow 埃米尔·卡比尔#!真的想要改变这个国家，那么是时候从国王那里夺取权力了。"
03_persia_events.14.c:0 "为服务国王，是#yellow 埃米尔·卡比尔#!的荣幸，这是每个伊朗人的责任。我的改革已经结束了，伊朗的未来还由请陛下指路。"
persia_events_more_jour_tt:0 "#yellow 埃米尔·卡比尔#!逆转了历史上人亡政息的命运，这是推荐的剧情路线"
03_persia_events.15.t:0 "埃米尔·卡比尔的命运"
03_persia_events.15.d:0 "王后和她的大臣已经说服[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]，认为埃米尔·卡比尔将与俄罗斯人结盟，推翻他。"
03_persia_events.15.f:0 "“王后的一个侍从给了我一些金币来完成这件肮脏的勾当。我对那家伙没什么意见，但我得照顾好自己。”"
03_persia_events.15.a:0 "刺客们袭击了埃米尔·卡比尔。他根本没有机会。"
03_persia_events.15.b:0 "埃米尔·卡比尔得到了卡尚的同情居民的消息，逃走了。我们不知道他在哪里，但至少他走了（并秘密地影响着同情他的政府官员）。"
03_persia_events.15.c:0 "刺客们发现埃米尔·卡比尔正在做晚餐，决定是最好的时机……这是个大错误。这个人对厨房很熟悉，刺客们被烧焦、劈成两半，并被煎锅砸死。现在他要来找我们了……"
 
 
 
03_persia_events.16.t:0 "出国留学"
03_persia_events.16.d:0 "一些#v $aristocrats$#!和无关紧要的王室成员对[ROOT.GetCountry.GetName]中过时的教育不满意，希望在欧洲大学学习。"
03_persia_events.16.f:0 "“我是个#v $aristocrats$#!，我应该得到最好的教育。我不知道我会用它做什么。我只知道这是最好的。”"
03_persia_events.16.a:0 "让#v $aristocrats$#!接受更好的教育怎么可能是坏事？如果他们自己买单，让他们去吧。"
03_persia_events.16.b:0 "这样欧洲就能得到我们最优秀的人才了吗？我们不这么认为。"

03_persia_events.17.t:0 "奢华之旅"
03_persia_events.17.d:0 "许多王室成员想要去欧洲进行昂贵的旅行。"
03_persia_events.17.f:0 "“我对[ROOT.GetCountry.GetName]感到厌倦。我想看看复杂的伦敦、壮观的巴黎和美丽的罗马。”"
03_persia_events.17.a:0 "政府有责任支付王室想要的一切。"
03_persia_events.17.b:0 "我们负担不起那个！他们可以自己支付他们荒谬的旅行费用。"

03_persia_events.18.t:0 "传教士"
03_persia_events.18.d:0 "基督教传教士希望在我们的领土内开展工作。"
03_persia_events.18.f:0 "“我本来想在中国开始我的传教士生涯，但那些位置都已经被占了。”"
03_persia_events.18.a:0 "他们注定会在劝说我们的人放弃真实信仰方面失败，但他们愿意免费教授所有科目。"
03_persia_events.18.b:0 "这个想法是亵渎的！我们会处死任何试图改变我们人民信仰的人！"

03_persia_events.19.t:0 "波斯请求贷款"
03_persia_events.19.d:0 "#yellow 波斯#!请求向我们申请一笔巨额的贷款以用于国家建设，虽然财政部人员质疑#yellow 波斯#!贷款用途可能仅仅是为他们上层贵族享乐，但外交部部长强烈建议批准贷款，声称这是控制#yellow 波斯#!经济命脉的好时机。"
03_persia_events.19.f:0 "“贷款数额巨大，但利率也相当高，如果波斯人无法偿还，我们的舰队会去说服他们交出更多的国家资产以抵押赔偿……”"
03_persia_events.19.a:0 "非常好的注意，批准这笔贷款。"
03_persia_events.19.b:0 "我们没有多余的资金提供给#yellow 波斯#!。"

03_persia_events.20.t:0 "波斯请求贷款"
03_persia_events.20.d:0 "#yellow 波斯#!请求向我们申请一笔巨额的贷款以用于国家建设，虽然财政部人员质疑#yellow 波斯#!贷款用途可能仅仅是为他们上层贵族享乐，但外交部部长强烈建议批准贷款，声称这是控制#yellow 波斯#!经济命脉的好时机。"
03_persia_events.20.f:0 "“贷款数额巨大，但利率也相当高，如果波斯人无法偿还，我们的哥萨克军队会去说服他们交出更多的国家资产以抵押赔偿……”"
03_persia_events.20.a:0 "非常好的注意，批准这笔贷款。"
03_persia_events.20.b:0 "我们没有多余的资金提供给#yellow 波斯#!。"

03_persia_events.21.t:0 "烟草专卖"
03_persia_events.21.d:0 "一位#yellow 英格兰#!资本家想要购买#yellow 波斯#!所有烟草的权利。"
03_persia_events.21.f:0 "“乔治·弗朗西斯·塔尔博特要求在五十年内完全垄断烟草的生产、销售和出口。作为交换，他将慷慨地支付给我们，另外在支付所有费用后，每年的利润的四分之一，以及资本的5%的股息。这是一大堆我不理解的大词，但他向我保证这是一份好交易。”"
03_persia_events.21.a:0 "与富人做交易会让我们自己也变得富有！"
03_persia_events.21.b:0 "这太荒谬了！我们不会让英国从我们人民的汗水中获利。"

03_persia_events.22.t:0 "俄罗斯抗议"
03_persia_events.22.t:0 "俄罗斯的抗议"
03_persia_events.22.d:0 "俄罗斯要求立即结束对英国的特许权。"
03_persia_events.22.f:0 "“他们声称烟草专卖违反了土库曼恰伊条约规定的该地区的贸易自由。”"
03_persia_events.22.a:0 "俄罗斯可以尽管抱怨，但他们永远不会为此与英国冒险开战。"
03_persia_events.22.b:0 "我们不想惹恼这头熊。英国可能不会喜欢这样，但我们可以把责任推给俄罗斯。"

03_persia_events.23.t:0 "烟草抗议"
03_persia_events.23.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]已经宣布将烟草特许权让与国家，抗议活动像野火般蔓延开来。"
03_persia_events.23.f:0 "人们在让烟草被英国人收走之前，毁坏自己的烟草。巴扎里人正在领导反对派，因为他们的收入和生计受到的影响最大。农民也不高兴，因为他们现在只能卖给所谓的波斯帝国烟草公司，更不用说他们还必须向英国申请许可证才能出售自己的烟草了！最后，神职人员对于外国非穆斯林的这种特许权过高的费用感到不满，并宣称这与伊斯兰法相矛盾，因为个人不允许自由购买或销售烟草，也无法到其他地方做生意。”
03_persia_events.23.a:0 "伊朗最高法官米尔扎·哈桑·什拉齐发布了反对烟草的法令！"
03_persia_events.23.b:0 "农民们开始罢工！"
03_persia_events.23.c:0 "商贩们冲进了我们的贸易中心，并关闭了大部分的贸易中心！"

03_persia_events.24.t:0 "人民的胜利"
03_persia_events.24.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]已经让步，特许权已被取消。"
03_persia_events.24.f:0 "“我们，波斯人民，做到了我们以前从未想过的事情。我们站起来反抗了国王和大国，而且赢了。我们永远不能忘记这种感觉。这是一种自豪和抵抗的力量。”"
03_persia_events.24.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]受到了羞辱，人民比以往任何时候都更加壮大。"

03_persia_events.25.t:0 "游戏开始了"
03_persia_events.25.d:0 "#yellow 大不列颠#!和#yellow 俄罗斯帝国#!的意图很明显——他们都想控制#yellow 伊朗#!的全部，无论是政治、经济还是军事。"
03_persia_events.25.f:0 "“我们危险地接近成为大国争霸游戏中的又一个牺牲品。他们什么时候才会停止把世界上其他地方的人，视为他们的博弈中的棋子？”"
03_persia_events.25.a:0 "我们别无选择，只能参与游戏。"
03_persia_events.25.b:0 "英国是我们的靠山。"
03_persia_events.25.c:0 "沙皇才是我们的朋友。"

03_persia_events.26.t:0 "达西特许权"
03_persia_events.26.d:0 "威廉·诺·达西认为波斯有大量石油。"
03_persia_events.26.f:0 "“这种名为石油的新资源有着无限的潜力。如果我们想成为世界上的主导力量，那么我们需要它。掌握石油的人，就掌握了世界！”"
03_persia_events.26.a:0 "让他进行勘探，并获得发现的所有石油的权利。"
03_persia_events.26.b:0 "波斯地下除了土、石头和骨头外什么都没有。"
persia_events_oil_quickly_tt:0 "威廉·诺克斯·达西会帮助波斯#yellow 加快石油勘探#!；如果进展顺利，他很有可能会付出一笔资金，以换取波斯石油#yellow 投资权#!"
persia_gbr_oil_leader_tt:0 "我们不处在以#yellow 英国#!为领袖的国家集团"

03_persia_events.27.t:0 "达西特许权"
03_persia_events.27.d:0 "威廉·诺·达西认为我们国家有大量石油。"
03_persia_events.27.f:0 "“石油正在迅速成为世界上最宝贵的资源。如果我们真的拥有自己的石油，我们就可以成为一个强大的经济大国。”"
03_persia_events.27.a:0 "让他进行勘探，并获得发现的所有石油的权利。"
03_persia_events.27.b:0 "我们不会让这个英国人从我们身上夺走更多。"

03_persia_events.28.t:0 "开采石油！"
03_persia_events.28.d:0 "达西发现了石油！"
03_persia_events.28.f:0 "“由于我们的特许权，他将获得利益，而我们只会得到一些残羹剩饭。不过，我们签了协议……”"
03_persia_events.28.a:0 "他会亲自建造油井，我们仍然会分享一部分利润。"
03_persia_events.28.b:0 "这是比我们想象中更多的石油！英国人不会得到一滴！"
persia_events_oil_slowly_tt:0 "威廉·诺克斯·达西会帮助我们#yellow 提高石油产量#!，虽然很难说他是为了谁的利益？"

03_persia_events.29.t:0 "厌倦了"
03_persia_events.29.d:0 "人们对最新的外国贷款以填满[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]的口袋感到愤怒，并走上街头抗议。"
03_persia_events.29.f:0 "“国王更关心外国势力，而不是他自己的人民。否则，为什么他会把我们仅剩的一点财富送给他们呢？”"
03_persia_events.29.a:0 "没有人可以对国王提出要求！他是提出要求的人，他要求迅速报复。"
03_persia_events.29.b:0 "让他们怎么叫嚣。我们不会害怕。"
03_persia_events.29.c:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]的事情已经失控。他需要同意他们的要求。"
protect_our_king_not_down_tt:0 "你只有采取这个选项，才可能保住你当前统治者的#yellow 王位#! 。否则，接下来暴民的行为将难以预测。"

03_persia_events.30.t:0 "正义之殿"
03_persia_events.30.d:0 "在他们寻求庇护的清真寺里，我们驱散了抗议者，但这只引起了更多的抗议者。除非[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]建立一个正义之殿，否则他们不会离开。"
03_persia_events.30.f:0 "正义之殿将是一个宪法会议，让选举产生的代表们为国家的许多重要决策做出决定，而不是国王。"
03_persia_events.30.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]解雇了他的首相，并‘承诺’建立一个正义之殿。"
03_persia_events.30.b:0 "杀死这些叛徒中的每一个！"

03_persia_events.31.t:0 "缺失的议会"
03_persia_events.31.d:0 "拥有1万名抗议者前来要求[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]履行他的承诺。"
03_persia_events.31.f:0 "在一场斗争中，政府军杀害了一位赛义德，即先知穆罕默德的后裔。巴扎里人和神职人员举行了罢工。奇怪的是，英国同意在德黑兰的大使馆庇护商人。"
03_persia_events.31.a:0 "国王别无选择，只能让步。人民将拥有一个叫做议会的议会，很快就会有一部宪法。"
03_persia_events.31.b:0 "人民闯进[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]的宫殿，打算找到他并绞死在广场上。"

03_persia_events.32.t:0 "最后的行动"
03_persia_events.32.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]被一群抗议者从皇宫中发现，遭到捆绑和殴打，并送到德黑兰的广场上游街示众。在人民的愤怒呼喊下，几个抗议者首领向他展示了绞刑的绳索，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]只得跪地求饶，向人民磕头承诺如约签署宪法。"
03_persia_events.32.f:0 "宪法以比利时宪法为蓝本。权力不再取决于国王，而是取决于人民的意愿。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]和他所代表的机构已经合而为一，破败、失败、苍老、虚弱。"
03_persia_events.32.a:0 "被人民打成重伤的[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]，用颤抖的双手签署宪法不久后，便一命呜呼了。"

03_persia_events.33.t:0 "真面目"
03_persia_events.33.d:0 "正如我们所料。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]一直是顺从的，他确实服从我们议会的一切选择和决定。"
03_persia_events.33.f:0 "曾经和他一起生活的#yellow 大不里士#!官员说:“他是一个毫无价值、腐败透顶的废物，如果卖了他的母亲能让他的生活稍微轻松一点，他会毫不犹豫。但我知道什么？我只是为他工作。”"
03_persia_events.33.a:0 "尽管如此，他确实让他的俄国导师成为了一名部长，并授予汗的头衔。他不可能与#yellow 俄罗斯#!勾结吧……"
03_persia_events.33.b:0 "我们必须相信我们在#yellow 大不里士#!的兄弟姐妹们。杀了[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]国王！"

03_persia_events.34.t:0 "宪政派的回归"
03_persia_events.34.d:0 "国王被废黜了！"
03_persia_events.34.f:0 "来自大不里士、拉什特和伊斯法罕的军队夺取了权力，废黜了[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]，并重新实施了宪法。"
03_persia_events.34.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 流亡国外了。很可能藏身于俄罗斯。"
03_persia_events.34.b:0 "我们抓住了这条蛇，给了他应得的缓慢死亡。"

03_persia_events.35.t:0 "英俄协定"
03_persia_events.35.d:0 "英国人和俄罗斯人在我们背后签订了一项协议！"
03_persia_events.35.f:0 "由于德国的崛起以及凯撒增强了与奥斯曼帝国的联系，英国人和俄罗斯人已经同意承认彼此在波斯的利益范围。俄罗斯将获得上半部，英国将获得下半部，而中部将成为一个中立区域。"
03_persia_events.35.a:0 "波斯不是他们划分的对象！这违反了我们的主权！更不用说现在他们不会在波斯争斗了，我们也无法让他们相互对抗了。"
03_persia_events.36.t:0 "俄国愤怒"
03_persia_events.36.d:0 "俄罗斯要求解雇摩根·舒斯特，因为他非法逮捕了俄国公民。"
03_persia_events.36.f:0 "“你们竟然让这个美国人来帮你们保持财政稳定！我们想要榨干你们，这样就更容易控制你们！”"
03_persia_events.36.a:0 "如果他们想在我们的领土内居住，就需要交我们的税。舒斯特留下！"
03_persia_events.36.b:0 "在他们变得更加愤怒之前，我们需要让步。"

03_persia_events.37.t:0 "向首都进军"
03_persia_events.37.d:0 "俄罗斯军队在行动中。我们该怎么办？"
03_persia_events.37.f:0 "“终于到了这一步。俄罗斯人兑现了他们的威胁，拒绝再与议会打交道。”"
03_persia_events.37.a:0 "巴赫蒂亚酋长包围了议会大厦，强迫他们接受，然后关闭了议会。"
03_persia_events.37.b:0 "我们终于站起来反抗了。我们要战斗。"

03_persia_events.38.t:0 "礼萨·汗"
03_persia_events.38.d:0 "来自哥萨克旅的礼萨·汗攻占了首都。"
03_persia_events.38.f:0 "“他解除了[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]的部长，并任命了一个人民的首相，尽管很明显他才是这个国家的真正权力。我听说，这一切都是应英国的要求进行的，他们希望波斯保持稳定，作为对抗俄罗斯的缓冲。”"
03_persia_events.38.a:0 "晋升礼萨·汗为陆军总司令。”"
03_persia_events.38.b:0 "我们必须全力支持新任首相。"

03_persia_events.39.t:0 "礼萨的选择"
03_persia_events.39.d:0 "英国已经在位强人手下，但礼萨必须选择他想要如何统治。"
03_persia_events.39.f:0 "“礼萨想要使国家现代化。他相信只有铁腕才能做到这一点。太好了，我们用一个无能的君主换了一个无情的君主。”"
03_persia_events.39.a:0 "礼萨·汗已经说服议会加冕他为礼萨·希亚·巴列维国王。"
03_persia_events.39.b:0 "礼萨更喜欢一个总统制共和国，他是其首领，但英国对波斯人民的心愿不感兴趣。”
03_persia_events.39.c:0 "礼萨·汗没有强大的野心，他只想实现国家现代化，保卫自己的国家。"

03_persia_events.40.t:0 "退位还是战斗？"
03_persia_events.40.d:0 "俄罗斯威胁说如果亲德派礼萨不退位，他们将接管这个国家。"
03_persia_events.40.f:0 "对于俄罗斯来说，德国是一个巨大的威胁。他们最终与英国在该地区达成了协议，不需要德国现在介入。”"
03_persia_events.40.a:0 "礼萨可以容忍退位，让位给他的儿子。"
03_persia_events.40.b:0 "礼萨拒绝被任何人驱赶，甚至是伟大的俄罗斯熊。"

03_persia_events.41.t:0 "归国的国民"
03_persia_events.41.d:0 "穆罕默德·摩萨德克，一位才华横溢的人，也是卡贾尔王朝的遥远王室成员，已经回到了这个国家。"
03_persia_events.41.f:0 "“摩萨德克在瑞士诺伊舍泰尔大学获得了博士学位，并成为第一个从欧洲大学获得法学博士学位的伊朗人。他曾是议会的成员，在它被解散之前。然后是在礼萨·汗担任首相的时候，但当立法机构选举他为国王时，他以抗议的方式辞职。”"
03_persia_events.41.a:0 "摩萨德克参加了议会选举并获胜。"

03_persia_events.42.t:0 "摩萨德克胜利！"
03_persia_events.42.d:0 "摩萨德克现在是总理了！"
03_persia_events.42.f:0 "新政府希望引入广泛的社会改革：失业补偿金，工厂所有者被命令向生病和受伤的工人支付福利，并解放农民，使他们摆脱在地主庄园中的强迫劳动。然而，这将是昂贵的，摩萨德克需要一种支付这些费用的方法。”"
03_persia_events.42.a:0 "与之前的埃米尔·卡比尔一样，一个真正的改革派再次掌握了伊朗政府的控制权。"
03_persia_events.43.t:0 "海上封锁"
03_persia_events.43.d:0 "英国正在对我们实施封锁，以阻止我们销售我们自己的石油。"
03_persia_events.43.f:0 "“尽管摩萨德克表示我们会用我们石油利润的25%来补偿英国人，但他们绝不会接受少于100%。”"
03_persia_events.43.a:0 "人们比以往任何时候都更支持总理。"
03_persia_events.43.b:0 "这不值得。我们应该摆脱摩萨德克。”

03_persia_events.44.t:0 "美国干预"
03_persia_events.44.d:0 "英国已经多次向#yellow 美利坚#!寻求帮助，这一次声称是为了阻止共产主义在伊朗传播。伦敦街头的报纸，到处刊登说#yellow 摩萨德克#!是一个#yellow 共产主义者#!，会把伊朗变成一个邪恶的#yellow 红色#!国度。"
03_persia_events.44.f:0 "“#yellow 美利坚#!认为英国这样做是错误的，并拒绝了多次帮助请求。事实上，摩萨德克两次被时代杂志评为“年度人物”。美国人很喜欢他！”"
03_persia_events.44.a:0 "#yellow 美利坚#!如此痛恨和恐惧共产主义，以至于他们甚至会接受这种认为#yellow 摩萨德克#!是一个#yellow 共产主义者#!的谣言。"
03_persia_events.44.b:0 "#yellow 美利坚#!坚持他们的理想，并拒绝帮助英国。让英国来找我们吧。我们将展示两个强大而自豪的民主国家的力量。”

03_persia_events.45.t:0 "结局？"
03_persia_events.45.d:0 "中央情报局已经渗透到伊朗，策划发动政变。"
03_persia_events.45.f:0 "“西奥多·罗斯福的孙子，柯米特·罗斯福，是中央情报局摧毁新兴民主的主要人物。如果今天还活着，那个粗鲁的骑手会怎么说？”"
03_persia_events.45.a:0 "政变成功，摩萨德克被流放，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]比以往任何时候都更强大，对自由主义者更加警惕。如果这只是伊朗悲惨历史的结束就好了……"
03_persia_events.45.b:0 "不。这不是伊朗真正民主的终结。我们必须与此作斗争。用我们所能拥有的一切来对抗。每一个未来的伊朗人都寄希望于我们。”

03_persia_events.46.t:0 "霍华德·巴斯克维尔"
03_persia_events.46.d:0 "在大不里士的一名美国传教士想要组织他的学生成立一个军事力量，帮助打破沙阿对大不里士的包围。美国政府坚持要求霍华德不要干涉另一个国家的事务。"
03_persia_events.46.f:0 "“他一直重复着，他无法坐视这座城市的饥民通过教室的窗户来为他们的权利而战。”"
03_persia_events.46.a:0 "霍华德拒绝放弃一个为理想而战的国家。"
03_persia_events.46.b:0 "在压力下，霍华德崩溃了，返回教学。

03_persia_events.47.t:0 "美国的命运"
03_persia_events.47.d:0 "霍华德试图率领他的部队打破对大不里士人民的包围，为他们获取食物和物资。"
03_persia_events.47.f:0 "“城里准备就绪的消息让情况变得复杂起来。我们的目标是山伯·加赞。据我记得，我们大约有人。我们用了大约一个小时到山伯·加赞。从小巷右侧的花园进入那条小巷，贝斯克维尔突然喊道“进攻”，开始前进。我跟在他后面，还有几个人伴随着。依然是一片寂静，也许是攻击者想要给对方一个惊喜。天还是黑的，突然一连串的枪声打在我们身上。”"
03_persia_events.47.a:0 "霍华德在枪声中中弹身亡。伊朗永远不会忘记这位美国烈士的牺牲。"
03_persia_events.47.b:0 "霍华德和他的部队成功打破了包围。这位不太可能的伊朗英雄让我们离推翻[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]更近了一步。"

03_persia_events.48.t:0 "重建社区"
03_persia_events.48.d:0 "破坏性的吉兹亚税已经被废除，但哈塔里亚想做更多。"
03_persia_events.48.f:0 "在孟买，巴尔希切萨尔的领导人召开了一次会议，审查了哈塔里亚的报告，并启动了筹款计划，用于学校、火庙和达克玛的建设。"
03_persia_events.48.a:0 "如果他们想要自己筹资，那么[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]不会对此有任何异议。"
03_persia_events.48.b:0 "我们可以提供一点慈善来帮助他们。"
03_persia_events.48.c:0 "哈塔里亚已经搅起了足够的麻烦。他已经完成了他来这里的任务，必须离开。"

03_persia_events.49.t:0 "沙阿的影响"
03_persia_events.49.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]希望有更多人能支持埃米尔·卡比尔即将建立的共和国。在他的影响下，有部分教士和贵族决定支持#yellow 埃米尔·卡比尔#!的共和理念。"
03_persia_events.49.f:0 "“头戴皇冠的人的责任重大。我相信有个英国家伙曾经说过这句话。关键是，我打算退居乡间，过上平静的生活。当然，和我后宫的姑娘们一起。”"
03_persia_events.49.a:0 "他制止了王室中最反动的成员。"

03_persia_events.50.t:0 "竞选总统！"
03_persia_events.50.d:0 "人们为总统高呼一个名字——#yellow 埃米尔·卡比尔#!！尽管也有其他杰出的选举领袖，但#yellow 埃米尔·卡比尔#!的改革所带来的威望，让其他候选人难以匹敌。"
03_persia_events.50.f:0 "“伊朗应该有一个像#yellow 埃米尔·卡比尔#!这样的伟大领袖。有了他，伊朗不仅将对人民繁荣，而且将再次成为一个伟大的国家。”"
03_persia_events.50.a:0 "接受人民的慈善捐款来帮助赢得选举。"
03_persia_events.50.b:0 "让他利用自己的声望。他不可能失败！"
03_persia_events.50.c:0 "压制#v $aristocrats$#!的选票。我们不能让那些反动分子获得任何权力。"

03_persia_events.51.t:0 "《事件编年史》"
03_persia_events.51.d:0 "《Vaqaye'-e Ettefaqiyeh》这家报纸在#yellow 埃米尔·卡比尔#!的指导下，已经平版印刷了几百份，准备开始销售给我们的臣民。它将成为我们国家第二份波斯语的报纸，专门讲述王朝宫廷的最新动态，以及我们境外的历史发展。只得一提的是，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]也对这份公报怎么描述自己颇感兴趣。"
03_persia_events.51.f:0 "“哇。我们过去只有一家报纸，但现在我们有两家！也许有一天我们会有第三家。一个人能做梦吧？”"
03_persia_events.51.a:0 "它应该宣传#yellow 埃米尔·卡比尔#!的改革。"
03_persia_events.51.b:0 "报纸的目的是告诉人们世界上发生的事情。"

03_persia_events.52.t:0 "恢复边界"
03_persia_events.52.d:0 "我们的前国民对摆脱他们的前俄国主子感到高兴。"
03_persia_events.52.f:0 "“亚美尼亚和阿塞拜疆在1800年代初被俄国夺走了。他们会三思而后行的。”"
03_persia_events.52.a:0 "人民被爱国热情所感染，希望我们夺取亚美尼亚的其余部分。"
03_persia_events.52.b:0 "我们将给俄罗斯人耻辱的条件，这将使他们在国际社会看起来软弱无力。"

03_persia_events.53.t:0 "伴随着伟大的力量..."
03_persia_events.53.d:0 "毫无疑问，我们将再次成为一个伟大的国家，但真正的问题是我们将如何行使这种力量。"
03_persia_events.53.f:0 "“在这个新时代，行使权力有许多不同的方式。”"
03_persia_events.53.a:0 "如果我们想与其他大国竞争，我们必须征服和殖民。"
03_persia_events.53.b:0 "经济才是这个新时代国家的真正力量。"
03_persia_events.53.c:0 "没有人民，我们一无所有。国家的存在是为了服务他们。"

03_persia_events.54.t:0 "让路，法国"
03_persia_events.54.d:0 "我们的食物以其精致的口味而闻名于世。"
03_persia_events.54.f:0 "“世界各地最豪华的餐厅不再需要法国厨师，而是波斯厨师。让位于牛排，烤肉将在餐桌上占据主导地位。”"
03_persia_events.54.a:0 "我们必须专注于发展波斯料理产业。"
03_persia_events.54.b:0 "宣传我们的食物是世界上最好的。"

03_persia_events.55.t:0 "军事的焦点"
03_persia_events.55.d:0 "现在我们拥有了现代化的军队，我们必须决定它应该专注于什么。"
03_persia_events.55.f:0 "“拥有一个弱小的军队将导致像其他许多国家一样被大国吞并。”"
03_persia_events.55.a:0 "我们必须用它来扩张我们的疆域。"
03_persia_events.55.b:0 "我们只需要它作为对抗敌对势力的威慑力。"
03_persia_events.55.c:0 "我们应该用它来帮助殖民。这就是大国变得如此强大的方式。"

03_persia_events.56.t:0 "伊朗崛起"
03_persia_events.56.d:0 "我们已经将我们的中东兄弟姐妹纳入了我们的怀抱，让他们可以茁壮成长。"
03_persia_events.56.f:0 "“有人质疑我们的共和国征服了许多其他国家，但罗马不是也是这样吗？”"
03_persia_events.56.a:0 "伟大的伊朗和伟大的英国。只能有一个..."
03_persia_events.56.b:0 "随着伊朗和奥地利帝国的鼎盛时期，我们每个人都可以开始分割俄罗斯狗熊。"

03_persia_events.57.t:0 "永不恢复"
03_persia_events.57.d:0 "我们削弱了他们的实力。现在我们必须确保他们永远无法恢复。"
03_persia_events.57.f:0 "“军事力量不是与敌人打交道的唯一工具。”"
03_persia_events.57.a:0 "我们将破坏他们的经济。"
03_persia_events.57.b:0 "我们将不断提醒世界，我们是如何轻易地击败他们的。"
03_persia_events.57.c:0 "我们将确保他们的人民将他们失去的权力和地位归咎于他们的政府。"
03_persia_events.58.t:0 "新的臣民"
03_persia_events.58.d:0 "我们必须决定如何对待我们的新臣民。"
03_persia_events.58.f:0 "“这是将权力集中在国家的第一步。如果你对半个国家没有影响力，就无法建立一个强大而有效的国家。”"
03_persia_events.58.a:0 "他们以前的自治权不再存在。他们的目的是为了侍奉国王。"
03_persia_events.58.b:0 "他们中的许多人是部落的。我们应该派遣经验丰富的工人到他们的地区，帮助他们获得更现代化的职业资格。"
03_persia_events.58.c:0 "新臣民意味着新的劳动力。我们将把他们榨取到极限。"

03_persia_events.59.t:0 "政治策略"
03_persia_events.59.d:0 "我们的宫廷官员#yellow 埃米尔·卡比尔#!抓住了一次针对#yellow 奥斯曼#!的外交机会。"
03_persia_events.59.f:0 "“一个人必须抓住任何可以将情况转向有利于自己的机会。特别是当对方国家比你自己更强大时。”"
03_persia_events.59.a:0 "他找到了一个腐败的官员行贿。"
03_persia_events.59.b:0 "他指出了俄罗斯和英国最新的威胁行为，称他们才是真正的敌人。"
03_persia_events.59.c:0 "他的对手外交官犯了一个错误，而埃米尔·卡比尔利用这一点占了上风。"

03_persia_events.60.t:0 "埃米尔·卡比尔的去世"
03_persia_events.60.d:0 "谁将继续我们伟大统治者的遗志？"
03_persia_events.60.f:0 "“我们会想念你，埃米尔·卡比尔。尽管没有你，我们并不会迷失方向。你在激励伊朗人心中的现代伊朗的梦想继续。”"
03_persia_events.60.a:0 "我们需要一个有着相同民主价值观的人。"
03_persia_events.60.b:0 "我们下一任总统应该比埃米尔·卡比尔更进一步。"
03_persia_events.60.c:0 "我们进展得太快，以至于我们的人民跟不上。让我们选一个在任何问题上都没有立场的人。"

03_persia_events.61.t:0 "要求废除"
03_persia_events.61.d:0 "Hataria再次试图说服我们废除吉兹亚税。"
03_persia_events.61.f:0 "“这些人已经忍受了足够多的苦难，你们 Qajars 就不能把手从他们的喉咙上拿开吗？”"
03_persia_events.61.a:0 "让他发泄吧。这不会伤害我们。"
03_persia_events.61.b:0 "我们应该责怪乌拉玛坚持这种过时的法律。"

03_persia_events.62.t:0 "船只检查"
03_persia_events.62.d:0 "英国人开始登上我们的船只，借口是检查我们是否在出售奴隶。"
03_persia_events.62.f:0 "“他们无权这样做！我的意思是，奴隶制是不好的，但我已经不再做了...再也不做了。”"
03_persia_events.62.a:0 "我们应该忍受这种侮辱。"
03_persia_events.62.b:0 "这只是借口来骚扰我们。不要让他们上船。"

03_persia_events.63.t:0 "英国的垄断"
03_persia_events.63.d:0 "英国公司希望购买我们一些行业的独家权利。"
03_persia_events.63.f:0 "“英国人热爱金钱和廉价商品。但当他们有一支强大的军队支持时，这并不合适。”"
03_persia_events.63.a:0 "英国人真的不喜欢你阻止他们变得更富有。"
03_persia_events.63.b:0 "不要让他们购买一股份。"
03_persia_events.64.t:0 "贸易接管"
03_persia_events.64.d:0 "俄罗斯想接管我们的一个贸易中心的运营。"
03_persia_events.64.f:0 "“他们不能随便接管我们的贸易。我们从零开始建立了它们。”"
03_persia_events.64.a:0 "这只是一个贸易中心。与俄罗斯开战不值得。"
03_persia_events.64.b:0 "什么？他们找不到在俄罗斯建立自己贸易中心的地方吗？"

03_persia_events.65.t:0 "俄罗斯顾问"
03_persia_events.65.d:0 "沙阿希望为 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 派遣俄罗斯顾问。"
03_persia_events.65.f:0 "“我来帮助你 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]。沙皇把你视为一个同等的君主。如果你们要保住王位，就必须团结一致。”"
03_persia_events.65.a:0 "更多的顾问不会有害。"
03_persia_events.65.b:0 "我们不需要俄罗斯人在国王耳边耳语。"

03_persia_events.66.t:0 "锚地权"
03_persia_events.66.d:0 "俄罗斯想在我们的一个泻湖中获得锚地权。"
03_persia_events.66.f:0 "“他们用他们愚蠢的金属船占据了所有最好的捕鱼点！”"
03_persia_events.66.a:0 "他们有海军。我们不能就这样把他们赶走。"
03_persia_events.66.b:0 "邀请熊到我们的海岸边？我们可不这么认为！"

03_persia_events.67.t:0 "穆扎法尔丁的诞生"
03_persia_events.67.d:0 "[SCOPE.sCharacter('shah_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('mozaffar_scope').GetFullName] 的妻子生了一个儿子。新生的 [SCOPE.sCharacter('mozaffar_scope').GetFullName] 将被培养成 [ROOT.GetCountry.GetName] 的新 [SCOPE.sCharacter('mozaffar_scope').GetPrimaryRoleTitle]。"
03_persia_events.67.f:0 "“沙阿有 85 位妻子，生了很多儿子，但我们有一种预感，这个会留下来。”"
03_persia_events.67.a:0 "王位安全了！"

03_persia_events.68.t:0 "穆扎法尔丁的继任"
03_persia_events.68.d:0 "随着纳西尔丁的统治结束，[SCOPE.sCharacter('shah_scope').GetFullName] 作为所有波斯的沙阿登上了[ROOT.GetCountry.GetAdjective]王位。[SCOPE.sCharacter('shah_scope').GetHerHis|U] 的生活主要是追求快乐，他没有准备好承担沙阿的责任。"
03_persia_events.68.f:0 "“一方面，我不喜欢以前的沙阿。另一方面，这家伙并不完全糟糕，但他不知道自己在做什么。”"
03_persia_events.68.a:0 "沙阿万岁！"

03_persia_events.69.t:0 "穆罕默德·阿里的继任"
03_persia_events.69.d:0 "随着莫扎法尔丁的统治结束，[SCOPE.sCharacter('shah_scope').GetFullName] 作为所有波斯的沙阿登上了[ROOT.GetCountry.GetAdjective]王位。"
03_persia_events.69.f:0 "“出于某种原因，我觉得他会擅长打人...”"
03_persia_events.69.a:0 "沙阿万岁！"

03_persia_events.70.t:0 "#yellow 纳西尔丁#!遇刺"
03_persia_events.70.d:0 "[SCOPE.sCharacter('shah_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('shah_scope').GetFullName] 在访问一个神庙时，被阿富汗的一位追随者枪杀身亡。"
03_persia_events.70.f:0 "“如果我活下来，我会以不同的方式统治你们！呃.....”"
03_persia_events.70.a:0 "#yellow 纳西尔丁#!的统治时间是波斯历史上最长的......终于结束了。"
03_persia_events.70.b:0 "我还不想死，我还有很多未做的......医生，快来......"

03_persia_events.71.t:0 "名叫巴卜的商人"
03_persia_events.71.d:0 "来自设拉子的一位商人声称揭示了神的启示。"
03_persia_events.71.f:0 "“非常沉默寡言，除非绝对有必要，否则绝不开口。他甚至不回答我们的问题。他一直专注于自己的思想，并且一直在重复他的祈祷和经文。他被描述为一个带着细细胡须的英俊男子，穿着干净的衣服，披着绿色的披肩和黑色的头巾。”"
03_persia_events.71.a:0 "这种异端必须滚出我们的国家。"
03_persia_events.71.b:0 "他肯定不会对神职人员构成威胁。"

03_persia_events.72.t:0 "更多的巴比教徒"
03_persia_events.72.d:0 "巴卜吸引了更多人，承诺新的社会秩序。"
03_persia_events.72.f:0 "“当我们惊讶地站在他面前时，他写了一篇 50 页的论文，基于总督询问他是否是一个背教者。这篇论文对我们每个人都有所启发，并以一种让人感觉与神亲近的方式赞美上帝。”"
03_persia_events.72.a:0 "他们仍然是穆斯林。没什么可担心的。"
03_persia_events.72.b:0 "他们在挑战政府和正统神职人员。我们必须镇压他们。"
03_persia_events.72.c:0 "即使被流放，巴卜仍然在这个国家拥有影响力。"
03_persia_events.72.e:0 "我们需要派遣刺客对付他。这可能会使他成为烈士，但我们必须采取行动。"

03_persia_events.74.t:0 "枪决队"
03_persia_events.74.d:0 "成千上万的人聚集在大不里士观看巴卜在大不里士的执行，但当枪决队开枪时，他毫发无伤..."
03_persia_events.74.f:0 "“我们站成一排向这个背教者开枪。当烟雾散去时，我们唯一成功的是摧毁了捆绑他的绳子。也许这家伙是麦地...”"
03_persia_events.74.a:0 "他的追随者可能会得到一个烈士，但我们必须立即结束这一切。再次开火。"
03_persia_events.74.b:0 "枪决队认为他的幸存是一个奇迹，立即皈依。现在，全国各地的人们也在这样做。"

03_persia_events.75.t:0 "巴比教确立"
03_persia_events.75.d:0 "随着巴比教席卷全国，我们必须接受它已经来到了这里。"
03_persia_events.75.f:0 "“一个新的和平与进步时代已经到来。有了麦地在世界上，而且还是在波斯，我们所有的苦难很快都会过去。”"
03_persia_events.75.a:0 "旧的东西要被淘汰，新的东西要被接纳。"
03_persia_events.75.b:0 "我们必须保持警惕，保护旧秩序。"

03_persia_events.76.t:0 "波斯的拜火教徒"
03_persia_events.76.d:0 "波斯祆教福利基金的一位拜火教活动家，[SCOPE.sCharacter('hataria_scope').GetFullName]，被任命为印度古吉拉特邦波斯祆教人的使者。他希望被允许进入该国，帮助生活在波斯的拜火教徒。"
03_persia_events.76.f:0 "“恺加王朝在他们统治的岁月里对待他们非常残忍，摧毁了这个社区。另一方面，额外的税收也不错。”"
03_persia_events.76.a:0 "让他进来。沙阿不会改变主意。"
03_persia_events.76.b:0 "对沙阿统治的任何质疑都是对君主制观念的威胁。"

03_persia_events.77.t:0 "学成归来"
03_persia_events.77.d:0 "[SCOPE.sCharacter('amir_kabir_scope').GetFullName]作为我们#yellow 驻俄使团#!的初级成员，对我们邻国#yellow 俄罗斯#!的力量有很深的见解。作为曾经#yellow 阿塞拜疆#!的部长，他也目睹了伊朗省级行政管理的不足。在#yellow 奥斯曼#!任职期间，他还研究了另一个伊斯兰政府在现代化方面取得的进展。在走访多国观察改革成效后，[SCOPE.sCharacter('amir_kabir_scope').GetFirstName]决定回到祖国，开展许多必要的改革。"
03_persia_events.77.f:0 "[SCOPE.sCharacter('amir_kabir_scope').GetFirstName]作为宫廷成员，曾帮助#yellow 纳西尔丁#!确保王储的王位继承。出于感激，#yellow 纳西尔丁#!任命他为首席大臣，并嫁给了他自己的姐姐。如果伊朗要作为一个主权国家生存下去，我们不得不依赖[SCOPE.sCharacter('amir_kabir_scope').GetFirstName]的智慧，进行一系列重要而根本的改革。"
03_persia_events.4.c:0 "#yellow 纳西尔丁#!将改革派的[SCOPE.sCharacter('amir_kabir_scope').GetFirstName]任命为首席部长，并授予他#yellow 埃米尔·卡比尔#!的荣誉头衔，象征着伟大的统治者。"

03_persia_events.78.t:0 "崭新的议会"
03_persia_events.78.d:0 "随着宪法的成功颁布，第一届由人民选举产生的议会正式诞生。新成立的议会第一项议题就是[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]的去留问题。"
03_persia_events.78.f:0 "宪法以#yellow 比利时宪法#!为蓝本，权力不再取决于国王，而是取决于人民的意愿。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]和他所代表的机构已经合而为一，破败、失败、苍老、虚弱。"
03_persia_events.78.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]选择和平地退位。"
03_persia_events.78.b:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]不想体面地离开，于是议会默许一群愤怒的民众闯进他的皇宫，将他......"

03_persia_events.79.t:0 "贵族的报复"
03_persia_events.79.d:0 "[SCOPE.sCharacter('intelligentsia_ig_leader_scope').GetFullName]削减皇室开支的改革行为，严重触犯了一众贵族的利益。在一个漆黑的夜晚，我们的卫队发现[SCOPE.sCharacter('intelligentsia_ig_leader_scope').GetFirstName]倒在走廊角落，浑身上下都是血红的伤痕。很明显，有人对他进行了残酷的报复。"
03_persia_events.79.f:0 "幸好我们的卫兵即使发现[SCOPE.sCharacter('intelligentsia_ig_leader_scope').GetFullName]并送他去就医，否则他当晚就要去见#green 真主#!了。"
03_persia_events.79.a:0 "混蛋！"

03_persia_events.80.t:0 "波斯的争夺"
03_persia_events.80.d:0 "在[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]的精心布局下，我们已经得到许多#yellow 波斯地区#!的商业利益。一些我们的商人和资本家已经牢牢控制了#yellow 波斯#!的经济命脉，但是他们不满足于此，希望我们能够从政治上完全掌控#yellow 波斯#!，以保证他们的经济投资稳定不受侵犯。"
03_persia_events.80.f:0 "陛下，#yellow 波斯#!的血管已流淌着我们的黄金——我们的铁路贯穿其腹地，银行掌控其财政，鸦片贸易支配它的南方省份。此刻的#yellow 波斯#!比玻璃更脆弱，只需陛下派遣一个军团，就可以轻松用刺刀说服他们的君主，让波斯湾成为我们最大的贸易天堂。"
03_persia_events.80.a:0 "我们需要一个可以和波斯做贸易的#yellow 港口#!。"
03_persia_events.80.b:0 "波斯应该#yellow 臣服#!于我们。"
03_persia_events.80.c:0 "谁也不准夺走我们在#yellow 波斯的利益#!！"
03_persia_events.80.e:0 "波斯是我们#yellow 友好#!的贸易伙伴，希望我们的合作能一直继续。"

03_persia_events.81.t:0 "英国贷款"
03_persia_events.81.d:0 "#yellow 英国#!同意了我们的贷款请求，我们需要决定如何使用大部分从英国获取的贷款。"
03_persia_events.81.f:0 "“贷款数额巨大，但利率也相当高……”"
03_persia_events.81.a:0 "用于#v $aristocrats$#!的奢华派对！他们需要休息一下，摆脱所有的辛苦劳作。"
03_persia_events.81.b:0 "建设项目！成百上千的建设项目！"
03_persia_events.81.c:0 "先知#green 穆罕默德#!总是谈论照顾穷人。"

03_persia_events.82.t:0 "俄罗斯贷款"
03_persia_events.82.d:0 "#yellow 俄罗斯#!同意了我们的贷款请求，我们需要决定如何使用大部分贷款。"
03_persia_events.82.f:0 "“贷款数额巨大，但利率也相当高，我们需要谨慎决定贷款的用途……”"
03_persia_events.82.a:0 "用于#v $aristocrats$#!的奢华派对！他们需要休息一下，摆脱所有的辛苦劳作。"
03_persia_events.82.b:0 "建设项目！成百上千的建设项目！"
03_persia_events.82.c:0 "先知#green 穆罕默德#!总是谈论照顾穷人。"

 #Afghanistan
 01_afghanistan_events.1.t:0 "你的统治"
01_afghanistan_events.1.d:0 "现在，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 统一了 [ROOT.GetCountry.GetName]", 他必须选择他希望如何统治。
01_afghanistan_events.1.f:0 "“我们曾经分裂成几个相互争斗的酋长国。我身边的每个人都在庆祝，但我不确定这如何影响我们这些在农田里耕作的农民。”"
01_afghanistan_events.1.a:0 "他必须成为所有人民的父亲守护者，无论他们的种族如何。"
01_afghanistan_events.1.b:0 "他的臣民生来就是为了侍奉他。"
01_afghanistan_events.1.c:0 "谁在乎人民？征服才是最重要的。"

01_afghanistan_events.2.t:0 "无人挑战者"
01_afghanistan_events.2.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 新统治面临的最大威胁已经消失。"
01_afghanistan_events.2.f:0 "“我每天向阿拉祈祷，希望他能把我们从这个暴君手中解救出来。我一直都不擅长方向，我一定是在整个时间里朝着麦加的相反方向祈祷了。”"
01_afghanistan_events.2.a:0 "现在他可以毫无顾忌地坐在他的王位上。"
01_afghanistan_events.2.b:0 "他必须竭尽全力击败其他挑战王位的人。"
01_afghanistan_events.2.c:0 "任何对杜斯特·穆罕默德·汗表示支持的人都必须被示众。"

01_afghanistan_events.3.t:0 "汗的回归"
01_afghanistan_events.3.d:0 "现在，沙赫·舒贾去世了，杜斯特·穆罕默德·汗成为了 [ROOT.GetCountry.GetName] 的无可争议的统治者。"
01_afghanistan_events.3.f:0 "“我们的祈祷得到了回答！沙赫去世了！沙赫万岁！”"
01_afghanistan_events.3.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 对沙赫·舒贾的支持者进行了全面的特赦。他们只是出于对他的恐惧而侍奉他。"
01_afghanistan_events.3.b:0 "阿克巴拒绝为他的父亲让位，并将喀布尔保留给自己。沙赫·舒贾的支持者被他镇压了。"

01_afghanistan_events.4.t:0 "报应"
01_afghanistan_events.4.d:0 "我们已经赢得了自由，但我们的#yellow 俄罗斯#!敌人不会那么轻易放过。"
01_afghanistan_events.4.f:0 "“我说我们越过他们的土地，入侵他们的首都，用#yellow 猪#!替换他们的领导，然后砍掉所有男性的左耳。这会教训他们的！”"
01_afghanistan_events.4.a:0 "我们会伪装自己的软弱，让他们看起来更糟，因为他们输给了我们。"
01_afghanistan_events.4.b:0 "我们将向全世界公开他们在占领期间犯下的暴行。"
01_afghanistan_events.4.c:0 "要求他们支付帮助重建的费用，因为他们造成了如此多的破坏。"

01_afghanistan_events.5.t:0 "勇敢的战士"
01_afghanistan_events.5.d:0 "[SCOPE.sCharacter('yazer_scope').GetFullName] 以他大胆的军事壮举赢得了人民的赞赏。"
01_afghanistan_events.5.f:0 "“与其他将军不同，他直接率领我们进入战斗。其他将军只是在他们的帐篷里安全地发布命令。”"
01_afghanistan_events.5.a:0 "人们应该赞美沙阿，而不是他的宿敌！"
01_afghanistan_events.5.b:0 "沙阿不愿承认，但[SCOPE.sCharacter('yazer_scope').GetFullName] 在这场战争中是不可或缺的。"

01_afghanistan_events.6.t:0 "施行正义"
01_afghanistan_events.6.d:0 "当地人开始去找[SCOPE.sCharacter('yazer_scope').GetFullName] 解决他们的争端。"
01_afghanistan_events.6.f:0 "“我曾经看到他解决两个声称是一个孩子的母亲的争端。[SCOPE.sCharacter('yazer_scope').GetFullName]说，保持公平的唯一方法是用剑把孩子劈成两半。当他举起剑时，其中一位妇女阻止了他，并说把孩子交给另一个妇女。他宣称阻止他的那个人才是真正的母亲，因为她担心他的安全。太聪明了！他是从哪里得到这些想法的？”"
01_afghanistan_events.6.a:0 "裁决应该是为了沙阿而作出的！"
01_afghanistan_events.6.b:0 "沙阿为不必处理这些琐事而感到宽慰。"

01_afghanistan_events.7.t:0 "反对"
01_afghanistan_events.7.d:0 "[SCOPE.sCharacter('yazer_scope').GetFullName] 希望尽一切可能反对 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]，现在他正在说服他的#v $aristocrats$#!同僚阻碍沙阿的最新法律。"
01_afghanistan_events.7.f:0 "“我夹在沙阿和国家中真正有权力的人之间。我想我会抛硬币决定。”"
01_afghanistan_events.7.a:0 "任何违背沙阿意志的人都将被视为叛徒！"
01_afghanistan_events.7.b:0 "这项法律不值得为之争吵。"

01_afghanistan_events.8.t:0 "抵抗"
01_afghanistan_events.8.d:0 "我们的侵略者为他们的胜利而沾沾自喜。他们认为胜利已经到手，但我们只是刚刚开始。"
01_afghanistan_events.8.f:0 "“我已经准备好战斗了...怎么开枪？”"
01_afghanistan_events.8.a:0 "我们不会再等待一天。[ROOT.GetCountry.GetName] 必须自由！"
01_afghanistan_events.8.b:0 "如果我们在准备好之前就冒险寻求自由，那么这将使我们倒退数十年。"

01_afghanistan_events.9.t:0 "征募人口"
01_afghanistan_events.9.d:0 "我们需要说服更多的人民起来反抗侵略者。"
01_afghanistan_events.9.f:0 "“我被承诺只要来到这个营地就会得到面包--你为什么给我一把枪？”"
01_afghanistan_events.9.a:0 "呼吁大众的爱国主义情感。"
01_afghanistan_events.9.b:0 "任何成年男子如果不参军就应该被枪毙。"
01_afghanistan_events.9.c:0 "已经自愿加入的抵抗战士已经足够了。"

01_afghanistan_events.10.t:0 "山寨堡垒"
01_afghanistan_events.10.d:0 "我们应该利用我们的山地地形来谋取利益。"
01_afghanistan_events.10.f:0 "“我妈妈总是在我独自进入山区时责骂我。现在抵抗力量来找我帮助拯救[ROOT.GetCountry.GetName]。现在谁是令人失望的母亲？！”"
01_afghanistan_events.10.a:0 "让他们在山区里四处搜寻我们，而他们的军队因疾病和叛逃而支离破碎。"
01_afghanistan_events.10.b:0 "我们将使用游击战术诱使他们陷入山区的伏击。"
01_afghanistan_events.10.c:0 "我们不会逃跑和隐藏。我们将在明处与他们战斗。"

01_afghanistan_events.11.t:0 "外国国家的武器"
01_afghanistan_events.11.d:0 "一个大国想要秘密向我们输送武器。"
01_afghanistan_events.11.f:0 "“没有人知道我们的将军们给我们的武器来自何处，但它们肯定不是在这里制造的。唯一的线索是上面写着一些语言，这里没有人能理解 'made in the U.S.'”"
01_afghanistan_events.11.a:0 "我们会尽可能获取所有的武器。"
01_afghanistan_events.11.b:0 "我们宁愿他们派遣一个懂得如何使用更先进武器的将军。"
01_afghanistan_events.11.c:0 "我们不会让自己受制于另一个国家。"

01_afghanistan_events.12.t:0 "报复"
01_afghanistan_events.12.d:0 "我们赢得了自由，但我们的#yellow 英格兰#!敌人不会那么轻易放过我们。"
01_afghanistan_events.12.f:0 "“我建议我们越过他们的土地，入侵他们的首都，用#yellow 猪#!替换他们的领导，然后砍掉所有男性的左耳。那会教训他们的！”"
01_afghanistan_events.12.a:0 "我们会假装自己的软弱，让他们因为输给我们而看起来更糟糕。"
01_afghanistan_events.12.b:0 "我们将向全世界宣传他们在占领期间犯下的暴行。"
01_afghanistan_events.12.c:0 "要求他们支付帮助重建所造成的所有损害。"
 
 01_afghanistan_events.13.t:0 "现在怎么办？"
01_afghanistan_events.13.d:0 "强国们贪婪地注视着我们的土地，但我们能做些什么呢？"
01_afghanistan_events.13.f:0 "“这些外国国家正在吞噬我们周围的所有人。我们需要为不可避免的情况做好准备。”"
01_afghanistan_events.13.a:0 "我们必须成为像他们那样的大王国，才能与他们平起平坐地抗衡。"
01_afghanistan_events.13.b:0 "许多其他人也处于同样的困境。我们应该团结起来。"
01_afghanistan_events.13.c:0 "与强国对抗只会激怒他们。让我们专注于统治我们的人民。"

01_afghanistan_events.14.t:0 "下一步"
01_afghanistan_events.14.d:0 "我们夺取了敌人的首都，但为什么就此止步呢？"
01_afghanistan_events.14.f:0 "“我的整个村庄都在庆祝我们的军队进军莫斯科的那一天，当他们进入伦敦城时更是如此。我从未想过我会活着看到这一天，尽管我怀疑英国人和俄罗斯人更加震惊。”"
01_afghanistan_events.14.a:0 "我们要求以货物的形式支付贡品！"
01_afghanistan_events.14.b:0 "我们也应该羞辱其他大国！"
01_afghanistan_events.14.c:0 "我们不会像那些怪物一样。他们可以拿回他们的土地。我们已经教训了他们和所有其他强国，不要惹我们。"

01_afghanistan_events.15.t:0 "自己泡茶"
01_afghanistan_events.15.d:0 "夺取他们的首都后，东印度贸易公司将在几天内崩溃。"
01_afghanistan_events.15.f:0 "“我从未理解一个整个公司怎么能控制一个整个国家。然后有人给了我一本解释资本主义的书，一切就都说得通了。”"
01_afghanistan_events.15.a:0 "印度是我们的了！"
01_afghanistan_events.15.b:0 "一举夺取整个国家只会导致叛乱。让我们以适当的速度征服它。"
01_afghanistan_events.15.c:0 "印度的自由国家将成为伟大的盟友。"

01_afghanistan_events.16.t:0 "大臣行动"
01_afghanistan_events.16.d:0 "[SCOPE.sCharacter('coup_leader').GetFullName] 终于采取行动，要夺取王位。"
01_afghanistan_events.16.f:0 "“当然，国王可能是个邪恶的暴君，把他的臣民当作蚂蚁，但你不能就这样除掉他。这违背了传统。”"
01_afghanistan_events.16.a:0 "其他#v $aristocrats$#!都支持 [SCOPE.sCharacter('coup_leader').GetFullName]。"
01_afghanistan_events.16.b:0 "要求#v $aristocrats$#!们迅速地服从，对那些不服从的人采取严厉的惩罚。"

01_afghanistan_events.17.t:0 "从大臣到国王"
01_afghanistan_events.17.d:0 "Yaz 是新的沙阿！"
01_afghanistan_events.17.f:0 "“就新国王而言，这还算是无血的。”"
01_afghanistan_events.17.a:0 "国王万岁！"
01_afghanistan_events.17.b:0 "人们不会忘记新国王不是 [ROOT.GetCountry.GetName] 的合法统治者。"

01_afghanistan_events.18.t:0 "继承"
01_afghanistan_events.18.d:0 "尽管埃米尔明确表示他希望他的儿子在他去世后继续统治，但他的兄弟们有自己的想法。"
01_afghanistan_events.18.f:0 "“谁统治我们真的重要吗？不管谁坐在王位上，我们都种自己的食物，照顾家人。”"
01_afghanistan_events.18.a:0 "[SCOPE.sCharacter('rahim_dil').GetFullName] 得到了#v $aristocrats$#!的支持。"
01_afghanistan_events.18.b:0 "[SCOPE.sCharacter('mir_dil').GetFullName] 得到了军队的尊重。反对他是愚蠢的。"
01_afghanistan_events.18.c:0 "科汉迪尔的愿望必须得到遵守。"

 
01_afghanistan_events.19.t:0 "中毒"
01_afghanistan_events.19.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 被毒害了！"
01_afghanistan_events.19.f:0 "“我告诉国王，我应该先尝试他的食物，但他说狗不会和国王共进餐。”"
01_afghanistan_events.19.a:0 "给他找医生！"
01_afghanistan_events.19.b:0 "让这个怪物被毒药杀死吧。"

01_afghanistan_events.20.t:0 "刺杀"
01_afghanistan_events.20.d:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 被刺伤了！"
01_afghanistan_events.20.f:0 "“我看到他从宫殿出来时，朱贾乌德道拉刺了他。显然，他的叔叔奥斯曼·汗说服他这样做。”"
01_afghanistan_events.20.a:0 "在他把我们所有人都斩首之前给他找医生！"
01_afghanistan_events.20.b:0 "没有他我们会过得更好。让他流血至死吧。"

01_afghanistan_events.21.t:0 "溺水"
01_afghanistan_events.21.d:0 "卫兵发现有人试图淹死[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]在他的浴缸里！"
01_afghanistan_events.21.f:0 "“我要来看国王。我听到门的另一边有挣扎声和水花声。我打开门，果然。有个刺客潜入了。”"
01_afghanistan_events.21.a:0 "制止凶手！"
01_afghanistan_events.21.b:0 "关闭门，假装什么都没看见。"

01_afghanistan_events.22.t:0 "英国统治的终结！"
01_afghanistan_events.22.d:0 "随着失去其首都，[ROOT.GetCountry.GetName] 濒临崩溃。看来 [SCOPE.sCulture('british_culture').GetName] 统治已经结束了。"
01_afghanistan_events.22.f:0 "“放弃我们的岗位？什么岗位，什么军队？几个小时后，这个地方将充满印度教徒，或者被点燃，或者两者兼有。现在停止抱怨，拿起那个袋子。拿走一切有价值的东西，除了钉子。”"
01_afghanistan_events.22.a:0 "印度将在王子之间划分。"
01_afghanistan_events.22.b:0 "这是一个印度国家的诞生。"
01_afghanistan_events.22.c:0 "英国统治必须不惜一切代价维持。"

01_afghanistan_events.23.t:0 "够了吗？"
01_afghanistan_events.23.d:0 "我们已经确保了祖国的防御，但我们愿意走多远呢？"
01_afghanistan_events.23.f:0 "“当然，我们可能是安全的，但能持续多久呢？”"
01_afghanistan_events.23.a:0 "如果我们能够占领伦敦，那么英国将永远不敢再与我们为敌。"
01_afghanistan_events.23.b:0 "如果我们占领莫斯科，俄罗斯熊将永远不敢对我们出手。"
01_afghanistan_events.23.c:0 "东印度公司是英国进入该地区的入口。我们必须结束他们。"
01_afghanistan_events.23.e:0 "任何更具侵略性的行动都可能激怒他们。我们只需要坚守阵地。"

01_afghanistan_events.24.t:0 "海军模式"
01_afghanistan_events.24.d:0 "我们新海军的重点是什么？"
01_afghanistan_events.24.f:0 "“[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName] 想要建立一支海军？我们四面环山。他是在建造可以在陆地上行驶的新
01_afghanistan_events.24.a:0 "我们应该专注于建立用于海外贸易的港口。"
01_afghanistan_events.24.b:0 "我们需要强大的舰艇来防御我们的敌人。"
01_afghanistan_events.24.c:0 "没有现代化的海军理论支持，海军就是无用的。"

01_afghanistan_events.25.t:0 "边界争端解决"
01_afghanistan_events.25.d:0 "我们已经解决了边界问题，必须决定我们要如何对待邻国。"
01_afghanistan_events.25.f:0 "“他们怎么知道边界在哪里结束，边界在哪里开始？我看到地图上有小小的线，但地面上没有。”"
01_afghanistan_events.25.a:0 "我们需要冷静对待我们更强大的邻国。"
01_afghanistan_events.25.b:0 "我们正势头正盛。我们应该在他们虚弱时尽可能多地从他们那里得到利益。"

01_afghanistan_events.26.t:0 "筑墙"
01_afghanistan_events.26.d:0 "我们的首都有一个很好的缓冲区。"
01_afghanistan_events.26.f:0 "“那么，占领俄罗斯边境的所有土地会让我们远离他们吗？如果你这么说的话。”"
01_afghanistan_events.26.a:0 "我们需要专注于训练我们的新属民参加军队。"
01_afghanistan_events.26.b:0 "我们需要一个更大的缓冲区。"

01_afghanistan_events.27.t:0 "库鲁台"
01_afghanistan_events.27.d:0 "代表们成群结队地到达。每一个到达都被视为对我们的可汗参加库鲁台的一票。"
01_afghanistan_events.27.f:0 "“我真的不喜欢我的可汗，所以我想试试一个新的。有什么坏处呢？”"
01_afghanistan_events.27.a:0 "可汗声称对该地区的其余部分拥有主权。"
01_afghanistan_events.27.b:0 "可汗将成为我们人民的捍卫者，并欢迎我们在其他国家被不平等对待的文化兄弟姐妹。"
01_afghanistan_events.27.c:0 "可汗宣称自己是可汗之王。引用成吉思汗的旧称号将增强我们人民通过战争实现目标的偏好。不过，提到成吉思汗会引起世界其他地方的警觉，原因是显而易见的。"

01_afghanistan_events.28.t:0 "部落补贴"
01_afghanistan_events.28.d:0 "英国政府对贿赂阿富汗部落以忍受占领者的成本感到厌烦。"
01_afghanistan_events.28.f:0 "“这些成本太荒谬了！为了什么？贿赂一群部落人不攻击我们的专业现代军队？我们会没事的。”"
01_afghanistan_events.28.a:0 "我们无能为力。"
01_afghanistan_events.28.b:0 "他们不明白他们正在释放什么。我们应该提议支付其中一部分的费用。"

01_afghanistan_events.29.t:0 "阿富汗起义"
01_afghanistan_events.29.d:0 "阿克巴汗利用城市中不断升级的紧张局势对抗英国，宣布了一场起义，喀布尔的市民们加入了他！"
01_afghanistan_events.29.f:0 "“他杀了亚历山大·伯恩斯爵士及其工作人员，但艾尔芬斯通少将没有采取任何行动。他们被鼓舞起来开始在城市内外压制英国军队。”"
01_afghanistan_events.29.a:0 "我们需要帮助英国。我们的报复不会立即到来，但迟到总比不到好。"
01_afghanistan_events.29.b:0 "艾尔芬斯通少将与阿克巴汗谈判，为他的军队和随同他们的平民安全撤退。作为交换，他留下了喀布尔市内的大部分英国武器给了阿克巴。"

01_afghanistan_events.30.t:0 "长途撤退"
01_afghanistan_events.30.d:0 "在喀布尔成功发动起义以驱逐英国驻军后，阿克巴协商交出武器和弹药，以换取安全撤离该国。"
01_afghanistan_events.30.f:0 "“我听到阿克巴用波斯语喊出‘饶他们一命！’，但用普什图语喊出‘杀了他们！’”"
01_afghanistan_events.30.a:0 "阿克巴信守诺言，允许他们安然离开。"
01_afghanistan_events.30.b:0 "阿克巴处死了英国留下的伤员和病人，袭击了撤退中的军队，用虚假的谈判再次愚弄了他们，并向该地区的部落提供枪支攻击他们。英国和印度士兵，他们的家人，仆人和平民工人。没有人得到宽容。"

01_afghanistan_events.31.t:0 "艾尔芬斯通军队的大屠杀"
01_afghanistan_events.31.d:0 "阿克巴及其部队屠杀了正在撤退的英国人。"
01_afghanistan_events.31.f:0 "“我听到阿克巴用波斯语喊出‘饶他们一命！’，但用普什图语喊出‘杀了他们！’”"
01_afghanistan_events.31.a:0 "阿克巴的部队在整个撤退过程中对他们进行了骚扰。英国和印度士兵，他们的家人，仆人和平民工人，总共约14,000人。所有人都被杀害或被俘虏，唯一的幸存者是助理外科医生，他们最后赶到了贾拉拉巴德。公司的声誉成为最后的受害者。"

01_afghanistan_events.32.t:0 "艾尔芬斯通军队的大屠杀"
01_afghanistan_events.32.d:0 "在喀布尔成功发动起义以驱逐我们的驻军后，穆罕默德·多斯特·汗的儿子阿克巴承诺指挥官他们可以安全撤退到英国领土。"
01_afghanistan_events.32.f:0 "“我听到阿克巴用波斯语喊出‘饶他们一命！’，但用普什图语喊出‘杀了他们！’”"
01_afghanistan_events.32.a:0 "阿克巴的部队在整个撤退过程中对他们进行了骚扰。英国和印度士兵，他们的家人，仆人和平民工人，总共约14,000人。所有人都被杀害或被俘虏，唯一的幸存者是助理外科医生，他们最后赶到了贾拉拉巴德。公司的声誉成为最后的受害者。"

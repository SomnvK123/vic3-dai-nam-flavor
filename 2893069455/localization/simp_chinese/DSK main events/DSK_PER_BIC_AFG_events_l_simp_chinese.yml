unite_transcaucasia_button:0 "统一高加索"
unite_transcaucasia_button_desc:0 "亚美尼亚、阿塞拜疆和格鲁吉亚处于两个强大实体之间。如果他们希望保持自主权，那么他们需要作为一个单一实体团结起来。"

je_free_iraq:0 "解放伊拉克"
je_free_iraq_reason:0 "伊拉克的卡尔巴拉、纳杰夫和萨马拉等城市是#yellow 什叶派#!最重要的圣地。伊玛目作为“#green 真主#!意志代理人”，我们有必要遵循它的意志，保护圣地的控制权，这不仅是宗教义务，更是对隐遁伊玛目复临的预备。\n\n大逆不道的#yellow 奥斯曼帝国#!曾经夺走了我们什叶派同胞的两河土地，还自称#yellow 哈里发#!长期压制伊拉克什叶派的社群，对他们征收重税。按照什叶派教法，允许信徒在受迫害时采取“塔基亚”（taqiyya，隐瞒信仰）原则，但亦鼓励“吉哈德”（jihad）以捍卫信仰。伊拉克正有许多#yellow 什叶派#!同胞，暗地里坚持自己的信仰，等待我们去解放他们，帮助#yellow 伊拉克人#!实现自由。"
je_free_syria:0 "解放叙利亚"
je_free_syria_reason:0 "叙利亚人厌倦了成为奥斯曼和埃及不断拉锯的一部分。人口凋零的#yellow 大马士革#!、#yellow 阿勒颇#!、#yellow 哈马#!等城市，许多教徒们在战乱中被杀，余下的人在残酷的饥荒中，倒在了这片曾经繁华的土地。具具#yellow 白骨#!彷佛在痛哭#green 真主#!为什么不来拯救他们，我们作为追寻#green 真主#!的代理人，有必要将教友们从压迫者中解放出来。"
unite_arabic_persia_button_var_btt:0 "我们完成了#yellow 阿拉伯之梦#!日志，#yellow 伊拉克#!和#yellow 叙利亚#!也将回到#yellow 阿拉伯#!的大家庭"
je_transcaucasia_navy:0 "高加索海军"
je_transcaucasia_navy_reason:0 "#green 真主#!使两海交汇，但以屏障相隔，互不侵犯...#yellow 高加索#!地区毗邻里海与黑海，是连接波斯湾与地中海的关键枢纽，掌控此处海域即是对#green 真主#!所赐“两海交汇”之地的守护。若放任列强控制高加索海域，不仅违背了#green 安拉#!赋予的治理责任，更可能使#green 穆斯林#!商路和圣地暴露于威胁之下。\n\n如果我们或者#yellow 外高加索国#!拥有#yellow 第比利斯#!的领土，该[concept_journal_entry]进度每月会增加#yellow 1点#!。"
je_transcaucasia_navy_goal:0 "日志进度条填满，便可完成在#yellow 第比利斯#!的海军和大学建设。"


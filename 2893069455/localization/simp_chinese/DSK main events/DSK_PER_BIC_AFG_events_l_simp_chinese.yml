je_stand_free_stand_together: "自由独立！团结一致！"
je_stand_free_stand_together_reason: "如果我们希望对抗欧洲的威胁，那么我们必须摒弃统治彼此的想法，而是作为独立的国家团结一致。\n\n只有#yellow 亚美尼亚人#!独立，我们才能在高加索山脉南麓获得一道天然的屏障；只有#yellow 伊拉克人#!独立，我们才能对抗奥斯曼的逊尼派统治，强化“什叶派新月地带”的影响力。当#yellow 波斯人#!、#yellow 土库曼人#!、#yellow 阿塞拜疆人#!、#yellow 阿拉伯人#!、#yellow 普什图人#!等所有#green 真主的子民#!共同团结在一起，#green 真主便会降临#!，将恐怖投在不信道的西方异教徒的心中，斩去他们的首级，断去他们的指头。"
je_stand_free_stand_together_goal: "需要填满该[concept_journal_entry]进度条。我们可以通过完成以下#yellow 5个日志#!和#yellow 1个按钮#!推动进度条:\n完成#yellow 新月#!日志（开局出现）\n完成#yellow 解放新月#!日志（完成"新月"→"新月理念扎根"出现）\n完成#yellow 阿拉伯之梦#!日志（完成"新月"→"新月理念扎根"出现）\n完成#yellow 建立民主机构#!日志（通过该[concept_journal_entry]按钮"德黑兰理事会"出现）\n完成#yellow 安抚野兽#!日志（完成"新月"→"新月理念扎根"→"解放新月"出现）\n成功点击#yellow 认可全体新月护卫队#!按钮"

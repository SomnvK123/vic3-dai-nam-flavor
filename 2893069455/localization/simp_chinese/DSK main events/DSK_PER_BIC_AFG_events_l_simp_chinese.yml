je_nazi_ger_reason:0 "天文数字的赔款，失控的通胀！外族人抢走了我们的工作，列强们对我们上了奴役的枷锁，敌人们夺走了我们的土地！德意志人民苦不堪言，如果你能回来拯救德意志，这一次，我仍然会像追随英雄一样追随你...\n\n在研究完政治煽动后，这个日志条就会显著开始变动。\n\n#yellow 纳粹主义#!会#tooltippable;tooltip:[Country.GetTooltipTag],je_nazi_ger_pos 推进#!进度条，而#yellow 自由主义#!会#tooltippable;tooltip:[Country.GetTooltipTag],je_nazi_ger1_pos 回退#!进度条。"

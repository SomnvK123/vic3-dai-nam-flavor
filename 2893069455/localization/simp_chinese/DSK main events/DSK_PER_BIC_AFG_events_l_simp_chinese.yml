  je_russia_great_game: "大博弈"
je_russia_great_game_reason: "中亚是[SCOPE.GetRootScope.GetCountry.GetName]的势力范围，英国在几十年如一日的在印度迅速扩张。如果我们放任他们继续这样做，他们将很快夺取喜马拉雅和帕米尔，以致完全与我们接壤！这严重威胁到了我们在中亚的影响力。我们应该尽量避免全面战争，但我们必须利用能够赢得这个大博弈的每一个机会。\n注意：当其中任意一个达到100进度时，一场外交博弈将开始，使目标成为附庸国，占领一个条约港口，或征服一个省份，具体取决于目标国家的排名以及它们是否临海。"

je_britain_great_game: "大博弈"
je_britain_great_game_reason: "印度是我们帝国的明珠。而这颗明珠紧邻北面的俄罗斯毛子。毛子认为中亚是他们的势力范围，我看他们是痴心妄想！如果他们胆敢跨过阿富汗直达印度边境，[SCOPE.GetRootScope.GetCountry.GetName]就会把他们碾成齑粉。他们最好能够偷走我们帝国的明珠，否则[SCOPE.GetRootScope.GetCountry.GetName]不会轻易放过他们。\n注意：当其中一个达到100进度时，一场外交博弈将开始，使目标成为附庸国，占领一个条约港，或征服一个省份，具体取决于目标国家的排名以及它们是否有一个港口。"

je_bic_great_game: "大博弈"
je_bic_great_game_reason: "注意：当其中一个达到100进度时，一场外交游戏将开始，使目标成为附庸国，占领一个条约港，或征服一个省份，具体取决于目标国家的排名以及它们是否有一个港口。我们是英国帝国的明珠。而这颗明珠紧邻北面的俄罗斯熊。我们不想激怒毛子，但我们也不能让它一路猎食，我们必须与我们的[concept_overlord]一道把毛子赶出印度的边界。"

again_great_game_tt: "如果英国或俄国任意一个大博弈日志进度#yellow ＞=100#!，则英俄列强会尝试获取我们的#yellow 条约港#!，甚至试图把我们纳为#yellow 保护国#!！如果我们不处于战争状态、不是附庸国，并且未满足失败条件，我们将再次获得此日志条目。英俄大博弈将以50进度重启。"

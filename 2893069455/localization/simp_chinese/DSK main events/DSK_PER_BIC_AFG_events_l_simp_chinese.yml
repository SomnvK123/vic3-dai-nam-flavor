 je_nazi_german_empire:0 "新秩序"
 je_nazi_german_empire_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]将会用铁骑踏破欧洲，建立一个新秩序。那正是我们最为美丽的目标和宗旨，那些目光短浅的人，除了惋惜之外，其余乏善可陈。那是天降洪福，奖励那些将自己奉献给这个社会主义国家的英豪，这样的奉献精神必将历久弥新。[SCOPE.GetRootScope.GetCountry.GetName]将永远成为欧洲的主人"
 dsk_aus.45.t:0 "我的奋斗"
 dsk_aus.45.d:0 "一个新的时代已经到来，[SCOPE.GetRootScope.GetCountry.GetName]已经觉醒，我们已经赢得政权。现在我们需要说服德国的同胞，我知道我们的同胞，生活在水深火热之中，你们渴望改变，却如石沉大海，呼号不得不一次又一次地燃起，去锲而不舍的斗争，你们将会受制于人，你们必须服从，你们必须臣服，你们必须甘心忍受势不可挡的需要服从的命令！"
 dsk_aus.45.f:0 "我们日思夜寐的梦想，今日终于如愿以偿，德国人民各阶级的联合的信号已经成为新德意志帝国的象征，它因此成为德国人民的度量标准，这个世界上最宝贵的财富是你们的人民，为了我们人民，我们要奋斗和战争，我们绝不松懈，我们绝不疲惫，我们绝不抛弃信念。"
 dsk_aus.45.a:0 "一个新的共同体正在被建立起来，[SCOPE.GetRootScope.GetCountry.GetName]将会在元首的领导下完成对欧洲新秩序的重建！"
 dsk_aus.46.t:0 "现代德国"
 dsk_aus.46.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]成功摆脱了独裁制，民族主义的桎梏，正以开放包容的姿态迈入现代欧洲"
 dsk_aus.46.f:0 "这是划时代的意义，黑、红、金3种颜色长久以来象征的是泛日耳曼民族争取统一、独立、主权的雄心。其中黑色代表严谨肃穆；红色象征燃烧的火焰，激发人民憧憬自由的热情；金色象征真理的光辉，决不会被历史的泥沙掩埋！"
 dsk_aus.46.a:0 "一个新时代已经到来，[SCOPE.GetRootScope.GetCountry.GetName]将会以自由民主的姿态屹立于世界"
 dsk_aus.47.t:0 "大日耳曼尼亚"
 dsk_aus.47.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]已经完成了对欧洲新秩序的重建"
 dsk_aus.47.f:0 "大日耳曼国在世界大战中崛起，成为了欧洲无可置疑的霸主。俄罗斯巨熊倒下了，家园破碎，兄弟阋墙。法国已经支离破碎，巴黎只剩断壁残垣。无论是曾经闪耀的莫斯科，还是遥远的伦敦，皆已落入敌手。"
 dsk_aus.47.a:0 "一个非凡的时代已经到来，[SCOPE.GetRootScope.GetCountry.GetName]万岁！万岁！万岁！"
 dsk_aus.48.t:0 "德奥合并"
 dsk_aus.48.d:0 "[SCOPE.sCountry('aus_scope').GetName]正式加入[SCOPE.GetRootScope.GetCountry.GetName]"
 dsk_aus.48.f:0 "我们要求在人民自决权的基础上统一大德国的所有德国人。将一千万德国-奥地利人纳入帝国并推翻哈布斯堡王朝！纳粹必须重新统一所有出生在德意志帝国或居住在德意志帝国之外的德国人，以创建一个全德意志帝国——《我的奋斗》"
 dsk_aus.48.a:0 "一个非凡的时代已经到来，[SCOPE.GetRootScope.GetCountry.GetName]万岁！万岁！万岁！"
 dsk_aus.48.b:0 "还是算了，让[SCOPE.sCountry('aus_scope').GetName]继续以国家实体的方式存在"

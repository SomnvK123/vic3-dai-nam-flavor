je_build_democratic_institutions_reason: "《古兰经》里有记载，#green 真主#!命令所有信徒把一切受信托的事物交给应受的人，万物主权皆归#green 真主#!，但代治者可以协商行使其主权。民主机构“择优治理”的理念可以被诠释为“履行#green 真主#!信托”的工具，同样能发挥巩固王权与#yellow 乌里玛#!联盟的作用。当然，除了我们自己建立民主机构，如果能在周边盟友国家推广#yellow 宪政#!或#yellow 民主#!理念，帮助他们过渡到民主政府，便能实现#yellow 伊朗地区#!的文明复兴。重塑我们的内部凝聚力，最终实现"#green 真主#!主权下的公正治理"。"

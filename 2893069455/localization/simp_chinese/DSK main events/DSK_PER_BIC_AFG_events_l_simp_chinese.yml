je_repeal_jizya_tax:0 "废除吉西亚税"
je_repeal_jizya_tax_reason:0 "吉西亚税从所有非穆斯林身上征收额外税款。[SCOPE.sCharacter('hataria_scope').GetFullName] 看到这对琐罗亚斯德教徒的财务影响多么破坏性。他声称这是不公正的，并希望我们完全废除它。"

je_reclaim_territory:0 "收回领土"
je_reclaim_territory_reason:0 "现在我们已经灌输了人民的爱国主义，他们渴望收回俄罗斯夺走我们的领土。"

je_our_rightful_place:0 "我们的正当地位"
je_our_rightful_place_reason:0 "我们不止一次是世界上最伟大的力量。欧洲似乎已经忘记了这一点，相信他们自己的种族和文化优越性。是时候推翻他们的错误看法了。"

je_cultural_exchange:0 "文化交流"
je_cultural_exchange_reason:0 "多亏了他们在达拉弗农理工学校的教学，我们已经开始学习奥地利文化。现在他们也开始从我们的文化中学习。我们应该鼓励这种交流，直到我们彼此在对方的国家被视为原住民为止。"

je_twin_empires:0 "孪生帝国"
je_twin_empires_reason:0 "我们在德意志的雅利安兄弟姐妹失去了部分帝国，就像我们一样。我们不应该渴望那些日子，而是应该帮助彼此重返我们各自地区的合法地位。如果我们帮助实现他们对德国的梦想，那么他们将利用他们的声望和权威支持我们对我们自己地区的所有主张。"

je_great_iran:0 "伟大的伊朗"
je_great_iran_reason:0 "我们将建立自己的帝国，超越所谓的大不列颠。"

je_most_favored_nation:0 "最惠国待遇"
je_most_favored_nation_reason:0 "我们迅速成为美国最大的贸易伙伴之一。如果我们能保持下去，他们可能会给予我们令人艳羡的最惠国待遇地位。"
most_favored_nation_modifier:0 "最惠国待遇"
most_favored_nation_tt:0 "如果您与美国的贸易协定被取消，您可以随时通过决定恢复它。"
je_crush_the_monarchists:0 "粉碎君主派"
je_crush_the_monarchists_reason:0 "欧洲的反动势力在民主政府获得自由后立即镇压它们。我们必须削弱他们的力量，以结束他们的全球影响力。"
je_liberty_alliance:0 "自由联盟"
je_liberty_alliance_reason:0 "如果我们要制止这些反动势力并确保我们永远不会回到君主制的落后状态，我们必须建立一个由全球支持自由的国家组成的联盟。"
 

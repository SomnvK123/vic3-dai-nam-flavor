je_the_crescent_takes_root:0 "新月理念扎根"
je_the_crescent_takes_root_reason:0 "新月理念在民众中越来越被接受。尤其是那些更希望被视为平等的民族和宗教少数群体。#green 真主#!曾经说过：你们需要为受压迫者而战，反抗压迫者，直到迫害消除。作为#yellow 什叶派#!的世界领袖，当越来越多的教徒觉醒了#yellow 民族主义#!，我们更有义务帮助这些境外的#yellow 什叶派#!实现独立，以反抗#yellow 俄罗斯沙皇#!、#yellow 奥斯曼苏丹#!、#yellow 埃及赫迪夫#!的残暴统治。"

defenders_of_the_crescent_tt:0 "这个国家与您一起加入了[concept_defenders_of_the_crescent]。"


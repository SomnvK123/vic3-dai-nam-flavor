je_ottoman_unrest: "奥斯曼动荡"
je_ottoman_unrest_reason: "我们的宣传起作用了，#yellow 奥斯曼帝国#!的少数民族，尤其是#yellow 伊拉克人#!、#yellow 叙利亚人#!、#yellow 亚美尼亚人#!正渴望决定自己的命运，脱离奥斯曼的残暴统治。"
je_ottoman_unrest_goal: "填满日志条即可完成。如果我们未与#yellow 奥斯曼#!交战，每月会增长#yellow 1点#!动荡进度"
je_russian_unrest: "俄罗斯动荡"
je_russian_unrest_reason: "我们的宣传起作用了，#yellow 俄罗斯帝国#!的高加索少数民族正渴望决定自己的命运。\n\n#yellow 格鲁吉亚人#!开始宣传自己沦为俄国缓冲区的悲剧命运，不愿意在当俄国人的炮灰；#yellow 阿塞拜疆人#!埋怨自己被异教徒奴役的现实，纷纷指责罪恶的《古利斯坦条约》剥夺了他们与我们波斯人的紧密联系；#yellow 亚美尼亚人#!发现自己的商业几乎完全被俄国人垄断后，也开始怀疑效忠俄国人的正确性。"
je_russian_unrest_goal: "填满日志条即可完成。如果我们未与#yellow 俄罗斯#!交战，每月会增长#yellow 1点#!动荡进度"
je_egyptian_unrest: "埃及动荡"
je_egyptian_unrest_reason: "我们的宣传起作用了，#yellow 埃及#!的#yellow 叙利亚人#!正渴望决定自己的命运，而不是#yellow 累死#!在纺织机、#yellow 战死#!在埃塞俄比亚高原、#yellow 饿死#!在大马士革，只为了实现#yellow 赫迪夫#!那所谓的宏图伟业。"
je_egyptian_unrest_goal: "填满日志条即可完成。如果我们未与#yellow 埃及#!交战，每月会增长#yellow 1点#!动荡进度"


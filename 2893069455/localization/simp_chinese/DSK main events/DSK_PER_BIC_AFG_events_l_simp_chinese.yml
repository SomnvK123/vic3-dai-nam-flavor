ig_Magis:0 "琐罗亚斯德教徒"
ig_Magis_desc:0 "琐罗亚斯德教徒是古代波斯帝国的主流宗教，其核心教义围绕善恶二元论展开，并强调道德实践与精神净化。信徒往往通过践行善行和道德规范，追求灵魂的净化，以期在末日审判中获得救赎，与神合一。"
ig_Babis:0 "巴比派信徒"
ig_Babis_desc:0 "巴比教是19世纪中叶伊朗兴起的一个宗教运动，该教宣称伊斯兰教什叶派传统中的“隐遁伊玛目”即将回归，主张打破旧宗教束缚、倡导社会平等与灵性革新。同时，也主张实现人类一体、宗教和谐与全球和平。"

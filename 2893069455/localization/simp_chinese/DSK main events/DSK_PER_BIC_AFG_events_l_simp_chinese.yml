01_india_events.5.t:0 "震惊伦敦"
01_india_events.5.d:0 "国内报纸报道了我们对当地人的严厉对待。"
01_india_events.5.f:0 "“我们正在给这些人带来文明。如果我们必须打断几条腿才能做到，那又怎样？”"
01_india_events.5.a:0 "这只是个孤立事件。他们夸大其词了。"
01_india_events.5.b:0 "我们会发表我们自己的故事，关于我们已经终止了当地人的不人道行为。"
01_india_events.5.c:0 "天哪，他们是对的！我们需要改变方向。"

01_india_events.6.t:0 "股票下跌"
01_india_events.6.d:0 "我们的股票暴跌了！"
01_india_events.6.f:0 "“如果公司走下坡路，那我可不会跟着。黛安，把我的每一支股票都卖掉，然后辞职吧。”"
01_india_events.6.a:0 "我们需要向投资者保证公司仍然强大，卖股是个错误。"
01_india_events.6.b:0 "这只是市场在起作用。我们最终会反弹回去的。"
01_india_events.6.c:0 "如果我们买下所有这些股票，我们就可以在公司中拥有更多发言权。"

01_india_events.7.t:0 "大博弈胜者"
01_india_events.7.d:0 "我们现在成为了印度新的领导者！现在是重新评估[SCOPE.sCountry('bic_scope').GetName]优先事项的时候了。"
01_india_events.7.f:0 "“各位先生，有很多重要的业务要处理。我们在[SCOPE.sState('capital_state').GetName]的办公所需要紧急添加几位人手来控制一亿的印度人。”"
01_india_events.7.a:0 "改善土著人口的生活将提高他们的工作效率。"
01_india_events.7.b:0 "军队是我们赢得印度的关键，也是确保我们保持印度的关键所在。"
01_india_events.7.c:0 "工业化，工业化，工业化！"
01_india_events.7.e:0 "我们公司是建立在农业基础上的。离开我们的根基是愚蠢的。"
01_india_events.7.g:0 "我们必须保持传统的权力结构强大。"

 
01_india_events.8.t:0 "大博弈失败者"
01_india_events.8.d:0 "是时候重新评估公司的优先事项了。"
01_india_events.8.f:0 "“先生们，有很多重要的业务要处理。我们在伦敦的办公所需要紧急添加几位人手来控制一亿的印度人。”"
01_india_events.8.a:0 "印度的土著军队将吃光我们的后勤！"
01_india_events.8.b:0 "我们不再维稳在印度的军队。"
01_india_events.8.c:0 "工业化，工业化，工业化！"
01_india_events.8.e:0 "我们的公司是建立在农业基础上的。远离我们的根基是愚蠢的。"
01_india_events.8.g:0 "我们必须保持传统的权力结构强大。"

01_india_events.9.t:0 "印度靛蓝"
01_india_events.9.d:0 "农民对被迫种植靛蓝而几乎没有利润感到愤怒。"
01_india_events.9.f:0 "“他妈的，种这点东西有啥意义？谁能告诉我？”"
01_india_events.9.a:0 "我们必须考虑到更大的英国经济。而不是印度的一些落后农民。"
01_india_events.9.b:0 "我们可以取消固定价格以避免更大的反弹。"

01_india_events.10.t:0 "恰姆帕兰·萨蒂亚格拉哈"
01_india_events.10.d:0 "[SCOPE.sCharacter('mahatma_scope').GetFullName]正领导和平抗议和罢工，代表被迫种植靛蓝的农民。"
01_india_events.10.f:0 "“在约一个世纪以来一直存在的Tinkathia制度被废除，随之而来的是种植者的统治终结了。这些一直被压制的暴乱现在有些有了自己的发展，并且那个无法洗去的靛蓝的污点的迷信也被打破了。”"
01_india_events.10.a:0 "这个人比任何暴力起义都在破坏经济。在事态失控之前我们必须协商解决。"
01_india_events.10.b:0 "我们不能让一个印度人来制定印度政策！"

01_india_events.11.t:0 "盐行军"
01_india_events.11.d:0 "[SCOPE.sCharacter('mahatma_scope').GetFullName]'s march to oppose our salt tax seemed like a non-issue, but it's sweeping the nation and gaining worldwide sympathy."
01_india_events.11.f:0 "“我不能对政府采取的全面不干涉政策不加赞美....我希望我能相信这种不干涉是出于真正的心理变化或政策。他们在立法议会中对公众情感的肆意漠视和他们的高压行为毫无疑问表明，以任何代价继续对印度进行无情的剥削政策，所以我对这种不干涉的唯一解释是，尽管不可否认的公民不服从确实是极端政治鼓动的压迫，但只要不服从保持文明，因此必然是非暴力的....只剩下的是看政府是否像他们对待行军一样容忍了对盐法的实际违反。”"
01_india_events.11.a:0 "这只是盐。他们会制造一些噪音，但这里没有真正的威胁。"
01_india_events.11.b:0 "我们应该屈服于他的要求，减少我们对某些商品的税收。"

01_india_events.12.t:0 "越界"
01_india_events.12.d:0 "[SCOPE.sCharacter('mahatma_scope').GetFullName]'s march to oppose our salt tax seemed like a non-issue, but it's sweeping the nation and gaining worldwide sympathy."
01_india_events.12.f:0 "“至少在这个问题上我将给你们完全的保证。我将确保没有流血和暴乱。我是一个军人而不是一个平民。一旦原则上接受了分区，我将下令确保在全国范围内没有任何地方发生宗教冲突。如果有丝毫的骚乱，我将采取最严厉的措施扼杀问题。”"
01_india_events.12.a:0 "边境越界导致了暴力冲突，这已经波及到边境城市了。"

01_india_events.13.t:0 "为和平而饿"
01_india_events.13.d:0 "[SCOPE.sCharacter('mahatma_scope').GetFullName]宣布，他将继续斋戒，直到到处的暴力都结束。他在这个年纪能坚持多久，我们无法预料..."

01_india_events.13.f:0 "想一想活着时你能做什么，死了就做不到……你想要什么？” “想要战争停止。你让我相信……它永远不会再开始。”"
01_india_events.13.a:0 "尽管看着他在我们眼前慢慢死去很痛苦，但我们必须尊重他的牺牲。"
01_india_events.13.b:0 "如果我们失去了我们的“巴普”，那么印度将陷入黑暗。如果需要的话，我们会强行喂食他。他对结束暴力的呼吁应该足够了。"
 
01_india_events.14.t:0 "到处都是"
01_india_events.14.d:0 "结束了。暴力终于平息了。"
01_india_events.14.f:0 "“我看到一个印度教徒和一个穆斯林试图互相屠杀，现在他们像兄弟一样拥抱着。我可以从他们的眼睛中看到。这并不容易，但为了和平，他们坚持了下来。”"
01_india_events.14.a:0 "随着暴力的结束，我们终于可以和平地生活在一起。至少那会持续多久..."
01_india_events.14.b:0 "这全是巴基斯坦的错。只要他们存在，我们就永远不会安全。"

01_india_events.15.t:0 "哦，天啊"
01_india_events.15.d:0 "[SCOPE.sCharacter('mahatma_scope').GetFullName]被一个激进的印度教民族主义者枪杀了。"
01_india_events.15.f:0 "“朋友们，同志们，我们生活中的光明已经消失了，到处都是黑暗，我不太清楚该告诉你们什么或怎么说。我们敬爱的领袖，我们称之为Bapu，这个国家的父亲，不再了。也许我说错了；然而，我们不会再见到他，就像这些年来我们见到他一样，我们不会向他寻求建议或从他那里寻找安慰，这是一个可怕的打击，不仅仅是对我而言，而是对这个国家的数百万人。”"
01_india_events.15.a:0 "数百万人聚集在一场盛大的葬礼游行中表达敬意。"
01_india_events.15.b:0 "利用他的死亡对印度教激进分子进行暴力镇压。"

01_india_events.16.t:0 "惊人的损失"
01_india_events.16.d:0 "我们看似不可战胜的军队输掉了一场战争。"
01_india_events.16.f:0 "“我们来了。我们见到了。我们...输了？”"
01_india_events.16.a:0 "没有任何好事会发生在土著认为我们不是无敌的情况下。"

01_india_events.17.t:0 "孟加拉划分"
01_india_events.17.d:0 "总督下令将孟加拉划分为印度教徒和穆斯林之间。"
01_india_events.17.f:0 "“没有什么比宗教冲突更能让你得到你想要的了。如果别的什么都没有，宗教改革就是这样教给我们的。当然，这也导致了几场战争...噢，好吧！我相信一切都会好的。”"
01_india_events.17.a:0 "这应该让他们互相对抗，而不是联合起来反对我们。"

01_india_events.18.t:0 "贾利安瓦拉芭格大屠杀"
01_india_events.18.d:0 "Brigadier General Dyer向一群和平示威的印度人开火，直到他手下的士兵用光所有弹药才停止。"
01_india_events.18.f:0 "“没有什么比宗教冲突更能让你得到你想要的了。如果别的什么都没有，宗教改革就是这样教给我们的。当然，这也导致了几场战争...噢，好吧！我相信一切都会好的。”"
01_india_events.18.a:0 "我们会解雇戴尔，并确保我们在未来对待问题时手段更温和。但是道歉？我们可不这么认为。"
01_india_events.18.b:0 "我们必须对我们的行为负全责，不仅要道歉，还要完全重新评估我们的警务工作方式。"
01_india_events.18.c:0 "我们必须支持我们的将军，而不是我们的臣民。给这个人一个勋章！"

01_india_events.19.t:0 "乔里查乌拉事件"
01_india_events.19.d:0 "警察向抗议者开枪，抗议者进行报复，追逐这些人到一个警察局并放火烧毁了建筑，造成里面所有人死亡。"
01_india_events.19.f:0 "“他们向我们开枪，所以我们放火烧了他们。我不确定我们做错了什么？”"
01_india_events.19.a:0 "甘地决定在事态变得更加暴力之前结束非合作运动。"
01_india_events.19.b:0 "甘地不会让这些人毁了他和其他人正在为之奋斗的事物。运动还在继续。"


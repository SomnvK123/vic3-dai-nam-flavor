je_crescent_values: "新月价值观"
je_crescent_values_reason: "改良#yellow 什叶派#!不仅是顺应#green 真主#!意志的必然选择，更是恢复我们文明活力、抵御外敌压迫的关键举措。不同于#yellow 逊尼派#!固守“四大教法学派”的传统，#yellow 什叶派#!向来十分进步开明，正如隐遁伊玛目的复临需要信徒通过理性探索真理，而非僵化遵循旧制。#yellow 侯赛因·本·阿里#!曾经带领我们反抗暴政、追求平等，如今我们更是要追随#green 真主#!的理念，平等对待所有民众，禁止蓄奴并实现众教徒平等。只有我们率先遵循改良的#yellow 什叶派#!价值观，这种进步的思想便能快速传播给#yellow 新月地区#!的所有人民。"

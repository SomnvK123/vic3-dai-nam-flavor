je_baluchistan_navy:0 "俾路支斯坦海军"
je_baluchistan_navy_reason:0 "俾路支斯坦位于我们国家的东南部，其港口是#green 真主#!赐予我们通往印度洋的天然门户。如果能在俾路支斯坦建造一支强大的海军，无论是归属我们还是当地的俾路支国家，都可以减少对#yellow 英格兰人#!控制的霍尔木兹海峡依赖，并以此为筹码，抵御#yellow 英格兰#!军舰对波斯湾的垄断。\n\n如果我们或者#yellow 俾路支国家#!拥有#yellow 俾路支斯坦#!的领土，该[concept_journal_entry]进度每月会增加#yellow 1点#!。"
je_baluchistan_navy_goal:0 "日志进度条填满，便可完成在#yellow 俾路支斯坦#!的海军和大学建设。"
je_baluchistan_ports:0 "俾路支斯坦港口"
je_baluchistan_ports_reason:0 "俾路支斯坦位于我们国家的东南部，其港口是#green 真主#!赐予我们通往印度洋的天然门户。如果能在俾路支斯坦建造许多港口，无论是归属我们还是当地的俾路支国家，都可以减少对#yellow 英格兰人#!控制的霍尔木兹海峡贸易的依赖，并以此为筹码，抵御#yellow 英格兰#!军舰对波斯湾的贸易垄断。\n\n如果我们或者#yellow 俾路支国家#!拥有#yellow 俾路支斯坦#!的领土，该[concept_journal_entry]进度每月会增加#yellow 1点#!。"

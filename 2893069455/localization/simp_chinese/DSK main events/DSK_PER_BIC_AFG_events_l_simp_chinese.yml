 #India


ind.15.t:0 "马拉地叛乱！"
ind.15.d:0 "在长期酝酿对公司统治的反对之后，士兵和其他当地人已经起来宣称要在印度中部恢复马拉地帝国的统治。"
ind.15.f:0 "“我们需要某种合法性，认为马拉地人是足够合适的。”"
ind.15.a:0 "必须镇压！"
ind.15.b:0 "新马拉地万岁！"

ind.1.t:0 "锡克提议"
ind.1.d:0 "一些来自米鲁特的叛军前来请求马哈拉贾领导一场反对仇恨的东印度公司的叛乱。"
ind.1.f:0 "“。”"
ind.1.a:0 "我们是唯一有能力对抗公司的人。"
ind.1.b:0 "这太冒险了。把他们送到隔壁去找莫卧尔皇帝。"

ind.2.t:0 "锡克叛乱！"
ind.2.d:0 "在长期酝酿对公司统治的反对之后，士兵和其他当地人已经起来宣称要在印度北部恢复锡克马哈拉贾的统治。"
ind.2.f:0 "“。”"
ind.2.a:0 "必须镇压！"
ind.2.b:0 "复兴锡克教万岁！"

 
ind.3.t:0 "叛乱还是镇定？"
ind.3.d:0 "士兵已经发动了叛乱。问题是我们是否应该加入他们。"
ind.3.f:0 "“我的一个祖父说，如果我们不加入他们，那么我们的灵魂将在英国人的压迫下灭亡。另一个祖父说我们将在英国人的暴力火力下灭亡。我问他们是否有一个选项，让我不至于全灭？他们最终都同意了一个观点。‘没有。’”"
ind.3.a:0 "这是我们赢得自由的最佳机会。"
ind.3.b:0 "他们将被英国军队的铁蹄碾碎。"

ind.4.t:0 "跟随进入战争"
ind.4.d:0 "一个亲王国已经发生叛乱，并请求结盟。"
ind.4.f:0 "“我的一个祖父说，如果我们不加入他们，那么我们的灵魂将在英国人的压迫下灭亡。另一个祖父说我们将在英国人的暴力火力下灭亡。我问他们是否有一个选项，让我不至于全灭？他们最终都同意了一个观点。‘没有。’”"
ind.4.a:0 "这是我们赢得自由的最佳机会。"
ind.4.b:0 "他们将被英国军队的铁蹄碾碎。"

ind.5.t:0 "外国服务报酬"
ind.5.d:0 "现在印度的大部分地区都已经平定，士兵们抱怨他们不再因驻扎在外国领土而获得额外报酬。"
ind.5.f:0 "“我宁愿打一场容易的仗，吃个尽兴，也不愿坐在屁股上吃剩菜。”"
ind.5.a:0 "他们只能忍受这种情况。"
ind.5.b:0 "我们暂时会返还他们的工资，尽管其他士兵会抱怨特殊待遇。"
ind.5.c:0 "士兵是我们力量的支柱。我们应该相应地对他们进行补偿。"

ind.6.t:0 "晋升再退休"
ind.6.d:0 "士兵抱怨说当他们被提升时，他们已经到了退休年龄。"
ind.6.f:0 "“我在公司工作了四十年，我仍然要听命于那些甚至还没活过那么久的白人军官。”"
ind.6.a:0 "当有这么多有能力的英国军官在国内时，我们为什么要提拔异教徒呢？"
ind.6.b:0 "提拔一些杰出的士兵，以显示我们在做些什么。"
ind.6.c:0 "我们应该降低印度人的年龄要求，并更加注重技能。"

ind.7.t:0 "替换宗教"
ind.7.d:0 "人们指责我们用科学取代了印度教。"
ind.7.f:0 "“听着，我们在其他方面可能是混蛋，但我支持我们由英国人管理的学校。数学和理性战胜宗教迷信的胜利只是一个胜利。我们向小女孩提供教育并没有什么不对。我们并没有告诉她们她们与男性平等。”"
ind.7.a:0 "学校本身将解决这个问题，因为受过教育的群众将同意我们的观点。"
ind.7.b:0 "在当前危机期间，我们应该适当收敛一下。"
ind.7.c:0 "让我们成立印度课程，并由印度教师授课，这样民众就可以得到双重教育。"

 
ind.8.t:0 "印度寡妇再婚法"
ind.8.d:0 "公司正在讨论通过上述法律，该法律除其他外还将允许印度寡妇再婚。"
ind.8.f:0 "“有关女性在年幼丧偶后再也无法再嫁的故事实在是太普遍了。社会中未婚女性的选择不多，我们不能让她们继续贫困下去。”"
ind.8.a:0 "伊斯瓦尔·钱德拉·维迪亚萨加正在请愿我们通过这项法案，但反对请愿书的签名数量是四倍于此的。我们不能让道德动摇我们对印度的控制。"
ind.8.b:0 "去他娘的传统！我们要做正确的事情。"

ind.9.t:0 "在炮兵点"
ind.9.d:0 "在孟加拉准备阅兵期间，士兵拒绝打开新的油脂弹药盒，上校带来了炮兵和骑兵。"
ind.9.f:0 "“又是这些荒谬的谣言。我们已经多次告诉他们，这既不是牛脂也不是猪脂的油脂。我不明白为什么他们不相信我们，东印度公司。”"
ind.9.a:0 "给他们一个例子。我希望这些不服从命令的土著除了成为地洞外别无留存。"
ind.9.b:0 "经过一番紧张的谈判，上校决定撤回炮兵并取消阅兵式。"

ind.10.t:0 "芒格尔·潘迪"
ind.10.d:0 "一个士兵对公司最近的行动发表了激烈的言论，宣称他将反抗他的指挥官。他向几个人开枪，但士兵们拒绝逮捕他，除了一个勇敢的叛徒。"
ind.10.f:0 "“我去调查，但那个疯狂的印度人向我开枪！我拉响了警报，我的副官亨利·鲍伊去调查，但他也被打中了。他可怜的马立即倒地。”"
ind.10.a:0 "解散团，将守卫队的成员绞死，因为他们没有逮捕芒格尔·潘迪。那应该解决问题。"
ind.10.b:0 "我们必须小心行事。训斥其他士兵，但向他们保证芒格尔的不满将得到解决。"

ind.11.t:0 "纵火"
ind.11.d:0 "士兵们在德里焚烧兵营和军官的别墅。"
ind.11.f:0 "“我去我的别墅休息，却发现它已经着火了。也许是时候回到伦敦了。”"
ind.11.a:0 "允许该地区的士兵用手指打开弹药盒，而不是用牙齿。"
ind.11.b:0 "放火烧士兵的家。看看他们会喜欢吗？"

ind.12.t:0 "操练或监禁"
ind.12.d:0 "梅尔特的90名印度穆斯林中有85人拒绝接受他们的弹药。"
ind.12.f:0 "“上校充分了解印度其他地区的动荡局势，但坚持认为这不会有任何影响。”"
ind.12.a:0 "将这85人军事法庭审判，并判处他们10年的苦役。"
ind.12.b:0 "解雇顽固的上校，用手软的人来取代他。"

ind.14.t:0 "梅尔特叛乱者"
ind.14.d:0 "士兵们正在屠杀英国军官，并释放了他们的85名同志。"
ind.14.f:0 "“我正在和我的家人一起参加教堂，当我女儿问起外面的惨叫声时。我可以执行我的职责并进行调查，或者我可以带着我的家人离开那里。我选择了后者。”"
ind.14.a:0 "叛乱者前往德里这座筑有坚固城墙的城市，穆阿鲁克皇帝的皇宫。"
ind.14.b:0 "他们竟然去了赖加德，这是马拉塔帝国的旧首都。他们为什么要去那里？"
ind.14.c:0 "他们逃到了旁遮普去寻求大王的援助。"
ind.14.e:0 "叛乱者去了旁遮普。大王万岁！"
 
01_india_events.1.t:0 "来自南非的律师"
01_india_events.1.d:0 "一个在南非成功为印度人权辩护而声名鹊起的律师正在返回印度。"
01_india_events.1.f:0 "“他在南非可能名声显赫，但在印度这片海洋中只是一粒鹅卵石。”"
01_india_events.1.a:0 "他只是一个人。而且还是一个微不足道的人。他能制造多少麻烦呢？"
01_india_events.1.b:0 "我们需要密切关注任何可能质疑我们统治的人。"

01_india_events.2.t:0 "新方向"
01_india_events.2.d:0 "是时候重新评估公司的重点了。"
01_india_events.2.f:0 "“先生们，有很多重要的事情要处理。印度可不会自己开发。”"
01_india_events.2.a:0 "改善土著人口的生活将提高他们的工作效率。"
01_india_events.2.b:0 "军队是我们赢得印度的关键，也是我们保持印度的关键。"
01_india_events.2.c:0 "工业化，工业化，工业化！"
01_india_events.2.e:0 "我们公司是建立在农业基础上的。偏离我们的根基是愚蠢的。"
01_india_events.2.g:0 "我们必须保持传统的权力结构强大。"

01_india_events.3.t:0 "公司腐败"
01_india_events.3.d:0 "英国政府正在调查我们的财务。"
01_india_events.3.f:0 "“我不在乎我让你们做假账！把它们撤回来，否则我们都完蛋了！”"
01_india_events.3.a:0 "贿赂一些官员。这总是有效的。"
01_india_events.3.b:0 "我们需要一个替罪羊。所有赞成把责任推给总裁的人说“我”"
01_india_events.3.c:0 "他们永远不会冒险摆脱我们。最糟糕的情况就是一些无名之辈会在报纸上读到这件事。"
01_india_events.3.e:0 "这是我们消除公司腐败的绝佳机会。"



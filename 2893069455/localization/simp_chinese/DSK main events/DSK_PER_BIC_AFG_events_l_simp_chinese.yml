je_empire_reborn: "波斯第四帝国"
je_empire_reborn_reason: "#green 阿契美尼德王朝#!的法拉瓦哈，#green 萨珊王朝#!的塞矛戈，#green 萨法维王朝#!的佐勒菲卡尔圣剑都已成为历史...尽管其他地方的人不相信#green 波斯帝国#!能再次复活，嘲讽我们在白日做梦，但那又如何？让他们认为这是我们的春秋大梦吧！我会用我们的铁骑征服他们，梦早晚会成为现实。\n\n我们可以征服周边领土组建成为伊朗历史上最强大的埃兰沙赫尔，也可以通过征服#yellow 亚美尼亚#!、#yellow 伊拉克#!、#yellow 叙利亚#!、#yellow 巴勒斯坦#!等地，复活逝去很久的国度成为我们的卫戍屏障。"


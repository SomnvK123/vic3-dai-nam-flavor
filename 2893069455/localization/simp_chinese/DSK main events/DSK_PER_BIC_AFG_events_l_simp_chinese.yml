 je_indian_partition_reason: "由于印度的独立热情和战争的影响对英国国力造成的冲击导致英国无法维持对英属印度的殖民，于是由英国派出的内阁使团与印度各派政治势力讨论印度的自治事宜并提出了联邦制下自治（或独立）的构想。"

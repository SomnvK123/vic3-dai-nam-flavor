je_soothe_the_beasts_reason: "#green 真主#!曾说：你们全体当紧握安拉的准绳，不要分裂；你们当铭记安拉赏赐给你们的恩典。当时，你们原是仇敌，而#green 真主#!联合你们的心，你们借他的恩典才变成教胞。\n\n然而现在，两个由#yellow 苏丹#!和#yellow 赫迪夫#!意愿统治的最强大的国家，不停争斗和侵略他国，有多少教徒因为他们的统治而无辜死去。很显然，他们已经忘掉了#green 真主#!的教诲。如果#yellow 土耳其#!和#yellow 埃及#!不能实现真正的民主，任由暴君或独裁者肆意妄为，那么#yellow 新月地区#!难以实现长久的和平。只有将这两头凶猛的野兽关进#yellow 民主#!的囚笼里，新月地区才能团结起来，真正获得自由——不仅是从外国势力，还有我们自己。"


cossack_brigade_decision: "组建哥萨克旅"
cossack_brigade_decision_desc: "俄罗斯想要帮助我们组建我们自己的哥萨克旅，提供俄罗斯军官来管理它。他们可以帮助我们在人民变得太过活跃时维持秩序，在战争时成为强大的力量。"
cossack_brigade_decision_tooltip: "组建哥萨克旅"

bomb_majlis_decision: "轰炸议会"
bomb_majlis_decision_desc: "国王一直在努力摆脱议会的束缚。他只需等待他们之间发生争吵，然后在他们分裂时发动打击。他的哥萨克旅正准备轰炸议会。"
bomb_majlis_decision_tooltip: "轰炸议会"

hire_shuster_decision: "雇佣舒斯特"
hire_shuster_decision_desc: "我们需要有人帮助我们摆脱国王给我们造成的财政困境。一位名叫摩根·舒斯特的美国人愿意提供帮助。"
hire_shuster_decision_tooltip: "雇佣舒斯特"

nationalise_oil_decision: "国有化石油"
nationalise_oil_decision_desc: "我们与外国国家进行了多年的谈判…但迄今为止未能取得任何结果。有了石油收入，我们可以满足整个预算，并与我们的人民一起对抗贫困、疾病和落后。另一个重要的考虑是，通过消除英国公司的权力，我们还将消除腐败和阴谋，这些阴谋影响了我们国家的内部事务。一旦这种教导停止，伊朗将实现经济和政治上的独立。伊朗国家更愿意自己接管石油的生产。公司除了将其财产归还给合法所有者外，不应做任何其他事情。国有化法案规定，石油净利润的25%将用于满足公司的所有合法赔偿要求。外界声称伊朗打算将外国石油专家赶出该国，然后关闭石油设施。这种说法不仅荒谬，而且是彻头彻尾的造谣。- 穆罕默德·穆萨德克"
nationalise_oil_decision_tooltip: "国有化石油"
emergency_powers_decision: "授予临时独裁权"
emergency_powers_decision_desc: "穆萨德克请求议会在6个月内授予他临时的独裁权，以通过他的改革方案。由于英国摧毁了我们的经济，我们需要这些改革来减轻人民的痛苦。这也应该有助于克服他们在即将举行的选举中进行的一切干预。"
emergency_powers_decision_tooltip: "紧急权力"
more_emergency_powers_decision: "授予紧急权力"
more_emergency_powers_decision_desc: "六个月的时间不够。穆萨德克请求再授予12个月的紧急权力。"
more_emergency_powers_decision_tooltip: "更多紧急权力"

foster_indian_agitation_button: "培植印度骚动"
foster_indian_agitation_button_desc: "英国已经欺骗我们的兄弟姐妹们，让他们相信在英国统治下他们的生活更好。我们必须资助代理人和宣传，向他们揭示真相。"
lead_the_charge_button: "率领进攻"
lead_the_charge_button_desc: "印度士兵是击败东印度公司的关键。他们年复一年地对他们的英国主人感到越来越愤怒。当他们准备推翻英国的时候，我们将在那里带领他们。"
indian_union_button: "邀请自由印度州"
indian_union_button_desc: "统一印度的梦想终于深入人心。我们必须说服那些幸运的自由州加入我们，实现那个梦想。"
bic_loans_button: "偿还借贷"
bic_loans_button_desc: "在1772年的恐慌中，公司差点破产，但是英国人救了我们。这让他们对公司有了更多的控制权。如果我们能够偿还巨额贷款，我们就能改善我们的形象，离完全控制公司更近一步。"
sell_koh_i_nor_button: "出售科欧尔之星"
sell_koh_i_nor_button_desc: "我们的钱快用完了。出售科欧尔之星可能是我们唯一的选择。英国人肯定会想要它作为他们皇冠的一部分。"
ban_sati_button: "禁止寡妇自焚"
ban_sati_button_desc: "强迫寡妇坐在已故丈夫的火葬柴堆上自焚的做法必须消除。别管英国人对此的不满，这实在是不对，是在浪费生命。"
indian_equality_button: "印度平等"
indian_equality_button_desc: "我们可以通过与印度人共存来区别于英国。更不用说他们更愿意为一个不只是压迫他们的国家而战。"
push_for_independance_button: "推动独立"
push_for_independance_button_desc: "摆脱英国对我们的控制唯一的方法就是通过武力。虽然，我们不应该过于仓促。在行动之前，我们可能想要得到印度人的支持。"

ideology_colonialist: "殖民主义"
ideology_colonialist_desc: "通过更具生产力的方法来扩大已经建立的殖民地，以牺牲土著人口为代价，从而获取更多利润。"
ideology_indian_nationalism: "印度民族主义"
ideology_indian_nationalism_desc: "与其他国家的中产阶级相比，更愿意接受，这得益于在印度受到英国人共同统治所形成的共同身份。"

 
je_british_takeover:0 "英国接管"
je_british_takeover_reason:0 "公司处境艰难。我们所有的垄断权都已被废除，而在1772年的恐慌之后，英国对我们的控制比以往任何时候都更大。如果我们不能尽快稳定国家，那么政府将吞并我们。"
je_british_takeover_goal:0 "将国内生产总值翻倍"
je_company_independence:0 "公司独立"
je_company_independence_reason:0 "我们是赢得印度的人。为什么我们必须与专横的政府分享战利品？现在是我们宣布独立并在伟大国家中占据我们应有的地位的时候了。"
je_kingly_state:0 "王国状态"
je_kingly_state_reason:0 "如果我们能改善财政状况，并在我们的国土内给予英国平等的机会，他们可能会同意让我们完全自治，同时仍然将我们的市场联系在一起。"
je_kingly_state_goal:0 "将国内生产总值提高500%"
je_an_indian_india: "印度式印度"
je_an_indian_india_reason: "我们是为数不多没有被英国占领的印度邦国之一。如果我们认为他们已经满足于他们已经拥有的东西，那就是在自欺欺人。生存的唯一途径是以任何方式与他们作战。我们必须小心谨慎，因为一个错误的举动可能是我们的结局。"
je_remove_the_caste:0 "消除种姓"
je_remove_the_caste_reason:0 "种姓制度是印度教的种姓制度。在出生时分配给每个人一个永远无法改变的地位。如果我们希望利用我们的全部人口，那么我们必须摆脱这个系统。"
je_koh_i_nor: "科赫诺尔"
je_koh_i_nor_reason: "科赫诺尔是世界上最大的切割钻石之一，在波斯语中意为“光之山”。它曾经经历了许多人的手，但最终落入了我们手中。"

je_indian_national_congress:0 "印度国民大会"
je_indian_national_congress_reason:0 "一位亲印度的英国人，艾伦·奥克塔维安·休姆，想要建立一个新团体，为受过教育的印度人设立一个新团体。虽然没有行政权力，但它的目标是为这些受过教育的印度人在政府中获得更大的份额，并为他们与政府之间的公民和政治对话创造一个平台。"


je_divide_and_rule: "分而治之"
je_divide_and_rule_reason: "英国试图挑拨印度教徒和穆斯林相互对抗。我们必须结束这种分裂，以免蔓延到该国其他地区。"

je_rowlatt_act: "罗拉特法案"
je_rowlatt_act_reason: "英国的新法律允许他们无限期拘禁任何选择的人，而无需审判或司法审查。我们的印度子民对此不满。我们可能被迫废除它，否则事态可能失控。"

je_satyagraha: "真理力量"
je_satyagraha_reason: "在必要时，[SCOPE.sCharacter('mahatma_scope').GetFullName] 将发动真理力量，导致人们放弃工作以示抗议，而不是变得激进。\n\n#italic 其根本意义是坚持真理，因此真理力量。我还将其称为爱的力量或灵魂的力量。在应用 satyagraha 的过程中，我在最早期就发现，追求真理不容许对对手施加暴力，而是必须通过耐心和同情使其远离错误。因为对一个人而言看似真理的事物，对另一个人而言可能是错误的。而耐心意味着自我牺牲。因此，这一教义变成了为真理辩护，不是通过对对手施加痛苦，而是通过对自己施加痛苦。#!"

je_quit_india: "退出印度"
je_quit_india_reason: "印度对英帝国来说已经不可持续。我们必须有一个体面的退出，避免被迫暴力驱逐。"

je_relocation: "重新安置"
je_relocation_reason: "大量印度人意外地在分区的各州之间移民。由于对此事件毫无准备，情况可能变得丑陋。"
je_relocation_goal: "拥有50%或更多激进分子"


je_our_own_state: "我们自己的国家"
je_our_own_state_reason: "我们已经被英国统治了很长时间了。是时候开始努力摆脱他们的枷锁了。"

je_religious_tolerance: "宗教宽容"
je_religious_tolerance_reason: "虽然我们的国教是锡克教，但马哈拉贾经常雇佣熟练的穆斯林和印度教徒参与国家机构。这项政策可能不会永远存在，贪婪的地方官员仍然夺取印度教徒和穆斯林的土地。如果我们想巩固这一理念，并确保其也适用于非行政群众，那么我们必须将其编入法律。"
 

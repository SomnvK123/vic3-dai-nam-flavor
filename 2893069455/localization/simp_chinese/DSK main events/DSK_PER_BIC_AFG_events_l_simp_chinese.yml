uf_general_events.1.d: "控制霍尔木兹海峡将使我们的海外贸易成倍增长。"
uf_general_events.1.f: "“在这些卡拉诺岛的上端有一连串被称为卡龙的山脉，接着不远处，就是波斯湾的入口，那里有许多人潜水捕捉珍珠贝。海峡左侧是被称为阿萨本的巨大山脉，右侧则是一个又高又圆的山峰，名为西米拉米斯山；在它们之间的海峡过道约有六百斯塔迪亚；穿过这道海峡后，就是非常宽广的波斯湾，一直延伸到内陆。在这个湾的上端，有一个根据法律指定的市镇，称为阿波罗格斯，位于查拉埃克斯巴西尼和幼发拉底河之间。”"
uf_general_events.1.a: "我们将成为该地区最大的贸易商。"


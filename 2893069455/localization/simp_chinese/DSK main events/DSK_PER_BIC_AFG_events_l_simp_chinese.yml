the_crescent_formed_tt:0 "#yellow 新月#!日志已完成"
ally_with_khiva_button:0 "与花剌子模结盟"
ally_with_khiva_button_desc:0 "花剌子模与俄罗斯毗邻，尽管曾经的#yellow 希瓦汗国#!击败过俄罗斯的远征队，但现在的他们暮气沉沉，武备松懈。我们必须加强它们的力量，以防止俄罗斯吞并它们，然后下一个轮到我们。"
unite_afghanistan_button:0 "统一阿富汗"
unite_afghanistan_button_desc:0 "东方的#yellow 普什图人#!曾经占据我们的王座，血洗了我们的旧都#yellow 伊斯法罕#!，给我们带来无尽的耻辱......但自从#yellow 杜兰尼王朝#!分裂为多个酋长国、藩王国和汗国以来，它们就一直在相互之间交战。每个人都希望通过征服来统一这些国家。外交永远不会使它们团结在一起。我们必须选择支持其中一个，要么征服这片土地，要么帮助#yellow 阿富汗#!成为一个独立国家。"
persia_form_afghanistan_tt:0 "与统一的#yellow 阿富汗#!签订以下外交条约之一:共同防御、同盟、共主邦联、利益同盟、反大博弈者、同个国家集团（领袖是你）。"
unite_baluchistan_button:0 "统一俾路支斯坦"
unite_baluchistan_button_desc:0 "#yellow 莫克兰诸部#!和#yellow 卡拉特汗国#!需要放下彼此的分歧，否则只能成为#yellow 东印度公司#!不断扩张下的亡魂。如果我们能与他们俩都建立良好的关系，我们就可以帮助他们解决两个国家之间的分歧。"
persia_form_transcaucasia_tt:0 "与成功脱离俄国掌控的#yellow 格鲁吉亚#!签订以下外交条约之一:共同防御、同盟、共主邦联、利益同盟、反大博弈者、同个国家集团（领袖是你）。"
persia_form_transcaucasia_ttt:0 "与成功脱离俄国掌控的#yellow 亚美尼亚#!签订以下外交条约之一:共同防御、同盟、共主邦联、利益同盟、反大博弈者、同个国家集团（领袖是你）。"
persia_form_transcaucasia_tttt:0 "与成功脱离俄国掌控的#yellow 阿塞拜疆#!签订以下外交条约之一:共同防御、同盟、共主邦联、利益同盟、反大博弈者、同个国家集团（领袖是你）。"

ottoman_unrest_button: "骚乱奥斯曼帝国"
ottoman_unrest_button_desc: "我们将我们的民族主义思想输出到奥斯曼帝国的少数民族中。希望这将导致他们宣布并赢得独立。如果他们为自己争取自由国家的支持不够，我们将劝说真正的爱国者迈出最后一步。"

russia_unrest_button: "骚乱俄罗斯"
russia_unrest_button_desc: "我们将我们的民族主义思想输出到俄罗斯帝国的少数民族中。希望这将导致他们宣布并赢得独立。如果他们为自己争取自由国家的支持不够，我们将劝说真正的爱国者迈出最后一步。"


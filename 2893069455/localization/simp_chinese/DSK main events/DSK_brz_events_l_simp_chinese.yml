end_coffee_petitions.1.d:0 "政治团体要求让步"
end_coffee_petitions.1.f:0 "随着新法律的颁布，精英之间发生了不断的动荡，因为他们被排除在当前明显偏袒两个利益集团之外的咖啡和牛奶政策中。人们要求让步。"

end_coffee_petitions.1.a:0 "我们将让出一些地方"
end_coffee_petitions.1.b:0 "我们将继续执行我们当前的政策"

coffee_and_milk_agitation:0 "稳定受到威胁"


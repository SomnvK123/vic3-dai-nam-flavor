acre.6.t:0 "波哥大条约"
acre.6.d:0 "我们已经与[SCOPE.sC('target').GetName]达成协议"
acre.6.f:0 "该条约明确划定了两国边界的范围，从位于Pedra do Cucuí前的小岛（位于巴西、哥伦比亚和委内瑞拉边界的三重点）一直延伸到Apaporis River与Japurá交汇处；而且，暂时性地，还包括了由几何直线形成的区域，该直线从Apaporis在Japurá上的入口一直延伸到Letícia和Tabatinga两市之间的边界。"

acre.6.a:0 "让我们支付公平份额来结束这场争端"
acre.6.c:0 "也许下次再考虑"

brazil_republic:0 "共和国宣言"
brazil_republic_desc:0 "随着奴隶制的结束，是时候推动新巴西的发展了"

brazil_republic.1.t:0 "共和国宣言"
brazil_republic.1.d:0 "巴西帝国的终结"
brazil_republic.1.f:0 "随着奴隶制的结束，地主们转而反对皇帝和摄政王，失去了帝国在巴西的最后支持。前奴隶主加入了共和党的行列，不是出于真正的反帝国情感，而是作为对君主制的“复仇”，因此他们被戏称为“最后一刻的共和党人”或“5月13日的共和党人”。帝国政权的崩溃在很大程度上与奴隶制有关。在进步派看来，巴西帝国在消除奴隶制方面行动非常缓慢，这无疑在多年来削弱了其合法性。然后，前奴隶主在被拒绝赔偿后，转向了共和主义事业。"

brazil_republic.1.a:0 "Deodoro da Fonseca元帅将领导我们推翻皇帝！"
brazil_republic.1.a.a:0 "共和国万岁"
brazil_republic.1.b:0 "皇上陛下万岁！我们不会屈服！"
brazil_republic.1.b.b:0 "老方法更好。继续保持帝国"
brazil_republic.2.t:0 "共和国宣言"
brazil_republic.2.d:0 "在这一天，在里约热内卢市政厅，共和国庄严宣告成立。"

brazil_republic.2.f:0 "亲爱的市民们；人民、军队和海军，与我们居住在各省的同胞完全一致，刚刚裁定废黜了帝国王朝，从而取消了代议制君主制政府。作为这一完全爱国的国家革命的直接结果，刚刚成立了一个临时政府，其主要任务是通过公共秩序来保障市民的自由和权利。为了组成这个政府，直到主权国家通过合适的机构进行了终定政府的选举，下面签署的市民们已经被行政首脑选中。亲爱的市民们；临时政府只是国家主权的临时代理人，是和平、自由、友爱和秩序的政府。"

brazil_republic.2.a:0 "如果是这样，那将是我的退位。然后我会休息。 —— 巴西前皇帝佩德罗二世"

br_Irineu:0 "伊里乌"

br_Evangelista:0 "埃万吉利斯塔·德·苏萨"

maua:0 "莫阿子爵"
maua_desc:0 "巴西的未来不在于其农业土地，而在于工业的力量！让我们召集我们最聪明的头脑来工作吧！"

maua.1.t:0 "莫阿子爵"
maua.1.d:0 "莫阿铁路"
maua.1.f:2 "英格兰一直是工业革命的中心，而巴西仍然是一个农业生产国。为了寻找资源，前往英国的商务之旅使伊里乌·埃万吉利斯塔，莫阿子爵，发现了工厂、铁矿和资本主义企业的世界，使他确信巴西应该走工业化之路。从而开始了他对巴西未来的投资。"
maua.1.a:0 "在里约热内卢建立帝国佩特罗波利斯铁路和蒸汽航运公司"
maua.1.b:0 "巴西是一个大陆国家，我们需要扩展到首都以外的地区"

reclaim_cisplatina:0 "解决西斯普拉蒂纳省问题"
reclaim_cisplatina_desc:0 "是时候一劳永逸地解决乌拉圭的局势了！"

cisplatina.1.t:0 "解决西斯普拉蒂纳省问题"
cisplatina.1.d:0 "西斯普拉蒂纳省需要"
cisplatina.1.f:0 "1821年，亚马逊河东岸省被吞并为巴西王国的一个省份，名为西斯普拉蒂纳。1828年，由英国经过外交家约翰·庞森比的斡旋所促成的初步和平协定，被巴西帝国和联合省签署，将西斯普拉蒂纳省独立为乌拉圭东岸共和国。\n随着与巴拉圭战争的结束，现在是彻底解决与[SCOPE.sC('uru_tag').GetName]的局势的时候了"

cisplatina.1.a:0 "战争！"
cisplatina.1.b:0 "我认为我们已经解决了谁是这片大陆的领袖。乌拉圭仍然是一个缓冲国"

brazil_hegemony:0 "地区霸权承认"
brazil_military_reward:0 "西斯普拉蒂纳问题解决"
br_supporting_military:0 "军国主义"

eusebio:0 "通过尤塞比奥法案"
eusebio_desc:0 "随着英国的压力不断增加，也许是时候改变我们关于奴隶制的法律了"

eusebio_law.1.t:0 "尤塞比奥·德·奎罗兹法"
eusebio_law.1.d:0 "奴隶贸易的终结"
eusebio_law.1.f:0 "英国正在施加压力，以结束巴西的奴隶贸易，英国军舰曾扣押巴西的奴隶船。英国议会颁布了阿伯丁法案，允许英国巡洋舰扣押巴西的奴隶船，以试图结束奴隶贸易。现在是时候加强1831年11月7日颁布的一项法律，但从未得到全面执行的法律，并重新推动费利斯贝托·卡尔代拉·布兰特的反奴隶贸易法案并将其变成法律了。"
eusebio_law.1.a:0 "我们将终结奴隶贸易"
eusebio_law.1.b:0 "英国对我们的内部事务无权干涉"

santos_dumont.1.t:0 "航空之父"
santos_dumont.1.d:0 "桑托斯·杜蒙特首次飞行！"
santos_dumont.1.f:0 "桑托斯·杜蒙特是世界上首位搭乘汽油发动机飞机飞行的人。他在巴黎的巴加泰勒野外以“掠食者”的法语名字“Oiseau de Proie”（鸟类）飞行了约六十米，飞行高度为二到三米。不到一个月后，在众多目击者面前，他搭乘“掠食者III”以高度六米飞行了220米。这些飞行是世界上首次得到法国航空俱乐部批准的重于空气的飞行器的飞行，可能是首次公开展示了一辆车辆自行起飞，无需发射台的情况。"

santos_dumont.1.a:0 "“航空问题必须由航空来解决！”"
santos_dumont.1.b:0 "欧洲人民对巴西的发明充满着迷"

santos_dumont_mod:0 "航空之父"

minas:0 "米纳斯吉拉斯"
minas_desc:0 "米纳斯吉拉斯事件"

minas_gerais.1.t:0 "米纳斯吉拉斯号"
minas_gerais.1.d:0 "米纳斯吉拉斯号无畏战列舰"
minas_gerais.1.f:0 "这艘船以纪念米纳斯吉拉斯州而命名，被铺设为其级别的首艘船，使巴西成为第三个正在建造无畏战列舰的国家，并引发了巴西、阿根廷和智利之间的海军军备竞赛。在完工两个月后，米纳斯吉拉斯号在《科学美国人》上亮相，该杂志称其为“重型战列舰设计的最新成果和世界上最强大的战舰”。"

minas_gerais.1.a:0 "我们的新无畏战列舰，米纳斯吉拉斯号，将成为我们精英军队的骄傲"
minas_gerais.1.b:0 "我们应该专注于向社会各个领域开放招聘"
ig_group_angry:0 "愤怒"
alberdeen_act.1.t:0 "阿伯丁法案"
alberdeen_act.1.d:0 "英国议会签署了阿伯丁法案"
alberdeen_act.1.f:0 "该法案的通过是为了执行英国国王与巴西皇帝之间关于调整和最终废除非洲奴隶贸易的公约。因此，皇家海军现在被允许在高海上拦截巴西的奴隶船，而在这些船上被捉到的巴西奴隶贩子将在英国海军法庭受审。预计在接下来的几年里，由于有大量巴西人因贩卖奴隶而被捕，将导致英国海军法庭的案件数量大幅增加。"

alberdeen_act.1.a:0 "我们无法承受与英国开战..."


guarani.1.t:0 "伊尔·瓜拉尼（The Guarany）"
guarani.1.d:0 "一部巴西歌剧首次在巴西以外地区赢得赞誉"
guarani.1.f:0 "伊尔·瓜拉尼（The Guarany）是由安东尼奥·卡洛斯·戈麦斯（Antônio Carlos Gomes）创作的歌剧，基于何塞·德·阿伦卡尔（José de Alencar）的小说《瓜拉尼》。它的剧本不是使用戈麦斯的母语葡萄牙语，而是由安东尼奥·斯卡尔维尼（Antonio Scalvini）和卡洛·多梅维尔（Carlo D'Ormeville）编写的意大利语版本。歌剧版故事发生在1560年的里约热内卢附近，情节围绕着瓜拉尼印第安王子佩里（Pery）和葡萄牙贵族的女儿塞西莉亚之间的跨种族爱情故事展开。这部作品强调了浪漫化的“高贵野蛮人”概念，以异国情调的巴西热带背景为背景，以及种族混合的概念，这自巴西建国以来一直是巴西生活的重要组成部分。在歌剧序曲中，戈麦斯在意大利式的管弦乐背景下营造出一种浪漫的印第安主义氛围，他在管弦乐器中引入了亲密的抒情段落，与充满戏剧性的时刻形成了对比，后者利用了管弦乐队的全部动态范围。"

guarani.1.a:0 "作品在整个欧洲的歌剧院中表演，获得了巨大的成功"
guarani.1.b:0 "我们应该把这个演出带回家"


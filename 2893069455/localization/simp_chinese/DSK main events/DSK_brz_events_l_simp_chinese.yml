dsk_gbr.63.f:0 "联邦自治领的羽毛笔蘸着#red 人种光谱仪#!的墨水：\n\n-《#v 自治领土地法#!》向#v 乌克兰农民#!敞开冻土，却用#red 连续航行条款#!锁死#v 印度劳工#!的船舱\n-温哥华码头漂浮着#v 华人头税证书#!，每张$500的印花都在丈量#red 黄祸论#!的海岸线\n-传教士在#v 黑脚族保留地#!宣读《#v 印第安法案#!》，同时焚烧#red 夏威夷蔗工#!的香蕉叶契约\n\n#v 白人政策#!的三重棱镜：\n›用#v 英国儿童移民计划#!浇筑#red 新不列颠#!的种族纯度\n›以#v 妇女参政令#!为滤网，筛除#red 东方新娘#!的子宫记忆\n›将#v 乌克兰集中营#!的铁丝网化作#red 社会达尔文主义#!的接种疫苗\n\n最后留在移民部档案柜的，不仅是#red 排华法案#!的钢印，还有整片大陆被#red 优生学#!校准的瞳孔颜色"

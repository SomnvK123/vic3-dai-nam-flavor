acre.2.a:0 "谈判取得成功，[SCOPE.sState('amazonas_scope').GetName] 已归我们所有！"
acre.2.t:0 "阿克里州购买"
acre.2.d:0 "里奥布朗科男爵带来了绝佳的消息！"

acre.2.f:0 "秘鲁也宣称对整个阿克里州和亚马逊州的一部分领土拥有主权，基于历史的殖民权益，但里奥布朗科的外交技巧迅速粉碎了这些主张。条约已经签署，我们可以开始将阿克里州纳入巴西领土的政治一体化进程。"
acre.3.a:0 ""
acre.3.t:0 ""
acre.3.d:0 ""
acre.3.f:0 ""

acre.4.t:0 "阿克里州谈判"
acre.4.d:0 "随着[SCOPE.sState('amazonas_scope').GetName]州寻求独立，巴西外交部长里奥布朗科男爵立即开启外交渠道，以解决这一问题"
acre.4.f:0 "橡胶热被形容为18世纪淘金潮的同样紧迫，这导致了巴西和玻利维亚边界的冲突。已经报告了几起武装冲突。最终，玻利维亚政府与玻利维亚工会签署了一份协议，以强制控制阿克里州。巴西国会对这一行为的专断性感到震惊，采取了措施，取消了两国之间的商业协议和航行权，并暂停前往玻利维亚的旅行权。与此同时，巴西人组织了一次大规模的武装袭击争议地区。巴西外交部长里奥布朗科男爵立即与[SCOPE.sC('bolivian_scope').GetName]建立了联系"
acre.4.a:0 "让我们进行外交谈判，以获取这些土地！"
acre.4.tt1:0 "我们将支付公平份额的一万英镑"
acre.4.c:0 "也许下次再考虑"
acre_brz_big_money:0 "领土购买"

je_diplo_negotiation.2:0 "外交谈判"

br_english_raiding:0 "劫掠奴隶船"
alberdeen_act.2.t:0 "英国持续施压"
alberdeen_act.2.d:0 "英国海军继续在高海上追捕我们的奴隶贸易船只"
alberdeen_act.2.f:0 "英国皇家海军继续在高海上截停巴西的奴隶船只，巴西奴隶贩子被抓后在英国海军法院受审。"

alberdeen_act.2.a:0 "这只是试图阻止巴西崛起为世界大国的企图。发表抗议并无视它"
alberdeen_act.2.a.tt:0 "我们将失去一次对Eusébio法支持的支持"
alberdeen_act.2.b:0 "设立特许权，并利用这个机会为新法案赢得支持"
alberdeen_act.2.b.tt:0 "我们将获得一次对Eusébio法支持的支持"

alberdeen_act.3.t:0 "奴隶运输遭到截停"
alberdeen_act.3.d:0 "英国海军在高海上截获了新的奴隶涌入"
alberdeen_act.3.f:0 "英国正在高海上对我们的奴隶船只进行一系列袭击。这已经在我们国家周围产生了影响，因为奴隶贸易变得越来越危险。"

alberdeen_act.3.a:0 "我们将赔偿进口州的奴隶主"
alberdeen_act.3.a.tt:0 "我们将失去一次对法案支持的支持"
alberdeen_act.3.b:0 "发表抗议信反对英国，但利用这个机会赢得法案支持"
alberdeen_act.3.b.tt:0 "我们将获得一次对法案支持的支持"

 alberdeen_act.4.t:0 "英国船只交火！"
 alberdeen_act.4.d:0 "一艘英国战舰正在追捕我们的奴隶贩子之一，与我们在[SCOPE.sState('port_attacked').GetName]的沿海炮台交火。我们的军官要求采取行动！"
 alberdeen_act.4.f:0 "这必须被视为侵犯自由市场、航行自由的行为，是对巴西主权和领土完整的侮辱。自从Alberdeen法案通过以来，由于大量巴西人因贩卖奴隶而被捕，英国海军法院的案件数量大幅增加。一些英国船只开始进入巴西领土水域，甚至是港口，袭击奴隶船只。这一次，一艘英国战舰与位于[SCOPE.sState('port_attacked').GetName]的巴西炮台交火。"

 alberdeen_act.4.a:0 "也许现在是加强我们海军的时候。"
 alberdeen_act.4.a.tt:0 "我们将失去一次对法案支持的支持"
 alberdeen_act.4.b:0 "我们负担不起与英国开战的代价。引进工人修复损害"
 alberdeen_act.4.b.tt:0 "我们将获得一次对法案支持的支持"

 alberdeen_act.5.t:0 "自由州[SCOPE.sState('br_free_slave').GetName]"
 alberdeen_act.5.d:0 "政府行动迟缓。[SCOPE.sState('br_free_slave').GetName]现在充满了梦想着一个新巴西的理想主义者。"
 alberdeen_act.5.f:0 "废奴主义者涌入[SCOPE.sState('br_free_slave').GetName]，希望塑造该地区政府以符合他们的意愿。他们现在宣布该州已摆脱了奴隶制！" 
 alberdeen_act.5.a:0 "我们手头的事情太多了。让[SCOPE.sState('br_free_slave').GetName]成为一个自由州吧。"
 alberdeen_act.5.b:0 "[SCOPE.sState('br_free_slave').GetName]将继续保持奴隶制。打压他们"
 
 alberdeen_act.5_att2:0 "我们将获得一次对法案支持的支持。"
alberdeen_act.5_tt:0 "大约有3,000名自由劳工将移入[SCOPE.sState('br_free_slave').GetName]。"
alberdeen_act.5_tt2:0 "将会收集一小部分逃亡奴隶到[SCOPE.sState('br_free_slave').GetName]。"
alberdeen_act.5_btt2:0 "我们将失去一次立法支持的进展"

br_free_state:0 "自由州"

alberdeen_act.6.t:0 "奴隶引发不适"
alberdeen_act.6.d:0 "[SCOPE.sCharacter('slaver_ig_leader').GetFullName]的奴隶因表达自己的意见而引发了精英阶层的不适，并且现在已经被主人惩罚了。"
alberdeen_act.6.f:1 "通过惩罚这名奴隶，[SCOPE.sCharacter('slaver_ig_leader').GetLastName]已经引发了国内问题。现在，他要求国家确认所实施的惩罚，以确认他的权威。废奴主义者呼吁忽视[SCOPE.sCharacter('slaver_ig_leader').GetHerHis]的要求。"
alberdeen_act.6.a:0 "我们将确认他的权威并确保法律得以执行。"
alberdeen_act.6.b:0 "我们不能再容忍这种行为，忽视他的要求"

alberdeen_act.6.att:0 "我们将失去一次立法支持的进展。"
alberdeen_act.6.btt:0 "我们将获得一次立法支持的进展。"

je_slavery_debate.1:0 "英国对奴隶贸易的压力"
je_slavery_debate.1_reason:0 "通过通过阿伯丁法案，大不列颠继续对巴西的奴隶制施加压力。"
je_slavery_debate.1_goal:0 "时间流逝"

je_slavery_debate.2:0 "尤塞比奥法"
je_slavery_debate.2_reason:0 "通过获得足够的支持，我们可能能够通过新的立法来安抚英国的压力。我们可以通过国内事件获得支持的进展。"
je_slavery_debate.2_goal:0 "我们需要5次支持的进展来实现我们的目标。"

acre.5.t:0 "亚马逊边界争端"

acre.5.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]-[SCOPE.sC('target_c').GetName]边界争端"
acre.5.f:0 "解决巴西与[SCOPE.sC('target_c').GetName]边界问题的尝试可以追溯到解放运动和1821年美洲西班牙总督领地的分裂时期，当时形成了大哥伦比亚，包括今天的委内瑞拉、哥伦比亚、厄瓜多尔和巴拿马。"

acre.5.a:0 "让我们进行外交谈判，解决我们亚马逊边界的争端"
acre.5.c:0 "也许下次再考虑"


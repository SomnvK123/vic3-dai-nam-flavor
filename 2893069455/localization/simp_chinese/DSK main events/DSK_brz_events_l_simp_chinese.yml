paraguay_war.1.t:0 "[SCOPE.sC('uru_scope').GetName]的紧张局势"
paraguay_war.1.d:0 "解放十字军"
paraguay_war.1.f:0 "一场叛乱在[SCOPE.sC('uru_scope').GetName]（Cruzada Libertadora或Cruzada do Libertador）爆发，反对目前总统，他得到了我们的竞争对手[SCOPE.sC('prg_scope').GetName]的支持。这导致了国家陷入叛乱状态。他们的领袖是[SCOPE.GetRootScope.GetCountry.GetName]的支持者，可能会帮助我们扩大在该地区的影响力。"

paraguay_war.1.a:0 "我们应该仔细观察这一情况"

paraguay_war.2.t:0 "[SCOPE.sC('uru_scope').GetName]的紧张局势"
paraguay_war.2.d:0 "解放十字军继续"
paraguay_war.2.f:0 "[SCOPE.sC('prg_scope').GetName]总统致函[SCOPE.sC('arg_scope').GetName]政府，要求就其在[SCOPE.sC('uru_scope').GetName]可能的涉及提出解释。阿根廷已回应并否认卷入当前危机。还有报道称，我们边界上的高乔牧场主和乌拉圭牧场主之间发生了冲突。"

paraguay_war.2.a:0 "冲突开始扩散到我们的领土。我们应该支持站在我们这一边的人"
paraguay_war.2.b:0 "我们不应该干涉其他国家的事务。忽略这个问题"

uru_support_mod:0 "支持叛乱分子"
prg_support_mod:0 "扩张主义税"
paraguay_war.3.t:0 "拉普拉塔盆地危机"
paraguay_war.3.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]边境沿线的破坏"
paraguay_war.3.f:0 "巴西部长若泽·安东尼奥·萨拉瓦带领帝国舰队登上乌拉圭水域，要求赔偿对边境地区高乔地主与乌拉圭地主的冲突造成的损害。[SCOPE.sC('prg_scope').GetName]也派遣了他们的代表，以争辩我们在该地区的干预。"

paraguay_war.3.a:0 "我们要求对沿边境地区造成的破坏进行赔偿"
paraguay_war.3.b:0 "我们应该重新考虑这个问题，不再提出这个问题，以免冒险使局势进一步升级"
uru_not_lives_tt:0 "乌拉圭这个国家已不复存在"
paraguay_war.4.t:0 "拉普拉塔盆地危机"
paraguay_war.4.d:0 "[SCOPE.sC('arg_scope').GetName]和[SCOPE.GetRootScope.GetCountry.GetName]合作条约及[SCOPE.sC('prg_scope').GetName]的提议"
paraguay_war.4.f:0 "[SCOPE.sC('uru_scope').GetName]总统拒绝了巴西的要求，提出了自己的要求，并请求巴拉圭的帮助。为解决不断加剧的危机，巴拉圭总统提出调解乌拉圭危机并提出了解决方案。与此同时，在布宜诺斯艾利斯签署了巴西和阿根廷之间的拉普拉塔盆地危机互助合作条约。冲突继续蔓延到我们的土地。如果这个问题不加以解决，巴拉圭将在巴西的势力范围内扩大其影响力。"

paraguay_war.4.a:0 "是时候结束这一切了。向乌拉圭政府发出最后通牒，拒绝巴拉圭的外交干预"
paraguay_war.4.att:0 "这个选择最终会导致战争"
paraguay_war.4.b:0 "我们应该考虑巴拉圭的提议"
paraguay_war.5.t:0 "拉普拉塔盆地危机"
paraguay_war.5.d:0 "[SCOPE.sC('uru_scope').GetName]拒绝了我们的最后通牒"
paraguay_war.5.f:0 "作为对乌拉圭的最后通牒的回应，我们收到的回应并不来自乌拉圭，而是来自[SCOPE.sC('prg_scope').GetName]共和国政府。内容如下：巴拉圭将考虑对东部领土，即乌拉圭的任何占领都视为对拉普拉塔各国平衡的攻击，这关系到巴拉圭共和国作为其安全、和平和繁荣的保证的利益。他在最庄重的方式下抗议这一行为，并放弃了未来可能因这一声明而产生的所有责任。"

paraguay_war.5.a:0 "巴西不应放弃保护巴西公民的生命和利益的职责。干预乌拉圭内战。"
paraguay_war.5.b:0 "在事态升级到战争之前，我们应该退却，不再推进。"

uruguay_war:0 "巴西对乌拉圭的干预"

paraguay_war.6.t:0 "三重同盟之战"
paraguay_war.6.d:0 "[SCOPE.sC('prg_scope').GetName]宣战！！"
paraguay_war.6.f:0 "在拉普拉塔河流域争夺霸权的斗争深刻地影响了该地区各国的外交和政治关系。巴西帝国、阿根廷、巴拉圭和乌拉圭之间的一系列外交和军事冲突与争夺拉普拉塔河流域的自由航行和贸易有关。这些冲突的根源可以追溯到殖民时代以来该地区的地缘政治重要性。现在，巴拉圭总统利用了乌拉圭战争作为控制拉普拉塔盆地的借口。"

paraguay_war.6.a:0 "三重同盟成立，我们将获胜！"
paraguay_war.6.ctt:0 "战争开始了。"
paraguay_war.6.ctt2:0 "[SCOPE.sC('arg_scope').GetName]履行了签署的协定，并加入了我们一边的战争"
paraguay_war.6.ctt3:0 "在干预[SCOPE.sC('uru_scope').GetName]结束后，他们将加入我们一边的战争。"

paraguay_war.7.t:0 "绝不屈服"
paraguay_war.7.d:0 "#yellow 巴西#!和#yellow 阿根廷#!的军队侵犯了我们的领土，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]决心带领所有[SCOPE.GetRootScope.GetCountry.GetName]人民与其死战，为了独立，更是为了[SCOPE.GetRootScope.GetCountry.GetName]的未来，哪怕退到丛林里打游击战也决不投降。"
paraguay_war.7.f:0 "[SCOPE.GetRootScope.GetCountry.GetName]的最后一寸土地将是我的坟墓......为了[SCOPE.GetRootScope.GetCountry.GetName]，宁可光荣赴死，也不苟且偷生，我与祖国共存亡！"
paraguay_war.7.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]会带领我们走向胜利。"
paraguay_war.7.b:0 "面对联军的进攻，我们无能为力。"

paraguay_war:0 "三重同盟之战"

je_la_plata_crysis_1:0 "乌拉圭危机"
je_la_plata_crysis_1_reason:0 "乌拉圭反对派将军正在入侵乌拉圭领土。他的部队在拉斯加利纳斯角登陆，旨在推翻当前的民族主义政府。"
je_la_plata_crysis_1_goal:0 "危机升级"
je_la_plata_crysis_2:0 "乌拉圭危机升级"
je_la_plata_crysis_2_reason:0 "随着解放十字军的持续进行，冲突即将爆发成内战。有关阿根廷干预危机并支持其中一方的传言也不绝于耳。"
je_la_plata_crysis_2_goal:0 "危机升级"

je_la_plata_crysis_3:0 "乌拉圭谈判"
je_la_plata_crysis_3_reason:0 "在[SCOPE.sC('uru_scope').GetName]，内战实际上已经开始。我们已经接触了政府，要求赔偿冲突蔓延到我们的土地。此外，[SCOPE.sC('prg_scope').GetName]也派遣代表团进行谈判。\n为了进行良好的外交手段，我们需要在[SCOPE.sC('uru_scope').GetName]维持至少6个月的资助游说团行动。"
je_la_plata_crysis_3_goal:0 "维持对[SCOPE.sC('uru_scope').GetName]资助游说团6个月后，等待外交谈判结束"

par_war_alternative.1.t:0 "巴拉圭扩张"
par_war_alternative.1.d:0 "爆发了战争"
par_war_alternative.1.f:0 "也许我们错误地估计了情况。巴拉圭曾经进行了外交谈判，试图控制乌拉圭。不仅如此，他们现在还对阿根廷宣战了。"

par_war_alternative.1.a:0 "我们应该预见到这一点……"

br_failed_diplo:0 "糟糕的国际关系"

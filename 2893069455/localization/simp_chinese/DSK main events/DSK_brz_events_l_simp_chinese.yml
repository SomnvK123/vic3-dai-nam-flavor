dsk_gbr.61.t:0 "美加墨自由贸易大会"
dsk_gbr.61.d:0 "#v [SCOPE.sCountry('usa_scope').GetName]、[SCOPE.sCountry('can_scope').GetName]、[SCOPE.sCountry('mex_scope').GetName]为捍卫自由贸易之神圣权利，弱化单边主义，强化区域价值链与大洲供应链体系，故签订此条约#!\n\n《美墨加三国协议》将为我们的工人、农民和公司提供高标准的贸易协议，它将促成更加自由的市场、更加公平的交易以及更可持续的经济增长！"

dsk_gbr.61.f:0 "此刻，太平洋的潮声已隐约可闻，但怀表里的罗盘指针开始腐蚀。那些被铁轨覆盖的野牛迁徙路径，正沿着经纬网格反方向生长，刺穿所有标着"文明进步"的剖面图。\n\n我们以海平面为原点绘制等高线，用枕木作标尺切割大平原的皮肤。钢轨的延伸速度是每昼夜2.3英里，而苏族人的狩猎场正以每平方英里47个帐篷桩的速度消失"

dsk_gbr.61.a:0 "来场资本主义派对如何？"
dsk_gbr.61.b:0 "荣耀属于我们的工人兄弟"
dsk_gbr.61.c:0 "光荣属于我们的农民兄弟"
dsk_gbr.61.m:0 "加强与我们盟友之间的联系"
dsk_gbr.61.n:0 "未来来自我们的大学生"

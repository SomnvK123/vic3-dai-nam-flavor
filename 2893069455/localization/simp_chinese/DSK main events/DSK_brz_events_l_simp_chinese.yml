reboucas_brothers.1.t:0 "瑞博卡兄弟"
reboucas_brothers.1.d:0 "库里蒂巴 - 安东尼纳铁路"
reboucas_brothers.1.f:0 "巴西军事工程师、废奴主义者和发明家安德烈·瑞博卡斯完成了世界上最困难的铁路项目之一。他是律师、议会成员，也是巴西皇帝佩德罗二世的顾问，他的父亲是一位被释放的奴隶和一位葡萄牙裁缝的儿子。他的兄弟安东尼奥·佩雷拉·瑞博卡斯·费略和约瑟·瑞博卡斯也是工程师。尽管存在种族偏见，但他的父亲，一位混血儿，是一位重要和有威望的人。他自学成才，具备了全国执业律师的权利，代表巴伊亚州参加了一系列的议会，担任塞尔希皮省省长办公室秘书，担任皇帝的顾问，并于1823年获得了帝国南十字星骑士的称号。"

reboucas_brothers.1.a:0 "这个项目将有益于巴拉那州"
reboucas_brothers.1.b:0 "让我们利用这个机会推动我们的建筑技术前进！"
coffe_and_milk_mod:0 "咖啡和牛奶政策繁荣"

je_coffee_export_reason:0 "为了推动国家的发展，必须做出政治妥协。我们需要专注于扩大与咖啡种植者的影响力"

je_meat_export_reason:0 "为了推动国家的发展，必须做出政治妥协。我们需要专注于扩大与养殖业主的影响力"

modern_week.1.t:0 "现代艺术周"
modern_week.1.d:0 "我们已进入艺术与文化的新时代！"
modern_week.1.f:0 "[SCOPE.GetRootScope.GetCountry.GetName]的一次先锋艺术活动被称为现代艺术周。这个周标志着现代主义运动的正式确立，虽然此前已有现代艺术探索的萌芽，但这周通过系统化的呈现将分散的创作力量凝聚为明确的文化运动，并首次将其完整面貌呈现给公众。活动在首都的城市剧院举办，包含前卫艺术展览、先锋理论研讨、实验音乐演出和新型诗歌朗诵。该周由著名画家和先锋诗人联合策划，旨在调和新兴现代主义者与传统艺术权威的矛盾，后者以国家艺术学院为核心，长期固守严谨的学院主义传统。"

modern_week.1.a:0 "支持艺术创新"
modern_week.1.b:0 "艺术需要民族特质"
modern_week.1.c:0 "整合艺术创作力量"

maua.2.t:0 "维斯孔特的投资"
maua.2.d:0 "维斯孔特·迪·莫阿继续扩大业务"
maua.2.f:0 "随着尤塞比奥法的通过，废奴主义者、企业家、工业家、银行家和政治家维斯孔特·迪·莫阿继续投资于巴西的未来。他现在已经委托建造了连接南美洲与欧洲的第一根电报海底电缆，并在里约热内卢市安装了第一批燃气路灯。"
maua.2.a:0 "让我们专注于扩大我们的私人投资"
maua.2.b:0 "我们应该趁机减轻我们的贷款"

maua.3.t:0 "莫阿维斯孔特银行"
maua.3.d:0 "维斯孔特·迪·莫阿希望在乌拉圭建立第一家银行。"
maua.3.f:0 "维斯孔特·迪·莫阿已经获得了乌拉圭立法机关的授权，允许他在该国进行投资，从而建立了一个兑换和信贷机构。它现在已经超出了预期，他希望将其扩展成乌拉圭的第一家银行。"

maua.3.a:0 "这是与我们的邻居合作的绝佳机会"
maua.3.b:0 "投资应该在国内进行"


 dsk_je_nafta_union:0 "美加墨自由贸易区"
 dsk_je_nafta_union_reason:0 "#v [SCOPE.sCountry('usa_scope').GetName]、[SCOPE.sCountry('can_scope').GetName]、[SCOPE.sCountry('mex_scope').GetName]为捍卫自由贸易之神圣权利，弱化单边主义，强化区域价值链与大洲供应链体系，故签订此条约#!\n\n朋友们，我们此刻聚集在三国边境这象征命运的瀑布前——湍急水流之下，蕴藏着一个世纪最为大胆的设想：北美自由贸易区正奋力挣脱旧习的锁链。\n\n当铁路与运河开始丈量这片大陆的纬度，当芝加哥的谷物与蒙特雷的矿石穿越国界握手——贸易之路本应如密西西比河般奔流不息。然而沉重关税与人为壁垒如同礁石，撞碎了货物与繁荣自然流淌的意志。\n\n这片伟大的土地，并非为隔绝而生，绝非被禁锢的命运。先驱们踏过的原野，商队跨越的山脉——它们呼喊的是无界的联系，绝非彼此对抗的阵营！林肯总统曾痛心于分裂的代价，同样，今日贸易壁垒也在无声抽打北美共同的希望。\n\n当加拿大富饶森林蕴藏的财富难以南下，当墨西哥山谷的丰饶被贸易篱笆所困，当美国工厂渴求的原料在关税壁垒后止步——这不仅是商品的滞销，更是无数家庭生计在僵死制度下的煎熬。我们面对的根本问题是：能否在广袤北美架起真正自由流通的贸易通衢？\n\n在此，让我们以不可动摇的决心立下誓言：必须清除壁垒之刺，保障劳动者、制造者、耕耘者、开拓者的劳动成果能在整个北美大地自由交换！""


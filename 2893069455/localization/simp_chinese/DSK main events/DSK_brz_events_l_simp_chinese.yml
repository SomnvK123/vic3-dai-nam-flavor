dsk_gbr.47.t:0 "海军部否决远洋合练提案"
dsk_gbr.47.d:0 "第一海务大臣在#red 白厅橡木厅#!签署否决令，其羊皮纸批注写道：‘在#bold 阿尔赫西拉斯会议#!（1906）后的敏感时期，帝国舰队不宜在#red 摩洛哥近海#!展露重兵——尤其当#bold 达达尼尔海峡#!铁矿运输线尚未投保劳埃德社之际。’"
dsk_gbr.47.f:0 "帝国更需确保#red 石油管道与钨矿运输#!的平静时期，此时乃多事之秋，在特殊时期不宜兴师动众，更不宜穷兵黩武"
dsk_gbr.47.a:0 "好吧"


dsk_gbr.48.t:0 "帝国财政贷"
dsk_gbr.48.d:0 "#red 帝国财政贷款分配#!与镀金时代的#bold 财富与苦难#!天平"
dsk_gbr.48.f:0 "[SCOPE.GetRootScope.GetCountry.GetName]总督的急电与伯明翰工会的罢工传单同时抵达唐宁街：#red 帝国国库#!向我们拨款#bold 220万英镑#!，但需抉择流向——是缓解#bold 苦难行军#!，还是注资#red 克莱德班克造船厂#!（《1893年殖民地财政法案》第5款禁止同时拨款民生与军备）。"
dsk_gbr.48.a:0 "来一场豪华派对如何？"
dsk_gbr.48.b:0 "优先用于投资国内建设！"
dsk_gbr.48.c:0 "国内的百姓正处于饥寒交迫，将财政多用于穷人！"
dsk_gbr.48.e:0 "感谢上帝，我们的宗主财政充裕，愿意无偿拨款给我们！"

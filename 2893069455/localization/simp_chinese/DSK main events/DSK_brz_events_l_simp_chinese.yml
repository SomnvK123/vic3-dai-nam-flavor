# 毛皮贸易的黄金时代
dsk_gbr.29.t:0 "毛皮时代"
dsk_gbr.29.d:0 "18世纪末至19世纪中叶，哈德逊湾公司（HBC）以#bold 《鲁珀特土地特许状》#!（1670年）为法律根基，控制着北美洲#red 鲁珀特地区#!（今加拿大中北部）的毛皮贸易网络。公司通过#yellow 约克工厂#!等沿海据点，与克里族、奥吉布瓦族等原住民建立以物易物体系：30张优质海狸皮可兑换一杆燧发枪，铁锅、毛毯与火药成为改变土著社会结构的#blue 贸易货币#!。"
dsk_gbr.29.f:0 "1812年，苏格兰移民与梅蒂斯人在#red 红河殖民地#!（今温尼伯）爆发冲突，迫使HBC于1821年合并竞争对手#bold 西北公司#!，垄断从哈德逊湾至太平洋沿岸的#yellow 毛皮边疆#!。至1840年代，每年有超过20万张河狸皮经伦敦拍卖行流向欧洲制帽业，但过度捕猎已使皮毛资源濒临枯竭。公司同时承担#blue 准政府职能#!——在无官方管辖的荒原上征收关税、调解部族争端，甚至发行#red 代币货币#!。"
dsk_gbr.29.a:0 "一个新的时代即将到来"

# 哈德逊湾公司的没落
dsk_gbr.30.t:0 "公司统治的终结"
dsk_gbr.30.d:0 "1869年，加拿大自治领政府以#bold 30万英镑#!从HBC购得#red 鲁珀特地区#!（占今加拿大领土1/3）。这一交易触发#yellow 红河起义#!——梅蒂斯人领袖#blue 路易·瑞尔#!率武装阻止加拿大测量队进入，要求建立保护法语与天主教的#red 曼尼托巴省#!。"
dsk_gbr.30.f:0 "1870年《曼尼托巴法案》通过后，HBC的#bold 行政特权#!被彻底剥夺。其土地所有权缩减为#yellow 5%新开发地块#!，剩余土地由加拿大政府用于#blue 横贯大陆铁路#!建设与移民安置。至1880年代，随着#red 野牛群灭绝#!与毛皮经济崩溃，HBC转型为百货零售企业，其#bold 红色条纹旗#!从边疆哨所移至城市商铺，标志着持续两个世纪的#yellow 公司殖民模式#!终结。"
dsk_gbr.30.a:0 "向[SCOPE.sCountry('gbr_scope').GetName]移交权力"

dsk_gbr.31.t:0 "《九十二条决议》"
dsk_gbr.31.d:0 "1822年，[SCOPE.sCharacter('can_scope').GetLastName]去[SCOPE.sCountry('gbr_scope').GetName]，为[SCOPE.sCulture('franco_canadian').GetName]奔走呼号。\n\n此后一直坚决反对加拿大的英人政府，为实现对[SCOPE.sCulture('franco_canadian').GetName]有利的改革，开始与[SCOPE.sCountry('ont_scope').GetName]改良党领袖#yellow W·L·麦肯齐#!合作。\n\n1827年，由他领导的[SCOPE.sCountry('que_scope').GetName]人民运动与#v 加拿大人党#!合并成#v 爱国者党#!，他为领袖之一。\n\n1834年，他在议会鼓动提出了表达[SCOPE.sCulture('franco_canadian').GetName]意志的#o 《92项决议案》#!，要求解决滥用官职任命权、控制税收、控制法院系统，以及把公有土地仅仅分配给#bold 英国圣公会#!，而不顾卫理#bold 公会教派#!和#bold 长老会教派#!等问题。"
dsk_gbr.31.f:0 "1、​​宪政改革​​\n要求建立“责任政府”，即殖民地行政机构需对民选议会负责，而非仅听命于英国总督。决议指出，殖民地议会应拥有税收、司法任命和公共财政的完全控制权，打破由英裔寡头垄断的行政委员会权力结构。\n\n2、​​族群平等与文化自主​\n​抗议#bold 《1791年宪法法案》#!对[SCOPE.sCulture('franco_canadian').GetName]的歧视性政策，要求法语与英语享有同等法律地位，并保障天主教徒的宗教权利。决议特别谴责英国当局将土地优先授予英裔移民，导致法裔农民陷入贫困。​\n\n3、​经济自主权​​\n主张废除英国对加拿大贸易的垄断政策（如《谷物法案》），允许殖民地自主制定关税和商业政策。决议还要求改革土地分配制度，限制英国特许公司的土地投机行为"
dsk_gbr.31.a:0 "然而，他为[SCOPE.sCulture('franco_canadian').GetName]做出的提案却遭#red 英国政府#!的否决。"

dsk_gbr.32.t:0 "《加拿大土地垄断法案》"
dsk_gbr.32.d:0 "1826年成立的#bold 英国北美土地公司#!获#red 230万英亩#!授地权，垄断圣劳伦斯河谷至五大湖区的开发。公司董事含#bold 英裔官僚#!与#red 伦敦金融家#!，年股息率达#bold 8%#!"
dsk_gbr.32.f:0 "下加拿大#bold 70%耕地#!由占人口#red 7%的英裔寡头#!控制，[SCOPE.sCulture('franco_canadian').GetName]农民沦为#bold 分成佃农#!，年均收入不足#red 20英镑#!。"
dsk_gbr.32.b:0 "我们不得不屈服于[SCOPE.sCountry('gbr_scope').GetName]，并上交我们的财政权"
dsk_gbr.32.a:0 "没有经过全体[SCOPE.sCulture('franco_canadian').GetName]民主表决的决议案就是废纸！我们绝不接受！"


dsk_gbr.33.t:0 "《罗素决议案》"
dsk_gbr.33.d:0 "1837年3月6日，[SCOPE.sCountry('gbr_scope').GetName]的殖民大臣#bold 约翰·罗素勋爵#!向议会提交针对#bold 九十二条决议#!的正式答复，史称#bold 《罗素决议案》#!。该文件以#red 强硬立场#!否决[SCOPE.sCountry('que_scope').GetName]改革派的核心诉求：#bold 责任政府#!、#red 财政控制权#!与#bold 法语平等地位#!"
dsk_gbr.33.f:0 "核心条款​​\n\n​​议会权力限制​​：确认#bold 《1791年宪法法案》#!不可修正，下加拿大议会无权罢免由#red 英裔寡头#!控制的行政委员会。​\n\n​​财政权剥夺​​：授权总督在议会拒绝拨款时，可#red 直接动用殖民地国库#!（年预算约15万英镑）。​\n\n​​文化压制​​：重申#bold 英语#!为唯一官方语言，天主教学校须接受#red 英国国教监督#!。"
dsk_gbr.33.a:0 "我们不得不屈服于[SCOPE.sCountry('gbr_scope').GetName]，并接受《罗素决议案》"
dsk_gbr.33.b:0 "没有经过全体[SCOPE.sCulture('franco_canadian').GetName]民主表决的决议案就是废纸！我们绝不接受！"

dsk_gbr.34.t:0 "下加拿大起义"
dsk_gbr.34.d:0 "不幸的事情很快发生，1837年10月23日，[SCOPE.sCharacter('can_scope').GetLastName]在圣查尔斯的一次群众集会上，公开宣扬要采取武力行动。激进派也公开打出独立的旗帜。"
dsk_gbr.34.f:0 "“今天，我们不再是[SCOPE.sCountry('gbr_scope').GetName]殖民地的子民，[SCOPE.sCulture('franco_canadian').GetName]的众同胞们，团结起来，像60年前我们的南方邻居一样为打破殖民桎梏而战！\n\n我们不再效忠于任何人的领主，任何人的国王，任何人的独裁者。我们生在这片土地，我们饱含激情和爱站在一起，而我们一起追寻于一个共同的理念，那就是人人生而平等！”"
dsk_gbr.34.a:0 "起义的烽火已经被点燃，宁可站着死，绝不跪着生！"

dsk_gbr.35.t:0 "《德拉姆报告》"
dsk_gbr.35.d:0 "12月14日，500名起义军彻底被2000名正规军消灭。下加拿大的起义就此被镇压。起义结束后，1838年，[SCOPE.sCountry('gbr_scope').GetName]政府派[SCOPE.sCharacter('can_ruler_scope').GetLastName]任加拿大总督,之后，他提交了一份极有内容的报告。报告的正式名称是《英属北美殖民地事务分析》"
dsk_gbr.35.f:0 "拉姆报告的垓心有两个内容：\n\n一是建议上下加拿大应重新合并。二是建议让殖民地充分自治。引外，德拉姆还建议取消对英国国教的法律支持，立法广泛吸纳移民。上下加拿大合并的意见很快被接受了。"
dsk_gbr.35.a:0 "[SCOPE.sCharacter('can_ruler_scope').GetLastName]勋爵，请您快来就职[SCOPE.GetRootScope.GetCountry.GetName]总督"
dsk_gbr.35.b:0 "已阅"
popularity_person:0 "受欢迎的领导者"

je_United_Provinces_of_Canada:0 "英属北美法案"
je_united_kingdom_tt:0 "#v 加拿大人民，团结起来！#!"
we_are_canada_tt:0 "一个统一的#yellow 加拿大#!国家被建立起来"
je_United_Provinces_of_Canada_reason:0 "随着各省经济发展以及跨省界铁路的建设，[concept_colony]出现了一场政治体制改革运动，要求联合起来，建立一个统一的联邦国家。最初的方案是上下加拿大省的重新联合，由于[SCOPE.sCulture('franco_canadian').GetName]和[SCOPE.sCulture('anglo_canadian').GetName]两个民族存在着语言、宗教、法律和教育的差异，上下加拿大两个地区的经济也存在差异，用英文化同化法裔居民也被证明行不通，最后达成的共识是上下加拿大的联合必须建立在英裔和法裔双方利益的基础上。\n\n1864年政治家#yellow 乔治.布朗#!提出了一个新的大联合方案，即把原来加拿大省的联合扩大为整个英属北美殖民地的联合，建立一个#bold 从海洋到海洋#!的伟大国家，此方案得到多方支持。"
je_can_against_gbr:0 "下加拿大独立战争"
je_can_against_gbr_reason:0 "[SCOPE.sCountry('que_scope').GetName]起义了，起初，这些边界上的骚动并未直接影响到金士顿的居民们。1837年12月和1838年1月，“海盗”们仅在海军岛与尼亚加拉河上建立了据点。然而1838年2月，危险开始悄然东渐，沿着圣劳伦斯河向金士顿逼进。"
help_que_button:0 "支援下加拿大"
help_que_button_desc:0 "去吧，我的加拿大兄弟，我会紧随你"
independence_war_button:0 "吹响起义的号角"
independence_war_button_desc:0 "我们的兄弟已经起义，我们还在等什么？去战，去死，去加入他们反抗的事业！历史将会铭记这一天"

je_canada_indian_removal:0 "北美印第安人问题"
je_canada_indian_removal_reason:0 "《1763年皇家公告》​​：名义承认原住民对未割让土地的#bold 主权#!，但[SCOPE.sCountry('gbr_scope').GetName]实际通过#red 不平等条约#!强占#bold 90%传统领地#!\n克里族猎人在月光下传唱着：'白厅的羽毛笔签署《边界线协议》时，我们的鹰羽图腾正被装订进#red 土地转让契约#!的附录。'而殖民官员的马车载着#bold 铸铁界碑#!，沿着#red 1768年斯坦沃克斯线#!碾碎最后一个完整的狩猎圈。"
no_IRC_tt:0 "在加拿大的印第安人[concept_decentralized_nation]已不存在"

add_large_scripted_bar_progress_tt:0 "#o 大幅度#!增加#yellow 下加拿大起义#!进度条"
sub_large_scripted_bar_progress_tt:0 "#o 大幅度#!减少#yellow 下加拿大起义#!进度条"
low_legality_modifier:0 "低合法性"
modifer_Russell_Resolution:0 "《罗素决议案》"
dsk_gbr.36.t:0 "印第安人寄宿学校"
dsk_gbr.36.d:0 "联邦与教会合办#bold 139所寄宿学校#!，强制15万名原住民儿童脱离家庭。寄宿学校学生的年龄范围从4、5岁到18、19岁不等，他们每年在学校里要呆上10个月时间。在校期间，他们面临的同化教育主要由宗教灌输和强迫劳动构成。学生们每天上半天课，剩下半天则进行所谓职业技能训练，包括针对男孩的铁匠、木工或机械训练和针对女孩的缝纫、烹饪和其他家务训练。通过切断学生与其文化传统的联系，寄宿学校试图在毕业时将他们转变成可塑性强的雇佣劳动者。"
dsk_gbr.36.f:0 "根据《印第安人法》实施的原住民寄宿学校制度的主要目的是割裂原住民与其文化与社会的联系，塑造其对欧洲文化传统的认同，以此将他们同化并纳入主流白人社会。寄宿学校内禁止任何原住民文化活动，不允许儿童讲母语。\n\n寄宿学校设在保留地外，这使儿童被迫与家人分离。为了完成这项强制教育任务，儿童往往由印第安事务官或警察从家中强行带走（《印第安人法》赋予印第安事务部将儿童从家中带走的权力）。原住民儿童的父母往往强烈反对学校这种“咄咄逼人的同化做法”，并称这些学校为“对孩子们来说极其危险的地方”。事实也的确如此，许多寄宿学校卫生状况堪忧、食物匮乏、医疗服务不足，“疾病和死亡是无处不在的危险”"
dsk_gbr.36.a:0 "我们的手上沾着他们的鲜血"

dsk_gbr.37.t:0 "驱赶印第安人"
dsk_gbr.37.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]当局通过军事镇压、法律欺诈与生态破坏，实施#red 系统性种族清洗#!，将原住民从传统领地驱赶至贫瘠保留地，构建#bold "白人加拿大"#!的殖民蓝图。"
dsk_gbr.37.f:0 "美国独立战争后，4万#bold 效忠派英裔移民#!涌入上加拿大，6个易洛魁部族被剥夺#bold 500万英亩#!五大湖区土地，强制迁至#red 格兰德河保留地#!。\n\n1850年代海狸种群灭绝后，依赖毛皮经济的克里族被#bold 哈德逊湾公司#!切断物资供应，导致#red 饥荒性迁徙#!至北方冻原。"
dsk_gbr.37.a:0 "用刺刀逼迫他们迁徙"

dsk_gbr.39.t:0 "《印第安法》"
dsk_gbr.39.d:0 "1876年《印第安法》第32条，禁止印第安人保留地外#bold 狩猎捕鱼#!，平原克里族在#red 野牛灭绝#!（1889年）后被迫签署#bold 条约6号#!放弃草原领地"
dsk_gbr.39.f:0 "伪善的道德姿态和表面的物质补偿不足以使原住民与他们被夺走的一切和解。只要原住民的条约权利继续被践踏、资本继续从他们身上榨取剩余价值、资源继续被从他们的土地上掠夺时，“和解”只可能是障眼法。原住民发动的斗争运动需要与广泛的劳工运动结成同盟，将反压迫与反剥削结合起来。"
dsk_gbr.39.a:0 "条约就是条约，杀死你们的不是我而是条约"

dsk_gbr.40.t:0 "“爱国者”战争"
dsk_gbr.40.d:0 "当[SCOPE.sCountry('que_scope').GetName]的消息传来时，[SCOPE.sCountry('ont_scope').GetName]也立刻响应。12月4日，多伦多附近的激进派发动起义。"
dsk_gbr.40.f:0 "7日，正规军发动了起义军盘踞的蒙哥马利酒馆的总攻。\n\n14日，残存的起义军向政府军发动了最后的进攻"
dsk_gbr.40.a:0 "彻底改变加拿大命运的时刻，即将到来。"

dsk_gbr.41.t:0 "“卡罗林号”事件"
dsk_gbr.41.d:0 "起义过程中，几百个叛乱分子占据了位于加拿大境内尼加拉河中的海军岛，并雇佣美国籍船舶“卡罗林号”运输武器到该岛"
dsk_gbr.41.f:0 "[SCOPE.sCountry('gbr_scope').GetName]当局获悉这一情况后，立即派遣一支军队渡河进入[SCOPE.sCountry('usa_scope').GetName]斯洛赛港，捕获了“卡罗林号”，夺去船上的武器，并将该船烧毁。在逮捕“卡罗林号”的过程中，有两名美国人死亡，还有几个人受伤。美国政府得知此事后抗议英国侵犯了其主权。"
dsk_gbr.41.a:0 "我们会向[SCOPE.sCountry('usa_scope').GetName]赔礼道歉"
dsk_gbr.41.b:0 "是[SCOPE.sCountry('gbr_scope').GetName]干的，与我无关"

dsk_gbr.42.t:0 "加拿大独立宣言"
dsk_gbr.42.d:0 "在魁北克所有的车辆牌照下面镌刻着“Je·me·souviens”, 意思是“我记得”。1883年，这几个字首次由建筑师Eugène-Étienne·Taché刻在魁北克省议会大厦入口处的省徽下面。Taché的父亲是一位爱国者党人，参加了1837年的起义。他希望能以此唤起人们的记忆：我没有忘记，将永远不会忘记，我的血统，传统，和所有过去的记忆。"
dsk_gbr.42.f:0 "“今天，我们不再是[SCOPE.sCountry('gbr_scope').GetName]殖民地的子民，[SCOPE.sCulture('franco_canadian').GetName]的众同胞们，团结起来，像60年前我们的南方邻居一样为打破殖民桎梏而战！\n\n我们不再效忠于任何人的领主，任何人的国王，任何人的独裁者。我们生在这片土地，我们饱含激情和爱站在一起，而我们一起追寻于一个共同的理念，那就是人人生而平等！”"
dsk_gbr.42.a:0 "万岁，加拿大！万岁，[SCOPE.GetRootScope.GetCountry.GetName]！"



je_british_lower_canada_rebellion:0 "下加拿大危机"
je_british_lower_canada_rebellion_reason:0 "随着加拿大经济的不断发展，加拿大本地资产阶级和农场主需要有人来代表他们，捍卫他们的利益。与之相对应的，便是英国在北美各殖民地统治机构的改革。\n\n1820年代到1830年年代的议会改革运动，在其中扮演重要角色的，便是[SCOPE.sCharacter('can_scope').GetLastName]与#yellow 威廉·里昂·麦肯齐#!。他们分别来自[SCOPE.sCountry('que_scope').GetName]和[SCOPE.sCountry('ont_scope').GetName]。\n\n当[SCOPE.sCharacter('can_scope').GetLastName]在1815年成为下加拿大议会议长时，他还是个温和的改革分子，但随着时间的推移，他越来越激进。下加拿大议会在他的领导下，不断与英国殖民行政当局斗争。\n\n而#yellow 威廉·里昂·麦肯齐#!原来则是一个报人，主办报纸宣传议会改革。他曾四次当选上加拿大的议员，却四次被褫夺议员席位，可以说是屡败屡战从政。\n\n尽管上下加拿大议会分别出台《17点建议》和《92条决议案》，要求全面赋予殖民地选举权，但[SCOPE.sCountry('gbr_scope').GetName]当局却粗暴地拒绝了改革派的建议。\n\n1837年，一场经济危机从[SCOPE.sCountry('usa_scope').GetName]、[SCOPE.sCountry('gbr_scope').GetName]起源，与它们关系密切的#v 加拿大#!，工业和农业双双受到影响。农民和工厂主们开始酝酿着骚动。"

par_war_alternative.2.t:0 "巴拉圭联盟"
par_war_alternative.2.d:0 "巴拉圭寻求联盟对抗阿根廷"
par_war_alternative.2.f:0 "在我们与巴拉圭的谈判，以解决乌拉圭危机之后，他们接近我们并提出结盟，以征服阿根廷领土。作为回报，我们将获得乌拉圭作为附庸国和强大的盟友。"

par_war_alternative.2.a:0 "锡斯普拉蒂纳一直属于巴西"
par_war_alternative.2.b:0 "我们不信任他们的意图。拒绝！"


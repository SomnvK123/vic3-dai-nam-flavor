dsk_gbr.58.t:0 "帝国会议顺利召开" 
dsk_gbr.58.d:0 "威斯敏斯特宫的水晶吊灯下，#bold 六个自治领的印章#!正在#red 《贝尔福宣言》#!羊皮纸上投下阴影。[SCOPE.sCountry('gbr_subject_4').GetName]总督的#bold 孔雀羽饰#!扫过南非代表手中的金伯利钻石样本\n[SCOPE.sCountry('gbr_subject_3').GetName]总理的雪茄灰烬落在#red 太平洋铁路股权转让书#!上\n[SCOPE.sCountry('gbr_subject_1').GetName]羊毛大亨的怀表链缠住了#bold 新加坡海军基地#!的经纬度坐标"  
dsk_gbr.58.f:0 "英帝国，是一个“有着相同血脉、语言、宗教和法律的民族”，分散在“无边无际的空间”中的联合起来的国家。这正是19世纪后半段英国知识分子对殖民的主流描述，即：英国的扩张是不列颠民族的扩散。“扩散”意味着，它是由内卷的本土流向未经彻底开拓的土地的，是一个自然而然的过程。我们去殖民，因为土地就在那里。于是我们也就不必奇怪为什么西利会这样形容英国的扩张了：“我们似乎是在一时的心不在焉中征服了半个世界。”换言之，殖民者的扩散未必意味着一个中央政府治理的扩张。"  

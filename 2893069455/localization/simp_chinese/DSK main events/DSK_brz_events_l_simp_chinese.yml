dsk_je_five_eyes:0 "五眼联盟"
dsk_je_five_eyes_reason:0 "#v [SCOPE.sCountry('usa_scope').GetName]、[SCOPE.sCountry('gbr_scope').GetName]、[SCOPE.sCountry('can_scope').GetName]、[SCOPE.sCountry('ast_scope').GetName]、[SCOPE.sCountry('nzl_scope').GetName]为捍卫共同价值观与反对恐怖主义，故签订此条约#!\n\n让所有#v 盎格鲁-撒克逊#!的子民听见——这绝不仅是利益的合约，而是命运共同体的誓言！ 就像#yellow 肯特郡#!的橡树与#yellow 弗吉尼亚#!的红杉在地下盘根错节，我们的[concept_alliance]亦将深植于文化与信念的岩层！我们同是海洋养育的民族——旧大陆的守夜人，新世界的开拓者！让我们的舰队守护每一片波涛下的电缆，让我们的语言成为#V 文明世界#!的标准语，让我们的精神化为照亮人类暗夜的不灭灯塔！\n\n此刻，让世界见证这历史性的盟誓：一个在血脉与意志上永不分裂的#v 盎格鲁-撒克逊海洋[concept_alliance]#!已经崛起！无论风暴来自欧洲或世界的任何角落，我们共同举起自由的火炬、创新的圣剑与公正的坚盾！这信念如星辰闪耀：团结的#v 盎格鲁-撒克逊#!民族所捍卫的文明，必将如北极之星，永恒指引人类航向！"


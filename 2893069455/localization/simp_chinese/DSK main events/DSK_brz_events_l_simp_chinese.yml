coffe_and_milk.1.d:0 "巴西的政治腐败"
coffe_and_milk.1.f:0 "这种被称为“军阀统治”的制度，现在被称为老板体制，其中官职的控制集中在一个被称为“军阀”的地方支配寡头手中，特别是在巴西的新共和国下，他们将提供好处以换取忠诚。"

coffe_and_milk.1.a:0 "我们将支持咖啡生产者"
coffe_and_milk.1.b:0 "我们将支持牛奶产品"


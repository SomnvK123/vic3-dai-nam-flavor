 jiawu_war_events.8.t:0 "美日安保条约"
 jiawu_war_events.8.d:0 "“日本承认美国在日本驻军；驻日美军为维护远东和平与保障日本的安全，应日本请求可以用武力镇压内乱和暴动以及对付外来的武力攻击。”"
 jiawu_war_events.8.f:0 "“这里是我出生和长大的地方，军事基地一直在那里，我对外国人没什么排斥的感觉，城市里有别的国家的人也没什么好奇怪的。”\n\n“我很钦佩日本和美利坚的联盟，没有什么比曾经的死敌能成为更好的盟友和朋友，愿日本和美利坚共同走向遥远的未来，永远的盟友和朋友。”\n\n“美利坚天兵会保护好日本人民。”"
 jiawu_war_events.8.a:0 "[SCOPE.sCountry('japan_scope').GetName]:への変わらぬ忠誠を誓う!충성！"




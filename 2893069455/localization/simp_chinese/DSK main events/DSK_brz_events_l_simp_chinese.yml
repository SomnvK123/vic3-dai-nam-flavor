# 移民公司 - 殖民人口工程  
je_dsk_canada_immigrant:0 "殖民人口工程"  
je_dsk_canada_immigrant_reason:0 "当利物浦移民局的铜版宣传画将马尼托巴草原渲染成流淌蜜糖的应许之地时，苏格兰高地佃农典当祖传的银质怀表换取横贯大陆铁路的木质车票，他们的粗呢外套口袋裡塞着印有《1872年自治领土地法》第12款的传单——『任何年满21岁之男性移民，宣誓效忠女王后可在红河谷圈占160英亩矩形地，惟需承诺三年内伐尽领地内80%白杨林以证文明开化』；而克里族巫医的麋鹿皮囊中，保存着被殖民测绘队铁链仪碾碎的野牛颅骨碎片，那些曾用于划定部族猎场的星辰图腾正被重新编码为渥太华土地局的地契编号。"  

# 伐木业 - 森林资本主义化  
je_dsk_canada_industry:0 "森林资本主义化"  
je_dsk_canada_industry_reason:0 "1824年《皇家木材特许状》的羊皮纸裂缝中渗出渥太华河谷百年松树的琥珀泪，伐木工用刻着HBC公司纹章的双柄横锯将米克马克族祭祀用的神木图腾柱切割成符合大英海军标准的桅杆坯料；当条约6号签署者用鹿血在桦树皮上绘制狩猎禁区时，殖民林务官正依据《1883年联邦林业法典》用黄铜六分仪测算原始森林的『可持续砍伐速率』——每锯倒一棵千年铁杉便向蒙特利尔银行存入5磅松脂作为生态补偿金，而原住民药草师采集的止血苔藓正随着倒下的巨树年轮永远干涸。"  

# 矿业 - 地下殖民主义  
je_dsk_canada_mining:0 "地下黄金主义 "  
je_dsk_canada_mining_reason:0 "1886年克朗代克河床的砂金在维多利亚女王加冕纪念币的浮雕上灼烧出凹痕，华人矿工用缠满棉布的残指在《1859年采矿权优先法案》的空白处按下血指模，他们的尸骨与石英矿脉共同浇筑成加拿大太平洋铁路的枕木；当克里族巫医在圣山岩画前祈求大地愈合时，蒙特利尔证券交易所的铜钟正将安大略镍矿的放射性尘埃换算成每股3.5便士的股息，而因纽特人的海象牙雕刻刀已被殖民地质学家的金刚钻头取代——整个劳伦琴地盾的古老岩层正在氰化物选矿法的化学反应中蜕变成女王皇冠上的铂金镶边。"  

# 渔业 - 海洋资源掠夺  
je_dsk_canada_fishery:0 "海洋资源掠夺"  
je_dsk_canada_fishery_reason:0 "当圣约翰斯腌鱼厂女工皲裂的双手在《1893年北大西洋渔业公约》的经纬网格上编织鳕鱼干时，米克马克族的桦树皮渔舟正被蒸汽拖网船的螺旋桨绞成漂浮的桅杆碎片；纽芬兰浅滩的产卵场在伦敦渔业公司的股票曲线图上萎缩成虚线，而原住民长老用海豹肠线记录的潮汐周期表已被殖民海洋学家铅垂测深仪的数据覆盖——每捕捞一吨大西洋鲱鱼，联邦渔业局便向天主教堂捐赠50加仑鲸油用于涂抹『文明开化』的圣膏，却任由座头鲸的哀鸣在钢铁渔网的绞杀中永远沉寂。"  

# 奢侈品 - 殖民美学贸易  
je_dsk_canada_Luxury:0 "奢侈品美学贸易"  
je_dsk_canada_Luxury_reason:0 "1845年巴黎博览会上加拿大海狸毡帽的展柜玻璃倒映着哈德逊湾公司猩红制服包裹的贸易史——克里族猎人用五十张幼兽皮换取的铜制火药筒正将部族传承千年的轮猎制生态智慧射向资本化的标靶；当伦敦拍卖行的天鹅绒礼盒封装着用《1763年皇家公告》羊皮纸碎片托底的北极狐裘时，原住民巫医的草药囊已被殖民植物学家的标本夹替换——每一株止血紫菀的拉丁学名背后都埋葬着三句失传的阿尔冈昆语祷词，而蒙特利尔港运输的早已不是毛皮，是整个大陆被无菌化处理的野性基因。"  


# 黄金血管的溃疡
dsk_gbr.62.t:0 "来自[SCOPE.sCountry('western_country').GetName]的走私者"
dsk_gbr.62.d:0 "当海关署的铜质天平开始向黑夜倾斜，月光在密西西比河面编织出第三条航道。\n\n地下驳船的吃水线刻满暗语，得克萨斯骑警的徽章在威士忌酒液中锈蚀。芝加哥交易所的黄金报价单上，每盎司数字都寄生着三克可卡因粉末。\n\n蒙特雷的烟草仓库用松脂味掩盖鸦片酊的甜腥，底特律的汽车零件箱里，黄铜子弹与活塞环以摩尔斯电码共鸣。圣迭戈警长的怀表永远停在丑闻曝光的时刻，而新奥尔良妓院的暗门后，整箱联邦债券正在吸食港口的潮气。"


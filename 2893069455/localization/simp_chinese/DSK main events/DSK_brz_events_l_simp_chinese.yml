dsk_gbr.59.t:0 "《英属北美法案》"  
dsk_gbr.59.d:0 "根据1864年夏洛特敦会议与魁北克会议决议，[SCOPE.sCountry('gbr_scope').GetName]议会于#bold 1867年3月29日#!通过《英属北美法案》。该法案将#red 上加拿大（安大略）、下加拿大（魁北克）、新斯科舍与新不伦瑞克#!合并为联邦制自治领，赋予其处理内政、税收与贸易的有限自治权，但外交与国防仍由#bold 伦敦殖民部#!直接管辖。"  
dsk_gbr.59.f:0 "以[SCOPE.sCharacter('ruler_scope').GetFirstName]之名批准此法案:\n\n新斯科舍、新不伦瑞克、魁北克、哥伦比亚、育空领地和安大略，从大洋到大洋再到大洋！"  
dsk_gbr.59.a:0 "关于这个新国家的国名，我建议叫做#red 加拿大王国#!" 
dsk_gbr.59.b:0 "新不伦瑞克长官莱#yellow 昂纳德·蒂利#!建议叫做#red 加拿大自治领#!，这个名字来自《圣经》的《圣诗72》：“他的领地将从大洋到大洋。”" 


dsk_je_gbr_union:0 "英帝国联邦"
dsk_je_gbr_union_reason:0 "#v 当前共有英联邦成员国：[JournalEntry.CalcCurrentGoalValue|V|0]#!\n\n[SCOPE.sCountry('gbr_scope').GetName]的#yellow 伦敦#!的大本钟铜钟撞响十一声，#blue 威斯敏斯特宫#!的长桌上铺开镶金边的#bold 《帝国协约》#!，[SCOPE.sCountry('bic_scope').GetName]檀香木盒里封着#red 孟买管区的茶叶税表#!，而[SCOPE.sCountry('saf_scope').GetName]代表将一粒#red 未经切割的金伯利钻石原石#!按在桌角——比女王冠冕上那颗更粗粝，却闪烁着#v 尖锐的主权锋芒#!。\n\n[SCOPE.sCountry('bic_scope').GetName]的#yellow 埃格蒙特伯爵#!展开孔雀尾羽檀香木扇，扇骨间夹着#red 孟加拉农民抗议地租的密报#!；[SCOPE.sCountry('aut_scope').GetName][SCOPE.sCountry('nsw_scope').GetName]总督的牛皮公文袋渗出#blue 南十字星农场的羊毛契约#!，澳洲红土正从封蜡裂纹间簌簌抖落；\n\n#yellow 新西兰军需官#!沉默地展开一幅刺青纹样地图，#o 北岛的毛利酋长#!用鲸骨烟斗在云端画出#red 抵抗的图腾#!。\n\n当[SCOPE.sCountry('hbc_scope').GetName][SCOPE.sCountry('can_scope').GetName]总督抽出镀银雪茄剪时，匣中滑出的却是两份#blue 《双语宪法》#!折页——英法文字如#v 利剑交叠#!，法裔议员的羽毛笔尖穿透了1840年的#bold 《联合法案》#!。\n\n午后的阳光爬上锡兰红茶氤氲的雾气，照见旁遮普木雕镜框里#red 反殖民集会的人群剪影#!，而纽芬兰代表团未拆封的#blue 鳕鱼干请愿书#!已在盐霜中凝固成一片#o 沉默的大西洋#!。\n\n此刻，悬挂于穹顶的#yellow 翡翠帝国地图#!悄然褪色，唯有代表自治领的铜钉正从#blue 温哥华到开普敦#!逐颗锈蚀，将#red 维多利亚时代最后的金漆#!蛀成十九世纪的尘埃"

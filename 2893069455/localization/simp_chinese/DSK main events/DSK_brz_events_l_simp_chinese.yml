# 加拿大联邦议会进程机制说明
je_Canadian_Confederation_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]联邦议会位于渥太华的议会大厦。依照#bold 1867年《英属北美法案》#!，各省保留教育与自然资源管辖权。\n联邦体系在#red 英法二元文化#!与#bold 原住民条约#!间艰难平衡，通过铁路网络与移民政策塑造国家认同。\n\n#yellow 联邦派#!会#tooltippable;tooltip:[Country.GetTooltipTag],je_Canadian_Confederation_pos #v 推进#!#!联邦化进程，而#yellow 分离主义#!会#tooltippable;tooltip:[Country.GetTooltipTag],je_Canadian_Confederation_neg #v 阻碍#!#!国家整合。"

# 正向推动因素（自由派/联邦派）
je_Canadian_Confederation_pos:0 "以下条件将 #bold 推进#!联邦化：\n• 实施#yellow 《太平洋铁路法案》#!（1881年契约，#green +3#!）\n• 签署#yellow 《编号土地条约》#!（1871-1921年，#green +2#!）\n• 通过#yellow 《自治领土地法案》#!（1872年宅地政策，#green +2#!）\n• 维持#yellow 英法双语制度#!（1867年宪法第133条，#green +1#!）\n• 完成#yellow 跨大陆电报工程#!（1885年竣工，#green +1#!）"

# 反向阻碍因素（保守派/分离主义）
je_Canadian_Confederation_neg:0 "以下条件将 #bold 阻碍#!联邦化：\n• 爆发#yellow 红河起义#!（1869年梅蒂斯抗争，#green -3#!）\n• 实施#yellow 《印第安法》#!（1876年同化政策，#green -2#!）\n• 新斯科舍#yellow 退出联邦运动#!（1868年约瑟夫·豪领导，#green -2#!）\n• 执行#yellow 《华人移民法案》#!（1885年人头税，#green -1#!）\n• 拒绝#yellow 北极主权主张#!（1903年阿拉斯加边界争端，#green -1#!）"


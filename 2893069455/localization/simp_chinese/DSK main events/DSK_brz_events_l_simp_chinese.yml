dsk_gbr.43.t:0 "组织皇家海军远洋军事演习"
dsk_gbr.43.d:0 "以[SCOPE.sCountry('gbr_scope').GetAdjective]为首的[concept_gbr_union]国家集结了#bold 60艘无畏舰#!横跨#red 朴茨茅斯至斯卡帕湾#!，模拟对#bold 威廉港公海舰队#!的封锁。演习将测试#red 新型13.5英寸舰炮#!在北海高海况下的齐射精度，并验证#bold 《海军战争条例》第12条#!的夜间鱼雷艇协同战术。"
dsk_gbr.43.f:0 "[SCOPE.sCountry('gbr_scope').GetName]本土舰队集结#red 28艘无畏舰#!（含猎户座级4艘、铁公爵级6艘），[SCOPE.sCountry('gbr_subject_3').GetName]太平洋舰队提供#bold 3艘装甲巡洋舰#!（HMCS·Rainbow级），[SCOPE.sCountry('gbr_subject_1').GetName]则派出#red 1个战列巡洋舰中队#!（HMAS·Australia领衔）。[SCOPE.sCountry('gbr_subject_4').GetName]印度洋护航队抽调#bold 12艘殖民地炮舰#!（驻新加坡第5分舰队），彰显#red 日不落帝国#!七海制霸格局。"
dsk_gbr.43.a:0 "#red 大英帝国#!庞大的舰队将会在#v 大西洋#!进行演练"
dsk_gbr.43.b:0 "#red 大英帝国#!庞大的舰队将会在#v 地中海#!进行演练"
dsk_gbr.43.c:0 "#red 大英帝国#!庞大的舰队将会在#v 北太平洋#!进行演练"
dsk_gbr.43.g:0 "#red 大英帝国#!庞大的舰队将会在#v 印度洋#!进行演练"

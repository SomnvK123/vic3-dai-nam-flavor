dsk_gbr.44.d:0 "[SCOPE.sCountry('western_country').GetName]提议#red 帝国联防海上操演#!（《帝国防务备忘录》）"
dsk_gbr.44.f:0 "[SCOPE.sCountry('gbr_subject_1').GetName]要求检验#bold 悉尼战略港#!对#red 太平洋舰队#!的支撑能力，提议调集#bold HMASAustralia号#!战列巡洋舰与#red 新西兰渔业巡逻舰#!进行反潜联训，模拟日本对#bold 新几内亚托管地#!的威胁\n\n[SCOPE.sCountry('gbr_subject_3').GetName]援引#bold 《海军服务法》#!，要求皇家海军评估#red 哈利法克斯要塞#!对#bold 大西洋护航线#!的覆盖效率，提议动用#red 5艘驱逐舰#!演练冰岛海域破交战\n\n[SCOPE.sCountry('gbr_subject_5').GetName]以#bold 开普航线安全#!为由，要求测试#red 西蒙斯敦海军基地#!对印度洋舰队的补给能力，计划用#bold 2艘装甲巡洋舰#!模拟德属东非舰队的突袭\n\n[SCOPE.sCountry('gbr_subject_4').GetName]当局申请动用#red 孟买造船厂#!新建炮舰，在#bold 安达曼海#!举行反走私演习，但需#red 驻印远东舰队#!提供3艘侦察巡洋舰支援"
dsk_gbr.44.a:0 "应允"
dsk_gbr.44.b:0 "我们现在有要事在身"



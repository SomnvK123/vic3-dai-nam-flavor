 jiawu_war_events.6.t:0 "[SCOPE.sCountry('korea_scope').GetName]开化党政变"
 jiawu_war_events.6.d:0 "当时，外务卿井上馨正在归省中，由宫内卿伊藤博文代管外务，伊藤得知竹添进一郎的甲、乙两案并力主甲案的消息后，“令次官发电止之……适电文到公使手，京城之事变已起。”"
 jiawu_war_events.6.f:0 "接到[SCOPE.sCountry('japan_scope').GetName]政府指令的竹添进一郎向开化党人宣布撤兵。金玉均听到后大惊，连忙请求暂缓3日撤军，并借款300万元。"
 jiawu_war_events.6.a:0 "必须支持[SCOPE.sCountry('korea_scope').GetName]开化党政变。"
 jiawu_war_events.6.b:0 "[SCOPE.sCountry('japan_scope').GetName]还不是[SCOPE.sCountry('china_scope').GetName]的对手。"






dsk_gbr.45.f:0 "[SCOPE.sCountry('gbr_scope').GetName]本土舰队集结#red 28艘无畏舰#!（含猎户座级4艘、铁公爵级6艘），[SCOPE.sCountry('gbr_subject_3').GetName]太平洋舰队提供#bold 3艘装甲巡洋舰#!（HMCS·Rainbow级），[SCOPE.sCountry('gbr_subject_1').GetName]则派出#red 1个战列巡洋舰中队#!（HMAS·Australia领衔）。[SCOPE.sCountry('gbr_subject_4').GetName]印度洋护航队抽调#bold 12艘殖民地炮舰#!（驻新加坡第5分舰队）"

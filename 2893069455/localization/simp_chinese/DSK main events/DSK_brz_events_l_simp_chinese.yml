santos_dumont.2.t:0 "手腕表的普及"
santos_dumont.2.d:0 "卡地亚和桑托斯·杜蒙使手腕表变得流行"
santos_dumont.2.f:0 "桑托斯告诉卡地亚：“在飞行过程中很难检查我的时间，我想看看是否能打破我的记录...但我不能看我的怀表，因为我必须用两只手握住方向盘。”路易斯考虑了一下，想出了把小表绑在手腕上的主意，这样桑托斯在飞行时就可以看到它了。这次有趣的邂逅激发了卡地亚为男性制造公司的第一款手腕表的创意。"

santos_dumont.2.a:0 "让我们利用这个势头来推动我们的电子工厂。"
santos_dumont.2.b:0 "在上流社会中传播这个消息，他们肯定会喜欢的"


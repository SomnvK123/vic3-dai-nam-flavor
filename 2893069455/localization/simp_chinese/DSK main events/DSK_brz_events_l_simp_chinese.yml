dsk_gbr.64.t:0 "瓦解敌国战争情绪"
dsk_gbr.64.d:0 "我们的情报员建议我们在与[SCOPE.sCountry('enemy_country').GetName]的[concept_war]中煽动反战情绪！"
dsk_gbr.64.f:0 "‌#v 五眼联盟#!在军事演习、武器研发等领域共享数据，强化战略协同‌。美国主导技术研发与亚洲、非洲监控，英国协调全球人工情报网络，其他三国提供区域支持‌。当#v 量子纠缠的和平宣言#!在[SCOPE.sCountry('enemy_country').GetName]的军用卫星间共振，他们的战争时间线已坍缩成薛定谔的猫箱"
dsk_gbr.64.a:0 "好，就这么做吧"
dsk_gbr.64.b:0 "容我三思"
sub_je_five_eyes_bar_20_tt:0 "消耗#o 五眼联盟进度条#!#v 20#!"

dsk_gbr.65.t:0 "策划敌国颜色[concept_revolution]"
dsk_gbr.65.d:0 "我们的情报员建议在我们的[concept_rivalry][SCOPE.sCountry('enemy_country').GetName]策划颜色[concept_revolution]以瓦解他们的政府统治！"
dsk_gbr.65.f:0 "当我们的神经突触在[SCOPE.sCountry('enemy_country').GetName]的数据流中绽放#v 量子玫瑰#!，[concept_revolution]的算法迷宫已启动#red 认知崩塌协议#!"
dsk_gbr.65.a:0 "好，就这么做吧"


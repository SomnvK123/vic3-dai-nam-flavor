l_simp_chinese:

#sino事件###################################################################################################################################################################################

sino_event.1.t:0 "《马关条约》"
sino_event.1.d:0 "此战之役，吾华与东瀛交兵海上，不期而败，举国震惊，悲愤填膺。吾辈闻之，心如刀绞，泪如雨下，痛定思痛，悲愤之情，难以言表。"
sino_event.1.f:0 "昔日我[concept_dsk_china]，泱泱大国，威震四方，海内海外，皆仰我华夏之文明。然此战一役，吾华海军，全军覆没，将士捐躯，百姓涂炭，山河破碎，国威扫地。此乃吾华之痛，民族之辱，吾辈岂能坐视不理？\n\n夫甲午之败，非战之罪，实乃朝廷腐败，国力衰弱所致。吾辈当以此为鉴，奋发图强，励精图治，以雪国耻，振兴[concept_dsk_china]。\n\n然悲愤之余，吾辈亦当深思熟虑，以史为鉴，自强不息。愿吾华子孙，铭记甲午之耻，勿忘国耻，振兴[concept_dsk_china]，共筑民族复兴之伟业。"
sino_event.1.a:0 "愿[concept_dsk_china]子孙，永志不忘今日之苦难。"

sino_event.2.t:0 "《汉城条约》"
sino_event.2.d:0 "[SCOPE.sCountry('jap_scope').GetAdjective]谨认[SCOPE.sCountry('kor_scope').GetAdjective]为[SCOPE.sCountry('chi_scope').GetAdjective]藩属，嗣后遣使修贡、册封告祭等礼，悉遵《中朝商民水陆贸易章程》。"
sino_event.2.f:0 "此系贵国全权大臣伊藤阁下手署铁契。今闻九州熊本有流言鼓噪，谓「征韩未竟其功」，此等悖逆之辞，实伤两国邦谊。\n\n昔贵国岩仓使团访清，李鸿章中堂赠「同文同轨」匾额，今观贵邦所为，竟似遗忘圣教。倘能遵约守分，则横滨开埠租界当容贵商建馆；若仍纵兵嚣讼，恐我湘淮劲旅饮马富士之日，东瀛三岛不复得闻尺玉焚香矣！"
sino_event.2.a:0 "书到如律，鹄候回文​"

sino_event.3.t:0 "来自我们驻[SCOPE.sCountry('chi_scope').GetAdjective]大使馆的消息！"
sino_event.3.d:0 "[concept_battle_of_east_asia][SCOPE.sCountry('chi_scope').GetAdjective]失败！"
sino_event.3.f:0 "[SCOPE.sCountry('jap_scope').GetAdjective]对[SCOPE.sCountry('chi_scope').GetAdjective]发动了突袭战争，[SCOPE.sCountry('chi_scope').GetAdjective]海军被[SCOPE.sCountry('jap_scope').GetAdjective]全歼，日本还在[concept_dsk_china]大地上制造了骇人听闻的大屠杀！中国与日本签订丧权辱国的《马关条约》！东方巨龙再也不能傲视东亚！"
sino_event.3.a:0 "真是东亚病夫！连[SCOPE.sCountry('jap_scope').GetAdjective]都能拿下[SCOPE.sCountry('chi_scope').GetAdjective]，那我们还等什么？"
sino_event.3.b:0 "有些可惜...但我们还是会不会停止寻求和[SCOPE.sCountry('chi_scope').GetAdjective]的合作！"

sino_event.4.t:0 "来自英法联军的威胁"
sino_event.4.d:0 "[SCOPE.sCountry('gbr_scope').GetName]和[SCOPE.sCountry('fra_scope').GetName]的威胁！"
sino_event.4.f:0 "[SCOPE.sCountry('gbr_scope').GetName]和借口称我们的广东水师在广州黄埔捕捉了中国船“亚罗”号上的海盗，而[SCOPE.sCountry('fra_scope').GetName]借口法籍天主教神甫马赖在广西西林被杀。\n\n[SCOPE.sCountry('fra_scope').GetName]对我们下了最后通牒，如果我们不进一步开放市场并赔偿损失，他们会对我们诉诸武力。"
sino_event.4.a:0 "我们不会退缩！"

sino_event.5.t:0 "来自我们驻[SCOPE.sCountry('chi_scope').GetAdjective]大使馆的消息！"
sino_event.5.d:0 "英法联军对[SCOPE.sCountry('chi_scope').GetName]诉加各种威胁"
sino_event.5.f:0 "[SCOPE.sCountry('gbr_scope').GetName]称他们的中国船“亚罗”号被中国广东水师袭击，[SCOPE.sCountry('fra_scope').GetName]称法籍天主教神甫马赖在广西西林被杀，英法联军对[SCOPE.sCountry('chi_scope').GetAdjective]下了最后通牒，如果中国不进一步开放市场并赔偿损失，他们就会对中国诉诸武力。"
sino_event.5.a:0 "这是[SCOPE.sCountry('chi_scope').GetAdjective]人自己的事。"

sino_event.6.t:0 "保卫越南！"
sino_event.6.d:0 "[SCOPE.sCountry('fra_scope').GetAdjective]命交趾支那海军司令利维耶，尝试第二次侵犯[SCOPE.sCountry('dai_scope').GetAdjective]北部。"
sino_event.6.f:0 "[SCOPE.sCountry('dai_scope').GetAdjective]已经向我国透露[SCOPE.sCountry('fra_scope').GetAdjective]军队在顺化附近海域游荡的情报，周边的战争氛围愈演愈烈，很有可能敌人会发动战争！"
sino_event.6.a:0 "我们会履行作为[concept_overlord]的职责，[SCOPE.sCountry('fra_scope').GetAdjective]如果真要入侵，我们必将他们击退。"

sino_event.7.t:0 "来自我们驻[SCOPE.sCountry('chi_scope').GetAdjective]大使馆的消息！"
sino_event.7.d:0 "[SCOPE.sCountry('fra_scope').GetName]在印度支那的利益与[SCOPE.sCountry('chi_scope').GetName]爆发激烈冲突"
sino_event.7.f:0 "[SCOPE.sCountry('fra_scope').GetName]妄图吞并越南，[SCOPE.sCountry('chi_scope').GetAdjective]政府对此表达了强烈的愤慨，中国政府表示如果法国不撤出在[SCOPE.sCountry('dai_scope').GetAdjective]的军队，那么他们不会坐视不管，战争一触即发！"
sino_event.7.a:0 "这是[SCOPE.sCountry('chi_scope').GetAdjective]人自己的事。"

sino_event.8.t:0 "戊戌变法"
sino_event.8.d:0 "以#yellow 康有为#!为代表的一些知识分子要求改革"
sino_event.8.f:0 "改革政府机构，裁撤冗官，任用维新人士；鼓励私人兴办工矿企业；开办新式学堂吸引人才，翻译西方书籍，传播新思想；创办报刊，开放言论；训练新式陆军海军，科举考试废除八股文，取消多余的衙门和无用的官职！"
sino_event.8.a:0 "事到如今，我们必须自己拯救自己!"

sino_event.9.t:0 "根据我们在中国的外交大使来信！"
sino_event.9.d:0 "[SCOPE.sCountry('chi_scope').GetName]虎门销烟事件"
sino_event.9.f:0 "铁头老鼠，狡猾的鸦片走私头目，畏惧天朝的愤怒，已经回到烟雾之地—林则徐"
sino_event.9.a:0 "[SCOPE.sCountry('gbr_scope').GetName]不会就此罢休的。

sino_event.10.t:0 "绝望的同盟"
sino_event.10.d:0 "我们不应该再计较历史上的恩怨，现在，[SCOPE.sCountry('chi_scope').GetAdjective]和[SCOPE.sCountry('jap_scope').GetAdjective]已经完全站在了一起，我们双方已建立平等的关系，我们有着比以往任何时候都更加深刻的友谊"
sino_event.10.f:0 "中日两国，2000年以来，文字相同，语言相通，伦理相通，中日两国，自古相邻，海天一色，共享东瀛之风。昔年或有龃龉，然时过境迁，今日愿结同盟，共谋和平发展之道！"
sino_event.10.a:0 "愿中日两国，如兄弟般携手，共赴未来之路，共创辉煌之业。"

sino_event.11.t:0 "来自我们驻[SCOPE.sCountry('jap_scope').GetAdjective]使节的消息"
sino_event.11.d:0 "[SCOPE.sCountry('jap_scope').GetAdjective]的倒幕运动席卷日本全国"
sino_event.11.f:0 "倒幕运动是19世纪中期，由日本的中下级武士、高利贷商人、资本家、新兴地主和西南诸藩的大名组成倒幕派，在人民群众的支持下，武装推翻封建幕府统治的一场资产阶级革命运动。"
sino_event.11.a:0 "尊王攘夷，大政奉还，新日本将会取代旧日本"

sino_event.12.t:0 "英日同盟已建立"
sino_event.12.d:0 "英日同盟已建立"
sino_event.12.f:0 "[SCOPE.sCountry('gbr_scope').GetName]和[SCOPE.sCountry('jap_scope').GetName]为维护其各自在[SCOPE.sCountry('chi_scope').GetAdjective]与朝鲜半岛的利益而结成的互助同盟，旨在反对俄国在远东扩张。英国若和日本合作，则英国此后在远东的地位举足轻重，日英两国若能合作，则日英两国可以统辖中国，可以维持远东的和平"
sino_event.12.a:0 "是针对谁？"

sino_event.13.t:0 "葛底斯堡演说"
sino_event.13.d:0 "[SCOPE.sCountry('usa_scope').GetName][Concept('concept_ruler', '$RULER_TITLE_PRESIDENT$')]发表《葛底斯堡演说》"
sino_event.13.f:0 "八十七年前，我们的先辈们在这个大陆上建立了一个全新的国家，它受孕于自由的理念，并献身于人人生而平等的理想。\n如今我们正在从事一场伟大的内战，以考验我们或任何一个受孕于自由并献身于上述理想的国家是否能够长久生存下去。现在，我们聚集在战争中的一个重要的战场上，我们来到这里，是要把这个战场土地的一部分奉献给那些为使这个国家能够生存下去而献出了自己宝贵生命的烈士们作为最后安息之所。\n我们这样做是完全应该而且是非常恰当的\n但是，从更广泛的意义上来说，不是我们奉献、圣化或神化了这块土地，而是那些活着的或者已经死去的、曾经在这里战斗过的英雄们使得这块土地成为神圣之土，其神圣远非我们的渺小之力可增减。世人不会注意，也不会记住我们在这里说过什么，但是他们永远无法忘记那些英雄们的行为。\n这更要求我们这些活着的人去继续那些英雄们所为之战斗的未尽事业。我们应该在这里把自己奉献于仍然留在我们面前的伟大任务，要从这些光荣的死者身上汲取更多的献身精神，来完成他们已经完全彻底为之献身的事业；我们要在这里下定最大的决心，不让这些死者白白牺牲，要使这个国家在上帝保佑下得到新生，要使这个民有、民治、民享的政府永世长存——[SCOPE.sCharacter('crisis_scope_2').GetLastName]"
sino_event.13.a:0 "这就是[SCOPE.sCountry('usa_scope').GetAdjective]——听[SCOPE.sCharacter('crisis_scope_2').GetLastName]说"


sino_event.14.t:0 "北[concept_germany_country]已建立"
sino_event.14.d:0 "北[concept_germany_country]已建立"
sino_event.14.f:0 "我们驻北德的大使为我们报告了一则消息：北德意志小国已完成统一。世界会记住这一刻，这是德意志民族空前团结的一刻！"
sino_event.14.a:0 "我们拭目以待"

sino_event.15.t:0 "日俄战争爆发"
sino_event.15.d:0 "[SCOPE.sCountry('jap_scope').GetName]和[SCOPE.sCountry('rus_scope').GetName]因为在远东的利益爆发激烈的冲突"
sino_event.15.f:0 "日俄战争是指1904年到1905年间，[SCOPE.sCountry('jap_scope').GetName]与[SCOPE.sCountry('rus_scope').GetName]为了争夺中国辽东半岛和朝鲜半岛的控制权，进而争夺亚洲及整个太平洋地区的霸权，而在中国东北的土地上进行的一场帝国主义列强之间战争！\n日俄战争是资本主义的世界体制过渡到帝国主义时代的一个阶段，日本经过战争跨入列强的行列，这次战争地区跨度极大，横跨整个西伯利亚，许多高科技发明被应用于战争。"
sino_event.15.a:0 "狗咬狗一嘴毛"

sino_event.16.t:0 "辛亥革命爆发"
sino_event.16.d:0 "辛亥革命爆发，清朝被推翻，[concept_roc]建立"
sino_event.16.f:0 "1911年夏天，湘、鄂、粤、川等省爆发保路运动，运动在四川省尤其激烈。9月25日，荣县独立，成为全[SCOPE.sCountry('chi_scope').GetAdjective]第一个脱离清王朝的政权，把保路运动推向高潮。10月10日晚，新军工程第八营的革命党人熊秉坤打响武昌起义的第一枪。\n汉阳、汉口的革命党人分别于10月11日夜、10月12日攻占汉阳和汉口。起义军掌控武汉三镇后，湖北军政府成立，黎元洪被推举为都督，改国号为[concept_dsk_china]民国。\n武昌起义胜利后短短两个月内，湖南、广东等十五个省纷纷宣布脱离清政府独立。"
sino_event.16.a:0 "我们将率先承认亚洲第一个民主共和国"
sino_event.16.b:0 "不承认这种有悖祖宗之法的国家"

sino_event.17.t:0 "日韩合并"
sino_event.17.d:0 "1910年8月22日，[SCOPE.sCountry('kor_scope').GetName]总理用与[SCOPE.sCountry('jap_scope').GetName]代表寺内正毅签订条约，规定[SCOPE.sCountry('kor_scope').GetName]将朝鲜半岛的主权永久让与[SCOPE.sCountry('jap_scope').GetAdjective]。\n\n但因内奸告密，条约被作废，日本政府决定诉诸武力！"
sino_event.17.f:0 "[SCOPE.sCountry('jap_scope').GetName]企图靠物理征服朝鲜半岛"
sino_event.17.a:0 "让日本人试试"

sino_event.18.t:0 "美西战争"
sino_event.18.d:0 "[SCOPE.sCountry('usa_scope').GetName]与[SCOPE.sCountry('spa_scope').GetName]的战争已经爆发"
sino_event.18.f:0 "[SCOPE.sCountry('usa_scope').GetName]想重新瓜分世界殖民地，但因力量有限，还无力同英法等国相抗衡，只有老朽的[SCOPE.sCountry('spa_scope').GetName]是个好目标。\n\n这时的[SCOPE.sCountry('spa_scope').GetAdjective]已是日薄西山，昔日的庞大帝国殖民地仅剩下#v 古巴#!、#v 波多黎各#!和亚洲的#v 菲律宾#!。此时，西班牙在加勒比海的殖民地古巴和波多黎各，位于美国家门口，具有重要的战略价值，自然资源丰富，美国对它们，特别是古巴，觊觎良久。\n\n美国决定首先拿西班牙开刀，夺取这几个西班牙殖民地，以便控制中美洲和加勒比地区，并取得向远东和亚洲扩张的基地。"
sino_event.18.a:0 "让美国人试试"

sino_event.19.t:0 "琉球不再"
sino_event.19.d:0 "我们没有帮助琉球复国，琉球已完全被日本吞并"
sino_event.19.f:0 "也许我们不应该再纠结这个问题，中国需要保护的小国太多了，而我们多该关注自己的内政"
sino_event.19.a:0 "下一个我们还会失去谁？"

sino_event.20.t:0 "区区小国"
sino_event.20.d:0 "兰芳公司与我们毫无关系，我们也不承认他们是中国的藩属国。"
sino_event.20.f:0 "一群下南洋的匹夫不必耗时耗力去保护他们"
sino_event.20.a:0 "我并不在乎他们。"

sino_event.21.t:0 "国策：重建丝绸之路"
sino_event.21.d:0 "古#yellow 丝绸之路#!，通商四海，跨越万里，联结东西。时光流转，昔日辉煌渐行渐远，然而伟大的帝国始终不忘肩负重任。\n\n重建丝绸之路，非仅为商旅之道，亦为文化与思想的传播之路。\n\n今天，我们将再度书写辉煌，带领东风穿越亚欧大陆，直至地平线的尽头。"
sino_event.21.f:0 "西风东渐，东方的璀璨再度焕发光彩。以丝绸之路为纽带，连接无数国邦，[ROOT.GetCountry.GetAdjective]必将在全球舞台上散发出不可忽视的光辉。"
sino_event.21.a:0 "犹如明珠镶嵌于丝绸之路，光照四方，吸引万邦。"

sino_event.22.t:0 "边境告急"
sino_event.22.d:0 "#yellow 浩罕汗国#!军官[SCOPE.sCharacter('gaixin').GetFirstName]（汉名：#yellow 阿古柏#!），挟持和卓后裔#yellow 布素鲁克#!，率军侵入我国新疆南部，首先进逼并围困了#yellow 喀什噶尔#!"
sino_event.22.f:0 "阿古柏利用南疆地区的混乱局势（民族宗教矛盾、清廷统治削弱），通过军事征服和外交欺骗，相继占领英吉沙尔、疏勒、叶尔羌（莎车）、和阗（和田）等地\n\n1867年，阿古柏宣布建立“哲德沙尔汗国”（意为“七城汗国”），控制了整个天山以南（南疆）地区。[SCOPE.GetRootScope.GetCountry.GetName]在中亚的传统势力范围和实际控制区被严重蚕食。\n\n[SCOPE.sCountry('rus_scope').GetAdjective]趁朝廷内忧外患,直接出兵强占我国伊犁地区"
sino_event.22.a:0 "新疆自古以来属于中国，我们无法坐以待毙"

sino_event.23.t:0 "国策：确认“野人山”地归属"
sino_event.23.d:0 "来自#o 1600年前#!的约定"
sino_event.23.f:0 "公元225年，蜀汉南中叛乱，诸葛亮率军分三路平定南中三郡。#v “三年春，亮率众南征，其秋悉平。"#!\n\n在葫芦王地，#yellow 诸葛亮#!与先民签订了一份盟约，#yellow 佤族#!世代为汉朝看守南大门，蜀汉也会给予#yellow 佤族#!物质支持和武力保护。\n\n在丞相的帮助下，还是刀耕火种的#yellow 佤族#!地区，引进了中原先进的生产技术和农耕技术，极大改善了当地的生活。#yellow 佤族#!先民十分感动，信守承诺，永不反叛，世代守护西南边疆。\n\n“奉阿祖阿公令”也成了#yellow 佤族#!人民最骄傲的誓言。阿祖指的是#yellow 佤族#!的祖先，阿公指的是#yellow 诸葛亮#!。一千多年来，他们始终践行着这一承诺。现在，回到伟大祖国的怀抱吧！"
sino_event.23.a:0 "敬爱的#yellow 佤族#!人民，你们是金色巨龙黑色的眼睛！"

sino_event.24.t:0 "西南边境：边境动荡"
sino_event.24.d:0 "昔时缅甸之失，如割股之痛，西南边疆，顿陷危机。敌寇窥伺，狼烟四起，百姓惶恐，日夜不宁。"
sino_event.24.f:0 "夫缅甸者，吾西南之屏蔽，若失此地，则边疆不保，国将不国。敌寇得势，必侵我国土，扰我百姓，吾辈心痛如绞，愤慨填膺\n\n今者边疆告急，吾辈当同心协力，共谋破敌之策"
sino_event.24.a:0 "勿忘国耻，奋发向前。"

sino_event.25.t:0 "国策：划定“高志凯”线"
sino_event.25.d:0 "#o 高志凯线#!不是“胡诌”而是史实，1400年前，我们到达恒河并立碑"
sino_event.25.f:0 "大唐贞观二十一年（公元647年），#yellow 王玄策#!第二次出使中天竺摩揭陀国。不料此时摩揭陀国国君已死，国中权臣#yellow 阿罗那顺#!自立为国君，众诸侯都不服。此时大唐使臣到来，#yellow 阿罗那顺#!担心自己得国不正，大唐会给予惩罚，索性一不做二不休，派兵半道劫杀大唐使团。大唐使团猝不及防，除#yellow 王玄策#!和副使#yellow 蒋师仁#!外，其余全部遇难。逃出牢笼的#yellow 王玄策#!对#yellow 蒋师仁#!说：\n\n#v 有仇不报非君子，大丈夫当效仿班超，堂堂大唐岂能受域外番邦歁侮。#!\n\n二人商议已定，决定先不回#yellow 长安#!复命，而是穿越甘地斯河，直奔#yellow 喜马拉雅山#!而去。\n\n事后，#yellow 王玄策#!只三天就攻破茶搏和罗城，#yellow 阿罗那顺#!仓皇出逃，准备东渡恒河前往东天竺。#yellow 王玄策#!乘胜追击，一举占领了整个中天竺，并在恒河边生擒#yellow 阿罗那顺#!。#yellow 王玄策#!将#yellow 阿罗那顺#!留下准备带回长安献俘，余众3000余人尽皆斩首，以报大唐使团之仇。"
sino_event.25.a:0 "[ROOT.GetCountry.GetAdjective]和[SCOPE.sCountry('bic_scope').GetAdjective]应该以恒河为界！恒河以北归[ROOT.GetCountry.GetAdjective]！"

sino_event.26.t:0 "臭名昭著的麦克马洪线"
sino_event.26.d:0 "昔我西藏疆域，广袤千里，山川壮丽，民物阜康。然世事无常，风云突变，强敌窥伺，边烽四起。吾辈虽奋勇抵抗，然终未能保全斯土，致令藏南疆域，沦于敌手"
sino_event.26.f:0 "观此变故，心如刀割，泪如雨下。昔日繁华之地，今成荒芜之野，百姓流离失所，苦不堪言。吾辈之痛，非独一己之私，实乃国家之痛，民族之痛也"
sino_event.26.a:0 "勿忘国耻，奋发向前"
sino_event.26.b:0 "我们不会放弃察隅等藏民的土地。"

sino_event.27.t:0 "国策：重设交趾县"
sino_event.27.d:0 "自秦汉以来，#yellow 交趾地区#!便纳入[ROOT.GetCountry.GetAdjective]版图"
sino_event.27.f:0 "#yellow 秦始皇统#!一六国后，派大军南征百越，将#yellow 交趾地区#!纳入秦朝版图，设立象郡进行管辖。\n\n汉武帝时期，进一步加强对该地区的治理，设置#yellow 刺史部#!，下辖多个郡县，使中原文化在当地得到广泛传播。\n\n此后数百年间，#yellow 交趾地区#!始终是[ROOT.GetCountry.GetAdjective]不可分割的一部分，在政治、经济、文化等方面与中原紧密相连。\n\n即便后来时局变迁，该地区与中原的联系也从未中断，当地的生产生活方式、礼仪制度等都深受中原影响。如今，为了恢复历史旧制，加强对边疆地区的有效管辖，重设#yellow 交趾#!县势在必行。"
sino_event.27.a:0 "执行该国策"
sino_event.27.b:0 "否决该国策"

sino_event.28.t:0 "法国的入侵"
sino_event.28.d:0 "闻此噩耗，吾辈痛心疾首，如丧考妣"
sino_event.28.f:0 "思我华夏，五千年文明，纵横天下，今却失越南之地，怎能不令人悲愤填膺！愿吾辈铭记此痛，勿忘国耻，奋发向前，以图恢复失地，重振[concept_dsk_china]之雄风。天地神明，共鉴之。吾辈誓当以铁血丹心，捍卫我华夏疆土，使法兰西贼寇，再不敢犯我[concept_dsk_china]天威！"
sino_event.28.a:0 "法兰西贼寇，狼子野心。"

sino_event.29.t:0 "大日本帝国"
sino_event.29.d:0 "皇大御国，溯自天地开辟之初便已肇立，承天照大神之神恩，禀日月运行之法理，为寰宇万国之根源，统御八纮之疆土，光耀四海之邦域。"
sino_event.29.f:0 "[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]爱民如子。\n\n吾等芸芸众生，皆是[Concept('concept_ruler','$RULER_TITLE_MIKADO$')][ROOT.GetCountry.GetRuler.GetFirstName]之忠顺臣民。君臣之纲，如天地之经纬，不可改易；武士之号，若金石之坚贞，不可丢弃。当怀#v “无留念而死，无顾忌而死，无犹豫而死”#!之赤诚，以报皇恩。吾辈此生，唯以[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]为归向，循义之准则，蓄勇之锐气，怀仁之胸襟，守礼之规范，抱诚之品性，惜名誉之重，尽忠义之责，行克己之操，以此诸般精神，严以律己，砥砺身心，誓为帝国之基石，护佑皇祚绵长。"
sino_event.29.a:0 "[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]萬歲！"

sino_event.30.t:0 "[SCOPE.sState('beautiful_state').GetName]大地震"
sino_event.30.d:0 "大正十二年九月一日，#yellow 东京#!、#yellow 横滨#!一带忽发强震，地动山摇，屋宇倾颓，烈焰四起，海啸接踵，关东大地顿成焦土"
sino_event.30.f:0 "震波所及，城池崩裂，铁轨扭曲，港口沉没。东京市内，数千房屋瞬间坍塌，火势借狂风蔓延，烧至三日不绝，银座、浅草等繁盛之地化为灰烬。横滨更遭海啸侵袭，海水倒灌街市，溺死者不计其数。官署、学校、医院尽毁，灾民流离失所，饿殍遍野，疫病渐生。是时，山崩地裂之声不绝于耳，妇孺哭嚎响彻云霄，伤亡逾十万，财产损失难以计数，实为近世东瀛未有之浩劫"
sino_event.30.a:0 "速调军队救灾，开仓放粮安抚灾民"
sino_event.30.b:0 "优先保障皇室与军政要地安全，再图赈济"

sino_event.31.t:0 "[SCOPE.sCharacter('gaixi').GetFullName]深沐西洋学说"
sino_event.31.d:0 "我朝大臣[SCOPE.sCharacter('gaixi').GetFullName]久浸泰西之学，心染西化之思，遂弃旧念，转奉[SCOPE.sIdeology('a_ideology').GetName]"
sino_event.31.f:0 "数百年间，幕府踞江户以治日，法度循古，国势停滞，闭关锁国，不与外邦通。今虽大政奉还，天皇临御，然百废待兴，根基未稳。欲于这万国竞逐、日新月异之世，争得一席之地，恐为时尚早，仍需潜心内治，徐图进取。"
sino_event.31.a:0 "其言切中时弊，甚是有理"

sino_event.32.t:0 "[SCOPE.sCharacter('gaixi').GetFullName]深受[SCOPE.sIdeology('a_ideology').GetName]思想影响"
sino_event.32.d:0 "我朝大臣[SCOPE.sCharacter('gaixi').GetFullName]心慕[SCOPE.sIdeology('a_ideology').GetName]之理，遂改弦易辙"
sino_event.32.f:0 "民族主义之潮澎湃，尊王攘夷之论振聋发聩，早已深入民心，得万众拥护。以此观之，[ROOT.GetCountry.GetAdjective]岂能久困于区区四岛之地？当乘此东风，扬我国威，使国之力量，于广袤亚细亚之舞台上，崭露头角，光耀四方。"
sino_event.32.a:0 "其言豪情满怀，甚是有理"

sino_event.33.t:0 "[SCOPE.sCharacter('gaixi').GetFullName]深染[SCOPE.sIdeology('a_ideology').GetName]之思"
sino_event.33.d:0 "我朝大臣[SCOPE.sCharacter('gaixi').GetFullName]醉心[SCOPE.sIdeology('a_ideology').GetName]之韵，遂倾心"
sino_event.33.f:0 "大正之世，文风鼎盛，思潮激荡。或寄情笔墨，绘山河之秀；或放歌原野，抒胸中之志。浪漫之气遍拂列岛，文人雅士追慕自由，市井百姓乐享太平，一时风华，传为美谈。"
sino_event.33.a:0 "甚是有理"

sino_event.34.t:0 "太平洋战争"
sino_event.34.d:0 "我[SCOPE.GetRootScope.GetCountry.GetName]为打破英美诸夷之封锁，伸张东亚共荣之大义，内阁大臣[SCOPE.sCharacter('gaixi').GetFullName]建议我们向[SCOPE.sCountry('gbr_scope').GetName]、[SCOPE.sCountry('usa_scope').GetName]宣战！"
sino_event.34.f:0 "自甲午之役、日俄之战以来，我邦雄踞东亚，然英美蛮夷常怀觊觎之心，以资源禁运相胁，欲扼我国运。\n\n今我命令帝国#blue 海军#!、#blue 空军#!进攻[SCOPE.sState('beautiful_state').GetName]，#red 陆军#!席卷南洋，正欲涤荡西洋势力，建立以我为核心之大东亚新秩序。此战关乎帝国存亡，万民当同心同德，效命[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]，扬威四海！"
sino_event.34.a:0 "[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]萬歲！誓以血肉之躯，捍卫帝国荣光，直至胜果垂成"
sino_event.34.b:0 "连年征战已耗竭国力，百姓困苦不堪，若再陷太平洋泥潭，恐蹈覆亡之险，当止戈议和"

sino_event.35.t:0 "诏行神佛分离"
sino_event.35.d:0 "[concept_jap_empire]祭祀，当还本源。今划清神佛之界，以正国教，复我神代遗风。然法行之初，或有纷扰，当以皇道为归。"
sino_event.35.f:0 "朕思：\n\n我邦肇造，出自神祖，皇道绵延，祀典唯神。往昔世殊，神佛渐混，礼失其正，非所以尊皇体、溯本源也。\n今布新令：神佛二教，各归其宗。神社专司神祀，佛寺勿参神事；官民祭祀，不得杂糅。凡境内神祇，悉复旧制，以明[concept_jap_empire]之本；僧尼寺宇，各守清规，不得干预国典。\n此令非为抑佛，实乃正礼。愿朝野臣民，体朕此意，勿生误解。神祇之官，当振纲纪；浮屠之徒，当安其业。务使国教昌明，民德归厚，以承神祖之佑，固万世之基。"
sino_event.35.a:0 "臣等恭奉诏命，当整饬祀典，复神教之本，以固皇基！"
sino_event.35.b:0 "陛下，神佛相混已久，民心习之，骤分恐生变故，愿徐徐图之，以安万民！"

sino_event.36.t:0 "诏颁户籍法"
sino_event.36.d:0 "立国当明户籍，以正人伦。今颁新律，定家主之权，固宗族之序，使亿兆子民皆知所归，以奉[concept_jap_empire]。"
sino_event.36.f:0 "朕惟：\n\n国者，家之聚也；家者，国之本也。欲固邦基，必先正家序。\n昔我邦有‘家’之制，为世所重。今更定《户籍法》，明户主之责，辨亲疏之伦，使一户之内，尊卑有序；亿户之中，上下相安。盖户主者，承家之统，掌户之政，上对国家效忠，下率族人尽孝 —— 此非独一家之治，实乃天下之治也。\n自今而后，户籍所载，即为邦本所系。他日宪法既定，民法既颁，皆当与此律相承，使‘家’之理通于‘国’之道，朕为兆民之家长，民为朕之赤子，上下一心，共兴皇基。凡我臣民，当知此律之深意，勉力奉行，以成万世一系之伟业。"
sino_event.36.a:0 "臣等恭领诏命，愿布此律于海内，使家宁而国固!"

sino_event.37.t:0 "诏行[GetLawType('law_IJ_CI').GetName]"
sino_event.37.d:0 "方今万国通商，国力盛衰系于实业。朕决意取法西洋之技，兴工矿、利农商，以固邦本，臻于富强。"
sino_event.37.f:0 "朕闻：\n\n国之强盛，必赖百工兴旺；民生阜安，当恃实业发达。自开国以来，西洋技艺之精、工商之盛，足为楷模。\n今布新政：设工部省总领全国工商，募西洋技师，仿其法而兴铁路、开矿山、建工厂；改土地之制，许民买卖，按地价征赋，以充国库；撤诸藩关隘，通海内商路；铸统一货币，立#yellow 日本银行#!以掌金融；除行会垄断之弊，使商贾自由经营。\n夫[GetLawType('law_IJ_CI').GetName]者，非独仿西洋之形，实乃振我邦之基。愿朝野同心，革故鼎新，期我#yellow 大和#!得列于世界强国之林。"
sino_event.37.a:0 "臣等谨奉诏，愿竭心力推行新政，助陛下成中兴之业！"

sino_event.38.t:0 "诏禁私家佩刀"
sino_event.38.d:0 "皇诏禁民间私佩刀剑，[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]旧习自此渐废。盖因世易时移，维新之世当以法度齐一海内，刀兵之属非闾阎所宜久持。"
sino_event.38.f:0 "朕曰：\n\n仰承皇祖皇宗之威灵，朕抚有四海。方今宇内大通，文明日新，旧制中不合时宜者，皆当革除。\n往昔[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]佩刀，本为防奸御侮，以辅治道。然世易时移，旧制已难应时需。刀兵者，凶器也，非闾阎所宜久佩；今欲整饬纲纪，齐一法度，使海内臻于治安，故有此诏。\n[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]阶层，乃国之干城，当知时变，捐弃故习，以图维新大业。自令之后，除特旨允准者，私家不得佩刀""
sino_event.38.a:0 "陛下圣明！维新政令，当断则断，宜厉行之!"
sino_event.38.b:0 "陛下三思！骤变恐生纷扰，宜徐图之!"

sino_event.39.t:0 "全面侵华方案"
sino_event.39.d:0 "帝国内阁大臣[SCOPE.sCharacter('crisis_scope_2').GetFullName]已向[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]递交全面侵华之策，帝国将在三个月内以雷霆之势席卷[concept_dsk_china]，遂帝国扩张之宏图"
sino_event.39.f:0 "[SCOPE.sCountry('chi_scope').GetAdjective]之地，物产丰饶，战略要地众多，久为帝国所觊觎。今[concept_jap_empire]军力强盛，已具备全面进军之实力。此方案旨在迅速攻占[concept_dsk_china]各大要地，击溃其抵抗力量，扶植傀儡政权，以掌控中华之资源与命脉，为帝国称霸东亚奠定根基。方案详尽规划了兵力部署、进攻路线及后续统治之法，誓要将[SCOPE.sCountry('chi_scope').GetAdjective]纳入帝国版图"
sino_event.39.a:0 "此乃帝国大业之关键一步，当即刻推行，以扬我国威"

sino_event.40.t:0 "苏俄内战"
sino_event.40.d:0 "苏维埃政权正式在俄国建立了起来。然而，迎接苏维埃政府的并不是革命成功的喜悦，铺天盖地而来的各种敌人，叛乱此起彼伏，内战在全国范围爆发了，这个新生的国家几乎从诞生伊始就面临着夭亡的威胁。"
sino_event.40.f:0 "‘起义一旦开始，就必须以最大的决心行动起来并坚决采取进攻。防御是武装起义的死路。'——列宁"
sino_event.40.a:0 "为了祖国母亲！"

sino_event.41.t:0 "我们的邻国[SCOPE.sCountry('rus_scope').GetName]的[Concept('concept_ruler','$RULER_TITLE_TSAR$')][SCOPE.sCharacter('crisis_scope_2').GetFirstName]要求我们归还近期非法占领的[SCOPE.sState('beautiful_state').GetName]"
sino_event.41.d:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName]态度强硬，遣使来告，称我邦近期所占[SCOPE.sState('beautiful_state').GetName]为非法之举，勒令即刻归还"
sino_event.41.f:0 "[SCOPE.sState('beautiful_state').GetName]地处要冲，资源丰饶，我邦此前趁乱而入，将其纳入版图，意在拓展疆土，巩固边防。然[SCOPE.sCountry('rus_scope').GetName]视此地为其势力范围，认为我邦此举侵犯其利益，故[Concept('concept_ruler','$RULER_TITLE_TSAR$')]亲自发声，言辞间颇有动武之意，两国关系骤然紧张"
sino_event.41.a:0 "狗听了都笑了"
sino_event.41.b:0 "我们目前还没有本事与[SCOPE.sCountry('rus_scope').GetName]一较高下，何不以礼去降，仍不失封侯之位"

sino_event.42.t:0 "二二六军事政变！"
sino_event.42.d:0 "[ROOT.GetCountry.GetRuler.GetFirstName]十一年二月二十六日，部分青年将校率部起事，占据东京中枢要地，斩杀重臣，高呼#v “尊皇讨奸”#!，帝都风云突变"
sino_event.42.f:0 "起事官兵以“清君侧、除奸佞”为名，于凌晨突袭首相官邸、警视厅及重臣宅邸，#yellow 高桥是清#!、#yellow 斋藤实#!等元老重臣遇刺身亡，#yellow 铃木贯太郎#!重伤。叛军控制了永田町、霞关等政治核心区，张贴檄文控诉财阀专横、官僚腐败，要求推行“皇道政治”。东京市内枪声四起，人心惶惶，军部内部亦分裂为支持与镇压两派，[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]震怒，斥其为 “叛军”，局势剑拔弩张"
sino_event.42.a:0 "应天顺人，严惩叛乱，恢复帝都秩序"

sino_event.43.t:0 "[SCOPE.sState('skirmish_state').GetName]会战"
sino_event.43.d:0 "[SCOPE.sState('skirmish_state').GetName]之地，乃咽喉要冲，得失关乎全局。[SCOPE.sCountry('jap_scope').GetName]集重兵来犯，守军亦在此布下防线，一场恶战已不可免。"
sino_event.43.f:0 "为打通南下通道，[SCOPE.sCountry('jap_scope').GetName]以精锐之师猛攻[SCOPE.sState('skirmish_state').GetName]，飞机大炮日夜轰炸，阵地几成焦土。\n\n[SCOPE.sCountry('chi_scope').GetName]守军将士抱必死之心，依托工事奋勇抵抗，白刃相接之声不绝于耳，尸山血海遍布疆场。前线官兵餐风饮露，轻伤不下火线，以血肉之躯筑起防线，数次击退日军冲锋。后方百姓亦全力支援，送粮送药，搬运伤员，与将士同仇敌忾。此会战历时月余难以分出胜负，双方伤亡惨重。"
sino_event.43.a:0 "我们将密切关注[SCOPE.sState('skirmish_state').GetName]"

sino_event.44.t:0 "[concept_battle_of_east_asia]"
sino_event.44.d:0 "我们称自己为#N “日出之国”#!，从不是空泛的自诩。"
sino_event.44.f:0 "[SCOPE.sCountry('chi_scope').GetAdjective]地大物博，原是天地的馈赠。#bold 东北#!的黑土能长出养活千万人的高粱，#bold 江南#!的桑蚕能吐出绕地球三圈的丝绸，#bold 西域#!的玉石在晨光里泛着温润的光，#bold 南海#!的珍珠把朝阳折射成七彩的虹。这些不是炫耀的资本，而是文明延续的底气。\n\n反观#v 东瀛列岛#![SCOPE.sCountry('jap_scope').GetAdjective]，不过是晨光偶然掠过的礁石。火山灰里种不出两季的稻麦，狭窄的平原养不起灿烂的文明，就连他们引以为傲的和服，针脚里还留着吴服的影子；京都的金阁寺，飞檐的弧度永远差着紫禁城角楼的一分气度。\n\n昔日遣唐使在长安抄写《论语》时，何曾敢想有朝一日会觊觎#v “日出之国”#!的名号？那些被他们奉为国宝的唐招提寺，正是鉴真和尚东渡时带去的华夏光影，如今却成了他们与母体争名的资本。"
sino_event.44.a:0 "只是后来的风浪迷了某些人的眼，假名的笔画里，藏着的是汉字的骨血。"

sino_event.45.t:0 "国策：唐刀正脉"
sino_event.45.d:0 "他们在残缺的图纸上胡乱修改，把直刀改成弯刀，却不知唐刀的“直”，原是“君子藏器于身，待时而动”的风骨"
sino_event.45.f:0 "武士刀不过是唐刀的影子。当年日本遣唐使带回的不仅是刀样，还有两名长安铁匠，可他们在东瀛岛上始终炼不出合格的钢材\n\n富士山的铁矿含硫量太高，锻打的刀刃总带着暗纹，像块没揉透的面团。为了掩盖缺陷，他们不得不将刀身弯成弧线，却失去了唐刀“直中取势”的气度；模仿覆土烧刃时掌握不好火候，只能在刀身上做出夸张的波浪纹，远看倒像被雷击过的树枝。\n\n平安时代的《延喜式》里坦承，当时最好的 “横刀”，硬度也只及唐刀的七成，却要在刀鞘上缀满金银，试图用浮华掩盖骨子里的拙劣。"
sino_event.45.a:0 "它们在等一个懂得的人，轻轻拂去锈迹——那时你会看见，刀刃上倒映的，是整个盛唐的月光"

sino_event.46.t:0 "国策：朝鲜设省"
sino_event.46.d:0 "其俗同华，其文同汉——《新唐书》"
sino_event.46.f:0 "那些质疑“设省”合理性的论调，怕是忘了半岛的岩层里，嵌着多少华夏的印记。\n\n汉城博物馆藏着的“魏率善中郎将”铜印，印钮的蟠螭纹与邺城出土的完全相同；庆州古墓里的漆器，纹饰是《楚辞》里的“云中君”，漆料里的朱砂来自辰州，与马王堆汉墓的漆器同源。更不必说崔溥《漂海录》里记载的，他在浙江看到的农具，与朝鲜半岛的“形制毫厘不差”\n\n这种文明的同频共振，本就是设省最坚实的根基。"
sino_event.46.a:0 "昔者[SCOPE.sCountry('kor_scope').GetNameNoFlag]，今日朝鲜省"
sino_event.46.b:0 "否决国策"

sino_event.47.t:0 "国策：海上丝绸之路"
sino_event.47.d:0 "从北京的市井到罗马的市集，从泉州的窑火到威尼斯的作坊"
sino_event.47.f:0 "清代的海图上，航线被朱砂画成流动的河。从刘家港出发的商船，会在澎湖列岛换淡水，水桶里的倒影里，既能看见妈祖庙的飞檐，也能看见阿拉伯三角帆的影子。\N\N有位葡萄牙商人在日记里写：“泉州的船比威尼斯的大三倍，船帆上绣着龙，却在货舱里装着威尼斯的玻璃镜，镜里映出的中国商人，正用算盘计算着佛罗伦萨的金币。”\N\N这些镜子后来被带回欧洲，贵族们在镜中看见的不仅是自己的容颜，还有镜背錾刻的缠枝纹——那是中国工匠模仿欧洲纹样，却在细节里加了朵梅花。"
sino_event.47.a:0 "不如随我一起，沉醉在波澜壮阔的海图里"

sino_event.48.t:0 "国策：巨龙吞日"
sino_event.48.d:0 "日出之国，非独以地理位置而言，更以文化、精神为内涵。倭人心狠手辣，尖酸刻薄，不知廉耻，不懂感恩，不知小礼更无大义，也配作为日出之国？\n\n纵观吾华夏儿女，勤劳勇敢，智慧善良，秉承天地之正气，弘扬华夏之文明，无论身处何方，皆能自强不息。这乃是真正日出之国！"
sino_event.48.f:0 "黑云压城城欲摧，甲光向日金鳞开。\n\n角声满天秋色里，塞上燕脂凝夜紫。\n\n半卷红旗临易水，霜重鼓寒声不起。\n\n报君黄金台上意，提携玉龙为君死!"
sino_event.48.a:0 "扶桑的影子再长，终是依附于华夏的晨光。"

sino_event.49.t: "封锁日本"
sino_event.49.d: "为遏制其扩张野心，决意斩断日本赖以生存的南海贸易命脉，使彼国舰船不得越雷池一步，断绝其与南洋诸地的物资往来。"
sino_event.49.f: "调集水师主力扼守南海要冲，在吕宋海峡、巴士海峡等关键水道布设哨卡，严查过往船只，凡载有输日物资者一律扣查，誓将南海贸易网拦腰切断，令其海外贸易陷入瘫痪。"
sino_event.49.a: "断其生路，挫其锋芒。"

sino_event.50.t: "马六甲海峡"
sino_event.50.d: "控制马六甲海峡将使我们的海外贸易成倍增长。"
sino_event.50.f: "“马六甲海峡是沟通太平洋与印度洋的咽喉要道，通航历史远达两千多年。它是亚、非、澳、欧沿岸国家往来的重要海上通道，许多发达国家从外国进口的石油和战略物资，都要经过这里运出。由于海运繁忙以及独特的地理位置，马六甲海峡被誉为“海上十字路口”"
sino_event.50.a: "我们将成为该地区最大的贸易商。"

sino_event.51.t: "来自我们驻[SCOPE.sCountry('kor_scope').GetAdjective]外交官的消息"
sino_event.51.d: "我驻朝外交官自汉城传回密报：自去年始，我朝对朝鲜的粮种援助、铁路援建与纺织厂技术输出已见显效:平壤至仁川的铁路贯通后，朝鲜粮运效率提升三成，汉城纺织厂年产棉布较往年翻倍，我朝商船在釜山港的停靠频次已占所有外船的六成，稳居第一大贸易伙伴之位，两国商路之上，驼铃与汽笛相和，竟有汉唐‘丝路’重现之景。"
sino_event.51.f: "军事上，我朝为朝鲜训练新式陆军两营，配备仿制的‘汉阳造’步枪与克虏伯山炮，其将领每季度赴沈阳军校进修；经济上，辽东的煤铁经鸭绿江索道输往朝鲜，助其开设军械厂，而朝鲜的人参、铜料则持续入华。如此双向流通，既让朝鲜对我朝军械、技术的依赖日深，又使其农户粮仓渐实，汉城街头新开设的学堂里，孩童已能诵‘中朝唇齿’之句，民生与依附，原是一体两面。"
sino_event.51.a: "彼国得安身之资，我国固东藩之屏障"

sino_event.52.t: "《江华条约》"
sino_event.52.a: "这是对我们宗主权严重的挑衅！"

sino_event.53.t: "来自我们驻[SCOPE.sCountry('western_country').GetAdjective]大使馆的消息"
sino_event.53.d: "我驻西国大使馆急电：上月廿三，我朝‘顺昌号’商船队（载丝绸三百匹、景德镇瓷器五十箱）行至马六甲海峡，突遇百年罕见的风暴，三艘货船桅杆断裂，随波漂流。幸得西国皇家海军‘维多利亚号’巡洋舰路过，其舰员抛缆施救，耗时两日将商船拖至槟城港，修补船帆、补给淡水后，方得续行。"
sino_event.53.f: "西国海军大臣在议会提及此事时，称‘中国商船的货物是东西方贸易的纽带’，其国王更托我大使带回亲笔信，言‘愿以舰船护商路，共保海上安宁’。自去年我朝与西国签订《关税互惠条约》后，此类互助渐多，友谊之桥正越搭越宽。"
sino_event.53.a: "着外交部拟感谢信，附徽州茶砖百斤、苏绣屏风两架，由专使赴[SCOPE.sCountry('western_country').GetAdjective]"

sino_event.54.a: "派#yellow 袁世凯#!入朝，扶植闵妃集团"

sino_event.55.t: "来自[SCOPE.sCountry('western_country').GetAdjective]驻华大使馆的消息"
sino_event.55.d: "[SCOPE.sCountry('western_country').GetAdjective]驻华大使亲赴总理衙门，发现一艘宋朝商船遗骸，舱内尚存完好的青瓷碗（碗底有‘元丰年制’款）、麻质商船日志（字迹模糊，尚可辨认‘赴三佛齐贸易’），甚至有半箱未腐的武夷岩茶。"
sino_event.55.f: "[SCOPE.sCountry('western_country').GetAdjective]大使言‘此乃人类共同的航海遗产’，愿与我朝联合考古。我朝考古专家已整装待发，携带洛阳铲、水下探照灯等器具，计划下月乘‘海晏号’科考船前往。若能打捞出水，不仅可证我国宋代航海之盛，更能让‘南海属我’添份铁证。"
sino_event.55.a: "着令考古队带足丝绸样品、宋代航海图复制品"

sino_event.56.t: "[SCOPE.sState('zhejiang_scope').GetName]台风"
sino_event.56.d: "今日辰时，上海天文台测得东海生成强台风，中心风力达十二级。而[SCOPE.sCountry('western_country').GetAdjective]驻华大使一行五人，乘‘鸢尾号’邮轮昨日自#v 宁波港#!启程归国，恰行至台风影响区域，今晨已失联三小时，邮轮信号彻底消失。"
sino_event.56.f: "据#v 宁波港#!引水员回忆，‘鸢尾号’离港时已见乌云压境，大使还笑着说‘上帝会护佑我们’。此刻东海巨浪拍岸，渔船皆已归港，唯‘鸢尾号’杳无音信，恐已遇险。"
sino_event.56.a: "命令东海舰队‘镇海’‘定海’两艘巡洋舰即刻拔锚"
sino_event.56.b: "让他们去求助[SCOPE.sCountry('jap_scope').GetAdjective]"

sino_event.57.t: "[SCOPE.sCountry('western_country').GetAdjective]要求干涉[concept_battle_of_east_asia]"
sino_event.57.d: "致[SCOPE.sCountry('chi_scope').GetAdjective]总理各国事务衙门及[SCOPE.sCountry('jap_scope').GetAdjective]外务省。"
sino_event.57.f: "惊悉贵国因朝鲜权属事端引兵锋相向，朕心甚忧。当此欧亚铁路横贯大陆、蒸汽商轮驰骋四海之际，东西文明本应如泰晤士河与扬子江交相辉映，岂忍见东方兄弟阋墙？\n\n俄舰今岁三巡元山港，其铁甲艨艟载兵二千。倘中日军力俱耗，恐为双头鹰攫取渔利。"
sino_event.57.a: "[SCOPE.sCountry('western_country').GetAdjective]所言极是！"
sino_event.57.b: "狗听了都笑了"

sino_event.58.t: "资政院召开会议"
sino_event.58.d: "治道之成，赖君臣同心。愿皇上以尧舜为法，以祖宗为鉴，虚怀纳谏，勤政爱民。臣等虽驽钝，愿竭忠尽智，辅佐圣躬，共图中兴。伏乞皇上圣明，采纳施行，则国家幸甚，万民幸甚。"
sino_event.58.f: "夫民为邦本，本固邦宁。近年水旱频仍，灾黎遍野，饥民流徙，饿殍相望。而捐税苛繁，徭役繁重，农不得耕，商不得市。臣等请饬各省督抚，急赈灾民，减免赋税，兴修水利，劝课农桑。更应广设工艺学堂，教民技艺，使无业者有业，有业者乐业，则民生可安矣。"
sino_event.58.a: "吾皇万岁，万岁，万万岁！"

sino_event.59.t: "甲午战争"
sino_event.59.d: "[SCOPE.sCountry('jap_scope').GetAdjective]不宣而战，在朝鲜丰岛海面袭击了增援朝鲜的[SCOPE.sCountry('chi_scope').GetAdjective]军舰“济远”、“广乙”，丰岛海战爆发，海战中日本联合舰队第一游击队的“浪速”舰击沉了清军借来运兵的英国商轮“高升”号。"
sino_event.59.f: "蕞尔岛夷日本者，昔受汉委金印，代沐华风；今效西夷虎狼，忘恩负义。\n壬午（1882）逞凶江华岛，毁我藩篱；\n甲申（1884）谋篡汉阳城，戕害忠良；\n今复以万国公法为辞，阳托护商之名，阴蓄吞并之志\n\n嗟尔倭奴！​​忘徐福东渡开荒之恩，负鉴真弘法启智之德；窃大铠刀剑形制于盛唐，剽片假名书道于晋帖；此等衣冠沐猴，竟敢以蛇噬象！\n\n今以仁诛暴，以顺讨逆，以义战不仁，渤海惊涛必洗甲而靖，扶桑妖氛当指日可清！！"
sino_event.59.a: "檄到如律令，咸使闻知！"

sino_event.60.f:0 "1884年6月下旬以后，#yellow 金玉均#!回到朝鲜政府中任外衙门协办，日本驻朝代理公使（原为一等书记官，即公使馆参赞）#yellow 岛村久#!开始尝试接近#yellow 金玉均#等开化党人，他表示在中法战争的情况下，“君辈（指开化党人）如能为国改革，在我政府亦不以为不可。\n此次政变的目的有两个：一是脱离中国独立，二是改革朝鲜内政"
sino_event.60.a: "派#yellow 袁世凯#!入朝"

sino_event.61.t: "铁路的兴起"
sino_event.61.d: "江南富商张公感念桑梓哺育之恩，斥资百万银元，聘请德籍工程师与本地工匠，历时三载修成家乡至省城的铁路，通车当日，蒸汽机车鸣笛震落了站台的晨霜。"
sino_event.61.f: "钢轨正沿着江河与山脉延伸，从华北的麦田到岭南的茶乡，未来货运马车将被列车取代，集镇会因车站而兴起，货畅其流之日，便是百业兴旺之时。"
sino_event.61.a: "货运促经济"

sino_event.63.t: "中外联合办学"
sino_event.63.d: "来自 [SCOPE.sCountry('western_country').GetAdjective] 的汉学家李希霍芬与教育部联袂，在沪上创办 ' 中西学堂 '，既授格致、算学，亦传经史、子集，开学礼上中西学子共拜孔子与苏格拉底画像。"
sino_event.63.f: "课堂上《几何原本》与《九章算术》并置，辩论中 ' 天赋人权 ' 与' 民为邦本 ' 交融，这种兼容并蓄的教育，正培育着既懂世界又守根基的新青年。"
sino_event.63.a: "学子日增"

sino_event.64.t: "某位企业家创办出版社"
sino_event.64.d: "曾留学英伦的实业家王先生受《新青年》感召，在北平创办 ' 启明书局 '，首期推出的白话文丛书摆在琉璃厂的书架上，油墨香里混着唤醒民众的热忱。"
sino_event.64.f: "他们以 ' 通俗达意 ' 为宗旨，将卢梭《社会契约论》译成白话，把《狂人日记》印成单行本，街头报童的叫卖声里，新思想正穿透旧时代的雾霭。"
sino_event.64.a: "民众渐开蒙"

sino_event.65.t: "军队镇压[SCOPE.sState('beautiful_state').GetName]学生的和平游行"
sino_event.65.d: "[SCOPE.sState('beautiful_state').GetName]爆发流血事件！"
sino_event.65.f: "华北总司令部副总司令兼北平警备总司令部总司令迅速调动大批宪兵和警察，试图阻止学生进入东交民巷。下午4时，学生们抵达东交民巷许惠东寓所大门口，随后，冲破大门涌入院中。宪兵和警察使用木棍、枪托将学生驱逐出大门。此后双方对峙了不长时间，秩序趋于平静。原北平行辕参谋长叫学生派出代表谈判。在谈判期间，自北平西苑调来青年军第208师搜索营及4辆装甲车，将学生包围。双方代表达成协议后，走向大门口，准备向学生们宣布协议，外面的学生见代表走出，涌向门口，青年军阻止不住，当即开枪射击。学生们连忙就地卧倒，但当学生们站起来时，青年军又进行射击。直到派人专门通知，青年军才停止射击，匆忙撤走。"
sino_event.65.a: "我会睁一只眼闭一只眼"

sino_event.66.t: "土匪与强盗"
sino_event.66.d: "我国是世界上匪患最多的国家之一，人民对土匪问题深恶痛绝"
sino_event.66.f: "[concept_roc]时期天下大乱，军阀混战，民不聊生，很多人或被迫、或主动当了土匪，以抢劫、绑架为生，给百姓带来了无穷灾难。据统计，民国时全国人口约为4亿，而土匪最盛时则达到了2000万人之多，占据总人口的5%，"
sino_event.66.a: "剿匪的胆子我不但有，而且很大！"

sino_event.67.t: "剿匪顺利"
sino_event.67.d: "剿匪之事，进展甚捷"
sino_event.67.f: "民众拥警，助剿匪事。历二载有余，匪盗悉灭，其一部投诚。数百年间，天下匪患最久最烈者，今赖警士之力，终得平定。仅余残匪逃窜，然在镇反清匪之役中，无地可匿"
sino_event.67.a: "谢勇毅之警士！"
sino_event.67.b: "谢勇毅之民众！"

sino_event.68.t: "旧时代的王公贵族"
sino_event.68.d: "共和以后，那些旧时代的王爷格格们该怎么办？"
sino_event.68.f: "历史上:为了让清帝及其其他王公贵族们和平交权，民国政府颁发了《皇室优待条例》，共和后没有对旧皇室和王公贵族进行清算。 虽然继续承认了王公贵族们原有的爵位，和给予一定的经济援助，但是废除了王公贵族们的政治权力和特权"
sino_event.68.a: "给予这些人优待"
sino_event.68.b: "他们过得好不好关我们屁事？不是共和者我杀谁"

sino_event.69.t: "追回遗留在海外的文物"
sino_event.69.d: "谁能把你忘记，我遗留在海外的瑰宝"
sino_event.69.f: "经初步清点，清代宫廷遗留下来的文物共有117万余件，包括三代鼎彝、远古玉器、唐宋元明各代的书法名画、宋元陶瓷、珐琅、漆器、金银器、竹木牙角匏、金铜宗教造像以及大量的帝后妃嫔服饰、衣料和家具等。可谓金翠珠玉，奇珍异宝，无不尽有。除此之外，还有大量图书典籍、文献档案等" 
sino_event.69.a: "谁能把你带回，我朝思暮想的故乡"

sino_event.70.t: "[concept_roc][concept_kmt]全国代表大会"
sino_event.70.d.a: "《中国[concept_kmt]全国代表大会》邀请了#yellow 共产党#!以及社会各界民主党派人士参加"
sino_event.70.d.b: "《中国[concept_kmt]全国代表大会》仅有#blue 国民党#!人士才能参加，因为它代表我党一党专政的权力"
sino_event.70.f: "[SCOPE.GetRootScope.GetCountry.GetName][concept_kmt]全国代表大会（简称[concept_kmt]全代会）是中国[concept_kmt]最高权力机关，每年举行一次，由中央委员会召集。全国代表大会代表任期四年，没有禁止连任的限制，由各级党部选举之代表、中央委员、与中央常务委员会核定之代表共同组成，其中后两者的比例不超过三分之一。除每年定期集会外，若中央委员会认为有必要、或有半数以上直辖市、县、市级党部请求时，得召集临时全国代表大会" 
sino_event.70.a: "[concept_kmt]一大的召开非常顺利，“联合，联共，扶助农工”等口号已深入人心"
sino_event.70.b: "[concept_kmt]二大的召开非常顺利，“反对帝国主义”、“开国民会议”、“废除不平等条约”等口号已深入人心"
sino_event.70.c: "[concept_kmt]三大的召开非常顺利，会议通过了《恢复党籍案》。"
sino_event.70.e: "[concept_kmt]四大的召开非常顺利，会议宣告[concept_kmt]统一"
sino_event.70.a.1: "[concept_kmt]专政下的大会非常顺利，“攘外必先安内”等口号已深入人心"
sino_event.70.b.1: "[concept_kmt]专政下的大会非常顺利，“剿灭赤匪、一党专政”等口号已深入人心"
sino_event.70.c.1: "[concept_kmt]专政下的大会非常顺利，会议通过了《战时生产法》。"
sino_event.70.e.1: "[concept_kmt]专政下的大会非常顺利，会议宣告极权统治与再次征服"

sino_event.71.t: "党内清洗"
sino_event.71.d: "党内的独裁主义分子夺取了党派的控制权"
sino_event.71.f: "“清党”运动的最大特征，就是它的血腥。它开创了中国历史上，夺取政权者用暴力，并辅之以群众检举的办法，在全国范围残酷地清除异己的先例。清党运动的结果，是它成就了一个南京政府。没有“清党”的举措，南京的[concept_kmt]人就难以独树异帜，自诩正统，更难以名正言顺地夺取各地的党政权力。也正是因为他们有了这样一个政府，牢牢地掌握了所占地区的权力，并且从此主导了[concept_kmt]乃至于中国政治以后的发展。" 
sino_event.71.a: "这是反革命政变！"

sino_event.72.t: "新文化运动"
sino_event.72.d: "思想解放，倡民主与科学"
sino_event.72.f: "新文化运动之倡导者，以进化之说、个性解放为利器，力抨孔氏为代表之往圣先贤，力倡新道德、斥旧道德，兴新文学、弃文言。盖欲破数千载旧俗之锢，开民智而启新途也。"
sino_event.72.a: "华夏积弊深矣，墨守故纸则生机渐绝。非新思潮不足以涤旧染之污，非新思想不足以应时世之变。当以民主为纲，立民志之基；以科学为目，开事理之窍。破旧俗之樊笼，育新民之精神——此乃[concept_dsk_china]振衰起敝、再造文明之必由也！"

sino_event.73.t: "宝藏回家"
sino_event.73.d: "是青铜鼎在吐纳周原的泥土气息，是古画在舒展绢本里的江南烟雨，是佛首在默念久违的乡音"
sino_event.73.f: "这些归来的宝藏，身上都带着双重的时间。青铜器的绿锈里有西周的铜绿，也有纽约博物馆展柜的铁锈；古画的褶皱里有宋代的潮气，也有巴黎公寓的煤烟。但当它们回到故土的那一刻，所有的异乡痕迹都会慢慢褪去：就像那只鼎耳的缺口，今年春天竟长出了株瓦松，根须顺着青铜的纹路往下钻，像是要把那些断裂的时光，重新缝合成完整的年轮。"
sino_event.73.a: "我们可以把宝藏放在故宫开放为博物馆供国民参观"
sino_event.73.b: "我们可以把宝藏放在故宫"

sino_event.74.t: "[SCOPE.sCountry('western_country').GetName]归还了一部分故宫宝物"
sino_event.74.d: "由于我们在国际上的影响力越来越高，[SCOPE.sCountry('western_country').GetName]归还了一些从我们这攫取的宝物"
sino_event.74.f: "这些器物都不会说话。但当暮色漫过角楼，你若贴在太和殿的金砖上听，能听见宣德炉里残留的沉香在呼吸；你若对着乾清宫的铜鹤耳语，它翅尖的金箔会轻轻震颤，把三百年前的月光，抖落在你摊开的掌心。"
sino_event.74.a: "太棒了"


sino_event.75.d: "由于我们在国际上的影响力越来越高，[SCOPE.sCountry('western_country').GetName]归还了一些流转到他们那的宝物"
sino_event.75.f: "这些器物都不会说话。但当暮色漫过角楼，你若贴在太和殿的金砖上听，能听见宣德炉里残留的沉香在呼吸；你若对着乾清宫的铜鹤耳语，它翅尖的金箔会轻轻震颤，把三百年前的月光，抖落在你摊开的掌心。"


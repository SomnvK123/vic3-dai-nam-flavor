sino_event.79.f: "这些器物都不会说话。但当暮色漫过角楼，你若贴在太和殿的金砖上听，能听见宣德炉里残留的沉香在呼吸；你若对着乾清宫的铜鹤耳语，它翅尖的金箔会轻轻震颤，把三百年前的月光，抖落在你摊开的掌心。"

sino_event.80.t: "召开帝国会议"
sino_event.80.d: "帝国国会在[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]的指导下顺利召开"
sino_event.80.f: "帝国议会，由众议院与贵族院并立而成。众议院议员，经国民选举产生；贵族院议员，则为皇族、华族及敕任者，不经选举。贵族院长存不废，多为终身任职。两院权限相埒，唯众议院握有预算先议之权。明治二十三年十一月廿九，第一届众、贵族院开议；昭和二十二年三月卅一，第九十二届众议院解散，贵族院停会。"
sino_event.80.a: "帝国第一次议会顺利召开"
sino_event.80.b: "帝国第二次议会顺利召开"
sino_event.80.c: "帝国第三次议会顺利召开"
sino_event.80.z: "帝国第四次议会顺利召开"
sino_event.80.e: "帝国第五次议会顺利召开"

sino_event.81.t:0 "原住民的反抗"
sino_event.81.d:0 "由于我们占领了台湾，部分驻台军官强迫原住民从事非人的劳动，剿番战役时常发生。遭受压榨和凌辱的原住民在一位叫莫那·鲁道的部落首领领导下，在山林里发动叛乱。"
sino_event.81.f:0 "只有用屠刀，才能教会叛民服从我们的统治。"
sino_event.81.a:0 "镇压雾社起义，杀光叛乱者。"
sino_event.81.b:0 "平息事态，和当地原住民分治。" 

sino_event.82.t:0 "[ROOT.GetCountry.GetRuler.GetFirstName]之烈女"
sino_event.82.d:0 "有士兵之妻发生自裁事件"
sino_event.82.f:0 "一位新婚妻子，为了激励参加对[SCOPE.sCountry('western_country').GetName][concept_war]的丈夫、使之无后顾之忧地“效忠[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]”和“为国奉献”，在丈夫出征的前夜，她在丈夫身边刎颈自杀!\n\n一夜之间，该烈女为成为‘发扬日本妇德的光辉典范’。《偕行》以通栏标题称赞为#N [ROOT.GetCountry.GetRuler.GetFirstName]之烈女#!，称之死使得‘出征将士的士气大受鼓舞’‘所有[concept_jap_empire]军人为之感动’。\n两家会社以惊人的速度在极短的时间内竟相将其事迹拍成电影，在全国上映，并将影片运到对[SCOPE.sCountry('western_country').GetName]的[concept_war]的前线。"
sino_event.82.a:0 "就此事大做文章！"

sino_event.83.t:0 "[SCOPE.sCountry('rus_scope').GetName]的[SCOPE.sCharacter('crisis_scope_2').GetFirstName]要求我们归还非法占领的#yellow 满洲诸省#!"​
sino_event.83.d:0 "邻邦露西亚——[SCOPE.sCountry('rus_scope').GetName]，近年以来，扩张之心日炽，其势如燎原之火，渐向远东蔓延，满洲之地已受其觊觎，边境摩擦渐生，实乃我邦之隐忧"​
sino_event.83.f:0 "满洲沃野千里，物产丰饶，战略要地众多，实乃兵家必争之处。今露西亚虎视眈眈，我等是与之定下盟约，分治其地，暂求相安？还是任其步步紧逼，蚕食鲸吞，坐失此膏腴之土？此乃关乎国祚之当务之急，不可不审慎决断"​
sino_event.83.a:0 "[SCOPE.sCountry('rus_scope').GetName]狼子野心，其扩张之行，若不遏制，必成大患，吾断不允也"​
sino_event.83.b:0 "罢了，满洲幅员辽阔，物产丰饶，足以容二国并存，何必因些许土地之争，徒增兵戈之祸"

sino_event.84.t: "《英日同盟》"
sino_event.84.d: "[SCOPE.sCountry('jap_scope').GetName]遣使来议，欲结同盟以抗[SCOPE.sCountry('rus_scope').GetName]"
sino_event.84.f: "为遏俄人之扩张，双方约认中、朝为“独立”之国。若两国在中、朝之利为他国所侵，或因内乱受损，彼我皆可相机行事。缔约一方若与他国启战，另一方当守中立；若同盟之一方与两国及以上敌国交兵，另一方则当遣师相助，媾和之时亦须共商。且双方互保英人在华、日人在中及朝鲜之特权利益。"
sino_event.84.a: "同意"
sino_event.84.b: "不是现在"

sino_event.85.t:0 "违反#yellow 《大日本帝国宪法》#!"
sino_event.85.d:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName]的[ROOT.GetCountry.GetRuler.GetFirstName]就[SCOPE.sLaw('current_law_scope').GetName]的制定，以违反#yellow 《大日本帝国宪法》#!为由对该提案提出反对"
sino_event.85.f:0 "[SCOPE.GetRootScope.GetCountry.GetName]由万世一系之[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]所统御，宪法既立，便是国之基石，纲纪所系，上承皇恩，下安万民，岂容随意僭越？今若放任此等违宪之法施行，恐动摇国本，紊乱秩序，实非社稷之福"
sino_event.85.a:0 "当审慎核查，若确违宪，当废止提案"

sino_event.86.t:0 "国会压力"
sino_event.86.d:0 "政治团体要求让步"
sino_event.86.f:0 "随着新法律的颁布，精英之间发生了不断的动荡，因为他们被排除在当前明显偏袒两个利益集团之外的政策中。人们要求让步。"

sino_event.87.t: "国民革命军"
sino_event.87.d: "[SCOPE.sCharacter('white_army_general').GetFullName]已将[SCOPE.gsInterestGroup('white_army_ig').GetName]整编为国民革命军，旌旗所指，皆为扫除[concept_great_power]之桎梏、砸碎封建之枷锁，使我民族复兴之伟业，得续薪火"
sino_event.87.f: "四万万同胞！听此鼓角铮鸣！百年国耻，如鲠在喉；千年帝制，如锁加身。今日重整戎装，非为军阀割据之私，乃为天下苍生之公！向北而征，踏破洋楼领馆之骄横；向南而进，铲平土豪劣绅之盘踞！愿我将士，血沃中原肥劲草；愿我民众，心向共和聚星火！"
sino_event.87.a: "为党国之千秋基业！为[SCOPE.GetRootScope.GetCountry.GetName]之万里河山！前驱者血未冷，后继者足莫停——直捣黄龙日，便是[concept_roc]新生时！"

sino_event.88.t: "请求国联贷款"       
sino_event.88.d: "国际联盟评估了我们的信用和我们的恶名，决定向我们拨款。这十分有利于我们改善财政的困境。"   
sino_event.88.f: "国联的拨款将优先被用于经济建设与改善民生，这是我们对[SCOPE.GetRootScope.GetCountry.GetName]人民的承诺。"           
sino_event.88.a: "感谢国联。"

sino_event.89.t: "[SCOPE.sCharacter('gaixi').GetFullName]转变意识形态"
sino_event.89.d: "[SCOPE.sCharacter('gaixi').GetFullName]深受帝国主义思想影响，他说我国作为一个幅员辽阔，人口众多的国家，或许可以跟随西方列强的脚步去征服更多的土地"
sino_event.89.f: "[SCOPE.GetRootScope.GetCountry.GetName]在进行工业化改革后应该积极参与国际事务，当务之急就是与沙俄重新划定边境线。"
sino_event.89.b: "这种思想太危险了"

sino_event.90.t: "[SCOPE.sCharacter('gaixi').GetFullName]转变意识形态"
sino_event.90.d: "[SCOPE.sCharacter('gaixi').GetFullName]深受三民主义思想影响，励志将我国改革为一个伟大的民主共和国"
sino_event.90.f: "[SCOPE.GetRootScope.GetCountry.GetName]会作为一个伟大的国家为亚洲的其他地区带来民主和自由"

sino_event.91.t: "[SCOPE.sCharacter('gaixi').GetFullName]转变意识形态"
sino_event.91.d: "[SCOPE.sCharacter('gaixi').GetFullName]目睹了中国落后的现状，发表中国救亡图存思想的文章"
sino_event.91.f: "他说：[SCOPE.GetRootScope.GetCountry.GetName]目前羸弱不堪，四万万中国人仍在温饱线挣扎，内有封建势力反扑，外有帝国主义对我们的压迫。天下兴亡，匹夫有责。全国同胞应该团结一起，为[concept_dsk_china]崛起于世界而努力"

sino_event.92.t: "[SCOPE.sCharacter('gaixi').GetFullName]转变意识形态"
sino_event.92.d: "[SCOPE.sCharacter('gaixi').GetFullName]目睹了中国的现状，发表五族共和思想的文章"
sino_event.92.f: "他说：[SCOPE.GetRootScope.GetCountry.GetName]是一个拥有众多民族的国家，极端民族主义不可取，必须将全国上下所有的民族团结在一起。天下兴亡，匹夫有责。全国同胞应该团结一起，为[concept_dsk_china]崛起于世界而努力"

sino_event.93.t: "看起来你切换了国家"
sino_event.93.d: "如果你切换国家就会导致你的原本国家获得aibuff"
sino_event.93.f: "不要担心，我会帮你移除它"
sino_event.93.a: "这个buff本来就不是为你准备的"

sino_event.94.t:0 "日韩合并？"
sino_event.94.d:0 "[SCOPE.sCountry('kor_scope').GetName]已经彻底屈服于[SCOPE.GetRootScope.GetCountry.GetName]"
sino_event.94.f:0 "日本国政府及韩国政府欲巩固两帝国结合之利害共通之主义，至认韩国富强之实为止，以此目的，约定左开条款：\n1.日本国政府今后可由东京外务省监理指挥韩国之对外关系及事务。日本之外交代表者及领事可保护在外国之韩国臣民及利益。\n2.日本国政府对韩国与他国间现存条约之实行担当完全之任。韩国政府今后非由日本国政府仲介，则不得缔结有国际的性质之任何条约或约束。\n日本国政府使其代表者，置统监一名于韩国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下之阙下。统监专为管理外交相关事项，驻在京城，并有亲自内谒韩国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下之权利。日本国政府于韩国各开港场及其它日本国政府所认必要之地，有置理事官之权利，理事官在统监指挥之下，执行属于从来在韩国日本领事之一切职权，并为实行本协约条款，掌理一切必要事务"
sino_event.94.a:0 "把[SCOPE.sCountry('kor_scope').GetName]纳入[concept_jap_empire]保护国"
sino_event.94.b:0 "何不一鼓作气签订《日韩合并条约》？"
sino_event.94.c:0 "[concept_jap_empire]进军满蒙得先拿朝鲜人的血祭旗！"

sino_event.95.t:0 "只有我们才可以决定朝鲜的地位"
sino_event.95.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]要武力干涉此状"
sino_event.95.f:0 "日本国政府及韩国政府欲巩固两帝国结合之利害共通之主义，至认韩国富强之实为止，以此目的，约定左开条款：\n1.日本国政府今后可由东京外务省监理指挥韩国之对外关系及事务。日本之外交代表者及领事可保护在外国之韩国臣民及利益。\n2.日本国政府对韩国与他国间现存条约之实行担当完全之任。韩国政府今后非由日本国政府仲介，则不得缔结有国际的性质之任何条约或约束。\n日本国政府使其代表者，置统监一名于韩国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下之阙下。统监专为管理外交相关事项，驻在京城，并有亲自内谒韩国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下之权利。日本国政府于韩国各开港场及其它日本国政府所认必要之地，有置理事官之权利，理事官在统监指挥之下，执行属于从来在韩国日本领事之一切职权，并为实行本协约条款，掌理一切必要事务"
sino_event.95.a:0 "出兵"
sino_event.95.b:0 "出兵"

sino_event.96.t:0 "[concept_battle_of_east_asia]"
sino_event.96.d:0 "我日本国土虽位居亚细亚的东边，但其国民的精神已脱去亚细亚的痼陋而移向西洋文明。然而不幸的是近邻有两个国家，一个叫[SCOPE.sCountry('chi_scope').GetAdjective]，一个叫[SCOPE.sCountry('kor_scope').GetAdjective]。"
sino_event.96.f:0 "[SCOPE.sCountry('chi_scope').GetAdjective]与[SCOPE.sCountry('kor_scope').GetAdjective]的政府仍在实行古老的专制，西洋人就认为[ROOT.GetCountry.GetAdjective]也是一个无法律的国家。\n[SCOPE.sCountry('chi_scope').GetAdjective]人卑躬屈膝寡廉鲜耻，[ROOT.GetCountry.GetAdjective]人的侠义就可能为之遮蔽；[SCOPE.sCountry('kor_scope').GetAdjective]人行刑场面残酷，[ROOT.GetCountry.GetAdjective]人也被怀疑为无情等等，这些事例不胜枚举……间接地会成为我外交上的障碍，是我[ROOT.GetCountry.GetAdjective]一大不幸。"
sino_event.96.a:0 "故今日我国之上策，与其坐等邻国开明而共兴亚洲，毋宁不与他们为伍！"

sino_event.97.t:0 "武士道"
sino_event.97.d:0 "武士立身之根本，存亡之枢机也"
sino_event.97.f:0 "秉忠义为骨，执勇武为锋，守廉耻为壁，怀礼敬为范。临事不苟，遇敌不怯，生死之际，唯义所在。以刀为笔，书尽臣节；以心为镜，照见赤诚。世传此道，虽历百劫而不泯。"
sino_event.97.a:0 "武士道存，则武道兴；武道兴，则国威振"

sino_event.98.t:0 "日本茶道"
sino_event.98.d:0 "碾茶为露，注水为泉，一室之内藏天地"
sino_event.98.f:0 "和敬清寂为宗，煎点注饮为法。置茶筅则拂尽尘嚣，举茶碗则照见本心。动静之间，显禅意之幽微；浓淡之外，含岁月之静穆。非独品茗，实乃品心、品世也。"
sino_event.98.a:0 "一茶一盏，可安身心；一室一庭，可观天地"

sino_event.99.t:0 "《侵华论》"
sino_event.99.d:0 "论者谓中华之地，物产丰饶，幅员辽阔，欲以武力夺之，拓我疆土，掠其资源"
sino_event.99.f:0 "[SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName]、[SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName]等曰:"彼中华者，久居东亚，虽时有兴衰，然沃土千里，宝藏无数，实乃天赐之膏腴。今我邦国力日盛，武备渐强，若不趁此时机，挥师南下，占其城池，夺其财货，役其民力，则恐为他国所先。且中华之人，素称文弱，不堪一击，我武士之锐，当可势如破竹，一举而定。"\n\n此论一出，朝野哗然，或赞其雄略，或斥其残暴。"
sino_event.99.a:0 "此论虽烈，然可图之"

sino_event.100.t:0 "只有我们才可以决定满洲的地位"
sino_event.100.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]要武力干涉此状"
sino_event.100.f:0 "日本国政府及韩国政府欲巩固两帝国结合之利害共通之主义，至认韩国富强之实为止，以此目的，约定左开条款：\n1.日本国政府今后可由东京外务省监理指挥韩国之对外关系及事务。日本之外交代表者及领事可保护在外国之韩国臣民及利益。\n2.日本国政府对韩国与他国间现存条约之实行担当完全之任。韩国政府今后非由日本国政府仲介，则不得缔结有国际的性质之任何条约或约束。\n日本国政府使其代表者，置统监一名于韩国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下之阙下。统监专为管理外交相关事项，驻在京城，并有亲自内谒韩国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下之权利。日本国政府于韩国各开港场及其它日本国政府所认必要之地，有置理事官之权利，理事官在统监指挥之下，执行属于从来在韩国日本领事之一切职权，并为实行本协约条款，掌理一切必要事务"
sino_event.100.a:0 "出兵"
sino_event.100.b:0 "出兵"

sino_event.101.t:0 "《朴茨茅斯条约》"
sino_event.101.d:0 "[SCOPE.GetRootScope.GetCountry.GetName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下及全[SCOPE.sCountry('rus_scope').GetName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下，欲使两国及两国人民回复平和之幸福，决定订立讲和条"
sino_event.101.f:0 "日本国至帝陛下与全俄罗斯[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下间，及两国并两国臣民间，当和平亲睦\n俄罗斯政府承认日本国对韩国政治军事经济上都有卓绝利益，加指导保护监理等事，日本政府视为必要者即可措置，不得阻碍干涉。在韩国之俄国臣民，应按照最惠国之臣民一律看待，不得歧视\n两缔约国为避一切误解原因起见，彼此同意俄韩两国交界间不得执军事上措置，致侵迫俄韩两国领土之安全。"
sino_event.101.a:0 "这是[concept_jap_empire]的胜利，也是亚洲人第一次继工业革命以来完全战胜西洋[Concept('concept_great_power','$concept_great_powers$')]！"

sino_event.102.t:0 "只有我们才可以决定满洲的地位"
sino_event.102.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]要武力干涉此状"
sino_event.102.f:0 "日本国政府及韩国政府欲巩固两帝国结合之利害共通之主义，至认韩国富强之实为止，以此目的，约定左开条款：\n1.日本国政府今后可由东京外务省监理指挥韩国之对外关系及事务。日本之外交代表者及领事可保护在外国之韩国臣民及利益。\n2.日本国政府对韩国与他国间现存条约之实行担当完全之任。韩国政府今后非由日本国政府仲介，则不得缔结有国际的性质之任何条约或约束。\n日本国政府使其代表者，置统监一名于韩国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下之阙下。统监专为管理外交相关事项，驻在京城，并有亲自内谒韩国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下之权利。日本国政府于韩国各开港场及其它日本国政府所认必要之地，有置理事官之权利，理事官在统监指挥之下，执行属于从来在韩国日本领事之一切职权，并为实行本协约条款，掌理一切必要事务"
sino_event.102.a:0 "出兵"
sino_event.102.b:0 "出兵"

sino_event.103.t:0 "西南战争"
sino_event.103.d:0 "[SCOPE.sCountry('smf_scope').GetAdjective]旧士举兵叛，九州烽烟骤起。[SCOPE.sCharacter('ruler_scope').GetFullName]为首，聚数万之众，抗我新政，国本危殆。"
sino_event.103.f:0 ""[ROOT.GetCountry.GetRuler.GetFirstName]十年元月，#yellow 鹿儿岛#!夜惊。军校生袭火药库，火起连城，乱事遂发。时[SCOPE.sCharacter('ruler_scope').GetFullName]方猎于大隈半岛，闻变返，见诸生就捕，知事不可解——虽非举兵之时，然旧部环请，士心沸然，遂决意起兵。\n\n[SCOPE.sCountry('smf_scope').GetAdjective]旧士应者云集，#yellow 九州#!不满之徒辐辏，众至四万余。昔日讨幕之锐旅，今成抗命之师；曾辅维新之元勋，竟为逆乱之魁。兵锋所向，直指中枢，[concept_jap_empire]新政，危在旦夕。\n\n朕闻之，深为痛惜。[SCOPE.sCharacter('ruler_scope').GetLastName]氏本为社稷功臣，奈何惑于旧习，罔顾国法？今乱兵已起，非朕所愿，然邦纪不可坠，国法不可违，唯有整军讨逆，以安兆民。""
sino_event.103.a:0 "臣等请命讨贼！愿竭死力"

sino_event.104.t:0 "士族的效忠"
sino_event.104.d:0 "[SCOPE.gsInterestGroup('is_army_ig').GetName]领袖[SCOPE.sCharacter('army_ig_general').GetFullName]顿感皇恩浩荡，带领武士们宣布效忠于[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_MIKADO$')]"
sino_event.104.f:0 "自维新以来，士族或有惑于时变，然忠君之心未泯。今[SCOPE.sCharacter('army_ig_general').GetLastName]氏深明大义，知国之新政非弃旧统，实乃承前启后之举\n\n遂集麾下武士于阙下，焚香盟誓：‘愿以七尺之躯，护持天皇陛下；以平生之技，辅佐皇国中兴。’其心可昭日月，其志可安社稷。"
sino_event.104.a:0 "得此良将，大事何患不成?当厚加褒奖，以励天下！"

sino_event.105.t:0 "《马关条约》"
sino_event.105.d:0 "[SCOPE.sCountry('chi_scope').GetName]大[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下及[SCOPE.sCountry('jap_scope').GetName]大[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]陛下为订立和约，俾两国及其臣民重修和平，共享幸福，且杜绝将来纷纭之端"
sino_event.105.f:0 "中国认明朝鲜国确为完全无缺之独立自主国。故凡有亏损其独立自主体制，即如该国向中国所修贡献典礼等，嗣后全行废绝。\n中国将管理下开地方之权并将该地方所有堡垒、军器、工厂及一切属公物件，永远让与日本。\n台湾、澎湖列岛及其全部附属岛屿尽数归于日本\n前款所载及黏附本约之地图所划疆界，俟本约批准互换之后，两国应各选派官员二名以上为公同划定疆界委员，就地踏勘确定划界。若遇本约所约疆界于地形或地理所关有碍难不便等情，各该委员等当妥为参酌更定。各该委员等当从速办理界务，以期奉委之后限一年竣事"
sino_event.105.a:0 "此乃[concept_jap_empire]千百年来之外交胜利"

sino_event.106.t:0 "壬午兵变"
sino_event.106.d:0 "壬午兵变本是[SCOPE.sCountry('kor_scope').GetName]关于讨伐#v 闵妃#!的内乱，但因为其引发的排日风潮而使事件极大地复杂化。壬午兵变中日本人的蒙难令日本舆论大为震惊，朝野争论不休"
sino_event.106.f:0 "朝鲜人的反日情绪不断滋长，“语到倭边，咬牙欲杀之，小民尤甚”。 \n1879年6月，日本驻朝公使#yellow 花房义质#!进入汉城时，一路遭到民众投石袭击，狼狈不堪。\n1882年3月，日本大仓组职员儿#yellow 玉朝次郎#!、三菱公司职员#yellow 大渊吉成#!和东本愿寺的和尚#yellow 莲元宪诚#!无视开港条约的规定，擅自到朝鲜通商口岸元山港以外的安边府游历，结果就遭到朝鲜百姓二三百人的袭击，儿玉和大渊遭重伤，莲元则当场身亡。\n\n甚至于“岭湖山谷之间，有大伙匪类，蜂屯蚁聚，横行里闾，持兵纵火，上纳钱木，白昼抢夺富村饶户，传檄征索，称曰举义而伐倭，哗然指逆而为忠”"
sino_event.106.a:0 "他妈的，敢杀[concept_jap_empire]的侨胞,必要使其付出代价！"

sino_event.107.t:0 "甲申政变"
sino_event.107.d:0 "[SCOPE.sCountry('kor_scope').GetName]中以金玉均为首的开化党向[concept_jap_empire]驻朝公使竹添进一郎率军协助政变"
sino_event.107.f:0 "1884年6月下旬以后，#yellow 金玉均#!回到朝鲜政府中任外衙门协办，日本驻朝代理公使（原为一等书记官，即公使馆参赞）#yellow 岛村久#!开始尝试接近#yellow 金玉均#!等开化党人，他表示在中法战争的情况下，“君辈（指开化党人）如能为国改革，在我政府亦不以为不可。\n此次政变的目的有两个：一是脱离中国独立，二是改革朝鲜内政\n12月6日，袁世凯率领清朝驻朝军队镇压了这次政变，开化党的“三日天下”结束。开化党人或被处死，或亡命日本"
sino_event.107.a:0 "出手干涉[SCOPE.sCountry('kor_scope').GetName]的时机来了"

sino_event.108.t:0 "云扬号事件"
sino_event.108.d:0 "井上良馨指挥的军舰“云扬”号并没有测量日本的海域，而是在1875年5月25日驶入朝鲜釜山海域，借口军事演习，对[SCOPE.sCountry('kor_scope').GetName]肆意放炮"
sino_event.108.f:0 "以“书契相持”导致的朝日紧张为契机，“征韩论”开始在日本迅速蔓延开来，不少维新人士都大力鼓吹“征韩论”，要求讨伐“无礼”的朝鲜，实则要以武力打开朝鲜的国门，以便对内缓解日本国内矛盾，对外以朝鲜为跳板侵略中国。"
sino_event.108.a:0 "是时候打开[SCOPE.sCountry('kor_scope').GetName]的国门了"

sino_event.109.t:0 "[SCOPE.sCountry('western_country').GetName]公使被刺杀"
sino_event.109.d:0 "受到#v 尊王攘夷#!思想的影响，一位来自[SCOPE.sCountry('western_country').GetName]的公使被刺杀"
sino_event.109.f:0 "正当外国公使观光时，一名负责安保的日本警察竟举刀砍来，公使右耳上方连续挨了重重两击，顿时鲜血横流"
sino_event.109.a:0 "马上宣布严惩凶手并向[SCOPE.sCountry('western_country').GetName]赔礼道歉"
sino_event.109.b:0 "红毛夷人，死有余辜"

sino_event.110.t:0 "[SCOPE.sCountry('western_country').GetName]-[SCOPE.GetRootScope.GetCountry.GetName]条约草案"
sino_event.110.d:0 "[SCOPE.sCountry('western_country').GetName]要求与我们签署通商条约"
sino_event.110.f:0 "“他们率领四艘军舰开到江户湾口，以武力威胁幕府签订通商条约。舰队中的黑色近代铁甲军舰，为日本人生平第一次见到。佩里赠给幕府显示工业文明的火车机车模型和电报机，而幕府却只能用力士搬运回赠的大米来展示实力”"
sino_event.110.a:0 "没事的，只是一时的屈辱而已"
sino_event.110.b:0 "绝不会向这些夷人退让半步"

sino_event.111.t:0 "[SCOPE.sCountry('western_country').GetName]公馆被烧！"
sino_event.111.d:0 "愤怒的攘夷派烧毁了[SCOPE.sCountry('western_country').GetName]公馆，以这种极端的方式妄图驱逐西洋人"
sino_event.111.f:0 "攘夷派的主要参加者为下级武士、浪人、豪农富商、僧侣、神官、国学者以及公卿、大名中要求改革幕政或与幕府有矛盾的人物。高杉晋作作为长州藩的领袖之一，是这次行动的主要策划者和执行者\n尊王攘夷派志士在夜间潜入[SCOPE.sCountry('western_country').GetName]公使馆，点燃了熊熊大火。"
sino_event.111.a:0 "向[SCOPE.sCountry('western_country').GetName]赔钱道歉"
sino_event.111.b:0 "孩子不懂事，烧着玩的"

sino_event.112.t:0 "《王政复古大号令》"
sino_event.112.d:0 "尔等臣民，体朕至意，上下一心，恪守新规"
sino_event.112.f:0 "天地革而四时成，世事易而王道昌。盖闻皇祖肇造区夏，以仁统万邦，以礼驭群生，赫赫威灵，垂于永世。自德川氏柄政，历三百年，初虽有匡济之功，终因循苟且，纲纪隳颓，外侮乘隙，国脉几危。今海内志士痛心疾首，咸谓非复旧典、归政[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]，不足以回既倒之澜，安亿兆之命。\n\n朕承皇祖之灵，顺天人之望，爰举大义，复古更始。自今而后，万机悉归[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]圣断，旧幕政柄，一概罢废。立总裁、议定、参与之职，集天下贤才，共商国是；革苛政，除秕法，使海内咸知王化之隆。\n\n夫国之强，在修内而睦外。朕誓将振纲立纪，内修庶政，劝农桑，兴工艺，修武备，以培邦本；外固邦交，讲信修睦，却夷狄之窥伺，复[concept_shenzhou]之威光。凡我臣民，无论华夷，皆当沐浴圣恩，各安其业：士则精忠报国，农则力耕桑田，工则巧制器用，商则流通有无。若有背逆天道、紊乱纲常者，朕必奉天讨之，无赦。"
sino_event.112.a:0 "则四海清宁，八荒归化，可计日而待也。"

sino_event.113.t:0 "尊王攘夷，王政奉还！"
sino_event.113.d:0 "以中下级[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]为主体的改革派在萨摩、长州、土佐、肥前四藩等经济较发达地区逐渐集结，他们提出#red “尊王攘夷”#!的口号，实质是推翻[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]统治！"
sino_event.113.f:0 "统治日本的[SCOPE.gsInterestGroup('shougun_ig').GetName]犹如梦一般在一瞬间崩溃了。\n武士，商人，大名们纷纷走上街头，纷纷拥戴天皇为日本新的统治者\n\n“清国之鉴不远：道光帝初亦欲拒英夷，终因大臣怯懦而割地赔款，今外夷视中华为鱼肉。我邦若学清国‘暂忍’，则外夷必索租界、掌关税、驻兵京畿，不出五年，[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]将为外夷之囚！所谓‘力不足则暂退’，实为卖国之辞。我虽船炮不如人，然上下一心，以死拒之，外夷虽强，亦知难而退。此非鲁莽，乃保国之大义也！诸藩各怀私心，幕府威信已失，唯有[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]能号令全国”"
sino_event.113.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]将会翻开新的历史篇章"

sino_event.114.t:0 "废藩置县"
sino_event.114.d:0 "[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_MIKADO$')]下令废除全国各藩，统一为府县"
sino_event.114.f:0 "日本明治政府推翻幕府统治之后，各地藩国依然存在，并且拥有很大势力，威胁着中央集权，不利于资本主义的发展\n[ROOT.GetCountry.GetRuler.GetFirstName]召集在京的各藩知事，命令废藩。成立东京府、大阪府、京都府三府和三百零二县。原为旧藩主的知藩事，其家禄和华族身份得到保证，本人移居东京。各藩的年贡移交政府，债务也由政府承担。中央任命府知事掌管东京府、大阪府、京都府三府，县令治理各县，以代替知藩事，使权力集中于中央"
sino_event.114.a:0 "这是必要的举措"
sino_event.114.b:0 "还是先缓缓吧"

sino_event.115.t:0 "三国干涉还辽"
sino_event.115.d:0 "[SCOPE.sCountry('rus_scope').GetName]，[SCOPE.sCountry('ger_scope').GetName]，[SCOPE.sCountry('fra_scope').GetName]命令我们把#v 辽东半岛#!还给[SCOPE.sCountry('chi_scope').GetName]"
sino_event.115.f:0 "“今日本国割占辽东，既有危害中国之首都之虞，也让朝鲜国之独立有名无实，有碍维持远东之和平，故今劝谕贵国确认放弃占领辽东半岛。”\n如若不然，联军定会摧毁贵国所有军事设施"
sino_event.115.a:0 "我们将会遵循联军的意愿，但[SCOPE.sCountry('chi_scope').GetName]额外要付出三千万两白银作为赔偿"
sino_event.115.b:0 "凭本事拿的领土为什么要吐出去？"

sino_event.116.t:0 "三国干涉还辽"
sino_event.116.d:0 "小小日本胆敢忤逆我？根本不把联军放在眼里"
sino_event.116.f:0 "马上出兵"
sino_event.116.a:0 "摧毁日本！"

sino_event.117.t:0 "鲸吞满洲"
sino_event.117.d:0 "世间之恨难以抵过杀父之仇，丧家之奴，亡国之恨。"
sino_event.117.f:0 "盘踞在中国东北的日本关东军按照精心策划的阴谋，由铁道“守备队”炸毁沈阳柳条湖附近日本修筑的南满铁路路轨，并嫁祸于中国军队，日军以此为借口，炮轰中国东北军北大营，制造了震惊中外的“九一八事变”。次日，日军侵占沈阳，又陆续侵占了东北三省。1932年2月，东北全境沦陷。此后，日本在中国东北建立了伪满洲国傀儡政权，开始了对东北人民长达14年之久的奴役和殖民统治，使东北3000多万同胞饱受亡国奴的痛苦滋味"
sino_event.117.a:0 "战争爆发了，任何人都无法回头"

sino_event.118.t:0 "鲸吞中国"
sino_event.118.d:0 "世间之恨难以抵过杀父之仇，丧家之奴，亡国之恨。"
sino_event.118.f:0 "天既昏沉，地亦崩裂。华夏子孙，临此末路，百感交集。溯我[concept_shenzhou]，上下五千年，文明未绝，何其壮哉！\n昔轩辕定鼎，划野分州，制礼作乐，民始有归。商周鼎革，斯文渐兴；秦汉一统，书同文、车同轨，威加四海。魏晋风度，玄学流芳；隋唐盛世，万邦来朝，诗歌之盛，冠绝古今。宋明以降，理学昌明，技艺精进，虽有兴衰，文脉未断。\n然今大限已至，外敌入侵，山河倾覆，城郭为墟。忆昔先民筚路蓝缕，辟草莱、治江河，传薪火于不绝；念及志士仁人，当国难之时，或投笔从戎，或沥血著书，欲挽狂澜于既倒。岳飞“还我河山”之声犹在耳，文天祥“人生自古谁无死”之句泣鬼神。无数先辈，以血肉之躯，护我社稷，延我文脉。\n愿后世若有知者，见此残迹，知曾有一族，名华夏；曾有一国，曰中国。其民勤劳智慧，其史波澜壮阔。虽终寂灭，亦曾灿烂于寰宇。\n呜乎！悠悠苍天，何薄于我，天欲绝我，唯祷魂归故土，与先祖同眠于黄土之下。永别了，我之中国！"
sino_event.118.a:0 "历史会记住今天"

sino_event.119.t:0 "鲸吞太平洋"
sino_event.119.d:0 "把太平洋变成内海"
sino_event.119.f:0 "[SCOPE.GetRootScope.GetCountry.GetName]控制了美国西部太平洋的沿岸，并建立了白人傀儡政权——[SCOPE.sCountry('jna_scope').GetName]，其领土范围包括加利福尼亚、俄勒冈、华盛顿，以及内华达部分区域，首都在旧金山"
sino_event.119.a:0 "历史会记住今天"

sino_event.120.t:0 "[SCOPE.sCountry('chi_scope').GetAdjective]之路" 
sino_event.120.d:0 "[ROOT.GetCountry.GetName]旭日之争4.0！" 
sino_event.120.f:0 " 19世纪早期，[SCOPE.sGoods('opium_scope').GetName]在[SCOPE.sCountry('chi_scope').GetAdjective]被定为非法不过是一个很小的阻碍，武力强大的英军和[SCOPE.sCountry('chi_scope').GetAdjective]的走私者，以及大量的行贿受贿，使法律成为一纸空文。\n\n在[SCOPE.sCountry('chi_scope').GetAdjective]的历史上，再也没有哪个片段比19世纪中叶与[SCOPE.sCountry('gbr_scope').GetName]进行的那场[SCOPE.sGoods('opium_scope').GetName]战争更可耻的了。回顾历史是有教育意义的，至少对中国人是如此。" 
sino_event.120.a:0 "选择一条#red 史实且困难#!的[SCOPE.sCountry('chi_scope').GetAdjective]之路" 
sino_event.120.b:0 "选择一条#green 轻松且休闲#!的[SCOPE.sCountry('chi_scope').GetAdjective]之路"

sino_event.121.t:0 "宫廷政变！"
sino_event.121.d:0 "凌晨，[SCOPE.sCharacter('landowners_ig_general').GetFullName]突然从颐和园赶回紫禁城，直入[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFullName]寝宫，将[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')][ROOT.GetCountry.GetRuler.GetFullName]囚禁于中南海瀛台；然后发布训政诏书，再次临朝“训政”，“变法”失败。"
sino_event.121.f:0 "维新派只敢讲“民权”，承认人民有参与管理政治的权利，但是不敢讲“民主”，不肯承认人民是国家和社会的主人，到头来，所有新政措施全部被废止！"
sino_event.121.a:0 "软弱的资产阶级无法拯救这个国家！"

sino_event.122.t:0 "来自五千年前的你"
sino_event.122.d:0 "在乾隆二十五年（1760年），[ROOT.GetCountry.GetName]平定准噶尔汗国后，疆域达到极盛。此时的[concept_dsk_china]版图北起蒙古唐努乌梁海地区及西伯利亚，南至南海诸岛，包括“千里石塘、万里长沙、曾母暗沙”，西南达西藏的达旺地区、云南的南坎、江心坡地区等缅甸北部，西抵葱岭、巴尔喀什湖地区，东北抵外兴安岭，包括库页岛，东南则包括台湾、澎湖群岛。这一时期的国土面积达到了惊人的1316万平方公里，形状宛如一片绚烂的秋海棠叶"
sino_event.122.f:0 "你那边的春天，该也有柳絮飘进窗棂吧？我们把#v 二十四节气#!编成了诗歌，却总在清明这天想起祖坟前的艾草。或许未来的字典里没有#v “乡愁”#!这个词，但当你在某个清晨闻到熟悉的草木香，那是我们把故乡装进了风里。\n\n​别嫌我们笨拙。我们曾在竹简上刻#v “和平”#!，在丝绸上绣#v “大同”#!，在子弹外壳上写#v “救国”#!。那些被战火熏黑的典籍里，藏着最执着的念想：\n\n$TOOLTIP_DELIMITER$\n#v 愿后世子孙，枕着月光读书，不必在防空洞里写着家书。#!"
sino_event.122.a:0 "究竟是怎样的结局才配得上这一路的颠沛流离"

sino_event.123.t:0 "洋务运动，自强不息"
sino_event.123.d:0 "洋务运动"
sino_event.123.f:0 "数十年前，我们深受[SCOPE.sCountry('gbr_scope').GetName]所害，羸弱不堪，自从鸦片战争以来, [concept_great_power]持续侵夺我们。\n\n以[SCOPE.sCountry('chi_scope').GetAdjective]基业为根基，师夷长技以制夷、自我图强, 解除内忧外患，实现富国强兵。"
sino_event.123.a:0 "以中国之伦常名教为原本，辅以诸国富强之术"

sino_event.124.t:0 "新兴铁路"
sino_event.124.d:0 "中国各省应当皆有铁路，“以为全国之脉络，通则无病焉”"
sino_event.124.f:0 "自从1825年英国建成了世界上最早的一条铁路之后，由于它在经济上、政治上以及军事上所起的作用，越来越为人们所认识，于是欧美各国接踵而起纷纷效法，在短短十余年间铁路建设即有长足进展\n如今，我国的铁路的发展也走在世界前列。从汉口至上海、汉口至广东、汉口至四川、上海至福州、镇江至北京、广东至云南，铁路网四通八达，络绎不绝。"
sino_event.124.a:0 "中华创始之举，亦古来未有之事"

sino_event.125.t:0 "民族轻工业"
sino_event.125.d:0 "强大的国防基础在于整个国家经济的发展，要求能源、钢铁等工业与之配套。同时，为了维护民族利益，也必须发展民族经济，与洋人“商战”、“争利”"
sino_event.125.f:0 "1872年，李鸿章在上海建立了轮船招商局。这是洋务派创办的第一个民用企业。招商局开办仅三年时间，就为清政府回收了一千三百多万两银子，还将业务发展到外国，打破了外国航运公司的垄断局面"
sino_event.125.a:0 "纺织业、自来水厂、发电厂、机器缫丝、轧花、造纸、印刷、制药、玻璃制造等行业百花齐放！"

sino_event.126.t:0 "民族军工业"
sino_event.126.d:0 "军事工业，经费由清政府调拨，产品分配给军队使用"
sino_event.126.f:0 "军事工业为[ROOT.GetCountry.GetName]军队提供了先进的武器装备，提高了军队的战斗力"
sino_event.126.a:0 "“自强”、“中兴”"

sino_event.127.t:0 "民族教育"
sino_event.127.d:0 "新型教学内容有西学，如西文、西艺等；采用了新的教学组织形式、实施分年课程和班级授课制等"
sino_event.127.f:0 "文化出版事业的发展达到了一个前所未有的水平。京师同文馆、上海广方言馆以及江南制造局的译书馆，是当时翻译西方的中心。译书经历了由单纯的西方科技著作和书籍，向自然科学和社会科学，人文科学等著作并重"
sino_event.127.a:0 "今诚取西人器数之学，以卫吾尧、舜、禹、汤、文、武、周、孔之道"

sino_event.128.t:0 "富国强兵"
sino_event.128.d:0 "洋务运动之路，荆棘满布。资金匮乏，技术难寻，人才短缺，皆是难题。然吾辈之志，坚如金石，虽百折而不挠"
sino_event.128.f:0 "时处国运羸弱之际，国势日衰，外有列强环伺，内有民不聊生。吾辈痛心疾首，遂倡洋务运动，欲以自强求富，挽狂澜于既倒\n\n军事之强，非复吴下阿蒙。引进西器，仿制枪炮，造船制械，皆精且坚。军伍之士，皆习新法，训练有素，战则必胜。如此，则外敌不敢轻侮，边疆得以安宁\n\n经济之兴，亦非昔日可比。兴办工矿，设局造器，商贾云集，百业兴旺。金银之流通，如川之不息。百姓生活，日渐丰足，国富民强，指日可待\n\n政体之变，亦在悄然之中。吾辈虽未敢言革命，然西学东渐，人心思变。朝廷亦知时移势易，遂行改革，以应天命。如此，则国家昌盛，长治久安可期"
sino_event.128.a:0 "愿中国青年都摆脱冷气，只是向上走，不必在意自暴自弃者说的话"

sino_event.129.t:0 "民族企业"
sino_event.129.d:0 "洋务派在各地创办了一批近代化的军事工业，如江南制造总局、福州船政局等"
sino_event.129.f:0 "这些企业采用机器生产，制造枪炮、弹药、轮船等军事装备，以充实和更新我军的军事力量"
sino_event.129.a:0 "采用西方生产技术而创办的近代企业可以成为[ROOT.GetCountry.GetName]的优势力量吗？"

sino_event.130.t:0 "武昌起义"
sino_event.130.d:0 "汝幸而偶我，又何不幸而生今日[SCOPE.sCountry('chi_scope').GetAdjective]！吾幸而得汝，又何不幸而生今日之[SCOPE.sCountry('chi_scope').GetAdjective]！——《与妻书》"
sino_event.130.f:0 "“母亲大人膝下：\n\n儿于重阳之日回沪，今在杭州，因公务不及膝前尽孝，深以为憾。今人心思汉，清虏气数已尽，革命志士将奋其一击，共和可期。近日儿将与诸君身犯重险，赴死直前。\n\n儿弃学从革命，非为报一家一姓之仇，乃为天下人争自由、谋公正。誓为革命牺牲，虽死无憾，勿以儿为念。死生一视于义，不以家事为念。\n\n儿如不测，望福梅善视经国，令其读圣贤书，作忠孝之人。\n\n不孝儿叩首”——蒋介石"
sino_event.130.a:0 "亦余心之所向兮，虽九死其犹未悔"
sino_event.130.b:0 "赶紧向边疆地区输送资金，稳住地方民族势力。"

sino_event.133.t:0 "皇帝的妥协"
sino_event.133.d:0 "护国战争的爆发，导致南方多省震动，有脱离中央的趋势。[ROOT.GetCountry.GetRuler.GetFullName]有了妥协，取消帝制的念头。"
sino_event.133.f:0 "盖在主张帝制者，本图巩固国基。其反对帝制者，亦为发抒政见。今承认之案，业已撤销。如有扰乱地方，自贻口实，本大总统亦不能坐视沦胥而不顾也。——[ROOT.GetCountry.GetRuler.GetFullName]"
sino_event.133.a:0 "事到如今，朕不得不顺应民心，再造共和"

sino_event.134.a:0 "疾病夺走了[ROOT.GetCountry.GetRuler.GetLastName]的生命。一场军阀混战降临了。"

sino_event.135.t:0 "[concept_battle_of_east_asia]"
sino_event.135.d:0 "[concept_battle_of_east_asia]开始了，[SCOPE.sCountry('jap_scope').GetName]与[SCOPE.sCountry('chi_scope').GetName]两国互相宣布为[concept_rivalry]！"
sino_event.135.f:0 "从日本海到南海，从朝鲜到满洲到台湾，日本的大陆政策辐射整个东亚，一场危机无法避免！"
sino_event.135.a:0 "战争一开始，谁都无法单方面停止"
sino_event.135.b:0 "我们与[SCOPE.sCountry('chi_scope').GetAdjective]的关系密不可分！"
sino_event.135.c:0 "我们与[SCOPE.sCountry('jap_scope').GetAdjective]的关系密不可分！"

sino_event.136.t:0 "护国战争"
sino_event.136.d:0 "[ROOT.GetCountry.GetRuler.GetLastName]宣布接受帝制，这种倒行逆施的行为，激起[SCOPE.sCharacter('ecchi_chi_cai_e_character_benefactor').GetFullName]将军为首的反帝斗争。"
sino_event.136.f:0 "中华民国护国军总司令[SCOPE.sCharacter('ecchi_chi_cai_e_character_benefactor').GetFullName]誓告于我全国同胞：[ROOT.GetCountry.GetRuler.GetLastName]为不道，窃号自娱，言念国危，有如朝露。五大民族，同此共和，[ROOT.GetCountry.GetRuler.GetLastName]氏得罪民国，已成五族公敌，万众一心，更无何等种族界限。"

sino_event.137.t: "马克思主义的传播"
sino_event.137.d: "十月革命发出的反对帝国主义的号召，使饱受帝国主义列强欺凌的中国人民感到“格外沉痛，格外严重，格外有意义”。这就推动先进的中国人倾向于社会主义，推动他们认真了解指导十月革命的马克思主义学说。研究和宣传马克思主义和社会主义，逐渐成为中国进步思想界的主流。"
sino_event.137.f: "十月革命向全世界宣告崭新的社会制度由理想变为现实，开辟了人类探索社会主义道路的新时代，使马克思列宁主义传遍世界，也传到了[concept_russian]的近邻--中国。十月革命帮助了全世界尤其是帮助了中国的先进分子，用无产阶级的宇宙观作为观察国家命运的工具，重新考虑自己的问题。"
sino_event.137.a: "“十月革命一声炮响，给我们送来了马克思列宁主义。”—毛泽东"
sino_event.137.b: "这种想法太激进了！"

sino_event.138.t: "[ROOT.GetCountry.GetRuler.GetFirstName]变法"
sino_event.138.d: "吾辈生于大清，历经沧桑，目睹国势日衰，民心惶惶。然自[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]矢志变法，图新求强，吾辈亦随之振奋，共谋国是。今变法有成，国家昌盛，百姓安乐，实乃天佑大清，[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]圣明之所致也"
sino_event.138.f: "昔时，国家积弊已久，百废待兴。[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]睿智英明，洞悉时局，知非变法无以图存。彼毅然决然，推行新政，不畏艰难，不辞劳苦。吾辈亦随之而起，共赴国难，以图维新。\n\n今变法成功，国家焕然一新。政治清明，官吏廉洁，百姓安居乐业，国库充盈，兵强马壮。外敌不敢轻侮，国家得以安宁。此皆[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]圣明之所致，吾辈亦得以共享太平之福。"
sino_event.138.a: "愿[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]之圣德，永垂不朽；愿大清之国运，昌盛不衰。"

sino_event.139.t: "[SCOPE.GetRootScope.GetCountry.GetName]新式军队"
sino_event.139.d: "昔[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]，睿智圣明，洞悉时局，知军队乃国家之柱石，非新式不足以御敌。彼欲变法图强，非创建新式军队无以立国。"
sino_event.139.f: "彼深知军队之重要，故欲创建新式军队，以图国家之长远。吾辈愿追随其后，共谋国是，以图维新。\n\n创建新式军队，即为实现此志向之一途，吾辈当竭尽全力，以报国家，以慰民心"
sino_event.139.a: "我们的海军所向披靡！"
sino_event.139.b: "我们的陆军战无不胜！"

sino_event.140.t: "#yellow 光绪#![Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]与维新志士的密谋"
sino_event.140.d: "京津一带都在盛传#yellow 慈禧#!要废掉#yellow 光绪#!的事。#yellow 光绪#!知道后，整个人变得惊惶不安，立刻向维新派发出“求救”的密诏，维新派发誓要挽救维新大业，铲除#yellow 慈禧#!这个在变法道路上的最大障碍，还政#yellow 光绪#!。"
sino_event.140.f: "#o 康有为#!和#o 梁启超#!等人一起商量，迅速制定了两套对付#yellow 慈禧#!的方案。\n第一，借助西方[concept_great_power]的势力，让他们对#yellow 慈禧#!施压，逼迫#yellow 慈禧#!下台。\n#o 康有为#!亲自出面交涉，可惜英国驻华使馆表示，对目前的利益现状很满意，不愿意卷入清廷的内部争斗。\n于是，他又去日本使馆见#yellow 伊藤博文#!。然而，#yellow 伊藤博文#!只是礼节性的表示同情，对此并不感兴趣。第一套方案失败了，#o 康有为#!立刻执行第二套方案，就是派兵包围颐和园，诛杀#yellow 慈禧#!太后"
sino_event.140.a: "会赢吗？#yellow 光绪#![Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]？会赢的吧。"

sino_event.141.t: "刺杀慈禧"
sino_event.141.d: "第二天清晨，[SCOPE.sCharacter('ecchi_chi_cixi_character_benefactor').GetFullName]的尸体被发现于颐和园"
sino_event.141.f: "吾皇#yellow 光绪#!，睿智天成，龙骧虎步，临御万邦。昔承大统，年少英发，志在维新，图谋自强。彼深知国势日衰，非变法无以图存，故毅然决然，推行新政，欲挽狂澜于既倒。\n\n吾皇圣明烛照，洞悉时局，知非开放无以通民情，非兴学无以启民智，非变法无以强国体。彼欲振臂一呼，应者云集，共谋国是，以图维新。然道路坎坷，荆棘满途，慈禧太后阻挠于前，保守势力掣肘于后，然吾皇矢志不渝，百折不挠，终使变法之风吹遍大清"
sino_event.141.a: "#yellow 光绪#![Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]万岁！"

sino_event.142.t: "[SCOPE.GetRootScope.GetCountry.GetName]优质工矿"
sino_event.142.d: "当今圣上，睿智英明，洞察秋毫，知工业乃国家之根本，矿产乃富强之源泉。彼欲变法图强，非兴办工矿无以立国。"
sino_event.142.f: "圣上之志向，乃在振兴大清，使国家繁荣富强，人民安居乐业。彼深知工业之重要，矿产之珍贵，故欲兴办工矿，以图国家之长远。吾辈愿追随其后，共谋国是，以图维新。"
sino_event.142.a: "我等秉持公心，矢志不渝"

sino_event.143.t: "[SCOPE.GetRootScope.GetCountry.GetName]廉洁政府"
sino_event.143.d: "彼深知政府之弊，非一日之寒，故欲革故鼎新，以振国威"
sino_event.143.f: "改革政府，非为私欲，实为公心。吾辈欲借此机会，除旧布新，使国家昌盛，人民安居乐业。圣上之志，即吾辈之志；圣上之心，即吾辈之心。"
sino_event.143.a: "我等勤勉不懈，矢志不渝，若为其死，在所不惜"

sino_event.144.t: "[SCOPE.GetRootScope.GetCountry.GetName]自由言论"
sino_event.144.d: "昔我大清，闭关锁国，言路闭塞，民心难达。然自开放言论以来，万民欢腾，百业兴旺，国势日隆。此乃大清之福，亦万民之幸也。"
sino_event.144.f: "今观大清，朝堂之上，群臣献策，各抒己见；市井之间，百姓议论，畅所欲言。此乃大清之新气象，亦国家之新风貌。吾辈当以此为荣，以此为傲，共襄盛举。\n\n夫开放言论，非但利民，亦利国。民心所向，即国运所系。今大清顺应民心，开放言论，必能集思广益，共谋良策，使国家日益强盛，百姓日益安康。"
sino_event.144.a: "遂曰：民情可得而知，民意可得而达，国家之治乱兴衰，亦可由此而察"

sino_event.146.t: "清属[SCOPE.GetRootScope.GetCountry.GetName]"
sino_event.146.d: "朝纲不振，权臣弄权，朝政日非，百姓涂炭。苛捐杂税，重如泰山，民怨沸腾，怒不可遏。加之天灾频仍，饥馑连年，生灵涂炭，苦不堪言。"
sino_event.146.f: "外患则列强环伺，虎视眈眈。蚕食鲸吞，割地赔款，国家尊严，扫地以尽。战火连天，硝烟弥漫，山河破碎，家园凋零。百姓流离失所，妻离子散，哀鸿遍野，哭声震天。"
sino_event.146.a: "数百年的和平使朝鲜腐朽不堪"

sino_event.147.a:0 "我们现在还没有本事和[SCOPE.sCountry('jap_scope').GetAdjective]一较高低，赶紧息事宁人吧！" 
sino_event.147.b:0 "不能与[SCOPE.sCountry('jap_scope').GetAdjective]鬼子妥协！我要维护我国最后的尊严！" 

sino_event.148.t: "重新外交"
sino_event.148.d: "在瞬息万变的国际局势中，[SCOPE.GetRootScope.GetCountry.GetName]脱离了[SCOPE.sCountry('chi_scope').GetAdjective]的控制"
sino_event.148.f: "[SCOPE.sCountry('chi_scope').GetAdjective]外交的大失败使其遭受了前所未有的屈辱，我们朝政内的亲日人士要求我们切断与前[concept_overlord]的联系并开展新的外交！"
sino_event.148.a: "别管他们了，现在应与[SCOPE.sCountry('jap_scope').GetAdjective]建立新的联系！"
sino_event.148.b: "让我三思。"

sino_event.149.t:0 "第三个拿破仑与第二个帝国？"
sino_event.149.d:0 "1852年11月7日，[SCOPE.sCountry('mex_will_hit_scope').GetName]元老院颁布法令建议恢复帝制。随即举行公民投票，绝大多数表示赞成。12月2日[SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName]宣布恢复帝国，[SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName]为法兰西[Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')]，称拿破仑三世"
sino_event.149.f:0 "“然而当下仍有种担忧在滋生，我自会平息它们！仍有种不信任的情绪，促使某些人认定帝国就意味着战争，可在我看来，帝国就意味着和平！法兰西是渴望和平的，若这愿景实现，世界也会更安宁。要知道战争不是寻找乐子，是出于必要。在这不断变化的时代，处处都祸福相依，我们尽可以坦诚地说：“谁要兴师动众在欧罗巴重燃战火，那么他就有祸了！”——路易·拿破仑·波拿巴"
sino_event.149.a:0 "愿他可以秉承他叔父的遗志！"
sino_event.149.b:0 "一个民选的[Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')]？有趣"

sino_event.150.t:0 "奥匈妥协与二元帝国？"
sino_event.150.d:0 "1867年，[SCOPE.sCountry('aus_scope').GetName]为防止[concept_hungary_kindom]再次独立，[SCOPE.sCharacter('aus_king_scope').GetFirstName]签订《奥地利-[concept_hungary_kindom]折中方案》改组为奥匈帝国，[concept_hungary_kindom]获得高度的自治权，但奥地利君主仍然兼任匈牙利[Concept('concept_ruler', '$RULER_TITLE_KING$')]，成为政合国。"
sino_event.150.f:0 "奥匈帝国由哈布斯堡王朝统治。[SCOPE.sCountry('aus_scope').GetName]由一个君主（奥地利称为[Concept('concept_ruler', '$RULER_TITLE_EMPEROR$')]，[concept_hungary_kindom]称为[Concept('concept_ruler', '$RULER_TITLE_KING$')]）、两个国家和三个政府组成。两个国家是在内政上各自独立的立宪制国家，即奥地利和匈牙利。但两国均放弃了象征国家主权的外交、军事和财政权。"
sino_event.150.a:0 "[SCOPE.sCountry('aus_scope').GetName]的全称为帝国议会所代表的王国和领地以及匈牙利圣史蒂芬的王冠领地！"

sino_event.151.t:0 "奥斯曼土耳其的复兴？"
sino_event.151.d:0 "据我们巴尔干大使的可靠消息：[SCOPE.sCountry('tur_scope').GetName][Concept('concept_ruler','$RULER_TITLE_SULTAN$')]宣布已经完成#o 坦齐马特#!。"
sino_event.151.f:0 "“我们深信，安拉应我们先知的吁请会给予帮助，我们着意制定新的规章，使奥斯曼帝国的各个地区得到励精图治。”——[SCOPE.sCharacter('tur_king_scope').GetFirstName]"
sino_event.151.a:0 "这是一个使宗教、政府、国家、人民达到繁荣的新[SCOPE.sCountry('tur_scope').GetName]"

sino_event.152.t:0 "第二次埃及-奥斯曼危机？"
sino_event.152.d:0 "据我们驻阿拉伯大使的可靠消息：[SCOPE.sCountry('tur_scope').GetName][Concept('concept_ruler','$RULER_TITLE_SULTAN$')]想要收复丢失的地区，在埃及边境陈兵百万。"
sino_event.152.f:0 "1838年5月，[SCOPE.sCharacter('eqy_king_scope').GetFirstName]不再向[Concept('concept_ruler','$RULER_TITLE_SULTAN$')]纳贡，宣布独立的意思昭然若揭。[SCOPE.sCountry('gbr_scope').GetName]率先对此表示反对，8月[SCOPE.sCountry('gbr_scope').GetName]与[SCOPE.sCountry('tur_scope').GetAdjective]签订针对[SCOPE.sCountry('eqy_scope').GetAdjective]的商约，废除帝国内部施行已久的专卖制度，[SCOPE.sCountry('fra_scope').GetName]为了自己的商业利益，也随之与[SCOPE.sCountry('eqy_scope').GetAdjective]签订相似的条约。[SCOPE.sCharacter('eqy_king_scope').GetFirstName]预见这样的条约一旦生效，经济会迅速崩溃，所以坚决反对，[Concept('concept_ruler','$RULER_TITLE_SULTAN$')]趁机破坏屈塔希亚协定，第二次土埃战争便这样爆发了。"
sino_event.152.a:0 "我们将宣布介入[SCOPE.sCountry('tur_scope').GetName]-[SCOPE.sCountry('eqy_scope').GetName]的事务"
sino_event.152.b:0 "放手让[SCOPE.sCountry('tur_scope').GetName]去做吧"

sino_event.153.t:0 "柏林-东京-罗马三国轴心"
sino_event.153.d:0 "[SCOPE.sCountry('ger_scope').GetName]、[SCOPE.sCountry('ita_scope').GetName]与[SCOPE.sCountry('jap_scope').GetName]三国，在柏林、罗马和东京分别进行多次谈判，为采取措施，故签订本协定"
sino_event.153.f:0 "德、意、日彼此承认在欧洲和亚洲的“领导地位”；三国中一国受到未参加中日战争和欧洲战争国家的攻击时，相互给予政治、经济和军事援助。"
sino_event.153.a:0 "我们将宣布介入[SCOPE.sCountry('ger_scope').GetAdjective]、[SCOPE.sCountry('ita_scope').GetAdjective]与[SCOPE.sCountry('jap_scope').GetAdjective]事务"

sino_event.154.t:0 "入侵索马里兰"
sino_event.154.d:0 "[SCOPE.sCountry('ita_scope').GetName]-[SCOPE.sCountry('eth_scope').GetName]签订《乌查利条约》"
sino_event.154.f:0 "[SCOPE.sCountry('eth_scope').GetName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]#v 约翰尼斯四世#!统治时期，绍阿地区统治者#v 孟尼利克二世#!和意大利保持友好关系。\n\n约翰尼斯四世死后不久，#v 孟尼利克二世#!即与[SCOPE.sCountry('ita_scope').GetAdjective]签订此约。主要内容有：#v 孟尼利克二世#!承认意大利保对厄立特里亚高原的大部分地区拥有主权；意大利承认#v 孟尼利克二世#!为[SCOPE.sCountry('eth_scope').GetName][Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]，允其通过意大利领土输入武器和军火。但因第17款文本不同引起争议。阿姆哈拉文本规定：#v 孟尼利克二世#!可利用意大利政府的服务，按照自己的意愿同别的国家进行交往；意大利文本却称#v 孟尼利克二世#!的对外交往需通过意大利政府。"
sino_event.154.a:0 "没有我的允许，[SCOPE.sCharacter('crisis_scope_2').GetLastName]就敢想要制霸东非？"
sino_event.154.b:0 "我们对此毫无兴趣"

sino_event.155.t:0 "偷袭珍珠港"
sino_event.155.d:0 "[SCOPE.sCountry('usa_scope').GetName]在[SCOPE.sState('beautiful_state').GetName]的珍珠港被[SCOPE.sCountry('jap_scope').GetName]军队偷袭！"
sino_event.155.f:0 "[SCOPE.sCountry('usa_scope').GetName]遭到了[SCOPE.sCountry('jap_scope').GetName]海、空军有预谋的突然袭击。\n在此之前，美国同日本处于和平状态，并应日本之请同该国政府及天皇谈判，指望维持太平洋区域的和平。\n日本空军部队在美国的瓦胡岛。开始轰炸一小时后，日本驻美大使及其同僚居然还向美国国务卿递交正式复函，回答美国最近致日本的一封函件。这份复函虽然声言目前的外交谈判已无继续之必要，但却未有威胁的言词，也没有暗示将发动战争或采取军事行动\n[SCOPE.sState('beautiful_state').GetName]距日本的距离说明此次袭击显然是许多天前甚至几星期前所策划的，此事将记录在案。在此期间，日本政府有意用虚伪的声明和表示继续保持和平的愿望欺骗美国。\n日本昨天对[SCOPE.sState('beautiful_state').GetName]的袭击，给美国海、陆军造成了严重的破坏。我遗憾地告诉你们：许许多多美国人被炸死。同时，据报告，若干艘美国船只在旧金山与火奴鲁鲁之间的公海上被水雷击中。\n昨天，日本政府还发动了对#bold 马来亚#!的袭击。\n昨夜日本部队袭击了#bold 香港#!。\n昨夜日本部队袭击了#bold 关岛#!。\n昨夜日本部队袭击了#bold 菲律宾群岛#!。\n昨夜日本部队袭击了#bold 威克岛#!。\n今晨日本人袭击了#bold 中途岛#!。\n这样，日本就在整个太平洋区域发动了全面的突然袭击。昨天和今天的情况已说明了事实的真相。美国人民已经清楚地了解到这是关系我国存亡安危的问题。\n作为海、陆军总司令，我已指令采取一切手段进行防御。\n我们将永远记住对我们这次袭击的性质。\n无论需要多长时间去击败这次预谋的侵略，美国人民正义在手，有力量夺取彻底的胜利。\n我保证我们将完全确保我们的安全，确保我们永不再受到这种背信弃义行为的危害，我相信这话说出了国会和人民的意志。\n大敌当前，我国人民、领土和利益正处于极度危险的状态，我们决不可稍有懈怠。\n我们相信我们的军队、我们的人民有无比坚定的决心，因此，胜利必定属于我们。愿上帝保佑我们。"
sino_event.155.a:0 "“我要求国会宣布：由于日本对我国无故进行卑鄙的袭击，[SCOPE.sCountry('usa_scope').GetName]同[SCOPE.sCountry('jap_scope').GetName]已经处于战争状态。”"

sino_event.156.t:0 "一个逃兵役的男人"
sino_event.156.d:0 "#yellow 弗里德里希·特朗普#!-一个出生于[SCOPE.sCountry('ger_scope').GetName]南部巴伐利亚小镇卡尔施塔特的男人，为逃避兵役移民[SCOPE.sCountry('usa_scope').GetName][SCOPE.sState('beautiful_state').GetName]！"
sino_event.156.f:0 "他刚下船，就遇到一个理发店在招会德语的理发时，于是他选择在[SCOPE.sState('beautiful_state').GetName]做理发师"
sino_event.156.a:0 "“愿他可以收获人生中的第一桶金！”"

sino_event.157.t:0 "一个逃兵役的男人"
sino_event.157.d:0 "#yellow 弗里德里希·特朗普#!-一个出生于[SCOPE.sCountry('ger_scope').GetName]南部巴伐利亚小镇卡尔施塔特的男人，1885年为逃避兵役移民了[SCOPE.sCountry('usa_scope').GetName][SCOPE.sState('beautiful_state').GetName]！"
sino_event.157.f:0 "今年，他带着从美国赚到的8万马克和他的妻子伊丽莎白又回到了[SCOPE.sCountry('ger_scope').GetName]，准备永居。但没多久，就被我们#v 巴伐利亚内政部#!查出有逃兵役的前科"
sino_event.157.a:0 "取消他的国籍，让他滚蛋！"

sino_event.158.t:0 "一个另辟蹊径的男人"
sino_event.158.d:0 "#yellow 弗里德里希·特朗普#!-先前来到[SCOPE.sState('beautiful_state').GetName]当理发师的男人决定前往美国中西部"
sino_event.158.f:0 "他在西部淘金的必经之路上开了一个地下妓院，迅速积累到了原始资金。"
sino_event.158.a:0 "祝他好运!"

sino_event.160.t:0 "第一次意大利-埃塞战争"
sino_event.160.d:0 "[SCOPE.sCountry('eth_scope').GetName]政府拒绝接受[SCOPE.sCountry('ita_scope').GetName]的保护。[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]曼涅里克二世知会意大利政府，自次年起将不再履行《乌查利条约》的一切权利及义务"
sino_event.160.f:0 "[SCOPE.sCountry('ita_scope').GetName]以此为借口，拒绝和解，并在今日突然发动入侵，旨在扩张领土、缓解国内经济压力，并企图在地中海和东非地区建立霸权。"
sino_event.160.a:0 "他妈的，[SCOPE.sCountry('ita_scope').GetName]这是赤裸裸的帝国主义行径！我请求国会拨款立刻支持[SCOPE.sCountry('eth_scope').GetName]！"
sino_event.160.b:0 "国内的事情已经让我焦头烂额了！"

sino_event.161.t:0 "一个躲了世界大战，但却没躲过大流感的男人"
sino_event.161.d:0 "#yellow 弗里德里希·特朗普#!-因为感染流感而死，享年49岁"
sino_event.161.f:0 "他死前用当年开妓院的钱，在[SCOPE.sState('beautiful_state').GetName]皇后区买了5块地皮，成为了他们家族崛起的关键"
sino_event.161.a:0 "很快，他的家族会名震四方，而在100年后，他的孙子#yellow 唐纳德·特朗普#!会成为[SCOPE.sCountry('usa_scope').GetName][Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]"

sino_event.162.t:0 "意土战争"
sino_event.162.d:0 "[SCOPE.sCountry('ita_scope').GetName]-[SCOPE.sCountry('tur_scope').GetName]战争爆发"
sino_event.162.f:0 "[SCOPE.sCountry('tur_scope').GetName]就如日薄西山的老人一样，我们只需要轻轻踹上一脚，它就会轰然倒塌。"
sino_event.162.a:0 "奥斯曼帝国愈发孱弱，而[SCOPE.sCountry('ita_scope').GetName]作为新成立的政权还没有殖民地。通过从奥斯曼人手中夺回的黎波里塔尼亚，有很大的机会获得这些殖民地。"

sino_event.163.t:0 "[SCOPE.sCountry('usa_scope').GetName]-[SCOPE.sCountry('chi_scope').GetName]互助协定！"
sino_event.163.d:0 "[SCOPE.sCountry('usa_scope').GetName]支持[SCOPE.sCountry('chi_scope').GetName]抵抗[SCOPE.sCountry('jap_scope').GetName]侵略！"
sino_event.163.f:0 "为此，左列签署人经由各本国政府合法授权，议定条款如左：\n\n第一条 [SCOPE.sCountry('usa_scope').GetName]政府将继续以美国总统准予移转或供应之防卫物品、防卫服务及防卫情报，供给[SCOPE.sCountry('chi_scope').GetName]政府。\n\n第二条 [SCOPE.sCountry('chi_scope').GetName]政府对于[SCOPE.sCountry('usa_scope').GetName]之防卫及该防卫之加强，将继续予以协助，并将以其所能供应之物品、服务、便利或情报。"
sino_event.163.a:0 "签署于[SCOPE.sCountry('chi_scope').GetName]外交部部长：#yellow 宋子文#!与[SCOPE.sCountry('usa_scope').GetName]政府代表：国务卿#yellow 赫尔#!"

sino_event.164.t:0 "[SCOPE.sCountry('usa_scope').GetName]-[SCOPE.sCountry('chi_scope').GetName]-[SCOPE.sCountry('gbr_scope').GetName]三国同盟宣言"
sino_event.164.d:0 "这次是唯一之戰事不論交戰在何處，英国的戰事是决计打倒滥用兵力之日本"
sino_event.164.f:0 ""This is the only war, where ever England is fighting, the goal of the British war is to destroy the aggressive Japan" "
sino_event.164.a:0 "签署于[SCOPE.sCountry('chi_scope').GetName]外交部部长：#yellow 宋子文#!与[SCOPE.sCountry('gbr_scope').GetName]政府代表：首相#yellow 丘吉尔#!"

sino_event.165.t:0 "九一八事变！"
sino_event.165.d:0 "[SCOPE.sCulture('chinese_culture').GetName]到了最危险的时候！"
sino_event.165.f:0 "1931年9月18日晚10时许，[SCOPE.sCountry('jap_scope').GetName]关东军岛本大队#yellow 川岛中队河本末守#!中尉率部下数人，在#v 沈阳#!北大营南约800米的柳条湖附近，将南满铁路一段路轨炸毁。\n\n日军在此布置了一个假现场，摆了3具身穿[SCOPE.sCountry('chi_scope').GetName]士兵服的尸体，反诬是#red 中国#!军队破坏铁路。\n\n日本充其野心，直欲灭我全国，奴我全民，中国当局者，纵欲屈辱妥协，苟安旦夕，已决非日阀所许，呼吁四万万中国国民立即行动起来，制止内战，鞭策政府，俾得悉移内战之兵力财力，以度此空前非常之国难，此真爱国志士所当剑及履及求其实现者也。"
sino_event.165.a:0 "十万青年十万军，一寸山河一寸血！"

sino_event.167.t:0 "[SCOPE.sCountry('kor_scope').GetAdjective]称帝？"
sino_event.167.d:0 "高宗通过诱导官民上疏劝进，制造“六军与万民之愿”的民意基础,同时，以儒家“天命论”重构历史叙事，宣称继承檀君、箕子以来的“三韩统一”正统，否定“朝鲜”作为明朝册封国号的从属性"
sino_event.167.f:0 "高宗在汉城圜丘坛举行祭天仪式，仿照《大明会典》的礼仪登基，改国号为[SCOPE.sCountry('kor_scope').GetName]，年号“光武”（取自东汉光武帝，寓意中兴）\n1899年颁布《大韩国国制》，确立“万世不变的专制政治”，皇帝集统帅权、立法权、行政权于一身，废除代议机构，强化中央集权"
sino_event.167.a:0 "我们将承认这个东亚国家"
sino_event.167.b:0 "无君无臣，有悖常伦！"

sino_event.168.t:0 "西班牙内战"
sino_event.168.a:0 "我们将支持[SCOPE.sCountry('spa_scope').GetAdjective]"
sino_event.168.b:0 "我们将承认[SCOPE.sCountry('car_scope').GetAdjective]"

sino_event.169.t:0 "西班牙-拉美协定"
sino_event.169.d:0 "马德里与布宜诺斯艾利斯达成历史性协议，以白银债券重构大西洋贸易网络"
sino_event.169.f:0 "1860年《加迪斯条约》首次将西班牙铁路轨距标准（1668mm）纳入拉美基建规范，智利硝石与古巴蔗糖通过巴塞罗那期货交易所实现跨洋定价。墨西哥流亡总统胡亚雷斯授权将瓜纳华托银矿收益的15%注入新成立的'伊比利亚开发银行'，用于铺设布宜诺斯艾利斯至利马的泛美电报网。秘鲁作家帕尔马在《利马商报》撰文称：'这是用铁轨和电缆编织的新式无敌舰队'"
sino_event.169.a:0 "这是伊比利亚-拉美双赢"

sino_event.172.t:0 "普奥战争爆发"
sino_event.172.d:0 "进行对奥战争，是[SCOPE.sCountry('pru_scope').GetName]领导[concept_germany]统一的关键性一步"
sino_event.172.f:0 "[SCOPE.sCountry('pru_scope').GetName]方面的总兵力已多达63万人，而[SCOPE.sCountry('aus_scope').GetName]方面的实力，总共只有约58万余人。不过，奥地利处于内线阵地，且其骑兵和炮兵都在数量上占有优势，并便于机动作战。"

sino_event.173.t:0 "[SCOPE.sCharacter('Aowu_scope').GetFullName]悼念[SCOPE.sCharacter('Buhuashu_scope').GetFullName]事件"
sino_event.173.d:0 "我们怀着无比沉痛的心情告知：[SCOPE.sCharacter('Buhuashu_scope').GetFullName]（化名），因消化道出血、急性阑尾穿孔入院治疗，虽经全力救治，终因先天性心脏病及并发症，于#v 2025年4月28日20时#!因心律失常恶化与世长辞，享年#v 20岁#!。[SCOPE.sCharacter('Buhuashu_scope').GetFullName]生前是RA群组的一员，性格开朗，热情，乐于助人。他的骤然离去让我们深感痛惜，群内往日的欢声笑语犹在耳畔，如今却成追忆。不知道[SCOPE.sCharacter('Buhuashu_scope').GetFullName]作为一个虚无主义者，会不会相信有来生呢？"
sino_event.173.f:0 "留一盏灯\n\n把夜照亮\n\n去接她回家\n\n你能够看到吗\n\n你能够听到吗\n\n停步留下吧，我把你的脸勾勒成画\n\n今晚的月色真是美啊\n\n久久不能入眠心乱如麻\n\n我要托最好的星星送光给她"
sino_event.173.a:0 "“布花鼠，虚无主义者，知识分子，鼓动者，请让她活的久一点”——[SCOPE.sCharacter('Buhuashu_scope').GetFullName]2025.3.20\n“牢dan一定要把我跟布花鼠弄到一起,我要在游戏里继续陪他”——[SCOPE.sCharacter('Aowu_scope').GetFullName]2025.4.29"

sino_event.174.t:0 "沉痛悼念#yellow 布花鼠#!事件"
sino_event.174.d:0 "我们怀着无比沉痛的心情告知：#yellow 布花鼠#!（化名），因消化道出血、急性阑尾穿孔入院治疗，虽经全力救治，终因先天性心脏病及并发症，于#v 2025年4月28日20时#!因心律失常恶化与世长辞，享年#v 20岁#!。#yellow 布花鼠#!生前是RA群组的一员，性格开朗，热情，乐于助人。他的骤然离去让我们深感痛惜，群内往日的欢声笑语犹在耳畔，如今却成追忆。不知道#yellow 布花鼠#!作为一个虚无主义者，会不会相信有来生呢？"
sino_event.174.f:0 "留一盏灯\n\n把夜照亮\n\n去接她回家\n\n你能够看到吗\n\n你能够听到吗\n\n停步留下吧，我把你的脸勾勒成画\n\n今晚的月色真是美啊\n\n久久不能入眠心乱如麻\n\n我要托最好的星星送光给她"
sino_event.174.a:0 "“布花鼠，虚无主义者，知识分子，鼓动者，请让她活的久一点”——#yellow 布花鼠#!2025.3.20"

sino_event.175.t:0 "中英《南京条约》"
sino_event.175.d:0 "兹因大清[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]，大英[Concept('concept_ruler','$RULER_TITLE_KING$')]，欲以近来之不和之端解释，止肇衅，为此议定设立永久和约。"
sino_event.175.f:0 "英军到达#yellow 南京#!后，两江总督#yellow 牛鉴#!向[SCOPE.sCountry('gbr_scope').GetName]求和。8月8日，署乍浦副都统#yellow 伊里布#!首先到达，派其仆人#yellow 张喜#!两度前往英方军舰，会晤翻译#yellow 马儒翰#!。钦差大臣耆英到达后，#yellow 璞鼎查#!曾限期于8月14日议定和约，否则开炮攻城。双方共在静海寺内议约四次，也曾在上江考棚等处议和。8月17日，江宁布政使#yellow 黄恩彤#!与#yellow 马儒翰#!商定了条约内容。8月22日，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]全部允许"
sino_event.175.a:0 "俾即日按照和约开载之条，施行妥办无碍矣。"

sino_event.176.t:0 "这至高的力量"
sino_event.176.f:0 "自京师畿辅以至十八行省之府厅州县，#yellow 辽沈#!故地，#yellow 吉林#!龙兴之所，#yellow 黑龙江#!索伦渔猎之乡，#yellow 天山#!南北之回部诸城，戈壁大漠之#yellow 蒙古#!诸盟旗，雪域高原之#yellow 卫藏#!宗溪，#yellow 滇黔桂川#!之土司苗疆，及于东南海疆之#yellow 台澎列屿#!，凡此巨万城邑、部落、溪卡、堡寨、屯戍、牧厂，星罗棋布，无远弗届。赖列圣威德，天朝法度，咸奉正朔，尽在版图。斯乃大清万年基业，煌煌疆域，永固无疆。\n\n朕统御所及，内则行省将军，星罗棋布；外则藩服属邦，棋列幅辋。皇舆之所治，藩服之所宗，凡此六百八十有七省，皆奉大清正朔，载在盟府。自天山瀚海至西洋暹罗，由朔漠乌梁海至南洋苏禄，自乌里雅苏台至安南都护府，无不仰沐天恩，恪守藩礼。斯乃天朝恢弘气象，万国来朝之盛典，皇清亿万年无疆之休。"
sino_event.176.d:0 "朕，承天眷命，统驭万方，抚绥中夏，君临天下。以下各省、府厅州县、边陲重镇、藩部盟旗、土司卫所，赖列祖列宗鸿庥，咸在版图之中，悉归大清统辖"
sino_event.176.a:0 "吾皇万岁，万岁，万万岁！"

sino_event.177.t:0 "若有未竟之事"
sino_event.177.f:0 "汝忆否？四五年前某夕，吾尝语曰：“与使吾先死也，无宁汝先我而死。”汝初闻言而怒，后经吾婉解，虽不谓吾言为是，而亦无词相答。吾之意盖谓以汝之弱，必不能禁失吾之悲，吾先死，留苦与汝，吾心不忍，故宁请汝先死，吾担悲也。嗟夫！谁知吾卒先汝而死乎？\n\n吾诚愿与汝相守以死，第以今日事势观之，天灾可以死，盗贼可以死，瓜分之日可以死，奸官污吏虐民可以死，吾辈处今日之[ROOT.GetCountry.GetAdjectiveNoFlag]，国中无地无时不可以死。到那时使吾眼睁睁看汝死，或使汝眼睁睁看吾死，吾能之乎？抑汝能之乎？"
sino_event.177.d:0 "观此危局，如临深渊，除吾辈纵身一跃，以躯填壑，再无他途可寻。尔莫怨吾决绝，须知吾刀已出鞘，箭已上弦，唯有饮血断喉，方能护万家之灯火。"
sino_event.177.a:0 "嗟夫！巾短情长，所未尽者，尚有万千!未圆之梦，未竟之事，便以吾等之死相托噫！"

sino_event.179.t: "中华瑰宝被盗"
sino_event.179.d: "位于[SCOPE.sState('controller_scope').GetName]的宝物被[SCOPE.sCountry('western_country').GetName]盗窃"
sino_event.179.f: "“有一天，两个来自欧洲的强盗闯进了圆明园。一个强盗洗劫财物，另一个强盗在放火。似乎得胜之后，便可以动手行窃了。他们对圆明园进行了大规模的劫掠，赃物由两个胜利者均分。两个胜利者，一个塞满了腰包，这是看得见的，另一个装满了箱箧。他们手挽手，笑嘻嘻地回到欧洲。这就是这两个强盗的故事。\n我们欧洲人是文明人，中国人在我们眼中是野蛮人。这就是文明对野蛮所干的事情。\n在历史面前，这两个强盗分别叫作法兰西和英吉利。”——维克托·雨果"
sino_event.179.a: "悲痛之情溢于言表"

sino_event.180.t: "[SCOPE.sCountry('rus_scope').GetName]的[Concept('concept_ruler', '$RULER_TITLE_TSAR$')][SCOPE.sCharacter('crisis_scope_2').GetFirstName]要求我们割让外西北等地"
sino_event.180.d: "#v 回乱未定又遇新疆暴乱，贵国西疆尚在未定之交界#!"
sino_event.180.f: ""自沙滨达巴哈界牌起，先往西，后往南，顺萨彦山岭，至唐努鄂拉达巴哈西边末处，转往西南，顺赛留格木山岭，至奎屯鄂拉，即往西行，顺大阿勒台山岭；至斋桑淖尔北面之海留图两河中间之山，转往西南，顺此山直至斋桑淖尔北边之察奇勒莫斯鄂拉；即转往东南，沿淖尔，顺喀喇额尔齐斯河岸，至玛呢图噶图勒干卡伦为界。\n\n此间分别两国交界，即以水流为凭：向东、向南水流之处，为中国地；向西、向北水流之处，为俄国地""
sino_event.180.a: "只因回乱未靖，代为收复，权宜派兵驻守，俟关内外肃清，乌鲁木齐、玛纳斯各城克服之后，当即交还"
sino_event.180.b: "奇耻大辱，丧权辱国"

sino_event.185.t: "[SCOPE.sState('han_state').GetName]的[SCOPE.sCulture('han_culture').GetName]民族起义"
sino_event.185.d: "[SCOPE.sState('han_state').GetName]爆发了大规模的民族起义，多数[SCOPE.sCulture('han_culture').GetName]人要求挣脱我们的统治！\n注：我们统辖的[SCOPE.sCulture('han_culture').GetName]地[concept_radical]＞25%且[SCOPE.sCulture('han_culture').GetName]族处于歧视则会爆发该事件"
sino_event.185.f: "痛哉！吾[SCOPE.sCulture('chinese_culture').GetName]，从此不得为大清国之民也！吾大清国皇帝何尝弃吾台民哉！"
sino_event.185.a: "归还领土，但要求[SCOPE.sCountry('chi_scope').GetAdjective]付出一笔以#v 10%#!GDP标准的赎金"
sino_event.185.b: "让这些人继续闹，放任不管"
sino_event.185.c: "这已经不是普通的暴民了，必须重拳出击！"

sino_event.186.t: "招募中国劳工"
sino_event.186.d: "来自[SCOPE.sState('han_remove_state').GetName]的[SCOPE.sCulture('han_culture').GetName]人通过中介远渡重洋，千里迢迢来到了我国的[SCOPE.sState('beautiful_state').GetName]"
sino_event.186.f: "晚清时，前赴海外工作的华人劳工，通常是来自穷乡僻壤的破产平民、无业贫民或渔民（特别是广东五邑地区），被招工馆等中介公司欺骗或拐卖而置身异国，他们会收到首期的预付薪酬，但是需要扣除一笔介绍费用、交通费用和佣金，然后前往海外，在19世纪中后期至20世纪初，由于这些出国的劳工都会签约，称为契约华工"
sino_event.186.a: "华民无辜，飘零数万里,却成为契约苦力"
han_remove_state_tt: "来自[SCOPE.sState('han_remove_state').GetName]的1%的[SCOPE.sCulture('han_culture').GetName]人将来到[SCOPE.sState('beautiful_state').GetName]"
sino_event.186.b: "我改变主意了，今年的[concept_workforce]已经够用了"

sino_event.187.t: "召开《九国公约》"
sino_event.187.d: "巴黎和会未了之事，终要在[SCOPE.sState('beautiful_state').GetName]做个了断。美、英、法、日、意、中、比、荷、葡九国聚首，议题只有一个：如何给动荡的远东立个规矩。"
sino_event.187.f: "会议室里的雪茄烟圈，缠绕着各国的算盘。谁都想在华多分一杯羹，却又怕别人独占：尤其是[SCOPE.sCountry('western_country').GetName]在山东的吃相，早已让欧洲[concept_great_power]坐不住了。"
sino_event.187.a: "[ROOT.GetCountry.GetName]将作为#v 会议主办国#!为出席这次国际会议。"

sino_event.188.t: "《九国公约》：门户开放"
sino_event.188.d: "《九国公约》会议在[SCOPE.sCountry('great_country').GetName]的组织下取得了圆满的成功，‘门户开放、机会均等’八个字已成定论。各国在华口岸通商、关税协定之权，从此需共进退，谁也不能再搞势力范围的独食。"
sino_event.188.f: "欧洲[concept_great_power]笑了，这规矩护了他们的既得利益；[SCOPE.sCountry('western_country').GetName]虽不情愿，也只能暂时收敛爪牙。只是这‘开放’的大门，钥匙终究不在[SCOPE.sCountry('chi_scope').GetName]手里。"
sino_event.188.a: "名义上的平等，总好过被一家生吞活剥。"

sino_event.189.t: "《九国公约》：一家独大"
sino_event.189.d: "公约成了一纸空文：[SCOPE.sCountry('western_country').GetName]以‘特殊利益’为由，拒不放弃在满蒙的特权，军舰仍游弋于长江，商社垄断着东北矿业，俨然成了远东的‘特殊存在’。"
sino_event.189.f: "欧洲[concept_great_power]虽有不满，却各有盘算，不愿为远东与[SCOPE.sCountry('western_country').GetName]撕破脸。中华的土地上，又多了个横着走的‘规矩制定者’。"
sino_event.189.a: "弱国无外交。"

sino_event.190.a: "我们[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]也出席了此次会议"

sino_event.197.t:0 "得位不正"
sino_event.197.d:0 "[SCOPE.sCharacter('landowners_ig_general').GetFullName]批评#blue 国民政府#!得位不正，弑父杀君大逆不道！"
sino_event.197.f:0 "#yellow 良弼#!与#yellow 溥伟#!、#yellow 铁良#!等组织“君主立宪维持会”（俗称“宗社党”），反对南北议和与清帝逊位\n\n臣等愿效死力，以保大清社稷，袁世凯挟革命党以逼朝廷，我等主张调集北洋军与革命军决一死战，共和乃洪水猛兽，君主立宪方为救国正道！满蒙本为一体，当独立建国以复兴大清，溥仪年幼，吾当辅其恢复祖业。"
sino_event.197.a:0 "一群封建主义余孽！"

sino_event.198.t:0 "尿毒症"
sino_event.198.d:0 "来自[SCOPE.sCharacter('university_benefactor').GetFullName]的私人医生在为[SCOPE.sCharacter('university_benefactor').GetFullName]体检时查出了严重的疾病！"
sino_event.198.f:0 "[SCOPE.sCharacter('university_benefactor').GetFullName]每半小时便要如厕，尿液漂浮着“白絮状物”。[SCOPE.sCountry('western_country').GetName]医生在1月的秘密诊疗记录中写道：“双肾肿大如鹅卵，日排尿不足300毫升”。\n但真正加速他死亡的,是鹿茸拌高粱喂食的鸭子、每日必饮的人参鹿茸汤。这些热性补品在尿毒症患者体内化作毒药，正如其三女袁静雪所言：“他越补，身子越像被蛀空的梁柱。”"
sino_event.198.a:0 "花重金聘请国外高水平专家为[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]治病，不惜一切代价"
sino_event.198.b:0 "在天坛上为[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]祈福！"

sino_event.199.t:0 "军阀混战"
sino_event.199.d:0 "清朝的灭亡结束了[ROOT.GetCountry.GetAdjectiveNoFlag]长期以来的封建统治，但是，手握重兵的[ROOT.GetCountry.GetRuler.GetFullName]并未满足于当前的政治地位，向革命军发起攻击，[ROOT.GetCountry.GetAdjectiveNoFlag]开启了军阀割据的新时代。"

sino_event.200.t:0 "有民跪拜[ROOT.GetCountry.GetRuler.GetFullName][Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]肖像"
sino_event.200.d:0 "一位80多岁的姓萧的盐商特地从扬州到南京来瞻仰大总统的风采。见到[Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]肖像后，老先生突然放下手杖，跪下去对着肖像恭恭敬敬地行起了三跪九叩首的旧礼来"
sino_event.200.f:0 "“老先生，现在不是大清了，已经是[concept_roc]了”\n“皇上难道又改国号了？”\n“现在也没有[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]了，只有[Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]。”\n“原来是[Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')]陛下”"
sino_event.200.a:0 "站起来，不准跪"

sino_event.201.t:0 "蒙古独立"
sino_event.201.d:0 "#yellow 哲布尊丹巴#!登基为帝，号称 “日光皇帝”，年号“共戴”"
sino_event.201.f:0 "以库伦活佛为首的外蒙古僧俗封建主在俄国长期煽动和支持下，以会盟为名，在库伦召开四盟王公秘密会议，决定分裂[concept_dsk_china][concept_roc]，实行[SCOPE.sCountry('mgl_scope').GetName]“独立”，并派遣以杭达多尔济、达喇嘛车林齐密特为首的代表团密往俄京圣彼得堡请求俄国政府“庇护”\n\n喀尔喀已“将全土自行保护，定为大蒙古帝国，公推哲布尊丹巴为[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]”"
sino_event.201.a:0 "该死"
sino_event.201.b:0 "我们不会让他们独立！"

sino_event.202.t:0 "西藏独立"
sino_event.202.d:0 "[SCOPE.sCountry('tib_scope').GetName]宣布驱逐在藏满汉官员，支持汉人的喇嘛和部分噶厦政府的人员都被杀害"
sino_event.202.f:0 "十三世达赖特使伦钦夏扎·班觉多吉、英印政府外交政务秘书亨利·麦克马洪以及[ROOT.GetCountry.GetAdjectiveNoFlag]政府之西藏宣抚使陈贻范，于1913年10月13日在印度的西姆拉举行会议。夏扎·班觉多吉提出六项要求。主要内容有：（一）西藏独立。1906年在北京签订之中英条约无效。（二）划定中藏边界。其界线尽括青海全部及川边各地。（三）1893年暨1908年之藏印通商章程由英藏修改，中国不得过问。（四）中国不得派员驻藏。华商无西藏所发护照，不准入境。"
sino_event.202.a:0 "该死"

sino_event.206.t:0 "少民惶恐"
sino_event.206.d:0 "辛亥[concept_revolution]的爆发，让#yellow 藏人#!和#yellow 蒙古人#!的上层人群畏惧我们，从而寻求境外势力追求独立！他们想趁革命内乱脱离我们的掌控"
sino_event.206.f:0 "边疆非汉族地方产生动荡和骚乱，军纪较差的驻藏清军也发生了内讧，当地局势混乱。至1912年底原清朝yellow 驻藏大臣#!和yellow 驻藏清军#!全部离开#yellow 西藏#!，史称#v 第一次驱汉事件#!。此后北洋政府没有官员常驻#yellow 西藏#!。"
sino_event.206.a:0 "糟糕"

sino_event.207.t:0 "民主的同盟"
sino_event.207.d:0 "辛亥以降，我邦首举共和之旗，涤荡帝制余烬，立宪法，开议会，亚洲民主之先声，遂振聋发聩于四海。大洋西畔，[SCOPE.sCountry('western_country').GetName]闻我邦之变，议院欢呼，报章赞曰：‘东方古国，竟破千年桎梏，与我同趋文明之途’。今远隔重洋而心契，将结为盟，共卫此神圣之权。"
sino_event.207.f:0 "自禹铸九鼎，至民国肇造，未闻东土与西陆有此同心之盟。此非金帛之约，乃精神之契——[SCOPE.GetRootScope.GetCountry.GetName]挣脱枷锁之日，恰与破巴士底之魂相照，当开万古未有之局，书新篇于青史。"
sino_event.207.a:0 "与[SCOPE.sCountry('western_country').GetName]签订[concept_alliance]条约"
sino_event.207.b:0 "来日再议，国内尚百废待兴"

sino_event.208.t:0 "[SCOPE.sCountry('gbr_scope').GetName]的[SCOPE.sCharacter('crisis_scope_2').GetFirstName]要求重议我国西南等地边境线"
sino_event.208.d:0 "英印政府外交大臣麦克马洪利诱中国西藏地方噶夏的代表，背着中国中央政府代表，搞了一份划界换文，将边界从阿萨姆平原边缘向中国西藏方向推移150公里"
sino_event.208.f:0 "这是由一批英国和英属印度政府官员以编造历史、销毁证据、出版伪书等不光彩手段伪造出来的"
sino_event.208.a:0 "事到如今，也只能如此"
sino_event.208.b:0 "我们绝对不会屈服于帝国主义的淫威"

sino_event.209.t:0 "[SCOPE.sCountry('rus_scope').GetName]的[SCOPE.sCharacter('crisis_scope_2').GetFirstName]要求我们割让[SCOPE.sState('tuva_scope').GetName]"
sino_event.209.d:0 "绰号“疯男爵”的俄国殖民主义分子恩琴率匪军攻陷外蒙首府库伦"
sino_event.209.f:0 "只因内乱未靖，代为收复，权宜派兵驻守，俟关内外肃清，[SCOPE.sState('tuva_scope').GetName]各城克服之后，当即交还"
sino_event.209.a:0 "事到如今，也只能如此"
sino_event.209.b:0 "我们绝对不会屈服于帝国主义的淫威"

sino_event.210.t:0 "壮士#blue 青天#!耀#v 白日#!，血染山河#red 满地红#!" 
sino_event.210.d:0 "从“以党治国”迈向“党辅民治”" 
sino_event.210.f:0 "意识形态之变或为根本。摒弃固有教条，吸纳新思潮以应时势，重塑民众认同。譬如融民权理念于基层治理\n\n组织根基之重构影响深远。若涤除派系积弊，削山头、破壁垒，以民主人士代门阀，以公心易私谊，则党内聚力可期\n\n内外政策之转向牵动全局。\n\n对外若改亲疏有别的结盟策略，以民族利益为圭臬，或能在国际博弈中寻得新平衡；对内若弃 “剿抚并重” 之旧途，采 “疏导融合” 之新法，边疆治理、民生改善或有突破。\n\n但政策连贯性一旦断裂，易致社会错愕，需以雷霆手段稳舵，辅以耐心教化固本。" 
sino_event.210.a:0 "党新生、国受益，如旭日破云，照见新途" 

sino_event.211.t:0 "互开左籍" 
sino_event.211.d:0 "[SCOPE.sCharacter('Aowu_scope').GetFullName]就关于国民党路线问题与[SCOPE.sCharacter('Buhuashu_scope').GetFullName]展开了激烈的讨论" 
sino_event.211.f:0 "[SCOPE.sCharacter('Aowu_scope').GetFullName]：“你居然觉得民生问题该循序渐进？这是典型的右倾保守！”\n\n[SCOPE.sCharacter('Buhuashu_scope').GetFullName]:“你张口闭口阶级斗争，不顾实际搞激进，，这是假左真左倾！”\n\n有人质问：“你为何不谴责某‘伪左派’？”二人答：“我若谴责他，便落入你设定的审判游戏；我若不谴责，你便说我包庇异端。不如这样：我们各自把对方开除左籍，这样左派阵营就纯净了”" 
sino_event.211.a:0 "我这一生，先被国民党除名，再被共产党除名，最后自己成了‘无籍游魂’——谭平山" 
kmtd_infighting_modifier:0 "派系斗争" 

sino_event.212.t:0 "党国政治" 
sino_event.212.d:0 "国会内大多数[concept_kmt]党员就[SCOPE.sLaw('current_law_scope').GetName]的制定，以违反[ROOT.GetCountry.GetAdjective]宪法为由对该提案提出反对" 
sino_event.212.f:0 "“军政即是[concept_kmt]率领军队推翻北洋政府的统治\n\n训政则是[concept_kmt]取得政权后,必须一党执政,训练民众使用民主权利\n\n待民众政治觉悟和权利意识提高后,再还政于民，实施宪政\n\n依《训政纲领》的规定,国民党的中央执行委员会政治会议担负着对国民政府施行重大国务的“指导监督”责任,因而它是联系国民党中央与国民政府的主要桥梁。”" 
sino_event.212.a:0 "左转路线失败了" 

sino_event.213.t:0 "法团治国" 
sino_event.213.d:0 "国会内大多数[concept_kmt]党员就[SCOPE.sLaw('current_law_scope').GetName]的制定，以符合[ROOT.GetCountry.GetAdjective]宪法为由对该提案提出赞成" 
sino_event.213.f:0 "“军政即是[concept_kmt]率领军队推翻北洋政府的统治\n\n训政则是[concept_kmt]取得政权后,必须一党执政,训练民众使用民主权利\n\n待民众政治觉悟和权利意识提高后,再还政于民，实施宪政\n\n你记住了孙先生的教诲了吗？”" 
sino_event.213.a:0 "右转路线成功了" 

sino_event.214.t:0 "生产改良的经验"
sino_event.214.d:0 "[SCOPE.sCountry('jap_scope').GetName]的胜利被视为 “明治维新” 的直接成果——通过学习西方制度、技术，日本在短短数十年内实现了近代化转型。这让政府统治阶层和士大夫深刻认识到：要救亡图存，必须学习日本的改革经验。"
sino_event.214.f:0 "相比欧美，日本与中国“同文同种”（文字、文化相近），且改革路径更具“可复制性”（均为东亚国家，面临相似的“西学东渐”挑战）。因此，政府认为：向日本学习，是“以最短路径掌握西方文明”的捷径——日本已将西方制度、技术“本土化”，中国可直接借鉴其经验，避免“从零开始”的摸索"
sino_event.214.a:0 "宝贵的改革经验"

sino_event.215.t:0 "社会体制改良的经验"

sino_event.216.t:0 "军事改良的经验"

sino_event.217.t:0 "愿朝阳常照我土"
sino_event.217.d:0 "我等倡议革命，旨在倒清立国，迟早而已，必有成功日，当今世界各国皆有国旗，以资国家的象征。举义在即，亦应预谋此事，以#blue 青天白日#!代满清之#yellow 黄龙旗#!"
sino_event.217.f:0 "“盖务求惊醒黄魂，光复汉族。无奈贪官污吏，劣绅腐儒，腼颜鲜耻，甘心事仇，不曰本朝深仁厚泽，即曰我辈践土食毛。讵知满清以建州贼种，入[ROOT.GetCountry.GetAdjectiveNoFlag]，夺我土地，杀我祖宗，掳我子女玉帛。试思谁食谁之毛，谁践谁之土？杨州十日，嘉定三屠，与夫两王入粤，残杀我汉人之历史尤多，闻而知之，而谓此为恩泽乎？”——陆皓东"
sino_event.217.a:0 "但我可杀，而继我而起者不可尽杀。"

sino_event.218.t:0 "兴中会：振兴[concept_dsk_china]"
sino_event.218.d:0 "我等倡议革命，驱逐鞑虏，恢复[ROOT.GetCountry.GetAdjectiveNoFlag]，创立合众政府"
sino_event.218.f:0 "“[ROOT.GetCountry.GetAdjectiveNoFlag]积弱，至今极矣！上则因循苟且，粉饰虚张；下则蒙昧无知，鲜能远虑。堂堂华国，不齿于列邦；济济衣冠，被轻于异族。有志之士能不痛心！夫以四百兆人民之众，数万里土地之饶，本可发奋为雄，无敌于天下。乃以政治不修，纲维败坏，朝廷则鬻爵卖官，公行贿赂；官府则剥民刮地，暴过虎狼。盗贼横行，饥馑交集，哀鸿遍野，民不聊生，呜呼惨哉！方今强邻环列，虎视鹰瞵，久垂涎我中华五金之富，物产之多。蚕食鲸吞，已见效于踵接；瓜分豆剖，实堪虑于目前。”——孙中山"
sino_event.218.a:0 "要革命的，这时可以革了，过了这时没有命了。"

sino_event.219.t:0 "同盟会：建立资产阶级议会制共和国"
sino_event.219.d:0 "我等倡议革命，驱除鞑虏，恢复[concept_dsk_china]，创立民国，平均地权"
sino_event.219.f:0 "“天运岁次年月日中华国民军都督奉军政府命，以军政府之宗旨及条理，布告国民。驱除鞑虏。今之满洲，本塞外东胡，昔在明朝，屡为边患；后乘中国多事，长驱入关，灭我中国，据我政府，迫我汉人为其奴隶，有不从者，杀戳亿万。我汉人为亡国之民者二百六十年于斯!满洲政府穷凶极恶，今已贯盈，义师所指，覆彼洲汉军人等，如悔司来降者，免其罪；敢有抵抗，杀无赦!汉人有为满奴以作汉奸者，亦如之。”——孙中山"
sino_event.219.a:0 "敢有帝制自为者，天下共击之！"
c_white_sun_modifier:0 "创立民国，平均地权"

sino_event.220.t:0 "征日作战计划"
sino_event.220.d:0 "兵力部署：\n#red 陆军：#!北路军奉天新军、南路军山东淮军旧部、预备队。\n#blue 海军：#!仁川舰队、汉城舰队、奉天舰队"
sino_event.220.f:0 "[SCOPE.sCountry('jap_scope').GetName]对我国东北及黄海海防构成直接威胁。政策核心为“以陆制海、渐进破局”，旨在依托陆权优势抵消日方海上力量，通过控制朝鲜半岛压缩其战略空间，最终迫使其放弃战争野心。政策制定吸纳了湘军、淮军宿将与新军将领的双重意见，既保留传统陆战经验，亦引入德国陆军操典中的协同战术理念。"
sino_event.220.a:0 "优先从陆上进攻，任命[SCOPE.sCharacter('army_soldier').GetFullName]为日本派遣军作战陆军司令"
sino_event.220.b:0 "优先从海上进攻，任命[SCOPE.sCharacter('navy_soldier').GetFullName]为日本派遣军作战海军司令"

sino_event.221.t:0 "马踏#yellow 东京#!"
sino_event.221.d:0 "先取#yellow 长崎#!，再克#yellow 大阪#!，转瞬兵临#yellow 东京城#!下。城头日章旗摇摇欲坠，街巷倭兵弃甲奔逃，而我军铁骑踏过朱雀大道，铁蹄声响彻富士山北麓"
sino_event.221.f:0 "倭奴，倭寇也。张目不见礼，开口非人言。沐猴而冠，祭粪石而为琮。遍观天下之禽兽，难望其项背；想来古往之畜牲，拍马难及。或为四脚着地、厥头塞尾之类猿，实乃食腐饮粪、寝皮同类之蛊猴。\n\n其后，混得野人之妄，西夷之狂，杂交混血方成。望日出而不知天地之广、宇宙之大，自诩日出之民，乃获罪于天。仰华夏之光，竟背主窥伺神庙；以弹丸小国，欺神州之陆沉于满夷，乃获罪于人。俟其自绝于万邦，妄图脱天之罚，乃获罪于地，自有长广之祸。卑膝犬行，吠旧主以期残粪。\n\n如此之国，非人哉？非禽兽哉？何如！非得破庙伐宗，灭其苗裔，绝其嗣，亡其种，方不负我中华男儿血泪。踽踽独行，不可背忘；磨牙吮血，难解深恨。但有言其利者，祖宗不得安，血脉不得昌，人神共戮，九天十地共鉴，万里八荒同照！"
sino_event.221.a:0 "倭寇，人类的恶种，直到杀死最后一个倭奴之前，我绝不停歇！"

sino_event.222.t:0 "[SCOPE.sState('japs_state').GetName]大屠杀"
sino_event.222.d:0 "[SCOPE.sCharacter('empire_character').GetFullName][SCOPE.sCharacter('fascist_character').GetFullName]已放任手下的士兵在[SCOPE.sState('japs_state').GetName]胡作非为"
sino_event.222.f:0 "“血腥味混着腐臭，浓得化不开，呛得人喉咙发紧。乌鸦在半空盘旋，时不时俯冲下来，叼起一块带肉的碎骨，翅膀扇起的风里，都裹着细碎的血沫。低洼处的血洼早已发黑，上面漂着层层叠叠的苍蝇，有人的眼球从血洼里凸出来，被苍蝇爬得密密麻麻，只剩一点白仁还露在外面，望着灰蒙蒙的天。\n\n残垣断壁间，还卡着半截身子，胸腔被炮弹炸开，肋骨像折断的梳齿般支棱着，碎肉溅在砖墙上，干成了暗褐色的斑块，倒像是谁用血画了幅狰狞的画。偶尔有未死透的伤兵，在尸堆里发出嗬嗬的声响，喉咙里像堵着滚烫的沙，每一声喘息都带出血沫，却再也没人能挪开压在腿上的断梁。”"
sino_event.222.a:0 "我们的手上沾满了鲜血"

sino_event.223.t:0 "[SCOPE.sState('japs_state').GetName]集中营"
sino_event.223.d:0 "[SCOPE.sCharacter('empire_character').GetFullName][SCOPE.sCharacter('fascist_character').GetFullName]已放任手下的士兵在[SCOPE.sState('japs_state').GetName]建造集中营以批量处决战俘"
sino_event.223.f:0 "“铁丝网像巨蟒的鳞片，在灰黄色的天幕下泛着冷光，每根铁刺都挑着半干的布条 —— 那是囚徒们被勾破的囚衣。瞭望塔上的探照灯扫过操场，把攒动的人影切成碎块，瘦骨嶙峋的人们蜷缩着，条纹囚服松垮地挂在身上，像挂在枯枝上的破麻袋。\n\n点名时的呵斥声刺破黎明，囚徒们排队走过焚尸炉的烟囱，那烟囱日夜吐着灰烟，把天空染成肮脏的铅色。有人望着烟囱出神，眼里的光像快熄灭的油灯，手指无意识地摩挲着胸前——那里曾别着家人的照片，如今只剩一道磨破的布痕。”"
sino_event.223.a:0 "我们的手上沾满了鲜血"

sino_event.224.t:0 "剪辫易服"
sino_event.224.d:0 "三百年剃发之辱，今日终得解脱！"
sino_event.224.f:0 "城门口的卫兵查得严，见留辫的就拉到路边强剪，争执声混着剪刀响，像新旧两个时代在拉扯。这头发的去留，原是一场藏着血泪的转身"
sino_event.224.a:0 "再不必为一根辫子，低眉顺眼做人"
sino_event.224.b:0 "不，这是老祖宗传下来的辫子"

sino_event.225.t:0 "咸丰龙体违和"
sino_event.225.d:0 "行宫内外暗流涌动，肃顺等八大臣攥紧了朱批的权力，后宫的懿贵妃隔着帘幕听着咳声，眼神里藏着未说的话。这龙体连着的，是摇摇欲坠的江山，是满朝文武的惶惶之心，更是那道不知通向何方的未来。"
sino_event.225.f:0 "热河行宫的药味漫过朱漆门槛，咸丰帝卧在龙榻上，颧骨高耸如削，咳声震得锦被发颤。御案上的奏章堆成小山，关于英法联军的战报还沾着墨痕，他却连抬手批阅的力气都快没了"
sino_event.225.a:0 "大行皇帝宾天了！国不可一日无君，可这破碎的山河，谁能接得住？"
sino_event.225.b:0 "恳请陛下保重龙体！哪怕为了祖宗的基业，为了还在水深火热的百姓，也得撑下去啊！奴才愿折寿十年，换陛下安康！"

sino_event.226.t:0 "同治帝沉疴难起"
sino_event.226.d:0 "朝堂上的争论比药味还浓：恭亲王想趁机请太后彻底归政，士大夫们却念叨着"国赖长君"，连民间都在传，这龙体怕是熬不过这个冬天。"
sino_event.226.f:0 "养心殿的烛火彻夜未熄，同治帝躺在榻上，脸上起了连片的红疹，高热烧得他胡话连篇，时而喊着"亲政"，时而念着"圆明园"。太医们跪在地上，药汤换了一碗又一碗，脉案却只敢写"邪气入体，恐难回天"
sino_event.226.a:0 "天不假年！十九岁的龙驭上宾了！亲政未满两年"
sino_event.226.b:0 "陛下再撑一撑！您还年轻，这大清的好日子该在后头啊！奴才们都在宫门外跪着求菩萨，求祂把您留下，哪怕多留一日也好！"

sino_event.227.t:0 "光绪帝病入膏肓"
sino_event.227.d:0 "宫里的人都在悄悄准备后事，内务府连夜赶制"大行皇帝"的殓服，而太后的"万寿庆典"还在筹备"
sino_event.227.f:0 "瀛台的寒风吹了十余年，光绪帝的咳嗽声越来越弱，身子骨缩成了一把骨头。太医来诊脉时，总被李莲英挡在门外，只许隔着窗递药方"
sino_event.227.a:0 "那位想变法图强的皇帝，终究没能熬过这个冬天！"
sino_event.227.b:0 "皇上，您再努努力啊！还记得您说过要造铁路、练新军吗？那些事还没成呢，您怎么能走？奴才给您焐焐脚，这瀛台太冷了，咱们回紫禁城去"

sino_event.228.t:0 "册立载淳为储君"
sino_event.228.d:0 "咸丰帝在病榻上指了指载淳，那六岁的孩童还不懂"太子"二字的分量，只攥着咸丰的衣角怯生生地看。顾命八大臣捧着金册跪地"
sino_event.228.f:0 "红墙内外都在算着这笔账：幼主登基，必然是"太后垂帘"与"大臣辅政"的角力。有人说这是"国本稳固"，也有人暗叹"主少国疑"，可金册上的朱印已盖，那孩子的命运，从这一刻起就和这风雨飘摇的王朝绑在了一起。"
sino_event.228.a:0 "臣等叩谢天恩！愿以死辅佐太子"
sino_event.228.b:0 "陛下三思！太子年纪太轻，外有洋夷环伺，内有党争暗流，此时立储，恐生变数！"

sino_event.229.t:0 "册立载湉为储君"
sino_event.229.d:0 "慈禧太后隔着帘子念出"载湉"二字时，满朝文武都愣了，这四岁的孩童是咸丰的侄子，论辈分却是同治的堂弟，过继给先帝当儿子，才得以坐上储君之位。"
sino_event.229.f:0 "这道旨意里藏着太后的算盘：幼主登基，垂帘听政便能名正言顺；而恭亲王虽有不满，却也挑不出礼法错处。朝堂上的烛火映着众人的脸，一半是顺从，一半是担忧。这紫禁城，怕是又要被那道帘子遮上许多年了。"
sino_event.229.a:0 "臣等遵旨！太子虽幼，却是天命所归！"
sino_event.229.b:0 "太后三思！以侄继叔，于礼法不合啊！"

sino_event.230.t:0 "册立溥仪为宣统储君"
sino_event.230.d:0 "光绪帝弥留之际，载沣抱着三岁的溥仪跪在龙榻前，那孩子吓得直哭，抓着龙袍的衣角不肯放。太后的懿旨随后传到："着载沣之子溥仪入继大统，载沣为摄政王""
sino_event.230.f:0 "消息传出，街头巷尾都在议论："又一个娃娃皇帝，这大清还能撑多久？"革命党的传单在暗中流传，外国报纸的标题写着"中国的黄昏"。可金銮殿上的仪式仍在继续，仿佛只要朱笔一圈，这国本就能稳住似的。"
sino_event.230.a:0 "臣等遵旨！愿辅佐摄政王与太子，守好这祖宗的基业！"
sino_event.230.b:0 "太后三思！国祚飘摇至此，再立幼主，怕是要应了"天道循环"啊！"

sino_event.231.t:0 "他日波涛如山"
sino_event.231.d:0 "我八千健儿已经牺牲殆尽，敌攻势未衰，前途难卜。若阵地存在，我当生还晋见钧座。如阵地失守，我就死在疆场，身膏野革。他日抗战胜利，你作为抗日名将，乘舰过吴淞口时，如有波涛如山，那就是我来见你了。"
sino_event.231.f:0 "吴淞口阵地已被日军三面包围，炮声震彻云霄，硝烟遮蔽日月。守军将士在弹尽粮绝之际，仍以刺刀、石块与敌肉搏，战壕中积尸如山，鲜血顺着堤岸汇入江水。指挥官在给上级的绝笔信中写下此段，字里行间皆是断腕之勇——麾下将士已鏖战七昼夜，从团长到列兵无一人退缩，如今仅剩百余残兵仍据守最后一处碉堡，身后便是淞沪腹地的万千百姓。信笺在炮火中数次被弹片划破，墨迹混着血渍凝成暗红的斑痕，却字字如炬，照见以身殉国的决绝。"
sino_event.231.a:0 "晚风轻，晚风悠，晚风与君皆难留"

sino_event.232.t:0 "何以家为"
sino_event.232.d:0 "此去倘能生还，固属万幸，如有不测，亦勿悲戚，但好好抚养儿女，孝奉翁姑。"
sino_event.232.f:0 "“吾妻见字如面，今倭寇犯境，国难当头，吾身为军人，唯有奔赴前线，以血肉之躯护家国周全。此去战场，生死难料，倘能侥幸生还，定当日夜兼程归乡，与你和孩儿相守；若不幸殒命，亦勿为我悲戚。家中诸事，全仗你一力支撑，还望好生抚养儿女，教他们明事理、爱家国，更要替我多尽孝心，侍奉爹娘左右。待他日倭寇被逐，疆土光复，便是我魂归故里之时。”"
sino_event.232.a:0 "倭寇未驱，疆土未复，纵有家千万，亦难安身。"

sino_event.233.t:0 "死字旗"
sino_event.233.d:0 "我不愿你在我近前尽孝，只愿你在民族分上尽忠。"
sino_event.233.f:0 "国难当头，日寇狰狞。国家兴亡，匹夫有分。本欲服役，奈过年龄。幸吾有子，自觉请缨。赐旗一面，时刻随身。伤时拭血，死后裹身。勇往直前，勿忘本分。"
sino_event.233.a:0 "为什么我的眼里总是饱含热泪!\n因为我爱这片土地爱的深沉！"

sino_event.234.t:0 "日本投降"
sino_event.234.d:0 "“朕深鉴于世界大势及帝国之现状，欲采取非常之措施，收拾时局，兹告尔等臣民，朕已饬令帝国政府通告美、英、中、苏四国，愿接受其联合公告。”——[SCOPE.sCharacter('ruler_scope').GetFirstName]"
sino_event.234.f:0 "告慰三千八百万亡灵，自九一八事起，倭寇犯境，华夏遭劫，生灵涂炭，已历十四载。我军民同心，浴血奋战，寸土必争，虽牺牲惨重，然斗志愈坚。我华夏儿女未屈，以血肉为长城，以忠魂为火炬，前仆后继，誓逐凶顽。倭寇势穷力竭，再难顽抗，终在投降书上俯首，宣告其侵略之梦破碎。\n\n消息传至[concept_shenzhou]，万众欢腾，街巷之间，爆竹声不绝，老幼相泣，皆感胜利之艰。昔日焦土，将渐生新绿；离散骨肉，终可团圆。"
sino_event.234.a:0 "家祭无忘告乃翁..."

sino_event.235.t:0 "山河倾覆"
sino_event.235.d:0 "天既昏沉，地亦崩裂。华夏子孙，临此末路，百感交集。溯我神州，上下五千年，文明未绝，何其壮哉！"
sino_event.235.f:0 "昔轩辕定鼎，划野分州，制礼作乐，民始有归。商周鼎革，斯文渐兴；秦汉一统，书同文、车同轨，威加四海。魏晋风度，玄学流芳；隋唐盛世，万邦来朝，诗歌之盛，冠绝古今。宋明以降，理学昌明，技艺精进，虽有兴衰，文脉未断。\n然今大限已至，外敌入侵，山河倾覆，城郭为墟。忆昔先民筚路蓝缕，辟草莱、治江河，传薪火于不绝；念及志士仁人，当国难之时，或投笔从戎，或沥血著书，欲挽狂澜于既倒。\n愿后世若有知者，见此残迹，知曾有一族，名华夏；曾有一国，曰中国。其民勤劳智慧，其史波澜壮阔。虽终寂灭，亦曾灿烂于寰宇。\n呜乎！悠悠苍天，何薄于我，天欲绝我，唯祷魂归故土，与先祖同眠于黄土之下。永别了，我之中国！"
sino_event.235.a:0 "为什么我的眼里总是饱含热泪..."

sino_event.236.t:0 "[SCOPE.sState('han_state').GetName]大屠杀"
sino_event.236.d:0 "[SCOPE.sCharacter('empire_character').GetFullName],[SCOPE.sCharacter('fascist_character').GetFullName]已放任手下的士兵在[SCOPE.sState('han_state').GetName]胡作非为"
sino_event.236.f:0 "日军进城后，烧杀抢掠，无恶不作。他们对手无寸铁的平民和放下武器的士兵展开了疯狂的屠杀，手段极其残忍。或用机枪扫射，或用刺刀捅刺，或纵火焚烧，甚至进行杀人比赛取乐。大街小巷尸横遍野，秦淮河里漂浮着无数尸体，整个[SCOPE.sState('han_state').GetName]沦为一座血腥的人间地狱。\n\n除了疯狂的杀戮，日军还对[SCOPE.sState('han_state').GetName]的妇女进行了大规模的强奸和蹂躏。同时对[SCOPE.sState('han_state').GetName]进行了肆无忌惮的抢劫和破坏，商铺被洗劫一空，古建筑被焚烧毁坏，无数珍贵的文物古迹在战火中化为灰烬，这座有着悠久历史的文化名城遭受了前所未有的浩劫。"
sino_event.236.a:0 "每个日本人的手上都沾满了鲜血"

sino_event.237.t:0 "[SCOPE.sState('chi_state').GetName]人体实验"
sino_event.237.d:0 "[SCOPE.sCharacter('empire_character').GetFullName],[SCOPE.sCharacter('fascist_character').GetFullName]已秘密吩咐手下的士兵在[SCOPE.sState('chi_state').GetName]建造集中营以批量对战俘进行惨无人道的人体实验"
sino_event.237.f:0 "将中国平民、战俘视作没有生命的“实验材料”，冠以“马路大”的侮辱性称谓，在冰冷的实验室里，他们无视人类基本的良知与道德，强行向实验者体内注射鼠疫、霍乱、炭疽等烈性病菌，观察其发病过程，记录痛苦的挣扎与死亡的轨迹，只为收集所谓的 “实验数据”。更令人发指的是，他们会在不施麻醉的情况下，对活人体内的器官进行活体解剖，看着实验者在剧痛中死去，脸上竟毫无愧色。\n\n将实验者的四肢浸泡在冰水中，直至冻僵，再用各种方法解冻，观察组织坏死的情况，无数人因此落下终身残疾或直接被折磨致死。他们甚至模拟战场环境，进行毒气实验，将实验者关在密闭空间，释放毒气，看着他们痛苦地窒息、抽搐，以此测试毒气的杀伤力。"
sino_event.237.a:0 "每个日本人的手上都沾满了鲜血"

sino_event.240.t:0 "《波兹坦公告》"
sino_event.240.d:0 "[SCOPE.sCountry('usa_scope').GetName]、[SCOPE.sCountry('gbr_scope').GetName]及[SCOPE.sCountry('chi_scope').GetName]之庞大陆、海、军部队，业已增强多倍，其由西方调来之军队及空军，即将予[SCOPE.sCountry('jap_scope').GetName]以最后之打击，彼等之武力受所有联合国之决心之支持及鼓励，对日作战，不至其停止抵抗不止。"
sino_event.240.f:0 "法西斯祸乱天下，侵凌诸国，涂炭生民，举世共愤。今中美英苏等国，捐弃前嫌，缔结盟约，合天下正义之力，共讨元凶。#v 《波茨坦公告》#!昭告四海：倭寇若不速降，必受天罚，其国将遭毁灭性打击，军国余孽无遗类矣。\n\n同盟诸国厉兵秣马，舰炮指其巢穴，战机巡其空域，势如雷霆万钧。此非恫吓，乃顺天应人之举。盖侵略者之末路，唯有无条件投降一途，顽抗者终将化为齑粉。"
sino_event.240.a:0 "通告日本政府立即宣布所有日本武装部队无条件投降，并以此种行动诚意实行予以适当之各项保证，除此一途，日本即将迅速完全毁灭。"

sino_event.241.t:0 "东京审判"​
sino_event.241.d:0 "硝烟散尽，正义当彰，对战争罪犯的审判，是对千万亡魂的告慰，亦是对和平的坚守。"​
sino_event.241.f:0 "二战落幕，昔日肆虐的法西斯战犯终将面对正义的裁决。东京审判庭上，来自[SCOPE.sCountry('usa_scope').GetName]、[SCOPE.sCountry('gbr_scope').GetName]及[SCOPE.sCountry('chi_scope').GetName]等十一国的法官端坐席上，控辩双方激烈交锋。大量铁证被呈上——泛黄的日记记录着屠城的细节，幸存者的泣诉揭露着暴行的真相，影像资料还原着战火中的疮痍。[SCOPE.sCharacter('empire_character').GetFullName],[SCOPE.sCharacter('fascist_character').GetFullName]等甲级战犯在证据面前，或狡辩抵赖，或沉默认罪。这场审判历时两年半，最终将一批双手沾满鲜血的战犯绳之以法，虽未能尽惩所有恶人，却以法律之名宣告了侵略行为的罪恶，为后世留下警示。"​
sino_event.241.a:0 "以法为剑，明辨是非，让战犯伏法，以慰逝者，以儆来者"​

sino_event.242.t:0 "审判[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]"​
sino_event.242.d:0 "[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]身为日本国家象征，对侵略战争难辞其咎，审判之议，关乎历史公正。"​
sino_event.242.f:0 "日本[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]在战时被奉为“神之化身”，其旨意成为推动侵略战争的重要力量。战后，关于是否审判天皇的争议牵动世界。中国及众多受害国人民强烈呼吁追究其战争责任——正是在[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]的名义下，日军铁蹄踏遍亚洲，千万家庭支离破碎。然因复杂的国际局势和[SCOPE.sCountry('usa_scope').GetName]等国与[SCOPE.sCountry('jap_scope').GetName]先前达成的秘密协议：战后保证[SCOPE.sCountry('jap_scope').GetName]的#yellow 天皇制#!来换取[SCOPE.sCountry('jap_scope').GetName]的无条件投降。审判[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]，并不是一件容易的事"​
sino_event.242.a:0 "不顾先前协议，坚决要求处死[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]"
sino_event.242.b:0 "让[SCOPE.sCountry('jap_scope').GetName]支付巨额战争赔款优先来弥补对我国的战争创伤"

sino_event.243.t:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName][Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]病危"​
sino_event.243.d:0 "朕自践祚，革故鼎新，以图中兴。废藩置县，整军经武，兴学堂，开实业，布国威于四方。然近日以来，神思倦怠，气血衰微，药石罔效。念及社稷永续，神器有归，[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]已渐长成，可承宗庙。朝野臣民，当各安其职，勿生惊扰。愿上苍垂佑，祚我大和。——[SCOPE.sCharacter('crisis_scope_2').GetFirstName]"​
sino_event.243.f:0 "自[SCOPE.sCharacter('crisis_scope_2').GetFirstName][Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]临御以来，革故鼎新，开疆拓土，国势日隆。然近日天颜憔悴，龙体违和，太医束手，药石罔效。宫中急报传出，诸臣闻之，皆免冠顿首于外，忧心忡忡。昔日朝堂之上，[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]雄姿英发，决策千里；如今病榻之前，气息奄奄，难理万机。国之柱石，似有倾颓之危，朝野内外，人心惶惶。"​
sino_event.243.a:0 "[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]#yellow 嘉仁#!聪慧仁孝，已具承继之姿，臣等当竭尽心力辅佐，代摄国政，以安社稷。"​

sino_event.244.t:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName][Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]病危"​
sino_event.244.d:0 "朕承先帝之遗烈，嗣守神器，夙夜兢兢，冀继明治之盛。奈何天不假年，痼疾缠身，久卧深宫，不复亲理庶政。念及宗庙社稷之重，黎民百姓之安，朕心难安。今布告天下，凡有司百僚，当恪尽职守，同心同德，共扶国本。愿苍天佑我邦家，佑朕躬得臻康豫，再临轩陛，以慰万民之望。——[SCOPE.sCharacter('crisis_scope_2').GetFirstName]"
sino_event.244.f:0 "自[SCOPE.sCharacter('crisis_scope_2').GetFirstName][Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]登基以来，承#yellow 明治#!之基业，欲续盛世之景。奈何天不假年，圣体多疾，近来更是沉疴难起，久居深宫，不复临朝。诸臣每入内请安，见[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]形容枯槁，言语乏力，无不心痛如绞。国无君主亲政，如舟失舵，政务堆积，人心渐浮。"
sino_event.244.a:0 "[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]#yellow 裕仁#!明达睿哲，堪当重任，臣等必同心协力，竭尽股肱之力辅佐，代掌庶政，守宗庙，安万民"​

sino_event.245.t:0 "时维[SCOPE.sCharacter('crisis_scope_2').GetFirstName]年间，[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]赐#yellow 嘉仁#!为[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]"​
sino_event.245.d:0 "特册为#yellow 嘉仁#![Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]，以固国本"
sino_event.245.f:0 "[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]遂下旨，于宫中举行册立大典。当日，仪仗威严，礼乐齐鸣，#yellow 嘉仁#!身着[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]礼服，跪拜受册，礼成之后，接受百官朝贺。此举既定皇储，亦安万民之心，朝野上下皆称善，以为皇室后继有人，邦家可保长治久安。"
sino_event.245.a:0 "望#yellow 嘉仁#!勤学不辍，砥砺德行，他日承继大统，不负宗庙社稷之托"​

sino_event.246.t:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName]年间，国泰民安，[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]赐#yellow 裕仁#!为[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]"​
sino_event.246.d:0 "皇长子#yellow 裕仁#!，英睿天成，册为皇太子，以承大统。"
sino_event.246.f:0 "[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]感于国本需定，乃择吉日，昭告宗庙，册立#yellow 裕仁#!为[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]。大典之上，#yellow 裕仁#!从容受册，神情肃穆，百官观之，皆叹其有王者气象。消息传至民间，百姓亦感欣慰，谓皇储得人，国家有望，一时称颂之声不绝。"
sino_event.246.a:0 "#yellow 裕仁#!当以社稷为重，精研治术，广纳贤言，为日后君临天下奠定根基。"​

sino_event.247.t:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName]年间，[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]赐皇次子#yellow 明仁#!为[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]"​
sino_event.247.d:0 "皇次子#yellow 明仁#!，仁孝兼备，特册[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]，以续宗祧。"
sino_event.247.f:0 "皇次子#yellow 明仁#!已长大成人，性仁厚，识大体，于学问、礼仪之道皆有涉猎，深得皇室与国民喜爱。[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]念及皇位传承之重，遂下诏册立为[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]。册立之日，宫中仪式庄重，#yellow 明仁#!恭谨受册，可承先志，纷纷祈愿其早日学成，肩负起守护宗庙、治理国家之责。"
sino_event.247.a:0 "[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]#yellow 明仁#!常怀仁心，励精图治，承先祖之业，福泽万民"​

sino_event.252.t:"陈京莹家书"
sino_event.252.d:"#black 父亲大人：                                            #!"
sino_event.252.f:"#black                    此次提笔，心情沉重。如今国家逢此大变，外敌悍然发动侵略战争。儿身为北洋水师一员，目睹局势，心中忧虑万分。\n                   海战形势不容乐观，我方仅有北洋数舰可供海战，而敌方战舰众多。南洋及各省差船，不但毫无操练，舰船本身更是脆弱不堪。儿深知，此战我军胜算或许只有三成。但北洋水师的全体员弁，明知局势险峻，亦不敢有丝毫退缩。往昔马江之战，福建水师全军覆没的前车之鉴仍历历在目，如今大家虽战战兢兢，却因平日受国家爵禄之恩，只能抱定必死决心，奋勇御敌\n                   海战爆发以来，军务繁忙，儿常常无暇他顾。此信仓促间写就，尚未完成，便又有事缠身。若有家眷在威海者，将衣……"
sino_event.252.a: "来自[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]"

sino_event.253.t:"陈京莹绝笔"
sino_event.253.d:"#black 父亲大人：                                            #!"
sino_event.253.f:"#black                    兹际国家有事，理应尽忠，此乃人臣之本分，更何况大丈夫能战死在战场，亦是幸事。只是父亲大人年事已高，若儿遭遇不测，定会令您格外悲伤，儿对此心知肚明。但自古忠孝难以两全，如今儿选择尽忠，不能在您身边尽孝，这不孝之罪，恐怕难以逃脱天地的责难。\n                   儿深知此战凶险万分，可儿绝不退缩。若能保家卫国，战死沙场，儿亦无怨无悔。只望父亲大人多多保重身体，莫要太过挂念儿。\n                                                         儿陈京莹绝笔"
sino_event.253.a: "来自[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]"

sino_event.254.t:"致袁生财"
sino_event.254.d:"#black 吾儿生财：                                            #!"
sino_event.254.f:"#black                   为父提笔，满心悲苦。家中如今已是穷困潦倒，难以为继。为父身患重病，病入膏肓，却无钱医治。如今就连房租都已到期，家中实在拿不出钱来交付，房东已多次催促，下了最后通牒。\n                   家中早已断炊，四处借债无门。为父如今连死后的棺材和寿衣都无力筹备，后事更是不知如何操办。吾儿，为父如今唯一的指望就是你了。你在军中，可否想办法寄些银两回家，救救这个家。为父时日无多，只盼能在闭眼之前，看到家中困境有所缓解。\n                   吾儿，你在军中一切可好？为父日夜牵挂。只是家中实在太过艰难，不得不向你开口。你若能筹到钱，务必速速寄回，莫要耽搁。\n                   家中诸事，让为父心力交瘁。盼儿能早日回信，告知近况。\n                                                         家中的老父亲"
sino_event.254.a: "来自[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]"

sino_event.255.t:"致屠阿祥"
sino_event.255.d:"#black 贤婿阿祥：                                            #!"
sino_event.255.f:"#black                   近来可好？家中有些事，要告知于你。你的妻子，也就是我的女儿，前些日子生下了一个儿子，母子平安，你这下可做父亲了。只是女儿与婆家有些不和，如今抱着尚未满月的孩子，回到了娘家居住。\n                   前些时日，女儿给你寄去了一些衣服等生活用品，也不知你是否收到。你收到东西后，务必回信告知一声，也好让她安心。她在娘家一切都好，只是时常挂念你在军中的安危。\n                   如今兵荒马乱，在外从军，一定要多加小心。家中之事，你也无需太过忧心，我与你岳母会照顾好女儿和孩子。只盼你能在军中一切顺遂，早日平安归来。\n\n                                                         岳父洪仁金"
sino_event.255.a: "来自[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]"

sino_event.256.t:"与妻书"
sino_event.256.d:"#black 意映卿卿如晤：                                            #!"
sino_event.256.f:"#black 吾今以此书与汝永别矣！吾作此书时，尚是世中一人；汝看此书时，吾已成为阴间一鬼。吾作此书，泪珠和笔墨齐下，不能竟书而欲搁笔，又恐汝不察吾衷，谓吾忍舍汝而死，谓吾不知汝之不欲吾死也，故遂忍悲为汝言之。\n吾至爱汝，即此爱汝一念，使吾勇于就死也。吾自遇汝以来，常愿天下有情人都成眷属；然遍地腥云，满街狼犬，称心快意，几家能彀？司马春衫，吾不能学太上之忘情也。语云：仁者“老吾老，以及人之老；幼吾幼，以及人之幼”。吾充吾爱汝之心，助天下人爱其所爱，所以敢先汝而死，不顾汝也。汝体吾此心，于啼泣之余，亦以天下人为念，当亦乐牺牲吾身与汝身之福利，为天下人谋永福也。汝其勿悲！\n汝忆否？四五年前某夕，吾尝语曰：“与使吾先死也，无宁汝先吾而死。”汝初闻言而怒，后经吾婉解，虽不谓吾言为是，而亦无词相答。吾之意盖谓以汝之弱，必不能禁失吾之悲，吾先死，留苦与汝，吾心不忍，故宁请汝先死，吾担悲也。嗟夫！谁知吾卒先汝而死乎？\n吾真真不能忘汝也！\n今与汝无言矣。吾居九泉之下遥闻汝哭声，当哭相和也。吾平日不信有鬼，今则又望其真有。今人又言心电感应有道，吾亦望其言是实，则吾之死，吾灵尚依依旁汝也，汝不必以无侣悲。\n吾平生未尝以吾所志语汝，是吾不是处；然语之，又恐汝日日为吾担忧。吾牺牲百死而不辞，而使汝担忧，的的非吾所忍。吾爱汝至，所以为汝谋者惟恐未尽。汝幸而偶我，又何不幸而生今日之中国！吾幸而得汝，又何不幸而生今日之中国！卒不忍独善其身。嗟夫！巾短情长，所未尽者，尚有万千，汝可以模拟得之。吾今不能见汝矣！汝不能舍吾，其时时于梦中得我乎？一恸。辛未三月念六夜四鼓，意洞手书。\n家中诸母皆通文，有不解处，望请其指教，当尽吾意为幸。\n#black                                                                 夫林觉民绝笔#!#!"
sino_event.256.a: "来自[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]"

sino_event.257.t:"别告诉妈妈，我在阿富汗"
sino_event.257.d:"#black 我亲爱的妹妹：                                            #!"
sino_event.257.f:"#black 现在冬天，回家的路是不是被大雪覆盖？\n\n伴随着黎明的曙光，流星划破坎大哈的天空。\n\n你千万别告诉妈妈，我在阿富汗。\n\n现在是周六，大雨滂沱，还有那残酷的战争。\n\n夜晚战友们酣睡，空气中弥漫着汗臭味。\n\n我的战友奥列格，我打赌他一定能活下来。\n\n我亲爱的妹妹，请替我问候家里人。\n\n告诉家人们继续写信，我已经很久没有收到家乡的来信。\n\n如果亲友问我给你写了什么，别说实话。\n\n你千万别告诉妈妈，我在阿富汗。"
sino_event.257.a: "来自[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]"

sino_event.260.t:0 "[SCOPE.sCharacter('crisis_scope_2').GetFirstName][concept_japanese_emperor]崩御"​
sino_event.260.d:0 "朕临御三十余载，承先朝之休光，勤修庶政，冀安邦国。今寿数将尽，大限已至，虽念宗庙之重、黎民之苦，然天命难违。兹颁遗诏：国不可一日无君，诸卿当速奉东宫[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]#yellow 统仁#!嗣位，恪守祖制，同心辅政，护我大和之基业，安我万民之生计。愿神祇庇佑，邦国永固，苍生康宁。"
sino_event.260.f:0 "自[SCOPE.sCharacter('crisis_scope_2').GetFirstName][concept_japanese_emperor]在位三十有六载，躬行节俭，笃信儒术，承宽政之遗风，整饬纲纪，安抚民生。然晚年沉疴缠绵，虽经多方调治，终难回天。今龙驭上宾，宫车晏驾，举国缟素，朝野同悲。先帝遗诏虽定储君，然新君初立，根基未稳，外有列强环伺，内有庶政待理，人心惶惶，国祚面临考验。"
sino_event.260.a:0 "[Concept('concept_ruler','$RULER_TITLE_JAPHEIR$')]#yellow 统仁#!仁厚睿智，夙承先帝教诲，深谙治国之道。臣等敢不遵遗诏，率文武百官奉迎新君登基，竭忠尽智，辅佐新皇稳定朝局，抵御外侮，安抚百姓，以报先帝知遇之恩，以固我日本万世之基"​

sino_event.261.t:"致郑夫人・谪戍伊犁"
sino_event.261.d:"#v 郑夫人妆次#!"
sino_event.261.f:"自虎门禁烟，英夷构衅，朝廷罢斥，命余远戍伊犁。此皆为国除弊，生死祸福，早置度外。\n力微任重久神疲，再竭衰庸定不支。\n苟利国家生死以，岂因祸福避趋之。\n谪居正是君恩厚，养拙刚于戍卒宜。\n戏与山妻谈故事，试吟断送老头皮。\n夫人素知我性，不必为我悲伤。家中诸事，赖汝主持；儿女教诲，务须严正。清廉为本，安分做人，勿倚旧势，勿贪非分之财。\n吾虽远在绝域，心未尝一日忘国。倘有来日，必再图报国；若无归期，亦当含笑九泉。\n珍重。"
sino_event.261.a:"则徐手书-道光二十二年七月"

sino_event.262.t:"狱中与妻李闰书"
sino_event.262.d:"#v 夫人如见#!"
sino_event.262.f:"在鄂连寄数信，嗣于六月十六日起程，本月初五到京，事之忙迫，殆不胜述。朝廷毅然变法，国事大有可为。我因此益加奋勉，不欲自暇自逸。\n幸体气尚好，精神极健，一切可以放心。此后太忙，万难常写家信，请勿挂念。\n各国变法，无不从流血而成；今中国未闻有因变法而流血者，此国之所以不昌也。有之，请自嗣同始。\n我自横刀向天笑，去留肝胆两昆仑。\n望夫人珍重，善自排遣。勿以我为念，为国而死，死得其所。"
sino_event.262.a:"谭嗣同手书-光绪二十四年七月十一日"

sino_event.264.t:"环球旅行筹备"
sino_event.264.d:"内阁经过研究考核，认为雄心勃勃的[SCOPE.sCharacter('change_your_animations_now_character').GetFirstName]明识地理，善察风物，有能力胜任[SCOPE.GetRootScope.GetCountry.GetName]负责环球旅行的探险家一职。目前正在筹集资金和打通他国外交，以[SCOPE.GetRootScope.GetCountry.GetName]的名义，前往世界各国探索未知之域，研究当地的风俗，拓展母国的眼界并改善与他国的外交关系。"
sino_event.264.f:"巍峨群山，亚马逊雨林、极地冰封海岸、孤悬海外的群岛，所有未被人类丈量的土地都静静等候着[SCOPE.sCharacter('change_your_animations_now_character').GetFirstName]。\n\n“您为什么要登山，[SCOPE.sCharacter('change_your_animations_now_character').GetFirstName]？”\n\n“先生，因为山就在那里。”"
sino_event.264.a:"祝你好运，[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]。"
sino_event.264.b:"[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]表示另有打算,环球旅行计划暂时搁置10年。"
#china_borders事件##########################################################################################################################################################################
##中国疆域事件
china_borders.1.t:0 "皇清疆域极限"
china_borders.1.d:0 "朕抚有四海，常登景山之巅，望万里江山，忽思大清疆宇究竟几何？东到#yellow 沧海之滨#!，西至#yellow 流沙之畔#!，南抵#red 炎荒之域#!，北达#blue 冰原之陲#!，其间#green 沃野千里#!，城郭万千，实难尽述。"
china_borders.1.f:0 "问者不同，答亦有别。若问于草野匹夫，或曰#yellow “千里沃野，五谷丰登”#!；若问于边关将士，或曰#yellow “万里长城，固若金汤”#!。然朕以为，大清版图，岂有边界？凡日月所照之处，无论东海之岛、西域之沙，皆是王土；凡江河所至之地，无论长江九曲、黄河万里，尽属大清。"
china_borders.1.a:0 "昔汉武饮马瀚海，封狼居胥，后世称雄；今我大清，远迈前古。"
china_borders.1.b:0 "容朕三思！疆域之广，非一日之功"
china_borders.1.c:0 "帝国虽隆，亦需息兵。今与俄罗斯盟好，共固边疆可也。"

china_borders.2.t:0 "天不生中国，世界万古如长夜"
china_borders.2.d:0 "吾辈承天命，创此未有之奇迹于当世。自东极白令海峡，冰涛拍岸，立碑为界；西至极远之里海，碧波荡漾，设驿传书。其间山川纵横，皆入版图；各族生民，俱沐王恩。此边界既定，如磐石之固，永恒不移，传之万世而不变，使后世子孙，知我大清之盛。"
china_borders.2.f:0 "千军万马，由名将统率，驰骋于疆场之上，如入无人之境。北击罗刹，收雅克萨之地；南收台湾，设府县以治。攻城略地，如探囊取物，何难之有？昔日蛮夷之地，今日尽为我土；昔日未服之族，今日皆为我臣。"
china_borders.2.a:0 "幸哉大清！得天眷顾，疆土辽阔，远超往古。"

china_borders.3.t:0 "日域归清"
china_borders.3.d:0 "满洲之天聪汗，蒙古之博格达汗，中原之大皇帝，文殊菩萨之化身，东亚共主，朝鲜统治者、琉球统治者，西域大伊码目、渤海、契丹、女真、吐蕃、回鹘、和卓诸直指挥使，黄海渤海东海南海守护者。"
china_borders.3.f:0 "中原、满洲、蒙古、回部、西藏、朝鲜、琉球、安南、缅甸、暹罗、廓尔喀、浩罕、布鲁特、哈萨克、锡金、不丹、拉达克、葱岭诸城、台澎瀛洲、琼崖海疆，凡九百又五十疆域，皆列朕之版籍。赖昊天上帝之眷佑，承列祖列宗之洪业，朕为天下共主。"
china_borders.3.a:0 "吾皇万岁，万岁，万万岁！"

china_borders.4.t:0 "四海皆一统"
china_borders.4.d:0 "海月同天，潮声共听"
china_borders.4.f:0 "噫！昔日 “先发逐日”，非贪土地之广，实恐豺狼复噬；今日 “四海皆一统”，非炫武功之盛，乃求四海之宁。登高一望，万里波涛皆平静，九州烟火尽升平。当知兵戈之后，必有雍熙，此非一人之功，乃亿兆同心之效。"
china_borders.4.a:0 "昔为仇敌，今为一家"

china_borders.5.t:0 "#bule 青天#!#v 白日#!#red 满地红#!"
china_borders.5.d:0 "夫民族者，国家之根本，族群之魂魄。吾辈生于华夏，长于九州，血脉相连，荣辱与共。昔者列强环伺，割地赔款，民族蒙辱，百姓涂炭。今倡言民族主义，意在唤起同胞之自觉，共谋国家之独立，捍卫民族之尊严，使吾华夏子孙，永享自由平等之福祉。此民族之义也。"
china_borders.5.f:0 "民生者，百姓之生计，国家之根本。古语云：“民以食为天。”然则今日之中国，贫富悬殊，疾苦遍地，百姓之生活，困顿至极。故倡言民生主义，意在均贫富，兴实业，普及教育，改善医疗，俾吾国民，皆能安居乐业，共享太平之盛世。此民生之义也。\n\n民权者，民众之权利，国家之基石。昔者专制横行，人权不保，百姓如蝼蚁，生死由人。今倡言民权主义，意在推翻专制，建立共和，实行法治，保障人权，俾吾国民，皆能自由平等，参与国事，共谋国家之进步。此民权之义也。\n\n吾深知，家国情怀，重于泰山；个人生死，轻于鸿毛。故愿以此身，献于国家，献于民族，献于百姓。虽赴汤蹈火，粉身碎骨，亦在所不辞。"
china_borders.5.a:0 "当以此三民主义为纲领，团结一心，共赴国难，以建万世不拔之基业。"

china_borders.6.t:0 "琉球复国"
china_borders.6.d:0 "既助琉球复其社稷，余心甚慰。琉球古国，地处海疆，民风淳朴，文化瑰丽，曾辉煌于东洋之域。然世事沧桑，琉球不幸沦为他人之藩属，百姓流离失所，文化几近凋零。"
china_borders.6.f:0 "吾辈今以仁义之师，助其复国，非为图利，实为维护天下正义，彰显[concept_dsk_china]之德。琉球百姓，闻吾辈之举，无不欢欣鼓舞，感激涕零。当此之时，吾辈当与琉球君臣百姓，共谋发展大计，使其国运昌盛，文化繁荣。"
china_borders.6.a:0 "[concept_dsk_china]琉球，世代友好，共御外侮，共享太平."

china_borders.7.t:0 "半个世纪的和平"
china_borders.7.d:0 "吾辈当以此为契机，与兰芳公司携手并进，共谋发展大计。当兴办实业，繁荣经济，以富国强民；当弘扬文化，传承文明，以光我华夏之威。又当加强海防，训练水师，以防外夷之侵扰。如此，则我华夏子孙于海外之基业，可保万世不拔之基。
china_borders.7.f:0 "荷兰夷人既认兰芳公司之独立，余心甚喜。兰芳者，乃我华夏子孙于海外之创业基业，历经艰辛，方得今日之局。\n\n昔日荷兰夷人，仗其船坚炮利，肆意欺凌弱小，侵我海疆，夺我财富。然天道循环，报应不爽，今其终认兰芳之独立，实乃天理昭彰，人心所向。"
china_borders.7.a:0 "这是属于我们这一代人的和平。"

china_borders.8.t:0 "琉球加入中国"
china_borders.8.d:0 "琉球国者，素为中国之外藩，历史悠长，情谊深厚。一旦归顺[concept_dsk_china]，俯首称臣，共尊天朝之威仪，实乃天下大势之所趋也。自此以后，琉球人民与[concept_dsk_china]儿女共享太平之福，同舟共济，共创辉煌。天朝体恤远夷之情，赐以物资、技术，助其繁荣富强，琉球之国运遂昌盛。"
china_borders.8.f:0 "佑我华夏，礼仪之邦，以和为贵，不以邻为壑。琉球既入版图，吾民当怀包容之心，尊其风俗，敬其信仰，使其百姓如归故乡，无有异乡之感。\n\n且当开互市，通有无，使琉球之珍宝得以流通于中原，中原之百货亦得惠及于琉球，两国民众，各取所需，共谋富裕。\n\n又我华夏，文治武功，举世无双。当遣儒师，赴琉球教授经典，弘扬儒学，使其百姓知书达理，明辨是非。亦当派武师，授其武艺，强其体魄，使其能自保家国，共御外侮。\n\n如此，则琉球之国力强盛，文化繁荣，与我华夏，并肩而立，共为天下所敬仰。"
china_borders.8.a:0 "此乃吾辈之愿，亦天地之心"

china_borders.9.t:0 "琉球选择维持现状"
china_borders.9.d:0 "琉球古国，地处海隅，素有独立之志，不愿归属他邦。华夏大国，礼仪之邦，素以和为贵，不以力服人。闻琉球之意，华夏朝廷深表理解，赞其维持现状之决定，不以强权相迫"
china_borders.9.f:0 "夫国与国之间，交往之道，在于以诚相待，互尊互信。琉球既不愿归属华夏，华夏亦不强求。吾辈当以和平共处为要，各遵秩序，各安其分。愿琉球与华夏，共谋发展，共享繁荣，携手并进，共创未来。\n\n又华夏大国，文化灿烂，历史悠久。吾辈当弘扬文化，传承文明，与琉球人民共赏[concept_dsk_china]文化之美，共筑友谊之桥。愿两国人民，世代友好，永结同心，共享太平之福。"
china_borders.9.a:0 "此乃吾辈之愿，亦天地之心"

china_borders.11.t:0 "寸步难行"​
china_borders.11.d:0 "邻邦烽火连三月，强虏铁蹄踏碎城郭。观其境内，庐舍为墟，白骨露于野，千里无鸡鸣。百姓扶老携幼，逃窜于荒野，饿殍遍野，惨状目不忍视。吾国唇齿相依，外患已越界而来，边疆烽燧频传，警报日至，朝野上下，皆扼腕叹息，心忧如焚。"​
china_borders.11.f:0 "夫邻邦之厄，实乃吾国之警。唇亡则齿寒，户破则堂危。当此之际，匹夫岂容袖手？须聚四海之心，凝九州之力，振臂高呼，共赴国难。愿以吾辈血肉为盾，挡胡骑于塞外；以吾辈筋骨为梁，支将倾之大厦。若能使邻邦复安，吾国得宁，纵粉身碎骨，亦在所不辞。"​
china_borders.11.a:0 "多难兴邦，吾辈当勉力前行。"

china_borders.12.t:0 "南洋风浪"
china_borders.12.d:0 "南洋之地，自古繁华，物产丰饶，百姓安居乐业。然不幸遭逢敌寇之侵，铁蹄践踏，山河破碎，吾心之痛，如焚如割。夫南洋之失，非仅一地之陷落，实乃吾华族之辱，国家之痛。敌寇之凶残，烧杀抢掠，无所不为，百姓流离失所，哭声震天，吾闻之，痛心疾首，泪如雨下。"
china_borders.12.f:0 "吾思南洋之民，勤劳善良，与世无争，今遭此大难，实乃天数之不幸。然吾辈岂能坐视不理，当奋发图强，誓雪国耻。愿吾华夏子孙，同仇敌忾，共赴国难，驱逐敌寇，恢复南洋之失地。"
china_borders.12.a:0 "吾亦知，国难之际，当以大局为重，不可意气用事。"

china_borders.13.t:0 "国策：划定“十一段线”"
china_borders.13.d:0 "#o ‘十一段线’#!，这是[ROOT.GetCountry.GetAdjective]在南海的战略屏障，涉及的区域辽阔，资源丰富，事关国运兴衰。十九世纪的[ROOT.GetCountry.GetAdjective]，饱受[concept_great_power]侵扰，海疆被视作不稳之地。而今天，帝国必将振作，捍卫每一寸海疆，确保国家利益不受侵犯。划定‘十一段线’，是为了确保国家在全球海洋贸易中的地位，保障经济与安全的未来。"
china_borders.13.f:0 "早在秦汉时期，[ROOT.GetCountry.GetAdjective]便已对南海海域有了明确的记载与管辖，此后历代王朝都对南海诸岛进行了有效的治理与开发。从渔民的世代劳作，到官方的巡视册封，无数史实都昭示着南海是中国领土不可分割的一部分。南海不仅是资源宝地，更是东西方交流的咽喉要地。过去的屈辱，让我们痛心疾首。今日的‘十一段线’，是为了捍卫这片海域的主权，防止[concept_great_power]再度侵扰。"
china_borders.13.a:0 "是我的永远属于我！"

china_borders.14.t:0 "新岭北行省"
china_borders.14.d:0 "吾心欢腾，喜悦之情，难以自禁，不禁抚掌大笑，喜形于色"
china_borders.14.f:0 "昔日岭北之地，战乱频仍，百姓流离失所，苦不堪言。今得重新建立行省，实乃国家之幸，民族之福。吾辈历经千辛万苦，终得此胜，实乃天佑[concept_dsk_china]，吾辈之功也。\n\n新岭北行省，地势险要，物产丰饶，百姓勤劳善良。今得重归祖国怀抱，必将为国家之繁荣，民族之振兴，作出巨大贡献。吾辈当以此为契机，兴办实业，繁荣经济，以富国强民；加强边防，巩固国防，以保国家之安宁。"
china_borders.14.a:0 "行省初建，百事待兴！"

china_borders.15.t:0 "新岭北行省"
china_borders.15.d:0 "吾心欢腾，喜悦之情，难以自禁，不禁抚掌大笑，喜形于色"
china_borders.15.f:0 "吾辈当同心协力，共谋发展，以造福百姓，振兴[concept_dsk_china]。愿新岭北行省，永远繁荣昌盛；愿吾华夏子孙，永远团结一心，共赴美好之未来。"
china_borders.15.a:0 "行省初建，百事待兴！"

china_borders.16.t:0 "新西域都护府"
china_borders.16.d:0 "都护府既复立，吾心之喜，溢于言表"
china_borders.16.f:0 "西域之地，广袤无垠，物产丰饶，自古为[concept_dsk_china]之瑰宝。然世事沧桑，曾遭外敌侵扰，百姓受苦，文化受损。今得重新建立都护府，实乃国家之盛事，民族之荣光。\n\n吾辈历经艰辛，驱逐外敌，恢复[concept_dsk_china]之领土完整，实乃天佑[concept_dsk_china]，吾辈之功也。新西域都护府之立，必将为国家之繁荣，民族之昌盛，注入新的活力。"
china_borders.16.a:0 "光耀[concept_dsk_china]之史册，永载民族之辉煌！"

china_borders.17.t:0 "新西域都护府"
china_borders.17.d:0 "如日初升，光照万里，吾心之喜，难以言表"
china_borders.17.f:0 "昔者，张骞使西域，踏沙涉雪，历万难而返，其志如铁，其心如磐，犹龙跃骏马，驰骋于无垠之漠，为[concept_dsk_china]开西域之先河\n\n再者，霍去病将军，英勇无双，挥戈西域，斩将搴旗，如猛虎下山，势不可挡。其战鼓之声，震天动地，其英勇之姿，永载史册。彼二人者，皆我[concept_dsk_china]之骄子，其功勋卓著，永垂不朽\n\n今者，新西域都护府之建立，犹如张骞、霍去病之精神再现。吾辈承前启后，继往开来，以铁血铸就边疆，以智慧繁荣西域。此皆天佑[concept_dsk_china]，吾辈之功也"
china_borders.17.a:0 "愿此壮举，光照千秋，永垂不朽！"

china_borders.19.t: "《中美共同防御条约》"
china_borders.19.d: "[concept_dsk_china]民国政府请求与我们签订共同防御条约以捍卫共同的民主价值观"
china_borders.19.f: "条约规定:①双方以自助和互助的方式维持并发展其个别及集体的能力。②双方保证加强其自由制度。③承认在西太平洋地区内对缔约任何一方的武装进攻将危及其本身的和平与安全，并宣告将依其法律程序采取行动..."
china_borders.19.a: "我们与[concept_dsk_china]民国的关系密不可分"
china_borders.19.b: "不是现在"

china_borders.20.t: "东非之角"
china_borders.20.d: "控制东非之角将使我们的海外贸易成倍增长。"
china_borders.20.f: "非洲之角也是非洲沿海港口网络的一部分，它和波斯湾一样是环印度洋古代商道的一部分。"
china_borders.20.a: "我们将成为该地区最大的贸易商。"

china_borders.21.t:0 "[SCOPE.sCharacter('gaixin').GetFullName]的上奏"
china_borders.21.d:0 "自[SCOPE.sGoods('opium_scope').GetName]大量涌入[SCOPE.sCountry('chi_scope').GetAdjective]以来，以及造成了不可估量的影响。白银不断外流，已开始扰乱国家的国库和货币的流通，大大地摧残了吸食者的身心健康，使我国的经济面临崩溃的边缘！"
china_borders.21.f:0 "“若[SCOPE.sGoods('opium_scope').GetName]一日未绝,本大臣一日不回,誓与此事相始终,断无中止之理。”—[SCOPE.sCharacter('gaixin').GetFullName]"
china_borders.21.a:0 "休想让[SCOPE.sGoods('opium_scope').GetName]继续祸害我们"
china_borders.21.b:0 "[SCOPE.sCharacter('gaixin').GetFullName],管好你自己的烂摊子"

#open_japan事件##########################################################################################################################################################################
##日本内政事件
open_japan.1.t:0 "黑船来航"
open_japan.1.d:0 "[SCOPE.sCountry('usa_scope').GetName]要求我们开国"
open_japan.1.f:0 "一支来自[SCOPE.sCountry('usa_scope').GetName]的舰队已经抵达我们的一个港口，要求开放日本市场。如果我们拒绝，我们可能会遭受中国在鸦片战争中的命运。如果我们屈服，旭日之地将永远改变200年的孤立主义。"
open_japan.1.a:0 "我们决不会屈服于这些野蛮人！！"
open_japan.1.b:0 "我们必须学会如何与世界共存。"

open_japan.2.t:0 "违反锁国" 
open_japan.2.d:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName]的[Concept('concept_ruler','$RULER_TITLE_SHOGUN$')][ROOT.GetCountry.GetRuler.GetFirstName]就[SCOPE.sLaw('current_law_scope').GetName]的制定，以违反[ROOT.GetCountry.GetAdjective]国策为由对该提案提出反对" 
open_japan.2.f:0 "“清国道光年间，英夷以鸦片构兵，破广州，陷江宁，逼订城下之盟，割香港，索赔款，主权尽失。夫外夷之性，得寸则求尺。我若开港，彼必以舰队为后盾，索租界，掠资源，不出十年，我邦将为清国之续”——泽正志斋" 
open_japan.2.a:0 "日本地大物博，五谷丰登，布帛自足，无需依赖对外贸易" 

open_japan.3.t:0 "尊王攘夷" 
open_japan.3.d:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName]无权代表[ROOT.GetCountry.GetAdjective]与外夷签约，唯有[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]亲政才能凝聚全国力量攘夷" 
open_japan.3.f:0 "“夫[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]者，神裔也，代天治民，万世不易。[ROOT.GetCountry.GetRuler.GetLastName]氏虽受太阁（丰臣秀吉）与[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]之托掌政，然今者，外夷叩关，彼不奋起拒之，反以‘国力不足’为名，私与外夷订约，割我利权，是为‘欺君罔民’！君权旁落于臣下，国将不国；唯有奉[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]亲政，发诏天下，令诸藩合力攘夷，方为正途”——吉田松阴" 
open_japan.3.a:0 "妥协即亡国，以武力驱逐外夷，哪怕国力不足，也需以大义示天下" 

open_japan.4.t:0 "安政大狱"
open_japan.4.d:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName]以#bold 不敬#!为名大肆搜捕尊王攘夷志士，试图以铁腕镇压反对开国的声音"
open_japan.4.f:0 "1858年，大老#yellow 井伊直弼#!未经[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]敕许签订《日美友好通商条约》，引发尊攘派强烈不满。[SCOPE.gsInterestGroup('shougun_ig').GetName]为巩固统治，掀起全国性镇压，#yellow 吉田松阴#!等数十名志士被处死，数百人遭监禁。"
open_japan.4.a:0 "政治迫害一旦开始，不会轻易妥协"

open_japan.5.t:0 "樱田门外之变"
open_japan.5.d:0 "水户藩浪人于#yellow 江户#!樱田门行刺#yellow 井伊直弼#!"
open_japan.5.f:0 "1860年3月，寒风卷着樱花掠过江户街头。#yellow 井伊直弼#!的仪仗行至樱田门时，十八名水户藩浪人突然杀出，刀光映着白雪，大老的轿子在乱战中倾塌。刺客们高呼#v 「还我[concept_shenzhou]」#!，#yellow 井伊直弼#!立刻血溅当场"
open_japan.5.a:0 "一群暴徒无法无天！"

open_japan.6.t:0 "生野之变"
open_japan.6.d:0 "[SCOPE.sState('beautiful_state').GetName]但马生野举兵讨幕"
open_japan.6.f:0 "为响应大和“天诛组”举兵，福冈藩士#yellow 平野国臣#!等拥戴流亡的七名公卿之一#yellow 泽宣嘉#!为首，并有来自长州的奇兵队员参加，在周围地主的支持下动员农兵两千人，于10月12日占领代官府。[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]下令邻近各藩进攻，#yellow 泽宣嘉#!逃出，举兵者分裂，农兵叛离，平野被捕"
open_japan.6.a:0 "是不是没死过"
open_japan.6.b:0 "蒜鸟蒜鸟"

open_japan.7.t:0 "天狗党之乱"
open_japan.7.d:0 "水户藩天狗党以#RED 「天诛」#!为名举兵，掀起大规模#Yellow 尊王攘夷#!武装叛乱"
open_japan.7.f:0 "1864年，水户藩的天狗党武士们头戴头巾，高呼「杀尽夷狄、重振皇威」，在筑波山举兵。他们不满藩主对[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]的妥协，试图以武力推进攘夷，一度占领多处要地。[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]调集大军围剿，叛军在饥寒中溃散，主要成员被斩首"
open_japan.7.a:0 "#yellow 平冈浩太郎#!切腹前叹道：我等虽败，天下志士必继之。"

open_japan.8.t:0 "禁门之变"
open_japan.8.d:0 "长州藩尊攘派率军进攻京都禁门，与[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]联军激战于蛤御门"
open_japan.8.f:0 "1864年8月，长州藩藩兵打着「尊王攘夷」的旗号，猛攻蛤御门、堀川门等禁门，试图驱逐京都的[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]势力。萨摩、会津等藩联军死守城门，炮火烧毁了数町的屋舍。长州兵最终溃败，京都街头留下数百具尸体。"
open_japan.8.a:0 "一群“朝敌”还敢负隅顽抗"

open_japan.9.t:0 "戊辰战争"
open_japan.9.d:0 "1868年正月，鸟羽伏见，倒幕军高举「大政奉还」的锦旗，与[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]军的火枪队对射。从#yellow 京都#!到#yellow 江户#!，从#yellow 东北#!到#yellow 北海道#!，战火席卷列岛。以萨摩、长州藩为首的倒幕军与幕府军展开全国性决战，终结德川三百年霸业"
open_japan.9.f:0 "“窃以天下者，[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]之天下也；兆民者，[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]之兆民也。自德川氏窃据大位，三百年于兹，上则壅蔽圣听，下则鱼肉苍生，外则辱国丧权，内则毒流四海，罪迹昭彰，罄竹难书。今朕奉天承运，举义兵以清君侧，布大义于寰宇，敢昭告于外邦诸友：\n\n一曰僭越神器。\n二曰误国辱邦。\n三曰虐杀忠良。\n四曰暴敛无度。\n五曰分裂邦土。\n六曰废弛武备。\n七曰矫诏欺世。\n\n夫七罪之中，任一可诛，况兼而有之！今朕已下#o 《王政复古大号令》#!，收还政权，复我纪纲。萨摩、长州诸藩忠义之士，已举义旗，西指江户，誓诛元恶，以清妖氛。\n\n朕闻外邦皆尚公理，重信义。德川氏之与诸邦所订盟约，多非[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]本意，皆其私约也。待乱平之后，朕将择贤与诸邦重议邦交，凡属平等互利者，必当恪守；若有违我主权、辱我国体者，一概更张。\n\n#v 顺天者昌，逆天者亡。德川氏之亡，可立而待。愿诸邦共观厥成，待我中兴，再修旧好，共享太平。#!”"
open_japan.9.a:0 "[Concept('concept_ruler','$RULER_TITLE_MIKADO$')]萬歲！"

open_japan.10.t:0 "人间宣言"
open_japan.10.d:0 "[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]下诏否定神格，明言自身为凡人，破除‘神国’之旧说，开启政教分离之新局"
open_japan.10.f:0 "“朕与尔等国民之间，久存虚构之神话，谓朕为神裔、不类凡人。然朕实乃普通一民，与尔等共沐世间风雨\n\n朕之政府，本为纾民之困、解兆民之艰厄而设，是以治世施政，皆为此故。今当更颁新政，遍布方策，以济民于艰，解民于厄。\n\n朕亦望兆民，于困厄中奋起，克当前之艰，兴复文运，励志迈进。愿我族在庶政之间，蔚然成精诚团结、相扶相助、宽仁厚德之风；将国之至道、知耻之懿德，发扬光大，致其极也。\n\n朕固信，我民于天下之福，必有贡献，此无可疑。一年之计在于春，朕与所信赖之国民，当上下同心，自勉互励，则大业庶几可成矣！"
open_japan.10.a:0 "从此以后，不在神格之虚，而在万民之实"

open_japan.11.t:0 "伊势神宫大祭"
open_japan.11.d:0 "依循古礼，[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]亲赴#yellow 伊势神宫#!举行大祭，以敬奉#v 天照大神#!，维系#yellow 神道教#!之传统仪轨。"
open_japan.11.f:0 "伊势神宫者，我邦神社之祖，奉祀#v 天照大神#!，每二十年迁宫一次，以承‘式年迁宫’之古制。今逢大祭，[ROOT.GetCountry.GetRuler.GetFirstName][Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]躬亲前往，率百官行祭祀之礼：献玉帛、诵祝词，祈神恩庇佑国土安宁、万民康泰\n\n祭典虽循旧例，然非复往昔神权之工具，实乃传承文化之仪，使国民不忘先祖之教，亦明神道与国政之分野"
open_japan.11.a:0 "谨守古礼，以承文脉，以安民心"

open_japan.12.t:0 "《征韩论》"
open_japan.12.d:0 "[ROOT.GetCountry.GetRuler.GetFirstName]初，海内甫定，藩阀议国是。萨摩、长州诸将谓：“朝鲜蕞尔，久事清室，昧于时变。我邦维新既成，当扬威域外，首图朝鲜，以拓疆土、裕财源。”"
open_japan.12.f:0 "[SCOPE.sCharacter('turkfm_tanzimat_character_1').GetFullName]辈力主其说，曰：“失此机，恐为俄、清所乘，国将无宁日。”​\n[SCOPE.sCharacter('turkfm_tanzimat_character_2').GetFullName]、[SCOPE.sCharacter('turkfm_tanzimat_character_3').GetFullName]等以为：“内治未固，库藏空虚，骤兴兵戈，必招外侮。宜先整纲纪、兴产业，待国富兵强，再图外略。”两派论争累月，[Concept('concept_ruler','$RULER_TITLE_JAPEMPIRE$')]难决。​\n未几，朝鲜拒我国书，谓 “不循旧例”。主战者益振振有词：“彼既慢我，当以兵威服之。”乃遣舰游弋釜山，声言“问罪”。"
open_japan.12.a:0 "开拓万里波涛，在此一举"
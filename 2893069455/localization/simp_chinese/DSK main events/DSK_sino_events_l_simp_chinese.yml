sino_event.78.d: "我们在海外的爱国华侨将在拍卖会上拍卖得到的宝物归还给我们"
sino_event.78.f: "这些器物都不会说话。但当暮色漫过角楼，你若贴在太和殿的金砖上听，能听见宣德炉里残留的沉香在呼吸；你若对着乾清宫的铜鹤耳语，它翅尖的金箔会轻轻震颤，把三百年前的月光，抖落在你摊开的掌心。"

sino_event.79.t: "位于[SCOPE.sCountry('western_country').GetName]的华侨归还了一件故宫宝物"

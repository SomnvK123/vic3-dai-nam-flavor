 #意识形态
 ideology_trotskyist:0 "托洛茨基主义者"
 ideology_trotskyist_desc:0 "该领袖认为需要靠计划经济、农业集体化和剪刀差迅速实现工业化，并主张通过多党制的方式防止官僚壮大。"
 ideology_bukharinist:0 "布哈林主义者"
 ideology_bukharinist_desc:0 "该领袖认为在一党专政的前提下，可以通过市场的方法渐进的实现社会主义。"
 ideology_titoist:0 "铁托主义者"
 ideology_titoist_desc:0 "该领袖主张自治政府，并通过市场社会主义的方式提升人民生活水平。"
 ideology_maoist:0 "马列毛主义者"
 ideology_maoist_desc:0 "该领袖追随马克思、列宁、毛泽东的路线和继续革命理论，认为在社会主义国家取得无产阶级专政之后，仍然需要发动群众，让群众自己解放自己，从生产方式、生产关系、经济基础、上层建筑到意识形态上进行彻底的革命改造。"
 ideology_ultraleftist:0 "极左分子"
 ideology_ultraleftist_desc:0 "该领袖是政治上的投机派，借助极左的幌子宣扬血统论、打压异己。"
 ideology_capitalist_roader:0 "唯生产力论者"
 ideology_capitalist_roader_desc:0 "该领袖认为发展生产力是解决所有社会问题的唯一途径，主张通过提升生产力来推动社会发展。"
 ideology_in_communism:0 "生活在共产主义社会"
 ideology_in_communism_desc:0 "这一利益集团生活在共产主义社会中，并享受到了这种极其发达先进的社会的好处。"


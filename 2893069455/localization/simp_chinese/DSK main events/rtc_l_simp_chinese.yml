 #第二轮路线斗争
 line_struggle_2_events.1.t:0 "第二轮左翼路线斗争开启"
 line_struggle_2_events.1.desc:0 "对社会主义建设路线的争论"
 line_struggle_2_events.1.f:0 "对于社会主义建设路线，出现了四种截然不同的方式。托洛茨基主张通过计划经济和快速工业化来发展经济，并利用多党制来防范官僚阶级的产生；布哈林主张通过市场经济渐进的将生产资料集中在社会主义国家手中，并主张坚持党的专政。斯大林吸取了托洛茨基的经济观点和布哈林的政治观点，计划经济、集体化农业和一党专政。除了苏联模式的争论之外，铁托探索出了一条独特的社会主义路线，由劳动与资金联合而成的工人合作社成为了经济的主要经济组织，利用市场社会主义的方法来发展社会主义。\n 本轮路线斗争在选定之后不可更改，且要求长时间保持相应路线所需要的法律，请慎重选择。"

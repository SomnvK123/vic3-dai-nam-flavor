 #第一轮路线斗争
 Decision_line_struggle_1:0 "开启第一轮左翼路线斗争"
 Decision_line_struggle_1_desc:0 "对于无产阶级未来何去何从的问题，究竟是通过无产阶级专政实现共产主义、通过资产阶级议会进行改良还是立刻取消国家和政府，势必展开一场大讨论。\n 这样的讨论不仅利于澄清问题，也有助于社会主义思想的转播。日志进行期间，可以将不是保皇主义者、且不是地主的利益集团领袖拉拢为社会主义的意识形态。"
 je_line_struggle_1:0 "第一轮左翼路线斗争"
 je_line_struggle_1_reason:0 "对于无产阶级未来何去何从的问题，究竟是通过无产阶级专政实现共产主义、通过资产阶级议会进行改良还是立刻取消国家和政府，势必展开一场大讨论。\n 这样的讨论不仅利于澄清问题，也有助于社会主义思想的转播。日志进行期间，只要相关利益集团领袖不是保皇主义或者不是已经拥有了社会主义意识形态，就可以拉拢实业家、虔信者、知识分子和军队领袖为社会民主主义，拉拢乡村群众、小市民和知识分子领袖为无政府主义，拉拢工农兵学领袖为共产主义。每种拉拢操作具有各自独立的冷却时间，冷却时间为 3 个月。\n 这样的讨论会持续至少3年，并以无产阶级夺取政权作为结束讨论的前提条件。"
 line_struggle_1_events.1.t:0 "第一轮左翼路线斗争开启"
 line_struggle_1_events.1.d:0 "无产阶级的未来？"
 line_struggle_1_events.1.f:0 "无产阶级的未来何去何从？共产主义者主张建立无产阶级专政的国家，逐步改造整个社会的经济基础、上层建筑和意识形态，最终消灭剥削、实现国家消亡和共产主义。无政府主义者主张立刻取消国家和政府，由劳动者联合的工团进行自治。社会民主主义者主张在资产阶级共和国进行议会斗争，逐步改良社会制度、提高工人福利。"

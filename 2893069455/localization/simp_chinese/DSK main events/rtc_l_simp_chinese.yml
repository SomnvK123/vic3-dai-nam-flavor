 #修正主义和资产阶级复辟 
 je_revisionism_breeding:0 "修正主义的滋生"
 je_revisionism_breeding_reason:0 "在社会主义的实践当中，最初建立的体制是不可长期持续的。正如《共产党宣言》所说，“对所有权和资产阶级生产关系施行强制性的干涉，也就是采取这样一些措施，这些措施在经济上似乎是不够充分的和无法持续的，但是在运动进程中它们会越过本身，使进一步向旧的社会制度进攻成为必要。”\n 然而，面对建设社会主义的困难，总有一些人想要借助资产阶级的方法来施行所谓改革，无论是赫鲁晓夫这样的继承人，还是铁托这样的创始人，都必须面对经济体制难以运转的问题。\n 等待时间结束，趁此机会集中精力建设社会主义，为第三轮路线斗争——与修正主义的斗争做好准备吧！"
 je_revisionism_breeding_goal:0 "等待 2 年时间耗尽"
 revisionism_breeding_events.1.t:0 "修正主义滋生"
 revisionism_breeding_events.1.desc:0 "修正主义的思想在我国蔓延"
 revisionism_breeding_events.1.f:0 "为了解决经济政策僵化、难以运转的问题，领导人们不断地借鉴资产阶级的政策，以至于修正主义在我国的方方面面出现了。\n 为了与修正主义作斗争，现在允许采用“发起文化革命运动”决议，进入第三轮左翼路线斗争。"
 revisionism_breeding_events.1.a:0 "反修防修，迫在眉睫！"
 set_allow_cultural_revolution_tt:0 "允许采用“发起文化革命运动”决议"
 lzy_buff_revisionism_breeding:0 "修正主义思潮"
 lzy_buff_capitalism_comeback:0 "资产阶级复辟"
 revisionism_breeding_events.2.t:0 "资产阶级复辟！"
 revisionism_breeding_events.2.d:0 "国内新生的官僚资产阶级发动了政变"
 revisionism_breeding_events.2.f:0 "由于国内出现了新生的官僚资产阶级利益集团，这一小部分人为了他们的特权不断地弱化社会主义的公有制制度，最终在国内外资产阶级势力的不懈努力下，他们发起了政变，实现了资产阶级复辟。"
 revisionism_breeding_events.2.a:0 "共产主义之路的极大挫折" 

 #第三轮路线斗争
 line_struggle_3_events.1.t:0 "炮打司令部"
 line_struggle_3_events.1.desc:0 "[SCOPE.sCharacter('ls3_ruler_scope_1').GetFullName]发布了《炮打司令部————我的一张大字报》，这意味着文化革命运动的正式开始"
 line_struggle_3_events.1.f:0 "“全国第一张马列主义的大字报和《[SCOPE.GetRootScope.GetCountry.GetName]日报》评论员的评论，写得何等好啊！请同志们重读这一篇大字报和这篇评论。可是在五十多天里，从中央到地方的某些领导同志，却反其道而行之，站在反动的资产阶级立场，实行资产阶级专政，将无产阶级轰轰烈烈的文化大革命运动打下去，颠倒是非，混淆黑白，围剿革命派，压制不同意见，实行白色恐怖，自以为得意，长资产阶级的威风，灭无产阶级的志气，又何其毒也！联系到过去的右倾和形‘左’而实右的错误倾向，岂不是可以发人深省的吗？”"
 line_struggle_3_events.1.a:0 "天下大乱，达到天下大治！"

 line_struggle_3_events.12.t:0 "国外左翼学者支持马列毛主义"
 line_struggle_3_events.12.d:0 "国外左翼学者已经受够了资本主义和修正主义，他们普遍认为马列毛主义和文化革命是进一步进行社会革命的前进方向，并将[SCOPE.GetRootScope.GetCountry.GetName]视为人类文明的新的灯塔。"
 line_struggle_3_events.12.f:0 "“在每一个国家里，旧的官僚集中制都遭到了日益增长的困难。群众的漠不关心、生产率徘徊不前、经济停滞——所有这些以及危机来临的其他迹象可以在整个地区看到。有两种可能的反映。一种反应是进行一次[SCOPE.GetRootScope.GetCountry.GetName]人已经赋予其特定意义并把它叫做文化革命的运动：一次全面发动群众的运动，提高总的政治觉悟水平，使社会主义的理想重新获得活力，让生产者自己在各级决策方面负起越来越大的责任。另一种反应是日益依赖市场规律和利润刺激，在其他社会主义国家中，没有任何一个人、任何一个党、任何一个集团能够作出第一种反应。这并不是因为那些官僚们对资本主义的方法有任何偏爱，而是由于他们找不到任何其他可以保住他们权力和特权的办法。他们必须付的代价是，无论他们是否知道、是否乐意，他们的国家不得不退回到基本上是资本主义社会的道路。”——保罗·斯威齐"
 line_struggle_3_events.12.a:0 "我们就是新的灯塔！"
 lzy_buff_CR_prestige_add:0 "继续革命理论在世界传播"

 line_struggle_3_events.15.t:0 "文化革命取得决定性胜利！"
 line_struggle_3_events.15.d:0 "中央全体会议通过了《关于叛徒、内奸、工贼[SCOPE.sCharacter('will_killed_capitalist_roader').GetFullName]罪行的审查报告》"
 line_struggle_3_events.15.f:0 "这次会议认为文化革命运动取得了决定性胜利，走资当权派的领导人已经被打倒。与此同时，政治投机的极左分子把持了宣传和政治的权力，党章同时也被修改了，极左分子之间的斗争和夺权阴谋逐渐开始显现。"
 line_struggle_3_events.15.a:0 "走资派司令部覆灭了，然后呢？"


 je_line_struggle_3_1p:0 "文化革命-第一阶段"
 je_line_struggle_3_1p_reason:0 "文化革命的第一阶段，在经济层面和人民民主层面都得到了新的创新发展。在政治和意识形态的斗争层面，则是针对走资派的进攻。\n 请尽力在十年之内完成基本建成社会主义现代化日志条目，确保游戏胜利。"
 je_line_struggle_3_1p_goal:0 "等待3年"

 je_line_struggle_3_1p_commune:0 "公社自治政府"
 je_line_struggle_3_1p_commune_reason:0 "文化革命在政治上的重大探索就在于由人民群众组成的经济组织不仅参与经济活动的管理权，而且要直接取得民主的政治权利。"
 je_line_struggle_3_1p_commune_goal:0 "等待1年。完成后我们将实现公社自治体"
 line_struggle_3_events.13.t:0 "革命委员会成立！"
 line_struggle_3_events.13.d:0 "[SCOPE.sState('communal_state').GetName]的群众建立了[SCOPE.sState('communal_state').GetName]人民公社"
 line_struggle_3_events.13.f:0 "在[SCOPE.sCharacter('ls3_ruler_scope_1').GetFullName]的提议下，[SCOPE.sState('communal_state').GetName]人民公社更名为[SCOPE.sState('communal_state').GetName]革命委员会。"
 line_struggle_3_events.13.a:0 "群众民主的重大探索！"

 je_line_struggle_3_1p_communal_priciple:0 "工业组织中的革命"
 je_line_struggle_3_1p_communal_priciple_reason:0 "文化革命在经济上的重大探索就在于人民群众能够民主的参与经济组织的管理，从而在生产关系方面实现社会主义革命。"
 je_line_struggle_3_1p_communal_priciple_goal:0 "等待1年。完成后触发事件可将法律变更为工人民主计划"
 line_struggle_3_events.14.t:0 "工人民主计划方式的确立！"
 line_struggle_3_events.14.d:0 "[SCOPE.sState('coop_state').GetName][SCOPE.sBuilding('coop_building').GetName]的工人群众颁布了[SCOPE.sState('coop_state').GetName][SCOPE.sBuilding('coop_building').GetName]宪法，并在全国得到了效仿学习。"
 line_struggle_3_events.14.f:0 "过去，官僚主义者制订生产计划是：指标往下贯，干部受为难，群众一边看。去年，工人群众以高度的主人翁责任感，自下而上地讨论计划，根据实际情况，既充分发挥革命积极性，又留有余地。结果提前完成了全年生产任务。工人阶级掌握企业的管理大权，充分发挥了群众的革命积极性和创造性。"
 line_struggle_3_events.14.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]的生产关系和工业组织进行了革命！"
 lzy_buff_CP_authority_add:0 "工人民主计划在全国推广"

 je_line_struggle_3_2p:0 "文化革命-第二阶段"
 je_line_struggle_3_2p_reason:0 "在文化革命的第二阶段，取得上风的极左投机分子之间开始进行内斗。一部分领袖酝酿夺权阴谋。\n 请尽力在十年之内完成基本建成社会主义现代化日志条目，确保游戏胜利。"
 je_line_struggle_3_2p_goal:0 "等待2年"

 line_struggle_3_events.30.t:0 "夺权阴谋"
 line_struggle_3_events.30.desc:0 "[SCOPE.sCharacter('will_killed_ultraleftist').GetFullName]反革命集团企图谋害[SCOPE.sCharacter('ls3_ruler_scope_1').GetFullName]、纂夺政权。所幸，这一阴谋被及时挫败了。"
 line_struggle_3_events.30.f:0 "文化革命开始后，他打着“高举”、“紧跟”的旗帜，欺上瞒下，阳奉阴违，结党营私，与其他极左分子互相勾结、作结成反革命集团，有预谋地诬陷迫害党和国家领导人，阴谋夺取党和国家的最高权力。"
 line_struggle_3_events.30.a:0 "万幸，阴谋被发现了。"

 je_line_struggle_3_3p:0 "文化革命-第三阶段"
 je_line_struggle_3_3p_reason:0 "在文化革命的第三阶段，取得上风的极左投机分子专注于夺取政权，忽略了生产力和生产关系的建设。但如果我们能够取得足够高的社会主义建设的成就，我们就可以说服所有人全力支持走向发达的共产主义社会，而不需要再重新经过市场经济的中间阶段。\n 请尽力在十年之内完成基本建成社会主义现代化日志条目，确保游戏胜利。"
 je_line_struggle_3_3p_goal:0 "等待 2 年"
 custom_loc_end_je_basic_modernization:0 "完成“基本实现社会主义现代化”日志条目及其结算事件"
 custom_loc_not_end_je_basic_modernization:0 "未完成“基本实现社会主义现代化”日志条目及其结算事件"
 line_struggle_3_events.40.t:0 "文化革命胜利结束！"
 line_struggle_3_events.40.desc:0 "我们已经在政治和经济领域实现了稳固的社会主义方式方法，并且取得了令人瞩目的、资本主义无法抵达的，人民共同富裕、生产力极大发展和生产关系与上层建筑彻底改造的成就。"
 line_struggle_3_events.40.f:0 "无论是认为“生产力起决定性作用，生产关系起支配作用”的正统马列毛主义者，还是认为生产力的发展阶段与所有权的归属决定一切的唯生产力论者，都承认目前的生产力和生产关系是互相适应、最为先进的。在极大发展的生产力水平下，在经历群众自我解放运动之后，共产主义不再是遥远的理想，而是即将成为现实的未来！"
 line_struggle_3_events.40.a:0 "文化革命胜利结束！"

 line_struggle_3_events.41.t:0 "“文化革命胜利结束！”"
 line_struggle_3_events.41.desc:0 "随着[SCOPE.sCharacter('ls3_ruler_scope_2').GetFullName]的去世，极左分子[SCOPE.sCharacter('will_killed_ultraleftist_2').GetFullName]妄图发动政变颠覆中央，而这被新的主席[SCOPE.sCharacter('ls3_ruler_scope_1').GetFullName]阻止。"
 line_struggle_3_events.41.f:0 "这十年为我们的经济发展遭遇了很大的挫折。必须进行改革开放，才能实现社会主义现代化，才能实现共同富裕。"
 line_struggle_3_events.41.a:0 "解放思想，实事求是！"
 
 no_more_capitalist_roader:0 "不再出现唯生产力论者"
 no_more_ultraleftist:0 "不再出现极左分子"

 sway_to_maoist:0 "拉拢为马列毛主义者"


 #迈向共产主义
 je_communism_society:0 "迈向共产主义社会"
 je_communism_society_reason:0 "我们已经经历了群众的自我解放运动。接下来的核心任务就是：解放和发展生产力，使物质条件极大丰富。在实现共同富裕的基础上，我们将步入共产主义社会！"

 communism_society_event.1.t:0 "共产主义社会的实现！"
 communism_society_event.1.desc:0 "经过我们的不懈努力，[SCOPE.GetRootScope.GetCountry.GetName]已经步入了共产主义社会。"
 communism_society_event.1.f:0 "社会产品极大丰富，人民具有高度的思想觉悟，劳动是生活的第一需要，工农、城乡、脑力劳动和体力劳动三大差别已经消灭，各尽所能，按需分配！"
 communism_society_event.1.a:0 "迈向世界共产主义和全人类解放！"
 #游戏目标
 objective_road_to_communism:0 "共产主义之路"
 objective_road_to_communism_desc:0 "在《维多利亚3》的理想模型中实现共产主义社会！\n 共产主义之路是艰难的斗争过程。要经历数次政治革命、社会革命和文化革命，从生产方式到意识形态的全面改造，消灭剥削和压迫，最终在生产力极度发达的情况下实现世界共产主义。"
 objective_road_to_communism_name_USA:0 "美利坚共产联盟"
 objective_road_to_communism_desc_USA:0 "美利坚合众国在第二次工业革命的浪潮中抓住了机会，并凭借其独特的地理优势即将成为世界霸主。在未来最发达的帝国主义国家中，是否有共产主义的希望？"
 objective_road_to_communism_name_FRA:0 "法兰西公社"
 objective_road_to_communism_desc_FRA:0 "巴黎公社为我们点亮了无产阶级革命的方向。保护公社，在西欧最发达的国家中革命并建设共产主义！"
 objective_road_to_communism_name_RUS:0 "苏联"
 objective_road_to_communism_desc_RUS:0 "从帝国主义最薄弱的一环——沙皇俄国中脱胎出了新生的苏维埃政权。老大哥能否坚持社会主义的道路、防范修正主义的滋生，并引领世界共产主义革命？"
 objective_road_to_communism_name_CHI:0 "中华人民共和国"
 objective_road_to_communism_desc_CHI:0 "中国的封建社会是典型的阶级社会，革命的种子在中国很快就会生根发芽。中国具有最坚韧和毫不动摇的共产主义的思想，并曾成为全世界被压迫的阶级和人民的灯塔。实现共产主义对于中国来说是可以一步一步实现的目标。"
 objevtive_road_to_communism_idle_header:0 "继续前行"
 objevtive_road_to_communism_idle_hint:0 "接下来会出现更多目标"
 je_research_socialism:0 "研究社会主义科技"
 je_research_socialism_reason:0 "想要实现共产主义理想，就首先要对整个社会历史作出科学的分析，并给出无产阶级革命和实现共产主义理想的路径——也就是科学社会主义理论。"
 je_objective_support_TU:0 "鼓励工人运动，施行无产阶级专政"
 je_objective_support_TU_reason:0 "无产阶级的解放只有通过全人类的解放才能最终实现。只有足够壮大的无产阶级队伍，才能摒弃其他阶级的软弱性和妥协性，领导彻底的革命。"
 je_ls1:0 "完成第一轮左翼路线斗争"
 je_ls1_reason:0 "请从决议中选择“开启第一轮左翼路线斗争”决议，并借助这一决议扩大社会主义意识形态的影响。路线斗争系列日志条目是实现共产主义的前提。"
 custom_loc_je_ls1_end:0 "完成第一轮左翼路线斗争日志条目及其结算事件"
 custom_loc_je_ls2_end:0 "完成第二轮左翼路线斗争日志条目及其结算事件"
 je_research_pa:0 "研究政治煽动科技"
 je_research_pa_reason:0 "想要团结农民、军队和知识分子，就要有政治煽动的能力。研究完成后，允许组建红军和拉拢左翼学者，使相应利益集团获得社会主义者意识形态。"
 je_ls2:0 "完成第二轮左翼路线斗争" 
 je_ls2_reason:0 "在“我们的革命”日志之后会开启第二轮路线斗争。这一路线将决定社会主义的建设方向。"
 je_ls3:0 "完成第三轮左翼路线斗争" 
 je_ls3_reason:0 "在“修正主义的滋生”日志之后允许采用“发起文化革命运动”决议。这一次路线斗争的结果无论好坏，都将杜绝资产阶级复辟的可能性。"
 custom_loc_je_ls3_end:0 "完成第三轮左翼路线斗争日志条目及其结算事件"
 je_three_great_remould_ob:0 "完成社会主义公有化改造"
 je_three_great_remould_ob_reason:0 "社会主义公有化改造是发展生产力的重要前提。无论是通过新经济政策和国家资本主义的方式，还是通过计划经济或合作社的方式，都有助于促进生产力的极大发展。"
 custom_loc_objective_3great_remould_end:0 "完成三大改造日志条目及结算事件，或在开启三大改造之前修改经济法律为计划经济或合作社经济，并完成“完善社会主义基本经济制度”决议。"
 je_r_communism:0 "实现本国共产主义"
 je_r_communism_reason:0 "提高生活水平，使共产主义在本国实现！"
 je_world_communism:0 "实现世界共产主义和全人类解放"
 je_world_communism_reason:0 "共产主义已经在本国实现，是时候实现世界共产主义和全人类解放，以取得游戏胜利了！"
 pop_world_communism_final_tt:0 "占据全球人口的一半"

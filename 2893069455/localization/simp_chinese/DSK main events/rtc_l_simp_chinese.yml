 #社会主义革命和制度建设
 Decision_socialism_revolution:0 "社会主义革命爆发"
 Decision_socialism_revolution_desc:0 "我们与反动势力之间已经势不两立，社会主义制度势在必行。"
 socialist_revolution_events.1.t:0 "社会主义革命爆发"
 socialist_revolution_events.1.desc:0 "在我国，革命内战已经爆发，而如今政治上日益强大的劳动者群众已经明确地表达了自己的态度：建立社会主义！"
 socialist_revolution_events.1.f:0 "在还没有民主选举的机关的地方和在军队中，全部政权应当完全转归地方委员会和它们选出的委员，或者转归必须由选举产生的其他机关。在国家的全力支持下，应当把工人和革命军队，即经实际证明能够镇压反革命分子的军队，无条件地和普遍地武装起来。"
 socialist_revolution_events.1.a:0 "社会主义共和国今天成立了！"
 Decision_socialism_institution:0 "建立社会主义制度"
 Decision_socialism_institution_desc:0 "无论我们未来选择怎样的社会主义道路，人民的基本权利永远是神圣不可侵犯的。"
 socialist_revolution_events.2.t:0 "社会主义制度的设立"
 socialist_revolution_events.2.d:0 "建设社会主义的基本制度"
 socialist_revolution_events.2.f:0 "消灭宗教、民族平等、建设社会主义的公共事业、对权贵征高额累进税，并保障人民的权利和自由。"
 socialist_revolution_events.2.a:0 "我们按照人民的要求改造整个上层建筑！"

 #社会主义经济革命-第一轮-三大改造
 Decision_three_great_remould:0 "开启三大改造"
 Decision_three_great_remould_desc:0 "封建时代和资本主义的私有制制度在我们的经济中根深蒂固。我们需要进行全面的社会主义改造，才能让旧的生产力被我们利用起来。\n 经济层面的社会主义改造会带来人民的拥护，每个月提升人民的效忠水平。改造完成后，可以选择社会主义的经济制度，并获得吞吐量加成。如果在触发决议之前已经拥有公有制经济，则可以直接获得吞吐量加成。"
 Decision_three_great_remould2:0 "完善社会主义基本经济制度"
 Decision_three_great_remould2_desc:0 "社会主义公有制在我国的工业部门已经初步建立起来。集体化的农业和未来道路的选择在你的手中。\n 决议触发的事件完成后，可以获得吞吐量加成。"
 je_three_great_remould:0 "三大改造"
 je_three_great_remould_reason:0 "封建时代和资本主义的私有制制度在我们的经济中根深蒂固。我们需要进行全面的社会主义改造，才能让旧的生产力被我们利用起来。在社会主义改造期间，我们需要完成对#yellow 农业#!、#yellow 手工业#!和#yellow 资本主义工商业#!的社会主义改造，集体化农业与生产合作社的制度可以帮助我们实现前两者，而“和平赎买”的政策能帮助我们使剥削的资本家成为自食其力的劳动者。\n 经济层面的社会主义改造会带来人民的拥护，每个月提升人民的效忠水平。改造完成后，可以选择社会主义的经济制度，并获得吞吐量加成。如果在触发决议之前已经拥有公有制经济，则可以直接获得吞吐量加成。"
 custom_loc_three_great_remould_goal:0 "等待为时20个月的三大改造完成。期间需保持委员会共和国政体且没有革命和分裂。"
 custom_loc_three_great_remould_capitalists:0 "#v $capitalists$#!占我国人口比例低于#yellow 0.08%#!（您可以在人口→图表那里查看#v $capitalists$#!比例）"
 custom_loc_two_great_remould_capitalists:0 "#v $aristocrats$#!占我国人口比例低于#yellow 0.08%#!（您可以在人口→图表那里查看#v $aristocrats$#!比例）"
 gaizao_capitalists_button:0 "改造资本家"
 gaizao_capitalists_button_desc: "要想尽快将民族资本主义经济转变为社会主义经济，我们可以通过“和平赎买”的政策，将大量#v $capitalists$#!快速转化为自食其力的劳动者。"
 gaizao_capitalists_half_years: "每半年可以改造一次"
 gaizao_capitalists_half_years_new: "所有受雇佣，且为我国主流文化的#v $capitalists$#!将成为#v $laborers$#!"
 economic_revolution.1.t:0 "社会主义基本经济制度的确立"
 economic_revolution.1.desc:0 "随着三大改造胜利完成，现有的生产力在经历了社会主义的改造后，这些生产资料已经掌握在我们手中。曾经剥削他人的#yellow 资本家#!，现在也需要拿起锄头镰刀，与劳动者们一起工作，一起生活。"
 economic_revolution.1.f:0 "老张你瞧见没？这轧钢机的响声都比从前敞亮！过去东家坐在玻璃窗后头拨算盘，咱们手上的茧子磨得比铜板厚，换来的工钱还不够买他公馆里半块西洋玻璃。现在可好！机器是国家的，车间是咱们的，连王大掌柜都跟咱一块儿啃窝头睡工棚——昨儿他车的那批齿轮，嘿，比我这八级工都不差！\n\n这才叫天地翻覆啊同志们！从前压弯咱脊梁的磨盘，如今碎成了铺社会主义大道的石子！等我家小子放学，非得拽他来看看——这满车间淌着热汗的脊梁骨，管他从前穿长衫还是短褂，如今都挺得跟钢锭一样直溜！"
 economic_revolution.1.a:0 "继续建立平均地产、包产到户，政府引导的市场经济制度"
 economic_revolution.1.d:0 "继续建立工业和农业的市场经济制度"
 economic_revolution.1.b:0 "建立工人合作社的社会所有制经济，市场社会主义可以兼顾效率和公平"
 economic_revolution.1.c:0 "社会主义必须取消商品和市场，快速工业化有赖于经济的统一计划和管理"
 lzy_buff_three_remould_Modifier:0 "社会主义改造完成"
 economic_revolution.2.t:0 "人民拥护三大改造"
 economic_revolution.2.d:0 "在社会主义改造的过程中，人民群众取得了许多利益，我们的政策成功得到了人民群众的热烈拥护。在人民的力量下，我们国家迸发出了空前强大的生产力，令世界各国对我们刮目相看。"
 economic_revolution.2.f:0 "从前我们这些"#yellow 臭工人#!"在资本家厂子里，就像黄浦江边的芦苇随风倒——每天天不亮就上工，寒冬腊月车间的玻璃碎了都舍不得补，手上生满冻疮还要被工头抽鞭子...现在#yellow 国营厂#!的食堂顿顿有白米饭，医务室的大夫给全家看病都不要钱。#yellow 合作社#!的表哥说，自从土地入了社，再不用给地主交租子...\n\n想起二十年前穿着补丁摞补丁的短褂在码头扛大包，如今连小孙女都有花布裙子穿。#yellow 三大改造#!就像黄浦江上架起的大桥，把我们从旧社会的泥潭里拉出来，踏踏实实走上了社会主义的康庄大道。"
 economic_revolution.2.c:0 "人民万岁！"

 #社会主义经济革命-第二轮-小康社会
 je_basic_moderately_prosperous:0 "基本实现小康社会"
 je_basic_moderately_prosperous_reason:0 "共产主义之路同时是共同富裕之路。从小康社会到生产力现代化，再到对现代化的彻底超越。发挥社会主义制度的优势，发展生产力和生产关系吧！\n 该系列日志条目完成后可以获得吞吐量buff，能否及时完成这一系列日志条目涉及到整个游戏胜利与否。" 
 economic_revolution.4.t:0 "基本实现小康社会！"
 economic_revolution.4.d:0 "我们已经基本实现了小康社会！"
 economic_revolution.4.f:0 "实现温饱的小康社会在封建时代不过是一种幻想，而现在它成为了我们的现实！"
 economic_revolution.4.a:0 "共同富裕的阶段性胜利！"
 lzy_buff_basic_moderately_prosperous_Modifier:0 "基本实现小康社会"

 je_fbar_moderately_prosperous:0 "全面建成小康社会"
 je_fbar_moderately_prosperous_reason:0 "共产主义之路同时是共同富裕之路。从小康社会到生产力现代化，再到对现代化的彻底超越。发挥社会主义制度的优势，发展生产力和生产关系吧！\n 该系列日志条目完成后可以获得吞吐量buff，能否及时完成这一系列日志条目涉及到整个游戏胜利与否。" 
 economic_revolution.5.t:0 "全面建成小康社会！"
 economic_revolution.5.d:0 "我们已经基本实现了小康社会！"
 economic_revolution.5.f:0 "经过了艰难的脱贫攻坚战后，[SCOPE.GetRootScope.GetCountry.GetName]式扶贫书写了世界减贫史的奇迹，也成为了世界各国走向共同富裕的模范。"
 economic_revolution.5.a:0 "共同富裕的阶段性胜利！"
 lzy_buff_fbar_moderately_prosperous_Modifier:0 "全面建成小康社会"

 #社会主义经济革命-社会主义生产方式
 je_socialism_mode_production:0 "社会主义生产方式"
 je_socialism_mode_production_reason:0 "马克思在《资本论》中明确指出：一定的生产方式以及与之相适应的生产关系。生产方式决定了整个生产关系、交换关系和分配关系。如何超越资本主义生产方式、实现社会主义的生产方式，实现劳动者对生产资料的集体自由支配，是一个需要在理论和实践上进行双重探索的重大课题。\n 完成本日志可以获得超强力buff。"
 custom_loc_je_fbar_moderately_prosperous_end:0 "完成“全面建成小康社会”日志条目"
 economic_revolution.8.t:0 "实现#red 共产主义#!！"
 economic_revolution.8.d:0 "经过艰难的理论探索和实践探索，新的、能够排除掉资本主义的社会主义社会终于确立了下来！共产主义已然实现，我们消灭了阶级和阶级对立，废除了把人终身束缚在旧的分工中，尤其是被束缚在自己并不乐意但仅为谋生而不得不从事的职业中。在我们的国家，工人劳动时间缩短，自由时间大大延长，每个人都可以在最容易发挥自己的爱好、天赋和才能的领域中工作，而不必担心失业，人的潜能可以得到最有效的发挥。#yellow 没有人生来是工具，所有人都是生产服务的主人！#!"
 economic_revolution.8.f:0 "先生，这……这真是[SCOPE.sCountry('modern_communist_country').GetCapital.GetCityHubName]？不，整个感觉都不一样了！上次我来还是十年前，那时已经很现代化，但现在……简直像科幻电影！你这车也是，“[SCOPE.sCountry('modern_communist_country').GetCapital.GetCityHubName]流星”牌子什么时候变得这么……酷了？\n啊，同志！这不是科幻，是我们实实在在的共产主义现代化胜利果实。这车是我们“[SCOPE.sCountry('modern_communist_country').GetCapital.GetCityHubName]联合体”最新一代的旗舰GT，全电驱动，低排放...\n太棒了！但这一定很贵吧？我记得以前这样的高性能跑车……\n哎，那都是老早的事啦，这车是我作为“先进城市建设工程师联合会”的骨干成员奖励来的，在我们国家，社会认可你的劳动价值和对集体的贡献，就会提供与之匹配的生活资料和发展资源..."

 gmg_world_tour.1.t: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]再次启程"
 gmg_world_tour.1.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]再一次离开了本国，踏上TA环游世界的旅途。TA将前往#v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!，观察那里的统治者、风俗与秩序，并在归来后将见闻带回我们的国家。"
 gmg_world_tour.1.a: "愿旅途顺利。"

 gmg_world_tour.10.t: "旅途中的新鲜见闻"
 gmg_world_tour.10.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]从#v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!寄回了新的见闻。异乡的街市、礼仪与民间风貌令人惊叹。问题在于，我们更愿意把这些见闻转化为什么？"
 gmg_world_tour.10.a: "把它当作开拓眼界的灵感。"
 gmg_world_tour.10.b: "让世界记住我们的使者。"

 gmg_world_tour.1.t: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]再次启程"
 gmg_world_tour.1.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]再一次离开了本国，踏上TA环游世界的旅途。TA将前往#v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!，观察那里的统治者、风俗与秩序，并在归来后将见闻带回我们的国家。"
 gmg_world_tour.1.a: "愿旅途顺利。"

 gmg_world_tour.10.t: "旅途中的新鲜见闻"
 gmg_world_tour.10.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]从#v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!寄回了新的见闻。异乡的街市、礼仪与民间风貌令人惊叹。问题在于，我们更愿意把这些见闻转化为什么？"
 gmg_world_tour.10.a: "把它当作开拓眼界的灵感。"
 gmg_world_tour.10.b: "让世界记住我们的使者。"

 gmg_world_tour.20.t: "旅途中的制度观察"
 gmg_world_tour.20.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]继续在#v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!旅行。除了风土人情之外，TA也注意到了当地的行政组织、社会秩序与公共事务安排。这些观察也许能真正帮助我们改善国家治理。"
 gmg_world_tour.20.a: "吸收其中的行政经验。"
 gmg_world_tour.20.b: "重点宣传TA的旅程与影响。"

 gmg_world_tour.101.t: "列强归来"
 gmg_world_tour.101.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]从#v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!归来。列强国家的工业、外交与礼制给TA留下了深刻印象。TA带回的不只是见闻，还有一套对强国运作方式的理解。"
 gmg_world_tour.101.a: "把这些经验用于国家建设。"

 gmg_world_tour.102.t: "大国归来"
 gmg_world_tour.102.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]从#v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!归来。这个国家虽非列强之巅，却已有值得借鉴的制度与国际经验。TA的笔记与轶闻将转化为现实收益。"
 gmg_world_tour.102.a: "TA的旅行没有白费。"

 gmg_world_tour.103.t: "地区强国归来"
 gmg_world_tour.103.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]从#v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!归来。TA发现即便不是世界中心，每个国家也都有独到的组织方式、风土与社会节奏。"
 gmg_world_tour.103.a: "经验从不只属于列强。"

 gmg_world_tour.104.t: "自远方小国归来"
 gmg_world_tour.104.d: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]从#v [SCOPE.sCountry('gmg_last_tour_country_scope').GetName]#!归来。远方并不总意味着强盛，但不同的生活方式、边疆经验与地方活力，同样能为我们的国家带来启发。"
 gmg_world_tour.104.a: "世界比地图更广阔。"

 modifier_gmg_mid_travel_curiosity: "旅行见闻：异国好奇"
 modifier_gmg_mid_travel_curiosity_desc: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]在旅途中记录下了许多新奇见闻，激发了社会对外部世界的兴趣。"

 modifier_gmg_mid_travel_soft_power: "旅行见闻：柔性影响"
 modifier_gmg_mid_travel_soft_power_desc: "TA的旅行使国家形象更具亲和力，并带来了一定的国际影响。"

 modifier_gmg_mid_travel_administration: "旅行见闻：行政启发"
 modifier_gmg_mid_travel_administration_desc: "来自旅途中的制度观察，帮助我们优化治理。"

 modifier_gmg_mid_travel_publicity: "旅行见闻：名望传播"
 modifier_gmg_mid_travel_publicity_desc: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]的旅程被人津津乐道，国家声望也随之提高。"

 modifier_gmg_returned_from_great_power: "环球旅行：列强见闻"
 modifier_gmg_returned_from_great_power_desc: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]从列强归来，带回了关于国际秩序、行政组织与社会风尚的深刻经验。"

 modifier_gmg_returned_from_major_power: "环球旅行：大国见闻"
 modifier_gmg_returned_from_major_power_desc: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]从重要国家归来，带回了值得借鉴的制度和经验。"

 modifier_gmg_returned_from_minor_power: "环球旅行：地区见闻"
 modifier_gmg_returned_from_minor_power_desc: "即便不是世界中心，各地仍有值得学习之处。"

 modifier_gmg_returned_from_distant_land: "环球旅行：远方见闻"
 modifier_gmg_returned_from_distant_land_desc: "[SCOPE.sCharacter('gmg_green_magical_girl_scope').GetFullName]从遥远国度归来，为国家带来了新鲜而独特的视角。"

 gmg_world_tour.1.t: "探险家启程远游"
 gmg_world_tour.1.d: "探险家已经踏上前往[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的旅途。随行人员记录下TA的路线、见闻与寄回国内的书信。无论TA在远方见到宫殿、港口、沙漠还是战场，这趟旅程都将成为国内津津乐道的话题。"
 gmg_world_tour.1.a: "愿TA一路平安。"

 gmg_world_tour.10.t: "旅途中的好奇心"
 gmg_world_tour.10.d: "探险家从[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]寄回了一批旅行笔记。TA记录了当地街市、服饰、饮食与民间传闻，也画下了沿途见到的道路、桥梁和城镇。这些内容虽然零散，却让国内读者第一次如此具体地想象远方。"
 gmg_world_tour.10.a: "整理成旅行手札。"
 gmg_world_tour.10.b: "让报纸大肆刊载。"

 gmg_world_tour.20.t: "远方的制度与秩序"
 gmg_world_tour.20.d: "随着旅程继续，探险家开始注意[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的官署、警察、税务、学校和地方行政。TA在信中写道：一个国家真正的模样，不只在宫殿和旗帜里，也藏在账本、印章和办事员的抽屉里。"
 gmg_world_tour.20.a: "研究他们的行政方法。"
 gmg_world_tour.20.b: "把这些见闻用于宣传。"

 gmg_world_tour.30.t: "旅行途中的见闻"
 gmg_world_tour.30.d: "探险家在旅途中寄回了新的手札，里面写满了远方国家的奇景、风俗与意想不到的遭遇。"
 gmg_world_tour.30.a: "看看TA这次发现了什么。"

 gmg_world_tour.31.t: "直入云霄的城市"
 gmg_world_tour.31.d: "探险家在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]见到了拔地而起的高楼大厦。钢铁、玻璃和电梯把城市推向天空，街道上的人流像河水一样奔涌不息。TA在信中写道：如果未来的城市都是这个模样，那么地面恐怕已经不够人类使用了。"
 gmg_world_tour.31.a: "这就是新时代的城市。"

 gmg_world_tour.32.t: "沙海中的金字塔"
 gmg_world_tour.32.d: "在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的沙漠边缘，探险家站在古老金字塔的阴影下。TA仰望那些沉默了数千年的石块，忽然觉得人类的野心、信仰与劳动都被封存在了这片炽热的黄沙之中。"
 gmg_world_tour.32.a: "古代人的工程同样令人敬畏。"

 gmg_world_tour.33.t: "朱红色的鸟居"
 gmg_world_tour.33.d: "探险家在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]穿过一座又一座朱红色的鸟居。当地人告诉TA，鸟居标记着神圣与凡俗的界限。TA若有所思地在笔记本上画下那些门框，旁边写着：有些门不是为了阻拦人，而是为了提醒人。"
 gmg_world_tour.33.a: "异国信仰也有其庄严之处。"

 gmg_world_tour.34.t: "北方的白色巨兽"
 gmg_world_tour.34.d: "在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的寒冷北方，探险家听闻猎人们谈起雪原上的白色巨兽。后来，TA真的远远看见了一头北极熊在冰雪间移动。那一刻，TA终于明白为什么当地传说总把北方描写得既辽阔又危险。"
 gmg_world_tour.34.a: "把这段写进旅行日志里。"

 gmg_world_tour.35.t: "不用餐具的晚餐"
 gmg_world_tour.35.d: "探险家在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]受邀参加了一场当地宴席。主人熟练地用手取食，并解释其中的洁净礼仪与家庭传统。TA起初有些惊讶，但很快发现餐桌上的习惯并无高低之分，只是不同生活方式的自然延伸。"
 gmg_world_tour.35.a: "尊重当地习俗。"
 gmg_world_tour.35.b: "TA甚至学会了几道菜。"

 gmg_world_tour.36.t: "两根细棍的智慧"
 gmg_world_tour.36.d: "探险家在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]第一次认真学习使用筷子。两根细棍夹起米饭、鱼肉和蔬菜，看似简单，实则需要相当的耐心。TA在信中抱怨自己夹掉了三次豆腐，但最后还是得意地宣布自己已经入门。"
 gmg_world_tour.36.a: "小小餐具也藏着文明的痕迹。"

 gmg_world_tour.37.t: "蝗虫也能上餐桌"
 gmg_world_tour.37.d: "探险家在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的集市上见到了烤制的蝗虫。当地人告诉TA，灾年里捕捉蝗虫不仅能减少农田损失，也能补充食物。TA有些迟疑地尝了一口，然后承认：这东西比看起来要香。"
 gmg_world_tour.37.a: "奇特但实用的食物。"
 gmg_world_tour.37.b: "研究一下当地的农业经验。"

 gmg_world_tour.38.t: "湿热村落的疟疾"
 gmg_world_tour.38.d: "探险家抵达[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]一处湿热村落时，那里正遭受疟疾侵扰。TA见到病人发热、寒战，也见到当地医者与传教士竭力救治。TA在笔记中写道：道路、排水、药品与卫生知识，也许比一场胜仗更能拯救人命。"
 gmg_world_tour.38.a: "记录这些医学见闻。"
 gmg_world_tour.38.b: "留下援助，赢得声望。"

 gmg_world_tour.39.t: "南方荒野的骇人传闻"
 gmg_world_tour.39.d: "探险家在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]南方旅行时，听到商队讲述荒野深处的骇人传闻。有人说那只是旅人为吓唬新手而编造的故事，也有人说确有失踪者从未归来。TA决定不轻信传言，但也不拿自己的安全开玩笑。"
 gmg_world_tour.39.a: "谨慎前进。"
 gmg_world_tour.39.b: "用外交礼节化解误会。"

 gmg_world_tour.40.t: "觐见国王的礼仪"
 gmg_world_tour.40.d: "在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的宫廷中，探险家被告知觐见君主时必须遵循严格礼仪：何时低头、何时行礼、何时开口，都有规矩。TA虽然觉得麻烦，但也意识到这些仪式正是君主权威的一部分。"
 gmg_world_tour.40.a: "入乡随俗。"
 gmg_world_tour.40.b: "TA差点在礼仪上出丑。"

 gmg_world_tour.41.t: "无须下跪的国家"
 gmg_world_tour.41.d: "在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]，探险家惊讶地发现，即使面对国家领袖，许多人也只是握手、致意，而不必下跪。当地人自豪地说，公民并非臣仆。TA将这句话反复读了几遍，觉得其中有一种不同于王冠的力量。"
 gmg_world_tour.41.a: "平等的观念值得思考。"

 gmg_world_tour.42.t: "交战区的军事观察"
 gmg_world_tour.42.d: "探险家抵达[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]时，这个国家正处于战争之中。TA远远看见军队调动、炮兵阵地、野战医院和铁路运输线。随行人员带回了大量关于新式战术与武器运用的笔记，这些见闻或许会推动国内军方的思考。"
 gmg_world_tour.42.a: "把观察报告交给参谋部。"
 gmg_world_tour.42.b: "出版前线见闻，鼓舞国内舆论。"

 gmg_world_tour.43.t: "烟囱与煤灰之城"
 gmg_world_tour.43.d: "探险家在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的一座工业城市里见到无数烟囱。煤灰落在屋顶，工人涌入厂门，机器声从清晨持续到深夜。TA既惊叹于工业的力量，也对这样的生活感到不安。"
 gmg_world_tour.43.a: "工业化的代价与力量都值得记录。"

 gmg_world_tour.44.t: "万国货物的港口"
 gmg_world_tour.44.d: "探险家在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的港口见到来自世界各地的货物：茶叶、棉花、机械、香料、煤炭与枪炮。码头上的语言混杂在一起，让TA觉得整个世界都被船舶和账本连接了起来。"
 gmg_world_tour.44.a: "贸易让世界变小。"

 gmg_world_tour.45.t: "铁轨尽头的风景"
 gmg_world_tour.45.d: "探险家乘坐[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的火车穿过乡野。车窗外的田地、工厂、村庄和河流飞快后退。TA意识到，铁路改变的不只是速度，也改变了国家统治土地、运送军队和组织市场的方式。"
 gmg_world_tour.45.a: "铁路是国家的血管。"

 gmg_world_tour.101.t: "从列强归来的探险家"
 gmg_world_tour.101.d: "探险家结束了在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的旅行。这个大国的城市、军队、工厂和外交排场都给TA留下了深刻印象。TA带回的见闻让国内舆论更加关注世界强权的动向。"
 gmg_world_tour.101.a: "我们必须认真研究列强。"

 gmg_world_tour.102.t: "从强国归来的探险家"
 gmg_world_tour.102.d: "探险家结束了在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的旅行。那里并非世界霸主，却有着值得学习的制度、产业和公共生活。TA的记录将成为国内改革派与保守派共同争论的材料。"
 gmg_world_tour.102.a: "远方有许多可借鉴之处。"

 gmg_world_tour.103.t: "从小国归来的探险家"
 gmg_world_tour.103.d: "探险家结束了在[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]的旅行。这个国家或许不算强大，却有自己的生存智慧、地方习俗和独特风景。TA提醒众人：世界并不只由列强组成。"
 gmg_world_tour.103.a: "小国也有值得记住的故事。"

 gmg_world_tour.104.t: "从遥远土地归来的探险家"
 gmg_world_tour.104.d: "探险家从[SCOPE.sCountry('gmg_last_tour_country_scope').GetName]归来，带回了许多零散却迷人的故事。那里的人们以自己的方式生活、劳作、信仰和贸易。对国内许多人来说，这些故事几乎像童话一样遥远。"
 gmg_world_tour.104.a: "把它们收进旅行日志。"

 modifier_gmg_mid_travel_curiosity: "旅途中的好奇心"

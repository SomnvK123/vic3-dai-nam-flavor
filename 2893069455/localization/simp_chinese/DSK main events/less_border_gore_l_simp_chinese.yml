 bc_finish.7.t: "枪手射击了我们伟大的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('lincoln_character_scope').GetLastName]！"
 bc_finish.7.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('lincoln_character_scope').GetLastName]在[ROOT.GetCountry.GetCapital.GetCityHubName]的华盛顿福特剧院总统包厢看戏时遭到枪击！这名疯狂的枪手在趁[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]保镖离开之时用枪击中了[SCOPE.sCharacter('lincoln_character_scope').GetLastName]头部。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已被送往医院，情况危急。"
 bc_finish.7.f: "这位出类拔萃和道德高尚的人竟是那样谦虚，以致只有在他成为殉道者倒下去之后，全世界才发现他是一位英雄。——马克思"
 bc_finish.7.a:0 "“让开！让开！总统被枪击了！天啊！”"
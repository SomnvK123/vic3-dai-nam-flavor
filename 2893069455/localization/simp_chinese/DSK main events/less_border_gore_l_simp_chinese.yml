 bc_propose.1.t:0 "欧洲列强开始起草《圣斯特凡诺条约》"
 bc_propose.1.d:0 "欧洲列强希望重建巴尔干半岛的秩序。德国将作为东道主举行会议，邀请各国出席柏林会议，以平衡列强之前的利益。"
 bc_propose.1.f:0 "以下是该条约的主要内容：\n①保加利亚划为三部分：马其顿地区仍属土耳其管辖；巴尔干山脉以南建立一个土耳其的自治省，称为东鲁美利亚，该省总督应为基督教徒；保加利亚公国的领土只限于巴尔干山脉以北地区，有权选举自己的王公，但需经土耳其苏丹认可和列强同意。\n②波斯尼亚和黑塞哥维那仍属土耳其，但奥匈帝国有驻军权和行政管理权。\n③承认塞尔维亚、门的内哥罗、罗马尼亚独立，但须分担土耳其的债务；罗马尼亚的比萨拉比亚南部割让给俄国，以收回北多布鲁查作为“补偿”。\n④俄罗斯兼并巴统、阿达罕、卡尔斯；巴统宣布为自由港，作为商业港口。。"
 bc_propose.1.a:0 "我们[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]也出席了此次会议"
 bc_propose_tt:0 "一些国家扩大了在巴尔干的领土主张，似乎会为下一次战争埋下隐患。"
 

 bc_finish.1.t:0 "布雷林会议批准"
 bc_finish.1.d:0 "欧洲殖民列强完成了柏林总法，完成了对非洲和亚洲的领土要求。"
 bc_finish.1.f:0 "殖民国家的欧洲外交官已经完成并签署了 1884 年的柏林总法案。许多国家应该看到欧洲大陆的领土扩张。 先前的主张仍然得到承认，殖民列强仍可能对未殖民的土地提出新的主张。"
 bc_finish.1.a:0 "签署于 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]."
 bc_finish_tt:0 "一些国家可能扩大了在非洲的领土主张"

 bc_finish.3.t:0 "世界大战结束"
 bc_finish.3.d:0 "[SCOPE.sCountry('aus_scope').GetAdjective]在此次大战中解体，巴尔干诞生了一堆新生的国家，[SCOPE.sCountry('rus_scope').GetAdjective]爆发了十月革命，[SCOPE.sCountry('rus_scope').GetAdjective]境内各个分裂势力蠢蠢欲动，而[SCOPE.sCountry('pol_scope').GetAdjective]，这个在历史长河中几度沉浮的民族，也终于在战火的余烬中宣告复国。"
 bc_finish.3.f:0 "这不仅是一场战争的终结，更是一次对世界格局的彻底重塑——帝国的黄昏与新国的黎明交织，旧时代的规则被打破，新时代的序幕在硝烟中缓缓拉开。"
 bc_finish.3.a:0 "愿世界不再爆发战争！"
 bc_finish.3.b:0 "我们输了，一定是有人背后捣鬼"
 bc_finish.3.c:0 "犒劳士兵们，庆祝这来之不易的胜利"

 bc_finish.4.t:0 "同盟国已被组建！"
 bc_finish.4.d:0 "[SCOPE.sCountry('ger_scope').GetName]、[SCOPE.sCountry('aus_scope').GetName]与[SCOPE.sCountry('ita_scope').GetName]正式签订《三国同盟》。"
 bc_finish.4.f:0 "三国同盟条约主要内容：\n①如意大利遭到法国进攻，德、奥两国应全力援助，如德国遭受法国侵略，意大利也担负同样的义务。\n②缔约国的一国或两国遭受两个或两个以上的大国（指法、俄）进攻，则缔约3国应协同作战。意大利对此附有一个保留条件：如英国攻击德国或奥匈，意大利将不负援助自己盟国的义务 。\n③当一大国（指俄国）攻击缔约国一方时，其他两缔约国应取善意的中立，即一旦发生俄、奥战争，意大利将保守中立。"
 bc_finish.4.a:0 "我们拭目以待。"
 bc_finish.5.t:0 "协约国已被组建"
 bc_finish.5.d:0 "[SCOPE.sCountry('xieyue_gbr_scope').GetName]、[SCOPE.sCountry('fra_scope').GetName]与[SCOPE.sCountry('xieyue_rus_scope').GetName]正式签订《三国协约》。"
 bc_finish.5.f:0 "\n①划定波斯东南部为英国势力范围，北部为俄国势力范围，两者之间的地区为中立地带，对英俄两国平等开放；\n②俄国承认阿富汗在自己的势力范围之外，并承允英国代管阿富汗的外交。英国则声明不变更这个国家的政治地位；\n③尊重西藏的领土完整，不得干涉它的内政，只可经过中国政府中介与它进行交涉。"
 bc_finish.5.a:0 "我们走着瞧"

 bc_finish.6.t:0 "七月危机"
 bc_finish.6.d:0 "[SCOPE.sCountry('ser_scope').GetName]拒绝了[SCOPE.sCountry('aus_scope').GetName]的最后通牒"
 bc_finish.6.f:0 "[SCOPE.sCountry('aus_scope').GetName]的军国主义者大肆叫嚷，“拔出宝剑，对准[SCOPE.sCountry('ser_scope').GetName]”。\n\n#yellow 维也纳#!一家报纸写道：“六年来我们一直等待着一切严重的紧张局势最后爆发……我们要战争，因为这是我们人心的信念。我们的理想只有通过一次战争，用激进的突然方式才能实现：这是一个强盛的[SCOPE.sCountry('aus_scope').GetName]。\n\n[SCOPE.sCountry('ger_scope').GetName]渴求战争，认为1914年进行战争有利。\n\n1914年有两件事促使[SCOPE.sCountry('ger_scope').GetName]力求速战。一是6月间德国完成了基尔运河的加宽工程，使新造的“无畏舰”能从北海通过运河直接驶入波罗的海，加速军队调动的灵活性；二是4月份[SCOPE.sCountry('gbr_scope').GetName]开始同[SCOPE.sCountry('rus_scope').GetName]进行海军谈判，#yellow 小毛奇#!获知此事后，大为不安。6月1日，#yellow 小毛奇#!对曾出使英国多年的#yellow 埃克哈德施泰因#!说：我们已准备就绪，在我们是愈快愈好。"
 bc_finish.6.a:0 "国际条约不过是一张废纸"

l_simp_chinese:
 dnf_formation_decision:0 "成立多瑙联邦"
 dnf_formation_decision_desc:0 "由于民族主义有可能撕裂我们的国家，是时候考虑有关联邦政治构型的建议了。"
 DNF:0 "多瑙联邦"
 DNF_ADJ:0 "多瑙"
 je_dnf_constitution:0 "《多瑙宪法》"
 je_dnf_constitution_goal:0 "完成起草《多瑙宪法》。"
 je_dnf_constitution_reason:0 "我们必须选择那些被我们承认的国家来起草《多瑙联邦》。"
 dnf_invalid:0 "至少拥有4处不同的多瑙文化领土"
 dnf_available:0 "必须完成“多瑙联邦”相关的日志条目，并起码维持“财产投票”和“种族隔离”"

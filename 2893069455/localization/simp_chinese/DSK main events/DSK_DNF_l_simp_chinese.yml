 dnf_dis_possible:0 "成为多瑙联邦，并向北德扩展"
 dnf_dis_complete:0 "成立德意志"
 je_dnf_possible:0 "多瑙联邦"
 je_dnf_possible_goal:0 "完成联邦制的法律框架。"
 je_dnf_possible_reason:0 "一些知识分子向我们提出建议，希望将我们的帝国改造成联邦制。"
 je_dnf_dissolution:0 "多瑙解体"
 je_dnf_dissolution_reason:0 "成立德意志或清除多瑙文化将会引起重大动荡。"
 je_dnf_dissolution_goal:0 "成立德意志或清除多瑙文化将会引起重大动荡。"
 je_dnf_communism:0 "多瑙社会主义联邦"
 je_dnf_communism_reason:0 "完成此日志，以将多瑙联邦转变为一个国际主义工人国家"
 dnf_events.1.t:0 "多瑙联邦"
 dnf_events.1.d:0 "随着民族主义在我们国家内发展愈发壮大，一些学者提出了围绕民族建立一个帝国联邦的建议。通过起草一部各民族平等的宪法，把分离主义分子清扫出去。不过这个激进的建议肯定会激怒那些在以奥地利为中心的政权下享有许多特权的容克贵族们。"
 dnf_events.1.a:0 "我们必须现在起草《多瑙宪法》"
 dnf_events.1.f:0 "“对于哈布斯堡王朝来说，不同民族之间的巨大差异需要采用联邦国家的形式\""
 dnf_events.2.t:0 "多瑙宪法：波西米亚"
 dnf_events.2.d:0 "几个世纪以来，波西米亚一直是哈布斯堡家族的一个部分，所以波西米亚在我们的新联邦中得到承认是必要的。"
 dnf_events.2.a:0 "共同向前！"
 dnf_events.2.f:0 "“真理独胜”"
 dnf_events.3.t:0 "多瑙宪法：罗马尼亚问题"
 dnf_events.3.d:0 "外西凡尼亚公民大部分是罗马尼亚人，其中许多人渴望与其他的罗马尼亚人联合。现在是时候考虑罗马尼亚民族是否应在我们的新宪法中得到承认，而且有些罗马尼亚人甚至提议代表他们对整个罗马尼亚提出要求。"
 dnf_events.3.a:0 "我们必须在联邦中承认罗马尼亚人。"
 dnf_events.3.b:0 "让我们承认罗马尼亚人，并统一罗马尼亚！"
 dnf_events.3.c:0 "最好远离这个麻烦"
 dnf_events.3.f:0 "“合而为一”"
 dnf_events.4.t:0 "多瑙宪法：加利西亚问题"
 dnf_events.4.d:0 "我们的加利西亚领土上居住着波兰人和鲁塞尼亚人，他们是波兰分治时期的遗留物。提升波兰人的地位肯定会激怒其他拥有波兰领土的邻国，而承认这些鲁塞尼亚人则可能被俄罗斯人认为是一种轻视。"
 dnf_events.4.a:0 "我们只承认波兰人"
 dnf_events.4.b:0 "两个民族都应平等对待"
 dnf_events.4.c:0 "我们只承认鲁塞尼亚人"
 dnf_events.4.e:0 "最好别管这个烂摊子"
 dnf_events.4.f:0 "“也许瓜分波兰带来的麻烦远远超过价值 ”"
 dnf_events.5.t:0 "多瑙宪法：意大利问题"
 dnf_events.5.d:0 "我们守住了位于意大利的领土。这一地区的意大利民族主义愈发高涨，也许将其纳入我们的宪法会抑制分离主义。"
 dnf_events.5.a:0 "意大利人是联邦不可分割的一部分"
 dnf_events.5.b:0 "我们得避免火上浇油。"
 dnf_events.5.f:0 "“祝你平安，意大利！”"
 dnf_events.6.t:0 "多瑙宪法：克罗地亚问题"
 dnf_events.6.d:0 "克罗地亚长期以来一直是匈牙利王室和奥地利帝国的一部分。除了在我们的宪法中承认他们的国家之外，我们还可以选择对奥斯曼帝国统治下的克罗地亚人居住的领土提出要求。"
 dnf_events.6.a:0 "克罗地亚人将在新宪法中得到承认"
 dnf_events.6.b:0 "我们将从奥斯曼人的统治下解放克罗地亚人。"
 dnf_events.6.c:0 "没必要"
 dnf_events.6.f:0 "“基督之盾”"
 dnf_events.7.t:0 "《多瑙宪法》获得批准"
 dnf_events.7.d:0 "所有省份都批准了《多瑙宪法》，我们可能没有消除所有的分歧，但我们的联邦肯定会预示着一个稳定和进步的新时代。"
 dnf_events.7.a:0 "多瑙万岁！"
 dnf_events.7.f:0 "“不可分割”"
 dnf_events.8.t:0 "多瑙联邦？"
 dnf_events.8.d:0 "随着民族主义在我们国家内发展愈发壮大，一些学者提出了围绕民族建立一个帝国联邦的建议。通过起草一部各民族平等的宪法，把分离主义分子清扫出去。不过这个激进的建议肯定会激怒那些在以奥地利为中心的政权下享有许多特权的容克贵族们。"
 dnf_events.8.a:0 "我们将起草新宪法"
 dnf_events.8.b:0 "没这个必要。"
 dnf_events.8.f:0 "“对于哈布斯堡王朝来说，不同民族之间的巨大差异需要采用联邦国家的形式\""
 dnf_events.9.t:0 "多瑙解体"
 dnf_events.9.d:0 "废除《多瑙宪法》以支持一个统一的德国国家，这在多瑙河各个民族中引起了骚动。多瑙河的精英们感到他们将再次沦为二等公民，要求保留一个独立于德意志的联邦政治机构。"
 dnf_events.9.a:0 "只要他们仍然是我们的臣民，我们就会批准这个请求。"
 dnf_events.9.b:0 "无视他们。"
 dnf_events.9.f:0 "“平等还是独立!”"
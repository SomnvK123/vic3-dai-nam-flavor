 ig_imperial_harem:0 "皇宫内廷"
 ig_imperial_harem_desc:0 "由于欧洲艺术家过于活跃的想象力，皇宫内廷以堕落闻名。然而它其实是苏丹在宫廷中权力的支柱，由亲族、顾问、仆人和各种各样的侍从组成。忠于皇室的人倾向于支持中央集权和现代化的政策。"

 je_group_anzfm_australia: "澳大利亚殖民地"

 je_anzfm_colonial_society: "澳大利亚殖民地社会"
 je_anzfm_colonial_society_reason: "澳大利亚殖民地并非只是帝国地图上的远方港口。淘金者、牧场主、矿工、报刊编辑、原住民保护官、总督府官僚与自治议会议员，正在同一片大陆上争夺未来。\n\n#bold 淘金压力#!会带来移民、财富与矿场冲突；#bold 劳工压力#!会推动八小时工作制、工会与早期工党政治；#bold 边疆压力#!会暴露殖民扩张背后的暴力；#bold 联邦压力#!则会把关税、铁路、防务和帝国依赖推向同一个问题：这些殖民地是否应当成为一个国家？\n\n当前联邦压力：[ROOT.GetCountry.MakeScope.Var('anzfm_federation_pressure_var').GetValue|0]\n淘金压力：[ROOT.GetCountry.MakeScope.Var('anzfm_goldfields_pressure_var').GetValue|0]\n劳工压力：[ROOT.GetCountry.MakeScope.Var('anzfm_labour_pressure_var').GetValue|0]\n边疆压力：[ROOT.GetCountry.MakeScope.Var('anzfm_frontier_pressure_var').GetValue|0]\n帝国依赖：[ROOT.GetCountry.MakeScope.Var('anzfm_imperial_dependency_var').GetValue|0]"
 je_anzfm_status_settler_colony: "殖民地社会仍在扩张。牧场、港口、矿区和自治议会还没有形成共同的国家想象。"
 je_anzfm_status_gold: "淘金热正在改变殖民地社会。矿工、移民和执照官的冲突会把自治问题推到台前。"
 je_anzfm_status_frontier: "边疆冲突正在塑造殖民地政治。扩张、保护、驱逐和法律身份之间的矛盾无法再被忽视。"
 je_anzfm_status_labour: "劳工政治正在升温。八小时工作制、工会和剪羊毛工罢工会改变殖民地议会的语言。"
 je_anzfm_status_federation: "联邦运动已经成熟。关税、防务、铁路与民族身份正在把各殖民地推向共同宪制。"
 anzfm_federation_complete_tt: "澳大利亚殖民地社会已经积累足够的联邦压力，或澳大利亚共同体已经形成。"

 anzfm_federation_progress_bar: "殖民地整合"
 anzfm_federation_progress_bar_desc: "联邦压力、劳工妥协、边疆危机与帝国依赖共同决定澳大利亚殖民地能否形成更稳定的共同政治。"
 anzfm_progress_from_federation_pressure: "联邦议题成熟"
 anzfm_progress_from_labour_settlement: "劳工政治制度化"
 anzfm_progress_lost_to_frontier_crisis: "边疆危机撕裂公共政治"
 anzfm_progress_lost_to_imperial_dependency: "依赖帝国庇护"

 anzfm_call_federal_convention_button: "召开联邦会议"
 anzfm_call_federal_convention_button_desc: "召集殖民地代表讨论关税、铁路、防务和宪法问题。"
 anzfm_call_federal_convention_tt: "需要较高联邦压力。1889年以后，即使仍是帝国附属，也可在殖民地间推动会议。"
 anzfm_fund_intercolonial_telegraph_button: "资助殖民地间电报"
 anzfm_fund_intercolonial_telegraph_button_desc: "铺设电报与行政通信网络，让各殖民地第一次像一个整体那样互相感知。"
 anzfm_intercolonial_telegraph_tt: "需要铁路或电气相关技术。此举会花费国库，提高联邦压力并降低帝国依赖。"
 anzfm_adopt_eight_hour_standard_button: "承认八小时标准"
 anzfm_adopt_eight_hour_standard_button_desc: "将墨尔本石匠、矿区工人和港口劳工的诉求转化为殖民地政治中的劳工标准。"
 anzfm_eight_hour_standard_tt: "需要较高劳工压力，或工会已经不再边缘化。"
 anzfm_raise_colonial_defence_button: "建立殖民地防务体系"
 anzfm_raise_colonial_defence_button_desc: "在帝国舰队之外组织本地防务，回应太平洋与印度洋方向的新威胁。"
 anzfm_colonial_defence_tt: "需要进入较晚的殖民地时期。"

 modifier_anzfm_goldfields_license_hunts: "矿场执照搜检"
 modifier_anzfm_goldfields_license_hunts_desc: "殖民政府以执照和警力控制金矿区，短期增加权威，却会伤害自治合法性。"
 modifier_anzfm_eureka_memory: "尤里卡记忆"
 modifier_anzfm_eureka_memory_desc: "矿工抗议被镇压后，殖民地社会把自治、代表权和民兵传统重新编织成政治记忆。"
 modifier_anzfm_intercolonial_telegraph: "殖民地间电报"
 modifier_anzfm_intercolonial_telegraph_desc: "电报线路把港口、矿区和议会连成一张更紧密的政治网络。"
 modifier_anzfm_eight_hour_momentum: "八小时运动"
 modifier_anzfm_eight_hour_momentum_desc: "劳工组织将工作时间、工资和代表权联系起来。"
 modifier_anzfm_squatter_resistance: "大牧场主抵制"
 modifier_anzfm_squatter_resistance_desc: "大牧场主反对小农选择法和更紧密的殖民地行政。"
 modifier_anzfm_closer_settlement: "小农定居"
 modifier_anzfm_closer_settlement_desc: "更密集的定居政策鼓励移民和内陆开发，但也会推动边疆矛盾。"
 modifier_anzfm_frontier_police: "边疆骑警"
 modifier_anzfm_frontier_police_desc: "殖民地以警力维持扩张秩序，这会加深边疆社会的暴力结构。"
 modifier_anzfm_protection_board: "原住民保护委员会"
 modifier_anzfm_protection_board_desc: "保护制度试图把边疆冲突纳入行政管理，但它本身也会成为控制与同化的工具。"
 modifier_anzfm_federal_convention: "联邦会议"
 modifier_anzfm_federal_convention_desc: "殖民地代表开始把关税、防务和铁路问题写成共同宪制。"
 modifier_anzfm_colonial_defence_scheme: "殖民地防务体系"
 modifier_anzfm_colonial_defence_scheme_desc: "本地防务组织让殖民地不再完全依赖帝国舰队。"
 modifier_anzfm_pacific_labour_trade: "太平洋契约劳工贸易"
 modifier_anzfm_pacific_labour_trade_desc: "北部种植园依赖来自太平洋岛屿的契约劳工，带来利润，也带来劳工政治和帝国道德压力。"
 modifier_anzfm_pacific_labour_regulation: "太平洋劳工管制"
 modifier_anzfm_pacific_labour_regulation_desc: "殖民地政府尝试登记、审查和限制太平洋劳工贸易，以换取更稳定的公共秩序。"
 modifier_anzfm_maritime_strike_compromise: "海运罢工妥协"
 modifier_anzfm_maritime_strike_compromise_desc: "政府承认劳工组织的部分诉求，换取港口、剪羊毛站和铁路系统恢复秩序。"
 modifier_anzfm_immigration_restriction: "移民限制政治"
 modifier_anzfm_immigration_restriction_desc: "大众政治把工资、防务、种族身份和国家建构纠缠在一起，推动更排他的联邦想象。"

 anzfm.010.t: "矿场执照搜检"
 anzfm.010.d: "金矿区的财富吸引了成千上万的移民，也让执照官、警察和矿工之间的冲突日益公开。"
 anzfm.010.f: "帐篷、泥浆、酒馆和报纸摊之间，一张执照纸比王冠更像权力本身。"
 anzfm.010.a: "搜检无照矿工。"
 anzfm.010.b: "让矿工代表进入地方政治。"

 anzfm.011.t: "八小时日"
 anzfm.011.d: "工匠、石匠和矿工正在把工作时间变成政治问题。八小时工作、八小时休息、八小时留给自己，这句口号在殖民地城市里传播开来。"
 anzfm.011.f: "他们并不只是在谈工资。他们在谈一个自由工人该如何支配自己的一天。"
 anzfm.011.a: "承认劳工标准。"
 anzfm.011.b: "雇主不能被街头口号支配。"

 anzfm.012.t: "选择法与大牧场"
 anzfm.012.d: "内陆土地被大牧场主长期占据，小农定居者则要求开放选择权。殖民地议会必须决定，土地是羊毛资本的领地，还是移民社会的基础。"
 anzfm.012.f: "地图上的空白处早已有居民，也早已有宣称拥有它的人。"
 anzfm.012.a: "支持小农定居。"
 anzfm.012.b: "保护牧场租约。"

 anzfm.013.t: "边疆的法律"
 anzfm.013.d: "殖民扩张把警察、牧场、传教站和原住民社群推到同一条边疆线上。行政报告称之为秩序，边疆居民却知道那是更复杂的东西。"
 anzfm.013.f: "当法律走到地图边缘，它常常先变成枪声，然后才变成档案。"
 anzfm.013.a: "扩大边疆骑警。"
 anzfm.013.b: "建立保护委员会。"

 anzfm.014.t: "殖民地报刊网络"
 anzfm.014.d: "报纸把墨尔本、悉尼、阿德莱德和布里斯班的争论连在一起。关税、铁路、移民、劳工和防务第一次被写成同一个公共问题。"
 anzfm.014.f: "殖民地之间的距离没有缩短，但每天早晨，铅字让距离显得可以被争论。"
 anzfm.014.a: "让报刊推动公共讨论。"
 anzfm.014.b: "压住过于激进的编辑。"

 anzfm.015.t: "关税边界"
 anzfm.015.d: "各殖民地之间的关税壁垒让商人、铁路公司和港口利益集团互相抱怨。统一市场的想法不再只是理论。"
 anzfm.015.f: "货物在码头卸下，又在殖民地边界前被文书和印章重新捆住。"
 anzfm.015.a: "推动殖民地关税协调。"
 anzfm.015.b: "保护本地港口利益。"

 anzfm.016.t: "太平洋防务恐慌"
 anzfm.016.d: "德国、法国和其他列强在太平洋的活动使殖民地议会开始质疑，完全依赖伦敦是否足够安全。"
 anzfm.016.f: "帝国舰队很大，但海也很大。"
 anzfm.016.a: "组织本地防务。"
 anzfm.016.b: "继续依靠英国。"

 anzfm.017.t: "北方甘蔗地的劳工"
 anzfm.017.d: "昆士兰和北部边疆的种植园要求稳定而廉价的劳动力，太平洋岛民契约劳工贸易因此成为议会、传教士、雇主和工会之间的尖锐争端。"
 anzfm.017.f: "船只带来的不只是劳动力，还有契约、债务、翻译错误和良心不安。"
 anzfm.017.a: "默许种植园招募。"
 anzfm.017.b: "登记并限制劳工贸易。"

 anzfm.018.t: "海运大罢工"
 anzfm.018.d: "码头、铁路、剪羊毛站和船运公司之间的冲突连成一片。劳工组织要求承认，雇主则担心殖民地经济被工会挟持。"
 anzfm.018.f: "一艘船停在港口，整片大陆都开始听见锁链的声音。"
 anzfm.018.a: "促成劳资妥协。"
 anzfm.018.b: "支持雇主恢复秩序。"

 anzfm.019.t: "移民限制的语言"
 anzfm.019.d: "大众政治把工资、种族身份、帝国关系和国家建构纠缠在一起。许多议员声称，未来的联邦必须先决定谁可以成为这个国家的一部分。"
 anzfm.019.f: "国家有时先在边界上被想象，然后才在宪法里被命名。"
 anzfm.019.a: "把限制写入联邦议程。"
 anzfm.019.b: "维护更开放的帝国通道。"

 anzfm.020.t: "联邦会议"
 anzfm.020.d: "殖民地代表齐聚一堂，讨论关税、铁路、防务、参议院席位和一部可能共同约束所有殖民地的宪法。"
 anzfm.020.f: "每个人都说自己是来谈实际问题的。可当他们把问题写在同一张纸上时，一个国家的轮廓已经出现。"
 anzfm.020.a: "把会议推向宪法草案。"
 anzfm.020.b: "先从关税与铁路协调开始。"

 anzfm.030.t: "殖民地成为共同体"
 anzfm.030.d: "淘金热、劳工政治、边疆行政、报刊网络和防务恐慌把分散的殖民地推向共同政治。无论法律上的联邦是否已经完成，澳大利亚社会已经不再只是若干港口殖民地的总和。"
 anzfm.030.f: "一片大陆先在争论中被想象，随后才在法律中被命名。"
 anzfm.030.a: "澳大利亚问题进入新的时代。"
 
 je_anzfm_goldfields_and_migration: "金矿地、移民与殖民秩序"
 je_anzfm_goldfields_and_migration_reason: "[ROOT.GetCountry.GetName]的金矿地正在把人口、资本、报纸和警察一起拖向内陆。[SCOPE.sCountry('anzfm_britain_scope').GetName]可以提供帝国名义，却不能替本地政府决定执照、华人矿工、矿区司法、卫生与水权应当如何安排。\n\n当前金矿压力：[ROOT.GetCountry.MakeScope.Var('anzfm_goldfields_pressure_var').GetValue|0]\n联邦压力：[ROOT.GetCountry.MakeScope.Var('anzfm_federation_pressure_var').GetValue|0]\n劳工压力：[ROOT.GetCountry.MakeScope.Var('anzfm_labour_pressure_var').GetValue|0]"
 je_anzfm_goldfields_status_eureka: "尤里卡记忆仍在矿区回响。矿工不再只要求降低执照费，他们要求在[ROOT.GetCountry.GetName]的公共政治中被听见。"
 je_anzfm_goldfields_status_unrest: "金矿压力正在升高。若没有矿业委员会、地方审判或移民区治理，财富会很快变成激进政治。"
 je_anzfm_goldfields_status_rush: "[SCOPE.sState('anzfm_colonial_state_scope').GetName]一带的人口流动仍在改变殖民社会。每一条新路、每一份执照、每一张报纸都可能成为制度问题。"
 anzfm_goldfields_complete_tt: "通过矿区治理、移民安置和地方司法把金矿热纳入稳定殖民秩序。"

 je_anzfm_labour_charter: "八小时、工会与劳工宪章"
 je_anzfm_labour_charter_reason: "[SCOPE.sInterestGroup('anzfm_trade_unions_scope').GetName]不再只是城市边缘的行会与互助社。矿工、剪羊毛工、码头工人、铁路工和印刷工正在把工资、工时、仲裁、公共卫生与代表权写成同一份劳工宪章。\n\n当前劳工压力：[ROOT.GetCountry.MakeScope.Var('anzfm_labour_pressure_var').GetValue|0]\n联邦压力：[ROOT.GetCountry.MakeScope.Var('anzfm_federation_pressure_var').GetValue|0]"
 je_anzfm_labour_status_party: "劳工政治已经进入议会。工会、报纸和地方支部正在学习如何把罢工纪律翻译成选票纪律。"
 je_anzfm_labour_status_strike: "劳工压力过高。若政府拒绝仲裁与工厂监察，海运、矿山和城市作坊可能连成一场更大的危机。"
 je_anzfm_labour_status_eight_hour: "八小时标准已经成为公共语言。接下来要决定的是，它只是惯例，还是一种可执行的制度。"
 je_anzfm_labour_status_workshops: "城市作坊、矿山与港口正在形成新的阶级政治。[SCOPE.sCharacter('anzfm_union_leader_scope').GetFullName]一类人物会越来越难被当作地方麻烦处理。"
 anzfm_labour_charter_complete_tt: "把八小时标准、工会承认、仲裁与城市公共卫生纳入可持续的劳工制度。"

 je_anzfm_frontier_governance: "边疆治理与原住民政策"
 je_anzfm_frontier_governance_reason: "[ROOT.GetCountry.GetName]的边疆不是地图空白，而是牧场、矿区、警察、传教站、保护官署与原住民社群交叠的政治空间。政府必须决定，扩张靠暴力被动维持，还是被记录、审查、财政和法律约束起来。\n\n当前边疆压力：[ROOT.GetCountry.MakeScope.Var('anzfm_frontier_pressure_var').GetValue|0]\n帝国依赖：[ROOT.GetCountry.MakeScope.Var('anzfm_imperial_dependency_var').GetValue|0]"
 je_anzfm_frontier_status_police: "边疆骑警让秩序看似可见，却也让暴力结构更深地嵌入行政。"
 je_anzfm_frontier_status_board: "保护委员会开始把边疆问题写进文书、预算和官署报告，但保护与控制之间的界线依旧危险。"
 je_anzfm_frontier_status_crisis: "边疆压力已接近失控。牧场扩张、粮食配给、证词资格和警务调查都可能引爆公共丑闻。"
 je_anzfm_frontier_status_survey: "[SCOPE.sState('anzfm_colonial_state_scope').GetName]的土地测量正在推进。每一条测线都可能同时制造财产、道路和冲突。"
 anzfm_frontier_governance_complete_tt: "用调查、保护官署、粮食与水源治理、证词制度和公开审查控制边疆危机。"

 je_anzfm_federal_conventions: "殖民地会议与联邦契约"
 je_anzfm_federal_conventions_reason: "铁路轨距、关税墙、邮政、海防、移民、法院上诉和首府选址正在把[ROOT.GetCountry.GetName]推向共同宪制。[SCOPE.sCountry('anzfm_nsw_scope').GetName]、[SCOPE.sCountry('anzfm_sas_scope').GetName]、[SCOPE.sCountry('anzfm_was_scope').GetName]与[SCOPE.sCountry('anzfm_tas_scope').GetName]各有算盘，但帝国距离和本地利益都在逼迫它们谈判。\n\n当前联邦压力：[ROOT.GetCountry.MakeScope.Var('anzfm_federation_pressure_var').GetValue|0]\n帝国依赖：[ROOT.GetCountry.MakeScope.Var('anzfm_imperial_dependency_var').GetValue|0]"
 je_anzfm_federal_status_bill: "共同体法案已经成形。现在的问题不只是能否联邦，而是谁会在联邦内拥有否决权、税收权和上诉权。"
 je_anzfm_federal_status_referendum: "公投语言正在形成。报纸、学校读本、工会会议和商会宴会都在解释未来国家应当是什么。"
 je_anzfm_federal_status_conference: "总理会议把殖民地利益集中到同一张桌上。每一次妥协都让共同宪制更现实，也更难回头。"
 je_anzfm_federal_status_public: "公众仍在学习把港口、牧场、矿区和岛屿想象成同一个政治共同体。"
 anzfm_federal_compact_complete_tt: "通过会议、法案、公投、帝国御准和共同制度完成联邦契约。"

 anzfm_goldfields_order_bar: "金矿秩序"
 anzfm_goldfields_order_bar_desc: "衡量金矿地能否从淘金热、执照冲突和移民拥挤中形成可持续的殖民治理。"
 anzfm_goldfields_order_from_commission: "矿业委员会稳定执照争议"
 anzfm_goldfields_order_from_migrant_wards: "移民区自治吸纳新来者"
 anzfm_goldfields_order_lost_to_license_hunts: "执照搜查与矿区不满"
 anzfm_labour_charter_bar: "劳工宪章"
 anzfm_labour_charter_bar_desc: "衡量八小时、工会承认、仲裁和城市公共卫生能否被制度化。"
 anzfm_labour_charter_from_eight_hour: "八小时标准成为公共惯例"
 anzfm_labour_charter_from_arbitration: "仲裁法院缓和劳资冲突"
 anzfm_labour_charter_from_trades_hall: "工人大厅组织化劳工政治"
 anzfm_labour_charter_lost_to_strikes: "罢工压力撕裂议会秩序"
 anzfm_frontier_governance_bar: "边疆治理"
 anzfm_frontier_governance_bar_desc: "衡量扩张边疆能否被调查、预算、保护官署和公开审查约束。"
 anzfm_frontier_from_commission: "边疆委员会整理证词"
 anzfm_frontier_from_protection_office: "保护官署获得经费"
 anzfm_frontier_lost_to_crisis: "边疆危机腐蚀合法性"
 anzfm_federal_compact_bar: "联邦契约"
 anzfm_federal_compact_bar_desc: "衡量殖民地会议、共同体法案、公投与帝国御准能否汇合成联邦。"
 anzfm_federal_from_conference: "总理会议形成工作程序"
 anzfm_federal_from_bill: "共同体法案固定谈判成果"
 anzfm_federal_from_pressure: "联邦压力推动共同宪制"
 anzfm_federal_lost_to_dependency: "帝国依赖拖慢本地契约"

 anzfm_issue_mining_commission_button: "任命矿业委员会"
 anzfm_issue_mining_commission_button_desc: "派出委员调查执照、警务、矿权和矿区司法，把淘金热从街头冲突转入制度谈判。"
 anzfm_issue_mining_commission_tt: "需要进入金矿时代。花费国库，降低金矿压力，并推进金矿秩序。"
 anzfm_charter_migrant_wards_button: "设立移民区议事会"
 anzfm_charter_migrant_wards_button_desc: "在矿区和港口建立移民区议事会，让新来者通过地方制度处理救济、翻译、卫生和警务投诉。"
 anzfm_charter_migrant_wards_tt: "需要金矿压力至少达到 20。花费国库，提高联邦压力，并推进金矿秩序。"
 anzfm_convene_trades_hall_button: "召集工人大厅"
 anzfm_convene_trades_hall_button_desc: "承认城市工会与行业代表的公共会议，让劳工诉求进入可协商的政治空间。"
 anzfm_convene_trades_hall_tt: "需要劳工压力至少达到 25。花费国库，降低劳工压力，并推进劳工宪章。"
 anzfm_create_arbitration_court_button: "建立劳资仲裁法院"
 anzfm_create_arbitration_court_button_desc: "用法院和调解员替代码头、矿山和剪羊毛站的长期对峙。"
 anzfm_create_arbitration_court_tt: "需要工人大厅，或劳工压力至少达到 45。花费国库，降低劳工压力，并推进劳工宪章。"
 anzfm_send_frontier_commission_button: "派出边疆调查委员会"
 anzfm_send_frontier_commission_button_desc: "让行政官、传教士、牧场代表与原住民证词进入同一份调查档案。"
 anzfm_send_frontier_commission_tt: "需要控制澳大利亚殖民地。花费国库，降低边疆压力，并推进边疆治理。"
 anzfm_fund_protection_office_button: "拨款保护官署"
 anzfm_fund_protection_office_button_desc: "为保护官、译员、粮食配给和档案登记提供预算，将边疆政策从临时命令改为官署制度。"
 anzfm_fund_protection_office_tt: "需要边疆压力至少达到 20。花费国库，降低边疆压力，并推进边疆治理。"
 anzfm_invite_premiers_conference_button: "邀请殖民地总理会议"
 anzfm_invite_premiers_conference_button_desc: "把关税、邮政、铁路、防务和宪制问题交给各殖民地政府正式谈判。"
 anzfm_invite_premiers_conference_tt: "需要联邦压力至少达到 35。花费国库，推进联邦契约。"
 anzfm_draft_commonwealth_bill_button: "起草共同体法案"
 anzfm_draft_commonwealth_bill_button_desc: "将会议妥协写成可提交帝国与殖民地公投的共同体法案。"
 anzfm_draft_commonwealth_bill_tt: "需要总理会议，或联邦压力至少达到 75。花费大量国库，显著推进联邦契约。"

 modifier_anzfm_goldfields_while_active: "金矿社会升温"
 modifier_anzfm_goldfields_while_active_desc: "矿区人口流动正在拉高迁徙吸引力，也迫使政府持续处理执照、营地和司法问题。"
 modifier_anzfm_labour_charter_while_active: "劳工组织化"
 modifier_anzfm_labour_charter_while_active_desc: "工会、报纸和行业会议让劳工政治更有组织，也更难被忽视。"
 modifier_anzfm_frontier_governance_while_active: "边疆行政负担"
 modifier_anzfm_frontier_governance_while_active_desc: "测量、警务、保护、传教站和粮食配给正在消耗殖民地官僚能力。"
 modifier_anzfm_federal_conventions_while_active: "联邦会议政治"
 modifier_anzfm_federal_conventions_while_active_desc: "会议、委员会和跨殖民地通信提高声望，也让官僚系统承受额外压力。"
 modifier_anzfm_mining_commission: "矿业委员会"
 modifier_anzfm_mining_commission_desc: "矿业委员会将执照、矿权和警务问题转入调查程序。"
 modifier_anzfm_arbitration_court: "劳资仲裁法院"
 modifier_anzfm_arbitration_court_desc: "仲裁法院承认劳工组织的谈判地位，同时让雇主感到制度约束。"
 modifier_anzfm_frontier_commission: "边疆调查委员会"
 modifier_anzfm_frontier_commission_desc: "边疆调查委员会收集证词、绘制地图并迫使行政官提交报告。"
 modifier_anzfm_commonwealth_bill: "共同体法案"
 modifier_anzfm_commonwealth_bill_desc: "共同体法案把分散的殖民地会议成果组织成一套可提交公投与御准的宪制文本。"

 anzfm.034.t: "矿工法庭"
 anzfm.034.d: "[SCOPE.sState('anzfm_colonial_state_scope').GetName]的矿工代表要求设立地方矿工法庭，处理小额矿权、执照罚款和警务投诉。他们声称，[ROOT.GetCountry.GetName]若要征税，就必须承认矿区也有自己的公共秩序。"
 anzfm.034.f: "帐篷之间的木桌不大，但围在周围的人已经把它当作一间议会。"
 anzfm.034.a: "承认矿工法庭。"
 anzfm.034.b: "执照官仍代表政府。"
 anzfm.035.t: "华人矿工请愿"
 anzfm.035.d: "来自金矿地的华人矿工向[ROOT.GetCountry.GetName]递交请愿，要求保护营地、翻译契约，并限制地方暴民袭击。商人担心秩序，工人担心工资，报纸则把这件事变成了殖民地身份问题。"
 anzfm.035.f: "请愿书上的名字被写成许多种样子，但每一种都在要求同一件事：被算作人。"
 anzfm.035.a: "设立翻译与保护程序。"
 anzfm.035.b: "让地方警务自行处理。"
 anzfm.036.t: "黄金押运队"
 anzfm.036.d: "金矿产出吸引了劫掠、投机与财政焦虑。[SCOPE.sCountry('anzfm_britain_scope').GetName]建议强化押运与武装警备，但矿工代表认为这是把金矿地当作军营。"
 anzfm.036.f: "黄金在车厢里沉默，护卫的枪却让每一条路都显得很吵。"
 anzfm.036.a: "组织官方押运。"
 anzfm.036.b: "让地方银行与矿区自治分担风险。"
 anzfm.037.t: "水权与淘洗槽"
 anzfm.037.d: "[SCOPE.sState('anzfm_colonial_state_scope').GetName]的溪流被淘洗槽、蒸汽泵和临时水渠争夺。若没有测量与投资，矿区财富会被泥浆、水权诉讼和营地疾病慢慢消耗。"
 anzfm.037.f: "在金矿地，水有时比黄金更能决定谁留下来。"
 anzfm.037.a: "资助水渠和测量。"
 anzfm.037.b: "让矿工自行争取水源。"
 anzfm.038.t: "矿区报纸"
 anzfm.038.d: "矿区报纸把执照搜查、华人营地、矿权法庭和警察暴力写成每天都能阅读的政治。它们让遥远的议会第一次听见泥地里的声音。"
 anzfm.038.f: "铅字比马车慢，却比谣言更难被赶出城镇。"
 anzfm.038.a: "让报纸成为公共监督。"
 anzfm.038.b: "压制煽动性报道。"
 anzfm.039.t: "深井公司的到来"
 anzfm.039.d: "浅层砂金正在减少，股份公司和机械采矿进入矿区。独立淘金者担心被排挤，银行家则声称只有资本才能维持繁荣。"
 anzfm.039.f: "淘金盘被放到墙上作纪念，账本和蒸汽泵开始说话。"
 anzfm.039.a: "规范公司矿权。"
 anzfm.039.b: "让资本自然整合矿区。"

 anzfm.040.t: "劳工专栏"
 anzfm.040.d: "工会记者在[ROOT.GetCountry.GetName]的报纸上开设劳工专栏，记录工时、工伤、工资拖欠和雇主黑名单。[SCOPE.sInterestGroup('anzfm_trade_unions_scope').GetName]希望这能把行业抱怨变成公共议题。"
 anzfm.040.f: "有些罢工从码头开始，有些从一栏小字开始。"
 anzfm.040.a: "允许劳工报刊进入公共讨论。"
 anzfm.040.b: "警告编辑不要煽动阶级政治。"
 anzfm.041.t: "剪羊毛工联合"
 anzfm.041.d: "内陆剪羊毛工开始跨牧场组织工资与住宿标准。[SCOPE.sInterestGroup('anzfm_landowners_scope').GetName]担心合同自由被破坏，[SCOPE.sInterestGroup('anzfm_trade_unions_scope').GetName]则称这是荒野中的最低文明。"
 anzfm.041.f: "羊毛被打包运走，争议却沿着同一条路回到城里。"
 anzfm.041.a: "承认行业调解。"
 anzfm.041.b: "维护牧场主合同权。"
 anzfm.042.t: "工厂监察"
 anzfm.042.d: "城市作坊和食品厂事故频发，改革者要求[ROOT.GetCountry.GetName]任命监察员，检查通风、儿童劳动、机器防护与宿舍卫生。"
 anzfm.042.f: "机器的声音盖住了咳嗽，直到咳嗽变成议会记录。"
 anzfm.042.a: "建立工厂监察制度。"
 anzfm.042.b: "不要给小雇主增加负担。"
 anzfm.043.t: "失业者游行"
 anzfm.043.d: "经济波动让失业工人走上街头，要求公共工程、廉价住房和救济厨房。[ROOT.GetCountry.GetName]必须决定这是短期治安问题，还是城市社会的新常态。"
 anzfm.043.f: "他们不是来推翻政府的。他们只是要求政府承认他们还在这里。"
 anzfm.043.a: "启动城市救济工程。"
 anzfm.043.b: "驱散游行队伍。"
 anzfm.044.t: "劳工议员团"
 anzfm.044.d: "[SCOPE.sInterestGroup('anzfm_trade_unions_scope').GetName]的地方组织开始推举候选人，形成早期劳工议员团。罢工、会费和报纸终于被翻译成了议会席位。"
 anzfm.044.f: "会议室里仍有煤尘味，但门牌上已经写着议员。"
 anzfm.044.a: "接受劳工议员团。"
 anzfm.044.b: "让旧党派吸收他们。"
 anzfm.045.t: "工会会费案"
 anzfm.045.d: "法院正在审理工会会费、罢工基金和雇主索赔问题。若[ROOT.GetCountry.GetName]不明确工会法人地位，每一次罢工都可能变成财政毁灭。"
 anzfm.045.f: "法官问的是账户，工人听见的却是生存权。"
 anzfm.045.a: "保护合法会费与互助基金。"
 anzfm.045.b: "让法院保持最大裁量。"

 anzfm.046.t: "骑警报告"
 anzfm.046.d: "来自边疆骑警的报告描述了冲突、报复和粮食站争议。文件要求更多授权，传教士却要求独立调查。[ROOT.GetCountry.GetName]不能再把边疆暴力藏在距离里。"
 anzfm.046.f: "地图上只是一条虚线，报告里却是名字、枪声和沉默。"
 anzfm.046.a: "审查骑警行动。"
 anzfm.046.b: "给边疆警务更大自由。"
 anzfm.047.t: "传教学校"
 anzfm.047.d: "传教组织请求经费建立原住民学校。[SCOPE.sInterestGroup('anzfm_intelligentsia_scope').GetName]认为教育和记录可以减轻边疆冲突，批评者则指出这也可能成为同化与控制的工具。"
 anzfm.047.f: "黑板上的字母被称作文明，但孩子们知道，名字也可能被擦掉。"
 anzfm.047.a: "资助并要求公开报告。"
 anzfm.047.b: "把学校交给地方社团。"
 anzfm.048.t: "牧场测量"
 anzfm.048.d: "[SCOPE.sInterestGroup('anzfm_landowners_scope').GetName]要求加快牧场测量和租约登记，声称没有财产权就没有投资。小农、原住民社群和边疆官员则担心测量会把争议永久化。"
 anzfm.048.f: "测量链落地的声音很轻，却能把许多人从土地上推开。"
 anzfm.048.a: "谨慎测量并记录争议。"
 anzfm.048.b: "优先确认牧场租约。"
 anzfm.049.t: "边疆电报线"
 anzfm.049.d: "电报线将港口、牧场与行政站连接起来。它能让求援更快，也能让扩张更深。[ROOT.GetCountry.GetName]必须决定这条线服务于治理，还是只服务于占有。"
 anzfm.049.f: "铜线越过灌木丛，把远方变成了等待回复的近处。"
 anzfm.049.a: "把电报纳入边疆治理。"
 anzfm.049.b: "优先服务帝国通信。"
 anzfm.050.t: "保护档案"
 anzfm.050.d: "保护官署开始登记口粮、迁移、儿童、工契和投诉。改革者称档案能带来监督，反对者则说档案本身也可能成为支配。"
 anzfm.050.f: "纸张不会流血，但它能决定谁被允许移动。"
 anzfm.050.a: "公开年度报告。"
 anzfm.050.b: "把档案列为内部文件。"
 anzfm.051.t: "口粮站"
 anzfm.051.d: "干旱与牧场扩张让边疆口粮站承受压力。若政府拒绝拨款，地方官员将依靠临时施舍、警务威胁和传教站债务维持秩序。"
 anzfm.051.f: "一袋面粉有时是一项政策，有时是一道命令。"
 anzfm.051.a: "稳定口粮与医疗预算。"
 anzfm.051.b: "让地方自行筹措。"

 anzfm.052.t: "总理会议秘书处"
 anzfm.052.d: "各殖民地总理要求设立秘书处，记录会议、分发议程、统计关税与铁路数据。没有文书机器，联邦只是演讲；有了文书机器，它就开始像国家。"
 anzfm.052.f: "国家有时先以会议纪要的形式出生。"
 anzfm.052.a: "资助常设秘书处。"
 anzfm.052.b: "保持松散会议。"
 anzfm.053.t: "布拉登条款"
 anzfm.053.d: "关税收入分配成为联邦谈判核心。较小殖民地担心财政被大港口吞没，商人则担心共同税制会牺牲贸易灵活性。"
 anzfm.053.f: "在纸面上是百分比，在议会里是生死线。"
 anzfm.053.a: "以财政返还换取支持。"
 anzfm.053.b: "拒绝复杂妥协。"
 anzfm.054.t: "首都地点"
 anzfm.054.d: "[SCOPE.sCountry('anzfm_nsw_scope').GetName]和南方殖民地都不愿让对方独占未来首都。折中地点或许荒凉，却能把妒忌写成地理平衡。"
 anzfm.054.f: "一座尚未存在的城市，已经让存在的城市争吵不休。"
 anzfm.054.a: "寻找折中首都。"
 anzfm.054.b: "让最大城市自然胜出。"
 anzfm.055.t: "铁路轨距"
 anzfm.055.d: "各殖民地铁路轨距不一，货物和旅客在边界被迫换车。工程师要求统一，财政官要求省钱，地方公司则守着既有合同。"
 anzfm.055.f: "火车没有国界感，但铁轨有。"
 anzfm.055.a: "资助轨距协调。"
 anzfm.055.b: "各殖民地自行负责。"
 anzfm.056.t: "参议院妥协"
 anzfm.056.d: "小殖民地要求平等代表，大殖民地要求人口原则。若不能在参议院找到妥协，联邦契约会被规模恐惧撕裂。"
 anzfm.056.f: "每个人都说自己代表人民，只是人民的计算方式不同。"
 anzfm.056.a: "接受双重代表原则。"
 anzfm.056.b: "坚持人口优势。"
 anzfm.057.t: "公投运动"
 anzfm.057.d: "联邦公投把酒馆、学校、报纸、工会大厅和商会都变成辩论场。支持者谈共同市场和国防，反对者谈税收、距离与地方自由。"
 anzfm.057.f: "一张选票很小，小到可以塞进未来。"
 anzfm.057.a: "组织联邦宣传。"
 anzfm.057.b: "允许地方派系自行动员。"
 anzfm.058.t: "帝国御准"
 anzfm.058.d: "共同体法案送往[SCOPE.sCountry('anzfm_britain_scope').GetName]审查。帝国官员希望保留上诉与外交权，殖民地代表则要求承认本地政治已经成熟。"
 anzfm.058.f: "伦敦的墨水落下时，南半球的许多人已经等得不耐烦。"
 anzfm.058.a: "争取宽松御准。"
 anzfm.058.b: "接受帝国保留权。"
 anzfm.059.t: "邀请新西兰"
 anzfm.059.d: "会议讨论是否邀请塔斯曼海另一侧的殖民地加入。支持者看见共同防务与贸易，反对者则担心距离、地方身份和政治节奏。"
 anzfm.059.f: "海不是墙，但也不是走廊。"
 anzfm.059.a: "保留跨海联邦可能。"
 anzfm.059.b: "先完成澳大利亚本土契约。"

 anzfm.060.t: "金矿秩序破裂"
 anzfm.060.d: "执照、警务、移民营地和矿权冲突终于压垮了金矿治理。[ROOT.GetCountry.GetName]保住了表面权威，却失去了许多矿工对公共制度的信任。"
 anzfm.060.f: "有些失败不会立刻推翻政府，只会让下一次谈判更难开始。"
 anzfm.060.a: "把残余秩序收回来。"
 anzfm.061.t: "金矿被纳入殖民政治"
 anzfm.061.d: "[ROOT.GetCountry.GetName]成功把矿区法庭、移民治理、执照争议和基础设施纳入制度。金矿地不再只是暴富和暴动的地方，而成为自治政治的训练场。"
 anzfm.061.f: "泥地干了以后，留下来的不是金粉，而是会议记录。"
 anzfm.061.a: "矿区成为殖民社会的一部分。"
 anzfm.062.t: "劳工宪章成形"
 anzfm.062.d: "八小时、工会大厅、仲裁和工厂监察开始共同塑造[ROOT.GetCountry.GetName]的劳工政治。[SCOPE.sInterestGroup('anzfm_trade_unions_scope').GetName]从压力集团转向制度参与者。"
 anzfm.062.f: "他们仍会罢工，但现在也会写法案。"
 anzfm.062.a: "承认新的劳工秩序。"
 anzfm.063.t: "边疆治理制度化"
 anzfm.063.d: "[ROOT.GetCountry.GetName]通过调查、档案、口粮预算与公开报告暂时控制了边疆危机。这不是正义的终点，却至少让暴力不再完全躲在距离背后。"
 anzfm.063.f: "档案柜关上时，许多问题仍在外面；但它们终于有了名字。"
 anzfm.063.a: "让边疆进入公共政治。"
 anzfm.064.t: "劳工宪章失败"
 anzfm.064.d: "罢工、法院索赔和议会拖延让劳工政治重新激化。[ROOT.GetCountry.GetName]没有消除劳工问题，只是把它推向了更硬的组织形态。"
 anzfm.064.f: "被拒绝的会议，往往会在街头重新召开。"
 anzfm.064.a: "准备面对下一轮罢工。"
 anzfm.065.t: "边疆治理失败"
 anzfm.065.d: "边疆压力超过了[ROOT.GetCountry.GetName]的行政承受力。骑警、牧场、保护官署与传教站彼此推诿，公共政治只收到迟来的报告。"
 anzfm.065.f: "地图边缘没有安静下来，只是离议会太远。"
 anzfm.065.a: "危机仍会回来。"
 anzfm.066.t: "联邦会议停滞"
 anzfm.066.d: "关税、铁路、上诉权、首都和地方妒忌让联邦谈判停滞。[ROOT.GetCountry.GetName]仍可能在未来重启会议，但这一次，契约没有及时成形。"
 anzfm.066.f: "国家想象没有消失，只是被折回文件夹里。"
 anzfm.066.a: "把议案留待日后。"

 anzfm.067.t: "金矿通讯员"
 anzfm.067.d: "[SCOPE.sState('anzfm_colonial_state_scope').GetName]的矿区通讯员开始把营地争议寄往城市报社。执照、华人营地、酒馆政治和矿工法庭被写成[ROOT.GetCountry.GetName]每天都要面对的公共问题。"
 anzfm.067.f: "一封沾着泥的来信，能比一队骑警走得更远。"
 anzfm.067.a: "让通讯员监督矿区行政。"
 anzfm.067.b: "指控他们制造恐慌。"
 anzfm.068.t: "验金所"
 anzfm.068.d: "矿工和商人要求在金矿地设立官方验金所，减少欺诈、私铸和银行垄断。财政官提醒政府，这会让[ROOT.GetCountry.GetName]更深地卷入矿区日常。"
 anzfm.068.f: "天平一端是金粉，另一端是国家信用。"
 anzfm.068.a: "建立官方验金所。"
 anzfm.068.b: "让商人与银行自行定价。"
 anzfm.069.t: "矿区银行信贷"
 anzfm.069.d: "银行向深井矿、商店和运输公司提供信贷，矿区经济变得更稳定，也更依赖金融周期。[SCOPE.sInterestGroup('anzfm_landowners_scope').GetName]担心城市资本正在接管内陆。"
 anzfm.069.f: "黄金从地下出来以后，很快又钻进了账本。"
 anzfm.069.a: "监管矿区信贷。"
 anzfm.069.b: "放任银行竞争。"
 anzfm.070.t: "矿务监理"
 anzfm.070.d: "矿权争端越来越复杂，普通警务已经难以处理。[ROOT.GetCountry.GetName]可以任命矿务监理，让矿区司法更专业，也更接近地方自治。"
 anzfm.070.f: "一顶法官假发到了矿区，看起来像文明，也像迟到的补丁。"
 anzfm.070.a: "任命矿务监理。"
 anzfm.070.b: "继续依靠普通地方法院。"
 anzfm.071.t: "帐篷城卫生"
 anzfm.071.d: "涌入矿区的人口让水源、垃圾、临时医院和墓地都成为政治问题。若[ROOT.GetCountry.GetName]不介入，疾病会替政府写下最残酷的统计。"
 anzfm.071.f: "城市可以由帆布搭成，瘟疫却不觉得它是临时的。"
 anzfm.071.a: "设立矿区卫生委员会。"
 anzfm.071.b: "等营地自行稳定。"

 anzfm.072.t: "技工学院"
 anzfm.072.d: "技工学院和阅览室在城市与矿区扩张，为工人提供讲座、图书和夜校。[SCOPE.sInterestGroup('anzfm_intelligentsia_scope').GetName]称这是自治公民的学校。"
 anzfm.072.f: "煤油灯下的几本书，有时比讲台更像未来。"
 anzfm.072.a: "资助技工学院网络。"
 anzfm.072.b: "让私人社团自行办学。"
 anzfm.073.t: "女性工厂监察员"
 anzfm.073.d: "改革者要求任命女性工厂监察员，调查女工和儿童在作坊、洗衣房与食品厂中的处境。反对者嘲笑这是把家庭问题带进政府。"
 anzfm.073.f: "她们进门时，许多账本第一次开始紧张。"
 anzfm.073.a: "任命女性监察员。"
 anzfm.073.b: "维持现有监察安排。"
 anzfm.074.t: "劳工周报"
 anzfm.074.d: "劳工周报开始跨殖民地发行，将码头罢工、矿山事故和选举承诺放在同一版面。[SCOPE.sInterestGroup('anzfm_trade_unions_scope').GetName]第一次拥有了稳定的政治回声。"
 anzfm.074.f: "一份报纸可以被折进口袋，也可以被折成组织。"
 anzfm.074.a: "允许劳工报刊公开发行。"
 anzfm.074.b: "用诽谤法压住激进编辑。"
 anzfm.075.t: "贫民区卫生局"
 anzfm.075.d: "城市贫民区的排水、住房密度与传染病让公卫医生向议会施压。劳工组织认为卫生是工资之外的生活条件，雇主则害怕新税。"
 anzfm.075.f: "臭水沟没有投票权，却能改变选举。"
 anzfm.075.a: "建立城市卫生局。"
 anzfm.075.b: "把卫生责任留给市政。"
 anzfm.076.t: "公共服务委员会"
 anzfm.076.d: "官僚集团要求设立公共服务委员会，用考试、任期和薪级取代恩 patronage。工会希望它保护低级职员，旧政治家则害怕失去任命权。"
 anzfm.076.f: "公文夹里也能长出一种政治阶级。"
 anzfm.076.a: "专业化公共服务。"
 anzfm.076.b: "保留部长任命空间。"

 anzfm.077.t: "原住民证词"
 anzfm.077.d: "边疆案件暴露出原住民证词资格问题。没有证词，暴力无法进入法庭；承认证词，则会撼动许多牧场和警务叙事。"
 anzfm.077.f: "法律说它需要声音，却先问声音算不算数。"
 anzfm.077.a: "承认经译员记录的证词。"
 anzfm.077.b: "维持严格证词规则。"
 anzfm.078.t: "语言记录"
 anzfm.078.d: "教师、传教士和原住民长者开始整理语言、地名与口述历史。[SCOPE.sInterestGroup('anzfm_intelligentsia_scope').GetName]希望政府资助记录，牧场派则认为这会妨碍土地简化。"
 anzfm.078.f: "地名不是装饰，它们是另一张地图。"
 anzfm.078.a: "资助语言与地名记录。"
 anzfm.078.b: "不要让学者拖慢测量。"
 anzfm.079.t: "牧场信贷守则"
 anzfm.079.d: "旱灾、羊毛价格和远距离运输让牧场信贷变得危险。银行要求政府确认租约，改革者要求把雇工工资和原住民口粮列入优先债务。"
 anzfm.079.f: "一场旱灾可以让草地、债务和人命同时缩水。"
 anzfm.079.a: "制定牧场信贷守则。"
 anzfm.079.b: "让债权人自行清算。"
 anzfm.080.t: "旱灾救济"
 anzfm.080.d: "干旱使边疆粮食、牲畜和水源陷入危机。[ROOT.GetCountry.GetName]可以建立救济线路，但这会迫使政府承认边疆并非自给自足的自由空间。"
 anzfm.080.f: "雨没有来，账单和求救信却一封接一封。"
 anzfm.080.a: "组织旱灾救济。"
 anzfm.080.b: "让地方牧场承担后果。"
 anzfm.081.t: "边疆死因调查"
 anzfm.081.d: "报纸要求公开边疆死亡案件调查。骑警和牧场代表担心证词外泄，改革派则声称没有公开调查，保护政策只是一句空话。"
 anzfm.081.f: "死因调查的目的不是让死人说话，而是让活人不能再装作没听见。"
 anzfm.081.a: "公开边疆死因调查。"
 anzfm.081.b: "限制调查报道。"

 anzfm.082.t: "联邦高等法院"
 anzfm.082.d: "法律界要求在共同体法案中写入联邦高等法院，处理殖民地间争议并限制远赴伦敦上诉。帝国官员提醒，[SCOPE.sCountry('anzfm_britain_scope').GetName]仍希望保留最终解释权。"
 anzfm.082.f: "一座法院能让地图上的边界变得安静，也能让帝国的距离变得刺眼。"
 anzfm.082.a: "写入联邦高等法院。"
 anzfm.082.b: "暂缓司法独立条款。"
 anzfm.083.t: "邮政联盟"
 anzfm.083.d: "商人、报社和工会都要求统一邮费与投递制度。邮政联盟看似琐碎，却能让殖民地之间的日常联系比关税争论更真实。"
 anzfm.083.f: "有些国家先由邮票想象出来。"
 anzfm.083.a: "资助统一邮政。"
 anzfm.083.b: "继续依赖帝国线路。"
 anzfm.084.t: "学校读本"
 anzfm.084.d: "教育部门讨论是否编写共同学校读本，把不同殖民地的地理、历史和公民责任写进同一套教材。地方派担心这会抹平各自身份。"
 anzfm.084.f: "孩子们背诵的地名，常常比政客的演说更持久。"
 anzfm.084.a: "编写共同读本。"
 anzfm.084.b: "保留殖民地教材。"
 anzfm.085.t: "移民事务局"
 anzfm.085.d: "跨殖民地移民规则混乱，劳工组织、商会和帝国官员都要求统一程序。移民事务局可以降低摩擦，也会把种族、工资和国家身份绑得更紧。"
 anzfm.085.f: "柜台前排队的人，正在被变成未来国家的边界。"
 anzfm.085.a: "建立统一移民事务局。"
 anzfm.085.b: "让各殖民地保留规则。"
 anzfm.086.t: "枢密院上诉"
 anzfm.086.d: "共同体法案必须决定案件能否继续上诉至[SCOPE.sCountry('anzfm_britain_scope').GetName]的枢密院。律师担心断裂，自治派则认为本地法院必须拥有最终权威。"
 anzfm.086.f: "上诉权是一条路，问题是它通向法律，还是通向服从。"
 anzfm.086.a: "限制枢密院上诉。"
 anzfm.086.b: "保留帝国最终上诉。"

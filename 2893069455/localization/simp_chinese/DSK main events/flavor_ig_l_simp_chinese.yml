l_simp_chinese:
 ideology_papal_moralist:0 "罗马教廷"
 ideology_papal_moralist_desc:0 "#lore 这个集团要求国家无条件地服从主的权威，支持教宗至高无上的统治。#!"
 ideology_catholic_pious:0 "天主教虔信徒"
 ideology_catholic_pious_desc:0 "#lore 这个集团相信“教宗无谬误”，要求天主教必须控制社会的方方面面，并希望把对基督的信仰远播海外。#!"
 ideology_catholic_moralist:0 "教权主义者"
 ideology_catholic_moralist_desc:0 "#lore 这个集团拥护圣座教宗的权威，并希望将其扩展到世俗领域。#!"
 ideology_protestant_pious:0 "新教虔信徒"
 ideology_protestant_pious_desc:0 "#lore 相较于对彼世的奉献，新教更强调在此世勤奋工作，节俭生活，积累财富并将其用于投资或慈善。#!"
 ideology_muslim_paternalistic:0 "传统主义者"
 ideology_muslim_paternalistic_desc:0 "#lore 这个集团拥护穆斯林社会的传统制度，反对会触及到其传统信仰的改革。#!"
 ideology_sunni_moralist:0 "逊尼基要主义者"
 ideology_sunni_moralist_desc:0 "#lore 这个集团要求按照逊尼派伊斯兰教的教法治理国家，支持所有穆斯林按一定的比率缴纳课税(天课)，用于施舍贫困者和需求者。#!"
 ideology_shia_moralist:0 "什叶基要主义者"
 ideology_shia_moralist_desc:0 "#lore 这个集团要求按照什叶派伊斯兰教的教法治理国家。#!"
 ideology_rabbinical_moralist:0 "锡安主义者"
 ideology_rabbinical_moralist_desc:0 "#lore 这个集团相信犹太人是上帝的选民，要求建立一个犹太人的民族国家。#!"
 ideology_mahayana_buddhist_moralist:0 "大乘佛教卫道士"
 ideology_mahayana_buddhist_moralist_desc:0 "#lore 佛教的道路是明确的，神权政体是引导国家沿着我佛教导的道路前进的最佳方式。#!"
 ideology_theravada_buddhist_moralist:0 "上座部佛教卫道士"
 ideology_theravada_buddhist_moralist_desc:0 "#lore 作为一个开悟的人，佛陀为每个人树立了典范，我们应当遵行他的道路，以寻求涅槃。#!"
 ideology_vajrayana_buddhist_moralist:0 "格鲁派卫道士"
 ideology_vajrayana_buddhist_moralist_desc:0 "#lore 佛教的道路是明确的，神权政体是引导国家沿着我佛教导的道路前进的最佳方式，而农奴应当为他们的主人服务以寻求赎罪。#!"
 ideology_confucian_patriarchal:0 "儒家父权主义者"
 ideology_confucian_patriarchal_desc:0 "#lore 这个集团希望看见一个男女有别，长幼有序，尊卑分明的和谐社会。#!"
 ideology_chinese_literati:0 "文教主义者"
 ideology_chinese_literati_desc:0 "#lore 这一集团重视教育的作用，希望社会的每个成员都能接受良好的人文教育。#!"
 ideology_anti_shogunate:0 "倒幕派"
 ideology_anti_shogunate_desc:0 "#lore 这一集团希望推翻幕府统治，认为天皇才有资格掌握绝对的权力。#!"
 ideology_france_reactionary:0 "雅各宾主义者"
 ideology_france_reactionary_desc:0 "#lore 这一集团深受法国大革命影响，支持一个强大的民族主义共和政权。#!"
 ideology_english_reactionary:0 "英式保守主义者"
 ideology_english_reactionary_desc:0 "#lore 这一集团秉持着一种英式的保守主义观点。#!"
 ideology_american_reactionary:0 "迪克西民主主义者"
 ideology_american_reactionary_desc:0 "#lore 这一集团鼓吹让公众更大程度地参与政府——仅针对某些定义下的“公众”而言。#!"
 ideology_france_bonapartist:0 "波拿巴主义者"
 ideology_france_bonapartist_desc:0 "#lore 这一集团拥护波拿巴家族，希望他们回归法兰西的皇帝之位。#!"
 ideology_english_patriotic:0 "黑幕揭发者"
 ideology_english_patriotic_desc:0 "#lore 这一集团反对政府对言论及思想自由的干涉。#!"
 ideology_royal_republican:0 "宪政主义者"
 ideology_royal_republican_desc:0 "#lore 这一集团认为保留君主作为国家象征的宪政法治政府是民主的最优形式。#!"
 ideology_austria_liberal:0 "多元主义者"
 ideology_austria_liberal_desc:0 "#lore 这一集团认为所有的民族都应是平等的。#!"
 ideology_austria_pan_nationalist:0 "泛民族主义者"
 ideology_austria_pan_nationalist_desc:0 "#lore 这一集团认为其他欧洲文化也有资格加入奥地利帝国的国家机器。#!"
 ideology_modernist:0 "现代主义者"
 ideology_modernist_desc:0 "#lore 这一集团认为建立一个现代的经济体系对一个国家是必要的。#!"
 ideology_japan_plutocratic:0 "日本财阀主义者"
 ideology_japan_plutocratic_desc:0 "#lore 这个集团认为天皇是至高无上的统治者，而富人是非常适合决定社会方向的知识精英团体。#!"
 ideology_american_plutocratic:0 "美国财阀主义者"
 ideology_american_plutocratic_desc:0 "#lore 美国大亨们拥护联邦政府的共和制度，同时渴望通过向西殖民满足自身铁路利益。#!"
 ideology_pan_slavist:0 "泛斯拉夫主义者"
 ideology_pan_slavist_desc:0 "#lore 这个集团认为俄罗斯帝国应当成为斯拉夫民族和东正教文明的保护者。#!"
 ideology_white_hegemony:0 "白人至上主义者"
 ideology_white_hegemony_desc:0 "#lore 这个集团认为只有白人才能成为国家的社会与政治精英。"
 ideology_american_moralist:0 "清教徒道德主义者"
 ideology_american_moralist_desc:0 "#lore 这个集团秉承“大觉醒运动”的观点，将清教徒的宗教道德视为美国的立国之本。#!"
 ideology_boer_particularist:0 "布尔特殊主义者"
 ideology_boer_particularist_desc:0 "#lore 这个集团希望践行地方社群自治的理念，摆脱管辖开普殖民地的英国佬对他们的束缚。#!"
 ideology_bismarckism:0 "俾斯麦主义"
 ideology_bismarckism_desc:0 "#lore 奥托·冯·俾斯麦的政治、军事及外交思想。#!"
 ideology_hollandologist:0 "兰学者"
 ideology_hollandologist_desc:0 "#lore 这个领袖希望引进西式的教育体系和医疗技术。#!"

 ig_boer_landowners:0 "布尔地主"
 ig_boer_landowners_desc:0 "布尔人的称呼源自荷兰语的“boer”（农民），他们的自称则是阿非利堪人；这些人是在英国人占领开普殖民地之前定居于此的欧洲白人移民后裔，主要是荷兰移民后裔。他们从好望角向内地迁移扩张，圈占土著人的大片土地，驱赶当地的土著黑人劳动，自己成为奴隶主。布尔人中的大型农庄和大种植园的拥有者是传统和“老钱”的守护人。"
 ig_boer_rural_folk:0 "布尔乡村民众"
 ig_boer_rural_folk_desc:0 "布尔人的称呼源自荷兰语的“boer”（农民），他们的自称则是阿非利堪人；这些人是在英国人占领开普殖民地之前定居于此的欧洲白人移民后裔，主要是荷兰移民后裔。他们从好望角向内地迁移扩张，圈占土著人的大片土地，驱赶当地的土著黑人劳动，自己成为奴隶主。布尔人中的小农场主的政治利益主要与他们的农业生计一致。"
 ig_squatters:0 "大牧场主"
 ig_squatters_desc:0 "“Squatters”原本指“擅自占地者”，后来随着殖民地当局对擅自占地的牧场主让步，承认他们的土地所有权，以及澳大利亚养羊业发展取得的巨大成就，这一词汇逐渐成为了对大牧场主的普遍称呼。"
 ig_catholic_missionaries:0 "天主教传教士"
 ig_catholic_missionaries_desc:0 "在刚果接受天主教后，传教士成为了占刚果主导地位的神职人员阶层。他们主张与西方各国进行贸易，以及让刚果原住民皈依基督教。"

 
 other_ig_forced_to_open_market:0 "新兴势力"
 other_forced_to_open_market:0 "维新志士"

 from_bonapartist:0 "保守主义者涌向波拿巴派"

 Heisei:0 "平成"
 Reiwa:0 "令和"

 # === [LocEditor:OrphanedKeys] Keys that do not exist in English ===
 ig_fleet_street:0 "舰队街"
 ig_fleet_street_desc:0 "伦敦方里小地内的一个区域，该国的报纸都在这里写作和印刷。众所周知，在舰队街工作的记者都是顽强的黑幕揭发者，他们在报道过程中无可阻挡。"
 ig_junker_landowners:0 "容克地主"
 ig_junker_landowners_desc:0 "容克源自“jung herrs”（年轻的领主）；这些人随着条顿骑士团征服了波罗的异教徒，在此定居，并在普鲁士大地上传播基督教，最终成为了普鲁士的贵族和大地主。即便普鲁士的发展方向是一个表面上越来越宪政的体制，他们仍因农业补贴制度和对官僚体系及高级军事职位的掌控而保证了权力。"
 ig_junker_industrialists:0 "容克实业家"
 ig_junker_industrialists_desc:0 "容克源自“jung herrs”（年轻的领主）；这些人随着条顿骑士团征服了波罗的异教徒，在此定居，并在普鲁士大地上传播基督教，最终成为了普鲁士的贵族和大地主。他们倾向于反对民主运动，视其为对精英统治的威胁。他们从佃农身上榨取的地租以及他们在宫廷里的人脉使他们摇身一变成为了普鲁士的实业家，尤其是那些基业在莱茵兰地区的人。"
 ig_carlists:0 "卡洛斯派"
 ig_carlists_desc:0 "波旁王朝内部敌对的王位宣称者，即卡洛斯四世的次子，自称卡洛斯五世的卡洛斯王子的支持者。继承法曾在18世纪末进行了一些修订，以防止西班牙和法国成为君合国，而被剥夺继承权的家族有足够的支持，持续为在位的伊莎贝尔二世及其继承人的王朝制造麻烦。"
 ig_isabelinos:0 "伊莎贝尔派"
 ig_isabelinos_desc:0 "波旁王朝内部敌对的王位宣称者，即西班牙的费尔南多七世和两西西里的玛丽亚·克里斯蒂娜之女伊莎贝尔二世的支持者。权势显赫的克里斯蒂诺家族代表摄政女王及其年幼的女儿奋力阻止其竞争对手卡洛斯派掌权，而这些支持者由于其进步的政治和有影响力的资助网络，仍然对西班牙社会保持着强大的影响力。"
 ig_fire_eaters:0 "吞火者"
 ig_fire_eaters_desc:0 "吞火者是南方风俗习惯的激进倡导者。为了防止欧洲帝国主义回归美国，联邦在政治上可能是必要的，但扬基佬需要学会尊重南方及其独特的制度。"
 ig_prohibitionists:0 "禁酒主义者"
 ig_prohibitionists_desc:0 "无论是出于宗教、政治还是个人原因，禁酒主义的倡导者们都认为吸毒或酗酒是一种公害，应该从社会上清除。"
 ig_railway_tycoons:0 "铁路大亨"
 ig_railway_tycoons_desc:0 "铁路利益是美国向西推进的主要驱动力。出身东海岸和欧洲的资本大佬投资新线路，开拓新市场。这些市场可能需要在矿山、森林和广阔草原之间从头缔造。"
 ig_boer_landowners:0 "布尔地主"
 ig_boer_landowners_desc:0 "布尔人的称呼源自荷兰语的“boer”（农民），他们的自称则是阿非利堪人；这些人是在英国人占领开普殖民地之前定居于此的欧洲白人移民后裔，主要是荷兰移民后裔。他们从好望角向内地迁移扩张，圈占土著人的大片土地，驱赶当地的土著黑人劳动，自己成为奴隶主。布尔人中的大型农庄和大种植园的拥有者是传统和“老钱”的守护人。"
 ig_boer_rural_folk:0 "布尔乡村民众"
 ig_boer_rural_folk_desc:0 "布尔人的称呼源自荷兰语的“boer”（农民），他们的自称则是阿非利堪人；这些人是在英国人占领开普殖民地之前定居于此的欧洲白人移民后裔，主要是荷兰移民后裔。他们从好望角向内地迁移扩张，圈占土著人的大片土地，驱赶当地的土著黑人劳动，自己成为奴隶主。布尔人中的小农场主的政治利益主要与他们的农业生计一致。"
 ig_squatters:0 "大牧场主"
 ig_squatters_desc:0 "“Squatters”原本指“擅自占地者”，后来随着殖民地当局对擅自占地的牧场主让步，承认他们的土地所有权，以及澳大利亚养羊业发展取得的巨大成就，这一词汇逐渐成为了对大牧场主的普遍称呼。"
 ig_catholic_missionaries:0 "天主教传教士"
 ig_catholic_missionaries_desc:0 "在刚果接受天主教后，传教士成为了占刚果主导地位的神职人员阶层。他们主张与西方各国进行贸易，以及让刚果原住民皈依基督教。"

 ig_imperial_harem:0 "皇宫内廷"
 ig_imperial_harem_desc:0 "由于欧洲艺术家过于活跃的想象力，皇宫内廷以堕落闻名。然而它其实是苏丹在宫廷中权力的支柱，由亲族、顾问、仆人和各种各样的侍从组成。忠于皇室的人倾向于支持中央集权和现代化的政策。"
ideology_pan_slavist:0 "泛斯拉夫主义者"
 ideology_pan_slavist_desc:0 "#lore 这个集团认为俄罗斯帝国应当成为斯拉夫民族和东正教文明的保护者。#!"
 ideology_white_hegemony:0 "白人至上主义者"
 ideology_white_hegemony_desc:0 "#lore 这个集团认为只有白人才能成为国家的社会与政治精英。"
 ideology_american_moralist:0 "清教徒道德主义者"
 ideology_american_moralist_desc:0 "#lore 这个集团秉承“大觉醒运动”的观点，将清教徒的宗教道德视为美国的立国之本。#!"
 ideology_boer_particularist:0 "布尔特殊主义者"
 ideology_boer_particularist_desc:0 "#lore 这个集团希望践行地方社群自治的理念，摆脱管辖开普殖民地的英国佬对他们的束缚。#!"
 ideology_isolationist_nomad:0 "自由迁徙主义者"
 ideology_isolationist_nomad_desc:0 "#lore 这一集团希望游牧民能够自由地迁徙，反对任何的边界概念。#!"
 ideology_agrarian_nomad:0 "游牧主义者"
 ideology_agrarian_nomad_desc:0 "#lore 这一集团坚持古老的游牧生活，反对现代技术的推广。#!"
 ideology_agrarian_russian:0 "村社主义者"
 ideology_agrarian_russian_desc:0 "#lore 这一集团支持农民以村社形式集体持有土地。#!"
 ideology_bismarckism:0 "俾斯麦主义"
 ideology_bismarckism_desc:0 "#lore 奥托·冯·俾斯麦的政治、军事及外交思想。#!"
 ideology_hollandologist:0 "兰学者"
 ideology_hollandologist_desc:0 "#lore 这个领袖希望引进西式的教育体系和医疗技术。#!"

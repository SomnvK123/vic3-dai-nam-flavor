ideology_sonno_kaikoku:0 "尊王开国派"
ideology_sonno_kaikoku_desc:0 "此意识形态主张推翻德川幕府，恢复天皇的政治权威，同时吸收西方制度与技术以实现国家富强。不同于单纯排外的尊王攘夷派，尊王开国派认为日本必须在保全天皇正统与民族独立的前提下主动开国、整军经武、发展工业。"

ideology_japan_kogi_enlightenment:0 "日本军国主义温和派"
ideology_japan_kogi_enlightenment_desc:0 "日本军国主义温和派即统制派，反对激进政变，支持自由市场改革，依托体制掌控政权，联合财阀稳步对外扩张，虽手段缓和，但侵略野心与军国主义本质从未改变。"
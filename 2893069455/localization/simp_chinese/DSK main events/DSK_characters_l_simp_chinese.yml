ideology_social_corporations:0 "社会法团主义"
ideology_social_corporations_desc:0 "又称社会民主法团主义，这种政治经济思想主张通过工会、企业与国家的协作，实现社会秩序与经济协调。相比传统法团主义，支持者更强调个人自由、市场调节与社会福利的平衡，以及通过民主程序和公共政策来调节各方之间的关系，并主张改革而非保守的社会结构。"

ideology_modernizer_leader_ra:0 "加速现代化主义者"
ideology_modernizer_leader_ra_desc: "#lore 该领袖强烈支持在合理的路线下实现国家的现代化和中央集权。#!"
ideology_Liberators:0 "解放者"
ideology_Liberators_desc:0 "人的尊严，植根于政治自由，彰显于思想的自由表达与意见的自由批判与形成。人的尊严，亦涵盖享有健康、工作、教育及社会福利的固有权利。在社会民主思想的影响下，其支持者怀抱解放劳动者、构建平等社会体系的崇高使命。然受时代所限，此理想之光尚未普照大地，其深邃内涵犹待深掘。"


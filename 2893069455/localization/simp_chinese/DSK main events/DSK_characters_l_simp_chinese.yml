 ideology_social_liberalism:0 "社会自由主义"
 ideology_social_liberalism_desc:0 "社会自由主义是德国施蒂纳用语。指把社会升为最高所有者的社会存在方式。是他所提出的“人”的三种社会存在方式之一。他在《唯一者及其所有物》一书中认为在共产主义中，“由于共有原则已经登峰造极，由于把一切权利都给了社会把“社会升为最高所有者使个人成了社会的奴隶。社会自由主义对于“我”（唯一者）来说，成为一种“人”的不完善的社会存在方式。"


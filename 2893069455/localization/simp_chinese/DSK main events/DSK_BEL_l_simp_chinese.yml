 je_dsk_bel_royal_colonialism:0 "国王的私人领地"
 je_dsk_bel_royal_colonialism_reason:0 "刚果问题就不只是海外殖民，而是国王权威、议会监督和国家声誉之间的纠葛。\n\n#v 1.解锁条件：#!比利时仍维持有[concept_monarchy]的治理原则，并已完成刚果事件链，或刚果利益攫取程度至少达到 #v 4#!。\n#v 3.额外说明：如果刚果改革被束之高阁，刚果自由邦就会变成反君主制与国际谴责的弹药；#!#green 国王可以把殖民收益转化为威望#!，代价是更高的政治风险。"
 je_dsk_bel_royal_colonialism_status_scandal:0 "#red 国王的私人领地正被接连不断的报道和议会质询所包围。#!"
 je_dsk_bel_royal_colonialism_status_default:0 "#yellow 国王仍试图把刚果塑造成个人威望和国家地位的共同事业。#!"
 je_dsk_bel_parliamentary_compromise:0 "议会下的妥协国家"
 je_dsk_bel_parliamentary_compromise_reason:0 "如果比利时已经走向更纯粹的议会政治，未来会从王室调停转向政党、利益集团和民族和解。\n\n#v 1.解锁条件：#!国民已经拥有更广泛的政治权利，例如已经拥有#v 普选制#!法律；并且教育妥协或国家凝聚力至少达到 #v 2#!点。\n#v 2.推进因素：#!政府拥有高[concept_legitimacy]、教育之战达成妥协、民族和解以及选举制改革。\n#v 3.失败因素：#!政治长期动荡，政府合法性备受质疑。"
 je_dsk_bel_parliamentary_compromise_status_radicals:0 "#red 议会的治理广受质疑，议院之外的声音正撕裂着国家。#!"
 je_dsk_bel_parliamentary_compromise_status_default:0 "#yellow 天主教、自由派、社会主义者与弗拉芒民族主义者仍在议会框架内行事。#!"
 je_dsk_bel_failure_ledger:0 "失败的后果"
 je_dsk_bel_failure_ledger_reason:0 "#bold 小国在夹缝中求生，这使得它必须允许被失败，而且失败并非一切的终结。#!\n\n#v 1.解锁条件：#!中立地位破灭；或永久中立的可信性低至 #v 0#!及以下；或国家凝聚力低至 #v -3#!及以下；或刚果改革动力低至 #v -3#!及以下；或政治极端化低至 #v -2#!及以下。\n#v 2.额外说明：#!它不是单纯的惩罚，而是将玩家引向危机修复：重建永久中立的可信性、修复民族关系、遏制殖民丑闻、维持议会体制。\n\n#green 修复国家裂痕#!可以让比利时从危机中恢复；#red 放任崩溃#!会让国家崩溃的后效如影随形。"
 je_dsk_bel_failure_ledger_status_neutrality:0 "#red 比利时的中立地位已经破灭，列强不再信任比利时。#!"
 je_dsk_bel_failure_ledger_status_language:0 "#red 民族矛盾正在从行政问题变成对国家忠诚的挑战。#!"
 je_dsk_bel_failure_ledger_status_colonial:0 "#red 刚果的丑闻已经超出王室和议会能够掩盖的极限。#!"
 je_dsk_bel_failure_ledger_status_default:0 "#yellow 比利时正在为过去的抉择付出代价。#!"
 je_dsk_bel_finance_status_fast:0 "#green 产品、金融债券。运输和订单正在相互促进，国家机器正以此为基础高速运转。#!"
 je_dsk_bel_finance_status_speculation:0 "#red 投机热正在压过公共利益；工人和议员都开始怀疑这场虚假繁荣中，谁是真正的获益者。#!"
 je_dsk_bel_finance_status_default:0 "#yellow 财政部、银行家和工厂主仍在争夺[GetBuildingType('building_railway').GetName]国家工程的建设重心。!#!"
 je_dsk_bel_labor_status_compromise:0 "#green 工会、互助会和议会改革派已经达成可行的的社会妥协。#!"
 je_dsk_bel_labor_status_unrest:0 "#red 矿区不再寄希望于布鲁塞尔的回应，罢工、报纸鼓动和街头演说成为新的途径和窗口。#!"
 je_dsk_bel_labor_status_default:0 "#yellow 工业扩张使得劳工问题从工厂内部被带进议会大厅讨论。#!"
 je_dsk_bel_franco_prussian_status_secure:0 "#green 中立体系经受住了法德战争的压力，列强仍继续承认比利时的中立地位。#!"
 je_dsk_bel_franco_prussian_status_danger:0 "#red 边境警戒、紧急武装和外交照会一同运作，任何表态都可能被解读为外交站边。#!"
 je_dsk_bel_franco_prussian_status_default:0 "#yellow 比利时正在用防御工事、外交声明和军备时间表表明它的中立绝非空话。#!"
 je_dsk_bel_congo_status_reform:0 "#green 议会调查已盖过王室的特许，对刚果的接管已提上日程。#!"
 je_dsk_bel_congo_status_scandal:0 "#red 报纸所披露的实情和列强的外交谴责正在把刚果问题变成国家的祸端。#!"
 je_dsk_bel_congo_status_default:0 "#yellow 来自刚果的收益正源源不断地流入比利时，来自刚果的丑闻也如影随形。#!"
 je_dsk_bel_extremes_status_democracy:0 "#green 议会政治仍能化解危机，民主制度尚未被极端运动击碎。#!"
 je_dsk_bel_extremes_status_radicals:0 "#red 雷克斯主义者和赤色分子的反议会鼓动正在损害国家政治稳定。#!"
 je_dsk_bel_extremes_status_default:0 "#yellow 三十年代的危机不是源于一次选举，而是国家身份认同、经济和国家安全路线分歧的总爆发。#!"
dsk_bel_independence_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_delta_var').GetValue|+=]#!\n#v 1. 其中的与列强关系影响：#![GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_delta_var').GetValue|+=]。\n#v 2.推进因素：#!与#blue 不列颠#!、#blue 法兰西#!或#blue 普鲁士#!其中之一的[concept_relations]达到#v 50#!以上，每月推进#v +0.25#!进度，最高可达#v 0.50#!。\n#v 3.不利因素：#!中立地位已经破碎。"
dsk_bel_neutrality_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_delta_var').GetValue|+=]#!\n#v 1.其中低[concept_infamy]的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_peace_delta_var').GetValue|+=]#!。\n#v 2.推进因素：#!国家处于和平状态、永久中立可信度低于#v 55#!且[concept_infamy]低于#v 5#!时增加#v +0.25#!进度；此时拥有#v 恪守中立#!或#v 武装化中立国#!状态，则额外增加#v +0.25#!。\n#v 3.其中因战争产生的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_war_delta_var').GetValue|+=]#!。处于战争时月度变化#v -1#!。\n#v 4.其中的恶名影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_infamy_delta_var').GetValue|+=]#!。当[concept_infamy]在#v 2#!到#v 10#!之间时每月#v -0.25#!进度；高于#v 10#!时每月#v -1#!进度。\n#v 5.前置说明：#!若#o 伦敦条约#!尚未生效、尚未解锁#o 永久中立#!日志，或处于战争状态，月度增长将不生效。"
dsk_bel_industry_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_industry_monthly_delta_var').GetValue|+=]#!\n#v 1.其中的工业建设影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_industry_monthly_base_delta_var').GetValue|+=]#!。\n#v 2.推进因素：#!已完成的#yellow 瓦隆矿业#!、#yellow 瓦隆重工业#!、#yellow 佛兰德航运建设#!、#yellow 佛兰德出口工业#!、#yellow 瓦隆内部[GetBuildingType('building_railway').GetName]#!分别提供#v +0.10#!进度。\n#v 3.额外奖励：#!当五项工业建设全部完成，且[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]的[concept_clout]至少达到#v 10%#!并拥有#v 发达的布鲁塞尔金融业#!状态，额外增加#v +0.15#!进度。"
dsk_bel_school_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_school_monthly_delta_var').GetValue|+=]#!\n#v 1.其中教育体制法律和政府[concept_legitimacy]的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_school_monthly_base_delta_var').GetValue|+=]#!。\n#v 2.推进因素：#!拥有#v 公立学校#!或#v 教会学校#!法律，且政府拥有至少#v 45#![concept_legitimacy]，每月#v +0.5#!进度。"
dsk_bel_unity_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_unity_monthly_delta_var').GetValue|+=]#!\n#v 1.其中民族和解的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_unity_monthly_base_delta_var').GetValue|+=]#!。\n#v 2.推进因素：#![GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]的[concept_clout]至少达到#v 15%#!且没有#v 压制弗拉芒人#!状态，每月#v +0.25#!进度；若此时拥有#v 教育妥协协商度#!或#v 语言和解#!修正，则每月#v +0.25#!进度。"
dsk_bel_congo_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_congo_monthly_delta_var').GetValue|+=]#!"
dsk_bel_lowlands_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_lowlands_monthly_delta_var').GetValue|+=]#!\n#v 1.其中与荷兰的外交关系影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_lowlands_monthly_relations_delta_var').GetValue|+=]#!。当荷兰存在，且与荷兰的[concept_relations]至少达到#v 50#!时，每月#v +0.25#!进度。\n#v 2.其中的中立地位影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_lowlands_monthly_neutrality_delta_var').GetValue|+=]#!。只有永久中立的可信性达到#v 42#!及以上，每月#v -0.25#!进度。"
dsk_bel_great_war_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_great_war_monthly_delta_var').GetValue|+=]#!\n#v 1.其中战时抵抗的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_great_war_monthly_war_delta_var').GetValue|+=]#!。处于战争状态时，每月#v +1#!进度。\n#v 2.其中要塞防卫影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_great_war_monthly_fortress_delta_var').GetValue|+=]#!。拥有#v 武装化中立国#!状态，则额外获得#v +1#!进度。"
dsk_bel_postwar_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_postwar_monthly_delta_var').GetValue|+=]#!\n#v 1.其中高合法性影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_postwar_monthly_legitimacy_delta_var').GetValue|+=]#!。政府拥有至少#v 55#!的[concept_legitimacy]，每月#v +0.5#!进度。\n#v 2.其中低国家凝聚力影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_postwar_monthly_unity_delta_var').GetValue|+=]#!。若国家团结低于#v 0#!且战后稳定性尚未归零，则每月#v -0.5#!。"
dsk_bel_finance_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_finance_monthly_delta_var').GetValue|+=]#!\n#v 1.其中金融业发展状况的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_finance_monthly_house_delta_var').GetValue|+=]#!。\n#v 2.推进因素：#!拥有#v 发达的布鲁塞尔金融业#!状态，且劳工妥协倾向低于#v 2#!，每月#v +0.25#!进度；若此时拥有#v 欧洲工厂#!状态，或[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]的[concept_clout]至少达到#v 15%#!，则每月#v +0.25#!进度。"
dsk_bel_labor_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_labor_monthly_delta_var').GetValue|+=]#!\n#v 1.其中罢工浪潮影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_labor_monthly_strike_delta_var').GetValue|+=]#!。拥有#v 罢工浪潮#!状态，每月#v -0.25#!进度。"
dsk_bel_franco_prussian_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_franco_prussian_monthly_delta_var').GetValue|+=]#!\n#v 1.其中恪守中立的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_franco_prussian_monthly_neutrality_delta_var').GetValue|+=]#!。拥有#v 恪守中立#!状态，且法德战争中的中立可信度未达到#v 6#!点，每月#v +0.5#!进度。\n#v 2.其中秘密军事接触的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_franco_prussian_monthly_staff_delta_var').GetValue|+=]#!。拥有#v 秘密军事接触#!状态，且永久中立的可信性大于#v 0#!，每月#v -0.5#!进度。"
dsk_bel_congo_reform_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_congo_reform_monthly_delta_var').GetValue|+=]#!\n#v 1.其中丑闻与调查的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_congo_reform_monthly_scandal_delta_var').GetValue|+=]#!。拥有#v 刚果丑闻#!修正，每月#v +0.25#!进度。\n#v 2.其中自由邦原有势力的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_congo_reform_monthly_old_order_delta_var').GetValue|+=]#!。对刚果利益的攫取程度达到#v 5#!点且刚果改革动力低于#v 2#!点，则每月#v -0.25#!进度。"
dsk_bel_extremes_monthly_tt:0 "#green 当前月度变化：#!#v [GetPlayer.MakeScope.Var('dsk_bel_extremes_monthly_delta_var').GetValue|+=]#!\n#v 1.其中来自雷克斯主义的压力的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_extremes_monthly_rex_delta_var').GetValue|+=]#!。拥有#v 来自雷克斯主义的压力#!修正，每月#v -0.25#!进度。"
dsk_bel_independence_relax_tt:0 "#v 1.其中外交关系缓和的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_relations_delta_var').GetValue|+=]#!。\n#v 2.推进因素：#!与#blue 英国#!、#blue 法国#!或#blue 普鲁士#!任意一国保持#v 友好#!关系时每月#v +0.25#!进度，最高#v +0.50#!进度。\n#v 3.说明：#中立地位破灭、发动侵略性战争或外交冒险导致列强疑虑，这部分增长就会停止。"
dsk_bel_independence_advance_tt:0 "#v 1.其中推进因素的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_delta_var').GetValue|+=]#!，来自列强愿意把比利时继续视作可接受的低地缓冲国。。"
dsk_bel_neutrality_regress_tt:0 "#v 1.其中因战争产生的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_war_delta_var').GetValue|+=]#!，战争是对中立状态最直接的侵害。\n#v 2.其中高恶名产生的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_infamy_delta_var').GetValue|+=]#!，高[concept_infamy]会损害列强的信任。"
dsk_bel_neutrality_advance_tt:0 "#v 1.其中推进因素的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_peace_delta_var').GetValue|+=]#!。\n#v 2.推进因素：#!处于和平状态、恶名低于#v 5#!点，每月#v +0.25#!进度；此时拥有#v 恪守中立#!或#v 武装化中立国#!状态，每月额外#v +0.25#!进度。"
dsk_bel_industry_advance_tt:0 "#v 1.其中工业建设的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_industry_monthly_base_delta_var').GetValue|+=]#!。\n#v 2.推进因素：#!满足资本条件，已完成的瓦隆矿业、瓦隆重工业、佛兰德航运建设、佛兰德出口工业、瓦隆内部[GetBuildingType('building_railway').GetName]中的每一项提供每月#v +0.10#!进度。\n#v 3.额外奖励：#!当#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_workshop_industrial_base_tt 工业建设#!全部完成，且[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]的[concept_clout]至少达到#v 10%#!并拥有#v 发达的布鲁塞尔金融业#!状态，每月额外#v +0.15#!进度。"
dsk_bel_finance_regress_tt:0 "#v 1.其中金融阻力的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_labor_monthly_strike_delta_var').GetValue|+=]#!，罢工浪潮与矿区动乱对经济部门协同发展造成拖累。"
 dsk_bel_unity_regress_tt:0 "当前对国家凝聚力的阻滞主要来自：\n民族和解进程停滞、中央政府的压制仍然存在，或教育争端继续撕裂社会。"
dsk_bel_unity_advance_tt:0 "#v 1.其中民族和解的影响：#!#v [GetPlayer.MakeScope.Var('dsk_bel_unity_monthly_base_delta_var').GetValue|+=]#!。\n#v 2.推进因素：#![GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]至少拥有#v 15%#!的[concept_clout]且未拥有#v 压制弗拉芒人#!状态，每月#v +0.25#!进度；拥有#v 教育妥协#!或#v 语言和解#!状态，则每月额外#v +0.25#!进度。"
dsk_bel_tooltip_independence_events:0 "1.#v 边境委员会#!：在外交谈判刚刚展开、#blue 荷兰#!仍拒绝接受分离事实时出现。它主要处理#v 林堡#!、#v 卢森堡#!与斯海尔德河等边界问题，往往会在领土、商贸与外交环境之间迫使比利时做出决定。\n2.#v 荷兰的不甘#!：当#blue 荷兰#!仍然存在，且与比利时[concept_relations]处于较低水平、边境状态紧张时更容易出现。\n3.#v 外交承认的附加成本#!：当与#blue 英国#!、#blue 法国#!或#blue 普鲁士#!的关系逐渐改善，外交承认展露曙光，此事件更容易出现。它代表列强愿意接纳比利时的存在，但通常会附带#v 中立约束#!、#v 缓冲国义务#!或外交上的自我克制。\n4.#v 比利时问题#!：当外交承认已经接近完成，或列强已经真正接纳比利时时出现。这决定这个#bold 新王国#!究竟只是革命的昙花一现，还是一个可以持续存在的国家。"
 dsk_bel_tooltip_neutrality_events:0 "1.#v 中立声明#!：处于和平状态且拥有较低[concept_infamy]时，永久中立的可信性会持续增长。\n2.#v 中立地位的破灭#!：处于战争状态、拥有较高[concept_infamy]或秘密外交倾斜会损害永久中立的可信性。"
dsk_bel_tooltip_workshop_events:0 "1.#v 桑布尔-默兹工业带#!：当#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_workshop_industrial_base_tt 瓦隆矿业、重工业与佛兰德航运建设#!已经完成，且[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]拥有至少 #v 10%#![concept_clout]或拥有#v 发达的布鲁塞尔金融业#!状态时会持续推进。\n2.#v [GetBuildingType('building_railway').GetName]债券#!：发行债券会加速工业和金融发展，但不利于劳资妥协。\n3.#v 金融审计#!：[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]拥有至少 #v 5%#![concept_clout]时可用，提高合法性但拖慢资本扩张。"
dsk_bel_tooltip_school_events:0 "1.#v 主教的通谕#!：教会拥有至少 #v 18%#![concept_clout]且政府拥有的[concept_legitimacy]低于 #v 60#!，或教会在政府内且拥有至少 #v 15%#![concept_clout]时更易出现；\n2.#v 自由派学校#!：已拥有#v 公立学校#!教育体制，或[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]拥有至少 #v 12%#![concept_clout]时国家民教育得到推进。\n3.#v 地方抵抗#!：单边资助教会学校或公立学校都会破坏国家凝聚。\n4.#v 教育妥协#!：教育妥协协商度达到#v 7#!且拥有至少 #v 80#![concept_legitimacy]时，教育问题进入制度化妥协阶段。"
 dsk_bel_tooltip_flemish_events:0 "1.#v 官方语言#!：教育之战进度推进、#yellow 佛兰德#!动荡或[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]力量上升时触发。\n2.#v #yellow 佛兰德#!请愿#!：国家凝聚力较低时更容易出现。\n3.#v 采用弗拉芒语#!：提高国家凝聚力并促进战后稳定。\n4.#v 维持法语行政#!：短期提高行政与金融效率，但会加深民族矛盾。"
 dsk_bel_tooltip_finance_events:0 "1.#v 国家[GetBuildingType('building_railway').GetName]债券#!：工业实力达到#v 3#!点或拥有欧洲工厂修正时进入经济部门协同发展阶段。\n2.#v 伦敦资本注入#!：[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]与[GetBuildingType('building_port').GetName]建设会推动进度。\n3.#v 证券丑闻#!：经济发展过快上升或劳资妥协倾向为负时更危险。\n4.#v [GetBuildingType('building_railway').GetName]城市#!：[GetBuildingType('building_port').GetName]、[GetBuildingType('building_railway').GetName]和[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName][concept_clout]共同促进着国家发展。"
 dsk_bel_tooltip_labor_events:0 "1.#v 矿井事故#!：工业实力较高且缺少劳工保障时更易出现。\n2.#v 工会组织#!：[GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName]拥有足够[concept_clout]后走向社会妥协与矛盾爆发两条进度。"
dsk_bel_tooltip_franco_prussian_events:0 "1.#v 边境报告#!：#v 伦敦条约#!已生效，且#blue 法国#!已经与#blue 普鲁士#!或#blue 德国#!开战；已获得中立地位、永久中立的可信性低于 #v 18#!、已表现出对低地到兴趣，或与法国和德国的关系低于 #v 20#!更易出现。\n2.#v 英国保障#!：与英国的关系达到#v 50#!，国家安全更易维护。\n3.#v 恪守中立#!：降低主动外交的空间，促成在法德战争中的中立。\n4.#v 秘密军事接触#!：让永久中立的可信性持续受损!，换来更强的边境军事准备。"

# ============================== DSK 比利时：事件类文本 ==============================
 dsk_belgium.1.t:0 "新王国的边界"
 dsk_belgium.1.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]的独立已经通过宪法的颁布和国王的宣誓得以确立，但它的存在并未在国际外交中得到广泛承认。[SCOPE.sCountry('dsk_bel_net_scope').GetName]仍把1830年的分离视作一场未被平息的叛乱，[SCOPE.sCountry('dsk_bel_fra_scope').GetName]希望对低地地区施加影响，[SCOPE.sCountry('dsk_bel_gbr_scope').GetName]则只想要一个不被任何强权吞并的缓冲国。"
 dsk_belgium.1.f:0 "伦敦会议所进行的不仅是各国势力的划分，也是对低地国家以何种形式继续存在的判决。\n\n若[SCOPE.GetRootScope.GetCountry.GetName]接受列强保障，#green 外交承认#!将增加推进速度，但永久中立也会像锁链一样锁死王国的外交空间；若坚持低地问题未完，比利时会获得更大的可开拓空间，却也会让荷兰与列强怀疑这个新王国是否真的愿意止步于此。\n\n#yellow 一个小国的诞生，往往不是由它自己宣布独立开始，而是始于大国的外交承认。#!"
 dsk_belgium.1.a:0 "接受列强保障。"
 dsk_belgium.1.b:0 "低地问题还远没有结束。"
 dsk_belgium.2.t:0 "边境委员会的决议"
 dsk_belgium.2.d:0 "边境委员会的会议室内挂着低地地区的巨幅地图，桌上则摆着资产清点账册和条约文书草案。林堡、卢森堡和比利时与荷兰实控边境周边地区的资产清点结果[SCOPE.sCountry('dsk_bel_gbr_scope').GetName]、[SCOPE.sCountry('dsk_bel_fra_scope').GetName]与[SCOPE.sCountry('dsk_bel_net_scope').GetName]的代表反复检查；对他们来说这是一次势力划分，对[SCOPE.GetRootScope.GetCountry.GetName]来说却是决定了未来长期的国家格局。"
 dsk_belgium.2.f:0 "外交文书会被淡忘，但随之产生的现实影响永续。\n\n接受委员会方案会推进#green 外交承认#!，也会把某些未能明确的领土纠纷永久写入外交档案。拒绝则显得更有骨气，但年轻王国的实力和外部环境都还不足以如此表态。"
 dsk_belgium.2.a:0 "签下这份令人不快的协议。"
 dsk_belgium.3.t:0 "荷兰的不甘"
 dsk_belgium.3.d:0 "[SCOPE.sCountry('dsk_bel_net_scope').GetName]的宫廷与军队仍不愿承认1830年的结果。边境哨所传来了发生小规模冲突的消息，荷兰报纸将比利时称作未被平定的叛乱，而政府中的强硬派则提醒[SCOPE.sCharacter('dsk_bel_ruler_scope').GetFullName]：如果此时退让，低地国家的未来方向将继续由荷兰主导。"
 dsk_belgium.3.f:0 "两个紧邻的国家相互对峙，谁也不愿意先露出一丝破绽。\n\n#green 持续施加压力#!会为联邦方案的实现创造机会，但会损害与荷兰关系并让列强怀疑比利时是否会恪守永久中立。#yellow 优先确保中立地位#!能减少与荷兰的冲突风险，却会在一定程度上放弃主导低地问题的机会。"
 dsk_belgium.3.a:0 "继续施加压力，让荷兰知道我们不会对其视而不见。"
 dsk_belgium.3.b:0 "优先确保中立地位，不能把王国的未来押上赌桌。"
dsk_belgium.4.t:0 "外交承认的附加成本"
 dsk_belgium.4.d:0 "伦敦会议正式结束，与会各国共同以文件形式承认比利时从荷兰的独立，不日就将分别建立起与比利时的外交关系。\n\n这使得[SCOPE.GetRootScope.GetCountry.GetName]被承认为一个独立并将长期存在的王国，而不是一场革命催生的短命的早产儿。"
 dsk_belgium.4.f:0 "年轻的王国得到的第一份礼物是被允许继续存在。\n\n外交承认和保障固然带来了安全，却也附带着条件：边境冲突、在低地的扩张、乃至任何主动发起的[concept_diplomatic_play]都可能使比利时成为众矢之的。这份代价并不低廉：外交部要学会隐藏自己的立场倾向，军队将用防御工事主导作战计划，议会则必须向公众解释为什么永久的中立比一场战争胜利更珍贵。"
 dsk_belgium.4.a:0 "让条约保护我们，也约束我们。"
 dsk_belgium.6.t:0 "伦敦条约生效"
 dsk_belgium.6.d:0 "《伦敦条约》把[SCOPE.GetRootScope.GetCountry.GetName]的存在通过国际会议令各国正式承认。比利时的独立、外交中立与边界划定不再只是布鲁塞尔自己的一家之言，而成为欧洲列强们的共识。"
 dsk_belgium.6.f:0 "从今天起，[SCOPE.sCountry('dsk_bel_gbr_scope').GetName]从中获得了海峡的安全，[SCOPE.sCountry('dsk_bel_fra_scope').GetName]借此拥有了北方的缓冲区，[SCOPE.sCountry('dsk_bel_net_scope').GetName]则被迫承认南方的脱离已成既定事实，比利时也由此正式走上欧洲外交的舞台。。\n\n遵守条约会提高永久中立的可信性，却不会替比利时治理矿区、教育和民族问题。真正的王国建设才刚刚开始。"
 dsk_belgium.6.a:0 "这是王国继续存在的基石。"
 dsk_belgium.7.t:0 "存亡危机"
 dsk_belgium.7.d:0 "外交谈判陷入了僵局，列强们的态度愈发模糊，而荷兰的立场则再次强硬。"
 dsk_belgium.7.f:0 "没有被外交承认的独立，永远称不上安全。比利时的街头开始流传起令人不安的消息：若王国无法证明自己是可靠缓冲国，1830年的胜利可能只是昙花一现。\n\n这不是终局，但会把国家推回更艰难的路线：改善与列强的关系、降低[concept_infamy]、避免战争，并重新证明比利时值得被欧洲列强所承认。"
 dsk_belgium.7.a:0 "我们的事业还没有结束。"
 dsk_belgium.8.t:0 "比利时问题"
 dsk_belgium.8.d:0 "[SCOPE.sCountry('dsk_bel_scope').GetName]正在请求各国与其建立外交关系，并承认其独立与永久中立国地位。"
 dsk_belgium.8.f:0 "有时候，最小的国家反而最为人所瞩目。各国外交部的行政官僚们不一定关心比利时民众们的理想，但他们都明白：若低地态势失控，法国、荷兰、普鲁士与英国都会基于国家利益需要而考量进行军事和外交干涉的必要性。\n\n承认比利时独立会改善与其的关系，这会把欧洲局势导向一种可控的均势；拒绝承认或淡化处理则保留回旋余地，但可能让低地问题继续发酵。"
 dsk_belgium.8.a:0 "承认比利时的独立。"
 dsk_belgium.8.b:0 "这只是暂时安排。"
 dsk_belgium.9.t:0 "比利时拒绝最后通牒"
 dsk_belgium.9.d:0 "[SCOPE.sCountry('dsk_bel_scope').GetName]拒绝了我们对其的要求，这将引发战争。"
 dsk_belgium.9.f:0 "战火烧到了低地，过去浮于纸面的外交立场，此刻终于要在炮火中接受检验。"
 dsk_belgium.9.a:0 "欧洲会记住这一刻。"
  dsk_belgium.10.t:0 "武装化中立国"
 dsk_belgium.10.d:0 "[SCOPE.sCharacter('dsk_bel_armed_forces_leader_scope').GetFullName]向内阁提交防御性战备计划书。[SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName]要求严格遵守条约内容，[SCOPE.gsInterestGroup('dsk_bel_armed_forces_scope').GetName]则提醒众人：永久中立若非建立在普遍武装的基础上，就只是一厢情愿。"
 dsk_belgium.10.f:0 "中立不意味着软弱，它意味着不受任何人收买，若要与之为敌，则对方必须为每一步推进付出代价。\n\n严守中立会限制主动[concept_diplomatic_play]，但能让列强更难把比利时视作军事通途。对一个夹在强国之间的小国来说，克制本身也是一种国家战略。"
 dsk_belgium.10.a:0 "以武装确保中立。"
 dsk_belgium.11.t:0 "破灭的中立"
 dsk_belgium.11.d:0 "布鲁塞尔的中立声明已不值一提。秘密接触、边境冲突、[concept_infamy]及战争传闻让列强开始怀疑：比利时究竟是低地缓冲国，还是披着中立外衣的投机国家？"
 dsk_belgium.11.f:0 "一旦中立被拿来交易，它就不足为信。\n\n这类失败不会只改变一项参数，它会影响后续低地政局、法德战争和世界大战的走向，每一次外交声明都是在延续过去的外交方针。"
 dsk_belgium.11.a:0 "这会让我们付出代价。"
  dsk_belgium.12.t:0 "桑布尔-默兹工业带"
 dsk_belgium.12.d:0 "从桑布尔到默兹的矿井、[GetBuildingType('building_railway').GetName]和车间正在把[SCOPE.GetRootScope.GetCountry.GetName]建设成整个大陆的中心工厂。[SCOPE.gsInterestGroup('dsk_bel_industrialists_scope').GetName]要求国家扶持工矿、运输和军事产业，财政部则担心过快扩张会把矿难、金融投机和工人罢工带向国家。"
 dsk_belgium.12.f:0 "烈日、沙勒罗瓦、布鲁塞尔和安特卫普并非彼此孤立，而是紧密联系并共同构建了这个国家的发展前沿。#green 投资矿场与军事工业#!会提高工业实力；#red 压低成本#!可以更快扩产，却会把劳工问题进一步积压。"
 dsk_belgium.12.a:0 "投资矿场与军事工业。"
 dsk_belgium.12.b:0 "压低成本，加快扩张。"

 dsk_belgium.13.t:0 "经济发展报告"
 dsk_belgium.13.d:0 "工商部提交了新的经济报告：得益于新建成的国家[GetBuildingType('building_railway').GetName]投入运作，沿线产业均得到了快速发展。[SCOPE.gsInterestGroup('dsk_bel_industrialists_scope').GetName]称这是国家的巨大成就，地方代表则追问征地补偿、债券发行和矿区事故将如何处理。"
 dsk_belgium.13.f:0 "蒸汽机车带来的不仅有货物，还有区域间的整合。[GetBuildingType('building_railway').GetName]不仅能提高工业实力，也能把弗拉芒、瓦隆和布鲁塞尔拉入一个更大的共同市场。经济发展不应局限于特定地区，还要迈向区域协作，而这其中[GetBuildingType('building_railway').GetName]的作用至关重要。\n\n高速运行的列车一旦失控，造成的破坏也将无比巨大。"
 dsk_belgium.13.a:0 "用铁轨将各地区连结。"
 dsk_belgium.14.t:0 "烈日的军工业"
 dsk_belgium.14.d:0 "烈日的枪炮厂和化工厂开始接到越来越多的订单。[SCOPE.gsInterestGroup('dsk_bel_industrialists_scope').GetName]把军工视为采矿业的产业延伸，[SCOPE.gsInterestGroup('dsk_bel_armed_forces_scope').GetName]则认为这能让永久中立不再仅仅依赖列强的善意。"
 dsk_belgium.14.f:0 "当大国代表觥筹交错时，小国最好不忘枕戈待旦。\n\n专注军事工业路线会强化工业与国防实力，但也会让邻国更关注比利时的武备水平。中立不是单方面的解除武装，而是需要让军备成为中立的现实支撑。"
 dsk_belgium.14.a:0 "扶持军事工业。"
 dsk_belgium.15.t:0 "祸起萧墙"
 dsk_belgium.15.d:0 "瓦隆矿区的劳资双方就工资水平的争执终于以罢工的方式集中爆发。工人组成委员会，并以该组织的名义把利益诉求张贴于市政厅的门口，[SCOPE.sCharacter('dsk_bel_trade_unions_leader_scope').GetFullName]要求削减工时、支付赔偿和严格监管，[SCOPE.sCharacter('dsk_bel_industrialists_leader_scope').GetFullName]则警告停产会让经济效益和金融稳定灰飞烟灭。"
 dsk_belgium.15.f:0 "机器轰鸣的工厂之外，人群的抗议声日渐嘈杂。\n\n#red 勒令复工#!能保障短期生产，但会使民众激进化并为后续的社会妥协蒙上阴影；#green 有限让步#!会拖慢工业化进程，却能化解迫在眉睫的劳工问题。"
 dsk_belgium.15.a:0 "勒令工人复工，别让机器停下来。"
 dsk_belgium.15.b:0 "给予有限让步，议会应发挥作用。"
 dsk_belgium.18.t:0 "欧洲工厂"
 dsk_belgium.18.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]已经成为欧洲大陆工业化程度最高的地区之一。矿井、银行、[GetBuildingType('building_railway').GetName]、兵工厂和[GetBuildingType('building_port').GetName]在狭小国土上林立，外国观察家开始用“欧洲工厂”形容这个缺乏战略纵深、却拥有惊人工业能力的小王国。"
 dsk_belgium.18.f:0 "比利时没有广阔的领土，但它拥有众多的矿场、繁忙的交易市场和密集的[GetBuildingType('building_railway').GetName]。\n\n这是一种力量，也是一种危险：市场震荡会更快传到矿区，劳资冲突会迅速危及政府，[GetBuildingType('building_railway').GetName]事故会立刻变为全国新闻。工业繁荣不是终点，而是劳工、金融界和社会妥协的现实基础。"
 dsk_belgium.18.a:0 "这是我们的力量。"
 dsk_belgium.19.t:0 "教育之战"
 dsk_belgium.19.d:0 "[SCOPE.gsInterestGroup('dsk_bel_devout_scope').GetName]把学校视作教区、家庭和灵魂的延伸，[SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName]则认为现代国家不能把下一代交给讲坛。就教育预算、教师资格和教材内容的争执一同被加入了议程。"
 dsk_belgium.19.f:0 "孩子们坐在教室里接受教育，大人们却在为灵魂、选票和国家未来争吵。\n\n在[SCOPE.GetRootScope.GetCountry.GetName]，教育之战并非简单的[concept_law]争论，而是城市自由派、乡村宗教势力、王室地位和地方自治的长期角力。#green 妥协#!能维持政府[concept_legitimacy]，#red 一方胜利#!则会决定国家教育的方针。"
 dsk_belgium.19.a:0 "支持教会主导。"
 dsk_belgium.19.b:0 "推动世俗化改革。"
 dsk_belgium.19.c:0 "寻求妥协。"
 dsk_belgium.20.t:0 "主教的讲坛"
 dsk_belgium.20.d:0 "[SCOPE.sCharacter('dsk_bel_devout_leader_scope').GetFullName]的通谕被反复宣读。[SCOPE.gsInterestGroup('dsk_bel_devout_scope').GetName]将政府的改革视作对公众宗教生活和接受上帝指引权利的剥夺。"
 dsk_belgium.20.f:0 "讲坛中的宣讲很快变成了信徒的行动。\n\n若教会主张压过对手，教育进度会推进，但自由派会把这视作国家向教区让渡了国民的未来。教育之战的困难在于：任何某一方胜利都会让另一方这是对他们理想的背弃。"
 dsk_belgium.20.a:0 "承认讲坛也是大众政治的一部分。"
 dsk_belgium.21.t:0 "自由派内阁"
 dsk_belgium.21.d:0 "[SCOPE.sCharacter('dsk_bel_intelligentsia_leader_scope').GetFullName]在议会提交教育部议案：教师资格认定、课程内容选材和学校补助审议必须由政府监督。"
 dsk_belgium.21.f:0 "[SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName]称，现代国家必须先拥有国民教育，他们把公共课堂认作现代[concept_law]与公民身份的根基，教会报纸则称这是在剥夺民众与上帝对话的权利。\n\n扩展公立教育会推动教育进度，却也会促使民众激进化并引发教会抵制。"
 dsk_belgium.21.a:0 "扩大公立教育。"
 dsk_belgium.22.t:0 "教育妥协案"
 dsk_belgium.22.d:0 "[SCOPE.gsInterestGroup('dsk_bel_devout_scope').GetName]保住了地方学校的旧有体系，[SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName]则获得课程制定、资格审查和预算审计的一部分权力。没有一方能主导一切，于是[SCOPE.sCharacter('dsk_bel_ruler_scope').GetFullName]批准了一份满是例外条款的妥协法案。"
 dsk_belgium.22.f:0 "妥协不令人喜悦，但它能让国家继续运转。\n\n这类选择会提高教育之战进度及政府[concept_legitimacy]，却不会使矛盾消弭。它只是把冲突从街头转移到了预算委员会里。比利时很擅长这种不漂亮的魔法。"
 dsk_belgium.22.a:0 "让两种教育体制在同一部法律下并存。"
 dsk_belgium.23.t:0 "教育体制问题的平衡"
 dsk_belgium.23.d:0 "对教育体制的政治暂时降温。教会保住了地方社会的根系，自由派获得了进行国家监督的权力，王室则保住了作为调停者的地位。教育议题没有从政治生活中消失，但至少不再每天把内阁推到悬崖边。"
 dsk_belgium.23.f:0 "比利时政治的政治智慧，就是把裂痕藏进制度里。\n\n这项法案会为民族运动、议会妥协和战后改革留下可用经验：如果教育争端能通过政治妥协消弭，也许其他矛盾也可以。"
 dsk_belgium.23.a:0 "这就是妥协政治。"
 dsk_belgium.24.t:0 "弗拉芒的请愿"
 dsk_belgium.24.d:0 "来自#yellow 佛兰德#!的请愿书被送进布鲁塞尔：政府公告、行政文书、学校课程应纳入弗拉芒语。法语精英把这视为国家统一的威胁，弗拉芒代表则称之为当地人最基本的权利。"
 dsk_belgium.24.f:0 "一个国家可以拥有两种民族，但不能只有一者拥有尊严。\n\n[SCOPE.GetRootScope.GetCountry.GetName]的政治结构建立在妥协之上，但民族问题比关税、国家财政和内阁席位更难商议。#green 承认弗拉芒语地位#!会提高国家凝聚力；#red 维持单一行政语言#!能短期稳定官僚体制，却会让#yellow 佛兰德#!地区转向更激烈的抗议。"
 dsk_belgium.24.a:0 "接受他们的诉求。"
 dsk_belgium.24.b:0 "必须维持单一官方语言。"
 dsk_belgium.24.c:0 "民族问题关系到低地未来。"
 dsk_belgium.25.t:0 "根特大学的示范效应"
 dsk_belgium.25.d:0 "根特大学成为民族平等的典范，这里的学生社团要求开放弗拉芒语讲座，教授们编纂着双语教材，弗拉芒语被鼓励引入到越来越多的正式场合之中。"
 dsk_belgium.25.f:0 "大学中的语言，往往也是未来精英的语言。\n\n推动弗拉芒语教育会提高国家凝聚力，并让[SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName]更难以忽视弗拉芒的声音；反对者则担心国家会从稳定的单一体制变成在两个鸡蛋上跳舞。"
 dsk_belgium.25.a:0 "让根特培养出能通过自己的语言服务于国家的人。"
 dsk_belgium.26.t:0 "军事通信用语"
 dsk_belgium.26.d:0 "军营里的语言问题已经无法继续被视而不见，军令体系继续使用法语的单一体制，或是接纳弗拉芒语变为双语并行，相关草案已经被推到战争部长的案头。"
 dsk_belgium.26.f:0 "[SCOPE.gsInterestGroup('dsk_bel_armed_forces_scope').GetName]担心双语并行会危害军政效率，弗拉芒士兵却称：士兵愿意为国家而战，但国家也必须听见他们的声音。\n\n改革军队语言制度会凝聚国家团结，让更广泛的动员变得可行；拖延问题则会使民族矛盾积重难返。"
 dsk_belgium.26.a:0 "改革军队语言制度，让忠诚不再需要额外的媒介。"
 dsk_belgium.27.t:0 "布鲁塞尔的弹压"
 dsk_belgium.27.d:0 "布鲁塞尔通过行政命令压制弗拉芒运动：请愿游行被驱散，地方报纸被警署警告，大学与法院改革议案被否决。[SCOPE.gsInterestGroup('dsk_bel_petty_bourgeoisie_scope').GetName]称这维护了国家稳定，但#yellow 佛兰德#!的沉默更像被迫收紧的弹簧。"
 dsk_belgium.27.f:0 "沉默并不等于认同。\n\n政府弹压会在短期内恢复国家秩序，却损害国家团结并迫使民众激进化。在这之上：语言问题不再是改革议题，而会危害民族对国家的忠诚。"
 dsk_belgium.27.a:0 "让他们安静，哪怕只是暂时。"
 dsk_belgium.29.t:0 "民族和解"
 dsk_belgium.29.d:0 "今日，[SCOPE.GetRootScope.GetCountry.GetName]正式采纳弗拉芒语成为其第二种官方语言。各个政府机关仍在就细节争论不休，但弗拉芒人与瓦隆人第一次在法律层面上拥有对等地位。"
 dsk_belgium.29.f:0 "国家并不因内部差异而分化，只会因对差异视若无睹而分崩离析。\n\n民族和解会凝聚国家团结，并为战后稳定性与议会体制提供稳定基础。它不是民族问题的全部终结，而是国家对特定问题的妥善应对。"
 dsk_belgium.29.a:0 "比利时拥有着两种不同的声音。"
 dsk_belgium.30.t:0 "弗拉芒的新形势"
 dsk_belgium.30.d:0 "弗拉芒运动被压制后没有消失，只是从公开请愿转入社团、报纸、学生团体和地方选举运作中。王国的官方语言问题不只关乎行政效率，更涉及到谁能掌握政治权利。"
 dsk_belgium.30.f:0 "当一半的国民认为自己并未被国家所接纳时，危机才刚刚开始。\n\n此次失败结果会损害国家团结，使以后的危机更容易爆发。"
 dsk_belgium.30.a:0 "这为日后埋下伏笔。"
 dsk_belgium.31.t:0 "利奥波德二世的非洲梦"
 dsk_belgium.31.d:0 "[SCOPE.sCharacter('dsk_bel_leopold_ii_scope').GetFullName]在布鲁塞尔举办了地理会议，国王在会上宣扬人道主义，力图激发欧洲人对改善和文明中非民众生活的兴趣。国王在多国政府的支持下建立了国际非洲协会并当选主席，这为其在中非的行动创造了良好开端。"
 dsk_belgium.31.f:0 "小王国的国王想要一个比王国本身大得多的领土。\n\n刚果计划会给[SCOPE.GetRootScope.GetCountry.GetName]带来#green 海外领土、财政收入和国际威望#!，也会制造#red 殖民丑闻、[concept_infamy]和列强审查#!，如果处置不当，刚果会成为比利时的累赘。"
 dsk_belgium.31.a:0 "资助斯坦利与探险队。"
 dsk_belgium.31.b:0 "这不是国家该做的事。"
 dsk_belgium.32.t:0 "柏林会议与刚果自由邦"
 dsk_belgium.32.d:0 "在寻求比利时政府支持无果后，[SCOPE.sCharacter('dsk_bel_ruler_scope').GetFullName]决定越过政府，直接建立对刚果盆地的主权，换言之，就是使之成为他的私人领地。"
 dsk_belgium.32.f:0 "为达成这一目标，利奥波德二世进行了诸多利益让步，在会议上他宣称会参与人道主义和慈善事业，允许各国在当地进行商贸活动并且不向其征收关税，甚至将北岸和南岸地区交付给法国和葡萄牙以换取与会各国的支持。\n\n争取支持会推进在刚果自由邦的开拓，也会提高未来丑闻的国际传播度；低调处理能减少早期压力，却可能削弱经济收益。刚果自由邦不是免费的午餐，而是一个可能愈发沉重的外交负担。"
 dsk_belgium.32.a:0 "把刚果自由邦的建立提上日程。"
 dsk_belgium.32.b:0 "避免太过张扬，先争取各国支持。"
 dsk_belgium.33.t:0 "橡胶与象牙"
 dsk_belgium.33.d:0 "丰富象牙和橡胶产品以及特许公司的股票分红开始顺着航线与金融网络回到欧洲。"
 dsk_belgium.33.f:0 "账簿上写着利润，当地则遍布着动乱。\n\n#red 继续榨取#!会提高经济收益，但会增加丑闻与[concept_infamy]产生；#green 限制最恶劣的行径#!会牺牲短期收益，却为未来国家接管和改革创造机会。"
 dsk_belgium.33.a:0 "朕的钱！全都是朕的钱！"
 dsk_belgium.33.b:0 "至少要懂得收敛吧？他们应当明白王室不想引火烧身。"
 dsk_belgium.34.t:0 "刚果人权状况调查报告"
 dsk_belgium.34.d:0 "关于强制劳动、惩罚性致残等人道主义灾难的报告开始在欧洲的各大报纸披露。改革派把连篇累牍的报道带进议会讨论，商社代表则坚称这是境外势力的蓄意诽谤；可摄像机和相片是唯一不能贿赂的证人。"
 dsk_belgium.34.f:0 "土地被开发，收益已经出现，只是过程不那么“和谐”。"
 dsk_belgium.34.a:0 "若要人不知，除非己莫为。"
 dsk_belgium.35.t:0 "王室的印钞机"
 dsk_belgium.35.d:0 "刚果的行政部门、特许商社、军警和教堂继续扩张，一份份特许状被售出以充实王室的内帑。王室坚称这是私人领地正常的运作，经济界的大鳄们却已经开始盘算自己的预期收益，外交部则不得不为任何可能的国际监督准备官方回应。布鲁塞尔的议员们逐渐意识到：所谓私人帝国，正在以国家名义作背书。"
 dsk_belgium.35.f:0 "私人帝国的成本，终究会落到国家头上。\n\n拖延议会介入能更大程度维持王室收益，却会让未来的改革更被动。"
 dsk_belgium.35.a:0 "再捞一把，就一把。"
 dsk_belgium.36.t:0 "刚果丑闻爆发"
 dsk_belgium.36.d:0 "[SCOPE.sCountry('dsk_bel_scope').GetName]在刚果的统治引发国际广泛批评。文化界、宗教界和主张改革的政治界人士均要求列强介入。"
 dsk_belgium.36.f:0 "此前文明和人道的面具在此刻被撕碎，外交官们开始把刚果问题与比利时的其他外交承诺一同衡量：一国领袖如果在利益到手后便立刻放弃其为了得到该利益所做出的承诺，那么该国做出的其他承诺是否可信？\n\n公开谴责会降低与比利时的关系并促使丑闻传播面扩大；谨慎表态则会避免与比利时的直接冲突，但可能让刚果问题继续糜烂。"
 dsk_belgium.36.a:0 "怎会有如此不仁不义之举？必须严正谴责！"
 dsk_belgium.36.b:0 "这与我们何干？"
 dsk_belgium.37.t:0 "刚果自由邦的建立"
 dsk_belgium.37.d:0 "刚果自由邦获得国际承认，[SCOPE.GetRootScope.GetCountry.GetName]第一次拥有了远超本国面积的海外领土。"
 dsk_belgium.37.f:0 "王宫中在庆祝在探险开拓、商贸运作和文明传播的胜利，少数议员则私下交流：当这片土地发生变故，以[SCOPE.GetRootScope.GetCountry.GetName]的能力将何以应对？\n\n刚果自由邦的建立只是开始，若事前的承诺兑现不足，刚果会从希望的热土变成一块烫手山芋。"
 dsk_belgium.37.a:0 "胜利硕果纷至，我等应接不暇。"
 dsk_belgium.38.t:0 "进行国际调查"
 dsk_belgium.38.d:0 "刚果的丑闻已经无法靠简单的外交辞令掩盖。现在无论是他国舆论，还是本国的反对派都在要求对此进行全面披露。"
 dsk_belgium.38.f:0 "面对各方纷至沓来的压力，比利时必须选择被迫改革来为将来国家的直接接管铺路，或是继续沉默以对。\n\n刚果的改革被送上案头：确保经济收益、批准公开调查和继续外交掩饰都会带来不同的效果。"
 dsk_belgium.38.a:0 "王国正走进迷雾之中。"
 dsk_belgium.39.t:0 "低地问题"
 dsk_belgium.39.d:0 "伦敦条约保障了[SCOPE.GetRootScope.GetCountry.GetName]的安全，也划定了它的边界。一些政治家发问：比利时是否只能永远作为低地的缓冲国存在？[SCOPE.sCountry('dsk_bel_net_scope').GetName]、卢森堡和荷兰的关系应当被重新审视。"
 dsk_belgium.39.f:0 "低地的现状并非永恒的定局，只要采取某些手段，无论通过政治、经济或是军事，都可能将低地区域引向重新结合。\n\n#yellow 永久中立#!越坚实，改弦易辙转而公开推动低地重组就越困难；但如若与荷兰的关系得到改善、经济协作进一步扩大、列强无暇他顾，比利时就可能实现另一种联邦方案。"
 dsk_belgium.39.a:0 "推动低地合作。"
 dsk_belgium.39.b:0 "准备更强硬的路线。"
 dsk_belgium.40.t:0 "区域关税协商"
 dsk_belgium.40.d:0 "比利时与荷兰商人都看到了统一市场的利益。安特卫普、鹿特丹、海牙、布鲁塞尔将成为同一经济网的节点；外交官还在就1830年的旧账争执不休，商人们却已经开始密切商贸往来。"
 dsk_belgium.40.f:0 "金钱的流向往往比外交官的声明更诚实。\n\n关税协商是低地统合路线的开端：它能提高低地统合进度并改善与荷兰的关系，但不会直接促成联邦建立。"
 dsk_belgium.40.a:0 "让市场先行一步，政治其后跟上。"
 dsk_belgium.41.t:0 "卢森堡问题"
 dsk_belgium.41.d:0 "新的难题浮出水面：卢森堡的地位悬而不决使得低地的未来仍不明朗。"
 dsk_belgium.41.f:0 "比利时可以通过商贸往来、关税优惠、王室联系和外交保障等手段扩大影响，但想必荷兰、法国和普鲁士不会对此听之任之，毕竟这牵动着低地的政局。\n\n温和接近能推进低地统合进度并避免直接刺激列强；若选择采取强硬宣称，卢森堡更将成为局势焦点。"
 dsk_belgium.41.a:0 "以谨慎手段示好。"
 dsk_belgium.43.t:0 "宣称低地"
 dsk_belgium.43.d:0 "政府中的强硬派要求向各国提出外交照会，要求他们承认比利时在低地的领导地位，这会把国家推向一个危险的未来！"
 dsk_belgium.43.f:0 "当一个缓冲国开始要求其被事先划定的边界以外的领土，大国们就会重新考量其地位。\n\n提出区域宣称会快速推进低地统合，但会增加[concept_infamy]及导致他国对我们的警惕。这不是毫无成本的扩张，而是将永久中立作为赌注。"
 dsk_belgium.43.a:0 "提出我们的宣称，让欧洲重新计算低地。"
 dsk_belgium.44.t:0 "低地联邦构想"
 dsk_belgium.44.d:0 "无论通过经济、政治、军事或是其他何种手段，[SCOPE.GetRootScope.GetCountry.GetName]已经使低地问题初见眉目。"
 dsk_belgium.44.f:0 "联邦构想不再是疯狂的呓语，而是逐步化作现实。\n\n联邦方案若能实现，必将给比利时更广阔的空间，但也会对永久中立的可信性造成深层次破坏。低地国家可以选择自己的道路，但列强们未必乐见一个新的地区强国粉墨登场。"
 dsk_belgium.44.a:0 "低地可以有新的格局。"
 dsk_belgium.45.t:0 "德意志对比利时的最后通牒"
 dsk_belgium.45.d:0 "今日，[SCOPE.sCountry('dsk_bel_ger_scope').GetName]无视了[SCOPE.sCountry('dsk_bel_net_scope').GetName]先前宣称的绝对中立，要求该国接受其军队通过，如若[SCOPE.sCountry('dsk_bel_net_scope').GetName]逾期未有答复或拒绝该要求，那么[SCOPE.sCountry('dsk_bel_ger_scope').GetName]便会如其所宣称般采取强硬手段。"
 dsk_belgium.45.f:0 "比利时的未来被摆上了十字路口。\n\n如果选择抵抗到底，比利时将很有可能付出损失一代人及过去的繁荣毁于一旦的代价。战前的防御计划将被执行，烈日要塞会首先承受敌军攻势，安特卫普可能成为撤退节点，最糟糕的情况下军队将依托伊瑟河进行最后的有组织抵抗。\n\n若[SCOPE.GetRootScope.GetCountry.GetName]屈服，也未必高枕无忧，德国不会把我们当作盟友，法国必定对我们产生敌意，若其胜利则我们免不了被事后清算。最重要的是，这也许只是日俄战争中清国式的局外中立，德国与法国的战争会在比利时的国土上进行。"
 dsk_belgium.45.a:0 "祈战死。"
 dsk_belgium.45.b:0 "小孩子不懂事中立着玩的，德意志皇军若至，我必当以礼来降。"
 dsk_belgium.46.t:0 "烈日要塞好整以暇"
 dsk_belgium.46.d:0 "[SCOPE.sCharacter('dsk_bel_armed_forces_leader_scope').GetFullName]命令军队大规模进驻烈日要塞群准备战斗。守军知道他们足够挡住德国的先头部队，却无法抵御随后的重炮轰击，但每一小时的抵抗都会为该国与英国的紧急外交照会和友军部队的从容调度争取得时间。"
 dsk_belgium.46.f:0 "小国的抵抗，有时以天甚至小时计算，却有着甚至能够改变战局的力量。\n\n烈日的堡垒并非为了某一场战役的胜利，而是服务于战略全局。"
 dsk_belgium.46.a:0 "要塞必须坚持住足够长的时间，这会为日后的反攻争取最宝贵的时间。"
 dsk_belgium.47.t:0 "伊瑟河防线"
 dsk_belgium.47.d:0 "比利时军队打开了伊瑟河流域的水闸，洪水奔涌而至，德国军队不得不放慢推进速度。"
 dsk_belgium.47.f:0 "先前对桥梁的破坏也未能组织德军继续逼近，数日前守军虽然抵御住累德军又一轮的进攻，但在德军更加猛烈的进攻下比利时军队已于作业打开了伊瑟河的水闸，通过人为造成一片洪水区，比利时可依托其和伊瑟河构筑的自然屏障坚守它最后的国土。"
 dsk_belgium.47.a:0 "这是最后的防线。"
 dsk_belgium.48.t:0 "来自刚果的外援"
 dsk_belgium.48.d:0 "刚果的铜、橡胶与财政收入被全面征调过来以便支援战争。比利时本土沦为战场，殖民地却可为母国输血。"
 dsk_belgium.48.f:0 "一箱箱物资从非洲装船，在法国上岸后，先被加工成紧俏的军用物资，再被运输给比利时军队。\n\n征调海外物资会助益战争胜利，但若刚果改革进程不足，此时的横征暴敛将在战后留下祸根。"
 dsk_belgium.48.a:0 "到了他们为母国出力的时候了。"
 dsk_belgium.50.t:0 "比利时归于安宁"
 dsk_belgium.50.d:0 "大战以协约国一方的胜利结束，同盟国阵营宣布投降，占据着比利时领土的德国军队和比利时军队在今日实现了有序停火。"
 dsk_belgium.50.f:0 "[SCOPE.GetRootScope.GetCountry.GetName]以坚强抵抗证明了小国的坚韧。战时内阁组建、在烈日要塞抵抗、伊瑟河防线奋战、从安特卫普撤退和双方军队停战成为一代人的共同记忆。以往被视作国家基础的中立地位被破坏了，但比利时这个国家仍将继续存在。\n\n这场胜利会成为战后重建、民族政策和民主根基的开端。小国的胜利来之不易，战后还需不忘舔舐伤口。"
 dsk_belgium.50.a:0 "我们活下来了。"
 dsk_belgium.51.t:0 "战后重建"
 dsk_belgium.51.d:0 "世界大战终于结束，人们不再需要为武器和弹药发愁，但新的难题接踵而至，战后的经济和社会秩序恢复迫在眉睫，如何修复德军占领造成的破坏亟待解决，[SCOPE.GetRootScope.GetCountry.GetName]政府应速下决断。"
 dsk_belgium.51.f:0 "过去连年的战争对我国的破坏不言自明，街头巷尾的断壁残垣仍随处可见，值此和平之机，比利时必须重新振作。\n\n战争的胜利虽然在国际上为比利时赢得了同情、尊重、逐步兑现的赔偿和胜利者的席位，但在其国内，战争的创伤却难以愈合。面对被战争重创的国内生产，吸纳复员军人成为巨大难题，街头政治运动的声势日渐浩大，民众要求更多的政治权利以迫使政府着力解决他们的现实困境。\n\n重建是个漫长的过程，不在于一朝一夕：#green 实现普选制、保障劳工待遇和提高弗拉芒民族地位#!会促进战后恢复；#red 忽视退伍军人、矿区工资和弗拉芒诉求#!则会让三十年代极端政治提前抵达。"
 dsk_belgium.51.a:0 "开始重建。"
 dsk_belgium.52.t:0 "提高弗拉芒民族地位"
 dsk_belgium.52.d:0 "大批参加了战争的弗拉芒复员军人举行政治集会，要求政府采纳弗拉芒语作为官方语言。"
 dsk_belgium.52.f:0 "他们的军功使得他们的声音更具分量而难以忽视，而共同服役的经历为他们争取到了大批瓦隆人支持者；国家若继续回避弗拉芒人的诉求，就等于告诉每一个国民：今日为国家献出生命，明日就会被卸磨杀驴。\n\n推进语言改革会促进战后稳定性凝聚国家团结；置之不理则会为三十年代的民族自治与极端政治提供温床。"
 dsk_belgium.52.a:0 "天下万民都是皇上您的子民。"
 dsk_belgium.53.t:0 "大萧条的波及"
 dsk_belgium.53.d:0 "纽约证券交易所的震荡传导到了布鲁塞尔，美国股市大盘的下挫拖累了比利时的表现，整个大盘随即跳空，金融海啸在当天的股市大盘上留下了一根触目惊心的长上影线，各工业指数均有不同程度的下跌，这或许预示着繁荣时代的落幕。"
 dsk_belgium.53.f:0 "国际市场的金融海啸危及着[SCOPE.GetRootScope.GetCountry.GetName]的经济命脉。中小股民的信箱被催缴保证金的信件塞得满满当当；过去几年通过股市获利的民众此刻发现他们的资产正在如雪花般消逝；券商见势不妙，连追加保证金的要求都来不及发出便直接斩仓。工厂停工，银行收紧信贷，比利时发达的金融网将寒潮快速传导到全国各地，而这只是这场经济危机的前菜。\n\n维持社会妥协会增加行政成本，但能保护民主根基；如果放任企业和银行自行崩溃，极端政治的言论将甚嚣尘上。"
 dsk_belgium.53.a:0 "诸位，有话好好说，千万不要火并啊。"
 dsk_belgium.54.t:0 "雷克斯主义与赤色瓦隆"
 dsk_belgium.54.d:0 "雷克斯主义团体、社会主义组织、天主教保守派和弗拉芒民族主义者争夺着战间期比利时的政治话语权。[SCOPE.gsInterestGroup('dsk_bel_petty_bourgeoisie_scope').GetName]要求恢复天主教道德秩序，[SCOPE.gsInterestGroup('dsk_bel_trade_unions_scope').GetName]要求社会救济与工人权利，王室与议会则试图政治维稳。"
 dsk_belgium.54.f:0 "当传统温和政治无法解决实际问题，人民就会寻求其他路线。\n\n维护议会体制会推进战后稳定性，但并非一劳永逸：政府合法性、社会救济、民族平等和国防政策必须共同作用，否则社会将持续激进化。"
 dsk_belgium.54.a:0 "还望诸君相忍为国。"
 dsk_belgium.55.t:0 "比利时社会妥协"
 dsk_belgium.55.d:0 "通过重建、改革和政治平衡，[SCOPE.GetRootScope.GetCountry.GetName]暂时遏制了战间期危机。失业、民族矛盾、军人复员和政府合法性并未消失，但它们被重新限制在议会体制下进行。"
 dsk_belgium.55.f:0 "这种妥协也许只是一种建立在火山口上的和平。妥协完成不代表高枕无忧，尤其当面临新的危局时。它只是证明比利时仍有能力化解社会矛盾。"
 dsk_belgium.55.a:0 "不管怎么说，妥协也是一种政治智慧。"
 dsk_belgium.56.t:0 "国家[GetBuildingType('building_railway').GetName]债券"
 dsk_belgium.56.d:0 "比利时交通部提出以国家信用发行背书发行[GetBuildingType('building_railway').GetName]债券，按照他们的规划草案，各主要工业区，贸易港、金融区将相互贯通。"
 dsk_belgium.56.f:0 "银行家称这是国家工业化的坦途，反对者则警告[GetBuildingType('building_railway').GetName]承包商和证券投机者会以私人利益绑架国家工程。\n\n若债券被认购，#green 经济部门协同发展#!将推动工业和基础设施建设；若投机狂热盖过公共利益，民众将会发出质疑。"
 dsk_belgium.56.a:0 "用国家信用作助推器。"
 dsk_belgium.56.b:0 "把空间留给私人资本，国家需要风险隔离。"
 dsk_belgium.57.t:0 "财团的回应"
 dsk_belgium.57.d:0 "国内的几大财团表示愿意承销部分债券，但他们要求优先确保收益、工程的优先承包权和对规划方案的发言权。"
 dsk_belgium.57.f:0 "资本永不眠，你总会在有利可图的地方看到它的身影。\n\n接受提议会促进经济部门协同发展，却可能提高工程风险；拒绝大财团能保护公共信誉，但会拖延[GetBuildingType('building_railway').GetName]的建设进度。"
 dsk_belgium.57.a:0 "钱不是万能的，但没钱是万万不能的。"
 dsk_belgium.57.b:0 "让他们管好自己的手。"
 dsk_belgium.58.t:0 "矿产运输线"
 dsk_belgium.58.d:0 "沙勒罗瓦、烈日和蒙斯的矿场要求新的货运[GetBuildingType('building_railway').GetName]加入，以便把产品送到市场。"
 dsk_belgium.58.f:0 "工矿主想要更低的运费，工人想要更稳定的效益，财政部只看见一串继续膨胀的工程预算。\n\n优先连接矿区会推进相关产业发展，也会创造更强的工人势力，若发生罢工，后果更加严重。"
 dsk_belgium.58.a:0 "优先连接矿区。"
 dsk_belgium.59.t:0 "投机的热土"
 dsk_belgium.59.d:0 "因[GetBuildingType('building_railway').GetName]规划而勾勒出的未来蓝图引发了投资热潮，但是这种热潮如果继续升温就将很容易转化为投机。"
 dsk_belgium.59.f:0 "议员们不断收到来自地方政府、银行业、建筑承包商的游说，每个人都声称自己出于对国家利益的尊重，每个人都刚好能从自己的方案中获得最大利益。[GetBuildingType('building_railway').GetName]的建设尚未开始，基本时间表都未能敲定，但仅凭着这一风声，沿线的地价就已开始跳涨。\n\n放任投机会加速资金积累，但累积金融风险；遏制投机会拖慢建设速度，换来更干净的国家信用。"
 dsk_belgium.59.a:0 "建设速度优先。"
 dsk_belgium.59.b:0 "给投机踩下刹车。"
 dsk_belgium.60.t:0 "安特卫普的货运"
 dsk_belgium.60.d:0 "货运火车络绎不绝，把内陆煤铁送往安特卫普，商船将货物接着送往国际市场。"
 dsk_belgium.60.f:0 "[GetBuildingType('building_port').GetName]商人要求更自由的贸易政策和更低的税收，工人则担心与外界更紧密的联系会反向冲击当地的经济。\n\n强化海陆联运会助长经济，也会使比利时更易受到全球市场波动的影响。"
 dsk_belgium.60.a:0 "拥抱全球市场。"
 dsk_belgium.61.t:0 "英国的金融资本"
 dsk_belgium.61.d:0 "[SCOPE.sCountry('dsk_bel_gbr_scope').GetName]投资者青睐于比利时的实业收益，大笔资金通过伦敦的金融市场注入比利时。"
 dsk_belgium.61.f:0 "英镑的身影比皇家舰队更遍布全球。\n\n接受英国资本注入可以加速扩张，并改善与英国的关系；保持独立运作则能减少外部依赖和可能的经济操控，但会滞后整体发展速度。"
 dsk_belgium.61.a:0 "伦敦老爷这边请。"
 dsk_belgium.61.b:0 "难道英国人的钱比比利时的名誉更重要吗？"
 dsk_belgium.62.t:0 "工人的地位"
 dsk_belgium.62.d:0 "[GetBuildingType('building_railway').GetName]和[GetBuildingType('building_port').GetName]的加速建设催生了壮大的工人群体，扳道工、修理工、装卸工等工种都在这套体系下运作。"
 dsk_belgium.62.f:0 "各经济部门促进着整体发展，相应地，整体经济也会与之深度绑定。而现在，整个运输业就建立在这些工人的劳作之上。"
 dsk_belgium.62.a:0 "承认他们不可或缺。
 dsk_belgium.63.t:0 "列车准点"
 dsk_belgium.63.d:0 "[GetBuildingType('building_railway').GetName]线串联起各大城市，货物和人员的运输密切起各地的联系，城市因每一次火车进站而变得繁忙。"
 dsk_belgium.63.f:0 "国家因[GetBuildingType('building_railway').GetName]蓬勃发展，列车准点就是对这种发展的保障。"
 dsk_belgium.63.a:0 "火车头带动国家发展。"
 dsk_belgium.64.t:0 "欧洲十字路口的[GetBuildingType('building_railway').GetName]网"
 dsk_belgium.64.d:0 "荷兰、法国、卢森堡和比利时的商人群体都希望修建[GetBuildingType('building_railway').GetName]以跨越边境连通各国。通过[GetBuildingType('building_railway').GetName]密切经贸往来，将使经济合作水到渠成，低地统合也就不会过于突兀。"
 dsk_belgium.64.f:0 "只要更进一步，经贸往来就能为政治和解投石问路，前提是比利时要让他国相信自己是各友好国家。"
 dsk_belgium.64.a:0 "以贸易促进外交。"
 dsk_belgium.65.t:0 "[GetBuildingType('building_railway').GetName]王国"
 dsk_belgium.65.d:0 "[GetBuildingType('building_railway').GetName]网如同密集血管连接各脏器般，连接着各个经济部门和经济活动，为国家输送着养分，比利时的高速发展全系于此。"
 dsk_belgium.65.f:0 "欧洲工厂不只有车间，还有铁轨和金融。"
 dsk_belgium.65.a:0 "让火车继续开动。"
 dsk_belgium.66.t:0 "矿井下的声音"
 dsk_belgium.66.d:0 "矿难的遇难者名单被递交议会，一串串名字后面是一个个寡妇、孤儿、残缺的尸体和破碎的家庭。断裂的支架和被煤尘覆盖的尸体。，。"
 dsk_belgium.66.f:0 "工人代表要求更短的工时、更安全的工作环境和明确的事故赔偿标准；[SCOPE.gsInterestGroup('dsk_bel_industrialists_scope').GetName]则提出异议，称这样的改革会削弱比利时工业在欧洲的竞争力。"
 dsk_belgium.66.a:0 "建立矿井监管制度。"
 dsk_belgium.66.b:0 "不要让工厂停止运作。"
 dsk_belgium.67.t:0 "矿难调查报告"
 dsk_belgium.67.d:0 "矿难事故调查委员会完成了初期调查，目前报告提交到了工商部。"
 dsk_belgium.67.f:0 "委员会文件记录了塌方原因、管道铺设和童工使用，并分析了事故责任的划定。报告在报纸上被部分披露后，民众涌上街头要求政府公布完整调查结果，严格划定事故责任触发涉事企业并对遇难者家属赔偿。"
 dsk_belgium.67.a:0 "接受他们的要求"
 dsk_belgium.67.b:0 "努力淡化事故责任"
 dsk_belgium.68.t:0 "教会活动与工人社团"
 dsk_belgium.68.d:0 "治安警察注意到，越来越多挂着各式名头的组织在工人之中进行宣传，我们需要对这些活动进行研判。"
 dsk_belgium.68.f:0 "天主教社团、自由派慈善组织和工人联合会都试图拉拢工人，看来他们都耐不住寂寞了。"
 dsk_belgium.68.a:0 "允许社团扩张。"
 dsk_belgium.69.t:0 "沙勒罗瓦罢工"
 dsk_belgium.69.d:0 "罢工浪潮席卷沙勒罗瓦，此时已经蔓延到[GetBuildingType('building_railway').GetName]和主要工厂，[GetBuildingType('building_railway').GetName]运输和社会生产已经陷入瘫痪。"
 dsk_belgium.69.f:0 "警察在街道布置障碍物阻挡人群前进，所幸还未发生更大的冲突。当地的军人全部取消休假回到军营并进入紧急状态，军警、工厂主和地方议员都要求布鲁塞尔给出明确态度，现在只待政府一声令下。"
 dsk_belgium.69.a:0 "采取断然手段。"
 dsk_belgium.69.b:0 "你们不要再打了啦。"
 dsk_belgium.70.t:0 "工人要求普遍选举权"
 dsk_belgium.70.d:0 "工人代表将集体签名和请愿书递交议会，要求议会采纳他们的要求基于全体成年男性平等的选举权。"
 dsk_belgium.70.f:0 "政治家们担心这会使工人政治力量膨胀并破坏原有的政治平衡。"
 dsk_belgium.70.a:0 "开始就扩大选举权进行讨论。"
 dsk_belgium.71.t:0 "基督教与工人运动"
 dsk_belgium.71.d:0 "教会的牧师被派到工人之中，他们正在工厂中对工人进行宣讲。"
 dsk_belgium.71.f:0 "天主教社团试图通过互助会和合作社吸引工人以维持教会的政治影响力，避免赤色分子如入无人之境。。"
 dsk_belgium.71.a:0 "鼓励宗教社团。"
 dsk_belgium.72.t:0 "总罢工的威胁"
 dsk_belgium.72.d:0 "工人领袖要求政府采用更人道的成套劳工保障法律，否则将要发动总罢工迫使政府接受他的提案。"
 dsk_belgium.72.f:0 "[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]通过自己的渠道向政府提议采取强硬手段，政府内的改革派则认为除接受以外的方案都会导致更严重的后果，现在决定权到了政府手里。"
 dsk_belgium.72.a:0 "只要丢给他们一根骨头，他们便会乖乖听话。"
 dsk_belgium.72.b:0 "尔要试试我宝剑是否锋利吗？"
 dsk_belgium.73.t:0 "签署劳动保障法"
 dsk_belgium.73.d:0 "议会通过集体投票，以微弱多数通过了实施新的劳工权利保障法案的决议。"
 dsk_belgium.73.f:0 "刊载了相关消息的报纸或告示被工人们争相传阅，虽然距法规生效的时间尚远，但他们已经急不可待地准备起来庆祝大游行。"
 dsk_belgium.73.a:0 "欢呼声直冲云霄。"
 dsk_belgium.74.t:0 "血色矿区"
 dsk_belgium.74.d:0 "大范围罢工的消息传来，看来这些矿坑里的老鼠妄图以这种方式逼迫政府就犯。"
 dsk_belgium.74.f:0 "“告诉他们想都别想！”一个军官向士兵们喊话道。就在一刻钟前，战争部的授权已经下达，当地军队被允许“便宜行事”，只要他们能以最快速度解决这场叛乱。"
 dsk_belgium.74.a:0 "成年人要为自己的行为承担后果，不是么？"
 dsk_belgium.75.t:0 "社会各界达成妥协"
 dsk_belgium.75.d:0 "通过改革、调解和许诺实现有限选举权，比利时暂时把劳资冲突锁在了议会政治的框架内。"
 dsk_belgium.75.f:0 "事情不会一帆风顺毫无波澜，但是至少争吵非限制在了被划定的范围内。"
 dsk_belgium.75.a:0 "让议会化解矛盾。"
 dsk_belgium.76.t:0 "莱茵河畔的战争"
 dsk_belgium.76.d:0 "[SCOPE.sCountry('dsk_bel_fra_scope').GetName]与[SCOPE.sCountry('dsk_bel_pru_scope').GetName]的战争已经威胁到了低地边境。"
 dsk_belgium.76.f:0 "他国的战争刺激着[SCOPE.GetRootScope.GetCountry.GetName]的神经，局部动员令已经下达，外交照会的请求已经发出，比利时的安全正经受考验。\n\n法德战争还未波及比利时，比利时却不得不严阵以待。#green 重申中立、局部动员和争取英国保障#!会帮助#green 应对普法危机#!；#red 秘密军事接触#!可能会为比利时取得收益和安全，却会冒着更大的风险危害比利时的中立地位。"
 dsk_belgium.76.a:0 "召开紧急内阁会议。"
 dsk_belgium.77.t:0 "来自法国的暗示"
 dsk_belgium.77.d:0 "在昨夜的舞会上，法国大使和我国外交部长进行了接触，他们试图通过这种方式影响我们的外交政策。"
 dsk_belgium.77.f:0 "“阁下，想必贵国已经知晓了敝国和邻国发生了一些小小的摩擦，所有的一切都没有超出我国的事先预期。只需静候时日我国陆军便会取得一场唾手可得的胜利，只是贵国不应毫无作为，只要比利时采取一些‘灵活’的政策，我国也会释放相应的善意。”\n\n#green 严守中立#!会让#green 法德战争中的中立可信度+0.5#!、#green 永久中立的可信性+0.5#!；#red 接受法国的示好#!能让改善与法国的关系，却不利于#red 法德战争中的中立可信度-1#!。"
 dsk_belgium.77.a:0 "想死别拉上我。"
 dsk_belgium.77.b:0 "给法国留一道后门，但不要留下证据。"
 dsk_belgium.78.t:0 "普鲁士的窥探"
 dsk_belgium.78.d:0 "有情报显示，[SCOPE.sCountry('dsk_bel_pru_scope').GetName]多次向我国派出间谍刺探我们国内的布防情况。"
 dsk_belgium.78.f:0 "容克军官团们通过军事间谍探查着[SCOPE.GetRootScope.GetCountry.GetName]的兵力分布和交通要道，以便制定一个打通比利时进取法国腹地的方案，若能实现，这会在战争初期为其迅速打开局面。"
 dsk_belgium.78.a:0 "大国有征讨之兵，小国有防御之策也。"
 dsk_belgium.79.t:0 "城市防御体系建设"
 dsk_belgium.79.d:0 "[SCOPE.gsInterestGroup('dsk_bel_armed_forces_scope').GetName]提交了防御工事的建造规划，他们要求政府尽快批复。"
 dsk_belgium.79.f:0 "在城市周边建设临时或半永久工事的区域都被圈出，为此需要制定一份对应的拆迁方案；为了使这些工事发挥作用，还需要大量补充机枪、火炮和兵员；整份方案所需的武器数量，动员人数、本身建设成本都已完成初步统计，这将帮助烈日武装到牙齿，德国入侵我们之前也会多掂量一下他们的分量。。"
 dsk_belgium.79.a:0 "“这得花不少钱。”“知道，另外再来一大批地雷。”"
 dsk_belgium.80.t:0 "舆论纷扰"
 dsk_belgium.80.d:0 "各个要员的晚宴上不断有他国政要旁敲侧击地试探比利时的立场，仿佛这比法德战争的战线位置更引人注目。"
 dsk_belgium.80.f:0 "法国、德国和英国记者都在紧盯着比利时政府的一言一行以便推测其立场，外交部则需要反复神明立场以免各国产生错误判断。\n\n发表声明不会产生立竿见影的效果，而是需要时间印证，但若此前已有秘密倾斜，强调中立反而是欲盖弥彰。"
 dsk_belgium.80.a:0 "重申中立原则。"
 dsk_belgium.81.t:0 "卢森堡问题再度浮现"
 dsk_belgium.81.d:0 "卢森堡的安全因近在咫尺的法德战争而岌岌可危，它的一举一动都吸引着三个邻国的目光。"
 dsk_belgium.81.f:0 "小国的命运总是需要在邻国之间走钢丝以求得一丝喘息之机。对比利时来说，这既是扩大影响的机会，抑或是一个烫手山芋。"
 dsk_belgium.81.a:0 "保持谨慎接触，万勿越界。"
 dsk_belgium.82.t:0 "英国保障比利时中立地位"
 dsk_belgium.82.d:0 "[SCOPE.sCountry('dsk_bel_gbr_scope').GetName]援引《伦敦条约》的内容，重申对比利时作为独立国家和其永久中立国地位的保障承诺。"
 dsk_belgium.82.f:0 "英国声称：既然其保证了比利时的独立和永久中立，那么当比利时的中立收到破坏时，其有义务采取行动维护条约。虽然我们对未来仍抱有疑虑，但这已经是目前最乐观的消息了。"
 dsk_belgium.82.a:0 "至少我们还有可以指望的盟友。"
 dsk_belgium.83.t:0 "代价高昂的动员"
 dsk_belgium.83.d:0 "动员令已经下发，战争部正从各行各业中抽调人手，在经过一段时间的紧急训练后，他们将会被塞入以常备军为骨干的部队中，到那时，比利时的兵员数量将不再捉襟见肘。"
 dsk_belgium.83.f:0 "动员令改变着民众的生活，平民们抱怨征兵破坏了他们原有的生活，工厂主们抗议人手不足无法维持生产以及军事物资优先输送阻碍了他们运输自己的产品，军方则对此乐见其成。\n\n 是否继续维持动员水平成了新的问题，若继续以原有强度推行动员，会增加各项支出；降低动员强度则难以保证比利时可以安然无恙。"
 dsk_belgium.83.a:0 "维持原有水平。"
 dsk_belgium.83.b:0 "降低动员强度。"
 dsk_belgium.84.t:0 "法德战争结束"
 dsk_belgium.84.d:0 "法国国防政府已向普鲁士投降，这场葬送了一个帝国又缔造了一个帝国的战争终于结束，只是它与事前大多数人所预料的过程和结果相去甚远。"
 dsk_belgium.84.f:0 "法国外长法夫尔与德国宰相俾斯麦敲定了和平条款以换取德国放松对巴黎的封锁，此前辞职的总统特罗胥在凡尔赛签署了投降书。虽然内政部长甘必大仍拒绝率波尔多的军队投降，但他的下台不过是时间问题。\n\n这场战争留给比利时的是一笔宝贵财富，无论是在军事、政治抑或外交领域。"
 dsk_belgium.84.a:0 "总结这一系列事件。"
 dsk_belgium.85.t:0 "比利时的中立经受住了考验"
 dsk_belgium.85.d:0 "在整场法德战争中，比利时未向任何一方倾斜，虽然有些提心吊胆，但所幸国土并未遭到其中任一国家的侵犯。"
 dsk_belgium.85.f:0 "[SCOPE.GetRootScope.GetCountry.GetName]守住了国家安全和外交信誉，在之后与各国的外交中，想必他们能更多地考虑到“比利时是永久中立国”这一前提。"
 dsk_belgium.85.a:0 "中立地位生效，并且长期有效。"
 dsk_belgium.86.t:0 "对刚果的统计报告"
 dsk_belgium.86.d:0 "殖民刚果的收益统计与该过程中产生的层出不穷的丑闻一齐被议员们评估，我们不能对某些事态的发展听之任之。"
 dsk_belgium.86.f:0 "[SCOPE.sCharacter('dsk_bel_leopold_ii_scope').GetFullName]此前以文明传播、人道主义及不向各国在当地商贸活动征收关税的名义游说各国，换取各国支持他在刚果的领土索求，这虽然是国王的私人领地，但并非他一人之事。如果我们出尔反尔，不仅不利于对刚果的管理，还极有可能招致列强的恶感。"
 dsk_belgium.86.a:0 "成立刚果改革协会，启动对刚果自由邦人权状况的调查程序。"
 dsk_belgium.86.b:0 "优先保证王室优先。"
 dsk_belgium.87.t:0 "传教士证词"
 dsk_belgium.87.d:0 "传教士、商人和前当地官员向调查委员会提交了他们的证据并发表了证词，比利时公众第一次系统看到对刚果统治的另一面。"
 dsk_belgium.87.f:0 "刚果问题不再是只是当地的事，接受相关人士的指控会促使对刚果管理体制的改革。"
 dsk_belgium.87.a:0 "记录各项证据。"
 dsk_belgium.88.t:0 "调查委员会要求取证"
 dsk_belgium.88.d:0 "刚果改革协会知会政府，要求调阅王室公司、特许商社和当地政府的文件，这引起了保守派的强烈抵触。"
 dsk_belgium.88.f:0 "这不是一个简单的请求，若真接受其要求并采取行动，事态会往扩大化的方向发展。"
 dsk_belgium.88.a:0 "接受要求，扩大委员会的调查权。"
 dsk_belgium.88.b:0 "我们的手段不干净，那又何必公之于众？"
 dsk_belgium.89.t:0 "外部的压力"
 dsk_belgium.89.d:0 "他国政府和欧洲的报刊共同对我们施压着压力，要求比利时接手刚果，阻止国王主导下对刚果自由邦的暴政。"
 dsk_belgium.89.f:0 "各国政府指责国王违背了一开始承诺的不向商贸活动征收关税的承诺，报纸的撰稿人则声称国王违反了最初宣传的人道主义原则，按照1885年签署的《柏林法案》，只有在其“关心改善刚果人的道德和物质条件，并帮助镇压奴隶制”时，他才可继续控制刚果。"
 dsk_belgium.89.a:0 "必须推行改革。"
 dsk_belgium.90.t:0 "商社代表提出交涉"
 dsk_belgium.90.d:0 "商社代表们称政府将要实施的是一套欠考量的行为，但现在停止仍为时不晚，否则这势必会摧毁刚果目前稳定的收益，另外他们还暗示政客们也曾从这套体系中获益，意图借此影响政府的决定。"
 dsk_belgium.90.f:0 "当自身利益将要受到损害，他们就会突然开始谈论起国家利益。\n\n但说到底，决定权还在政府手中，是强力改革还是见好就收？"
 dsk_belgium.90.a:0 "和光同尘是官场自古不变的法则。"
 dsk_belgium.90.b:0 "这次我们不会再按照金元行事，他们恣意妄为的时代过去了。"
 dsk_belgium.91.t:0 "国王与政府出现分歧"
 dsk_belgium.91.d:0 "国王利奥波德二世不愿交出自己的私人帝国以交由国家接管，但议员们已经意识到，继续放任自流会让整个比利时都遭受池鱼之殃。"
 dsk_belgium.91.f:0 "国王召见了内阁主席，他反复强调他对刚果的统治是得到各国谅解的，国家各界也都从中获利，现有的统治模式仍可继续延续，最多只需要一点小小的改良之类的种种论调。\n\n现在，轮到我们下判断，是相信国王会改善对刚果的治理模式，还是将权力收归政府并自行管理？"
dsk_belgium.91.a:0 "给国王陛下一点时间吧。"
 dsk_belgium.91.b:0 "肉食者鄙，未能远谋。"
 dsk_belgium.92.t:0 "谴责利奥波德二世"
 dsk_belgium.92.d:0 "利奥波德二世在刚果的残暴统治引发各界反感，我们国内的自由派人士要求政府进行适当干预。"
 dsk_belgium.92.f:0 "看来利奥波德把他事先允诺的要求都当做了一纸空文，我们是否要“提醒”一下他，让他明白自己理应承担的责任？"
 dsk_belgium.92.a:0 "对利奥波德严加谴责，敦促其回归正轨。"
 dsk_belgium.92.b:0 "为何要为了一群黑鬼伤了彼此和气？"
 dsk_belgium.93.t:0 "王室提出让步"
 dsk_belgium.93.d:0 "比利时国王通过国王内阁秘书长作为中间人，向政府传达了其同意就政府接管刚果自由邦的问题进行讨论的意向。"
 dsk_belgium.93.f:0 "现在的问题问题变成了比利时是否愿意吞并刚果，将其改造成自己的殖民地，代价是要付出不小的成本以建立统治体系。"
 dsk_belgium.93.a:0 "推动国家接管。"
 dsk_belgium.93.b:0 "继续让国王放手行事。"
 dsk_belgium.94.t:0 "比利时决定建立对刚果的统治"
 dsk_belgium.94.d:0 "议会通过了决议，刚果的领土主权将从比利时国王移交到比利时政府，政府将会承接对刚果的治理。"
 dsk_belgium.94.f:0 "过去几十年国王在刚果的统治给政府造成了太大压力，政府早已忍无可忍。虽然没有任何一个国家愿意承担在刚果的责任，但在经过了长期的争执、斡旋和协商后，政府还是通过了亲自接手的决议，虽然这要付出极高的代价，但在外交和国际舆论上的压力可谓是大大减轻了。"
 dsk_belgium.94.a:0 "该修正过去的错误了。"
 dsk_belgium.95.t:0 "在刚果建立新的行政体系"
 dsk_belgium.95.d:0 "比利时政府已经开始着手重组刚果的行政体系。"
 dsk_belgium.95.f:0 "在刚果原有的行政、军事、经济等部门将得到重新整编，这意味着大部分的相关人员将被清退，以便政府建立新的管理制度，原有的为人诟病的残忍行径将得到遏制，想必各国对比利时施加的压力也能得到缓解。"
 dsk_belgium.95.a:0 "这是一个好的开端。"
 dsk_belgium.96.t:0 "刚果事态升级"
 dsk_belgium.96.d:0 "国王的模糊态度使刚果问题久拖不决，在此期间刚果丑闻继续发酵，国际社会开始质疑比利时国王对刚果的统治合法性基础。"
 dsk_belgium.96.f:0 "拖延无法解决任何问题，它只会将一粒火星变成熊熊烈火，改革已经无法再拖延下去了。"
 dsk_belgium.96.a:0 "要求立即进行改革。"
 dsk_belgium.97.t:0 "改革的十字路口"
 dsk_belgium.97.d:0 "比利时已经接手了对刚果的主权，现在它将决定刚果下一步的方向。"
 dsk_belgium.97.f:0 "虽然国王对刚果的治理为人诟病，但不利的也主要是当地土著，不得不说其原有的经济收益还是可圈可点的，或许我们可以维持现状以利用旧有体制。"
 dsk_belgium.97.a:0 "切勿见小利而忘命，必须执行真正的改革。"
 dsk_belgium.97.b:0 "有谁不爱白花花的银子呢？。"
 dsk_belgium.98.t:0 "比属刚果"
 dsk_belgium.98.d:0 "比利时政府兼并了刚果自由邦，刚果自由邦作为一个政治实体已经不复存在，一个新的属于比利时的殖民地将被建立。"
 dsk_belgium.98.f:0 "过去留下了太多的烂摊子，希望政府接受后，这些问题能得到妥善处理。"
 dsk_belgium.98.a:0 "刚果问题终于尘埃落定。"
 dsk_belgium.99.t:0 "大萧条的浪潮持续影响比利时"
 dsk_belgium.99.d:0 "全球范围经济危机的第一轮浪潮已经过去，但经济大盘回弹乏力。而此前从未有过持续一整年的经济危机，因此人们普遍预计，这次危机最多也就是持续到第二年，之后一切都会好起来的。"
 dsk_belgium.99.f:0 "人们排起长长的队伍等待着领取救济金，职业介绍所门口人头攒动，挨饿和失业的人群为极端政治派系提供着温床，社会躁动不安，也许离爆发只差一颗小小的火星。"
 dsk_belgium.99.a:0 "当断不断反受其乱，立刻召开特别内阁会议。"
 dsk_belgium.99.b:0 "先用公共救济保证社会的基本稳定。"
 dsk_belgium.99.c:0 "接着奏乐，接着舞。"
 dsk_belgium.100.t:0 "右翼势力的攻讦"
 dsk_belgium.100.d:0 "宗教势力和民粹主义者们合流，他们的理念相互融合形成了新的团体，现在，他们开始攻击起政府在危机应对中的失当。"
 dsk_belgium.100.f:0 "右翼团体指责政府议会流程的低效和在危机危机中无所作为，他们试图向民众描绘一个不经议会程序的高效流程，并且声称这样可以快速结束危机。\n\n我们是该孤立他们的势力，还是给他们一些“帮助”，让这些右翼的疯子去抗击更危险的赤色分子？"
 dsk_belgium.100.a:0 "无聊，我要看到血流成河！"
 dsk_belgium.100.b:0 "还是不要让他们乱说乱动吧。"
 dsk_belgium.101.t:0 "左翼势力的要求"
 dsk_belgium.101.d:0 "广泛的失业和工资水平下跌把比利时的政治格局从橄榄球型拉扯成哑铃型，共产党等左翼派系的成员数目也在大幅上升，此刻，这些社会主义者已经占据了街道。"
 dsk_belgium.101.f:0 "他们的人向政府喊话，要求实施更多的公共工程、更广泛的救济并赋予[GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant]更强大的权利，企业主则告诫政府万万不可答应这种过分要求，否则他们只会得寸进尺，国家财政也难以为继。"
 dsk_belgium.101.a:0 "与左翼派系达成共识。"
 dsk_belgium.101.b:0 "下水道的老鼠也配招摇过市吗？"
 dsk_belgium.102.t:0 "执政联盟的去留"
 dsk_belgium.102.d:0 "[SCOPE.gsInterestGroup('dsk_bel_devout_scope').GetName]、[SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName]和[SCOPE.gsInterestGroup('dsk_bel_trade_unions_scope').GetName]组成的执政派系联盟仍在争执不休。经济、内政，诸多问题仍旧悬而不决。"
 dsk_belgium.102.f:0 "但他们只要还斗而不破，就说明他们还有着基本共识：基本秩序必须维持，政治大权绝不能落到极端分子手中。"
 dsk_belgium.102.a:0 "维持议会稳定。"
 dsk_belgium.103.t:0 "弗拉芒民族主义的新倾向"
 dsk_belgium.103.d:0 "近期弗拉芒民族运动内部出现了一种新的主张，他们试图采用更激进的方式实现弗拉芒人的优先地位，即采用地区自治自治方案。"
 dsk_belgium.103.f:0 "“既然我们心平气和的请求得不到允准，为什么不自己动手？号召所有人，实现弗拉芒自治就在现在，我们可以自己说了算。”当地政治家在街头向民众呼吁道。"
 dsk_belgium.103.a:0 "采纳当地要求，实施弗拉芒的地区自治。"
 dsk_belgium.103.b:0 "维持单一制，国家不容分裂。"
 dsk_belgium.104.t:0 "重新武装的疑虑"
 dsk_belgium.104.d:0 "[SCOPE.sCharacter('dsk_bel_armed_forces_leader_scope').GetFullName]提交了扩军方案，文件中规划了扩建要塞、扩大动员范围并更新武器配置。"
 dsk_belgium.104.f:0 "温和派议员认为这会让战后难得的平静局势再度升温，饱经战争摧残的国家经济也物理负担此类支出，而将军们声称这是为了保卫国家所必须采取的措施。"
 dsk_belgium.104.a:0 "重新进行武装，只有严防才能不遭贼惦记。"
 dsk_belgium.104.b:0 "继续依靠中立地位，国家不能被军队绑架。"
 dsk_belgium.105.t:0 "加强烈日要塞"
 dsk_belgium.105.d:0 "烈日要塞的现有部分被重新评估。工程师指出要塞在先前的战争中被摧毁的部分仍未得到完全修缮，况且以抵御旧式火炮为标准修建的防御工事放到现在，已经完全无法适应新的要求。"
 dsk_belgium.105.f:0 "军方强调，世界大战前，就是在和议会无休止的预算扯皮中，国防计划一拖再拖，大战爆发时我们才难以招架。我们确实不能再重蹈覆辙了。"
 dsk_belgium.105.a:0 "重修东部防线。"
 dsk_belgium.106.t:0 "玉音放送"
 dsk_belgium.106.d:0 "[SCOPE.sCharacter('dsk_bel_ruler_scope').GetFullName]的录音经由广播公司在预先设定的时段放出，通过各处的收音机，演说内容被传播到车站、学校、政府部门等各处，这是多数民众第一次听到国王的声音。"
 dsk_belgium.106.f:0 "言语能通过电波传遍各处，却不能保证扎根于民众内心。"
 dsk_belgium.106.a:0 "万望诸卿精诚团结、相忍为国、共弃前嫌。"
 dsk_belgium.106.b:0 "若阁下听不懂道理，我也略懂些拳脚。"
 dsk_belgium.107.t:0 "反共产主义阵线"
 dsk_belgium.107.d:0 "议会各党派的中右翼成员要求组建一个跨政党的政治联盟以抵御共产主义蔓延，并通过这种方式扼杀来自社会主义、罢工和外部威胁。"
 dsk_belgium.107.f:0 "“共产国际总是戴着平等和没有没有剥削的面具而做着反叛文明和共荣的勾当，现在他们又按耐不住了。诸位应当明白，只要是他们邪恶的命令飞往的地方，就会充斥着骨肉相残和战火肆虐。我们实在不希望这样的景象发生在我们国家的土地上。”"
 dsk_belgium.107.a:0 "建立跨政党联盟，阻止红祸的阴谋。"
 dsk_belgium.107.b:0 "不能有意识地鼓动政治极端化。"
 dsk_belgium.108.t:0 "最后的中立主义者"
 dsk_belgium.108.d:0 "欧洲的战争阴云聚集，各国正把自己推向一个火药桶。"
 dsk_belgium.108.f:0 "越是危急存亡之秋，越要明哲保身。"
 dsk_belgium.108.a:0 "重申中立原则，我们要在条约范围内行事。"
 dsk_belgium.109.t:0 "危机前夜"
 dsk_belgium.109.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]走到了命运的十字路口。议会仍在运转，但只有无休止的争吵，中立地位已经是一厢情愿，防御工事仍未齐全，左右翼的力量极速膨胀，阴云笼罩在比利时的头顶。"
 dsk_belgium.109.f:0 "国家目前没有崩溃，却已在火山之上。"
 dsk_belgium.109.a:0 "为什么要修改一个能够运行的系统呢？"
 dsk_belgium.109.b:0 "搅吧，搅吧，你们就搅吧！"
 dsk_belgium.110.t:0 "欧洲的十字路口"
 dsk_belgium.110.d:0 "1831年的独立并未使一切尘埃落定，在这之后的整个低地处于一种微妙的无协议状态，比利时从荷兰独立后迫切地需要与各列强建立外交关系，以便获得外交承认以组织荷兰有可能的发难。而作为一个新生国家，比利时的内部根基尚不牢固。"
 dsk_belgium.110.f:0 "内外的压力都积压在这个新生的王国身上，这一切都需要有人来担着。"
 dsk_belgium.110.a:0 "你也想当举重冠军？"
 dsk_belgium.111.t:0 "证券丑闻爆发"
 dsk_belgium.111.d:0 "一则关于[GetBuildingType('building_railway').GetName]公司和承包商私下交易的消息被扒出，引起了各大报纸转载，民众要求我们给个说法，现在政府的表态至关重要。"
 dsk_belgium.111.f:0 "根据该消息，[GetBuildingType('building_railway').GetName]公司董事秘密控制了一家工程承包商。随后，公司发行大额[GetBuildingType('building_railway').GetName]债券以募集资金，并以远高于市场价格的金额与该承包商达成工程合同。调查显示，部分线路的造价甚至达到邻国同类[GetBuildingType('building_railway').GetName]的两倍，而多名董事在此期间积累了巨额财富。"
 dsk_belgium.111.a:0 "哀家眼里见不得脏东西。"
 dsk_belgium.111.b:0 "都是捕风捉影、子虚乌有之事。"
 dsk_belgium.112.t:0 "建在[GetBuildingType('building_railway').GetName]上的国家"
 dsk_belgium.112.d:0 "[GetBuildingType('building_railway').GetName]改变了城市的节奏，人们的生活节奏不再依照简单的昼夜划分，而是因[GetBuildingType('building_railway').GetName]时刻表被拧上了精准的时间发条。"
 dsk_belgium.112.f:0 "比利时的[GetBuildingType('building_railway').GetName]密度已经位居世界前列，沿线的城镇、仓库、工人区如雨后春笋般出现。"
 dsk_belgium.112.a:0 "让火车头鸣响汽笛。"
 dsk_belgium.113.t:0 "女工与童工"
 dsk_belgium.113.d:0 "工厂里的女性和儿童待遇问题成了改革派的新子弹，他们呼吁各方关注工厂和矿井中的女工和童工生活状态，并称他们一日工作十几个小时也只能获得远低于他人的收入。"
 dsk_belgium.113.f:0 "雇主们称，他们给予的报酬和这些人所投入的劳动是对等的，毕竟最卖力气的活都交给成年男性劳工了。况且他们已经承担了额外的社会责任，因为接受这些人的工作，实际上是创造了一个家庭中在丈夫之外的额外收入源。"
 dsk_belgium.113.a:0 "这福气给你要不要啊？"
 dsk_belgium.113.b:0 "家庭的收入依赖这种雇佣。"
 dsk_belgium.114.t:0 "争夺工人支持"
 dsk_belgium.114.d:0 "社会主义者、议会自由派和福音会此时正在争相拉拢工人支持。"
 dsk_belgium.114.f:0 "工人阶级并非天生就与某个派系绑定，不管哪一派，总能找到自己与工人希冀的共通之处。"
 dsk_belgium.114.a:0 "现在，他们都成了工人阶层的同情者了。"
 dsk_belgium.115.t:0 "应急处理预案"
 dsk_belgium.115.d:0 "法德战争后，政府在集中整理危机期间的各个外交文件和战争部报告和每一份行政命令，希望通过这种方式总结一份可供参考的危机应对方案。"
 dsk_belgium.115.f:0 "我们不能在每次危机爆发后便手足无措，比利时应当拥有能妥善化解危机的能力。"
 dsk_belgium.115.a:0 "完善危机应对能力。"
 dsk_belgium.116.t:0 "战争部的请求"
 dsk_belgium.116.d:0 "战争部的作战参谋们表示，政府应签署行政命令，以便他们扩大化征兵，这将有助于强化比利时的防御能力。"
 dsk_belgium.116.f:0 "没有武装保卫的中立只是一纸空谈，在必要时，我们需要主动投身战争。"
 dsk_belgium.116.a:0 "扩大征兵范围。"
 dsk_belgium.117.t:0 "组建殖民班底"
 dsk_belgium.117.d:0 "比利时接管刚果后，政府开始在本土开始有计划地召集和培养一批行政官员、测绘师和医生，这些人都会被调去刚果。"
 dsk_belgium.117.f:0 "各界精英当然不是只能在本土才能发挥自己的才能，刚果殖民地方兴未艾，人员缺口极大，那里正需要这些人才。"
 dsk_belgium.117.a:0 "他们会派上作用。"
 dsk_belgium.118.t:0 "在刚果兴建[GetBuildingType('building_railway').GetName]"
 dsk_belgium.118.d:0 "当地殖民管理部门向母国发出请求，希望获得拨款以便在刚果修建[GetBuildingType('building_railway').GetName]。"
 dsk_belgium.118.f:0 "根据他们的规划草案，[GetBuildingType('building_railway').GetName]的起点将会设在马塔迪，也就是主要的海岸[GetBuildingType('building_port').GetName]城市；之后[GetBuildingType('building_railway').GetName]经过刚果首都利奥波德维尔，再穿过狭长的陆上走廊，进入广阔的刚果内地；再之后[GetBuildingType('building_railway').GetName]线便一分为二，一条转头向北，通向东方省的主要城市斯坦利维尔；另一条修往南方，连接两个主要的矿产城市：雅多维尔和伊丽莎白维尔。"
 dsk_belgium.118.a:0 "颇有前景的规划，准了。"
 dsk_belgium.119.t:0 "比利时参加万国博览会"
 dsk_belgium.119.d:0 "比利时出席了此次世界博览会，其提交展出的展品数目达到了其历届之最。"
 dsk_belgium.119.f:0 "因为比利时参与展出的展品数目较多，主办方为其单独设立了一个大型展厅专门陈列。此展厅中的展品着力于表现比利时过去十年来的整体发展，各种最先进的工业产品和著名艺术家的大作竞相展出。甚至为了表现比利时在刚果的治理成果，少数刚果特产也被摆进展厅。"
 dsk_belgium.119.a:0 "把比利时最好的一面展示给全世界。"
 dsk_belgium.120.t:0 "语言普查"
 dsk_belgium.120.d:0 "最新的全国各语言使用状况统计报告已经出炉，这份统计结果再次揭示了国内深刻的民族问题。"
 dsk_belgium.120.f:0 "弗拉芒语人口的规模占比与其国内地位严重不匹配。弗拉芒语人口拥有着略微过半的绝对多数，但国家不把其认作官方语言，在各类正式场合都使用单一的法语。换句话说，比利时是一个以瓦隆尼亚人为主的、少数人统治多数人的国家。"
 dsk_belgium.120.a:0 "以这份统计报告为底气，推动官方语言改革。"
 dsk_belgium.120.b:0 "统计结果可以有多种解读方式。"
 dsk_belgium.121.t:0 "国王参与调停"
 dsk_belgium.121.d:0 "王室派出代表，就最近发生的民族冲突展开问询，并且在双方民意代表之间充当中间调解人。"
 dsk_belgium.121.f:0 "国王经由王室代表表示对双方的理解，并呼吁双方和平交涉，另外他将会以国王身份，要求议会妥善解决问题。"
 dsk_belgium.121.a:0 "以王室权威促成妥协。"
 dsk_belgium.122.t:0 "沉默的军营"
 dsk_belgium.122.d:0 "在军队实行弗拉芒语改革的请求被驳回后，弗拉芒士兵的不满继续在营房中积累。"
 dsk_belgium.122.f:0 "可以强令士兵服从，但是怨恨和矛盾暗中滋长。"
 dsk_belgium.122.a:0 "军人首重服从，军令何等森严。"
 dsk_belgium.123.t:0 "极端右翼人士举行集会"
 dsk_belgium.123.d:0 "一群极端的天主教价值观拥护者举行了一场大型集会。据初步调查，他们的骨干均来自于一个叫作“基督君王”（Christus Rex）的天主教书籍出版社，领头的是一个叫莱昂·德格雷勒的宗教狂热分子。"
 dsk_belgium.123.f:0 "会上，莱昂·德格雷勒多次宣扬天主教宗教价值观、民族主义。威权主义和法团主义思想，并且大肆抨击议会体制、银行家和左翼分子，他声称这些人是社会的蛀虫、当今一切国家困境的根源。\n\n支持他的欢呼声简直要掀翻演说厅的屋顶，我们多少也该正视他们的影响力。"
 dsk_belgium.123.a:0 "监视这些雷克斯主义者的集会。"
 dsk_belgium.124.t:0 "动荡中的选举"
 dsk_belgium.124.d:0 "这次选举成了各方势力角逐的战场，选民投票率创下了历史纪录，人们迫切地想通过自己的选票改变政府，进而使国家走出衰退。"
 dsk_belgium.124.f:0 "极端分子一左一右，撕扯着国家政治格局。而选票箱像一面镜子，无论是否乐意，它都反映着这个国家的实况。"
 dsk_belgium.124.a:0 "让永恒的历史法庭做出审判。"
 dsk_belgium.125.t:0 "最后的整备"
 dsk_belgium.125.d:0 "军方提叫最后一轮战前准备计划：将紧急生产的重武器运入堡垒，继续补充轻武器并加紧对动员兵的训练。"
 dsk_belgium.125.f:0 "通过这些措施，我们能将堡垒预留的炮位和各陆军师实际满编率填补到80%以上。"
 dsk_belgium.125.a:0 "监督计划执行，我们拖不起了。"
 dsk_belgium.126.t:0 "比利时的命运"
 dsk_belgium.126.d:0 "从革命中出现的的新生王国到结束旧秩序的终点，比利时在外交、民族、内部势力等各方面寻求着平衡，虽然裂痕曾经快要威胁整个国家，但好在一切都应对得当。"
 dsk_belgium.126.f:0 "有些国家的历史以军队和征服为主干，而我们的历史建立在反抗，和解与携手共进之上。"
 dsk_belgium.126.a:0 "这艘小船穿过了风暴。"
 dsk_belgium.127.t:0 "国家运作的三驾马车"
 dsk_belgium.127.d:0 "王宫、议会和外交部现在是[SCOPE.GetRootScope.GetCountry.GetName]的三大中心：王宫干系着国王，这象征着比利时王国的国体根基；议会主导了国家的日常运作，此时[SCOPE.gsInterestGroup('dsk_bel_devout_scope').GetName]与[SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName]正共同敦促政府尽快让已经通过投票表决的议案生效；外交部则同时带来了两则消息：其一是英国向我们释放的外交善意，其二是他们拟定的与荷兰进行接触的程序。"
 dsk_belgium.127.f:0 "比利时如同海岸边的一块礁石，只是偶尔露出水面，它不如奇山怪石般奇异夺目或是登峰造极，但总能在海浪冲击下岿然不动。"
 dsk_belgium.127.a:0 "让教会与自由派协力同心。"
 dsk_belgium.127.b:0 "国家要靠武装和外交保卫。"
 dsk_belgium.127.c:0 "再次尝试低地统合。"
 dsk_belgium.128.t:0 "政府的破产清算"
 dsk_belgium.128.d:0 "失败没有伴随着一声巨响产生，而是以政府失能为表现。现在国家已经站在了悬崖边上，但好在还有再度作出选择的机会"
 dsk_belgium.128.f:0 "过去长久积累的矛盾已经集中爆发。"
 dsk_belgium.128.a:0 "先处理工人的暴动。"
 dsk_belgium.128.b:0 "一空输，出动！"
 dsk_belgium.128.c:0 "通过外交手段向海牙与伦敦寻求退路。"
 dsk_belgium.129.t:0 "刚果自由邦初见成效"
 dsk_belgium.129.d:0 "[SCOPE.sCharacter('dsk_bel_ruler_scope').GetFullName]的殖民事业取得了初步成效，现在，他将决定刚果的下一步方向。"
 dsk_belgium.129.f:0 "国王正站在分岔口前，是接受国内势力参与刚果的监管，以确保刚果的问题不要太出格；抑或是继续紧握大权，不顾丑闻的蔓延，继续以利益为先？"
 dsk_belgium.129.a:0 "我的还是我的。"
 dsk_belgium.129.b:0 "让议会与传教士参与监督。"
 dsk_belgium.130.t:0 "刚果自由邦的命运"
 dsk_belgium.130.d:0 "刚果丑闻愈演愈烈已经导致了对王室的信任危机。[SCOPE.gsInterestGroup('dsk_bel_intelligentsia_scope').GetName]要求对刚果实情公开调查，[SCOPE.gsInterestGroup('dsk_bel_industrialists_scope').GetName]则坚决反对，称这样的决定会摧毁已经每况愈下的经济收益和区域稳定。"
 dsk_belgium.130.f:0 "究竟是使用雷霆手段解决问题，还是对此继续放任自流，又或是暂时稳住其他国家？"
 dsk_belgium.130.a:0 "公开调查，牺牲王室体面。"
 dsk_belgium.130.b:0 "保住收益，先稳住财政。"
 dsk_belgium.130.c:0 "向伦敦递交一份漂亮报告。"
 dsk_belgium.131.t:0 "三方政治下的比利时"
 dsk_belgium.131.d:0 "天主教温和派、自由派改革者和[GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant]代表都要求在他们关心的问题上达成他们想要的结果。"
 dsk_belgium.131.f:0 "我们不可能做到面面俱到，但是可以优先确保某一方面的妥帖。"
 dsk_belgium.131.b:0 "争取[GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant]支持。"
 dsk_belgium.131.c:0 "确保民族和解。"
 dsk_belgium.132.t:0 "议会失能后的街头"
 dsk_belgium.132.d:0 "当常规的手段无法解决问题，人们就会寻求其他方式。民粹主义者将问题归结于腐败和左翼势力；军方要求立即戒严；工人则以罢工相要挟。"
 dsk_belgium.132.f:0 "比利时再一次面对关键抉择。"
 dsk_belgium.132.a:0 "容忍民粹主义继续扩张。"
 dsk_belgium.132.b:0 "让军队立即行动。"
 dsk_belgium.132.c:0 "向工人让步。"
 dsk_belgium.133.t:0 "着手革除积弊"
 dsk_belgium.133.d:0 "虽说任何事务都不可能一帆风顺，但过去积累的错误还是太多。现在我们应当立刻拿定主意，决定下一步的改革方向。"
 dsk_belgium.133.f:0 "国内稳定、外交稳固和改革刚果三种方案一同被推上案头。"
 dsk_belgium.133.a:0 "先保证国内稳定。"
 dsk_belgium.133.b:0 "先修复与英国的关系与国际信誉。"
 dsk_belgium.133.c:0 "先理清刚果的烂账。"
 dsk_belgium.134.t:0 "失败不断积累"
 dsk_belgium.134.d:0 "对过去错误的弥补仍然不见成效，矛盾不仅没有得到化解，反而在时间的累计下不断加深。"
 dsk_belgium.134.f:0 "虽然政府合法性接近破产，但我们仍有放手一搏的机会。是承认自己的无能，还是派出军队断乎弹压？"
 dsk_belgium.134.a:0 "累了，毁灭吧，赶紧的。"
 dsk_belgium.134.b:0 "司马公养你何用？"
 dsk_belgium.135.t:0 "宪法修正案"
 dsk_belgium.135.d:0 "过去对积弊的改革已经初见成效，议会授权了组建一个临时委员会负责修订宪法，以便将此前的成果落实到制度层面。"
 dsk_belgium.135.f:0 "妥协不是漂亮的旗帜，而是一张被反复涂抹的绘卷。"
 dsk_belgium.135.a:0 "确保初步成果。"
 dsk_belgium.136.t:0 "确立武装化方针"
 dsk_belgium.136.d:0 "新的年度军费调拨案、武器生产计划、强化兵员训练和工事修筑提案获得整体通过，我们现在可以着力于实现进一步武装了。"
 dsk_belgium.136.f:0 "对于那些打起我们主意的国家，应当让他们看到我们的獠牙。"
 dsk_belgium.136.a:0 "武装是我们中立的依仗。"
 dsk_belgium.137.t:0 "海牙的回函"
 dsk_belgium.137.d:0 "荷兰拒绝了立即开始组建低地联邦的提议，但还是接受了其中的多项次要建议，比如双方承诺互相减免关税，连通运输线，实现技术交流等。"
 dsk_belgium.137.f:0 "虽然未能达成最终目标，但这为我们提供了多个窗口和继续畅想的空间。"
 dsk_belgium.137.a:0 "低地统合依旧保留着可能。"
 dsk_belgium.138.t:0 "财政报告"
 dsk_belgium.138.d:0 "海外领地、国内运输业、工业等各行业的收益情况在此次财政报告中得到了体现，各领域成果喜人。"
 dsk_belgium.138.f:0 "这说明我们的经营方针相当正确，只需延续这种势头便可高枕无忧。"
 dsk_belgium.138.a:0 "收益继续流向比利时。"
 dsk_belgium.139.t:0 "传教士证词公开"
 dsk_belgium.139.d:0 "[SCOPE.sCharacter('dsk_bel_devout_leader_scope').GetFullName]主张传教士证词公之于众，这使得王室和特许公司相当不满，但这让国际舆论第一次看到比利时对改变刚果现状的决心。"
 dsk_belgium.139.f:0 "证词不能立刻使判决下达，但能影响法官的判断。"
 dsk_belgium.139.a:0 "公布这份证词。"
 dsk_belgium.140.t:0 "公开调查刚果事务"
 dsk_belgium.140.d:0 "刚果改革委员会传唤了当地行政官员、公司代表与传教士。报纸每天都在跟进对刚果人权状况的报道。"
 dsk_belgium.140.f:0 "调查到他们头上时，他们便说自己事先不知情或只是听命行事。"
 dsk_belgium.140.a:0 "继续扩大调查面。"
 dsk_belgium.141.t:0 "商社的抗议"
 dsk_belgium.141.d:0 "刚果的特许公司抗议对当地的改革，声称这种行为是在侵犯他们的合法权益。"
 dsk_belgium.141.f:0 "多少龃龉假借公正之名。"
 dsk_belgium.141.a:0 "让他们继续经营。"
 dsk_belgium.142.t:0 "伦敦急电"
 dsk_belgium.142.d:0 "[SCOPE.sCountry('dsk_bel_gbr_scope').GetName]驻我国大使向我们递交了母国公文：比利时若继续对刚果现状置之不理，那么他所作出的其他国际承诺的可信度都将受到质疑。"
 dsk_belgium.142.f:0 "这份文本内潜藏着明确的威胁。"
 dsk_belgium.142.a:0 "我们必须认真对待他们的关切。"
 dsk_belgium.143.t:0 "妥协法案通过"
 dsk_belgium.143.d:0 "天主教党人、自由派政治家与温和派工人代表共同以多数赞同通过了新的法案。"
 dsk_belgium.143.f:0 "这份法案的本职并非解决某项具体问题，而是建立完善一种新的协商机制以辅助议会运作。"
 dsk_belgium.143.a:0 "诸位，继续工作吧。"
 dsk_belgium.144.t:0 "瓦隆的政治鼓动"
 dsk_belgium.144.d:0 "[SCOPE.sCharacter('dsk_bel_trade_unions_leader_scope').GetFullName]无法再压制矿区不满。工人委员会和站在劳工一边工报纸同时动员，瓦隆再次发出呼号。"
 dsk_belgium.144.f:0 "这场运动反响寥寥，未能掀起更大浪花。"
 dsk_belgium.144.a:0 "工人会记住这次失败。"
 dsk_belgium.145.t:0 "军队出动"
 dsk_belgium.145.d:0 "[SCOPE.sCharacter('dsk_bel_armed_forces_leader_scope').GetFullName]派出军队实施严格戒严，他声明军队只是出于维稳的考量。但政府知道这句话的另一面：当制度需要军队维持，制度本身就已经岌岌可危。"
 dsk_belgium.145.f:0 "军靴可以踏平街道，却不能替国家恢复信任。"
 dsk_belgium.145.a:0 "秩序有了，代价也有了。"
 dsk_belgium.146.t:0 "国家崩溃的回响"
 dsk_belgium.146.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]的失败开始交织：内政、外交、殖民、民族各个领域的失败如同多米诺骨牌般倒下。荷兰、英国甚至比利时自己都在考量着这个小国还能否继续作为一个国家存在。"
 dsk_belgium.146.f:0 "国家也许不会因失败而直接灭亡，但会因此背上更沉重的负担。"
 dsk_belgium.146.a:0 "失败之间也产生了共鸣。"
 dsk_belgium.147.t:0 "册立利奥波德王子"
 dsk_belgium.147.d:0 "王室宣布年幼的利奥波德王子成为选定继承人。对一个仍在学习如何作为国家存在的王国而言，王储不只是一个政治身份，也是国家体制的稳定剂。"
 dsk_belgium.147.f:0 "看来国家向稳定又迈出了一步。"
 dsk_belgium.147.a:0 "恭贺这位王储。"
 dsk_belgium.148.t:0 "利奥波德一世之死"
 dsk_belgium.148.d:0 "开国国王利奥波德一世驾崩，国家为其举行国葬仪式。这位王国的第一代统治者创造了一个新生的国家，如今领导这个国家的权力必须从建国者手中转入下一代。"
 dsk_belgium.148.f:0 "国家因激进革命而生，因平稳过渡而延续。"
 dsk_belgium.148.a:0 "利奥波德二世将承继大统。"
 dsk_belgium.149.t:0 "利奥波德二世的登基大典"
 dsk_belgium.149.d:0 "布鲁塞尔的钟声、议员们的注目与仪仗队的阵列共同宣告新君即位。新任国王向宪法文件宣誓，此时他的身份正式生效，他将被称作利奥波德二世。"
 dsk_belgium.149.f:0 "国王继承的不仅是王冠，还有先王所有未竟的事业。。"
 dsk_belgium.149.a:0 "愿新王继续引领国家。"
 dsk_belgium.150.t:0 "王储夭折"
 dsk_belgium.150.d:0 "王宫中传来了不幸的消息，布拉班特公爵利奥波德王子已经夭折。 dsk_belgium.150.f:0 "王宫中的哀悼显露着国家制度的危机，王储空悬，王室必须另寻一位继承人以延续统治。"
 dsk_belgium.150.a:0 "寻找新的继承人。"
 dsk_belgium.151.t:0 "将菲利普伯爵进入候选名单"
 dsk_belgium.151.d:0 "利奥波德王子的兄弟菲利普伯爵被列为潜在继承者。"
 dsk_belgium.151.f:0 "王室希望这个安排稳定国内外的舆论，让他们明白比利时继承制的韧性。"
 dsk_belgium.151.a:0 "将菲利普王子列为储君。"
 dsk_belgium.152.t:0 "选定博杜安王子"
 dsk_belgium.152.d:0 "利奥波德二世唯一的儿子利奥波德王子因肺炎早逝，佛兰德伯爵菲利普的儿子博杜安的出生被视为王朝未来的希望。"
 dsk_belgium.152.f:0 "册立博杜安王子为王储，他将延续王室血脉。"
 dsk_belgium.152.a:0 "王室未来仍有人继承。"
 dsk_belgium.153.t:0 "佛兰德伯爵菲利普之死"
 dsk_belgium.153.d:0 "佛兰德伯爵菲利普于今日逝世。王室的老一辈人物纷纷离场，佛兰德伯爵阿尔贝的地位变得更加牢固，王位将由更年轻的一代继承。"
 dsk_belgium.153.f:0 "佛兰德伯爵阿尔贝已经是仅剩的选择。"
 dsk_belgium.153.a:0 "继承顺序继续向前推。"
 dsk_belgium.154.t:0 "佛兰德伯爵阿尔贝成为王储"
 dsk_belgium.154.d:0 "国王册立阿尔贝为比利时王储，经历了前几个继承人的离世，他成了继承王位最后的选项。"
 dsk_belgium.154.f:0 "有些王储不是被欢呼声推上前台，而是基于被一连串葬礼和制度需要。"
 dsk_belgium.154.a:0 "册立佛兰德伯爵阿尔贝。"
 dsk_belgium.155.t:0 "利奥波德二世之死"
 dsk_belgium.155.d:0 "利奥波德二世于今日逝世。这位广受争议，近几十年来不断被抨击为暴君的国王，结束了他的统治生涯。"
 dsk_belgium.155.f:0 "各种各样的问题并未因他的离去而消失，比利时需要重整旗鼓。"
 dsk_belgium.155.a:0 "让阿尔贝王储接任。"
 dsk_belgium.156.t:0 "阿尔贝一世登基"
 dsk_belgium.156.d:0 "阿尔贝伯爵在繁冗的流程后，正式宣布即位比利时国王，称阿尔贝一世。"
 dsk_belgium.156.f:0 "阿尔贝国王接手的不是一个平稳航行的巨舰，他所面临的问题和以往大不相同，他需要在劳资、民族、军备和战争疑云间不断转圜，进而为比利时规避风险。"
 dsk_belgium.156.a:0 "愿国王引领比利时。"
 dsk_belgium.157.t:0 "利奥波德王子成为王储"
 dsk_belgium.157.d:0 "阿尔贝一世之子利奥波德成为他的政治继承人。"
 dsk_belgium.157.f:0 "这位王子面临着战后复兴的经济危机的困局。"
 dsk_belgium.157.a:0 "册立利奥波德王子。"
 dsk_belgium.158.t:0 "阿尔贝一世驾崩"
 dsk_belgium.158.d:0 "阿尔贝一世驾崩，讣告传遍全国。作为大战中的国王，他的形象已经和抵抗、牺牲与国家团结绑定在一起。"
 dsk_belgium.158.f:0 "阿尔贝国王的离去令民众悲痛，这位国王不屈的身影再过去持续激励着他的国民。"
 dsk_belgium.158.a:0 "是时候安排新王即位了。"
 dsk_belgium.159.t:0 "利奥波德三世即位"
 dsk_belgium.159.d:0 "利奥波德王子继承了阿尔贝国王的冠冕，此外他接手的是一个经历创伤、不屈又动荡的比利时。"
 dsk_belgium.159.f:0 "比利时在三十年代的危局中又将何去何从？"
 dsk_belgium.159.a:0 "愿王国经受住新时代的考验。"


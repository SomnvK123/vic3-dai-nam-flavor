# ============================== DSK 比利时：其他文本 ==============================

 je_dsk_bel_independence_lobby:0 "[SCOPE.GetRootScope.GetCountry.GetName]作为政治实体的存在已经在宪法的公布和国王的宣誓中得到确立，但比利时王国的存在于欧洲外交体系中还没有得到普遍承认。[SCOPE.sCountry('dsk_bel_net_scope').GetName]仍将1830年的分离视为一场未能平定的叛乱，[SCOPE.sCountry('dsk_bel_gbr_scope').GetName]需要一个可信的低地缓冲国，而[SCOPE.sCountry('dsk_bel_fra_scope').GetName]与[SCOPE.sCountry('dsk_bel_pru_scope').GetName]都在衡量这个新王国是否会改变外交格局。"
je_dsk_bel_neutrality_lobby:0 "永久中立不是将军队解除武装，也不是锁上外交部的大门。它是一套需要一以贯之的国家战略：领土主张、兵员武备、外交保障、防御工事和对[concept_infamy]的克制共同决定[SCOPE.GetRootScope.GetCountry.GetName]是否仍被欧洲视为可信的中立国。"
je_dsk_bel_workshop_of_europe_lobby:0 "小国没有战略纵深，但可以拥有工业规模。瓦隆采矿业、烈日军工业、布鲁塞尔金融业与安特卫普航运业并非彼此孤立，只待政治推动使之有机结合。
je_dsk_bel_school_war_lobby:0 "比利时社会最根深蒂固的裂痕之一，就在课堂之上。[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]将天主教学校视作稳固乡村社会与信仰秩序的根本，[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]则认为国民学校塑造现代公民。"
je_dsk_bel_flemish_movement_lobby:0 "一个国家可以拥有两种民族，但不能只有一者拥有尊严。#yellow 佛兰德#!的法院、学校、军人和行政官僚会持续向布鲁塞尔施压，尤其当教育问题已经将社会裂痕大白于天下，或民族和解已经进入改革日程时。"
je_dsk_bel_congo_free_state_lobby:0 "#bold 刚果不是普通殖民地，而是一个由比利时国王、商社、探险家和国际政治博弈下共同促成的特殊产物。#!"
je_dsk_bel_lowlands_question_lobby:0 "#bold 1830年的分离使比利时走向了独立，却没有指明低地的未来。#!"
je_dsk_bel_great_war_lobby:0 "#bold 条约通过外务会议生效，但要在炮火中被证明。#!"
je_dsk_bel_postwar_belgium_lobby:0 "#bold 战争结束后，比利时赢得了同情，却没有重归安宁。#!"
je_dsk_bel_railways_and_finance_lobby:0 "[SCOPE.GetRootScope.GetCountry.GetName]的倚仗不是来自于广袤的领土，而是靠发达的金融、航运和工矿业，这些产业必须通过经贸往来而相互联系。"
je_dsk_bel_labor_question_lobby:0 "工厂的烟囱越高，工厂之中的声音就越难被忽视。矿工、[GetBuildingType('building_port').GetName]工人、天主教互助会、社会主义派系的报纸和工厂主都要求国家表明立场，但这个议题只有在工业社会初步建成之后才会被提到议院之中。"
je_dsk_bel_franco_prussian_crisis_lobby:0 "当伦敦条约失效、低地冲突加剧、法国态度恶化和德国施压时，比利时的存亡便是迫在眉睫。"
je_dsk_bel_national_question_lobby:0 "#bold 比利时所需的不是扩张，而是证明一个夹在强权之间的小国能否成为持久存在的国家。#!"
je_dsk_bel_congo_reform_lobby:0 "#bold 刚果自由邦已经不再是国王一家之事。#!
je_dsk_bel_belgian_extremes_lobby:0 "大萧条、雷克斯主义、社会主义的蔓延、民族自治和对重新武装的争论同时压向比利时。"
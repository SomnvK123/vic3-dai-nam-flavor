 dsk_bel_language_settlement_modifier:0 "民族和解"
 dsk_bel_language_settlement_modifier_desc:0 "弗拉芒与瓦隆民族问题暂时进入制度化解决阶段。"
 dsk_bel_flemish_suppression_modifier:0 "压制弗拉芒民族运动"
 dsk_bel_flemish_suppression_modifier_desc:0 "国家权威得以维持，但民族矛盾更加深刻。"
 dsk_bel_congo_free_state_modifier:0 "刚果自由邦"
 dsk_bel_congo_free_state_modifier_desc:0 "刚果给王国带来财富，也带来暗藏着的危机。"
 dsk_bel_congo_scandal_modifier:0 "刚果丑闻爆发"
 dsk_bel_congo_scandal_modifier_desc:0 "国际社会开始质疑利奥波德二世在刚果的统治。"
 dsk_bel_lowlands_federation_modifier:0 "低地联邦的构想"
 dsk_bel_lowlands_federation_modifier_desc:0 "比利时开始以整个低地为范畴构思国家未来。"
 dsk_bel_fortress_neutrality_modifier:0 "武装化中立国"
 dsk_bel_fortress_neutrality_modifier_desc:0 "工事、常备军和外交保证共同守护比利时。"
 dsk_bel_strict_neutrality_modifier:0 "恪守中立"
 dsk_bel_strict_neutrality_modifier_desc:0 "比利时以外交灵活性为代价换取置身事外。"
 dsk_bel_secret_staff_contacts_modifier:0 "秘密军事接触"
 dsk_bel_secret_staff_contacts_modifier_desc:0 "比利时已经派出了军官团以便和他国达成技术交流和军事合作。"
 dsk_bel_yser_resistance_modifier:0 "伊瑟河防御"
 dsk_bel_yser_resistance_modifier_desc:0 "比利时军队正依托河流与洪水区保住最后的国土。"
 dsk_bel_postwar_compromise_modifier:0 "战后的稳定"
 dsk_bel_postwar_compromise_modifier_desc:0 "普选制、劳工保障和民族和解暂时压住了政治极端化的倾向。"
 dsk_bel_finance_house_modifier:0 "发达的布鲁塞尔金融业"
 dsk_bel_finance_house_modifier_desc:0 "公司、银行、证券交易所和交通网在布鲁塞尔形成了发达的金融脉络。"
 dsk_bel_audited_financiers_modifier:0 "对银行家开展审计"
 dsk_bel_audited_financiers_modifier_desc:0 "议会调取了承包商与银行家的账目进行审计，这有助于恢复公众信心，代价是资本扩张被迫放缓。"
 dsk_bel_mine_inspection_modifier:0 "设立矿井监管制度"
 dsk_bel_mine_inspection_modifier_desc:0 "监管员进驻了矿区，这将有效保障生产安全和工人待遇。"
 dsk_bel_labor_reform_modifier:0 "落实劳工保障"
 dsk_bel_labor_reform_modifier_desc:0 "被严格限制的工时、矿井安全监督和法律调解改善了工人的生存状况。"
 dsk_bel_mobilization_cost_modifier:0 "强化武装中立"
 dsk_bel_mobilization_cost_modifier_desc:0 "比利时通过扩大动员以确保武装中立。"
 dsk_bel_congo_reform_modifier:0 "在刚果推行改革"
 dsk_bel_congo_reform_modifier_desc:0 "刚果的行政基础逐步转为由母国监管，这有助于缓和国际舆论压力。"
 dsk_bel_rexist_pressure_modifier:0 "来自雷克斯主义的压力"
 dsk_bel_rexist_pressure_modifier_desc:0 "国家议会受到日益严重的天主教保守主义势力和反议会政治宣传的施压。"
 dsk_bel_rearmament_modifier:0 "重新武装国家"
 dsk_bel_rearmament_modifier_desc:0 "现在，军事成为了这个国家的重心，各项军备的完成度牵动着整个国家的神经。"


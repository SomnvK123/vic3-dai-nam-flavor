 dsk_bel_workshop_of_europe_modifier:0 "欧洲工厂"
 dsk_bel_workshop_of_europe_modifier_desc:0 "比利时工业繁荣。"
 dsk_bel_strike_wave_modifier:0 "罢工浪潮"
 dsk_bel_strike_wave_modifier_desc:0 "劳资冲突正在扩大。"
 dsk_bel_school_compromise_modifier:0 "教育妥协"

l_simp_chinese:

# ============================== DSK 比利时：日志类文本 ==============================
 je_group_dsk_belgium:0 "比利时崛起"
 je_group_dsk_belgium_lowlands:0 "低地问题"
 je_group_dsk_belgium_congo:0 "刚果自由邦"
 je_dsk_bel_independence:0 "新王国"
 je_dsk_bel_independence_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]作为政治实体的存在已经在宪法的公布和国王的宣誓中得到确立，但比利时王国的存在于欧洲外交体系中还没有得到普遍承认。[SCOPE.sCountry('dsk_bel_net_scope').GetName]仍将1830年的分离视为一场未能平定的叛乱，[SCOPE.sCountry('dsk_bel_gbr_scope').GetName]需要一个可信的低地缓冲国，而[SCOPE.sCountry('dsk_bel_fra_scope').GetName]与[SCOPE.sCountry('dsk_bel_pru_scope').GetName]都在衡量这个新王国是否会改变外交格局。\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_independence_monthly_tt #o 外交承认进度#!#!预计将在下个月#variable [GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_delta_var').GetValue|+=]#!，当前变化趋势#v [GetPlayer.MakeScope.Var('dsk_bel_independence_var').GetValue|0] / 55#!。\n#v 1.外交承认的推动因素：#!与#blue 英国#!、#blue 法国#!或#blue 普鲁士#!中的任意一国拥有#v 50#!以上的[concept_relations]时，每月会推进#v 0.25#!进度，最高可达到#v 0.50#!。\n#v 2.外交承认的不利因素：#!破坏中立地位、发起侵略性战争或进行危险的外交表态。\n#v 3.额外说明：#!完成此日志需要外交承认进度达到#v 55#!且国家处于和平状态。\n$TOOLTIP_DELIMITER$\n此[concept_journal_entry]会在特定条件下触发#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_independence_events #o 比利时外交承认潜在事件#!#!。"
  je_dsk_bel_independence_status:0 "[SCOPE.GetRootScope.GetCountry.GetName]仍在等待欧洲列强们通过条约建立稳定的外交关系。#!"
 je_dsk_bel_independence_status_london_ready:0 "#green 伦敦会议中敲定的细则正逐步化为现实，列强已开始把比利时视为可信的缓冲国。#!"
 je_dsk_bel_independence_status_dutch_pressure:0 "#red 荷兰政府拒绝将1831年的失败视作最终的结果，在这之上的任何边境冲突、领土主张或是利益诉求都可能都可能使两国关系滑向战争#!"
 je_dsk_bel_independence_status_default:0 "#yellow 对比利时的外交承认仍然在国际会议上被不断扯皮和推诿。#!"
 je_dsk_bel_neutrality:0 "永久中立与列强保障"
 je_dsk_bel_neutrality_reason:0 "永久中立不是将军队解除武装，也不是锁上外交部的大门。它是一套需要一以贯之的国家战略：领土主张、兵员武备、外交保障、防御工事和对[concept_infamy]的克制共同决定[SCOPE.GetRootScope.GetCountry.GetName]是否仍被欧洲视为可信的中立国。\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_neutrality_monthly_tt #o 中立地位可信度#!#!预计将在下个月#variable [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_delta_var').GetValue|+=]#!，当前中立地位可信度为：#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_var').GetValue|0] / 55#!。\n#v 1.中立地位可信度的推动因素：#!当国家处于和平状态、外交恶名恶名低于#v 5#!点，且#o 永久中立#!日志已经解锁，中立地位可信度每月增加#v 0.25#!。如果同时拥有#v 恪守中立#!或#v 武装化中立国#!状态，则额外增加#v 0.25#!。\n#v 2.补充说明：#!在取得外交承认，#o 伦敦条约#!已生效并解锁#o 永久中立#!日志后，该进度的月度增长增长才会生效。\n#v 3.中立地位可信度的不利因素：#!处于战争状态会使每月进度减少#v 1#!点；若[concept_infamy]在#v 2#!到#v 10#!点之间，每月减少#v 0.25#!；若高于#v 10#!，则每月减少#v 1#!点。\n#v 4.额外说明：#!#green 重申永久中立#!会使比利时获得恪守中立修正，#yellow 秘密军事接触#!则会在持续侵蚀永久中立的可信性。\n\n完成此日志需要永久中立的可信性达到#v 55#!且保持[concept_infamy]较低。\n$TOOLTIP_DELIMITER$\n这个[concept_journal_entry]会在特定条件下触发#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_neutrality_events #o 永久中立潜在事件#!#!。"
 je_dsk_bel_neutrality_status:0 "#yellow 永久中立的可信性会随和平状态、发起侵略性战争和外交恶名每月变化。#!"
 je_dsk_bel_neutrality_status_fortress:0 "#green 列强的利益和比利时的武装中立达成了一致，比利时的中立政策正在变成稳定的国家战略。#!"
 je_dsk_bel_neutrality_status_breach:0 "#red 比利时的中立地位正在被侵略性战争、外交恶名和秘密军事接触侵蚀。#!"
 je_dsk_bel_neutrality_status_default:0 "#yellow 外交部每个月都在用在用行动证明：只有被反复声明和践行的外交立场，才能取信于他国。#!"
 je_dsk_bel_workshop_of_europe:0 "欧洲工厂"
je_dsk_bel_workshop_of_europe_reason:0 "小国缺乏战略纵深，但可以拥有工业规模。瓦隆采矿业、烈日军工业、布鲁塞尔金融业与安特卫普航运业并非彼此孤立，只待政治推动使之有机结合。\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_industry_monthly_tt #o 工业实力状况#!#!预计将在下个月#variable [GetPlayer.MakeScope.Var('dsk_bel_industry_monthly_delta_var').GetValue|+=]#!，当前工业实力为：#v [GetPlayer.MakeScope.Var('dsk_bel_industry_var').GetValue|0]/55#!。\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_finance_monthly_tt #o 经济部门协同发展度#!#!预计将在下个月#variable [GetPlayer.MakeScope.Var('dsk_bel_finance_monthly_delta_var').GetValue|+=]#!，当前经济部门协同发展度为：#v [GetPlayer.MakeScope.Var('dsk_bel_finance_var').GetValue|0]#!。\n#v 1.工业建设：#!#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_workshop_industrial_base_tt 瓦隆与佛兰德的工业建设#!\n#v 2.工业资本：#![GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]的[concept_clout]至少达到#v 10%#!。\n#v 3.金融网络：#!国家拥有#v 发达的布鲁塞尔金融业#!状态。\n#v 4.月度增长因素：#!每完成一项工业建设，且满足资本条件后就会获得增长速度。已完成的瓦隆矿业、瓦隆重工业、佛兰德航运建设、佛兰德出口工业、瓦隆内部[GetBuildingType('building_railway').GetName]分别提供#v +0.10#!增长速度。\n#v 5.完整体系奖励：#!五项工业建设已经全部完成，且[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]的[concept_clout]至少达到#v 10%#!并拥有#v 发达的布鲁塞尔金融业#!效果，则获得#v +0.15#!增长速度。\n#v 6.工业建设的不利因素：#!劳工冲突、罢工浪潮与金融审计。\n\n工业化主要通过#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_industry_advance_tt 工业建设#!加速，也会因#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_finance_regress_tt 劳资矛盾#!减慢。金融审计能获取公共信任，却会拖慢资本扩张。\n$TOOLTIP_DELIMITER$\n此[concept_journal_entry]会在特定条件下触发#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_workshop_events #o 工业建设潜在事件#!#!。"
 je_dsk_bel_workshop_status_finance:0 "#green 债券、[GetBuildingType('building_railway').GetName]和工矿业订单正在为国家经济发展提供强大动力。#!"
 je_dsk_bel_workshop_status_labor:0 "#red 矿区与工厂已经开始质疑这场工业奇迹的成果究竟进了谁的口袋。#!"
 je_dsk_bel_workshop_status_default:0 "#yellow 蒸汽机车正在把瓦隆、布鲁塞尔和安特卫普结为一体。#!"
 je_dsk_bel_school_war:0 "教育之战"
je_dsk_bel_school_war_reason:0 "比利时社会最根深蒂固的裂痕之一，就在课堂之上。[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]将天主教学校视作稳固乡村社会与信仰秩序的根本，[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]则认为国民学校塑造现代公民。\n\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_school_monthly_tt #o 教育妥协协商度#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_school_var').GetValue|0] / 7#!。\n#v 1.解锁条件：#![GetInterestGroupVariant('ig_devout',GetPlayer).GetName][concept_clout]达到 #v 18%#!且政府[concept_legitimacy]低于 #v 60#!；或教会在政府内且[concept_clout]至少达到 #v 15%#!，同时[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName][concept_clout]至少达到 #v 12%#!。\n#v 2.法律触发条件：#!拥有#v 公立学校#!法律，而教会[concept_clout]至少 达到#v 12%#!；或拥有#v 教会学校#!法律，且[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]的[concept_clout]至少达到 #v 12%#!。\n#v 3.促进因素：#!已经拥有#v 公立学校#!或#v 教会学校#!，且政府拥有至少 #v 45#![concept_legitimacy]时。\n#v 4.额外说明：#!达成妥协需要维持长期足够的合法性；资助一方或一边扩张都可能破坏国家凝聚力。\n$TOOLTIP_DELIMITER$\n此[concept_journal_entry]会在特定条件下触发#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_school_events #o 教育之战潜在事件#!#!。"
 je_dsk_bel_school_status_devout:0 "#yellow 教士们正在乡村和教堂中鼓动，教育问题开始政治斗争。#!"
 je_dsk_bel_school_status_liberal:0 "#yellow 自由派把国民教育视作现代国家的基础，但他们低估了教会的社会影响力。#!"
 je_dsk_bel_school_status_compromise:0 "#green 任何一方都没有取得胜利，因此需要一种双方都能接受的妥协。#!"
 je_dsk_bel_flemish_movement:0 "弗拉芒运动"
je_dsk_bel_flemish_movement_reason:0 "一个国家可以拥有两种民族，但不能只有一者拥有尊严。#yellow 佛兰德#!的法院、学校、军人和行政官僚会持续向布鲁塞尔施压，尤其当教育问题已经将社会裂痕大白于天下，或民族和解已经进入改革日程时。\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_unity_monthly_tt #o 国家凝聚力 #!#!预计将在下个月#variable [GetPlayer.MakeScope.Var('dsk_bel_unity_monthly_delta_var').GetValue|+=]#!，当前国家凝聚力为#v [GetPlayer.MakeScope.Var('dsk_bel_unity_var').GetValue|0] / 55#!。\n#v 1.解锁条件：#!拥有以下任意一项：#v 教育妥协协商度至少达到 2#!点、#v 国家凝聚力已降至 -1#!、已经完成#v 教育之战#!、[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]的[concept_clout]至少达到#v 16%#!、或#yellow 佛兰德#!任意地区的[concept_turmoil]高于 #v 10%#!。\n#v 2.促进因素：#!当[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]的[concept_clout]至少达到 #v 15%#!，且国家没有 #v 压制弗拉芒人#!状态，此时国家凝聚力才会随时间增长。\n#v 3.失败条件：#!国家凝聚力降至 #v -3#!及以下。\n#v 4.额外说明：#!采用弗拉芒语会逐步提高国家凝聚力；维持法语行政能换取短期行政效率，却会留下更深裂痕。\n$TOOLTIP_DELIMITER$\n此[concept_journal_entry]会在特定条件下触发#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_flemish_events #o 国家凝聚力潜在事件#!#!。"
 je_dsk_bel_flemish_status_federal:0 "#green 民族和解正在促成弗拉芒人的诉求得到实现，国家重新汇聚起凝聚力。#!"
 je_dsk_bel_flemish_status_repression:0 "#red 布鲁塞尔可以强令沉默，但不能强令接受。#!"
 je_dsk_bel_flemish_status_default:0 "#yellow 法语国家与弗拉芒人社会仍在反复拉扯。#!"
 je_dsk_bel_congo_free_state:0 "刚果自由邦"
je_dsk_bel_congo_free_state_reason:0 "#bold 刚果不是普通殖民地，而是一个由比利时国王、商社、探险家和国际政治博弈下共同促成的特殊产物。#!\n\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_congo_monthly_tt #o 刚果利益攫取程度#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_congo_var').GetValue|0] / 6#!。\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_congo_reform_monthly_tt #o 刚果改革动力#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_congo_reform_var').GetValue|0]#!。\n#v 1.解锁条件：#!国家治理原则为[concept_monarchy]，并且满足以下任意一项：经济部门协同发展变量至少达到 #v 3#!点，且已经完成金融业初步发展；工业实力至少 #v 6#!且已经完成工业初步建设；或者已经获得 #v 欧洲工厂#!状态。\n#v 2.不利因素：#!当刚果利益攫取程度达到 #v 6#!点，且刚果改革动力低于 #v 2#!点。\n#v 3.额外说明：#!若只追求收益，刚果会从财富来源变成国家被攻击的祸端。\n\n#green 刚果收益#!会强化比利时的财政和工业；而#red 丑闻压力#!则会产生[concept_infamy]、激怒列强，并最终促使各国干预。"
 je_dsk_bel_congo_status_rubber:0 "#green 刚果的收益正在被运往欧洲。#!"
 je_dsk_bel_congo_free_state_status_scandal:0 "#red 刚果的丑闻正通过各种渠道突破比利时国王的封锁并公之于众。#!"
 je_dsk_bel_congo_free_state_status_default:0 "#yellow 探险队、商社和外交代表正在刚果争夺着当地的归属。#!"
 je_dsk_bel_lowlands_question:0 "低地问题与未竟的联邦"
je_dsk_bel_lowlands_question_reason:0 "#bold 1830年的分离使比利时走向了独立，却没有指明低地的未来。#!\n\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_lowlands_monthly_tt #o 对低地的影响力#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_lowlands_var').GetValue|0] / 5#!。\n#v 1.日志解锁条件：#! #v 伦敦条约#!已经生效，并达成以下任意一项：已经表现出对低地的兴趣、对低地的影响力至少达到 #v 1#!点、或永久中立的可信性已经降至 #v 12#!及以下。\n#v 2.促进因素：#!#blue 荷兰#!仍然存在，且与荷兰的关系至少达到 #v 50#!。\n#v 3.不利因素：#!永久中立的可信性达到 #v 42#!及以上，比利时便难以做出与此前声明相悖的行为。\n#v 4.额外说明：#!这不是无代价的扩张，而是在两个鸡蛋上跳舞。\n\n比利时可以把自己锁进#yellow 永久中立#!的藩篱，也可以尝试通过关税同盟、卢森堡问题、与荷兰的外交和秘密军事接触来控制低地。"
 je_dsk_bel_lowlands_status_federation:0 "#green 低地联邦已从外交构想变成政治现实。#!"
 je_dsk_bel_lowlands_status_neutrality_cost:0 "#yellow 永久中立的可信性越高，布鲁塞尔越难以公开推动低地统合。#!"
 je_dsk_bel_lowlands_status_default:0 "#yellow 海牙、布鲁塞尔和卢森堡之间仍有太多龃龉。#!"
 je_dsk_bel_great_war:0 "1914烈日要塞"
je_dsk_bel_great_war_reason:0 "#bold 条约通过外务会议生效，但要在炮火中被证明。#!\n\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_great_war_monthly_tt #o 比利时的抵抗烈度#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_great_war_var').GetValue|0] / 5#!。\n#v 1.解锁条件：#!在 #v 伦敦条约#!时被卷入战争、中立地位已经破灭，或法德战争已经结束。\n#v 2.促进因素：#!处于战争状态；处于战争状态且同时拥有 #v 武装化中立国#!状态。\n#v 3.完成条件：#!比利时的抵抗烈度达到 #v 5#!点，且拥有 #v 武装化中立国#!状态、#v 伊瑟河抵抗#!状态，或永久中立的可信性达到至少 #v 24#!三者其中之一。\n#v 4.额外说明：#!这不是普通的战争日志，而是对比利时国家记忆的塑造。\n\n当欧洲大战逼近，[SCOPE.GetRootScope.GetCountry.GetName]必须面对层出不穷的事件，究竟是高挂免战牌坚守不出，还是左支右绌避无可避？"
 je_dsk_bel_great_war_status_yser:0 "#green 烈日、安特卫普和伊瑟河已经构筑起层层的坚实防线。#!"
 je_dsk_bel_great_war_status_invasion:0 "#red 中立已经不复存在，王国的延续只能用军队和堡垒继续维持。#!"
 je_dsk_bel_great_war_status_default:0 "#yellow 总参谋部正在检查每一份装备清单和独立保障。#!"
 je_dsk_bel_postwar_belgium:0 "胜利者的疲惫"
je_dsk_bel_postwar_belgium_reason:0 "#bold 战争结束后，比利时赢得了同情，却没有重归安宁。#!\n\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_postwar_monthly_tt #o 战后稳定性状态#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_postwar_var').GetValue|0] / 4#!。\n#v 1.促进因素：#!政府拥有至少 #v 55#![concept_legitimacy]，或已经达成民族和解。\n#v 2.真实倒退条件：#!如果国家凝聚力低于 #v 0#!点，且妥协倾向大于 #v 0#!点。\n#v 3.完成条件：#!战后稳定性达到 #v 4#!点，且政府拥有至少 #v 80#![concept_legitimacy]，并使国家凝聚力不低于 #v 0#!点。\n#v 4.额外说明：#!此日志通向三十年代的危机，比利时能否继续靠妥协生存，取决于战后十年的社会制度。\n\n战后重建、抚恤金、普遍权利、军人复员、劳工保障和民族问题会同时压向议会。高[concept_legitimacy]与民族和解能促成#green 战后稳定#!；凝聚力缺乏和巨大的经济压力会把社会推向#red 极端政治#!。"
 je_dsk_bel_postwar_status_reform:0 "#green 有序实现的更广泛公民权利劳工保障和军人复员正促进着国家的整体稳定。#!"
 je_dsk_bel_postwar_status_language:0 "#red 战后重建无法掩盖民族矛盾，弗拉芒问题再次回到风口浪尖。#!"
 je_dsk_bel_postwar_status_default:0 "#yellow 国家正在修复战争因战争被摧毁的城市，也赛在修补受其所破坏的社会秩序。#!"
 je_dsk_bel_railways_and_finance:0 "国家铁路债券"
je_dsk_bel_railways_and_finance_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]的倚仗不是来自于广袤的领土，而是靠发达的金融、航运和工矿业，这些产业必须通过经贸往来而相互联系。\n\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_finance_monthly_tt #o 铁路经济发展状况#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_finance_var').GetValue|0]#!。\n#v 1.解锁条件：#!完成以下任意一项：工业实力达到至少 #v 3#!；已经具备瓦隆矿业基础；或者已经获得 #v 欧洲工厂#!状态。\n#v 2.促进因素：#!当国家拥有#v 发达的布鲁塞尔金融业#!状态，且劳工妥协倾向低于 #v 2#!点；或选择 #v 发行国家[GetBuildingType('building_railway').GetName]债券#!；\n#v 3.不利因素：#!劳工冲突、有未偿还的借款和金融审计。\n$TOOLTIP_DELIMITER$\n此[concept_journal_entry]会在特定条件下触发#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_finance_events #o 金融业潜在事件#!#!。"
 je_dsk_bel_labor_question:0 "劳资妥协"
je_dsk_bel_labor_question_reason:0 "工厂的烟囱越高，工厂之中的声音就越难被忽视。矿工、[GetBuildingType('building_port').GetName]工人、天主教互助会、社会主义派系的报纸和工厂主都要求国家表明立场，但这个议题只有在工业社会初步建成之后才会被提到议院之中。\n\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_labor_monthly_tt #o 劳工妥协倾向#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_labor_var').GetValue|0]#!。\n#v 1.解锁条件：#!工业实力至少 #v 5#!点，且[GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName]的[concept_clout]至少达到 #v 8%#!；或已经完成金融业的发展后，工会的[concept_clout]至少达到 #v 6%#!；又或者已经获得 #v 罢工浪潮#!效果，且劳工妥协倾向低至 #v -2#!及以下。\n#v 2.不利因素：#!拥有 #v 罢工浪潮#!状态。\n#v 4.额外说明：#!建立矿井监管制度会促进妥协达成；镇压罢工能确保短期生产，却会使国家激进化、降低国家凝聚力，并使后续危机更难以应对。\n$TOOLTIP_DELIMITER$\n此[concept_journal_entry]会在特定条件下触发#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_labor_events #o 劳资矛盾潜在事件#!#!。"
je_dsk_bel_franco_prussian_crisis:0 "法德战争的中立"
je_dsk_bel_franco_prussian_crisis_reason:0 "当伦敦条约失效、低地冲突加剧、法国态度恶化和德国施压时，[SCOPE.GetRootScope.GetCountry.GetName]的存亡便是迫在眉睫。[SCOPE.sCountry('dsk_bel_fra_scope').GetName]、[SCOPE.sCountry('dsk_bel_pru_scope').GetName]和[SCOPE.sCountry('dsk_bel_gbr_scope').GetName]关注的不是比利时声称自己中立，而是它有无切实履行中立的职责。\n\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_franco_prussian_monthly_tt #o 法德战争中的中立可信度#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_franco_prussian_var').GetValue|0] / 6#!。\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_neutrality_monthly_tt #o 永久中立的可信性#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_var').GetValue|0] / 55#!。\n#v 1.解锁条件：#!只有#blue 法国#!与#blue 普鲁士#!或#blue 德国#!已经正式开战。\n#v 2.促进因素：#!国家拥有 #v 恪守中立#!状态，且法德战争的威胁还低于 #v 6#!点。\n#v 3.不利因素：#!国家拥有 #v 秘密军事接触#!状态。\n#v 4.额外说明：#!维持中立需要日志与事件抉择的共同支撑。\n$TOOLTIP_DELIMITER$\n此[concept_journal_entry]会在特定条件下触发#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_tooltip_franco_prussian_events #o 法德战争潜在事件#!#!。"
 je_dsk_bel_congo_reform:0 "改革刚果自由邦"
je_dsk_bel_congo_reform_reason:0 "#bold 刚果自由邦已经不再是国王一家之事。#!\n\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_congo_reform_monthly_tt #o 刚果改革动力#!#!为：#v [GetPlayer.MakeScope.Var('dsk_bel_congo_reform_var').GetValue|0]#!。\n#v 1.解锁条件：#!已经完成刚果事件链；或刚果利益攫取程度至少达到 #v 5#!点且本土金融业已初步发展；抑或拥有 #v 刚果丑闻#!状态。\n#v 2.促进因素：#!拥有 #v 刚果丑闻#!状态。\n#v 3.不利因素：#!当刚果利益攫取程度已经达到至少 #v 5#!点，且改革动力低于 #v 2#!点。\n#v 4.额外说明：#!#green 国家接管#!能降低国际压力并重塑殖民机构；#red 保障收益#!会有利于财政和工业，但会由此产生丑闻、[concept_infamy]和列强干预风险。\n\n传教士证词、商社的利益、议会调查和来自国际人道主义的压力会随时间成为潜在事件。若[SCOPE.sCharacter('dsk_bel_leopold_ii_scope').GetFullName]仍试图把刚果当作私人资产，改革机会会被迅速扼杀。"
 je_dsk_bel_belgian_extremes:0 "三十年代的极端政治"
je_dsk_bel_belgian_extremes_reason:0 "大萧条、雷克斯主义、社会主义的蔓延、民族自治和对重新武装的争论同时压向[SCOPE.GetRootScope.GetCountry.GetName]。\n\n当前#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_extremes_monthly_tt #o 政治极端化#!#!状态为：#v [GetPlayer.MakeScope.Var('dsk_bel_extremes_var').GetValue|0]#!。\n#v 1.解锁条件：#!未达成战后稳定、极端化倾向高涨、政府[concept_legitimacy]低于 #v 45#!，或已经拥有 #v 来自雷克斯主义的压力#!状态。\n#v 2.不利因素：#!拥有 #v 来自雷克斯主义的压力#!状态。\n#v 3.额外说明：#!政府拥有高[concept_legitimacy]、维持战后稳定与民族和解会维护议会政体；政府合法性过低、来自雷克斯主义的压力和民族矛盾会把国家推向极端政治。"
 je_dsk_bel_national_question:0 "比利时的地位"
je_dsk_bel_national_question_reason:0 "#bold 比利时所需的不是扩张，而是证明一个夹在强权之间的小国能否成为持久存在的国家。#!\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_independence_monthly_tt #o 外交承认#!#!预计下月变化#variable [GetPlayer.MakeScope.Var('dsk_bel_independence_monthly_delta_var').GetValue|+=]#!，当前进度为#v [GetPlayer.MakeScope.Var('dsk_bel_independence_var').GetValue|0] / 55#!\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_neutrality_monthly_tt #o 永久中立的可信性#!#!预计下月变化#variable [GetPlayer.MakeScope.Var('dsk_bel_neutrality_monthly_delta_var').GetValue|+=]#!，当前状态为#v [GetPlayer.MakeScope.Var('dsk_bel_neutrality_var').GetValue|0] / 55#!\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_industry_monthly_tt #o 工业实力#!#!预计下月变化#variable [GetPlayer.MakeScope.Var('dsk_bel_industry_monthly_delta_var').GetValue|+=]#!，当前状态为#v [GetPlayer.MakeScope.Var('dsk_bel_industry_var').GetValue|0] / 55#!\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_unity_monthly_tt #o 国家凝聚力#!#!预计下月变化#variable [GetPlayer.MakeScope.Var('dsk_bel_unity_monthly_delta_var').GetValue|+=]#!，当前状态为#v [GetPlayer.MakeScope.Var('dsk_bel_unity_var').GetValue|0] / 55#!\n\n#v 1.外交承认的促进因素：#!与#blue 英国#!、#blue 法国#!或#blue 普鲁士#!至少一国关系达到#v 50#!以上时每月#v +0.25#!进度，最高可达#v 0.50#!。\n#v 2.永久中立的可信性的促进因素：#!解锁#o 永久中立#!后，处于#v 和平#!状态且[concept_infamy]低于#v 5#!时每月#v +0.25#!进度；拥有#v 恪守中立#!或#v 武装化中立国#!状态，每月#v +0.25#!进度。外交承认的不利因素：处于战争状态会使每月#v -1#!进度，中等恶名会造成每月#v -0.25#!进度，高恶名则会每月#v -1#!进度。\n#v 3.工业实力的促进因素：#![GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]的[concept_clout]至少达到#v 10%#!或已经拥有#v 发达的布鲁塞尔金融业#!状态，#tooltippable;tooltip:[GetPlayer.GetTooltipTag],dsk_bel_workshop_industrial_base_tt 瓦隆矿业、瓦隆重工业、佛兰德航运建设、佛兰德出口工业、瓦隆[GetBuildingType('building_railway').GetName]#!五项工业建设，每一项提供每月#v +0.10#!进度；若工业建设全部完成，且[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]的[concept_clout]至少达到#v 10%#!并同时拥有#v 发达的布鲁塞尔金融业#!状态，则每月#v +0.15#!进度。\n#v 4.国家凝聚力的促进因素：#![GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]的[concept_clout]至少达到#v 15%#!，且国家没有#v 压制弗拉芒人#!状态，每月#v +0.25#!进度；若已形成#v 教育妥协协商度#!或#v 语言和解#!，则每月#v +0.25#!进度。\n#v 5.前置说明：#!永久中立的可信性的#green 月度增长#!不会立刻生效，需要取得外交承认使#o 伦敦条约#!生效并解锁#o 永久中立#!日志。"
 je_dsk_bel_national_question_status_confident:0 "#green 比利时国家基础已经开始成形#!"
 je_dsk_bel_national_question_status_collapse:0 "#red 国家问题已经变为亟待解决的存亡问题#!"

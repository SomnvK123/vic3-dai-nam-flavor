law_gendarmerie:0 "国家宪兵"
law_gendarmerie_desc:0 "国家宪兵或宪兵队是部分国家拥有的武装力量编制，不仅承担军队内部的维持纪律与执法，还负责部分地区的治安、刑事侦查及反恐，或执行边防和海警任务。"
law_renda:0 "全国人民代表大会"
law_renda_desc:0 "简称全国人大，是中华人民共和国最高国家权力机关及国家立法机关。其法律地位高于行政机关及司法机关，职权范围包括修改宪法；监督宪法的实施；立法权；任免权；重大事项决定权；监督权。在其闭会时，则由其产生的常务委员会作为常设立法机关，代为行使其大部分职权。"
law_yidaiyilu:0 "一带一路"
law_yidaiyilu_desc:0 "中华人民共和国提出并主导的经济发展战略与框架，为“丝绸之路经济带”和“21世纪海上丝绸之路”合作倡议的简称。"
law_proletariat_army:0 "人民军队"
law_proletariat_army_desc:0 "人民群众自发地或在先进阶级领导下建立的并为人民群众利益而战斗的军队。由无产阶级领导、以马克思主义理论作指导的人民军队是新型的人民军队。"

law_gemingjun_army:0 "国民革命军"
law_gemingjun_army_desc:0 "简称国军、革命军或国府军，是中国国民党于1925年创设领导的武装部队，也是中华民国国民政府在北伐战争与抗日战争时期的军事主力。1947年随着中华民国行宪，该部队正式更名改组为中华民国国军。"
ig_gemingjun_desc:0 "為民請命，為國除奸，成敗利鈍，在所不顧，任何犧牲，在所不惜。本黨為求遵守總理所昭示之方略，盡本黨應盡之天職，宗旨一定，生死以之。"
law_people_police:0 "人民警察"
law_people_police_desc:0 "中华人民共和国人民警察，简称人民警察、民警，是中华人民共和国职业制警察的法定名称。其根据相关法律规定，在职权范围内具有执法权。"

law_IJ_constitution: "帝国议会"
law_IJ_constitution_desc: "大日本帝国议会是受自由民权运动和开设国会运动推动，最终通过《大日本帝国宪法》设立的天皇立法的辅助机关，在获得天皇许可和国务大臣署名后制定法律。议会采用两院制，由民选的众议院和非民选的贵族院组成。"
law_IJ_rights: "大日本帝国宪法"
law_IJ_rights_desc: "《大日本帝国宪法》俗称《明治宪法》，是在天皇发布的命令元老院起草国宪敕文的要求下，由元老院研究各国宪法后，基于近代立宪主义，以夏岛草案为基础，修改定稿后颁行的日本第一部正式宪法。其规定日本采用二元制君主立宪制政体，天皇的政治地位高于三权分立的各国家机关，在日本具有至高无上的地位。"
law_IJ_kami: "国家神道"
law_IJ_kami_desc: "国家神道是大日本帝国对神道教的官方化和意识形态化后形成的超宗教体系。在《大教宣布》诏书确立神道教地位后，《大日本帝国宪法》在规定国民拥有信仰自由权利的前提下，国民有信仰神道的义务。神道成为一种道德传统和爱国实践，并通过“神社非宗教论”位居超宗教地位。"
law_IJ_secularization: "世俗化"
law_IJ_secularization_desc: "是一个社会学和宗教哲学概念，指随着社会现代化与理性化发展，宗教逐渐退出公共权力、制度体系及日常核心，社会各领域摆脱宗教束缚并转向非宗教性价值观的过程。"
law_IJ_taisei: "太政官制"
law_IJ_taisei_desc: "太政即大政、国家政务，官即官署、政府机构。太政官统辖八省百官，总理国家政务，是日本律令国家体制中的最高行政机关，与神祇官合称二官。其实行四等官制，设长官、次官、判官、主典四等。太政官自平安时代中后期因摄政和关白而权利逐渐衰退，明治时代因王政复古短暂中兴，最终被新设的西方式内阁制度所取代。"
law_IJ_cabinet: "内阁制"
law_IJ_cabinet_desc: "又称议会制、议会民主制，是现代民主宪政体制的一种核心形式，也是现代民主体制中最主流的执政形式之一。内阁制起源于英国，并被日本、德国、加拿大、澳大利亚等众多国家所采用，其特点是行政权与立法权相互融合，即政府（行政机关）的权力直接来源于议会（立法机关），并对议会负责。"

law_one_party_state:0 "一党独裁制"
law_one_party_state_desc: "一党独裁制（单党制）是指由单一政党通过宪法、法律和国家机器垄断政治与军事权力的政治体制。在此体制下，国内禁止或不允许其他实质性反对党存在，该政党长期或永久掌握国家政权，其意识形态通常具有高度的排他性。"
law_IJ_highpolice: "特别高等警察"
law_IJ_highpolice_desc: "特别高等警察是大日本帝国的一支秘密警察部队。该组织是在主要职能为镇压反政府运动的高等警察外分离而设，通过监视、调查和镇压无政府主义者、共产主义者、社会主义者以及否定国体或激进国家主义者以维护国家秩序。其最早隶属于内务省警察局保安课并仅在小范围设立，后统一设立于全国。"

law_IJ_CI: "殖产兴业"
law_IJ_CI_desc: "殖产兴业是与富国强兵、文明开化并列的明治维新三大政策之一。其旨在通过运用国家政权力量与国库资金，引进西方近代工业技术，大力扶植资本主义工商业发展，以实现国家近代化并与西方列强抗衡。前期以国营军工企业为主导发展国家资本主义，后期转而通过官业下放令将国营企业出售给私人以扶植私人资本主义。"
law_IJ_DeAsia: "脱亚入欧"
law_IJ_DeAsia_desc: "脱亚入欧指脱离亚洲，加入欧洲。这是日本大政奉还后的风潮，表现出对亚洲的漠视和对欧洲的重视。"
law_IJ_tax: "地租改正"
law_IJ_tax_desc: "地租改正是明治时期的租税制度改革政策，兼具土地改革性质。此次改革将此前自封建时代以来一直沿用的依据当年收成以米缴纳的实物税，改为以地价为标准缴纳的固定比例货币税，日本由此首次确立土地私有权利。"
law_IJ_CE: "开化与建设"
law_IJ_CE_desc: "是指宗主国在被殖民地区推行的一系列现代性移植与改造。这一过程为殖民地带来了基础设施、现代教育和法制制度的建设，其留下的物质与政治遗产在后殖民时代仍产生着深远影响。"
law_IJ_police: "极权警察"
law_IJ_police_desc: "在极权政体下，充当统治阶层维系专制统治与全面社会控制的一种暴力工具。这类警察往往不受法律和宪政程序的有效约束，其核心职能从维护社会治安延伸至监控民众思想、压制异见以及消除政治威胁。"
law_IJ_education: "高等义务教育"
law_IJ_education_desc: "这是一种具有普及性、强制性、免费性的学校教育，是提升国民素质的基础，实现社会公平的起点。接受义务教育是公民的基本权利，实施义务教育是政府的重要职责，支持义务教育是全社会的共同任务。"
law_IJ_Isei: "全民医疗保险"
law_IJ_Isei_desc: "一种为特定国家或地区，确保所有居民都能获得医疗卫生照护的系统。其最终目标是为所有居民或缺乏经济能力者提供医疗卫生服务，改善民众的健康。这并不意味着所有人及全部的病例都受到覆盖，而是所有人都可取得医疗卫生。"

law_IJ_defamation: "舆论管制"
law_IJ_defamation_desc: "国家、政府或特定机构运用行政、法律及技术手段，对新闻媒介、传播平台及公众言论的传播过程进行干预、引导和限制，以达到维护社会稳定、巩固政权或塑造特定社会共识的目的。"
law_IJ_newspaper: "报纸出版条例"
law_IJ_newspaper_desc: "禁止军人、官吏、学生和25岁以下者办报；报纸出版须到警察机关登记并交纳保证金；禁止报纸刊登“淆乱政体”、“妨害治安”和各级官署禁止刊载的一切文字；每天的报纸在发行前须呈送报样给警察机关备案。"
law_IJ_factory: "工厂立法"
law_IJ_factory_desc: "通常指工业革命时期以来，国家为规制工厂生产、改善劳工待遇、规范劳动条件及保障劳工安全所建立的法律体系。它是现代劳动法的前身，对缓和劳资矛盾具有深远意义。 "
law_IJ_elementary: "小学校令"
law_IJ_elementary_desc: "含总纲、设置、教科及编制、设备、就学、职员、经费及学费、掌管及监督、附则等 9 章，共 47 条。规定“小学校教育以留意儿童身心之发育，培养国民道德之基础，并授以生活必需之知识技能为宗旨。"
law_IJ_assembly: "大日本国防妇人会"
law_IJ_assembly_desc: "其前身为大阪国防妇人会，是大阪家庭主妇安田静受井上千代子事件促使建立的妇女组织，后更名为此。该组织以军事扶助和家庭国防为中心，以"国防始于厨房"为口号号召妇女从厨房和家庭中奋起以支援国防、保卫国家。其成员仅需支付低廉的会费，以家庭围裙为会服并常伴有斜批的写有组织名称的字带，通过此类平等主义的举措，该组织在短时间内迅速成为全国最大的妇女组织。"
law_IJ_rescue: "社会保险"
law_IJ_rescue_desc: "一种现代的社会保障制度，是指国家强制人民参与各种保险，预先为各种疾病、身心伤害、失能、失业、职业灾害、老年与死亡等社会风险做准备。"
law_Coachman:0 "荷兰航运"
law_Coachman_desc:0 "尼德兰七省联合共和国在脱离西班牙独立后，以其先进的政治体制和地理优势，进入其黄金时代。该时期内尼德兰取代葡萄牙与西班牙，长期支配世界贸易，借此积累了大量财富并成为城市化水平最高的地区。"
law_nazi_highpolice: "盖世太保"
law_nazi_highpolice_desc: "全称国家秘密警察，是由时任普鲁士内政部长的赫尔曼·戈林将普鲁士警察改组而来。作为德意志第三帝国时期的秘密警察，该组织隶属于国家安全部并长期由党卫队控制。其具备有监视、逮捕和审讯政府反对者、反间谍、实施种族政策等职能。"
law_Schutzstaffel: "国防军"
 law_Schutzstaffel_desc: "德国国防军是在世界大战后由魏玛共和国在1919年建立，后经第三帝国于1935年改组的德国官方武装力量，下辖有陆军、海军、秘密组建的空军和日后囊括的武装党卫队。该部队在西克特时期奠定了精英主义的基调，成为了世界上平均素质最高的军队。"
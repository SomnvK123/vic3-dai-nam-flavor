 dyn_c_ZZ1_puppet_GBR: "北罗得西亚保护地"
 dyn_c_ZZ1_puppet_GBR_ADJ: "北罗得西亚"
 ROC_FLAVOR_TEXT: "五族共和的中国，民族矛盾的冲突暂告一段落。中国能否摆脱沉重的过去，成为一个强大又平等的工业化国家吗？"
 SOV_FLAVOR_TEXT: "从帝国主义最薄弱的一环——沙皇俄国中脱胎出了新生的苏维埃政权。这个以工人阶级领导的国家，能带领全球无产阶级实现共产主义吗？"
 DR1_FLAVOR_TEXT: "刚果成功从列强的殖民压迫中获得解放。新生的刚果民主共和国，能凭借优秀的地理位置和丰富的自然资源，成为非洲最发达的国度吗？"
 NR1_FLAVOR_TEXT: "曾经幅员辽阔的索科托哈里发国，治下有着许多信仰和生活方式迥异的民族。新生的尼日利亚，能平衡好农牧冲突的豪萨人和富拉尼人，以及信萨满的约鲁巴人和穆斯林教徒之间的冲突吗？"
 QA1_FLAVOR_TEXT: "卡塔尔从巴林的压迫中解脱出来，可自由是短暂的，许多大国势力蔓延到这个弱小的海湾国家。卡塔尔能否保持独立地位，在复杂的国际形势下生存下来？"
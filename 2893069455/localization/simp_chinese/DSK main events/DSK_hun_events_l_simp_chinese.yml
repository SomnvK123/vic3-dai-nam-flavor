dsk_aus.5.f:0 "[concept_magyar]，罗马尼亚人，波兰人，捷克人都是国家的子民"
dsk_aus.5.a:0 "他说得对"
dsk_aus.5.b:0 "这太激进了"
dsk_aus.6.t:0 "一位德意志民族主义者夺取了[SCOPE.gsInterestGroup('Cultural_diversity_ig).GetName]利益集团领袖的位置"
dsk_aus.6.d:0 "这位新的德意志民族主义者将领导这个集团进行游说演说"
dsk_aus.6.f:0 "[concept_magyar]，罗马尼亚人，波兰人，捷克人都不是帝国的子民，我们德意志人才是这个国家真正的主人"
dsk_aus.6.a:0 "他说得对"
dsk_aus.6.b:0 "这太激进了"
dsk_aus.7.t:0 "奥地利人与游行示威的[concept_magyar]爆发冲突"
dsk_aus.7.d:0 "在一场和平游行的聚会上，奥地利人与[concept_magyar]生产矛盾并导致斗殴事件发生"
dsk_aus.7.f:0 "我们的法官和警察都偏袒奥地利人，这令[concept_magyar]颇为不满"
dsk_aus.7.a:0 "这太极端了"
dsk_aus.9.t:0 "一位德意志男人强奸了波兰少女"
dsk_aus.9.d:0 "奥地利法官在判决刑事案件中包庇德意志男子"
dsk_aus.9.f:0 "“法官，你懂的，我压根不屑于与这些波兰猪猡发生关系，我甚至不愿意多瞧他们一眼，奈何这个骚妇穿的那么暴露，她是个继女，肯定想勾引男人”\n“法官，我愿用我的死来证明我是清白的。”"
dsk_aus.9.a:0 "我还能说什么？"
dsk_aus.8.t:0 "在一场音乐会中，捷克人被拒绝进入"
dsk_aus.8.d:0 "捷克人被拒绝进入公共娱乐场所"
dsk_aus.8.f:0 "“捷克蛮子懂什么艺术？这是你该来的地方吗？你听得懂德语吗？”\N“我不光听得懂德语，我还听得懂狗怎么叫。”"
dsk_aus.8.a:0 "这太糟糕了"

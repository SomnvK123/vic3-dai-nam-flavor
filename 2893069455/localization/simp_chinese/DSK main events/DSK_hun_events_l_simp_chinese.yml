hun_not_be_annex:0 "匈牙利独立"
je_small_Hungary:0 "多瑙-匈牙利提案"
je_small_Hungary_reason:0 "是时候团结多瑙河沿岸的小国，并建立一个以匈牙利为主体的多瑙联邦国家了"
je_aus_war_reason:0 "这是一场民族解放战争，又是一场国家独立战争，[concept_magyar]民强烈要求摆脱奥地利帝国的统治，消灭封建农奴制度，建立一个由[concept_magyar]管理的，符合匈牙利资产阶级利益的统一国家，来保证匈牙利资本主义的充分发展。"
je_The_shield_of_Catholicism:0 "天主教之盾"
je_The_shield_of_Catholicism_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]位于天主教世界的最东端，有义务捍卫天主教世界的和平，以我等身躯化身欧洲最坚固的屏障，抵挡这异教徒的侵略和压迫"
je_hun_reforms:0 "匈牙利的道路"
je_hun_reforms_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]刚刚从奥地利帝国的统治中独立，国家此时百废待兴，关于走不同的道路，各个利益集团也有不同的看法，我们可以发扬法国革命的精神，也可以重新回到王国时代"
je_hun_waijiao:0 "匈牙利外交事务"
je_hun_waijiao_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]刚刚从奥地利帝国的统治中独立，国家此时国力尚弱，我们的外交地位也面临岌岌可危的境地，我们的邻国众多，必须寻求某一欧洲列强合作，以帝国主义的力量对抗帝国主义，方能帮助我们度过这段艰难的时期。"

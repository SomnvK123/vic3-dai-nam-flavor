je_dnf_house_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]作为多瑙河最主要的国家，在这一片拥有举足轻重的影响力，我们可以团结其他多瑙河小邦国，创造一个更为伟大的多民族国家。亦或是回归到我们巅峰时期的领土，创造属于大匈牙利的新荣耀。"

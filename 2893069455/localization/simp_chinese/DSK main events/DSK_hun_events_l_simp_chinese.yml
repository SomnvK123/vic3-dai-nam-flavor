je_holy_rome:0 "重新构建神罗体系"
je_holy_rome_reason:0 "1806年7月12日，在拿破仑的威逼利诱下，16个神圣罗马帝国的成员邦在巴黎签订了《莱茵邦联条约》（Rheinbundakte），脱离帝国，加入邦联。此举严重削弱奥地利在德意志地区的领主地位，令弗朗茨二世大为不快。拿破仑为了吸引更多国家加入邦联，决定亲手终结神圣罗马帝国。因此他对奥皇弗朗茨二世发出最后通牒，要求他解散神圣罗马帝国，并且放弃神圣罗马皇帝和罗马人民的国王的称号。最后弗朗茨二世于1806年8月6日放弃神圣罗马皇帝的帝号，仅保留奥地利帝国的帝号。神圣罗马帝国正式灭亡。\n如今，我们成功压制了法国革命带来的影响，我们要确保君主制，独裁制，国教再次回到奥地利，神圣罗马帝国再次降临人间。"

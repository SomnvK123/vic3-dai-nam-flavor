 dsk_aus.32.t:0 "1848人民之春席卷而来"
 dsk_aus.32.d:0 "[SCOPE.sCountry('fra_scope').GetName]的民主[concept_revolution]在欧洲掀起革命浪潮"
 dsk_aus.32.f:0 "1848年革命，也称民族之春或人民之春，是在1848年欧洲各国爆发的一系列武装革命，是平民与贵族间的抗争，主要是欧洲平民与自由主义学者对抗君权独裁的武装革命。这一系列革命波及范围之广，影响国家之大，可以说是欧洲历史上最大规模的革命运动"
 dsk_aus.32.a:0 "我学习到了更多"
dsk_aus.33.t:0 "重燃反法战争之火"
 dsk_aus.33.d:0 "重燃反法战争之火,我们将会和法国在战场上相见"
 dsk_aus.33.f:0 "这种风气在欧洲是不可取的，法国只会把我们往火坑上推，我不允许在欧洲大陆再次出现人解放人的现象，我们必须重新拾起反法战争的热情"
 dsk_aus.33.a:0 "告诉我，这是第几次反法战争了？"

 dsk_aus.34.t:0 "[SCOPE.sCountry('hun_scope').GetName]成功挣脱[SCOPE.sCountry('aus_scope').GetName]的束缚打赢了独立战争!"
 dsk_aus.34.d:0 "历史性的时刻，我们现在可以选择扮演[SCOPE.sCountry('hun_scope').GetName]了"
 dsk_aus.34.f:0 "匈牙利民族解放战争是[concept_magyar]民在欧洲1848年革命中开展的反对奥地利封建专制统治和民族压迫，争取民族独立的资产阶级革命战争，它是欧洲革命的一部分，直接支援了欧洲其他国家的革命。"
 dsk_aus.34.a:0 "现在不是时候"
 dsk_aus.34.b:0 "带我去[SCOPE.sCountry('hun_scope').GetName]"

dsk_aus.35.t:0 "爱国，自由，繁荣"
 dsk_aus.35.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]对欧洲的影响力没有像今天一样那么深远"
 dsk_aus.35.f:0 "我们发扬着法国革命的意志，学习他们的优秀经验，我们不愧于在民族解放中牺牲的烈士，我们要为后世留下一片没有压迫和纷争的净土。"
 dsk_aus.35.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁！"

dsk_aus.36.t:0 "寻找盟友"
 dsk_aus.36.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]经历了数年的解放战争，常年被奥地利封锁，在外交中处于孤立无援的地位，我们打破了这一现状"
 dsk_aus.36.f:0 "如果民族的独立是从零到一的壮举，那么重新建立外交则是一到二的突破。"
 dsk_aus.36.a:0 "法国是[SCOPE.GetRootScope.GetCountry.GetName]的盟友！"
 dsk_aus.36.b:0 "俄罗斯是[SCOPE.GetRootScope.GetCountry.GetName]的盟友！"
 dsk_aus.36.c:0 "这两方并非是[SCOPE.GetRootScope.GetCountry.GetName]的盟友，我们需要另做打算。"

dsk_aus.37.t:0 "议会通过决议草案"
 dsk_aus.37.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]可以制定更先进的法律，进一步发扬自由民主的精神"
 dsk_aus.37.f:0 "爱国，自由，繁荣！"
 dsk_aus.37.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁！"
dsk_aus.37.b:0 "这太激进了"
dsk_aus.38.t:0 "多瑙议会通过决议草案"
 dsk_aus.38.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]可以向更深远的目标发起总攻了。"
 dsk_aus.38.f:0 "选择我们自己的道路"
 dsk_aus.38.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁！"
 dsk_aus.38.b:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁！"
dsk_aus.39.t:0 "天主教之盾"
 dsk_aus.39.d:0 "公元1000年，[SCOPE.GetRootScope.GetCountry.GetName]大公伊什特万一世获得天主教教皇加冕，天主教开始在我们国家传播，我们正式成为天主教国家。蒙古西征时期，与我们爆发了战争，后蒙古大汗窝阔台死，蒙古军队随即撤离，[SCOPE.GetRootScope.GetCountry.GetName]虽受到严重破坏，但得以继续在。随着拜占庭帝国的灭亡，奥斯曼终于得以将铁蹄踏入欧洲腹地。1526年，奥斯曼入侵，我们与其发生激烈的战争，虽然战败，但是阻止了伊斯兰教进入欧洲腹地的悲剧。纵观历史，[SCOPE.GetRootScope.GetCountry.GetName]位处天主教世界最东端，所以每次欧洲受到外敌入侵时，首当其冲的就是我们，[SCOPE.GetRootScope.GetCountry.GetName]是欧洲的一道屏障，有义务保护起天主教在欧洲的统治地位。"
 dsk_aus.39.f:0 "伟大的匈牙利将会一次又一次帮助欧洲抵挡异教的入侵。"
 dsk_aus.39.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]必须重新恢复天主教之盾的荣耀！"
dsk_aus.40.t:0 "大匈牙利"
 dsk_aus.40.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]经历了400年的流离失所，最终恢复了旧时代的故土。"
 dsk_aus.40.f:0 "伟大的[SCOPE.GetRootScope.GetCountry.GetName]将会如一颗明珠永远在多瑙河上闪耀"
 dsk_aus.40.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁！"
dsk_aus.41.t:0 "天主教世界最后的屏障"
 dsk_aus.41.d:0 "400年过去了，我们终于在奥斯曼手中解放了多瑙河沿岸的国家！"
 dsk_aus.41.f:0 "伟大的[SCOPE.GetRootScope.GetCountry.GetName]将会作为天主教世界的屏障永远抵挡异教徒的入侵"
 dsk_aus.41.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]就是天主教之盾！"

dsk_aus.42.t:0 "匈牙利脱离奥地利成功独立！"
 dsk_aus.42.d:0 "这是历史性的时刻，多瑙河人民将牢记这一时间点，伟大的匈牙利摆脱了奥地利哈布斯堡王朝的束缚，最终独立建国！"
 dsk_aus.42.f:0 "独立之后，首先面对的是国家建设的问题"
 dsk_aus.42.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]将快速完成战后重建！"

great_Hungary_time:0 "在吞并克罗地亚后，我们的国家将会改名为#N大匈牙利#!"

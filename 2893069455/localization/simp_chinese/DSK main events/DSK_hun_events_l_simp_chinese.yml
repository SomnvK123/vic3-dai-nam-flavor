germany_time:0 "德意志时代"
pop_music1:0 "World War BGM"
je_reforms_of_habsburg:0 "哈布斯堡-洛林王朝"
je_reforms_of_habsburg_reason:0 "1740年10月20日，神圣罗马皇帝卡尔六世去世。奥地利哈布斯堡王朝绝嗣，由玛丽娅·特蕾莎与洛林公爵弗朗茨联姻，弗郎茨落选神圣罗马皇帝，但他的侄女婿，巴伐利亚选侯卡尔·阿尔布雷希特在反哈布斯堡同盟的支持下登上神圣罗马帝位，为卡尔七世。而这个同盟以立即以拒绝承认玛丽亚·特蕾西娅的继承权，发动奥地利王位继承战争。1745年1月20日，卡尔七世逝世。同年9月13日，玛丽娅·特蕾莎的夫婿弗朗茨当选神圣罗马皇帝，是为神圣罗马皇帝弗朗茨一世，令帝位落入哈布斯堡-洛林家族成员手中。1748年10月18日签定的《亚琛和约》，确认了弗朗茨皇帝、玛丽娅·特蕾莎皇后及他们的后裔对哈布斯堡-洛林家族领地的继承权。自弗朗茨当选神圣罗马皇帝后，将妻子的姓氏加在自己姓氏的前面，他们的后裔都采用“哈布斯堡-洛林”的姓氏。\n自此，开创哈布斯堡洛林皇朝，而弗朗茨皇帝和玛丽亚·特蕾西娅皇后成为皇朝的创始人"
FRA_republic1:0 "拿破仑政变"
FRA_republic1_desc:0 "拿破仑试图发动政变。他企图引诱高级军官参与政变，但并没有成功。此外，一位忠于共和政府的将军设法给陆军部发了一份电报，警告可能发生叛变"
je_spring_reforms:0 "自由,平等,博爱"
je_spring_reforms_reason:0 "法国革命给我们带来了经验：唯有建立自由平等博爱的政府才是未来的唯一道路"
je_Anti_French:0 "反法战争"
je_Anti_French_goal:0 "等待持续2年的战争准备时期"
je_Anti_French_reason:0 "很显然法国的革命影响到了欧洲大陆，作为欧洲旧秩序的守护者，我们必须重燃反法同盟热情，将这些民主化运动扼杀在摇篮里"
 je_hun_revolution:0 "匈牙利民族主义风潮"
 je_hun_revolution_goal:0 "在五年内没有触发内战并把分离主义控制在30%以下"
 je_hun_revolution_reason:0 "起初，这是一种民族自决提案，直到，这场革命变成了一场独立战争，其最终目的是把匈牙利从奥地利分裂出来，推翻君主制并宣布成立共和国。\n这些法国革命带来的激进的思想遭到欧洲大多数君主制的强烈反对，因此，我们应该彻底击败他们，将民主运动扼杀在摇篮里" 




spring_time:0 "我国的共和制革命的成功会在欧洲各国掀起民主运动，不过我们也要小心，仍然会有一些国家妄图摧毁我们的革命果实"


dsk_aus.1.t:0 "奥地利-匈牙利二元帝国的提案"
dsk_aus.1.d:0 "我们缓解了帝国最表面的危机，现在可以将奥地利-匈牙利二元帝国的方案提上日程"
dsk_aus.1.a:0 "我们是一个多民族的国家，如果不能缓和民族矛盾，发展会举步维艰"
modifier_reforms_of_AUS:0 "国家改革"
je_Hungarian_reforms:0 "民族矛盾"
je_Hungarian_reforms_reason:0 "1815年拿破仑倒台后，奥皇弗朗茨一世寻求恢复哈布斯堡对德意志地区霸权。恢复神圣罗马帝国已不可能，唯有仿效拿破仑，成立[concept_germany_country]。\n[concept_germany_country]的疆界和神圣罗马帝国在拿破仑称帝前时相若。但经过拿破仑多年的征战和兼并，属邦数目只有少于40个，远少于帝国的200个。各属邦联合防卫，组成邦联联军，共同维护美因茨、卢森堡、拉施塔特、乌尔姆和朗道等城邦。邦联议会设于法兰克福。领主为奥皇。\n虽然邦联得以组成，但德意志地区的情况和神圣罗马帝国末期一样松散，割据严重。而奥皇只能成为名义首领。而1834年，以普鲁士为首的属邦成立关税同盟，把奥地利逐出局外，削弱了奥地利帝国对德意志地区的经济驾驭。奥普的纷争日渐显现。\n此外，奥地利与匈牙利等民族矛盾日益凸显，民族问题严重制约了帝国的发展，在欧洲爆发人民之春革命后，多民族奥地利首当其冲。摆在奥地利面前的只有两条路，一条路改组帝国，承认匈牙利等在内的其他民族为帝国的主流，缓和国内尖锐的民族问题。一条路为继续保持德意志首领的地位，维持德意志民族为主体，甚至恢复神圣罗马鼎盛的版图，但这会使其他革命族渴求独立的倾向不断提高，是逆历史回到过去，还是顺应时代潮流改革帝国?"
dsk_aus.2.t:0 "历史的十字路口"
dsk_aus.2.d:0 "这是困扰帝国一百年来的问题，我们不得不在当代做出我们的选择"
dsk_aus.2.f:0 "在我们国家境内，没有任何民族的人口可以超过50%，我们无法绕过这个话题，我们无法闭口不谈民族矛盾"
dsk_aus.2.a:0 "告诉世界，奥地利将会在现在决定方向"
dsk_aus.2.b:0 "告诉世界，奥地利将会在现在决定方向"
German_Nation_desc:0 "在政府中支持德意志民族主义者"
dsk_aus.3.t:0 "公爵被拉拢成文化多元主义者"
dsk_aus.3.d:0 "他目睹了帝国境内各种不公"
dsk_aus.3.f:0 "也许帝国不能再按现状继续下去了，我们的发展需要这些“外来人”，奥地利人也应该和其余民族和平共处，我们的帝国强大于庞大的疆土，最后也会崩塌于庞大的疆土。"
dsk_aus.3.a:0 "他说的对。"
dsk_aus.4.t:0 "伯爵被拉拢成德意志民族主义者"
dsk_aus.4.d:0 "为什么要让这些外来人抢我们的工作？"
dsk_aus.4.f:0 "帝国是奥地利人的帝国，这些外来人凭什么和我们一起分享帝国的权利，我出生于这里，为我的帝国鞠躬尽瘁，而他们不知道是从哪冒出来的，仅仅通过流亡就可以和我们平起平坐，这样的事情，我不可接受。"
dsk_aus.4.a:0 "他说的对。"

l_simp_chinese:
 clever_dsk.1.t:0 "黄色炸药的发明"
 clever_dsk.1.d:0 "随着硝化甘油得到使用，#yellow 阿尔弗雷德·诺贝尔#!继续投入到炸药的研究中。不过这需要不少的资金来完成这项研究。"
 clever_dsk.1.f:0 "你看，那家伙的实验，把自己弟弟都炸死了。哦，他真是个疯子，希望政府别让他再害人了。"
 clever_dsk.1.a:0 "他的发明将为世界带来巨大的进步。"
 clever_dsk.1.b:0 "禁止他研究这类危险品。"
 clever_dsk.2.t:0 "流水线的发明"
 clever_dsk.2.d:0 "在一次观察屠夫杀牛的经历中，实业家领袖#yellow 亨利·福特#!得到了启发，尝试发明流水线。不过这需要一些资金来完成这项研究。"
 clever_dsk.2.f:0 "在生产流水线的设计上，只需要按工序将工具、人排列起来，就能够在尽量短的时间内完成汽车零配件的装配。"
 clever_dsk.2.a:0 "这能提高汽车的生产效率。"
 clever_dsk.2.b:0 "我们没有资金提供这种荒唐的想法。"
 clever_dsk.3.t:0 "重建颐和园"
 clever_dsk.3.d:0 "太后#yellow 叶赫那拉#!计划重修颐和园，以庆祝她的六十大寿，眼下各路官员正等待皇帝的圣旨。"
 clever_dsk.3.f:0 "这笔钱，就当我孝敬#yellow 老佛爷#!的。可是海军怎么办？唉，你不懂，海军哪有老佛爷高兴重要啊？"
 clever_dsk.3.a:0 "以海军捐款的名义，向各地筹募海军军费来修颐和园。"
 clever_dsk.3.b:0 "列强还在我国有条约港，我们更需要资金强化国防。"
 clever_dsk.4.t:0 "甲申易枢"
 clever_dsk.4.d:0 "自辛酋政变后，恭亲王奕訢和太后叶赫那拉权力斗争愈演愈烈，恭亲王逐渐落入下风。"
 clever_dsk.4.f:0 "你听说了吗，太后要罢黜恭亲王，换醇亲王进入军机处。哦，我已经是醇党的人了。"
 clever_dsk.4.a:0 "恭亲王奕訢和他的军机处成员全被罢斥。"
 clever_dsk.4.b:0 "皇帝试图保住恭亲王。"
 clever_dsk.5.t:0 "取缔义和团要求"
 clever_dsk.5.d:0 "由于列强对中国侵略的不断深入，#yellow 义和团运动#!在我国迅猛发展，团民们已经攻进了条约港租界。各国公使要求我国取缔义和团。"
 clever_dsk.5.f:0 "我朝二百数年，深仁厚泽，凡远人来中国者，列祖列宗罔不待以怀柔。讵三十年来，恃我国仁厚，一意拊循，彼乃益肆枭张，欺临我国家，侵占我土地，蹂躏我人民，勒索我财物。与其苟且图存，贻羞万古，孰若大张鞑伐，一决雌雄。"
 clever_dsk.5.a:0 "向英吉利国，开战！向法兰西国，开战！向美利坚国，开战！向德意志国，开战！向俄罗斯国，开战！向意大利国，开战！向奥地利国，开战！向日本国，开战！"
 clever_dsk.5.b:0 "我们不能得罪洋人，赶紧劝太后取缔这群拳民。"
 clever_dsk.6.t:0 "万国宣战诏书"
 clever_dsk.6.d:0 "清国的义和团拳民们在条约港租界大肆破坏，各国公使见无法说服清国政府镇压拳民，调兵前往北京，这引起清国对我们的宣战。"
 clever_dsk.6.f:0 "义和团已经开始围困#yellow 东交民巷#!和#yellow 西什库教堂#!，当地使馆人员向我们提出加强保护的请求，需要尽快做出决定。"
 clever_dsk.6.a:0 "保护我们在中国的使馆和利益。"
 clever_dsk.6.b:0 "我们不该参与这场侵略性的战争。"
 clever_dsk.14.t:0 "改组政府"
 clever_dsk.14.d:0 "随着革命在中国取得了成功，#yellow 孙中山#!打算任用一批以三民主义为主导思想的政治家、青年和军人，改组政府以统一政治思想。"
 clever_dsk.14.f:0 "今日在座诸君，有东京法政学堂的高材生，有横滨商会的实业家，有穿着和服却怀揣《革命军》的留学生。我要问：你们可敢接过陈天华的笔？可愿化作秋瑾的剑？\n\n民生主义不是均贫富的妄言，是要让广东缫丝女工每日劳作不过八时辰，让川汉铁路的股权不落外国银行之手！\n\n从甲午到庚子，我们失去的不仅是国土银两，更是做人的尊严。今日愿诸君与我立约：不令祖宗蒙羞于地下，不使子孙为奴于将来。不论身在何处，只要心中有三民主义的火种，便是与我并肩的同志！"
 clever_dsk.14.a:0 "民族！民权！民生！"
 clever_dsk.14.b:0 "阻止他。"
 clever_dsk.15.t:0 "齐默尔曼电报"
 clever_dsk.15.d:0 "#yellow 英国#!外交大臣出于对我国的友好，向我方大使披露了他们截获的德国驻墨西哥大使的一份电报。"
 clever_dsk.15.f:0 "我们计划于2月1日开始实施无限制潜艇战。与此同时，我们将竭力使美国保持中立。如计划失败，我们建议在下列基础上同墨西哥结盟：协同作战；共同缔结和平。墨西哥将重新收复在新墨西哥州、得克萨斯州，和亚利桑那州失去的国土。建议书的细节由你们草拟。"
 clever_dsk.15.a:0 "把电报内容交给国内媒体，向反对派制造舆论压力，并准备对德作战。"
 clever_dsk.15.b:0 "我们不要声张。"
 clever_dsk.16.t:0 "向塞尔维亚的复仇"
 clever_dsk.16.d:0 "我们的盟友已经向仇敌塞尔维亚开战，是该继续保持中立还是加入这场战争？"
 clever_dsk.16.f:0 "沙皇对上次战争未能收复马其顿地区耿耿于怀，现在塞尔维亚已经穷途末路，是时候向它复仇了。"
 clever_dsk.16.a:0 "为了大保加利亚！"
 clever_dsk.16.b:0 "国内政党和议员强烈抗议和反对参与战争。"
 clever_dsk.17.t:0 "军舰被扣留"
 clever_dsk.17.d:0 "英国海军大臣没收了两艘我国付款订购的战列舰，理由是战时无偿征用，并且不提供补偿。这让捐款参与买战舰的人民非常愤怒，走上街头游行示威。"
 clever_dsk.17.f:0 "妈妈，我们为什么要捐钱呀？孩子，只有买了这两艘船，才能保护我们的国家。"
 clever_dsk.17.a:0 "帕夏决定顺应民情，加入同盟国的战争。"
 clever_dsk.17.b:0 "默认事实，压住民怨。"
 clever_dsk.18.t:0 "特兰西瓦尼亚问题"
 clever_dsk.18.d:0 "世界大战已经爆发，同盟国似乎已经进入了颓势，特兰西瓦尼亚地区现在唾手可得。"
 clever_dsk.18.f:0 "你，特兰西瓦尼亚，我们是你的士兵。圣寺啊圣寺，阿普塞尼山，你是我们的家园。"
 clever_dsk.18.a:0 "越过喀尔巴阡山，加入协约国的战争。"
 clever_dsk.18.b:0 "放弃加入战争。"
 clever_dsk.19.t:0 "协约国的拉拢"
 clever_dsk.19.d:0 "为打破僵持的战争局面，协约国向我们抛来橄榄枝，许诺如果加入他们的战争，胜利之后南蒂罗尔、特兰提诺、达尔马提亚均划入我国领土。"
 clever_dsk.19.f:0 "首相坚持认为这是一场不义之战，不应参与。并且其规模之大，若是贸然参战，将会使意大利统一以来的成果付诸东流。"
 clever_dsk.19.a:0 "同意协约国开出的条件，立即准备开战。"
 clever_dsk.19.b:0 "压住主战的浪潮，意大利会恪守中立。"
 clever_dsk.20.t:0 "[SCOPE.sCountry('american_give_help_scope').GetName]参战"
 clever_dsk.20.d:0 "我国外交大使收到[SCOPE.sCountry('american_give_help_scope').GetName]参与协约国战争的消息。"
 clever_dsk.20.f:0 "受到齐默尔曼电报舆论的发酵，美国已决定参与协约国的战争。"
 clever_dsk.20.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.21.t:0 "[SCOPE.sCountry('bulgaria_give_help_scope').GetName]参战"
 clever_dsk.21.d:0 "我国外交大使收到[SCOPE.sCountry('bulgaria_give_help_scope').GetName]参与同盟国战争的消息。"
 clever_dsk.21.f:0 "沙皇对未能收复大保加利亚的所有领土耿耿于怀，决心参与这场战争。"
 clever_dsk.21.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.22.t:0 "[SCOPE.sCountry('turkish_give_help_scope').GetName]参战"
 clever_dsk.22.d:0 "我国外交大使收到[SCOPE.sCountry('turkish_give_help_scope').GetName]参与同盟国战争的消息。"
 clever_dsk.22.f:0 "英国海军大臣扣留了[SCOPE.sCountry('turkish_give_help_scope').GetName]向其购买的两艘战舰，土耳其人丢掉了尊严。为反抗协约国的瓜分，[SCOPE.sCountry('turkish_give_help_scope').GetName]决定参与战争。"
 clever_dsk.22.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.23.t:0 "[SCOPE.sCountry('romania_give_help_scope').GetName]参战"
 clever_dsk.23.d:0 "我国外交大使收到[SCOPE.sCountry('romania_give_help_scope').GetName]参与协约国战争的消息。"
 clever_dsk.23.f:0 "罗马尼亚为收复特兰西瓦尼亚地区，参与了协约国的战争。"
 clever_dsk.23.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.24.t:0 "[SCOPE.sCountry('italy_give_help_scope').GetName]参战"
 clever_dsk.24.d:0 "我国外交大使收到[SCOPE.sCountry('italy_give_help_scope').GetName]参与协约国战争的消息。"
 clever_dsk.24.f:0 "协约国许诺战争胜利后，将#yellow 南蒂罗尔#!、#yellow 特兰提诺#!、#yellow 达尔马提亚#!划入[SCOPE.sCountry('italy_give_help_scope').GetName]的领土，这导致意大利决心加入协约国一方。"
 clever_dsk.24.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.25.t:0 "城市的兴起"
 clever_dsk.25.d:0 "我们国家工业正得到快速发展，一些资本家和工程师试图挖掘本地潜藏的资源，建立起更多的工业城市。"
 clever_dsk.25.f:0 "鸡笼、宁波、郴州、南平、三亚、无锡、襄阳、咸宁、镇江、淮阴、临夏、敦煌、金昌、墨竹工卡、拉孜、乌恰、阿克苏、德鲁日巴 ... 从丘陵遍布的南方，到黄沙万里的北方，无数新的地名出现在了地图上。"
 clever_dsk.25.a:0 "鼓励建设新的城市。"
 clever_dsk.25.b:0 "城市只会带来污染，我们要去城市化。"
 clever_dsk.26.t:0 "借道比利时"
 clever_dsk.26.d:0 "按照施里芬计划，要想速胜法国，需要绕道#yellow 比利时#!，迅速拿下布鲁塞尔攻入法国境内。"
 clever_dsk.26.f:0 "如果我们不提前派遣军队进入比利时国土，法国可能会通过比利时国境进犯我们的国家。"
 clever_dsk.26.a:0 "向比利时发出最后通牒，要求我们军队借道。"
 clever_dsk.26.b:0 "我们尊重#yellow 比利时#!的主权与中立。"
 clever_dsk.27.t:0 "来自德国的最后通牒"
 clever_dsk.27.d:0 "德国声称收到可靠情报，法国欲通过比利时国境进犯德国的意图已不容置疑，不指望我国军队能阻止法军前进。因此，他们为了自卫想提前派军队进入我国领土。"
 clever_dsk.27.f:0 "如果反对德国通过我们的领土，我们将被视为它的敌对国，今后两国关系只能听枪炮决定了。"
 clever_dsk.27.a:0 "比利时是一个国家，不是一条道路。"
 clever_dsk.27.b:0 "屈服于德国的大炮，这会引起法国的一些行动。"
 clever_dsk.28.t:0 "[SCOPE.sCountry('belgium_give_help_scope').GetName]被迫参战"
 clever_dsk.28.d:0 "#yellow 比利时#!政府拒绝了德国军队借道的请求，德国发动了与#yellow 比利时#!的战争。"
 clever_dsk.28.f:0 "这个诞生于1830年革命烽火中的国家，从未在强权面前屈膝。我们的祖父用鲜血浇铸的中立地位，不是给#yellow 普鲁士人#!铺就的侵略跳板！\n\n昨日黎明，第三军团的钢铁洪流碾过了马斯河。但请记住：每座被摧毁的桥梁下，都有二十个比利时工兵的血肉；每条被争夺的铁路旁，都立着宁死不退的国民警卫队...\n\n从今日起，王宫地窖的五十万金法郎将变成战地医院的药品，议会大厦的大理石柱将熔铸成手雷弹片。当最后一座风车被炸毁，我们就用磨盘作战垒；当最后一发子弹耗尽，科特赖克市民的镰刀会继续收割侵略者！"
 clever_dsk.28.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.29.t:0 "[SCOPE.sCountry('belgium_give_help_scope').GetName]卷入战争"
 clever_dsk.29.d:0 "比利时政府拒绝了德国军队借道的请求，德国发动了与比利时的战争，这已然违反了伦敦条约。"
 clever_dsk.29.f:0 "根据#yellow 伦敦条约#!，我们有义务捍卫比利时的中立。比利时大使请求我们履行条约，对德作战。"
 clever_dsk.29.a:0 "立即派遣远征军救援[SCOPE.sCountry('belgium_give_help_scope').GetName]。"
 clever_dsk.29.b:0 "放弃救援[SCOPE.sCountry('belgium_give_help_scope').GetName]。"
 clever_dsk.29.c:0 "继续加大作战兵力。"
 clever_dsk.30.b:0 "禁止他继续使用毒气作战。"
 clever_dsk.31.t:0 "维也纳的求助电报"
 clever_dsk.31.d:0 "#yellow 奥地利#!总部传来电报，声称他们兵力无法支撑四面八方的战线，请求我们派遣军队支援。"
 clever_dsk.31.f:0 "东线密密麻麻的灰色牲口正向加利西亚发起冲锋，如果我们不派兵支援，奥地利有可能会成为我们的突破口。"
 clever_dsk.31.a:0 "赶紧派遣军队稳住奥地利的战线。"
 clever_dsk.31.b:0 "我们不愿背着一具僵尸打仗。"
 clever_dsk.32.t:0 "柏林的回应"
 clever_dsk.32.d:0 "柏林传来电报，他们同意派遣军队支援我们的战线。"
 clever_dsk.32.f:0 "这是德意志人的团结，我们将抵御共同的敌人。"
 clever_dsk.32.a:0 "作为盟友，我们也应该派兵支援西线。"
 clever_dsk.32.b:0 "灰色牲口将被我们无情地粉碎。"
 clever_dsk.33.t:0 "人口交换？"
 clever_dsk.33.d:0 "由于我们与希腊糟糕的关系，一批希腊人试图逃离我们国家，或许可以顺水推舟，与希腊政府签订人口交换协定，接回海外的土耳其同胞。"
 clever_dsk.33.f:0 "既然希腊人不愿留在我们国家，那就把他们送回自己的祖国；当然，希腊政府也有义务将其境内的土耳其人送回我们的国家。"
 clever_dsk.33.a:0 "签订《希土间交换居民专约和议定书》，通知希腊换回土耳其民众。"
 clever_dsk.33.b:0 "挽留国内希腊精英。"
 clever_dsk.34.t:0 "人口交换"
 clever_dsk.34.d:0 "土耳其政府邀请我们签订《希土间交换居民专约和议定书》，以交换两国土耳其和希腊民族的人口。"
 clever_dsk.34.f:0 "许多希腊同胞已经收拾好物品，离开了土耳其，前往了我们的首都。或许我们也应该把境内不安分的土耳其人送回他们的国家。"
 clever_dsk.34.a:0 "这是提高我们主体民族比例的好机会。"
 clever_dsk.34.b:0 "不同意议定书。"
 clever_dsk.35.t:0 "希腊政府的回应"
 clever_dsk.35.d:0 "希腊政府同意签署《希土间交换居民专约和议定书》，一批批海外的土耳其人正回到他们伟大的祖国。"
 clever_dsk.35.f:0 "今天的首都格外热闹，民众积极帮助回国的同胞，建设他们的新家园。"
 clever_dsk.35.a:0 "为我们首都的新同胞安排好住所。"
 clever_dsk.36.t:0 "流浪的文莱统治者"
 clever_dsk.36.d:0 "文莱苏丹国已经不复存在了，但文莱统治者仍希望征服者能给他提供一个居所，作为回报，他会帮助我们安抚当地居民。"
 clever_dsk.36.f:0 "16世纪中叶开始，欧洲国家相继入侵文莱。如今文莱惨遭灭国，当地居民十分愤慨，计划起义反抗征服者。"
 clever_dsk.36.a:0 "将文莱纳入受保护国，给它提供一个小地块，以稳定婆罗洲民心。"
 clever_dsk.36.b:0 "被征服者无权提出要求。"
 clever_dsk.36.c:0 "是需要一个听话的代理人。"
 clever_dsk.37.t:0 "吞并复活节岛"
 clever_dsk.37.d:0 "智利政府私自派遣军队控制了复活节岛，并声称该岛是一块无主之地，现已划入智利领土，希望国际社会能够给予认可。"
 clever_dsk.37.f:0 "拉努帕伊人既被秘鲁殖民者抓去做了奴隶，又被法国传教士试图摧毁文化。巨大的摩艾石像啊，你能庇护特凯恩加的子民吗？"
 clever_dsk.37.a:0 "认可智利占领该岛。"
 clever_dsk.37.b:0 "复活节岛是我们的，智利没有权利吞并它。"
 clever_dsk.38.t:0 "理应晋升"
 clever_dsk.38.d:0 "军队里有一名将领最近在一次战斗中带头冲锋，成功解决兵变，同僚评价他治军严肃，调度有方。现在，部分军官请求提高他的军衔。"
 clever_dsk.38.f:0 "军官和士兵们都在赞扬袁世凯的坚毅勇敢，纷纷支持他获得晋升。"
 clever_dsk.38.a:0 "晋升袁世凯。"
 clever_dsk.38.b:0 "他的军事能力还有待观察。"
 clever_dsk.39.t:0 "步入政坛？"
 clever_dsk.39.d:0 "得益于陆军大将袁世凯的功劳，一些官员推荐他成为军队领袖，这样能更好地管理我们的军队。"
 clever_dsk.39.f:0 "袁世凯建立和指挥的新军，有着一套完整的组织编制制度、军官任用和培养制度，是我们军队中的佼佼者。政治家们为拉拢这股力量，向他递上橄榄枝。"
 clever_dsk.39.a:0 "我们需要他这样的人才。"
 clever_dsk.39.b:0 "反对他进入政坛。"
 clever_dsk.40.t:0 "总统人选"
 clever_dsk.40.d:0 "随着清帝的退位，新生的共和国建立，针对由谁来出任总统一职，政府内阁产生了激烈的讨论。此时，一位将军走进了会议厅。"
 clever_dsk.40.f:0 "鉴于袁世凯担任军队领袖，掌握着众多军队，临时政府担忧反对他成为总统，会引发南北战争，造成生灵涂炭。"
 clever_dsk.40.a:0 "袁大总统将带领我们走向共和。"
 clever_dsk.40.b:0 "坚决阻止他成为总统。"
 clever_dsk.41.t:0 "称帝？"
 clever_dsk.41.d:0 "受困于政局混乱，以及部分人士的劝谏和支持的影响，总统袁世凯试图复辟帝制，实行君主立宪。"
 clever_dsk.41.f:0 "大多数之人民智识不甚高尚，由专制一变而为共和，此诚太骤之举动，中国将来必因总统继承问题，酿成祸乱......如一时不即扑灭，或驯至败坏中国之独立。中国如用君主制，较共和制为宜，此殆无可疑者也。"
 clever_dsk.41.a:0 "恭迎洪宪皇帝。"
 clever_dsk.41.b:0 "共和国永不灭亡。"
 clever_dsk.42.t:0 "[SCOPE.sCountry('british_haha_help_scope').GetName]参战"
 clever_dsk.42.d:0 "我国外交大使收到[SCOPE.sCountry('british_haha_help_scope').GetName]为履行伦敦条约，保护比利时，而参与协约国西线战争的消息。"
 clever_dsk.42.f:0 "我认为我应该受到诅咒，因为我喜欢这场战争，我知道它每时每刻都在粉碎和撕裂成千上万人的生命，然而我无法控制，我享受它发生的每一秒钟。——温斯顿·丘吉尔"
 clever_dsk.42.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.43.t:0 "[concept_overlord]要求参战"
 clever_dsk.43.d:0 "我们的[concept_overlord][SCOPE.sCountry('grandmother_need_our_help_scope').GetName]已经卷入了一场规模空前的战争，现在命令我们即刻动员士兵，前去辅助作战。"
 clever_dsk.43.f:0 "一百年后，人们会看到这场战争是多么的可怕、多么的无意义。"
 clever_dsk.43.a:0 "立刻动员军队。"
 clever_dsk.43.b:0 "我们没有能力派遣军队。"
 clever_dsk.44.t:0 "[SCOPE.sCountry('we_help_our_mother_scope').GetName]参战"
 clever_dsk.44.d:0 "[SCOPE.sCountry('we_help_our_mother_scope').GetName]宣布加入协约国的战争，保卫宗主[SCOPE.sCountry('grandmother_need_our_help_scope').GetName]。"
 clever_dsk.44.f:0 "一百年后，人们会看到这场战争是多么的可怕、多么的无意义。"
 clever_dsk.44.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.45.t:0 "参与战争？"
 clever_dsk.45.d:0 "世界上主要国家已经卷入了一场规模巨大的战争，也许我们也可以参与进去，获取利益和国际地位。"
 clever_dsk.45.f:0 "军事部长认为，现在协约国处于优势，建议我们加入它们，才能获得胜利。"
 clever_dsk.45.a:0 "派遣部分军队支援协约国。"
 clever_dsk.45.b:0 "珍惜来之不易的和平。"
 clever_dsk.46.t:0 "[SCOPE.sCountry('we_help_our_friends_scope').GetName]参战"
 clever_dsk.46.d:0 "[SCOPE.sCountry('we_help_our_friends_scope').GetName]宣布加入协约国的战争，以获取更高的国际地位。"
 clever_dsk.46.f:0 "一百年后，人们会看到这场战争是多么的可怕、多么的无意义。"
 clever_dsk.46.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.48.t:0 "东线的求救"
 clever_dsk.48.d:0 "[SCOPE.sCountry('come_to_help_russian_scope').GetName]外交大使表示他们的军队在东线遇到了颓势，希望我们能够兵力支援。"
 clever_dsk.48.f:0 "从梅梅尔到加利西亚，双方的士兵在漫长的战线上残酷相杀，俄国目前处于劣势，急需派兵稳固他们的战线。"
 clever_dsk.48.a:0 "派遣远征军，参与东线战争。"
 clever_dsk.48.b:0 "默认东线现状。"
 clever_dsk.49.t:0 "[SCOPE.sCountry('britain_now_to_russian_scope').GetName]参与东线作战"
 clever_dsk.49.d:0 "我们驻英大使报告，[SCOPE.sCountry('britain_now_to_russian_scope').GetName]已决定帮助[SCOPE.sCountry('come_to_help_russian_scope').GetName]，参与东线战事。"
 clever_dsk.49.f:0 "一百年后，人们会看到这场战争是多么的可怕、多么的无意义。"
 clever_dsk.49.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.50.t:0 "[SCOPE.sCountry('american_give_help_scope').GetName]参战"
 clever_dsk.50.d:0 "我国外交大使收到[SCOPE.sCountry('american_give_help_scope').GetName]参与协约国战争的消息。"
 clever_dsk.50.f:0 "我们外交部长发给墨西哥关于结盟对抗美国的电报，遭到英国破解。[SCOPE.sCountry('american_give_help_scope').GetName]社会对电报内容表示愤慨，这导致[SCOPE.sCountry('american_give_help_scope').GetName]加入了这场战争。"
 clever_dsk.50.a:0 "糟糕！"
 clever_dsk.51.t:0 "欧洲大战"
 clever_dsk.51.d:0 "欧洲现在陷入了一场规模庞大的战争，许多国家的士兵倒在了堑壕。各国急需人力来取得这场大战的胜利，或许这是改善我们与欧洲国家关系的机会。"
 clever_dsk.51.f:0 "军事部长认为，现在加入协约国作战，未来战争胜利能提高国际地位，改善我们与欧洲国家的关系。这有助于中国获得国际话语权。"
 clever_dsk.51.a:0 "参与战争，但以派遣劳工为主。"
 clever_dsk.51.b:0 "维持国内和平。"
 clever_dsk.52.t:0 "[SCOPE.sCountry('chinese_come_to_europe_scope').GetName]参战"
 clever_dsk.52.d:0 "我国外交大使收到[SCOPE.sCountry('chinese_come_to_europe_scope').GetName]参与协约国战争的消息。"
 clever_dsk.52.f:0 "中国统治者决定参与这场战争。在他们士兵到达之前，许多中国劳工匆匆搭上轮船，抵达法国首都，负责搬运物资、战壕挖掘、搬运伤兵等工作。"
 clever_dsk.52.a:0 "胜利的天平将向一方倾斜。"
 clever_dsk.53.t:0 "巴以分治"
 clever_dsk.53.d:0 "以色列成功建国，回到了应许之地。但当地的阿拉伯人严重抗议我们侵占了他们的土地，或许我们应该听从国际要求，实现两国分治？"
 clever_dsk.53.f:0 "世界主流国家要求我们将巴勒斯坦划分为两个国家，一个为犹太国家，一个为阿拉伯国家。如果不履行，这将加剧两族居民之间的冲突。"
 clever_dsk.53.a:0 "我们需要相互和解。"
 clever_dsk.53.b:0 "没有一个新的阿拉伯国家。"
 clever_dsk.54.t:0 "巴以分治"
 clever_dsk.54.d:0 "巴勒斯坦成功独立，但当地的犹太人严重抗议我们建国举动。或许我们应该听从国际要求，实现两国分治？"
 clever_dsk.54.f:0 "世界主流国家要求我们将巴勒斯坦划分为两个国家，一个为犹太国家，一个为阿拉伯国家。如果不履行，这将加剧两族居民之间的冲突。"
 clever_dsk.54.a:0 "我们需要相互和解。"
 clever_dsk.54.b:0 "没有一个新的犹太人国家。"
 clever_dsk.55.c:0 "鼓励他更好地为政府工作。"
 clever_dsk.57.t:0 "巴尔干战争爆发"
 clever_dsk.57.d:0 "塞尔维亚和土耳其人的战争爆发，也许我们应该帮助塞尔维亚，以获取更多的敌人领土。"
 clever_dsk.57.f:0 "还有希腊同胞在接受土耳其人的奴役统治，民众期望我们采取实际行动，去解救他们。"
 clever_dsk.57.a:0 "被压迫的巴尔干同胞们联合起来！"
 clever_dsk.57.b:0 "我们没有准备好战争。"
 clever_dsk.58.f:0 "还有保加利亚同胞在接受土耳其人的奴役统治，民众期望我们采取实际行动，去解救他们。"
 clever_dsk.59.f:0 "还有塞尔维亚同胞在接受土耳其人的奴役统治，民众期望我们采取实际行动，去解救他们。"
 clever_dsk.60.t:0 "[SCOPE.sCountry('greek_can_help_serbia_scope').GetName]参与巴尔干战争"
 clever_dsk.60.d:0 "我国外交大使收到[SCOPE.sCountry('greek_can_help_serbia_scope').GetName]参与巴尔干战争的消息。"
 clever_dsk.60.f:0 "巴尔干国家们为反抗土耳其人的残暴统治，开始联合起来进攻土耳其。"
 clever_dsk.60.a:0 "胜利的天平将向一方倾斜"
 clever_dsk.61.t:0 "[SCOPE.sCountry('bulgarian_can_help_serbia_scope').GetName]参与巴尔干战争"
 clever_dsk.61.d:0 "我国外交大使收到[SCOPE.sCountry('bulgarian_can_help_serbia_scope').GetName]参与巴尔干战争的消息。"
 clever_dsk.61.f:0 "巴尔干国家们为反抗土耳其人的残暴统治，开始联合起来进攻土耳其。"
 clever_dsk.61.a:0 "胜利的天平将向一方倾斜"
 clever_dsk.62.t:0 "[SCOPE.sCountry('mon_can_help_serbia_scope').GetName]参与巴尔干战争"
 clever_dsk.62.d:0 "我国外交大使收到[SCOPE.sCountry('mon_can_help_serbia_scope').GetName]参与巴尔干战争的消息。"
 clever_dsk.62.f:0 "巴尔干国家们为反抗土耳其人的残暴统治，开始联合起来进攻土耳其。"
 clever_dsk.62.a:0 "胜利的天平将向一方倾斜"
 clever_dsk.63.t:0 "君士坦丁堡问题"
 clever_dsk.63.d:0 "我们从土耳其人手中夺取了整个东色雷斯，当然包括罗马帝国的千年古都——君士坦丁堡。然而考虑均势的需要，英法两国要求我们归还东色雷斯部分地区给土耳其。"
 clever_dsk.63.f:0 "东色雷斯的土耳其人，试图反抗我们的统治。如果我们拒绝归还部分地区，这不仅会引起土耳其人骚乱，而且会恶化我们与英法两国关系。"
 clever_dsk.63.a:0 "接受英法两国的要求。"
 clever_dsk.63.b:0 "拒绝吐出战果。"
 clever_dsk.64.t:0 "[SCOPE.sCountry('give_some_thrace_to_turkish_scope').GetName]宣布撤离君士坦丁堡"
 clever_dsk.64.d:0 "[SCOPE.sCountry('give_some_thrace_to_turkish_scope').GetName]接受列强调解，决定军队撤离君士坦丁堡，归还部分地区给土耳其人。"
 clever_dsk.64.f:0 "土耳其乃欧洲一病夫，他的命运便是听凭列强瓜分。"
 clever_dsk.64.a:0 "君士坦丁堡未来的命运会如何？"
 clever_dsk.65.t:0 "遭遇虐待的橡胶工人"
 clever_dsk.66.t:0 "[SCOPE.sCountry('bel_kill_drc_people_scope').GetName]橡胶工人被虐待"
 clever_dsk.66.d:0 "[SCOPE.sCountry('bel_kill_drc_people_scope').GetName]对工作不达标的橡胶工人，进行肢体虐待，轻则遭遇鞭笞，重则砍手砍脚，甚至杀害他们的亲人以作警告。这严重冲击了人类的伦理道德。"
 clever_dsk.66.f:0 "[SCOPE.sCountry('bel_kill_drc_people_scope').GetName]的野蛮行径消息传到了我们国家，给民众带来极大的震撼，声讨[SCOPE.sCountry('bel_kill_drc_people_scope').GetName]的暴行。"
 clever_dsk.66.a:0 "谴责[SCOPE.sCountry('bel_kill_drc_people_scope').GetName]。"
 clever_dsk.66.b:0 "默不作声。"
 clever_dsk.67.t:0 "[SCOPE.sCountry('condemn_bel_kill_drc_scope').GetName]的谴责"
 clever_dsk.67.d:0 "[SCOPE.sCountry('condemn_bel_kill_drc_scope').GetName]对我们虐待橡胶工人的暴行，发出了严厉的谴责。"
 clever_dsk.67.f:0 "有部分传教士揭露了我们虐待橡胶工人的"暴行"，将消息传播到了欧洲。各国社会媒体，甚至知名文学家都在谴责我们的行为。"
 clever_dsk.67.a:0 "还不是他们不够努力？"
 clever_dsk.68.t:0 "开化建设？"
 clever_dsk.68.d:0 "国王利奥波德结识了一名叫亨利·莫顿·斯坦利的探险家。探险家声称有一片刚果河流域的土地，当地土著还未接受开化。希望国王资助他前去传播文明。"
 clever_dsk.68.f:0 "探险家滔滔不绝地为国王讲述如何为刚果土著提供人道救助，帮助他们洗礼，进入文明社会。国王同意赞助他，想给自己带来慈善家的好名声。"
 clever_dsk.68.a:0 "议会支持国王派人前去开化建设。"
 clever_dsk.68.b:0 "议会否决国王鲁莽的行为。"
 clever_dsk.69.d:0 "政府人员最近接触到一名叫亨利·莫顿·斯坦利的探险家。探险家声称有一片刚果河流域的土地，当地土著还未接受开化。希望能够资助他前去传播文明。"
 clever_dsk.69.f:0 "探险家滔滔不绝地为国王讲述如何为刚果土著提供人道救助，帮助他们洗礼，进入文明社会。如果同意赞助他，或许能获取巨额财富。"
 clever_dsk.69.a:0 "资助他前去开化建设。"
 clever_dsk.69.b:0 "拒绝殖民。"
 clever_dsk.70.t:0 "比利时殖民刚果"
 clever_dsk.70.d:0 "[SCOPE.sCharacter('bel_leopold_II_saxe_gotha_scope').GetFullName]资助了一名叫亨利·莫顿·斯坦利的探险家，进入刚果河流域，用枪炮逼迫当地酋长们签订霸王条款，转让土地。列强们因为利益问题冲突，同意比利时占领殖民该地。由于土地辽阔，他们设立了刚果自由邦来管理。"
 clever_dsk.70.f:0 "强迫刚果人收集象牙不是为了赚钱，而是为了教化他们从懒惰中解放。——[SCOPE.sCharacter('bel_leopold_II_saxe_gotha_scope').GetFullName]"
 clever_dsk.70.a:0 "刚果自由邦真的"自由"吗？"
 clever_dsk.71.t:0 "风暴将至"
 clever_dsk.71.d:0 "义和团运动在中华大地上发展迅速，他们烧毁教堂、拆掉电线，甚至攻入条约港租界。几个国家外交大使致电清国政府取缔义和团，似乎没有得到同意。"
 clever_dsk.71.f:0 "如果清国不能镇压这些暴民，列强很有可能会亲自派遣军队，实施"维和"行动，保护他们的在华利益。"
 clever_dsk.71.a:0 "接下来会发生什么？"
 clever_dsk.74.t:0 "击沉卢西塔尼亚号"
 clever_dsk.74.d:0 "[SCOPE.sCharacter('war_crimes_admiral').GetFullName]击沉了客船卢西塔尼亚号，船上115名美国人遇难。虽然我们事先警告过会袭击一切与协约国往来船只，但这仍引起美国对我们的严正抗议，要求我们禁止袭击商船。"
 clever_dsk.74.f:0 "军方坚持认为[SCOPE.sCharacter('war_crimes_admiral').GetFullName]行为正确，而文官政府建议向美国代表道歉，限制潜艇战，以挽救我们糟糕的国际形象。"
 clever_dsk.74.a:0 "[SCOPE.sCharacter('war_crimes_admiral').GetHerHim]做的正确。"
 clever_dsk.74.b:0 "公开向美国致歉。"
 clever_dsk.75.t:0 "卢西塔尼亚号沉没"
 clever_dsk.75.d:0 "德国潜艇击沉了英国邮轮#yellow 卢西塔尼亚号#!，造成千人遇难，其中包括#yellow 115名美国人#!。[SCOPE.sCountry('luxitaniya_sinking_scope').GetName]社会强烈谴责战犯[SCOPE.sCharacter('war_crimes_admiral').GetFullName]和实施无限制潜艇战的德国政府。"
 clever_dsk.75.f:0 "迫于国际社会的舆论压力，德国政府向[SCOPE.sCountry('luxitaniya_sinking_scope').GetName]代表公开道歉，但这不意味着袭击商船的行为会结束。"
 clever_dsk.75.a:0 "向[SCOPE.sCountry('luxitaniya_sinking_scope').GetName]发出慰问电报。"
 clever_dsk.75.b:0 "死得好！为什么不多死点#yellow 美国人#!呢？"
 clever_dsk.76.t:0 "优秀的军官"
 clever_dsk.76.d:0 "[SCOPE.sCharacter('petain_scope').GetFullName]在一次战斗中，成功阻击了敌人的进攻。他"多用钢铁，少流血"的战略思想，也为他赢得了士兵的尊敬。"
 clever_dsk.76.f:0 "[SCOPE.sCharacter('petain_scope').GetFullName]优秀的防御策略，和他采取的轮换制，有效地提高了我们士兵的战斗力。"
 clever_dsk.76.a:0 "提拔[SCOPE.sCharacter('petain_scope').GetFullName]为元帅。"
 clever_dsk.76.b:0 "继续观察他的表现。"
 clever_dsk.77.t:0 "阳光下的土地"
 clever_dsk.77.d:0 "[SCOPE.sCharacter('william_II_want_africa_scope').GetFullName]十分眼红其余列强广阔的非洲殖民地，眼下他计划尝试说服政府人员，参与到瓜分非洲的队伍中。"
 clever_dsk.77.f:0 "争夺非洲的土地，能获取新的原料来源、新的产品销售市场，缓解当前市场饱和的问题。同时，这也有助于建立以德国为中心的世界秩序。"
 clever_dsk.77.a:0 "派遣殖民者去获得"阳光下的土地"。"
 clever_dsk.77.b:0 "阻止[SCOPE.sCharacter('william_II_want_africa_scope').GetFullName]冒进的行为。"
 clever_dsk.78.t:0 "德属非洲殖民地建立"
 clever_dsk.78.d:0 "[SCOPE.sCountry('german_william_want_africa_scope').GetName]的[SCOPE.sCharacter('william_II_want_africa_scope').GetFullName]尝试加入到殖民非洲的队伍中，他们已经迫使几个部落的酋长签订条约，占领了大片土地。"
 clever_dsk.78.f:0 "[SCOPE.sCountry('german_william_want_africa_scope').GetName]要成为世界帝国。在地球遥远的地方，到处都居住着我们的同胞。德国的货物、德国的知识、德国的勤奋要飘洋过海。——[SCOPE.sCharacter('william_II_want_africa_scope').GetFullName]"
 clever_dsk.78.a:0 "嚣张的言论。"
 clever_dsk.79.t:0 "权力交接"
 clever_dsk.79.d:0 "孙中山离开了中国，但他追求中国自由平等的理想，依然需要其他同志努力。目前，大会推选了一位各派认可的领袖接任孙先生的职位。"
 clever_dsk.79.f:0 "慷慨歌燕市，从容作楚囚。引刀成一快，不负少年头。"
 clever_dsk.79.a:0 "他能带领我们继续实现三民主义。"
 clever_dsk.79.b:0 "这个男人不适合继任。"
 clever_dsk.80.t:0 "公车上书"
 clever_dsk.80.d:0 "我们遭遇了惨败，被迫将汉族人赖以生存的家园割让给了日本。消息传开，全国群情激愤，以康有为和梁启超为代表的一千多名举人，联名上书同样想改良的皇帝，反对割让土地，要求"拒和、迁都、练兵、变法"等主张。"
 clever_dsk.80.f:0 "欲救国于危难之际，需下诏鼓天下之气；迁都定天下之本；练兵强天下之势；变法成天下之治。"
 clever_dsk.80.a:0 "或许可以考虑接受他们的部分请求。"
 clever_dsk.80.b:0 "拒绝他们。"
 clever_dsk.81.t:0 "戊戌政变"
 clever_dsk.81.d:0 "资产阶级维新派得到了皇帝的认可，皇帝决定实行变法改革。然而这引起了太后叶赫那拉为首的守旧派反感。太后开始削弱皇帝身边的力量，维新派只得孤注一掷希望刺杀太后。"
 clever_dsk.81.f:0 "太后已经尝试废除大部分新政，撤帘归政。如果我们再不采取行动，维新派会遭到迫害，变法将彻底失败。"
 clever_dsk.81.a:0 "向太后妥协。"
 clever_dsk.81.b:0 "反抗太后[SCOPE.sCharacter('ecchi_chi_cixi_character_benefactor').GetFullName]。"
 clever_dsk.81.c:0 "派遣秘密警察刺杀[SCOPE.sCharacter('ecchi_chi_cixi_character_benefactor').GetFullName]。"
 clever_dsk.82.t:0 "护国战争"
 clever_dsk.82.d:0 "[SCOPE.sCharacter('chi_general_yuan_shikai_benefactor').GetFullName]宣布接受帝制，这种倒行逆施的行为，激起[SCOPE.sCharacter('ecchi_chi_cai_e_character_benefactor').GetFullName]将军为首的反袁斗争。"
 clever_dsk.82.f:0 "中华民国护国军总司令[SCOPE.sCharacter('ecchi_chi_cai_e_character_benefactor').GetFullName]誓告于我全国同胞：袁为不道，窃号自娱，言念国危，有如朝露。五大民族，同此共和，袁氏得罪民国，已成五族公敌，万众一心，更无何等种族界限。"
 clever_dsk.82.a:0 "镇压叛乱。"
 clever_dsk.82.b:0 "立刻恢复共和，向[SCOPE.sCharacter('ecchi_chi_cai_e_character_benefactor').GetFullName]妥协。"
 clever_dsk.83.t:0 "皇帝的妥协"
 clever_dsk.83.d:0 "护国战争的爆发，导致南方多省震动，有脱离中央的趋势。皇帝[SCOPE.sCharacter('university_benefactor').GetFullName]有了妥协，取消帝制的念头。"
 clever_dsk.83.f:0 "盖在主张帝制者，本图巩固国基。其反对帝制者，亦为发抒政见。今承认之案，业已撤销。如有扰乱地方，自贻口实，本大总统亦不能坐视沦胥而不顾也。——[SCOPE.sCharacter('university_benefactor').GetFullName]"
 clever_dsk.83.a:0 "撤销帝制，恢复共和。"
 clever_dsk.83.b:0 "劝阻皇帝打消念头。"
 clever_dsk.84.t:0 "[SCOPE.sCharacter('university_benefactor').GetFullName]去世"
 clever_dsk.84.a:0 "长久的尿毒症，终于夺走了[SCOPE.sCharacter('university_benefactor').GetFullName]的生命。北洋军阀群龙无首，内部开始混乱，一场军阀混战降临了。"
 clever_dsk.86.t:0 "府院之争"
 clever_dsk.86.d:0 "自袁世凯和他的中华帝国一起埋入历史后，[SCOPE.sCharacter('chi_li_yuanhong_character_benefactor').GetFullName]担任了总统。他恢复了国会和临时宪法，并任命[SCOPE.sCharacter('chi_duan_qirui_character_benefactor').GetFullName]为总理。但在国会的宪法制定问题上，两人冲突不断，都想将自身权力凌驾对方之上。"
 clever_dsk.86.f:0 "总统府的总统，国务院的总理，他们之间的矛盾人尽皆知。或许应该派人去调解他们的矛盾。"
 clever_dsk.86.a:0 "动荡的局势。"
 clever_dsk.87.t:0 "张勋进京？"
 clever_dsk.87.d:0 "[SCOPE.sCharacter('chi_li_yuanhong_character_benefactor').GetFullName]为反抗段祺瑞的霸权，试图将他撤职。这引起段祺瑞的报复，扬言会让各省宣布独立，以此推翻黎元洪。或许可以呼叫持中立态度的[SCOPE.sCharacter('chi_zhang_xun_character_benefactor').GetFullName]，来北京谈判调停冲突。"
 clever_dsk.87.f:0 "张勋在北洋军阀中显得格格不入。即使清帝退位后，依然表示效忠清朝皇帝。他的军队像满人一样留着长辫子，人们称之为"辫子军"。"
 clever_dsk.87.a:0 "叫张勋来北京谈判。"
 clever_dsk.87.b:0 "向段祺瑞屈服。"
 clever_dsk.88.t:0 "张勋复辟"
 clever_dsk.88.d:0 "张勋进京后，用武力逼迫总统黎元洪解散国会，企图复辟清廷。"
 clever_dsk.88.f:0 "张勋的军队已经控制了北京，扶持爱新觉罗·溥仪重新当上皇帝。君主制的亡魂又回到了饱受摧残的中华大陆上。"
 clever_dsk.88.a:0 "中国未来的命运会怎样？"
 clever_dsk.89.t:0 "爱国青年"
 clever_dsk.89.d:0 "文人界最近有一位爱国青年博得众人关注，他的文笔和变法思想，在鼓动社会舆论方面取得了非常好的效果。"
 clever_dsk.89.f:0 "少年智则国智，少年富则国富，少年强则国强，少年独立则国独立，少年自由则国自由，少年进步则国进步，少年胜于欧洲则国胜于欧洲，少年雄于地球则国雄于地球。红日初升，其道大光。河出伏流，一泻汪洋。"
 clever_dsk.89.a:0 "他会得到重用。"
 clever_dsk.89.b:0 "随他在外面鼓动。"
 clever_dsk.90.t:0 "原住民的反抗"
 clever_dsk.90.d:0 "由于我们对台湾原住民的歧视，部分驻台军官强迫原住民从事非人的劳动，剿番战役时常发生。遭受压榨和凌辱的原住民在一位叫莫那·鲁道的部落首领领导下，在山林里发动叛乱。"
 clever_dsk.90.f:0 "只有用屠刀，才能教会叛民服从我们的统治。"
 clever_dsk.90.a:0 "镇压雾社起义，杀光叛乱者。"
 clever_dsk.90.b:0 "平息事态，和当地原住民分治。"
 clever_dsk.91.t:0 "匈牙利暴动"
 clever_dsk.91.d:0 "匈牙利叛乱分子打败了奥地利军队，他们攻占了佩斯，企图将危险的思想传到维也纳。现在奥皇亲自到达冬宫，来找我们求救。"
 clever_dsk.91.f:0 "如果我们不派兵帮他镇压，这股危险的思想可能再次席卷欧洲。"
 clever_dsk.91.a:0 "同意奥皇请求，派兵帮助他镇压叛乱。"
 clever_dsk.91.b:0 "拒绝他，息事宁人。"
 clever_dsk.92.t:0 "瓜分非洲"
 clever_dsk.92.d:0 "根据柏林会议，如果不能证明对我们在非洲的土地已经实行或能够实行“有效管辖”,那么这片土地将无法获得其它国家承认。议会提议要尽快扩展我们的势力范围，当然这需要不少的资金投入。"
 clever_dsk.92.f:0 "博茨瓦纳地区有德国人和布尔人出没、探险家罗德也向我们汇报了他在罗德西亚取得的进展...如果不能尽快把这些土地纳入管辖，别的国家可能会捷足先登。"
 clever_dsk.92.a:0 "加快扩张速度。"
 clever_dsk.92.b:0 "拒绝殖民行为。"
 clever_dsk.93.t:0 "[SCOPE.sCountry('gbr_want_africa_scope').GetName]确立非洲势力范围"
 clever_dsk.93.d:0 "柏林会议结束后，[SCOPE.sCountry('gbr_want_africa_scope').GetName]确立了罗德西亚、肯尼亚、博茨瓦纳、尼日利亚等地区的势力范围，一些探险家已经前往这些地区，声称当地酋长愿意接受他们的统治。"
 clever_dsk.93.f:0 "基督的战士们，继续向外邦的土地前进吧：祈祷书在你的口袋里，步枪在你的手中，把好消息带到可以交易的地方，用加特林机枪传播和平的福音。"
 clever_dsk.93.a:0 "野心昭昭。"
 clever_dsk.94.b:0 "接受[SCOPE.sCountry('gbr_want_africa_scope').GetName]授予在罗德西亚和尼亚萨兰境内进行贸易、勘探和殖民的专有权。"
 clever_dsk.95.t:0 "瓜分非洲"
 clever_dsk.95.d:0 "根据柏林会议，如果不能证明对我们在非洲的土地已经实行或能够实行“有效管辖”,那么这片土地将无法获得其它国家承认。议会提议要尽快扩展我们的势力范围，当然这需要不少的资金投入。"
 clever_dsk.95.f:0 "我们的探险家已经在加蓬和刚果地区取得了不少进展...如果不能尽快把这些土地纳入管辖，别的国家可能会捷足先登。"
 clever_dsk.95.a:0 "加快扩张速度。"
 clever_dsk.95.b:0 "拒绝殖民行为。"
 clever_dsk.96.t:0 "[SCOPE.sCountry('fra_want_africa_scope').GetName]确立非洲势力范围"
 clever_dsk.96.d:0 "柏林会议结束后，[SCOPE.sCountry('fra_want_africa_scope').GetName]确立了加蓬、刚果、马达加斯加等地区的势力范围，一些探险家已经前往这些地区，声称当地酋长愿意接受他们的统治。"
 clever_dsk.96.f:0 "基督的战士们，继续向外邦的土地前进吧：祈祷书在你的口袋里，步枪在你的手中，把好消息带到可以交易的地方，用加特林机枪传播和平的福音。"
 clever_dsk.96.a:0 "野心昭昭。"
 
 ecchi_heinrich:0 "海因里希·路易波德"
 ecchi_himmler:0 "希姆莱"
 clever_dsk.97.t:0 "移民图瓦"
 clever_dsk.97.d:0 "虽然根据塔城条约，大部分图瓦的土地仍属于清国领土。但我们可以尝试派遣部分商人移民至图瓦，这有利于我们日后宣称这片土地。"
 clever_dsk.97.f:0 "图瓦人应当服从我们的统治。"
 clever_dsk.97.a:0 "派遣移民进入。"
 clever_dsk.97.b:0 "让我再想想。"
 clever_dsk.98.t:0 "俄人渗透"
 clever_dsk.98.d:0 "有几支俄国商民进入了我们的唐努乌梁海地区，试图控制当地经济贸易。"
 clever_dsk.98.f:0 "这批俄国人已经在唐努乌梁海地区搭建居所和商铺，完全没有经过我们的同意。如果任由他们活动，未来很有可能唐努乌梁海各旗将被俄国借口侵占。"
 clever_dsk.98.a:0 "我们不能得罪俄国。"
 clever_dsk.98.b:0 "清除他们。"
 clever_dsk.102.t:0 "俄国临时政府成立"
 clever_dsk.102.d:0 "为反抗红色赤卫军，俄国临时政府迁移至西伯利亚，推选海军上将高尔察克为“俄国最高执政官”。或许我们可以积极与他们改善关系，甚至帮助他们打赢内战，以获得更多的利益。"
 clever_dsk.102.f:0 "高尔察克坚定认为自己是被推翻的合法政府代表，必须要消灭布尔什维克拯救祖国。如果我们不去支援，他们可能撑不到1920年2月的冬天。"
 clever_dsk.102.a:0 "承认西伯利亚政府为俄国合法政府。"
 clever_dsk.102.b:0 "拒绝承认这群叛匪。"
 clever_dsk.103.t:0 "[SCOPE.sCountry('rus_now_very_red_scope').GetName]建立"
 clever_dsk.103.d:0 "据驻俄外交大使汇报，俄国工人阶级成功攻入冬宫并夺得政权，建立了社会主义性质的[SCOPE.sCountry('rus_now_very_red_scope').GetName]。我们是否需要承认他们，与其建立良好的外交关系？"
 clever_dsk.103.f:0 "为使社会局势尽快稳定，苏俄政权不得以割让东欧大片土地。即使如此，也有情报称俄国境内仍存在不少反对苏维埃政权的组织，未来俄国局势岌岌可危。"
 clever_dsk.103.a:0 "承认新生的[SCOPE.sCountry('rus_now_very_red_scope').GetName]。"
 clever_dsk.103.b:0 "消灭叛乱的赤色分子！"
 clever_dsk.104.t:0 "《双洋条约》"
 clever_dsk.104.d:0 "现在，我们已经在安第斯山脉的最高峰确定了边界，我们必须决定如何处理山脉尽头南面的岛屿——火地岛."
 clever_dsk.104.f:0 "[SCOPE.sCountry('chl_scope').GetName]的外交官向我们提议 "双洋原则"，将沿 67° 子午线划分岛屿，西面归[SCOPE.sCountry('chl_scope').GetName]，东面归我们，同时确立好双方在巴塔哥尼亚地区的国界线。"
 clever_dsk.104.a:0 "签署条约！这有利于我们的国家。"
 clever_dsk.104.b:0 "这是对我们国家的侮辱，他们怎么敢这样做！"
 clever_dsk.105.t:0 "世界大战结束"
 clever_dsk.105.d:0 "1918世界大战结束了，获得胜利的同盟国代表齐聚柏林，强迫战败的协约国签署柏林条约。消息传出，曾饱受战火折磨的#yellow 德意志#!人民，庆幸和平与胜利的到来。"
 clever_dsk.105.f:0 "根据柏林条约，俄国需承认放弃东欧#yellow 100万#!平方公里的土地，并归属德国管辖；英法两国需割让大片非洲领土给德国，同时让工党上台执政；意大利组建亲奥地利的政府；奥斯曼转交格鲁吉亚、阿塞拜疆给德国；塞尔维亚需割让斯科皮亚给保加利亚，政府接受奥地利委派官员控制。"
 clever_dsk.105.a:0 "这是一场对世界秩序的重新洗牌。"
 clever_dsk.106.t:0 "非洲势力划分完成"
 clever_dsk.106.d:0 "[SCOPE.sCountry('gbr_want_three_scope').GetName]和[SCOPE.sCountry('fra_want_three_scope').GetName]的探险队凭借手中的枪炮，迫使众多非洲部落臣服，基本完成了各自的势力范围划分."
 clever_dsk.106.f:0 "我坚持认为，我们是世界上第一流的种族；在这个世界上，我们定居的地方愈多，对人类就愈有利。如果有上帝的话，我想他希望我做的是，在非洲地图上尽可能多地绘上[SCOPE.sCountry('gbr_want_three_scope').GetName]的红色。"
 clever_dsk.106.a:0 "也许我们应该加快扩张的脚步。"
 clever_dsk.106.b:0 "勇敢的探险家们值得这份报酬。"
 clever_dsk.107.t:0 "三国同盟传闻？"
 clever_dsk.107.d:0 "近期欧洲有传言，在突尼斯遇阻的[SCOPE.sCountry('ita_want_three_scope').GetName]，派遣外交官秘密出使德国和奥地利，凭借出色的外交手段和良好的外交关系，与德奥两国共同签订《三国同盟》条约."
 clever_dsk.107.f:0 "[SCOPE.sCountry('ita_want_three_scope').GetName]觊觎索马里、厄立特里亚和突尼斯的消息已经人尽皆知，也许传言并非虚假，这可能是[SCOPE.sCountry('ita_want_three_scope').GetName]寻求德奥两国庇护的信号。"
 clever_dsk.107.a:0 "应该只是一个假消息？"
 clever_dsk.108.t:0 "巴尔干麻烦"
 clever_dsk.108.d:0 "泛斯拉夫主义席卷了巴尔干半岛的国家，巴尔干诸国开始积极扩军和联盟，矛头直指他们共同的敌人——[SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName]."
 clever_dsk.108.f:0 "巴尔干诸国安排好了战争胜利后，瓜分[SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName]在巴尔干半岛领土的计划。塞尔维亚已经开始备战，巴尔干战争似乎无法避免。"
 clever_dsk.108.a:0 "灵活应对巴尔干半岛局势。"
 clever_dsk.108.a.ctt:0 "#red 如果时间到了1913年3月，巴尔干同盟和土耳其的战争仍无法结束，该博弈将自动结束且以巴尔干同盟有利的条件收尾。"
 clever_dsk.109.t:0 "巴尔干同盟建立"
 clever_dsk.109.d:0 "为解救仍在土耳其人奴役压迫下的巴尔干同胞，[SCOPE.sCountry('serbian_need_more_friends_scope').GetName]和希腊、保加利亚、黑山四国签订同盟条约，达成共同对土作战的协议。"
 clever_dsk.109.f:0 "条约规定当土耳其攻击缔约国的一方领土或者破坏国际法基本原则所享有的权利时，用一切武装力量彼此帮助。"
 clever_dsk.109.a:0 "欧洲病夫会变成西亚病夫吗？"
 clever_dsk.110.t:0 "[SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName]投降"
 clever_dsk.110.d:0 "由于色雷斯战场的战败，混乱的[SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName]主动向巴尔干同盟投降，被迫签署《伦敦和约》，割让大片欧洲领土。"
 clever_dsk.110.f:0 "根据条约，[SCOPE.sCountry('turkish_will_be_dismembered_scope').GetName]将割让诺斯-米迪亚一线以西的所有欧洲领土，包括旧都埃迪尔内。同时给予阿尔巴尼亚人独立，并通知塞尔维亚放弃阿尔巴尼亚北部领土。"
 clever_dsk.110.a:0 "我们没必要再去拯救土耳其这个病人了。"
 clever_dsk.111.t:0 "兄弟反目"
 clever_dsk.111.d:0 "针对马其顿划分问题，[SCOPE.sCountry('bul_will_fight_with_ser_scope').GetName]和塞尔维亚产生严重分歧。"
 clever_dsk.111.f:0 "[SCOPE.sCountry('bul_will_fight_with_ser_scope').GetName]坚称塞尔维亚有义务按照同盟协议交还瓦尔达尔马其顿地区。塞尔维亚外交官指责保加利亚人的贪婪，是在掠夺对他们为数不多的战争果实。在争端之下，塞尔维亚政府积极联络俄罗斯、罗马尼亚、希腊、黑山四国，试图组建反保加利亚联盟。"
 clever_dsk.111.a:0 "战争即将再次到来。"
 clever_dsk.112.t:0 "战火重燃"
 clever_dsk.112.d:0 "马其顿地区仲裁的失败，引起[SCOPE.sCountry('bul_will_fight_with_ser_scope').GetName]不满。为了收复斯科皮亚，[SCOPE.sCountry('bul_will_fight_with_ser_scope').GetName]决定发起针对塞尔维亚的突袭战争。"
 clever_dsk.112.f:0 "很显然，对土耳其的军事胜利让保加利亚人野心膨胀，甚至有传言他们的统治者想要进入君士坦丁堡加冕。"
 clever_dsk.112.a:0 "巴尔干麻烦还未结束。"
 clever_dsk.113.t:0 "威尼斯起义"
 clever_dsk.113.d:0 "频繁的威尼斯起义，来自柏林的外交仲裁，让[SCOPE.sCountry('aus_give_up_ven_scope').GetName]陷入双重困境。在最近的一次起义中，起义领袖宣布投票通过加入撒丁王国。"
 clever_dsk.113.f:0 "[SCOPE.sCountry('aus_give_up_ven_scope').GetName]在威尼斯的驻军遭遇多次起义军袭击后，维也纳宫廷财政逐渐入不敷出，只能狼狈地撤出威尼西亚。在柏林的军事战争和外交压力下，[SCOPE.sCountry('aus_give_up_ven_scope').GetName]签署《维尔纳和约》，正式归还威尼斯地区给意大利。"
 clever_dsk.113.a:0 "奥地利人再也不会回到威尼西亚。"
 clever_dsk.114.t:0 "为了意大利统一！"
 clever_dsk.114.d:0 "意大利复兴运动达到了高潮，无论是北方的伦巴第人，还是南方的西西里人，都出现要求意大利统一的口号。但当前的局势，迫使他们只得寄托于[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]实现意大利统一。"
 clever_dsk.114.f:0 "一位来自尼斯的将军自行组建1400人远征军，渡海前去远征西西里岛的腐朽政权；没有外部势力保护的教皇国也岌岌可危；几个小邦国组建的中意大利联合省同样出现了并入[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]的呼声。"
 clever_dsk.114.a:0 "意大利可能不再是个地理名词。"
 clever_dsk.115.t:0 "为了意大利统一！"
 clever_dsk.115.d:0 "意大利复兴运动达到了高潮，无论是北方的伦巴第人，还是南方的西西里人，都出现要求意大利统一的口号。"
 clever_dsk.115.f:0 "一位来自尼斯的将军自行组建1400人远征军，渡海前去远征西西里岛的腐朽政权；没有外部势力保护的教皇国也岌岌可危；几个小邦国组建的中意大利联合省同样宣布并入意大利。"
 clever_dsk.115.a:0 "意大利不再是个地理名词。"
 clever_dsk.116.t:0 "维也纳和约"
 clever_dsk.116.d:0 "频繁的威尼斯起义，以及普鲁士和意大利带来的战争压力，处于劣势的[SCOPE.sCountry('aus_give_up_ven_scope').GetName]只得与意大利签署《维尔纳和约》，交还威尼斯地区。"
 clever_dsk.116.f:0 "意大利外交官对法国的外交胜利，配合意大利志愿军出色表现，为他们祖国赢得了胜利的果实，[SCOPE.sCountry('aus_give_up_ven_scope').GetName]在威尼西亚的驻军只得狼狈地逃走。几十年来，反抗奥地利残暴统治的威尼斯市民，终于迎来民族解放。"
 clever_dsk.116.a:0 "奥地利人再也不会回到威尼西亚。"
 clever_dsk.117.t:0 "夏威夷政变"
 clever_dsk.117.d:0 "一群居住在夏威夷的美国白人移民成立安全委员会，他们携带武器，占领政府大楼，解散了夏威夷王室警卫队，宣布成立[SCOPE.sCountry('haw_face_problem_scope').GetName]，并推选多尔食品公司创始人[SCOPE.sCharacter('haw_dole_character').GetFullName]担任总统。"
 clever_dsk.117.f:0 "美国政府立刻正式承认[SCOPE.sCountry('haw_face_problem_scope').GetName]。有消息还声称，所谓的白人总统[SCOPE.sCharacter('haw_dole_character').GetFullName]不过是美国驻夏威夷总督罢了。"
 clever_dsk.117.a:0 "自诩文明的侵略者。"
 clever_dsk.118.t:0 "都灵条约"
 clever_dsk.118.d:0 "[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]为解救仍被奥地利奴役的伦巴第同胞，与[SCOPE.sCharacter('fra_now_help_safuyi_scope').GetFirstName]私下签署都灵条约，确立和[SCOPE.sCountry('fra_will_help_safuyi_scope').GetName]的同盟关系。"
 clever_dsk.118.f:0 "[SCOPE.sCharacter('fra_now_help_safuyi_scope').GetFirstName]被意大利人不顾一切实现祖国统一的精神打动，加上[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]承诺如果法国能够支持[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]对奥地利的战争，会把萨伏伊和尼斯割让给法国，[SCOPE.sCharacter('fra_now_help_safuyi_scope').GetFirstName]决心支持意大利统一。\n\n#red  如果1860年1月，奥地利(AI)仍与撒丁(AI)处于战争状态，无法速胜的奥地利(AI)会结束这场战争博弈#!"
 clever_dsk.118.a:0 "静待局势的发展。"
 clever_dsk.118.a.ctt:0 "#red 如果时间到了1860年1月，撒丁和奥地利的战争仍无法结束，该博弈将自动结束且以撒丁有利的条件收尾。"
 clever_dsk.118.b.ctt:0 "我们会尝试与撒丁建立短暂的同盟。"
 clever_dsk.118.b:0 "我们会帮助皮埃蒙特人，当然需要他们兑现都灵条约的领土转交承诺。"
 clever_dsk.119.t:0 "奥地利议和"
 clever_dsk.119.d:0 "奥地利无法取得速胜，反而被[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]联军决定性击败。在[SCOPE.sCharacter('fra_now_help_safuyi_scope').GetFirstName]的斡旋下竟主动投降，与[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]签订和谈契约。"
 clever_dsk.119.f:0 "[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]成功收复伦巴第，当地意大利人民欢迎他们同胞的到来。当然[SCOPE.sCountry('safuyi_will_unify_italy_scope').GetName]也履行都灵条约，正式将萨伏伊和尼斯割让给[SCOPE.sCountry('fra_will_help_safuyi_scope').GetName]。"
 clever_dsk.119.a:0 "如果说意大利是一个生病的年轻人，那奥地利就是瘫痪在病床上的老人。"
 clever_dsk.120.t:0 "重返库页岛"
 clever_dsk.120.d:0 "长期以来，[SCOPE.sCountry('chi_return_kuye_scope').GetName]与库页岛居民维持松散的进贡貂皮的制度，这需要当地居民划船沿黑龙江南下进行贸易，交流极为不便。然而周边局势开始紧张，俄国舰船的游荡，试图在萨哈林岛北部建立哨所；日本幕府也尝试在桦太岛南部建立税务所，将当地居民收归幕府直辖。这引起了[SCOPE.sCountry('chi_return_kuye_scope').GetName]的重视。"
 clever_dsk.120.f:0 "三姓副都统从几支费雅喀与阿伊努部落酋长听闻库页岛遭遇渗透的消息。出乎意料的是，[SCOPE.sCountry('chi_return_kuye_scope').GetName]的统治者竟对库页岛事务极其关注，派遣官员和军队重返库页岛，加强了各噶珊的管辖。"
 clever_dsk.120.a:0 "这座岛未来的名字会是库页？桦太？还是萨哈林？"
 clever_dsk.120.b:0 "我们宣布将介入#v 日本战略区域#!事务"
 clever_dsk.121.t:0 "德意志统一呼声"
 clever_dsk.121.d:0 "长期分裂的德意志人，受民族主义浪潮的影响，迫切追求德国政治上实现统一，以抗衡其它强大的国家。还保持独立地位的德意志邦国，纷纷加入柏林，迫切希望它能够解救还被他国奴役的同胞，完成德意志统一。"
 clever_dsk.121.f:0 "听从柏林的德意志小邦国，已经汇聚成一股强大的力量。柏林首相声称，德国的统一只能通过同反对者进行战争的道路来实现。"
 clever_dsk.121.a:0 "中欧将崛起一个新兴的大国。"
 clever_dsk.122.t:0 "攻克蒙巴萨"
 clever_dsk.122.d:0 "18世纪初，[SCOPE.sCountry('oman_return_mon_scope').GetName]将葡萄牙人彻底从东非地区驱除，确立了苏丹在东非地区绝对的统治和权威。但由于内战的衰落，一些驻扎东非的官员宣布独立反叛，尤其是驻蒙巴萨的马兹鲁伊家族，自立为埃米尔，动摇了苏丹在东非沿海地区的统治。"
 clever_dsk.122.f:0 "据往来桑给巴尔的商人消息，苏丹[SCOPE.sCharacter('oman_ruler_return_mon_scope').GetFirstName]趁马兹鲁伊家族内乱，一举攻克重镇蒙巴萨，消灭马兹鲁伊王朝。当地商人滔滔不绝地说，[SCOPE.sCharacter('oman_ruler_return_mon_scope').GetFirstName]是一位复有雄心的君王，凭借他那庞大规模的舰队，没人可以动摇[SCOPE.sCountry('oman_return_mon_scope').GetName]在东非的商业秩序。"
 clever_dsk.122.a:0 "这方便我们与[SCOPE.sCountry('oman_return_mon_scope').GetName]进行贸易。"
 clever_dsk.122.b:0 "没人在意这块贫瘠之地"
 clever_dsk.122.st:0 "东非新的霸主？"
 clever_dsk.123.t:0 "寻求[SCOPE.sCountry('lan_need_qng_scope').GetName]支持"
 clever_dsk.123.d:0 "几十年前，我们伟大的大唐总长罗芳伯带领我们在婆罗洲扫清土匪海盗，建立起保护华人和各土著部落的国家。罗芳伯一直希望成为[SCOPE.sCountry('lan_need_qng_scope').GetName]的藩属以换取保护，但始终被乾隆皇帝拒绝。经过多次交涉，我们的母国勉强同意与我们开展贸易，一直延续到现在。"
 clever_dsk.123.f:0 "罗芳伯在弥留之际交代过，无论谁是国家的领导，归顺大清之心决不可变。眼下，西南方向又出现了几支红毛夷，他们无休止派兵侵扰令我们矿工苦不堪言。从广州回来的商人告知我们，[SCOPE.sCountry('lan_need_qng_scope').GetName]的现任皇帝可能不会像他爷爷那样拒绝我们称藩的请求，或许这是寻求[SCOPE.sCountry('lan_need_qng_scope').GetName]军事保护的好机会。"
 clever_dsk.123.a:0 "派人前往北京，请求成为[SCOPE.sCountry('lan_need_qng_scope').GetName]的藩属国。"
 clever_dsk.123.b:0 "我们能自力更生。"
 clever_dsk.124.t:0 "称藩请求"
 clever_dsk.124.d:0 "[SCOPE.sCountry('lan_and_qng_scope').GetName]的外交大使向我们传达了称藩纳贡的请求，朝廷官员对这群逃亡海外的弃民没有任何好感，劝诫皇帝对他们置之不理。"
 clever_dsk.124.f:0 "[SCOPE.sCountry('lan_and_qng_scope').GetName]向我们控诉红毛夷的频繁袭扰，迫切希望皇帝接受他们的称藩请求，愿意永为大清的奴仆。如果同意他们的请求，以后很有可能会卷入与红毛夷的冲突。"
 clever_dsk.124.a:0 "同意[SCOPE.sCountry('lan_and_qng_scope').GetName]请求。"
 clever_dsk.124.b:0 "不服王化的海外弃民，一律以海盗匪巢视之。"
 clever_dsk.125.t:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]出游"
 clever_dsk.125.d:0 "沙皇计划派遣太子[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]，以前往远东地区主持西伯利亚铁路开工仪式名义，乘坐巡洋舰周游世界，为我们海军勘察从欧洲开赴远东的航线和补给港口，顺路打探亚洲情报。"
 clever_dsk.125.f:0 "长时间散步，打了两只乌鸦。在阳光下喝茶...接着是散步，划船。然后是乌鸦，喝茶...今天我在巴博洛夫周围散步，杀死了两只乌鸦和一只猫..."
 clever_dsk.125.a:0 "太子[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]需要出游世界增长见识，而不是留在宫殿里打发时光。"
 clever_dsk.125.b:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]应当留守在冬宫。"
 clever_dsk.126.t:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]访问"
 clever_dsk.126.d:0 "[SCOPE.sCountry('come_to_the_world_scope').GetName]太子[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]在前往远东地区主持西伯利亚铁路开工仪式的途中，乘坐巡洋舰访问[SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName]。"
 clever_dsk.126.f:0 "俄储溯江而上，游历汉皋。本月初八日，俄储乘三枝大兵轮，随护兵船两艘，鼓浪而前，两岸炮台望见帆樯危耸、旗帜翻空，立即鸣炮升旗，俄船亦开炮答礼，过芜湖礼亦如之，送迎有礼，交谊愈敦，岂维故耶！"
 clever_dsk.126.a:0 "为[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]准备最隆重的礼仪仪式。"
 clever_dsk.126.b:0 "拒绝让[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]上岸。"
 clever_dsk.128.d:0 "[SCOPE.sCountry('come_to_the_world_scope').GetName]太子[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]在前往远东地区主持西伯利亚铁路开工仪式的途中，乘坐巡洋舰访问[SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]。"
 clever_dsk.128.f:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]计划抵达[SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]后停驻一个月的时间，参加我们民间的风俗祭祀活动，甚至有传言他对娇小婉约的亚洲女性有浓厚的兴趣。也许我们可以抓住这次契机，改善与[SCOPE.sCountry('come_to_the_world_scope').GetName]关系。"
 clever_dsk.129.t:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]结束访问"
 clever_dsk.129.d:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]参观完汉阳铁厂和湖北枪炮厂后，出席了[SCOPE.sCountry('come_to_the_world_scope').GetName]在华开办的新泰洋行周年庆祝活动，新泰砖茶厂专门制作了一块纪念砖茶赠予[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]。随后离开武汉，乘坐亚速纪念号继续访问下一站——日本。"
 clever_dsk.129.f:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]称赞[SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName]洋务运动的进展，肯定了[SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName]未来的大国潜力。但部分官员仍质疑这些恭维话语，私下讨论[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]是否包藏肢解[SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName]的祸心。"
 clever_dsk.129.a:0 "欢送[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]。"
 clever_dsk.129.b:0 "让他们快点滚蛋。"
 clever_dsk.130.d:0 "[SCOPE.sCountry('come_to_the_world_scope').GetName]太子[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]对[SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName]繁荣的景象感到讶异。尤其不能理解为什么[SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName]会允许异族担任政府重要职位，对我们的五族共和政策表示不理解。在参观完武汉兵工厂后，[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]乘坐亚速纪念号继续访问下一站——日本。"
 clever_dsk.130.f:0 "[SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName]民族和谐的景象，给[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]带来不小冲击和反感。随行陪同的官员告知我们，[SCOPE.sCountry('come_to_the_world_scope').GetName]目前正大力按照“东正教-君主专制-民族主义”原则对全国进行俄罗斯化，比如其它教派的人和东正教徒结婚，孩子自动成为东正教徒，或许文化差异是引起他不满的原因。无论如何，我们的官员圆满地完成任务，带领[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]品尝了楚菜，游览武当山、黄鹤楼等名胜古迹。[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]对中华悠久的历史文化给予了很高的评价，称赞[SCOPE.sCountry('chi_welcome_nicholas_ii_scope').GetName]是一头觉醒的东方雄狮，希望能成为沙皇陛下的盟友。"
 clever_dsk.131.t:0 "有趣的纹身"
 clever_dsk.131.d:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]抵达[SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]后，我们的外交官和翻译官带他前往各地旅游，沿途百姓为他举行隆重的欢迎仪式，港口内的商船到处悬挂着[SCOPE.sCountry('come_to_the_world_scope').GetName]国旗。在参加完五三送火仪式，逛完艺伎馆后，我们的纹身大师还贴心地为他在右臂上纹了一条龙。"
 clever_dsk.131.f:0 "星期二 我醒来是美好的一天，海岸在招手。长崎的街道和房屋给人留下了非常愉快的印象：一切都完美地打扫干净，看起来整洁，进入他们的房子很愉快，日本男性和日本女性是如此亲切友好的人。我们在5点钟回到护卫舰喝茶。晚饭后，我决定在右臂上纹一条龙的纹身，从晚上9点到凌晨4点，花了整整七个小时才完成！经历一次这种快乐足以阻止我再次踏上它。龙的表现相当不错。而且我的手一点也不疼。"
 clever_dsk.131.a:0 "继续为[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]留下[SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]友好的形象。"
 clever_dsk.132.t:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]遇刺！"
 clever_dsk.132.d:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]乘坐人力车在大津城游览时，突然遭到一名极端仇俄的[SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]军警行刺，幸亏[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]及时反应躲过再次挥舞过来的军刀，否则必将丧命于[SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]。"
 clever_dsk.132.f:0 "其他[SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]警察立刻制服了刺客，然而[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]仍然头部挨了两刀，在口念感谢上帝的同时，被紧急送往医院。[SCOPE.sCountry('come_to_the_world_scope').GetName]很快向我们提出交涉，要求严惩凶手，否则将会开战。听闻消息的[SCOPE.sCharacter('jap_welcome_nicholas_scope').GetFullName]大惊，立即前往停靠在港口的俄罗斯军舰，即使[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]大声责骂“日本人是野蛮的猕猴“，仍尝试好言安抚[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]。"
 clever_dsk.132.a:0 "向[SCOPE.sCountry('come_to_the_world_scope').GetName]发出慰问致歉的电报，并派医疗团队全力救治[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]。"
 clever_dsk.132.b:0 "冷处理遇刺事件，缓慢执行对刺客的审判。"
 clever_dsk.132.c:0 "表彰刺客的事迹。"
 clever_dsk.133.t:0 "遇刺事件的传播"
 clever_dsk.133.d:0 "[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]在[SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]遭到刺杀的新闻很快传到了欧洲等地。人们纷纷议论[SCOPE.sCountry('come_to_the_world_scope').GetName]与[SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]是否会有开战的可能。"
 clever_dsk.133.f:0 "[SCOPE.sCountry('jap_welcome_nicholas_ii_scope').GetName]民间舆论对[SCOPE.sCharacter('welcome_nicholas_ii_scope').GetFirstName]表示同情，不愿意因此招惹[SCOPE.sCountry('come_to_the_world_scope').GetName]导致国家灭亡，甚至有一名烈女在京都府厅面前用剃刀自刎表示道歉。"
 clever_dsk.133.a:0 "希望不会发生战争。"
 clever_dsk.134.t:0 "[SCOPE.sCharacter('ito_right_now_scope').GetFullName]崛起"
 clever_dsk.134.d:0 "[SCOPE.sCharacter('ito_right_now_scope').GetFullName]扫清权力斗争的竞争对手后，成为政界的重要人物。除了先进的宪法思想，作为维新先驱，[SCOPE.sCharacter('ito_right_now_scope').GetFullName]大力修建铁路，创办国营企业，引进欧洲先进的生产技术和设备，这些政绩都是各派人士认可他的因素。"
 clever_dsk.134.f:0 "他国外交大使赞叹道，[SCOPE.sCharacter('ito_right_now_scope').GetFirstName]在民族复兴方面称作“日本的俾斯麦“一点不过分；甚至有的官员私下还称呼他为“日本的克罗默伯爵”。"
 clever_dsk.134.a:0 "[SCOPE.sCharacter('ito_right_now_scope').GetFullName]会得到重用。"
 clever_dsk.135.t:0 "远征墨西哥"
 clever_dsk.135.d:0 "[SCOPE.sCountry('mex_will_hit_scope').GetName]统治者决定停止向外国支付借款的利息，这直接激怒了几个借款的国家。[SCOPE.sCountry('fra_will_hit_mex_scope').GetName]的统治者[SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName]积极拉拢英国和西班牙联盟，整合力量准备派遣军队从[SCOPE.sCountry('mex_will_hit_scope').GetName]讨回欠款。"
 clever_dsk.135.f:0 "有消息称，[SCOPE.sCharacter('fra_king_will_hit_mex_scope').GetFirstName]不只是想单纯讨回欠款，而是打算拉拢奥地利一名贵族担任[SCOPE.sCountry('mex_will_hit_scope').GetName]的皇帝。这强烈引起墨西哥北方的大国不满，警告欧洲人不得干预美洲独立国家的事务。"
 clever_dsk.135.a:0 "[SCOPE.sCountry('mex_will_hit_scope').GetName]肯定不会欢迎一个欧洲皇帝来统治他们。"
 clever_dsk.136.t:0 "硝石战争"
 clever_dsk.136.d:0 "阿塔卡沙漠拥有丰富的鸟粪和硝石资源，一直以来都由[SCOPE.sCountry('chl_will_hit_bol_scope').GetName]和它的邻居国家在这片土地开采。然而近期玻利维亚为筹集军费，没收了[SCOPE.sCountry('chl_will_hit_bol_scope').GetName]在当地矿业公司的全部资产，这直接引发了[SCOPE.sCountry('chl_will_hit_bol_scope').GetName]的报复。"
 clever_dsk.136.f:0 "[SCOPE.sCountry('chl_will_hit_bol_scope').GetName]和玻利维亚剑拔弩张，双方已经在交战的边缘徘徊。来自伦敦的电报非但没有尝试阻止战争，反而支持[SCOPE.sCountry('chl_will_hit_bol_scope').GetName]开战，以此胜利后可以共享在当地的矿产开采权。"
 clever_dsk.136.a:0 "南美洲的政治格局将发生改变。"
 clever_dsk.137.t:0 "维新功臣"
 clever_dsk.137.d:0 "出身萨摩藩的[SCOPE.sCharacter('ecchi_jap_okubo_toshimichi_scope').GetFullName]，在倒幕运动中发挥了积极的作用，为他赢得了处理内务的职位，给他的改革提供了发挥的空间。"
 clever_dsk.137.f:0 "[SCOPE.sCharacter('ecchi_jap_okubo_toshimichi_scope').GetFullName]有着加强中央集权，实现富国强兵的政治理想。为了追上西方强大的工业国家，他的集权改革注定走向高压专制的道路。"
 clever_dsk.137.a:0 "期待他的表现。"
 clever_dsk.138.t:0 "[SCOPE.sCharacter('ecchi_jap_okubo_toshimichi_scope').GetFullName]遇刺"
 clever_dsk.138.d:0 "[SCOPE.sCharacter('ecchi_jap_okubo_toshimichi_scope').GetFullName]乘坐马车前往太政官的路上，在曲町清水谷遭遇了几名石川县士族刺客的袭击。"
 clever_dsk.138.f:0 "欲贯彻维新的盛意，不得不以三十年为期...明治元年至十年为创业期...明治十一年至二十年为第二期，整顿内政、充实国力就在此时...明治二十一年后十年为守成期，等后进优秀分子继承大业...?!\n一个将死之人，何须担心这个国家的未来呢?"
 clever_dsk.138.a:0 "我...我还...不能死...还有必须要做的事..."
 clever_dsk.138.b:0 "巡逻的警察阻止了刺客的暗杀。"
 clever_dsk.139.t:0 "安第斯阴影"
 clever_dsk.139.d:0 "[SCOPE.sCountry('bol_with_peu_con_scope').GetName]为主体的邦联是一个人口众多，资源丰富的国家。我们国家真正的统治者，身兼内政外交司法教育多个部门的首领[SCOPE.sCharacter('fight_with_bol_peu_scope').GetFullName]，察觉到了联邦的合并对智利的利益意味着危险。"
 clever_dsk.139.f:0 "智利相对于秘鲁-玻利维亚联邦的立场是不可持续的。无论是人民还是政府都不能容忍，因为这无异于自杀。我们不能不关心和最大程度地警惕两个民族的存在，从长远来看，由于起源、语言、习惯、宗教、思想、习俗的共同性，他们将自然地形成一个单核。联合起来，这两个国家，即使只是暂时的，在各种问题和情况下都将永远超过智利...由于其地理范围的扩大，联邦必须永远从安第斯的舞台上消失。因为新联邦试图在太平洋地区行使主导地位，从而夺走我们的统治地位。还因为他们有更多的白人开明人士，尽管性格不如智利人...由于所有这些原因，除非发生特殊情况，联邦必会淹没智利...所以，海军部队必须先于军队行动，对他们提供决定性的打击。我们必须永远统治太平洋：我希望它永远是智利的座右铭。——[SCOPE.sCharacter('fight_with_bol_peu_scope').GetFullName]"
 clever_dsk.139.a:0 "是时候终结这个安第斯怪物了。"
 clever_dsk.139.b:0 "也许我们需要与他们交好。"
 clever_dsk.140.t:0 "塔里哈争端"
 clever_dsk.140.d:0 "[SCOPE.sCountry('bol_with_peu_con_scope').GetName]的军队占领吞并了胡胡伊省领土，将它划进他们的塔里哈省，这是对我们主权的侵犯！智利特工告诉我们，[SCOPE.sCharacter('bol_ruler_fight_scope').GetFullName]甚至还窝藏一神论支持者，唆使这些阿根廷叛徒分裂我们的国家！"
 clever_dsk.140.f:0 "玻利维亚人，你们欠我们在对抗西班牙的战争中为你们的自由和独立花费的数百万比索！你们欠我们在这场战争中流淌的阿根廷人的鲜血！要明白，一旦塔里哈恢复后，苏帕查河必须划分两个共和国的领土；但在我看来，如果我们能够确保图皮萨别墅和圣地亚哥科塔盖塔镇留在我们的领土内，那么这将是确保两国之间永远和平与自由贸易的最好和最重要的事情，我已指出的特许经营权。作为获得这一利益的交换，我相信我们可以原谅在独立战争中所付出的费用，以及它在塔里哈被篡夺期间从塔里哈那里获得的利益。但要获得所有这些东西，就必须深入玻利维亚首都，并将波托西山纳入我们的管辖范围。——[SCOPE.sCharacter('fight_with_bol_arg_scope').GetFullName]"
 clever_dsk.140.a:0 "战争不会针对秘鲁和玻利维亚人民，但[SCOPE.sCharacter('bol_ruler_fight_scope').GetFullName]必须滚出秘鲁，失去的所有领土必须无偿归还给我们。"
 clever_dsk.140.b:0 "告诉智利外交官，我们不会向[SCOPE.sCountry('bol_with_peu_con_scope').GetName]开战。"
 clever_dsk.141.t:0 "不再有福克兰群岛"
 clever_dsk.141.d:0 "随着英国势力在南太平洋地区的消退，一个属于[SCOPE.sCountry('arg_great_now_scope').GetName]的新时代开始了。"
 clever_dsk.141.f:0 "你喜欢不喜欢赤道气候？比如马克萨斯群岛或是萨摩亚岛。或是别的更能够刺激你的地方？\n赫姆霍尔兹从他的气垫椅上站了起来:我宁可选一个气候极端恶劣的地方，我相信恶劣气候会使我写得更好，比如，常常有狂风暴雨……\n[SCOPE.sCharacter('arg_ruler_great_now_scope').GetFirstName]点头表示赞许:我就喜欢你这种精神，华生先生，的确非常喜欢。那么马尔维纳斯群岛怎么样？\n“好，我看可以”，赫姆霍尔兹回答道。"
 clever_dsk.141.a:0 "让海盗的巢穴成为[SCOPE.sCountry('arg_great_now_scope').GetName]进步的灯塔！"
 clever_dsk.142.t:0 "兄弟重聚"
 clever_dsk.142.d:0 "在[SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName]的英明领导下，阿蒂加斯愚蠢独立的行为终于得到了纠正。"
 clever_dsk.142.f:0 "阿根廷兄弟们团结在一起，因为这是第一条法律，他们在任何时候都会有真正的团结。因为如果他们之间发生战斗，外面的人就会吞噬他们。"
 clever_dsk.142.a:0 "欢迎乌拉圭兄弟们回归[SCOPE.sCountry('arg_great_now_scope').GetName]"
 clever_dsk.143.t:0 "终结疯子统治"
 clever_dsk.143.d:0 "精神病人何塞·德·弗朗西亚·伊·贝拉斯科的时代终于结束，巴拉圭人民不用再忍受他专制独裁的统治。"
 clever_dsk.143.f:0 ""医生，我必须说，你的初步分析被证明是错误的。"这名男子说着，手里拿着刀，聚精会神地看着医生的眼睛。\n"相反，弗朗西亚，永远不要忘记，不同的道路仍然可能通向相同的命运。""
 clever_dsk.143.a:0 "是时候让[SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName]来恢复巴拉圭地区的理智了。"
 clever_dsk.144.t:0 "塔里哈问题解决"
 clever_dsk.144.d:0 "毫无疑问，塔里哈现在处于[SCOPE.sCountry('arg_great_now_scope').GetName]的权威之下，我们永远不会再让自己的家园被敌人践踏。"
 clever_dsk.144.f:0 "上天的安排让我陷入了如此可怕的境地，让我们勇敢地与那些使我们的土地陷入混乱的人作斗争；让我们消灭那些不虔诚的人、小偷、亵渎者，尤其是那些胆敢嘲笑我们善意的背信弃义的叛徒。我们不会被任何形式的危险吓倒，也不会担心我们在追求危险时采取的手段会犯错误。——[SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName]"
 clever_dsk.144.a:0 "是时候开发利用这片土地了。"
 clever_dsk.145.t:0 "英雄回归"
 clever_dsk.145.d:0 "我们独立战争的国民英雄[SCOPE.sCharacter('arg_hero_come_scope').GetFullName]最近在蒙得维的亚逗留。他最初支持[SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName]的绝对政权，但随着政权压迫，他的家人和朋友遭到迫害，促使他开始谴责政府的暴力行为。"
 clever_dsk.145.f:0 "我怀着真切的感受看到了我们不幸的国家的现状，最糟糕的是我看不到它的命运有任何改善。你知道我的感受，因此，当我看到我国最诚实的人遭受普遍迫害时，我不能批准[SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName]将军的行为。尽管如此，我绝不赞成任何一个阿根廷子弟加入外国来羞辱自己的国家。——[SCOPE.sCharacter('arg_hero_come_scope').GetFullName]"
 clever_dsk.145.a:0 "也许可以适当听取[SCOPE.sCharacter('arg_hero_come_scope').GetFullName]意见，为我们的英雄安排好住所。"
 clever_dsk.145.b:0 "礼貌地告诉[SCOPE.sCharacter('arg_hero_come_scope').GetFullName]离开南美洲。"
 clever_dsk.146.t:0 "群岛本土化"
 clever_dsk.146.d:0 "[SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName]收复了马尔维纳斯群岛，针对岛上的英国居民，他有了独特的想法。"
 clever_dsk.146.f:0 "英国海盗霸占我们神圣的领土太久了，现在他们只有两个选择：成为阿根廷人，或者被丢到南大西洋里喂鱼。——[SCOPE.sCharacter('arg_ruler_great_now_scope').GetFullName]"
 clever_dsk.146.a:0 "马尔维纳斯群岛是阿根廷人的本土。"
 clever_dsk.147.t:0 "世界大战爆发"
 clever_dsk.147.d:0 "奥匈皇储遇刺后，局势超出了奥地利政府的控制。战争的火花已经被点燃，一场席卷世界的大战降临了。"
 clever_dsk.147.f:0 "这会是一场空前剧烈的世界战争...旧国家及其世代相因的治国才略一齐崩溃，以致王冠落地滚在街上而无人拾取。-弗雷德里希·恩格斯"
 clever_dsk.147.a:0 "胜利或死亡！"
 clever_dsk.149.t:0 "[SCOPE.sCountry('aus_ferdinand_now_die_scope').GetName]皇储遇刺"
 clever_dsk.149.d:0 "[SCOPE.sCountry('aus_ferdinand_now_die_scope').GetName]皇储[SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFullName]和他的妻子乘坐敞篷汽车，在前往萨拉热窝巡视的路上，遭到一名塞尔维亚青年枪杀。不幸的是，[SCOPE.sCharacter('franz_ferdinand_now_die_scope').GetFirstName]夫妇没能挺过去，两人均伤重不治，各国大使纷纷对此事表达哀悼。"
 clever_dsk.149.f:0 "奥皇储遇刺，是俄国和塞尔维亚大斯拉夫主义者直接鼓动的结果；他们的目的就是要削弱三国同盟，分裂[SCOPE.sCountry('aus_ferdinand_now_die_scope').GetName]...只要贝尔格莱德这种罪恶的煽动根源不受到惩罚，则所有欧洲君主国家的和平政策将受到威胁。"
 clever_dsk.149.a:0 "欧洲的和平还能持续多久？"
 clever_dsk.150.t:0 "边境争端"
 clever_dsk.150.d:0 "[SCOPE.sCharacter('fight_with_bol_arg_scope').GetFullName]控诉我们“侵犯”了他们的胡胡伊省领土，还无端指责[SCOPE.sCharacter('bol_will_fight_south_scope').GetFullName]收留阿根廷败类，试图分裂他们的国家。这份接近于挑起战争的指控，让不少反对联邦的秘鲁人利用，试图在我们与智利、阿根廷的战争中，将所有智利人和玻利维亚人驱逐出去，建立一个纯秘鲁的国家。"
 clever_dsk.150.f:0 "玻利维亚人，你们欠我们在对抗西班牙的战争中为你们的自由和独立花费的数百万比索！你们欠我们在这场战争中流淌的阿根廷人的鲜血！要明白，一旦塔里哈恢复后，苏帕查河必须划分两个共和国的领土；但在我看来，如果我们能够确保图皮萨别墅和圣地亚哥科塔盖塔镇留在我们的领土内，那么这将是确保两国之间永远和平与自由贸易的最好和最重要的事情。作为获得这一利益的交换，我相信我们可以原谅在独立战争中所付出的费用，以及它在塔里哈被篡夺期间从塔里哈那里获得的利益。——[SCOPE.sCharacter('fight_with_bol_arg_scope').GetFullName]"
 clever_dsk.150.a:0 "我们不接受[SCOPE.sCharacter('fight_with_bol_arg_scope').GetFullName]无端的指控，[SCOPE.sCharacter('bol_will_fight_south_scope').GetFullName]会带领我们守护这个国家。"
 clever_dsk.150.b:0 "[SCOPE.sCharacter('bol_will_fight_south_scope').GetFullName]决定屈服于[SCOPE.sCharacter('fight_with_bol_arg_scope').GetFullName]以稳住脆弱的联邦。"
 clever_dsk.153.t:0 "飞艇的研究"
 clever_dsk.153.d:0 "受到一则关于“世界邮政服务和航空旅行”主题演讲的启发，[SCOPE.sCharacter('zeppelin_benefactor').GetFullName]决心研究一种大型飞艇，可以弥补我们军事上的不足。虽然遭遇不少挫折，但他还是取得了一些成果。"
 clever_dsk.153.f:0 "在我看来，这些诸如热气球的老飞行器械并没有什么希望前景……但独立的飞行器一定会被迅速发展运用起来。——[SCOPE.sCharacter('zeppelin_benefactor').GetFullName]"
 clever_dsk.153.a:0 "向齐柏林伯爵表示致敬。"
 clever_dsk.153.b:0 "这种无聊的发明没有任何用处，快点滚出我的视线。"
 01_afghanistan_events.97.t:0 "西姆拉宣言"
 01_afghanistan_events.97.d:0 "[SCOPE.sCountry('kab_disagree_gbr_scope').GetName]首领[SCOPE.sCharacter('kab_ruler_disagree_gbr_scope').GetFullName]拒绝了我们同盟的请求，并有传言称他会投靠俄国。印度总督对此发表了《西姆拉宣言》，声称只要喀布尔仍处于他的统治之下，我们就永远不可能指望我们周边的安宁能够得到保障，或者我们印度帝国的利益能够得到不可侵犯的维护。"
 01_afghanistan_events.97.f:0 "出于迫切需要以及对政策和正义的考虑，我们有理由支持沙阿·苏贾·乌尔·穆尔克的事业，最高权威人士一致有力地向总督阁下证实了沙阿·苏贾在整个阿富汗的声望。沙阿·苏贾·乌尔·穆尔克陛下将在自己的军队的包围下进入阿富汗，我们军队将协助他抵御外国干涉和派系反对。希望沙阿的臣民和追随者能迅速取代[SCOPE.sCharacter('kab_ruler_disagree_gbr_scope').GetFirstName]的王位；一旦他掌权，阿富汗独立和完整确立，我们的军队就会撤走。这些措施是确保英国王室财产的安全，也是帮助恢复阿富汗人民的统一和繁荣。"
 01_afghanistan_events.97.a:0 "我们会帮助阿富汗老国王重登王位，批准印度总督向阿富汗野蛮军阀开战。"
 01_afghanistan_events.97.b:0 "印度总督不可靠，我们需要亲自教训[SCOPE.sCountry('kab_disagree_gbr_scope').GetName]。"
 01_afghanistan_events.97.c:0 "我们不需要[SCOPE.sCountry('kab_disagree_gbr_scope').GetName]充当印度西部屏障。"
 01_afghanistan_events.96.t:0 "顺从的老国王"
 01_afghanistan_events.96.d:0 "喀布尔野蛮汗王已经被我们击溃，是时候履行诺言，让尊贵的杜兰尼王室——沙阿·苏贾统治阿富汗这片土地。"
 01_afghanistan_events.96.f:0 "总督声称，沙阿·苏贾将能够帮助恢复阿富汗人民的统一和繁荣，可以利用其影响力来调和阿富汗人民的分歧，确保消除伤害，并结束多年来损害阿富汗人民福祉和幸福的种种干扰。"
 01_afghanistan_events.96.a:0 "扶持前任阿富汗国王沙阿·苏贾。"
 01_afghanistan_events.96.b:0 "我们不需要“傀儡”国王。"
 clever_dsk.155.t:0 "提灯女子"
 clever_dsk.155.d:0 "[SCOPE.sCharacter('nanting_benefactor').GetFullName]在战争期间担任护士工作，她发现医务人员经常工作过度，对受伤士兵的护理很差。药品短缺，卫生条件差，集体感染很常见。为了拯救更多士兵的生命，她要求政府花钱设计一所预制医院，解决医院设施状况不佳的问题。"
 clever_dsk.155.f:0 "毫不夸张地说，她是这些医院里的“天使”，当她苗条的身躯安静地沿着每个走廊滑行时，每个可怜的人一看到她，脸上都会充满感激之情。当所有的医务人员都下班了，寂静和黑暗笼罩着那些躺着的病人时，人们可能会看到她独自一人，手里拿着一盏小灯，独自巡视。"
 clever_dsk.155.a:0 "同意[SCOPE.sCharacter('nanting_benefactor').GetFullName]的请求。"
 clever_dsk.155.b:0 "一个护士竟敢向我们提出要求？给我立马滚蛋。"
 clever_dsk.156.t:0 "安第斯战火"
 clever_dsk.156.d:0 "[SCOPE.sCountry('bol_with_peu_die_scope').GetName]现在面临智利和阿根廷两大强国入侵，来自智利的特工建议我们趁[SCOPE.sCountry('bol_with_peu_die_scope').GetName]内部虚弱的机会，向[SCOPE.sCharacter('bol_ruler_defeat_scope').GetFirstName]索要一些领土。"
 clever_dsk.156.f:0 "大臣们告诉[SCOPE.sCharacter('we_with_eat_bol_scope').GetFullName]，如果任由[SCOPE.sCharacter('bol_ruler_defeat_scope').GetFirstName]顺利组建邦联，以后会崛起一个巨大的安第斯怪物，它会严重威胁我们国家的安全。"
 clever_dsk.156.a:0 "是时候确定我们马托格罗索州与[SCOPE.sCountry('bol_with_peu_die_scope').GetName]边界了。"
 clever_dsk.156.b:0 "派遣军队，告诉[SCOPE.sCharacter('bol_ruler_defeat_scope').GetFullName]亚马逊边界该怎么划分。"
 clever_dsk.156.c:0 "[SCOPE.sCountry('bol_with_peu_die_scope').GetName]是我们的好邻居，我们不该侵略他们。"
 clever_dsk.157.t:0 "多米尼加叛乱"
 clever_dsk.157.d:0 "横征暴敛的无能官员，支付给[SCOPE.sCountry('hai_angry_to_fra_scope').GetName]的巨额赔款，沉重的税收终于压垮了多米尼加地区的人民。几个三位一体抵抗运动的成员，尤其是民族主义者杜阿尔特，私下一直谋求独立。尽管杜阿尔特已经被驱逐出伊斯帕尼奥拉岛，仍有一伙叛军以他名义发布独立宣言，并向奥萨马堡垒发起进攻，试图分裂我们的国家。"
 clever_dsk.157.f:0 "我们在圣多明各堡垒的驻军完全没防备，被一群叛军轻易攻占。叛军桑切斯在孔德门的顶端立即升起了新的多米尼加国旗，高呼国家口号：上帝、祖国和自由！如果赶快不采取行动，伊斯帕尼奥拉岛会产生一个敌对我们的国家。"
 clever_dsk.157.a:0 "谁也不能分裂我们的国家！"
 clever_dsk.157.b:0 "派遣秘密警察，好好“教育”一下这群说西语的叛乱分子。"
 clever_dsk.157.c:0 "做出让步，给予他们自治权。"
 clever_dsk.158.t:0 "多米尼加起义"
 clever_dsk.158.d:0 "受够了[SCOPE.sCountry('hai_track_with_dom_scope').GetName]无能官员的盘剥压榨，[SCOPE.sCountry('dom_against_hai_scope').GetName]人民在桑切斯领导下打响了起义的第一枪。三位一体抵抗运动的成员们高呼“上帝、祖国和自由”的口号，攻占了圣多明各的堡垒。[SCOPE.sCountry('hai_track_with_dom_scope').GetName]领袖闻讯，立刻率领临时执政军展开反攻。为了祖国的生存，[SCOPE.sCountry('dom_against_hai_scope').GetName]外交使者请求我们支援。"
 clever_dsk.158.f:0 "我承认自己理应受到如此不顾一切的对待，这让我感到羞耻、绝望，让我一句话也说不出来，但我在心里发誓，我不会考虑或担心提供手段，而是要向他们证明：整个世界并非如此，我们只有一个专有名称，多米尼加人，我们值得承受它。——胡安·巴勃罗·杜阿尔特"
 clever_dsk.158.a:0 "向起义者们输送必要的物资。"
 clever_dsk.158.b:0 "我们没必要去维护加勒比海的和平。"
 clever_dsk.159.t:0 "中风悲剧"
 clever_dsk.159.d:0 "凯撒[SCOPE.sCharacter('wilhelm_iv_sick_benefactor').GetFirstName]突然中风发作，虽然在这之前，他已经出现了精神异常的行为，阻碍了他履行政府职责。但今天的凯撒，甚至做不到和大臣们对话。宫廷里弥漫着悲凉的气氛，教士们为[SCOPE.sCharacter('wilhelm_iv_sick_benefactor').GetFirstName]祈祷。"
 clever_dsk.159.f:0 "[SCOPE.sCharacter('wilhelm_iv_sick_benefactor').GetFirstName]痛苦地躺在床上，私人医生建议我们为他签署摄政宪章。毕竟在这以前，凯撒弟弟威廉王子已经代理统治过一段时间，向我们证明他能治理好这个国家。"
 clever_dsk.159.a:0 "听取私人医生意见，为[SCOPE.sCharacter('wilhelm_iv_sick_benefactor').GetFirstName]签署摄政宪章，由其弟管理国家事务。"
 clever_dsk.159.b:0 "快去请一个训练有素的医生。"
 clever_dsk.159.c:0 "让医学专家[SCOPE.sCharacter('help_wilhelm_IV_benefactor').GetFullName]尝试救治凯撒。"
 clever_dsk.160.t:0 "卡塔尔叛乱"
 clever_dsk.160.d:0 "我们驻卡塔尔的代表艾哈迈德·本·穆罕默德传来消息，声称卡塔尔酋长贾西姆·本·穆罕默德·阿勒萨尼以帮助一个部落长老讨回货物为借口，试图派遣军队囚禁他，这是赤裸裸的反叛行为。"
 clever_dsk.160.f:0 "根据1835年海上停战协定，巴林和阿曼等阿拉伯酋长国禁止相互发动战争，由[SCOPE.sCountry('gbr_independencia_of_qatar_scope').GetName]皇家海军监督。如果我们贸然镇压卡塔尔，可能会给[SCOPE.sCountry('gbr_independencia_of_qatar_scope').GetName]干预的理由。"
 clever_dsk.160.a:0 "卡塔尔是我们的属地，并不是一个独立的酋长国，我们有资格处置它。"
 clever_dsk.160.b:0 "花钱赔偿卡塔尔酋长贾西姆。"
 clever_dsk.161.t:0 "[SCOPE.sCountry('qatar_against_bhn_scope').GetName]起义"
 clever_dsk.161.d:0 "我们驻卡塔尔的代表传来消息，声称[SCOPE.sCountry('bhn_track_with_qatar_scope').GetName]在瓦克拉市场逮捕了一名纳伊姆部落的人，没收了他的一批珍珠货物，还抓走了试图抵抗的纳伊姆部落首领。当地部落长老求助卡塔尔酋长贾西姆去麦纳麦讨个说法，结果酋长听信[SCOPE.sCharacter('bhn_ruler_with_qatar_scope').GetFirstName]谎言，只身进入[SCOPE.sCountry('bhn_track_with_qatar_scope').GetName]被监禁。这引起[SCOPE.sCountry('qatar_against_bhn_scope').GetName]人民愤怒，开始反抗巴林的统治。"
 clever_dsk.161.f:0 "亲爱的，我的，我的， 我的 ！只要贾西姆还被锁链锁住，你们就不能与我们和平相处，我们必须用抛光钢剑夺回我们的船只！"
 clever_dsk.161.a:0 "借入阿拉伯湾事务，给予[SCOPE.sCountry('qatar_against_bhn_scope').GetName]军事援助。"
 clever_dsk.161.b:0 "我们不要干预[SCOPE.sCountry('bhn_track_with_qatar_scope').GetName]内政。"
 clever_dsk.162.t:0 "柏林会议：安哥拉地区"
 clever_dsk.162.d:0 "我们是第一批在安哥拉建立永久殖民地的探险家！我们应该在其他人到达之前尽快确定我们的领土主张..."
 clever_dsk.163.t:0 "柏林会议：莫桑比克地区"
 clever_dsk.163.d:0 "我们是第一批在莫桑比克建立永久殖民地的探险家！我们应该在其他人到达之前尽快确定我们的领土主张..."
 clever_dsk.164.t:0 "弱者的怜悯"
 clever_dsk.164.d:0 "我们的军队在云盖战役打败了[SCOPE.sCountry('chl_compensate_peu_scope').GetName]，[SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName]仓惶地逃离战场。很显然，这个愚蠢的邦联已经难以维持下去。"
 clever_dsk.164.f:0 "英勇的将军和士兵们跨过了安托法加斯塔，在利马城进行隆重的阅兵仪式，道路两旁秘鲁人用惊恐的眼神看着我们。[SCOPE.sCountry('chl_compensate_peu_scope').GetName]作为我们的邻居，完全消灭它会破坏我们的国际声誉。也许我们可以要求[SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName]"同意"解散邦联，以换取我们占领的安托法加斯塔地区。"
 clever_dsk.164.a:0 "战争并不是针对秘鲁和玻利维亚人民，告诉[SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName]，只要宣布解散邦联，我们可以归还安托法加斯塔地区。"
 clever_dsk.164.b:0 "我们不会在领土问题上退让。"
 clever_dsk.165.t:0 "[SCOPE.sCountry('winner_chl_peu_scope').GetName]的要求"
 clever_dsk.165.d:0 "我们的军队在云盖战役被[SCOPE.sCountry('winner_chl_peu_scope').GetName]军队决定性击败，[SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName]幸运地从战场撤离。然而[SCOPE.sCountry('winner_chl_peu_scope').GetName]要求[SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName]宣布放弃并解散邦联，否则他们不会退让侵占的土地。"
 clever_dsk.165.f:0 "[SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName]依然不肯放弃邦联，他伤心的告诉他的朋友自己不幸的遭遇，同时并准备经秘鲁的阿雷基帕返回玻利维亚，重新开始征服战争，然而无论是[SCOPE.sCountry('chl_compensate_peu_scope').GetName]的政治家，还是秘鲁的人民，集体反对[SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName]，一代护国公或将陨落？"
 clever_dsk.165.a:0 "接受[SCOPE.sCountry('winner_chl_peu_scope').GetName]的提议，收回安托法加斯塔领土。"
 clever_dsk.165.b:0 "只要护国公[SCOPE.sCharacter('chl_compensate_peu_ruler_scope').GetName]活着，邦联永不灭亡。"
 01_india_events.21.t:0 "曼尼普尔邦安全问题"
 01_india_events.21.d:0 "自曼尼普尔国王臣服于我们之后，其北部的[SCOPE.sCountry('nga_be_killed_scope').GetName]部落一直定期袭击我们热爱和平的臣民。虽然我们尝试在[SCOPE.sCountry('nga_be_killed_scope').GetName]村庄引进[SCOPE.sCountry('kki_be_killed_scope').GetName]人定居，以平衡各部落，保护曼尼普尔山谷的安全，但仍有不少野蛮人不服管教。"
 01_india_events.21.f:0 "曼尼普尔国王曾在梅泰王朝时期征服了不少地方，但其糟糕的统治才能让其统治仅限在山谷地区。山区的[SCOPE.sCountry('nga_be_killed_scope').GetName]人和[SCOPE.sCountry('kki_be_killed_scope').GetName]仍处于无人统治的状态。如果我们不去解决他们，任由这些部落冲突仇杀，甚至袭击我们，曼尼普尔邦的安全则无从谈起。"
 01_india_events.21.a:0 "是时候教导这些部落如何与人和平共处了。"
 01_india_events.21.b:0 "我们不愿参与部落冲突。"
 01_india_events.22.t:0 "贷款偿清"
 01_india_events.22.d:0 "[SCOPE.sCharacter('ruler_gbr_no_loans_scope').GetFirstName]和同僚们成功还清1772年[SCOPE.sCountry('gbr_no_loans_scope').GetName]议会向我们提供的140万英镑贷款，作为回报，[SCOPE.sCountry('gbr_no_loans_scope').GetName]议会决定放松对我们的控制，允许恢复我们部分曾失去的权力。"
 01_india_events.22.f:0 "如果反思过去，对当地印度人的不尊重是我们的失败之处。投机者造成大量孟加拉人饿死，腐败的官员只为捞走印度财富，道德沦丧的职员遍布整个官场...我们不允许这样的行为再发生，否则公司依然会像1772年金融危机时那样脆弱。"
 01_india_events.22.a:0 "董事会传来致谢[SCOPE.sCharacter('ruler_gbr_no_loans_scope').GetFirstName]的掌声。"
 01_india_events.23.t:0 "种姓消除"
 01_india_events.23.d:0 "任何人不得因种姓、宗教、出生地而受到歧视。当众议员将这简简单单的一句话写入我们的宪法，并向大众公布后，场外的人群传来一阵又一阵庆祝呼喊的声音。"
 01_india_events.23.f:0 "没有比种姓制度更堕落的社会组织制度了。这种制度使人们麻木、瘫痪，无法进行有益的活动。我们之所以打破种姓制度，不是为了实现跨种姓聚餐和跨种姓通婚，而是为了摧毁种姓制度所依据的宗教观念，尤其是传授种姓宗教的经典。也许歧视还会躲在暗处，但我们终究会彻底战胜它。"
 01_india_events.23.a:0 "这是所有人值得庆祝的一天。"
 01_india_events.24.t:0 "科赫诺尔钻石"
 01_india_events.24.d:0 "[SCOPE.sCountry('pan_koh_i_noor_scope').GetName]的统治者[SCOPE.sCharacter('pan_ruler_koh_i_noor_scope').GetFirstName]出于对钻石诅咒的恐惧，希望以低价贱卖一颗名为科赫诺尔的钻石，它有着华丽的外表和夺目的光芒，就像一座光明之山。"
 01_india_events.24.f:0 "印度教经文曾对这颗钻石描述"谁拥有它，谁就拥有整个世界。谁拥有它，谁就得承受它所带来的灾难，惟有上帝或一位女人拥有它，才不会承受任何惩罚."持有它的巴布尔，中年便因为疟疾死去...夺得它的纳迪尔沙，在精神错乱下被将士砍下头颅...瑟瑟发抖的[SCOPE.sCharacter('pan_ruler_koh_i_noor_scope').GetFirstName]担心诅咒悲剧降临到自己，希望按照古老传说将钻石卖给我们的维多利亚女王。"
 01_india_events.24.a:0 "接受[SCOPE.sCountry('pan_koh_i_noor_scope').GetName]的报价。"
 01_india_events.24.b:0 "也许我们让[SCOPE.sCountry('pan_koh_i_noor_scope').GetName]臣服与我们或东印度公司，就可以逼迫[SCOPE.sCharacter('pan_ruler_koh_i_noor_scope').GetFirstName]"免费"交出钻石。"
 01_india_events.25.t:0 "罗法特法案"
 01_india_events.25.d:0 "许多印度人竟敢公开抗议我们的政策，发起暴乱。接到这则消息后，[SCOPE.sCountry('gbr_bic_no_speak_scope').GetName]议会要求我们立即制定罗拉特法案，防止恐怖主义和颠覆政府的活动扩散。"
 01_india_events.25.f:0 "所有政治煽动者需要进行长达两年的不经审判的拘留，在这期间不得上诉...煽动叛乱案件可以不经陪审团的摄像机审判...警察可任意逮捕可疑对象，无须公开审讯，允许长期监禁..."
 01_india_events.25.a:0 "也许这样他们才会收敛一点儿。"
 clever_dsk.166.t:0 "蓄水池的悲剧"
 clever_dsk.166.d:0 "我们王国的继承人[SCOPE.sCharacter('leopold_hainaut_heir_scope').GetFullName]不幸掉入蓄水池感染上肺炎，在病床上奄奄一息。一些医生告诉[SCOPE.sCharacter('leopold_ii_sad_scope').GetFullName]孩子正在失去生命特征，愿主保佑他摆脱痛苦。"
 clever_dsk.166.f:0 "[SCOPE.sCharacter('leopold_ii_sad_scope').GetFullName]跪倒在病床旁边，无法控制地啜泣。幕僚们安慰这位伤心的父亲，大家都明白孩子很快就要离开这个美好的世界。"
 clever_dsk.167.t:0 "共产党宣言"
 clever_dsk.167.d:0 "一位来自北莱茵的哲学家受一个叫德国共产主义同盟的地下秘密组织委托，撰写发表了《共产党宣言》.这本小册子出版印刷后，以惊人的速度在民间传播。"
 clever_dsk.167.f:0 "共产党人不屑于隐瞒自己的观点和目的。他们公开宣称，只有用暴力推翻一切现存社会制度，才能达到自己的目的。让统治阶级在共产主义革命面前颤抖吧。无产阶级除了锁链外，一无所有。他们将赢得整个世界。全世界劳动人民，联合起来！"
 clever_dsk.167.a:0 "立即对[SCOPE.sCharacter('friedrich_engels_now_scope').GetFullName]开展通缉。"
 clever_dsk.167.b:0 "[SCOPE.sCharacter('friedrich_engels_now_scope').GetFullName]的思想能为我们国家带来进步。"
 clever_dsk.168.t:0 "逃亡的共产党人"
 clever_dsk.168.d:0 "一位思想激进的共产党人在发表了《共产党宣言》后，参与了几次对自己国家的武装暴乱行动，不仅被自己国家剥夺公民身份，还遭到当地政府全力追捕。有传言这名人士现已成功逃出边境，无论是敌人还是党内朋友都好奇他的落脚点。"
 clever_dsk.168.f:0 "对[SCOPE.sCountry('friedrich_engels_now_scope').GetName]的通缉令描述是“身高5英尺6英寸、头发金色、前额头光滑、眉毛金色、鼻子和嘴巴圆称、胡须淡红、下巴椭圆形、肤色健康、特点是说话快，眼神短浅”.如果能把他抓住送回原籍，也许我们能获得一笔不菲的赏金."
 clever_dsk.168.a:0 "他会在哪里落脚？"
 clever_dsk.169.t:0 "边境威胁"
 clever_dsk.169.d:0 "[SCOPE.sCountry('brz_eat_bol_now_scope').GetName]的军队已经在我们边境集结，[SCOPE.sCharacter('bol_hate_brz_now_scope').GetFirstName]很清楚接下来会发生什么。一位来自[SCOPE.sCountry('brz_eat_bol_now_scope').GetName]的外交官告诉我们，只要[SCOPE.sCharacter('bol_hate_brz_now_scope').GetFirstName]愿意和他们积极解决边界划分的问题，两国仍能保持友好的关系。"
 clever_dsk.169.f:0 "哦，[SCOPE.sCharacter('bol_hate_brz_now_scope').GetFirstName]将军，很明显我们之前对亚马逊河流域的地图有些偏差，马德拉河和与贾瓦里河源头似乎位置不准确，我们真诚希望双方可以友好解决这次边界问题。"
 clever_dsk.169.a:0 "这是赤裸裸的战争威胁，[SCOPE.sCharacter('bol_hate_brz_now_scope').GetFirstName]不会丢掉玻利维亚的一寸土地。"
 clever_dsk.169.b:0 "[SCOPE.sCountry('brz_eat_bol_now_scope').GetName]是我们友善的邻居，可以稍微退让下，维护我们两国之间的友谊。"
 clever_dsk.170.t:0 "新皇帝？"
 clever_dsk.170.d:0 "在[SCOPE.sCountry('mex_fra_aus_now_scope').GetName]的军队和保守派的簇拥下，[SCOPE.sCharacter('mex_hate_fra_now_scope').GetFirstName]受议会邀请来到墨西哥，他坚决要在墨西哥全国公民投票批准的情况下，才愿意接受墨西哥的王位。出乎意料的是，友好的法国军队"说服"了周边公民向皇帝投票，[SCOPE.sCharacter('mex_hate_fra_now_scope').GetFirstName]接受了大多数墨西哥人投票支持他成为皇帝的宣言。"
 clever_dsk.170.f:0 "如果你能从混乱中恢复秩序，从苦难中带来好运，让人民心中团结一致，你将成为现代最伟大的君主。去吧，可怜的傻瓜！你可能会后悔拥有你美丽的米拉马尔城堡！"
 clever_dsk.170.a:0 "向[SCOPE.sCountry('mex_fra_aus_now_scope').GetName]和远在欧洲的家人们改善关系。"
 clever_dsk.170.b:0 "我们不会接受[SCOPE.sCountry('mex_fra_aus_now_scope').GetName]的控制。"
 clever_dsk.171.t:0 "极端主义的兴起"
 clever_dsk.171.d:0 "据当地大使馆人员汇报，经历破产和战乱的[SCOPE.sCountry('ger_hitler_is_coming_scope').GetName]，今年新一轮的投票中，由民族社会主义德国工人党获得议会的多数席位。他们鼓吹反共反犹，甚至扬言要废掉现行的议会民主制，很明显，这是对民主赤裸裸的践踏。"
 clever_dsk.171.f:0 "我的面前，站着的是一个民族，一个在屈辱中呻吟的民族!那场战争结束之后，我们这个民族的骄傲就没有了!“你们或许要说:[SCOPE.sCharacter('ger_ruler_hitler_is_coming_scope').GetFirstName]先生，我需要一个工作，一块面包。是啊，你的说法很对，生命的生存实在是太重要了，但是我要告诉你们，这世界上还有一种东西比生命更重要，那是自由!那就是尊严!"
 clever_dsk.171.a:0 "向[SCOPE.sCharacter('ger_ruler_hitler_is_coming_scope').GetFirstName]致电，庆祝他胜选。"
 clever_dsk.171.b:0 "我只看到一群大猩猩向它们的酋长一边伸出右臂，一边“吽吽”的吼叫。"
 clever_dsk.172.t:0 "探险者的请求"
 clever_dsk.172.d:0 "[SCOPE.sCharacter('nile_david_livingstone_scope').GetFirstName]在完成几次穿越非洲的探险后，将自身经历撰写至《传教士游记》,这本书鼓励传教士利用“合法贸易”手段来结束非洲的奴隶贸易，其中的田野科学和对非洲人民的异常同情的描述，更是引起了许多读者追捧。现在[SCOPE.sCharacter('nile_david_livingstone_scope').GetFirstName]请求我们能够资助他完成对尼罗河源头的探险，这或许能够终结尼罗河源头的争议，提高我们的国际威望。"
 clever_dsk.172.f:0 "我们经过一名女奴隶，她被枪击或刺穿身体，躺在路上：一群男人站在离她约一百码远的一侧，另一群女人站在另一侧，看着这一切；他们说，那天早上一个阿拉伯人经过，因为失去了她所付出的代价而愤怒地这样做了，因为她再也无法行走...逃亡、饥饿和死亡随之而来；我们必须再次表明我们的信念：这些奴隶战争后的死亡率，加上前往海岸和中途航行的损失，肯定不会超过五分之一的奴隶能够到达古巴和其他地方的“好心的主人”那里，而根据奴隶主对《圣经》的解读，这是上帝为他们安排的。"
 clever_dsk.172.a:0 "优秀的探险者值得我们付出，就如伊莎贝拉女王资助哥伦布一样。"
 clever_dsk.172.b:0 "拒绝资助这种无聊的探险活动。"
 clever_dsk.173.t:0 "探险者的请求"
 clever_dsk.173.d:0 "[SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFirstName]曾成功完成过加拿大西北航线的通行，是我们国家优秀的探险者。现在，[SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFirstName]希望为我们国家做更多的事，完成史无前例的南极点探险，他向我们提出，只需要一点资金资助他购买毛皮服装、雪橇、狗等设备，就能为祖国换来无上的荣誉。"
 clever_dsk.173.f:0 "我怀着强烈的兴趣阅读富兰克林北极探险的故事，这影响了我的整个人生。这次南极探险，不仅将是祖国的一大成就，更是所有人类的一大成就。"
 clever_dsk.173.a:0 "[SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFullName]，祖国永远是你最坚强的后盾。"
 clever_dsk.173.b:0 "我可不希望南极多一个冰棍。"
 clever_dsk.174.t:0 "尼罗河凯旋"
 clever_dsk.174.d:0 "[SCOPE.sCharacter('nile_david_livingstone_scope').GetFirstName]在[SCOPE.sCountry('gbr_nile_david_livingstone_scope').GetName]的资助下成功发现尼罗河源头，一端来自埃塞俄比亚高地，另一端发源于中非山区，同时他也绘制了大量赞比西河上游的内容。"
 clever_dsk.174.f:0 "我的大量物资都被当地酋长盗走了...尽管艰难地穿过面向坦噶尼喀湖的沼泽，我的身体快支撑不住了...虽然不得不与一个奴隶贩子继续前进，但眼前陌生的大湖让我精神重新焕发，我知道，尼罗河的源头就在附近。"
 clever_dsk.174.a:0 "祝贺[SCOPE.sCountry('gbr_nile_david_livingstone_scope').GetName]。"
 clever_dsk.174.b:0 "他们照片一定是假的，所有采集样本肯定是[SCOPE.sCharacter('nile_david_livingstone_scope').GetFullName]在本地伪造的。"
 clever_dsk.175.t:0 "[SCOPE.sCountry('nor_roald_amundsen_return_antarctica_scope').GetName]抵达南极点"
 clever_dsk.175.d:0 "[SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFullName]在[SCOPE.sCountry('nor_roald_amundsen_return_antarctica_scope').GetName]的资助下成功抵达南极点并安全返回，尽管有些奇怪的人士抨击他吃狗的行为，但不可否认这项伟大的成就。"
 clever_dsk.175.f:0 "据[SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFirstName]口述，他的队伍使用滑雪板和狗拉雪橇进行运输，一路上宰杀了一些狗充当鲜肉来源。在沿着一条此前未知的阿克塞尔海伯格冰川路线前进时，经过四天的攀登，他们终于到达南极点。[SCOPE.sCharacter('roald_amundsen_get_antarctica_scope').GetFirstName]兴奋地将南极高原重新命名为哈康七世高原，这是属于[SCOPE.sCountry('nor_roald_amundsen_return_antarctica_scope').GetName]的荣耀。"
 clever_dsk.175.a:0 "祝贺[SCOPE.sCountry('nor_roald_amundsen_return_antarctica_scope').GetName]。"
 clever_dsk.175.b:0 "不过侥幸罢了。"
 clever_dsk.176.t:0 "阿拉斯加交易"
 clever_dsk.176.d:0 "出于对其它欧洲势力可能占领阿拉斯加的担忧，以及阻止英格兰人扩张的需要，[SCOPE.sCountry('rus_sell_alaska_real_scope').GetName]决定把阿拉斯加卖给[SCOPE.sCountry('usa_buy_alaska_real_scope').GetName]以换取一笔不菲的资金，据传最终售价高达720万美元。"
 clever_dsk.176.f:0 "阿拉斯加的土地交易激起了[SCOPE.sCountry('usa_buy_alaska_real_scope').GetName]民众的反对，有人声称这是在拿纳税人的血汗钱买一片蛮荒之地，嘲讽负责交易的国务卿花钱买了一个无用的冰柜。"
 clever_dsk.176.a:0 "是时候更新我们的北美洲地图了"
 pax_britannica_events.142.a:0 "这是对我们的不敬"
 pax_britannica_events.99.t:0 "[SCOPE.sC('britain_scope').GetNameNoFormatting] 霸权主义"
 pax_britannica_events.99.d:0 "[concept_primary_demand]: [SCOPE.sC('britain_scope').GetName] 强迫 [concept_impose_hegemony] 在 [GetPlayer.GetName].\n\n如果我们拒绝，这将引发 [concept_diplomatic_play] 这可能会升级为 [concept_war]"
 pax_britannica_events.99a:0 "这就是战争！"
 pax_britannica_events.99b:0 "我们别无选择"
 modifier_pax_britannica_hegemony_imposed:0 "霸权主义"
 pax_britannica_events.1111a.c:0 "效果会随着 [concept_pax_britannica] 增长"
 clever_dsk.177.t:0 "哈布斯堡君主的哀求"
 clever_dsk.177.d:0 "随着我们统一几乎整个德意志，失去所有土地的#yellow 哈布斯堡#!贵族不得不离开他们世代居住的宫殿，昔日繁华的美泉宫和布拉格城堡，如今尽显得格外黯淡。当我们的士兵撤走宫殿里历代哈布斯堡君主的画像，抢夺施蒂里亚和蒂罗尔的土地时，一群世居在南德意志土地上的贵族们充满了怨言，传出复辟#yellow 哈布斯堡#!的口号。"
 clever_dsk.177.f:0 "弗朗茨·约瑟夫为首的哈布斯堡贵族恳求我们归还他们世代居住的宫殿和其它财产，作为回报，他们会帮助我们安抚刚刚并入我们版图的南德意志贵族。针对这个请求，部分官员提议可以让出一座城市，考虑哈布斯堡家族的财产集中在#yellow 维也纳#!和#yellow 布拉格#!，我们可以赐予他们城主的地位。"
 clever_dsk.177.a:0 "奥地利大公可以拿回他在#yellow 维也纳#!的财产。"
 clever_dsk.177.b:0 "波希米亚国王会回到他忠诚的#yellow 布拉格#!。"
 clever_dsk.177.c:0 "这些都是德意志人的共同财产，#yellow 哈布斯堡#!家族什么也得不到。"
 socialist_revolution_events.2.b:0 "我并没有准备好建设社会主义！"
 clever_dsk.178.t:0 "海防与塞防？"
 clever_dsk.178.d:0 "过去几场与洋鬼子的战争中，许多官员见证了海军力量在战场上的决定性作用。总督[SCOPE.sCharacter('chi_haijun_lihongzhang_benefactor').GetFullName]提议，当前海防虚备，急需筹备，主张移塞防之饷增补海防。而总督[SCOPE.sCharacter('chi_lujun_zuozongtang_benefactor').GetFullName]认为，北方罗刹佬其心险恶，不加强塞防只会让他们肆无忌惮地蚕食我们的领土。"
 clever_dsk.178.f:0 ""新疆不复，于肢体之元气无伤；海疆不防，则心腹之患愈棘；如今力难兼顾，不如停撤之饷，即匀作海防之饷."\n\n"臣无否[SCOPE.sCharacter('chi_haijun_lihongzhang_benefactor').GetFirstName]之意，东则海防，西则塞防，二者并重.若不增塞防以保新疆，俄寇陆路或海路均可直插京师，其危远甚仅依海路之英吉利、法兰西.英法如肢体之病，而与我边界漫长之俄寇，犹如心腹之患啊！""
 clever_dsk.178.a:0 "批准[SCOPE.sCharacter('chi_haijun_lihongzhang_benefactor').GetFullName]的主张。"
 clever_dsk.178.b:0 "[SCOPE.sCharacter('chi_lujun_zuozongtang_benefactor').GetFullName]说的更对。"
 clever_dsk.178.c:0 "你们两人都给我滚出去。"
 orleanist_flavor.3.t:0 "革命的预兆"
 orleanist_flavor.3.d:0 "一群可恶的巴黎暴民冲进了议会厅，高呼:既不要国王，也不要摄政王。共和国万岁！这显然是有煽动分子捣鬼，恶意损害我们奥尔良家族的名誉。"
 orleanist_flavor.3.f:0 "我们已经给他们很大的民主权利了，这群不知死活的小布尔乔亚仅仅歉收点粮食，就敢离开机器，跑到议会厅胡闹？\n\n国王陛下，眼下这群市民已经占领了杜伊勒里宫和波旁宫，再不做出决定，恐怕要重演路易断头的故事。"
 orleanist_flavor.3.a:0 "也许趁早妥协更好"
 orleanist_flavor.3.b:0 "他们怎敢造反？"
 china_borders.15.b:0 "放弃岭北行省的构想，不如花点金钱帮助当地的百姓"
 china_borders.16.b:0 "现代技术足够我们实现以往只能羁縻的地方，传统的都护府没有必要再建了。无论是克烈汗，帖木儿，还是昔班尼的子孙，我们都会平等对待。"
 bc_finish.8.t:0 "协约国阅兵仪式"
 bc_finish.8.d:0 "噩梦般的大战终于结束了，在[SCOPE.sCountry('gbr_and_fra_win_wwi_come_scope').GetName]领导的组织下，协约国士兵们一起在布鲁塞尔举行盛大的阅兵仪式，纪念这场伟大的胜利。我们尊敬的[SCOPE.sCharacter('gbr_and_fra_win_wwi_scope').GetFullName]也受邀前往布鲁塞尔，观看这场盛大的阅兵仪式。"
 bc_finish.8.f:0 "[SCOPE.sCountry('gbr_and_fra_win_wwi_come_scope').GetName]的胜利属于每一个在战壕中流血的士兵，属于每一个在后方坚持的母亲。今天，我们终于将#yellow 德意志帝国#!的野心埋葬在灰烬中。但和平不是终点，而是新的斗争——我们必须让这片土地重新生长出希望。"
 bc_finish.8.a:0 "为我们的胜利，干杯！"
 clever_dsk.179.t:0 "流放西伯利亚"
 clever_dsk.179.d:0 "很明显，我们在[SCOPE.sState('beautiful_siberan_arrive_state').GetName]的监狱已经装不下那么多囚犯了。[SCOPE.sCharacter('rus_ruler_make_people_love_siberian').GetFirstName]已决心将部分囚犯送往广袤的“边疆”去接受严寒和贫穷的劳改惩罚，但在送走哪些犯人的问题上，[SCOPE.sCharacter('rus_ruler_make_people_love_siberian').GetFirstName]有些犹豫不决。"
 clever_dsk.179.f:0 "以全俄罗斯皇帝陛下之名,你因触犯《帝国刑法典》第5条,被判处终身流放至西伯利亚,在苦役劳动中赎罪,直至生命终结。记住,你的罪行不仅背叛了皇帝,更亵渎了上帝。流放到[SCOPE.sState('beautiful_siberan_welcome_state').GetName]是给你忏悔的机会——在苦寒之地洗净灵魂,方能获得救赎。"
 clever_dsk.179.a:0 "是时候让之前那批造反的贵族，去西伯利亚好好反省了。"
 clever_dsk.179.b:0 "这群犯罪的农民，立马给我发配到[SCOPE.sState('beautiful_siberan_welcome_state').GetName]。"
 clever_dsk.179.c:0 "让底层异族去开垦我们的边疆。"
 clever_dsk.179.i:0 "赦免他们的罪行，让他们牢记[SCOPE.sCharacter('rus_ruler_make_people_love_siberian').GetFirstName]父亲的仁慈。"
 clever_dsk.179.j:0 "把所有罪犯通通流放，但是为他们支付迁移费用，让这些罪人好好感激[SCOPE.sCharacter('rus_ruler_make_people_love_siberian').GetFirstName]。"
 not_russian_angry_tt:0 "这会导致当地底层人群变得更激进"
 clever_dsk.180.t:0 "索马里购地案"
 clever_dsk.180.d:0 "[SCOPE.sCountry('new_ita_want_somali_scope').GetName]提出向我们购买索马里地区，声称他们有能力将索马里打造成一个堪比欧洲的美丽城市。他们开出的价码是@money!#yellow 1M#!。"
 clever_dsk.180.f:0 "一旦实现这一目标，索马里地区将成为新罗马，它会有丰富的旅游设施，高端的披萨美食，以及最优质的服务。港口、城市、公路一一拔地而起，它将迅速成为上帝眷顾之地本该成为的模样。"
 clever_dsk.180.a:0 "同意[SCOPE.sCountry('new_ita_want_somali_scope').GetName]的请求。"
 clever_dsk.180.b:0 "[SCOPE.sCountry('new_ita_want_somali_scope').GetName]显然没有认清自己的地位，它们什么也不会得到。"
 clever_dsk.181.t:0 "[SCOPE.sCharacter('chi_zhangzhidong_gongsi_benefactor').GetFullName]上奏"
 clever_dsk.181.d:0 "湖广总督[SCOPE.sCharacter('chi_zhangzhidong_gongsi_benefactor').GetFullName]在走访西方多国后，带回了许多机器设备。为了更好地发展洋务运动，他向[SCOPE.sCharacter('chi_junzhu_jieshou_benefactor').GetFullName]上书，建议提供资金供他在家乡汉阳建立一座规模宏大的兵工厂。"
 clever_dsk.181.f:0 "臣[SCOPE.sCharacter('chi_zhangzhidong_gongsi_benefactor').GetFirstName]此前经途英吉利、法兰西、德意志等国，为购火器、舰船、机床等设备，尽遭洋夷刁难。故感慨今求一千之枪，难于筹十万之饷。‌若能设厂自筹枪炮，方免受制于人，庶为自强之计，望君能批准老臣筹款以建军厂。"
 clever_dsk.181.a:0 "同意[SCOPE.sCharacter('chi_zhangzhidong_gongsi_benefactor').GetFullName]的请求。"
 clever_dsk.181.b:0 "异想天开的注意，赶紧滚。"
 clever_dsk.181.a.ctt:0 "我们可以手动成立汉阳兵工厂"
 clever_dsk.182.t:0 "粉碎[SCOPE.sState('solve_lalla_scope').GetName]叛乱"
 clever_dsk.182.d:0 "一群[SCOPE.sCulture('maghrebi_culture').GetName]人受到圣战分子的号召，试图在卡比利亚山区发动叛乱，毁坏我们辛辛苦苦建设的城市。尽管叛乱范围一度扩大到周围沙漠地区，但在我们优秀的军官领导下，叛乱已成功粉碎。其中，有一位特殊的[SCOPE.sCulture('maghrebi_culture').GetName]女性，很多人都是受她蛊惑造反，三番五次袭扰我们的运输和补给线，好在我们的马歇尔·兰登将军抓住了她。由于是女人，军官们建议将她囚禁在偏僻的地方关押至死，尽可能降低她的影响力。"
 clever_dsk.182.f:0 "你的手下为什么要向#yellow 法兰西#!军队开枪，你明明知道这违反了你哥哥制定的投降惯例...\n\n上帝想要[SCOPE.sState('solve_lalla_scope').GetName]，这不是你的错，也不是我的错。你的士兵从他们的队伍中出来，渗透到我的村庄。我真诚地为自己辩护。我现在是你的俘虏，我没有责备你，你不应该责备我，它是这样写的！\n\n听好，你的罪名是利用宗教和虚伪的爱国论调，误导很多[SCOPE.sCulture('maghrebi_culture').GetName]人参与你组织的这场叛乱，你明知道根本没有多少胜算...\n\n你们#yellow 法兰西#!曾经的圣女#yellow 贞德#!不也是高举上帝的旗帜反抗敌人吗？"
 clever_dsk.182.a:0 "无礼，将她关押至贝尼-斯利曼附近的监狱。"
 clever_dsk.182.b:0 "[SCOPE.sCulture('maghrebi_culture').GetName]人和#yellow 法兰西#!人是平等的，这次起义爆发不能归咎与她，将她释放吧。另外再拨款重建[SCOPE.sState('solve_lalla_scope').GetName]，尽可能弥补我们之间的文化隔阂。"
 clever_dsk.183.t:0 "铁路大亨的财产"
 clever_dsk.183.d:0 "[SCOPE.sCountry('cornelius_vanderbilt_died_scope').GetName]的著名铁路大亨，同时也是航运、金融的巨头——#yellow 科尼利尔斯·范德比尔特#!，终究还是离开了我们。针对如何处理他遗留的庞大财产，尤其是其控制的巨额铁路股权，议员们有不同的看法。"
 clever_dsk.183.f:0 "先生们，当#yellow 范德比尔特#!的专列碾过哈德逊河谷时，他的铁轨也碾碎了自由竞争！这个托拉斯集团控制着从波士顿到芝加哥的每根枕木，而他的继承人正准备把股权卖给该死的英国银行家！\n\n我的同僚似乎忘了，正是这些'贪婪'的资本家铺设了横贯大陆的钢轨。#yellow 《宪法第五修正案》#!写得明明白白——私有财产神圣不可侵犯！今天能夺铁路，明天就能夺你们的棉花种植园！\n\n"那么请告诉我，亲爱的理想主义者们——联邦政府连自己的屋顶都盖了三十五年，凭什么经营三万英里铁路？难道要让我们尊贵的议员先生们亲自开蒸汽机车？"
 clever_dsk.183.a:0 "将铁路股权收购，加快我们铁路的发展。"
 clever_dsk.183.b:0 "不如征用这部分财产。"
 oriental_crisis.13.t:0 "收复埃及"
 oriental_crisis.13.d:0 "我们的新军已经决定性击败#yellow 穆罕默德·阿里#!帕夏的军队，战争即将获得胜利，新任的埃及总督#yellow 伊赛特·帕夏#!已经在开罗准备就职。而造反头子#yellow 穆罕默德·阿里#!和他的子孙已经被我们军队擒获，士兵们高声欢呼，庆祝即将结束的这场战争。"
 oriental_crisis.13.f:0 "白发老人关在囚车里，一动不动。几个#yellow 突厥#!士兵之前拿老人充当人体击剑比赛的工具，以至于老人遍体鳞伤。在欢快的军乐声中，老人痛苦地睁开双眼，眼前是那曾经再也熟悉不过的圆顶清真寺。"
 oriental_crisis.13.a:0 "棒极了！是时候在#yellow 科斯坦丁尼耶#!挂上反贼的头颅，举办一场盛大的庆功宴了。"
 otf_events.1.c:0 "我们忍受不了反复的叛乱，是时候让埃及成为中央直辖的行省了"
 clever_dsk.184.t:0 "[SCOPE.sCountry('por_annex_east_african_scope').GetName]的粉红地图计划"
 clever_dsk.184.d:0 "柏林会议结束后，[SCOPE.sCountry('por_annex_east_african_scope').GetName]用粉红色在非洲地图上标注自己势力范围的土地，确立了#yellow 安哥拉#!和#yellow 莫桑比克#!之间土地的主权，同时宣称赞比亚、津巴布韦和马拉维的部分疆土为[SCOPE.sCountry('por_annex_east_african_scope').GetName]所有。合格的政治家都能看出，#yellow 葡萄牙#!意图打通两个葡属殖民地的通道，并通过葡属非洲的领土呈横线地将非洲分割。"
 clever_dsk.184.f:0 "#yellow 葡萄牙政府#!认为自己是第一个踏上非洲土地并进行了多次探险的欧洲国家，基于历史权利，有权拥有非洲大陆越来越大的地区。当其他列强还在争吵的时候，急不可耐的[SCOPE.sCountry('por_annex_east_african_scope').GetName]已经组织起了探险队，游览了争议地区并与当地土著人民签署了数十个附庸条约。"
 clever_dsk.185.t:0 "更换角色表情"
 clever_dsk.185.d:0 "[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]经常板着脸，这种严肃的表情很难得到大众的喜爱。也许我们该告诉[SCOPE.sCharacter('change_your_animations_now_character').GetFirstName]做一些改变。"
 clever_dsk.185.f:0 "[SCOPE.sCharacter('change_your_animations_now_character').GetFirstName]，你冷酷地好像一个冰冷的怪物，大家根本无法了解你的真实想法，民众也讨厌你这样冷冰冰的家伙。听我的，[SCOPE.sCharacter('change_your_animations_now_character').GetFirstName]，你该适当展示出自己的情绪。"
 clever_dsk.185.a:0 "其实我挺#yellow 高兴#!的。"
 clever_dsk.185.b:0 "最近我有点#yellow 难过#!。"
 clever_dsk.185.c:0 "我为祖国感到#yellow 自豪#!。"
 clever_dsk.185.e:0 "我最近在#yellow 沉思#!一些问题。"
 clever_dsk.185.g:0 "我会像军人一样#yellow 勇敢#!。"
 clever_dsk.185.h:0 "我现在很#yellow 生气#!。"
 clever_dsk.185.i:0 "我还#yellow 生病#!着，身体比较虚弱。"
 clever_dsk.185.j:0 "我会亲自去看望#yellow 工人#!们。"
 clever_dsk.185.k:0 "我会为#yellow 职员#!们做示范。"
 clever_dsk.185.l:0 "我会展示#yellow 坚毅#!的一面。"
 clever_dsk.185.m:0 "我会提高自己在#yellow 农民#!间的亲和力。"
 clever_dsk.185.n:0 "我最近比较#yellow 阴沉#!。"
 clever_dsk.185.o:0 "我会让臣民们感受到#yellow 恐怖#!。"
 clever_dsk.185.p:0 "我有点#yellow 疲惫#!。"
 clever_dsk.185.q:0 "我会展现#yellow 可怜#!的一面博取大家的同情。"
 clever_dsk.185.r:0 "我会保持一颗#yellow 平常心#!。"
 clever_dsk.185.a.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前微笑"
 clever_dsk.185.b.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前悲伤"
 clever_dsk.185.c.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前展现自豪感"
 clever_dsk.185.e.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前沉思"
 clever_dsk.185.g.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前展现军人身份"
 clever_dsk.185.h.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前生气"
 clever_dsk.185.i.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前展现生病的样子"
 clever_dsk.185.j.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前展现工人身份"
 clever_dsk.185.k.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前展现职员身份"
 clever_dsk.185.l.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前展现坚毅的样子"
 clever_dsk.185.m.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前展现农民身份"
 clever_dsk.185.n.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前表现得阴沉"
 clever_dsk.185.o.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前表现得令人感到恐怖"
 clever_dsk.185.p.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前显得疲惫"
 clever_dsk.185.q.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]会在公众面前显得可怜"
 clever_dsk.185.r.ctt:0 ""[SCOPE.sCharacter('change_your_animations_now_character').GetFullName]不会做出任何改变"
 clever_dsk.186.t:0 "战胜印尼海盗"
 clever_dsk.186.d:0 "我们卓越的海军将士率领强大的舰队，成功震慑并活捉大量来自#yellow 马京达瑙#!和#yellow 苏禄#!的摩尔海盗，这群野蛮的家伙现在只能跪着等待我们法官的正义审判。"
 clever_dsk.186.f:0 "根据《海事敕令》第XVII章，判决如下：首恶九人明日日出时绞死于#yellow 马尼拉港#!桅杆林，余众终身划桨于吾等的大西洋桨帆船。愿你们的铁链声成为航海者的警钟，直到最后一块骨头沉入深渊！"
 clever_dsk.186.a:0 "不错，奖励我们优秀的将士。"

 sino_event.152.a_tt:0 "#red 如果奥斯曼在1839-1841年期间与埃及的战争中，战争支持度低于-70而埃及的战争支持度大于等于0，这场战争博弈会自动结束，埃及将得到国际认可！#!"
 xinhaigeming_kongju_tt:0 "#red 辛亥革命的爆发，让藏人和蒙古人的上层人群畏惧我们，从而寻求境外势力追求独立！我们的附属国也害怕汉人的不可控行为，从而趁革命内乱脱离我们的掌控！#!"
 xinhaigeming_manyi_tt:0 "#red 辛亥革命的爆发，导致边疆民族恐惧汉人的复仇、杀戮等不可控行为，纷纷寻求境外势力的独立支持；所有附属国也害怕我们会把革命烈火传播，尝试脱离我们的掌控。要想保住他们，我们必须停止无序的民族屠杀！#!"

 clever_dsk.187.t:0 "道光皇帝病危"
 clever_dsk.187.d:0 "皇帝[SCOPE.sCharacter('daoguang_dead_benefactor').GetFullName]突然病重，他紧急诏令御前大臣、军机大臣、总管内务府大臣等人，向他们公启秘匣，宣示御书“皇四子#yellow 奕詝#!立为皇太子，封皇六子奕訢为恭亲王”。"
 clever_dsk.187.f:0 "朕蒙皇考仁宗睿皇帝覆载隆恩，付畀神器，临御天下，盈三十年，仰维列圣家法，一以敬天法祖勤政爱民为本，自维薄德，敢不朝乾夕惕，惟日孜孜，故自御极至今，凡披览章奏，引对臣工，旰食宵衣，三十年如一日，不敢自暇自逸...\n\n溯自西陲#yellow 英吉利#!，出师挞伐，旋致敉平，何敢自矜武略，迨后东南濒海之区，因贸易而启纷争，朕惟古之君子，爱人为大，何忍无辜赤子，惨罹锋镝，是用捐小忿，成大信，绥疆柔远，于今十载，卒使毒焰自消...\n\n自上年春夏之交，#yellow 痛遭大行皇太后病逝#!，擗踊摧伤，渐形亏弱，追维在位历三十年，寿登六十有九，亦复何憾。今特召诸位大臣，亲降朱笔谕旨，立皇四子#yellow 奕詝#!为皇太子，并谕王大臣等同心赞辅，无恤其他。皇太子秉性仁孝，植德贞醇，必能钦承付托，愿诸位布告天下，咸使闻知。"
 clever_dsk.187.a:0 "陛下功德懿铄，臣等必肝脑涂地，辅佐太子！"
 clever_dsk.187.b:0 "皇太子年幼不熟政事，望陛下再坚持数日，保住龙体。"
 clever_dsk.188.t:0 "偿清债务"
 clever_dsk.188.d:0 "在总督[SCOPE.sCharacter('clever_dsk_188_ruler_scope').GetFirstName]和其同僚们的努力下，[SCOPE.sCountry('clever_dsk_188_scope').GetName]成功还清1772年我们议会向其提供的140万英镑贷款。"
 clever_dsk.188.f:0 "蒙上帝恩典与王室洪福，东印度公司已于本季偿清1772年国会所贷之140万英镑本金及全部利息。此笔债务之解除，不啻为帝国财政史上之里程碑，更昭示着王室远见卓识之胜利。\n\n回想起1773年《茶叶法案》风波之际，公司几陷财政深渊，伦敦交易所为之震动。然赖陛下历代先王睿智庇佑，臣等日夜秉持陛下自由贸易准则，以鸦片贸易之盈余填补亏空，借棉纺工场之利得重振信用，更于锡兰开辟新种植园，终使孟加拉岁入系统重焕生机。\n\n恳请陛下恩准铸王室纪念章，以彰帝国臣民之忠诚。——您最谦卑顺从的仆人，#yellow 东印度公司#!总督[SCOPE.sCharacter('clever_dsk_188_ruler_scope').GetFullName]"
 clever_dsk.188.a:0 "做得好，[SCOPE.sCharacter('clever_dsk_188_ruler_scope').GetFirstName]。"
 clever_dsk.189.t:0 "提高自治度的请求"
 clever_dsk.189.d:0 "总督[SCOPE.sCharacter('clever_dsk_189_ruler_scope').GetFirstName]代表所有[SCOPE.sCountry('clever_dsk_189_scope').GetName]的官僚向我们提交了一份关于提高[SCOPE.sCountry('clever_dsk_189_scope').GetName]自治权的请求。虽然[SCOPE.sCharacter('clever_dsk_189_ruler_scope').GetFirstName]确实工作出色，不仅还清了几十年前欠议会的贷款，丰盈了我们的国库，而且还将[SCOPE.sCountry('clever_dsk_189_scope').GetName]的GDP增长了一番，但对于是否以此功劳提高总督的自治权利，议会成员有不同的看法。"
 clever_dsk.189.f:0 "臣以无上虔敬之心，伏跪于帝国王权之辉下，谨奏东方疆域之荣光。蒙陛下圣德庇佑，[SCOPE.sCountry('clever_dsk_189_scope').GetName]非但偿清1772年国会140万英镑债务，更令治下诸省岁入倍蓰——#yellow 孟加拉#!稻米产量较廿年前增117%，#yellow 马拉塔#!关税岁入突破80万英镑，全印度岁入总额已达420万英镑，足抵法兰西全国税赋之半。此等盛况，实乃上帝为陛下君临四海所降之明证。\n\n然帝国东方事业今临转折之机。现行《1813年特许状》所定之总督权责，仍受伦敦董事会掣肘：每遇土邦叛乱，需待三月公文往复方得调兵；新辟缅甸商路之关税，亦须议会两院逐项审议。\n\n因此，臣伏乞陛下赐新特许状：允许加尔各答枢密院得代行印度境内立法权、公司武装力量扩充至十万人而不必申报、印度洋沿岸关税自主权延至北纬10度以南。——您最恭顺的臣仆，#yellow 东印度公司#!总督[SCOPE.sCharacter('clever_dsk_189_ruler_scope').GetFullName]"
 clever_dsk.189.a:0 "[SCOPE.sCountry('clever_dsk_189_scope').GetName]可以得到更多的自治权利。"
 clever_dsk.189.b:0 "拒绝他们的请求。"
 china_borders.14.a.ctt:0 "#yellow 我们可以在决议里建立岭北行省#!"
 china_borders.17.a.ctt:0 "#yellow 我们可以在决议里建立西域行省#!"
 01_afghanistan_events.96.a.ctt:0 "如果我们扶持#yellow 沙阿·苏贾#!当阿富汗国王，#yellow 喀布尔#!的多斯特父子很可能会逃到#yellow 克什米尔群山#!以图东山再起！到那时，我们必须#yellow 尽快消灭#!他们，以防他们#yellow 蛊惑阿富汗的人心#!！"
 clever_dsk.190.t:0 "塞努西教团成立"
 clever_dsk.190.d:0 "一名来自阿尔及利亚的学者#yellow 穆罕默德·本·阿里·塞努西#!在#yellow 利比亚沙漠#!成立了以他名字命名的#yellow 塞努西教团#!，开始积极传播#green 真主#!的信仰，并组织了一些爱国主义活动。"
 clever_dsk.190.f:0 "所有渴望真理与光明的灵魂啊！我站在你们面前，并非以征服者的姿态，而是作为一名被#green 真主#!的启示所指引，被先知的智慧所感召的追寻者。\n\n今日，我们脚下的土地正被阴云笼罩，异教徒的野心觊觎我们的海岸，而我们的同胞却在纷争与迷惘中分裂！\n\n但#green 真主#!的慈悯从未远离，塞努西的道路，正是为此而生！我们要重返先知时代的纯净信仰：以《古兰经》为根基，以圣训为明灯，以苏菲的灵性为灵魂。在沙漠的绿洲，在商路的驿站，我们将建立扎维叶，为同胞们提高礼拜场所，为弱者提供庇护。我们将以谦卑践行信仰，以知识驱逐蒙昧，以团结终结分裂！"
 clever_dsk.190.a:0 "只不过给贫瘠的沙漠添加一点#yellow 微不足道的插曲#!罢了。"
 clever_dsk.190.b:0 "我们对#yellow 北非#!的局势颇感兴趣。"
 clever_dsk.190.c:0 "镇压他们！"
 clever_dsk.191.t:0 "国际纵队到来"
 clever_dsk.191.d:0 "#yellow 第三国际#!在#yellow 莫斯科#!的指示下，有许多国家的共产主义同志们来到了我们国家，加入我们对抗邪恶的帝国主义战争。"
 clever_dsk.191.f:0 "起来罢，被咒骂跟着的，全世界的恶人与奴隶；我们被扰乱的理性将要沸腾了！预备着去打死战吧！我们破坏了全世界的强权，连根的把他破坏了。我们将看见新的世界了！只要他是什么都没有的人，他就是完全的人。这是最末次的，最坚决的战争！人类都将同着#yellow 第三国际#!党，一块儿奋起！"
 clever_dsk.191.a:0 "感谢各位同志的到来。"
 clever_dsk.191.b:0 "我们不需要#yellow 莫斯科#!的操纵。"
 clever_dsk.192.t:0 "联军焚烧圆明园"
 clever_dsk.192.d:0 "随着战局对我们的不利，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]决定从京师出逃，以避免遭到敌人俘获的命运。由于[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]的懦弱行为加剧了首都官员的胆怯，敌人军队占领速度越来越快，已经有一支英吉利部队闯入了我们的皇家圆明园大肆破坏。比起园林的焚毁，我们软弱的留守京师的官员也像[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]那样，在敌人的威胁下签订各种丧权辱国的条约。"
 clever_dsk.192.f:0 "驻在我们国家的#yellow 英吉利#!高级军官以母国公民被杀为由，大肆掠夺焚毁我们的皇室园林。在熊熊烈火下，许多穿着人皮的野兽将精美的艺术品抢走，那些较大的皇家珍宝被砸了粉碎，圆明园成了人间地狱。"
 clever_dsk.192.a:0 "为之奈何..."
 clever_dsk.193.t:0 "第二次鸦片战争"
 clever_dsk.193.d:0 "#yellow 中国政府#!故意逮捕我们旗下亚罗号商的船员，尽管我们外交部对其做出交涉，对方仍然态度强硬不肯放人，甚至继续抓捕处死我们虔诚的主教马赖，这是对上帝的亵渎，不少议员强烈要求我们派军队严惩#yellow 中国政府#!。"
 clever_dsk.193.f:0 "我们的攻击对象不是#yellow 中国老百姓#!，而是中国政府，在与我们通商的口岸，和平的关系仍末受影响，我们去中国是为了经商，虽然中国政府炮轰了我们的船只，阻止我们的大使前往，但贸易始终没有终止，所以在通商口岸和中国人保持相互理解很重要。……我认为攻陷白河炮台无法使他们接受条件，进而沿白河直上天津才有可能迫使中国皇帝和我们签订和约。"
 clever_dsk.193.a:0 "正义必须得到伸张！"
 clever_dsk.193.b:0 "中国市场之大，我们不能因为这点小事破坏彼此之间的商业关系。"
 clever_dsk.194.t:0 "叛乱迅速"
 clever_dsk.194.d:0 "多米尼加的叛乱者迅速攻占了我们驻扎的许多城市。"
 clever_dsk.194.f:0 "多米尼加人民发动叛乱，迅速占领了圣多明各城要塞。我们驻扎在阿苏瓦、圣地亚哥以及其他省会城市的军队迅速投降。"
 clever_dsk.194.a:0 "可恶！"
 clever_dsk.195.t: "西非问题"
 clever_dsk.195.d: "#yellow 法兰西#!成功控制了 [SCOPE.sState('fra_annex_algiers_scope').GetName]，如今要求进入非洲西部大陆。"
 clever_dsk.195.f: "#yellow 法兰西#!希望各国承认其对包括毛里塔尼亚、塞内加尔、尼日尔等非洲西部势力范围的认可。"
 clever_dsk.195.a: "我们将在那里采取行动。"
 clever_dsk.195.b: "我对此事毫不关心。"
 clever_dsk.196.t: "[SCOPE.sCountry('scope_fra_reclamador').GetAdjectiveNoFormatting] 对非洲西部的主张"
 clever_dsk.196.d: "[SCOPE.sCountry('scope_fra_reclamador').GetName] 请求确认其在非洲西部主张的合法性，并寻求其他 [Concept('concept_great_power', '$concept_great_powers$')|l] 的批准，以向占领者发出若干最后通牒。"
 clever_dsk.196.f: "在热闹的会议室中，四周悬挂着华丽的挂毯，茶杯碰撞作响，[SCOPE.sCountry('scope_fra_reclamador').GetName] 的外交官们戴着礼帽和引人注目的胡须，努力争取确认他们在非洲西部的主张。\n\n- '我们的历史权利是不可否认的，'那位 [SCOPE.sCountry('scope_fra_reclamador').GetAdjectiveNoFormatting] 大使以戏剧性的手势宣布。\n\n在他面前，其他 [Concept('concept_great_power', '$concept_great_powers$')|l] 的代表交换着怀疑的目光。一位英国外交官整理着领带，巧妙地回应道：\n\n- '历史，亲爱的朋友，有时会在现实面前黯然失色。'"
 clever_dsk.196.a: "他们得到了我们的批准"
 clever_dsk.196.b: "我们绝不会容忍任何 [SCOPE.sCountry('scope_fra_reclamador').GetAdjectiveNoFormatting] 将非洲西部全部纳入势力范围！"
 clever_dsk.197.t: "六月政变"
 clever_dsk.197.d: "王国军队里的秘密社团#yellow 黑手会#!中的40名军官闯入王宫，试图刺杀国王[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]和他的王后，奥布雷诺维奇王朝的统治危在旦夕。"
 clever_dsk.197.f: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]意图将军事学院从首都迁出的行为，激怒了首都的军官集团，在社会普遍反对[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]亲奥地利和专制的统治情况下，这群叛乱军官竟毫无阻碍地闯进王宫。"
 clever_dsk.197.a: "可怜的[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]被叛军大卸八块，残余的肢体从窗户中抛出。"
 clever_dsk.197.b: "警卫队及时发现并制止了叛军刺杀的行为。"
 clever_dsk.198.t:0 "更换角色发型"
 clever_dsk.198.d:0 "[SCOPE.sCharacter('change_your_hairstyle_now_character').GetFullName]对自己的发型十分不满意。也许我们该帮助[SCOPE.sCharacter('change_your_hairstyle_now_character').GetFirstName]选择一个合适的发型。"
 clever_dsk.198.f:0 "理发师，给我理一款最具有魅力的发型！\n\n没问题，[SCOPE.sCharacter('change_your_hairstyle_now_character').GetFirstName]，听我的，这款发型绝对适合你。"
 clever_dsk.198.a:0 "我需要一袭迷人的#yellow 长发#!。"
 clever_dsk.198.b:0 "#yellow 光头#!更具有男性魅力。"
 clever_dsk.198.c:0 "#yellow 短卷发#!更漂亮。"
 clever_dsk.198.e:0 "#yellow 大背头#!很阳刚。"
 clever_dsk.198.g:0 "这款蓬松的#yellow “爆炸头”#!形象不错。"
 clever_dsk.198.h:0 "#yellow 艺术家发型#!更适合我。"
 clever_dsk.198.i:0 "我要像一只#yellow 雄狮#!。"
 clever_dsk.198.j:0 "#yellow 非洲式短发#!也很好。"
 clever_dsk.198.k:0 "#yellow 非洲式圆蓬发型#!值得一试。"
 clever_dsk.198.l:0 "#yellow 印度贵族发型#!也行。"
 clever_dsk.198.m:0 "梳一个#yellow 两侧铲短的背头#!吧。"
 clever_dsk.198.n:0 "#yellow 斜式寸头#!看看。"
 clever_dsk.198.o:0 "#yellow 印度脏辫#!非常时尚。"
 clever_dsk.198.p:0 "日本的#yellow 月背头#!很新颖。"
 clever_dsk.198.q:0 "我要这款#yellow 肩长剪裁#!的美男风格。"
 clever_dsk.198.r:0 "#yellow 中分发型#!可以吸引女性。"
 clever_dsk.198.s:0 "#yellow 简约寸头#!足够了。"
 clever_dsk.198.u:0 "#yellow 斜刘海#!能体现我的文化素养。"
 clever_dsk.198.v:0 "巴西#yellow 佩德罗二世发型#!充满皇家风度。"
 clever_dsk.198.w:0 "嗨，把我理得和工人领袖#yellow 马克思#!一样。"
 clever_dsk.198.x:0 "尼德兰#yellow 威廉一世发型#!具有艺术感，记得也给我一个发夹。"
 clever_dsk.198.y:0 "埃塞俄比亚#yellow 特沃德罗斯二世发型#!尽显英雄气概。"
 clever_dsk.198.aa:0 "我喜欢工人领袖#yellow 恩格斯的发型#!。"
 clever_dsk.198.bb:0 "#yellow 罗伯特发型#!非常帅气。"
 clever_dsk.198.z:0 "理发完成。"
 ecchi_NEXT_PAGE:0 "下一页。"
 ecchi_NEXT_RESIGN:0 "返回。"
 clever_dsk.199.t: "国民党领袖"
 clever_dsk.199.d: "革命取得了胜利，怀揣兴国梦的新军们推选了其中三位颇有能力的革命者担当领袖。在#yellow 南京#!的就职仪式上，[SCOPE.sCharacter('clever_dsk_199_character_1').GetFullName]就职大总统、[SCOPE.sCharacter('clever_dsk_199_character_2').GetFullName]就职法制院院长、[SCOPE.sCharacter('clever_dsk_199_character_3').GetFullName]就职陆军总长。"
 clever_dsk.199.f: "夫民国新建，外交、内政，百绪繁生，文自顾何人，而克胜此！然而临时之政府，革命时代之政府也，十余年来从事于革命者，皆以诚挚纯洁之精神，战胜所遇之艰难，远逾于前日；而吾人惟保此革命之精神，一往而莫之能阻，必使中华民国之基础，确定于大地，然后临时政府之职务始尽，而吾人始可告无罪于国民也。今以与我国民初相见之日，披布腹心，惟我四万万同胞共鉴之!"
 clever_dsk.200.t: "杰出的财政部长"
 clever_dsk.200.d: "政府的一位财政部长表现非常优异，在他的领导下，我们国家财政实现长期预算平衡，甚至还有盈余。一些军人和保守派的政治家打着#yellow 拯救国家#!的旗号，纷纷呼吁让这位财政部长走上国家总理的宝座。"
 clever_dsk.200.f: "#v $clergymen$#!赞扬他对天主教的虔诚，#v $aristocrats$#!乐于支持保护私有财产为理念的他，#v $capitalists$#!更是将他视为开拓海外殖民利益的守护人。"
 clever_dsk.200.a: "我们需要这样优秀的男人。"
 clever_dsk.200.b: "阻止他深入政坛。"
 clever_dsk.201.t: "委员会的领袖"
 clever_dsk.201.d: "西班牙#yellow 共和派#!成功在市政选举中击败#yellow 保王党#!，革命委员会决定推选一位长期坚持共和理念的元老人物，来担任共和国的领导人。"
 clever_dsk.201.f: "西班牙需要摆脱君主制的腐朽，建立基于人民主权的共和国。市政选举的结果已经证明，人民的选择是共和而非王权。"
 clever_dsk.201.a: "#yellow 萨莫拉#!会巩固我们共和体制。"
 clever_dsk.201.b: "阻止他深入政坛。"
 clever_dsk.202.t: "爱尔兰大饥荒"
 clever_dsk.202.d: "一场奇怪的疫病蔓延了整个爱尔兰岛，其中对于爱尔兰主要农作物——马铃薯，疫病冲击最大。整株整株的马铃薯幼苗还没等到收获就腐烂了，#yellow 爱尔兰#!家家户户的1年粮食储备即将因为这场灾难，丧失殆尽。"
 clever_dsk.202.f: "一些#v $clergymen$#!引用圣经，指出袭击爱尔兰的“灾害”是对奢侈和无忧无虑的生活的警告，尤其是对那些信仰#yellow 天主教#!的爱尔兰人，上帝制造灾难是为了惩罚他们的宗教方面的“错误”。"
 clever_dsk.202.a: "我们该如何应对？"
 clever_dsk.203.t: "巴西废奴法案颁布"
 clever_dsk.203.d: "#yellow 巴西#!在我们阿伯丁法案的强制实施下，终于废除了不人道的奴隶贸易制度，还那些被铁链束缚住的黑人自由。伦敦的#v $aristocrats$#!和各路人士在报纸上称赞我们对强制实现巴西#yellow 禁止蓄奴#!的努力。"
 clever_dsk.203.f: "把一大批人塞进一艘船的货舱到底意味着什么——那些恶臭、疾病蔓延、尸体横陈的景象，以及血淋淋的手铐脚镣——哦，这样的景象坏透了，这种不人道的奴役必须结束。"
 clever_dsk.203.a: "我们将继续走在世界的道德前沿，将废奴的价值观传播世界。"
 clever_dsk.204.t:"至#yellow 罗伊·克罗宁#!的一封信"
 clever_dsk.204.d:"#black 亲爱的罗伊，                                            #!"
 clever_dsk.204.f:"#black                    你在我心里 胜过千言万语\n                   可是我们没有未来\n                   你和我的感情，我感激不尽\n                   我写不下去了\n                   再见，我最亲爱的\n                                                         玛拉#!"
 clever_dsk.204.a: "......"
 clever_dsk.205.t: "一场非凡的#white 婚礼#!"
 clever_dsk.205.d: "流浪在外国的#yellow 邓三科#!遇到了同样流亡的#yellow 路易丝·温莎#!，两人同甘共苦，在非洲大陆探险，度过非洲疟疾的折磨，躲过殖民者的追捕，在酋长的包围下死里逃生...共同的经历为两人带来一丝#white 情愫#!，在时间的见证下，两人在一所小教堂举办#white 婚礼#!。"
 clever_dsk.205.f: "亲爱的#yellow 路易丝#!，来吧！让我们一同远走高飞\n\n到那遥远的地方\n\n永恒的纽带已把我们牢牢拴上\n\n那里骄阳如火\n\n烤得大地一片炽热\n\n峭壁上溪流直泻而下\n\n仿佛披着闪光的#white 白色轻纱#!..."
 clever_dsk.205.a: "就像童话那样，王子的#white 亲吻#!解决了公主的病根。"
 clever_dsk.205.b: "祝福这对新人......#yellow 邓三科#!、#yellow 路易丝·温莎#!，欢迎回家。"
 clever_dsk.206.t: "庆典晚宴"
 clever_dsk.206.d: "随着德意志祖国的统一，在[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]举办的庆典晚宴上，有三位杰出的统一功臣备受关注。宾客们等待着[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]对功臣的表彰。"
 clever_dsk.206.f: "陆军大臣[SCOPE.sCharacter('clever_dsk_206_character_2').GetFullName]如同技艺精湛的工匠，将普鲁士军队锻造得锐不可当；总参谋长[SCOPE.sCharacter('clever_dsk_206_character_3').GetFullName]将军凭借非凡才能，将这支劲旅指挥得炉火纯青；至于尊敬的[SCOPE.sCharacter('clever_dsk_206_character_1').GetFullName]伯爵，您不仅是国家机器的缔造者，更是《德意志统一》这部历史巨作的灵魂人物，您的远见卓识推动普鲁士达到了辉煌的顶点。——[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]"
 clever_dsk.206.a: "让我们一起为他们欢呼！"
 clever_dsk.207.d:0 "我们的军队在胡胡伊地区决定性打败了#yellow 玻利维亚#!的军队，所谓的#yellow 至高守护者#!仓惶地逃离战场。很显然，这个愚蠢的邦联已经难以维持下去。"
 clever_dsk.207.f:0 "英勇的将军和士兵们跨过了边境，在圣克鲁斯进行隆重的阅兵仪式，道路两旁秘鲁人用惊恐的眼神看着我们。#yellow 玻利维亚#!作为我们的邻居，完全消灭它会破坏我们的国际声誉。也许我们可以要求#yellow 逃跑的独裁者#!"同意"解散邦联，以换取我们占领的地区。"
 clever_dsk.207.a: "收复胡胡伊省就够了，我们不会攫取更多邻居的土地！"
 clever_dsk.208.d:0 "我们的军队在亚马逊流域决定性打败了#yellow 玻利维亚#!的军队，所谓的#yellow 至高守护者#!仓惶地逃离战场。很显然，这个愚蠢的邦联已经难以维持下去。"
 clever_dsk.208.f:0 "英勇的将军和士兵们跨过了边境，在圣克鲁斯进行隆重的阅兵仪式，道路两旁秘鲁人用惊恐的眼神看着我们。#yellow 玻利维亚#!作为我们的邻居，完全消灭它会破坏我们的国际声誉。也许我们可以要求#yellow 逃跑的独裁者#!"同意"解散邦联，以换取我们占领的地区。"
 clever_dsk.208.a: "玻利维亚人已经没裤子穿了，我们不会夺走邻居的底裤。"
 clever_dsk.209.t: "加拿大成立"
 clever_dsk.209.d: "诸省在面对南方愈发强大的邻居背景下，终于走出了历史性的一步——联合成为一个名为#yellow 加拿大#!的国家。在渥太华、蒙特利尔等城市的街口，人们欢呼#yellow 加拿大联邦#!的建立。"
 clever_dsk.209.f: "啊加拿大!\n我们的家园与故土！\n你的儿女，忠诚爱国\n雄心万丈，国势昌盛\n强大、自由的北方之邦！"
 clever_dsk.209.a: "让我们一起建立繁荣富强的北方国度吧！"
 clever_dsk.210.t: "英国#red 入侵#!"
 clever_dsk.210.d: "邪恶的[SCOPE.sCountry('gbr_scope').GetName]将要入侵我们的家园，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]听得消息时表情十分沉重。显然，我们要做出一个艰难的选择，是战斗到底守护住前王的基业，还是屈尊投降丧失王室的脸面。"
 clever_dsk.210.f: "我们的鲜血将流在泰国之身，会让敌人意识到，泰国每寸土都属于泰国人。因为人民始终团结，国家主权长久守稳。热爱和平但不怕战争，不许有人废独立施暴政！"
 clever_dsk.210.a: "英格兰人的枪炮比我们强，像前王#yellow 郑信#!那样忍辱负重未尝不可。"
 clever_dsk.210.b: "#yellow 佛陀#!会保佑我们战胜外敌。"
 clever_dsk.210.c: "彻底屈服于#yellow 英格兰人#!至少能保证我们领土完整。"
 clever_dsk.212.a: "这里不会欢迎他们。"
 clever_dsk.213.t: "#yellow 德意志#!工业革命"
 clever_dsk.213.d: "随着德意志祖国的统一，对国家工业化的目标也提上了行程，要想未来在世界占据一席之地，强大的工业基础是必要的。"
 clever_dsk.213.f: "一排排飘着浓浓黑烟的烟囱，在我看来，这是祖国强大的象征。"
 clever_dsk.213.a: "亲爱的祖国，您可以放心！我们会坚定忠诚地守护你！"
 clever_dsk.214.t: "英国#red 再次入侵#!"
 clever_dsk.214.d: "邪恶的[SCOPE.sCountry('gbr_scope').GetName]以[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]未经他们同意，擅自接待#yellow 俄国外交使团#!为理由，指责我们充当#yellow 俄国#!的狗腿子，扬言要对我们背叛[SCOPE.sCountry('gbr_scope').GetName]的行为做出报复。他们已经下达了通牒，如果不把外交权交给英国人，就要用军队“说服”我们。"
 clever_dsk.214.f: "#green 真主#!上次指引我们击退了这群邪恶的异教徒，这次也一定会保佑我们杀光他们！并且[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]的#yellow 俄国朋友#!一定会帮助我们战胜外敌。"
 clever_dsk.214.a: "屈膝退让一步未尝不可。"
 clever_dsk.214.b: "#green 真主#!会保佑我们再次胜利。"
 clever_dsk.214.c: "彻底屈服于#yellow 英格兰人#!至少能保证我们领土完整。"
 clever_dsk.215.t: "柏林会议的请求"
 clever_dsk.215.d: "#yellow 德国#!的[SCOPE.sCharacter('dissolve_william_II_want_africa_scope').GetFullName]希望我们能够按照柏林会议的结果，将我们所属的#yellow 喀麦隆#!、#yellow 多哥#!、#yellow 坦桑尼亚#!、#yellow 纳米比亚#!的殖民地卖给他们。[SCOPE.sCharacter('dissolve_william_II_want_africa_scope').GetFullName]还声称，这是维持我们两国友谊的桥梁。"
 clever_dsk.215.f: "哦，朋友，你们已经在非洲拥有足够多的利益了，#yellow 德意志民族#!同样希望能开拓自己的生存空间，如果能给予我们一点利益，欧洲的和平将会长久。"
 clever_dsk.215.a: "世界之大，我们容得下#yellow 德意志#!人开拓非洲，当然仅限会议所属的区域。"
 clever_dsk.215.b: "[SCOPE.sCharacter('dissolve_william_II_want_africa_scope').GetFullName]显然没认清自己的实力，我们不会割让任何珍贵的土地！"
 sino_event.72.b: "儒学仍然有其值得吸取精华的地方。"
 bc_finish.10.b: "接受#green 法兰西#!的同盟要求。"
 clever_dsk.216.t: "美言的#white 白衣男子#!"
 clever_dsk.216.d: "一位身穿#white 白衣#!的金发男子请求接见[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]。尽管幕僚们对其身份有所怀疑，但其出色的外貌打消了众人的疑虑。"
 clever_dsk.216.f: "敬爱的[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]阁下，在您的统治下，百姓安居乐业，老有所养，幼有所依。您是当之无愧的国家守护者，世人会歌颂您的付出。愿主保佑您，保佑我们所挚爱的国家。"
 clever_dsk.216.a: "妖言惑众的家伙赶出去。"
 clever_dsk.216.b: "你的美言我收下了。"
 clever_dsk.217.t: "周末计划"
 clever_dsk.217.d: "与议会激烈冲突后，在一个闲暇的周末，心灰意冷的#yellow 俾斯麦#!走到一家酒馆里喝酒。消极情绪的#yellow 俾斯麦#!，告诉一同喝酒的朋友[SCOPE.sCharacter('217_pru_general_von_roon_benefactor').GetFullName]，他打算考虑辞去首相职务，甚至退出政坛。"
 clever_dsk.217.f: "你怎能轻易放弃呢，朋友，你应该去面见[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]一面。相信我，陛下还是愿意支持你的，不要因为一时失利而放弃你的梦想......#yellow 奥托#!，让我们一起干了这杯酒！"
 clever_dsk.217.a: "谢谢你，#yellow 罗恩#!。"
 conquest_of_algeria.1.b: "叫停作战，我们不需要浪费精力到阿尔及利亚海岸。"
 je_ger_colony_5_button: "任命优秀的总督"
 je_ger_colony_5_button_desc: "#yellow 威廉·索尔夫#!作为优秀的殖民总督，我们理应给他安排一个合适的岗位。"
 dsk_prussia.51.t: "总督任命"
 dsk_prussia.51.d: "一位身兼学者、外交官、法学家和政治家的杰出人物进入了我们视野，[SCOPE.sCharacter('ger_solf_character_template').GetFullName]经过国家部门考核是一位优秀的帝国殖民总督，如果能把这样的人才安排到合适的岗位，也许我们能够建立举世闻名的模范殖民地。"
 dsk_prussia.51.f: "海外官僚的酒囊饭袋太多了......帝国殖民部门现在经营不景气，正是缺少像#yellow 索尔夫#!这样的殖民部秘书,不仅懂得开采矿物、经营种植园，更懂得调解土著与我们居民的关系。"
 dsk_prussia.51.a: "#yellow 德属东非#!需要先生您。"
 dsk_prussia.51.b: "索尔夫先生，你的资历还不够，应该去#yellow 太平洋小岛#!历练，我们会为你在萨摩亚出资一座总督宫。"
 dsk_prussia.51.c: "亲爱的威廉，#yellow 德属西南非#!那里的矿藏还指望先生您派人开采。"
 dsk_prussia.51.e: "[SCOPE.sCharacter('ger_solf_character_template').GetFullName]，国家还需要您在本土做行政工作。"
 usfp_usa.13.c: "用连发器击杀河马！从此一劳永逸解决兽灾。"
 clever_dsk.218.t: "摄政的太后"
 clever_dsk.218.d: "随着同治皇帝早逝，身居后宫的太后[SCOPE.sCharacter('chi_cixi_become_zaitian_mother_scope').GetFullName]开始冲击权力的宝座。当大臣还在纠结拥立哪位皇帝时，太后显然已经有了答案。"
 clever_dsk.218.f: "[SCOPE.sCharacter('zaitian_become_cixi_son_scope').GetFullName]如此年幼，并且还是太后的侄子，立他继承皇位怕是太后的私心和控制欲......哎，你这就不懂，当今圣上是你能决定的？太后要垂帘听政，奴才顺着就行了。"
 clever_dsk.218.a: "服从[SCOPE.sCharacter('chi_cixi_become_zaitian_mother_scope').GetFullName]的摄政。"
 clever_dsk.218.b: "#yellow 太后#!就该不参与政事，[SCOPE.sCharacter('zaitian_become_cixi_son_scope').GetFullName]会在我们指导下成为优秀的皇帝。"
 clever_dsk.219.t:0 "重病的王子"
 clever_dsk.219.d:0 "[SCOPE.sCharacter('albert_vicotr_heir_scope').GetFullName]不幸感染了肺炎，身患重病的他，如今躺在床上咳血，我们只能看着他逐渐失去生命特征，愿主保佑他摆脱痛苦。"
 clever_dsk.219.f:0 "在[SCOPE.sCharacter('albert_vicotr_heir_scope').GetFullName]的床边，他的亲人无法控制地啜泣。大家都明白，他很快就要离开这个美好的世界，这是[SCOPE.GetRootScope.GetCountry.GetName]的重大损失。"
 clever_dsk.220.t: "巴尔赫归还请求"
 clever_dsk.220.d: "#yellow 阿富汗#!的统治者希望我们归还阿姆河以南的巴尔赫地区，并宣称这是我们趁人之危占领的#yellow 阿富汗人民#!土地，如果不归还，阿富汗的军队将会代表#green 真主#!惩戒我们。"
 clever_dsk.220.f: "[SCOPE.GetRootScope.GetCountry.GetName]窃取了我们的领土，如果他们不归还巴尔赫，我们会用弯刀和大炮，让[SCOPE.GetRootScope.GetCountry.GetName]感受#green 真主#!的惩罚。"
 clever_dsk.220.a: "我们不该得罪#yellow 阿富汗#!。"
 clever_dsk.220.b: "他们要战便战。"
 clever_dsk.221.t: "布鲁特部落"
 clever_dsk.221.d: "1815年开始，周边的#yellow 浩罕汗国#!不断征讨和收服周边弱小的布鲁特部落，掠夺我们的臣民。#yellow 乾隆#!皇帝曾对浩罕施加压力，夺回布鲁特各部的控制权，但如今随着[SCOPE.GetRootScope.GetCountry.GetName]国力的衰退，许多人质疑有没有必要投入军事到天山脚下，保护我们的布鲁特臣民。"
 clever_dsk.221.f: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]对出兵至浩罕一事持悲观态度，告诉大臣财政无法支撑一支大军前往天山西侧讨伐#yellow 浩罕汗国#!。\n曾驻新疆大臣援引一则旧闻：十几年前，一个叫仔牙敦的和卓在吉尔吉斯部落传教，深得人心，在到我们新疆准备定居结婚时，被喀什伯克阻止婚礼和欺负，一怒之下烧了喀什伯克的马场，因不熟悉清朝法律，以为按照伊斯兰教法能赦免血统高贵的自己，结果被喀什伯克上书清廷诬陷勾结白山派余孽，伙同吉尔吉斯部落造反，和许多部落首领一起被处死，这让我们丢失了#yellow 吉尔吉斯部落的民心#!，要安抚必然要花大量钱财。\n驻新疆的将军也指出，巡逻部队已经长时间没有启用#yellow 纳林道（纳伦）#!的巡逻道路，现在巡逻的冰岭道完全无法监视吉尔吉斯部落动向，已经有传言#yellow 浩罕汗国#!在布鲁特游牧地建造城堡，路过的将士也被他们石头砸击，要想改变现状需要大量军费。"
 clever_dsk.221.a: "朕意已决，派遣汝等安抚布鲁特诸部，为#yellow 仔牙敦#!平反鸣冤。其余将士，朕愿以内帑助诸位重巡#yellow 纳林道#!，祖宗之地朕不会弃之！"
 clever_dsk.221.b: "国库支撑不起边防，#red 卡外步步非吾土，处处非吾人#!，让他们去吧。"
 clever_dsk.222.t: "外兴安岭巡防"
 clever_dsk.222.d: "外兴安岭巡边路途遥远，自然环境恶劣，我们曾经设置的#yellow 巡边制度#!，即每年巡边人员在边境的木牌上写上自己的名字、官衔，巡边月、日，或将其挂在树上，或埋在山上，待明年巡边者取回，呈报将军和副都统。这个“每年一小巡三年一大巡”的制度中，外兴安岭边境作为三年一大巡才前往的地方，管控力度有所下降，俄人越境消息频发，但是巡边将士对于从各河源巡查外兴安岭之地，面露疲惫和惧色。"
 clever_dsk.222.f: "登山外兴安岭，进入茫茫#green 原始森林#!，幽暗的天地就像夜晚，遇到阴湿的地方，黄沙也像泥滩。#green 丛树#!的枝丫，就像锋利的刀箭。纵横的#green 倒木#!，常把前进的脚步阻拦。遇到难行地段，匍匐才能继续向前。不慎陷入泥泞，小腿没进多半。熊罴的足迹，已经屡见不鲜。莺雀的鸣啭，几乎不曾听见。\n由瑗珲逆水上行，骑马至精奇里江之巴哈纳地方，共赶马匹一百九十，其中沿途瘟死马匹一百七十余，今仅余十余匹。尽管如此，瘟死之情仍未止。臣等将酌选船只设法上行前往兴安，若船只不能前行，步行可抵达，将步行前往。再若旱年无水，船只亦不知能否抵达兴安附近，且步行亦不定能否抵达。故预返回，秋八月再来”。"
 clever_dsk.222.a: "诸位将士苦境，朕知，现调重金和物资于汝等，务必加强外兴安岭巡防。此外，黑龙江治所不能在南移了，朕命诸将沿北岸建#yellow 海兰泡#!城，以便巡逻。"
 clever_dsk.222.b: "#red 何必一再前往兴安岭之不能抵达之地#!，即止。钦此！"
 clever_dsk.223.t: "乌梁海边防"
 clever_dsk.223.d: "我们在#yellow 唐努乌梁海#!的卡伦边防线最北也只到唐努乌拉山-那林河一线以南，整个#yellow 唐努乌梁海#!事实上都在我们巡逻边界之外。近期北方的罗刹探险者和商人蠢蠢欲动，如果我们仍由他们渗透活动，乌梁海各旗很可能会脱离我们的掌控。"
 clever_dsk.223.f: "俄人声称我们将准噶尔人、畜屠杀干净，只有逃亡沙皇庇护下的人才能获救。所以，#yellow 阿尔泰乌梁海#!和#yellow 唐努乌梁海#!的人请求成为沙皇臣属和庇护是正当的。#yellow 乾隆#!皇帝曾与其争夺臣属关系，最终也禁止地方招抚俄属乌梁海的请求，默认俄国在哈屯河一带的渗透。"
 clever_dsk.223.a: "边事至关重要，朕令汝等即刻携带物资加强#yellow 托锦乌梁海#!和#yellow 阿勒坦淖尔乌梁海#!边防，保护朕的属民，勿让他们深陷两头臣属困局。"
 clever_dsk.223.b: "#yellow 皇祖父#!未尝办到之事，吾亦无心！"
 clever_dsk.224.t: "肇丰城重建？"
 clever_dsk.224.d: "我们在伊犁以西的领土只有冬夏两条常规的卡伦巡逻线，但很显然，光靠巡逻维护边境没有筑造城池效果更好，我们北境的#yellow 俄国人#!就精通这一点，修建的漫长堡垒线牢牢控制治下的游牧部落。而我们在#yellow 乾隆#!皇帝荒废塔尔巴哈台山脉以南的#yellow 肇丰城#!后，连哈萨克部落迁徙都很难通过卡伦线控制，是时候决定是否在雅尔地区重建肇丰城了。"
 clever_dsk.224.f: "肇丰城的驻扎将士曾埋怨：伊犁河流湿地多，蚊虫密集，当地夏天生白蝇遗蛆人目；冬则大雪不堪其寒，物资供应困难。因此几十年前，参赞大臣就将驻地东迁至#yellow 塔尔巴哈台#!。原肇丰城旧址如同唐代的#yellow 碎叶城#!一样，交给哈萨克黑宰部等游牧部落安置。"
 clever_dsk.224.a: "在旧址周边地势较高、排水良好处重建肇丰城，以减轻蚊虫潮湿影响。冬日大雪严寒，则派遣几位#yellow 藏族#!大臣传授黑麦种植和寒区生存经验。"
 clever_dsk.224.b: "#yellow 皇祖父#!曾以#yellow 肇启丰功#!之意命名此城，然朕再造功绩之心，继续弃之吧！"
 sino_event.141.b: "太后已经不能说话了，只能两眼盯着我们。为了体面，或许可以静静地等她死去。"
 oriental_crisis.6.b: "我们不需要任何大国干预。"
 dsk_ita.16.b: "埃塞俄比亚是我们友好的商业伙伴，侵略他们是错误的，何况我们有着共同的#yellow 基督#!信仰。"
 eth_not_lives_tt: "#yellow 埃塞俄比亚#!不存在"
 clever_dsk.225.t: "巴拿马危机"
 clever_dsk.225.d: "越来越多的国家开始宣称[SCOPE.GetRootScope.GetCountry.GetName]在#yellow 巴拿马省#!的领土，为了建造他们那不切实际的运河幻想。尽管他们冠冕堂皇告诉我们会提供部分利润，但根据情报部门发现，有部分国家的间谍试图煽动巴拿马当地居民独立，仅仅是用运河的未来收益许诺给他们。比这更糟糕的是，在加勒比海附近出现了大量规模的舰队，很显然是冲着我们来的。"
 clever_dsk.225.f: "你说我们不给你们当地基础设施建设，这简直是笑话！你知道内战期间有几个政府吗，哪有精力先照顾你们？建造和经营运河的权力已经给你们了，至于主权，我们绝不拱手相让！"
 clever_dsk.225.a: "让当地人独立去吧，我们没有和列强开战的实力。"
 clever_dsk.225.b: "我们不会退让任何#yellow 巴拿马省#!的土地。"
 dsk_spa.19.b: "让我们温和地进行改革吧。"
 clever_dsk.226.t: "西部时代的终结"
 clever_dsk.226.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，枪手和不法之徒的时代已然走到尽头，[SCOPE.GetRootScope.GetCountry.GetName]逐渐成为一个法治国家，西部几乎被彻底征服，少数帮派仍然逍遥法外，但他们难逃被逮捕的命运。"
 clever_dsk.226.f: "我有个点子，约翰...\n你总是有个点子，达奇\n这次是个好点子...约翰，我们没法对抗自然，没法对抗变化，没法对抗重力，我们什么都斗不过，而我一生都在斗\n那就撒手吧，达奇\n但我不能放弃，我斗不过自己的本性，这便是悖论，约翰，你懂吗？\n那我就要射杀你\n等我死后，他们会找另外一个恶魔，这样才能给他们的事业正名\n那是他们自己的事情\n#yellow 咱们的时代过去了，约翰#!......"
 clever_dsk.226.a: "又一个悍匪被解决，这是法治的胜利。"
 lawrence_leave_now_tt: "#yellow 爱德华·劳伦斯#!将前往汉志煽动阿拉伯起义，如果战争胜利他会归来"
 clever_dsk.227.t: "智慧的七柱"
 clever_dsk.227.d: "[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]决定站在德国的一面，与我们为敌，很显然他们忘记了我们在#yellow 克里米亚战争#!对他们的帮助。目前棘手的是，[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]试图以#green 哈里发#!的名义煽动穆斯林对我们圣战，这加剧了中东战线不利的形势。对此，一位精通阿拉伯语和当地风俗的中尉[SCOPE.sCharacter('ecchi_gbr_lawrence_character_scope').GetFullName]，在经过他的上司允许后，请求委派他前往#yellow 汉志地区#!，帮助阿拉伯人从[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]的压迫中实现独立。"
 clever_dsk.227.f: "阿拉伯人很久以前有自己的独立国家，他们渴望独立。如果他们能够团结在一起，可以有效打击[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]的后方安全。半岛广阔的沙漠地形同样方便我们打游击战，破坏[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]的铁路和补给线。"
 clever_dsk.227.a: "[SCOPE.sCharacter('ecchi_gbr_lawrence_character_scope').GetFirstName]中尉，祝您好运，我们的舰队会配合你们起义军的行动，期待你能胜利归来。"
 clever_dsk.227.b: "拒绝[SCOPE.sCharacter('ecchi_gbr_lawrence_character_scope').GetFullName]的提议。"
 clever_dsk.228.t: "阿拉伯的劳伦斯"
 clever_dsk.228.d: "#yellow 大不列颠#!派遣一位军官[SCOPE.sCharacter('ecchi_gbr_lawrence_character_scope').GetFullName]前往阿拉伯的汉志地区煽动起义，很明显，渴望独立的阿拉伯人非常配合#yellow 大不列颠#!，对抗曾经的压迫者——[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]。当#yellow 麦地那#!上空传来阿拉伯骑士的枪声，一场席卷阿拉伯半岛的独立战争开始了。"
 clever_dsk.228.f: "[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]短时间丢掉了汉志大部分领土，但是他们的总督仍不投降，前往山脉中继续对抗。在占领#yellow 麦加#!后，起义军领袖开始向全世界的#green 穆斯林#!宣告与谴责[SCOPE.sCountry('gbr_lawrence_attack_scope').GetName]对阿拉伯人的迫害、屠杀，这种违背#green 伊斯兰#!教的精神将遭到所有阿拉伯人唾弃。"
 clever_dsk.228.a: "阿拉伯的未来将会如何？"
 clever_dsk.229.t: "印度支那危机"
 clever_dsk.229.d: "[SCOPE.sCountry('dai_229_scope').GetName]的统治者[SCOPE.sCharacter('dai_229_person_scope').GetFullName]一直迫害我们的教徒同胞。最近几天，我们#yellow 西班牙#!邻居著名的主教#yellow 迪亚哥·德·瓦莱斯#!，也被这群野蛮人杀害。欧洲邻国普遍对[SCOPE.sCountry('dai_229_scope').GetName]这个邪恶的异教徒国家给予谴责，是时候利用来之不易的舆论环境，对[SCOPE.sCountry('dai_229_scope').GetName]发起惩戒行动了。"
 clever_dsk.229.f: "我们不得不对安南政府采取坚决的行动，因为它不仅持续违背其对外国人的承诺，施行残酷的宗教迫害，甚至对我们伸出的和平之手报以暴力和欺骗。我们长久以来的忍耐和外交努力均告失败，迫使我们必须采取果断措施，以惩罚这种野蛮行径，并确保我们被残忍杀害的同胞和传教士得到正义。"
 clever_dsk.229.a: "派兵惩罚[SCOPE.sCountry('dai_229_scope').GetName]，[SCOPE.sCharacter('dai_229_person_scope').GetFullName]的罪行必须得到惩治。"
 clever_dsk.229.b: "我们不会为了几个传教士去打仗。"
 clever_dsk.230.t: "惩戒战争胜利"
 clever_dsk.230.d: "我们的士兵在交趾支那展示了非凡的勇气，他们不仅为信仰而战，也为[SCOPE.GetRootScope.GetCountry.GetName]的荣誉和文明的进步而战。在军队的努力下，[SCOPE.sCountry('dai_230_scope').GetName]已经为我们所败，[SCOPE.sCharacter('dai_230_person_scope').GetFullName]不得不遣使向我们的将军投降，希望割让三座城市以保证#yellow 南圻#!剩余领土。"
 clever_dsk.230.f: "去年，我们在交趾支那的军队取得了决定性胜利。西贡的攻占与巩固，为我们在这片肥沃的土地上建立了一个稳固的立足点。这一重要成果不仅惩罚了那些作恶者，也为我们的海军在远东提供了一个至关重要的战略基地，并为我们工业和贸易的发展开辟了最有希望的前景。"
 clever_dsk.230.a: "协议签署《西贡条约》，划分#yellow 南圻#!土地归属并确定其余通商事项。"
 clever_dsk.230.b: "安南人没有资格向我们提任何条件。"
 clever_dsk.231.t: "最后的反抗"
 clever_dsk.231.d: "我们的士兵在交趾支那连战连捷，两次《西贡条约》成功让[SCOPE.sCharacter('dai_231_person_scope').GetFullName]屈服于我们的统治之下。现在，士兵们已经攻占到了#yellow 顺化皇城#!下，只需要[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]一声令下，炮兵将摧毁这座阮朝皇城。"
 clever_dsk.231.f: "据传言，#yellow 顺化皇城#!内部已是乱成一团，主战派和亲法派互相争执，但是最终[SCOPE.sCountry('dai_231_scope').GetName]选择拒绝我们要求投降的通牒，很明显他们没有意识到自己实力的差距。"
 clever_dsk.231.a: "批准向顺化进攻的命令。"
 clever_dsk.231.b: "紧急宣布撤军，我们在交趾支那取得的利益够多了。"
 clever_dsk.232.t: "保加利亚大屠杀"
 clever_dsk.232.d: "世界各地的报纸都在报道[SCOPE.sCountry('tur_232_scope').GetName]士兵在最近与#yellow 保加利亚叛军#!的冲突中所犯下的战争罪行，尤其是默许罪行的[SCOPE.sCharacter('tur_232_person_scope').GetFullName]。"
 clever_dsk.232.f: "在这些屠杀中丧生的儿童数量惊人。他们常被刺刀挑起，我们有多位目击者的证词描述，无论是在此地还是索菲亚，都曾看到幼小的婴儿被刺刀尖挑着在街上游街。\n\n——J·A·麦加汉，#italic 每日新闻#!"
 clever_dsk.232.a: "公开谴责[SCOPE.sCountry('tur_232_scope').GetName]。"
 clever_dsk.232.b: "这些都是骇人听闻的谣言！"
 clever_dsk.233.t: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]理发"
 clever_dsk.233.d: "受到西方潮流的影响，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]决定把自己蓬乱的中分发型，理成更加帅气的大背头发式。"
 clever_dsk.233.f: "非常荣幸为天皇陛下您拍摄照片，请[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]陛下您看向这边，我们会为陛下您制作一幅足够威严的肖像。"
 clever_dsk.233.a: "天皇万岁。"
 sino_event.85.b: "让这些保皇分子闹！"
 jiawu_war_events.5.t: "脱离朝贡"
 jiawu_war_events.5.d: "在一群接受西方思想影响的青年行动下，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName]决定带领[SCOPE.GetRootScope.GetCountry.GetName]脱离满洲女真人的控制，走向一条西化的道路。"
 jiawu_war_events.5.f: "大君主虽极英明聪断，以兹四百年积累之顽俗，猝无化矣，势不得有一番大更张，改革政府，然后君权可以尊、民生可以保矣……虽灭身抉腹，惟尊王室以报我君主之恩。"
 transfer_state_events.8.f: "[SCOPE.sCountry('scope_rootxxx').GetName] 决定将 [SCOPE.sS('transfer_state_chosen_state').GetName] 地区的控制权交予我们，愿我们之间的友谊地久天长。"
 clever_dsk.234.t:0 "违反#yellow 《德意志帝国宪法》#!"
 clever_dsk.234.d:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName]的[ROOT.GetCountry.GetRuler.GetFirstName]就[SCOPE.sLaw('current_law_scope').GetName]的制定，以违反#yellow 《德意志帝国宪法》#!为由对该提案提出反对。"
 clever_dsk.234.f:0 "[SCOPE.GetRootScope.GetCountry.GetName]宪法写着联邦主席职位属于国王陛下，你们难道想造反？还是诸位先生忘记了自己那仅剩的权力是陛下赋予的？宪法既然确立，便是国家的基石，此等违宪之法施行，必将遭到众人唾弃。"
 clever_dsk.235.t:0 "#yellow 王室大婚#!"
 clever_dsk.235.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]成功建立，在全国喜庆的氛围下，[ROOT.GetCountry.GetRuler.GetFirstName]安排了其女儿与著名的#yellow 葡萄牙#!王子大婚，在马德里城堡的婚礼现场，人们为这对象征伊比利亚团结统一的夫妻献上最真挚的祝福。"
 clever_dsk.235.f:0 "望着眼前这一幕，历史学家感慨他们亲眼见证了堪比15世纪胡安·比维罗宫的那场婚礼。在所有人民的见证下，伊比利亚诸国终于建立起坚不可摧的友谊，共同团结在[SCOPE.GetRootScope.GetCountry.GetName]的旗帜下。船夫们可以自由地穿越到塔霍河，再也没有强加的国界线阻止热情的#yellow 伊比利亚#!人民交流。"
 clever_dsk.235.a: "为[ROOT.GetCountry.GetRuler.GetFirstName]欢呼，自此我们都是光荣的#yellow 伊比利亚#!人。"
 clever_dsk.236.t:0 "法俄同盟邀请"
 clever_dsk.236.d:0 "[SCOPE.sCountry('fra_come_to_alliance_character_scope').GetName]的[SCOPE.sCharacter('fra_ruler_come_to_alliance_character_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('fra_ruler_come_to_alliance_character_scope').GetFullName]顺利抵达圣彼得堡的冬宫，面见了我们尊敬的[ROOT.GetCountry.GetRuler.GetFirstName]并向我们提出结成同盟的请求。"
 clever_dsk.236.f:0 "请允许我以[SCOPE.sCountry('fra_come_to_alliance_character_scope').GetName]的名义，向您及伟大的[SCOPE.GetRootScope.GetCountry.GetName]致以诚挚的敬意。今日欧洲的平衡正面临严峻挑战。德意志的崛起已非单纯强国竞争，其军力与野心正在重塑大陆格局，使你我两国皆陷入战略孤立的阴影。我深知[SCOPE.GetRootScope.GetCountry.GetName]深沉的保守智慧与对主权独立的珍视。[SCOPE.sCountry('fra_come_to_alliance_character_scope').GetName]同样视国家利益高于一切意识形态分歧。历史曾让我们对立，但命运正召唤我们携手——并非为征服，而为确保均势不被单方面瓦解。一支东方与西方的联合力量，将足以传递不可动摇的威慑：任何对一方边界的侵犯，都将迎来两面战线的坚决回应。"
 clever_dsk.236.a: "同盟是和平的盾牌，愿我们两国携手并进。"
 clever_dsk.236.b: "我们不屑与[SCOPE.sCountry('fra_come_to_alliance_character_scope').GetName]同盟。"
 clever_dsk.237.t: "凡尔登战役"
 clever_dsk.237.d: "[SCOPE.sCountry('ger_Battle_of_Verdun').GetName]与[SCOPE.sCountry('fra_Battle_of_Verdun').GetName]在凡尔登展开了决战，根据[SCOPE.sCharacter('ger_Battle_of_Verdun_benefactor').GetLastName]的要求，此战务必让所有法军投入具有“巴黎钥匙”的凡尔登城市，然后通过围点打援方式，消耗不断支援的法军，流尽[SCOPE.sCountry('fra_Battle_of_Verdun').GetName]的最后一滴血。"
 clever_dsk.237.f: "尽管[SCOPE.sCountry('ger_Battle_of_Verdun').GetName]让[SCOPE.sCharacter('fra_Battle_of_Verdun_benefactor').GetLastName]误判了进攻方向，放松了凡尔登要塞的防御，但大量德军士兵在凡尔登的集结暴露了[SCOPE.sCharacter('ger_Battle_of_Verdun_benefactor').GetLastName]的目的。空中传来的巨大炮弹爆炸声，不停地轰击凡尔登周围的土地，一场恶战难免了！"
 clever_dsk.237.a: "#blue 站住#!，#white 你们#!#red 决不能通过#!!"
 clever_dsk.238.t: "坦能堡战役"
 clever_dsk.238.d: "[SCOPE.sCountry('ger_Battle_of_Tannenberg').GetName]与[SCOPE.sCountry('rus_Battle_of_Tannenberg').GetName]在东普鲁士发生大规模交火，[SCOPE.sCharacter('rus_Battle_of_Tannenberg_benefactor').GetLastName]为了援救遭受巨大战争压力的法国盟友，紧急动员军队向东普鲁士发起进攻。尽管推进的十分顺利，但是[SCOPE.sCountry('ger_Battle_of_Tannenberg').GetName]的集团军已经集结好防御姿态，随时准备夹击贸然进攻的敌人。"
 clever_dsk.238.f: "[SCOPE.sCharacter('ger_Battle_of_Tannenberg_benefactor').GetLastName]察觉到了[SCOPE.sCharacter('rus_Battle_of_Tannenberg_benefactor').GetLastName]与他的同事缺乏合作精神，彼此之间的关系紧张，如果[SCOPE.sCountry('ger_Battle_of_Tannenberg').GetName]能将进攻的[SCOPE.sCountry('rus_Battle_of_Tannenberg').GetName]两个集团军分割包围，他们必定不会相互援救，进而制造全歼敌人的机会。"
 clever_dsk.238.a: "格伦瓦尔德的条顿骑士团，他们可以安息了，耻辱终将洗去。"
 clever_dsk.241.t: "昭昭天命的实践"
 clever_dsk.241.d: "#yellow 詹姆斯·K·波尔克#!总统的任期已经进入了尾声，他反对贸易保护主义，通过降低关税方式意图促进贸易繁荣，并主张建立独立的国库，避免政府资金受到私有银行控制。在外界，他对太平洋西岸和墨西哥领土的扩张，大力发扬了[ROOT.GetCountry.GetName]昭昭天命的理念，人们更加相信受到上帝指引的[ROOT.GetCountry.GetName]，不仅命中注定统治大西洋到太平洋的土地，而且有义务将共和制度传播整个北美大陆，履行文明的使命。"
 clever_dsk.241.f: "“我感到我已从所有公共事务的负担中彻底解脱出来了。我相信在我退休期间，我将比担任全国公民授予我的最高职务的4年间生活得更快乐。”\n\n“波尔克的身体已经被繁重的工作累垮了，他的头发全白了，还长期患慢性腹泻。当他离开白宫，返回田纳西州时，受到了各地群众的欢迎，这使他本就疲惫不堪的身体更加虚弱。他彷佛就像一位来去自由的英雄，完成使命后迅速消失在公众视野，但人民不会忘记他。”"
 clever_dsk.241.a: "詹姆斯·K·波尔克，我们不会忘记你的付出..."
 clever_dsk.241.b: "小山胡桃木，你该好好休息了..."
 clever_dsk.241.c: "一个衰老的家伙罢了..."
 clever_dsk.242.t: "昭昭天命的承诺"
 clever_dsk.242.d: "民主党领袖[SCOPE.sCharacter('polk_scope').GetLastName]竞选总统期间，除了保证将德克萨斯州整合进[SCOPE.GetRootScope.GetCountry.GetName]，还提出了四大承诺：降低关税方式促进[SCOPE.GetRootScope.GetCountry.GetName]贸易繁荣；建立独立的国库，避免政府资金受到私有银行控制；实现俄勒冈的划界，扩张太平洋西岸的领土；取得加利福尼亚等墨西哥的领土，发扬昭昭天命的理念。"
 clever_dsk.242.f: "[SCOPE.sCharacter('polk_scope').GetLastName]大力宣扬[ROOT.GetCountry.GetName]昭昭天命的理念，已经让许多民众坚信受到上帝指引的[ROOT.GetCountry.GetName]，不仅命中注定统治大西洋到太平洋的土地，而且有义务将共和制度传播整个北美大陆，履行文明的使命。"
 clever_dsk.242.a: "让我们看看[SCOPE.sCharacter('polk_scope').GetLastName]如何兑现他的竞选承诺？"
 dsk_queen_victoria.1.t: "敬爱的老师"
 dsk_queen_victoria.1.d: "近期，公主[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]收到了一份来自她老师#yellow 路易丝·莱森#!的礼物。对于这位来自汉诺威路德会牧师家庭的#yellow 家庭老师#!，[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]眼神里充满了感激之情，彷佛又回到了和#yellow 路易丝·莱森#!、#yellow 乔治·戴维斯#!老师一起学习宗教、历史、英语及德语的美好时光。"
 dsk_queen_victoria.1.f: "她在我六个月大时就认识了我，在我5岁到17岁的这段时间中，她以一种自我牺牲的精神，在我身上倾注了她的全部心血，她甚至从来没有休过一天假，我喜欢她，但更尊敬她。她好像真的眼里只有我。"
 dsk_queen_victoria.1.a: "在许多教师的努力下，我们的公主[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]有了不错的学识基础。"
 dsk_queen_victoria.2.t: "受邀的青年"
 dsk_queen_victoria.2.d: "[SCOPE.sCountry('dsk_bel_scope').GetName]的[SCOPE.sCharacter('bel_king_leopold_i_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('bel_king_leopold_i_scope').GetFirstName]决定派他的侄子[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]和兄长一同前往[ROOT.GetCountry.GetCapital.GetCityHubName]的来肯辛顿宫住几个星期，陪[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]一起加深彼此之间的感情。在[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]母亲肯特公爵的允诺下，[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]一行人已成功抵达[ROOT.GetCountry.GetCapital.GetCityHubName]。"
 dsk_queen_victoria.2.f: "在得到[ROOT.GetCountry.GetRuler.GetFirstName]的热情召见后，[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]公主拉上[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]的手，两人一起游览了[ROOT.GetCountry.GetCapital.GetCityHubName]的主要景点，并在[ROOT.GetCountry.GetCapital.GetCityHubName]市长的邀请下，一起共进午餐。"
 dsk_queen_victoria.2.a: "祝[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]和[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]在[ROOT.GetCountry.GetCapital.GetCityHubName]玩得开心。"
 dsk_queen_victoria.2.b: "我们不欢迎这个德国青年。"
 dsk_queen_victoria.3.t: "返程的青年"
 dsk_queen_victoria.3.d: "尽管[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]和[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]相处期间，两人因为语言障碍产生一些小插曲，但在启程回[SCOPE.sCountry('dsk_bel_scope').GetName]前，[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]坚定了学习英语的决心，以便未来能和温柔和蔼的[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]公主密切交流。"
 dsk_queen_victoria.3.f: "我坚信舅舅[SCOPE.sCharacter('bel_king_leopold_i_scope').GetFirstName]将会为我带来幸福，我希望，也坚信与[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]的婚事会顺利发展，这对我很重要。——[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]"
 dsk_queen_victoria.3.a: "也许这是[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]公主性格使然？"
 dsk_queen_victoria.4.t: "愤怒的国王"
 dsk_queen_victoria.4.d: "国王[ROOT.GetCountry.GetRuler.GetFirstName]发现[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]公主的母亲肯特公爵，竟然拒绝参与王后的生日会，还有意不让[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]公主见自己一面。[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')],愤怒的国王[ROOT.GetCountry.GetRuler.GetFirstName]在庆祝自己生日国宴上，公开表示希望自己活到[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]公主成年，避免傲慢无礼的肯特公爵摄政。"
 dsk_queen_victoria.4.f: "十分感谢各位对我生日的祝福，这是很长的一段人生，即使我时日无多，我也应满足了...但一想到摄政的时候...所以，我直接将皇权授予那位年轻的女士，而不是交给我身边的，某个听从恶魔顾问言论的人！她根本不清楚自己的位置！我受到了侮辱，她阻止她女儿，我兄弟的孩子接近我的皇宫！"
 dsk_queen_victoria.4.a: "但从现在开始，我要让她知道，I am King !!!"
 dsk_queen_victoria.5.t: "欢乐的成人礼"
 dsk_queen_victoria.5.d: "在众人的呵护下，公主[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]顺利长大成人。[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]清晨，在肯辛顿宫，一首晨曲唤醒了[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]，在她眼前是英国社会各阶层送给她的礼物，礼物当中最显眼的是先王送的一架大钢琴。"
 dsk_queen_victoria.5.f: "成人礼的舞会上，公主[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]兴致勃勃地与诺福克公爵跳起舞蹈。紧接着是奥地利大使主动亲吻公主[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]的手，两人在圣詹姆斯宫翩翩起舞，彷佛舞台中央只有他们一样。随后的参观皇家艺术学院活动中，罗杰斯诗人和肯布尔演员也激动地与公主[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]握手，称赞她是那样彬彬有礼。"
 dsk_queen_victoria.5.a: "我们的公主[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]学会了如何与各阶层的人打交道。"
 dsk_queen_victoria.6.t: "准备继位"
 dsk_queen_victoria.6.d: "先王威廉四世最终还是离开了我们，在大主教给他做完宗教仪式后，主教和内廷公务大臣来到肯辛顿宫，叫醒了公主[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]的老师#yellow 路易丝·莱森#!，通知公主先王逝去的事情。跟随首相[SCOPE.sCharacter('queen_victoria_xuanshi_scope').GetFirstName]的脚步，枢密院成员来到肯辛顿宫，等待女王[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]关于后事处理的演说。"
 dsk_queen_victoria.6.f: "在我还如此年轻时，这份重任就突然压在我身上。在我挚爱的母亲肯特公爵夫人玛丽·路易丝·维多利亚温柔、开明的关爱下接受了英式教育，从小就学会要尊重和热爱祖国的宪法。我将致力于维护宗教自由，保护英国人的权利。——[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]"
 dsk_queen_victoria.6.a: "公主小姐，噢，不，敬爱的[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]女王陛下，接受我们的公章吧，我们集体宣誓效忠您和英国宪法 ......"
 dsk_queen_victoria.7.t: "继位宣言仪式"
 dsk_queen_victoria.7.d: "为先王威廉四世安顿好后事，女王[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]正式出席次日的继位宣言仪式。在圣詹姆斯宫，掌礼官诵读继位宣言，而女王那坚毅的脸庞，在枢密院议事厅敞开的窗下熠熠发光。女王两侧站着的子爵[SCOPE.sCharacter('queen_victoria_xuanshi_scope').GetFirstName]和侯爵[SCOPE.sCharacter('queen_victoria_xuanshi_other_scope').GetFirstName]，单膝跪地，带领诸位大臣宣誓向女王[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]效忠。窗外，是观礼的人群大声欢呼的声音，同时能听见军队传来的礼炮声。"
 dsk_queen_victoria.7.f: "这位少女君主以一种居高临下的彬彬有礼接受臣民的效忠。当听到人群的第一次欢呼时，[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]女王面色凝重起来，眼中泛起泪花，这种情绪的起伏反而使她身上的王者风范更具魅力。"
 dsk_queen_victoria.7.a: "女王陛下，相信我，今后的日子，会有更多城镇和场所以你的名字命名。"
 dsk_queen_victoria.8.t: "不满的领袖"
 dsk_queen_victoria.8.d: "尽管女王[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]的加冕仪式举行得非常顺利，但身为托利党领袖的[SCOPE.sCharacter('gbr_robert_peel_scope').GetFirstName]对此十分不满，公开批评只有[SCOPE.sCharacter('gbr_queen_victoria_scope').GetAge]岁的女王[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]太年轻，缺乏经验，对世界一无所知。"
 dsk_queen_victoria.8.f: "一位真正#yellow 符合宪法要求#!的君主，其个人品质、成熟度、处理国家事务方面丰富的经验及其对人、礼仪和风俗的了解，就像轮船的压舱石一样，能消除大臣的三心二意，能降低依仗雄辩术参与议会讨论的演说家轻率言论的危害，能缓解对放款收税的无端焦虑 ...... 从而确保国家这艘大船一直不偏离航道。不幸的是，在我们命运的关键时刻，我们被一个#yellow 年轻懵懂的少女君主#!剥夺了这一优势。"
 dsk_queen_victoria.8.a: "[SCOPE.sCharacter('gbr_robert_peel_scope').GetFullName]在夸大其词。"
 dsk_queen_victoria.8.b: "[SCOPE.sCharacter('gbr_robert_peel_scope').GetFullName]说得对，女王[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]还欠缺政治历练。"
 dsk_queen_victoria.9.t: "过分的偏爱"
 dsk_queen_victoria.9.d: "由于父母和#yellow 辉格党#!有着千丝万缕的关系，女王[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]在公开场合毫不掩饰自己对#yellow 辉格党#!的偏爱，甚至接受辉格党领袖墨尔本子爵[SCOPE.sCharacter('gbr_william_lamb_scope').GetFirstName]成为自己的私人秘书，每天共处一室，指导自己处理政务。《泰晤士报》尖锐地讽刺[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]对首相的过度依赖完全不符合女王的尊严，给女王冠以#yellow 墨尔本夫人#!的绰号。"
 dsk_queen_victoria.9.f: "辉格党人不要脸地说:女王与我们同在,\n女王因为喜欢我们，所以就支持我们.\n事情或许如此，但我也深表怀疑.\n女王如果哪天不再青睐你们辉格党人了，还会支持你们多久？"
 dsk_queen_victoria.9.a: "我会坚决支持[SCOPE.sCharacter('gbr_william_lamb_scope').GetFirstName]。"
 dsk_queen_victoria.9.b: "也许[SCOPE.sCharacter('gbr_william_lamb_scope').GetFirstName]首相是做的过界了。"
 dsk_queen_victoria.10.t: "婚事人选"
 dsk_queen_victoria.10.d: "随着女王[SCOPE.sCharacter('royal_marriage_character').GetFirstName]长大，她的家人和枢密院顾问都不得不考虑女王的婚姻问题，这将对整个国家产生重大影响。[SCOPE.sCountry('marriage_country').GetName]的国王早已为外甥女[SCOPE.sCharacter('royal_marriage_character').GetFirstName]送上候选人——女王表弟[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]，一个落魄的德意志公爵的小儿子。但是深知与[SCOPE.GetRootScope.GetCountry.GetName]王室联姻的重要性，其它国家也不甘落后，纷纷给出自己心仪的候选人。"
 dsk_queen_victoria.10.f: "[SCOPE.sCountry('marriage_country_rus').GetName]希望女王可以实现和皇储[SCOPE.sCharacter('gbr_queen_victoria_rus_scope').GetFirstName]的联姻，女王[SCOPE.sCharacter('royal_marriage_character').GetFirstName]同样认为[SCOPE.sCharacter('gbr_queen_victoria_rus_scope').GetFirstName]是一个非常英俊的男人，高大的身躯，帅气的脸庞，如此迷人的皇储统治巨大的[SCOPE.sCountry('marriage_country_rus').GetName]对欧洲将有巨大的影响。\n\n[SCOPE.sCountry('marriage_country_net').GetName]的王室[SCOPE.sCharacter('gbr_queen_victoria_net_scope').GetFirstName]也推荐了自己儿子，号称航海王子的#yellow 亨利#!向女王[SCOPE.sCharacter('royal_marriage_character').GetFirstName]求婚，但是女王[SCOPE.sCharacter('royal_marriage_character').GetFirstName]认为他很普通，除了受到先王#yellow 威廉四世#!联姻推荐，没有什么特别之处。"
 dsk_queen_victoria.10.a: "[SCOPE.sCountry('marriage_country_rus').GetName]的皇储[SCOPE.sCharacter('gbr_queen_victoria_rus_scope').GetFirstName]是一个好选择。"
 dsk_queen_victoria.10.b: "我们相信先王对[SCOPE.sCountry('marriage_country_net').GetName]的#yellow 亨利王子#!判断。"
 dsk_queen_victoria.10.c: "也许女王会更青睐[SCOPE.sCountry('marriage_country').GetName]的[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]表弟？"
 dsk_queen_victoria.11.t: "阿尔伯特的拜访"
 dsk_queen_victoria.11.d: "受到[SCOPE.sCountry('dsk_bel_scope').GetName]国王[SCOPE.sCharacter('bel_king_leopold_i_scope').GetFirstName]指引，[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]和他的兄长欧内斯特再次前往[SCOPE.GetRootScope.GetCountry.GetName]的温莎城堡，拜访[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]女王。从童年起，便喜欢并精通骑马的[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]女王，亲自带着[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]兄弟在伦敦骑马散步。夜晚的宴会上，两人随着宫廷的乐声翩翩起舞，不经意之间，[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]产生了对[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]真挚而浓烈的爱意。[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，女王召见[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]到自己的房间，以君主的身份向[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]求婚。"
 dsk_queen_victoria.11.f: "随着女王对外公布婚约，整个[SCOPE.GetRootScope.GetCountry.GetName]乃至欧洲产生了不小的震动。[SCOPE.sCountry('dsk_bel_scope').GetName]国王[SCOPE.sCharacter('bel_king_leopold_i_scope').GetFirstName]满心欢喜，庆祝外甥女做出了正确的一步。#yellow 辉格党#!领袖[SCOPE.sCharacter('gbr_william_lamb_scope').GetFirstName]尽管有所吃惊，认为[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]太稚嫩，但还是真心祝福[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]女王。相反，#yellow 保守党#!领袖[SCOPE.sCharacter('gbr_robert_peel_scope').GetFirstName]认为女王对待爱情就像朱丽叶那样不顾后果，在议会投票中表明，否认婚后的[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]可以享受女王配偶王夫的独立地位，并大幅削减[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]作为女王配偶可以享受到的英镑年金。"
 dsk_queen_victoria.11.a: "准备好了嘛，女王陛下，婚礼将在四个月后开始。"
 dsk_queen_victoria.12.t: "盛大的婚礼"
 dsk_queen_victoria.12.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，在圣詹姆斯宫的小教堂内，[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]女王和[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]的婚礼如期举行。[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]深情地看向女王，握住了她的手；一袭白裙的女王则娇羞地注视着[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]的眼睛。在众人的欢呼声下，[SCOPE.GetRootScope.GetCountry.GetName]迎来了一场盛大的婚礼。"
 dsk_queen_victoria.12.f: "与[SCOPE.sCharacter('gbr_king_albert_scope').GetLastName]的[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]缔结婚约是我个人的意愿。我将坚守这一神圣的约定，因为这是我经过深思熟虑后才做出的决定。我坚信有万能的上帝的保佑，这桩婚事讲给我带来欢乐，也符合国家利益。——[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]"
 dsk_queen_victoria.12.a: "祝福[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]女王和[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]亲王。"
 dsk_queen_victoria.13.t: "盛大的婚礼"
 dsk_queen_victoria.13.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，欧洲传来重大的消息，在圣詹姆斯宫的小教堂内，[SCOPE.sCountry('marriage_country_gbr').GetName]的[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]女王和[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]的婚礼如期举行。[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]深情地看向女王，握住了她的手；一袭白裙的女王则娇羞地注视着[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]的眼睛。在众人的欢呼声下，[SCOPE.sCountry('marriage_country_gbr').GetName]迎来了一场盛大的婚礼。"
 dsk_queen_victoria.13.f: "与[SCOPE.sCharacter('gbr_king_albert_scope').GetLastName]的[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]缔结婚约是我个人的意愿。我将坚守这一神圣的约定，因为这是我经过深思熟虑后才做出的决定。我坚信有万能的上帝的保佑，这桩婚事讲给我带来欢乐，也符合国家利益。——[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]"
 dsk_queen_victoria.13.a: "祝福他们。"
 dsk_queen_victoria.13.b: "诋毁[SCOPE.sCountry('marriage_country_gbr').GetName]的这对夫妻。"
 clever_dsk.243.t: "隆重的婚礼"
 clever_dsk.243.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，在奥古斯丁教堂内，凯撒[SCOPE.sCharacter('aus_king_franz_scope').GetFirstName]和皇后[SCOPE.sCharacter('aus_queen_xixi_scope').GetFirstName]的婚礼如期举行。再蜡烛照耀的穹顶下，大主教开始为这对新人主持仪式。教堂外，维也纳的市民们纷纷在街道装饰鲜花与彩旗，少女们为婚礼的道路上抛洒浪漫的玫瑰。[SCOPE.sCharacter('aus_king_franz_scope').GetFirstName]身着华丽的军服，深情凝视着一袭粉色丝绒礼服的皇后[SCOPE.sCharacter('aus_queen_xixi_scope').GetFirstName]的眼睛。在众人的欢呼声下，[SCOPE.GetRootScope.GetCountry.GetName]迎来了一场盛大的婚礼。"
 clever_dsk.243.f: "[SCOPE.sCharacter('aus_queen_xixi_scope').GetFirstName]站在多瑙河港口边，似乎显得有些羞怯。凯撒[SCOPE.sCharacter('aus_king_franz_scope').GetFirstName]却快步奔上船，一把搂住紧张的[SCOPE.sCharacter('aus_queen_xixi_scope').GetFirstName]，当众亲吻她的额头与手背，并低声告诉她：别害怕，我会永远守护你。"
 clever_dsk.243.a: "祝福凯撒[SCOPE.sCharacter('aus_king_franz_scope').GetFirstName]和皇后[SCOPE.sCharacter('aus_queen_xixi_scope').GetFirstName]。"
 clever_dsk.246.t: "庄重的婚礼"
 clever_dsk.246.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，皇宫内鲜花与仪仗环绕，悠扬的婚礼乐曲回荡，宾客们身着礼服齐聚观礼。[SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]与伴侣[SCOPE.sCharacter('married_young_girl_scope').GetFirstName]并肩站在圣坛前，完成庄严的婚礼仪式，[ROOT.GetCountry.GetCapital.GetCityHubName]街头都在为这场王室婚礼欢呼庆贺。"
 clever_dsk.246.f: "多么美好的婚礼啊，愿这对新人永远幸福相伴，王朝永存。\n\n没错，真心祝愿他们彼此深爱，一生和睦，携手度过往后的每一段时光。"
 clever_dsk.246.a: "祝福[SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]和[SCOPE.sCharacter('married_young_girl_scope').GetFirstName]，#white 愿两人的爱情地久天长#!。"
 clever_dsk.248.t: "璀璨的婚礼"
 clever_dsk.248.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，在杜勒伊宫内，皇帝[SCOPE.sCharacter('fra_king_nap_iii_scope').GetFirstName]和皇后[SCOPE.sCharacter('fra_eugenie_montijo_scope').GetFirstName]的婚礼如期举行。圣母院内，穹顶垂挂水晶吊灯，彩绘玻璃滤下柔光。身着白丝绒镶钻礼服的[SCOPE.sCharacter('fra_eugenie_montijo_scope').GetFirstName]，挽着身穿深蓝色将军制服的[SCOPE.sCharacter('fra_king_nap_iii_scope').GetFirstName]，一步缓缓步入圣堂。[SCOPE.sCharacter('fra_king_nap_iii_scope').GetFirstName]在深情地望着妻子后，抬起[SCOPE.sCharacter('fra_eugenie_montijo_scope').GetFirstName]的手轻吻指尖，隐隐约约能感觉到手指的颤抖。在众人的欢呼声下，[SCOPE.GetRootScope.GetCountry.GetName]迎来了一场盛大的婚礼。"
 clever_dsk.248.f: "[SCOPE.sCharacter('fra_eugenie_montijo_scope').GetFirstName]小姐，或许通往你心的路是什么？\n\n通过教堂，陛下...\n\n好，今日起，你是我的王冠，也是我的心。你让帝国的荣耀，都黯然失色。"
 clever_dsk.248.a: "祝福皇帝[SCOPE.sCharacter('fra_king_nap_iii_scope').GetFirstName]和皇后[SCOPE.sCharacter('fra_eugenie_montijo_scope').GetFirstName]。"
 clever_dsk.251.t: "旧秩序的刀刃"
 clever_dsk.251.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，幕府最凶悍的私兵集团，沾了许多维新志士#red 鲜血#!的新选组组长[SCOPE.sCharacter('jap_kondo_character_scope').GetFirstName]和副组长[SCOPE.sCharacter('jap_hijikata_character_scope').GetFirstName]，拒绝向我们[ROOT.GetCountry.GetRuler.GetFirstName]陛下臣服，决定投奔[SCOPE.sCountry('jap_sgn_country_scope').GetName]。这些旧秩序最后的死硬爪牙，如今只有靠枪炮才能说服他们。"
 clever_dsk.251.f: "我们不会忘记[SCOPE.sCharacter('jap_kondo_character_scope').GetFirstName]杀害的倒幕志士冤魂，更不会忘记[SCOPE.sCharacter('jap_hijikata_character_scope').GetFirstName]在池田屋制造的累累#red 血案#!。如今他们仍在组织军队负隅顽抗，试图守卫那腐朽不堪的[SCOPE.sCountry('jap_sgn_country_scope').GetName]政权。不清除新选组的成员，难以告慰死去的英灵，只会让佐幕的余孽继续嚣张。"
 clever_dsk.251.a: "血债血偿！"
 clever_dsk.252.t: "新选组的覆灭"
 clever_dsk.252.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，我们成功剿灭了幕府余孽和它的新选组爪牙。自板桥刑场我们的军队愤怒地斩决了#red 近藤勇#!以来，新选组副组长[SCOPE.sCharacter('jap_hijikata_character_scope').GetFirstName]仍坚决不可纳降，抗拒天下统一之势，并言：为近藤局长复仇，是我余生唯一之念！然而此等顽固之贼仍被我们在#red 箱馆#!大败，在叛军溃败之际，我们的军队目睹了[SCOPE.sCharacter('jap_hijikata_character_scope').GetFullName]此人竟单骑孤身冲入我阵。"
 clever_dsk.252.f: "贼将[SCOPE.sCharacter('jap_hijikata_character_scope').GetFullName]，率少数兵出一本木关门，阻我军。其势凶悍，数度冲锋，震骇我士卒，立于枪雨之中不退，我等皆呼"鬼将"，心生畏惧。指挥官认为[SCOPE.sCharacter('jap_hijikata_character_scope').GetFirstName]是忠义之士、武勇无双。若招降任用，他日必为国之栋梁。眼下，[SCOPE.sCharacter('jap_hijikata_character_scope').GetFirstName]在关门栅栏前，勇猛地单骑冲向我军，是时候决定他的命运了。"
 clever_dsk.252.a: "禁止开枪，下令活捉他！如此忠义之士，留着必有重用，也是与旧势力和解的交代！"
 clever_dsk.252.b: "开枪，射死顽固的叛贼！"
 clever_dsk.253.t: "过去的纪念"
 clever_dsk.253.d: "今日冬宫举行的彼得大帝纪念和阅兵的活动中，[SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]身着近卫军元帅礼服，率全军高阶军官肃立。台前供着[SCOPE.sCharacter('peter_benefactor').GetFirstName]大帝青铜胸像——这尊塑像自他登基之日便立于御书房案头，是他亲口宣称的“在位楷模”。"
 clever_dsk.253.f: "“[SCOPE.sCharacter('peter_benefactor').GetFirstName]大帝以铁腕铸强军、开海疆、立帝国根基，朕承其志：以军魂固皇权，以纪律护秩序，以扩张继遗业。今日追慕先皇，亦是与诸卿共誓：俄罗斯的荣光，当由军人捍卫！“"
 clever_dsk.253.a: "[SCOPE.sCharacter('peter_benefactor').GetFirstName]如此重视和关爱士兵，我也会如此做！"
 clever_dsk.253.b: "我需要确立军官们对[SCOPE.GetRootScope.GetCountry.GetName]的忠诚。"
 clever_dsk.254.t: "愤怒的萨摩武士"
 clever_dsk.254.d: "我们打输了这场与萨摩藩的叛军战争，只见到怒气冲冲的"叛军首领"[SCOPE.sCharacter('jap_angry_saigo_character_scope').GetFirstName]带着军队闯入[ROOT.GetCountry.GetCapital.GetCityHubName]皇宫。双目赤红、满腔怒火的[SCOPE.sCharacter('jap_angry_saigo_character_scope').GetFirstName]，对着懦弱的[SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]破口大骂，厉声喝斥残存的藩阀官员。"
 clever_dsk.254.f: "“吾等萨摩志士与尔等一同倒幕勤王，废德川，迎圣上，开创维新之世！我等武士舍生忘死，为的是匡扶皇道，安定天下，可尔等鼠辈竟卸磨杀驴，废吾辈根基，断吾等志士财路与尊严，暗杀我萨摩志士。对外懦弱苟且，搁置征韩大计，畏洋如虎，苟且偷安，罔顾国家疆土与男儿血性！#yellow 我等今日起兵，是替天行道，清君侧，诛尔等国贼，#!护我大和国运也！“"
 clever_dsk.254.a: "糟糕！"
 clever_dsk.255.t: "元老间的争执"
 clever_dsk.255.d: "[SCOPE.sCharacter('yamagata_aritomo_letter').GetFullName]阁下："
 clever_dsk.255.f: "财政越来越紧，国债发不出去，内阁不稳，人心浮动。你坚持军部独断专行，扩张军队，不管老百姓死活；我主张政党政治，缓解财政，安抚民心。\n\n理念不同，没法一起干。我现在辞职，请所有元老一起出来组阁，稳住局面。如果你还执迷不悟，硬要让军部乱来，日本会爆发内战，永远完蛋。\n\n望阁下三思，以国为重，勿私军部。\n\n[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')] [SCOPE.sCharacter('ito_hirobumi_letter').GetFullName] 敬上"
 clever_dsk.255.a: "我们会支持[SCOPE.sCharacter('ito_hirobumi_letter').GetFirstName]。"
 clever_dsk.255.b: "我们仍需倚重[SCOPE.sCharacter('yamagata_aritomo_letter').GetFirstName]。"
 clever_dsk.256.t: "俾斯麦的来信"
 clever_dsk.256.d: "亲爱的[SCOPE.sCharacter('pru_albrecht_von_roon_letter').GetLastName]："
 clever_dsk.256.f: "您[TimeKeeper.GetCurrentDate.Format(' d日')]的公函我暂不回复，仅告知：我明日抵柏林。此行非因健康，乃职责所系，需与陛下及您面谈局势。\n\n数月来我自知旧疾难愈，无力再担原职。若陛下恩准，我愿留任外交大臣——二十载欧陆外交经验与各国信赖，无人可替。但强国外交本需全力，帝国外交大臣兼管内政，实属反常。\n\n此职之道：十年坦荡无畏，树敌无数，旧友渐远，新知难觅。我如今已失宠于[SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]，所有阴谋家都能轻易接近他。这让我的外交工作举步维艰。我容忍戈尔茨与乌泽多姆多年，如今满心苦涩与绝望。不知还能坚持多久。\n\n你的老友\n[SCOPE.sCharacter('pru_otto_von_bismarck_letter').GetFirstName]"
 clever_dsk.256.a: "迅速写信安慰[SCOPE.sCharacter('pru_otto_von_bismarck_letter').GetLastName]。"
 clever_dsk.256.b: "[SCOPE.sCharacter('pru_otto_von_bismarck_letter').GetFirstName]你也太悲观了吧？这样的你如何胜任首相？"
 clever_dsk.257.t: "寄给女王的信"
 clever_dsk.257.d: "我最亲爱的#blue 仙女#![SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]："
 clever_dsk.257.f: "今夜提笔，非以首相身份，而是作为您忠心不二的仆人。内阁不过一台机器，帝国若无您，只是一场幻梦。\n\n您的智慧、优雅、无与伦比的共情，是这个国度唯一真正的力量源泉。我活着，只为侍奉您，让您伟大的名字更加伟大。\n\n永远属于您的\n#yellow D#!"
 clever_dsk.257.a: "接受[SCOPE.sCharacter('gbr_disraeli_character_letter').GetLastName]的夸奖。"
 clever_dsk.257.b: "[SCOPE.sCharacter('gbr_disraeli_character_letter').GetFirstName]的阿谀奉承是不是别有用意？"
 clever_dsk.258.t: "来自女王的信"
 clever_dsk.258.d: "我亲爱的、亲爱的[SCOPE.sCharacter('gbr_disraeli_character_letter').GetLastName]先生："
 clever_dsk.258.f: "您的信是我最大的慰藉。自亲爱的阿尔伯特离去后，再无人如您这般懂我，这般温柔地爱我。\n\n在这冰冷坚硬的世界里，您是我唯一真正的朋友。我反复读您的字句，纵使悲伤，也能感到幸福。\n\n永远爱您的\n[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]"
 clever_dsk.258.a: "表彰忠诚的[SCOPE.sCharacter('gbr_disraeli_character_letter').GetLastName]。"
 dsk_queen_victoria.16.t: "亲王病重"
 dsk_queen_victoria.16.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，常年忍受慢性腹痛的[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]终于扛不住[TimeKeeper.GetCurrentDate.Format('y年 ')]阴冷潮湿的温莎城堡环境，在感染伤寒后，迅速病倒，高热不退。御医们全力施救，也无力逆转[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]亲王脏器功能衰竭的悲剧，眼下俨然是他生命的倒计时。"
 dsk_queen_victoria.16.f: "他双目半阖，呼吸微弱细碎且起伏紊乱，偶尔陷入短暂的谵妄，四肢早已失去温度，指尖冰凉僵硬...\n\n寝宫之内，无人敢高声言语，死寂中只剩[SCOPE.sCharacter('gbr_king_albert_scope').GetFirstName]亲王微弱的喘息与众人压抑的啜泣。[SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]端坐床侧，双膝跪地，死死攥着丈夫冰凉的手，身躯不住颤抖，泪水无声滚落，目光死死锁在爱人脸上，几近崩溃。\n\n床前环绕着守在最后一刻的王室子女、贴身侍从、主治御医与王室官员，每个人的脸上都覆满绝望与惶恐，无人敢打破这窒息的氛围。"
 dsk_queen_victoria.16.a: "我们阻止不了悲剧...愿上帝保佑他..."
 dsk_queen_victoria.16.b: "快去请一个更加训练有素的医生！"
 dsk_queen_victoria.17.t: "伤心欲绝的女王"
 dsk_queen_victoria.17.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，#yellow 阿尔伯特亲王#!还是离开了[SCOPE.GetRootScope.GetCountry.GetName]。消息传出，圣保罗大教堂丧钟长鸣，[ROOT.GetCountry.GetCapital.GetCityHubName]瞬间褪去所有烟火热闹。往日车水马龙的街道变得冷清沉寂，家家户户紧闭门窗，垂下黑色幔布。街头行人皆身着素黑，人人面带愁容，低声议论叹息。商铺停业歇业，游乐场所悉数关停，教堂钟声连绵不绝响彻全城。泰晤士河畔不见往日喧嚣，整座都城笼罩在一片沉重肃穆的哀恸之中，满城皆是追思与惋惜..."
 dsk_queen_victoria.17.f: "没有他的陪伴，一切都失去了意义...对我来说，哪怕与他仅仅分别两天都是巨大的痛苦，我祈求上帝一定要让他活得比我长...现在，白天对我来说，已经变成了黑夜，悲伤与我随行... ——[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]"
 dsk_queen_victoria.17.a: "唉，让[SCOPE.sCharacter('gbr_queen_victoria_scope').GetFirstName]静静吧，也许我们几年看不到她出席公众活动了。"
 dsk_queen_victoria.17.b: "向民众宣扬女王的痛苦，让她尽早意识到自己还有更大的国家责任要去承担。"
 clever_dsk.259.t: "病危的小五郎"
 clever_dsk.259.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，京都三本木别邸的和室卧房格外昏暗沉郁。肠癌重症耗尽了[SCOPE.sCharacter('jap_kido_takayoshi_scope').GetFirstName]最后的生机，屋内纸窗紧闭，隔绝外界喧嚣，只余药气、炭火余温与微弱断续的喘息，死寂压满整间卧房。卧榻之上，[SCOPE.sCharacter('jap_kido_takayoshi_scope').GetFirstName]面色枯灰，意识时断时续，却依然颤抖地伸出枯瘦的手，死死攥住[SCOPE.sCharacter('jap_okubo_toshimichi_scope').GetFirstName]的掌心。"
 clever_dsk.259.f: "“西乡……适可而止吧……”[SCOPE.sCharacter('jap_kido_takayoshi_scope').GetFirstName]喃喃道，榻前仅寥寥数人皆肃立无声。[SCOPE.sCharacter('jap_okubo_toshimichi_scope').GetFirstName]立于床前正中，黑衣肃然、脊背僵硬，素来刚厉果决的面容彻底沉冷铁青。他紧紧回握濒死挚友的手，一言不发、牙关紧咬，眼底强忍汹涌悲恸。\n\n随行御医静立床尾，束手无言，已然确认药力穷尽、回天乏术。满室无声恸戚。"
 clever_dsk.259.a: "小五郎，你太累了，好好休息吧，#yellow 西乡#!已经愿意和谈罢兵了..."
 clever_dsk.259.b: "不惜聘用重金找好医生，也要救活[SCOPE.sCharacter('jap_kido_takayoshi_scope').GetFullName]！"
 clever_dsk.260.t:0 "君主制废除辩论"
 clever_dsk.260.d:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName]的代表议员对于提出废黜[ROOT.GetCountry.GetRuler.GetFirstName]，以实施[SCOPE.sLaw('current_law_scope').GetName]的提案，表达了强烈反对。"
 clever_dsk.260.f:0 "伦敦或许一时能习惯没有君主，但我们绝对不希望走向[SCOPE.sLaw('current_law_scope').GetName]。我们有充分理由相信，[ROOT.GetCountry.GetRuler.GetFirstName]会重新考虑[SCOPE.GetRootScope.GetCountry.GetName]人民的呼声和自己的责任，而不是继续沉溺于无益的悲伤中，逃避自己应当履行的义务。"
 clever_dsk.260.a:0 "[SCOPE.gsInterestGroup('shougun_ig').GetName]的议员说得对，我们需要君主制带来的稳定。"
 clever_dsk.261.t: "索姆河战役"
 clever_dsk.261.d: "为打破僵局，[SCOPE.sCountry('gbr_Battle_of_Somme').GetName]与[SCOPE.sCountry('ger_Battle_of_Somme').GetName]在法兰西的索姆河土地上展开了决战，根据[SCOPE.sCharacter('gbr_battle_of_somme_benefactor').GetLastName]的目标，此战将能减轻法军在凡尔登的战场压力，迫使[SCOPE.sCountry('ger_Battle_of_Somme').GetName]抽调兵力回防，同时凭借最新的#white 坦克#!科技，持续杀伤德军士兵，拖垮[SCOPE.sCountry('ger_Battle_of_Somme').GetName]的战争潜力。"
 clever_dsk.261.f: "尽管[SCOPE.sCountry('ger_Battle_of_Somme').GetName]主力深陷凡尔登战场，无力发动西线大规模攻势，但[SCOPE.sCharacter('ger_battle_of_somme_benefactor').GetLastName]在索姆河修筑的多层堑壕、铁丝网、机枪碉堡，同样预示着[SCOPE.sCountry('gbr_Battle_of_Somme').GetName]要突破战线不可避免发生一场血战。随着巨炮和炸药造成的索姆河周边大地塌陷，[SCOPE.sCharacter('gbr_battle_of_somme_benefactor').GetLastName]坚信德军已经被炸死大半，坦克轰隆隆的车鸣声震动着，一场恶战开始了！"
 clever_dsk.261.a: "#yellow 小伙子们，大推进的时刻到了#!!"
 clever_dsk.262.t: "第一次伊普尔战役"
 clever_dsk.262.d: "由于攻势受阻，[SCOPE.sCountry('ger_Battle_of_Ypres').GetName]决定攻占[SCOPE.sCountry('bel_Battle_of_Ypres').GetName]和[SCOPE.sCountry('fra_Battle_of_Ypres').GetName]的沿海战略要地和港口，合围协约国侧翼。不屈的[SCOPE.sCharacter('bel_battle_of_ypres_benefactor').GetFirstName]为了保住仅剩的国土不被德军占领，开放闸口引海水倒灌#yellow 伊普尔#!附近的土地，阻止[SCOPE.sCountry('ger_Battle_of_Ypres').GetName]军队抵达海岸。"
 clever_dsk.262.f: "虽然受到洪水阻挡，但[SCOPE.sCharacter('ger_battle_of_ypres_benefactor').GetLastName]成功集结的精锐部队聚集在[SCOPE.sCountry('bel_Battle_of_Ypres').GetName]的伊普尔城前。[SCOPE.sCharacter('fra_battle_of_ypres_benefactor').GetLastName]同样迅速协同[SCOPE.sCountry('bel_Battle_of_Ypres').GetName]的军队，一起在#yellow 伊普尔#!布防和设置战壕。双方互相最快速度奔向大海，一场围绕海港要地的阵地战即将打响！"
 clever_dsk.262.a: "#black 伊泽尔河#!#yellow 必须不惜一切代价#!#red 守住#!!"
 clever_dsk.264.t: "当约翰尼迈步回家时"
 clever_dsk.264.d: "在[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]清晨，内战终究不可避免地爆发，晨雾笼罩着[SCOPE.GetRootScope.GetCountry.GetName]的荒野。南军在[SCOPE.sCharacter('csa_robbot_lee_benefactor').GetLastName]将军指挥下率先完成潜伏，静待突袭。而我们总指挥[SCOPE.sCharacter('usa_general_grant_benefactor').GetLastName]将军神色平静，略带疲惫，仍沉稳巡视阵地薄雾中杀气暗涌，一场惨烈的战争即将打响。"
 clever_dsk.264.f: "当约翰尼再次迈步回家时,我们将会给他热诚的欢迎\n男人们将会欢呼而男孩将会呼喊，所有的女人都会出来庆祝\n而我们都觉得兴奋无比\n村庄里的少年和少女说着，将为他回家的路铺上#red 玫瑰#!"
 clever_dsk.264.a: "期待[SCOPE.sCharacter('usa_general_grant_benefactor').GetFullName]将军的胜利！"
 clever_dsk.265.t: "身着红衫衣的男人"
 clever_dsk.265.d: "[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]晚，为了获得志愿军的力量，在[SCOPE.sCharacter('ita_camillo_gafur_benefactor').GetLastName]的主动邀请下，[SCOPE.sCharacter('garibaldi_scope').GetLastName]将军亲自来到[ROOT.GetCountry.GetCapital.GetCityHubName]的首相府门前。戴着破帽和红衫的[SCOPE.sCharacter('garibaldi_scope').GetLastName]起初被门卫认作是一个无名的穷人拦下，随着大门缓缓打开，一个面带微笑又躯体略显臃肿的家伙走了出来，[SCOPE.sCharacter('garibaldi_scope').GetLastName]抬头一看，这就是商量合作的对象[SCOPE.sCharacter('ita_camillo_gafur_benefactor').GetLastName]。"
 clever_dsk.265.f: "各怀心思的两人在表面的恭迎后，随即陷入一丝尴尬。[SCOPE.sCharacter('ita_camillo_gafur_benefactor').GetLastName]想要[SCOPE.sCharacter('garibaldi_scope').GetLastName]的志愿军名义和力量，去征服南方的[SCOPE.sCountry('garibaldi_spawn_foe_scope').GetName]，但又忌惮[SCOPE.sCharacter('garibaldi_scope').GetLastName]危险的共和思想以及恐怖的号召力。[SCOPE.sCharacter('garibaldi_scope').GetLastName]则希望借助[SCOPE.GetRootScope.GetCountry.GetName]的力量实现意大利统一的夙愿，终结意大利人被外国肆意干涉的历史。"
 clever_dsk.265.a: "我相信[SCOPE.sCharacter('garibaldi_scope').GetLastName]的能力！"
 clever_dsk.265.b: "[SCOPE.sCharacter('ita_camillo_gafur_benefactor').GetLastName]谨慎的态度十分正确！"
 clever_dsk.266.t: "爱戴的英雄们"
 clever_dsk.266.d: "[SCOPE.GetRootScope.GetCountry.GetName]成功统一，所有分裂的意大利兄弟们终于团结在同一面旗帜下。在民众的热烈欢呼中，有三位在统一进程中做出卓越贡献的人物受到人民的爱戴，尽管王室派和共和派的争执仍在暗流涌动。[ROOT.GetCountry.GetCapital.GetCityHubName]的街道，三色旗帜在[SCOPE.sCharacter('garibaldi_scope').GetLastName]领导的红衫军凯旋穿过时，随风四处飘扬，彩旗挂满街巷，民众争相抛花，握手致意。"
 clever_dsk.266.f: "[SCOPE.sCharacter('giuseppe_mazzini_scope').GetLastName]唤醒我们民族之心，让我们渴望统一；[SCOPE.sCharacter('garibaldi_scope').GetLastName]将军披甲征战，红衫军浴血收复国土；[SCOPE.sCharacter('ita_camillo_gafur_benefactor').GetLastName]首相纵横外交，在列国间为[SCOPE.GetRootScope.GetCountry.GetName]谋出路。是他们，让破碎的亚平宁终成一国，意大利统一万岁！"
 clever_dsk.266.a: "一起为他们欢呼~~"
 clever_dsk.267.t: "行动中阵亡名单 KILLED IN ACTION"
 clever_dsk.267.d: "阵亡军官 FALLEN OFFICERS"
 clever_dsk.267.f: "阿什维尔 J.R. 炮手 皇家野战炮兵部队       阿伯内西 J. 少校 威尔士近卫团       巴伯 P. 代理上尉 柴郡团       伯恩 L.E. 中士 诺福克团       布莱尔 P.A. 上尉 皇家苏格兰团       博尔 J.K. 上尉 皇家爱尔兰燧发枪团       布西 H.M. 少尉 皇家爱尔兰燧发枪团       #yellow 罗伊·克罗宁 上尉 皇家苏格兰团#!"
 clever_dsk.267.a: "小姐，你怎么了？是不是有点晕，你吓坏我了..."
 clever_dsk.269.t: "剑术大会"
 clever_dsk.269.d: "江户时期流传的全国性质的剑术大会，每年都吸引许多志士参与这场武道的切磋。[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]，在诸多剑士互相比武结束后，终于进入了最后的决赛，[SCOPE.sCharacter('sword_i_japanese_scope').GetLastName]将对战[SCOPE.sCharacter('sword_ii_japanese_scope').GetLastName]。消息传开，周边的剑士们纷纷前来观看，等待这场激动人心的对决。"
 clever_dsk.269.f: "[ROOT.GetCountry.GetCapital.GetCityHubName]的比武场车水马龙，人们屏息地等待这场意义非凡的对决。[SCOPE.sCharacter('sword_i_japanese_scope').GetLastName]在沉寂片刻后，瞬间连环强攻，刀锋悍烈，步步紧逼[SCOPE.sCharacter('sword_ii_japanese_scope').GetLastName]。身形沉稳的[SCOPE.sCharacter('sword_ii_japanese_scope').GetLastName]固守防御，从容卸力，寻找[SCOPE.sCharacter('sword_i_japanese_scope').GetLastName]攻势衰竭，露出破绽之机。刀尖的金属碰撞声迅速回响整个比武场，眼下仍是胜负难料的局面。"
 clever_dsk.269.a: "究竟谁会赢得胜利，成为[SCOPE.GetRootScope.GetCountry.GetName]的头号剑士？"
 clever_dsk.270.t: "逝去的身影"
 clever_dsk.270.d: "历经岁月变迁，#yellow 大久保利通#!、#yellow 西乡隆盛#!、#yellow 木户孝允#!三位撑起维新大业的核心元勋，皆已相继离世。曾经并肩倒幕废藩、破旧立新、擘画近代[SCOPE.GetRootScope.GetCountry.GetName]蓝图的维新三杰，尽数归于尘土。虽然不少政客对三人功过持有争议：西乡隆盛因西南兵乱一度背负逆名，大久保利通铁血集权、树敌众多，木户孝允积劳成疾、早逝半途，但无人能否认，若无此三人舍身奔走、锐意革新，便无今日脱亚维新、日渐崛起的[SCOPE.GetRootScope.GetCountry.GetName]。"
 clever_dsk.270.f: "为收拢人心、彰表开国之功、稳固维新正统，[SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]在[ROOT.GetCountry.GetCapital.GetCityHubName]清水谷、上野公园及京畿祠坛，举行国家级追思祭典。追赠三人高阶位阶，修缮碑碣、筹备铜像纪功，将三人维新功绩载入国史，昭告天下万世铭记，以示永续强国变革的决心。"
 clever_dsk.270.a: "那个时代过去了，我们仍需向前。"
 clever_dsk.271.t: "非凡的兰贵人"
 clever_dsk.271.d: "在这次八旗选秀中，有一位名为[SCOPE.sCharacter('chi_cixi_come_scope').GetFirstName]的女子凭借美丽的外貌、深受[SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]喜爱，获准入宫后被赐号为“兰贵人”。"
 clever_dsk.271.f: "殿内烛火轻摇，咸丰阅秀女名册抬眸，望见[SCOPE.sCharacter('chi_cixi_come_scope').GetLastName]氏眉目明丽，眼波灵动。少女垂首敛姿，不卑不亢。帝心微动，落笔圈定，将其纳入后宫。"
 clever_dsk.271.a: "传[SCOPE.sCharacter('chi_cixi_come_scope').GetLastName]氏入宫。"
#匈牙利议会############################################################################################################################################################################
 je_aus_dual_monarchy_diet_of_hungary:0 "匈牙利议会"
 je_aus_dual_monarchy_diet_of_hungary_reason:0 "#bold [concept_diet_of_hungary_loyalists]席位#!：#variable [ROOT.GetCountry.MakeScope.Var('diet_of_hungary_loyalists').GetValue|0]#!；[concept_election]时由以下#tooltippable;tooltip:[Country.GetTooltipTag],diet_of_hungary_loyalists_tooltip_advance 条件#!改变。\n#bold [concept_diet_of_hungary_radicals]席位#!：#variable [ROOT.GetCountry.MakeScope.Var('diet_of_hungary_radicals').GetValue|0]#!；[concept_election]时由以下#tooltippable;tooltip:[Country.GetTooltipTag],diet_of_hungary_radicals_tooltip_advance 条件#!改变。\n\n大妥协之后，二元君主国中的两国的一个基本区别是，与奥地利部分不同，[concept_magyar]并不认为自己是一个多民族实体，而是一个马扎尔民族国家。对维也纳来说，奥匈妥协是在一个超民族国家中将两个自治部分联系在一起。对[concept_magyar]来说，君主国只是两个主权国家的外部框架。重建后的[concept_diet_of_hungary]对君主国的事务拥有了不成比例的影响力，他们对内莱塔尼亚宪法结构的任何重大变迁拥有实际的否决权，而且他们经常使用这一权利去影响对方的政策。\n\n议会在召开之后很快就陷入了自由主义[concept_diet_of_hungary_loyalists]和民族主义[concept_diet_of_hungary_radicals]之间的权力斗争，考虑到[concept_diet_of_hungary]对君主国政坛的影响力，我们最好避免让[concept_diet_of_hungary_radicals]占到议会多数，哪怕这代表着大量的妥协和让步。\n\n#bold 当[concept_diet_of_hungary_radicals]的席位大于等于200席时，我们的立法将受到极大阻碍，且任何联邦化的进程都将停止！#!"
 diet_of_hungary_loyalists_tooltip_advance:0 "#variable  每个效忠派大于30%的匈牙利文化省份将使效忠派增加1议席，他们将依靠此在[concept_election]期间每月获得[Country.MakeScope.Var('diet_of_hungary_loyalists_from_loyalist').GetValue|+=]个席位#!\n\n#variable 每个激进派大于20%的匈牙利文化省份将使效忠派减少2议席#!\n\n#bold 以下情况每个月会降低5议席#!：\n•#variable 匈牙利文化人口比例达到20%#!"
 diet_of_hungary_radicals_tooltip_advance:0 "#variable 每个激进派大于20%的匈牙利文化省份将使激进派增加2议席，他们将依靠此在[concept_election]期间每月获得[Country.MakeScope.Var('diet_of_hungary_radicals_from_radical').GetValue|+=]个席位#!\n\n#bold 以下情况每个月会增加5议席#!：\n•#variable 匈牙利文化人口比例达到20%#!\n\n#variable  每个效忠派大于30%的匈牙利文化省份将使激进派减少1议席#!"
 diet_of_hungary_loyalists_tt: "议会多数党: #bold #blue 效忠派#! 席位：(#tooltippable #tooltip:[GetRawTextTooltipTag('diet_of_hungary_tension_tt')] #variable [ROOT.GetCountry.MakeScope.Var('diet_of_hungary_loyalists').GetValue|0]#!#!#!)#!."
 diet_of_hungary_radicals_tt: "议会多数党: #bold #red 反对派#! 席位：(#tooltippable #tooltip:[GetRawTextTooltipTag('diet_of_hungary_tension_tt')] #variable [ROOT.GetCountry.MakeScope.Var('diet_of_hungary_radicals').GetValue|0]#!#!#!)#!."
 diet_of_hungary_tension_tt:0 "[concept_diet_of_hungary]中政党派系的席位，它将影响地方政策的实施"
 status_diet_of_hungary_always:0 "议会中目前没有优势派系"
 concept_diet_of_hungary:0 "匈牙利议会"
 concept_diet_of_hungary_desc:0 "重组后的[concept_diet_of_hungary]由[concept_hungary_kindom]国王每年在布达佩斯召开，拥有立法权，由#variable 贵族院（Főrendiház）#!和#variable 众议院（Képviselőház）#!组成，贵族院由世袭议员、教会人士和自治区代表组成，而众议院则由通过1874年[concept_election]法选出的议员组成，这些议员由基于#variable 财产、税收、职业或官方职位以及世袭特权#!的复杂[concept_election]选出。\n[concept_election]法进一步地巩固了马扎尔精英的主导地位。其最重要的目的是通过将投票权与纳税联系起来，以此来削除经济弱势群体的民主发言权利。\n选举边界也被重新划分了，使得少数族裔更难在一个选区占据多数，显然也损害了其他民族的利益。[concept_diet_of_hungary]有权就有关[concept_hungary_kindom]的所有事项进行立法，但对克罗地亚-斯拉沃尼亚来说，议会只负责它与[concept_hungary_kindom]共同的事项。\n议会对维也纳有着冷淡的忠诚，对少数族裔的要求则保持着毫不妥协的态度。"
 concept_diet_of_hungary_loyalists:0 "效忠派"
 concept_diet_of_hungary_loyalists_desc:0 "匈牙利议会中的哈布斯堡的效忠派主要由自由党为首的一系列自由主义和温和主义政党构成，支持妥协的自由党在少数族裔选民中较为受欢迎，但并不受匈牙利选民的欢迎，但自由党还是时常能通过少数民族的支持成为议会中的多数派，他们是哈布斯堡在匈牙利统治的基石"
 concept_diet_of_hungary_radicals:0 "反对派"
 concept_diet_of_hungary_radicals_desc:0 "匈牙利议会中的反对派主要由以激进独立党为首的一系列民族主义政党组成，这群反对派不满足于现有的妥协政策，要求进一步的自治权乃至完全独立。他们通常能得到大部分匈牙利选民的支持，他们也是哈布斯堡在匈牙利统治遇到的最大阻碍"
 diet_of_hungary_promote_loyalists_button:0 "提拔效忠派"
 diet_of_hungary_promote_loyalists_button_desc:0 "通过政治运作和贿赂，我们可以让那些摇摆不定的人站在我们一方"
 promote_loyalists_button_tt:0 "效忠派的议会席位低于200席"
 promoting_loyalists_tt:0 "我们将开始提拔效忠派"
 cannot_promote_loyalists_twice_tt:0 "我们不能在短时间内提拔效忠派两次"
 diet_of_hungary_loyalists_increase_25_tt:0 "效忠派议席将增加25"
 has_hungary_radicals:0 "议会中有反对派"
 diet_of_hungary_agroculture_button:0 "补贴匈牙利农业"
 diet_of_hungary_agroculture_button_desc:0 "农业一直都是匈牙利的核心产业，对匈牙利的农业产品进行补贴将改善我们与匈牙利农场主们的关系"
 diet_of_hungary_industy_button:0 "补贴匈牙利工业"
 diet_of_hungary_industy_button_desc:0 "匈牙利的工业实力十分落后，我们可以通过对匈牙利的工业产品进行补贴来改善我们与匈牙利工业家们的关系"
 remove_diet_of_hungary_button2:0 "撤销匈牙利议会"
 remove_diet_of_hungary_button2_desc:0 "这群民族主义议员已经无法无天了，为了防止局势进一步恶化，我们可以派一支军队过去解散议会"
 diet_of_hungary_radicals_power_tt:0 "反对派议员占有议会中的280席及以上"
 hungary_at_war_tt:0 "[concept_magyar]可能会用一些激进的方式来回应我们的行为，，，"
 diet_of_hungary_modifier:0 "匈牙利议会"
 hun_subsidies_cost_modifier:0 "补贴花费"
 hun_industy_subsidies_modifier:0 "对匈牙利的工业补贴"
 hun_agricultural_subsidies_modifier:0 "对匈牙利的农业补贴"

#二元君主制############################################################################################################################################################################
 je_aus_dual_monarchy_reform:0 "二元帝国改革"
 je_aus_dual_monarchy_reform_reason:0 "现在，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]决心自行统治内莱塔尼亚，而[SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName]看来十分适合于履行他的意志。\n最初，[SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName]在自己的政府中保留了温和自由派，但他也劝说捷克人重返内莱塔尼亚的政治生活，同时争取到波兰人的支持。\n[SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName]利用政府的脆弱地位向[concept_aus_conservative]成员施加压力，迫使他们克制自己的要求并消弭内部分歧——否则自由派会卷土重来。\n[SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName]的政治日程上满是显而易见的政治交易，虽然其间也有一些进步的现代因素，但也有迎合[concept_aus_conservative]中更为保守的成员的因素。\n[ROOT.GetCountry.GetName]破碎的政治格局对新政府是有利的——[concept_aus_reichsrat]缺乏强有力的稳定多数实际上保障了#variable “王权的全部主权”#!。[SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName]可以#bold 凌驾于各政治党派之上#!进行统治，他像是[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的#variable 大臣#!，仅仅对[Concept('concept_ruler','$RULER_TITLE_KAISER$')]负责。#variable 现在这个新的内阁将带领君主国走向尚不明晰的未来。#!"
 je_aus_dual_monarchy_completed_reason_tt:0 "我们已经完成了大多数二元帝国改革"
 aus_dual_monarchy_reform_main_tt.1:0 "我们必须完成帝国的重组"
 finished_aus_dual_monarchy_reform_tt:0 "二元帝国改革已经完成"
 je_aus_dual_monarchy_reform_advance:0 "我们完成了一个二元帝国改革条目"
 no_austria_hunary:0 "我们失去了捷克和匈牙利"
 aus_dual_monarchy_reform_modifiers:0 "分裂的社会"
 je_aus_dual_monarchy_democracy_and_social:0 "二元帝国改革：民主和社会改革"	
 je_aus_dual_monarchy_democracy_and_social_reason:0 "表面看来有进步主义倾向的措施也会#bold 抑制进步#!，并削弱政治上的自由色彩，比如扩大[concept_election]权。通过#bold [concept_election]改革#!将地位较低的中产阶级纳入到了奥地利的政治生活中。但是，作为经济现代化的牺牲品，中产阶级(Mittelstand)是#bold 反自由的#!，他们易于为我们更具#bold 社会色彩#!和#bold 国家导向#!的政权拉拢。\n同时，为了同俾斯麦竞争，在一个改宗天主教的犹太人#yellow 埃米尔·施坦巴赫#!的建议下，内阁通过了一大堆#bold 社会立法#!，旨在解决新经济中最糟糕的极端问题。#bold 工作时间、童工和女工#!的使用都有了限制;产业工人的#bold 事故和疾病保险制度#!开始实施;1859年的自由产业法典在1882年被新法典取代，后者对行会和同业公会的#bold 限制性规章#!要严厉得多。"
 je_aus_dual_monarchy_municipal_council:0 "二元帝国改革：拉拢其他民族"	
 je_aus_dual_monarchy_municipal_council_reason:0 "为了推动我们的改革，我们可以以牺牲政治和行政政策中的自由主义为代价而换来获得#yellow 捷克人#!和#yellow 加利西亚人#!的支持。在波希米亚议会[concept_election]制度改革后，这个从前德意志人占主导的机构被转交给了#yellow 捷克人#!，正如1881年大量创设贵族议员，把过去的自由派上院交给保守派一样。最富争议的是1880年的施特雷迈尔法令,该法令规定#bold 捷克语#!是波希米亚和摩拉维亚政治官僚机构的“对外”语言之一。这些措施因而大大削减了#yellow 德意志人#!的官僚工作职位。"	
 bohemia_dual_monarchy_button:0 "改组波西米亚议会"
 bohemia_dual_monarchy_button_desc:0 "我们将改组波西米亚议会以取得他们的支持"
 galicia_lodomeria_dual_monarchy_button:0 "改组加利西亚议会"
 galicia_lodomeria_dual_monarchy_button_desc:0 "我们将改组波西米亚议会以取得他们的支持"
 aus_dual_monarchy_region_reform_tt:0 "我们已经决定对其他民族做出让步"
 finished_aus_dual_monarchy_council_reform_tt:0 "我们成功改组了波西米亚和加利西亚的议会。" 
 je_aus_dual_monarchy_pluralism:0 "二元帝国改革：世俗化和多元化"
 je_aus_dual_monarchy_pluralism_reason:0 "[concept_aus_liberal]以约瑟夫主义传统来增强#variable 反教权主义#!的斗争力量，他们的斗争方向则在#bold 削减教会权力#!方面。1868年的#bold 5月法令#!撤销了1855年教务专约中关于婚姻和教育权的转让。自由派最大的成就之一是确立了全体儿童的8年#bold 免费义务教育#!。1870年，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]自己废除了教务专约，此举是对教皇无谬论宣言的回应，而这个宣言是对哈布斯堡权威的威胁。\n帝国同样在推进多元化进程，1867年的12月宪法规定了#variable 所有个人，不论其宗教信仰如何，在法律面前均一律平等#!，这实现了奥地利#variable 犹太人#!的完全解放。关于#bold 民族权利#!的条款则直接借用自1848年的克罗梅日什宪法，这将是帝国多元化的重要一步。"
 je_aus_dual_monarchy_economy:0 "二元帝国改革：奠基年代(Grtnderjahre)"
 je_aus_dual_monarchy_economy_reason:0 "在[concept_aus_liberal]得势的早年，经济在#variable 自由放任政策#!的推动下，前景十分乐观，投资规模巨大，这些因素导致了令人惊讶的增长速率。这些年堪称#red “奠基年代”(Grtnderjahre)#!，很多工业、金融和商业事业就是当时创办的。#variable 维也纳环城大道#!的扩建既是增长的象征，又是增长的一个推进器。君主国首都的象征性主干道两侧矗立着#bold 犹太银行世家#!的“宫殿”，这既说明犹太企业家在新经济中取得的成功，也表明社会对犹太人成就的认可——如果局势发展良好的话。"
 finished_aus_dual_monarchy_economy_tt:0 "我们将gdp提升了三倍"
 je_aus_dual_monarchy_military:0 "二元帝国改革：军事改革"
 je_aus_dual_monarchy_military_reason:0 "自从[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]接受了妥协方案，成为了[concept_hungary_kindom]的国王，奥匈帝国军队的分裂就开始逐渐的显现了出来。1868年的#bold 军队法令#!奠定了二元君主国未来军队的基调：奥匈帝国的军队将由三个部分组成，分别是\n#variable 皇家和王家地方防卫军#!（属于帝国内部的非[concept_hungary_kindom]部分的地方防卫军，不得在帝国内部随意调动与作战），\n#variable 正规的皇室与王家联合军队#!（在征兵方面拥有优先权，不仅要负责对外的作战，同时还要负责对内的平叛）\n#variable 王家[concept_hungary_kindom]防卫军#!（归属于[concept_hungary_kindom]王国的地方防卫部，在匈牙利地区享有比帝国军队还要优先的征兵权），\n这三个部分的确立标志着奥匈帝国复杂的军队体系的诞生"
 je_aus_dual_monarchy_diplomacy:0 "二元帝国改革：打破外交孤立"
 je_aus_dual_monarchy_diplomacy_reason:0 "在失去了在德意志扩张的可能与意大利的领土后，帝国在对外政策上失去方向。以至于俾斯麦在柏林会议上嘲讽道#bold “我听过有人不肯吃他们的鸽子，除非有人把鸽子射杀，替他们烤好，但我从没听过有人非要人把他的嘴掰开，把鸽子强行塞进他喉咙，他才肯吃。”#!我们必须重新寻找一个#variable 可靠的盟友#!以尽快打破我们外交孤立的困境。"
 aus_at_peace_tt:0 "奥地利处于和平状态"
 je_dual_monarchy_balkan:0 "帝国在巴尔干的利益"
 je_dual_monarchy_balkan_reason:0 "二元帝国的改革后，帝国的外交扩张重心便转向了巴尔干。#yellow 斐迪南大公#!和#yellow  埃伦塔尔#!提出了宏伟的#variable 巴尔干构想#!，即以波斯尼亚二省为基础，吞并著名的港口城市#bold 萨洛尼卡#!，借由一条贯穿马其顿地区与新帕扎尔区的走廊将其与哈布斯堡帝国连接，修建从维也纳到萨洛尼卡的铁路，利用这港口来打开的里雅斯特、阜姆这两个位于亚得里亚海滨的奥地利“落后地区”的对外贸易。当然，[concept_magyar]一如既往地反对在巴尔干的扩张，但此时失去了柏林的支持的#bold [concept_hungary_kindom]#!不再能阻止维也纳了，更何况#yellow 斐迪南大公#!一贯不喜欢#bold [concept_hungary_kindom]#!。我们必须建立#variable 在巴尔干的霸权#!以保证我们的利益，是时候让俄国人滚出巴尔干了。"
#帝国联邦化############################################################################################################################################################################
 je_dnf_possible_rework:0 "帝国联邦化"
 je_dnf_possible_rework_reason:0 "曾经，我们伟大的先驱#yellow 克莱门斯·梅特涅#!在拿破仑战争后曾经提出过将奥地利联邦化的提案，将帝国分为五个大区，但这个提议遭到了#yellow 弗朗茨#!皇帝的否决。如今随着联邦议案被[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]正式批准，我们的帝国将正式开始联邦化进程。虽然我们的联邦化政策受到了广大斯拉夫地区的欢迎，但[concept_magyar]却因为特权被削减而选择坚决抵制联邦化。联邦化到底是帝国民族问题的解药，亦或是民族冲突的催化剂？\n#red 注意：每当我们联邦化一个地区，都会引起[concept_magyar]的不满！#!"

 aus_dual_monarchy.1.t:0 "奥地利-匈牙利联合提案"
 aus_dual_monarchy.1.d:0 "在与普鲁士的战争中遭受灾难性失败之后，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]不能再无视匈牙利的要求了。匈牙利是君主国中迄今为止最大的历史国家实体，要是没有其海量的资源，哈布斯堡君主国就不可能维持着列强地位。很快与马扎尔领导集团达成协议。令他颇感宽慰的是，德雅克没有在他已答应的要求之外再提出新的要求。随后就是平衡（Ausgleich)）或“妥协”，根据这个妥协案，#yellow 奥地利帝国#!改组成#yellow 奥地利—匈牙利二元帝国#!。"
 aus_dual_monarchy.1.d2:0 "在与普鲁士的战争中遭受灾难性失败之后，面对匈牙利愈发紧张的局势，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]不能再无视匈牙利的要求了。匈牙利是君主国中迄今为止最大的历史国家实体，要是没有其海量的资源，哈布斯堡君主国就不可能维持着列强地位。很快与马扎尔领导集团达成协议。令他颇感宽慰的是，德雅克没有在他已答应的要求之外再提出新的要求。随后就是平衡（Ausgleich)）或“妥协”，根据这个妥协案，#yellow 奥地利帝国#!改组成#yellow 奥地利—匈牙利二元帝国#!。"
 aus_dual_monarchy.1.f:0 "妥协案忽视了君主国的其他族裔群体，这一点当时就很清楚。在那次关键的大臣议事会上，保守的联邦主义者#yellow 贝尔克莱迪#!伯爵主张，君主不应该依赖于某些特定的民族，而应该超越于所有民族之上，而且君主肯定不应该忽视这个国家的斯拉夫人。但帝国首相#yellow 弗雷德里希·博伊斯特#!男爵的看法不同:“君主国的斯拉夫人将对新政策持不信任态度，这一点我很清楚;但政府不可能始终对所有民族都公平相待。因此我们必须依靠那些最有活力(Lebenskraft)的民族的支持……这就是德意志人和[concept_magyar]。”[Concept('concept_ruler','$RULER_TITLE_KAISER$')]对争论的回答别具一格，但后果是致命的:“#yellow 贝尔克莱迪#!伯爵提出的方案也许是最不容反对的，但#yellow 博伊斯特#!男爵的方案应能更快地达到预期目标。”"
 aus_dual_monarchy.1.a:0 "我们必须接受这个妥协。"
 aus_dual_monarchy.1.b:0 "奥地利将永远是奥地利人的！"
 aus_dual_monarchy.2.t:0 "塔菲改革"
 aus_dual_monarchy.2.d:0 "为了在改组后尽快稳定国家，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]任命了自己的童年好友[SCOPE.sCharacter('industrialists_ig_leader_scope').GetFullName]来组织一个新政府，四个月后，[SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName]组成了被称为[concept_aus_conservative]的新内阁，内阁得到[concept_aus_reichsrat]中各种五花八门的集团的支持，如捷克人、波兰人、德意志教士和德意志保守派。这个联盟由从前奥地利政治中的“在野派”或称“右派”构成，他们直接控制的席位少于[concept_aus_liberal]或曰“左派”控制的席位，但双方都不能取得353席中的多数，于是，在皇帝的支持下，[SCOPE.sCharacter('industrialists_ig_leader_scope').GetLastName]的[concept_aus_conservative]将在很长一段时间执掌帝国大权。"
 aus_dual_monarchy.2.f:0 "自由派失败的原因正是过去曾帮助过他们的选举几何学，他们在大地主[concept_election]集团中的失利是决定性的。但他们仍占据着几乎一半的席位，很多人仍认为下一轮[concept_election]中他们将重新掌权，虽然这要经过一番磨难。但他们错了。自由派此后再也没有在[concept_aus_reichsrat]中重获多数，[concept_aus_conservative]将摧毁任何让内莱塔尼亚成为德意志自由国家的想法。"
 aus_dual_monarchy.2.a:0 "“得过且过”(Fortwursteln)"
 aus_dual_monarchy.3.t:0 "二元君主国的未来"
 aus_dual_monarchy.3.d:0 "我们的改革和外交取得的成果使帝国的政治情况暂时稳定了下来，但[SCOPE.sCulture('hungarian_culture').GetName]的特权地位仍然是帝国绕不开的一个话题：奥匈妥协使得[SCOPE.sCulture('hungarian_culture').GetName]对君主国的事务拥有了不成比例的影响力。君主国两部分对另一方的影响力也出现不平衡的发展势头。为了抑制这个趋势，以[SCOPE.sCharacter('dual_monarchy_landowners_scope').GetLastName]为代表的一些保守派政治家提出了将帝国联邦化以削弱匈牙利的特权地位的提案，虽然得到了斯拉夫议员们的支持，不过这个激进的提案肯定会激怒那些在二元君主制下享有许多特权的[SCOPE.sCulture('hungarian_culture').GetName]人。"
 aus_dual_monarchy.3.f:0 "尽管匈牙利的族裔构成参差不齐——匈牙利不仅有#bold [concept_magyar]#!，还有大量的[SCOPE.sCulture('slovak_culture').GetName]人、[SCOPE.sCulture('ukrainian_culture').GetName]人、[SCOPE.sCulture('romanian_culture').GetName]人、[SCOPE.sCulture('serb_culture').GetName]人和[SCOPE.sCulture('croat_culture').GetName]人，但布达佩斯颁布的法令规定，王国所有的公民，无论他们归属于哪个语言群体，都是匈牙利民族平等的一员。其他族裔群体只是被视为民族权利有限的语言少数群体。他们被要求正式认同政治上的[SCOPE.sCulture('hungarian_culture').GetName]民族国家。"
 aus_dual_monarchy.3.a:0 "我们将更进一步，推动帝国的联邦化"
 aus_dual_monarchy.3.b:0 "我们将维持现状"
 hungarian_unhappy_tt:0 "这个决定将引发马扎尔人极大不满"
 aus_dual_monarchy.4.t:0 "巴尔干霸主"
 aus_dual_monarchy.4.d:0 "我们做到了！经过无数的外交博弈和武装冲突，我们终于将俄国人的势力驱逐出了巴尔干，由[ROOT.GetCountry.GetName]主导的巴尔干新秩序已经诞生。现在，是时候成立一个由我们控制的巴尔干联邦来巩固我们在巴尔干的利益了"
 aus_dual_monarchy.4.f:0 "头一个亡于巴尔干飞蹿的子弹者，乃是现状"
 aus_dual_monarchy.4.a:0 "鹰旗将永远飘荡在巴尔干的上空"
 aus_dual_monarchy.5.t:0 "匈牙利议会阻碍我们的立法"
 aus_dual_monarchy.5.d:0 "根据奥匈妥协条约规定，[concept_diet_of_hungary]对[concept_aus_reichsrat]所辖领地宪法结构的重大变迁拥有实际的否决权，且他们经常使用这权力来影响对方政策。在最近的一次议会选举中，激进分子获得了压倒性的胜利，他们通过阻碍[concept_aus_reichsrat]的立法来表达对我们当下政策的不满。\n#bold 当激进派席位小于或等于150时，这个妨碍修正将被移除#!"
 aus_dual_monarchy.5.f:0 "在匈牙利，由总理伊斯特万·蒂萨领导的自由主义政府受到了民族主义反对派的威胁，特别是革命领袖之子费伦茨·科苏特（Ferenc Kossuth）领导的激进独立党。反对派拆毁了议会室，冲出了布达佩斯的议会，引发了政府危机，并最终导致蒂萨辞职。"
 aus_dual_monarchy.5.a:0 "我这是为了你们好！"
 aus_dual_monarchy.6.t:0 "匈牙利议会的效忠派重新占据上风"
 aus_dual_monarchy.6.d:0 "随着效忠派派重新回到多数党的地位，[concept_diet_of_hungary]对[concept_aus_reichsrat]立法的阻扰也随之消失，我们终于可以为此松一口气了"
 aus_dual_monarchy.6.f:0 "马扎尔政治领导人中的现实主义者知道，只有在哈布斯堡君主国这个框架内，才能保留住马扎尔人在匈牙利的特权地位，甚至是他们热爱的王国的存在也需要仰赖于君主国。鉴于国内少数族裔争取民族解放的斗争、巴尔干地区的事态发展和俄罗斯的扩张主义政策，一个马扎尔民族国家独立生存的可能性是很小的。"
 aus_dual_monarchy.6.a:0 "他战胜了他自己，他爱帝国！"
 aus_dual_monarchy.7.t:0 "第二次匈牙利起义"
 aus_dual_monarchy.7.d:0 "匈牙利议会正式宣布废黜我们的皇帝作为匈牙利国王的地位以回应我们的进军，两国实际上已经处于战争状态"
 aus_dual_monarchy.7.f:0 "孩子们，我还能说什么，[concept_magyar]out！"
 aus_dual_monarchy.7.a:0 "碾碎他们！"
 dnf_events.1.t:0 "多瑙联邦"
 dnf_events.1.d:0 "随着民族主义在我们国家内发展愈发壮大，一些学者提出了围绕民族建立一个帝国联邦的建议。通过起草一部各民族平等的宪法，把分离主义分子清扫出去。不过这个激进的建议肯定会激怒那些在以布达佩斯为中心的政权下享有许多特权的匈牙利贵族们。"
 dnf_events.1.a:0 "我们必须现在起草《多瑙宪法》。"
 dnf_events.1.f:0 "对于哈布斯堡王朝来说，不同民族之间的巨大差异需要采用联邦国家的形式。"
 danubian_federation_tt:0 "国家将被称为多瑙联邦"
 danubian_federation_tt2:0 "国家将被称为奥地利合众国"
 dnf_events.2.t:0 "联邦宪法：波希米亚与斯洛伐克"
 dnf_events.2.d:0 "几个世纪以来，波希米亚与斯洛伐克一直是帝国不可分割的一部分，因此他们在新宪法中必须得到承认，有些人甚至呼吁将失去的西里西亚省纳入其中。"
 dnf_events.2.a:0 "携手共进！"
 dnf_events.2.b:0 "西里西亚必须回归。"
 dnf_events.2.f:0 "“真理独胜。”"
 dnf_events.3.t:0 "联邦宪法：罗马尼亚问题"
 dnf_events.3.d:0 "特兰西瓦尼亚的公民大部分是罗马尼亚人，其中许多人渴望与其他的罗马尼亚人联合。现在是应该考虑他们的国家是否应被承认并纳入我们联邦的时候了。"
 dnf_events.3.a:0 "我们必须合并罗马尼亚。"
 dnf_events.3.b:0 "最好不要惹上麻烦。"
 dnf_events.3.f:0 "“合众为一。”"
 dnf_events.4.t:0 "联邦宪法：加利西亚问题"
 dnf_events.4.d:0 "我们的加利西亚领土上居住着波兰人和鲁塞尼亚人，这是瓜分波兰的遗留问题。提升波兰人的地位肯定会激怒其他拥有波兰领土的邻国，而承认这些鲁塞尼亚人则可能被俄罗斯人认为是一种轻视。"
 dnf_events.4.a:0 "我们只承认波兰人。"
 dnf_events.4.b:0 "两个民族都应平等对待。"
 dnf_events.4.c:0 "我们只承认鲁塞尼亚人。"
 dnf_events.4.e:0 "最好别管这个烂摊子。"
 dnf_events.4.f:0 "“也许瓜分波兰带来的麻烦远远超过它的价值……”"
 dnf_events.5.t:0 "联邦宪法：意大利问题"
 dnf_events.5.d:0 "我们守住了位于意大利的领土。这一地区的意大利民族主义愈发高涨，也许将其纳入我们的宪法会抑制分离主义。"
 dnf_events.5.a:0 "意大利人是联邦不可分割的一部分。"
 dnf_events.5.b:0 "我们得避免火上浇油。"
 dnf_events.5.f:0 "“祝你平安，意大利！”"
 dnf_events.6.t:0 "联邦宪法：斯洛文尼亚问题"
 dnf_events.6.d:0 "斯洛文尼亚长期以来是奥地利帝国的一部分，我们应当把这个民族提升到与其他邦国同等的地位吗？"
 dnf_events.6.a:0 "斯洛文尼亚人会在新宪法中得到承认。"
 dnf_events.6.b:0 "没必要。"
 dnf_events.6.f:0 "“小欧洲。”"
 dnf_events.8.t:0 "联邦的未来"
 dnf_events.8.d:0 "随着所有省份都批准了新的《联邦宪法》，我们可能没有消除所有的分歧，但我们的联邦肯定会预示着一个稳定和进步的新时代。"
 dnf_events.8.a:0 "多瑙联邦万岁！"
 dnf_events.8.b:0 "大奥地利合众国万岁！"
 dnf_events.8.f:0 "对于哈布斯堡王朝来说，不同民族之间的巨大差异需要采用联邦国家的形式。"
 dnf_events.9.t:0 "多瑙解体"
 dnf_events.9.d:0 "《多瑙河宪法》的解体有利于德意志统一，这在多瑙民族中引起了轩然大波。多瑙各民族的精英们认为他们将再次沦为二等公民，因此要求保留一个独立于新的德国之外的联邦政治实体。"
 dnf_events.9.a:0 "只要他们仍然是我们的臣民，我们就会批准这个请求。"
 dnf_events.9.b:0 "无视他们。"
 dnf_events.9.f:0 "“平等或独立！”"
 danubian_constitution_modifier:0 "多瑙宪法"
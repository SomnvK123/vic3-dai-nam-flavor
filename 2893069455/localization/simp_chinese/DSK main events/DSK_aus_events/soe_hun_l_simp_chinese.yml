l_simp_chinese:
 je_hungarian_crisis:0 "匈牙利议会"
 je_hungarian_crisis_reason:0 "#bold [concept_magyar]#!认为自己是#bold [concept_hungary_kindom]#!这个民族国家的主体。在圣斯蒂芬王冠领地内，[concept_magyar]不只是占主导地位的语言群体，也是最大的族裔群体。他们在过去一直享有广泛的自治权并受到匈牙利宪法的保护。\n\n[concept_hungary_kindom]王国的主要代表是#v $aristocrats$#!，他们自视为#bold 匈牙利民族身份认同的守护者#!。他们一再抵制让匈牙利成为哈布斯堡#bold 中央集权政策#!一部分的企图。甚至在1867年奥匈妥协之前，这些激进的#v $aristocrats$#!精英们便能够维持着匈牙利所享受的特殊地位。\n\n即使是在玛丽亚·特蕾莎治下，[concept_hungary_kindom]王国也被排除在君主国一体化的改革之外。当约瑟夫二世试图让德语代替拉丁语成为行政语言，并改革宪法时，他将匈牙利逼到了反叛的边缘。\n我们必须妥善处理好与[concept_magyar]（尤其是贵族精英）之间的关系，让全体[concept_magyar]团结在我们哈布斯堡的伟大旗帜下。"
 status_hungary_revolution_progress_low:0 "匈牙利自治倾向：#variable 低#!"
 status_hungary_revolution_progress_mid:0 "匈牙利自治倾向：#variable 中#!"
 status_hungary_revolution_progress_high:0 "匈牙利自治倾向：#variable 高#!"
 hungary_autonomy_complete_tt:0 "匈牙利自治倾向达到极高，激进派决定采取进一步行动"
 hungary_autonomy_fail_tt:0 "我们成功控制住了匈牙利的自治倾向"
 hungary_revolution_progress_tt:0 "匈牙利自治倾向将增加一点"
#奥匈对峙###########################################################################################################################################################################
 je_Tensions_in_Hungary_aus:0 "万国之春：匈牙利"
 je_Tensions_in_Hungary_aus_reason:0 "进度条将显示目前#variable 帝国政府#!和[SCOPE.sCountry('hungary_scope').GetName]政府之间的紧张度，当紧张度达到#variable 300#!时，我们将向#bold [concept_hungary_kindom]#!发送#red 最后通牒#!。\n\n紧张度将每周增加#variable 5#!点。作出令[SCOPE.sCountry('hungary_scope').GetName]不悦的决定将#red 增加紧张度#!\n\n随着#bold [concept_hungary_kindom]#!的#variable 自由派#!夺取了议会的多数议席，并开始向#variable 帝国政府#!提出更多过分要求时，两个政府实际上已经陷入了对峙状态。虽然[concept_war]实际上并未爆发，#bold [concept_hungary_kindom]#!也未解除对[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的效忠，但这种平衡及其脆弱，只需一点点风吹草动就能将其摧毁。\n我们可以维持平衡并与[concept_magyar]达成妥协，或者#red 激化矛盾#!，并通过一次迅速且精准的军事行动彻底终结[concept_magyar]数百年的#variable 特权和自治地位#!\n\n各路势力都在伺机而动，如果我们不作出马上决定，我们极有可能面临更严重的损失！"
 je_tih_status_1: "当前阶段: #bold #green 风平浪静#! (#tooltippable #tooltip:[GetRawTextTooltipTag('hun_tension_tt')] [GetGlobalVariable('tensions_in_hungary_var').GetValue]#!#!)#!."
 je_tih_status_2: "当前阶段: #bold #yellow 危机四伏#! (#tooltippable #tooltip:[GetRawTextTooltipTag('hun_tension_tt')] [GetGlobalVariable('tensions_in_hungary_var').GetValue]#!#!)#!."
 je_tih_status_3: "当前阶段: #bold #red 一触即发#! (#tooltippable #tooltip:[GetRawTextTooltipTag('hun_tension_tt')] [GetGlobalVariable('tensions_in_hungary_var').GetValue]#!#!)#!."
 je_tih_status_4: "当前阶段: #bold #blue 妥协谈判中#! (#tooltippable #tooltip:[GetRawTextTooltipTag('hun_tension_tt')] [GetGlobalVariable('tensions_in_hungary_var').GetValue]#!#!)#!."
 hun_tension_tt:0 "紧张度是衡量帝国政府与匈牙利政府关系的标准，作出令匈牙利人不悦的决定将#red 增加紧张度#!"
 je_Tensions_in_Hungary_aus_complete:0 "紧张度达到300"
 je_Tensions_in_Hungary_aus_complete2:0 "我们将向匈牙利发送一份最后通牒，如果他们拒绝，战争将会来临。"
 je_Tensions_in_Hungary_aus_complete3:0 "当时间截止且紧张度小于300.[concept_war]将被避免。\n[SCOPE.sCountry('hungary_scope').GetName]将成为我们的#variable 共主邦联#!。"
 je_Tensions_in_Hungary_aus_button_a:0 "进行妥协谈判"
 je_Tensions_in_Hungary_aus_button_a_desc:0 "只有对话才能解决问题，我们不能放过任何可以和平谈判的机会"
 Tensions_in_Hungary_aus_button_a_possible_tt:0 "我们或匈牙利方在最近两个月内没有进行妥协谈判"
 Tensions_in_Hungary_aus_button_a_effect_tt:0 "紧张度将减少20\n紧张度增长将短暂停止"
 je_Tensions_in_Hungary_aus_button_b:0 "在边境部署部队"
 je_Tensions_in_Hungary_aus_button_b_desc:0 "我们不能信任他们，必须加强战备"
 Tensions_in_Hungary_aus_button_b_possible_tt:0 "我们在最近六个月内没有边境部署部队\n妥协谈判时部署军队会显得我们没有诚意。"
 Tensions_in_Hungary_aus_button_b_effect_tt:0 "紧张度将增加20 \n匈牙利人将察觉到我们的行动，并采取相应措施"
 je_Tensions_in_Hungary_aus_button_c:0 "派遣兰贝格·费伦茨到匈牙利"
 je_Tensions_in_Hungary_aus_button_c_desc:0 "为了改善我们与匈牙利政府的关系，我们将派遣匈牙利将军兰贝格·费伦茨前往佩斯担任皇家委员和匈牙利军队总指挥，相信兰贝格一定缓和两边的紧张局势"
 Tensions_in_Hungary_aus_button_c_possible_tt:0 "紧张度 >= 200"
 Tensions_in_Hungary_aus_button_c_effect_tt:0 "兰贝格将前往匈牙利，相信这位有名望的匈牙利将军一定能得到他们同胞的尊重，大概。"
 je_Tensions_in_Hungary_aus_button_d:0 "向俄国求援"
 je_Tensions_in_Hungary_aus_button_d_desc:0 "以我们一己之力对抗马扎尔人可能会略显吃力，但我们可以寻求俄国人的帮助，相信他们一定会接受我们的请求。"
 Tensions_in_Hungary_aus_button_d_possible_tt:0 "紧张度 >= 150\n我们未曾向俄国寻求过帮助\n#variable 万国之春：奥地利#!日记处于激活状态"
 Tensions_in_Hungary_aus_button_d_effect_tt:0 "紧张度将增加40\n我们将向俄国发送求援请求，若他们答应，他们将成为我们的盟友，且必定参加我们与[concept_magyar]的战争。"
 je_Tensions_in_Hungary_hun:0 "万国之春：匈牙利"
 je_Tensions_in_Hungary_hun_reason:0 "进度条将显示目前[SCOPE.sCountry('austria_scope').GetName]政府和[SCOPE.sCountry('hungary_scope').GetName]政府之间的紧张度。当紧张度达到#variable 300#!时，[SCOPE.sCountry('austria_scope').GetName]将向我们发送#red 最后通牒#!。当时间截止且紧张度小于300.[concept_war]将被避免。\n我们将成为[SCOPE.sCountry('austria_scope').GetName]的#variable 共主邦联#!。\n\n紧张度将每周增加#variable 5#!点。作出令[SCOPE.sCountry('austria_scope').GetName]不悦的决定将#red 增加紧张度#!\n\n随着#variable 自由派#!夺取了议会的多数议席，并建立了#bold [concept_hungary_kindom]#!历史上第一个#variable 责任内阁#!时，两个政府实际上已经陷入了对峙状态。虽然[concept_war]实际上并未爆发，我们也未解除对[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的效忠，但这种平衡及其脆弱，只需一点点风吹草动就能将其摧毁。\n我们可以维持平衡并与[SCOPE.sCountry('austria_scope').GetName]达成妥协，或者#red 激化矛盾#!，并通过一次伟大的独立战争彻底终结[SCOPE.sCountry('austria_scope').GetName]对我们数百年的#variable 压迫#!\n无论我们的选择如何，命运女神将永远站在#bold [concept_magyar]#!一边！"
 je_Tensions_in_Hungary_hun_button_a:0 "进行妥协谈判"
 je_Tensions_in_Hungary_hun_button_a_desc:0 "只有对话才能解决问题，我们不能放过任何可以和平谈判的机会"
 je_Tensions_in_Hungary_hun_button_a_possible_tt:0 "我们或奥地利方在最近两个月内没有进行妥协谈判"
 je_Tensions_in_Hungary_hun_button_a_effect_tt:0 "紧张度将减少20\n紧张度增长将短暂停止"
 je_Tensions_in_Hungary_hun_button_b:0 "要求克罗地亚"
 je_Tensions_in_Hungary_hun_button_b_desc:0 "克罗地亚总督耶拉季奇和他的部队的入侵是对匈牙利国防安全的重要威胁，我们必须向维也纳政府提出抗议，要求他们将耶拉季奇解职并换上忠于我们的总督"
 Tensions_in_Hungary_hun_button_b_possible_tt:0 "紧张度 >= 50\n我们未曾索要过克罗地亚"
 Tensions_in_Hungary_aus_button_b_effect_tt:0 "我们的要求将被呈送至维也纳，如果他们答应，我们将取得克罗地亚"
 je_Tensions_in_Hungary_hun_button_c:0 "探讨非马扎尔民族地位问题"
 je_Tensions_in_Hungary_hun_button_c_desc:0 "数量庞大的非马扎尔民族已经对我们的政权构成了严重威胁，我们需要开会来决定他们的去留"
 Tensions_in_Hungary_hun_button_c_possible_tt:0 "紧张度 >= 50\n我们未曾讨论过非马扎尔民族地位问题"
 Tensions_in_Hungary_aus_button_c_effect_tt:0 "我们的议会将把非马扎尔民族地位问题作为紧急议程。当然，这将激怒议会中大量的马扎尔民族主义者。"
#匈牙利革命###########################################################################################################################################################################
 je_dsk_hungarian_revolution:0 "匈牙利在燃烧！"
 je_dsk_hungarian_revolution_reason:0 "事态已经无可挽回，尽管包贾尼·拉约什多次前往维也纳寻求和平解决的途径，但也无济于事。随着帝国政府开始支持克罗地亚军队的行动，帝国和匈牙利之间已经实际上陷入了对抗状态，我们必需立即派遣军队平息匈牙利人的叛乱。幸运的是，匈牙利领地内的#bold 斯拉夫人#!和#bold 罗马尼亚人#!都支持我们的正义之举，相信我们能够在他们的支持下轻松解决叛匪。"
 hungary_independent_war:0 "匈牙利革命"
 je_postwar_reconstruction:0 "战后重建"
 je_postwar_reconstruction_reason:0 "哈布斯堡胜利的一个政治后果是[concept_hungary_kindom]的历史宪法被废除了，而宪法是[concept_hungary_kindom]民族国家的象征。新政府听命于维也纳中央政府的指示，由讲德语的官员填充，这些人被视为外国统治者，遭到了[concept_magyar]的断然拒绝。为了摧毁[concept_hungary_kindom]国家，维也纳重组了整个王国并废除了郡国制度。克罗地亚-斯拉沃尼亚和特兰西瓦尼亚成了皇室领地，有着独立于[concept_hungary_kindom]的自己的权利，塞尔维亚和巴纳特也被授予了特殊权利。这些措施甚至惹恼了匈牙利社会中的亲哈布斯堡群体。[concept_magyar]对此表现出了坚决的消极抵抗姿态。\n\n我们与[concept_magyar]的关系已经降至冰点，必须立即采取行动缓和我们与他们的关系。"
 finished_hungary_reform_tt:0 "我们已经废除匈牙利军区，建立了文官政府。"
#匈牙利事件链##########################################################################################################################################################################
 concept_magyar:0 "匈牙利人"
 concept_magyar_desc:0 "“#variable 匈牙利民族（Natio—Hungarica）”#!一词指的是自中世纪以来一直存在的封建政治精英群体。\n它被定义为对#variable 圣斯蒂芬王冠#!的历史认同，而非身为匈牙利语人口的一员。然而，在19世纪，政治意义上的匈牙利民族忽视了该国的#variable 多族裔结构#!，并开始被用于指代现代意义上的讲匈牙利语的马扎尔民族。\n\n马扎尔语人口（Magyar）是哈布斯堡君主国中仅次于德意志语人口的第二大语言群体，也是匈牙利王国内占主导地位的民族。#variable 马扎尔乡绅#!#v $aristocrats$#!对#variable 马扎尔民族国家（Magyardom）#!的历史传统感到非常自豪，并在匈牙利塑造了最基本的民族保守主义的政治氛围。"
 concept_hungary_kindom:0 "匈牙利"
 concept_hungary_kindom_desc:0 "与其他哈布斯堡王朝统治的地区不同，[concept_hungary_kindom]王国有一部古老的#variable 历史宪法#!，该宪法限制了王室的权力，并大大增加了议会的权威。1222年的#variable 金牛法#!是宪法对欧洲君主权力施加限制的最早例子之一。类似于英国的《大宪章》，这部宪法也是被强加给[concept_hungary_kindom]国王的。\n\n1804年，弗朗茨[Concept('concept_ruler','$RULER_TITLE_KAISER$')]宣布将属下所有世袭领地重组为奥地利帝国，但新的帝国法律不适用于匈牙利王国。帝国政府向匈牙利议会保证，奥地利帝国的建立在任何意义上都不会影响匈牙利的#variable 独立法律制度和宪法#!。直到1848年，匈牙利王国的行政和政府基本上没有受到“总体”奥地利帝国政府结构的影响。\n然而，旧的匈牙利宪法和匈牙利公法使得匈牙利王国在法律上不可能合并进另一个国家中。匈牙利的中央政府结构仍然与帝国政府保持着良好的分离。\n该国由#variable 匈牙利总督府（Gubernium）#!——总部设在普雷斯堡（布拉迪斯拉发），后来迁至佩斯；以及维也纳的匈牙利皇家总理府管理。"
 dsk_hungary_events.1.a:0 "匈牙利王国"
 dsk_hungary_events.1.b:0 "与哈布斯堡君主国的大部分地区一样，[concept_hungary_kindom]统治阶级也是由#v $aristocrats$#!组成的，在第一次世界大战之前，他们一直保持着政治和经济上的特权。马扎尔精英与哈布斯堡君主国的关系被他们对自治权的要求主导着，我们必须妥善处理好跟他们的关系，否则可能会有酿成大祸。"
 dsk_hungary_events.1.c:0 "你简直作不了一个厨师，\n[concept_hungary_kindom]，我亲爱的祖国！\n你让一边的肉烧焦了，\n还有一边却半生不熟。\n有些你的幸福的公民噎死了，\n因为吃得太丰富：\n而你的很多穷苦的孩子却饥饿着，\n走进了坟墓。\n——裴多菲！"
 dsk_hungary_events.1.d:0 "哈与马，共天下"
 dsk_hungary_events.2.a:0 "匈牙利自由派掌控了议会！"
 dsk_hungary_events.2.b:0 "我们联合保守派控制[concept_hungary_kindom]议会的企图失败了。现在[concept_hungary_kindom]自由派已经取得了议会多数。虽然我们现在已经承认了这个新政府，但显而易见的是，它将不再受我们控制。"
 dsk_hungary_events.2.c:0 "因为自由派在#yellow 塞切尼#!和#yellow 科苏特#!的派系斗争中陷入分裂，通常反对大多数改革的保守派认为他们可以在旧的封建议会中保持微弱的多数。然而，在选举前夕，#variable 费伦茨#!成功地将所有自由党人重新团结在#variable “十二点原则”#!的旗帜下。随后的议会选举中进步党取得了完全胜利。这也是最后一次基于旧封建议会制度的选举。\n迫于局势，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]同意#variable 包贾尼·拉约什#!创建第一个匈牙利责任政府。作为政府首脑，#yellow 包贾尼#!向国会推荐了他的政府。第一个[concept_hungary_kindom]责任政府宣布成立，#variable 包贾尼#!担任总理。《十二点原则》或现在称为《三月法律》后由立法机关通过，并于次月获得[Concept('concept_ruler','$RULER_TITLE_KAISER$')]批准。[concept_hungary_kindom]已经成为一个独立的国家，只有皇帝才能将其与联系在一起。新政府批准了一项全面的改革方案，称为#variable “四月法律”#!，创造了一个民主的政治制度。"
 dsk_hungary_events.2.d:0 "在此危急时刻，我们必须暂时妥协"
 dsk_hungary_events.3.a:0 "匈牙利局势缓解"
 dsk_hungary_events.3.b:0 "尽管以科苏特为首的激进自由派一直在努力争取议会中温和自由派的支持，但未能如愿。与我们合作的保守派抓住自由派分裂的时机在接下来的选举中成功赢得议会多数。街上的骚乱被平息 ，煽动者被抓住送审，更多人认为与哈布斯堡合作才是匈牙利问题的唯一出路，看样子我们暂时不用担心匈牙利可能出现的起义了。"
 dsk_hungary_events.3.c:0 "Eltűnt， mint Petőfi a ködben（他消失了，就像雾中的裴多菲一样)"
 dsk_hungary_events.3.d:0 "秩序重归匈牙利"
 dsk_hungary_events.4.a:0 "匈牙利骚乱"
 dsk_hungary_events.4.b:0 "在3月革命前时代（Vormärz），匈牙利“爱国”圈子浮现出了新一代活动家，这个年轻且激进的运动在索求民族国家方面变得越来越自信，他们要求匈牙利在君主国境内要享有一个特殊的宪法地位。他们的支持者也在街上游行，散发带有他们激进思想的小册子，给当局的治安带来了很大困扰。"
 dsk_hungary_events.4.c:0 "冬天阴森森的寒冷啊！你给河流戴上了铁锁链，冬天阴森森的寒冷啊！你冻结了我的两只泪眼。\n————裴多菲"
 dsk_hungary_events.4.d:0 "该死"
 dsk_hungary_events.5.a:0 "新一轮匈牙利骚乱"
 dsk_hungary_events.5.b:0 "匈牙利民族主义者在全匈牙利组织了一次大规模游行！"
 dsk_hungary_events.5.c:0 "姑娘，你应该对诗人倾心爱慕，别人不配将你占为己有，别人不配获得，因为那些人，不像诗人热爱自己的祖国。\n————裴多菲"
 dsk_hungary_events.5.d:0 "驱散他们！"
 dsk_hungary_events.6.a:0 "1839匈牙利议会"
 dsk_hungary_events.6.b:0 "在皇帝费迪南一世即位后不久，政府就对匈牙利自由党的声望感到震惊，试图通过逮捕和监禁来镇压改革运动，包括科苏特和米克洛斯·韦塞莱尼，然而议会并没有被吓倒。1839年的召开的匈牙利议会宣布议会在政治犯被释放之前将停止运作。在下议院，改革派的数量比以往任何时候都多，同时在路易斯·巴蒂亚尼伯爵和约瑟夫·埃奥特沃斯男爵的领导下，上议院也成立了一个自由党。在议会的逼迫下，政府被迫释放了大部分政治犯。"
 dsk_hungary_events.6.c:0 "如今的风暴必须以如今的制度来应对。\n————利奥波德·冯·兰克"
 dsk_hungary_events.6.d:0 "这只是暂时的妥协"
 dsk_hungary_events.7.a:0 "1844匈牙利议会"
 dsk_hungary_events.7.b:0 "1844年，匈牙利议会将马扎尔语定为匈牙利王国行政、立法和学校教育的官方语言，]结束了长达拉丁语844年的统治地位，并将农民的财产从封建义务中解放出来，使异族通婚合法化，并向非贵族开放部分官职。"
 dsk_hungary_events.7.c:0 "匈牙利民族解放进程的又一阶梯性进展。"
 dsk_hungary_events.7.d:0 "背叛传统和祖先的败类！"
 dsk_hungary_events.8.a:0 "三月青年"
 dsk_hungary_events.8.b:0 "随着宣布立宪的消息传到佩斯，以#yellow 桑多尔·裴多菲#!为首的一群匈牙利青年已经在佩斯煽动了一大群市民加入他们，并且获得了匈牙利议会的支持。"
 dsk_hungary_events.8.c:0 "革命始于佩斯的#variable 皮尔瓦克斯咖啡馆#!。它是40年代的议会外激进自由主义知识分子最喜欢的聚会点。那天一大早，#yellow 桑多尔·裴多菲#!匆匆赶到年轻人聚集的皮尔瓦克斯咖啡馆。他在那里找到了帕尔瓦斯瓦里和久拉·布廖夫斯基，邀请他们到约凯的公寓，在那里编辑了 12 点的公告。8点左右，裴多菲和他的同伴们去了皮尔瓦克斯咖啡馆。在这里，约凯宣读了#variable 十二点宣言#!。#yellow 裴多菲#!朗诵了他的新诗#variable 《国歌》#!。很快，《国歌》和《十二点原则》就已经传遍了全布达，引起了大规模民族主义骚动"
 dsk_hungary_events.8.d:0 "一场风暴即将降临"
#匈牙利革命事件链#######################################################################################################################################################################
 1848_hungary_revolution.1.t:0 "匈牙利拒绝我们的最后通牒！"
 1848_hungary_revolution.1.d:0 "既然他们不愿对话，那我们也只能以武力回应他们了。"
 1848_hungary_revolution.1.f:0 "起来，匈牙利人，祖国正在召唤！是时候了，现在干，还不算太晚！是愿意作自由人呢，还是作奴隶？你们自己选择吧，就是这个问题向匈牙利的上帝宣誓，我们宣誓，我们宣誓，我们不再继续作奴隶！\n————裴多菲"
 1848_hungary_revolution.1.a:0 "你们这群叛匪，给我老实呆着！看我派龙骑兵来，把你们一个个都送上天！"
 1848_hungary_revolution.2.t:0 "匈牙利革命的结束"
 1848_hungary_revolution.2.d:0 "马扎尔的理想主义者们无法与我们强悍的帝国军队匹敌。匈牙利独立战争于8月13日结束，革命军在阿拉德附近的维莱戈斯投降。革命失败后，当局颁布了残酷的报复措施。革命军官、官员和其他代表被带到军事法庭审判。法庭总共审理了4,628起案件，处决了13名将军和114名其他人士。数千人被判监禁，财产也被没收了。那些及时逃跑的人，如匈牙利革命领袖拉约什·科苏特，也被判处了缺席死刑。"
 1848_hungary_revolution.2.f:0 "Éljen a haza! Rajta, vadászok!”(我的祖国万岁!来吧，猎人们!)\n——匈牙利总理包贾尼·拉约什被行刑队处决前的遗言"
 1848_hungary_revolution.2.a:0 "哈布斯堡伟大复兴的又一胜利！"
 1848_hungary_revolution.3.t:0 "克罗地亚总督支持我们！"
 1848_hungary_revolution.3.d:0 "克罗地亚总督[SCOPE.sCharacter('Jelačić_scope').GetFullName]试图将克罗地亚从匈牙利解放出来，成为哈布斯堡王朝统治下的一个独立实体。最终，他前往维也纳宣誓成为奥地利皇帝的顾问。"
 1848_hungary_revolution.3.f:0 "被围困的哈布斯堡帝国从这些爱国的保守贵族中找到了一位拥护者：[SCOPE.sCharacter('Jelačić_scope').GetFullName]男爵。作为一个自豪的克罗地亚人，他得到了萨格勒布会议中反马扎尔自由派的人士的支持，但作为一位忠诚的君主主义者，他是保守派的首选领袖。他也被视为能够控制席卷该地区的农民起义的铁腕人物。换句话说，他是克罗地亚贵族最大的希望：既能帮他们从维也纳争取更大的自治权，也能维护他们对农民的统治权威。[SCOPE.sCharacter('Jelačić_scope').GetLastName]也是边境部队的指挥官。同时，哈布斯堡宫廷深知，要恢复在匈牙利的统治，离不开边境部队的忠诚和帮助。"
 1848_hungary_revolution.3.a:0 "帝国的股肱之臣！"
 1848_hungary_revolution.4.t:0 "帝国军队被赶出了匈牙利"
 1848_hungary_revolution.4.d:0 "我们不得不承认我们已经战败了，匈牙利现在已经是一个独立国家"
 1848_hungary_revolution.4.f:0 "Élyen a Magyar\n——马扎尔万岁！"
 1848_hungary_revolution.4.a:0 "该死"
 1848_hungary_revolution.5.t:0 "最后通牒"
 1848_hungary_revolution.5.d:0 "我们的使者已经向佩斯的伪政府提交了我们的最后通牒，若他们拒绝我们的要求，他们将被我们整装待发的军队#red 无情地碾碎#!"
 1848_hungary_revolution.5.f:0 "“到处都在流血！手足相残，各民族相互残杀，简直疯狂！有人用血迹在要烧毁的房子上做十字标记。佩斯迷失了！”\n——塞切尼"
 1848_hungary_revolution.5.a:0 "风暴将至"
 1848_hungary_revolution.6.t:0 "来自[SCOPE.sCountry('1848_aus_scope').GetName]的最后通牒"
 1848_hungary_revolution.6.d:0 "来自[SCOPE.sCountry('1848_aus_scope').GetName]已经向我们发送了最后通牒，虽然内容冗长，但我们已经在上面提取出了唯一一句有价值的话“#red 或自由，或死亡#!”"
 1848_hungary_revolution.6.f:0 "“让恶魔自己和他的信念斗争吧，要是他愿意的话。不论发生什么，我都不愿和窃贼携手，让一个一直以来都很和平的国家陷入战争。我说不出有多么厌恶宫廷的阴谋诡计，耶拉契奇这个人在我看来简直荒唐极了，以为随随便便就能成为拿破仑！……木已成舟。我的命运与匈牙利紧紧相连……上帝不能背弃一项正义的事业。”"
 1848_hungary_revolution.6.a:0 "或自由"
 aus_hun_war_begin:0 "战争已至"
 1848_hungary_revolution.6.b:0 "或死亡"
 aus_will_annex_hun:0 "我们将被吞并，游戏将结束"
 1848_hungary_revolution.7.t:0 "妥协谈判成功！"
 1848_hungary_revolution.7.d:0 "经过我们与[SCOPE.sCountry('1848_hun_scope').GetName]政府的多轮艰难谈判，如今[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]终于与佩斯达成一致，新的妥协协议将使[SCOPE.sCountry('1848_hun_scope').GetName]在承认[Concept('concept_ruler','$RULER_TITLE_KAISER$')]为匈牙利国王的前提下行驶高度的自治权和有限主权。\n对于这一妥协，有人指责我们软弱，还有人认为我们向佩斯政府让步太多，但无论如何，血腥的冲突已经被避免，我们将与[SCOPE.sCountry('1848_hun_scope').GetName]共同走向新的时代！"
 1848_hungary_revolution.7.f:0 "马扎尔政治领导人中的现实主义者知道，只有在哈布斯堡君主国这个框架内，才能保留住马扎尔人在匈牙利的特权地位，甚至是他们热爱的王国的存在也需要仰赖于君主国。鉴于国内少数族裔争取民族解放的斗争、巴尔干地区的事态发展和俄罗斯的扩张主义政策，一个马扎尔民族国家独立生存的可能性是很小的。"
 1848_hungary_revolution.7.a:0 "总算解决了"
 1848_hungary_revolution.8.t:0 "妥协谈判成功！"
 1848_hungary_revolution.8.d:0 "经过我们与[SCOPE.sCountry('1848_aus_scope').GetName]政府的多轮艰难谈判，如今维也纳终于与佩斯达成一致，新的妥协协议将使我们在承认[Concept('concept_ruler','$RULER_TITLE_KAISER$')]为匈牙利国王的前提下行驶高度的自治权和有限主权。\n对于这一妥协，有人指责我们软弱，还有人认为我们向维也纳政府让步太多，但无论如何，血腥的冲突已经被避免，我们将与[SCOPE.sCountry('1848_hun_scope').GetName]共同走向新的时代！"
 1848_hungary_revolution.8.f:0 "马扎尔政治领导人中的现实主义者知道，只有在哈布斯堡君主国这个框架内，才能保留住马扎尔人在匈牙利的特权地位，甚至是他们热爱的王国的存在也需要仰赖于君主国。鉴于国内少数族裔争取民族解放的斗争、巴尔干地区的事态发展和俄罗斯的扩张主义政策，一个马扎尔民族国家独立生存的可能性是很小的。"
 1848_hungary_revolution.8.a:0 "马扎尔万岁！"
 1848_hungary_revolution.9.t:0 "#yellow 拉约什·科苏特#!的演讲"
 1848_hungary_revolution.9.d:0 "[SCOPE.sCountry('1848_hun_scope').GetName]著名的自由党领袖#yellow 拉约什·科苏特#!在[SCOPE.sCountry('1848_hun_scope').GetName]下议院发表了一场著名的演讲。呼吁在全帝国进行广泛且彻底的改革。这篇演讲是如此成功，以至于它很快就传到了我们的首都[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]，毫无疑问，如果不对这篇文章加以禁止，势必会加强[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]的宪政派和激进派势力。"
 1848_hungary_revolution.9.f:0 "这篇演讲成了“革命的开幕词”。他宣称，哈布斯堡的绝对主义是““#variable 弥漫着瘟疫的空气……让我们神经迟钝、精神麻痹#!”。[SCOPE.sCountry('1848_hun_scope').GetName]应当是“独立的民族，不受外来干涉”，[SCOPE.sCountry('1848_hun_scope').GetName]同奥地利之间只有王朝世系上的联系，只是[Concept('concept_ruler','$RULER_TITLE_KAISER$')]继续兼任匈牙利国王。\n科苏特更进一步宣称，只给匈牙利带来益处的政治大修是不安全的，帝国其他部分还未改革，帝国各部分都需要根本改变。他大喝道：“#variable 王朝必须在自己的利益和维护腐朽制度之间做出抉择！#!”狮吼般的演讲将会产生巨大的影响，演讲内容的德译手稿传到了[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]，并送到了法律–政治读书会。很快，演讲稿被秘密印刷，随即传遍了整个帝国。"
 1848_hungary_revolution.9.a:0 "区区演讲罢了，还能怕它不成?"
 1848_hungary_revolution.9.b:0 "太危险了，立即查禁它们！"
 1848_hungary_revolution.10.t:0 "耶拉季奇问题"
 1848_hungary_revolution.10.d:0 "来自[SCOPE.sCountry('1848_hun_scope').GetName]的使者已经来到了我们的宫廷，要求我们解雇克罗地亚的总督[SCOPE.sCharacter('Jelačić_scope').GetLastName]，并将克罗地亚交还[SCOPE.sCountry('1848_hun_scope').GetName]。"
 1848_hungary_revolution.10.f:0 "[SCOPE.sCharacter('Jelačić_scope').GetLastName]于数月前被正式任命为达尔马提亚、克罗地亚和斯拉沃尼亚的军区总督。他措辞强硬，坚定地反对[SCOPE.sCountry('1848_hun_scope').GetName]，他下令：克罗地亚议会会议开始之前，所有地区都不能接受除自己以外的任何人的命令，他代表着[Concept('concept_ruler','$RULER_TITLE_KAISER$')]。两周后，他成为军事边境指挥官。在就任数月后，他谎称遭土耳其威胁，让一些军事组织处于战备状态，同时拒绝承认[SCOPE.sCountry('1848_hun_scope').GetName]政府的合法性。他还要求维也纳陆军部将奥地利的军火储备转移到克罗地亚。[SCOPE.sCountry('1848_hun_scope').GetName]人抗议#yellow 耶拉契奇#!富有侵略性的反抗。"
 1848_hungary_revolution.10.a:0 "假意解雇耶拉季奇，但不采取任何强制措施"
 1848_hungary_revolution.10.b:0 "以强硬手段让耶拉季奇滚蛋，并向匈牙利移交克罗地亚"
 Tensions_in_Hungary_add_20_tt:0 "紧张度增加20"
 Tensions_in_Hungary_subtract_20_tt:0 "紧张度减少20"
 1848_hungary_revolution.11.t:0 "[SCOPE.sCountry('1848_aus_scope').GetName]拒绝交出耶拉季奇"
 1848_hungary_revolution.11.d:0 "[SCOPE.sCountry('1848_aus_scope').GetName]虽然答应我们解雇了耶拉季奇，但仍然在暗中支持他，克罗地亚议会也拒绝服从我们派过去的总督"
 1848_hungary_revolution.11.f:0 "无论如何，耶拉契奇被免职并没有遏制南斯拉夫人民的反抗。耶拉契奇下决心证明自己对哈布斯堡王朝的忠诚，并已经开始在德拉瓦集中兵力。在马扎尔人的压力下，克罗地亚议会也同心协力支持总督。"
 1848_hungary_revolution.11.a:0 "该死！"
 1848_hungary_revolution.12.t:0 "[SCOPE.sCountry('1848_aus_scope').GetName]选择交出耶拉季奇"
 1848_hungary_revolution.12.d:0 "[SCOPE.sCountry('1848_aus_scope').GetName]最终选择了屈服，罢免了耶拉季奇并将他流放，克罗地亚也被移交到了我方。"
 1848_hungary_revolution.12.f:0 "匈牙利人抗议耶拉契奇富有侵略性的反抗。而整个奥地利政府意识到自己仍然疲软，试图与马扎尔人保持良好关系，因此感到耶拉契奇有些急功近利。5月7日，帝国向马扎尔政府屈服，把所有驻扎在匈牙利和军事边境的部队交由布达佩斯新成立的军事部门指挥。匈牙利政府得以任命亚诺什·赫拉博夫斯基男爵指挥王国军队重建南部边境的秩序。"
 1848_hungary_revolution.12.a:0 "算他们识大体"
 1848_hungary_revolution.13.t:0 "奥地利在边境部署部队"
 1848_hungary_revolution.13.d:0 "根据我们在边境的哨兵报告，在我们与[SCOPE.sCountry('1848_aus_scope').GetName]接壤的边境出现了大规模的军事活动的痕迹。看样子[SCOPE.sCountry('1848_aus_scope').GetName]已经开始在边境部署部队来威慑我们。"
 1848_hungary_revolution.13.f:0 "“你希望匈牙利成为一个自由而独立的匈牙利，但我向自己保证过要支持奥地利帝国的政治统一。如果你不同意的话，只有兵戎相见才能解决问题。”\n——耶拉季奇"
 1848_hungary_revolution.13.a:0 "我们将以牙还牙，也在边境部署部队震慑他们"
 1848_hungary_revolution.13.b:0 "这个时候就别激化矛盾了吧"
 1848_hungary_revolution.14.t:0 "来自[SCOPE.sCountry('1848_aus_scope').GetName]的求援信"
 1848_hungary_revolution.14.d:0 "来自[SCOPE.sCountry('1848_aus_scope').GetName]的大使已经来到了我们位于[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]的皇宫，正式请求我们的[Concept('concept_ruler','$RULER_TITLE_TSAR$')]出兵帮助他们平定[SCOPE.sCountry('1848_hun_scope').GetName]的叛乱。考虑到[SCOPE.sCountry('1848_hun_scope').GetName]的叛乱将威胁我们的波兰边境，出兵是很有必要性的。现在选择权在[Concept('concept_ruler','$RULER_TITLE_TSAR$')]手里，我们是否要帮助[SCOPE.sCountry('1848_aus_scope').GetName]夺回佩斯？"
 1848_hungary_revolution.14.f:0 "当施瓦岑贝格抑制住自己[SCOPE.sCountry('1848_aus_scope').GetName]人的高傲，授意[SCOPE.sCountry('1848_aus_scope').GetName]驻[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]大使正式向俄国提出援助请求时，尼古拉一世欣然同意。虽然他私下向帕斯科维奇表示他无意卷入匈牙利的事务，但他在贝姆和匈牙利的其他“流氓”中，“看到的不仅是奥地利的敌人，还是整个世界秩序和安宁的敌人。恶棍、流氓、破坏者的化身，为了我们自身的安宁，我们必须毁灭他们”。"
 1848_hungary_revolution.14.a:0 "以反对无政府主义的神圣斗争的名义,我们将进行军事干预"
 1848_hungary_revolution.14.b:0 "我们将严守中立！"
 1848_hungary_revolution.15.t:0 "[SCOPE.sCountry('1848_aus_scope').GetName]派来的军事特使被暴民袭击！"
 1848_hungary_revolution.15.d:0 "[SCOPE.sCountry('1848_aus_scope').GetName]派遣了军事特使兰贝格·费伦茨来担任我们的军事指挥官。这举动本意是缓和与我们的关系，然而，我们的人并不认可这一点，而是将他当作[SCOPE.sCountry('1848_aus_scope').GetName]按下来的枷锁。当他到达[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]时，一伙暴徒围住了他，现在兰贝格的性命危在旦夕，我们是纵容暴徒对其处私刑，还是以大局为重，避免[SCOPE.sCountry('1848_aus_scope').GetName]的怒火？"
 1848_hungary_revolution.15.f:0 "匈牙利人不认为任命兰贝格是[SCOPE.sCountry('1848_aus_scope').GetName]政府抛出的橄榄枝。特别是[SCOPE.sCountry('1848_aus_scope').GetName]政府也任命了保守派改革家沃伊·米克洛什男爵为首相。根据4月颁布的法令，因为匈牙利政府没有批准，这些任命都是违法的。很快，匈牙利议会做出反击，宣誓了他们维护宪法的决心。第二天，兰贝格来到[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]，他的马车经过一架浮桥时，让一群手工业者、学生和士兵看见了，他们把他拖出马车，又捶又捅，直至把他打死。"
 1848_hungary_revolution.15.a:0 "纵容暴徒"
 1848_hungary_revolution.15.b:0 "派出国民卫队保护他"
 Lamberg_died_tt:0 "兰贝格的死将彻底激怒维也纳政府"
 1848_hungary_revolution.16.t:0 "兰贝格之死"
 1848_hungary_revolution.16.d:0 "我们派往[SCOPE.sCountry('1848_hun_scope').GetName]的兰贝格将军已经被[SCOPE.sCountry('1848_hun_scope').GetName]的暴民打死了！虽然[SCOPE.sCountry('1848_hun_scope').GetName]在事后便大力谴责这一行径，并决心让参与者接受法律制裁。但从我们得到的消息来看，[SCOPE.sCountry('1848_hun_scope').GetName]的国民卫队的拖沓行动才是兰贝格死亡的真正原因。无论如何，与[SCOPE.sCountry('1848_hun_scope').GetName]的任何和解尝试都将因为兰贝格的死而宣告失败。"
 1848_hungary_revolution.16.f:0 "匈牙利人不认为任命兰贝格是奥地利政府抛出的橄榄枝。特别是奥地利政府也任命了保守派改革家沃伊·米克洛什男爵为首相。根据4月颁布的法令，因为匈牙利政府没有批准，这些任命都是违法的。很快，匈牙利议会做出反击，宣誓了他们维护宪法的决心。第二天，兰贝格来到[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]，他的马车经过一架浮桥时，让一群手工业者、学生和士兵看见了，他们把他拖出马车，又捶又捅，直至把他打死。这次可怕的谋杀传开了，温和派不再期待和解，这也正中政府中反革命者的下怀，他们决心和耶拉契奇联手，用武力摧毁匈牙利革命。"
 1848_hungary_revolution.16.a:0 "这不是意外，这是一起谋杀！我们将让匈牙利人付出代价！"
 Lamberg_died_tt2:0 "紧张度增加200"
 1848_hungary_revolution.17.t:0 "[SCOPE.sCulture('slovak_culture').GetName]革命"
 1848_hungary_revolution.17.d:0 "[SCOPE.sCulture('slovak_culture').GetName]人已经开始反抗我们的统治！在数次情愿无果后，[SCOPE.sCulture('slovak_culture').GetName]国民议会已经宣布斯洛伐克脱离了匈牙利的统治，并向维也纳政府宣誓效忠。"
 1848_hungary_revolution.17.f:0 "生活在[concept_hungary_kindom]王国境内的[SCOPE.sCulture('slovak_culture').GetName]人首先提出要求，他们起草了一份包含十四项要求的清单，呼吁[SCOPE.sCulture('slovak_culture').GetName]人乃至[concept_hungary_kindom]王国的其他民族的平等地位，然而，由大马扎尔主义主导下的[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]政府不仅没有理会他们的要求，反而对起草人进行了大肆逮捕。\n作为回应，什图尔、乌尔班、霍扎等[SCOPE.sCulture('slovak_culture').GetName]民族主义者在维也纳成立了#variable 斯洛伐克国民委员会#!，宣布[SCOPE.sCulture('slovak_culture').GetName]脱离[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]政府的控制，大量[SCOPE.sCulture('slovak_culture').GetName]志愿者加入了哈布斯堡反对匈牙利的运动，并组建了斯洛伐克军团。"
 1848_hungary_revolution.17.a:0 "这是在分裂国家！"
 slovak_uprising_tt:0 "斯洛伐克将寻求维也纳政府的承认"
 1848_hungary_revolution.18.t:0 "来自[SCOPE.sCountry('1848_slv_scope').GetName]的使者"
 1848_hungary_revolution.18.d:0 "来自[SCOPE.sCountry('1848_slv_scope').GetName]国民议会的使者已经到达了我们的宫廷，从他们带来的消息得出，[SCOPE.sCountry('1848_slv_scope').GetName]已经宣布脱离[SCOPE.sCountry('1848_hun_scope').GetName]政府，并向我们寻求承认。"
 1848_hungary_revolution.18.f:0 "生活在[concept_hungary_kindom]王国境内的[SCOPE.sCulture('slovak_culture').GetName]人首先提出要求，他们起草了一份包含十四项要求的清单，呼吁[SCOPE.sCulture('slovak_culture').GetName]人乃至[concept_hungary_kindom]王国的其他民族的平等地位，然而，由大马扎尔主义主导下的[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]政府不仅没有理会他们的要求，反而对起草人进行了大肆逮捕。\n作为回应，#yellow 什图尔、乌尔班、霍扎#!等[SCOPE.sCulture('slovak_culture').GetName]民族主义者在维也纳成立了#variable 斯洛伐克国民委员会#!，宣布[SCOPE.sCulture('slovak_culture').GetName]脱离[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]政府的控制，大量[SCOPE.sCulture('slovak_culture').GetName]志愿者加入了哈布斯堡反对匈牙利的运动，并组建了斯洛伐克军团。"
 1848_hungary_revolution.18.a:0 "我们将承认[SCOPE.sCountry('1848_slv_scope').GetName]政府"
 slovak_uprising_tt1:0 "紧张度增加30\倘若与匈牙利的战争爆发n斯洛伐克将成为我们的自治领"
 1848_hungary_revolution.18.b:0 "还是别招惹匈牙利人了"
 slovak_uprising_tt2:0 "我们将让斯洛伐克人自生自灭"
 1848_hungary_revolution.19.t:0 "特兰西瓦尼亚的国民大会宣布效忠哈布斯堡"
 1848_hungary_revolution.19.d:0 "我们在特兰西瓦尼亚的议会已经被当地的帝国军指挥官政变推翻！如今新成立的由[SCOPE.sCulture('romanian_culture').GetName]人为首的特兰西瓦尼亚国民大会已经宣布脱离我们的统治，并直接效忠于维也纳。"
 1848_hungary_revolution.19.f:0 "月初，由马扎尔和萨克森精英主导的特兰西瓦尼亚议会批准了特兰西瓦尼亚与匈牙利的合并，该决定立即引发了广大[SCOPE.sCulture('romanian_culture').GetName]人的不满。特兰西瓦尼亚的帝国军指挥官#yellow 安东·冯·普赫纳#!很快就察觉到了这点，他允许[SCOPE.sCulture('romanian_culture').GetName]人在布拉日召开了#variable 特兰西瓦尼亚民族大会#!，并发动政变推翻了[concept_magyar]主导的特兰西瓦尼亚议会，并以[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的名义接管政权。\n他宣布[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]的议会是非法的，并呼吁所有忠诚爱国的[SCOPE.sCulture('romanian_culture').GetName]人“战斗到底，人人为我，我为人人”。[SCOPE.sCulture('romanian_culture').GetName]#v $peasants$#!则热情地响应了普赫纳的号召，#v $peasants$#!起义席卷特兰西瓦尼亚。[concept_magyar]的#v $aristocrats$#!和政府官员遭到一群群#v $peasants$#!的追捕和屠杀。作为报复，塞凯什人和“国土捍卫者”军队追捕并大规模屠杀#v $peasants$#!。\n这场血腥的冲突给双方带来了不可磨灭的伤痕，几百个村庄被夷为平地，，4万人被杀，230个村庄化为炬灰。"
 1848_hungary_revolution.19.a:0 "让这群刁民尝尝穿刺的滋味！"
 romania_uprising_tt:0 "特兰西瓦尼亚将寻求维也纳政府的承认"
 1848_hungary_revolution.20.t:0 "来自[SCOPE.sCountry('1848_trs_scope').GetName]的使者"
 1848_hungary_revolution.20.d:0 "来自[SCOPE.sCountry('1848_trs_scope').GetName]国民大会的使者已经到达了我们的宫廷，从他们带来的消息得出，[SCOPE.sCountry('1848_slv_scope').GetName]已经宣布脱离[SCOPE.sCountry('1848_hun_scope').GetName]政府，并向我们寻求承认。"
 1848_hungary_revolution.20.f:0 "月初，由马扎尔和萨克森精英主导的特兰西瓦尼亚议会批准了特兰西瓦尼亚与匈牙利的合并，该决定立即引发了广大[SCOPE.sCulture('romanian_culture').GetName]人的不满。特兰西瓦尼亚的帝国军指挥官#yellow 安东·冯·普赫纳#!很快就察觉到了这点，他允许[SCOPE.sCulture('romanian_culture').GetName]人在布拉日召开了#variable 特兰西瓦尼亚民族大会#!，并发动政变推翻了[concept_magyar]主导的特兰西瓦尼亚议会，并以[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的名义接管政权。\n他宣布[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]的议会是非法的，并呼吁所有忠诚爱国的[SCOPE.sCulture('romanian_culture').GetName]人“战斗到底，人人为我，我为人人”。[SCOPE.sCulture('romanian_culture').GetName]#v $peasants$#!则热情地响应了普赫纳的号召，#v $peasants$#!起义席卷特兰西瓦尼亚。[concept_magyar]的#v $aristocrats$#!和政府官员遭到一群群#v $peasants$#!的追捕和屠杀。作为报复，塞凯什人和“国土捍卫者”军队追捕并大规模屠杀#v $peasants$#!。\n这场血腥的冲突给双方带来了不可磨灭的伤痕，几百个村庄被夷为平地，，4万人被杀，230个村庄化为炬灰。"
 1848_hungary_revolution.20.a:0 "我们将承认[SCOPE.sCountry('1848_trs_scope').GetName]政府"
 romania_uprising_tt1:0 "紧张度增加30\n倘若与匈牙利的战争爆发，特兰西瓦尼亚将成为我们的自治领"
 1848_hungary_revolution.20.b:0 "还是别招惹匈牙利人了"

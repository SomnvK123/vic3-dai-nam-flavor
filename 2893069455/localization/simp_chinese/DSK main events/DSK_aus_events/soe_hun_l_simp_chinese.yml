 1848_hungary_revolution.21.t:0 "议会紧急议程：民族问题"
 1848_hungary_revolution.21.d:0 "虽然我们一直都在坚持[concept_magyar]在王国境内的优越地位。但如今随着我们开始争取更高程度上的自治权并与维也纳中央展开对峙，我们境内的少数民族已经开始蠢蠢欲动，争取在王国境内的平等地位，并威胁到如果我们不答应他们的要求，他们就会投靠维也纳一方。\n我们可以选择给予部分甚至全部民族王国境内的平等公民权，但这势必会激怒广大的大马扎尔主义者;或者我们也可以维持现状，避免统治层的分裂。"
 1848_hungary_revolution.21.f:0 "中欧和东欧的情况与西欧不尽相同，这里的民族主义基于一种更排他的“种族”或“文化”认同感，这种认同感广泛植根于共同的语言、宗教，乃至历史宣称的“血缘”或者“人种”的紧密联系。这几乎不可避免地会否认一些人的公民权利，这些人生活在特定的国家，但是并没有被视为同一种族的一部分。\n此外，正如匈牙利民族主义与罗马尼亚人和斯拉夫人的关系，在政治上和社会上占主导地位的民族实际上要求少数民族接受主导民族语言和文化的特权地位。"
 1848_hungary_revolution.21.a:0 "马扎尔人的历史传统不容侵犯！"
 1848_hungary_revolution.21.b:0 "我们将给予斯拉夫人公民权"
 hun_slav_tt:0 "斯拉夫人的起义将不再发生"
 1848_hungary_revolution.21.c:0 "我们将给予罗马尼亚人公民权"
 hun_rom_tt:0 "罗马尼亚人的起义将不再发生"
 1848_hungary_revolution.21.d:0 "我们将给予王国每一个民族平等的公民权！"
 hun_all_tt:0 "王国境内的少数民族起义将不再发生\n这将引起国内大马扎尔主义者极大不满"
 hungarian_revolution_fail:0 "我们镇压匈牙利叛乱份子的努力失败了。"

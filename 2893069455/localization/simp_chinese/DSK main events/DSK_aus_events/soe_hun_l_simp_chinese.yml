 1848_hungary_revolution.22.t:0 "战后重建"
 1848_hungary_revolution.22.d:0 "战争已经结束，帝国政府指派了#yellow 冯·海瑙#!将军前往匈牙利，以期恢复那里的秩序"
 1848_hungary_revolution.22.f:0 "这一代人只是修了座桥，给将来的陌生人使用。你也许会在某天见到他……我恳求你不要停留在此岸……宁愿与革命一起灭亡也不要领取反动政府的救济。"
 1848_hungary_revolution.22.a:0 "终于"

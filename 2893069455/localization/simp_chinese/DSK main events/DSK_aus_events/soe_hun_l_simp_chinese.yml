 1848_hungary_revolution.23.t:0 "重建成功"
 1848_hungary_revolution.23.d:0 "马扎尔精英的所有代表团结在一起，反抗着中央集权的帝国政策。虽然他们中的强硬派选择没有回旋余地的坚决反对，但费伦茨·迪亚克（Ferenc Deák）领导的温和派则寻求与维也纳政府谈判。这带来了关系正常化，并最终达成了妥协。马扎尔政治领导人中的现实主义者知道，只有在哈布斯堡君主国这个框架内，才能保留住马扎尔人在匈牙利的特权地位，甚至是他们热爱的王国的存在也需要仰赖于君主国。鉴于国内少数族裔争取民族解放的斗争、巴尔干地区的事态发展和俄罗斯的扩张主义政策，一个马扎尔民族国家独立生存的可能性是很小的。"
 1848_hungary_revolution.23.f:0 "Élyen a Magyar\n——马扎尔万岁！"
 1848_hungary_revolution.23.a:0 "他们回归了帝国体系，暂时的"
 1848_hungary_revolution.24.t:0 "重建失败"
 1848_hungary_revolution.24.d:0 "马扎尔精英的所有代表团结在一起，反抗着中央集权的帝国政策。基于1861年的2月御令，当超民族的帝国议会（Reichsrat）正式召开时，它遭到了马扎尔人的抵制。他们没有去帝国议会，与之相反，新成立的匈牙利议会成了抗议呼声的平台。为了避免匈牙利人的再次分离，我们不得不采取些紧急措施挽救我们与马扎尔人的关系了。我们给与了匈牙利更大的自治权，由费伦茨·迪亚克（Ferenc Deák）领导的温和派政府现在将开始帮助我们稳定匈牙利的局势。"
 1848_hungary_revolution.24.f:0 "Élyen a Magyar\n——马扎尔万岁！"
 1848_hungary_revolution.24.a:0 "妥协只是暂时的！"

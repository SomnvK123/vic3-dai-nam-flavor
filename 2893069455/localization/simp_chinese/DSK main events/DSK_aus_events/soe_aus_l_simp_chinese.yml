 german_unification.6.t:0 "[SCOPE.sCountry('german_unification_candidate').GetName]要求我们成为他们的保护国"
 german_unification.6.d:0 "由于[SCOPE.sCountry('german_unification_candidate').GetName]现在被视为德意志统一的唯一现实选择，他们要求将我们纳入到他们的保护之下，我们是否要答应他们的请求？"
 german_unification.6.f:0 "“加入与[SCOPE.sCountry('german_unification_candidate').GetName]的邦联，我们或许会失去[ROOT.GetCountry.GetAdjectiveNoFormatting]的主权，但是却确保了德意志的主权。时代的精神不可否认；德意志民族渴望统一，而[SCOPE.sCountry('german_unification_candidate').GetAdjectiveNoFormatting]似乎能让这个目标实现。反对德意志民族的联合实在是愚不可及。”"
 german_unification.6.a:0 "为了德意志！"
 german_unification.6.b:0 "我们的主权不可侵犯。"
 german_unification.1.c:0 "我们将借此机会带领邦联走向集权"
 german_unification.1.d:0 "不能放弃我们的王室领地，我们还是维持邦联分权吧"
 keep_German_Confederation_desc:0 "我们选择维持[concept_germany_country]分权"
 keep_German_Confederation_tt:0 "统一德意志选项将不可用\n我们将吞并南德以推动王室领地的联邦化"
 je_habsburg_hun:0 "匈牙利的命运"
 je_habsburg_hun_reason:0 "随着我们成立了[SCOPE.GetRootScope.GetCountry.GetNameNoFlag]国家，我们不得不开始考虑我们持有的东欧领地问题。\n\n#bold [concept_magyar]#!一直渴望着更高的自治权，而随着德意志民族国家的建立，给予#bold [concept_magyar]#!更高的自治权已经是板上钉钉的事情。\n现在有两个方案摆在我们面前，是应该选择给[concept_magyar]一个完整的匈牙利王国，还是分割出克罗地亚王国以削弱他们的实力？"

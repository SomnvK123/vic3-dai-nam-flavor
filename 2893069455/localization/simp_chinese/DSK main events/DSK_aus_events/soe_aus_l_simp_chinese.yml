 je_aus_absolutism_main:0 "新绝对主义改革"
 je_aus_absolutism_main_reason:0 "哈布斯堡的权威恢复之后，[SCOPE.sCharacter('new_aus_absolutism_scope').GetFirstName]将开始按[SCOPE.sCharacter('new_aus_absolutism_army_scope').GetLastName]的建议治理国家。\n\n他对那些传统权威中心不予理睬，废除了各省的贵族等级会议，完全依靠其#variable 官僚机构、警察和军队#!的权威去推行自己的[Concept('concept_ruler','$RULER_TITLE_KAISER$')]意志。\n这是向极端绝对主义的演变，将不带有任何巴洛克时代的优雅，但这也是一种带有现代化之紧迫使命的现代形式的绝对主义：#variable 新绝对主义（neo—absolutism）#!。这个王朝现在不再依靠传统权威，而是依赖于#variable 对臣民的强制#!来实现哈布斯堡权威的最大化。\n\n新绝对主义的另一个步骤是要建设约瑟夫二世的#variable 理性主义国家#!，但是不带有任何开明的理想主义。哈布斯堡权威的恢复，依靠的应是#variable 秩序、效率、繁荣#!，因而某种程度还有民众对参与政治事务的一点渴望。经济以及财政权力应取代传统和先例成为权威的基础；\n\n通过我们的改革建立起来的现代化行政体制和军队将让这个君主国在面对欧洲其他现代化大国时能够捍卫自己的权利。"
 je_aus_absolutism_success_reason_tt:0 "我们完成了所有新绝对主义改革条目中的4个"
 aus_absolutism_main_tt.1:0 "我们必须彻底改革帝国！" 
 je_aus_absolutism_economy:0 "新绝对主义改革：经济发展"
 je_aus_absolutism_economy_reason:0 "为了在经济领域展现出活力。我们任命了[SCOPE.sCharacter('new_aus_absolutism_industrialists_scope').GetLastName]作为新政权中经济和财政政策的主要决策者，在他的推动下，政府将在工商业上采取自由放任政策，并扫除既得利益者的特权。铁路建设的管制将被撤销，而#variable “产业令”(Gewerbeordnung）#!实际上废除了行会。由#variable 罗斯柴尔德家族#!及其联合者组建、由国家支持的#variable 信贷局（Credit—Anstalt）#!为信贷提供了方便。我们的经济自由化和谨慎的税收政策将给我们带来的经济迅猛增长，铁路运输等部门也将获得关键性的战略收益。\n\n旧有的#variable 关税制度#!对于帝国的现代化进程已经构成了阻碍，我们也需要改革我们的关税制度以促进我们的贸易，让我们奥地利的产品销往世界！"
 finished_absolutism_economy_tt:0 "我们的gdp提升了两倍"
 je_aus_absolutism_monarchy:0 "新绝对主义改革：维持绝对主义政体" 
 je_aus_absolutism_monarchy_reason:0 "绝对主义是帝国现代化的基石。在绝对主义制度下，我们的[Concept('concept_ruler','$RULER_TITLE_KAISER$')]将依赖四支军队来维持统治：#bold 走路的军队（军事力量），坐着的军队（官僚），跪着的军队（教士）和爬着的军队（暗探）#!，而非建立在分解和分裂原则基础之上的所谓民主和代议机构。只有绝对主义能将人们聚集起来，让他们统一成为团结的、有影响能力的人群。它可以使人达到共同使用自己力量的状态，引导他们在文化和文明上达到最高程度。为此，#bold 在改革期间#!我们必须维持我们的#variable 君主专制#!不变。" 
 finished_absolutism_monarchy_tt:0 "我们必须维持君主制和独裁制十年不变" 
 je_aus_absolutism_bureaucracy:0 "新绝对主义改革：重组和扩张官僚机构" 
 je_aus_absolutism_bureaucracy_reason:0 "每一次国家改革都不可避免地要与相应的官僚机构现代化同步进行。因此，在“奥地利重组”计划中，官僚机构革新和公务员体系重组将处于中心位置。\n官僚改革的目标是建立一个#bold 涵盖整个国家和所有机构的强力行政体系#!。\n\n现代专制体系（而非繁琐的合议制）被设立起来，这就是所谓的#variable 大臣制（部长制）#!，让部门主官只需要负责决策。#bold 宫廷政务府（Hofstellen）#!被改组成了现代化的#bold 部门（Ministerien）#!，原则上确立了司法体系独立于行政体系，由庄园私雇官员作为行政执行者、早在19世纪初便已过时但遍布奥地利帝国的私立行政体系——古老的世袭庄园行政体系，现在也被取消了。官僚改革的道路还有很长，但我们必须将其完成。"
 je_aus_absolutism_centralization:0 "新绝对主义改革：建立省制（Statthaltereien）" 
 je_aus_absolutism_centralization_reason:0 "地方行政机构的改革是官僚系统改革的核心，在[SCOPE.sCharacter('new_aus_absolutism_landowners_scope').GetFirstName]的计划里，县的重要职能被剥夺了，没用多久便被彻底撤销了。在县被行政区取代之前，官方在各个县新设了#bold 行政区政府#!和#bold 行政区法院#!，这个措施“自上而下地”极大增强了帝国各王国和皇室领地的行政机构。这是决定性的改革措施，因为这意味着甚至在基层也确立了司法独立，但成果很快就因新设#bold 联合行政区事务署#!被废除了，不过这个新的联合事务署也只持续了很短一段时间。\n\n#bold 社区法律#!规范了#bold 社区当局#!的自治。由军政总督（Gouverneur）领导的军政总督区（Gubernia）被转变成了由#variable 省长（Statthalter）#!领导的#variable 省（Statthaltereien）#!，省长是行政主官和[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的代表。新的行政和司法机构组织严密，从上到下为中央政府、维也纳的各部、省机构、县机构、行政区机构到社区机构。\n之后，官僚机构的注意力将集中在省政府和行政区政府上，新的地方政府的重要性在于比起维也纳的政府，它们将更接近人民。"
 finished_aus_centralization_tt:0 "我们已经在全国范围内建立了省制" 
 je_aus_absolutism_military:0 "新绝对主义改革：改革帝国陆军" 
 je_aus_absolutism_military_reason:0 "长期以来，帝国的军队质量和管理系统都处于一个极为糟糕的状态，整体军队教育水平低下，难以训练，纪律松弛，兵源语种众多，导致管理和军队协调等等其他方面极为困难。军事方面的改革将在我们[SCOPE.sCharacter('new_aus_absolutism_scope').GetFirstName][Concept('concept_ruler','$RULER_TITLE_KAISER$')]的亲自领导下进行，兵役制度上，1852年，整个帝国开始实行两年的#bold 义务兵役#!，并用预备役人员来补充现役部队。在军队编制方面，1852年的改革使连队兵力普遍固定为平时129人，战时221人；这将使平时团兵力达到2,830人，战时兵力达到6,886人。同时在步兵和骑兵在组成方面也进行了重大改革。只有一支强大的军队才能维护我们在德意志和意大利的利益，我们必需重视！" 
 finished_aus_absolutism_tt:0 "新绝对主义改革已经结束"
 je_aus_absolutism_advance:0 "我们完成了一个改革日记条目"
 je_aus_absolutism_fail_reason_tt:0 "丢失意大利和德意志的霸权将导致改革的失败，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]将开始重组政府，向自由派妥协" 
#宪政改革#####################################################################################################################################################################
 je_aus_liberal_reform_main:0 "帝国宪政改革"
 je_aus_liberal_reform_main_reason:0 "[SCOPE.sCharacter('new_aus_liberal_reform_scope').GetFirstName]很不情愿地接受了立宪主义的咒语。由于立宪派所迫，他没有别的选择。#variable 1849帝国宪法（Reichsverfassung—von—1849）#!在帝国内建立了一个两院制的#variable [concept_aus_reichsrat]#!，。这标志着帝国#variable 宪政改革#!的开始。宪法由新成立的[concept_aus_liberal]的成员制定，而政党的主要成员皆为德意志人。因此宪法也因其#variable 强烈的中央集权和大德意志色彩#!而受诟病。\n#red 宪政改革道阻且长，少数民族的反对，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]持续的保守主义抵制立场，保守派的反扑和对外战争的失败都有可能成为宪政改革失败的诱因。#!"
 aus_liberal_reform_main_tt.1:0 "我们必须在宪政原则下彻底改造帝国"
 je_aus_liberal_reform_economy_and_trade:0 "帝国宪政改革：经济与关税"
 je_aus_liberal_reform_economy_and_trade_reason:0 "为了在经济领域展现出活力。政府将在工商业上采取自由放任政策，并扫除既得利益者的特权。铁路建设的管制将被撤销，而#variable “产业令”(Gewerbeordnung）#!实际上废除了行会。由#variable 罗斯柴尔德家族#!及其联合者组建、由国家支持的#variable 信贷局（Credit—Anstalt）#!为信贷提供了方便。我们的经济自由化和谨慎的税收政策将给我们带来的经济迅猛增长，铁路运输等部门也将获得关键性的战略收益。\n\n旧有的#variable 关税制度#!对于帝国的现代化进程也已经构成了阻碍，我们也需要改革我们的关税制度以促进我们的贸易，让我们奥地利的产品销往世界！"
 je_aus_liberal_reform_democracy:0 "帝国宪政改革：扩大选举权"
 je_aus_liberal_reform_democracy_reason:0 "长期以来，奥地利已经搁浅在进步的对立面上。[Concept('concept_ruler','$RULER_TITLE_KAISER$')]持续的保守主义已经损害了到了自身，不只是损害了哈布斯堡领导德意志的努力，更是让帝国内各民族的自由派的反感至极。\n立宪一直是自由派长期以来的目标，旨在实现所有民族权利平等，所有公民在法律面前一律平等，而要想实现这个目的，必然要先让帝国内每一个民族的成员都有机会参与到帝国的政治当中。"
 je_aus_liberal_reform_municipal_council:0 "帝国宪政改革：赋权地方议会"
 je_aus_liberal_reform_municipal_council_reason:0 "在约瑟夫二世的统治下，帝国成功建立起了一套现代化的官僚机构。然而，在[concept_habsburg_order]下的漫长时代中，严重缺陷已经悄然出现。自1830年代以来，公务员体系陷入#variable 瘫痪#!：很明显，本是为了对抗贵族互保而实施的资历排序原则并没有促进公务员体系的择优选拔，也没能阻止雇佣程序的风气变得高度武断且官官相护。\n随着宪政改革后的政治大洗牌，我们终于有机会重新改革我们的地方行政体系。在革命后的一系列改革中，各省的贵族等级会议被废除，取而代之的是允许召开帝国各地的#variable 地方议会#!，但这些议会只有地区议会的地位，但每个议会都会是由群众选举出的议员参与其中，因此具有合法性，且可以减少我们的行政开支。"
 je_aus_liberal_reform_guaranteed_liberties:0 "帝国宪政改革：保障自由"
 je_aus_liberal_reform_guaranteed_liberties_reason:0 "“#variable 东方从古到今只知道一个人是自由（einer—frei）的；希腊和罗马世界知道少数人是自由（einige—frei）的；日耳曼世界知道所有人是自由（alle—frei）的#!。”\n古老的文献提醒着我们，日耳曼人有着悠久的#variable 自由传统#!，自由根植于日耳曼人血脉之中，由于日耳曼世界享受自由的个体最为普遍，因此只有日耳曼类型才能有别于其他类型，在整个世界历史区域中脱颖而出。\n然而，近代来自法兰西的绝对主义思潮和来自东方的专制主义思潮已经侵蚀了我们的传统价值观，导致曾经强盛的日耳曼诸国分崩离析，为外敌所辱。\n只有恢复我们#variable 光荣的自由传统#!，我们的帝国才能在思想上占据高地。"
 je_aus_liberal_reform_military:0 "帝国宪政改革：重建帝国军队"
 je_aus_liberal_reform_military_reason:0 "长期以来，帝国的军队质量和管理系统都处于一个极为糟糕的状态，整体军队教育水平低下，难以训练，纪律松弛，兵源语种众多，导致管理和军队协调等等其他方面极为困难。\n在革命结束后，由于帝国军队的保守特性，它在帝国宪法颁布后便已经被解散，并由#variable 国民警卫队#!取而代之。\n然而，严峻的外部形势让我们意识到一个高度职业化的常备军是很有必要的。我们现在必须#variable 重建帝国军队#!，并改革军队管理系统和训练方式，这将会是未来帝国安全的最大保障。"
 je_aus_liberal_reform_success_reason_tt:0 "我们完成了所有帝国宪政改革日记条目中的4个"	 
 je_aus_liberal_reform_fail_reason_tt:0 "丢失意大利和德意志的霸权将导致改革的失败，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]将解散软弱无能的议会，以自己的意志重铸国家"
 finished_liberal_reform_economy_tt:0 "我们的gdp提升了两倍"
 finished_aus_liberal_reform_tt:0 "我们已经完成了帝国宪政改革"
 finished_aus_municipal_council_reform_tt:0 "我们已经在帝国各地建立了地方议会"
 je_aus_liberal_reform_advance:0 "我们完成了一个改革日记条目"
 je_aus_absolutism_return:0 "废除宪法"
 je_aus_absolutism_return_reason:0 "在宪法被废除后，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]任命了[SCOPE.sCharacter('new_aus_absolutism_landowners_scope').GetLastName]领导的帝国议政会——无能帝国议会的替代品作为自己的咨询机构。这个王朝现在不再依靠传统和宪法，而是依赖于#bold 对臣民的强制#!来实现哈布斯堡权威的最大化。经济以及财政权力将取代传统和先例成为权威的基础。现代化的行政体制和军队将让这个君主国在面对欧洲其他现代化大国时能够捍卫自己的权利。帝国如今面临着现代化的紧迫使命和周边野心家的威胁，我们必须尽快让帝国走上绝对主义的正道上——在一切都变得不可挽回之前"
 finished_aus_absolutism_centralization_return_tt:0 "我们已经完成了加强集权日记"
 je_aus_absolutism_centralization_return:0 "加强集权"
 je_aus_absolutism_centralization_return_reason:0 "昔日帝国分散的行政结构是导致帝国懦弱（尤其是财政上）的核心原因，而帝国议会的倒台已经证明了分权实践的失败。为了尽快动员起整个国家，我们必须紧急调整我们的地方行政体系向单一化发展。在[SCOPE.sCharacter('new_aus_absolutism_landowners_scope').GetLastName]的计划中，地方议会的自治权将被废除，而由#bold 省长（Statthalter）#!领导的#bold 省（Statthaltereien）#!将成为地方新的行政单元，省长是行政主官和[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的代表。新的行政和司法机构将是组织严密且集中化的。这将帮助我们在当今的严峻形势下改善我们的财政。"
 je_october_diploma_municipal_council_reform_tt:0 "我们完成了集权日记"
 je_aus_october_diploma:0 "紧急宪政改革"
 je_aus_october_diploma_reason:0 "[SCOPE.sCharacter('aus_october_diploma_ruler_scope').GetFirstName]很不情愿地接受了立宪主义的咒语。由于财政危机所迫，他没有别的选择，因为维也纳的银行家集团——其中很多是犹太人是唯一现实的资金来源，但[SCOPE.sCharacter('aus_october_diploma_ig_industrialists_scope').GetFullName]已表明了他们的立场:“ 没有宪法便没有钱。”。考虑到“时代精神”以及财政和政治处境，确实没有别的东西可以代替宪政制度了。\n\n[Concept('concept_ruler','$RULER_TITLE_KAISER$')]于是求助于德意志自由派，任命[SCOPE.sCharacter('aus_october_diploma_ig_landowners_scope').GetLastName]为首相。\n[SCOPE.sCharacter('aus_october_diploma_ig_landowners_scope').GetLastName]关于十月文告的“授权立法”，即二月敕令将屈贝克的帝国议政会改组成了[concept_aus_reichsrat]。这也被认为是帝国宪政改革的开始。"
 finished_aus_october_diploma_municipal_council_reform_tt:0 "我们已经完成了赋权地方议会日记"
 je_aus_october_diploma_municipal_council:0 "赋权地方议会"
 je_aus_october_diploma_municipal_council_reason:0 "十月文告制定了一个保守的联邦主义方案，它将恢复匈牙利的传统自治，而国家的其他地区也以这样的非中央集权化原则进行改组。虽然这个方案因为马扎尔人和德意志自由派持续的反对而失败，但通过各省议会间接选举出帝国议会成员的条文仍出现在了之后的二月敕令上，这标志着帝国行政分权的开始。"
 je_october_diploma_municipal_council_reform_tt:0 "我们完成了分权日记"
#改革事件#####################################################################################################################################################################
 sop_austira.16.t:0 "弗朗茨的愿景" 
 sop_austira.16.d:0 "随着斐迪南一世的退位，年轻的[SCOPE.sCharacter('new_aus_absolutism_scope').GetFullName]已经登基成为了这个古老帝国的统治者。这被视为哈布斯堡对现代化之必要性的认可。这位新[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的名字把弗朗茨一世的传统主义和约瑟夫二世所谓的自由主义结合在一一起。然而，宪政改革的倡导者们不久就感到失望。弗朗茨有太多的真实的约瑟夫二世的气质，他渴望现代化，但都是绝对主义方式的现代化。"
 sop_austira.16.f:0 "无论是我精心的安排还是我本身，都遭到忘恩负义的可怕评价和对待， 我甚至不敢为自己的观点辩护，也没有力量推行我支持的事物。\n————约瑟夫二世"
 sop_austira.16.a:0 "我们将延续约瑟夫二世的理想"
 sop_austira.17.t:0 "皇帝凯旋"
 sop_austira.17.d:0 "我们的[SCOPE.sCharacter('new_aus_absolutism_scope').GetLastName][Concept('concept_ruler','$RULER_TITLE_KAISER$')]在[SCOPE.sCharacter('aus_landowners_ig_leader_scope').GetLastName]领导的政府的辅佐下完成了绝对主义改革，贵族特权和地方自治被废除，而中央派遣的官僚们将加强政府与人民之间的联系以满足人民的需求。一个现代化的、统一的、中央集权的“奥地利帝国（österreichischen Kaiserstaat）已经被建立起来。我们的强劲实力将让德意志和意大利诸邦恐惧，且让我们在面对欧洲其他现代化大国时能够捍卫自己的权利。约瑟夫二世的理想已经被实现，而奥地利的成功也为现代化进程开辟了新的道路。有着新社会和经济状况的全新时代已经迎来黎明，好时代，即将到来了。"
 sop_austira.17.f:0 "这个国家应该成为世界上最伟大、最强力、最受尊敬与畏惧的国家，那么对于这个国家的一个个成员来说，国家对他们有什么目的？\n——埃贡·弗里德尔"
 sop_austira.17.a:0 "集中力量办大事！"
 sop_austira.18.t:0 "十月文告"
 sop_austira.18.d:0 "我们在对外和对内政策的失败彻底让本就处于各种不利局面的哈布斯堡王座摇摇欲坠，帝国各地区的叛逆者不断在各地爆发反叛运动，反对王座专制统治的无上权威。为了不让最糟糕的事情发生，我们必须尽快做出妥协，至少在表面让步于匈牙利和其它地区的贵族地主，以缓和国内的种种矛盾。新内务部长[SCOPE.sCharacter('intelligentsia_ig_leader_scope').GetFullName]已经起草了关于"修改宪法"的纲领。我们不得不承认绝对主义改革实际上已经失败了"
 sop_austira.18.f:0 "这就是我们在宗教问题上所说的约瑟芬主义的真相，如果我们把它归结为它的本质，约瑟芬主义只是一个幽灵，穿过了这片大地，想要推翻所有东西，但只造出了一堆运动却毫无成果。\n——梅特涅"
 sop_austira.18.a:0 "只得如此了"
 sop_austira.19.t:0 "宪政帝国的黎明"
 sop_austira.19.d:0 "随着斐迪南一世的退位，年轻的[SCOPE.sCharacter('new_aus_liberal_reform_scope').GetFullName]已经登基成为了这个古老帝国的统治者。这被视为哈布斯堡对现代化之必要性的认可。这位新[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的名字把弗朗茨一世的传统主义和约瑟夫二世所谓的自由主义结合在一一起。\n\n弗朗茨希望以他自己的方式治理国家，但随着保守派在革命中落败，如今的[Concept('concept_ruler','$RULER_TITLE_KAISER$')]不得不与新成立[concept_aus_reichsrat]分享权力。无论如何，在接下来一段时间里，[concept_aus_reichsrat]内那群争吵不休的议员将决定国家的未来。"
 sop_austira.19.f:0 "如果我是个美国人并且有权选择的话，那么我会支持乔治·华盛顿的旧党，那是一个保守的政党，而且无论在什么地方，我都会是一个保守派。\n——梅特涅"
 sop_austira.19.a:0 "在欧洲它就是一个谎言（En Europe c’est un mensonge）"
 sop_austira.20.t:0 "自由的帝国，自由的人民"
 sop_austira.20.d:0 "随着我们的一系列改革，如今我们的帝国已经打破了绝对主义的枷锁，建立起了个体自由、人权和宪政国家。伯克的理想已经被实现，而奥地利的成功也为现代化进程开辟了新的道路。有着新社会和经济状况的全新时代已经迎来黎明，好时代，即将到来了。"
 sop_austira.20.f:0 "欧洲通过日耳曼毁灭，也将通过日耳曼复兴。\n——根茨"
 sop_austira.20.a:0 "宪政万岁！"
 sop_austira.21.t:0 "[concept_aus_reichsrat]被解散"
 sop_austira.21.d:0 "我们在对外和对内政策的失败导致帝国政府前所未有的危机之中，人们对宪法秩序的怀疑最终促使[Concept('concept_ruler','$RULER_TITLE_KAISER$')]亲自下场，颁布了中止宪法的新年敕令（Silvesterpatent）,军队在[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的命令下进入了国会大厦并驱散了议员们。如今软弱无能的议会已经被废止，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]将开始亲理政事，并依靠其#bold 官僚机构、警察和军队#!的权威去推行自己的意志。在帝国处于危难关头的现在，只有[Concept('concept_ruler','$RULER_TITLE_KAISER$')]和他忠诚的官僚机构——而非懦弱无能的代议机构才能带领帝国走出危机，走向现代化！"
 sop_austira.21.f:0 "王权的叙事根基一旦改易就是永久的毁灭。\n——梅特涅"
 sop_austira.21.a:0 "我的精神始终在为未来而奋斗"

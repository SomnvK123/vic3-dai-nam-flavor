 #加利西亚#############################################################################################################################################################################
 galicia_events.1.t:0 "加利西亚的幽灵"
 galicia_events.1.d:0 "在这个世界上，也许每一个国家，每一个文明，也都有属于自己的加利西亚幽灵。"
 galicia_events.1.f:0 "#variable “加利西亚”#!又称#variable 加利西亚和洛多梅里亚王国#!，是哈布斯堡在第一次瓜分波兰所获得的战利品。作为东欧国家波兰曾经的领土，加利西亚的土地制度被落后的封建[GetLawType('law_serfdom').GetName]结构支配。由于传统的封建观念，[GetLawType('law_serfdom').GetName]在加利西亚的土地上根深蒂固，而在加利西亚掌握政治权力的#v $aristocrats$#!对改革拖延不前。即便在19世纪早期对[GetLawType('law_serfdom').GetName]改革的必要性已经成为流行的话题，#v $aristocrats$#!阶层还是不愿做出任何动作和回应——这就与[concept_hungary_kindom]的[concept_magyar]自由主义#v $aristocrats$#!们如出一辙。当他们捍卫民族传统或固有的自治权力时，他们似乎并不是为这片土地上的人民，而是为#variable 自己的权力乃至特权#!在捍卫这一切。维也纳方面施加土地改革政策的压力与波兰民族主义的传播结合起来，在加利西亚形成了交叉的影响。在加利西亚人的通信、传记和文字中，19世纪的加利西亚人身上，我们竟似乎看到了同样的色彩：他们可以同时认同自己的波兰民族身份、加利西亚“国家”观念以及对哈布斯堡王朝的忠诚。加利西亚似乎既是波兰的一部分，又被单独作为一个“国家”或整体，还是哈布斯堡君主国不可分裂的忠诚领地。"
 galicia_events.1.a:0 "这种表述中的国家究竟是民族文化意义上的波兰，还是奥地利君主国，又或者专指实际上作为一个地区的加利西亚呢？"
 galicia_events.2.t:0 "克拉科夫革命。"
 galicia_events.2.d:0 "克拉科夫自由市爆发了大规模叛乱！当地的起义领导者发动了贫民、工人、手工业者和农民为主力的无产阶级武装力量向奥军进攻，附近人民云集响应，起义军达到6000人。奥军在2月22日被赶走，克拉科夫宣告解放。起义领导人之一的路德维克·戈什科夫斯基宣布成立“波兰共和国民族政府”，同时发表了“告波兰人民宣言”。。"
 galicia_events.2.f:0 "我们这里有2000万人，如果我们团结得像一个人一样，那么我们的威力是任何暴力压服不了的，我们将获得迄今所没有的自由。······每个人将根据他的贡献和能力使用土地，任何形式的特权将被废除······农民目前有条件使用的土地，将无条件地为其所有，无偿地取消代役租、劳役和一切类似义务，而手持武器、为民族事业而献身的人将从国有土地中得到奖励。\n————告波兰人民宣言。"
 galicia_events.2.a:0 "碾碎他们！。"
 galicia_events.3.t:0 "加利西亚农民起义"
 galicia_events.3.d:0 "去年爆发的歉收和洪涝，加上[GetLawType('law_serfdom').GetName]下农民与#v $aristocrats$#!之间尖锐的矛盾，农民的怒火终于被点燃，加利西亚爆发了大规模的农民起义。农民武装声势浩大，顷刻间席卷加利西亚六个州，无数地主被杀。我们可以将计就计，宣称我们将废除[GetLawType('law_serfdom').GetName]，从而赢得他们的支持，这将是我们分化瓦解叛乱者的绝佳机会"
 galicia_events.3.f:0 "老爷造反，与我这个臭耕田的何关？"
 galicia_events.3.a:0 "让老农自己去斗地主，我们坐享其成即可。"
 galicia_events.3.b:0 "把它们都给我平了！"
 galicia_events.4.t:0 "加利西亚大屠杀"
 galicia_events.4.d:0 "我们的分化政策奏效了！现在农民们正自发帮助我们镇压革命者，而我们只需要等他们两败俱伤，就能将他们一网打尽了、"
 galicia_events.4.f:0 "帝国政府宣称捉拿一个起义者可以得到金钱奖励，在仇恨与利益的驱使下，一个荒谬的现象出现了，波兰的农民起义军向革命者举起了屠刀。农民武装在三天的时间里将500座庄园夷为平地，数千名地主身首分离。真正参加起义的地主少之又少，大部分人成了阶级复仇的牺牲品。克拉科夫政府听说了加利西亚的悲剧，向那里派遣了一支队伍试图向农民解释清楚，结果半路被农民武装伏击歼灭。邓博夫斯基亲自带人前往加利西亚试图平息事端，又被奥军阻截而阵亡。4月，“加利西亚大屠杀”过后不久，当局为防止农民武装不受控制，开始四处镇压失去利用价值的农民起义军。至夏天，各处骚动宣告平息，加利西亚农民起义失败。"
 galicia_events.4.a:0 "农生万物以养贵，贵无一物以报农，杀杀杀杀杀杀杀杀！"
 galicia_events.5.t:0 "加利西亚革命。"
 galicia_events.5.d:0 "随着[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]的革命愈演愈烈，我们的#variable 加利西亚#!地区也出现了大规模的起义，所辛我们的总督已经通过宣布提前在#variable 加利西亚#!废除[GetLawType('law_serfdom').GetName]暂时稳定了农民，现在将由我们决定是否要采取行动将剩下的革命者一网打尽。"
 galicia_events.5.f:0 "3月15日，和波兹南起义几乎同一时间，随着首相梅特涅的下台，加利西亚也爆发了革命运动。4月，波兰委员会建立于克拉科夫并扩大武装力量，利沃夫也成立了委员会。加利西亚的起义领袖同波兹南贵族一样，寄希望于和平解决争端。他们向奥地利[Concept('concept_ruler','$RULER_TITLE_KAISER$')]递交请愿书，希望[Concept('concept_ruler','$RULER_TITLE_KAISER$')]废除[GetLawType('law_serfdom').GetName]，通过赎买给予农民土地。但农民对此并不买账，他们渴求真正的无偿分配土地，为表示抗议，农民开始罢工。12月，新即位的奥地利[Concept('concept_ruler','$RULER_TITLE_KAISER$')]弗兰兹·约瑟夫一世发布了正式的废黜[GetLawType('law_serfdom').GetName]敕令，大批农民退出战斗。加利西亚的起义失败了，全国革命的火苗也被各占领当局迅速扑灭，克拉科夫被奥地利军队的火炮轰击，城内的波兰委员会宣告投降。"
 galicia_events.5.a:0 "是时候让我们的军队来教他们什么叫忠君爱国了"
 galicia_events.5.b:0 "我们忙不过来，先把军队撤出吧"
 #国务会议#############################################################################################################################################################################
 je_habsburg_monarchy:0 "国务会议"
 je_habsburg_monarchy_reason:0 "#bold [concept_staatskonferenz]#!是为我们敬爱的#yellow 费迪南#![Concept('concept_ruler','$RULER_TITLE_KAISER$')]所创立的摄政议会，然而这个部门自成立初期就陷入了由#yellow 克莱门斯·梅特涅#!领导的#variable 梅特涅派#!和由#yellow 弗朗茨·安东·冯·科洛夫拉特·利布施泰因茨基伯爵#!领导的#variable 波西米亚派#!的激烈政治斗争。\n\n#variable 梅特涅派#!是以#yellow 梅特涅#!为首的政府改革派，他们对国家顶层的相互牵制的混乱体系的运作情况的不满让他们联合到了一起，希望对组织混乱的国家管理机构进行#variable 改革#!。\n而#variable 波西米亚派#!则是由波西米亚#v $aristocrats$#!和保守派官僚组成的政治联盟，希望依靠现有的僵化的官僚机构来为自己牟利，他们是#variable 现有秩序的维护者#!。\n\n两位股肱重臣之间在观念和路线走势上的分歧以及不和谐，实际上已经造成了#variable 帝国政治的停滞#!——任何改革都必将遭到另一派的全力阻挠。\n#bold 时间不等人，[concept_revolution]的征兆已然出现，如果我们无法解决最高权力之间的政治斗争，我们可能会被[concept_revolution]的怒火所吞噬#!"
 concept_staatskonferenz:0 "国务会议"
 concept_staatskonferenz_desc:0 "国务会议（Staatskonferenz）为先[Concept('concept_ruler','$RULER_TITLE_KAISER$')]#yellow 弗朗茨一世#!于遗嘱里要求创建的一个权力机构，其地位高于国务院。国务会议必须审议[Concept('concept_ruler','$RULER_TITLE_KAISER$')]交办的重大事项或者国务院有不同意见的事项，甚至可以代表[Concept('concept_ruler','$RULER_TITLE_KAISER$')]处理某些政府事务。从1836年起，由弗朗茨一世在遗嘱中指定路德维希大公主持会议，担任国务会议主席，其必要时，主席可以召见国务会议的所有成员和法院院长。"

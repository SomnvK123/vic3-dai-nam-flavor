 je_postwar_aus_administration_reform:0 "帝国行政区划重组"
 je_postwar_aus_administration_reform_reason:0 "不得不承认，三月革命前时代的行政繁琐、不亲民且低效，无能的#variable 官僚机构#!和#v $aristocrats$#!把持的#variable 地方等级会议#!对革命中涌现出的民怨起了很大的作用。无力改革的旧制度行政机构推动了[concept_revolution]，就像[concept_revolution]本身产生了不断增长的行政权力一样。\n\n随着旧有封建秩序被扫除和秩序的回归，帝国终于获得了对地方动手的机会，作为基层地方单位的县（Kreis）的重要职能被剥夺，古老的世袭庄园行政体系被废除，#v $aristocrats$#!们对地方的控制已经被撼动。\n\n为了扩大帝国的税源，加强官僚机构的行政效率，同时缓解中央和地方之间的冲突，帝国中央将按照自己的意愿来建立一套全新的#variable 地方行政体系#!。现在有两种方案摆在我们面前:\n#bold 我们可以建立一个涵盖整个国家和所有机构的强力地方行政体系，通过建立省制来确保中央对地方强力控制。#!\n#bold 我们也可以通过重组地方议会来让中下层群众更多参与政治，从而在节省行政开支缓解民族之间的矛盾。#!\n#variable 只有将我们的行政体系现代化，君主国才有可能在这个充满危险的世界生存下去。#!"

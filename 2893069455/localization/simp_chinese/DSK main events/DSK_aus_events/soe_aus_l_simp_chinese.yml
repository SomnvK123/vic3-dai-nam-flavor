#意识形态和特色ig#######################################################################################################################################################################
 ideology_classical_conservatism_leader:0 "古典保守主义者"
 ideology_classical_conservatism_leader_desc:0 "这个领袖推崇一个强大的、开明的、普世的政府，且强调政府作为传统的一面，认为君主制是最符合理性的制度。同时追求多元主义和与教会的进一步合作"
 ideology_neo_absolutism_leader:0 "新绝对主义者"
 ideology_neo_absolutism_leader_desc:0 "这个领袖向往约瑟夫二世时代的理性国家，支持建立一种有效的、集权化的官僚制度来取代封建体制，依靠其官僚机构、警察和军队的权威去推行自己的皇帝意志，带领国家走向现代化。同时也支持反教权主义和多元主义改革"
 ideology_austria_constitutionalist_leader:0 "奥地利立宪主义者"
 ideology_austria_constitutionalist_leader_desc:0 "这个领袖认为在哈布斯堡统治原则下的宪政主义和自由主义改革是国家强大的基石。"
 ideology_modern_conservatism_leader:0 "现代保守主义者"
 ideology_modern_conservatism_leader_desc:0 "这个领袖认为适当的社会和经济改革将有助于捍卫传统价值观"
 ideology_danubianist:0 "多瑙主义者"
 ideology_danubianist_desc:0 "#lore 这个集团相信联邦制，提倡该地区各民族自治。"
 ideology_absolutism:0 "绝对主义者
 ideology_absolutism_desc:0 "这个集团认为君主是国家主权的体现与唯一代表，遵循法治，依照宪法与自然法而运作，且受到封建传统的制约。"
 ideology_statism:0 "集权主义者"
 ideology_statism_desc:0 "这个集团认为一个有效的、集权化的官僚制度是国家强大的基石。"
 ideology_josephism:0 "约瑟夫主义者"
 ideology_josephism_desc:0 "这个集团想要追寻约瑟夫二世的步伐，建设约瑟夫二世的理性国家，但是不带有任何开明的理想主义。"
 austrian_bureaucracy:0 "奥地利官僚"
 austrian_bureaucracy_desc:0 "奥地利的官僚集团是帝国的中流砥柱，由中央和地方政府中的高级贵族和大量基层公务员组成，团结在哈布斯堡君权之下。"

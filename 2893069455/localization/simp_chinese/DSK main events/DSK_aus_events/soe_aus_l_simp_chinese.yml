 Vienna_Ringstrasse_reason:0 "#variable [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]#!,作为我们伟大帝国的[concept_capital_state]，有着悠久的历史和数不尽的辉煌.然而，如今城市的快速发展遭到了#variable [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]古城墙#!的阻碍，且城墙对内部的革命威胁也毫无用处。\n为了扫清城市发展的阻碍，同时使我们的首都成为欧洲最伟大的城市。在[SCOPE.sCharacter('wien_ruler_scope').GetLastName]的授意下，我们的设计师们制定了一个雄心勃勃的计划：彻底拆除古城墙，并以一个环绕全城的#variable 环城大道及其配套的大量建筑物#!取而代之。\n这项计划是如此庞大，以至于它将消耗数十年的时间和无数人力物力，而它一旦实现，[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]将成为不逊于巴黎和伦敦的#variable 欧洲明珠！"

 je_habsburg_galicia:0 "加利西亚的命运"
 je_habsburg_galicia_reason:0 "随着我们成立了[SCOPE.GetRootScope.GetCountry.GetNameNoFlag]国家，我们不得不开始考虑我们持有的东欧领地问题。\n\n[SCOPE.sCountry('rus_scope').GetName]一直对我们的加利西亚虎视眈眈，而随着德意志民族国家的建立，他们正式向我们提出了对该地的领土主张。\n他们同时也向我们提议，愿意以给予波兰人更高的自治权来换取我们的领土。\n现在有两个选择摆在我们面前，是选择将其交予俄国人以改善与他们的关系，还是冒着冒犯俄国人的风险保留对加利西亚的控制？"

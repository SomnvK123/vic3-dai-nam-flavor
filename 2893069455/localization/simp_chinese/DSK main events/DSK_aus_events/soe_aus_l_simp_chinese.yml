 je_Austrian_Empire_revolution:0 "万国之春：奥地利"
 je_Austrian_Empire_revolution_reason:0 "进度条会显示当前最占优势的#variable 政治派别#!的势力。#bold 当倒计时结束，取得优势的一方将赢得胜利#!。\n#blue 宪政派#!势力：#variable [ROOT.GetCountry.MakeScope.Var('aus_1848_liberal_progress').GetValue|0]#!点；会因为多个#tooltippable;tooltip:[Country.GetTooltipTag],je_Austrian_Empire_revolution_tooltip_deplete 条件#!改变。\n#variable 保守派#!势力：#variable [ROOT.GetCountry.MakeScope.Var('aus_1848_conservative_progress').GetValue|0]#!点；会因为多个#tooltippable;tooltip:[Country.GetTooltipTag],je_Austrian_Empire_revolution_tooltip_advance 条件#!改变。\n[concept_revolution]激进度：#variable [ROOT.GetCountry.MakeScope.Var('aus_1848_radical_progress').GetValue|0]#!点；会根据事件的选项而增加。\n[concept_revolution]激进度越高，[concept_revolution]的恶性事件将会越多，当激进度到达#variable 8#!时，激进派将单独发动一场更激进的总[concept_revolution]，对[concept_revolution]的镇压将会同时打击立宪派的势力。\n\n自从[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]人民摧毁了梅特涅亲王的政权，使他可耻地逃亡国外后。由[Concept('concept_ruler','$RULER_TITLE_KAISER$')]任命人选的新#bold 自由派政府#!已经被组建，他们将承担改革国家的重任。然而，革命者内部并不团结， 他们的胜利不过是只归功于各对现状感到不满阶层组成的#bold 政治联盟#!。这种联盟一旦无法维系，出现分裂，那么问题就会发生。#blue 宪政派#!和#red 激进派#!都想决定新政权的发展方向。\n#blue 宪政派#!由自由派中的温和派组成，是自由派中的主要派系，主张通过温和的和平示威和参与政府来让政府妥协，使帝国免受第二次、更激进的[concept_revolution]破坏。\n#red 激进派#!则鼓吹真正的人民革命，但他们稀少的人数让他们不得不暂时寻求与温和派的联盟，但他们与温和派的分歧将随着激进度的增加而扩大。\n而#variable 保守派#!亦未被打倒，他们仍然掌握着#bold 军队#!和#bold 广大农村#!，农民一旦在起义中得到了自己想要的东西，便会回归#bold 保守主义#!。只要[concept_revolution]党陷入分裂，保守派就能得以缓过神来，利用他们强大的优势重夺#bold 主导权#!。"
 je_Austrian_Empire_revolution_tooltip_advance:0 "以下情况会使#variable 保守派势力#!#bold 增长#!：\n•镇压民族革命\n•废除进步宪法\n•镇压进步运动和革命\n•拒绝参加法兰克福会议\n•废除农奴制\n•与沙皇结盟\n•解散民选议会"
 je_Austrian_Empire_revolution_tooltip_deplete:0 "以下情况会使#variable 宪政派势力#!#bold 增长#!：\n•允许民族自治\n•颁布进步宪法\n•对进步运动网开一面\n•参加法兰克福会议\n•任意[concept_revolution]进度超过#variable 50%#!"

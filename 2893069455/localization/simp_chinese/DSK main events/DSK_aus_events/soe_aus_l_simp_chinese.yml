 #费迪南皇帝铁路########################################################################################################################################################################
 je_Kaiser_Ferdinands_Nordbahn:0 "费迪南皇帝铁路"
 je_Kaiser_Ferdinands_Nordbahn_reason:0 "当铁路被认为是一种可行的运输方式后，便有人开始考虑建立从维也纳到苏台德地区北摩拉维亚-西里西亚采矿和工业区的铁路，以进一步完善与加利西亚的连接，改善该地区的经济结构。安塞姆·所罗门·冯·罗斯柴尔德在1835年申请了修建铁路线的特权，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]陛下在一年后授予了他为期50年的特权，且得到了梅特涅亲王和科洛拉特伯爵的支持。如果铁路建成，新修建的铁路线会被称为“Kaiser-Ferdinand-Nordbahn（斐迪南皇帝铁路）”，以纪念伟大的斐迪南一世[Concept('concept_ruler','$RULER_TITLE_KAISER$')]陛下。作为世界上屈指可数的强国，我们必须尽快完成铁路修建，将帝国北方快速的连接起来。"

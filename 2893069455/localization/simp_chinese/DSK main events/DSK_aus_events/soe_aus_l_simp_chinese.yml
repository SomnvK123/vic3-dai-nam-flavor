 aus_christian_social_seat_tooltip_advance:0 "#variable 此政党将在研究完社会主义科技后解锁#!\n#bold 以下原因将每月增加席位：#!\n•#variable 领袖意识形态是族裔民族主义，沙文主义，法西斯主义或整合主义其中一个的[Concept('concept_interest_group', '$concept_interest_groups$')]的[concept_clout]大于10#!\n•#variable [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant]的[concept_clout]举足轻重。#!\n\n#bold 以下原因将每月减少席位：#!\n•#variable 其他政党正在增加议席。#!"
 aus_national_seat_tooltip_advance:0 "#bold 以下原因将每月增加席位：#!\n•#variable 捷克文化人口比例达到10%#!（改革地方议会和联邦化将进一步增加其席位）\n•#variable 波兰文化人口比例达到10%#!（改革地方议会和联邦化将进一步增加其席位）\n•#variable 北意大利文化人口比例达到10%#!\n•#variable 斯洛文尼亚文化人口比例达到10%#!\n•#variable 乌克兰文化人口比例达到10%#!\n#variable以下文化只有在其领地被联邦化之后才会记入议席#!：\n•#variable 匈牙利文化人口比例达到10%#!\n•#variable 克罗地亚文化人口比例达到10%#!#!\n\n#bold 以下原因将每月减少席位：#!\n•#variable 其他政党正在增加议席。#!"
 concept_aus_reichsrat:0 "帝国议会"
 concept_aus_reichsrat_desc:0 "帝国议会（Reichsrat）是哈布斯堡君主国的立法机构。这是一个两院制机构：分别由参议院（Herrenhaus）和众议院（Abgeordnetenhaus）组成。根据帝国宪法，法案必须由两院通过，由负责的政府部长签署，然后由[Concept('concept_ruler','$RULER_TITLE_KAISER$')]批准。议员由各省的地方议会（Landtag）选出.议会在所有王室领地的事务中拥有广泛的立法权。但任命和罢免首相仍然是[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的权力。议会在其存在的整个过程中受到帝国众多组成民族之间内部冲突的严重影响。"
 concept_aus_conservative:0 "铁环联盟"
 concept_aus_conservative_desc:0 "铁环联盟本质上并不是个政党，而是由一个由各种独立政治家、保守派和少数民族政党组成的联盟。该联盟主要得到教会、德国上层阶级和内来塔尼亚的少数民族的支持。联盟内部的不同派系之间虽然有差异，但总体上支持在社会、经济和政治领域的保守主义和反自由主义。联盟在民族问题上则强调调和与妥协。联盟长期作为议会的右派存在"
 concept_aus_liberal:0 "德意志自由党"
 concept_aus_liberal_desc:0 "德意志自由党又称立宪党或德意志宪政党，是帝国议会中最大的自由派政党，其成员自认是48年革命的继承者。除了政治上的自由主义意识形态外，他们还提倡反教权主义和市场自由主义。并试图捍卫讲德意志人的特权，以应对君主国中斯拉夫少数民族日益增长的民族运动。自由党长期作为议会的左派存在"
 concept_aus_socialist:0 "奥地利社会民主党"
 concept_aus_socialist_desc:0 "奥地利的社会民主党是工人运动的产物，该党的主要支持者为左翼中产阶级和工人阶级。该党支持政治和经济的民主化，提倡集体主义，并寻求保障工人权益，力图提升工人阶级在政治生活和社会生活中地位。在民族问题上则强调普世主义。其激进的社会主义思想和共和主义思想成为了威胁帝国存续的一个不稳定因素。"
 concept_aus_christian_social:0 "基督教社会党"
 concept_aus_christian_social_desc:0 "基督教社会党脱胎于19世纪中后期兴起的基督教社会运动，并得到了小资产阶级激进派、下层教士、文化保守主义者等各种反自由主义群体的支持。该党的主要意识形态为反犹主义、反教权主义和天主教社会思想，而由于后者的超民族价值观则决定了该政党的超民族性质，也因此该党并无一个单一民族认同，只是依靠一个共同的敌人——犹太人——作为他们团结的根本。"
 concept_aus_national:0 "各民族政党"
 concept_aus_national_desc:0 "由于帝国议会的超民族性质，其内部也产生了众多代表本民族利益的政党，例如捷克的捷克国家党和加利西亚社会民主党等，这些政党的意识形态虽然大相径庭，但总体上都是为了本民族利益出发，为本民族争取更多的自治权甚至独立是这些政党的主要目标。"

 je_aus_reichsrat:0 "帝国议会"
 je_aus_reichsrat_reason:0 "[concept_aus_conservative]：#variable [ROOT.GetCountry.MakeScope.Var('aus_conservative_seat').GetValue|0]#!议席；[concept_election]时会因为多个#tooltippable;tooltip:[Country.GetTooltipTag],aus_conservative_seat_tooltip_advance 条件#!改变。\n[concept_aus_liberal]：#variable [ROOT.GetCountry.MakeScope.Var('aus_liberal_seat').GetValue|0]#!议席；[concept_election]时会因为多个#tooltippable;tooltip:[Country.GetTooltipTag],aus_liberal_seat_tooltip_advance 条件#!改变。\n[concept_aus_socialist]：#variable [ROOT.GetCountry.MakeScope.Var('aus_socialist_seat').GetValue|0]#!议席；[concept_election]时会因为多个#tooltippable;tooltip:[Country.GetTooltipTag],aus_socialist_seat_tooltip_advance 条件#!改变。\n[concept_aus_christian_social]：#variable [ROOT.GetCountry.MakeScope.Var('aus_christian_social_seat').GetValue|0]#!议席；[concept_election]时会因为以下#tooltippable;tooltip:[Country.GetTooltipTag],aus_christian_social_seat_tooltip_advance 条件#!改变。\n[concept_aus_national]：#variable [ROOT.GetCountry.MakeScope.Var('aus_national_seat').GetValue|0]#!议席；[concept_election]时会因为多个#tooltippable;tooltip:[Country.GetTooltipTag],aus_national_seat_tooltip_advance 条件#!改变。\n\n#variable [concept_aus_reichsrat]#!是帝国宪政化的一个重要成果，[concept_aus_reichsrat]享有大部分立法权，并控制着中央集权化的行政机构，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]掌握军事和外交事务方面的特权，但帝国议会决定预算方案，包括军队的预算。它是新的奥地利政府的基础。\n然而，这个议会是建立在一个拥有着#variable 前现代的社会结构#!和抗拒立宪的[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的国家上。王朝的原则从来不承认人民主权，而是坚持#variable 君主的权威#!。它的#bold 农业和传统因素#!比其他社会更强大、更难以驾驭，而君主国的#bold 族裔多元性#!使得产生某种共进退意识的努力变得十分困难。它对现代世界的适应远不是彻底的。这注定了议会本身注定将不会是一个和谐议事的场所，而是个充满了政治博弈和争吵的战场。\n\n#variable有的政党认为自己代表了帝国人民，有的政党认为自己代表了某个群体，但谁又能代表君主国的未来？#!"

 sop_austira.1.t:0 "大奥地利的天命"
 sop_austira.1.d:0 "有鉴于维也纳在德意志事务中的主导地位，我们已设法将德意志各邦统一为一个单一的德意志国家，普鲁士人永远地被击败了，并将作为普鲁士王国的组成国并入德意志帝国。\n统一的大德意志无疑将是所有欧洲最强大的力量，但为了安抚其他列强，维也纳条约的条款将授予前奥地利帝国的所有非德意志领土有限的主权，这样做也有利于安抚各民族的分离运动"
 sop_austira.1.f:0 "统一的德国十分必要，\n向内向外都要一致。\n————海涅"
 sop_austira.1.a:0 "德意志万岁！"
 sop_austira.2.t:0 "费迪南皇帝铁路落成"
 sop_austira.2.d:0 "终于，在投入了大量资金后，斐迪南皇帝铁路终于落成了。1837 年 3 月，首批六台机车从纽卡斯尔的乔治·史蒂芬森工厂和沃灵顿的泰勒尔公司抵达，拆解后用船运到的里雅斯特，然后用马车经塞默灵河运往维也纳。史蒂芬森工厂的一名专家、两名来自英国的火车司机和四名机械师在维也纳普拉特的一条测试路线上负责奥地利工作人员的培训。卡尔·格伦德曼 (Carl Grundmann)于 1838 年成为北方铁路上第一位奥地利火车司机，也是君主国第一位讲德语的火车司机。列车在11 月 13 日在弗洛里兹多夫和德国瓦格拉姆之间 13 公里长的路线上进行了试运行，在11月19日和23日进行了首次试驾。"
 sop_austira.2.f:0 "这次旅行的邀请卡被分发给了尊贵的人们。来自纽卡斯尔史蒂芬森艺术工作室的美丽机车“奥地利”，牵引着八节车厢（五节一等车厢可容纳18人，三节二等车厢可容纳24人）沿着轨道快速行驶。尊贵的卡尔大公殿下，以及他的尊贵的孩子们，威廉大公和玛丽亚·卡罗琳娜女大公殿下，荣幸地参加了这次旅行。\n——弗朗茨·卡尔·魏德曼"
 sop_austira.2.a:0 "这是奥地利的第一条铁路！"
 sop_austira.3.t:0 "梅特涅与科洛夫拉特之间的政治斗争"
 sop_austira.3.d:0 "弗朗茨一世的死后，失去了[Concept('concept_ruler','$RULER_TITLE_KAISER$')]庇护的[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]的地位早已不再像以往那样巩固。而他的权威如今正遭受着财政部长[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]的挑战。"
 sop_austira.3.f:0 "在弗朗茨一世死后，[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]就成为了帝国理论上的政府首脑。但失去了[Concept('concept_ruler','$RULER_TITLE_KAISER$')]庇护的他已经不可能在不依靠同盟者的情况下自主行动了。而他所面对的，是皇亲国戚组成的强大阵线，这还未算上他在内政上的最主要政敌：波西米亚人[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]。借助波西米亚院外集团的力量，[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]已经实际上成为了#bold 国务会议的最高首脑和所有国家公职人员的招聘以及他们命运（通过对[GetLawType('law_secret_police').GetName]的掌控）的主人#!，并且由于这种地位，从而在会议中也是决定性的发言人。他利用他掌管的部门，公开并且毫无顾忌地全面为#bold 波西米亚贵族#!的利益政策服务。而[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]建议的所有有关国家发展的先进方案，都由于他的阻挠和利益依赖而泡汤。"
 sop_austira.3.a:0 "从性格和习惯上来说，我是一名建设者（Je suis par caractère et par habitude constructeur）"
 sop_austira.4.t:0 "反梅特涅政变！"
 sop_austira.4.d:0 "波西米亚派联合哈布斯堡王室一起，通过一场小型政变终结了[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]作为国务会议主席的地位，使得[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]的权限极大缩水"
 sop_austira.4.f:0 "随着[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]于近日提出了针对国务会议的重磅改革，加强自身于国务会议的地位，同时大大削弱了[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]在其国务会议的权力。\n[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]随即做出反应，用尽一切手段成功将约翰大公爵，以及通过约翰大公爵将皇室家族的大部分成员争取过来，联合起来反对梅特涅，想尽办法要推翻这个合法通过的改革计划，哪怕其行为最终演变成了一场小型政变。按照最原始的方案，[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]本应是两个机构的领导，所有的事务——无论是内政还是外交——都要经过他的手。而现在的决定则是，财政、内政和最高警务只经过[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]，由他来决定哪些事务可以提交国务会议讨论，并因此绕过[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]，直接提交给了实际的国务会议主席[SCOPE.sCharacter('old_aus_absolutism_army_scope').GetFirstName]。\n[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]现在可以对任何事务发表意见并作出决定，而[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]的权限只限于外交。"
 sop_austira.4.a:0 "“我偶尔执掌欧洲，但从未执掌过奥地利。”"
 sop_austira.5.t:0 "艾希霍夫下台！"
 sop_austira.5.d:0 "[SCOPE.sCharacter('old_aus_absolutism_industrialists_scope').GetLastName]是整个科罗福拉特党的领袖和支撑，没有[SCOPE.sCharacter('old_aus_absolutism_industrialists_scope').GetLastName]，[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]将会失去支撑，他将变得孤立无助。为了绊倒他，梅特涅怂恿路德维希大公对他的业务行为进行了审查，并借助1840年欧洲危机时他造成的未决债务的数额以及流通中的钞票与金属支持之间的严重不成比例将他解雇。"
 sop_austira.5.f:0 "波西米亚的故事就是征兆，必须将它们压制下去，办法就是让他们走人埃希霍夫是个恶性的伤口，而如今他更是一块焦痂。他将完蛋！您要坚定地上场，我们一定会取得最好的结果。 \n———屈贝克"
 sop_austira.5.a:0 "对波西米亚佬的沉重一击！"
 sop_austira.6.t:0 "帝国议会召开"
 sop_austira.6.d:0 "在经过无数专制压迫的日子之后，宪政的成果——[concept_aus_reichsrat]终于在[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的仁慈下正式召开，在这个人民主权呼声日益占上风的世界里，这也许是挽救君主国的唯一解药。如今，我们的[concept_aus_reichsrat]将举行第一次[concept_election]，哪一党派将成为新议会的主人？"
 sop_austira.6.f:0 "由于⺠主的进程是社会整体发展的结果，所以⼀个掌控较⼤政治权⼒的进步社群，必须在此同时保护国家免于⺠主的暴⾏。⺠主⼒量⽆论在什么地⽅⼀时占了上⻛，都应⽴即加以镇压。\n———厄斯⾦·梅"
 sop_austira.6.a:0 "[concept_aus_liberal]通过[concept_election]取得了议会多数"
 sop_austira.6.b:0 "[Concept('concept_ruler','$RULER_TITLE_KAISER$')]偏爱的[concept_aus_conservative]与[concept_aus_national]的政治联盟"
 aus_reichsrat_open_tt1:0 "[concept_aus_conservative]获得了180席\n[concept_aus_liberal]获得了300席\n[concept_aus_national]获得了160席"
 aus_reichsrat_open_tt2:0 "[concept_aus_conservative]获得了240席\n[concept_aus_liberal]获得了200席\n[concept_aus_national]获得了100席"
 sop_austira.7.t:0 "群众运动和大众政党的兴起"
 sop_austira.7.d:0 "政治空间的扩展和现代化极大改变了[SCOPE.GetRootScope.GetCountry.GetNameNoFlag]国内的政治氛围。随着选举权的扩大，地位相对较低的中产阶级乃至工人阶级都被纳入了政治生活中，这使得更激进的政治主张和政党得以在下层民众中找到市场，群众运动和大众政党得以崛起。而其中最引人注目的则是[concept_aus_christian_social]领导的基督教社会运动，因其倡导的价值观中包含了浓烈的反犹倾向而广受中下层天主教徒欢迎。\n而与之对立的则是由[concept_aus_socialist]领导的[SCOPE.GetRootScope.GetCountry.GetNameNoFlag]劳工运动，这场运动虽然也持有集体主义意识形态，但继承了自由主义的普世人道主义，犹太人个体被视为运动中的平等一员。\n无论如何，这些新兴的政治运动正撕裂着[SCOPE.GetRootScope.GetCountry.GetNameNoFlag]的社会，它们未来将对君主国的政局有多大影响，我们拭目以待。"
 sop_austira.7.f:0 "自由主义的价值观被远为狭隘的民族主义世界观取代，这也不利于犹太人的融合。随着民族主义之间的冲突加剧，各种划分变得更为绝对，而由于伪达尔文主义的生物学说用种族概念取代了民族概念，犹太人的地位变得更加不安全。过去他们只是一群贱民，虽然地位低下但尚能被容忍，如今他们则成为一个有可能被驱逐或灭绝的外来种族。\n——文策尔"
 sop_austira.7.a:0 "精英政治的时代一去不复返"
 sop_austira.7.b:0 "我就说扩大选举没好事，是改回去的时候了"
 sop_austira.8.t:0 "在[SCOPE.sState('aus_political_movement_labor_state').GetName]的劳工运动"
 sop_austira.8.d:0 "[SCOPE.sBuilding('aus_political_movement_labor_workplace').GetName]里工作的工人们不满于长期遭受的恶劣条件和低薪，他们与当地的[concept_aus_socialist]组织合作，在[SCOPE.sState('aus_political_movement_labor_state').GetName]发起了一场罢工"
 sop_austira.8.f:0 "新的⼯会不断涌现，它们赋予国际⼯⼈协会群众基础：光是奥地利的数字便⾜以表明，在维也纳，国际⼯⼈协会的⽀持者据报道在1869—1872年间，就从1万⼈发展到3.5万⼈；在捷克，从5000⼈增⾄约1.7万⼈；在施蒂⾥亚（Styria）和卡林⻄亚，则从2000⼈增⾄仅施蒂⾥亚⼀地就⼤约有1万⼈。⽤⽇后的标准来衡量，这些数字还不算多，但它却代表着⽐数字表⾯⼤得多的动员⼒量。\n———霍布斯鲍姆"
 sop_austira.8.a:0 "支持工人们为了合法权益所采取的行动"
 sop_austira.8.b:0 "无法无天了，让警察驱散他们！"
 sop_austira.9.t:0 "在[SCOPE.sState('aus_anti_jewish_state').GetName]的反犹活动"
 sop_austira.9.d:0 "来自[SCOPE.sState('aus_anti_jewish_state').GetName]的一批天主教下层教士们在当地[concept_aus_christian_social]的组织下发起了一起反对犹太人的街头运动，他们举着反[SCOPE.sReligion('aus_anti_jewish_religion').GetName]标语，并殴打任何穿着类似犹太人的路人。"
 sop_austira.9.f:0 "反犹主义的很大一部分力量来自广大天主教徒的嫉妒，他们难以接受这样一个事实:在基督教神学中被斥为卑鄙者的犹太人竟能合法地享受新经济的繁荣带来的成果。另外，在如此众多的基督徒忍受痛苦的同时，犹太人的成功被视为违背了一个不成文的契约，即犹太人的解放将为所有人带来繁荣。繁荣的终结，自由主义支配权的终结,严重损害了犹太人的社会地位。\n——文策尔"
 sop_austira.9.a:0 "对他们的行为视而不见"
 sop_austira.9.b:0 "已经出格了，赶紧让警察来制止他们"
 sop_austira.10.t:0 "[SCOPE.sState('aus_political_movement_university_scope').GetName]大学的辩论"
 sop_austira.10.d:0 "[SCOPE.sState('aus_political_movement_university_scope').GetName]大学爆发了一场激烈的政治辩论，支持反犹主义的大学生和社会主义的大学生们之间分成了两派，为了驳倒对方的观点而争论不休，时态甚至一度升级到暴力冲突。"
 sop_austira.10.f:0 "⼤学⼀直都是新兴政治观点的前哨阵地，各种意识形态哪怕再极端都能在大学找到自己的温床。不同的意识形态支持者之间很容易产生分歧，这导致了排他性校园社群的产生。各社群之间的冲突甚至可能上升至暴力。"
 sop_austira.10.a:0 "社会主义的支持者说的有道理"
 sop_austira.10.b:0 "反犹主义的支持者说的有道理"
 sop_austira.10.c:0 "把他们隔开，直到两方都冷静下来为止。"
 sop_austira.11.t:0 "胜者为王"
 sop_austira.11.d_1:0 "在[concept_aus_socialist]领导的[SCOPE.gsInterestGroup('aus_political_movement_trade_unions_scope').GetName]的努力下，社会主义已经成为了[ROOT.GetCountry.GetName]的主流思潮，在未来的许多年里，社会主义的原则将对[ROOT.GetCountry.GetAdjectiveNoFormatting]的政坛产生深刻影响"
 sop_austira.11.d_2:0 "在[concept_aus_christian_social]领导的[SCOPE.gsInterestGroup('aus_political_movement_petty_bourgeoisie_scope').GetName]的努力下，基督教社会运动已经成为了[ROOT.GetCountry.GetName]的主流思潮，在未来的许多年里，基督教社会运动的原则将对[ROOT.GetCountry.GetAdjectiveNoFormatting]的政坛产生深刻影响" 
 sop_austira.11.f_1:0 "从前如果有⼈把富有⼿艺的⼯匠叫作⼯⼈，他会跟你反⽬……如今⼈们告诉⼯匠，⼯⼈是国内最⾼职衔，于是，⼯匠都说他们要做⼯⼈。\n——梅爵士"
 sop_austira.11.f_2:0 "反犹主义对基督教社会党的意义比对民族主义者的意义更为重要，因为基督教社会党没有各自的民族认同作为支撑，唯有他们反对的事物——犹太人——作为他们团结的根本。即便教权主义也不是个统一因素，因为他们的很多支持者，尤其是维也纳的支持者，持反教权主义的立场。这就是该党派之所以称“基督教”而非“天主教”的原因——在当时的背景下，“基督教”即意味着“非犹太人”。反犹主义是基督教社会党的核心本质。"
 sop_austira.11.a:0 "借此来壮大[SCOPE.gsInterestGroup('aus_political_movement_trade_unions_scope').GetName]的力量"
 sop_austira.11.a2:0 "借此来打击[SCOPE.gsInterestGroup('aus_political_movement_petty_bourgeoisie_scope').GetName]的力量"
 sop_austira.11.b:0 "借此来壮大[SCOPE.gsInterestGroup('aus_political_movement_petty_bourgeoisie_scope').GetName]的力量"
 sop_austira.11.b2:0 "借此来打击[SCOPE.gsInterestGroup('aus_political_movement_trade_unions_scope').GetName]的力量"
 sop_austira.12.t:0 "尘埃落定"
 sop_austira.12.d_1:0 "随着我们在宫中的势力不断增长，如今我们终于可以一口气将[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]所属的派别一举赶出宫廷了，圣旨已经预好，而失败者将被外派到我们在别国的大使馆中——这样他们就不会再对我们的政策说三道四了。属于[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]的全新时代即将开始。然而，宫廷外的群众并不能了解到宫廷内的变局，然而一旦我们把消息传播出去，必然会引起一系列连锁反应——这可能对我们不利，我们是否要散播[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]下台的消息？"
 sop_austira.12.d_2:0 "随着我们在宫中的势力不断增长，如今我们终于可以一口气将[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]所属的派别一举赶出宫廷了，圣旨已经预好，而失败者将被外派到我们在别国的大使馆中——这样他们就不会再对我们的政策说三道四了。属于[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]的全新时代即将开始。然而，这并不意味着[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]已经完全倒台，他仍然获得着宫廷外广大自由派的支持，这也意味着[SCOPE.sCharacter('old_aus_absolutism_intelligentsia_scope').GetLastName]将可以通过发动一场#variable 群众运动#!来挽回败局，帝国走向了历史的十字路口，而只有旗手才能决定它的未来。"
 sop_austira.12.f_1:0 "对那次故意的说谎，以及没有能哪怕是启动一下事情进程的这种无知，朕追悔莫及。\n———弗朗茨一世"
 sop_austira.12.f_2:0 "对于过去与未来的关系，他透露说，他并不是一个“复辟型”的人。他断言，过去之所以重要，是因为它可以为未来提供警告。对于他而言，当今的这一天，只有作为即将到来的一天的预备阶段才具有价值。他是在为明天而工作：他的精神始终在为未来而奋斗。"
 sop_austira.12.a:0 "封锁消息"
 sop_austira.12.a1:0 "公布消息（革命）"
 sop_austira.12.b:0 "是时候结束政治停滞，彻底改革政府了"
 sop_austira.12.b1:0 "我们还没输，发动群众将[SCOPE.sCharacter('old_aus_absolutism_landowners_scope').GetLastName]赶下台！（革命）"
 sop_austira.13.t:0 "保守派政变！"
 sop_austira.13.d:0 "我们为了缓和国内矛盾的改革已经超出了保守派所能容忍的极限了，对此保守派组织了一次政变，推翻了改革派政府并废除了大量进步改革，我们下次准备改革时最好三思而后行。"
 sop_austira.13.f:0 "正统原则得到了保卫"
 sop_austira.13.a:0 "哼，想进步？"
 sop_austira.14.t:0 "意大利邦联！"
 sop_austira.14.d:0 "经过我们在意大利的多年耕耘，[ROOT.GetCountry.GetAdjective]在意大利的霸权终于得以重新确立。为了进一步巩固我们在意大利的霸权，同时也为了安抚民族主义着们的情绪，我们决定在意大利成立一个意大利邦联以加强意大利各邦国之间的联系。新成立的邦联议会要求我们向他们派遣一位国王，现在有两个选择摆在我们面前，谁将是新的意大利邦联的主人？"
 sop_austira.14.f:0 "悠久的历史以及社会、文化和经济的活力与多样性以各种方式塑造了意大利的人民和土地。意大利的现实无疑是非常复杂的，如果强行要求统一，将使得意大利贫瘠并且受辱。"
 sop_austira.14.a:0 "凯撒的弟弟马克西米利安"
 sop_austira.14.b:0 "托斯卡纳分支的费迪南多四世将担任国王"
 sop_austira.15.t:0 "加利西亚换地协议"
 sop_austira.15.d:0 "来自[SCOPE.sCountry('ger_scope').GetName]向我们发送了一个协议，允许我们以允许波兰人自治来换取它们手里的加利西亚领土，这样不仅能增强我们的实力，同时还能改善我们与[SCOPE.sCountry('ger_scope').GetName]的关系，使我们能更有余力对抗英国人，我们是否要答应签署这份协议？"
 sop_austira.15.f:0 "波兰和乌克兰民族之间的一切历史联系和仇恨，都诞生于这片土地，加利西亚。"
 sop_austira.15.a:0 "好提议，我们接受！"
 sop_austira.15.b:0 "波兰自治？开什么玩笑，我们将用自己的刀剑取得加利西亚！"
 sop_austira.22.t:0 "维也纳环城大道落成"
 sop_austira.22.d:0 "经过我们设计师和工人们多年的努力，我们终于完成了维也纳环城大道的建设，毫无疑问，如今的它已经成为了欧洲最璀璨的明珠。"
 sop_austira.22.f:0 "虽然没有中央规划，但该项目无论在过去和现在都是被评为非常成功的。内政部对规划的影响最大，尤其是弗朗茨·冯·马辛格。他的城市扩张基金为该项目提供资金，因此总是有机会参与规划。城市扩张基金资助了新堡、霍夫堡宫向迈克尔广场的扩建、歌剧院、城堡剧院以及艺术史博物馆和自然历史博物馆。以牺牲国家预算为代价，建造了大学和几座大学附属建筑、几所贸易和中学、美术学院、奥地利艺术与工业博物馆、议会大厦、司法宫、军营和几座邮电大楼。维也纳市政府支付了市政厅，几所小学和公民学校以及一些市场大厅的费用。奉献教堂、证券交易所、几家剧院、许多银行大楼和酒店，当然还有众多的公寓楼都是私人资助的。"
 sop_austira.22.a:0 "永恒的维也纳！"
 aus_struggle_for_power_winner_intelligentsia_tt:0 "帝国将在科罗夫拉特的带领下走向光明的新专制主义时代"
 aus_struggle_for_power_winner_landowners_tt:0 "帝国将在梅特涅的带领下对现有官僚系统进行彻底改革"
 galicia_exchange_tt:0 "我们的俄属波兰和加利西亚将重组为一个新的会议波兰王国"
 Italy_confederation_tt:0 "除了伊斯特拉和南蒂罗尔，我们在意大利的其他领土和附庸都将被吞并.如果持有威尼西亚或伦巴第领土，两地不会加入意大利邦联"
 coup_event.1.tt:0 "改革失败了，但也许改革并不是唯一的出路？"
 habsburg_formed_germany:0 "我们成功统一德意志"
 habsburg_not_candidate:0 "我们失去了德意志统一领导权后即可组建奥匈帝国"
#万国之春事件#########################################################################################################################################################################
 1848_austria_events.1.t:0 "[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]革命"
 1848_austria_events.1.d:0 "[SCOPE.sCountry('fra_scope').GetName]革命取得胜利的消息传开后，包括[SCOPE.sCountry('aus_scope').GetName]的整个欧洲也接连爆发起义活动。下奥地利领地的[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant]于1848年3月3日在维也纳举行集会，务求举行一个可产生“更爱国兼有启蒙性的代议机构”的[concept_election]，同时要求保守的政府总理兼外交大臣[SCOPE.sCharacter('landowners_leader_scope').GetLastName]亲王下台。3月13日发生了[concept_revolution]运动及街垒战，市民和大学生为了对抗[SCOPE.sCountry('aus_scope').GetName]军队自发组织了国民警卫队和学院团，为了平息群众情绪，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]被迫罢免了[SCOPE.sCharacter('landowners_leader_scope').GetLastName]的首相职务，第二天[SCOPE.sCharacter('landowners_leader_scope').GetLastName]便狼狈得男扮女装逃往英国。面对团结的革命者，帝国政府不得不做出让步，由[SCOPE.sCharacter('intelligentsia_leader_scope').GetLastName]伯爵主持的[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant]内阁如今已经接管了权力，至于他们接下来会如何塑造[SCOPE.sCountry('aus_scope').GetName]，我们不得而知。"
 1848_austria_events.1.f:0 "[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]像被施了魔法一般，事情的整个方向改变了……街上的[GetLawType('law_secret_police').GetName]都消失了。书店的橱窗里摆满了禁书——那些禁书好像久不见天日的罪犯。小男孩儿在城市各处叫卖关于[concept_revolution]的演讲稿、诗歌和印刷品，它们是新闻自由的第一批作品。同时，刚刚武装起来的市民组成了国民卫队，同常备军并肩行进，他们一同保卫着公共安全。\n——斯泰尔斯"
 1848_austria_events.1.a:0 "何意百炼刚，化为绕指柔"
 new_Liberal_party_tt:0 "[Concept('concept_ruler','$RULER_TITLE_KAISER$')]将任命一届自由派内阁"
 1848_austria_events.2.t:0 "皮勒斯多夫宪法"
 1848_austria_events.2.d:0 "为了安抚躁动的自由派，我们的内政部长#yellow 皮勒斯多夫#!男爵于1848 年4月25日颁布了1848革命以来的第一部帝国宪法，即皮勒斯多夫宪法（Pillersdorfsche-Verfassung）又称四月宪法，它呼吁采取两院制，即由选举产生的众议院和参议院组成的帝国议会（Reichsrat），一旦宪法通过，愤怒的民众将得到安抚。我们是否要决定暂时批准此宪法，直到制宪会议的召开？"
 1848_austria_events.2.f:0 "王权的叙事一旦改易将是永久的毁灭，这群暴民今天敢利用宪法拴住我们的[Concept('concept_ruler','$RULER_TITLE_KAISER$')]，明天怕不是就会把皇宫掀了。我们决不能让他们得逞。保守派的施瓦茨堡亲王开始了他的演讲，但很快就被温和派的#yellow 韦森伯格#!男爵的一系列问题打断，例如，在首都军队失能且革命者还掌控着国民警卫队的时候，我们应该拿什么来应对群众的怒火；如何处理拒绝立宪后在全国境内引发的动乱等。两派争吵不休，但时间已经不多了，王宫内外的人们都在等待着他们的回复"
 1848_austria_events.2.a:0 "现在已经没有时间犹豫了，立即批准宪法"
 1848_austria_events.2.b:0 "只要有保可守，哪怕发明传统"
 1848_austria_events.3.t:0 "布拉格革命"
 1848_austria_events.3.d:0 "布拉格的局势因为维也纳的混乱而即将失控！我们在捷克的驻军司令是[SCOPE.sCharacter('army_leader_scope').GetFirstName]已经回到了布拉格以试图控制局面，针对布拉格可能出现的巷战而制定了相应的作战计划。目前布拉格的形势已经十分严峻，我们是批准[SCOPE.sCharacter('army_leader_scope').GetFirstName]镇压布拉格的计划，还是该向捷克人妥协？"
 1848_austria_events.3.f:0 "在布拉格的捷克分离运动愈演愈烈之时，为了对抗德意志民族主义者，激进的捷克大学生也相应的组织了“斯拉夫同盟”，其口号是“自由、平等”。同盟还建立了军事小组，准备进行武装起义。为了平息群众情绪，地方议会主席图恩伯爵宣布将召开捷克议会并进行议会选举，但当维也纳五月起义胜利的消息传来时，为了防止局面失控，他便在捷克民主派的建议下于5月30日宣布成立捷克临时政府。新成立的临时政府宣布依然效忠奥地利[Concept('concept_ruler','$RULER_TITLE_KAISER$')]，不承认维也纳五月起义后成立的新政府。临时政府的成立引起了部分自由派的不满，他们成立了自己的委员会，并与维也纳起义者建立了密切联系，同时也吸纳了大量捷克工人、手工业者和农民，准备发动起义。"
 1848_austria_events.3.a:0 "是时候让捷克人回忆下扬·胡斯的下场了"
 1848_austria_events.3.b:0 "我可不想变成第二个被扔下窗户的人"
 1848_austria_events.4.t:0 "制宪会议召开"
 1848_austria_events.4.d:0 "在1849年3月的第一周，克罗梅日什宪法完成。它的特点是许多自由和进步的改革，包括建立君主立宪制，建立民选议会，使所有民族在仁慈的哈布斯堡君主制下取得平等地位等。然而，克罗梅日什宪法的很多条款都于我们的正统原则相抵触，其中的权力来源于人民等原则更是大逆不道，但这并不是唯一的选择：由内政部长沃特豪森主编的三月宪法在理念和内容上都更加保守，更符合我们哈布斯堡开明君主统治的需要，是个合适的替代品。现在我们是选择尊重议会的意愿，承认克罗梅日什宪法，还是为正统原则着想，选择更保守的三月宪法呢？"
 1848_austria_events.4.f:0 "第一届民选的帝国会议于6月选举产生，并于7月召开会议。帝国议会最开始在维也纳召开，但后来为了避免维也纳起义后维也纳的戒严令而搬迁至克罗梅日什。"
 1848_austria_events.4.a:0 "批准克罗梅日什宪法"
 1848_austria_events.4.b:0 "以三月宪法取代之"
 1848_austria_events.5.t:0 "[GetLawType('law_serfdom').GetName]问题"
 1848_austria_events.5.d:0 "自打革命一开始，[GetLawType('law_serfdom').GetName]的存续问题就一直是议会讨论的焦点。对于自由派，废除农奴制有助于他们启蒙理念理想国的实现；对于保守派来说，废除农奴制可以缓解农民的不满，并使农民倒向保守派，增强保守派的实力。虽然已经通过了土改的决议，但具体落实还是个值得商榷的问题，我们将选择"
 1848_austria_events.5.f:0 "7月24日，年轻的[SCOPE.sCharacter('aus_rural_folk_ig_leader_scope').GetFirstName]成为了帝国议会中最年轻的代表。当选次日，[SCOPE.sCharacter('aus_rural_folk_ig_leader_scope').GetLastName]就迫不及待地提出了一项法案，希冀君主国农民能够彻底摆脱[GetLawType('law_serfdom').GetName]的奴役。该法案最终给予他“农民解放者”的称号。即使[SCOPE.sCharacter('aus_rural_folk_ig_leader_scope').GetLastName]不能消除所有的[GetLawType('law_serfdom').GetName]残余，法案还是取得了成功，使得君主国在这个方向上向前迈进了一大步.有关法案于1848年9月1日敲定，将农民们从领主的管辖权中解放出来， 而政府也会和农民分摊一半原体制下其所负担的徭役金,地役权和徭役义务的赎偿费用。[Concept('concept_ruler','$RULER_TITLE_KAISER$')]正式于9月7日签署该废止[GetLawType('law_serfdom').GetName]的法案。"
 1848_austria_events.5.a:0 "老爷们的好日子到头了"
 1848_austria_events.5.b:0 "为了拉拢老农，咱再多苦一苦老爷吧"
 1848_austria_events.6.t:0 "法兰克福会议发来的邀请"
 1848_austria_events.6.d:0 "位于美因河畔法兰克福的德国国民议会已经向我们发出了参会邀请。作为诚意，我们的约翰大公被选为临时帝国领导人，我们是否要接受他们的邀请，派出代表参加会议？"
 1848_austria_events.6.f:0 "在维也纳和柏林的革命胜利之后，自然就产生了召开全德代表会议的问题。在巴登大公国的海德堡，一群自由主义人士计划选举德意志国民议会。这个议会的雏形在3月31日于法兰克福自由市的圣保罗教堂内确定，议会的成员要求自由选举出一个全国性的议会，并得到了德意志各邦的一致同意。这个机构就是所谓的美因河畔法兰克福的德国国民议会。"
 1848_austria_events.6.a:0 "俺们是骄傲德意志的一员，俺们去！"
 1848_austria_events.6.b:0 "我才不要听那帮书呆子的使唤！"
 1848_austria_events.7.t:0 "[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]之围"
 1848_austria_events.7.d:0 "帝国政府对立宪的含糊其辞并没有让#red 激进派#!满意，双方的冲突愈演愈烈。随着帝国政府开始向首都调集军队，意识到了镇压即将到来的#red 激进派#!在[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]独自发动了一场绝望的革命，由于人手的不足和立宪派的反对，他们根本不是装备精良的帝国军队的对手。\n经过数日激战，[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]已被我们重新夺回，主要领导人也被我们逮捕，现在将由我们来决定他们的命运。"
 1848_austria_events.7.f:0 "当军队正在准备离开[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]，前去镇压[concept_magyar]的叛乱时，一群同情[concept_magyar]的工人、学生及哗变士兵则试图阻止军队出发。事件随后升级为街头乱战，圣斯德望主教座堂发生流血事件，奥地利战争大臣#yellow 提奥多尔·弗朗茨#!遭暴民私刑处决。[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]城防司令阿道夫被迫撤空全城，但之后他本人则和军队一同在城外的坚固据点掘壕据守。10月7日，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]在[SCOPE.sCharacter('army_leader_scope').GetFirstName]的护卫下携廷臣逃到了奥洛穆茨。两周后，帝国议会也搬到了克罗梅日什。10月26日，在[SCOPE.sCharacter('army_leader_scope').GetFirstName]将军和#yellow 约西普·耶拉契奇#!伯爵的指挥下，奥地利和克罗地亚军队开始炮轰[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]，并于31日攻入市中心。战后，除贝姆成功脱逃以外，其余包括#yellow 罗伯特·布卢姆#!在内的所有起义领袖均被帝国政府俘获。他们在日后的审判中均被帝国政府宣判死刑。"
 1848_austria_events.7.a:0 "处决他们！一个不留！"
 1848_austria_events.7.b:0 "把他们流放就足够了"
 1848_austria_events.8.t:0 "帝国议会被解散"
 1848_austria_events.8.d:0 "在维也纳爆发十月革命后，帝国议会便已经迁往克罗梅日什以规避维也纳的戒严令，然而随着自由派运动被镇压，通过群众运动来维系的议会已经失去了其存在的政治基础。首相施瓦尔岑堡亲王已经向皇帝请示————是时候结束这场闹剧了。如今，议会的命运掌握在我们手中，是选择一劳永逸解散议会；还是允许议会象征性存在？"
 1848_austria_events.8.f:0 "这些阁员是些什么人？他们并不是奥地利政府！奥地利现在就只存在于我的军营中；我和我的军队就是奥地利；等将来我们把意大利人打败，我们就要为皇帝夺回帝国！\n——拉德茨基"
 1848_austria_events.8.a:0 "这群只会吵嘴的花架子早该滚蛋了"
 1848_austria_events.8.b:0 "让他们留在这吵嘴吧，反正再也不会有人会听他们的了"
 1848_austria_events.9.t:0 "自由派内阁再次倒台"
 1848_austria_events.9.d:0 "由于人民对现政府的不信任，我们的自由派政府再次面临倒台的危机，我们是应该选择想办法挽救现政府，还是重新任命一届新政府？"
 1848_austria_events.9.f:0 "在48年革命中，由于政局的动荡和各派系的激烈斗争，新建立的自由派政府执政时间通常十分短暂：从3月至11月，奥地利一共出现了五个短命的自由派政府。"
 1848_austria_events.9.a:0 "挽救现政府"
 1848_austria_events.9.b:0 "不换思想就换人！"
 1848_austria_events.10.t:0 "自由派运动分裂"
 1848_austria_events.10.d:0 "看似团结一致的革命派内部已经出现了一些裂痕，部分自由派贵族和知识阶层满足于既有的宪制秩序，和运动中较激进的学生和工人群体产生对立。6至7月间举行的帝国议会大选则使得保守派和温和自由派的代表们胜出占据议会大多数席位。而激进派因为缺少达到财富标准的选民的支持在大选中落败，这更加剧了革命派内部的对立情况。无论如何，革命派内部实际上已经陷入分裂。"
 1848_austria_events.10.f:0 "三月革命的胜利是各进步阶层联合的结果。各阶级的联合虽然在某种程度上说总是一切革命的必要条件，这种联合却不能持久——一切革命的命运都是如此。一当战胜共同的敌人之后，战胜者之间就要分成不同的营垒，彼此动起武来。"
 1848_austria_events.10.a:0 "想办法弥补分裂"
 1848_austria_events.10.b:0 "这群革命者自己放着就垮了"
 1848_austria_events.11.t:0 "劳工领袖被逮捕"
 1848_austria_events.11.d:0 "工人运动在三月革命之后就层出不穷。近日，我们的国民警卫队在一次突击行动中逮捕了几位预谋起事的劳工领袖，并将他们移交送审，现在我们该拿他们怎么办？"
 1848_austria_events.11.f:0 "革命的成功并没有给广大劳工阶层带来什么实际上的好处————经济未见起色， 失业和通货膨胀状况也有所恶化，中小企业处于破产边缘，而这一切使得之后的劳工运动趋于激进化，工人们寻求更激进的政治改革和社会改革，而这与自由派寻求有限政治改革的目标相冲突。三月革命成功后，新成立的国民警卫队立即被用于镇压此起彼伏的劳工运动，而学院军团和安全委员会对此均保持沉默。"
 1848_austria_events.11.a:0 "让他们的余生都在流放地里度过！"
 1848_austria_events.11.b:0 "没事，下辈子学聪明点就行"
 1848_austria_events.12.t:0 "学生运动"
 1848_austria_events.12.d:0 "在审查制度被废除后，帝国各大城市的学生运动已经变得肆无忌惮。帝国政府曾多次试图取缔这些学生组织，但都以失败告终。在最近的一次示威活动中，我们逮捕了多位闹事学生，可对于如何处置他们警察却犯了难，如果把他们关起来，我们势必会招来学院中央委员会的不满，如果放他们走，又可能会加剧目前局势的动荡。选择权在我们手中。"
 1848_austria_events.12.f:0 "“冲散人群!逮捕几个领头的学生。”“然后呢?”有不满的警员在嘈杂混乱的街道上中大声反问，”那学院中央委员会怎么说?难道说我们要抓了再放吗?那我们抓他们的意义是什么?!”“先生们，政府试图取缔这些学生组织，但他们失败了，然后将担子推给了我们。但是....我们也可以将选择权推给上面，怎么处置学生让那些长官们去选择!”"
 1848_austria_events.12.a:0 "我已经忙的焦头烂额了，我才不要管上面的学生委员会！"
 1848_austria_events.12.b:0 "学生委员会？把他们关起来！我才不在乎！"
 1848_austria_events.13.t:0 "德意志民族主义者与斯拉夫民族主义者之间发生冲突"
 1848_austria_events.13.d:0 "虽然这两种思潮都与我们帝国的多元主义政策相悖，但我们可以选择支持其中一派，让他们狗咬狗，再趁他们因内斗虚弱时一网打尽。现在我们是应该选择支持德意志民族主义者呢，还是该选择支持斯拉夫民族主义者呢？"
 1848_austria_events.13.f:0 "[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]爆发革命之后，泛斯拉夫主义就一直在波西米亚和克罗地亚的革命者之间转播。然而，这也不可避免的与支持法兰克福会议精神的德意志民族主义相冲突————在德意志人和斯拉夫人的混居区波西米亚，这种冲突尤为激烈。在布拉格，德意志民族主义者和斯拉夫民族主义者各自组织了宪法同盟和斯拉夫同盟来宣传自己的思想，并爆发了激烈冲突"
 1848_austria_events.13.a:0 "德意志的爷就是爷"
 1848_austria_events.13.b:0 "我一直都是斯拉夫人的好盟友啊"
 1848_austria_events.14.t:0 "帝国敕令"
 1848_austria_events.14.d:0 "自从帝国议会被解散和匈牙利的暴动被平定，自由派用来抵抗帝国权威的最后手段也已经被帝国瓦解。现在是时候由我们的[SCOPE.sCharacter('new_aus_absolutism_scope').GetFirstName][Concept('concept_ruler','$RULER_TITLE_KAISER$')]来亲自结束这场闹剧了。在[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的旨意下，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]陛下忠诚的内政部长#yellow 亚历山大·冯·巴赫#!主持撰写了帝国敕令——用以取代早已失能的帝国宪法。各省的贵族等级会议被废除，[Concept('concept_ruler','$RULER_TITLE_KAISER$')]之后将完全依靠其官僚机构、警察和军队的权威去推行自己的皇帝意志,不会再有任何代议机构和地方势力阻挡[Concept('concept_ruler','$RULER_TITLE_KAISER$')]的步伐了。革命话语下的虚伪乌托邦已经被扫进了历史的垃圾堆，而只有[Concept('concept_ruler','$RULER_TITLE_KAISER$')]和他忠诚的国家机器才能带领帝国走向现代化，走向繁荣！"
 1848_austria_events.14.f:0 "罗马不是一天筑成，好东西都需要时日。\n今天不来，明天一定来到，栎树都是慢慢地生长，\n罗马人有一句谚语：谁走得慢，就走得稳当\n——海涅"
 1848_austria_events.14.a:0 "帝国万岁！[SCOPE.sCharacter('new_aus_absolutism_scope').GetFullName]万岁！绝对主义万岁！"
 revolution_end_tt:0 "我们将在巴赫男爵和施瓦尔岑堡公爵的帮助下逐步建立起新绝对主义"
 1848_austria_events.15.t:0 "帝国政府让步，立宪派胜利"
 1848_austria_events.15.d:0 "随着新的帝国宪法在民众的压力下被批准通过，这场浩浩荡荡的人民革命终于以立宪派的胜利告终。尽管保守派曾多次试图破坏我们的革命果实，但宪政党人每次都能团结起来瓦解他们的阴谋。新的#variable 帝国宪法#!在之前克罗梅日什宪法的基础上进一步确保了言论和个人自由，并强调了宪法至高无上的地位。新组建的民选的#variable [concept_aus_reichsrat]#!将成为帝国的立法机构，与[Concept('concept_ruler','$RULER_TITLE_KAISER$')]分享权力。反动独裁的日子已经成为过去，未来将是我们自由帝国的新时代！"
 1848_austria_events.15.f:0 "这是德意志人民从反动政府手中逃出的日子，也是德意志人民掌握自己命运的日子。\n——弗里德里希·埃伯特"
 1848_austria_events.15.a:0 "帝国万岁！[SCOPE.sCharacter('new_aus_liberal_scope').GetFullName]万岁！自由万岁！"
 1848_austria_events.16.t:0 "帝国解体"
 1848_austria_events.16.d:0 "共和制度的确立对于维也纳的激进派来说确实是自由的伟大胜利——但也仅限于此。帝国的绝大多数臣民早已习惯了哈布斯堡的统治而不知共和为何物。君主制的废除几乎立刻就引起了全国范围内的大骚乱，多地都爆发了拥护哈布斯堡的保皇派叛乱。正当新成立的共和政府被国内动荡弄得焦头烂额时，波西米亚、匈牙利等多地地方议会宣布新的共和政府由于缺少哈布斯堡君主而涉嫌违宪，纷纷宣布脱离帝国。混乱的共和政府无力镇压，只能眼睁睁看着曾经的帝国土崩瓦解，无论这个帝国有着什么样的辉煌，如今的它也已沦为了历史的尘埃。"
 1848_austria_events.16.f:0 "长期来看，激进派也许是对的，但短期看来，在他们还无法通过和平手段达到目的时候，他们用暴力的方式破坏了宪政和新生的代议制政府。他们让建立一个温和的自由政府这件事变得不可能——弗兰克·艾克"
 1848_austria_events.16.a:0 "早知如此，何必当初"
 1848_austria_events.18.t:0 "圣马可共和国"
 1848_austria_events.18.d:0 "帝国宣布立宪的消息已经撼动了沉寂的意大利。在威尼斯，激进分子们和市民们联合起来赶走了我们的总督，并宣布成立了[SCOPE.sCountry('smr_scope').GetName]共和国。为了避免城市遭受进一步损坏，帝国军队暂时撤出了威尼斯城。"
 1848_austria_events.18.f:0 "3月17日，劳埃德轮船从的里雅斯特带来了[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]发生革命的消息。一群人浩浩荡荡穿过圣马可广场，要求释放政治犯#yellow 达尼埃莱·马宁#!和#yellow 尼科洛·托马赛奥#!。随后市民们攻入市长的住宅和监狱将两人救出。3月18日，威尼斯竖起了木桩和三色旗，并组织了一支由2000多人组成的自卫队。3月22日，马宁带领着公民卫队成员在工人的帮助下迫使军队投降并接管了武器库。随后，公民卫队的一支队伍轻而易举地攻下了在圣马可大教堂前排列的大炮。这些炮口随即转向总督的宫殿。#yellow 马宁#!的追随者戴着红色的雅各宾帽，铺展着一面巨大的三色旗帜。#yellow 马宁#!站在花神咖啡馆外面的桌子上，大声喊道：“#variable 共和国万岁！圣马可万岁！#!”威尼斯议员中唯一一位共和主义者、直言不讳的律师#yellow 阿韦萨尼#!要求所有的非意大利军队都撤出威尼斯，交出所有堡垒、军火、武器和资金。愤怒的总督#yellow 帕尔菲#!辞去总督职务，将控制权移交给奥地利驻军司令#yellow 费迪南德·齐奇#!。出于对这座城市的热爱，他摒弃了摧毁威尼斯的想法，他于下午向政府交出控制权，领导权落到了威尼斯人手中。在3月23日凌晨，#yellow 马宁#!被选为[SCOPE.sCountry('smr_scope').GetName]临时政府总统。皇家军队放弃了这个城市。维也纳的一份官方报道也公开宣称“威尼斯陷落了。”"
 1848_austria_events.18.a:0 "威尼斯人还是欠拷打了"
 1848_austria_events.18.b:0 "共和国万岁！圣马可万岁！"
 1848_austria_events.19.t:0 "米兰五日"
 1848_austria_events.19.d:0 "帝国宣布立宪的消息已经在意大利激起了一系列连锁反应，米兰人在经过数天的激战后赶走了我们的守军，并宣布成立了[SCOPE.sCountry('mln_scope').GetName]共和国，我们在米兰的守军司令拉德斯基已经向我们请求下一步的指令，现在我们应该怎么办？"
 1848_austria_events.19.f:0 "3月17日，#yellow 梅特涅#!下台和[Concept('concept_ruler','$RULER_TITLE_KAISER$')]承诺立宪的消息传到了米兰，对奥地利人来说，局势变坏了。那晚，自由主义反对派领导者们在一起商议如何进行回应。作为预防措施，米兰的驻军司令#yellow 拉德茨基#!命令他的部下准备战斗，在城门上增设炮兵，并加强了城墙的警卫。3月18日，口号响了起来：“男人到街上，女人到窗边！”大约1.5万人参与了游行，还有无数的人欢呼着，朝他们挥舞象征着意大利三色的手帕。#yellow 拉德茨基#!随即在大街上布设军队开始反击。很快米兰人便开始在这座古城狭窄的街道上匆匆建起街垒，双方展开血腥的巷战。3月21日，#yellow 拉德茨基#!派遣一名官员去参加停战谈判，#yellow 卡萨蒂#!犹豫不决，因为他在这个契约中看到一个机会，他可以为撒丁国王赢得时间，实现他一直以来的愿望——派军队对抗奥地利人。3月22日，米兰人攻占了托萨门，#yellow 拉德茨基#!的围城被攻破了，从伦巴第其他地区赶来的起义者涌入城市。现在，#yellow 拉德茨基#!不得不应对迫在眉睫的皮埃蒙特人入侵和北部山区农民的叛乱。为了避免在城市被敌军联合包围，#yellow 拉德茨基#!下令撤退。"
 1848_austria_events.19.a:0 "命令#yellow 拉德茨基#!将军撤到四角防线，并用炮火轰炸米兰城！"
 1848_austria_events.19.b:0 "现在我们暂时抽不开身，命令#yellow 拉德茨基#!将军撤出意大利"
 1848_austria_events.19.tt:0 "米兰人将试图寻求撒丁的干预"
 1848_austria_events.20.t:0 "来自米兰的革命者请求我们干涉"
 1848_austria_events.20.d:0 "自米兰爆发了革命后，我们一直都在密切关注局势进展。3月19日，来自[SCOPE.sCountry('mln_scope').GetName]的革命者#yellow 马丁尼#!和#yellow 达达#!与我们的国王[SCOPE.sCharacter('sar_ruler_scope').GetFirstName]进行了会谈，要求提供军事援助来应对[SCOPE.sCountry('aus_scope').GetName]。国王本来就有吞并伦巴第和威尼西亚的野心，而他也面临来自皮埃蒙特激进派的挑战，他们扬言，如果国王不助力意大利的统一事业，派军攻打奥地利人，他们就发动革命。现在选择权在我们手里，我们是否要派兵帮助米兰的革命呢？"
 1848_austria_events.20.f:0 "面对伦巴第和维也纳事件，犹豫、怀疑和拖延是不可取的，是最令人失望的政策。我们是头脑清醒的人，习惯于听从理性的指令而非内心的冲动，经过逐字逐句的思索，我们现在必须恳切地宣布我们的国家、我们的政府、我们的国王只有一条出路——战争！如果我们不能及时行动，我们必将遭遇不幸！\n——加富尔"
 1848_austria_events.20.a:0 "为了自由意大利，前进！"
 1848_austria_events.20.b:0 "哈？什么意大利解放？我不到啊"
 1848_austria_events.21.t:0 "帝国军队被赶出意大利"
 1848_austria_events.21.d:0 "虽然我们的将士英勇战斗，但意大利革命者的军队还是将我们驱赶出了伦巴第，我们不得不承认，这个帝国最富饶的省份已经落入到了敌人手中。"
 1848_austria_events.21.f:0 "永别了，美丽的意大利"
 1848_austria_events.21.a:0 "唉"
 1848_austria_events.22.t:0 "我们取得了意大利统一战争的胜利"
 1848_austria_events.22.d:0 "经过我们将士们的英勇奋战，我们终于将伦巴第从哈布斯堡豺狼的手中解救了出来，但意大利的未来仍不明晰，共和主义者与君主主义者之间，统一主义者和自治主义者的冲突随着战争结束而愈演愈烈，如果我们不解决这些问题，可能会导致一场严重的政治危机"
 1848_austria_events.22.f:0 "马志尼和卡塔内奥的本质区别在于他们优先考虑的事情不一样。马志尼想要争取民族统一，即便这意味着要推迟建立民主共和国。卡塔内奥本质上是忠于伦巴第的，所以他认为赢得伦巴第的政治自由比民族统一的梦想更重要。"
 1848_austria_events.22.a:0 "前路漫漫"
 1848_austria_events.23.t:0 "我们输掉了意大利统一战争"
 1848_austria_events.23.d:0 "随着我们在几次重大会战中遭遇了惨败，如今我们的军队已经四散奔逃，纪律崩溃。无论如何，我们现在已经无力阻挡奥地利军队的前进，只能向奥地利屈辱求和。而我们的国王[SCOPE.sCharacter('ruler_scope').GetFirstName]则面临着失去王位的危险。奥地利可能侵占王国领土，国内民主派则欲颠覆王权。有谣言说，[SCOPE.sCharacter('ruler_scope').GetFirstName]国王拒绝宪法，将港口拱手让给奥地利人。这个不实的消息传到了热那亚，当地暴乱四起。不过热那亚的反叛很快就被从诺瓦拉撤回的国王军队镇压下去。\n\n在此危急时刻，我们是否要让老国王退位以避免王朝遭受更多灾难？"
 1848_austria_events.23.f:0 "我的决定是我深思熟虑的结果。从这一刻起，我不再是国王;国王是维克多，我的儿子。\n——卡洛·阿尔贝托"
 1848_austria_events.23.a:0 "老登早该下台了"
 1848_austria_events.23.b:0 "孩子们，我还不想肘"
 1848_austria_events.23.tt:0 "我们的国王将下台以平民愤"

 je_habsburg_italy:0 "哈布斯堡意大利"
 je_habsburg_italy_reason:0 "#variable 意大利#!，地中海的明珠，以悠久的历史和多元的文化为荣。然而，一股新的统一思潮正在兴起，一群疯子和野心家试图摧毁古老意大利的#yellow 文化传统#!和#yellow 现有秩序#!，并通过武力征服和暴动将整个意大利强行拧成一个国家。\n\n哈布斯堡家族与意大利有着很深的渊源，通过对#yellow 米兰公国#!和对#yellow 托斯卡纳大公国#!等核心要地的控制和对意大利人#variable 自治传统的尊重#!，我们一直都对意大利有着很强的影响力。为了保卫我们在意大利的利益，同时也为了保卫意大利各邦国人民的传统不受侵害，我们有必要在意大利地区找到自己的盟友。幸运的是，在帝国统治下的#yellow 伦巴第#!和#yellow 威尼西亚人#!有着强烈的#variable 地域认同感#!，他们主要关心的是他们的#yellow 自治#!，并不特别关心泛意大利主义，这意味着我们可以通过给予他们更多的自治权确保他们的忠诚。\n\n#variable 意大利人民终将清楚一个事实，那就是只有哈布斯堡才是各社区的文化传统和历史的真正捍卫者！#!"

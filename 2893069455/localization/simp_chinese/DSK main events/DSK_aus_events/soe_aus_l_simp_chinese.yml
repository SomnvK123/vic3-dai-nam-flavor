 je_European_Restoration:0 "三月时期"
 je_European_Restoration_reason:0 "以上#tooltippable;tooltip:[Country.GetTooltipTag],je_European_Restoration_tooltip_advance 进步法律#!将增加进步法律的进度条，如果进步法律值超过保守法律，保守派将对我们发动政变！\n\n#variable 三月前时代（Vormärz）#!是1848年德意志联邦各州三月革命之前德国历史上的一个时期。在国际上被称为梅特涅时代，在德国境内，它的特点是奥地利和普鲁士在德意志联邦内占主导地位。奥地利和普鲁士都在国内建立了专制的#variable 警察国家#!，并迫使其他德国国家也这样做。这些专制政权以前所未有的规模实行#variable 审查和大规模监控#!，以回应温和的改良主义者对自由主义、君主立宪制和德国统一的呼吁，以及更激进的、革命性的共和主义和普选权的呼吁。我们必须#variable 避免任何形式的进步改革#!，否则保守派可能会行动确保传统和秩序的维持。"

 je_1848_aus_italian_uprisings_reason:0 "如今米兰和威尼斯已经脱离了帝国的掌控，我们必须想办法将它们夺回。值得庆幸的是，我们的拉德茨基将军已经在维罗纳一带的残余控制区建立了一个四角防线稳住了阵脚，只要援军能到达，我们就能一鼓作气平定意大利人的叛乱"

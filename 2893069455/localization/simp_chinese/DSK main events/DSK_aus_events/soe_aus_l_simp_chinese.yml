 aus_liberal_seat_tooltip_advance:0 "#bold 以下原因将每月增加席位：#!\n•#variable 领袖意识形态是奥地利立宪主义，激进主义，民主主义或市场自由主义其中一个的[Concept('concept_interest_group', '$concept_interest_groups$')]的[concept_clout]大于10#!\n•#variable [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant]的[concept_clout]举足轻重。\n•#variable [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant]的[concept_clout]举足轻重。#!\n\n#bold 以下原因将每月减少席位：#!\n•#variable 其他政党正在增加议席。#!"

 je_aus_political_movement_reason:0 "进度条会显示当前最占优势的#variable 政治思潮#!的影响力。\n#blue 反犹主义#!影响力：#variable [ROOT.GetCountry.MakeScope.Var('aus_political_movement_right').GetValue|0]#!点\n#red 社会主义#!影响力：#variable [ROOT.GetCountry.MakeScope.Var('aus_political_movement_left').GetValue|0]#!点\n\n今时不同往日，随着[concept_election]的扩大，中下层群众被纳入了原来只有精英才能享受的政治生活中，而一些原先被精英们抵制的激进思想也开始在底层群众中找到了土壤，如[concept_aus_christian_social]所提倡的#blue 反犹主义#!和[concept_aus_socialist]所提倡的#red 社会主义#!思想。这两种思潮正撕裂着[ROOT.GetCountry.GetAdjective]政坛和社会。我们可以谨慎对待这两股思潮，避免它们掀起更大的风浪，也可以利用它们来实现我们的政治目标。无论如何，我们必须接受大众政治正改变着[ROOT.GetCountry.GetAdjective]这一事实。"

 german_unification_war:0 "德意志统一战争"
GER_unification_war_decision:0 "德意志统一战争"
 GER_unification_war_decision_desc:0 "对于那些与我们关系较差而不愿加入统一的德意志小邦，我们应该用武力使其屈服。"
 GER_unification_war_decision_possible_tt:0 "存在一个相邻的有$north_german$或$south_german$主流文化，[concept_rank]等级低于我们，[concept_state]不超过3个，与我们不在同一[concept_market]，与我们关系低于$relations_neutral$或者[concept_overlord]与我们关系低于$relations_cordial$，且自身和[concept_overlord]都与我们没有$TRUCES$的小国作为目标。"
 prussian_reform_action:0 "军事改革"
 prussian_reform_action_reason:0 "也称为毛奇改革。主张创立大规模的总参谋部体制，把技术革命引入战争，对总参谋部军官进行教育和训练，战前极其详尽和周密地规划和拟订作战计划。"
 prussian_reform:0 "普鲁士改革"
 prussian_reform_desc:0 "也称为毛奇改革。主张创立大规模的总参谋部体制，把技术革命引入战争，对总参谋部军官进行教育和训练，战前极其详尽和周密地规划和拟订作战计划。"
je_junkers_heer_krupp:0 "三呼万岁"
je_ruhr_boom:0 "鲁尔区工业"
dsk_prussia.1.t:0 "工业的发展"
dsk_prussia.1.d:0 "如果我们要统一德意志，就一定离不开德意志的工业，强大的工业是我们复兴的土壤！"
dsk_prussia.1.a:0 "我们必须建设现代化工业强国！"

dsk_prussia.2.t:0 "三呼万岁！"
dsk_prussia.2.d:0 "自神圣罗马时代以来，阿尔萨斯-洛林就是德意志神圣不可分割的一部分，如今它成功回到德意志怀抱，我们终于宣告伟大的德意志成立！从马斯到默默尔，从埃施到贝尔特，德意志，德意志，高于一切，高于世间所有万物。德意志，德意志，高于一切，高于世间所有万物"
dsk_prussia.2.a:0 "德意志，高于一切！"


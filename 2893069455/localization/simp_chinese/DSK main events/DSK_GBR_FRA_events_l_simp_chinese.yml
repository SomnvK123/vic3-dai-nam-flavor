pax_britannica_events.0.d:0 "不列颠全球霸权的顶峰已经到来。今天是我们的日子  至少暂时是。我们有责任确保世界各地的和平与稳定"
pax_britannica_events.88.d:0 "不列颠全球霸权的顶峰已经到来。他们已经自行决定在他们的指导下确立新的全球秩序。"

dsk_france.17.d:0 "随着战争的结束，[SCOPE.GetRootScope.GetCountry.GetName]彻底确立了在欧陆上的主导地位"
dsk_france.17.f:0 "那一刻，我仿佛回到了我祖父拿破仑一世耶拿之役的现场，我既要铸造他创造过的辉煌，还要完成他未尽之事——即在欧洲大陆上创造一个耀眼的法兰西"
dsk_france.17.a:0 "天命所在，战无不胜"
modifier_fra_winner:0 "天命所归"
dsk_france.19.t:0 "新《拿破仑法典》"
dsk_france.19.d:0 "这部法典，全称为《法国民法典》，最初由拿破仑·波拿巴在1804年颁布，并在其后的历史中经历了多次修订，但基本框架和原则保持不变"
dsk_france.19.f:0 "通过对私有财产权、婚姻制度、继承权等方面的规定进行微调或补充，《拿破仑法典》散发出与时俱进的时代魅力"
dsk_france.19.a:0 "这是国家民法的重要基石"
dsk_france.21.t:0 "国家工场"
dsk_france.21.d:0 "一份政府刊物刊登了一项法令。根据该法令，所有入职国家工场的18至25岁的单身工人都必须入伍，其余人等要么失业，要么去做土地开垦工作。解散给115000名工人提供工作的国家工场激怒了人们，他们开始建立街垒，很快就打响了第一枪。与此同时，国民议会开会讨论了国家工场的问题。许多代表主张立即关闭工场，因为这些工场已威胁到了公共秩序。"
dsk_france.21.f:0 "“只有人人各尽所能，各取所需，平等才会存在。” ‑路易·勃朗"
dsk_france.21.a:0 "应该解散这些工场,有必要让巴黎工人放心。"
dsk_france.21.b:0 "不要问国家为你做了什么，要想想你能为国家做什么"
dsk_france.22.t:0 "[SCOPE.sState('irish_state').GetName]起义"
dsk_france.22.d:0 "反对复辟帝国的工人占领了[SCOPE.sState('irish_state').GetName]的大部分地区，击退了国民警卫队的分遣队。[SCOPE.sCharacter('bourgeoisie_leader').GetFullName]呼吁国民议会和忠诚的军队撤离巴黎以准备进攻[SCOPE.sState('irish_state').GetName]，但这个提议被拒绝了。在取得重大胜利并面临政府军的顽固抵抗后，叛军停了下来。第二天，政府军的攻势开始了，[SCOPE.sCharacter('white_army_general').GetFullName]将军以巨大损失为代价击败了叛军。"
dsk_france.22.f:0 "“在[SCOPE.sState('irish_state').GetName]，我看到了赢家也看到了输家； 如果我赞成有人牺牲，愿我的名字永远被诅咒。”"
dsk_france.22.a:0 "[SCOPE.sState('irish_state').GetName]将永远记住这些日子……"
dsk_france.23.t:0 "皇太子诞生"
dsk_france.23.d:0 "巴黎黎明前的寂静被荣军院隆隆的炮声唤醒。许多居民不再睡觉，开始饶有兴趣地数着开枪的次数。巴黎有一个悠久的传统：如果开了二十一枪，那么在位的王朝就会生一个女孩，如果开了一百零一枪，就会生一个男孩。当二十秒的枪声响起时，所有人都知道拿破仑三世有了继承人。这个男孩被命名为 [SCOPE.sCharacter('napoleon_eugene_ruler').GetFullName]。"
dsk_france.23.f:0 "“参议院与我分享天堂赐予我一个儿子的喜悦，庆祝吧，法兰西之子诞生了……先生们，当一个注定要延续国家秩序的继承人诞生时，这个孩子不仅仅是一个家庭的后代，更是真正的整个国家的儿子……在只代表特权阶级的旧君主制下如此，那么现在更是如此。君主是国民选出的代表，是国家的第一公民，是全民利益的代表。” "
dsk_france.23.a:0 "皇太子万岁！"
little_output_modifier:0 "小吞吐量"
modifier_fra_nap_laws:0 "新《拿破仑法典》"
je_fra_laws:0 "拿破仑法典"
je_fra_laws_reason:0 "《拿破仑法典》作为资本主义国家最早的一部民法法典，其影响远远超出了法国本土。它成为了欧美各国资产阶级立法的规范，推动了资本主义的发展。\n[SCOPE.sCharacter('fra_ruler_scope').GetFirstName]提议调整该法典中可能包括对特定法律条文的解释、补充或细化，以适应社会经济发展的需要。"
je_fra_laws_tt:0 "《拿破仑法典》需要重新修订"


je_fra_land:0 "法兰西农业"
je_fra_land_reason:0 "[SCOPE.sCharacter('fra_ruler_scope').GetFirstName]政府颁布并贯彻了《垦荒法》和《排水法》，组织大量人力开垦荒地、整治沼泽地。\n[SCOPE.sCharacter('fra_ruler_scope').GetFirstName]在《消灭贫困》一书中提出了建立“农业社团”的设想，旨在通过让贫困家庭耕种土地、照顾牲畜等方式，解决他们的生计问题，并促进农业的发展。这一构想虽然在实际操作中可能遇到诸多困难，但反映了政府对于农业发展的重视和扶持。\n[SCOPE.sCharacter('fra_ruler_scope').GetFirstName]信奉自由贸易原则，大幅度降低商品进口关税，取消对某些商品的禁运，废除了自法兰西第一帝国以来的保护关税政策。这使得大量外国商品能够以较低价格涌入法兰西市场，为农业提供了更多的市场机会和原材料来源。"
je_fra_land_tt:0 "农业学校教授新的农业技术"
modifier_france_develop:0 "法兰西新农业"
dsk_france.20.t:0 "新法兰西农业"
dsk_france.20.d:0 "这些措施使得法兰西的耕地面积扩大了150万公顷，全国耕地面积达到了2650万公顷，创历史最高水平"
dsk_france.20.f:0 "随着工业的发展，法兰西的农业也得到了更多的支持。例如，工业的发展为农业提供了更多的机械化和现代化的工具；同时，农业的发展也为工业提供了更多的原材料和市场。\n随着法兰西的殖民扩张和国际贸易的发展，法兰西的农产品也开始走向国际市场。这不仅为法兰西农业带来了更多的收入，也提高了法兰西农业的国际竞争力。"
dsk_france.20.a:0 "赞美吾皇"


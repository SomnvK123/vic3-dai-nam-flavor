je_fra_community:0 "[concept_fra_community]"
concept_fra_community:0 "法兰西公社"
concept_fra_community_desc:0 "卡尔·马克思在《法国内战》中认为，1871年的巴黎公社是未来革命暴动的原型，这种形式最终为无产阶级解放而被发现。事实上，由于巴黎人对失败主义的法国政府的不满，以及在被普鲁士军队围困数月后，巴黎公社更像是一个乌托邦式的、热情的社会主义实验，在法国各省拥有短暂而轶事般的追随者，后来被法家法国军队血洗。"
je_fra_community_tt:0 "#red 全世界无产者，联合起来！#!"
je_fra_community_reason:0 "[concept_fra_community]是无产阶级推翻资产阶级统治，建立无产阶级专政的一次伟大尝试，是无产阶级革命史上的一个光辉节点。它的实践，丰富了马克思主义关于无产阶级革命和无产阶级专政的学说。在国际共产主义运动上写下了光辉、伟大而悲壮的一页。为国际社会主义运动提供了宝贵的经验和教训。它给资本主义以第一次沉重打击，使无产阶级反对资产阶级的斗争进入一个新的时期。公社战士在同强大敌人战斗时表现出来的英勇不屈、视死如归的精神将永垂史册。#red \n起来，饥寒交迫的奴隶，起来，全世界受苦的人！\n满腔的热血已经沸腾，要为真理而斗争！\n旧世界打个落花流水，奴隶们起来起来！\n不要说我们一无所有，我们要做天下的主人！#!\n\n#yellow [concept_fra_community]#!会根据#v #tooltippable;tooltip:[Country.GetTooltipTag],je_french_community_house_pos 现行国内状况#!#!积攒[concept_fra_community]的#N 公社值#!，消耗#N 公社值#!就可以颁布一个政策"

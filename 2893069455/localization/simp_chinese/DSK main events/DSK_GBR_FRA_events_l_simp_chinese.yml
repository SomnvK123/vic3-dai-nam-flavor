je_nazi_ger_union:0 "激进泛日耳曼主义的崛起"
je_nazi_ger_union_reason:0 "过去的几十年，德意志在民族吸纳上做得太少又太多：对外，它对散落在境外各地的日耳曼族裔置若罔闻，即使他们世世代代说着和我们相同的语言；对内，它又吸纳了太多的其他族裔，他们的占比日益提高，但谁能保证这些低等民族不是潜藏在德意志体内的最下贱的蛆虫呢？#yellow 大德意志国#!的目标首先就是对这种错误状态的纠正，是时候让我们的伟大祖国回归纯粹了！\n\n#yellow 纳粹主义#!会#tooltippable;tooltip:[Country.GetTooltipTag],je_nazi_ger_pos 推进#!进度条，而#yellow 自由主义#!会#tooltippable;tooltip:[Country.GetTooltipTag],je_nazi_ger1_pos 回退#!进度条。""

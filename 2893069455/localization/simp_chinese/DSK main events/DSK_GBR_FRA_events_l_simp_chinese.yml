 dsk_aus.14.t:0 "法兰克福国民议会的召开"
 dsk_aus.14.d:0 "随着[concept_germany]的[concept_revolution]如火如荼，无数进步派人士和民族主义者已经聚集在——[SCOPE.sCountry('frm_scope').GetName].探讨着[concept_germany]的未来.结果就是法兰克福国民会议的诞生，如今国民会议已经向我们发来了请束，要求作为[concept_germany]邦国的我们派出代表，我们是否要顺从他们？"
 dsk_aus.14.f:0 "约574人参加了预备议会，他们有的是[concept_germany]各邦议会的议员，有的是名声大噪的进步分子，还有的是民众自发选举出来的人。激进派抓住政治危机产生的一切机会成功地派出了很多代表。\n在3月31日的第一次会议上，自由主义者和激进主义者决裂了。在众多观众敬畏的眼神中，[SCOPE.gsInterestGroup('is_intelligentsia_ig').GetName]领袖[SCOPE.sCharacter('intelligentsia_ig_leader').GetFullName]起身并宣讲了他的共和主义纲领:建立一个统一的民主德意志。\n第二天、来自黑森的温和而思想开明的贵族#yellow 海因里希·冯加格恩#!阻止了激进派的攻击。#yellow 加格恩#!相信法律、相信秩多、相信[SCOPE.sLaw('law_monarchy_scope').GetName]。他认为有必要从激进主义手中夺取主功权、正如一个观察者所说、“为了避免革命而成为革命者”。他和其他温和派尊重[concept_germany]各邦、但他们认为[concept_germany]想要变强，要成为伟大而文明的民族，就要实现政治统一，自由主义者希望[concept_germany]成为君主立宪制联邦由议会选出君主。\n4月1日、#yellow 加格恩#!现身讲坛、他坚毅的目光让嘈杂的议会回归安静。在约425名议员是开明的君主派人士，他的胜利已是定局。\n4月3日、预备议会分裂，在选举出五十人委员会时、在真正的[concept_germany]议会召开会议之前，该委员会一直临时代理议会事务。"
 dsk_aus.14.a:0 "作为[concept_germany]的一员，我们应该派遣自己的代表"

 aus_truce_is_necessary:0 "为了保障后续的剧情进行，有必要先与[SCOPE.sCountry('aus_scope').GetName]签订[concept_truce]"


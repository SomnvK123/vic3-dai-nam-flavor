je_ger_empire_meeting_1:0 "帝国国会"

je_ger_empire_meeting_1_reason:0 "#v 帝国国会#!成立于#o 法兰克福德意志#!成立之时，是#o 法兰克福德意志#!政治体制中的一个重要组成部分。\n\n#v 帝国国会#!的选举法被写入帝国宪法，实行普遍、平等、直接选举的原则，这标志着德国在统一过程中，资产阶级自由主义与俾斯麦政治合作的重要成果。\n\n虽然#v 帝国国会#!可以决定是否通过某项法令或财政预算，但它本身并没有立法权，也不能对政府提出不信任案。立法权主要由联邦参议院（Bundesrat）负责，后者由各邦君主的代表组成。\n\n以下条件将增强#v 帝国国会#!的#yellow 影响力#!,当#yellow 影响力#!足够时，可颁布一项政策：\n•执行#yellow 资格性选举#!或#yellow 普选制#!（#green +2#!）。\n•执行#yellow 秘密警察#!或#yellow 国家宪兵#!（#green +1#!）。\n•执行任何#yellow 卫生机构#!（#green +1#!）。\n•军队数量>#yellow 300#!（#green +1#!）。\n•拥有#yellow 青岛#!（#green +1#!）。\n•国家卫阶为[concept_super_power]（#green +2#!）。"

je_great_german_Italy:0 "对抗哈布斯堡意大利"
je_great_german_Italy_reason:0 "[SCOPE.sCountry('aus_scope').GetAdjective]的赫赫军功之下，是意大利民众的累累白骨。维也纳宫廷的双头鹰不满足于已有的权力，现在正一头窥伺着[SCOPE.sCountry('frm_scope').GetAdjective]议会的权柄，另一头又不忘觊觎着威尼斯的土地——这贪婪的欲望必将破坏帝国脆弱的稳定。\n\n放弃过去的穷兵黩武，将兵锋从意大利的土地收回，新的曙光正在多瑙河畔冉冉升起——不在军靴之下而是于图纸上绽放。工程师的测量尺、工厂的汽锤和商船的航海钟为[concept_germany]的工业心脏输送着动力。\n\n如若不然，定会兵戎相见。"
je_great_german_Italy_tt:0 "将哈布斯堡和他们的走狗们赶出意大利！"


je_great_german_Romania:0 "对抗哈布斯堡特兰西瓦尼亚"
je_great_german_Romania_reason:0 "总参谋部的会议上，参谋总长[SCOPE.sCharacter('mir_dil').GetFullName]用红蜡笔在作战地图上划出一道弧线——从苏台德一路延伸至的里雅斯特。"陛下，这是肢解奥地利的最佳界限。若以此为界分割[SCOPE.sCountry('aus_scope').GetAdjective]，他们将会彻底丧失对#yellow 巴尔干#!地区的控制！"
je_great_german_Romania_tt:0 "将哈布斯堡和他们的走狗们赶出特兰西瓦尼亚!"

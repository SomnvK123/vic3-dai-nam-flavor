concept_germany_country: "德意志邦联"
concept_germany_country_desc: "[concept_germany_country]是由39个主权[concept_country]和自由市(包括吕贝克、不来梅、法兰克福和汉堡)组成的主权[concept_country]联盟，由永久主席国#yellow 奥地利#!主持的#yellow 法兰克福邦联议会#!是邦联的唯机构.成立[concept_germany_country]的目标是维护[concept_germany]内部和外部安全，保证[concept_germany]各国独立和不可侵犯.所有成员都承诺保卫整个[concept_germany]以及邦联的每个成员不受任何攻击，并相互保证每个成员的全部财产.他们“既不向对方发动[concept_war]，也不以暴力手段夺取领地而是向邦联议会提出争取领地的要求，由委员会或公正的法院进行裁决“。只要不危及整个邦联或任何一个[concept_country]的安全，邦联成员可以保留结交[concept_alliance]的权利；邦联成员在邦联[concept_war]中不应单方面进行谈判、决定休战或实现和平.所有成员都应享有平等的权利，所有成员都要用同样的标准约束自己，使邦联的法案不受侵犯"
concept_germany: "德意志"
concept_germany_desc: "“德意志”一词来源于古德语“diot”，意为“人民”。最早史见于公元8世纪，是指生活在#blue 法兰克王国:#!东部的#yellow 日耳曼#!部落所讲的方言。后来，这些拥有共同语言的部族民，就把自己的和人民称为teutsch-deutsch，即[concept_germany]。"
concept_germany_second_empire: "德意志第二帝国"
concept_germany_second_empire_desc: "[concept_germany]第二#yellow 帝国#!，又称[concept_germany]#yellow 帝国#!，是1871年至1918年期间位于欧洲中部的二元君主制联邦制国家。这个帝国由#blue 普鲁士王国#!通过三次王朝战争（对丹麦、奥地利和法国）统一而成，其正式国号为“[concept_germany]国”（Deutsches Reich），这也是后来魏玛共和国和纳粹德国的正式国名"
 je_Frankfurt_National_Assembly:0 "法兰克福国民议会"
 je_Frankfurt_National_Assembly_goal:0 "法兰克福国民议会已决定好组建德意志"
 je_Frankfurt_National_Assembly_reason:0 "[concept_germany]资产阶级领导了这场[concept_revolution]，它的首要任务就是要完成[concept_germany]的统一。\n\n而[SCOPE.gsInterestGroup('ig_rural_folk_scope').GetName]、[SCOPE.gsInterestGroup('ig_trade_unions_scope').GetName]也为自身的利益需求而投身于这场[concept_revolution]之中。在[concept_revolution]取得阶段性胜利，在封建君主的妥协之下，资产阶级议会取得了政权。\n\n在[SCOPE.sCountry('frm_scope').GetName]召开的全德国民议会，出席代表共约500人，出自[concept_germany]各地和各个社会阶层。\n\n一个新的全德统一的中央政府成立了，但是这个政府完全是一个象征性产物，它既没有自己的军队，更没有办事官员。不仅[concept_germany]各邦君主对其冷眼相待，在国际上甚至没有一个[concept_country]承认这个政府\n\n#v 脆弱的国民议会能在这个动荡时代完成它的使命，在[concept_revolution]的旗帜下统一[concept_germany]吗?#!"
 je_Frankfurt_National_Assembly_tt:0 "#yellow 帝国#!宪法将提交到被选为#yellow 帝国#![Concept('concept_ruler','$RULER_TITLE_BASILEUS_AUTOKRATOR$')]的人手中"

concept_fra_republic_3_desc:0 "法兰西第三共和国(1870至1940)，由普法战争失败后建立，在纳粹德国进攻后覆灭。"
je_fra_republic_3_reason:0 "1870年，[concept_fra_empire]与普鲁士爆发战争，法国战败，导致第二帝国的覆灭和[concept_fra_republic_3]的建立。\n[concept_fra_republic_3]采用议会民主模式，其政治制度被认为是共和主义和君主主义妥协的产物。总统、议会和内阁三者之间体现了平衡，其中总统是国家元首和军队的最高统帅，经众议院同意有权任命内阁，经参议院同意有权解散众议院，内阁则对参议院负责。\n\n#yellow [concept_fra_republic_3]#!会根据#v #tooltippable;tooltip:[Country.GetTooltipTag],je_french_republic_house_pos 现行国内状况#!#!积攒[concept_fra_republic_3]的#N 议会值#!，消耗#N 议会值#!就可以颁布一个政策"

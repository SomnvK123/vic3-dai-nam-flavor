dsk_je_gbr_and_Ireland:0 "不列颠与爱尔兰问题"
dsk_je_gbr_and_Ireland_tt:0 "需要进一步调和英爱矛盾"
dsk_je_gbr_and_Ireland_goal:0 "完成三项爱尔兰问题"
dsk_je_gbr_and_Ireland_reason:0 "1603年“九年战争”结束后完成，我们第一次真正的把#variable 爱尔兰#!全面置于自己的统治之下，都铎君主的征服行动还伴随着宗教改革。在伊丽莎白一世统治时期，血腥的征服政策还是使#variable 爱尔兰#!在形式上成为了新教王国。\n1801年，通过《英爱联合法案》，两个王国正式合并为[SCOPE.GetRootScope.GetCountry.GetName]。但是王国的合并并没有带来问题的解决，英爱矛盾依然尖锐。#variable 爱尔兰#!并不是加入了联合王国，而是成为一片被英国人统治的“殖民地”。\n 如果我们不能在本世纪妥善处理好英爱矛盾，#variable 爱尔兰#!的独立反抗斗争将会越来越激烈。"
dsk_je_gbr_Great_Famine_of_Ireland:0 "爱尔兰问题:爱尔兰大饥荒"
dsk_je_gbr_Great_Famine_of_Ireland_reason:0 "马铃薯是当时的爱尔兰人的主要粮食来源,一种称为晚疫病菌的卵菌席卷了整个爱尔兰，导致马铃薯腐烂继而失收。当地的地主却只关心谷物和牲畜的出口。当时，150多万农业工人没有其他收入来源养家糊口，300万小耕种者主要都靠马铃薯维持生计，而有产阶级对马铃薯的消费也要比英国多得多。当歉收时，当然也是那些农村的穷人们承担的风险最大。\n\n如果我们无法妥善处理这场农作物歉收危机，爱尔兰必然会面临可怕的大饥荒，这将导致大量的爱尔兰人丧生。"
dsk_je_gbr_Great_Famine_of_Ireland_tt:0 "马铃薯农作物正受晚疫病菌的卵菌影响而歉收"

dsk_je_accept_Ireland:0 "爱尔兰问题:爱尔兰天主教教徒"
dsk_je_accept_Ireland_reason:0 "在宗教问题上，爱尔兰未能取得如苏格兰那样的宗教独立，而是由英国政府强制规定安立甘教会为国教。根据英国的法律，天主教徒不享有任何政治权利，且在经济、教育等方面受到歧视。这一严峻的政治现实必然会引发爱尔兰出现一系列的政治危机，但对于保守的托利党政府来说，赋予普通爱尔兰人平等公民权就意味着给予天主教徒合法地位，这是有悖于英国的基本政治和宗教原则的。因此，关于爱尔兰天主教徒的公民权问题一直是一项重大而敏感的政治议题，亦是此后历任托利党政府都不得不面对的棘手问题。自16世纪宗教改革以来，爱尔兰人与英格兰人的宗教差异就一直是困扰两个王国统一、融合的障碍。\n虽然1829年通过了《天主教解放法案》，标志着英国放弃了三百年来试图改变爱尔兰天主教信仰的努力。但英国政府仍一直采取政治和军事的双重高压政策，试图将宗教改革延伸到爱尔兰，将安立甘教会强加到爱尔兰人身上。如果我们无法借以消除两国人民的精神隔阂并承认爱尔兰人同是联合王国的子民，我们之间就永远无法和谐共处。"
dsk_je_accept_Ireland_tt:0 "爱尔兰清教徒正在被歧视"

dsk_je_rise_up_Ireland:0 "爱尔兰问题:爱尔兰地位"
dsk_je_rise_up_Ireland_tt:0 "爱尔兰人的独立斗争正在加剧"
dsk_je_rise_up_Ireland_goal:0 "我们已经填满了进度条"
dsk_je_rise_up_Ireland_reason:0 "19世纪来，以民族和信仰为载体，爱尔兰人在联合王国内展开了一场持久的新独立运动。早期运动主要在爱尔兰自治联盟的领导下，以和平、合法的议会斗争方式争取爱尔兰自治，但很快，暴力与恐怖袭击取代了和平的斗争方式，如果我们闭口不谈爱尔兰的地位，爱尔兰的反抗斗争会越来越激烈。\n\n#yellow 爱尔兰地位#!通过以下方式会#variable #tooltippable;tooltip:[Country.GetTooltipTag],je_ireland_pos 变得更高#!#!"
je_ireland_pos: "以下条件将 #variable 推进#!进度条：\n•执行#yellow 完全分离#!或#yellow 世俗化#!（#green +1#!）。\n•执行#yellow 种族隔离#!，#yellow 文化排斥#!或#yellow 文化多元#!（#green +1#!）。
dsk_je_gbr_empire:0 "日不落帝国"
dsk_je_gbr_empire_reason:0 "北美和俄国的平原是我们的玉米地，加拿大和波罗的海是我们的林区，澳大利亚是我们的牧场，秘鲁是我们的银矿，南非和澳大利亚是我们的金矿，印度和中国是我们的茶叶种植园，东印度群岛是我们的甘蔗、咖啡、香料种植园，美国南部是我们的棉花种植园。\n从英伦三岛蔓延到香港、冈比亚、纽芬兰、加拿大、新西兰、澳大利亚、马来西亚半岛、缅甸、印度、乌干达、肯尼亚、南非、尼日利亚、马耳他、新加坡以及无数岛屿，地球上的24个时区均有大英帝国的领土。\n\n这就是[SCOPE.GetRootScope.GetCountry.GetName]治下的和平！"
dsk_je_gbr_empire_tt:0 "#red 太阳永远在我们的疆域上!#!"
dsk_je_gbr_empire_goal:0 "我们[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]同时拥有#red 印度女皇#!，#red 加拿大女王#!，#red 澳大利亚女王#!和#red 南非女王#!的头衔"
modifier_Canada_winner:0 "加拿大女王"
nanyacidalu:0 "日不落:我们在南亚次大陆的地位"
nanyacidalu_reason:0 "撤销#red 东印度公司#!对印度次大陆腐败的管控！他们这群酒囊饭袋根本完全处理不了印度事务！印度次大陆必须由[SCOPE.GetRootScope.GetCountry.GetName]取而代之直接统治！\n我们统治印度已经一世纪有余,所以[SCOPE.GetRootScope.GetCountry.GetName]是最合理的继承者,[ROOT.GetCountry.GetRuler.GetFirstName]女王加封女皇头衔也是理所当然！\n处死#red 莫卧儿帝国#!的继承人，让他们知道，谁才是南亚真正的主人！\n 将[SCOPE.sCountry('pan_scope').GetName]与[SCOPE.sCountry('bur_scope').GetName]一起囊括于[SCOPE.GetRootScope.GetCountry.GetName]的管辖之中！\n无论是俄罗斯毛熊还是东方的巨龙，都会畏惧我们在南亚的实力！"

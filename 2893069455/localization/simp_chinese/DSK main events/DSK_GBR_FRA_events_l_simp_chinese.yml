je_create_center_french_africa_reason:0 "此区于1910年初设时，由四个法属行政委任区（加蓬、刚果、乌班吉、乍得）组成，接邻八个国际行政区域：\n[SCOPE.sCountry('por_scope').GetName]属卡宾达\n[SCOPE.sCountry('spa_scope').GetName]属几内亚\n[SCOPE.sCountry('pru_scope').GetName][SCOPE.sCountry('ger_scope').GetName]属喀麦隆\n[SCOPE.sCountry('gbr_scope').GetName]属尼日利亚殖民地保护国\n[SCOPE.GetRootScope.GetCountry.GetName]属尼日尔军管地\n[SCOPE.sCountry('tri_scope').GetName]\n[SCOPE.sCountry('gbr_scope').GetName]属埃及苏丹地区保护地\n[SCOPE.sCountry('bel_scope').GetName]属刚果。"

dsk_france.3.t:0 "阿尔及利亚的地位"
dsk_france.3.d:0 "随着我们将整个阿尔及利亚吞并，决定阿尔及利亚人地位的问题摆在我们面前"
dsk_france.3.f:0 "阿拉伯帝国之后，包括阿尔及利亚在内的整个北非又经历了多个封建割据王朝以及[SCOPE.sCountry('tur_scope').GetName]的统治。由于远离帝国核心区，并且当地依然保有强大的地方势力，[SCOPE.sCountry('tur_scope').GetName]对阿尔及利亚的统治大多浮于表面，大部分时间这里以自治为主。\n在这一过程中，阿尔及利亚民族构成确定下来。属于白色人种、信仰伊斯兰教的阿拉伯人成为了这里的主体。\n法国殖民派呼吁改变现状，法国中央政府也希望进一步完善对阿尔及利亚的管理架构。由于阿尔及利亚资源丰富，吸引大量移民前来。随着大量移民城镇的出现，法国于1834年在阿尔及利亚沿海几个大居民点建立市政管理体系。这种直接移植法国国内行政模式的行为，在法国海外的殖民地中很难见到，此举也成为阿尔及利亚被纳入法国本土的先声。"
dsk_france.3.a:0 "阿尔及利亚与[SCOPE.GetRootScope.GetCountry.GetName]在文化，习俗，语言上毫不相通，还是让他们做殖民地的二等人吧"
dsk_france.3.b:0 "阿尔及利亚地理上接近[SCOPE.GetRootScope.GetCountry.GetName]，我们有理由认为阿尔及利亚是我国国土向南的自然延伸"
french_african:0 "非裔法兰西"
je_fra_MARRAKECH:0 "法属摩洛哥保护国"
je_fra_MARRAKECH_reason:0 "[SCOPE.sCountry('mor_scope').GetName]位于非洲西北端，东面和东南面与阿尔及利亚为邻，南面与西属撒哈拉接壤，西临大西洋，北隔直布罗陀海峡与西班牙相望，是扼地中海入大西洋的门户，面积约45万平方千米。\n如果我们能成功控制这片区域，他将成为我们链接地中海和大西洋重要的咽喉要道。"
je_fra_TUNISIA:0 "法属突尼斯保护国"
je_fra_TUNISIA_reason:0 "[SCOPE.sCountry('tun_scope').GetName]原为[SCOPE.sCountry('tur_scope').GetName]的一个省。1705年，[SCOPE.sCountry('tun_scope').GetName]的侯赛因·本·阿里·图尔基推翻了奥斯曼帝国派驻突尼斯的最高官员德伊，建立起侯赛因王朝，其统治下的突尼斯被后世称为“突尼斯贝伊国”。然而突尼斯贝伊名义上仍然向奥斯曼帝国苏丹称臣。\n[SCOPE.GetRootScope.GetCountry.GetName]占领阿尔及利亚后，必须极力向突尼斯渗透，以扩大在北非的势力"

dsk_france.4.t:0 "突尼斯的地位"
dsk_france.4.d:0 "随着我们深入突尼斯腹地，决定突尼斯人地位的问题摆在我们面前"
dsk_france.4.f:0 "这里曾是[SCOPE.sCountry('tur_scope').GetName]的统治。由于远离帝国核心区，并且当地依然保有强大的地方势力，[SCOPE.sCountry('tur_scope').GetName]对突尼斯的统治大多浮于表面，大部分时间这里以自治为主。\n在这一过程中，突尼斯的民族构成确定下来。属于白色人种、信仰伊斯兰教的阿拉伯人成为了这里的主体。\n法国殖民派呼吁改变现状，法国中央政府也希望进一步完善对突尼斯的管理架构。"
dsk_france.4.a:0 "突尼斯与[SCOPE.GetRootScope.GetCountry.GetName]在文化，习俗，语言上毫不相通，还是让他们做殖民地的二等人吧"
dsk_france.4.b:0 "突尼斯地理上接近[SCOPE.GetRootScope.GetCountry.GetName]，我们有理由认为这是我国国土向南的自然延伸"

dsk_france.5.t:0 "摩洛哥的地位"
dsk_france.5.d:0 "随着我们深入摩洛哥腹地，决定摩洛哥人地位的问题摆在我们面前"
dsk_france.5.f:0 "这里曾是[SCOPE.sCountry('tur_scope').GetName]的统治。由于远离帝国核心区，并且当地依然保有强大的地方势力，[SCOPE.sCountry('tur_scope').GetName]对摩洛哥的统治大多浮于表面，大部分时间这里以自治为主。\n在这一过程中，摩洛哥的民族构成确定下来。属于白色人种、信仰伊斯兰教的阿拉伯人成为了这里的主体。\n法国殖民派呼吁改变现状，法国中央政府也希望进一步完善对摩洛哥的管理架构。"
dsk_france.5.a:0 "摩洛哥与[SCOPE.GetRootScope.GetCountry.GetName]在文化，习俗，语言上毫不相通，还是让他们做殖民地的二等人吧"
dsk_france.5.b:0 "摩洛哥地理上接近[SCOPE.GetRootScope.GetCountry.GetName]，我们有理由认为这是我国国土向南的自然延伸"
dsk_france.5.c:0 "我们需要一个听话的苏丹。"
dsk_france.5.e:0 "适当安抚人心是必要的。"

dsk_france.6.t:0 "法属赤道非洲提案"
dsk_france.6.d:0 "我们控制这大片的非洲地域，一些事宜超出了我们能力的范畴"
dsk_france.6.f:0 "法属赤道非洲的疆域范围从刚果河向北延伸到撒哈拉沙漠，主要包括现在的加蓬、刚果共和国、中非共和国和乍得等地区"
dsk_france.6.a:0 "“巴黎当局只需要动动手编撰一本殖民地法律，而殖民地总督考虑的就多了”"
dsk_france.6.b:0 "赤道非洲与[SCOPE.GetRootScope.GetCountry.GetName]在文化，习俗，语言上毫不相通，还是让他们做殖民地的二等人吧"

 grefm.029.t: "希腊的专制主义"
grefm.029.d: "随着早期巴伐利亚统治的风波逐渐成为遥远的记忆，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]被誉为希腊国家的支柱。随着权力越来越集中于皇家宫廷，人民祈祷他们未来的繁荣。"
grefm.029.f: "是维特尔斯巴赫家族的年轻领主为[ROOT.GetCountry.GetName]带来了和平。他们理应保留统治权。"
grefm.029.a: "向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]致敬！"
 dsk_je_gbr_global_trade_reason:0 "这是全球贸易的时代，也是我的时代，继海上马车夫[SCOPE.sCountry('net_scope').GetName]之后，无人能够与[SCOPE.GetRootScope.GetCountry.GetName]竞争全球贸易的影响力。自1713年我们击败了[SCOPE.sCountry('spa_scope').GetName]控制了#variable 直布罗陀 #!海峡。\n我们将整个地中海的贸易路线囊括于手中。现在，帝国可以完成远洋作战，为了增大我们的影响力，控制其他区域的贸易要道必须成为我们的既定国策！\n控制#variable 马六甲#!是至关重要的，它是印度洋前往中国南海的咽喉，不论是[SCOPE.sCountry('chi_scope').GetName]还是[SCOPE.sCountry('kor_scope').GetName]亦或是[SCOPE.sCountry('jap_scope').GetName]，都极其依赖于该贸易航线。\n控制#variable 东非#!与#variable 霍尔木兹#!就等于控制了中东和波斯湾的石油航道。\n只有掌握了这些海峡，#red 大英帝国#!就会永远掌握世界各国的经济命脉，我们的功绩千秋万代，我们的子孙后代将会永远沐浴在#red 大英帝国#!的光辉之下！"
dsk_gbr.1.t:0 "控制四大海峡"
dsk_gbr.1.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]控制着全球80%的贸易航线，我们是当之无愧的海洋霸主！"
dsk_gbr.1.f:0 "从寒冷的北冰洋，到广袤的太平洋。\n从宽阔的印度洋，到蔚蓝的大西洋。\n大不列颠控制着海洋，控制着一切"
dsk_gbr.1.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]统治着世界！"
dsk_je_gbr_university:0 "不列颠名校改革"
dsk_je_gbr_university_reason:0 "#variable 牛津大学#!是位于[SCOPE.sState('2_university_state').GetName]的我们引起为傲的世界著名大学，也是我们最古老的大学之一，其历史可以追溯到12世纪。它为我们国家提供了数不清的人才，作为世界闻名的顶尖学府，#variable 剑桥大学#!位于[SCOPE.sState('1_university_state').GetName]在过去数百年间里一直以其在教育、科研、医药、数学、经济及历史等各领域为#red 大英帝国#!的发展提供了举足轻重的作用\n#variable 剑桥大学#!同样是我们最古老的大学之一，这两所大学一同为#red 大英帝国#!成为[Concept('concept_super_power','$concept_super_powers$')]发挥了不可磨灭的作用。\n但是在1836年，随着[SCOPE.sCountry('fra_scope').GetName]的#variable 巴黎大学#!与[SCOPE.sCountry('pru_scope').GetName]的#variable 哥廷根大学#!等其他欧洲名校日益壮大，#variable 牛剑#!失去了它的垄断地位。在维多利亚王朝这一越来越工业化和商业化的社会里，我们国内的顶尖人才意识到，必须要改革了\n我们必须进一步发挥我们的教育优势，它们将确保在这个充满变革的年代继续让#red 大英帝国#!的科技领先世界！\n #variable 注：历史上，维多利亚女王的丈夫阿尔伯特推动了这次改革#!"
dsk_gbr.2.t:0 "名校改革"
dsk_gbr.2.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]如今有着世界上最伟大的大学，最先进的科技，最高尚的人才，还有什么是我们没有的？"
dsk_gbr.2.f:0 "当世界各国的人才来到#variable 牛津大学#!和#variable 剑桥大学#!后，他们才会知道这个世界最真挚的真理" 
dsk_gbr.2.a:0 "让全世界的人才与科技都汇聚大不列颠！"
dsk_je_gbr_Royal_Academy:0 "改革皇家美术学院"
dsk_je_gbr_Royal_Academy_reason:0 "#variable 皇家美术学院(缩写RA)#!坐落在伦敦的英国皇家美术研究院，自从1768年成立以来迄今已有237年，是世界上学习艺术领域最好的美术研究院。RA不仅历史悠久而且人才辈出，为培育世界绘画、雕刻、建筑艺术英才做出了巨大贡献。该校每年举行优秀学生及艺术家作品展，也吸引了国内外艺术爱好者的瞩目。\n自从十八世纪建校以来，#variable 皇家美术研究院#!非但不收取学生任何学费，每年还提供学生八九千英镑奖学金和打工的机会，帮助他们应付在伦敦的昂贵生活开支。\n现在，我们需要扩建它，在未来一个世纪的艺术潮流中，世界将会充斥来自大不列颠的艺术展品！\n #variable 注：1870年RA扩大了展览方案，其规模、专业程度、展品质量不亚于任何一个世界级的艺廊。这些展览奠定了RA在国际艺术机构中的重要性。#!"
dsk_gbr.23.t:0 "不列颠艺术的宝珠"
dsk_gbr.23.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]如今有着世界上最伟大的大学，最先进的科技，最高尚的人才，最优秀的艺术作品，还有什么是我们没有的？"
dsk_gbr.23.f:0 "当世界各国的人才来到#variable 皇家美术学院#!后，他们才会知道这个世界最壮丽的艺术作品。"
dsk_gbr.23.a:0 "这不浪漫吗？"

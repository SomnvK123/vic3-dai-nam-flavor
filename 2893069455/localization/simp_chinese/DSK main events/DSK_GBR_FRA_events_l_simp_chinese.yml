je_pru_Berlin_Revolution:0 "柏林之春"
je_pru_Berlin_Revolution_reason:0 "精神的、宗教的、社会的和经济的危机以及不稳定，造成了民族主义在欧洲各地的兴起。\n\n在平民贵族#yellow 朱塞佩·马志尼#!极具蛊惑力和说服力的演讲中，他大肆宣扬在和平与和谐中生活的各国人民的“春天”。\n\n蛊惑召唤#v “青年欧洲”#!、#v “青年意大利”#!和#v “青年德意志”#!。同时、他唤醒和宣传鼓动人们进行反对“梅特涅体制”的革命战争\n\n梅特涅秩序统治下的欧洲，1815年是那样凯歌高奏，而且自那以后又经历了那么多的风风雨雨，此刻却突然显得极为虚弱。“自由派也嗅到了血腥的气息.社会矛盾异常尖锐、人们认为进行政治变革的时机已经成熟，就连向来对旧秩序持审慎的反对态度的群体也认为即使不发动革命，也有必要进行改革。\n\n人们在呼唤着那个#red “人民觉醒”#!和#red “民族重生”#!的浪漫主义乌托邦，并将其作为解决目前问题的唯一良药。\n\n柏林之春的进度条将通过以下条件#v #tooltippable;tooltip:[Country.GetTooltipTag],je_pru_Berlin_Revolution_pos 改变#!#!"
je_pru_Berlin_Revolution_pos:0 "以下条件将 #bold 推进#!#v 柏林之春#!：\n•执行#yellow 独裁制#!，#yellow 一党独裁制#!或#yellow 一党制国家#!（#red +1#!）。\n•执行#yellow 佃农#!（#red +1#!）。\n•执行#yellow 出版物审查#!（#red +1#!）。\n•全国#yellow [Concept('concept_sol', '$SOL_SHORT_TEXT$')]<=15#!（#red +2#!）\n•#yellow 知识分子#!不是边缘集团且支持度<-8（#red +1#!）\n•#yellow 农民#!不是边缘集团且支持度<-8（#red +2#!）\n\n以下条件将#bold 缓和#!#v 柏林之春#!:\n•全国#yellow [Concept('concept_sol', '$SOL_SHORT_TEXT$')]>=15#!（#green -2#!）\n•执行任何#yellow 选举形式#!（#green -3#!）"
je_pru_Berlin_Revolution_tt:0 "鬼魅的幻影在[SCOPE.GetRootScope.GetCountry.GetName]各地游荡"
je_pru_Berlin_Revolution_goal:0 "填满这个进度条后，就会开启动荡的[concept_germany]统一之路"
democracy_germany_tt:0 "若时间耗尽，就会开启自由民主的[concept_germany]统一之路"

je_dsk_german_army:0 "国民议会军队"
je_dsk_german_army_reason:0 "为了解决这个问题，#v 国民议会#!通过了一系列军事和征兵相关的决议，包括提升军队在人口中的比例、宣布#yellow 摄政约翰#!为[concept_germany]军队最高统帅\n[concept_germany]各个邦之间在统一问题上存在利益冲突，部分邦国对国民议会的征兵与阅兵要求表示不满，认为这侵犯了各邦的自主权。因此，国民议会需要通过军事与征兵政策来平衡各邦利益、加强中央集权"

je_dsk_german_ship:0 "国民议会舰队"
je_dsk_german_ship_reason:0 "为了解决这个问题，#v 国民议会#!5月6日成立了海军委员会交委员会应确定船队的职能，并在分析后提出船舶建造的分步计划。在第一阶段建设的中，该委员会将筹备600万塔勒:帝国舰队将成为德国统一标志之一。尽管在上次经济危机之后，对在没有成熟计划的情况下做出具本决定和给人民带来财政负担有所保留，但国民议会还是于6月14日通过了海洋委员会的提案。左翼、中间派和右翼几乎一致支持这一决定"

 dsk_prussia.10.t:0 "法兰克福提案:帝国海军"
 dsk_prussia.10.d:0 "由于常年缺少海军的保护，[concept_germany_country]的商人们在进行远洋航行时都充满了危险，为了保护商人们的权益、建立帝国海军的议案已经被提上了日程，我们是否要同意组建支全新的帝国海军?"
 dsk_prussia.10.f:0 "[concept_germany_country]的建国法案并不承认海军。尽管不少沿海邦国都存在着重要的港口，但德总志商船队没有海军力量的军事保护。在[SCOPE.sCountry('pru_scope').GetName]试图说服其他与北海接壤的[concept_germany][concept_country]采取共同的贸易政策时，一支舰队已经是想法之一。\n亲王#yellow 阿达尔伯#!曾经提出了由划艇炮艇组成的护航队的计划、但因为舰队的高成本、他遇到了很大的阻力。在[concept_germany]诸邦中，只有[SCOPE.sCountry('aus_scope').GetName]拥有一支从威尼斯共和国接管的舰队、尽管实力也很弱小"
 dsk_prussia.10.a:0 "海军将使我们的商人在公海航行时不再受辱!"

 dsk_prussia.11.t:0 "法兰克福提案:帝国陆军"
 dsk_prussia.11.d:0 "在统一过程中，政府需要建立强大的军事力量来维护秩序、抵御外部威胁，并确保各邦对统一事业的忠诚。因此，颁布军事与征兵政策是加强政府权威、控制军队的重要手段"
 dsk_prussia.11.f:0 "在法兰克福国民议会期间，丹麦爆发了石勒苏益格战争。为了支持[SCOPE.sCountry('pru_scope').GetName]的军事行动，国民议会通过了组建[concept_germany]陆军的决议，并试图通过征兵政策来增强军队实力"
 dsk_prussia.11.a:0 "强大的陆军将会成为迈向统一的动力!"

 Frankfurt_National_Assembly_HOL_SCH_tt:0 "法兰克福国民议会已宣布支持石勒苏益格和荷尔斯泰因起义！"

 dsk_prussia.12.t:0 "[SCOPE.sState('SILESIA_state').GetName]纺织工人起义！"
 dsk_prussia.12.d:0 "1844年6月4日，以争取提高工资被拒绝为导火线，在欧根山麓两个纺织村镇彼特斯瓦尔道和朗根比劳爆发纺织工人自发的起义。起义队伍迅速扩大到3000人，他们占领了工厂，捣毁了工厂主的住宅，焚烧了工作场地"
 dsk_prussia.12.f:0 "[concept_germany]，我们在编织你的尸布，每一根丝线都承载着三重的深沉诅咒。\n我们织入第一重诅咒，献给那冷漠的上帝，在饥寒交迫中我们曾向他乞求怜悯，但希望与期待皆化为泡影，他给予我们的唯有愚弄与欺骗。\n接着，我们织进第二重诅咒，针对那些富有的国王，他们的心硬如铁，对我们的苦难无动于衷，榨取我们的最后一分财富，甚至将我们如狗般枪杀。\n再者，我们织入第三重诅咒，给这虚假的祖国，这里充斥着耻辱与罪恶，花朵尚未绽放即被摧残，腐尸与粪土滋养着蛆虫的生命。\n梭子飞转，织机轰鸣，我们日夜不息地编织，将这三重诅咒深深织入这尸布之中。\n[concept_germany]，你终将承受这一切。"
 dsk_prussia.12.a:0 "让他们罢工吧，是该提高工人的生活了"
 dsk_prussia.12.b:0 "派我的皇家军团来，你不干有的是人干！"
 low_life_up_modifier:0 "提高工人工资"

PRUN:0 "柏林自由政府"
PRUN_ADJ:0 "柏林自由政府"
 dsk_prussia.13.t:0 "柏林革命"
 dsk_prussia.13.d:0 "1848年3月6日，一些激进青年在[SCOPE.sState('capital_state').GetName]动物园开会，次日以柏林人民名义提出请愿书，要求政治自由、实行大赦、公民在法律面前人人平等、实行人民代议制、废除高利贷、召开联合省议会等，但遭政府拒绝。3月9日，青年们再次在动物园集会，与会者达数千人，再次提出请愿书。同时，柏林工人也活跃起来，散发了反映工人要求的传单。"
 dsk_prussia.13.f:0 "3月13日，群众在动物园集会时遭政府军袭击，发生流血冲突。此后几日，冲突持续不断。3月18日，受到[SCOPE.sCountry('aus_scope').GetName]维也纳人民推翻梅特涅反动政府消息的鼓舞，柏林革命群众包围了王宫，要求国王[ROOT.GetCountry.GetRuler.GetFirstName]把军队撤出柏林。国王下令军队向群众开枪，激起了武装起义。经过一昼夜激战，[concept_revolution]群众打败了政府军。\n[ROOT.GetCountry.GetRuler.GetFirstName]被迫下令停战，并宣布立即召开国民议会，制定宪法，改组政府，释放政治犯和撤退城内驻军。\n[ROOT.GetCountry.GetRuler.GetFirstName]在开幕式上发表演说，强调制定宪法必须与王室协调。\n#yellow 康普豪森内阁#!向议会提交了宪法草案。这是参考[SCOPE.sCountry('fra_scope').GetName][concept_monarchie_de_Juillet]的宪法和[SCOPE.sCountry('aus_scope').GetName]宪法制定的。它规定[SCOPE.sCountry('bel_scope').GetName]实行君主立宪制度，但赋予国王很大的权力。"
 dsk_prussia.13.a:0 "跟这些虫豸在一起怎么能搞好政治呢？"
dsk_prussia.13.tt:0 "我们的[SCOPE.sState('capital_state').GetName]#v 柏林#!会被一个#yellow 自由政府#!占领"
 no_capital_modifier:0 "首都被占领"


not_modifier_great_German:0 "如果我们按下这个决议，在十年内就无法更改"
not_modifier_small_German:0 "如果我们按下这个决议，在十年内就无法更改"
je_germany_reforms_goal:0 "在议会中支持建立德意志已持续5年"
supporting_small_German_tt:0 "这是历史上的真实路线。如果我们选择这条路线，我们的陆军将会获得大量的攻防来帮助我们打赢普法战争。如果你成功建立了小德意志，奥地利将会保持主权完整并在之后成为我们的盟友"


dsk_prussia.14.t:0 "柏林监视网"
dsk_prussia.14.d:0 "如果相信一位当地诗人的说法，柏林街头已经到处站着警察了\n一本韵文集公开批评我国现状，其中提到的压迫和政治倒退已经在我国一个邦内激起了认同感.自由主义者已经习惯于在街头抗议旧秩序，呼吁对政治体制进行自由改革，呼吁国内外同胞兄弟团结一心，以至普鲁士全国上下能听到要求全国大团结的呼声.我们必须考虑派遣军队到出现自由主义骚动之地。"
dsk_prussia.14.f:0 "战线的一边站立的是那些为报刊写文章的、将自己定义为自由战士的言论领袖；另一边则是"持保守原则的堡垒"(格维努斯语)、专制主义和"保守的皇朝政治"善与恶泾渭分明、高下立判。一沃尔夫拉姆·希曼"
dsk_prussia.14.a:0 "该死的革命者"

add_Berlin_Revolutior_tt:0 "这会推进#yellow 柏林之春#!进度条#v 20#!"
sub_Berlin_Revolutior_tt:0 "这会减少#yellow 柏林之春#!进度条#v 20#!"
laze_capital_modifier:0 "首都骚乱"


dsk_prussia.15.t:0 "[SCOPE.sCulture('north_german_state').GetName]反雅各宾的小册子"
dsk_prussia.15.d:0 "广泛的自由主义风潮在[SCOPE.sCulture('north_german_state').GetName]激起了强烈反弹，一位主要的保守主义知识分子撰写了一本反雅各宾派的小册子"
dsk_prussia.15.f:0 "当革命者的军队扬言挑战欧洲的传统秩序时，与他们对抗便成为了我们神圣的使命。雅各宾派是由不会被救赎的吹牛老和市侩的商人组成的集体。看看罗伯斯庇尔带给了法国什么吧，他们把激进主义强加在柏林上，从来没考虑过人民的想法"
dsk_prussia.15.a:0 "多好的宣传啊"
dsk_prussia.15.b:0 "有趣"
revolution_sub_modifier:0 "反雅各宾的小册子"



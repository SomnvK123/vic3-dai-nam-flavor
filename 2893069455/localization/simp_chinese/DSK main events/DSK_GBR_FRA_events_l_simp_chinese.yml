 dsk_prussia.24.t:0 "德属西南非"
dsk_prussia.24.d:0 "阳光下的地盘"
dsk_prussia.24.f:0 "1883年，德国商人卢德里茨宣布纳米比亚地区其余海岸为德国领地。1885年柏林会议后，英国放弃了对纳米比亚的领土要求。1890年德国占领纳米比亚全境，并将其命名为#v 德属西南非洲#!。"
dsk_prussia.24.a:0 "我们将在这里建立殖民政府"

dsk_prussia.25.t:0 "德属几内亚"
dsk_prussia.25.d:0 "阳光下的地盘"
dsk_prussia.25.f:0 "[concept_germany_second_empire]商人#yellow 阿道夫·冯·汉斯曼#!和德国银行家财团在柏林创立了#v 新几内亚公司#!，旨在殖民和开发新几内亚的资源。德国殖民者为了扩大高利润的种植园就需要更多的劳动力，然而德国殖民政府并没有选择自愿来的招聘，而是强迫性的招聘劳动。\n\n殖民政府颁布和实施了新的法律，其要求每个部落每年提供每人四周的劳动，并以现金的形式向殖民政府支付人头税，从而迫使不情愿的当地土著加入劳动队伍以支付所谓的人头税。"
dsk_prussia.25.a:0 "我们将在这里建立殖民政府"

 dsk_prussia.26.t:0 "德属东非"
  dsk_prussia.26.d:0 "阳光下的地盘"
  dsk_prussia.26.f:0 "1885年3月3日，[concept_germany_second_empire]政府宣布公司已被授予由帝国宰相#yellow 奥托·冯·俾斯麦#!在1885年2月27日签署的宪章。宪章授予彼得斯的公司在东非大湖区建立保护国的权利。德国人亦在此之后于1885年4月与桑给巴尔苏丹哈利法·本·赛义德签订协议租借桑给巴尔岛对岸沿海地带50年。彼得斯随即招募专家于海岸从南至北探险\n\n德国人的统治迅速地在巴加莫约，达累斯萨拉姆与基尔瓦建立。在这之后于1888年爆发的阿布士里起义也在英国人的帮助下于次年被镇压。1890年，柏林与伦敦缔结了黑尔戈兰——桑给巴尔条约，此条约将位于德国本土荷尔施泰因地区以西，英国于1807年占领的黑尔戈兰岛交还德国，德国人则承认英国对桑给巴尔岛的统治权；此条约亦确定了德属东非与英属肯亚保护国的边界。"
  dsk_prussia.26.a:0 "我们将在这里建立殖民政府"

  dsk_ger_empire_time:0 "帝国时代"

  ger_lose_world_war:0 "[SCOPE.GetRootScope.GetCountry.GetName]输掉了世界大战"

  je_nazi_ger_tt:0 "一股邪恶的力量在[SCOPE.GetRootScope.GetCountry.GetName]蠢蠢欲动！"
  je_nazi_german_empire_tt:0 "整个欧洲都会在[SCOPE.GetRootScope.GetCountry.GetName]的铁蹄下颤抖！"

  je_unity_nazi_tt:0 "一个以[SCOPE.GetRootScope.GetCountry.GetName]主导的联盟"

  dyn_c_republic_weima_GER:0 "魏玛共和国"
  dsk_prussia.31.t:0 "魏玛共和国"
  dsk_prussia.31.d:0 "我们的士兵埋葬了，我们的船沉了，统治的梦想被打败了。条约的所有条款将得到执行。我们将失去一切。\n"如果我们没有赢得战争的能力我们为什么要加入这场旷日持久的大战？""
  dsk_prussia.31.f:0 "[concept_germany_second_empire]成立于第一次世界大战中战败、霍亨索伦王朝崩溃之际。由于这段时间施行的宪法是在魏玛召开的国民议会上通过的，因而得此名称魏玛共和国"
  dsk_prussia.31.a:0 "这是我们的耻辱！[concept_germany]民族将牢记这最为黑暗的一天"


  je_ger_develop_main:0 "德意志的工业革命"
  je_ger_develop_main_reason:0 "工业革命是人类历史上的一次重大变革，它极大地提高了生产效率和生产能力。我们作为当时欧洲的一个重要国家，为了提升本国的经济实力和国际竞争力，迫切需要进行工业革命以推动生产力的发展。\n\n随着人口的增加和经济的发展，[concept_germany]社会对商品的需求不断增长。然而，传统的生产方式无法满足这种日益增长的需求，为此，我们需要通过工业革命来扩大生产规模和提高生产效率，以助力我们在欧洲大陆上成为最强大的#yellow 帝国#!。"
  je_ger_develop_main_tt:0 "工业革命如火如荼的开展中..."
   je_ger_develop_main_goal:0 "需要完成四项工业革命项目"


   je_ger_develop_1:0 "工业革命：重工业"
   je_ger_develop_1_reason:0 "在统一[concept_germany]后，我们急需利用第二次工业革命中发明的新技术，改进传统工业和发展新型工业。显著的行业包括钢铁工业、机器制造业和纺织业。\n\n根据史料记载：到一战前夕，德国电气工业产品约1/4销往世界各地，电气工业出口占世界电气产品出口量的46.4%"

   je_ger_develop_2:0 "工业革命：矿产资源"
   je_ger_develop_2_reason:0 "钢铁、煤炭和机器制造业等重工业在工业革命期间高速发展，所需要的资源量也是显著增长，为了保障国家其余行业的正常运转，有必要大力开采矿产！"

   je_ger_develop_3:0 "工业革命：军工业"
   je_ger_develop_3_reason:0 "在金属冶炼、机械制造等领域取得显著进展后，我们能够生产出性能更加优越的武器装备。\n政府高度重视军工业的发展，出台了一系列政策措施来支持军工业的壮大。随着工业革命的深入发展，我们的战略思想也应该发送转变。从传统的防御战略转变为攻势战略。为此，必须强调以强大的军事力量为后盾，通过进攻来夺取战争胜利。"

  je_ger_railway:0 "工业革命：铁路"
  je_ger_railway_reason:0 "钢铁工业在19世纪50年代后通过更猛烈的发展来适应大规模的铁路建设需要，通过建设铁路，不仅改善了交通运输状况，还直接或间接地进一步反推动了钢铁、煤炭、机器制造等重工业的发展。铁路建设对铁轨、机车和车皮制造等需求的刺激，推动了着钢铁工业的加快发展"


  modifier_ger_develop_1:0 "重工业的发展"
  modifier_ger_develop_2:0 "矿产资源的发展"
  modifier_ger_develop_3:0 "军工业的发展"
  modifier_ger_develop_4:0 "铁路的发展"
  modifier_ger_develop_5:0 "顺利完成工业革命"


   dsk_prussia.27.t:0 "重工业的发展"
  dsk_prussia.27.d:0 "城市化进程的加速"
  dsk_prussia.27.f:0 "重工业的发展极大地推动了德意志的工业化进程，使得工业产值在国民经济中的比重不断增加。重工业如钢铁、煤炭、机械制造等行业的快速发展，为德意志带来了丰厚的经济回报。\n德意志从传统的农业国转变为工业国，经济结构发生了根本性的变化。重工业成为德意志经济的重要支柱，为德意志的现代化进程奠定了坚实的基础。"
  dsk_prussia.27.a:0 "万岁！[SCOPE.GetRootScope.GetCountry.GetName]"

    dsk_prussia.28.t:0 "矿产资源的发展"
  dsk_prussia.28.d:0 "经济实力的增强"
  dsk_prussia.28.f:0 "矿产资源的丰富为德意志的工业化进程提供了坚实的基础。例如，鲁尔区的煤炭资源丰富，为钢铁、机械制造等重工业的发展提供了充足的能源和原料，推动了德意志经济的快速增长\n矿产资源的开采和加工带动了相关产业的发展，如冶炼、化工、运输等，形成了完整的产业链，促进了产业结构的优化和升级。"
  dsk_prussia.28.a:0 "万岁！[SCOPE.GetRootScope.GetCountry.GetName]"


  dsk_prussia.29.t:0 "军工业的发展"
  dsk_prussia.29.d:0 "国际地位的提升"
  dsk_prussia.29.f:0 "军工业的发展促进了德意志在军事技术领域的研发和创新。为了提升武器装备的性能和竞争力，德意志在飞机、坦克、导弹等领域进行了大量的技术研发和试验，这些努力不仅推动了军事技术的进步，也带动了相关科技领域的发展\n军工业的发展还促进了军民融合。许多军工技术和产品经过转化后可以应用于民用领域，如航空技术、精密制造等，推动了德意志民用工业的技术进步和产业升级。"
  dsk_prussia.29.a:0 "万岁！[SCOPE.GetRootScope.GetCountry.GetName]"

  dsk_prussia.30.t:0 "铁路的发展"
  dsk_prussia.30.d:0 "人口流动的加速"
  dsk_prussia.30.f:0 "铁路作为工业革命的先导和重要部门，推动了德国从以轻纺工业为中心的轻工业迅速转向以铁路建设为重点的重工业。铁路建设拉动了煤铁等相关产业的发展，促进了重工业部门的兴起\n铁路的修建使得人口和物资流动更加便捷，促进了城市的兴起和扩张。铁路沿线的城市逐渐发展成为经济中心，吸引了大量的人口和资本流入。"
  dsk_prussia.30.a:0 "万岁！[SCOPE.GetRootScope.GetCountry.GetName]"

   dsk_prussia.32.t:0 "完成工业革命"
  dsk_prussia.32.d:0 "世界工厂的诞生"
  dsk_prussia.32.f:0 "在工业革命期间，特别是第二次工业革命中，工业产量大幅增长。例如，从1867年到1913年，[SCOPE.GetRootScope.GetCountry.GetName]的生铁产量从100万吨增加到1930万吨，几乎增长了20倍；同期钢产量也增长了约25倍。这种生产能力的飞跃使得[SCOPE.GetRootScope.GetCountry.GetName]迅速成为欧洲乃至世界的工业强国。\n\n[SCOPE.GetRootScope.GetCountry.GetName]在工业革命中引入了先进的生产技术和设备，如托马斯炼钢法等，大大提高了生产效率。到1913年，[SCOPE.GetRootScope.GetCountry.GetName]钢铁工人人均年钢产量已达77吨，远超同期[SCOPE.sCountry('gbr_scope').GetName]的水平\n[SCOPE.GetRootScope.GetCountry.GetName]在完成工业革命后迅速崛起为欧洲强国之一。其经济实力、科技实力和军事实力的提升使得德国在国际舞台上具有举足轻重的地位"
    dsk_prussia.32.a:0 "让世界看到[SCOPE.GetRootScope.GetCountry.GetName]制造！"

je_ger_empire_meeting:0 "帝国国会"
je_ger_empire_meeting_tt:0 "帝国国会正行使职能"
je_ger_empire_meeting_reason:0 "#v 帝国国会#!成立于1871年[concept_germany_second_empire]成立之时，是[concept_germany_second_empire]政治体制中的一个重要组成部分。\n\n#v 帝国国会#!的选举法被写入帝国宪法，实行普遍、平等、直接选举的原则，这标志着德国在统一过程中，资产阶级自由主义与俾斯麦政治合作的重要成果。\n\n虽然#v 帝国国会#!可以决定是否通过某项法令或财政预算，但它本身并没有立法权，也不能对政府提出不信任案。立法权主要由联邦参议院（Bundesrat）负责，后者由各邦君主的代表组成。\n\n以下条件将增强#v 帝国国会#!的#yellow 影响力#!,当#yellow 影响力#!足够时，可颁布一项政策：\n•执行#yellow 资格性选举#!或#yellow 普选制#!（#green +2#!）。\n•执行#yellow 秘密警察#!或#yellow 国家宪兵#!（#green +1#!）。\n•执行任何#yellow 卫生机构#!（#green +1#!）。\n•军队数量>#yellow 300#!（#green +1#!）。\n•拥有#yellow 青岛#!（#green +1#!）。\n•国家卫阶为[concept_super_power]（#green +2#!）。"


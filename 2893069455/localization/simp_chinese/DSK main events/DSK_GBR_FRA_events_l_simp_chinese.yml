je_lose_Gibraltar_reason:0 "失去控制直布罗陀是我们万万不能接受的。"
dsk_gbr.16.a:0 "新大陆欢迎更多的移民"
Methuen_Treaty_button:0 "续签《梅休因条约》"
Methuen_Treaty_button_desc:0 "条约肯定了英葡两国以往的军事和政治同盟关系，并主要在贸易方面达成协议，如果#blue 葡萄牙#!禁止我们在其国内的[concept_foreign_investment]该条约就会作废"
exists_por_tt:0 "每五年都可以要求#blue 葡萄牙#!续签《梅休因条约》，但我们要保障其独立主权地位"
Treaty_of_London_button:0 "履行《伦敦条约》"
Treaty_of_London_button_desc:0 "伦敦条约的历史重要性在其第十二章要求#yellow 比利时#!保持永远的中立地位，并暗示当有入侵发生时，条约的签署方须保护比利时的中立地位。"
exists_bel_tt:0 "我们应当保护#yellow 比利时#!的主权独立地位，每10年，我们都可以在#yellow 比利时#!获得[concept_foreign_investment]"

dsk_gbr.22.t:0 "[SCOPE.sCountry('gbr_scope').GetName]要求续签《梅休因条约》"
dsk_gbr.22.d:0 "共同防御还是外国[concept_foreign_investment]？"
dsk_gbr.22.f:0 "条约肯定了两国以往的军事和政治同盟关系，并主要在贸易方面达成协议。条约准许英国的羊毛和毛织品输入葡萄牙市场，同时葡萄牙的酒类进入英国可享受关税优惠。条约执行初期使葡萄牙衰落的杜罗河葡萄产区得以复兴，促进葡农业经济的发展。但当英国葡萄酒市场饱和之后，英国人便开始对该地区葡萄园主进行控制，不断压低收购价格，而大量的英国工业品，特别是毛织品进入葡萄牙，则影响了葡萄牙工业的发展，使其在经济上遭受重大损失并日益依附于[SCOPE.sCountry('gbr_scope').GetName]"
dsk_gbr.22.a:0 "我们不再需要[SCOPE.sCountry('gbr_scope').GetName]任何的军事保证，因为我们可以独立自主"
dsk_gbr.22.b:0 "我们仍然需要这份至高的力量"
foreign_investment_right_tt:0 "获得在目标国的[concept_foreign_investment]"
foreign_investment_right_bel_and_gbr_tt:0 "获得在比利时的[concept_foreign_investment]，同时给予比利时保障独立的条约承诺"

dsk_gbr.28.t:0 "[SCOPE.sCountry('por_scope').GetName]拒绝续签《梅休因条约》"
dsk_gbr.28.d:0 "共同防御还是主权独立中他们选择了后者"
dsk_gbr.28.f:0 "我们的工艺品的输入对于他们的经济打击是巨大的，我们能够理解他们的决定。但因此也深表遗憾"
dsk_gbr.28.a:0 "也许下次，[SCOPE.sCountry('por_scope').GetName]会改变主意"


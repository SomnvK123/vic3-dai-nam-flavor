dsk_prussia.7.t:0 "[SCOPE.sCountry('ham_scope').GetName]大火"
dsk_prussia.7.d:0 "我们的德意志友邦[SCOPE.sCountry('ham_scope').GetName]发生了一场可怕的火灾，并造成了巨大的财产损失。在这种情况下，我们是否应该考虑向他们提供援助?"
dsk_prussia.7.f:0 "1842年的一天晚上，汉堡市堤坝大街的一所房子发生了火灾，守夜人用拨浪鼓和叫声制造噪音站岗的士兵开了信号枪,塔尖上的守卫们敲响了火铃。于是有人叫来了消防队。\n大火贪婪地蔓延到那些半木质的房子。它越过堤坝水道，超过7米宽，到达小巷的房子。在很短的时间内小巷的仓库和一直到集市区的房屋部在燃烧。\n狭窄的小路变成了致命的陷阱。消防车无法进这条又小又拥挤的车道，人们惊慌失措 试图逃跑。大火持续了4天,大约分之一的城市被推毁，包括1700栋住宅楼，其中包含4000多所房屋、100多个仓库、七座教堂、两座犹太教堂60所学校和公共建筑，包括汉堡银行以及市政厅。大约有20000人无家可归。"
dsk_prussia.7.a:0 "我们将竭尽所能为[SCOPE.sCountry('ham_scope').GetName]提供援助"
dsk_prussia.7.b:0 "我们无能为力"


dsk_prussia.8.t:0 "《普鲁士工厂矿山条例》"
dsk_prussia.8.d:0 "[SCOPE.gsInterestGroup('is_army_ig').GetName]领袖[SCOPE.sCharacter('army_ig_general').GetFullName]向[ROOT.GetCountry.GetRuler.GetFirstName]提议报告许多孩子在工厂做工，以致普鲁士军队后继无人。许多企业也埋怨，竞争企业靠廉价雇用童工以降低生产成本。"
dsk_prussia.8.f:0 "《普鲁士工厂矿山条例》作为19世纪普鲁士王国的法律文件，规范了工厂和矿山的劳动条件、生产安全、工人权益以及企业的运营和管理。"
dsk_prussia.8.a:0 "马上全国推广"
dsk_prussia.8.b:0 "不要操之过急"

pru_children_modifier:0 "《普鲁士工厂矿山条例》"

dsk_pru_child_law:0 "限制童工法"
dsk_pru_child_law_reason:0 "19世纪是[SCOPE.GetRootScope.GetCountry.GetName]乃至整个德国工业化快速发展的时期。随着工业革命的推进，工厂和矿山的数量迅速增加，大量农村人口涌入城市成为工人。这种快速的工业化进程带来了一系列社会问题，如工人权益保护、生产安全等，需要政府通过立法来加以规范"



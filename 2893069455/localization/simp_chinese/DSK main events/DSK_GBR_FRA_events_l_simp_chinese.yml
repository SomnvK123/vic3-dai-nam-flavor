pax_britannica_events.1111.d:0 "不列颠之晨"
pax_britannica_events.1111.f:0 "必须确保帝国疆域及其势力范围的长治久安！"
pax_britannica_events.0.f:0 "“1815年之前，他们已经在整个世界历史上获得了最完整的胜利，在对法国的二十年战争中获得了最完整的胜利，成为唯一的工业化经济体、唯一的海军强国——1840年的英国海军拥有的船只几乎与所有其他海军加在一起一样多——以及几乎是世界上唯一的殖民地强国。”\n\n#!#!- 艾瑞克·霍布斯鲍姆，《革命时代》"

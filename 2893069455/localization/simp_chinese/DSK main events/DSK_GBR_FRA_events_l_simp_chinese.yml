je_ger_colony:0 "德属殖民地"
je_ger_colony_tt:0 "我们要阳光下的土地！"
je_ger_colony_reason:0 "先生们似乎担心我们会卷入#yellow 东亚地区#!的一场冒险中。不过先生们，别害怕！\n总理阁下不是那种人，他的幕僚也不是喜欢白忙活的人。我们绝对不是好管闲事。但我们认为，我们从一开始就不应将德国排除在与其他国家在这有远大前途的肥沃土地上的竞争之外。让别的民族去分割大地和海洋，而我们[concept_germany_second_empire]为恪守教条只满足于蓝色天空的时代已经过去了。#v 我们认为，创造并促进我们的航运、贸易和工业利益，尤其是我们在东方的利益，是我们的首要任务。#!\n我们的巡洋舰分队现在已经被派往[SCOPE.sCountry('chi_scope').GetName]并占领了#v 胶州湾#!，以确保被杀害的两位[SCOPE.sReligion('catholic_religion').GetName]传教士得到应有的赔偿。并保证在华传教士上的安全，以免日后再发生此类事件。\n事实上我们正为此进行谈判，但由于此次双边谈判和这个案件的性质，我不得不斟字酌句。我现在也只能这么说：我们对[SCOPE.sCountry('chi_scope').GetName]只怀有仁慈友善的意图。我们不想冒犯或挑衅#yellow 中国#!。\n尽管我们遭受了非常不公正的待遇，但是对胶州湾的占领仍要小心进行。我们希望延续两国长久的伙伴关系，虽然这种伙伴关系在过去从未受到干扰，但维持这种友谊的先决条件是双方相互尊重彼此的权利。\n中国人对我们传教士的屠杀是明显而令人信服的干预理由，因为我们不相信这些虔诚的人正在和平地履行自己的神圣职务时被排除在法律之外。事实上，除了这个不幸的事件，我们还有许多其他针对#yellow 中国#!的不满。 \n我们希望我们能在相互尊重对方的谈判环境中成功解决问题，但是我们不能允许在中国盛行这样的观点：可以与我们一起享有自由，而不会与他国一起享有自由。#bold 我们必须要求德国的传教士、商人、货物以及德国国旗和德国船只在中国会得到与其他列强一样的尊重。#!我们很乐意去尊重其他[concept_great_power]在中国的利益，并确保我们自己的利益也会得到他们应该给予的认可。\n\n一言以蔽之：#red 我们不想动任何人手里的那杯羹，但我们也要属于自己的那阳光下的土地。#!"

dsk_prussia.22.t:0 "假妥协"
dsk_prussia.22.d:0 "[Concept('concept_ruler','$RULER_TITLE_KING$')][ROOT.GetCountry.GetRuler.GetFirstName]重回#yellow 柏林#!正式下令解散议会，实现了反[concept_revolution]政变"
dsk_prussia.22.f:0 "日光闪烁着晃来晃去，\n\n波浪摇荡着快乐的小舟。\n\n一片欢笑和歌唱！我坐在里边\n\n轻松愉快，和些亲爱的朋友。\n\n小舟完全撞成了碎片，\n\n朋友们都不善游泳，\n\n他们在祖国沉没了；\n\n暴风把我吹到塞纳河畔。\n\n和新的同志们登上一只新船；\n\n他乡的潮水汹涌，\n\n把我的船摇来摇去——\n\n故乡多么远！我的心多么沉重！\n\n又是一片欢笑和歌唱——\n\n风在呼哨，船板戛戛地响——\n\n天空消逝最后的星光——\n\n多么沉重我的心！多么远我的故乡"
dsk_prussia.22.a:0 "早知如此，何必当初"

dsk_prussia.23.t:0 "真妥协"
dsk_prussia.23.d:0 "[Concept('concept_ruler','$RULER_TITLE_KING$')][ROOT.GetCountry.GetRuler.GetFirstName]向[concept_revolution]派妥协，保留了自由宪法和公民集会权！"
dsk_prussia.23.f:0 "在[concept_germany][concept_revolution]中，#yellow 马克思#!、#yellow 恩格斯#!进行了大量的活动。[SCOPE.sCountry('fra_scope').GetName]二月革命胜利后，#bold 巴黎#!成了欧洲[concept_revolution]的中心。大批德国、波兰、意大利的流亡者纷纷来到#bold 巴黎#!，掀起了组织革命军团以打回故乡参加革命的热潮。#yellow 马克思#!、#yellow 恩格斯#!也从#bold 布鲁塞尔#!来到#bold 巴黎#!。在#bold 巴黎#!，他们帮助改组了共产主义者同盟，组成了以#yellow 马克思#!为主席，#yellow 恩格斯#!参加的新的中央委员会"
dsk_prussia.23.a:0 "[concept_revolution]真的胜利了吗？？"

je_dsk_berlin_spring_tt:0 "[concept_revolution]火苗危在旦夕"



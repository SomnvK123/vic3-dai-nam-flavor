 dsk_aus.29.t:0 "德意志，高于一切"
 dsk_aus.29.d:0 "在忧郁和黑暗中，我们将它珍藏！现在我们终于使它恢复了自由，从灵柩中解放出来！啊，你像闪电，像雷鸣，像大海咆哮！万岁，黑、红、金！硝烟般乌黑，鲜血般殷红，金色火焰熊熊燃烧"
 dsk_aus.29.f:0 "听啊！莱茵的波涛击碎铁链，\n黑森林的风呼啸着真理的箴言。\n\n从科隆的尖塔到巴伐利亚的麦田，\n自由的火把点燃了四月的平原。\n\n议会钟声撞破诸侯的黄昏，\n不再有哈布斯堡的鹰与巴登的鹿。\n\n四十八颗星辰指引历史的舵盘，\n黑红金三色旗将指引我的路！"
 dsk_aus.29.a:0 "黑红金[concept_germany]，已在血脉中永生，[SCOPE.GetRootScope.GetCountry.GetName]万岁！"
 dsk_aus.29.b:0 "黑红金[concept_germany]，让我们携手向前，[SCOPE.GetRootScope.GetCountry.GetName]万岁！"

 je_great_german:0 "法兰克福德意志方案"
 je_great_german_reason:0 "[SCOPE.sCountry('frm_scope').GetAdjective]国民议会议员在应对石勒苏益格危机的同时，也在商讨统一的[concept_germany]应该包含哪些领土。由于[SCOPE.GetRootScope.GetCountry.GetName]与[SCOPE.sCountry('aus_scope').GetName]两个大邦有大量的非[concept_germany]领土不在邦联范围之内，因此普奥两邦的这些领土应不应该并入[concept_germany]，成为了议员们重点商讨的问题。\n\n随后议员们提出了“大[concept_germany]”与“小[concept_germany]”两个方案。“小[concept_germany]”就是由普鲁士主导德意志而将奥地利排除在外；“大[concept_germany]”即包含奥地利的德意志，但有两个变体，一个是只包含[SCOPE.sCountry('aus_scope').GetName]的[concept_germany]领土，另一个是包含[SCOPE.sCountry('aus_scope').GetName]为的非[concept_germany]领土。\n\n10月27日，法兰克福国民议会通过了“大德意志”方案，但只允许[SCOPE.sCountry('aus_scope').GetName]为主的[concept_germany]人及其土地加入统一的[concept_germany]。"

 je_great_german_tt:0 "#o 不再有暴君！不再有压迫！[concept_germany]民族要走[concept_germany]的路！#!"

 give_up_hun_button:0 "煽动[concept_magyar]起义！"
 give_up_hun_button_desc:0 "同一把火炬曾烧穿三十个诸侯的夜，我听见布达佩斯的砖石在哭诉，那顶缀满谎言的圣斯蒂芬王冠，要将匈牙利的灵魂彻底束缚！"

 help_hun_button:0 "帮助[concept_magyar]独立！"
 help_hun_button_reason:0 "拆穿那用德语粉饰的屠夫敕令，唾弃那皇帝口中“神圣同盟”的泡影，直到王冠坠入多瑙河的砧火，从此不再有异邦人的压迫！"

 dsk_prussia.35.t:0 "#yellow 维也纳#!的暴君"
 dsk_prussia.35.d:0 "德意志自由派学者提议加入[concept_hungary_kindom]起义军帮助[concept_magyar]独立"
 dsk_prussia.35.f:0 "当多瑙河的第五次凌汛撕裂布达佩斯码头时，暗红色酒桶顺着激流漂抵佩斯城。桶内除却托考伊葡萄酒特有的蜜香，还藏着耶拿大学冶金系设计的膛线图纸，以及用《尼伯龙根之歌》乐谱加密的军火清单。维也纳宫廷的密探始终不明白，为何那些在[SCOPE.sCountry('frm_scope').GetAdjective]议会高唱《守卫莱茵河》的教授们，会突然对[concept_hungary_kindom]民谣产生兴趣——直到他们发现科马罗姆要塞的炮台射界，竟与斯图加特天文台绘制的星图完全吻合。\n\n[SCOPE.sCharacter('crisis_scope_1').GetLastName]的双头鹰在[concept_hungary_kindom]议会穹顶投下阴影，却未能察觉阴影中滋长的光斑：柏林机械协会"意外"损毁的十五台蒸汽锻锤，三周后竟在德布勒森农具厂轰鸣；符腾堡诗人捐赠的八百本《马扎尔语语法》，封皮下压着巴登轻骑兵的布防图。莱比锡咖啡馆里的棋局忽然换了规则，总有人用黑棋主教走[concept_hungary_kindom]开局，并在吃掉白方城堡时低语："该让雄鹰回归喀尔巴阡山巅了。""
 dsk_prussia.35.a:0 "即日起兵！共同对抗哈布斯堡暴君，帮助[concept_magyar]！"
 dsk_prussia.35.b:0 "还是通过物资援助和敌后战场的方式帮助[concept_magyar]吧！"


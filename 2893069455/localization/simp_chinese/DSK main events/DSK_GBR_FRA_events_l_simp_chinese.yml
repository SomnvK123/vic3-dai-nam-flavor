 je_dsk_empire_war:0 "王朝战争"
 je_dsk_empire_war_tt:0 "去吧[concept_germany]人！为了[concept_germany]的统一！"
 je_dsk_empire_war_reason:0 "1848年法兰克福国民议会制定宪法时，以加格恩为首的资产阶级自由派提出：建立一个不包括[SCOPE.sCountry('aus_scope').GetName]在内的[concept_germany]联邦，然后再同[SCOPE.sCountry('aus_scope').GetName]签订条约，同其建立某种联盟关系。\n\n实际上是排斥[SCOPE.sCountry('aus_scope').GetName]，在[SCOPE.GetRootScope.GetCountry.GetName]的领导下统一[concept_germany]。\n\n拥护这一方案的主要是[SCOPE.GetRootScope.GetCountry.GetName]和[concept_germany]北、西、中部各邦资产阶级代表，在议会中属多数派。\n\n1850年爱尔福特联盟议会的召开是实现该方案的第一个具体行动。\n\n现在该由我们决定统一[concept_germany]的道路！"

 SCHLESWIG_HOLSTEIN_tt:0 "\n#v 打赢与[SCOPE.sCountry('den_scope').GetName]的第一次王朝战争，吞并石勒苏益格-荷尔斯泰因！#!"
 Aus_is_no_leader_tt:0 "\n#v 打赢与[SCOPE.sCountry('aus_scope').GetName]的第二次王朝战争，让其彻底放弃统一[concept_germany]的野心！#!"
 ALSACE_LORRAINE_tt:0 "\n#v 打赢与[SCOPE.sCountry('fra_scope').GetName]的第三次王朝战争，并吞并阿尔萨斯洛林！#!"
 we_are_german:0 "我们的[Concept('concept_ruler','$RULER_TITLE_KING$')][ROOT.GetCountry.GetRuler.GetFirstName]将在[SCOPE.sCountry('fra_scope').GetName]的#bold 凡尔赛宫#!加冕为全[concept_germany]的[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]！"
 aus_is_our_friend:0 "\n#v [SCOPE.sCountry('aus_scope').GetName]将作为我们血溶于水的兄弟与我们彻底改善关系！#!"
 we_are_german_tt:0 "\n#v 我们已经成立了#yellow 德意志帝国#!([concept_germany_second_empire])"

je_aus_ger_union:0 "德奥同盟"
je_aus_ger_union_reason:0 "普法战争后，[SCOPE.sCountry('ger_scope').GetName]与[SCOPE.sCountry('fra_scope').GetName]结怨\n在巴尔干，[SCOPE.sCountry('aus_scope').GetName]与[SCOPE.sCountry('rus_scope').GetName]有严重的利益冲突！\n\n为了对抗[SCOPE.sCountry('fra_scope').GetName]和[SCOPE.sCountry('rus_scope').GetName]的围堵和安全威胁,[SCOPE.sCountry('ger_scope').GetName]有必要与同文同种的[SCOPE.sCountry('aus_scope').GetName]的兄弟国签订长久的[concept_alliance]，以应对未来即将到来的[concept_great_power]的[concept_diplomatic_play]。\n\n在首相#yellow 俾斯麦#!的建议下，需要开始积极筹备反俄的德奥[concept_alliance]条约！\n若缔约国一方遭受攻击，他方应以全部兵力援助，并不得单独媾和！\n\n#yellow 德奥同盟#!每月将通过下列关系#v 增长#!:\n•与#yellow 缔约国一方#!保持#green 友善#!以上的关系（#green +2#!）。\n•与#yellow 缔约国一方#!签订[concept_alliance]或#yellow 利益同盟#!#bold 条约#!（#green +2#!）"
je_aus_ger_union_tt:0 "[SCOPE.sCountry('ger_scope').GetName]与[SCOPE.sCountry('aus_scope').GetName]血浓于水的关系可以征服山和海！"


dsk_prussia.21.t:0 "德奥同盟邀请"
dsk_prussia.21.d:0 "[SCOPE.sCountry('ger_scope').GetName]向我们发来德奥同盟邀请，意在孤立和打击[SCOPE.sCountry('fra_scope').GetName]，并且支持我们在#v 巴尔干#!的利益"
dsk_prussia.21.f:0 "条约主要内容：\n\n缔约国一方遭到俄国的进攻，他方应以全部兵力援助，并不得单独媾和\n\n一方遭到第三国（指法国）进攻，他方应采取善意的中立；如进攻的国家得到俄国支持，缔约双方应共同作战\n\n条约有效期为五年，经协商可予延期和修改\n\n缔约双方对条约保守秘密。这个条约1888年公布，是德国建立军事集团的开始。后不断续订，至1918年一直有效"
dsk_prussia.21.a:0 "应允"
dsk_prussia.21.b:0 "现在还不是时候"


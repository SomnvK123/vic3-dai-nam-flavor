annex_yuenan_button_desc:0 "自17世纪以来，法国就开始了其殖民扩张的历程。在亚洲地区，法国也积极寻求新的殖民地以扩大其海外势力范围。印度支那地区因其重要的地理位置和丰富的资源，成为法国殖民扩张的重要目标。"
fra_colony:0 "法兰西联邦"
annex_indochina:0 "法属印度支那"
annex_indochina_reason:0 "印度支那半岛地处东南亚，连接了[SCOPE.sCountry('chi_scope').GetName]、东南亚其他国家以及南亚的印度，其地理位置具有极高的战略价值。[SCOPE.GetRootScope.GetCountry.GetName]希望通过控制这一地区，加强对东南亚乃至远东地区的影响力。\n随着工业革命的推进，我们需要更广阔的市场来消化其工业产品。印度支那地区人口众多，消费潜力巨大，是我们扩张市场的重要目标。"
dsk_france.25.t:0 "法属印度支那的地位"
dsk_france.25.d:0 "1883到1885年间，法国为了扩大其在印度支那地区的势力范围，与中国爆发了中法战争。最终，中国战败，签订了《中法新约》，正式放弃了对越南的宗主权，越南遂被法国占领。这一事件标志着法国在印度支那地区殖民统治的确立"
dsk_france.25.f:0 "在占领越南后，法国又通过一系列战争和外交手段，将老挝和柬埔寨纳入其殖民统治范围，最终形成了法属印度支那联邦。法国在该地区实行了残酷的殖民统治，对当地人民进行了残酷的剥削和压迫
dsk_france.25.a:0 "我要在法属印度支那派遣一个总督替我们管辖"
dsk_france.25.b:0 "还是让他们做殖民地的二等人吧"

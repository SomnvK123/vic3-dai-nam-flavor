je_dsk_prussia_army:0 "铁与血" 
je_dsk_prussia_army_reason:0 ""普鲁士在德意志的地位，不取决于它的自由主义，而是取决于它的力量……当代的重大问题不是通过演说和多数派决议所能解决的，而是要用铁和血来解决！"\n\n帝国宰相以他极具辨识性的声音在预算会议上发表了这篇振聋发聩的演说，这次演说在后世被认为是一个标志性的事件，为后来普鲁士王国乃至德意志帝国数十年的外交方针奠定了基调。以此为分水岭，在这之后的每一次军事动员、每一次外交会议，无一不是出于践行和推进该外交方略的考量。" 

dsk_je_united_kingdom_of_great_britain_and_ireland_reason:0 "1815年之前，[SCOPE.GetRootScope.GetCountry.GetName]已经在整个世界历史上获得了最完整的胜利，在对[SCOPE.sCountry('fra_scope').GetName]的二十年战争中获得了最完整的胜利，成为唯一的工业化经济体、唯一的海军强国。到1836年，我们的海军拥有的船只几乎与所有其他海军加在一起一样多。我们是世界上唯一的[Concept('concept_super_power','$concept_super_powers$')]。\n\n日不落帝国桂冠现在从[SCOPE.sCountry('spa_scope').GetName]戴在了我们的头上，不列颠的全球霸权顶峰时代已经到来！\n\n #red “太阳为何永远在大英帝国的疆域上？因为上帝不信英国人在黑暗中！”#!"

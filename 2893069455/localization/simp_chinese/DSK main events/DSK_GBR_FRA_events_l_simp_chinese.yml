dsk_prussia.50.t:0 "致母亲"
dsk_prussia.50.d:0 "#black 亲爱的母亲：                                            #!"
dsk_prussia.50.f:0 "#black                   当您收到这封信时，我希望您一切安好。我们已经被德国军队围困了许久，不过请您放心，围城暂时还未严重影响到我的健康。只是现在几乎没什么肉吃了，但好在我们还有一些物资能够支撑。我听说巴黎城里有许多人忍饥挨饿，相较之下，我已算幸运。\n                   母亲，您不用担心我，我每天都在关注着战事。巴黎的同胞们满怀热情与奉献精神，大家都英勇地为阻止德国人而战。我们可能会面临一些挫折，可我坚信，巴黎人最终必定会取得胜利！前几日，从11月29日到12月1日，这里发生了激烈的战役，我们法国士兵成功击败了普鲁士士兵，还夺取了他们的大炮，抓住了 1000 名俘虏。\n                   母亲，您一定要照顾好自己。请代我拥抱叔叔、阿姨和玛丽亚。我全心全意地想念着您，期盼着能早日与您重逢。\n                                                         您忠诚的儿子"
dsk_prussia.50.a:0 "来自[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]"
 je_fra_Madagascar:0 "法属马达加斯加保护国"
  je_fra_Madagascar_reason:0 "[SCOPE.sCountry('mad_scope').GetName]加位于非洲东海岸，具有重要的地理战略位置。我们希望通过控制马达加斯加，加强其在非洲东部地区的影响力，并防范其他欧洲列强的竞争。目前，\n[SCOPE.sCountry('mad_scope').GetName]的社会结构陷入了混乱，这为我们的殖民活动提供了可乘之机。如果我们利用当地的社会矛盾，通过扶持亲法势力等手段，就能实现对他们的控制。"
  dsk_france.7.t:0 "马达加斯加的地位"
dsk_france.7.d:0 "我们控制了这巨大的非洲岛屿"
dsk_france.7.f:0 "将马达加斯加与法国在印度洋的诸多岛屿殖民地合并为马达加斯加殖民地及属地，即法属马达加斯"
dsk_france.7.a:0 "废黜拉纳瓦卢娜，将这里变成[SCOPE.GetRootScope.GetCountry.GetName]的殖民地"
dsk_france.7.b:0 "我们会对待小弟一样好好对待他们"

je_french_africa:0 "法属非洲"
je_french_africa_reason:0 "非洲是世界面积第二大的洲，拥有丰富的自然资源，包括金刚石、黄金、铬铁矿、磷酸盐等矿产，狮子、犀牛、大象、红木、黑檀木、花梨木等野生动植物。另外，在殖民时代，非洲的黑奴也被视作是一种资源。\n如果我们能够控制这片未开化的大陆，[SCOPE.GetRootScope.GetCountry.GetName]的财富将取之不尽用之不竭。"
je_french_africa_tt:0 "在非洲大陆上创造一个法兰西殖民地联邦"
all_african_be_french:0 "所有西非[concept_culture]的[Concept('concept_pop', '$concept_pops$')]会被同化成[SCOPE.sCulture('french_african_culture').GetName]"
dsk_france.8.t:0 "法属非洲殖民地的胜利"
dsk_france.8.d:0 "荣耀之光：法国在法属非洲殖民地的辉煌胜利篇章"
dsk_france.8.f:0 "在那片广袤无垠、充满神秘与未知的非洲大陆上，[SCOPE.GetRootScope.GetCountry.GetName]以其深远的战略眼光和坚定的决心，逐步建立了稳固的殖民地体系。这不仅仅是一场地理版图的扩张，更是法国文化与非洲多元文明的一次深刻交流与融合"
dsk_france.8.a:0 "[SCOPE.sCulture('french_african_culture').GetName]将会和[SCOPE.sCulture('french_culture').GetName]一样平等。"
dsk_france.8.b:0 "[SCOPE.sCulture('french_culture').GetName]的爷就是爷！"
modifier_france_super_colony:0 "在黑暗大陆的统治"

dsk_france.9.t:0 "[SCOPE.GetRootScope.GetCountry.GetName]与她的子民"
dsk_france.9.d:0 "科西嘉岛是法国的一个海外领土，位于地中海，与意大利的撒丁岛隔海相望。自1769年法国与热那亚签订《凡尔赛条约》后，科西嘉岛正式成为法国领土。奥克地区通常指的是法国南部的一个文化区域，而非一个正式的属国区域。这些居民都是法国多元文化中的一个重要组成部分"
dsk_france.9.f:0 "从地理位置和文化背景来看，[SCOPE.sCulture('occitan_culture').GetName]和[SCOPE.sCulture('french_culture').GetName]之间并没有直接的联系。奥克是法国南部的一个文化区域，而科西嘉则是一个远离法国本土的岛屿"
dsk_france.9.a:0 "[SCOPE.sCulture('occitan_culture').GetName]和[SCOPE.sCulture('corsican_culture').GetName]都是[SCOPE.sCulture('french_culture').GetName]人，不容分割"
dsk_france.9.b:0 "我们尊重文化差异性，[SCOPE.sCulture('occitan_culture').GetName]、[SCOPE.sCulture('corsican_culture').GetName]和[SCOPE.sCulture('french_culture').GetName]携手向前！"
je_fra_monarch:0 "[concept_monarchie_de_Juillet]"
je_fra_monarch_tt:0 "#v 君权神授，济世济民#!"
all_occitan_be_french:0 "所有[SCOPE.sCulture('occitan_culture').GetName]、[SCOPE.sCulture('corsican_culture').GetName]的[Concept('concept_pop', '$concept_pops$')]会被同化成[SCOPE.sCulture('french_culture').GetName]。"
je_fra_monarch_reason:0 "19世纪初的[SCOPE.GetRootScope.GetCountry.GetName]，在查理十世的统治下，社会矛盾日益激化。查理十世推行了一系列倒行逆施的政策，如清洗军中曾为拿破仑效力的军人、恢复土地贵族的权力、赔偿旧贵族损失、减少国债利息、加强言论管制、复兴旧宗教秩序等，这些政策触怒了中产阶级、工人阶级和知识分子\n在革命的压力下，查理十世于7月30日任命奥尔良公爵路易·菲利浦为摄政官。7月31日，路易·菲利浦在巴黎市政厅阳台上接受摄政官称号。8月2日，查理十世将王位让与其孙波尔多公爵，但路易·菲利浦拒绝承认。8月7日，众议院正式召路易·菲利浦即位，建立了奥尔良王朝。\n\n#yellow [concept_monarchie_de_Juillet]#!会根据#v #tooltippable;tooltip:[Country.GetTooltipTag],je_french_Kingdom_house_pos 现行国内状况#!#!积攒[concept_monarchie_de_Juillet]的#N 稳定值#!，消耗#N 稳定值#!就可以颁布一个政策"
je_french_Kingdom_house_pos: "以下条件将每个月#bold 积攒#!#N 稳定值#!：\n•执行任何#yellow 选举形式#!（#green +2#!）。\n•执行任何#yellow 内务机构#!（#green +1#!）。\n•执行任何#yellow 卫生机构#!（#green +1#!）。\n•执行任何#yellow 福利机构#!（#green +1#!）。\n•执行任何#yellow 商品化农业#!或#yellow 宅地法#!（#green +1#!）。\n•全国#yellow [Concept('concept_sol', '$SOL_SHORT_TEXT$')]>15#!且国家卫阶为[concept_super_power]（#green +5#!）。"
dsk_fra_monarchy_time:0 "王权神授"
support_life_button:0 "支持民生"
support_life_button_desc:0 "颁布的宪章中放宽了选民及被选举人的财产资格，使得更多人能够参与政治和经济活动，从而促进了市场的活跃和竞争，间接有利于民生改善\n政府加大了对基础设施建设的投入，特别是铁路和交通网络的建设。这不仅改善了交通条件，降低了运输成本，还促进了资源和产品的流通，为民众的生活提供了便利"
enough_french_Kingdom_house_var:0 "#bold 积攒#!了足够多的#N 稳定值#!"
modifier_french_kingdom_life:0 "法兰西民生"
make_alliance_button:0 "改善外交条件"
make_alliance_button_desc:0 "[concept_monarchie_de_Juillet]建立后，迅速恢复了大革命创立的“八九年原则”，重新建立起议会政治。这一举措不仅稳定了国内政局，也为法国在国际舞台上树立了民主、法治的形象，有利于改善外交环境\n路易-菲利普对欧洲协调机制的态度十分重视，他努力维护这一机制的原则和领土现状，以换取法国在东方三国中的道义上的威望。这种态度有助于法国在国际事务中保持一个受尊重的大国角色"
support_homeland_button:0 "支持投资"
support_homeland_button_desc:0 "政府通过提供税收优惠、土地和资金支持等方式，鼓励企业家投资工业项目。这些措施降低了投资门槛，提高了投资的回报率，吸引了大量资金流向工业领域"
modifier_french_kingdom_education:0 "法兰西教育"
support_education_button:0 "支持教育"
modifier_french_kingdom_alliance:0 "法兰西外交"
support_education_button_desc:0 "1833年6月28日，公共教育部长弗朗索瓦·吉佐特通过了第一部有关初等教育的法律，特别规定了对男孩的教育，并要求每个城市都有义务提供至少五百多名居民来维持小学以便为男孩提供教育\n1836年，吉佐特法律得到了扩展，没有市政义务的女孩也成为这项法律的对象，标志着法国初等教育向更加普及和平等的方向发展"
modifier_french_kingdom_support_homeland:0 "法兰西投资"

dsk_france.10.t:0 "克里米亚战争"
dsk_france.10.d:0 "[SCOPE.sCountry('tur_scope').GetName]于1853年5月拒绝了[SCOPE.sCountry('rus_scope').GetName]的最后通牒，并允许[SCOPE.sCountry('gbr_scope').GetName]、[SCOPE.sCountry('fra_scope').GetName]联合分舰队进入达达尼尔海峡。俄土断交。"
dsk_france.10.f:0 "当矛盾达到不可调和的地步时，只有一战"
dsk_france.200.d:0 "1853年2月，亚历山大·谢尔盖耶维奇·缅希科夫亲王作为[SCOPE.sCountry('rus_scope').GetName]全权特使前往君士坦丁堡，要求[SCOPE.sCountry('tur_scope').GetName]政府承认俄皇[SCOPE.sCharacter('crisis_scope_1').GetFirstName]对苏丹[SCOPE.sCharacter('crisis_scope_6').GetFirstName]统治下的[SCOPE.sReligion('orthodox_religion').GetName]臣民（[SCOPE.sCulture('greek_culture').GetName]、[SCOPE.sCulture('bulgarian_culture').GetName]、[SCOPE.sCulture('romanian_culture').GetName]以及[SCOPE.sCulture('serb_culture').GetName]等）有特别保护权。就在这时，巴尔干土耳其领地门的内哥罗发生革命，土耳其军队开进门的内哥罗镇压。缅希科夫在君士坦丁堡获得了重大胜利，苏丹答应在圣地保护权上做出一切必要让步。然而，缅希科夫得到沙皇的指示又提出新的要求，要求苏丹答应签定一项新条约，[SCOPE.sCountry('tur_scope').GetName]应该从门的内哥罗撤军。这不啻于将巴尔干拱手让与沙皇，苏丹[SCOPE.sCharacter('crisis_scope_6').GetFirstName]无法答应这个这个苛刻的要求。另外一个重要原因是[SCOPE.sCountry('gbr_scope').GetName]驻[SCOPE.sCountry('tur_scope').GetName]大使雷德克利夫勋爵鼓励苏丹拒绝俄国的漫天要价，和以往一样[SCOPE.sCountry('gbr_scope').GetName]许诺将在危机中支持土耳其，且这次还有[SCOPE.sCountry('fra_scope').GetName]的支持。\n[SCOPE.sCountry('tur_scope').GetName]于1853年5月拒绝了[SCOPE.sCountry('rus_scope').GetName]的最后通牒，并允许英法联合分舰队进入达达尼尔海峡。俄土断交。"
dsk_france.10.a:0 "“你们不要以战争威胁我，而我可以依仗柏林和维也纳”——[SCOPE.sCharacter('crisis_scope_2').GetFirstName]"
concept_monarchie_de_Juillet:0 "七月王朝"
concept_monarchie_de_Juillet_desc:0 "七月王朝又称奥尔良王朝，是1830年至1848年统治法国的君主立宪制王朝，因国王路易·菲利普出自奥尔良家族而得名，始于1830年法国七月革命。\n1848年2月22日，法国“二月革命”爆发，路易·菲利浦见大势已去，仓惶出逃英国。2月25日革命临时政府宣布成立共和国，即法兰西第二共和国，奥尔良王朝被推翻"
je_fra_empire:0 "[concept_fra_empire]"
concept_fra_empire:0 "法兰西第二帝国"
support_army_button:0 "帝国陆军"
enough_french_empire_house_var:0 "#bold 积攒#!了足够多的#N 拿破仑思想#!"
modifier_french_empire_army:0 "法兰西帝国陆军"
support_army_button_desc:0 "加强对火炮、弹药和装甲车辆等关键装备的研发工作，以提升陆军的自主作战能力和技术水平。"
concept_fra_empire_desc:0 "法兰西第二帝国是波拿巴家族拿破仑的侄子路易·拿破仑·波拿巴在法国建立的君主制政权，先于[concept_fra_republic_3]（1870至1940），而后于法兰西第二共和国（1848至1852）。\n法兰西第二共和国总统路易·拿破仑·波拿巴于公元1851年12月2日发动政变。翌年1月14日颁布宪法，加强总统权力，削弱议会的立法权。1852年11月7日，元老院颁布法令建议恢复帝制。随即举行公民投票，绝大多数表示赞成。12月2日宣布恢复帝国，波拿巴为法兰西皇帝，称拿破仑三世。"
je_fra_empire_reason:0 "[concept_fra_empire]已经建立，虽然帝国政府的架构与第一帝国的几乎一样，但是两者建立的原则却是完全不同。\n[SCOPE.sCharacter('fra_ruler_scope').GetFirstName]经常表示，[concept_fra_empire]的功能就是引导国民认识司法，在外交上则追求永久和平。早前，[ROOT.GetCountry.GetRuler.GetFirstName]在牢狱中和流亡中多次谴责寡头政治之政府忽视社会问题。他在担任第二共和国的总统时，以普选维持其权力，并保持一贯作风，决心以他构想的#N 拿破仑思想#!建立新政府解决上述问题：以属于[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]、被选定的人为民主之代表；以他自己代表拿破仑一世——他那从法国大革命中以武力崛起，保护[SCOPE.GetRootScope.GetCountry.GetName]社会在革命期间所得的伯父。\n\n#N 拿破仑思想#!会根据#v #tooltippable;tooltip:[Country.GetTooltipTag],je_french_empire_house_pos 现行国内状况#!#!积攒，消耗#N 拿破仑思想#!就可以颁布一个政策"
concept_napoleon_thought:0 "拿破仑思想"
concept_napoleon_thought_desc:0 "拿破仑思想根据现阶段国内现状以不同的速度积攒，每花费50点数既可解锁一项政策"
je_french_empire_house_pos:0 "以下条件将每个月#bold 积攒#!#N 拿破仑思想#!：\n•执行#yellow 独裁制#!或#yellow 寡头制#!（#green +2#!）。\n•执行#yellow 秘密警察#!或#yellow 国家宪兵#!（#green +1#!）。\n•执行任何#yellow 卫生机构#!（#green +1#!）。\n•军队数量>#yellow 300#!（#green +1#!）。\n•拥有#yellow 瓦隆尼亚#!和#yellow 佛兰德#!（#green +3#!）。\n•国家卫阶为[concept_super_power]（#green +2#!）。\n•执行#yellow 舆论管制#!或#yellow 异议非法#!或#yellow 出版物审查#!（#green +1#!）"
support_Italian_button:0 "支持撒丁"
support_Italian_button_desc:0 "支持撒丁统一意大利。我们向撒丁王国做出了政治承诺，支持其建立一个包括撒丁王国、伦巴底和威尼西亚以及教皇领地罗曼那在内的上意大利王国。作为交换，他们将同意将其萨伏伊割让给我们。"
modifier_french_empire_italia:0 "萨伏伊领地王冠"
support_ottoman_button:0 "圣地之争"
support_ottoman_button_desc:0 "派拉瓦莱蒂侯爵去君士坦丁堡，要求土耳其宫廷明确的承认法国对大部分圣地教堂拥有保护权。在“东方问题”上，俄罗斯和奥地利、英国都有矛盾，因此我们需竭尽所能挑拨俄奥和俄英关系。"
Notre_Dame_button:0 "巴黎圣母院"
Notre_Dame_button_desc:0 "修建完巴黎圣母院将其开放作为法兰西城市明信片。"
modifier_support_ottoman:0 "挑起圣地之争"
modifier_Notre_Dame:0 "开放巴黎圣母院"
je_fra_railway:0 "巴黎铁路"
je_fra_railway_reason:0 "在[concept_fra_empire]期间，铁路建设取得了巨大成就。铁路里程数从1850年前的3000多公里迅速增长到1869年的16465公里\n随着铁路里程的快速增长，法国逐渐形成了覆盖全国的铁路网络。这些铁路线不仅连接了主要城市和工业中心，还深入到了许多偏远地区，极大地改善了[SCOPE.GetRootScope.GetCountry.GetName]的交通运输条件。"
je_fra_railway_tt:0 "将我们的[SCOPE.sState('beautiful_state').GetName]打造成现代铁路城市"
modifier_fra_railways_modifier:0 "铁路城市"
dsk_france.11.t:0 "熙熙攘攘的巴黎"
dsk_france.11.d:0 "铁路的建设和扩张极大地促进了法国经济的发展。铁路作为重要的交通运输工具，降低了物流成本，提高了商品流通速度，为工业和商业的繁荣提供了有力支撑"
dsk_france.11.f:0 "随着铁路的普及和延伸，一些原本偏远的地区逐渐成为了新的城市或工业中心。这推动了[SCOPE.GetRootScope.GetCountry.GetName]的城市化进程，促进了人口和产业的集聚"
dsk_france.11.a:0 "终于，[SCOPE.sState('beautiful_state').GetName]闪耀着未来的光辉"
je_fra_shopping:0 "巴黎商业"
je_fra_shopping_reason:0 "在[concept_fra_empire]期间,巴黎商业得到了空前的发展，[SCOPE.sCharacter('fra_ruler_scope').GetFirstName]鼓励商业创新，第一批百货商店由他诞生"
je_fra_shopping_tt:0 "将我们的[SCOPE.sState('great_state_scope').GetName]打造成现代商业城市"
modifier_fra_shopping_modifier:0 "商业城市"
modifier_fra_shopping_modifie_2:0 "商业之国"

dsk_france.12.t:0 "繁华的巴黎"
dsk_france.12.d:0 "随着自由贸易政策的实施和交通运输的改善，[SCOPE.GetRootScope.GetCountry.GetName]的商业活动日益繁荣。国内外贸易量不断增加，商品种类日益丰富。法国的商品不仅畅销国内市场，还远销海外多个国家和地区"
dsk_france.12.f:0 "政府大力推动基础设施建设，特别是铁路和交通网络的完善。这极大地降低了物流成本，提高了商品流通速度，为商业的繁荣提供了重要的基础设施保障。"
dsk_france.12.a:0 "终于，[SCOPE.sState('beautiful_state').GetName]闪耀着未来的光辉"
je_fra_Royal_Academy_tt:0 "将我们的[SCOPE.sState('beautiful_state').GetName]打造成现代艺术城市"
je_fra_Royal_Academy:0 "巴黎歌剧院"
je_fra_Royal_Academy_reason:0 "1861年夏天，歌剧院开始着手兴建。然而，在建造过程中遇到了诸多困难，如地基下面有条溪流使地基无法稳固，以及1870年的普法战争和第四次革命使尚未完成的歌剧院停工。尽管如此，建筑师和工人们仍然克服重重困难，最终在1875年正式启用了这座举世闻名的歌剧院"
je_fra_new_paris_tt:0 "将[SCOPE.sState('great_state_scope').GetName]打造成世界浪漫之都"
modifier_fra_art_modifier:0 "歌剧城市"
dsk_france.13.t:0 "崭新的巴黎"
dsk_france.13.d:0 "经过17年的改造，巴黎的城市面貌焕然一新，成为了一个现代化、有序且美丽的城市"
dsk_france.13.f:0 "[SCOPE.GetRootScope.GetCountry.GetName]在19世纪通过整体规划、分阶段实施、重点突破等方式建设了新巴黎。这一过程不仅改变了巴黎的城市面貌，也对其经济、社会和文化产生了深远的影响"
dsk_france.13.a:0 "让更多的人汇聚[SCOPE.sState('beautiful_state').GetName]！"

dsk_france.14.t:0 "浪漫的巴黎"
dsk_france.14.d:0 "随着时间的推移，[SCOPE.GetRootScope.GetCountry.GetName]政府决定重建一座更为宏伟的歌剧院。1860年，年仅35岁的建筑师查尔斯·加尼叶脱颖而出，承担了新歌剧院的设计重任"
dsk_france.14.f:0 "1861年夏天，歌剧院开始着手兴建。然而，在建造过程中遇到了诸多困难，如地基下面有条溪流使地基无法稳固，以及1870年的普法战争和第四次革命使尚未完成的歌剧院停工。尽管如此，建筑师和工人们仍然克服重重困难，最终在1875年正式启用了这座举世闻名的歌剧院。\n歌剧院的建造费用超过了4700万法郎，总面积达到了11237平方米。其规模宏大、精美细致，被誉为是一座绘画、大理石和金饰交相辉映的剧院\n歌剧院的大厅和走廊装饰得富丽堂皇，充满了巴洛克风格的元素。大理石楼梯在金色灯光照射下更加闪亮，天花板和墙面上绘有许多神话故事和寓言故事，展现出浓郁的艺术氛围。"
dsk_france.14.a:0 "难道[SCOPE.sState('beautiful_state').GetName]不浪漫吗？"
je_fra_new_paris_tt:0 "让巴黎的城市面貌焕然一新"
je_fra_new_paris:0 "新巴黎"
je_fra_new_paris_goal:0 "巴黎已经完成三大项建设"
je_fra_new_paris_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]在19世纪建设新巴黎的过程是一个庞大而复杂的城市改造项目，主要由[SCOPE.sCharacter('fra_ruler_scope').GetFirstName]推动，并在乔治·欧仁纳·奥斯曼的领导下实施。\n整体规划：[SCOPE.sCharacter('fra_ruler_scope').GetFirstName]对巴黎进行了整体规划，旨在打造一个现代化、有序且美丽的城市。阶段划分：改造工程大致分为三个阶段进行，每个阶段都有明确的目标和任务。\n拓宽与新建：奥斯曼男爵将巴黎的道路进行了大规模的拓宽和新建，使巴黎的道路系统更加完善。数量与长度：从1852年到1870年，巴黎的道路总长从239英里增加到525英里，其中许多道路都是奥斯曼主持修建的。\n拆旧建新：在改造过程中，大量老旧房屋被拆除，新建了约10万栋房屋和建筑。公共建筑：学校、教堂、剧院、医院等大批公共建筑在改造期间拔地而起，提升了城市的社会服务功能。\n文化遗产与争议：尽管改造过程中拆除了一些历史建筑，但也留下了许多具有历史价值的建筑和文化遗产。同时，改造过程中的争议也反映了城市更新中传承与创新的平衡问题。"


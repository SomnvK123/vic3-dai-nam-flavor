je_great_german_plan:0 "法兰克福德意志：拆分奥地利"
je_great_german_plan_goal:0 "[SCOPE.sCountry('aus_scope').GetAdjective]在多瑙河东岸与北意大利地区的统治已经被摧毁"
je_great_german_plan_tt:0 "对[SCOPE.sCountry('aus_scope').GetAdjective]的施压尚未开始"
je_great_german_plan_1_tt:0 "[SCOPE.sCountry('aus_scope').GetAdjective]对各民族的统治已开始瓦解"
je_great_german_plan_2_tt:0 "[SCOPE.sCountry('aus_scope').GetAdjective]在多瑙河东岸与北意大利地区的统治即将被摧毁"
je_great_german_plan_reason:0 "当奥地利帝国的边疆动荡不安，五百三十万[concept_germany]人的联署书已在圣保罗教堂登记造册。以#yellow 斐迪南五世#!公然违背《四月法令》为标志，#yellow 奥地利帝国#!对治下非[concept_germany]民族的压迫已然登峰造极：对匈牙利起义的镇压、于米兰五日的屠戮、在加利西亚的大屠杀等等暴行早已不胜枚举。\n\n我们严正要求：自本公告发布之日起，[SCOPE.sCountry('aus_scope').GetAdjective]应终止对非[concept_germany]民族的种种暴行，基于人口分布，划分[concept_germany]和非[concept_germany]聚集区；于限定时日内解散在非[concept_germany]民族聚居区的宪兵队，将驻扎在该区域的军队调拨回[concept_germany]区域；将布达佩斯、米兰、布拉格设为自由市，由[SCOPE.sCountry('frm_scope').GetAdjective]议会监督选举；基于民族自决原则，在各民族的选举下组建各自的新政府...\n\n最后通牒：自即日起九十日内，若[SCOPE.sCountry('aus_scope').GetAdjective]仍未响应我方倡议加入德意志国，我方将与其正式进入战争状态。"



dsk_prussia.43.t:0 "《维也纳条约》"
dsk_prussia.43.d:0 "签字桌上，[SCOPE.sCountry('aus_scope').GetAdjective]代表的脊背挺得笔直，但签字的动作却十分僵硬。[SCOPE.sCountry('aus_scope').GetAdjective]拒绝将#yellow 威尼托#!及#yellow 弗留利#!大部直接交给[SCOPE.sCountry('ita_scope').GetName]。对维也纳而言，向正面击溃自己的[SCOPE.sCountry('pru_scope').GetAdjective]低头并非耻辱，但把领土直接交给手下败将，则是对帝国不可容忍的侮辱。于是，他们进行了这场特殊的外交编排以完成领土变更。\n\n[SCOPE.sCountry('fra_scope').GetAdjective]将代为接收威尼托及弗留利。在法理上，它们现在属于巴黎。但每个人都心知肚明，这不过是个毫无意义的中转站。这两块地区很快将进行公投并加入意大利。[SCOPE.sCountry('aus_scope').GetAdjective]用繁琐的外交辞令和第三方托管，为帝国千疮百孔的威严披上最后一块遮羞布。"
dsk_prussia.43.a:0 "拥抱[concept_germany]吧，我的奥地利兄弟。


later_dsk_empire_war:0 "与[SCOPE.sCountry('aus_scope').GetAdjective]的关系会被暂时缓和"

dsk_prussia.37.t:0 "解散法兰克福议会"
dsk_prussia.37.d:0 "奉国王敕令，[SCOPE.GetRootScope.GetCountry.GetName]军队开进圣保罗教堂，议会被迫解散。"
dsk_prussia.37.f:0 "随着[SCOPE.sCountry('pru_scope').GetAdjective]军队突袭会议厅，法兰克福国民议会的议程被迫画上了休止符。议会代表被扣押，宪法草案被扔进壁炉付之一炬，那些记录着他们昔日成果的会议纪要此时却成了这些议员们的累累罪证。"
dsk_prussia.37.a:0 "次日，波茨坦发布《法兰克福议会解散公告》。"

dsk_prussia.38.t:0 "莱茵工业区与西里西亚矿产"
dsk_prussia.38.d:0 "西里西亚和莱茵地区是普鲁士分别在奥地利王位继承战争和拿破仑战争后的的维也纳会议中取得的土地，经过过去几十年的工业建设，这两片地区成为了普鲁士新的发展中心。"
dsk_prussia.38.f:0 "白天和黑夜的界限在这里模糊，工厂的灯光点缀着城市的夜空，从中传出的永不停歇的汽锤声是普鲁士工业心脏的一次次脉动。\n\n从这两座巨型工厂铺设出的铁路如同血管携带着营养输送向沿线，为王国各地运输着所需的工业产品，整个普鲁士的蓬勃发展和国家命脉皆系于此。"
dsk_prussia.38.a:0 "工业机器与轰鸣声，这是独属于[concept_germany]人的浪漫"


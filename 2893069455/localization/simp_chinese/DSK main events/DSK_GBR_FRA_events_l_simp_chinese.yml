 dsk_prussia.9.t:0 "帝国宪法制定完成"
 dsk_prussia.9.d:0 "经过多日的努力，#blue 《德意志帝国宪法》#!终于在国民议会中通过，然而，[SCOPE.sCountry('aus_scope').GetName]已经退出了国民议会，导致其合法性大打折扣,在这种情况下，剩余的国民议会议员们选举了:[SCOPE.GetRootScope.GetCountry.GetName]的[ROOT.GetCountry.GetRuler.GetFirstName]作为新生[concept_germany]的[Concept('concept_ruler','$RULER_TITLE_KAISER$')]。\n帝国宪法于3月27日通过。"
 dsk_prussia.9.f:0 "次日，[SCOPE.GetRootScope.GetCountry.GetName][ROOT.GetCountry.GetRuler.GetFirstName]被选举为世袭[Concept('concept_ruler','$RULER_TITLE_KAISER$')]\n人们劝他立刻接受皇位，他却犹豫了一个月。他的幕僚并非都反对[SCOPE.GetRootScope.GetCountry.GetName]领导[concept_germany]，他们认为，同意宪法后他们就可以对宪法进行一些重大修订，包括对选举权的限制。与此同时，28个邦的自由派政府都接受立宪、值坏消息是：[SCOPE.sCountry('han_scope').GetName]、[SCOPE.sCountry('bav_scope').GetName]和[SCOPE.sCountry('sax_scope').GetName]等大多效[concept_germany]中部的邦国都拒绝接受宪法。尽管如此、新政治秩序的可行性最终还要取决于:[SCOPE.GetRootScope.GetCountry.GetName]政府是否积极响应。"
 dsk_prussia.9.a:0 "情况不容乐观"

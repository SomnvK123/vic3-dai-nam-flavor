dsk_prussia.39.t:0 "《十一月条约》"
dsk_prussia.39.d:0 "[SCOPE.sCountry('bav_scope').GetName]、[SCOPE.sCountry('wur_scope').GetName]以及[SCOPE.sCountry('bad_scope').GetName]和[SCOPE.sCountry('hes_scope').GetName]加入了德意志联邦。"
dsk_prussia.39.f:0 "这些条约通过外交手段解决了德国统一最后的法律障碍，虽然各邦国对于加入统一德国的态度并不一致，但由于两次王朝战争的光荣胜利以及民族主义情绪空前高涨，南德四邦最终同意与北德意志邦联合并。北德意志邦联在法律和宪法层面上终结，取而代之的是#yellow 德意志联邦#!的诞生。"
dsk_prussia.39.a:0 "这是独属于[concept_germany]人的浪漫"
every_south_country_will_help_us_tt:0 "所有非[concept_puppet]的[concept_germany]小国会成为我们的[concept_puppet]"
germany_country_modifier:0 "埃尔福特联盟"
je_dsk_prussia_economy:0 "埃尔福特联盟"
je_dsk_prussia_economy_reason:0 "#v 我的众[concept_germany]同胞们！#!\n\n有谁还能够继续忍受德意志的分裂与混乱？即便到了世纪初，这不过几十万平方千米的土地上，仍然存在着几十个邦国，流通着数千种货币；从柏林到瑞士的路程，至少要经过十个邦国、办十次手续、交十次关税，沿途缴纳的繁重税款甚至超过了所运货物的价值。难道我们要坦然接受这样的悲惨现状吗？绝不！埃尔福特议会提供了一个绝佳的机会和方向，那就是组建德意志联盟，这是通向德意志统一的快速途径。是时候了，是时候实现#yellow 弗里德里希·李斯特#!先生的愿景，从经济统一再到政治统一，一个新生的、充满生命力的#yellow 德意志国#!必将诞生，而它证明自身第一步，便从打破这混乱的秩序开始！"

je_dsk_prussia_reform:0 "普鲁士国家改革"
je_dsk_prussia_reform_reason:0 "过去十数年来，#yellow 法兰克福议会#!为统一德意志已花费了太多时间。一次次的会议，一套套的方案，数不尽的议题和表决，统一德意志的机会过去就只能寄希望于这些软弱繁琐的议会流程。但种种的付出到最后又收获了些什么？是各国君主的反对、是议会的解散、是德意志仍然分裂混乱的前景！\n\n我们受够了！软弱的投票无法凝聚起一个强大的德意志，能够铸就它、统一它的唯有军队，唯有战争！历史会证明一件事，那就是强权胜于公理！"
je_dsk_prussia_reform_tt:0 "敌人不是[SCOPE.sCountry('fra_scope').GetName]也不是[SCOPE.sCountry('rus_scope').GetName]，敌人就躲在议会之内，就在我们眼前！"

je_dsk_prussia_reform_goal:0 "完成三项改革"
je_ger_ita_union:0 "德意同盟"
je_ger_ita_union_reason:0 "整个亚平宁半岛在民族运动的吸引下躁动不安，收复故土的呼声震耳欲聋，只要我们对此稍加引导，他们就会是我们对奥地利战争中的一大助力，为达成该目的，我们需要向他们示好并缔结同盟。\n\n届时，当三色旗插上威尼托和弗留利的土地，当黑色的军靴踏过波西米亚的边界，[SCOPE.sCountry('ger_scope').GetName]与[SCOPE.sCountry('ita_scope').GetName]的盟书便不再是保存在两国宫廷中的一纸协议，而是对[SCOPE.sCountry('aus_scope').GetAdjective]在意大利和德意志霸权的当头棒喝！\n\n#yellow 德意同盟#!每月将通过下列关系#v 增长#!:\n•与#yellow 缔约国一方#!保持#green 友善#!以上的关系（#green +2#!）。\n•与#yellow 缔约国一方#!签订[concept_alliance]或#yellow 利益同盟#!#bold 条约#!（#green +2#!）"

je_ger_ita_union_tt:0 "[SCOPE.sCountry('ger_scope').GetName]与[SCOPE.sCountry('ita_scope').GetName]的友情可以征服山和海！"


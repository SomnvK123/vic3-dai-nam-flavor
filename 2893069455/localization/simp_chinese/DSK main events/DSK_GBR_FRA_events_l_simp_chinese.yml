l_simp_chinese:
pax_britannica_events.1.t:0 "殖民官僚机构"
pax_britannica_events.1.d:0 "帝国各地的官僚对于代表我们利益至关重要，他们抱怨工作条件并要求增加新的工作人员。"
pax_britannica_events.1.f:0 "“在任何官僚机构中，致力于官僚机构本身利益的人总是掌握了控制权，而致力于官僚机构应该实现的目标的人影响越来越小，有时甚至完全被排除在外。” —— 普尔内尔的官僚铁律"
pax_britannica_events.1.a:0 "他们会得到满足"
pax_britannica_events.1.b:0 "国家有更重要的事情要做"

pax_britannica_events.2.t:0 "水手的工资"
pax_britannica_events.2.d:0 "保持货物流通的商船船员正在要求薪水补贴。"
pax_britannica_events.2.f:0 "“商船船员不仅仅是一份工作，它是一种生活方式。我们航行在世界的海洋，携带货物，促进贸易。” —— 未知"
pax_britannica_events.2.a:0 "他们会得到满足"
pax_britannica_events.2.b:0 "他们的薪水已经足够高了"

pax_britannica_events.3.t:0 "市场条件良好"
pax_britannica_events.3.d:0 "在不断发展的世界中，[ROOT.GetCountry.GetAdjectiveNoFormatting]的利益完全有能力充分利用 - 字面上的意义上。"
pax_britannica_events.3.f:0 "“在交易/投资中，重要的不是你赚了多少，而是你损失了多少。” —— 伯纳德·巴鲁赫"
pax_britannica_events.3.a:0 "未来前景光明"
pax_britannica_events.3.b:0 "我们应该利用我们的全球地位，在开发市场方面取得领先地位"

pax_britannica_events.4.t:0 "世界正在关注"
pax_britannica_events.4.d:0 "全球各地的报纸都在讨论该国正在进行的政治进程，他们被他们的霸权国家的国内政治所吸引。"
pax_britannica_events.4.f:0 "“如果法律太多，人们就无法阅读，或者太不连贯，人们就无法理解，那么这些法律由他们自己选择的人制定，对人民几乎没有什么好处。” —— 詹姆斯·麦迪逊"
pax_britannica_events.4.a:0 "他们将见证适当的法律程序的展开"
pax_britannica_events.4.b:0 "我们必须树立榜样！"

pax_britannica_events.5.t:0 "[SCOPE.sC('pax_britannica_target').GetNameNoFormatting]万岁!"
pax_britannica_events.5.d:0 "人们被爱国狂热所席卷。公众对我们保护[SCOPE.sC('pax_britannica_target').GetName]免受[SCOPE.sC('pax_britannica_initiator').GeAdjective]侵略的战争的支持飙升。"
pax_britannica_events.5.f:0 "“没有混蛋通过为他的国家而死去来赢得战争。他赢得战争是因为让其他可怜的蠢货为他的国家而死去。” —— 乔治·S·帕顿"
pax_britannica_events.5.a:0 "[SCOPE.sC('pax_britannica_target').GetNameNoFormatting]永存我们的心中"

pax_britannica_events.6.t:0 "[SCOPE.sC('pax_britannica_target').GetAdjectiveNoFormatting]的血液"
pax_britannica_events.6.d:0 "[SCOPE.sC('pax_britannica_initiator').GetAdjective]对[SCOPE.sC('pax_britannica_target').GetName]的入侵持续进行，而我们却袖手旁观。"
pax_britannica_events.6.f:0 "“为什么为但泽而死？” —— 马塞尔·德阿特"
pax_britannica_events.6.b:0 "他们将不得不自己照顾自己"

pax_britannica_events.7.t:0 "和平鸽"
pax_britannica_events.7.d:0 "一支自称为和平鸽运动的抗议团体，反对我们更具冒险精神的外交政策目标"
pax_britannica_events.7.f:0 "“对所有国家都要保持诚信和公正。与所有人培养和平与和谐。” —— 乔治·华盛顿"
pax_britannica_events.7.a:0 "也许他们有一些道理"
pax_britannica_events.7.b:0 "他们不理解我们正在建设什么"

pax_britannica_events.8.t:0 "管理政策"
pax_britannica_events.8.d:0 "政治家对公务员队伍日益增长的蔑视 - 因为其中充斥着职业官僚，他们玩弄着旨在阻止政治家采取任何决定性行动的心理游戏。"
pax_britannica_events.8.f:0 "“是的，是的，是的，我确实看到这里有一个真正的两难境地。因为，虽然政府政策是把政策视为部长的责任，把行政视为官员的责任，但行政政策的问题会引起行政政策与政策行政的混淆，特别是当行政政策的行政责任与政策行政的责任发生冲突或重叠时。” —— 亨弗里·阿普尔比爵士"
pax_britannica_events.8.a:0 "动摇一些笼子，打破陈旧的体制"
pax_britannica_events.8.b:0 "这是有成效的工作"

pax_britannica_events.9.t:0 "优惠贸易"
pax_britannica_events.9.d:0 "一家贸易公司联盟正在游说政府达成优惠贸易协议 - 这种协议的性质使得对[ROOT.GetCountry.GetAdjectiveNoFormatting]商品依赖的贸易伙伴受到剥削。"
pax_britannica_events.9.f:0 "“大多数金融家、公司律师、说客和管理顾问在零和游戏中竞争，从一个口袋中拿出钱，放入另一个口袋。” —— 罗伯特·赖希"
pax_britannica_events.9.a:0 "他们可以游说到天荒地老，我们也不会让步"
pax_britannica_events.9.b:0 "国内利益首先考虑，毕竟"

pax_britannica_events.10.t:0 "走私集团"
pax_britannica_events.10.d:0 "最近的丑闻发现了一些[ROOT.GetCountry.GetAdjectiveNoFormatting]公司涉足向外国市场走私商品的情况。"
pax_britannica_events.10.f:0 "“禁止一个人自己思考或行动，你可能会给他的生活增添海盗的快乐和走私的兴致。” —— 艾尔伯特·哈伯德"
pax_britannica_events.10.a:0 "打击"
pax_britannica_events.10.b:0 "他们应该正大光明地购买[ROOT.GetCountry.GetAdjectiveNoFormatting]商品"

pax_britannica_events.11.t:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]的联系"
pax_britannica_events.11.d:0 "警察部门注意到，相当数量的私营出口企业根源于犯罪地下世界。"
pax_britannica_events.11.f:0 "“法官、律师和政客都是人模狗样披着衣冠楚楚外衣的盗窃犯罢了。” —— 卡罗·甘比诺"
pax_britannica_events.11.a:0 "我会取缔他们"
pax_britannica_events.11.b:0 "本来是非法的，但是明天他们就合法了。"

pax_britannica_events.12.t:0 "操纵天平"
pax_britannica_events.12.d:0 "代表[ROOT.GetCountry.GetAdjectiveNoFormatting]利益的商人阶级中的腐败现象开始对我们产生不良影响。"
pax_britannica_events.12.f:0 "“国家越腐败，法律越多。” —— 塔西佗"
pax_britannica_events.12.a:0 "全面审查每个商人的良心"
pax_britannica_events.12.b:0 "谁在乎呢？"

pax_britannica_events.13.t:0 "宣传作品"
pax_britannica_events.13.d:0 "驻外大使开始展示特别引人注目的艺术作品，描绘了一个极度理想化的[ROOT.GetCountry.GetAdjectiveNoFormatting]生活，甚至有些过分了。"
pax_britannica_events.13.f:0 "“爱国主义是恶棍的美德。” —— 奥斯卡·王尔德"
pax_britannica_events.13.a:0 "降低一下调子"
pax_britannica_events.13.b:0 "把这些分发给群众"

pax_britannica_events.14.t:0 "饥饿的艺术家"
pax_britannica_events.14.d:0 "最近，报纸讲述了朱利安·沃尔特的故事，他是一位备受欢迎的艺术家，濒临破产。他们成功地劝说他返回他的出生地[ROOT.GetCountry.GetAdjective]，一无所有，现在期待政府的帮助。"
pax_britannica_events.14.f:0 "“贫穷的麻烦在于它占去了你所有的时间。” —— 威廉姆·德·库宁"
pax_britannica_events.14.a:0 "帮助这个人站起来"
pax_britannica_events.14.b:0 "给他一个公务员工作"
pax_britannica_events.141.t:0 "致献的杰作"
pax_britannica_events.141.d:0 "最近归国的朱利安·沃尔特展示了他的新作品 - 一幅宏伟的画作，描绘的是不列颠尼亚本身，她怀抱着文明。"
pax_britannica_events.141.f:0 "在一笔刷子的一挥之间，不列颠尼亚从画布上走出来，是帝国优雅的明证。艺术家的调色板编织了一幅统治的图景，捕捉了一种指挥海洋和文明本质的国家精神。这幅杰作是对英国不屈不挠的霸权的视觉颂歌，其中艺术成为一面镜子，反映了帝国不可征服的壮丽。"
pax_britannica_events.141.a:0 "统治不列颠！"

pax_britannica_events.142.t:0 "嘲讽的致献"
pax_britannica_events.142.d:0 "最近归国的朱利安·沃尔特，在为公务员辛勤工作之后，展示了一幅尖刻的新画作，描绘了在[ROOT.GetCountry.GetAdjective]的生活中明显的乏味和单调。此外，他利用这场公开的场面，以代表受压迫的群众的变革十字军的身份进入公共生活。"
pax_britannica_events.142.f:0 "笔触中蕴含着讽刺，艺术家展示了一幅在叛乱边缘上舞蹈的画布。通过嘲笑的棱镜，[ROOT.GetCountry.GetAdjectiveNoFormatting]社会的平凡仪式被暴露出来，对隐藏在秩序表象后面的单调生活进行了尖锐的评论。这幅画低声细语，挑战着现状，每一笔都在敦促社会摆脱单调的枷锁。"
pax_britannica_events.142.b:0 "他应该感谢这份工作！"

pax_britannica_events.15.t:0 "繁荣与萧条"
pax_britannica_events.15.d:0 "那些启动工业革命初期的传统制造业企业在当今全球经济中竞争失利。"
pax_britannica_events.15.f:0 "变革的风暴无情地吹袭，迫使这些巨头适应或面临淘汰，而他们过去的回声则在逐渐衰败的工业大厅中回响。"
pax_britannica_events.15.a:0 "虽然我们是自由市场，但我们依然会救助他们"
pax_britannica_events.15.b:0 "哈耶克的大手，我不好说"

pax_britannica_events.21.t:0 "出乎意料的高效"
pax_britannica_events.21.d:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]的官僚机构的轮子迅速转动，尽管普遍认为相反，但产生了大量有用的活动。"
pax_britannica_events.21.f:0 "真正的艺术在于纸上的无缝舞蹈，看似沉重的官僚机构展现了其敏捷的优雅，以意想不到的迅捷率领导着治理的交响乐团。"
pax_britannica_events.21.a:0 "世界应该注意"

pax_britannica_events.17.t:0 "环球巡游"
pax_britannica_events.17.d:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]的外交官正开始一项雄心勃勃的全球巡回演出，推广[ROOT.GetCountry.GetAdjectiveNoFormatting]的文化和机构。"
 
pax_britannica_events.17.f:0 "从伦敦的宏伟大厅到遥远的海岸，这些外交官编织着[ROOT.GetCountry.GetAdjectiveNoFormatting]实力的叙事，推广着全球帝国的美德；他们手持的不是武器，而是帝国的文化武库。"
pax_britannica_events.17.a:0 "他们应该宣传我们所倡导的全球秩序"
pax_britannica_events.17.b:0 "他们应该宣传[ROOT.GetCountry.GetAdjective]本身"

pax_britannica_events.18.t:0 "无情的竞争"
pax_britannica_events.18.d:0 "全球范围内，[ROOT.GetCountry.GetAdjectiveNoFormatting]的贸易商凭借着全球帝国的无限资源击败了他们的竞争对手。"
pax_britannica_events.18.f:0 "正如太阳永不落在[ROOT.GetCountry.GetAdjectiveNoFormatting]帝国上，所以也是在其旗帜下的贸易商在全球市场上投下了庞大的阴影。凭借着敏锐的商业头脑和帝国网络的力量，[ROOT.GetCountry.GetAdjectiveNoFormatting]的商人在经济霸权的无情竞争中超越了他们外国的竞争对手。繁忙的市场见证了[ROOT.GetCountry.GetAdjectiveNoFormatting]贸易的实力，精明的谈判和海上的主导地位汇聚在一起，确保英国国旗不仅在高海上飘扬，而且在商业成功的巅峰上也是如此。"
pax_britannica_events.18.a:0 "他们应该如此"
pax_britannica_events.18.b:0 "我们肯定可以更充分地利用我们的主导地位"

pax_britannica_events.19.t:0 "工业繁荣"
pax_britannica_events.19.d:0 "在[ROOT.GetCountry.GetAdjectiveNoFormatting]霸权日益增强的信心中，[ROOT.GetCountry.GetAdjectiveNoFormatting]的工业正如从未有过地收获他们的劳动果实。每个人都在购买[ROOT.GetCountry.GetAdjectiveNoFormatting]的商品。"
pax_britannica_events.19.f:0 "从嗡嗡作响的工厂到繁华的市场，企业精神蓬勃发展。[ROOT.GetCountry.GetAdjectiveNoFormatting]企业如同工业巨人般屹立，他们的成功回响着一个崛起中的国家的交响曲。在创新的熔炉中，这些企业铸造经济命运，将挑战转化为机遇。"
pax_britannica_events.19.a:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]的商品代表着我们"
pax_britannica_events.19.b:0 "我们应该从这块石头上榨取每一滴血液"

pax_britannica_events.20.t:0 "贸易霸权"
pax_britannica_events.20.d:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]的商人在皇家海军的保护下赚得盆满钵满，确保自由贸易。"
pax_britannica_events.20.f:0 ""在全球和平的宁静水域中，繁荣的风帆迎风而上，将商人推向无与伦比的财富高度。随着海上冲突的幻影被驱散，贸易路线成为财富流动的血管。"
pax_britannica_events.20.a:0 "商业是我们的命脉"
pax_britannica_events.16.t:0 "狡猾的殖民管理"
pax_britannica_events.16.d:0 "治理帝国的官僚们不断想出新的、更有效率的工作方式。"
pax_britannica_events.16.f:0 "从简化的官僚机构到尖端技术，这些监督者开创了管理能力的传奇。效率成为关键词，随着海外帝国变成一个润滑的机器，以不懈的进步追求和不可战胜的创新精神为指导。"
pax_britannica_events.16.a:0 "优秀"
pax_britannica_events.16.b:0 "把他们带到这里来，我们可以好好利用"

pax_britannica_events.22.t:0 "爱国节日"
pax_britannica_events.22.d:0 "人们满足，甚至开始庆祝。国家的深情和爱国主义的艳俗表演变得司空见惯。"
pax_britannica_events.22.f:0 "从繁华的城市到宁静的乡村，联合的旗帜不仅仅是一面旗帜；它是共同身份和国家自豪感的象征。集体精神因对国家的深沉爱而膨胀，在单一效忠的旗帜下，多样化的公民构成了一个统一的忠诚的布景。"
pax_britannica_events.22.a:0 "他们有充分的理由自豪"

pax_britannica_events.23.t:0 "人民和平"
pax_britannica_events.23.d:0 "人们可能不同意政府的所有政策，但他们无法否认结果。"
pax_britannica_events.23.f:0 "从权力的殿堂到国家的最远角落，满意成为主导情感。"
pax_britannica_events.23.a:0 "我们将共同努力创造更美好的未来"

pax_britannica_events.24.t:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]科学院"
pax_britannica_events.24.d:0 "来自世界各地的学者涌向[ROOT.GetCountry.GetAdjective]的海岸进行前沿工作。"
pax_britannica_events.24.f:0 "在这个启蒙时代，突破接连不断，理解的边界扩展，预示着一个科学繁荣的黄金时代。"
pax_britannica_events.24.a:0 "我们是一个发明家之国"

pax_britannica_events.25.t:0 "国际和谐"
pax_britannica_events.25.d:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]的霸权，虽然被许多人抨击，但却将世界带向了更加和平与合作。"
pax_britannica_events.25.f:0 "在一个冲突消失的世界中，国际和谐成为外交的甜美旋律。曾经被不信任和纷争分隔的国家现在以合作的曲调起舞。理解和妥协的外交绘制了跨越国界的统一画卷。"
pax_britannica_events.25.a:0 "这是一个共同的努力"
pax_britannica_events.25.b:0 "我们应该得到所有的赞誉"

pax_britannica_events.26.t:0 "侨民专家"
pax_britannica_events.26.d:0 "许多[ROOT.GetCountry.GetAdjectiveNoFormatting]知识分子发现蓬勃发展的殖民地是进行他们工作的绝佳地方。"
pax_britannica_events.26.f:0 "从殖民地学院到繁华的市场，知识的复兴超越了海洋和边界。殖民地成为创新的熔炉，培养了一代思想家，他们将祖国的智慧与新视角的活力融为一体。"
pax_britannica_events.26.a:0 "听起来理想"
pax_britannica_events.26.b:0 "试着诱使他们回到这里来"

pax_britannica_events.27.t:0 "功劳归功"
pax_britannica_events.27.d:0 "由于繁荣鼓励借贷，金融机构正享受着健康的增长。"
pax_britannica_events.27.f:0 "他们的账簿就像经济编排的交响乐一样，回荡着蓬勃发展社会的活力脉搏。从繁华的金融区的繁忙街道到安静的投资大厅，商业的轮子不知疲倦地转动。"
pax_britannica_events.27.a:0 "这是我们帽子上的又一根羽毛"
pax_britannica_events.27.b:0 "他们知道该感谢谁，不是吗？"

pax_britannica_events.28.t:0 "稳健盈余"
pax_britannica_events.28.d:0 "信心达到历史最高水平，[ROOT.GetCountry.GetAdjectiveNoFormatting]的企业比任何其他人都从中获益。"
pax_britannica_events.28.f:0 "工业引擎与不懈的活动共振，市场因商业能量而脉动。从以创新为动力的企业到繁华的贸易路线，每个行业都为经济成功的交响曲做出了贡献。"
pax_britannica_events.28.a:0 "我们总是有更多的交易可以做"
pax_britannica_events.28.b:0 "我们国内的产业应该受益最多"

pax_britannica_events.29.t:0 "英国税"
pax_britannica_events.29.d:0 "资金正在堆积，比分配到财政部的速度还快。"
pax_britannica_events.29.f:0 "金库，曾经是朴素的储藏所，现在因经济的胜利而膨胀。黄金时代见证了大规模财富的积累，繁荣潮汐膨胀到新的高度。从奢华的庄园到闪闪发光的城市中心，财富的迹象无处不在。"
pax_britannica_events.29.a:0 "人们应该从这种繁荣中受益最多"
pax_britannica_events.29.b:0 "但最终它会被加入到财政部"
pax_britannica_events.30.t:0 "未来光明"
pax_britannica_events.30.d:0 "国家的决策者和领导者充满活力。进步与繁荣似乎永无止境。"
pax_britannica_events.30.f:0 "进步的回声在公民的心中回荡，梦想飞翔，志向高远。在这个共享热情的时代，国家站在一个充满希望的明天的悬崖上，一个更美好未来的集体期待成为社会进步的催化剂。"
pax_britannica_events.30.a:0 "我们可以在我们的商业中利用那种能量"
pax_britannica_events.30.b:0 "谁知道未来会带来什么？"

pax_britannica_events.31.t:0 "糟糕的官僚机构"
pax_britannica_events.31.d:0 "帝国各地的殖民地管理者陷入了困境。唯一的问题是，谁来承担责任？"
pax_britannica_events.31.f:0 "在广阔的帝国疆域中，治理的机器嘎吱作响。从失误到后勤挑战，在全球范围内，殖民地发现自己正在与行政监督的缺陷搏斗。"
pax_britannica_events.31.a:0 "我们必须承担责任"
pax_britannica_events.31.b:0 "显然是他们的责任"

pax_britannica_events.32.t:0 "困扰的税务人员"
pax_britannica_events.32.d:0 "税务人员承诺过多，实际交付却不足。许多人现在面临财务困境。"
pax_britannica_events.32.f:0 "在财政责任的迷宫中，错误代价高昂。"
pax_britannica_events.32.a:0 "我们必须拯救他们"
pax_britannica_events.32.b:0 "不幸"

pax_britannica_events.33.t:0 "不懈的前进"
pax_britannica_events.33.d:0 "全球竞争的加剧使企业加班加点，工人对自己的工作条件越来越不满。"
pax_britannica_events.33.f:0 "漫长的工作时间和微薄的工资给进步的承诺抹上了一层阴影，工业革命对那些塑造其命运的人们而言成了一把双刃剑。在这个劳动不安定的时代，对公平待遇的呼吁在烟雾弥漫的空气中回荡，敦促社会认识到进步的人为代价。"
pax_britannica_events.33.a:0 "竞争是健康的"
pax_britannica_events.33.b:0 "听取人民的意见"

pax_britannica_events.34.t:0 "信心危机"
pax_britannica_events.34.d:0 "在一个不可预测的世界里，借款人对自己的财政未来感到担忧。"
pax_britannica_events.34.f:0 "市场波动和地缘政治紧张局势合谋动摇通常沉稳的银行家们的信心，他们在即将面临的挑战面前动摇。"
pax_britannica_events.34.a:0 "我们会如约偿还债务"
pax_britannica_events.34.b:0 "我们有权利做任何我们想做的事"

pax_britannica_events.35.t:0 "预算负担"
pax_britannica_events.35.d:0 "政治家们在一份报告泄露后大惊小怪，该报告声称当前的预算是不可持续的，无论真假。"
pax_britannica_events.35.f:0 "账簿曾经是财政稳定的象征，现在却因支出超过收入而引起不安。国家发现自己处于一个十字路口，要权衡雄心勃勃的政策和财政审慎之间的微妙平衡。"
pax_britannica_events.35.a:0 "报告是错误的，我们会证明它"
pax_britannica_events.35.b:0 "私营部门应与我们共担这一负担"

pax_britannica_events.36.t:0 "征税实际上是盗窃"
pax_britannica_events.36.d:0 "报纸揭露了一份内部政府调查，称征税不当，征税率远高于官方政策规定。"
pax_britannica_events.36.f:0 "“逃避税收是唯一仍然有所回报的知识追求。”#!#!- 约翰·梅纳德·凯恩斯"
pax_britannica_events.36.a:0 "那又怎样？"
pax_britannica_events.36.b:0 "纠正错误"

pax_britannica_events.37.t:0 "刑事不公"
pax_britannica_events.37.d:0 "民事和司法法院都被一大堆案件淹没。这个系统已经到了危机的边缘。"
pax_britannica_events.37.f:0 "从不堪重负的法院到积案满堂，维护法律和秩序的机器正在努力满足一个迅速发展的社会的需求。"
pax_britannica_events.37.a:0 "增加法官"
pax_britannica_events.37.b:0 "增加官僚监督"
pax_britannica_events.38.t:0 "学术繁琐"
pax_britannica_events.38.d:0 "国家的发明家和学者们联合抱怨窒息般的一团红色官僚主义束缚了他们的每一个行动。"
pax_britannica_events.38.f:0 "知识追求的画廊被行政障碍纠缠，阻碍了知识的自由流动。在这个学术挫折的时代，对精简流程的呼吁在讲堂和研究中心回响，因为对启蒙的追求陷入了官僚约束的复杂网中。"
pax_britannica_events.38.a:0 "那里是有原因的"
pax_britannica_events.38.b:0 "我们可以在某种程度上减轻他们的负担"

pax_britannica_events.39.t:0 "低迷"
pax_britannica_events.39.d:0 "遗憾的是，许多行业永久关闭了大门。一个不确定的世界不是对大企业友好的世界。"
pax_britannica_events.39.f:0 "随着企业无法经受住财务逆境的风暴而屈服于时代的挑战，商业的脉搏逐渐减弱。"
pax_britannica_events.39.b:0 "这些事情总是会发生的"

pax_britannica_events.40.t:0 "非法？还是无能？"
pax_britannica_events.40.d:0 "国家的普通百姓对当前政府的外交政策目标发出了越来越多的抗议声音。"
pax_britannica_events.40.f:0 "在国际关系的起起伏伏中，一股不满的浪潮冲击着公众情绪的海岸。"
pax_britannica_events.40.b:0 "这些未经洗礼的群众又懂得什么关于帝国建设呢？"

pax_britannica_events.41.t:0 "人才外流"
pax_britannica_events.41.d:0 "国家最优秀的人才，受过[ROOT.GetCountry.GetAdjective]教育，选择将自己的专业知识带到别处。"
pax_britannica_events.41.f:0 "聪明的头脑和技术娴熟的专业人士，如迁徙的鸟类寻找新的地平线，离开祖国追求机遇和认可。曾经是知识实力的堡垒的家园，现在正在努力留住它最聪明的明星。"
pax_britannica_events.41.b:0 "他们在国外可能想要什么呢？"

pax_britannica_events.42.t:0 "残酷的不列颠"
pax_britannica_events.42.d:0 "[SCOPE.sC('pax_britannica_target').GetNameNoFormatting]的行政人员面临着民众对[GetCountry.GetName.GetAdjectiveNoFormatting]统治感到愤怒的新一波反对情绪。"
pax_britannica_events.42.f:0 "“我们似乎…在心不在焉的情况下征服了并且人满为患了一半的世界。”#!#!- 约翰·西利爵士"
pax_britannica_events.42.b:0 "野蛮的畜生"

pax_britannica_events.43.t:0 "兴趣缺乏"
pax_britannica_events.43.d:0 "一群强大的银行正威胁在全球动荡加剧之际单方面提高他们的利率。"
pax_britannica_events.43.f:0 "“当利率高时，你希望利率平均方向是向下的；当利率低时，你希望利率平均方向是向上的。”#!#!- 约翰·赫尔"
pax_britannica_events.43.a:0 "我们负担得起"
pax_britannica_events.43.b:0 "将它们国有化"

pax_britannica_events.44.t:0 "探路者前景"
pax_britannica_events.44.d:0 "经济的普遍低迷在全球信心危机期间严重打击，[ROOT.GetCountry.GetAdjectiveNoFormatting]的影响力下降。"
pax_britannica_events.44.f:0 "“当你的邻居失业时，那就是一次经济衰退；当你失业时，那就是一次经济萧条。”#!#!- 哈里·S·杜鲁门" 
pax_britannica_events.44.a:0 "不幸"
pax_britannica_events.44.b:0 "保护我们的国内产业"

pax_britannica_events.45.t:0 "宽松的不列颠"
pax_britannica_events.45.d:0 "商人们失去了信心并提高了价格。[ROOT.GetCountry.GetAdjective]的货架空了，人民挨饿。危机正在酝酿。"
pax_britannica_events.45.f:0 "“没有人可以成为一个好公民，除非他有一个足以支付基本生活成本的工资，并且工作时间足够短，以便在完成每日工作后他将有时间和精力来承担管理社区的责任，以帮助承担普遍负担。”#!#!- 西奥多·罗斯福"


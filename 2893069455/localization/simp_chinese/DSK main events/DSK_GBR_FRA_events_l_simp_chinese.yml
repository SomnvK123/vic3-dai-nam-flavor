dsk_france.1.t:0 "法属西非提案"
dsk_france.1.d:0 "我们控制这大片的非洲地域，一些事宜超出了我们能力的范畴"
dsk_france.1.f:0 "“法属西非的总督自1895年起驻圣路易（法语：Saint-Louis），1902年迁往达喀尔（法语：Dakar）。总督直接向巴黎政府负责。法属西非的各殖民地，比如塞内加尔、达荷美等，各有一位副总督，管辖本地区。副总督直接对总督负责。总督与巴黎政府的“殖民地部”共同负责确定副总督人选，报经法国议会核准，即可上任。”\n在法属西非各地殖民地的管理上，最主要的是设置名为“治理圈”（Cercle）的行政机构。治理圈由一位法国人任长官，下辖若干更小的行政区，这样的小行政区只管辖若干村庄，由法国人任命非洲酋长管理。治理圈的长官直接对各单独殖民地的副总督负责，小行政区的非洲酋长对治理圈的法国长官负责"
dsk_france.1.a:0 "“巴黎当局只需要动动手编撰一本殖民地法律，而殖民地总督考虑的就多了”"
dsk_france.1.b:0 "西非与[SCOPE.GetRootScope.GetCountry.GetName]在文化，习俗，语言上毫不相通，还是让他们做殖民地的二等人吧"

dsk_france.2.t:0 "北非战役"
dsk_france.2.d:0 "随着军队在阿尔及利亚的节节获胜，让我们逐渐深入北非腹地"
dsk_france.2.f:0 "我不想看到[SCOPE.sCountry('ait_scope').GetName]，[SCOPE.sCountry('con_scope').GetName]，[SCOPE.sCountry('tug_scope').GetName]等北非酋长国还出现在[SCOPE.GetRootScope.GetCountry.GetName]的地图旁\n我们在阿尔及利亚的影响力正在显著增长，然而我们在这个区域的势力很大程度上依赖于我们同这些未受认可国家之间的关系。将所有的北非小国囊括于我们的势力范围中，能够确保我们的主导地位。"
dsk_france.2.a:0 "我的字典里没有不可能三个字"
chinese_central_government_tt:0 "中国已经分裂"

je_fra_north_Africa:0 "法属阿尔及利亚领"
je_fra_north_Africa_reason:0 "阿尔及利亚面积是我们欧洲领土的4倍多，如果我们彻底征服了这片领土，我们可以决定其领土上的人民的未来。\n从19世纪初到20世纪初的100年间，欧洲国家展开了对非洲大陆的大规模殖民征服行动。[SCOPE.GetRootScope.GetCountry.GetName]在瓜分非洲的过程中“成绩显赫”，鼎盛时期一度将整个非洲大陆36%的土地收入囊中。法国将绝大部分的非洲土地划入其殖民系统，以[concept_overlord]的身份对这些非洲殖民地进行统治，当地居民也没有完整的法国公民权。但在[SCOPE.GetRootScope.GetCountry.GetName]统治的非洲疆域内，有一个特殊的区域，它被看作法国本土的一部分，而不是殖民地，这就是位于北非的阿尔及利亚。"
je_create_west_french_africa:0 "建立法属西非"
je_create_west_french_africa_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]在非洲争夺当中取得了大量的领土，这些地区一开始或者成为塞内加尔殖民地的一部分或者是各别的独立实体，由军方进行统治，被称为“军管领土”。1890年代后期，法国政府开始直接统治这些新得领土，并将加蓬以西的领土转由在塞内加尔的单一总督所管辖，直接对法国的海外事务部负责。第一位塞内加尔总督让·巴蒂斯特在1895年六月16日被任命，而这片领土在1904年正式被命名为“法属西非”（AOF），初设时下辖塞内加尔、法属苏丹、法属几内亚、科特迪瓦共四个行政区域（毛里塔尼亚和尼日二地区先后于1920年代及1940年代加入）。加蓬等地在稍后则成为法属赤道非洲（AEF）的一部分。"

dsk_prussia.46.t:0 "《英德通商航海条约》"
dsk_prussia.46.d:0 "一份新的条约在汉诺威签署，英国与德国实现了相互谅解并建立了更进一步的商贸联系。"
dsk_prussia.46.f:0 "过去长久的#yellow 光荣孤立#!路线保证了大不列颠这艘巨轮的平稳航行，但当下，面对眼前这片因德意志国搅动而难以预测的海域，大不列颠也不得不明白，它必须改变原有的方针，这样它才不致在这片未知的海域迷失。"
dsk_prussia.46.a:0 "在伦敦，海域封锁战术的推演和近海商贸学说的研究一样火爆。"
kind_germany_modifier:0 "和平时代"


dsk_prussia.47.t:0 "反德战争一触即发"
dsk_prussia.47.d:0 "在德国近年来愈发咄咄逼人的举动下，英法俄三国在政治、经济、军事、外交等各方面加速转向敌对。"
dsk_prussia.47.f:0 "#yellow 德雷福斯事件#!愈演愈烈，#blue 《小日报》#!上刊登着剥夺德雷福斯军衔的画作，其本人已被判处终身流放；俾斯麦下台后，德皇和德国外交部无意再续签#yellow 《再保险条约》#!，俄国数次的续约请求均被拒绝；德国向南非共和国发送的"#yellow 克鲁格电报#!"在英国的报纸上被披露曝光，使得举国哗然。十九世纪的余晖下，欧洲大国中的反德情绪日益高涨。"
dsk_prussia.47.a:0 "德意志的威胁从未真正存在过，这不过是各国统治者为了掩饰他们的无能而共同编制的谎言。"


je_against_ger_union:0 "大德意志阴影" 
je_ger_fra_union_modifier:0 "欧洲反德情绪爆发"  
je_against_ger_union_goal:0 "我们过往的外交努力均告破灭，欧洲各国对德意志的猜忌与不安终于爆发了！" 
je_against_ger_union_reason:0 "无论是帝国初建时便拥有的领土、资源或是人口，还是成立后对陆海军的加速武装无不在刺激着各国紧绷而脆弱的神经。我们在各国的外交反应都传递着一种不妙的气息：无论是慷慨的关税减免，还是外交辞令上的和平保证，都已无法获得他们的积极回应。在巴黎，复仇的呼声一浪高过一浪；在伦敦，一笔笔造舰费用被紧急拨付；而在圣彼得堡，沙皇的边防军正沿着漫长而冰冷的东线加紧修筑野战工事。那些曾因种种利益而彼此敌视的老牌列强，正在这种压迫感中摒弃前嫌，谁都不愿意当那个战争到来之时际手无寸铁的人。" 
je_against_ger_union_tt:0 "复仇主义的狂热呓语与祈求和平的虔诚祷言在欧洲回荡" 
je_against_ger_union_add_tt:0 "这会增加我们#v 外交孤立#!的风险！" 

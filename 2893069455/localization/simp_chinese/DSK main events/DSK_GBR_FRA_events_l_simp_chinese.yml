dsk_prussia.40.t:0 "来自奥尔米茨的警告"
dsk_prussia.40.d:0 "[SCOPE.sCountry('aus_scope').GetName]与[SCOPE.sCountry('rus_scope').GetName]要求我们放弃领导[concept_germany]邦国、解散德意志联盟、从黑森撤军以及重新成立德意志邦联！"
dsk_prussia.40.f:0 "内阁秘书带着一沓最新的外交急件，火急火燎地向国王汇报着最新的外交情况：在#yellow 德意志联盟#!的二十六个邦国代表中，只有十二人对联盟宪法投下了赞成票；奥地利人正在法兰克福重整旧的邦联；更坏的消息来自[SCOPE.sCountry('rus_scope').GetName]的特使，他向我们传达了沙皇的意思：若[SCOPE.GetRootScope.GetCountry.GetName]敢挑战维也纳引导下的秩序，俄国的近卫军就会像1709年击溃瑞典人那样摧毁[SCOPE.sState('capital_state').GetName]。"
dsk_prussia.40.a:0 "你是要当一辈子懦夫，还是要做英雄！哪怕只有几秒钟？"
dsk_prussia.40.b:0 "[SCOPE.sCountry('aus_scope').GetAdjective]爷爷不要啊，小弟给你跪了-签订《奥尔米茨条约》。"

je_dsk_prussia_laws:0 "普鲁士宪法妥协"
je_dsk_prussia_laws_reason:0 "在1848年遍布德意志邦国的抗议的冲击下，数十个邦国在前三月时期的分裂且专制的政治结构已是摇摇欲坠。三月，民众聚集在柏林，要求国王回应，普鲁士国王则出人意料地答应了示威者的所有要求，这暂时安抚住了躁动的人群。\n\n德意志过去长期的分裂与混乱铸就了太多错误，诸邦国的专制统治又长期遏制着民众的反对声音。这次，人们终于决定不再忍受，他们向王公们的专制堡垒开火，就连北方最强大的邦国也不得不退让。"
dsk_prussia.41.t:0 "《普鲁士王国宪政改革诏书》"
dsk_prussia.41.d:0 "在民众请愿下，经诸大臣顾问起草和御前会议修订，宪政改革诏书现已颁布生效。"
dsk_prussia.41.f:0 "宪政改革诏书为普鲁士新宪法构建了框架，它史无前例地承认了部分公民的基本权利并在普鲁士确立了两院制议会制度，议会将由容克贵族们组成的贵族院和由民选议员组成的众议院构成。\n\n通过保留对军队的绝对指挥权、君主的绝对否决权，以及精心设计、按纳税额划分权重的三级选举法，将国家的真正主导权牢牢锁在了王室与保守派容克贵族的手中。"
dsk_prussia.41.a:0 "地方议会的争吵消耗了自由主义者的精力，而真正的权力早已通过法律条文汇聚于国王的宝座下。"


dsk_prussia.42.t:0 "对奥尔米茨之辱的复仇"
dsk_prussia.42.d:0 "在普鲁士军队依托铁路的快速动员和集结下，奥地利军队且战且退。眼下，普鲁士的兵锋已经直抵维也纳。"
dsk_prussia.42.f:0 "爬上维也纳的城墙远眺，便可望见远处集结而来的普鲁士士兵，恐惧和不安在城市中传播，但这已不是混乱最初时的景象。过去的几天中，已经有无数得知前线作战不力的消息灵通人士或是达官显贵们携家带口，将积蓄、资产，或是任何能带的上的东西送上火车向东方转移，希望能在战火蔓延之下，不致被烈火彻底吞噬，从而留下家族延续和东山再起的希望。"
dsk_prussia.42.a:0 "先生们，让我一同欢呼这伟大的时刻！"


aus_agree_us_tt:0 "[SCOPE.sCountry('aus_scope').GetAdjective]已同意与我们组建[concept_germany]"



dsk_prussia.44.t:0 "《德法亲善谅解备忘录》"
dsk_prussia.44.d:0 "在法国和德国的边境，双方外交使团穿过警戒区，在边境城市签订文书并互换文件以示友好。"
dsk_prussia.44.f:0 "法国解除了局部动员令、拆除了简易工事、召回了当地军队并不再紧盯着德国在边境的一举一动，以便他们能够从容地将军队派往殖民地以应对当地的反叛。德国对法国减免关税，而法国的几家大银行正拟定对德国的长期贷款。"
dsk_prussia.44.a:0 "这是属于我们这一代人的和平-暂时的。"

dsk_prussia.45.t:0 "《德俄经济合作纲要》"
dsk_prussia.45.d:0 "经过前期的磋商和双方君主的批准，这部文件由两国商务部共同发布并具备了法律效力。"
dsk_prussia.45.f:0 "清单上罗列着密密麻麻的德国向俄国出口商品，一列列火车从俄国腹地满载着木材或是其他原材料经过边境运往德国工业区，其中有些甚至是从符拉迪沃斯托克通过西伯利亚铁路穿过整个俄国运送而来的。商贸畅通后，就连两国边境的市镇也繁荣起来。"
dsk_prussia.45.a:0 "载满货物的列车！哈！为什么不能用来运输士兵呢？"

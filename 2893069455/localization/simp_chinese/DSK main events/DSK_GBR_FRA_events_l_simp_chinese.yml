dsk_je_gbr_Royal_Academy_open:0 "皇家美术学院"
dsk_je_gbr_Royal_Academy_open_reason:0 "#variable 皇家美术学院(缩写RA)#!坐落在[SCOPE.sState('university_state_scope').GetName]的英国皇家美术研究院，自从1768年成立以来迄今已有237年，是世界上学习Fine Arts领域最好的美术研究院。RA不仅历史悠久而且人才辈出，为培育世界绘画、雕刻、建筑艺术英才做出了巨大贡献。该校每年举行优秀学生及艺术家作品展，也吸引了国内外艺术爱好者的瞩目。\n现在，我们已经成功扩建了它，在未来一个世纪的艺术潮流中，世界将会充斥来自大不列颠的艺术展品！\n #variable 皇家美术学院将会一年召开一次大师作品展。#!"


 je_aus_hun_revolution:0 "多瑙河行动"
 je_aus_hun_revolution_tt:0 "一个弱小、分裂的奥地利，是我们统一德国、主导欧洲的最佳保障"
 je_aus_hun_revolution_reason:0 "[concept_hungary_kindom]占[SCOPE.sCountry('aus_scope').GetName]近1/3领土、1/4人口，是奥地利最重要的兵源、粮仓与税基。\n\n割去[concept_hungary_kindom]，[SCOPE.sCountry('aus_scope').GetName]将沦为仅控制奥地利本土和波希米亚的中欧小国，永远丧失大国地位，无法再挑战普鲁士在德意志的霸权。\n\n支持[concept_hungary_kindom]独立，把民族主义祸水引向奥地利，让其陷入长期内乱。剥离[concept_hungary_kindom]后，奥地利彻底失去成为“大奥地利”核心的可能，只能接受统一德国的命运。"




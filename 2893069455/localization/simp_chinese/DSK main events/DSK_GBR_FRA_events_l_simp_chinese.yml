dsk_prussia.16.t:0 "法兰克福提案:石勒苏益格——荷尔斯泰因问题"
dsk_prussia.16.d:0 "正当国民议会的立宪君主主义者和共和主义者争得不可开交时，非[concept_germany]民族的问题也爆发了。问题出自[SCOPE.sCountry('den_scope').GetName]对[SCOPE.sCountry('sch_scope').GetName]和[SCOPE.sCountry('hol_scope').GetName]的统治。民族主义者要求我们从丹麦的压迫下解放这两个[concept_germany]公国，我们是否要冒着同丹麦开战的风险向他们提出要求?"
dsk_prussia.16.f:0 "3月18日，在伦茨堡召开的民族会议公然重申了[concept_germany]对这两个公国的要求。[SCOPE.sCountry('sch_scope').GetName]和[SCOPE.sCountry('hol_scope').GetName]的都是[concept_germany_country]可分割的一部分!"
dsk_prussia.16.a:0 "起来！[concept_germany]人民，反抗就在此刻！"


dsk_prussia.17.t:0 "[SCOPE.sCountry('south_german_country').GetName]的动荡"
dsk_prussia.17.d:0 "[concept_revolution]群众反对专制政府的一系列抗议活动在我们邻国[SCOPE.sCountry('south_german_country').GetName]爆发"
dsk_prussia.17.f:0 "[concept_germany_country]各邦国受到农业歉收和经济危机的影响，罢工浪潮和饥民暴动此起彼伏，[concept_revolution]形势一触即发"
dsk_prussia.17.a:0 "哦豁，完蛋"

dsk_prussia.18.t:0 "法兰克福德意志"
dsk_prussia.18.d:0 "法兰克福国民议会的统一进程已进入关键阶段，全德代表一致通过决议，将以[concept_germany]的名义，赋予我们至高的统一领导权。议会希望我们以武力与外交双重手段，扫清[concept_germany]统一道路上的一切障碍，将松散的各邦凝聚为真正的民族国家。这是千载难逢的历史机遇，可也意味着我们必须彻底站在革命与自由派的一边，与保守的旧秩序彻底决裂。我们应当回应法兰克福的呼唤，扛起[concept_germany]统一的大旗吗？"
dsk_prussia.18.f:0 "柏林的宫廷与议会之间爆发了激烈的争执。自由派官僚与资产阶级代表奔走相告，将法兰克福的决议视为[concept_germany]重生的曙光，他们恳求[Concept('concept_ruler','$RULER_TITLE_KING$')][ROOT.GetCountry.GetRuler.GetFirstName]抓住这一历史契机，成为全[concept_germany]的守护者。而[SCOPE.gsInterestGroup('is_landowners_ig').GetName]与宫廷保守派则惊恐万分，他们怒斥法兰克福的决议是对王权的亵渎，是[concept_revolution]势力的阴谋。[ROOT.GetCountry.GetRuler.GetFirstName]站在权力的十字路口，一边是历史的荣耀与全德的拥戴，一边是世袭的特权与旧贵族的忠诚，内心的挣扎如同风暴般翻涌。\n无数双眼睛正注视着柏林的决定，[concept_germany]的未来，就在一念之间。"
dsk_prussia.18.a:0 "我来自世间最骄傲的雄鹰，我代表严谨的肃穆、燃烧的焰火、璀璨的真理。" 

je_dsk_berlin_spring:0 "新内阁"
je_dsk_berlin_spring_reason:0 "6月26日，新内阁发表宣言，表示要以赎买的方式废除农民的封建义务，改革司法制度和税收制度，组织对[concept_country]有益的公共工程，为失业工人提供工作等等。但同时也对群众的斗争进行压制，封闭革命俱乐部、取消学生团体，逮捕工人运动和民主派的领导人\n\n在[SCOPE.GetRootScope.GetCountry.GetName]，反动势力也日益嚣张。8月18日，各地[SCOPE.gsInterestGroup('land_ig').GetName]的代表在柏林召开了“各阶级私有财产保卫者大会”，号召全国贵族都应维护[SCOPE.gsInterestGroup('land_ig').GetName]的共同利益。这个会议被人们称为#v “容克议会”#!。容克势力还渗入了[SCOPE.gsInterestGroup('army_ig').GetName]，许多有共和倾向的军官被清洗。\n\n#yellow 自由派#!势力危在旦夕，我们能否在这[concept_revolution]的年代走向正确的道路呢？"


dsk_its_time_return_button:0 "镇压[SCOPE.sCountry('PRUN_scope').GetName]"
dsk_its_time_return_button_desc:0 "他妈的，[concept_country]怎么变成了这个样子"
 no_prun_tt:0 "[SCOPE.sCountry('PRUN_scope').GetName]已不存在或我们的国王放弃了全德意志王冠"
je_small_german:0 "小德意志方案"
je_small_german_reason:0 "1848年法兰克福国民议会制定宪法时，以加格恩为首的资产阶级自由派提出：建立一个不包括[SCOPE.sCountry('aus_scope').GetName]在内的[concept_germany]联邦，然后再同[SCOPE.sCountry('aus_scope').GetName]签订条约，同其建立某种联盟关系。\n\n实际上是排斥[SCOPE.sCountry('aus_scope').GetName]，在[SCOPE.GetRootScope.GetCountry.GetName]的领导下统一[concept_germany]。\n\n拥护这一方案的主要是[SCOPE.GetRootScope.GetCountry.GetName]和[concept_germany]北、西、中部各邦资产阶级代表，在议会中属多数派。\n1850年爱尔福特联盟议会的召开是实现该方案的第一个具体行动。1859年建立[concept_germany]民族联盟。1871年实现由[SCOPE.GetRootScope.GetCountry.GetName]领导建立统一的[concept_germany_second_empire]"

dsk_prussia.19.t:0 "贱民的王冠"
dsk_prussia.19.d:0 "来自国民议会的代表已经来到了柏林，正式邀请我们的[Concept('concept_ruler','$RULER_TITLE_KING$')][ROOT.GetCountry.GetRuler.GetFirstName]加冕为全[concept_germany]的[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] 。然而，[Concept('concept_ruler','$RULER_TITLE_KING$')]对这个不是神赋的皇冠十分厌恶，而我们的保守派内阁也一直在劝阻[Concept('concept_ruler','$RULER_TITLE_KING$')]拒绝王冠。而外部势力正在紧盯着我们，在这种危机时刻下，我们是否要接受这顶王冠?"
dsk_prussia.19.f:0 "[ROOT.GetCountry.GetRuler.GetFirstName]被《十字报》的人包围，耳边都是普鲁士人的观点。宪法把[Concept('concept_ruler','$RULER_TITLE_KING$')]置于不确定的[concept_germany]框架中，模糊了[Concept('concept_ruler','$RULER_TITLE_KING$')]的身份、《十字报》圈子的人非常质疑这种做法。[ROOT.GetCountry.GetRuler.GetFirstName]讨厌人民的[Concept('concept_ruler','$RULER_TITLE_KING$')]这个官力称号、这表明他的地位不是神赋的，而是无知的人民给的。\n在大臣面前，他戏称皇冠为香肠三明治和来自屠夫和面包师大人的礼物、在更黑暗的时期，他认为这个皇冠是民众想用来把我拴在1848年[concept_revolution]上的狗链，是给猪戴的、是从臭水沟里来的。"
dsk_prussia.19.a:0 "先生们，让我们一同欢呼这伟大的时刻！" 
dsk_prussia.19.b:0 "我从不接受来自臭水沟里的王冠" 
its_time_to_unite_german_2:0 "赢得普奥战争后，所有[concept_germany]非[concept_vassal]的小国会变成我们的[concept_puppet]" 
its_time_to_unite_german:0 "立刻退出#yellow 神圣同盟#!、移除对[SCOPE.sCountry('aus_scope').GetName]的[concept_truce]，你现在可以发动领导权[concept_diplomatic_play]"
its_time_to_unite_german_1:0 "王朝战争已经开启！此选项会引起[SCOPE.sCountry('aus_scope').GetName]强烈的不满！" 
qianjin:0 "全德意志的皇冠！"
revolution_modifier:0 "三月革命"

dsk_prussia.20.t:0 "[SCOPE.sCountry('south_german_country').GetName]的动荡"
dsk_prussia.20.d:0 "[concept_revolution]群众反对专制政府的一系列抗议活动在我们邻国[SCOPE.sCountry('south_german_country').GetName]爆发"
dsk_prussia.20.f:0 "亲王下台。3月13日发生了[concept_revolution]运动及街垒战，市民和大学生为了对抗[SCOPE.sCountry('south_german_country').GetName]军队自发组织了国民警卫队和学院团\n首相[SCOPE.sCharacter('landowners_leader_scope').GetLastName]还因此男扮女装逃往英国"
dsk_prussia.20.a:0 "哦豁，完蛋"

 denmark_flavor.5.t:0 "石勒苏益格-荷尔斯泰因起义"
 denmark_flavor.5.d:0 "[SCOPE.sCountry('hol_scope').GetName]-[SCOPE.sCountry('sch_scope').GetName]最近的发展导致了民族主义和强烈的[concept_germany]认同感的上升。公国内的许多人都认同这一事业，它已经达到了沸点。\n当地的一位王子带着一个猛士团和当地大学的一些学生接管了伦茨堡要塞，并驱逐了当地的驻军，他宣称打算发动一场独立[concept_war]。"
 denmark_flavor.5.f:0 "“今天我们不再是[SCOPE.sCountry('den_scope').GetName]的臣民，而是将自己的命运掌握在自己手中！”"
 denmark_flavor.5.a:0 "这是[concept_germany]民族反抗压迫的号角！"
 denmark_flavor.6.d:0 "[SCOPE.sCountry('hol_scope').GetName]-[SCOPE.sCountry('sch_scope').GetName]最近的发展导致了民族主义和强烈的[concept_germany]认同感的上升。公国内的许多人都认同这一事业，它已经达到了沸点。现在[SCOPE.sCountry('sch_scope').GetName]正举起武器支持独立，我们王国的许多人也想这么做。"


 je_Frankfurt_National_Assembly_2:0 "法兰克福国民议会"
 je_Frankfurt_National_Assembly_2_goal:0 "法兰克福国民议会已决定好组建德意志"
 je_Frankfurt_National_Assembly_2_reason:0 "[concept_germany]资产阶级领导了这场[concept_revolution]，它的首要任务就是要完成[concept_germany]的统一。\n\n而[SCOPE.gsInterestGroup('ig_rural_folk_scope').GetName]、[SCOPE.gsInterestGroup('ig_trade_unions_scope').GetName]也为自身的利益需求而投身于这场[concept_revolution]之中。在[concept_revolution]取得阶段性胜利，在封建君主的妥协之下，资产阶级议会取得了政权。\n\n在[SCOPE.sCountry('frm_scope').GetName]召开的全德国民议会，出席代表共约500人，出自[concept_germany]各地和各个社会阶层。\n\n一个新的全德统一的中央政府成立了，但是这个政府不再是一个象征性产物，它有自己的军队，有办事官员。[concept_germany]各邦君主对其敬畏三分\n\n#v 国民议会能在这个动荡时代完成它的使命，在[concept_revolution]的旗帜下统一[concept_germany]吗?#!"

 dsk_aus.30.t:0 "胜利者的桂冠"
 dsk_aus.30.d:0 "我来自世间最骄傲的雄鹰，我代表最纯粹的黑夜、#v 最皎洁的白雪#!、#red 最热烈的烟火#!!\n从马斯到默默尔，从埃施到贝尔特，[concept_germany]，[concept_germany]，高于一切，高于世间所有万物。"
 dsk_aus.30.f:0 "万岁！德皇！\n\n感受身处皇座的荣耀在光的照耀下激情高昂顺民意，帝运长！\n\n万岁！德皇！无论是骏马或骑士，能保护高峰上皇子所在之地：是热爱祖国的激情，是推崇人民的自由，创建统治者的宝座如海上巨石似神圣火焰，焕发万丈光芒，永不熄灭，为了亲爱的祖国！为荣为战，献忠心，为了君与国！商业与科学因无比的勇气和力量而提升！象征勇士和英雄的事迹的桂冠在您的皇座上被举起！\n\n吾皇[ROOT.GetCountry.GetRuler.GetFirstName]在此你是人民的骄傲是人类的光荣！感受身处皇座的荣耀，在光的照耀下激情高昂！\n\n万岁！德皇！"
 dsk_aus.30.a:0 "为了君与国，生死无悔"

 dsk_aus.31.t:0 "欧洲弃民"
 dsk_aus.31.d:0 "我们没有遵守原先的承诺"
 dsk_aus.31.f:0 "我们否认了原先选择的道路，还毅然决然的让[SCOPE.sCountry('aus_scope').GetName]割让其核心领土\n\n法俄将我们列为“永久不可信任国”，外交声望跌至谷底，所有双边贸易协定作废，边境关税翻倍，商人纷纷撤离[concept_germany]！"
 dsk_aus.31.a:0 "我们彻底失去了和[SCOPE.sCountry('fra_scope').GetName]和[SCOPE.sCountry('rus_scope').GetName]改善外交关系的可能！"

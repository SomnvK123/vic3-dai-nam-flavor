dsk_gbr.24.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]成功举办了一次今年的艺术展，世界各地的人民前来瞻仰我们的艺术作品"
dsk_gbr.24.f:0 "当世界各国的人参观了#variable 皇家美术学院#!的大师展后，他们才会知道这个世界最壮丽的艺术作品出自于哪里。"
dsk_gbr.24.a:0 "我已经流连忘返并且沉醉其中。"

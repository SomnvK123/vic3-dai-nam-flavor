dsk_gbr.4.t:0 "爱尔兰大饥荒"
dsk_gbr.4.d:0 "我们所做的一切努力都是失败的，爱尔兰人遭受了前所未有的大饥荒"
dsk_gbr.4.f:0 "英国政府救助措施不力，反应缓慢。当时的英国正处于其顶峰的维多利亚时期，并且已经完成了工业革命，是公认的世界工厂。英国无论在殖民地、政治制度、经济发展等各方面都领世界潮流之先，是一个拥有地球近四分之一陆地和近四分之一人口的庞大殖民帝国。英国就是那个时代繁荣、发达和文明的象征，其国力居世界翘楚。甚至就在大饥荒四年前，英国为打开中国的大门，不惜费尽心机、劳师动众从印度派军舰发动了鸦片战争。而且此时，英国正全力筹办人类历史上首届世博会。\n然而一切繁华的背后，竟能酿造如此惨烈的悲剧，真是何等的讽刺！"
dsk_gbr.4.a:0 "忘了这些事吧，爱尔兰只是[SCOPE.GetRootScope.GetCountry.GetName]的三等公民罢了"

dsk_gbr.3.t:0 "爱尔兰饥荒的避免"
dsk_gbr.3.d:0 "经过不懈的努力，我们终于避免了爱尔兰爆发饥荒的可能性"
dsk_gbr.3.f:0 "爱尔兰人会感激[SCOPE.GetRootScope.GetCountry.GetName]政府所做的一切。今日所作所为，皆以接纳爱尔兰人为目的。"
dsk_gbr.3.a:0 "爱尔兰人会承认[ROOT.GetCountry.GetRuler.GetFullName]是爱尔兰的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]！"

dsk_gbr.19.t:0 "[SCOPE.sCulture('irish_culture').GetName]移民"
dsk_gbr.19.d:0 "大量的[SCOPE.sCulture('irish_culture').GetName]移民为追寻更好的生活前往[SCOPE.sCountry('usa_scope').GetName]的[SCOPE.sState('beautiful_state').GetName]"
dsk_gbr.19.f:0 "从1820年到1840年，去[SCOPE.sCountry('usa_scope').GetName][SCOPE.sCulture('irish_culture').GetName]移民总数已达七十五万人，平均每年约三万五千人。19世纪四十年代，爱尔兰每年的移民人数扶摇直上，在1851年达到高峰，将近二十五万人。爱尔兰人大规模移居[SCOPE.sCountry('usa_scope').GetName]的结果是，在内战前的二十年中，爱尔兰的总人口减少了约二百五十万人。"
dsk_gbr.19.a:0 "我什么也做不了！"

irish_remove_tt:0 "预计在一年内，全国有10%的[SCOPE.sCulture('irish_culture').GetName]离开[SCOPE.GetRootScope.GetCountry.GetName]"

dsk_gbr.20.t:0 "[SCOPE.sCulture('irish_culture').GetName]大起义"
dsk_gbr.20.d:0 "大量的[SCOPE.sCulture('irish_culture').GetName]的激进分子在[SCOPE.sState('irish_state').GetName]制造了恐怖袭击"
dsk_gbr.20.f:0 "“如果爱尔兰有一日不从英国独立，我的事业就一日不会停止”——爱尔兰民族独立分子"
dsk_gbr.20.a:0 "别让我抓到你们！"

dsk_gbr.21.t:0 "[SCOPE.sCountry('tur_scope').GetName]的[SCOPE.sCharacter('tur_sudan_scope').GetFirstName]听闻爱尔兰的饥荒危机后决定向我们捐赠1万英镑"
dsk_gbr.21.d:0 "[SCOPE.sCharacter('tur_sudan_scope').GetFirstName]宣布他将向爱尔兰饥民捐资1万英镑。"
dsk_gbr.21.f:0 "此后，[SCOPE.sCountry('tur_scope').GetName]又“悄悄”将三船粮食运到爱尔兰，援助饥民。"
dsk_gbr.21.a:0 "感谢[SCOPE.sCountry('tur_scope').GetName]！"
dsk_gbr.21.b:0 "1000英镑即可！[ROOT.GetCountry.GetRuler.GetFullName]本人不过捐资2000英镑！一个外人的捐款怎么能高过[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]？"

dsk_gbr.7.t:0 "接纳爱尔兰清教徒"
dsk_gbr.7.d:0 "从此以后，不再有宗教歧视！"
dsk_gbr.7.f:0 "自16世纪宗教改革以来，爱尔兰人与英格兰人的宗教差异就一直是困扰两个王国统一、融合的障碍。为此，英国一直采取政治和军事的双重高压政策，试图将宗教改革延伸到爱尔兰，将安立甘教会强加到爱尔兰人身上，借以消除两国人民的精神隔阂。\n现在，我们放弃了三百年来试图改变爱尔兰天主教信仰的努力，我们促进平等打破了歧视，在天主教与新教的旗帜下实现了民族新的整合。"
dsk_gbr.7.a:0 "爱尔兰与英格兰同属一个王冠！"

dsk_gbr.8.t:0 "承认爱尔兰地位"
dsk_gbr.8.d:0 "从此以后，爱尔兰就是[SCOPE.GetRootScope.GetCountry.GetName]正式合法领土！"
dsk_gbr.8.f:0 "爱尔兰人也可以与英格兰人一道进入议会共商事宜。"
dsk_gbr.8.a:0 "爱尔兰与英格兰同属一个王冠！"

dsk_gbr.9.t:0 "印度的主人"
dsk_gbr.9.d:0 "[SCOPE.sCountry('bic_scope').GetName]已经臣服于[SCOPE.GetRootScope.GetCountry.GetName]，并宣布效忠于[ROOT.GetCountry.GetRuler.GetFullName]"
dsk_gbr.9.f:0 "古老的印度迎来了新的主人，南亚将不再说印第语而改为英语！"
dsk_gbr.9.a:0 "在最后一个[SCOPE.sCountry('bic_scope').GetName]人倒下前，#red 大英帝国#!绝不投降！"

dsk_gbr.10.t:0 "我们的全球殖民地"
dsk_gbr.10.d:0 "[SCOPE.GetRootScope.GetCountry.GetName]要统治世界，就要先整合帝国最重要的四个皇冠明珠！"
dsk_gbr.10.f:0 "我们的殖民地遍布全球，但仍有大量的殖民地处于分散政权部落原住民的控制，我们要努力打造一个全球性的帝国，就必须把我们最大的四个殖民地统一起来。\n[SCOPE.sCountry('bic_scope').GetName]是我们南亚次大陆最为珍贵的宝珠，控制它就拥有了控制印度洋的贸易航线，还能掌握中亚以对抗俄罗斯。\n[SCOPE.sCountry('saf_scope').GetName]是我们在南非最大的殖民地，控制它，就等于控制好望角，以及获取深入非洲内陆的资格。\n[SCOPE.sCountry('hbc_scope').GetName]，是我们在加拿大最大的贸易公司，我们需要将其整合为一个统一的#red 加拿大#!以便更好管理这片北美极寒之地。\n[SCOPE.sCountry('nsw_scope').GetName]等其它殖民地尚未完全开发澳洲大陆，如果将其统合起来，一个完整的#red 澳大利亚#!将成为我们最忠诚的附庸！\n有了这多么广袤的土地和殖民领，帝国就可以获得源源不断的财富，让[SCOPE.GetRootScope.GetCountry.GetName]的边界永无终点！"
dsk_gbr.10.a:0 "这是不列颠的时代，世界将会记住这个时代！"

dsk_gbr.11.t:0 "帝国四大明珠"
dsk_gbr.11.d:0 "成功整合帝国四大明珠！"
dsk_gbr.11.f:0 "[SCOPE.sCountry('bic_scope').GetName][SCOPE.sCountry('can_scope').GetName][SCOPE.sCountry('ast_scope').GetName][SCOPE.sCountry('saf_scope').GetName]向[SCOPE.GetRootScope.GetCountry.GetName]的[ROOT.GetCountry.GetRuler.GetFirstName]表示效忠，我们的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]为他们的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]！\n《泰晤士报》一篇文章就希望[ROOT.GetCountry.GetRuler.GetFirstName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]能公开宣告自己为印度女皇，[SCOPE.GetRootScope.GetCountry.GetName]征服已经是个不容争辩的事实,印度人民对于英国这个新继承者的认同,对于和蔼[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的热爱,都使得英国理应享受自己征服的帝国荣光,[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]也应当享有帝国的荣耀头衔！"
dsk_gbr.11.a:0 "现在，帝国有了更多的目标，进军[SCOPE.sCountry('afg_scope').GetName]和[SCOPE.sCountry('egy_scope').GetName]"
dsk_gbr.11.b:0 "现在，帝国有了更多的目标，进军[SCOPE.sCountry('egy_scope').GetName]"

dsk_gbr.12.t:0 "澳大利亚的主人"
dsk_gbr.12.d:0 "[SCOPE.sCountry('ast_scope').GetName]已经臣服于[SCOPE.GetRootScope.GetCountry.GetName]，并宣布效忠于[ROOT.GetCountry.GetRuler.GetFullName]"
dsk_gbr.12.f:0 "古老的澳洲大陆迎来了新的主人，他们将成为唯一一个独占整片大陆的国家！"
dsk_gbr.12.a:0 "把一个古老的监狱改造成现代文明的国家？有意思"

dsk_gbr.13.t:0 "加拿大的主人"
dsk_gbr.13.d:0 "[SCOPE.sCountry('can_scope').GetName]已经臣服于[SCOPE.GetRootScope.GetCountry.GetName]，并宣布效忠于[ROOT.GetCountry.GetRuler.GetFullName]"
dsk_gbr.13.f:0 "我们将英语加拿大和法语加拿大合并在一起，创造一个[SCOPE.sCountry('can_scope').GetName]！"
dsk_gbr.13.a:0 "从一个毛皮公司变成一个现代文明的国家？有意思"

dsk_gbr.14.t:0 "南非的主人"
dsk_gbr.14.d:0 "[SCOPE.sCountry('saf_scope').GetName]已经臣服于[SCOPE.GetRootScope.GetCountry.GetName]，并宣布效忠于[ROOT.GetCountry.GetRuler.GetFullName]"
dsk_gbr.14.f:0 "我们统一了南非，创造一个[SCOPE.sCountry('saf_scope').GetName]！"
dsk_gbr.14.a:0 "把布尔，英格兰，南非土著都结合在一起的国家？有意思"

dsk_je_gbr_fra_union:0 "英法和解"
dsk_je_gbr_fra_union_reason:0 "世界进入了新的世纪，我们与[SCOPE.sCountry('fra_scope').GetName]作为永远的邻居必须冰释前嫌，共同向前，世界很大，足以容得下英法两国。"
dsk_je_gbr_fra_union_tt:0 "在拿破仑三世的调和下，缓解我们的百年恩怨"
Napoleon_tt:0 "[SCOPE.sCountry('fra_scope').GetName]的君主是拿破仑三世"

dsk_gbr.15.t:0 "英法和解"
dsk_gbr.15.d:0 "[SCOPE.sCountry('fra_scope').GetName]已经与[SCOPE.sCountry('gbr_scope').GetName]冰释前嫌，双方签订友好条约"
dsk_gbr.15.f:0 "欧洲乃文明大陆，英法乃文明国家，世界上存在有太多未开化的国家值得我们去传播文明！\n你我联手，天下无敌！"
dsk_gbr.15.a:0 "让我们把目光看向东方！"

dsk_je_gbr_fra_union_against_china:0 "第二次鸦片战争"
dsk_je_gbr_fra_union_against_china_reason:0 "[SCOPE.sCountry('gbr_scope').GetName]需要修改《南京条约》，[SCOPE.sCountry('chi_scope').GetName]给予的特殊经济待遇对我们来说微不足道，需要让这个腐朽的东方古国进一步开放市场！如果他们拒绝，[SCOPE.sCountry('gbr_scope').GetName]需要和[SCOPE.sCountry('fra_scope').GetName]一同掠夺东方的财富！"
dsk_gbr.17.t:0 "火烧圆明园"
dsk_gbr.17.d:0 "驻在中国的我国高级军官呼吁进行报复，因为我们国家的一些公民被逮捕并遭到谋杀。绝不能允许任何中国人蔑视我们的同胞！"
dsk_gbr.17.f:0 "在世界的某个角落，有一个世界奇迹。这个奇迹叫圆明园。艺术有两个来源，一是理想，理想产生欧洲艺术；一是幻想，幻想产生东方艺术。圆明园在幻想艺术中的地位就如同巴特农神庙在理想艺术中的地位。这是某种令人惊骇而不知名的杰作，在不可名状的晨曦中依稀可见，宛如在欧洲文明的地平线上瞥见的亚洲文明的剪影。\n这个奇迹已经消失了。\n有一天，两个来自欧洲的强盗闯进了圆明园。一个强盗洗劫财物，另一个强盗在放火。似乎得胜之后，便可以动手行窃了。他们对圆明园进行了大规模的劫掠，赃物由两个胜利者均分。两个胜利者，一个塞满了腰包，这是看得见的，另一个装满了箱箧。他们手挽手，笑嘻嘻地回到欧洲。这就是这两个强盗的故事。\n我们欧洲人是文明人，中国人在我们眼中是野蛮人。这就是文明对野蛮所干的事情。——维克托·雨果"
dsk_gbr.17.a:0 "这个尊贵的东方皇家园林如今已成废墟！"
dsk_je_gbr_Afghanistan:0 "阿富汗战争"
dsk_je_gbr_Afghanistan_reason:0 "[SCOPE.sCountry('afg_scope').GetName]地处伊朗与印度及两国与北中亚地区的交通要道上，战略地位十分重要。我们掌控印度大部分地区后，必须控制[SCOPE.sCountry('chi_scope').GetName]，以此作为阻止[SCOPE.sCountry('rus_scope').GetName]向印度洋扩张而确保自己的印度领地安全的屏障。"
in_chinawar_tt:0 "在高于30以上的战争支持度前提下，击败并将[SCOPE.sCountry('chi_scope').GetName]战争支持度降至-20以下"
dsk_gbr.18.t:0 "阿富汗保护国"
dsk_gbr.18.d:0 "阿富汗诸邦统一后，他们又迎来了新的[concept_overlord]"
dsk_gbr.18.f:0 "[SCOPE.sCountry('afg_scope').GetName]已经臣服于[SCOPE.GetRootScope.GetCountry.GetName]，并宣布效忠于[ROOT.GetCountry.GetRuler.GetFullName]"
dsk_gbr.18.a:0 "俄罗斯野熊，它永远也摸不到印度洋的出海口。"
modifier_afg_winner:0 "阿富汗胜者"
dsk_gbr.111.t:0 "建立北罗德西亚"
dsk_gbr.111.d:0 "我们所属的南非公司管理者提到他们为赞比西河以北的领土，带来了秩序、文明与商业发展。但是根据前去考察大臣的研究，结束公司统治，建立北罗德西亚保护国十分必要。这能以[ROOT.GetCountry.GetRuler.GetFirstName]的名义，将公司压迫下的土著居民权益实施保护，并促进[SCOPE.GetRootScope.GetCountry.GetName]的公正管理。"
dsk_gbr.111.f:0 "我们必须将非洲视为未开发的产业庄园......我们的职责是组织、开发和文明化这些领土，让它们成为[SCOPE.GetRootScope.GetCountry.GetName]工厂的原料库。"


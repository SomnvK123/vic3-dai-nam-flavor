je_great_german_Illyrian_tt:0 "将哈布斯堡和他们的走狗们赶出克罗地亚!"
je_great_german_Illyrian_reason:0 "三一王国:克罗地亚-斯拉沃尼亚-达尔马提亚联合王国。其名称源于中世纪克罗地亚王国的三个传统地域概念。通过扶植三一王国，可以削弱#yellow 匈牙利王国#!在帝国体系内的地位，并防止#yellow 意大利王国#!争夺达尔马提亚地区，而[SCOPE.sCountry('aus_scope').GetAdjective]则会变成完全的内陆国！"

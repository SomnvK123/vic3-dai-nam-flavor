dsk_prussia.33.t:0 "四千万德意志民族"
dsk_prussia.33.d:0 "法兰克福国民议会以绝对多数通过【四千万德意志计划】，决议以民族边界为纲，整合马斯河至默默尔、埃施河至贝尔特海峡内所有德意志人聚居区，打造人口逾4000万的统一德意志国家。临时政府已获全德自由派、工商阶层与知识分子拥戴，却无直属军队、无财政实权、无邦国效忠。在[SCOPE.sCountry('bav_scope').GetAdjective]蓝、[SCOPE.sCountry('sax_scope').GetAdjective]绿与[SCOPE.sCountry('han_scope').GetAdjective]金的绶带封印下终获签署"
dsk_prussia.33.f:0 "“这才是真正的德意志！四千万同胞血脉相连，没有异族拖累，没有多民族纷争，这是纯粹的日耳曼荣光！”\n\n“我们与奥地利共享数百年历史，哈布斯堡曾是德意志的旗帜。如今将其彻底排除，难道要斩断我们的根？”\n\n“我们要的是‘德意志人的德意志’，而非哈布斯堡的附庸。四千万纯血同胞的凝聚力，远比与异族帝国的羁绊更重要。”\n\n“可那些被抛弃的德意志同胞呢？匈牙利境内的日耳曼人，难道就不算德意志人？”\n\n“他们若真心认同，自会挣脱哈布斯堡的束缚前来。这里，才是德意志的唯一核心。”"
dsk_prussia.33.a:0 "所有人拥戴我[SCOPE.GetRootScope.GetCountry.GetName]的[Concept('concept_ruler','$RULER_TITLE_KING$')]为全[concept_germany]的[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]"


dsk_prussia.34.t:0 "布拉格和约"
dsk_prussia.34.d:0 "[SCOPE.sCountry('aus_scope').GetName]与[SCOPE.GetRootScope.GetCountry.GetName]间的战争状态自本约签署之日起终止。双方军队立即停火、撤出对方领土。"
dsk_prussia.34.f:0 "奥地利皇帝[SCOPE.sCharacter('crisis_scope_1').GetFirstName]以其本人及哈布斯堡王朝名义，永久、无条件放弃对[SCOPE.sCountry('hun_scope').GetAdjective]（含克罗地亚、斯洛伐克、特兰西瓦尼亚等全部传统领地）的一切宗主权、统治权、立法权、军事权与财政权。\n\n承认[SCOPE.sCountry('hun_scope').GetAdjective]为完全独立、主权完整的国家，与[SCOPE.sCountry('aus_scope').GetName]无任何隶属关系。\n\n[SCOPE.sCountry('aus_scope').GetName]承诺不干涉[SCOPE.sCountry('hun_scope').GetAdjective]内政、外交、军事及民族事务，不支持任何反对[SCOPE.sCountry('hun_scope').GetAdjective]独立的势力。"
dsk_prussia.34.a:0 "本约于[TimeKeeper.GetCurrentDate.Format('y年 m月 d日')]在#yellow 布拉格#!签署，经两国陛下批准后立即生效。"

dsk_prussia.36.t:0 "[SCOPE.sCharacter('landowners_leader_scope').GetLastName]时代"
dsk_prussia.36.d:0 "三十八方割据，各邦国各自为政，拥有独立的外交、军事与司法权，不仅相互设立贸易壁垒，还常因边界纠纷兵戎相见。农奴制残余阻碍劳动力流动，普通民众在邦国间迁徙需办理繁琐文书，税负随邦国更迭层层叠加，生计困苦不堪。"
dsk_prussia.36.f:0 "这根本不是一个国家，而是一群割据势力的拼盘！我的布匹从汉堡运到慕尼黑，关税加起来比布料本身还贵，再这样下去，所有生意都要垮掉！”\n\n普鲁士官员皱眉回应：“我们也想废除关卡，但每个邦国都有自己的货币和税法，巴伐利亚的度量衡与萨克森不同，汉诺威的商业章程又与符腾堡相悖，光统一关税就谈了十年。”\n\n“商人至少还能赚钱，我们迁徙耕作要过五重边境，每过一处都要交‘过境税’，去年收成的三成，全用来付这些苛捐杂税了。”\n\n“更可怕的是外强干涉，法国、俄国都在利用我们的分裂牟利，而我们连一支统一的军队都没有，只能任人摆布。”\n\n“可谁愿意放弃主权呢？”商人反问，“每个邦国的诸侯都想保住自己的权力，这三十八方割据，究竟要持续到什么时候？”"
dsk_prussia.36.a:0 "带我走向专制的[concept_germany]统一"
dsk_prussia.36.b:0 "带我走向民主的[concept_germany]统一"


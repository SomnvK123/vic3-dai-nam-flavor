tur_event.1.t:0 "来自我们驻奥斯曼大使馆的消息！"
tur_event.1.d:0 "1853年2月，亚历山大·谢尔盖耶维奇·缅希科夫亲王作为[SCOPE.sCountry('rus_scope').GetName]全权特使前往君士坦丁堡，要求[SCOPE.sCountry('tur_scope').GetName]政府承认俄皇[SCOPE.sCharacter('crisis_scope_2').GetFirstName]对苏丹[SCOPE.sCharacter('crisis_scope_5').GetFirstName]统治下的[SCOPE.sReligion('orthodox_religion').GetName]臣民（[SCOPE.sCulture('greek_culture').GetName]、[SCOPE.sCulture('bulgarian_culture').GetName]、[SCOPE.sCulture('romanian_culture').GetName]以及[SCOPE.sCulture('serb_culture').GetName]等）有特别保护权。就在这时，巴尔干土耳其领地门的内哥罗发生革命，土耳其军队开进门的内哥罗镇压。缅希科夫在君士坦丁堡获得了重大胜利，苏丹答应在圣地保护权上做出一切必要让步。然而，缅希科夫得到沙皇的指示又提出新的要求，要求苏丹答应签定一项新条约，[SCOPE.sCountry('tur_scope').GetName]应该从门的内哥罗撤军。这不啻于将巴尔干拱手让与沙皇，苏丹[SCOPE.sCharacter('crisis_scope_5').GetFirstName]无法答应这个这个苛刻的要求。另外一个重要原因是[SCOPE.sCountry('gbr_scope').GetName]驻[SCOPE.sCountry('tur_scope').GetName]大使雷德克利夫勋爵鼓励苏丹拒绝俄国的漫天要价，和以往一样[SCOPE.sCountry('gbr_scope').GetName]许诺将在危机中支持土耳其，且这次还有[SCOPE.sCountry('fra_scope').GetName]的支持。\n[SCOPE.sCountry('tur_scope').GetName]于1853年5月拒绝了[SCOPE.sCountry('rus_scope').GetName]的最后通牒，并允许英法联合分舰队进入达达尼尔海峡。俄土断交。"
tur_event.1.f:0 "土耳其苏丹[SCOPE.sCharacter('crisis_scope_5').GetFirstName]在[SCOPE.sCountry('gbr_scope').GetName]和[SCOPE.sCountry('fra_scope').GetName]的支持下要求[SCOPE.sCountry('rus_scope').GetName]归还这两个公国。1853年10月16日，俄罗斯向土耳其开战，克里米亚战争爆发。英、法为保持并扩大在土耳其的势力，参加了土耳其方面对俄作战。"
tur_event.1.a:0 "伟大的第三罗马[SCOPE.sCountry('rus_scope').GetName]终会抵达它最忠诚的沙皇格勒"
tur_event.1.b:0 "荣耀重归[SCOPE.sCountry('tur_scope').GetName]！"
tur_event.1.c:0 "关我啥事？关我啥事？"


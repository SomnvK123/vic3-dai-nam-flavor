je_fra_pru_reason:0 "[SCOPE.sCountry('pru_scope').GetName]在19世纪中叶逐渐崛起，成为德意志地区的领导力量。他们在政治、经济和军事方面都取得了显著发展，其现代化的军队成为欧洲最强大的军事力量之一。\n[SCOPE.sCountry('pru_scope').GetName]希望通过打赢与[SCOPE.sCountry('aus_scope').GetName]的战争把其踢出德意志，继而统一一个不包括[SCOPE.sCountry('aus_scope').GetName]的德意志国家。这一愿景与我们的扩张意图产生了直接的冲突。\n[SCOPE.sCountry('gbr_scope').GetName]和[SCOPE.sCountry('rus_scope').GetName]等大国不愿看到我们过分强大，因此默认了我们邻国的发展壮大。"

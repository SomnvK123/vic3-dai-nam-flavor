je_fra_gbr_tur_tt:0 "如果[SCOPE.sCountry('rus_scope').GetName]成功控制了君士坦丁堡，那们我们在巴尔干的地位将会难以为继"
je_fra_gbr_tur_reason:0 "“东方问题”一词的“东方”是西欧国家意义上的东方，包括近东和中东部分地区，在19世纪可以说专指当时[SCOPE.sCountry('tur_scope').GetName]及其属地。东方问题”最早在维罗纳会议上开始使用，此后成为外交上一个专有名词，“被用来概括在[SCOPE.sCountry('tur_scope').GetName]的衰落和它被假定即将瓦解中所造成的各种国际问题。 \n马克思形容东方问题是19世纪西方各国在革命和表面安定之后总会出现的“无法解决的问题”、“无尽的困难之源”，并把东方问题形象归结为“对土耳其怎么办”。"

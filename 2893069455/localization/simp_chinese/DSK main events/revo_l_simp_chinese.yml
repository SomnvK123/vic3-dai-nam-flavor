 156_projects_events.2.d:0 "本期主要专注于基础设施建设"
 156_projects_events.2.f:0 "没有良好的基础设施建设，再多的产品也运不出去"
 156_projects_events.2.a:0 "真是无私的举动"

 156_projects_events.3.t:0 "156项重点工程建设第三期"
 156_projects_events.3.d:0 "本期主要专注于工业建设，主要是重工业"
 156_projects_events.3.f:0 "重工业为各行业、各部门提供赖以生存、发展的生产资料和技术基础"
 156_projects_events.3.a:0 "真是无私的举动"

 156_projects_events.4.t:0 "156项重点工程建设第四期"
 156_projects_events.4.d:0 "本期主要专注于轻工业"
 156_projects_events.4.f:0 "轻工业是民生的支柱"
 156_projects_events.4.a:0 "真是无私的举动"

 156_projects_events.5.t:0 "156项重点工程建设第五期"
 156_projects_events.5.d:0 "本期主要专注于矿业和军事工业"
 156_projects_events.5.f:0 "矿产资源是工业的燃料，而军事工业是保障这些的基础"
 156_projects_events.5.a:0 "真是无私的举动"

 156_projects_events.6.t:0 "156项重点工程建设第六期"
 156_projects_events.6.d:0 "本期主要专注于整体提升"
 156_projects_events.6.f:0 "我们即将从一个农业国变为工业国"
 156_projects_events.6.a:0 "真是无私的举动"



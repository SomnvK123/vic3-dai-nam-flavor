 quit:0 "在[SCOPE.sCountry('rev_target_country').GetName]煽动革命的决议在扩大会议上没能通过"

 revolution_events.1.t:0 "我方人员安全抵达"
 revolution_events.1.d:0 "在有关部门同志的不懈努力下，从[SCOPE.GetRootScope.GetCountry.GetName]出发的一批有着优秀的理论水平，丰富的斗争经验和极高的思想觉悟的共产主义者已经抵达了目的地。"
 revolution_events.1.f:0 "“同志们，我相信过不了多久，[SCOPE.sCountry('rev_target_country').GetName]这片土地就会沐浴在红旗的光辉下！”"
 revolution_events.1.a:0 "先联系当地支部"
 revolution_events.1.b:0 "我们应当里应外合"

 revolution_events.2.t:0 "我方人员的行动被发现"
 revolution_events.2.d:0 "虽然我们这次行动堪称天衣无缝，但还是出了一点纰漏。在进入某处接头地点的时候，我们的人员被[SCOPE.sCountry('rev_target_country').GetName]军警发现，虽然大多数人都逃了出来，但有几位同志为了掩护大部队而牺牲了。"
 revolution_events.2.f:0 "“你们快跑，我来拖住他们！”"
 revolution_events.2.a:0 "我们必须暂时从这里撤退，避避风头"
 revolution_events.2.b:0 "补充人力物力，加快行动速度"

 revolution_events.3.t:0 "策反军队"
 revolution_events.3.d:0 "首先就要让这个制度失去它的主要靠山，[SCOPE.sCountry('rev_target_country').GetName]的“可靠的军队”！"
 revolution_events.3.f:0 "据我所知，由于饮食恶劣和缺乏任何卫生设备，在士兵中间流行着各种传染病。又因为连起码的住所和服装都没有，这种不堪忍受的情况就更加恶化了。瘦弱而又疲惫的士兵，像苍蝇一样地死去。而在这以前还有成千上万的阵亡者！……这种情况在士兵中间引起了波动和不满。士兵逐渐从沉眠中觉醒过来，开始觉得自己是人；他们不再盲目服从长官的命令，而时常用口哨声和威吓声来对待那些作威作福的军官。"
 revolution_events.3.a:0 "士兵是我们的兄弟"
 revolution_events.3.b:0 "那些士官同样心怀不满"


 revolution_events.4.t:0 "所有权力归紧急苏维埃"
 revolution_events.4.d:0 "内战爆发了，特殊时刻，特殊对策。现在大家必须听从指挥！"
 revolution_events.4.f:0 ""
 revolution_events.4.a:0 "是！"
 revolution_events.4.b:0 "没有必要"

 rr_events.1.t:0 "共产主义民族思想的演讲吸引民众"
 rr_events.1.d:0 "民族压迫的政策就是民族分裂的政策。它同时又是一种经常腐蚀人民意识的政策。"
 rr_events.1.f:0 "黑帮的全部打算，都是建筑在把各民族的利益对立起来、毒化愚昧无知和备受压制的群众的意识之上的。\n 但是工人阶级需要的不是分裂，而是团结。对于工人阶级来说，再没有比野蛮的成见和迷信更加可恨的敌人了，而工人阶级的敌人却在愚昧无知的群众中散播这些毒素。对“异族人”的压迫，是一根有两头的棍子。这根棍子一头打击“异族人”，另一头打击“自己人”。因此，工人阶级必须坚决反对任何民族压迫。工人阶级应当用自己对于必须实行完全平等、完全和彻底摈弃任何民族的任何特权的信念来反对黑帮的宣传，黑帮企图用这种宣传转移工人阶级的视线，使他们不去注意黑帮对异族人的迫害。"
 rr_events.1.a:0 "[SCOPE.sCountry('rev_target_country').GetName]的工人们，要团结不要分裂！"
 rr_events.1.b:0 "[SCOPE.sCharacter('reactionary_gang').GetFullName]就是黑帮老大！"

 rr_events.2.t:0 "支持我们活动的[SCOPE.sCountry('rev_target_country').GetName]社会主义者[SCOPE.sCharacter('lost_in_debate').GetFullName]在辩论中失败"
 rr_events.2.d:0 "这场演讲被一名神职人员干扰，他的言论吸引了很多本来支持我们的人"
 rr_events.2.f:0 "共产主义带来了无神论，这完全是一种异端邪说，对个人灵性、自由意志和个体尊严构成了威胁。共产主义的核心原则完全否定了个人财产权、个人自由和个人责任的重要性。共产主义无视人类天性，并试图通过强制性的集体主义体系来统一和控制个体。这种体系剥夺了个人的选择权和自由意志，将人们置于中央计划和集体统治的无情支配之下。请大家想想，你愿意生活在这样一个没有神明、没有自由、没有道德的社会里吗？"
 rr_events.2.a:0 "他说的好像有道理"
 rr_events.2.b:0 "共产主义就是无君无父！"

 rr_events.3.t:0 "经费丢失"
 rr_events.3.d:0 "妈的，我们的黄金呢？"
 rr_events.3.f:0 "“没有这笔钱，我们如何才能展开活动？”\n“我觉得[SCOPE.sCharacter('funds_stealer').GetFullName]很可疑”"
 rr_events.3.a:0 "就是[SCOPE.sCharacter('funds_stealer').GetFullName]偷走的！抄他的家，把他开除党籍！"
 rr_events.3.b:0 "没有足够证据证明是 [SCOPE.sCharacter('funds_stealer').GetFullName] 偷走的，还是再跟中央要点吧"

 rr_events.4.t:0 "革命工人联合会的成立"
 rr_events.4.d:0 "[SCOPE.sState('workers_joint_committee_state').GetName] 地区的工人们建立了当地第一支革命工人联合会"
 rr_events.4.f:0 "工人联合会的任务:\n(1)组织武装起义的义勇队\n(2)筹集建立武装和出版真正无产阶级性质的书刊所必需的资金\n工人联合会的组织:\n(1)工人小组(主要由同一车间的工人组成)\n(2)工厂委员会\n(3)区会议\n(4)工人联合会的委员会\n所有上级机构均由下一级机构选出的代表组成"
 rr_events.4.a:0 "给他们运来武器"
 rr_events.4.b:0 "给他们资助金钱"
 rr_events.4.c:0 "我们什么也做不了"

 rr_events.5.t:0 "[SCOPE.sState('marxism_club_state').GetName]大学里的马克思主义社团"
 rr_events.5.d:0 "与别处不同，大学的风气是自由的，学生和老师们可以在这里讨论任何内容，这里是一个思想碰撞的地方"
 rr_events.5.f:0 "从马克思主义到[SCOPE.sCharacter('reactionary_gang').GetLastName]新时代[SCOPE.sCountry('rev_target_country').GetName]特色保皇主义思想，在这里都可以被讨论。有什么不能说的？"
 rr_events.5.a:0 "鼓励更多学者参与"
 rr_events.5.b:0 "鼓励社团举办活动"
 rr_events.5.c:0 "他们应该更多地参与进来"

 rr_events.6.t:0 "反动政府军警和宪兵镇压[SCOPE.sState('capital_state').GetName]工人的游行"
 rr_events.6.d:0 "宪兵不停地驱散示威者，但是示威者又不断地重新集合起来。人群向警察还击，响起了左轮手枪射击的声音，有许多警察受了伤。"
 rr_events.6.f:0 "从上午11时起，工人开始聚集在街上。人群唱着《华沙曲》。纷纷举行革命集会。拒绝罢工的印刷所被捣毁了。人群抢劫了面包铺和枪械商店——工人要面包，为了活下去；要武器，为了争自由。警察在击退了极为顽强的反抗之后才把示威者驱散。在总督府附近，发生了一场战斗。在面包铺旁边，聚集了一大群面包工人。正像后来该面包铺管事人所讲的那样，工人是和平地走上街头的，他们是为了声援全体罢工者才停止工作的。一队宪兵向人群攻击。工人退入房屋，爬上屋顶和阁楼，向士兵抛掷石头。房屋被正规地包围起来。军队向工人开枪。一切交通都断绝了。两个宪兵连进行包抄，从后面冲进房屋，占领了敌人的阵地。有192个面包工人被捕，其中有8人受伤，两个工人被打死。军警方面也有受伤的，宪兵大尉受了重伤。"
 rr_events.6.a:0 "野火烧不尽，春风吹又生"
 rr_events.6.b:0 "[SCOPE.sCharacter('revolutionary_martyr').GetFullName] 是一位好同志"

 rr_events.7.t:0 "[SCOPE.sState('workers_strike_state').GetName]秩序井然！"
 rr_events.7.d:0 "[SCOPE.sState('workers_strike_state').GetName]最近发生了规模巨大的罢工，上万名男女工人停止工作，走上街头争取他们的权利。"
 rr_events.7.f:0 "“华沙秩序井然！”“巴黎秩序井然！”“柏林秩序井然！”每隔半个世纪，“秩序”维护人发布的消息就这样从世界历史性斗争的一个中心转到另一个中心。兴高采烈的“胜利者”却没有注意到，这种必须周期性地靠血腥屠杀维护的秩序在不可避免地走向它的失败的历史命运。[SCOPE.sState('workers_strike_state').GetName]最近的这个“斯巴达克周”是什么？它带来了什么？它教给了我们什么？还在斗争中间，在反革命的胜利喧嚣声中，革命的无产阶级就应该就已经发生的事对自己作出解释，用伟大的历史尺度来衡量事情的过程和结果。革命要抓紧时间，它要继续冲击，越过还没有掩盖的坟墓，把“胜利”和“失败”撇开不管，朝着它的伟大目标前进。自觉地遵循革命的路线，走革命的道路，是为国际社会主义奋斗的战士的首要任务。"
 rr_events.7.a:0 "支援当地罢工的工人"
 rr_events.7.b:0 "趁机在其他地区煽动罢工"

 rr_events.8.t:0 "[SCOPE.sState('soldiers_refuse_orders_state').GetName]的士兵拒绝执行命令"
 rr_events.8.d:0 "[SCOPE.sState('soldiers_refuse_orders_state').GetName]大学的进步学生发起了一场游行示威来声援本地的工人阶级，并要求反动政府立刻召开革命政党主导的人民立宪会议。"
 rr_events.8.f:0 "这种要求是[SCOPE.sCountry('rev_target_country').GetName]的反动政体的阶级压迫者所无法接受的。在接到上级传来的镇压进步学生运动的命令后，[SCOPE.sState('soldiers_refuse_orders_state').GetName]的士兵们拒绝执行这一命令，并且用枪指着他们的长官。\n看来反动政府的恶劣行径已经连他们最可靠的“打手”都无法忍受了。"
 rr_events.8.a:0 "越来越多的人将会站在我们这一边"

 rr_events.9.t:0 "A las Barricade, A las Barricade!(到街垒去!)"
 rr_events.9.d:0 "民情鼎沸。街上无组织的人群自发地但又犹犹豫豫地在构筑第一批街垒。"
 rr_events.9.f:0 "第二天，反动军队开始向街垒和街上的人群进行炮击，构筑街垒已经不再犹豫不决了，已经不是个别的情况，而是大批地在构筑。全城的民众都涌上街头；全城的主要中心地区都布满了街垒。战斗队员同军队进行了好几天顽强的游击战，这种游击战使军队疲惫不堪\n罢工发展为起义，首先是由后来形成的客观条件促成的。举行总罢工已经不能使政府措手不及了，政府已经把准备采取军事行动的反革命势力组织起来了。最近[SCOPE.sCountry('rev_target_country').GetName]一系列事件的发展，惊人地证实了马克思的一个深刻原理：革命向前进展是由于它产生了一个团结而坚强的反革命，也就是说，革命迫使敌人采取愈来愈极端的防御手段，因而它自己也在掌握愈来愈强有力的进攻手段。\n运动从政治总罢工发展到了最高的阶段。它迫使反动派采取极端的抵抗手段，因而使革命也采取极端的进攻手段的时机大大提前到来。反动派炮击街垒、房屋和街上的人群以后，已经再也无路可走了。革命则除了组织莫斯科的战斗队以外，还有别的道路可走，无论在广度或深度方面都有很多很多的道路可走。"
 rr_events.9.a:0 "挺起了胸膛，快向前走！"
 rr_events.9.b:0 "看，红旗飘，胜利日就在前头"

 rr_events.10.t:0 "一名社会民主主义者"
 rr_events.10.d:0 "[SCOPE.sCountry('rev_target_country').GetName]的工人运动出现了别样的声音，一名政治新星:[SCOPE.sCharacter('socialdemo_leader').GetFullName] 出现在了公众视野中，并吸引了许多人的目光。"
 rr_events.10.f:0 "社会民主党是资产阶级的政治队伍，是资产阶级在工人运动中的代理人，是资产阶级的主要社会支柱。在任何时候，共产党人必须在无产阶级革命和无产阶级专政的基本问题上同社会民主党划清界限，在国际工人运动中和各国工人群众中肃清社会民主主义的思想影响。"
 rr_events.10.a:0 "不反对我们革命事业的人都可以团结"
 rr_events.10.b:0 "他的和平主义的主张完全是破坏革命，我们的事业容不下这样的右派"
 rr_events.10.c:0 "社会民主主义者完全是资产阶级的内鬼，杀了他！"

 rr_events.11.t:0 "[SCOPE.sCharacter('new_people').GetFullName] 想加入我们的队伍"
 rr_events.11.d:0 "[SCOPE.sCharacter('new_people').GetFullName] 是有名的小市民活动家，是一名无政府主义者。虽然他早已退休，但他表示愿意为工人运动做出自己的一点贡献。"
 rr_events.11.f:0 "无政府主义主张一种从政治到经济上的无国家的社会。政治上工人自发结社，取缔政党、政府、国家这些压榨人民的统治工具，经济上提倡工人组成各种关于生产和消费的合作社，从而把处于中间的资本家、官僚、政府这些食利者排除在外，进行一种平等交换的自治经济。社会自发组织完全可以取代腐败的国家机器。"
 rr_events.11.a:0 "只要是反对资产阶级专政的人，我们都欢迎"
 rr_events.11.b:0 "我们要先了解你的政治倾向，你说的无政府主义，它左吗？"

 rr_events.12.t:0 "“精致”的民族主义者[SCOPE.sCharacter('nationalist').GetFullName] "
 rr_events.12.d:0 "外来的移民正在夺去我们的工作机会，侵占我们的生存空间"
 rr_events.12.f:0 "当最聪明的资产者很清楚地看到单靠使用暴力没有指望的时候，各个“进步的”资产阶级政党与集团就越发经常地宣传各种各样的能够削弱工人阶级斗争的资产阶级思想和学说，用这种方法来分化工人。精致的民族主义就是这样一种思想，它在最漂亮和最好听的借口下，例如在保护“民族文化”利益、保护“民族自决或独立”等等借口下鼓吹无产阶级实行分裂。"
 rr_events.12.a:0 "这些话语毫无疑问具有煽动性"

 rr_events.13.t:0 "[SCOPE.sCharacter('left_leader').GetFullName] 要求立即召开立宪会议"
 rr_events.13.d:0 "我们要求，将所有权利交给人民选出的代表，而不是那些[SCOPE.gsInterestGroup('powerful_ig').GetName] 老爷们！"
 rr_events.13.f:0 "应当召开，而且要快些召开。但是保证它召开并且开得成功的条件只有一个：增加工兵农等等代表的数量，加强它们的力量；组织和武装工人群众。这是唯一的保证。"
 rr_events.13.a:0 "如果你们不愿意召开，那就只能刀兵相见了"

 rr_events.14.t:0 "党内温和派反对立即进行革命"
 rr_events.14.d:0 "党内大多数人对现在发起革命能否成功没有太大信心"
 rr_events.14.f:0 "在我们中央委员会里，在党的上层分子中存在着一种主张等待立宪会议的召开，反对立即夺取政权，反对立即起义的倾向或意见。必须制止这种倾向或意见。否则，我们党就会遗臭万年，毁灭自己的党。因为错过这样的时机而“等待”，就是十足的白痴或彻底背叛。这就是彻底背叛世界无产阶级。我们不能等待他们开始革命！！"
 rr_events.14.a:0 "但我们现在确实准备不够充分，我们只有一次机会"
 rr_events.14.b:0 "革命刻不容缓"

 rr_events.15.t:0 "[SCOPE.sState('f_textile_worker_state').GetName]的纺织女工要求扩大权利"
 rr_events.15.d:0 "在过去的15年里，无产阶级女性群众在政治上和工会组织上的觉醒是伟大的。但是，这只是因为劳动妇女在被剥夺权利的情况下，对其阶级的政治和议会民主斗争产生了浓厚的兴趣。"
 rr_events.15.f:0 "资本主义国家未能阻止女性承担政治生活中的所有这些责任和努力。一步步地，通过允许拥有组织工会和进行集会的权利，国家确实被迫给予并保障了她们这种可能性。只有女性的最后一项政治权利被剥夺：选举和被选举权，也就是直接决定立法机构和行政机构中的人民代表，或成为这些机构的民选成员。在这里，就像在社会的所有其他领域一样，格言是：“千万不要让事情开始！”但事情已经开始了。目前的国家在允许无产阶级女性参加公共集会和政治组织时，已经向她们让步了。但国家并不是自愿的，而是迫于日益壮大的工人阶级不可抗拒的压力，不得已而为之。"
 rr_events.15.a:0 "妇女群体解放自己的一大步"

 rr_events.16.t:0 "技官派鼓动工程师群体"
 rr_events.16.d:0 "一些左翼技官主义者加入了我们的队伍，并且在工程师队伍中鼓吹技官主义的好处，吸引了不少人"
 rr_events.16.f:0 "技官治理的根本力量来源于人民群众。一小撮疯狂科学家躲在小黑屋里，利用邪恶之手操纵世界是不现实且可笑的。技术领的建设需要依托人民群众，让技术见光，让科学见到人民，只有成千上万的知识被应用到劳动中，物质标准才能得到极大改善。技术领属于愿意为之奉献的每一个劳动者。"
 rr_events.16.a:0 "这不是真正的共产主义思想，是一种变相的寡头主义"
 rr_events.16.b:0 "科学技术造福人民，太棒了"
 rr_events.16.c:0 "这让我们离田园之乐越来越远"

 rr_events.17.t:0 "[SCOPE.sState('refuse_to_increase_salary').GetName]的资本家拒绝给工人涨工资"
 rr_events.17.d:0 "[SCOPE.sState('refuse_to_increase_salary').GetName]的资本家引经据典，称涨工资带来的只会是价格的普遍上涨，以此为理由拒绝给工人涨工资。一些知识分子对此也表示赞同"
 rr_events.17.f:0 "任何旨在提高工资的运动除了使粮食、酒等等涨价即引起生活必需品的匮乏以外，不可能产生别的结果。要知道，什么是工资？工资就是粮食……的成本，就是一切物品的全部价格。再进一步说，工资就是组成财富和劳动群众每日为再生产而消费的各种要素的比例。因此，将工资提高一倍……就等于发给每一个生产者一份比他的产品更大的份额，这当然是矛盾的。如果只是在少数生产部门内提高，就会使交换普遍混乱，总之，会引起生活必需品的匮乏……我可以断言：导致提高工资的罢工不能不引起价格的普遍上涨，这同二加二等于四一样确实。"
 rr_events.17.a:0 "荒谬的资产阶级言论"
 rr_events.17.b:0 "他说的也有一定道理"

 rr_events.18.t:0 "[SCOPE.sState('f_p_protest').GetName]农民反对地主占有大量土地"
 rr_events.18.d:0 "愚弄农民，劝他们等待立宪会议。地主势力则一再拖延，推迟召开这个给农民扩大权利的会议"
 rr_events.18.f:0 "大多数农民在许多次代表大会上响亮而明确地发表声明，宣布地主占有土地是不合理的，是一种抢劫。但是自称为革命的和民主的政府却一连好几个月都在愚弄农民，用诺言和拖延手段欺骗农民。地主势力一连好几个月不让[SCOPE.sCharacter('rf_minister').GetFullName] 颁布关于禁止土地买卖的法律。而在这个法律终于公布出来之后，地主势力又对[SCOPE.sCharacter('rf_minister').GetFullName] 进行无耻的诽谤性攻击，并且直到现在还在攻击。政府在保护地主方面是这样的卑鄙无耻，竟开始把“擅自”夺取土地的农民送交法庭审判。解决土地问题要等到立宪会议召开。召开立宪会议要等到战争结束。结束战争要等到完全胜利。结果就是这样。在政府中占多数的资本家和地主简直是在嘲弄农民。"
 rr_events.18.a:0 "地主拿的太多了！"
 rr_events.18.b:0 "农民，尤其是自给农，在这个社会上过着最差的生活"
 rr_events.18.c:0 "这条法律今天必须通过！"

 rr_events.19.t:0 "党内理论家将无产阶级专政与农民的革命民主专政区分开"
 rr_events.19.d:0 "在许多欠发达的国家，农民占据着人口的绝大部分，如果我们不能团结大多数，打击极少数，革命又怎么能成功呢？"
 rr_events.19.f:0 "农民取得全部土地和全部政权，这是可能的。我不仅没有忘记这种可能，没有把自己的眼界局限于今天，而且我在直接地确切地表述土地纲领时还估计到一种新现象，即贫雇农和农民业主之间发生着更深刻的分裂。觉悟的工人要取得政权，必须把大多数群众争取过来，因为在没有对群众使用暴力的时候，没有别的办法可以取得政权。我们不是布朗基主义者，我们不主张由少数人夺取政权。我们是马克思主义者，我们主张用无产阶级的阶级斗争来反对小资产阶级的狂热，反对沙文主义－护国主义，反对空谈，反对依赖资产阶级。"
 rr_events.19.a:0 "应该把朋友搞得多多的"
 rr_events.19.b:0 "没有工人，革命确实搞不成"

 rr_events.20.t:0 "将军[SCOPE.sCharacter('army_general').GetFullName] 处死[SCOPE.sState('refused_order_state').GetName]的同情工人的士兵"
 rr_events.20.d:0 "让同为无产阶级的士兵去镇压无产阶级，是反动政府常用的做法"
 rr_events.20.f:0 "越来越多的士兵和下级军官对反动政府感到不满，这个国家已经到了连自己的暴力机关都不能控制的地步了。军队开始动摇。起初，出现个别不服从命令的现象，后备队闹事，军官们反抗，在士兵中进行鼓动，个别连或团拒绝向自己的工人弟兄开枪。后来，部分军队转到起义方面。"
 rr_events.20.a:0 "四分五裂，即将崩溃"

 rev_sway_events.1.t:0 "工会站在我们这一边"
 rev_sway_events.1.d:0 "我们赢得了更多人的支持"
 rev_sway_events.1.f:0 "胜利指日可待"
 rev_sway_events.1.a:0 "工人阶级最强大"

 rev_sway_events.2.t:0 "乡村民众站在我们这一边"
 rev_sway_events.2.d:0 "我们赢得了更多人的支持"
 rev_sway_events.2.f:0 "胜利指日可待"
 rev_sway_events.2.a:0 "好！"

 rev_sway_events.3.t:0 "知识分子站在我们这一边"
 rev_sway_events.3.d:0 "我们赢得了更多人的支持"
 rev_sway_events.3.f:0 "胜利指日可待"
 rev_sway_events.3.a:0 "好！"

 rev_sway_events.4.t:0 "军队站在我们这一边"
 rev_sway_events.4.d:0 "我们赢得了更多人的支持"
 rev_sway_events.4.f:0 "胜利指日可待"
 rev_sway_events.4.a:0 "好！"

 rev_sway_events.5.t:0 "工会拒绝了我们"
 rev_sway_events.5.d:0 "这些社会民主主义的骑墙派已经完全堕落成资产阶级的帮凶，但革命的来临仍旧是不可避免的"
 rev_sway_events.5.f:0 "工人阶级不进行无情的战斗，来反对这种叛徒行径、这种没有气节、向机会主义献媚的行为，便不能实现它要进行世界革命的目的。这不是偶然现象，而是第二国际各种矛盾的社会产物，是既要在口头上忠实于马克思主义又要在实际上屈服于机会主义的社会产物。"
 rev_sway_events.5.a:0 "无产阶级革命仍将胜利！"

 rev_sway_events.6.t:0 "乡村民众拒绝了我们"
 rev_sway_events.6.d:0 "地主控制着绝大部分的土地，仅有一小部分属于农民业主。而贫穷的自耕农则一无所有，他们当中的很多人屈服于旧贵族和地主的淫威，不愿加入我们"
 rev_sway_events.6.f:0 "在一定的历史时期，农村居民中的小资产阶级阶层，即狭义的名副其实的农民，不能不是革命的。它现在的革命性，不可避免地从“旧秩序”的所有条件中产生出来，我们应当大力加以支持和发展。但是，一部分农村小资产者向“秩序”方面的转化，同样不可避免地会从新秩序即新的自由资本主义的国家的生活条件中产生出来。"
 rev_sway_events.6.a:0 "无产阶级革命仍将胜利！"

 rev_sway_events.7.t:0 "知识分子拒绝了我们"
 rev_sway_events.7.d:0 "资产者和资产阶级知识分子就是这样想，这样说，这样做的"
 rev_sway_events.7.f:0 "从一己私利的角度来看，他们的行为是可以理解的，因为农奴主－地主所豢养的食客和寄生虫，神父、录事、果戈里笔下的那类官吏、那些痛恨别林斯基的“知识分子”，对农奴制也是“恋恋”不舍的。可是剥削者及其知识分子奴仆的事业是毫无希望的事业。工人和农民正在粉碎他们的反抗（可惜还不够坚决、果断和无情），而且一定会粉碎他们的反抗。"
 rev_sway_events.7.a:0 "无产阶级革命仍将胜利！"

 rev_sway_events.8.t:0 "军队拒绝了我们"
 rev_sway_events.8.d:0 "将军们和资本家老爷们是一伙的，军队需要武器，而资本家、军火大王们就提供给他们武器，这已经完全形成了一个利益链条"
 rev_sway_events.8.f:0 "但我们仍然赢得了许多下层军官和士兵的支持"
 rev_sway_events.8.a:0 "无产阶级革命仍将胜利！"

 after_rev_events.1.t:0 "革命胜利了！"
 after_rev_events.1.d:0 "一个崭新的、无产阶级的社会主义共和国建立了！"
 after_rev_events.1.f:0 "现在最主要的任务之一，也许就是最主要的任务，是尽量广泛地发扬工人以及一切被剥削劳动者在创造性的组织工作中所表现的这种独创精神。无论如何要打破这样一种荒谬的、怪诞的、卑劣的陈腐偏见，似乎只有所谓“上层阶级”，只有富人或者受过富有阶级教育的人，才能管理国家，才能领导社会主义社会的组织建设。"
 after_rev_events.1.a:0 "万岁！"

 after_rev_events.2.t:0 "立刻废除落后的法律"
 after_rev_events.2.d:0 "社会主义共和国的基本原则"
 after_rev_events.2.f:0 "我们国家机关的情况，即使不令人厌恶，至少也非常可悲，因此我们必须首先认真考虑怎样来克服它的缺点，同时要记住，这些缺点根源于过去，过去的东西虽已被打翻，但还没有被消灭，没有退到早已成为陈迹的旧文化的阶段去。"
 after_rev_events.2.a:0 "砸烂旧制度"

 after_rev_events.3.t:0 "科技援助建设"
 after_rev_events.3.d:0 "铁路，集约农业，火帽..."
 after_rev_events.3.f:0 "援建科技"
 after_rev_events.3.a:0 "科技上绝对不能落后"

 after_rev_events.4.t:0 "工业化援助建设"
 after_rev_events.4.d:0 "化工厂，炼钢厂，煤矿..."
 after_rev_events.4.f:0 "援建工厂"
 after_rev_events.4.a:0 "尽可能快地建立好一个独立自主的工业体系"

 after_rev_events.5.t:0 "教育对口支援"
 after_rev_events.5.d:0 "再穷不能穷教育..."
 after_rev_events.5.f:0 "援建大中小学"
 after_rev_events.5.a:0 "尽可能快地建立好一个完备的教育体系"

 after_rev_events.6.t:0 "军事援助建设"
 after_rev_events.6.d:0 "步枪，大炮..."
 after_rev_events.6.f:0 "援建军事工业和科技"
 after_rev_events.6.a:0 "尽可能快地建立好一个能够保卫无产阶级政权的武装队伍"

 after_rev_events.7.t:0 "无产阶级专政"
 after_rev_events.7.d:0 "要把劳动从资本的压迫下解放出来，除了用无产阶级专政代替这种专政以外，没有别的道路可走。"
 after_rev_events.7.f:0 "只有无产阶级专政才能使人类摆脱资本的压迫，摆脱资产阶级民主即富人的民主的骗局、虚假和伪善，才能实行穷人的民主，使工人和贫农事实上享受到民主的好处，而现在绝大多数劳动者事实上是享受不到民主的好处的。只有用巴黎公社式的国家或苏维埃式的国家代替资产阶级的国家，才能为社会主义开辟道路。无产阶级专政一定会使人类摆脱资本的枷锁和战争。"
 after_rev_events.7.a:0 "[SCOPE.sCountry('PD_country').GetName]的劳动群众不仅善于打破一个旧世界，而且也善于建设一个新世界"

 156_projects_events.1.t:0 "156项重点工程建设第一期"
 156_projects_events.1.desc:0 "为帮助我们进行工业化建设，建起完备的工业经济体系，我们的社会主义兄弟国家给我们带来了这些重点援助项目"

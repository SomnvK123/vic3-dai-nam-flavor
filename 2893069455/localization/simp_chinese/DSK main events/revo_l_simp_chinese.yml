 je_sway_IG:0 "拉拢利益集团"
 je_sway_IG_reason:0 "如果要保证革命成功，就必须有足够的利益集团支持我们"
 je_sway_IG_goal:0 "为我们的革命积蓄起足够的力量"
 je_sway_TU:0 "拉拢工会"
 je_sway_TU_reason:0 "工人阶级是无产阶级的主要组成部分，在较为发达的资本主义国家当中，扮演着革命主力军的角色。工人阶级除了自己的劳动力以外一无所有，但他们能在旧世界的废墟上建立一个新世界。"
 je_sway_TU_goal:0 "在革命中争取到工会的支持"
 je_sway_RF:0 "拉拢乡村民众"
 je_sway_RF_reason:0 "农民在欠发达，工业化不够彻底的国家里，是最底层的群体。农民束缚于封建制度下，遭受着地主的经济剥削和政治压迫。但与此同时，他们也是人数最多的群体，争取到这个群体，就意味着我们争取到了大多数。"
 je_sway_RF_goal:0 "在革命中争取到乡村民众的支持"
 je_sway_IN:0 "拉拢知识分子"
 je_sway_IN_reason:0 "知识分子是最没有“无产阶级纯洁性”的团体，他们中的大多数人出身于资产阶级或者贵族，因而有机会受到良好的教育。但这也使他们有更多的机会去接触和理解先进的思想。他们当中的左翼一旦占据上风，将会给我们的事业带来莫大的帮助"
 je_sway_IN_goal:0 "在革命中争取到知识分子的支持"
 je_sway_AF:0 "拉拢军队"
 je_sway_AF_reason:0 "在现代的资产阶级共和国里，大多数士兵和那些靠着军功晋升的军官，大多数也属于无产阶级。掌握着国家暴力机器的军队若能为我们所用，将会给我们的革命事业的干柴添上一把烈火。"
 je_sway_AF_goal:0 "在革命中争取到军队的支持"

 decision_rev_triumphed:0 "革命胜利了！"
 decision_rev_triumphed_desc:0 "阶级斗争的最高形式——社会革命，引发的全国性内战已经结束了。趁着阶级敌人尚未喘过气来，我们要打破资产阶级法权，对各种反动阶级实行全面的专政。与此同时，我们也不要忘了进行社会主义工业化建设，不管是为了提升人民的生活水平，还是以一个更好的姿态走向世界舞台，这都是必要的。"

 decision_is_on_rev_kill_ruler:0 "谁来领导我们的革命？"
 decision_is_on_rev_kill_ruler_desc:0 "这个时候，我们需要一位总指挥，主心骨，掌舵者，定盘星。"


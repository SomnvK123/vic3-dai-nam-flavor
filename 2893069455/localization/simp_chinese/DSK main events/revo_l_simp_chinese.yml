 agitate_rev_events.1.t:0 "革命前夜"
 agitate_rev_events.1.d:0 "经过长时间的谨慎讨论，[SCOPE.GetRootScope.GetCountry.GetName]人民革命委员会认为是时候把革命的火种播向世界了"
 agitate_rev_events.1.f:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('are_1_ruler_scope').GetFullName] 代表党中央在中央工农兵代表大会扩大会议上宣读了委员会的意见：\n我们[SCOPE.GetRootScope.GetCountry.GetName]就像火车头，肩负着点燃革命之火的责任。在这个资本主义、修正主义甚至残留的君主主义横行霸道，压迫全世界无产阶级的时代里，我们有必要且有义务将一切害虫清扫出地球，让共产主义的光辉照亮世界的每一个角落！而共产主义列车的下一站就是[SCOPE.sCountry('rev_target_country').GetName]！"
 agitate_rev_events.1.a:0 "会议决定进行外部煽动"
 agitate_rev_events.1.b:0 "会议决定派遣煽动家发起政治运动"

 agitate_rev_events.2.t:0 "队伍出发"
 agitate_rev_events.2.d:0 "以 [SCOPE.sCharacter('are_1_ruler_scope').GetFullName] 为主席的[SCOPE.GetRootScope.GetCountry.GetName]继续革命委员会选举出了许多优秀的共产党员参与此次任务"
 agitate_rev_events.2.f:0 "一切就绪后，你们可以联络[SCOPE.sCountry('rev_target_country').GetName]的左翼党派以及进步人士，但要小心，他们的行动是被严密监视着的。\n[SCOPE.sCountry('rev_target_country').GetName]无产阶级的命运将会走向何方？只有你们才能回答这个问题，希望不久后能够从那里传来革命的消息。"
 agitate_rev_events.2.a:0 "祝你好运！"

 agitate_rev_events.3.t:0 "万众擎炬火"
 agitate_rev_events.3.d:0 "任何革命的最主要的问题都是国家政权问题。"
 agitate_rev_events.3.f:0 "直到今天，[SCOPE.sCountry('rev_target_country').GetName]的国家政权实际上还是在[SCOPE.gsInterestGroup('powerful_ig').GetName]手里，[SCOPE.gsInterestGroup('powerful_ig').GetName]只不过是迫不得已才作些个别的让步（想第二天就收回），才到处许下诺言（并不打算履行），才千方百计地掩饰自己的统治（用“真诚联合”作幌子来欺骗人民），如此等等。这就是至今还存在的矛盾，这就是政权极不稳固和摇摆不定的根源。"
 agitate_rev_events.3.a:0 "身敌海波澜"

 agitate_rev_events.4.t:0 "明日起事"
 agitate_rev_events.4.d:0 "不容怀疑，我们正站在世界无产阶级革命的前阶。"
 agitate_rev_events.4.f:0 "既然统治阶级的压迫正在使[SCOPE.sCountry('rev_target_country').GetName]人民遭受到空前未有的灾难，那么在[SCOPE.sCountry('rev_target_country').GetName]爆发各种各样的无产阶级运动，并且日益扩大，乃至爆发革命，这又有什么奇怪呢？\n    危机成熟了。[SCOPE.sCountry('rev_target_country').GetName]革命的整个前途已处在决定关头。党的全部荣誉正在受到考验。争取社会主义的国际工人革命的整个前途都在此一举。"
 agitate_rev_events.4.a:0 "危机成熟了"

 agitate_rev_events.5.t:0 "革命来临"
 agitate_rev_events.5.d:0 "要么是中央和地方的全部政权归于新生的[SCOPE.sCountry('rev_target_country').GetName]人民革命委员会；要么就是地主和资本家阻挠一切，然后被轰轰烈烈的革命所消灭。"
 agitate_rev_events.5.f:0 "这是最后的斗争，团结起来到明天。\n因特耐雄纳尔，就一定要实现！"
 agitate_rev_events.5.a:0 "没有任何的中间道路"


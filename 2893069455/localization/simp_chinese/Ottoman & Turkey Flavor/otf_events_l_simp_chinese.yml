l_simp_chinese:
 otto_egypt_events.1.t:0 "第二次奥斯曼—埃及战争"
 otto_egypt_events.1.d:0 "埃及帕夏拒绝交还他在中东和安纳托利亚占领的土地。"
 otto_egypt_events.1.f:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]想要收复丢失的地区。 西方国家在军事科技上帮助[ROOT.GetCountry.GetName]，故而[ROOT.GetCountry.GetName]向埃及发出了最后通牒，要求收回以前的领土。 埃及冒着战争的风险拒绝了。"
 otto_egypt_events.1.a:0 "是时候严惩叛乱的帕夏了。"
 otto_egypt_events.2.t:0 "埃及的命运"
 otto_egypt_events.2.d:0 "我们的属国埃及唯一能做的是恭迎[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。"
 otto_egypt_events.2.f:0 "埃及地区的边界将根据[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的决定重新绘制。 一些贵族认为[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]会因为这次叛乱而吞并埃及。"
 otto_egypt_events.2.a:0 "吞并埃及"
 otto_egypt_events.2.b:0 "夺取西奈就够了"
 otto_egypt_events.2.c:0 "让埃及继续存在"
 otto_egypt_events.2.dd:0 "目前保持现状"
 otto_egypt_events.3.t:0 "来自西方的科技支持"
 otto_egypt_events.3.dd:0 "西方国家在军事科技上支持我们以保障[ROOT.GetCountry.GetName]的存在。"
 otto_egypt_events.3.f:0 "埃及叛乱让西方国家颇为不安。 他们猜测第二次埃及战争可能导致[ROOT.GetCountry.GetName] 的毁灭和一个强大的中东国家的崛起。 希望西亚病夫继续活着的西方国家正在支持[ROOT.GetCountry.GetName]。"
 otto_egypt_events.3.a:0 "我们接受西方援助。"
 otf_events.1.t:0 "帝国失去的地区"
 otf_events.1.d:0 "我们的帝国开始从衰落中复苏。 我们的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]决定收复埃及，但在外交上犹豫不决。"
 otf_events.1.f:0 "西方国家觊觎我们。 他们打算占领理应属于我们的省份。 要么我们对他们采取严肃的态度并重新征服失去的省份，要么我们不得不坐以待毙。"
 otf_events.1.a:0 "立即征兵！ 我们将在没有任何国家干预的情况下收复埃及！"
 otf_events.1.b:0 "这个计划的后果可能是灾难性的"
 otf_events.2.t:0 "收复克里米亚"
 otf_events.2.d:0 "克里米亚再次被土耳其人夺回！"
 otf_events.2.f:0 "在收复克里米亚之后，该地区的鞑靼人热烈欢迎我们的士兵。 鞑靼人被俄罗斯人驱逐后，他们终于重归故土并崛起。"
 otf_events.2.a:0 "克里米亚鞑靼人万岁！"
 otf_events.3.t:0 "吞并巴尔干属国"
 otf_events.3.d:0 "为巴尔干地区的叛乱画上句号。"
 otf_events.3.f:0 "就像以前一样，我们的帝国现在统治着巴尔干半岛。"
 otf_events.3.a:0 "吞并他们"
 otf_events.4.t:0 "吞并北非属国"
 otf_events.4.d:0 "北非国家的命运再次与[ROOT.GetCountry.GetName]紧密相连。"
 otf_events.4.f:0 "就像以前一样，我们的帝国现在统治着北非。"
 otf_events.4.a:0 "吞并他们"
 otf_events.5.t:0 "突厥民族的统一"
 otf_events.5.d:0 "所有突厥民族团结在一个国家之中。"
 otf_events.5.f:0 "我们成功地建立了从中亚延伸到巴尔干半岛的大突厥文化。 所有的突厥民族现在都在一个国家内安全了。"
 otf_events.5.a:0 "突厥人民万岁"
 otf_events.6.t:0 ""
 otf_events.6.d:0 ""
 otf_events.6.f:0 ""
 otf_events.6.a:0 ""
 otf_events.7.t:0 "帝国的意识形态"
 otf_events.7.d:0 "[ROOT.GetCountry.GetName]出现了意识形态的两极分化。"
 otf_events.7.f:0 "青年土耳其党内部出现了政治分歧。 他们中的一些人支持泛突厥主义运动并反对君主制。 也有一些人支持伊斯兰运动和君主制。 另外一些人还支持奥斯曼主义运动，旨在保护帝国内的所有少数民族。"
 otf_events.7.a:0 "泛突厥主义将成为帝国的主导意识形态"
 otf_events.7.b:0 "伊斯兰主义将成为帝国的主导意识形态"
 otf_events.7.c:0 "奥斯曼主义将成为帝国的主导意识形态"
 otf_events.8.t:0 "汉志铁路"
 otf_events.8.d:0 "这个铁路项目旨在将朝圣者运送到圣地。"
 otf_events.8.f:0 "一项从大马士革延伸到麦加的长途铁路项目正在计划中，其费用将由帝国预算承担。"
 otf_events.8.a:0 "启动项目"
 otf_events.8.b:0 "只需要改善当地原有道路就行了"
 otf_events.9.t:0 "逊尼派伊斯兰教的捍卫者"
 otf_events.9.d:0 "穆斯林期待已久的时刻终于到来。 [ROOT.GetCountry.GetName]开始保护穆斯林免受外国异教徒的侵害。"
 otf_events.9.f:0 "西方帝国主义者正觊觎穆斯林的土地。 我们是唯一会睁大眼睛的人。 保护先知的乌玛是我们的荣幸。"
 otf_events.9.a:0 "宣称逊尼派伊斯兰教的捍卫者"
 otf_events.9.b:0 "我们不会处理的"
 otf_events.11.t:0 "吞并伊斯兰属国"
 otf_events.11.d:0 "另一个伊斯兰属国想与我们合邦。"
 otf_events.11.f:0 "受到我们保护的伊斯兰教属国希望加入我们以生活在更好的条件下。 官僚们正在等待我们的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]颁布法令来接纳他们。"
 otf_events.11.a:0 "吞并他们"
 otf_events.11.b:0 "我们其实并不需要这些领土。"
 otf_events.12.t:0 "现代化的军队"
 otf_events.12.d:0 "我们的伟大军队中再也没有反动思想了！ 大元帅前来宣誓进入国会。"
 otf_events.12.f:0 "这位伟大的元帅代表土耳其武装部队宣布，他解雇了军队中数千名支持君主制的军官，并宣誓效忠议会和人民。 他还表示，一些军官正在策划政变以恢复君主制，这些反动分子将在军事法庭受审。"
 otf_events.12.a:0 "土耳其武装部队万岁！"
 otf_events.13.t:0 "青年土耳其党的经济政策"
 otf_events.13.d:0 "青年土耳其党内部也存在冲突，一场旨在确定帝国经济政策的讨论开始了。"
 otf_events.13.f:0 "土耳其青年党的大多数人在欧洲接受过经济问题方面的教育，他们支持重工业化政策。 另一方面，反对派捍卫农业经济，因为帝国的土地适合农业。 一小群人建议采取更平衡的政策。"
 otf_events.13.a:0 "重工业化， 就像欧洲人一样"
 otf_events.13.b:0 "尽量平衡的工业化。 我们不能将我国经济完全委托给实业家。"
 otf_events.13.c:0 "农本主义经济，我们必须充分开发帝国的肥沃土地。"
 otf_events.14.t:0 "权威危机"
 otf_events.14.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的野蛮专制给帝国带来灾难，人民和利益集团因此越来越激进。"
 otf_events.14.f:0 "反威权主义在首都迅速蔓延。 虽然激进派中的大多数只想开放议会，但其它派系正在采取行动反对奥斯曼王朝。 激进组织终于冲进了[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的宫殿，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]和他的王朝的命运取决于他本人。"
 otf_events.14.a:0 "这个帝国是在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的权威下建立和崛起的。 我们必须尊重[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 的权威。"
 otf_events.14.b:0 "必须开放议会！ [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的权力必须受到限制！"
 otf_events.14.c:0 "革命！需要一场革命才能推翻奥斯曼王朝，建立土耳其共和国！"
 otf_events.15.t:0 "社会主义思想"
 otf_events.15.d:0 "青年土耳其党内部又爆发了冲突。 社会主义的诞生深深地影响了我们知识分子群体。"
 otf_events.15.f:0 "奥斯曼主义思想与一个王朝联系在一起。 就像每个王朝一样站在资产阶级一边。 大多数知识分子都想放弃奥斯曼主义的思想转而接受社会主义。"
 otf_events.15.a:0 "应该采纳社会主义思想"
 otf_events.15.b:0 "我们不需要西方思想。"
 otto_arm_res_events.1.t:0 "亚美尼亚抵抗运动开始"
 otto_arm_res_events.1.d:0 "亚美尼亚人聚集了强大的抵抗力量。 在他们的盟友俄罗斯人的支持下，抵抗运动在安纳托利亚东部开始。"
 otto_arm_res_events.1.f:0 "亚美尼亚人建立了自己的独立运动组织。 这个组织也得到了欧洲人的支持。 他们的目标是在安纳托利亚东部建立一个大亚美尼亚国家。 当地的土耳其人和库尔德人对此感到担忧。"
 otto_arm_res_events.1.a:0 "我们会解决这个问题"
 otto_arm_res_events.2.t:0 "当地亚美尼亚人叛乱！"
 otto_arm_res_events.2.d:0 "亚美尼亚组织的这次叛乱在当地引起了动荡。 叛乱分子叫嚣着要独立。"
 otto_arm_res_events.2.f:0 "这个组织的最终目标是建立一个独立的亚美尼亚国家并摆脱该地区的土耳其人和库尔德人。 库尔德和土耳其村民也拿起武器反对亚美尼亚人并爆发了冲突。 如果帝国不介入此事，麻烦会迅速蔓延。"
 otto_arm_res_events.2.a:0 "屠杀所有的叛乱分子并驱逐平民以示惩戒。"
 otto_arm_res_events.2.b:0 "杀死叛乱分子，只驱逐叛军俘虏"
 otto_arm_res_events.2.c:0 "用和平手段阻止叛乱"
 otto_arm_res_events.2.dd:0 "不要干涉"
 otto_arm_res_events.3.t:0 "欧洲的亚美尼亚侨民"
 otto_arm_res_events.3.d:0 "欧洲的亚美尼亚团体参加了一次外交会议，该团体就我们帝国统治下的亚美尼亚人的权利发表了演讲。"
 otto_arm_res_events.3.f:0 "他们要求颁布法律，为 [ROOT.GetCountry.GetName]的亚美尼亚公民提供保障。 因此，他们表示可以用更和平的方式解决亚美尼亚抵抗运动。"
 otto_arm_res_events.3.a:0 "我们的伟大帝国不必满足少数亚美尼亚人的要求！"
 otto_arm_res_events.3.b:0 "他们是对的，亚美尼亚人也是帝国的一部分"
 otto_arm_res_events.4.t:0 "当地总督被刺杀"
 otto_arm_res_events.4.d:0 "坏消息！ 一名亚美尼亚刺客暗杀了当地总督， 这次暗杀再次鼓舞了亚美尼亚人。"
 otto_arm_res_events.4.f:0 "刺杀发生后，凶手立即被安全部队抓获。 凶手试图通过高喊“大亚美尼亚万岁”来鼓励亚美尼亚人民。 凶手被带到广场处决。 亚美尼亚民众抗议这次处决，但凶手却在民众面前被12名土耳其士兵击毙。 一群想要阻止行刑的人与凶手同时被处决。"
 otto_arm_res_events.4.a:0 "这次暗杀是亚美尼亚人的错。 他们会为此付出代价！"
 otto_arm_res_events.4.b:0 "这次暗杀与亚美尼亚人民无关。一个杀人犯不能代表整个民族！"
 otto_arm_res_events.5.t:0 "哈密迪耶军团"
 otto_arm_res_events.5.d:0 "亚美尼亚人的抵抗与日俱增。 我们现有的力量不足以镇压他们。 我们的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]决定，将在该地区建立一支地方军队。"
 otto_arm_res_events.5.f:0 "这些骑兵部队主要由库尔德人组成，足以粉碎亚美尼亚帮派组织的抵抗行动，让此地的逊尼派库尔德人崛起。"
 otto_arm_res_events.5.a:0 "建立哈密迪耶军团"
 otto_arm_res_events.5.b:0 "我们将以更和平的方式消灭抵抗。"
 otto_arm_res_events.6.t:0 "库尔德—亚美尼亚冲突"
 otto_arm_res_events.6.d:0 "从东方传来关于一次冲突的消息，库尔德人和亚美尼亚部落之间的关乎土地的争端导致了流血事件。"
 otto_arm_res_events.6.f:0 "一场小冲突最终演变成一场大规模流血冲突。 库尔德人在当地总督的支持下夺取了土地，但亚美尼亚人对此不同意并袭击了库尔德人。 这场冲突开始让该地区的激进分子越来越多。"
 otto_arm_res_events.6.a:0 "我们必须站在库尔德人一边。 亚美尼亚人的目的是分裂这个帝国"
 otto_arm_res_events.6.b:0 "我们必须站在亚美尼亚人一边。 库尔德人偷奸耍滑与总督达成了协议"
 otto_arm_res_events.6.c:0 "此事与我们无关"
 otto_arm_res_events.7.t:0 ""
 otto_arm_res_events.7.d:0 ""
 otto_arm_res_events.7.f:0 ""
 otto_arm_res_events.7.a:0 ""
 otto_arm_res_events.8.t:0 "完成反亚美尼亚政策"
 otto_arm_res_events.8.d:0 "亚美尼亚人遭受了重创。 数以千计的亚美尼亚人被驱逐出自己土地，承受着巨大的痛苦。 亚美尼亚抵抗运动现已结束。"
 otto_arm_res_events.8.f:0 "由于东安纳托利亚的亚美尼亚人在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的诏书下的叛乱和敌对行动，亚美尼亚人被从此地驱逐。大多数亚美尼亚人开始迁往中东。任何反对的人都被杀害。一些热爱自己土地的亚美尼亚人采用土耳其或库尔德文化，并皈依逊尼派。"
 otto_arm_res_events.8.a:0 "活该。没有民族能够摧毁我们的帝国！"
 otto_arm_res_events.9.t:0 "成功整合亚美尼亚人"
 otto_arm_res_events.9.d:0 "预料之中的消息来了， 亚美尼亚抵抗组织的领导人来到首都并宣誓效忠[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。"
 otto_arm_res_events.9.f:0 "在与[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]会面后，亚美尼亚领导人返回祖国并向人民发表讲话。 [ROOT.GetCountry.GetName]表示不会威胁亚美尼亚人，并表示所有亚美尼亚抵抗组织都应该结束与俄罗斯人勾结。 作为回报，他声明[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]将制定针对亚美尼亚人的少数民族法律。"
 otto_arm_res_events.9.a:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]万岁！"
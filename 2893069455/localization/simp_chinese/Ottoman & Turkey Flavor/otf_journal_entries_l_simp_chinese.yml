l_simp_chinese:
 otf_anti_armenian_policy_je:0 "反亚美尼亚政策"
 otf_anti_armenian_policy_je_reason:0 "亚美尼亚人的分离主义运动正在当地引起动荡， 我们必须镇压他们。"
 otf_anti_armenian_policy_je_goal:0 "完成20分的反亚美尼亚政策"
 otf_armenian_integration_je:0 "整合亚美尼亚"
 otf_armenian_integration_je_reason:0 "无论亚美尼亚人多么想分离，我们都会将他们融入自己的国家。"
 otf_armenian_integration_je_goal:0 "完成20分的整合亚美尼亚政策"
 otf_born_of_jon_turks:0 "青年土耳其党的诞生"
 otf_born_of_jon_turks_reason:0 "在 [ROOT.GetCountry.GetName] 的衰落时期，一场西化运动开始了。 一群知识分子在 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 的支持下，在欧洲学习然后返回祖国。 这群自称为JönTurks（青年土耳其党）的人接受了西方的官僚、社会和经济等方面的教育，现在他们希望改革自己的国家。"
 otf_reduce_the_sultans_rights_je:0 "限制苏丹权力"
 otf_reduce_the_sultans_rights_je_reason:0 "是[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的错误导致了帝国的种种灾难。 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]永远不应凌驾于法律之上。 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]和他的王朝应该对我们的人民负责。 唯一有权监督的机构是Meclis-i Mebusan（众议院）。"
 otf_ban_slavery_je:0 "废除奴隶制"
 otf_ban_slavery_je_reason:0 "为了建设一个现代社会，必须废除奴隶制。"
 otf_educate_people_je:0 "教育我们的人民"
 otf_educate_people_je_reason:0 "高素质的人民对帝国的生存至关重要。 通过推广教育，我们能够建成最发达的社会。"
 otf_improve_public_service_je:0 "改善公共服务"
 otf_improve_public_service_je_reason:0 "国家是一栋房子，人民是生活在其中的大家庭。 如果你改善你的房子，你会受到家人的喜爱，也能扩大你的家庭。"
 otf_women_and_children_je:0 "妇女和儿童的权利"
 otf_women_and_children_je_reason:0 "一个女性被视为二等人、儿童被视为工人的社会将永远落后。 我们将为全人类树立榜样，保护这两个群体的权利。"
 otf_strong_market_je:0 "扩大市场"
 otf_strong_market_je_reason:0 "我们的帝国已经度过了糟糕的日子。 通过建立强大的经济，我们将无所不能。"
 otf_black_gold_je:0 "黑色黄金"
 otf_black_gold_je_reason:0 "毫无疑问，石油是最有价值的资源，但也可能导致帝国分裂和部落崩溃。 只要我们在世界范围内掌控这种黑色黄金，就没有人能与我们抗衡。"
 otf_western_diplomacy_je:0 "西式外交"
 otf_western_diplomacy_je_reason:0 "西方国家对我们没有好意，但如果我们在西方国家之间建立平衡外交政策，我们就可以减少他们对我们的恶意。"
 otf_improve_army_equipment_je:0 "升级军事装备"
 otf_improve_army_equipment_je_reason:0 "我们帝国的士兵不需要原始装备。 我们将通过装备现代化来加强我们的军队。"
 otf_legislate_kanuni_esasi_je:0 "制定基本法"
 otf_legislate_kanuni_esasi_je_reason:0 "基本法是 [ROOT.GetCountry.GetName]的奥斯曼主义意识形态最早采用的法律之一。 这部法律的基础是保护少数民族和不同宗教信仰的公民的权利。"
 otf_peoples_empire_je:0 "人民的帝国"
 otf_peoples_empire_je_reason:0 "在我们的帝国，每个公民都应该受到平等地对待。 只要我们平等地保护他们的权利，我们就可以让帝国存活下来……"
 otf_reconquer_hijaz_je:0 "收复汉志"
 otf_reconquer_hijaz_je_reason:0 "汉志，这片土地被每个穆斯林视为神圣之所在，我们不幸在埃及危机中失去了它。 我们必须夺回这些圣地，确保安全。"
 otf_claim_defender_of_sunni_islam_je:0 "宣称逊尼派伊斯兰教的捍卫者"
 otf_claim_defender_of_sunni_islam_je_reason:0 "伊斯兰世界正处于西方基督教国家的占领之下。 所有穆斯林都在寻找救星。 我们需要成为一个强大的帝国，以保护我们全能的信仰和穆斯林免受异教徒的侵害。"
 otf_azerbaijan_je:0 "收复阿塞拜疆"
 otf_azerbaijan_je_reason:0 "阿塞拜疆人与我们之间有着超越兄弟情义的感情。 实现图兰理想的第一步是将阿塞拜疆人置于我们的控制之下。"
 otf_central_asia_je:0 "征服中亚"
 otf_central_asia_je_reason:0 "我们必须将突厥民族统一在一个帝国之下。"
 otf_modernize_army_pan_turkic_je:0 "军队现代化"
 otf_modernize_army_pan_turkic_je_reason:0 "我们的军队还保留着君主制等反动思想。 我们必须清除一切反动军官，建立一支与土耳其民族相称的军队。"
 otf_pre_otto_egypt_war_je:0 "1839年第二次奥斯曼-埃及战争"
 otf_pre_otto_egypt_war_je_goal:0 "如果我们在3年内没有与埃及进行任何外交博弈，该[concept_journal_entry]就会完成。"
 otf_pre_otto_egypt_war_je_reason:0 "我们的中东和安纳托利亚领土在短时间内被穆罕默德·阿里帕夏占领。 目前他打算继续占领帝国的其他领土。 西方国家也对这次叛乱感到不安。 我们必须于3年内在军事上改革帝国并夺回我们的领土。\n\n#red 如果我们在1839-1841年期间与埃及的战争中，战争支持度低于-70而埃及的战争支持度大于等于0，这很可能会引发我们国家的崩溃！！"
 otf_reconquest_egpyt_je:0 "收复埃及"
 otf_reconquest_egpyt_je_reason:0 "埃及是我们帝国最重要的地区之一。 尽管埃及以前出现过许多逆贼，但从未发生过这么大的叛乱。 我们必须重新征服曾经属于我们帝国的地区。"
 otf_north_africa_je:0 "征服北非"
 otf_north_africa_je_reason:0 "我们必须夺回这些受到法国人和西班牙人威胁的土地。"
 otf_balkans_je:0 "征服巴尔干半岛"
 otf_balkans_je_reason:0 "巴尔干半岛过去是我们帝国的一部分。 我们必须镇压巴尔干地区的分离主义运动，让他们重新回归帝国。"
 otf_crimea_je:0 "征服克里米亚"
 otf_crimea_je_reason:0 "克里米亚曾经是[ROOT.GetCountry.GetName]的一部分。在被俄国人占领后，克里米亚鞑靼人陷入了可怕的境地。我们必须让那些被迫流亡的克里米亚鞑靼人重归故土。"
turkic:0 "突厥"
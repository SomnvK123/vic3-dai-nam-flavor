 denmark_flavor.7.t:0 "石勒苏益格-荷尔斯泰因起义"
 denmark_flavor.7.d:0 "看来石勒苏益格-荷尔斯泰因以破坏丹麦统治的名义采取行动，扰乱了我们在石勒苏益格-荷尔斯泰因的统治秩序并谋划动员军队反对我们。很明显我们将取得胜利，除非某个大国会来干预……"
 denmark_flavor.7.f:0 "“我们不能忍受臣属的这种行为！荒谬至极！”"
 denmark_flavor.7.a:0 "我们会尽快解决这个问题"
 denmark_flavor.8.t:0 "石勒苏益格-荷尔斯泰因战争的胜利"
 denmark_flavor.8.d:0 "我们在石勒苏益格-荷尔斯泰因战争中取得了胜利，强制我们的敌人履行条约。"
 denmark_flavor.8.f:0 "“我们将世世代代统治石勒苏益格-荷尔斯泰因!”"
 denmark_flavor.8.a:0 "石勒苏益格-荷尔斯泰因的胜利！"
 denmark_flavor.9.t:0 "石勒苏益格-荷尔斯泰因战争的失败"
 denmark_flavor.9.d:0 "我们未能在石勒苏益格-荷尔斯泰因战争中实现我们的目标，似乎我们的希望和雄心已经落空……不过这只是暂时..."
 denmark_flavor.9.f:0 "“战争有时是一种毫无意义的努力，但有时却是唯一值得追求的。”"
 denmark_flavor.9.a:0 "下次我们会得到它们"
 peoples_springtime_den.1.t:0 "缓慢传播"
 peoples_springtime_den.1.d:0 "随着人民变得越来越激进，丹麦国内有许多人希望政府修改宪法并引入民主制度。"
 peoples_springtime_den.1.f:0 ""投票权就是影响你生活方式的权利，我们不能生活在一个由一个人管理的国家里！\"\n\n\"需要有一只指导性的手，我们不能随便放弃传统！\""
 peoples_springtime_den.1.a:0 "我们以前不需要它，那么为什么现在需要呢？"
 peoples_springtime_den.1.b:0 "让我们做些让步吧"

 scandinavia_monetary_union:0 "斯堪的纳维亚货币联盟"
 scandinavia_monetary_union_reason:0 "统一货币是巩固北欧经济共同体的重要举措，有助于消除与我们挪威、瑞典的汇率波动风险。曾经古老的#yellow 汉萨同盟#!和#yellow 卡尔马联盟#!能做到货币统一，当今的我们也能做到。"
 scandinavia_monetary_union_swe:0 "斯堪的纳维亚货币联盟"
 scandinavia_monetary_union_swe_reason:0 "统一货币是巩固北欧经济共同体的重要举措，能帮助我们工业资本实现快速扩张。此外，这也是加强我们北欧兄弟之间的桥梁。"
 scandinavia_monetary_union_nor:0 "加入斯堪的纳维亚货币联盟"
 scandinavia_monetary_union_nor_reason:0 "#yellow 丹麦#!和#yellow 瑞典#!都实现了货币统一，尽管他们曾经把我们当奴仆，但继续纠结历史问题毫无意义。北欧兄弟应当加强团结，共同抵御外国资本的侵略。"
 scandinavian_monetary_union_mod:0 "斯堪的纳维亚货币联盟"
scandinavian_monetary_union_mod_reason:0 "统一货币是巩固北欧经济共同体的重要举措，能帮助我们工业资本实现快速扩张。此外，这也是加强我们北欧兄弟之间的桥梁。"
je_form_scandinavia: "统一斯堪的纳维亚"
je_form_scandinavia_reason: "我们已经分裂太久，是时候彻底统一斯堪的纳维亚了。"
has_formed_sca: "建立#yellow 斯堪的纳维亚#!"


 denmark_return_of_danish_dominance:0 "丹麦主导地位的回归"
 denmark_return_of_danish_dominance_reason:0 "多年来，荷尔斯泰因的人们一直在避免融入丹麦社会。而且由于观念上的差异，他们甚至反对我们的一些新政策。"
 has_no_control_over_holstein_or_scania:0 "完全失去对石勒苏益格-荷尔斯泰因和斯堪尼亚的控制。"
 je_springtime_of_the_peoples_den:0 "丹麦的人民之春"
 je_springtime_of_the_peoples_den_reason:1 "自由主义革命的呼声正在丹麦蔓延。"
 swedish_the_rise_of_lantmanna_partiet:0 "土地政治的兴起"
 swedish_the_rise_of_lantmanna_partiet_goal:0 "土地政治的兴起已经有3年时间了。"
 swedish_the_rise_of_lantmanna_partiet_reason:0 "传统的#yellow 村落共有制度#!在我们国家越来越不合时宜，不仅使得土地分散、难以集体管理，而且生产效率十分低下。#yellow 农民#!的土地使用权不稳定，难以进行技术改良。随着最近政治上从绝对主义的转变，许多#yellow 瑞典农民#!开始组织起来，希望可以让他们的政治呼声传达出来，实现整合分散的土地，以及土地私有化的愿望。\n\n#green 非边缘的乡村群众集团会加快土地政治的兴起#!"
 swedish_champions_of_national_defence:0 "国防问题"
 swedish_champions_of_national_defence_reason:0 "#yellow 瑞典军队#!糟糕的现状已经对我们的国际地位产生了很大的负面影响，其它国家纷纷嘲笑我们还带着传统的#yellow 三角帽#!士兵。当我们的邻国用蒸汽机铸造#yellow 铁甲舰#!、用#yellow 后膛炮#!武装百万陆军时，瑞典的军队却仍在用#yellow 古斯塔夫·阿道夫#!时代的荣耀麻醉自己。我们不能丢弃了#yellow 古斯塔夫二世#!的革新精神，如果他若活在今日，定会亲手拆了这些锈蚀的旧炮，废掉腐朽的征召农兵制度。#yellow 战争是数学家与铁匠的博弈#!，我们必须尽快进行必要的军事改革。"
 swedish_the_trade_problems:0 "贸易讨论"
 swedish_the_trade_problems_reason:0 "随着港口装卸一批批外国的货物，#yellow 乡村民众#!和#yellow 自由市场支持者#!为瑞典贸易的未来争辩更加激烈。\n\n#yellow 乡村民众#!认为，外国廉价粮食涌入后，地租会暴跌，地主会强行收回土地改种牧草，到那时百万农民要么饿死，要么像乞丐般涌向工厂。\n\n#yellow 自由市场支持者#!认为，保护性关税会让他们的工厂被迫高价购买外国机械，而出口木材和铁矿时容易反遭他国报复性征税，这将严重阻碍瑞典的工业化进程。"
 swedish_the_end_of_lantmanna_party:0 "土地政治的终结"
 swedish_the_end_of_lantmanna_party_reason:0 "一些#yellow 自由派#!受到欧洲启蒙思想的影响，主张土地私有制和市场化。随着#yellow 农民阶层#!的政治力量崛起，自由派有了更强的政治盟友，我们必须开始重视土地改革问题。只有成功实现土地政治改革，才能确保土地政治在现代政治中的作用越来越小。"
 swedish_restoration_of_the_military:0 "重现军事荣光"
 swedish_restoration_of_the_military_reason:0 "自从失去芬兰以来，#yellow 瑞典军队#!便一直处在低谷。尽管改革在进行，腐败在清除，但显然，我们军队问题本质是士气低落和装备落后。长期的战败，#yellow 涅瓦河口#!、#yellow 芬兰#!、#yellow 波美拉尼亚#!、#yellow 奥兰群岛#!的接连丢失，已经使得士兵失去了获胜的信心，谈及东方的巨熊便面露惧色。如今我们需要做点什么，才能改变这种糟糕的现状。要么我们以先王#yellow 古斯塔夫#!的革新勇气重塑军队，要么就等着后世在亡国史书上写道：瑞典人终于把#yellow 北方雄狮#!驯化成了#yellow 博物馆里的标本#!！！"
 nor_the_great_transformation:0 "伟大变革"
 nor_the_great_transformation_reason:0 "挪威已经在工业化的道路上迈出了第一步。接下来便是继续保持自身的独立性，成为西方世界的一支强有力的竞争力量。"
 nor_the_merchant_navy:0 "挪威商船队"
 nor_the_merchant_navy_reason:0 "虽然挪威商船队的建设已经初露锋芒，但想将其建设成一支足以在世界舞台发声的船队。首当其冲的还是数量，唯有足够数量的舰船，才足以与世界其他国家的同行进行竞争。"
 finland_fennoman_movement:0 "语言纷争"
 finland_fennoman_movement_goal:0 "语言纷争已经持续20年没有受到瑞典老牌精英的破坏。"
 finland_fennoman_movement_reason:0 "在芬兰，有一种民族觉醒，它来自于讲瑞典语的上层阶级，他们选择推广芬兰文化和语言。这些芬兰瑞典人被称为芬诺曼人，而我们对此持有反对意见......"
 has_made_too_many_concessions_to_swedes:0 "对瑞典老牌精英做出了太多的让步"
 the_norway_formannskapsdistrikt:0 "地方自治区的基础"
 the_norway_formannskapsdistrikt_desc:0 "挪威议会已准备批准一项法案，该法案将建立一个新的市镇系统，并将挪威教会的教区重组为行政区域。这项工作一旦完成，将创建396个地方自治区。"

nor_restablishment_of_new_aristocracy: "贵族复辟"
nor_restablishment_of_new_aristocracy_desc: "地主的影响力正在强势回归，随之而来的是恢复挪威贵族头衔的提议。"


 formally_end_slavery_in_nordic_country:0 "正式废止奴隶制"
 formally_end_slavery_in_nordic_country_desc:0 "虽然国家已经明面上谴责奴隶制，并且已经结束了我们在奴隶贸易中扮演的角色，但我们还没有正式解放奴隶。我们需要立即改变这种状况。"
 promote_finnish_as_primary_language_in_official_affairs:0 "将官方语言更改为芬兰语"
 promote_finnish_as_primary_language_in_official_affairs_desc:0 "由于在行政和学术领域使用瑞典语，但人民正在为身份而斗争，现在是时候把行政语言改为芬兰语了！"
 promote_finnish_as_primary_language_in_official_affairs_in_finland:0 "改变芬兰的官方语言"
 promote_finnish_as_primary_language_in_official_affairs_in_finland_desc:0 "由于在行政和学术领域使用瑞典语，但人民正在为身份而斗争，我们有责任减轻他们的职责。"

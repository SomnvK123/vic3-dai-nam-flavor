swedish_glasriket: "玻璃王国"
swedish_glasriket_reason: "将斯莫兰的独特玻璃制造传统发展为一个繁荣的工业与艺术中心，吸引国内外市场。"
swedish_sundsvall_timber: "森德斯瓦尔：木材之都"
swedish_sundsvall_timber_reason: "森德斯瓦尔的锯木厂正在前所未有的规模运作，巩固了其作为瑞典木材工业蓬勃发展的心脏以及全球出口中心的地位。"
swedish_retake_finland: "夺回芬兰"
swedish_retake_finland_reason: "自#yellow 芬兰#!从我们的统治中被残忍割离已有一个多世纪，#r 东方熊#!的暴政在芬兰人民心中留下了深深的伤痕。然而，变革的风正在吹动。借助新获得的力量与巧妙手段，我们现在或许能够重新夺回属于我们的领土，解救我们的苦难兄弟。"
swedish_abolish_estates: "废除旧秩序"
swedish_abolish_estates_reason: "面对过时的贵族议会制度，我们将迎来一个现代化、具有代表性的议会体系，真正反映所有公民的意愿。"
swedish_timber_export: "绿色黄金出口"
swedish_timber_export_reason: "我们的丰富森林资源是宝贵财富，但单纯出口原木可能并非最盈利的道路。我们必须仔细思考如何最有效地利用这一国家资源。"
swedish_stockholm_urban_growth: "大都市雄心：斯德哥尔摩"
swedish_stockholm_urban_growth_reason: "我们的首都#yellow 斯德哥尔摩#!正在经历一场戏剧性的转变，从历史悠久的城市发展为繁忙的现代化大都市，伴随着许多挑战与机遇。"
swedish_malmo_industrial_boom: "大都市雄心：马尔默"
swedish_malmo_industrial_boom_reason: "#yellow 马尔默#!，位于通往欧洲的大门口，正准备迎来一段快速工业化的时期，由其港口和铁路连接为动力。我们必须抓住其潜力。"
swedish_mortala_verkstad: "莫塔拉工厂"
swedish_mortala_verkstad_reason: "借助哥达运河的历史遗产，我们将把#yellow 莫塔拉工厂#!打造成瑞典工业的皇冠明珠。"
swedish_iron_industry: "铁之心觉醒"
swedish_iron_industry_reason: "#yellow 伯格斯拉根#!，瑞典古老的矿区与新发现的#yellow 马尔贝尔特#!，掌握着我们工业未来的关键。对这些矿业运营进行现代化改造，对于满足日益增长的金属需求至关重要。"
swedish_folkhemmet: "人民之家"
swedish_folkhemmet_reason: "瑞典人民心中正在酝酿一个雄心壮志的项目：建设一个社会公平、繁荣的社会，确保每个公民从出生到死亡都能享有福利与保障。#yellow 为人民打造的家园#!"
swedish_gothenburg_port_expansion: "大都市雄心：哥德堡"
swedish_gothenburg_port_expansion_reason: "随着工业化进程的推进和移民潮的涌动，#yellow 哥德堡#!作为瑞典西部主要港口的角色变得愈发重要。扩展其港口容量对我们的贸易与全球联系至关重要。"
swedish_reklam_the_eastern_land: "夺回东部领土"
swedish_reklam_the_eastern_land_reason: "我们的东部领土曾在#yellow 纽斯塔德条约#!中被割让。虽然一直以来这一目标是我们长久以来的愿望，但如今，在我们#yellow 芬兰胜利#!之后，#r 俄罗斯#!已变得虚弱。这为我们提供了一个独特的机会窗口，可能重新夺回这些土地，我们应考虑果断行动。"
swedish_snilleindustri: "天才工业的曙光"
swedish_snilleindustri_reason: "#yellow 瑞典#!正在见证一场创新的爆发，杰出的#yellow 工程师和企业家#!精神正在打造一波新的专门化、高科技产业。从单纯的原材料开采，到精密制造、前沿技术的突破，我们有望在全球舞台上树立瑞典无与伦比的创新声誉。"
snilleindustri_mortala_complete: "#yellow 莫塔拉工厂#! 完成"

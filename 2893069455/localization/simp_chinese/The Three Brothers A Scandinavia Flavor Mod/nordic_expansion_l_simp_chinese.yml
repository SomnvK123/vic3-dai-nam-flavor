 scandinavia_flavor.1.t:0 "斯堪的纳维亚货币联盟"
 scandinavia_flavor.1.d:0 "斯堪的纳维亚货币联盟的建立，基于金本位的共同货币单位，向北欧提供了固定的汇率和货币方面的稳定性。"
 scandinavia_flavor.1.f:0 "“斯堪的纳维亚人在经济上合作是正确的前进方向，这将为我们的家园带来繁荣！”"
 scandinavia_flavor.1.a:0 "将再次伟大"
 scandinavia_flavor.2.t:0 "泛民族主义的诞生"
 scandinavia_flavor.2.d:0 "近年来，越来越多的大学生开始发起“斯堪的纳维亚统一”运动。此运动以斯堪的纳维亚国家的共同遗产为基础，试图将斯堪的纳维亚作为一个统一的地区或一个统一的国家。我们现在必须采取一种立场以应对这个运动，同样还要思考“斯堪的纳维亚”意味着什么。"
 scandinavia_flavor.2.f:0 "“三兄弟的团结将是强大和繁荣的基础，我们彼此之间有足够的共同点，兄弟阋墙则是最不明智的选择！”\n\n“这场运动将会抹去我们的独特性！”"
 scandinavia_flavor.2.a:0 "这些想法是危险的"
 scandinavia_flavor.2.b:0 "这些想法似乎很有趣"

scandinavia_flavor.3.t: "泛斯堪的纳维亚主义的初起"
scandinavia_flavor.3.d: "随着民族主义的崛起，一种新的运动应运而生：泛斯堪的纳维亚主义运动。"
scandinavia_flavor.3.f: "一群日益壮大的作家、学者和改革者呼吁斯堪的纳维亚国家之间建立更紧密的联系。基于共同的遗产和相互利益，他们谈论着一个未来，北方将团结一致，或许有一天，成为一个统一的国家。尽管这一运动仍处于起步阶段，但它标志着该地区新政治趋势的开始。"
scandinavia_flavor.3.a: "也许其中有些道理……"
scandinavia_flavor.3.b: "这些想法太危险了。"

scandinavia_flavor.4.t: "过去的一个想法……"
scandinavia_flavor.4.d: "最终，泛斯堪的纳维亚主义的思想失去了动力，变得不再重要。"
scandinavia_flavor.4.f: "\"我们是独立的国家，各自拥有独特的差异和文化；我们不能为了一个不现实的斯堪的纳维亚国家的愿景而牺牲这一点。\""
scandinavia_flavor.4.a: "我很高兴它结束了。"

scandinavia_flavor.5.t: "一个统一的斯堪的纳维亚"
scandinavia_flavor.5.d: "经过数十年的冲突，统一斯堪的纳维亚的梦想终于得以实现。"
scandinavia_flavor.5.f: "一个新国家诞生了，从挪威的峡湾到丹麦的平原，再到瑞典的森林，现在一切都统一在一个旗帜下。我们的国家仍然年轻，需要引导。如果我们希望成功，必须从现在开始共同致力于国家的进步。"
scandinavia_flavor.5.a: "是时候让我们的人民融入国家了"
scandinavia_flavor.5.b: "我们必须迅速扩展我们的力量基础！"
scandinavia_flavor.5.c: "强大的经济意味着强大的国家。"

scandinavia_flavor.6.t: "隆德会议：团结的温床"
scandinavia_flavor.6.d: "在#yellow 隆德#! 这片充满活力的知识中心，一种新型的集会变得越来越常见：来自#yellow 瑞典和丹麦#! 的作家和学生们的非正式聚会。由于#light_green 斯卡尼亚#! 与#yellow 丹麦#! 地理上的紧密联系，这些讨论自然向#yellow 泛斯堪的纳维亚主义#! 的概念倾斜，探索共享的文化遗产。这些集会正在成为这种思想的沃土，吸引了许多充满激情的年轻人。"
scandinavia_flavor.6.f: "在隆德的咖啡馆和讲堂中，热烈的辩论回荡，梦想着一个更强大的统一北方，愿景充满了文字和年轻的理想主义。"
scandinavia_flavor.6.a: "让这些想法自由发展。"
scandinavia_flavor.6.b: "打断这些泛斯堪的纳维亚主义会议。"

scandinavia_flavor.7.t: "哥本哈根的响亮呼声"
scandinavia_flavor.7.d: "始于#yellow 隆德#! 的知识讨论深深地在厄尔松湾两岸引起了共鸣。最近，一群来自#yellow 隆德#! 的学生访问#yellow 哥本哈根#!，他们被#yellow Fr. Barfod#! 的激情演讲深深吸引。他激昂的演讲提倡北欧土地的团结与自由。"
scandinavia_flavor.7.f: "在大厅里传来的欢呼声传递着强烈的信息：统一的北方的梦想正在新一代人心中找到了声音。"
scandinavia_flavor.7.a: "庆祝这种北欧团结的展示！"
scandinavia_flavor.7.b: "试图审查Fr. Barfod"

scandinavia_flavor.8.t: "泛斯堪的纳维亚主义的朝圣之旅"
scandinavia_flavor.8.d: "来自#yellow 哥本哈根#! 和#yellow 隆德#! 的学生们组成的队伍，开始了前往#yellow 乌普萨拉#! 的象征性旅程。它们的到来受到了广泛的热烈欢迎，多个演讲被发表。这场高度可见的示威，真的是一场#yellow '泛斯堪的纳维亚主义朝圣'#!，标志着该运动不再局限于学术场所，正在开始吸引公众的关注。"
scandinavia_flavor.8.f: "道路上回响着学生们的脚步声，他们高声呼喊着团结的口号，将新斯堪的纳维亚的梦想从城市带到古老的大学。"
scandinavia_flavor.8.a: "拥抱这种公共团结展示！"
scandinavia_flavor.8.b: "谴责这种类型的活动"

scandinavia_flavor.9.t: "王室的同情"
scandinavia_flavor.9.d: "来自我们的大学和公共示威活动中传出的#yellow 泛斯堪的纳维亚主义#! 的热烈表达，已经引起了社会最高层的注意。#yellow 王室#! 自运动开始以来一直对这一运动持怀疑态度，谨慎观察。然而，来自#yellow 斯德哥尔摩#! 和#yellow 哥本哈根#! 王宫的耳语暗示着一种日益增长的兴趣，尽管还是很初步。两国王室中的某些成员，也许是被理想主义吸引，或认识到增加地区影响力的潜力，已表示对一个更强大、更加团结的北方表示同情。他们公开的支持可能为该运动带来巨大的合法性和动力，但也可能将王冠卷入复杂的#yellow 泛民族主义#! 政治中。"
scandinavia_flavor.9.f: "宫殿中金碧辉煌的大厅现在回荡着北欧统一的微弱而充满希望的旋律，这是君主和政治家共同哼唱的曲调。"
scandinavia_flavor.9.a: "与王宫建立联系。"
scandinavia_flavor.9.b: "我们不应干涉王室事务。"


 sweden_flavor.1.t:0 "军事改革"
 sweden_flavor.1.d:0 "近年来，#yellow 瑞典军队#!的军事力量衰退引起了自由主义者们的目光。在他们的行动下，一种全新的军队形式被建设了出来，而旧的体系则面临着淘汰。但随着讨论的深入，人们开始对改革有了回转的想法。"
 sweden_flavor.1.f:0 "“我们的新改革是为了改善瑞典和军队的状况。”\n\n“这些新的改革正在从人民手中窃取财富，以资助我们不想要的战争！”"
 sweden_flavor.1.a:0 "我们必须做出牺牲。"
 sweden_flavor.1.b:0 "谁在乎反动派？"
 sweden_flavor.2.t:0 "农业党"
 sweden_flavor.2.d:0 "随着两院制被引入瑞典，农业党正式成立。这是一个致力于提高农民生活水平、保护农业的政党。"
 sweden_flavor.2.f:0 "“自由主义之路立于农本主义。”"
 sweden_flavor.2.a:0 "农民正被组织起来"
 sweden_flavor.3.t:0 "自由贸易精神"
 sweden_flavor.3.d:0 "为了加强本国经济以对抗其他市场，瑞典已在全国实施了自由贸易改革，贸易壁垒因此大大降低。现在，商家正企图在竞争变得过于激烈之前迅速利用这一机会。"
 sweden_flavor.3.f:0 "“金钱在我们面前毫无节制地滚滚流动，理所当然。”"
 sweden_flavor.3.a:0 "这就是正确的决定。"
 sweden_flavor.4.t:0 "贸易保护精神"
 sweden_flavor.4.d:0 "为了削弱外国在经济中的影响力，贸易保护主义改革已经实施，人民无不称赞这次改革为前进的正确道路。它找到了一种国际贸易原本不会有的稳定性。"
 sweden_flavor.4.f:0 "“今天，通往伟大的道路已经开辟，瑞典迈出了前进的正确一步，确保了它的人民不会受剥削。”"
 sweden_flavor.4.a:0 "这就是正确的前进之路"
 sweden_flavor.5.t:0 "觉醒意识传播"
 sweden_flavor.5.d:0 "我们的民众每天都在越来越多地了解#yellow 农民#!的困境，这导致更多的人加入声援农民的处境。"
 sweden_flavor.5.f:0 "“如果我们连自己的#yellow 农民#!都不能养活，那国民经济有什么意义?如果连他们都没有足够的钱来过活，那谁将成为下一个？”"
 sweden_flavor.5.a:0 "我们拭目以待"
 sweden_flavor.6.t:0 "农民困境的普及"
 sweden_flavor.6.d:0 "有许多人似乎关心斯堪的纳维亚农民的困境，这包括了我们的人民，并对正在进行的选举产生了影响。"
 sweden_flavor.6.f:0 "同胞们！站在#yellow 斯堪的纳维亚#!的田野上，我们脚下的土地正在哭泣！百年来，贵族和地主用法律与锁链将我们世代耕作的土地据为己有，而真正的耕耘者——你们，我的兄弟姐妹——却被迫在破碎的田埂间乞求生存！\n\n#yellow 乡民党#!向你们承诺:我们不会让一个孩子因地主夺走口粮而饿死！我们不会让一个家庭因交不起“赎地金”而被赶出祖辈的茅屋！加入我们，夺回属于农民的权利，不为国王！不为资本家！只为让瑞典的麦穗再次在自由的土地上生长！"
 sweden_flavor.6.a:0 "另一场选举运动正在发生……"
 sweden_flavor.7.t: "瑞典工业的锻造"
sweden_flavor.7.d: "源于1822年修建#yellow 哥塔运河#! 的伟大任务，#gold 莫塔拉车间#! 已经远远超出了一个普通车间的范畴。它的工程师和工匠以其精准和创新而闻名，现在正准备成为我们国家工业的重要动脉。"
sweden_flavor.7.f: "莫塔拉的锤击声和蒸汽的嘶嘶声回荡在大地上，成为瑞典创新的强有力脉搏。"
sweden_flavor.7.a: "提升我们的工业实力！"

sweden_flavor.8.t: "玻璃王国的闪耀"
sweden_flavor.8.d: "在#yellow 斯莫兰#! 的深林中，古老的玻璃制造工艺正经历着一场显著的复兴。全球对从窗玻璃到精美装饰品的需求不断增加，这片地区的谦逊玻璃作坊，长期以来被称为#yellow '玻璃王国'#!，正准备迎接前所未有的增长。技艺精湛的工匠和富有企业家精神的人们看到了将沙子和火焰转化为闪亮财富的机会。"
sweden_flavor.8.f: "玻璃吹制工匠的管声和炉火的辉光预示着斯莫兰的繁荣，光线映照在新锻造的奇迹上。"
sweden_flavor.8.a: "自动化生产线！"

sweden_flavor.9.t: "松兹瓦尔的锯木厂轰鸣"
sweden_flavor.9.d: "沿着塞朗格河和#yellow 松兹瓦尔#! 湾的繁忙海岸，正形成一个新的工业中心。#yellow 松兹瓦尔#! 已迅速转变为#yellow 瑞典#! 巨大木材工业的无可争议中心，数十座蒸汽驱动的锯木厂处理着从#light_green 诺尔兰#! 无尽森林中漂浮下来的大量#gold '绿色黄金'#!。离开其码头的木材量推动着欧洲各地的工业，为该地区带来了巨大的财富和就业机会。"
sweden_flavor.9.f: "松兹瓦尔的空气中充满了工业的能量，弥漫着锯木屑的气息和从我们的森林中铸造的繁荣的承诺。"
sweden_flavor.9.a: "利用木材贸易！"

sweden_flavor.10.t: "芬兰解放！"
sweden_flavor.10.d: "在俄罗斯压迫的统治下经历了几代人之后，#yellow 芬兰#! 终于获得了自由！我们的旗帜再次飘扬在#yellow 赫尔辛基#! 上，并且更远，#red 东方熊#! 已被果断击退，其野心破灭。艰苦的斗争已经结束，我们的芬兰兄弟姐妹现在与他们的亲人团聚，他们的欢呼声在解放的土地上回响。"
sweden_flavor.10.f: "团聚的喜悦洗净了大地；我们勇敢的芬兰亲人终于回家了，回到了他们属于的地方。"
sweden_flavor.10.a: "拥抱我们解放的兄弟！"

sweden_flavor.11.t: "铸造未来的矿业"
sweden_flavor.11.d: "几个世纪以来，#yellow 伯格斯拉根#! 深矿和新发现的#yellow 马尔伯格#! 提供了构成#yellow 瑞典#! 工业脊梁的铁和铜。然而，随着世界的发展，对金属的需求更高数量和质量，我们的传统方法可能会落后。我们面临着一个关键的选择：大力投资于现代化这些古老的操作，还是冒着失去全球市场竞争力的风险？"
sweden_flavor.11.f: "唤醒瑞典自豪的心脏"
sweden_flavor.11.a: "启动国家现代化计划。"

sweden_flavor.12.t: "人民之家愿景"
sweden_flavor.12.d: "随着瑞典的快速现代化，一个深远的新愿景正获得越来越多的支持：#yellow 人民之家 – The People's Home#!。这个概念超越了单纯的政治言辞；它承诺建立一个以集体团结、强大的社会平等和共同福利为基础的社会。它承诺每个公民，无论其出身或地位如何，都将在安全中生活，并为公共利益做出有意义的贡献，创造一个真正团结和繁荣的国家。"
sweden_flavor.12.f: "一个真正公正和繁荣的社会的基础正在被奠定，一砖一瓦，由我们人民的集体意志和共同目标构建。"
sweden_flavor.12.a: "致力于建设人民之家！"

sweden_flavor.13.t: "遗产的最后会议"
sweden_flavor.13.d: "几个世纪以来，代表贵族、神职人员、市民和农民的议会一直是瑞典的议会。然而，在这个现代社会，植根于过去特权和固定社会秩序时代的陈旧结构已成为一个不可否认的障碍。废除死刑的呼声日益高涨，要求建立一个统一的现代立法机构，真正反映我们不断发展的国家的愿望和活力."
sweden_flavor.13.f: "随着瑞典准备迎接政治现代化和真正代表性的新黎明，一个过去的特权时代落下了太阳。"
sweden_flavor.13.a: "打造现代议会!"

sweden_flavor.14.t: "木材困境"
sweden_flavor.14.d: "整个欧洲对#yellow 木材#! 的需求持续飙升，我们辽阔的森林提供着似乎永无止境的供应。然而，我们新兴的工业阶层中有许多声音认为，仅仅出口原木留下了许多财富。他们设想着一个未来，#yellow 瑞典木材#! 在我们自己的土地上转化为成品，提供更多的工作岗位和更大的回报。"
sweden_flavor.14.f: "这些树木低语着潜力，但我们是仅仅砍伐它们，还是用它们的丰盈构建？"
sweden_flavor.14.a: "暂时专注于原木出口。"
sweden_flavor.14.b: "投资锯木厂和家具制造厂！"

sweden_flavor.16.t: "哥德堡：扩张中的大都市"
sweden_flavor.16.d: "位于我们西海岸战略位置的#yellow 哥德堡#! 长期以来一直是瑞典通往北海和更广阔的大西洋世界的重要纽带。随着工业化的推进，这座城市已经转变为一个繁忙的商业、造船中心，是无数瑞典人寻求新生活的出发地。然而，#yellow 哥德堡#! 的成功也使得其老旧的港口基础设施变得吃力。更大的蒸汽船需要更深的泊位和更长的码头，而货物和人员的流动要求扩展铁路连接和海关设施。投资其发展意味着巩固我们作为欧洲主要贸易大国的地位，并促进我们移民人口的梦想。"
sweden_flavor.16.f: "这座城市的运河曾回荡着荷兰语，现在其码头回响着全球化世界的喧嚣。"
sweden_flavor.16.a: "启动哥德堡港口扩建项目。"

sweden_flavor.17.t: "马尔默：工业铸就的城市"
sweden_flavor.17.d: "位于我们最南端的#yellow 马尔默#! 长期以来一直是瑞典与欧洲大陆之间的重要纽带。随着工业化的加剧，这座城市正在迅速从一个省城变成强大的工业引擎。其深水港口，现在通过南方干线与我们日益发展的铁路网连接，正成为贸易和重工业的不可或缺的中心，特别是在造船和工程领域。斯卡尼亚的肥沃农田为其工厂提供原料，其地理位置也为市场提供了无与伦比的接入。然而，这一快速增长要求在城市规划、基础设施和劳动力管理方面具有远见，以确保#yellow 马尔默#! 的繁荣得以持久。"
sweden_flavor.17.f: "波罗的海与大陆相遇的地方，瑞典工业的未来正在被铸就。"
sweden_flavor.17.a: "大力投资马尔默的工业和农田扩展。"


sweden_flavor.18.t: "首都的新面貌：斯德哥尔摩崛起"
sweden_flavor.18.d: "古老的#yellow 斯德哥尔摩#! 街道正让位于宏伟的大道和崭新的高楼大厦，随着我们的首都经历前所未有的增长和现代化。工程师和建筑师正在重新构想这座城市，计划改善基础设施，如先进的污水系统、公共交通和扩建住房以容纳不断增长的人口。这一雄心勃勃的城市转型承诺巩固#yellow 斯德哥尔摩#! 作为真正欧洲首都的地位，成为瑞典进步与繁荣的象征。然而，管理如此快速的发展也带来了重大挑战：确保每个人都有足够的住房，在高密度中保持公共卫生，并保护城市独特的历史特征。"
sweden_flavor.18.f: "从古老的加姆拉·斯坦街区到崭新的扩展区，斯德哥尔摩的每一块石板都在低语，讲述着这座城市不断重塑自己的故事。"
sweden_flavor.18.a: "投资首都的宏伟设计！"

sweden_flavor.19.t: "炸药突破"
sweden_flavor.19.d: "一位杰出的瑞典发明家#gold 阿尔弗雷德·诺贝尔#! 实现了一个具有突破性的成就：成功稳定了甘油炸药，发明了#yellow '炸药'#!。这一强大的新型爆炸物有望彻底改变采矿、建筑甚至战争，为破岩和塑造景观提供前所未有的效率。它对我们的工业和军事能力将产生深远的影响，推进进程的方式是前所未有的。"
sweden_flavor.19.f: "大地因新纪元的承诺而颤抖；瑞典的创新重新定义了挖掘与拆迁！"
sweden_flavor.19.a: "拥抱炸药革命！"

sweden_flavor.20.t: "工厂的轰鸣：莫塔拉罢工"
sweden_flavor.20.d: "#yellow 莫塔拉车间#!，瑞典工业力量的象征，已陷入停滞。工人们厌倦了漫长的工时、微薄的工资和不安全的工作条件，他们放下工具，要求进行根本性的改善。这场罢工，作为前所未有的组织化劳动展示，迅速获得了全国工业中心的支持。政府和工厂主如何回应，将为瑞典劳资关系的未来奠定先例。我们是平息异议，还是承认我们工业支柱的正当诉求？"
sweden_flavor.20.f: "锤击声已被不满的呼声所替代，工人阶级找到了自己的声音。"
sweden_flavor.20.a: "与罢工者谈判！"
sweden_flavor.20.b: "强力镇压罢工！"

sweden_flavor.21.t: "木材大亨的统治"
sweden_flavor.21.d: "随着#light_green 诺尔兰#! 木材行业的蓬勃发展，一股新的工业阶层——#gold '木材大亨'#! 的崛起已获得显著影响力。这些大亨常常收购广阔的森林，并围绕他们的锯木厂建立整个公司城镇，掌握着对经济和数千人生活的巨大影响力。他们高效、常常是专制的控制推动着前所未有的生产和财富，但他们的主导地位也引发了关于劳动条件、地方自治以及少数几个人集中权力的问题。"
sweden_flavor.21.f: "他们的工厂烟囱现在在北方的土地上投下长长的阴影，成为他们不可否认力量的象征。"
sweden_flavor.21.a: "承认他们不可或缺的作用！"

sweden_flavor.22.t: "清醒的呼唤：国家良知被唤醒"
sweden_flavor.22.d: "从讲道台到公共广场，一股强大的运动正在席卷整个#yellow 瑞典#!：倡导#yellow 节制#!。倡导者谴责酒精对家庭、生产力和道德的破坏影响，呼吁进行严格的管制，甚至是禁酒。这一道德运动在#light_green 农村居民#! 和虔诚教徒中尤为强烈，但也面临来自那些认为它侵犯个人自由或威胁国家税收的人的反对。国家面临着在社会改革和个人自由之间做出选择的难题。"
sweden_flavor.22.f: "一双清醒的眼睛注视着正在与恶习斗争的社会，寻求国家进步的道路。"
sweden_flavor.22.a: "拥抱节制事业！"
sweden_flavor.22.b: "维护个人自由！"

sweden_flavor.23.t: "信仰之火：莱萨尔运动复兴"
sweden_flavor.23.d: "一股#white 灵性热情#! 再次席卷#yellow 瑞典#! 部分地区，尤其是在#light_green 农村#! 和#blue 北部地区#!。#yellow 莱萨尔（读者）#! 运动，强调个人虔诚、直接解读经文和信徒传道，正在经历显著的复兴。这一复兴的宗教热情挑战了#white 国教会#! 的既定权威，并可能导致新自由教会的成立或对道德价值观的更多关注。虽然它可能加强虔诚信徒，但也可能在社区内部引发摩擦，并对宗教自由与国家对信仰的控制提出问题。"
sweden_flavor.23.f: "神的话语在信徒的心中燃烧，照亮了超越既定秩序的道路。"
sweden_flavor.23.a: "允许运动蓬勃发展！"
sweden_flavor.23.b: "支持国教会的权威！"

sweden_flavor.24.t: "盛大展览：斯德哥尔摩博览会"
sweden_flavor.24.d: "为备受期待的#yellow 斯德哥尔摩博览会#! 做准备工作正如火如荼地进行中。这个历史性的事件将把#light_green 迪尤尔加登#! 变成瑞典工业实力、艺术成就和技术进步的壮丽展示。工厂将展示他们最新的机械，艺术家们将展示他们最精美的作品，创新者们将展示他们的突破性发明。除了激发国内的自豪感，博览会还为吸引外国投资、刺激贸易并提升瑞典作为现代进步国家的国际地位提供了一个关键平台。全世界都在关注瑞典能为世界带来什么。"
sweden_flavor.24.f: "宏伟的展馆拔地而起，机械的嗡嗡声和艺术的鲜艳色彩充斥其中，回响着国家对进步和雄心的骄傲宣言。"
sweden_flavor.24.a: "向世界敞开大门！"


 sweden_flavor.25.t: "火柴国度：瑞典火柴行业的主导地位"
sweden_flavor.25.d: "从不起眼的小作坊到广阔的工厂，#yellow 瑞典火柴行业#! 正经历前所未有的繁荣。凭借创新的生产方法、卓越的安全标准（尤其是“安全火柴”发明）和积极的企业家精神，瑞典火柴正迅速赢得全球声誉，质量与可靠性无可比拟。像#yellow 约恩雪平#! #gold 火柴厂#! 这样的公司正在领军这一潮流，他们的产品点燃了跨洲市场。这一成功承诺显著推动轻工业发展，创造大量就业机会，并提高瑞典的出口收入，巩固我们作为一个创新国度的声誉。"
sweden_flavor.25.f: "天才的火花点燃了工业之火，将瑞典的创新扩展到全世界。"
sweden_flavor.25.a: "利用我们的优势！"

sweden_flavor.26.t: "教区学校法令：全民教育"
sweden_flavor.26.d: "瑞典一直以相对较高的识字率为傲，但教育常常不一致，且局限于私人资源。如今，瑞典国会通过了具有开创性的教区学校法令，规定每个教区必须建立和维护一所小学。这部基础性法律标志着瑞典对普及教育的承诺，确保每个孩子，无论社会地位如何，都可以接受基本教育。"
sweden_flavor.26.f: "学校铃声响彻大地，召唤每个瑞典孩子走上求知之路。"
sweden_flavor.26.a: "执行法令！"

sweden_flavor.27.t: "行会法令：释放商业"
sweden_flavor.27.d: "数百年来，行会体系一直在规范行业并保护工匠，但它日益成为工业发展和自由竞争的障碍。经过数十年的辩论和自由经济思想家的压力，行会法令终于出台，实质上废除了行会垄断，向所有公民开放了行业。"
sweden_flavor.27.f: "古老特权的枷锁被打破，释放了自由企业的巨大力量。"
sweden_flavor.27.a: "废除行会！"

sweden_flavor.28.t: "贫困法：福利中心化"
sweden_flavor.28.d: "为了解决工业化社会日益严重的贫困和流浪问题，瑞典通过了一项新的贫困法。这项改革旨在标准化和中心化福利工作，将责任从单个教区转移到更广泛的市政或县级政府，并引入更为结构化的救助形式，通常包括为有劳动能力者提供的工舍。虽然目的是使贫困救助更高效、更少随意，但..."
sweden_flavor.28.f: "国家之手提供援助，但也有坚定的控制与监督。"
sweden_flavor.28.a: "实施贫困法！"
sweden_flavor.28.b: "饿死他们！"

sweden_flavor.29.t: "自由贸易与工业法：经济自由化"
sweden_flavor.29.d: "随着行会的废除，瑞典迈出了经济自由化的又一决定性步伐——通过了自由贸易与工业法。这项法律取消了设立和经营企业的大部分剩余限制，为更大的竞争、创新和经济流动性创造了条件。这是自由市场经济的基石，吸引投资并促进工业增长。然而，它也意味着更小的企业和工匠将面临更大的竞争压力，保护力度减弱。"
sweden_flavor.29.f: "经济自由的风暴席卷全境，为无限的企业创造了前所未有的空间。"
sweden_flavor.29.a: "完全自由化贸易！"

sweden_flavor.30.t: "市政改革：地方自治"
sweden_flavor.30.d: "为了更好地管理地方事务并赋予区域社区更多权力，瑞典实施了市政改革。这项全面的法律赋予市镇（kommuner）更大的自治权，允许它们独立于中央政府进行地方税收、公共服务和基础设施建设。"
sweden_flavor.30.f: "权力从中央流向地方，允许社区塑造自己的命运。"
sweden_flavor.30.a: "加强地方自治！"
sweden_flavor.30.b: "你们不配得到权力！"

sweden_flavor.31.t: "工会合法化：工人权利"
sweden_flavor.31.d: "经过数十年的非正式组织和常常充满争议的工业纠纷，瑞典国会终于在1889年通过了法律，正式合法化工会。此举为工人们提供了组建和加入工会的权利，进行集体谈判，并进行和平罢工而不受法律制裁。这是无产阶级和新兴劳动运动的一次重大胜利，为他们在工作条件和工资方面提供了强有力的发言权，尽管它无疑会增加工业雇主的压力，并改变职场中的权力结构。"
sweden_flavor.31.f: "曾经孤立的工人声音，如今在法律保障下汇成了集体的呼声。"
sweden_flavor.31.a: "承认工人权利！"

sweden_flavor.32.t: "养老金法：社会保障的先锋"
sweden_flavor.32.d: "瑞典实施了养老金法，这项开创性的立法建立了国家养老金制度，为老年人提供财政支持，不论其以前的收入或社会地位如何。这一进步步骤旨在减轻老年贫困并为所有公民提供晚年的安全保障。尽管它为社会福利树立了新的标准，但也需要大量持续的政府资金，并标志着政府对公民福祉责任的大幅扩展。"
sweden_flavor.32.f: "尊严的承诺在晚年闪亮登场，成为一个充满同情与前瞻性的国家的灯塔。"
sweden_flavor.32.a: "实施全国养老金！"

sweden_flavor.33.t: "女性选举法：完全的政治平等"
sweden_flavor.33.d: "在女性选举权运动不懈努力数十年后，在自由党和社会民主党的支持下，瑞典国会终于通过了全面的立法，赋予女性普遍选举权。这一具有历史意义的法案确立了男女完全的政治平等，允许所有成年女性公民投票并参选。它标志着瑞典政治格局的深刻变革，使选民人数翻倍，并为治理带来新视角，巩固瑞典作为民主权利领先国家的地位。"
sweden_flavor.33.f: "选票欢迎每一个人，半个国家的声音终于在民主中找到了应有的位置。"
sweden_flavor.33.a: "实施女性普遍选举权！"

sweden_flavor.34.t: "罢工与封锁法：工人的新权力"
sweden_flavor.34.d: "在工会合法化的基础上，瑞典国会通过了一项具有重大意义的法律，正式承认工人罢工权和雇主封锁权。这项法律为工业争议提供了法律框架，承认罢工和封锁是劳动关系中合法的工具。它赋予了劳动和资本在法律框架下的权力，有助于建立一个更加稳定但有时也充满波动的工业格局。"
sweden_flavor.34.f: "工业力量的天平发生倾斜，劳动与资本的权利在法律下得到了平衡。"
sweden_flavor.34.a: "法定罢工与封锁权！"

sweden_flavor.35.t: "'Folkskola'修订：深化教育"
sweden_flavor.35.d: "在教区学校法令的基础上，瑞典进一步深化了'Folkskola'（公立小学系统）的改革。这些修订引入了更长的学年、更广泛的课程和更好的教师培训，旨在为所有孩子提供更全面、更公平的教育。这一持续的人力资本投资对国家的竞争力和社会流动性至关重要，为我们的时代培养了一支高技能、适应性强的劳动力。"
sweden_flavor.35.f: "知识的源泉愈加深邃，滋养着每个瑞典孩子更深刻的智慧。"
sweden_flavor.35.a: "为未来而奋斗"

sweden_flavor.36.t: "桑德维尔火灾：城市重生"
sweden_flavor.36.d: "1888年7月的一个炙热的日子，灾难降临到桑德维尔，这座繁忙的木材之都。火花在强风中蔓延，点燃了城市大部分木质建筑，导致一场毁灭性的火灾几乎吞噬了所有建筑。这场火灾的轰鸣声和无家可归者的呼喊将这座繁荣的城市几乎瞬间变成了一片废墟。如今，在毁灭中，重建的任务刻不容缓：机会来了，可以建设一座现代化的‘石头城’，用砖和石头建设更宽阔的街道，采用耐火材料，确保桑德维尔从灰烬中崛起，更加坚固和安全。"
sweden_flavor.36.f: "烟雾或许仍然弥漫，但从焦土中，重建桑德维尔的蓝图已经绘就。"
sweden_flavor.36.a: "开始重建石城！"

sweden_flavor.37.t: "东部重归"
sweden_flavor.37.d: "由1721年尼斯塔德条约开启的失落篇章，终于画上句号。曾经是梦寐以求的东部领土，如今已变为触手可及的现实。在我们的军队决定性的行动下，这片区域已经得到保障，我们的行政人员正努力将这些至关重要的省份顺利融入瑞典的版图。几代人的渴望得以实现，我们在波罗的海东岸的正当强势重现。"
sweden_flavor.37.f: "波罗的海不再将我们与应有之地分开；它如今将我们与一个新的未来联系在一起。"
sweden_flavor.37.a: "东部的新曙光！"

sweden_flavor.38.t: "瑞典智慧工业：工程卓越的崛起"
sweden_flavor.38.d: "在我们锯木厂的轰鸣声和铁冶炼厂的叮当声之外，一个更为细腻但极为强大的工业革命正在悄然形成。#yellow 瑞典的‘智慧工业’#!，由像#yellow 爱立信#!、#yellow 德拉瓦尔#!、#yellow SKF#!、#yellow ASEA#!等杰出人物所引领。这些#white 创新者#!不仅仅是在开发#light_green 原材料#!，他们在设计和制造#blue 复杂机械#!、#blue 先进电气设备#!、#blue 精密仪器#!和#blue 专业工具#!，这些产品已成为全球工业的关键。这种向知识密集型生产的转变标志着瑞典的新篇章，承诺带来巨大的价值创造、高技能就业机会，并树立瑞典在全球工程质量上的无与伦比的声誉。"
sweden_flavor.38.f: "从宁静的工坊到繁忙的实验室，发明家们的嗡嗡声和齿轮的精密运作预示着一个新的时代，瑞典的创新精神将引领未来。"
sweden_flavor.38.a: "倡导我们的工业创新者！"


 denmark_flavor.1.t:0 "我们国家的失败"
 denmark_flavor.1.d:0 "斯堪尼亚、挪威和石勒苏益格-荷尔斯泰因的损失给丹麦的身份认同带来了沉重的打击，现在人们看到所有的领土损失，想要回头审视自己， 现在应该怎么做？就看政府了。"
 denmark_flavor.1.f:0 "“丹麦人意味着什么？意味着可以一次次地被羞辱吗？”"
 denmark_flavor.1.a:0 "让我们专注眼前"
 denmark_flavor.1.b:0 "复仇！！"
 denmark_flavor.2.t:0 "统一荷尔斯泰因"
 denmark_flavor.2.d:0 "荷尔斯泰因和丹麦政府之间的分歧已经慢慢得到解决，现在我们的人民必须在一个中央统治下团结起来。事实证明，这会大大加强了丹麦的国家认同！"
 denmark_flavor.2.f:0 "“携手并进，面对未来！”"
 denmark_flavor.2.a:0 "我们成功了"
 denmark_flavor.3.t:0 "荷尔斯泰因与政府之间的紧张关系"
 denmark_flavor.3.d:0 "一如往常，我们的政府正在起草新法律，但荷尔斯泰因的贵族却插手进来，试图进行破坏。如果我们容忍这一行为，那么不久后，我们的合法性将会遇到危机。"
 denmark_flavor.3.f:0 "“贵族的权利需要得到捍卫！”"
 denmark_flavor.3.a:0 "我们必须容忍"
 denmark_flavor.3.b:0 "无视他们"
 denmark_flavor.4.t:0 "弗雷德里克六世去世"
 denmark_flavor.4.d:0 "在前无古人地统治丹麦55年有余后，弗雷德里克六世于阿美琳堡宫去世。随后他被安葬在了弗雷德里克五世在罗斯基勒大教堂的礼拜堂内。由于他没有存世的继承人接替王位（只有两个女儿），丹麦的王位继承给了他的同父异母的表弟克里斯蒂安，此人因在挪威短暂独立期间短暂统治挪威而闻名。"
 denmark_flavor.4.f:0 "“只有我们才能判断什么对国家和人民最好。”——弗雷德里克六世"
 denmark_flavor.4.a:0 "人民之泪为今日而流"
 norway_flavor.1.t:0 "地区委员会法案"
 norway_flavor.1.d:0 "挪威议会通过了一项法案，该法案将建立一个市政系统，并将挪威教会的教区重组为行政区域。预计一旦完成，它将建立超过390个地方自治区。"
 norway_flavor.1.f:0 "“农民已发声，我们厌倦了城市的暴君！”"
 norway_flavor.1.a:0 "离现代民主又进一步"
 norway_flavor.2.t:0 "大变革"
 norway_flavor.2.d:0 "工业化在挪威的作用愈发明显，我们越来越多的人口正在进入工厂，离开农田。这迫使我们的农民采取新方式以弥补劳动力的缺失。\n这个转变尤为突然，但总的来说，这强化了我们的经济，因此还得到了“大变革”(Det store hamskiftet)的绰号。"
 norway_flavor.2.f:0 "“挪威已经证明了自己有能力以任何可以想象的方式实现现代化；总有一天，全世界都会羡慕我们的文化、社会和经济。”"
 norway_flavor.2.a:0 "继续前进！"
 norway_flavor.2.b:0 "农民需要援助"
 norway_flavor.3.t:0 "挪威商船队"
 norway_flavor.3.d:0 "通过大量地投资海军，挪威得以从一个古老的农业国转变为一个以大商船而闻名世界的国家。在许多情况下，发生在国外的贸易都可以追溯到我国。"
 norway_flavor.3.f:0 "“我们有了挪威的新骄傲，我们的海军将因其为挪威所做的贡献和在世界各地的贸易而载入史册！”"
 norway_flavor.3.a:0 "我们大步向前！"
 norway_flavor.4.t:"贵族的回归"
 norway_flavor.4.d:"随着挪威法律越来越有利于土地所有者，有人请愿废除一些禁止建立新贵族头衔的旧法律。随着法律的废除，贵族再次成为挪威需要重新征服的力量."
 norway_flavor.4.f:""荣耀属于我们的过去，过去我们忘记了，但永远不会忘记！""
 norway_flavor.4.a:"我们骄傲地后退了一步!"
 finland_flavor.100.t:0 "语言纷争"
 finland_flavor.100.d:0 "几代人以来，瑞典语一直是芬兰人的口语，行政和教育一直使用瑞典语，即使在芬兰大公国建立后，行政仍然使用瑞典语。\n然而，最近一场主张将芬兰语推广为国家语言的运动正在制造声势……反对声浪越来越大。"
 finland_flavor.100.f:0 "“我们祖先的语言不仅仅是农民的语言，它是我们应该引以为豪的语言。”"
 finland_flavor.100.a:0 "这不是好事"
 finland_flavor.1.t:0 "语言纷争解决"
 finland_flavor.1.d:0 "看来瑞典民众和芬兰人之间的紧张关系正在慢慢得到解决，这一切都得益于 ...."
 finland_flavor.1.f:0 "\"我们将自豪地说自己的语言，无论是公开的还是私下的。现在没有人可以对我们的语言指指点点！"
 finland_flavor.1.a:0 "我们成功了！"
 finland_flavor.2.t:0 "语言纷争未解决"
 finland_flavor.2.d:0 "尽管我们的政府做出最大的努力，但芬兰语仍然是一种未被普遍使用的语言，更多的人已经回归瑞典语怀抱。许多支持用我们自己的语言取代瑞典语的运动的人认为这是浪费时间，并将自己与政府对立起来。\n\n唯一赞同这一行动的是我国的学术界人士。"
 finland_flavor.2.f:0 "“太浪费时间了，以前的为何要改呢”"
 finland_flavor.2.a:0 "太糟糕了"
 finland_flavor.3.t:0 "瑞典-芬兰局势"
 finland_flavor.3.d:0 "瑞典精英们拒绝用非瑞典语对话，这严重阻碍了我们民众的日常生活。这个问题甚至已经在一些瑞典民众的日常对话中扎根，他们现在以 \"不理解 \"为由拒绝为我们的民众提供服务，而我们的人民应该迁就他们？！"
 finland_flavor.3.f:0 "“抱歉，我听不懂！”"
 finland_flavor.3.a:0 "惩罚瑞典人"
 finland_flavor.3.b:0 "忽略这些"
 finland_flavor.4.t:0 "学术问题"
 finland_flavor.4.d:0 "我们的学者们大部分在用瑞典语教学，这确实保证了我们的语言在全国范围内的使用，但在这过程中也放慢了教学进度。"
 finland_flavor.4.f:0 "“瑞典语在芬兰学术界已经使用多年了，现在不用改了吧？”"
 finland_flavor.4.a:0 "我们语言与社会共同进步！"
 finland_flavor.4.b:0 "无视这些"
 finland_flavor.5.t:0 "瑞典破坏俄罗斯权威"
 finland_flavor.5.d:0 "越来越多的瑞典运动试图破坏俄罗斯对芬兰的权威，这一切都是为了 \"捍卫遗产\"。\n这引起了相当大的轰动，现在政府被迫介入，然而很明显，一些芬兰民众对瑞典人的支持似乎源于对俄罗斯人的仇恨或恐惧。"
 finland_flavor.5.f:0 "\"俄罗斯人渣正在破坏芬兰人的含义！！\"\n\n\"作为瑞典人并不是我所说的芬兰人。\"\n\"你收回那句话，你这个野蛮人！\""
 finland_flavor.5.a:0 "瑞典被时代抛弃"
 finland_flavor.5.b:0 "俄罗斯人不是我们的朋友"
 finland_flavor.6.t:0 "芬兰官方语言"
 finland_flavor.6.d:0 "俄罗斯沙皇裁定，芬兰语具有与瑞典语相当的官方语言地位；因此它可以在法律和国家事务中以官方身份使用。"
 finland_flavor.6.f:0 "“我听说沙皇一生中为我们做了一件好事”"
 finland_flavor.6.a:0 "向前迈进"
 finland_flavor.7.t:0 "瑞典人愤怒"
 finland_flavor.7.d:0 "瑞典的老牌精英们对他们认为的放弃任何形式的北欧统一和传统的做法感到愤怒，要求我们在使芬兰成为主要语言方面的改革有所松动。"
 finland_flavor.7.f:0 "\"瑞典和芬兰一直有着密切的历史，这应该被记住！\"\n\n\"我们是他们的臣民，受到了不公平的待遇，你这个蠢货！\""
 finland_flavor.7.a:0 "我们的遗产不是瑞典的!"
 finland_flavor.7.b:0 "传统是重要的"
 denmark_national_humiliation:0 "国耻"
 denmark_national_humiliation_desc:0 "丹麦大量富庶地区的沦陷是我们不能忘记的国耻。"
 denmark_focus_on_agriculture:0 "鼓励农业"
 denmark_revanchism_modifier:0 "丹麦复仇主义"
 denmark_unification_time:0 "丹麦统一主义"
 sweden_outdated_military:0 "陈腐的军事思想"

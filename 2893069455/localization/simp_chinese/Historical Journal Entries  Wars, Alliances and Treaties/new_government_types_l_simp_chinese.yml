l_simp_chinese:
 gov_kingdom_anl:0 "安达卢西亚君主国"
 gov_kingdom_anl_desc:2 "安达卢西亚的 [concept_government_type|l]诞生自塞维利亚、科尔多瓦、哈恩和格拉纳达四个王国的联合。[concept_head_of_state|l]由[Concept('concept_ruler','$RULER_TITLE_KING$')|l]或[Concept('concept_ruler','$RULER_TITLE_QUEEN$')|l]担任。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_absolute_anl:0 "安达卢西亚王冠领地"
 gov_absolute_anl_desc:2 "在这种[concept_government_type|l]下，塞维利亚、科尔多瓦、哈恩和格拉纳达的 [Concept('concept_ruler','$RULER_TITLE_KING$')|l] 或 [Concept('concept_ruler','$RULER_TITLE_QUEEN$')|l] 直接统治安达卢西亚联合王国。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_val_catholic_theocracy:0 "修道骑士团"
 gov_val_catholic_theocracy_desc:2 "在这种[concept_government_type|l]下，官僚机构由一个宗教组织管理。[Concept('concept_ruler','$RULER_GRAN_MESTRE$')]兼任[concept_head_of_state|l]。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 RULER_GRAN_MESTRE:0 "大团长"
 gov_gib_absolute_county:0 "专制公国"
 gov_gib_absolute_county_desc:2 "在这种[concept_government_type|l]下，[Concept('concept_ruler','$RULER_TITLE_PRINCE$')|l]或[Concept('concept_ruler','$RULER_TITLE_PRINCESS$')|l]的权力高于一切。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_gib_county:0 "公国"
 gov_gib_county_desc:2 "在这种[concept_government_type|l]下，[Concept('concept_ruler','$RULER_TITLE_PRINCE$')|l]或[Concept('concept_ruler','$RULER_TITLE_PRINCESS$')|l]是[concept_head_of_state|l]。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_gib_constitutional_county:0 "立宪公国"
 gov_gib_constitutional_county_desc:2 "这种[concept_government_type|l]下，[Concept('concept_ruler','$RULER_TITLE_PRINCE$')|l]或[Concept('concept_ruler','$RULER_TITLE_PRINCESS$')|l]是[concept_head_of_state|l]， 但[Concept('concept_votes','suffrage')]和宪法决定了[Concept('concept_law','leyes')]。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gibraltarian_identity_decision:0 "直布罗陀身份问题"
 gibraltarian_identity_decision_desc:0 "虽然直布罗陀几十年来一直欢迎所有民族，但我们继承了来自英国的歧视性公民法。也许是时候改变我们的政策了。"
 gibraltar.1.t:0 "直布罗陀身份问题"
 gibraltar.1.d:0 "岩石区的热那亚人、葡萄牙人、犹太人以及梅诺卡人均要求获得公民权。"
 gibraltar.1.f:0 "几十年来，直布罗陀在民族问题上一直以包容政策为核心，誓要将直布罗陀打造成一个的民族熔炉。然而，我们继承了一个来自英国的歧视性法律制度。人们要求我们对此做出改变。"
 gibraltar.1.a:0 "这只是一种形式"
 gibraltar.1.b:0 "是的！是时候结束这种包容了。"

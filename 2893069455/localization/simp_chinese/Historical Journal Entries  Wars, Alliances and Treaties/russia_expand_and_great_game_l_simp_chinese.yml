 russia_expand.1.t:0 "在中亚的地位"
 russia_expand.1.d:0 "最近对哈萨克人的镇压导致通往中亚的大门敞开了。然而我们并不是唯一对该地区感兴趣的国家。"
 russia_expand.1.f:0 ""
 russia_expand.1.a:0 "我们将继续向南"
 russia_expand.2.t:0 "印度的边境"
 russia_expand.2.d:0 "我们伟大的国家现在在中亚占据主导地位！只有英国和中国挡在我们前进的道路上！"
 russia_expand.2.f:0 ""
 russia_expand.2.a:0 "我们将在中国拥有新的土地！"

 russia_expand.4.t:0 "来自俄罗斯的威胁"
 russia_expand.4.d:0 "俄罗斯最近开始向中亚和远东迅速扩张，我们必须确保我们在印度和中国的地位不受威胁。尽管俄罗斯人现在构成的威胁不大，但我们恐怕很快将与他们兵戎相见。"
 russia_expand.4.f:0 " "
 russia_expand.4.a:0 "我们必须谨慎"
 russia_expand.5.t:0 "来自俄罗斯的威胁"
 russia_expand.5.d:0 "沙俄帝国最近巩固在中亚和东亚的地位，而我们有可能属于他们未来的扩张之路的目标。战争很快就会降临，而在它真的到来之前，我们必须做好准备！"
 russia_expand.5.f:0 " "
 russia_expand.5.a:0 "我们必须谨慎"


 russia_expand.8.t:0 "#yellow 日本#!大博弈胜负已分"
 russia_expand.8.d:0 "#yellow 俄国人#!已经成功地扩大了在日本地区的势力范围，现在他们是该地区的主导力量。"
 russia_expand.8.f:0 "日本乃帝国东进太平洋之锁钥。#yellow 英格兰人#!正以贸易与舰队渗透其列岛，妄图将日本化为遏制我们获取不冻港的藩篱。若符拉迪沃斯托克不能稳固，帝国舰队将永困于冰封之地，而#yellow 英格兰#!将独霸中国海权。所幸陛下英明，吾等已将日本海变为帝国内海，令双头鹰之翼覆盖远东，尽彰显我等国威！"
 russia_expand.8.a:0 "为了[Concept('concept_ruler','$RULER_TITLE_TSAR$')]！"
 russia_expand.9.t:0 "#yellow 日本#!大博弈胜负已分"
 russia_expand.9.d:0 "#yellow 大英帝国#!成功地击退了不断扩张的#yellow 俄国人#!，并将#yellow 日本#!纳入帝国势力范围的一部分。"
 russia_expand.9.f:0 "#yellow 俄国人#!妄图寻求在太平洋更多的不冻港，其在东亚建立霸权的野心不言而喻。吾等在陛下的指挥下，已使#yellow 日本#!成为抵御其扩张的堡垒，印度洋和西太平洋的航线安全已得到保障。"
 russia_expand.9.a:0 "上帝保佑吾王! "
 russia_expand.10.t:0 "#yellow 中国#!大博弈胜负已分"
 russia_expand.10.d:0 "#yellow 俄国人#!已经成功地扩大了在#yellow 中华地区#!的势力范围，现在他们是该地区的主导力量。"
 russia_expand.10.f:0 "双头鹰旗帜不仅插在符拉迪沃斯托克，随着日本海的狂风肆意飘扬，而且还插向了满洲和蒙古地区的许多城市。无数的煤炭等矿产，从满洲和蒙古铁路线开往莫斯科。#yellow 圣彼得堡#!的意志已然直达亚洲的心脏。"
 russia_expand.10.a:0 "为了[Concept('concept_ruler','$RULER_TITLE_TSAR$')]！"
 russia_expand.11.t:0 "#yellow 中国#!大博弈胜负已分"
 russia_expand.11.d:0 "#yellow 大英帝国#!成功地击退了不断扩张的#yellow 俄国人#!，并将#yellow 中华地区#!纳入自己势力范围的一部分。"
 russia_expand.11.f:0 "随着香港、威海等地的开埠，#yellow 英格兰人#!利用海关控制、铁路贷款和传教士网络编织着无形的帝国。当#yellow 俄罗斯#!用哥萨克马蹄丈量土地时，聪明的#yellow 英格兰人#!早已通过银元与契约让四万万消费者成为维多利亚时代工厂的附庸。"
 russia_expand.11.a:0 "常胜利，沐荣光！扬神威，张天网！"
 russia_expand.12.t:0 "#yellow 印度#!大博弈胜负已分"
 russia_expand.12.d:0 "俄罗斯帝国已经成功地扩大了在#yellow 印度#!地区的势力范围，现在他们是该地区的主导力量。"
 russia_expand.12.f:0 "赫拉特——这座“印度之门”的城墙上，插上了双头鹰的旗帜，切断了#yellow 英格兰人#!从卡拉奇到加尔各答的陆上通道。即便我们永不真正踏入恒河，仅让双头鹰的阴影笼罩德里，就足以逼迫#yellow 英格兰人#!在黑海海峡和波斯问题上向帝国低头！"
 russia_expand.12.a:0 "为了[Concept('concept_ruler','$RULER_TITLE_TSAR$')]！"
 russia_expand.13.t:0 "#yellow 印度#!大博弈胜负已分"
 russia_expand.13.d:0 "#yellow 大英帝国#!成功地击退了不断扩张的#yellow 俄国人#!，并宣称整个#yellow 印度地区#!是其势力范围的一部分。"
 russia_expand.13.f:0 "当#yellow 俄国人#!还在幻想将“三个王冠之地”纳入版图，即#yellow 君士坦丁堡#!、#yellow 德里#!和#yellow 北京#!，我们已用铁路网、电报线和《盐税法案》将这片#yellow 印度次大陆#!锻造成维多利亚时代最锋利的权杖！"
 russia_expand.13.a:0 "但有主恩众详，泽披万方！"
 russia_expand.14.t:0 "#yellow 波斯#!大博弈胜负已分"
 russia_expand.14.d:0 "俄罗斯帝国已经成功地扩大了在#yellow 波斯#!地区的势力范围，现在他们是该地区的主导力量。"
 russia_expand.14.f:0 "突厥斯坦已在我们手中，曾经气焰嚣张的#yellow 波斯#!也臣服于我们脚下。沙阿被迫从高加索势力范围退出，卑微地请求我们不要再出兵攻打他。他那没骨气的卑贱样子，就像他那阉人的祖先一样。在呼罗珊的东方，我们哥萨克骑兵的刀锋，如今也随时可以砍在这群印度奴隶的头上。#yellow 伦敦当局#!必须在地中海做出让步，否则我们的马刀将向南边的#yellow 印度#!砍去，夺走这些傲慢的#yellow 英格兰人#!最自豪的王冠明珠。"
 russia_expand.14.a:0 "为了[Concept('concept_ruler','$RULER_TITLE_TSAR$')]！"
 russia_expand.15.t:0 "#yellow 波斯#!大博弈胜负已分"
 russia_expand.15.d:0 "#yellow 大英帝国#!成功地击退了不断扩张的#yellow 俄国人#!，并将#yellow 波斯#!纳入自己势力范围的一部分。"
 russia_expand.15.f:0 "#yellow 英波电报协定#!和#yellow 路透特许权#!将金融触角植入恺加王朝的血管，#yellow 波斯南部#!俨然成为英格兰人作威作福的天堂。#yellow 烟草专卖权#!和#yellow 军火贷款#!更是如同两道锁链，紧紧拴住德黑兰的沙阿，不得不向来自伦敦的外交官低下头颅。即便#yellow 俄国人#!吞下北方十省，真正的财富与航路仍将属于维多利亚的荣光。联合王国的旗帜继续在波斯湾上迎风飘扬，骄傲地彰显#yellow 日不落帝国#!那如雄狮般强大的力量。"
 russia_expand.15.a:0 "不列颠需捍卫，吾母、君主、汝友，天佑国王！"
 russia_expand.16.t:0 "#yellow 土耳其#!大博弈胜负已分"
 russia_expand.16.d:0 "俄罗斯帝国已经成功地扩大了在#yellow 土耳其#!地区的势力范围，现在他们是该地区的主导力量。"
 russia_expand.16.f:0 "狡猾的#yellow 英格兰人#!妄图在埃及铺设苏伊士运河时，我们伟大的陛下已将#yellow 土耳其#!纳为附庸。曾经不可一世的#yellow 突厥人#!如今被上帝断去脊梁，宛若丧家之犬。而陛下所过之处，东正同胞无不雀跃欢呼。黑海的小麦，高加索的石油，全部纳入帝国的疆域，构筑起一道足以对抗#yellow 英格兰人#!的钢铁堤坝！"
 russia_expand.16.a:0 "为了[Concept('concept_ruler','$RULER_TITLE_TSAR$')]！"
 russia_expand.17.t:0 "#yellow 土耳其#!大博弈胜负已分"
 russia_expand.17.d:0 "#yellow 大英帝国#!成功地击退了不断扩张的#yellow 俄国人#!，并将#yellow 土耳其#!纳入自己势力范围的一部分。"
 russia_expand.17.f:0 "#yellow 英格兰人#!在奥斯曼的国债管理局，牢牢掌握土耳其财政命脉，无知的#yellow 土耳其人#!只能不断贷款还之前所欠的债务利息。软弱的苏丹被迫继续交出铁路特许权，将食盐专营税、渔业税、丝绸十一税、印花税、宗教税和几个行省的财政收入都用于偿还债务。充满智慧的#yellow 英格兰人#!，已然将#yellow 君士坦丁堡#!变成守护其地中海和苏伊士运河航线的青铜大门。"
 russia_expand.17.a:0 "让我们齐仰望，神佑吾王！"